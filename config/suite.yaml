suite_version: suite-v2.0.0-shakedown   # re-declared suite-v2.0.0 at P8 freeze tag
condition_order: [runtime, spec, kv, ctx, cond, conc]
condition_vocab:
  runtime: [fork, ollama, vllm]
  spec: [ngram32, off]
  kv: [f16, q8, q4]
  cond: [PEAK, SUSTAINED32K, B1, B4, SELFTEST]
  conc: [1, 2, 4, 8, 16, 32, 64, 128]
n_runs_judged: 3
n_runs_harness: 2
b1:
  n_runs: 3
  # ctx raised 16384->32768 (P3 Task 12 finding): reasoning models need room for
  # hidden thinking + a full answer; long-class output budget is now 16000, which
  # will not fit alongside the prompt inside 16k. 32k gives headroom. kv=q8 keeps
  # the KV cache small enough for the 24GB box on A3B/MoE roster models.
  ctx: 32768
  # cohort_models (optional partial-roster knob): when present, judging
  # cohort-completeness (llmtest/judging/runner.py resolve_cohort_models) requires
  # exactly that model set instead of the full non-quant-arm roster -- lets a
  # partial-roster wave (e.g. the P3 Task 12 quota dry-run) form complete,
  # judgeable cohorts before every roster model has a B1 row. CLEARED at P3 exit
  # (Task 13) -> full non-quant-arm roster is the default again for the P8 baseline.
  # Re-add for future partial-roster judging waves.
  # Raised ~4-6x (P3 Task 12 finding, Michael approved 2026-07-17): the old
  # 900/1600/2600 ladder was sized for non-reasoning completions. Every modern
  # reasoning model (gpt-oss, qwen3.6, gemma-4, ...) burned 100% of the budget on
  # hidden thinking (predicted_n==max_tokens on ALL empty rows) and emitted
  # empty/truncated answers -> scores measured truncation, not quality. New ladder
  # gives think+answer headroom. Paired with ctx: 32768 above.
  max_tokens_by_class: {short: 4000, standard: 8000, long: 16000}
  units_tier1: [coding, it_infra, cybersecurity, marketing, seo, sales, outreach,
                finance, operations, helpdesk, knowledge_mgmt, legal_compliance,
                data_analytics, project_mgmt, hr_people_ops]
  industries: [life_sciences, oil_gas_energy, legal, financial_services, aec, manufacturing_ag, healthcare_compliance, generic_smb, public_sector, msp_internal]
b4:
  # TESTPLAN 5.4: 256k target, 128k floor. n_runs=1 -- long-context prefill is the
  # dominant cost (§8.1: "1.5-2h/model, dominated by prefill"); N>=3 belongs to judged
  # tasks (§4), not deterministic needle-retrieval checks.
  n_runs: 1
  # 16k/64k/128k/256k. Tiers beyond a model's claimed_ctx are dropped for that model
  # (not run at all) UNLESS every configured tier exceeds claimed_ctx, in which case
  # the model's own max rides as a single row instead of zero rows for that model
  # (TESTPLAN 5.4: "tested at their max ... tagged fits-short-context, not skipped").
  ctx_tiers: [16384, 65536, 131072, 262144]
  # Headroom subtracted from the requested ctx before padding the document, so the
  # instructions + planted needles + question + generation budget all still fit
  # inside the endpoint's context window.
  reserve_tokens: 1024
  max_tokens: 300
  # CAPABILITY sweep (TESTPLAN 5.4 "Capability" bullet): every non-quant-arm roster
  # model gets this single kv arm across its claimed_ctx-filtered ctx tiers, pruned
  # to arms that physically fit on T1 (b4_longcontext._arm_fits_estimate) -- this is
  # what keeps the full-roster grid from planning launches that would never boot.
  standard_kv: q8
  # KV-QUANT QUALITY sweep (TESTPLAN 5.4 "KV-quant quality cost" bullet): the
  # designated model(s) get the FULL kv_sweep across claimed_ctx-filtered tiers,
  # NOT physically-fit-pruned -- infeasible arms still get PLANNED (trusting
  # TESTPLAN's explicit intent to empirically discover the boundary) but are tagged
  # fits-short-context as an advisory rather than silently dropped.
  kv_sweep: [f16, q8, q4]
  kv_sweep_models: [qwen3.6-35b-a3b]
  # TESTPLAN 5.4 full-attention spot-check: "qwen3.6-27b-dense (32k, f16-vs-q4, NIAH
  # slice, ~15 min) -- the primary model's ~75%-linear attention makes it the LEAST
  # KV-quant-sensitive architecture on the roster; the q8 standard must not be
  # generalized from the easy case." Named point rides through unfiltered (same as
  # kv_sweep_models) even though the physical-fit estimate predicts the f16 arm is
  # tight on T1 (~25.7 GB vs 23.5 GB usable) -- flagged fits-short-context, not pruned.
  kv_spot_check:
    model: qwen3.6-27b-dense
    ctx_tiers: [32768]
    kv_sweep: [f16, q4]
