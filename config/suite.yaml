suite_version: suite-v2.0.0-shakedown   # re-declared suite-v2.0.0 at P8 freeze tag
condition_order: [runtime, spec, kv, ctx, cond, conc]
condition_vocab:
  runtime: [fork, ollama, vllm]
  spec: [ngram32, off]
  kv: [f16, q8, q4]
  cond: [PEAK, SUSTAINED32K, B1, SELFTEST]
  conc: [1, 2, 4, 8, 16, 32, 64, 128]
n_runs_judged: 3
n_runs_harness: 2
b1:
  n_runs: 3
  ctx: 16384
  # DRY-RUN KNOB (P3 Task 12): when present, judging cohort-completeness checks
  # (llmtest/judging/runner.py resolve_cohort_models) require exactly this
  # model set instead of the full non-quant-arm roster -- lets a partial-roster
  # slice (here: the quota dry-run) produce complete, judgeable cohorts without
  # every roster model needing a B1 row yet. Cleared at P3 exit (Task 13) once
  # the full roster is the default again. See docs/plans/2026-07-16-p3-b1-judging.md
  # Task 12 self-review note 5 (this doubles as the mechanism for future
  # partial-roster judging waves).
  cohort_models: [gpt-oss-20b, qwen3.6-35b-a3b, gemma-4-26b-a4b]
  max_tokens_by_class: {short: 900, standard: 1600, long: 2600}
  units_tier1: [coding, it_infra, cybersecurity, marketing, seo, sales, outreach,
                finance, operations, helpdesk, knowledge_mgmt, legal_compliance,
                data_analytics, project_mgmt, hr_people_ops]
  industries: [life_sciences, oil_gas_energy, legal, financial_services, aec, manufacturing_ag, healthcare_compliance, generic_smb, public_sector, msp_internal]
