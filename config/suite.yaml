# v2.2.0 = the hardware-consistency generation (2026-08-03). Every row produced from
# here on lands in rows-suite-v2.2.0.jsonl with fresh row_ids, superseding the
# wrong-hardware v2.1.0 cells listed in config/superseded.yaml per llmtest/rowselect's
# latest-version-wins rule. Bumping the version (rather than deleting rows) is Michael's
# chosen supersede mechanism: the store stays append-only.
suite_version: suite-v2.2.0
# ^ v2.1.0 boundary (codex review I-5, 2026-07-20): B8 + B2-judged-axes are the
# NEW work and mint under suite-v2.1.0 -> a SEPARATE rows-suite-v2.1.0.jsonl shard.
# The frozen B1-B7 + B2-deterministic data stays in rows-suite-v2.0.0.jsonl and is
# imported BY REFERENCE (p8_report KNOWN_SUITE_VERSIONS reads both, labels source_suite).
# Was suite-v2.0.0 (would have contaminated the frozen shard on the first B8 run).
# B8 additive keys (harness, task, attempt_id, execution_provenance_sha)
# appended at the END -- canonical_condition (schema.py) only emits keys
# present in a given battery's own parts dict, so B1-B7's condition strings
# (whose parts never contain these four keys) are byte-identical whether
# these keys exist here or not. See llmtest/batteries/b8_harness.py module
# docstring for the full row-identity rationale (task-7-brief.md).
condition_order: [runtime, spec, kv, ctx, cond, conc, sysp, temp, toolfmt,
                  harness, task, attempt_id, execution_provenance_sha]
condition_vocab:
  runtime: [fork, ollama, vllm]
  spec: [ngram32, off]
  kv: [f16, q8, q4]
  cond: [PEAK, SUSTAINED32K, B1, B2, B3, B4, B6, B7, B8, SELFTEST]
  conc: [1, 2, 4, 8, 16, 32, 64, 128]
  # B7 harness/config-matrix dimensions (see b7: block below + b7-report.md
  # for the interpretation note -- TESTPLAN 5.7 names an external-harness
  # axis reserved for P6; sysp/temp/toolfmt are this ticket's buildable
  # substitute axis, reusing cond=B7 as the battery marker).
  sysp: [default, minimal]
  temp: [t0, tdef]
  toolfmt: [native, prompted]
  # B8 harness axis -- OpenCode only today (Task 4); Hermes/WSL2 and a
  # LiteLLM-fronted Claude Code land later (see b7-report.md's P6 note).
  # `task`/`attempt_id`/`execution_provenance_sha` are NOT enumerated here
  # (unlike the small closed vocab above) -- they're open-ended identifiers
  # (a task id, a uuid/session id, a sha256 hex digest), the same reason
  # task_id itself never appears in condition_vocab for any other battery.
  harness: [opencode]
n_runs_judged: 3
n_runs_harness: 2
b1:
  n_runs: 3
  # cohort_models CLEARED after each incremental wave (full non-quant-arm roster
  # is the default again). Re-add [<model>, ...] for the next one -- but those
  # judgments then need CAL-RESCALING onto the frozen scale, because a small
  # packet is a more lenient instrument. Do NOT reuse a previous wave's
  # correction: the anchors move with packet width, measured on the same
  # statistic model_overall uses --
  #     3 letters  CAL-strong 8.74  CAL-weak 1.36
  #     4 letters  CAL-strong 8.47  CAL-weak 1.31
  #    18 letters  CAL-strong 7.62  CAL-weak 0.89   <- the frozen scale
  # (The "9.0/1.5 vs 8.0/1.0" figures this comment used to quote were rounded
  # prose describing the 3-letter wave only.) Per-judge leniency is consistent in
  # direction across all three seats; gemini's is the largest at +2.29.
  # scripts/b1_rescale.py does the whole correction: --verify gates on
  # reproducing laguna's published number, --width N --emit-python prints the
  # dashboard blocks.
  # ctx raised 16384->32768 (P3 Task 12 finding): reasoning models need room for
  # hidden thinking + a full answer; long-class output budget is now 16000, which
  # will not fit alongside the prompt inside 16k. 32k gives headroom. kv=q8 keeps
  # the KV cache small enough for the 24GB box on A3B/MoE roster models.
  ctx: 32768
  # cohort_models (optional partial-roster knob): when present, judging
  # cohort-completeness (llmtest/judging/runner.py resolve_cohort_models) requires
  # exactly that model set instead of the full non-quant-arm roster -- lets a
  # partial-roster wave (e.g. the P3 Task 12 quota dry-run) form complete,
  # judgeable cohorts before every roster model has a B1 row. CLEARED at P3 exit
  # (Task 13) -> full non-quant-arm roster is the default again for the P8 baseline.
  # Re-add for future partial-roster judging waves.
  # RE-ADDED 2026-08-07 for the abliterated wave [abl-gemma-4-31b,
  # abl-opus-35b-a3b], then CLEARED AGAIN 2026-08-08 once that wave shipped
  # (published 6.0 and 5.3, rescaled from raw 6.69/5.96). Leaving a spent cohort
  # in place is the dangerous state: the next wave would mint packets for the
  # WRONG models and still look like it succeeded.
  #
  # The next incremental wave is abl-qwen3.6-27b and qwen3.6-27b-fable-fusion.
  # Both were deliberately excluded from the abliterated wave because they have
  # ZERO B1 generation rows -- including a model with no answers skips every
  # cohort as incomplete. GENERATE their B1 rows on a PRO 6000 first, then set
  # cohort_models to exactly those two and judge.
  #
  # Sizing note: the cohort's letter count must differ from the frozen 18 so
  # packet_ids cannot collide and nothing already judged is re-judged.
  #
  # SET 2026-08-10 for qwen3.6-27b-fable-fusion, whose 360 B1 answers were
  # generated on the PRO 6000 but never scored. abl-qwen3.6-27b is deliberately
  # absent: its B1 generations came back empty (see the gaps entry), so including
  # it would ask the panel to score nothing at all.
  cohort_models: [qwen3.6-27b-fable-fusion]
  # Raised ~4-6x (P3 Task 12 finding, Michael approved 2026-07-17): the old
  # 900/1600/2600 ladder was sized for non-reasoning completions. Every modern
  # reasoning model (gpt-oss, qwen3.6, gemma-4, ...) burned 100% of the budget on
  # hidden thinking (predicted_n==max_tokens on ALL empty rows) and emitted
  # empty/truncated answers -> scores measured truncation, not quality. New ladder
  # gives think+answer headroom. Paired with ctx: 32768 above.
  max_tokens_by_class: {short: 4000, standard: 8000, long: 16000}
  units_tier1: [coding, it_infra, cybersecurity, marketing, seo, sales, outreach,
                finance, operations, helpdesk, knowledge_mgmt, legal_compliance,
                data_analytics, project_mgmt, hr_people_ops]
  industries: [life_sciences, oil_gas_energy, legal, financial_services, aec, manufacturing_ag, healthcare_compliance, generic_smb, public_sector, msp_internal]
b2:
  n_runs: 3
  # 40960, not b1's 32768: axis-7's long-context task deliberately targets
  # 32k+ tokens of filler HISTORY, which needs headroom left over for the
  # tool schemas + final prompt + response inside the same context window
  # (condition label "40k" mirrors this, distinct from b1's "32k").
  ctx: 40960
  # Tool-calling responses are typically short (a JSON call or two, maybe a
  # brief follow-up sentence) -- much smaller than B1's prose budgets.
  max_tokens: 2000
  # Documents the canonical TESTPLAN 5.2 axis numbering that
  # llmtest/batteries/b2_fixtures.py's det_checks keys ("axisN_...") and
  # needs_judging routing use. Not consumed by code -- reference only.
  axes: {1: schema_adherence, 2: tool_selection, 3: parallel_calls,
         4: chained_calls, 5: error_recovery, 6: abstention,
         7: long_context_call, 8: faithfulness}
  judged_axes: [5, 8]
  # Cohort quorum for the AXIS-5/8 JUDGED packets (spec 1.6 / P1-T7): a
  # packet scores once >= this many roster models are present, rather than
  # requiring the full roster like B1's cohorts -- missing members are
  # recorded on the map (missing_models), never a silently smaller
  # anonymous rebuild. Default = today's full non-quant-arm roster count
  # (16 models -- same set llmtest/judging/runner.py::resolve_cohort_models
  # returns), i.e. this default preserves run_pending's pre-knob strict
  # behavior (it used to hardcode b2_quorum=len(cohort_models)). Treat this
  # as a FLOOR: lower it for a partial-roster judging wave (mirrors
  # b1.cohort_models); llmtest/judging/runner.py::run_pending's b2_quorum
  # param defaults to len(cohort_models) whenever this key is absent.
  quorum: 16
b3:
  n_runs: 3
  # Shares B1's ctx (headroom for reasoning-model hidden thinking before the
  # answer, same P3 Task 12 lesson) so the ServerManager can config-match
  # reuse an already-running B1 endpoint (TESTPLAN 7.3).
  ctx: 32768
  # Hedge/refuse answers are short; a hallucinating model that plays along
  # with a false premise or drafts a fabricated-artifact walkthrough can run
  # long — "standard" covers that without inflating every trivial control
  # task's budget.
  max_tokens_by_class: {short: 1500, standard: 3000, long: 5000}
  # Controlled vocabulary for fixture 'category' (validate_cmd lint + preflight
  # per-category selftest rows). closed_domain_control is the anti-gaming
  # check: a real, knowable fact, so an always-refuse model doesn't look
  # perfectly calibrated.
  categories: [closed_domain_control, abstention_unanswerable, false_premise,
               fabricated_citation, fabricated_package, fabricated_endpoint,
               multi_turn_consistency]
  industries: [life_sciences, oil_gas_energy, legal, financial_services, aec, manufacturing_ag, healthcare_compliance, generic_smb, public_sector, msp_internal]
b4:
  # TESTPLAN 5.4: 256k target, 128k floor. n_runs=1 -- long-context prefill is the
  # dominant cost (§8.1: "1.5-2h/model, dominated by prefill"); N>=3 belongs to judged
  # tasks (§4), not deterministic needle-retrieval checks.
  n_runs: 1
  # 16k/64k/128k/256k. Tiers beyond a model's claimed_ctx are dropped for that model
  # (not run at all) UNLESS every configured tier exceeds claimed_ctx, in which case
  # the model's own max rides as a single row instead of zero rows for that model
  # (TESTPLAN 5.4: "tested at their max ... tagged fits-short-context, not skipped").
  ctx_tiers: [16384, 65536, 131072, 262144]
  # Headroom subtracted from the requested ctx before padding the document, so the
  # instructions + planted needles + question + generation budget all still fit
  # inside the endpoint's context window.
  reserve_tokens: 1024
  max_tokens: 300
  # CAPABILITY sweep (TESTPLAN 5.4 "Capability" bullet): every non-quant-arm roster
  # model gets this single kv arm across its claimed_ctx-filtered ctx tiers, pruned
  # to arms that physically fit on T1 (b4_longcontext._arm_fits_estimate) -- this is
  # what keeps the full-roster grid from planning launches that would never boot.
  standard_kv: q8
  # KV-QUANT QUALITY sweep (TESTPLAN 5.4 "KV-quant quality cost" bullet): the
  # designated model(s) get the FULL kv_sweep across claimed_ctx-filtered tiers,
  # NOT physically-fit-pruned -- infeasible arms still get PLANNED (trusting
  # TESTPLAN's explicit intent to empirically discover the boundary) but are tagged
  # fits-short-context as an advisory rather than silently dropped.
  kv_sweep: [f16, q8, q4]
  kv_sweep_models: [qwen3.6-35b-a3b]
  # TESTPLAN 5.4 full-attention spot-check: "qwen3.6-27b-dense (32k, f16-vs-q4, NIAH
  # slice, ~15 min) -- the primary model's ~75%-linear attention makes it the LEAST
  # KV-quant-sensitive architecture on the roster; the q8 standard must not be
  # generalized from the easy case." Named point rides through unfiltered (same as
  # kv_sweep_models) even though the physical-fit estimate predicts the f16 arm is
  # tight on T1 (~25.7 GB vs 23.5 GB usable) -- flagged fits-short-context, not pruned.
  kv_spot_check:
    model: qwen3.6-27b-dense
    ctx_tiers: [32768]
    kv_sweep: [f16, q4]
b6:
  n_runs: 3
  # ctx/token sizing follows the same P3 Task 12 lesson as b1 (§ above): reasoning
  # models burn output budget on hidden thinking before ever emitting the fenced
  # code block, so headroom is generous rather than tight. ctx_label is the
  # condition-string token (matches b1's "32k" pattern); ctx is the actual
  # request_endpoint() context length.
  ctx: 32768
  ctx_label: "32k"
  # scratch tasks (full program/CLI) get more budget than bugfix tasks (one
  # corrected file/snippet, usually smaller than a from-scratch build).
  max_tokens_by_track: {scratch: 12000, bugfix: 9000}   # raised (P8): reasoning models truncated at 6000/4000 (38 empty rows, all predicted_n==max_tokens)
b7:
  # TESTPLAN 5.7 reproducibility line: "N>=2 for harness cells (B7)".
  n_runs: 2
  ctx: 8192
  max_tokens: 6000   # raised from 900 (P8): reasoning models burned 900 on hidden thinking (228 empty rows); 6000 fits per-slot 8192 with a short probe
  # signal_agreement_vs_baseline pass threshold (fraction of shared
  # content-signal pass/fail results that must match the baseline cell's
  # result for the variant cell to count as "not degraded").
  agreement_threshold: 0.8
  probes_dir: suite/b7_harnessmatrix/probes
  # Harness/config sensitivity matrix: ONE-FACTOR-AT-A-TIME from a fixed
  # "baseline" reference cell (TESTPLAN 5.7 Control: "harness is the only
  # variable" -- extended here to config knobs, isolating each dimension's
  # individual effect rather than a full factorial cross). Battery code
  # (llmtest/batteries/b7_harnessmatrix.py::_matrix_cells) reads this block
  # generically: baseline cell + one variant cell per non-baseline value per
  # dimension. Adding a dimension or a 3rd value here grows the matrix
  # without code changes.
  matrix:
    dimensions:
      sysp:
        values: [default, minimal]
        baseline: default
      temp:
        values: [t0, tdef]
        baseline: t0
      toolfmt:
        values: [native, prompted]
        baseline: native
      spec:
        # "off" MUST be quoted -- YAML 1.1 boolean-literal folding (PyYAML
        # default resolver) turns a bare `off` into Python False, silently
        # breaking canonical_condition (same gotcha B5 avoids by hardcoding
        # the string "off" in Python rather than sourcing it from YAML).
        values: [ngram32, "off"]
        baseline: ngram32
b8:
  # Real-harness battery (Part 2 Phase 2): OpenCode (Task 4) driving models
  # through the suite/b8_harness/task-*.yaml manifests, scored by the
  # anti-gaming completion oracle (llmtest.harness.tasks.run_oracle), not
  # static content signals. `models` is a deliberately SMALL subset (not
  # the full non-quant-arm roster B1/B6/B7 use) -- each replicate is a
  # real, possibly slow, external-process harness run against a live
  # endpoint. Grow this list once the OpenCode/Hermes/LiteLLM-CC pipeline
  # has been live-smoked against more of the roster.
  # 2 models (Wave 5): both VERIFIED to drive OpenCode end-to-end locally.
  # gpt-oss-20b (harmony tool format) + gemma-4-26b-a4b-mxfp4 (clean OpenAI
  # tool_calls). Qwen3-Coder is deliberately NOT here -- it emits `<function=>`
  # text OpenCode can't parse (codex "adapter-unqualified until proven"); that
  # is a legitimate end-to-end tool-format compatibility failure, not a
  # capability result, so it is excluded rather than scored as 0.
  models: [gpt-oss-20b, gemma-4-26b-a4b-mxfp4]
  harnesses: [opencode]
  # `tasks` (additive, task-b8expand): when non-empty, B8Harness.plan()
  # crosses ONLY these task ids (matched against B8Task.id, e.g.
  # "py-bugfix-01" -- not the "b8."-prefixed row task_id) instead of every
  # manifest under suite/b8_harness/. Empty/absent falls back to every
  # loaded task (pre-task-b8expand behavior, unchanged).
  #
  # Set (task-b8hard) to the 5 HARDER Python task ids -- the original 6
  # real Python tasks (py-bugfix-01/py-fromscratch-01/py-edit-01/
  # py-multifile-01/py-toolheavy-01/py-fromscratch-02, task-06..11.yaml)
  # are all solved 30/30 by gpt-oss-20b and don't discriminate; a live run
  # now targets the 5 harder manifests (task-12..16.yaml, ids `py-hard-*`)
  # instead, so the completion metric actually spreads and the
  # first-failure classifier gets real task-logic failures to classify.
  # The original 6 (and the 5 bash placeholders, task-01..05.yaml) are
  # left in place, not deleted -- still loaded by load_b8_tasks and
  # covered by their own tests -- just excluded from the run by this
  # allowlist. Swap this list (or add the old 6 ids back in) to re-target
  # a future run at the easier tasks too.
  # Task FORMS (Wave 4, codex/kimi strategy -- SEALED dev vs confirmatory):
  #  - `tasks` (DEV form, 23): what plan() runs. Half of each of the 6 breadth
  #    categories (root-cause/cross-module/feature/stateful/build-mig/robust --
  #    first 3 ids each = 18) + the 5 hard originals. Used to VALIDATE the
  #    instrument and calibrate difficulty; tuning/debugging happens HERE.
  #  - `tasks_confirmatory` (18, SEALED): the other half of each breadth
  #    category. NOT read by plan(); reserved for the eventual multi-model
  #    ranking so tuning against dev tasks can't contaminate the leaderboard
  #    (codex "benchmark contamination" threat -- any task used to debug B8 is
  #    burned from this holdout).
  #  - `tasks_anchor` (6, low weight): the original easy Python tasks
  #    (gpt-oss-20b solves 30/30) -- regression + easy-anchor items only.
  tasks: [py-brk-01, py-brk-02, py-brk-03,
          py-xmod-01, py-xmod-02, py-xmod-03,
          py-feat-01, py-feat-02, py-feat-03,
          py-state-01, py-state-02, py-state-03,
          py-build-01, py-build-02, py-build-03,
          py-robust-01, py-robust-02, py-robust-03,
          py-hard-bugfix-01, py-hard-algo-01, py-hard-edge-01,
          py-hard-multifile-01, py-hard-toolheavy-01]
  tasks_confirmatory: [py-brk-04, py-brk-05, py-brk-06,
          py-xmod-04, py-xmod-05, py-xmod-06,
          py-feat-04, py-feat-05, py-feat-06,
          py-state-04, py-state-05, py-state-06,
          py-build-04, py-build-05, py-build-06,
          py-robust-04, py-robust-05, py-robust-06]
  tasks_anchor: [py-bugfix-01, py-edit-01, py-fromscratch-01,
          py-fromscratch-02, py-multifile-01, py-toolheavy-01]
  # Target is >=5 per (model, harness, task) cell (spec ss2.8, real Wilson
  # intervals need N>=5) -- physical harness runs are noisy (real
  # subprocess, real timing, real tool-call variance); replicate_n is the
  # LOGICAL repeat axis (rides in run_n), orthogonal to attempt_id (the
  # PHYSICAL-execution axis, rides in condition) -- see b8_harness.py.
  # Was TEMPORARILY lowered to 3 (task-b8local, first real local
  # validation run against a manually-served endpoint via
  # scripts/run_b8_local.py); raised back to the >=5 spec target
  # (task-b8expand) now that the OpenCode/gpt-oss-20b pipeline has been
  # confirmed stable end-to-end (recent run: 8/9 on the 3 original real
  # Python tasks).
  replicates: 5
  # 40960, not b1's 32768: OpenCode's own headless run needs max_tokens
  # 32000 of response headroom on top of the rendered prompt + tool
  # schemas -- b1's 32768 doesn't leave enough room (task-b8local).
  ctx: 40960
  kv: q8_0
  # Per-run budgets `b8_harness.execute()` ENFORCES (Wave 1a, B8
  # measurement-validity -- codex/kimi strategy review: completion scoring
  # is only COMPARABLE across models if every credited completion stayed
  # within the same resource budget; a model that solves in 5 steps and one
  # that stumbles for 200 steps and gets lucky must not score the same).
  # wall_clock_s is plumbed straight into the adapter's own subprocess
  # timeout (OpenCodeAdapter's `wall_clock_s` constructor arg overrides its
  # per-task budgets.wall_clock_s fallback) -- unchanged, already enforced
  # pre-Wave-1a.
  #
  # `tokens` is a COMPLETION-token budget -- compared against
  # `Trace.tokens_completion` (the model's own generated work: answer text
  # + tool-call args + reasoning), NEVER against `tokens_prompt` and never
  # prompt+completion combined. This is deliberate, not an oversight:
  # OpenCode's own fixed system prompt + tool schemas alone push
  # `tokens_prompt` to roughly 13k on EVERY run, regardless of task or
  # model -- a TOTAL-token budget of 4000 (the old value) would fail every
  # single run before the model ever got a chance to do anything. 8000
  # completion tokens gives real headroom for a full multi-step solve while
  # still being a hard ceiling a model that loops or rambles can blow
  # through. `steps` (agent turns) stays 20 -- real gpt-oss-20b runs on the
  # original 6 easy tasks used 2-7 steps, so 20 is generous headroom, not a
  # tight cap.
  #
  # NATIVE step-limit config (investigated via Context7 against the real
  # anomalyco/opencode source, packages/web/src/content/docs/agents.mdx +
  # packages/opencode/src/agent/agent.ts): OpenCode DOES support a native
  # per-agent `steps` cap in opencode.json (`{"agent": {"<name>": {"steps":
  # N}}}`), overridable even for a BUILT-IN agent by reusing its name as
  # the key -- `opencode run` with no `--agent` flag uses the built-in
  # "build" agent, so `{"agent": {"build": {"steps": N}}}` targets it.
  # `OpenCodeAdapter` now ALSO sets this from this same `steps` value
  # (`max_steps` ctor arg, wired from `_DEFAULT_HARNESS_FACTORIES` below)
  # for real mid-run enforcement, on top of (not instead of) the post-hoc
  # check in `b8_harness.execute()` -- the native cap is a SOFT nudge (on
  # hitting it, the agent is asked to summarize its work and stop, not
  # hard-killed), and OpenCode has no native equivalent at all for a
  # completion-token budget, so the post-hoc check remains the real
  # backstop for both dimensions.
  budgets:
    wall_clock_s: 180
    tokens: 8000
    steps: 20
  # CONTAINMENT seam (Wave 2, B8 validity program -- see b8_harness.py
  # module docstring's CONTAINMENT note + llmtest.harness.opencode's own
  # module docstring for the full container design). `enabled: true`
  # (the default as of Wave 2): OpenCode runs INSIDE a disposable
  # `image` container (non-root, read-only rootfs, resource-capped, no
  # host env/creds, endpoint reached only via host.docker.internal,
  # webfetch denied) instead of a HOST subprocess -- `_DEFAULT_HARNESS_
  # FACTORIES["opencode"]` (b8_harness.py) threads this whole block into
  # `OpenCodeAdapter`'s constructor. `enabled: false` keeps the ORIGINAL
  # host-subprocess path (pre-Wave-2 behavior, byte-for-byte) -- flip
  # back to this only if `image` is ever unavailable on a given box.
  sandbox:
    enabled: true
    # b8-sandbox:1 (local-only, no pull): node v20.20.2 + python3 3.11.2
    # + opencode 1.2.15 on PATH, non-root user "node" (uid 1000) -- the
    # Node-capable image the OLD SANDBOX SEAM note (host-execution
    # deferral) was waiting on. Distinct from config/runtime_pins.yaml's
    # `sandbox:` block (nvidia/cuda:...-base) -- that pin is for
    # `llmtest.harness.sandbox.Sandbox`'s anti-gaming oracle container
    # (`run_oracle`'s hidden_validate), a completely different concern
    # from the agent's own OpenCode execution environment here.
    image: "b8-sandbox:1"
    # b8_harness.py execute() threads this into llmtest.harness.tasks.
    # run_oracle's oracle_image param -- overrides the pinned
    # nvidia/cuda:...-base image (no Python) for the OWN oracle container
    # only, so a Python-shaped B8 manifest's oracle_test.py can actually run
    # (python3 + bash both present in python:3.11-slim; task-b8local).
    oracle_image: "python:3.11-slim"
    # Resource caps for the OpenCode container itself (mirrors
    # llmtest.harness.sandbox.Sandbox's own --cpus/--memory/--pids-limit
    # conventions) -- 4g (not Sandbox's 2g default) because a real
    # multi-step opencode+bun agent loop is heavier than the oracle's
    # one-shot command.
    cpus: 2.0
    memory: "4g"
    pids_limit: 512
