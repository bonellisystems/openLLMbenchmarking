judges:
  claude:
    model: claude-fable-5
    fallback_model: claude-opus-4-8
    cli: claude
    cli_version: 2.1.212
    delivery: stdin
    invoke: claude -p --model {model} --output-format json
    # API/Batch delivery was built and measured on 2026-08-06, then REJECTED by
    # Michael: re-judging 12 full-roster packets through /v1/messages under this
    # same pin scored -0.24pt lower on average (CAL-strong 8.56 vs 8.78, CAL-weak
    # 0.78 vs 1.22, 3/12 replies unparseable). Small but systematic, and the frozen
    # 16-model scorecard was judged on this CLI path - mixing the two would put a
    # delivery confound inside one scorecard. Evidence kept in
    # llmtest/judging/batch_api.py; switching would require re-judging the WHOLE
    # roster, not just new models.
    verified: '2026-07-18 reverted to fable-5 (Michael - Fable allotment only 41% used;
      earlier exhaustion was a transient window). p8_judge auto-falls-back to
      claude-opus-4-8 per-call if a fable call fails both attempts; the failing
      packet''s judge_model_pin then records opus, so provenance stays honest.'
    notes: 're-pinned 2026-07-17 claude-fable-5 -> claude-opus-4-8 (AMENDMENT): Michael''s
      Fable-5 quota exhausted mid-dry-run; Opus 4.8 is an upgrade in judge quality.
      Heavy per-call floor observed (~37k cache-creation tokens/call, ~$0.37 on a
      trivial probe) -> claude is now the costliest judge seat; factor into baseline
      cost. Packets NOT re-minted (rubric_sha independent of judge model); only
      judge_model_pin provenance changes. Partial claude-fable-5 dry-run judgments
      discarded and re-judged under opus for a single-pin cost measurement.'
  codex:
    model: gpt-5.6-sol
    cli: codex
    cli_version: 0.144.5
    delivery: stdin
    invoke: codex exec -m {model}
    verified: 2026-07-17 live ping OK (6.8k tokens incl reasoning)
    notes: reasoning effort comes from user ~/.codex/config.toml model_reasoning_effort=ultra
      (valid for sol-class; PART OF THE PIN). CLI updated 0.137.0->0.144.5 to support
      it.
  gemini:
    model: Gemini 3.1 Pro (High)
    cli: C:\Users\Michael\AppData\Local\agy\bin\agy.exe
    cli_version: agy 1.1.3 (AntiGravity CLI, binary 2026-07-17)
    delivery: file
    invoke: '{cli} --print {instruction} --model {model} --add-dir D:\BUILT-TOOLS\LLMtesting\llmtest-v2\artifacts\packets'
    verified: 2026-07-17 headless file-read via --add-dir verified (probe round-trip)
    notes: gemini-cli DEPRECATED per Michael -> AntiGravity (agy). --print does NOT
      pass stdin to the model and argv caps at 32k chars, so packets are delivered
      as a file path inside the instruction; --add-dir grants workspace-scoped headless
      read of the packets dir ONLY. No skip-permissions flags.
kin_map:
  gpt-oss-20b: codex
  gemma-4-26b-a4b: gemini
  gemma-4-26b-a4b-mxfp4: gemini
frozen: '2026-07-17 per G1/G3 (Michael): pins signed off; panel ready. AMENDMENT
  2026-07-17: claude seat re-pinned claude-fable-5 -> claude-opus-4-8 (Fable quota
  exhausted); Michael approved. codex + gemini pins unchanged.'
