# Cells whose existing measurements do NOT meet the hardware requirement and are
# therefore WITHDRAWN from every aggregation (dashboard, tables, report, explorer)
# until rows at or above replacement_version exist for the cell.
#
# This file is the committed record of Michael's 2026-08-03 decision: one consistent
# metric, RTX PRO 6000 (Blackwell), no other card accepted. Rows are NOT deleted -
# the store is append-only and the supersede mechanism is a suite-version bump
# (suite-v2.2.0); consumers apply 'latest version wins per (model, battery)' via
# llmtest/rowselect.py, and this file forces cells to read 'not run' in the interim.
#
# n_expected is load-bearing: consumers assert each rule matches exactly that many
# rows and fail loudly on drift. Counts were MEASURED at generation time.
#
# Evidence: hardware-provenance audit 2026-08-03 (sessions.jsonl join + worker-prefix
# + ledger timeline). Verification queries: scope_freeze.py (session scratchpad).

schema_version: 1
hardware_requirement: "RTX PRO 6000 (Blackwell), one model per card"
declared: 2026-08-03
replacement_version: suite-v2.2.0

