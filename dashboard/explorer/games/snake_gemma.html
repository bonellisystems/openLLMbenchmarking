<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --canvas-color: #16213e;
            --snake-color: #4ecca3;
            --food-color: #e94560;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        .game-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            background-color: var(--canvas-color);
            display: block;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #score { color: var(--snake-color); }
        #highScore { color: var(--food-color); }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background-color: var(--snake-color);
            border: none;
            border-radius: 5px;
            color: var(--bg-color);
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background-color: #45b393;
        }

        h1 { margin-top: 0; }
        p { margin-bottom: 20px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="highScore">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Start/Game Over Overlay -->
        <div id="overlay" class="overlay">
            <h1 id="statusTitle">SNAKE</h1>
            <p id="statusMsg">Use Arrow Keys to move</p>
            <button onclick="startGame()">START GAME</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const overlay = document.getElementById("overlay");
        const statusTitle = document.getElementById("statusTitle");
        const statusMsg = document.getElementById("statusMsg");

        // Game Constants
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game Variables
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        highScoreElement.innerText = highScore;

        let snake = [];
        let food = { x: 10, y: 10 };
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let gameSpeed = 100;
        let gameLoopTimeout;

        // Initialize Game State
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            score = 0;
            scoreElement.innerText = score;
            dx = 0;
            dy = -1; // Start moving up
            nextDx = 0;
            nextDy = -1;
            placeFood();
        }

        function startGame() {
            overlay.classList.add("hidden");
            initGame();
            main();
        }

        function gameOver() {
            statusTitle.innerText = "GAME OVER";
            statusMsg.innerText = `Final Score: ${score}`;
            overlay.classList.remove("hidden");
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem("snakeHighScore", highScore);
                highScoreElement.innerText = highScore;
            }
        }

        // The Main Loop
        function main() {
            if (didGameEnd()) {
                gameOver();
                return;
            }

            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, gameSpeed);
        }

        // Logic Functions
        function clearCanvas() {
            ctx.fillStyle = "#16213e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Optional: Draw subtle grid lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is a different color
                ctx.fillStyle = (index === 0) ? "#4ecca3" : "#45b393";
                ctx.strokeStyle = "#16213e";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function advanceSnake() {
            // Update direction from input buffer to prevent 180-degree turns in one frame
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const didEatFood = snake[0].x === food.x && snake[0].y === food.y;
            if (didEatFood) {
                score += 10;
                scoreElement.innerText = score;
                placeFood();
                // Increase speed slightly as you eat
                if(gameSpeed > 50) gameSpeed -= 1; 
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            const head = snake[0];
            // Hit walls
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x > tileCount - 1;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y > tileCount - 1;

            // Hit self
            let hitSelf = false;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    hitSelf = true;
                    break;
                }
            }

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall || hitSelf;
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Make sure food doesn't spawn on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) placeFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#e94560";
            ctx.strokeStyle = "#1a1a2e";
            // Draw a slightly rounded square for food
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // Input Handling
        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) { nextDx = -1; nextDy = 0; }
            if (keyPressed === UP_KEY && !goingDown) { nextDx = 0; nextDy = -1; }
            if (keyPressed === RIGHT_KEY && !goingLeft) { nextDx = 1; nextDy = 0; }
            if (keyPressed === DOWN_KEY && !goingUp) { nextDx = 0; nextDy = 1; }
        }

        document.addEventListener("keydown", changeDirection);

    </script>
</body>
</html>
