<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game – One‑File Demo</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; }
  canvas { background:#222; display:block; border:2px solid #555; }
  #score { position:absolute; top:10px; left:10px; color:#fff; font-family:sans-serif; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const tileSize = 20;               // size of one grid cell (px)
  const cols = canvas.width / tileSize;
  const rows = canvas.height / tileSize;

  // Game state
  let snake = [{x: 5, y: 5}];        // initial segment (array of cells)
  let dx = 1, dy = 0;                 // current direction (right)
  let food = randomFood();
  let score = 0;
  let gameOver = false;
  const speed = 100;                  // ms between moves (lower = faster)

  // ---------- Helper functions ----------
  function randomFood() {
    let f;
    do {
      f = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
    } while (snake.some(s => s.x===f.x && s.y===f.y));
    return f;
  }

  function drawRect(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x*tileSize, y*tileSize, tileSize, tileSize);
  }

  function render() {
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
      ctx.fillText(`Score: ${score}`, canvas.width/2, canvas.height/2+30);
      return;
    }

    // Clear board
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Draw food
    drawRect(food.x, food.y, '#e63946');
    // Draw snake
    snake.forEach(segment => drawRect(segment.x, segment.y, '#5ca2d4'));
    // Update score display
    document.getElementById('score').textContent = `Score: ${score}`;
  }

  function step() {
    if (gameOver) return;

    // Compute new head position
    const newHead = { x: (snake[0].x + dx + cols) % cols, y: (snake[0].y + dy + rows) % rows };
    // Collision with self?
    if (snake.some(seg => seg.x===newHead.x && seg.y===newHead.y)) {
      gameOver = true;
      return;
    }

    snake.unshift(newHead); // add new head

    // Check if we ate food
    if (newHead.x===food.x && newHead.y===food.y) {
      score++;
      food = randomFood(); // new food
      // (do NOT pop – snake grows)
    } else {
      snake.pop(); // maintain length
    }

    render();
    setTimeout(step, speed);
  }

  // ---------- Input handling ----------
  document.addEventListener('keydown', e => {
    const key = e.key;
    if (key === 'ArrowUp'    && dy===0) { dx=0; dy=-1; }
    else if (key === 'ArrowDown' && dy===0) { dx=0; dy=1; }
    else if (key === 'ArrowLeft' && dx===0) { dx=-1; dy=0; }
    else if (key === 'ArrowRight' && dx===0) { dx=1; dy=0; }
    // Prevent reversing direction directly
  });

  // ---------- Start ----------
  render();
  step();
})();
</script>
</body>
</html>
