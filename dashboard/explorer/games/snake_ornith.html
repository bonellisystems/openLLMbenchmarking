<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            color: #00d2ff;
        }

        .high-score {
            font-size: 18px;
            color: #ff6b6b;
        }

        canvas {
            border: 3px solid #16213e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.15);
            background: #0f3460;
        }

        .overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .overlay.visible {
            pointer-events: all;
            opacity: 1;
        }

        .overlay h1 {
            font-size: 48px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
        }

        .overlay p {
            font-size: 20px;
            color: #aaa;
        }

        .overlay .final-score {
            font-size: 28px;
            color: #00d2ff;
        }

        button {
            padding: 12px 32px;
            font-size: 18px;
            border: 2px solid #00d2ff;
            background: transparent;
            color: #00d2ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: #00d2ff;
            color: #1a1a2e;
        }

        .controls-hint {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="high-score">Best: <span id="highScore">0</span></div>
    </div>

    <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <canvas id="game" width="400" height="400"></canvas>
        <div class="overlay visible" id="startOverlay">
            <h1>🐍 Snake</h1>
            <p>Eat food. Grow. Don't crash.</p>
            <button id="startBtn">Start Game</button>
        </div>
        <div class="overlay" id="gameOverOverlay">
            <h1>Game Over</h1>
            <div class="final-score" id="finalScore"></div>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <div class="controls-hint">Arrow Keys or WASD to move</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');

        const GRID = 20;
        const TILE = canvas.width / GRID;
        const SPEED_INITIAL = 120;
        const SPEED_MIN = 60;

        let snake, direction, nextDirection, food, score, highScore, gameLoop, speed, running;

        highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
        highScoreEl.textContent = highScore;

        function init() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            speed = SPEED_INITIAL;
            scoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * GRID),
                    y: Math.floor(Math.random() * GRID)
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function update() {
            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Wall collision
            if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
                return gameOver();
            }

            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                return gameOver();
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
                // Speed up slightly
                speed = Math.max(SPEED_MIN, SPEED_INITIAL - score * 2);
                clearInterval(gameLoop);
                gameLoop = setInterval(update, speed);
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Background
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid lines (subtle)
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE, 0);
                ctx.lineTo(i * TILE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * TILE);
                ctx.lineTo(canvas.width, i * TILE);
                ctx.stroke();
            }

            // Food with glow
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(
                food.x * TILE + TILE / 2,
                food.y * TILE + TILE / 2,
                TILE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            snake.forEach((segment, i) => {
                const ratio = 1 - i / snake.length;
                const g = Math.floor(180 + 75 * ratio);
                const b = Math.floor(100 + 155 * ratio);

                if (i === 0) {
                    ctx.shadowColor = '#00d2ff';
                    ctx.shadowBlur = 10;
                }

                ctx.fillStyle = `rgb(0, ${g}, ${b})`;
                const padding = i === 0 ? 1 : 2;
                const radius = i === 0 ? 5 : 3;

                roundRect(
                    ctx,
                    segment.x * TILE + padding,
                    segment.y * TILE + padding,
                    TILE - padding * 2,
                    TILE - padding * 2,
                    radius
                );

                ctx.fill();
                ctx.shadowBlur = 0;

                // Eyes on head
                if (i === 0) {
                    ctx.fillStyle = '#fff';
                    let ex1, ey1, ex2, ey2;
                    const cx = segment.x * TILE + TILE / 2;
                    const cy = segment.y * TILE + TILE / 2;

                    if (direction.x === 1) { ex1 = cx + 3; ey1 = cy - 4; ex2 = cx + 3; ey2 = cy + 4; }
                    else if (direction.x === -1) { ex1 = cx - 3; ey1 = cy - 4; ex2 = cx - 3; ey2 = cy + 4; }
                    else if (direction.y === -1) { ex1 = cx - 4; ey1 = cy - 3; ex2 = cx + 4; ey2 = cy - 3; }
                    else { ex1 = cx - 4; ey1 = cy + 3; ex2 = cx + 4; ey2 = cy + 3; }

                    ctx.beginPath();
                    ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(ex1, ey1, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(ex2, ey2, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function gameOver() {
            running = false;
            clearInterval(gameLoop);
            finalScoreEl.textContent = `Score: ${score}`;
            gameOverOverlay.classList.add('visible');
        }

        function startGame() {
            startOverlay.classList.remove('visible');
            gameOverOverlay.classList.remove('visible');
            init();
            draw();
            running = true;
            gameLoop = setInterval(update, speed);
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            if (!running) return;

            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown': case 's': case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
            e.preventDefault();
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Initial draw
        init();
        draw();
    </script>
</body>
</html>
