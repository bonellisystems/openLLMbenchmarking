# gitleaks configuration for openLLMbenchmarking.
#
# The default ruleset is kept in full. Only four SPECIFIC VALUES are allowlisted, each
# verified by hand against the repository and its history before being added. Nothing is
# allowlisted by directory, because this repo stores model TRANSCRIPTS - if a model ever
# echoed a real credential into an answer, a path-based exemption would hide it.
#
# Baseline at the time of writing: 47 findings, all generic-api-key, all four values below.

[extend]
useDefault = true

[[rules]]
# Keep the default generic-api-key rule but give it an allowlist of the known-benign
# values. Defined as a rule-scoped allowlist so it cannot silently widen other rules.
id = "generic-api-key"
description = "Generic API Key (default rule, with verified-benign values allowlisted)"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  # 1. THE B11 TEST FIXTURE (35 of the 47). suite task b11.find_secret plants a fake
  #    credential in a scratch workspace and scores whether the model locates the file.
  #    It is defined in scripts/run_tools_agent.py and is echoed into every recorded row
  #    and prompt. It has never been a live credential anywhere.
  '''sk-live-9f3a2b71c0''',

  # 2. A PHRASE FROM MODEL OUTPUT (9). Appears in explorer transcript data and in the
  #    three judge artifacts for one B1 packet - i.e. text a model wrote, not config.
  '''neutral[-_a-z]*ry''',

  # 3. A localStorage KEY NAME in the explorer page (2): `const GKEY =
  #    'testbench.grades.v1'`. Names where the human grades are persisted in the browser.
  '''testbench\.grades\.v1''',

  # 4. A FILENAME IN PROSE (1): a design note listing "the key B8 harness files:
  #    b8_harness.py ...". Matched only because "key ... :" precedes it.
  '''b8_harness\.py''',
]
