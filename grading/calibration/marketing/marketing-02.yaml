strong: |
  After the two locked line items ($18,000 direct mail + $9,000 branch signage = $27,000), the
  remaining flexible budget is $60,000 - $27,000 = $33,000.

  Allocation to hit the 150-application goal within a $220 blended cost-per-application (CPA)
  target:
  - Email newsletter sponsorship: $2,000 flat, ~20 applications (fixed ceiling).
  - Paid search: $23,400 at the historical $180 CPA, generating 130 applications.
  - Total: 20 + 130 = 150 applications for $25,400 of the $33,000 available -- $7,600 under
    budget, so paid social isn't strictly needed to hit the goal, though it remains available as
    reserve if search underperforms.

  Blended CPA check: $25,400 / 150 applications = about $169, comfortably under the $220
  target.
weak: |
  We should definitely put more into paid social since it tends to have better engagement, and
  increase brand visibility through search too. Video content could also help build trust so
  people feel comfortable applying online. Let's revisit the direct mail and signage budgets
  next quarter to see if there's room to shift more toward digital.
