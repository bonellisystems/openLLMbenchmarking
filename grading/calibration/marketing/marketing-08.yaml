strong: |
  CAC = $48,000 spend / 24 closed customers = $2,000 customer acquisition cost (CAC).

  LTV under the old 3-year lifetime assumption: $9,600 ACV x 3 years x 70% gross margin =
  $20,160. That gives a naive LTV:CAC ratio of 10.08:1 -- well above the conventional 3:1
  healthy benchmark.

  But the actual measured average customer tenure from cohort churn data is 14 months, not 36.
  Recomputed: $9,600 x (14/12) x 70% = $7,840 actual LTV, giving a real LTV:CAC ratio of
  3.92:1 -- still workable, but less than half the naive figure.

  The acquisition funnel itself (traffic, lead conversion, CAC at $2,000) is healthy and not
  the constraint. The real constraint dragging quarter-over-quarter economics down is
  retention/churn: customers are leaving in an average of 14 months, well before the 3-year
  lifetime the prior readout assumed, and that's what's compressing real LTV. The fix is a
  retention/churn initiative, not more top-of-funnel acquisition spend.
weak: |
  This quarter's funnel looks strong -- $48,000 in spend drove 24 new customers, and with a
  healthy lifetime value, the return looks excellent. We should double down on the channels
  driving traffic and increase overall spend next quarter to keep growing the customer base at
  this pace.
