strong: |
  Meridian's publicized 15% fee discount looks like the threat, but the loss data tells a
  different story: of the 5 institutional bids lost to Meridian in the past 6 months, only 1 of
  5 (20%) was purely price-driven (Loss 3). The other 4 of 5 (80%) cite schedule or
  design-development speed as the deciding factor -- Meridian's faster design-development
  timeline, not their lower fee, is what actually won those boards over.

  Recommendation: do not match the 15% discount. Matching it erodes margin on every
  institutional bid going forward without addressing the actual reason we're losing -- speed.
  Instead, invest in a compressed design-development process for K-12 work (parallel-track
  schematic design and permitting prep, a named fast-track team) and offer an explicit schedule
  commitment in proposals, since 4 of 5 boards said schedule mattered more than fee. Reserve
  selective, case-by-case fee flexibility only for the genuinely price-sensitive segment the
  data shows is a minority of this competitive loss pattern.
weak: |
  Meridian's 15% discount is a serious threat to our win rate. We should match their pricing
  with a comparable discount on institutional bids to stay competitive and avoid losing more
  business to them on price.
