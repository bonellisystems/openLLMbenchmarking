strong: |
  Pre-launch content calendar: 2 posts/week x 10 weeks = 20 total pieces before the Q4 launch.

  Because clinical validation and FDA clearance for the new test are still pending, none of
  these 20 pieces can make clinical-accuracy, diagnostic-performance, or efficacy claims about
  the new test specifically. Topic categories instead:
  - Weeks 1-3 (6 posts): category education -- what genetic testing is, how it generally
    works, common misconceptions.
  - Weeks 4-6 (6 posts): general genetics literacy -- family health history, how genetics and
    lifestyle interact, glossary-style explainer content.
  - Weeks 7-9 (6 posts): patient-journey and category stories, not testimonials about the
    specific unreleased test's accuracy.
  - Week 10 (2 posts): brand/company narrative building toward the launch announcement.

  Every piece stays in educational/category territory; nothing asserts or implies the new
  test's clinical accuracy or efficacy ahead of clearance.
weak: |
  Content calendar: post regularly on social media and the blog about the exciting new test
  coming this fall, highlighting how accurate and reliable the results will be compared to
  other options on the market. Include customer testimonials about how the test changed their
  lives. Aim for consistent posting to build hype before launch.
