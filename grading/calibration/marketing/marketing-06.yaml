strong: |
  The ICP for this product is not defined by organization size -- size is a red herring here.
  Won accounts range from 15 to 450 providers/beds, and lost accounts range from 20 to 500
  providers/beds; the two ranges almost completely overlap, so org size carries no separating
  signal.

  The real driver: of the 7 deals won, all 7 (100%) had a documented compliance audit finding
  or citation within the 12 months before engaging. Zero of the 5 lost deals had a recent
  finding -- those organizations were "proactively evaluating," with no urgent trigger event
  pushing a purchase decision.

  ICP definition: healthcare provider organizations of any size that have a recent compliance
  audit finding or citation (the qualifying trigger event), not a size-based segment like "200+
  bed hospital systems." Marketing and sales should prioritize signals of a recent audit or
  citation (public enforcement notices, RFPs issued shortly after a citation, inbound urgency
  language) over firmographic size filters.
weak: |
  Based on the deal sizes, it looks like larger healthcare organizations -- hospital systems in
  the 200+ bed range -- are our best-fit customers, since they have bigger budgets and more
  compliance staff to manage a purchase like this. We should focus outbound efforts on
  enterprise health systems going forward.
