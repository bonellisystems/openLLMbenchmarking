strong: |
  Given a 7-month sales cycle and an engineering-manager buyer who needs proof before
  advocating internally, this sequence spaces 6 touches across the full cycle rather than a
  short sales cadence:

  1. Day 0 (post-demo): technical follow-up with a link to a detailed case study showing
     field-data results from a comparable pipeline project -- directly answers the "we need to
     see field data" objection immediately.
  2. Day 14: a second, different case study on a different pipeline scenario, plus a technical
     FAQ.
  3. Day 45: an educational piece on inspection methodology (no pitch), building credibility.
  4. Day 90: a direct check-in referencing their evaluation timeline, offering a technical Q&A
     call with an engineer rather than a salesperson.
  5. Day 150: a third case study plus a field-data/ROI summary sized for an internal budget
     conversation, so the engineer has something they can forward upward.
  6. Day 210 (near typical close): a final proof-point recap plus a direct next-step ask.

  Goal: raise the 90-day engaged-lead rate from the current 22% baseline to 35%, while keeping
  every touch focused on field data and case studies rather than generic promotional content,
  since that's the specific objection sales flagged as blocking deals.
weak: |
  Set up a standard 3-email drip: a follow-up thank you, a special discount offer to encourage
  faster decision-making, and a final "last chance" email if they haven't responded. This
  creates urgency and should help move leads through the funnel more quickly.
