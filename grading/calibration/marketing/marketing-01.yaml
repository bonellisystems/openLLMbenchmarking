strong: |
  Hearth & Grain: the wholesale bakery partner grocery buyers can actually count on.

  Our recent survey of 40 independent grocery buyers found that 68% rank consistency of supply
  -- reliable, on-schedule delivery of the same quantity every week -- as the single biggest
  factor in choosing a new local bakery vendor, far ahead of price (22%). Buyers told us
  bluntly: they've been burned before by bakeries that couldn't keep up during peak periods and
  dropped off the shelf entirely.

  Hearth & Grain's pitch to grocery buyers isn't "handmade artisan quality" -- it's
  dependability: a fixed weekly production schedule, guaranteed delivery windows, and a
  standing-order system built specifically so we never miss a shelf date, even during holiday
  peaks. That's the promise grocery buyers said mattered most, and it's the promise we lead
  with.

  This positioning is built to support our Q3 goal of signing 15 new wholesale grocery
  accounts.
weak: |
  Hearth & Grain is a small-batch artisan bakery that makes delicious, handmade baked goods
  using only the finest local ingredients. Our beautiful packaging and unique flavors set us
  apart from big commercial bakeries. We'd love the opportunity to get our products onto more
  shelves and build our brand presence in new stores. Quality and craftsmanship are what we're
  all about, and we think any store would be proud to carry our products.
