strong: |
  Prioritized remediation plan (most critical first):

  1. [CRITICAL, do first] Enroll MFA for the 7 unprotected Global Administrator accounts today.
  GA accounts have unrestricted tenant control -- a single compromised, MFA-less GA account is a
  full-tenant-compromise risk, which dwarfs every other finding here in blast radius. Where
  possible, also reduce standing GA membership (use Privileged Identity Management / just-in-time
  elevation instead of permanent GA assignment) as a follow-on hardening step.
  2. [HIGH] Turn on Conditional Access to close the legacy-auth gap. Security Defaults being off
  with no Conditional Access policies means there is currently no baseline MFA enforcement or
  legacy-auth blocking at all. Enable Conditional Access policies that (a) require MFA for all
  users, and (b) block legacy authentication protocols (POP3/IMAP/basic ActiveSync) tenant-wide
  -- Conditional Access is the correct control here specifically because it supports exceptions
  and break-glass accounts while achieving the same baseline as Security Defaults.
  3. [MEDIUM] Publish a DMARC record (with SPF already in place, add DKIM if not already signing,
  then DMARC) to close the email-spoofing/impersonation gap -- SPF alone doesn't tell receiving
  mail servers what to do with a spoofed message that fails alignment; DMARC does.
  4. [VERIFY] For CVE-2023-23397 (the zero-click Outlook NTLM-relay via calendar reminder sound,
  patched March 2023): confirm every desktop's Outlook build number is at or above the March 2023
  Patch Tuesday release via your patch-management tooling, don't just assume Windows Update
  caught it, since Office updates sometimes run on a separate channel/cadence from OS patches.
  For any device you can't immediately verify, treat it as unpatched until proven otherwise.
weak: |
  There are several things to fix here. We'd recommend enabling MFA, setting up Conditional
  Access, adding DMARC, and checking that Outlook is patched. All of these are good security
  practices and should be done when convenient. Let us know if you want us to schedule this work.
