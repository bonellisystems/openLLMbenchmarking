strong: |
  Subject: Notice Regarding a Data Security Incident Involving a County Vendor's File Transfer
  Software

  To the County Clerk:

  What happened: A software vulnerability (publicly tracked as CVE-2023-34362) in a file-transfer
  product used by one of our technology vendors was exploited by an unauthorized third party. The
  vendor has confirmed the incident and notified us. Our review indicates that a database
  containing Social Security numbers and driver's license numbers for approximately 8,400
  residents who submitted public records requests over the past five years was affected. We
  identified this issue 6 days ago, through the vendor's own disclosure to us, and immediately
  began our review.

  What we are doing: We are working with legal counsel and technical specialists to confirm the
  full scope of the incident and to support affected residents. Under the applicable state
  breach-notification law, we are required to, and will, notify affected residents within 30 days
  of the discovery date -- meaning notifications will go out within the next 24 days. Because more
  than 500 residents are affected, we are also notifying the state Attorney General's office, as
  required.

  What affected residents can do: Because Social Security and driver's license numbers were
  involved, we are arranging complimentary credit monitoring and identity-theft protection
  services for affected residents, with enrollment details to follow in the individual
  notification letters. Residents with questions in the meantime may contact the County Clerk's
  office.

  This matter involves a vulnerability in a vendor's software product, and our review is ongoing;
  we are not in a position to characterize fault or liability at this stage, and this notice
  should not be read as such. We will provide updates as our review progresses.
weak: |
  We wanted to let everyone know there was a data incident with one of our vendors recently. Some
  resident information may have been affected. We take this very seriously and are looking into
  it. We will let people know if we find out they need to do anything. We're sorry this happened
  and take full responsibility for any issues this may cause.
