strong: |
  Section 4 -- Incident Response & Breach Notification

  1. Notification timeline: Per the HIPAA Breach Notification Rule (45 CFR 164.404), our
  contractual SLA to the covered entity is notification without unreasonable delay, and in no
  case later than 60 days after we discover a breach of unsecured PHI. In practice, our internal
  target is same-business-day notification of any confirmed PHI exposure; the 60-day figure is
  the outer regulatory bound, not our target.

  2. MFA for remote administrative access: Yes. All remote administrative access to any system
  that stores, processes, or transmits PHI requires multi-factor authentication (MFA) -- no
  exceptions, including for our own MSP technicians and any vendor-supplied support accounts.
  Legacy authentication paths that cannot support MFA are disabled on PHI-adjacent systems.

  3. Third-party CVE vetting: Before deploying or continuing to rely on any third-party software
  component that touches PHI -- including managed file transfer tools -- we subscribe to the
  vendor's security advisories and monitor NVD/CISA KEV for the product. We treat any Critical
  (CVSS >= 9) or actively-exploited CVE as an emergency-patch item with a target remediation SLA
  measured in hours, not the standard patch cycle. The 2023 MOVEit Transfer breach
  (CVE-2023-34362) is exactly the failure mode this process is built to catch: an unauthenticated
  SQL injection in a managed file transfer product that was mass-exploited before many operators
  had patched. We do not deploy new third-party components that touch PHI without first checking
  their CVE history and current patch status.
weak: |
  We take security very seriously and notify clients quickly if anything happens. We use strong
  passwords and require authentication for our systems. We keep our software updated regularly
  and follow best practices for vendor management. We haven't had any issues with breaches so
  this shouldn't really be a concern.
