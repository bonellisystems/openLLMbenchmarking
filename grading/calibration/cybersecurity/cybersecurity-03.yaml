strong: |
  Triage: This is confirmed lateral movement, not just suspicious authentication.

  MITRE ATT&CK: The 03:14-03:15 events are a brute-force/password-guessing attempt against
  svc_backup (T1110, Brute Force) that succeeded at 03:15:03. The 03:16:47 event -- psexesvc.exe
  launched via PsExec against WIN-LIMS02 using the now-compromised svc_backup credentials -- is
  lateral movement via SMB/Windows Admin Shares (T1021.002) combined with service-based remote
  execution (T1569.002, the PsExec service artifact). The 03:17:12 outbound connection from
  cmd.exe to an external IP on port 443 is consistent with a C2 callback, though that requires
  log/network confirmation, not just the process lineage shown here.

  SLA: This is P1 (1-hour SLA), not P2. Lateral movement into WIN-LIMS02 is confirmed, not
  merely suspected -- the psexesvc.exe artifact on the LIMS host, combined with credential reuse
  from the compromised svc_backup account, meets the P1 bar of "confirmed lateral movement into
  a system holding confidential trial data." The LIMS server holding unpublished sponsor trial
  data raises the stakes further, but the P1 trigger is already met on the lateral-movement fact
  alone.

  First containment action: Isolate WIN-LIMS02 from the network immediately (disable its network
  adapter or quarantine via EDR/NAC) -- this stops any further C2 communication or exfiltration
  from the LIMS host right now. Do this BEFORE resetting svc_backup's password or blocking the
  external IP; those are good follow-on steps but isolating the compromised host is what actually
  stops ongoing damage, since password resets/IP blocks can be evaded if the attacker already has
  a foothold on WIN-LIMS02 itself. After isolation: preserve WIN-LIMS02's memory/disk state for
  forensics, THEN reset svc_backup and any accounts that authenticated from 10.20.4.187, THEN
  begin eradication.
weak: |
  This looks like some suspicious login activity followed by a possible security issue on the
  LIMS server. We should probably reset the svc_backup password and keep an eye on things. Since
  it's not 100% confirmed what happened, this can probably be handled as a routine P2 ticket and
  we'll follow up during business hours. It's a good idea to review firewall rules at some point
  too.
