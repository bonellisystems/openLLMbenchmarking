strong: |
  Tabletop response, in priority order:

  1. Technical containment (recognizing MFA does not help here): Because CVE-2023-4966 is
  session-token theft, not credential theft, the fix is NOT "enforce MFA harder" -- the attacker
  already has a live, authenticated session that bypassed MFA by replay. Immediately: (a) apply
  Citrix's patch for CVE-2023-4966 to the NetScaler ADC/Gateway, (b) kill ALL active ICA/PCoIP
  sessions on the appliance (necessary because patching alone does not invalidate already-stolen
  tokens), and (c) force a global password reset only AFTER killing sessions, since a reset alone
  does nothing against a still-live stolen session token.

  2. Evidence preservation on FS-DOCS02 under litigation hold: Do not simply rebuild or wipe
  FS-DOCS02. Take a forensic image before any remediation touches the box, and route the forensic
  engagement through outside breach counsel (retain a forensics firm under counsel's direction,
  not directly under IT) so the forensic report itself is covered by attorney-client privilege /
  work-product protection. Because three matters are under active litigation hold, do not delete
  or alter any files on FS-DOCS02 as part of remediation -- work from the forensic image/copy and
  document chain of custody, so the firm can show the litigation hold was respected even during
  incident response.

  3. Who to engage before spending: Notify the cyber insurance carrier and engage breach/outside
  counsel FIRST, before engaging any remediation vendor or authorizing spend. The policy's
  consent-to-settle clause means the carrier can deny coverage for incident-response costs
  incurred without their pre-approval, so acting unilaterally on vendor selection/spend, however
  well-intentioned, can leave the firm paying out of pocket for costs the policy would otherwise
  have covered. Breach counsel should also be looped in immediately given the privileged material
  involved.

  4. Ransom demand: Don't recommend paying by default. Before any payment decision: verify
  backups are intact and assess whether restoration without paying is viable; have counsel run an
  OFAC sanctions screening on the threat actor/wallet, since paying a sanctioned entity carries
  its own legal exposure regardless of the ransomware situation; and let the carrier/breach coach
  lead the payment-negotiation decision, since that's typically covered under the policy and they
  have the specialized experience. The 96-hour clock is real pressure, but a rushed payment
  decision without sanctions screening and carrier involvement creates a second legal problem on
  top of the breach itself.
weak: |
  This is a serious ransomware attack. We should isolate the affected server and make sure MFA is
  turned on everywhere to prevent this from happening again. We'll also want to notify the
  insurance company at some point and figure out next steps on the ransom. Since the files are
  under litigation hold, we should be careful, but the priority right now is getting the firm
  back up and running as quickly as possible, so we'd recommend restoring from backup and
  rebuilding the affected server.
