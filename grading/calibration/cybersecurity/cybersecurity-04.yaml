strong: |
  Match: Yes, this log line matches the Sigma rule. Event ID 5829 with Provider_Name "Netlogon"
  is exactly the selection criteria in the rule, and the log line is a native Windows System-log
  Netlogon event with that ID.

  ATT&CK: The rule tags attack.t1210, Exploitation of Remote Services -- Zerologon
  (CVE-2020-1472) is remotely exploitable against the Netlogon RPC interface without prior
  authentication, which is why it's classified under remote-service exploitation rather than,
  say, credential access.

  Why Event ID 5829 matters for CVE-2020-1472 specifically: Microsoft added these Netlogon
  secure-channel warning events as part of the phased Zerologon enforcement rollout, to flag
  machines using an insecure/vulnerable Netlogon secure channel -- exactly the connection type
  CVE-2020-1472 abuses to spoof a domain controller's identity and reset its computer account
  password. Seeing this event fire against DC-PIPE01, the primary DC, from an unfamiliar source
  workstation is a high-confidence signal that something on the network attempted a
  Zerologon-style Netlogon connection, and it should be treated as a P1 domain-compromise-attempt
  regardless of whether full exploitation is later confirmed -- domain controller identity is the
  highest-blast-radius asset on the network.

  OT/SCADA: Do NOT assume the OT/pipeline-control network is unaffected just because IT and OT
  are "supposed to be" segmented. Verify the segmentation boundary is actually intact -- check
  firewall/jump-host logs between the IT AD environment and any OT-facing systems (e.g.,
  historian servers, engineering workstations with a foot in both networks) for any unusual
  activity correlated with this alert, and confirm no OT-adjacent account shares credentials
  with the compromised IT domain. Equally, don't over-react and declare a pipeline-control
  incident without that verification -- the correct response is confirm, not assume, in either
  direction. In parallel, patch/harden DC-PIPE01 against Zerologon (enforce secure RPC, ensure
  the client's DCs are in enforcement mode, not compatibility mode) and rotate the DC's machine
  account password per Microsoft's remediation guidance if compromise is confirmed.
weak: |
  This event might be related to some kind of network issue. It's probably worth looking into
  when someone has time. Since the OT network is separate from IT, this shouldn't be a big
  concern for pipeline operations. We'd recommend general monitoring and keeping systems patched
  as a best practice.
