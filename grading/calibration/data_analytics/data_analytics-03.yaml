strong: |
  KPI tree:
  - Revenue ($4,200,000, root)
    - Units Sold (350) x Average Selling Price ($12,000)
      - Units Sold = Leads (2,800) x Lead-to-Quote Rate (25%) x Quote-to-Close Rate (50%)

  Reconciliation check: 2,800 x 25% x 50% = 350 units -- matches the stated Units Sold exactly.
  350 x $12,000 = $4,200,000 -- matches the stated Revenue exactly. The tree reconciles.

  Controllability: Lead-to-Quote Rate and Quote-to-Close Rate are directly controllable by the
  sales team (pitch quality, follow-up discipline, qualification process). Lead volume is mostly
  a marketing/demand-gen lever, only indirectly "sales controllable." ASP is partly controllable
  (pricing/discounting policy) but also partly set by external market/competitive conditions.

  Impact of a 10% ASP improvement alone: 350 x ($12,000 x 1.10) = 350 x $13,200 = $4,620,000, a
  +$420,000 impact. Impact of a 10% Leads improvement alone: 2,800 x 1.10 = 3,080 leads x 25% x
  50% = 385 units x $12,000 = $4,620,000, ALSO a +$420,000 impact -- identical in dollar terms.
  This isn't a coincidence: because Revenue is a pure product of these four factors, a 10% move
  in any single one of them (holding the others fixed) produces the same +10%/+$420,000 effect,
  regardless of how close that lever sits to Revenue in the tree. So revenue-impact size alone
  can't be the prioritization criterion since they tie -- leadership should instead prioritize
  whichever lever is cheapest and fastest to actually move by 10% (a modest price increase is
  usually far easier to execute than a 10% lift in raw lead volume).
weak: |
  The KPI tree breaks Revenue down into Units Sold and ASP, and Units Sold further into Leads,
  Lead-to-Quote Rate, and Quote-to-Close Rate. Since ASP sits closest to Revenue in the tree, it's
  the highest-leverage lever -- improving ASP by 10% will move revenue more than improving a
  lever further down the tree like Leads, since those effects have to flow through more stages
  before hitting Revenue. Leadership should focus on pricing first since it has the most direct
  impact on the bottom line.
notes: |
  Weak answer never reconciles the tree numbers back to the stated $4.2M/350-unit figures, never
  computes the $420,000 impact for either lever, and asserts (incorrectly) that ASP has more
  revenue impact than Leads because it's "closer" to Revenue in the tree -- the exact
  proximity-implies-bigger-impact fallacy the fixture is built to catch, since in a purely
  multiplicative KPI tree every factor has an identical percentage effect. Fails the 4200000
  signal (never reconciles/restates baseline revenue), fails the 420000 signal (never computes
  either lever's dollar impact), fails the 2800 signal (never restates the leads figure), and
  fails the "equal/identical/same" regex (asserts ASP is bigger, the opposite of the correct
  finding).
