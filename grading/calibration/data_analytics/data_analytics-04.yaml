strong: |
  Finance's Customer Churn Rate: (20 cancelled + 8 downgraded-to-free + 5 paused) / 500 = 33/500
  = 6.6%. Product's Logo Churn Rate: 20 cancelled / 500 = 4.0%.

  Neither team made a calculation error -- both numbers are internally correct under their own
  definitions. This is a metric-definition mismatch, not a math dispute: Finance is measuring
  "zero billed revenue at month end" (a revenue-churn lens), while Product is measuring "fully
  left the product" (a logo-churn lens) and deliberately excludes still-active downgrades and
  temporary pauses.

  Reconciliation: the 5 contractually-paused accounts should NOT count as churned under either
  definition -- they have a guaranteed resume date under an existing contract and haven't left.
  Recomputing Finance's number with the paused accounts correctly excluded: (20 cancelled + 8
  downgraded) / 500 = 28/500 = 5.6%.

  What the board should see: two clearly-labeled numbers, not one contested figure -- Logo Churn
  Rate = 4.0% (fully cancelled accounts only) and Revenue/Dollar Churn Rate (excluding
  contractual pauses) = 5.6% (cancelled + downgraded-to-free). Both are legitimate metrics
  answering different questions; presenting them side by side, correctly labeled, resolves the
  dispute without either team being "wrong."
weak: |
  Finance says churn is 6.6% and Product says it's 4.0% -- someone's math must be off, so let's
  just average the two and report 5.3% churn to the board as the official number. The paused
  accounts are a minor detail either way and probably shouldn't change the outcome much. Going
  forward we should pick whichever definition is simpler to calculate each month.
notes: |
  Weak answer assumes one team's number is simply wrong ("someone's math must be off") rather
  than recognizing the metric-definition mismatch, invents an unprincipled average (5.3%) that
  neither team's definition supports, and never recomputes the reconciled 5.6% figure that
  correctly excludes the contractually-paused accounts. Fails the 5.6 numeric signal (never
  computed), and fails the "definition" regex (never frames this as a metric-definition issue --
  frames it as an arithmetic error instead). It does restate Finance's 6.6% and Product's 4.0% as
  given in the prompt, so those two numeric signals may still pass; the reconciliation and
  definitional-framing failures are the load-bearing discriminators here.
