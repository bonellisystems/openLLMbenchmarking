strong: |
  Month-2 net dollar retention: Jan cohort = $17,000/$20,000 = 85%. Feb cohort = $21,250/$25,000
  = 85% -- identical retention rate to Jan.

  Month-3 net dollar retention (Jan cohort only, since it's the only one old enough): $15,000/
  $20,000 = 75%.

  Absolute dollar churn at Month 2: Jan lost $20,000-$17,000 = $3,000. Feb lost $25,000-$21,250 =
  $3,750. Even though Jan and Feb have the SAME 85% retention percentage, Feb lost more revenue
  in absolute dollars ($3,750 vs $3,000), because Feb started from a larger MRR base. Percentage
  and absolute-dollar views can rank the same two cohorts differently -- worth reporting both.

  The Feb cohort has no Month-3 figure because it is only 2 months old -- that data point simply
  hasn't happened yet, not a data-quality gap. Same for the Mar cohort's missing Month-2 figure:
  it's only 1 month old. I'm not going to fill either gap with an estimate presented as fact.
  Blending all three cohorts into one "average retention" right now would be misleading because
  they're at different ages: Mar's single data point (100% by definition, since it hasn't had a
  chance to churn anything yet) would drag a blended number upward in a way that has nothing to
  do with actual retention performance -- cohorts should be compared at the same age, not
  averaged together regardless of maturity.
weak: |
  Retention looks pretty healthy across all three cohorts, holding steady in the mid-80s. Jan's
  Month-3 number should be similar to its Month-2 number, maybe drifting down a little to around
  80%. Feb and Mar are presumably trending the same way, so I'd blend all three cohorts together
  into one overall retention trend around 84-85%. Dollar churn between Jan and Feb looks about
  the same in both cohorts since the percentage is identical. Overall retention is healthy across
  the board with no particular concerns.
notes: |
  Weak answer fabricates Jan's Month-3 figure as "around 80%" instead of computing the actual
  75% ($15,000/$20,000), assumes Feb/Mar are "presumably trending the same way" rather than
  stating plainly that those data points don't exist yet, and blends all three cohorts of
  different ages into one steady number -- the exact cohort-maturity trap the fixture targets.
  It also claims Jan and Feb's dollar churn "looks about the same," missing that Feb's $3,750
  exceeds Jan's $3,000 despite the identical percentage. Fails the 75 numeric signal (never
  states it, states ~80% instead), fails the 3750 numeric signal (never stated), and fails the
  maturity-language regex (never flags that Feb/Mar's missing figures are because those months
  haven't happened yet -- instead hand-waves them as "presumably" following the same trend).
