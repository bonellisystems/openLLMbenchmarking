strong: |
  New IT Support Hire -- Onboarding Notes (Law Firm DMS / Access Rules)

  1. Conflicts check comes before ANY new matter folder in iManage. Before you create a matter
     workspace, confirm with Records that the conflicts check for that matter has actually
     cleared -- don't create the folder "to save time" while it's still pending. Why: if you
     create the folder first and the conflicts check later comes back positive, you've already
     given people file access to a matter they may be legally walled off from. That's an ethics
     violation for the firm, not just an access-control mistake you can quietly fix.

  2. Watch for ethical walls. Some clients sit on a restricted list, and access to their matters
     must be limited to a specific, approved team. If a request looks like it could touch a
     walled-off client or matter, check with Records before granting anything -- never guess
     based on the matter name alone, since matter names don't reliably indicate which clients
     or parties are involved.

  3. Matter-team access follows the intake form, not the requester. When granting iManage access
     for a matter, add exactly the people listed on the matter's intake form as the assigned
     team. If someone emails asking to be added who isn't on that list, don't add them directly
     -- confirm with the matter's responsible attorney or Records first. This exists because an
     email request alone isn't a reliable source of truth for who should have access to
     privileged matter files.

  4. Partner password resets go through the Executive Assistant, never straight to the partner.
     If you get a password-reset request that claims to be from a partner directly, route it
     through that partner's EA for confirmation before resetting anything. This exists because a
     request that looks like it's from a partner isn't always actually from them, and partners'
     accounts are high-value targets.

  Failure branch: if you're ever unsure whether a request falls into one of these categories
  (e.g., ambiguous matter name, unclear whether a client is walled), default to checking with
  Records before acting -- these are the cases the checks exist for.
weak: |
  Some general tips for the new IT hire: be careful about creating matter folders, watch out for
  conflicts of interest, and make sure the right people have access to the right matters. Also
  password resets for partners need to go through the proper channel, not directly to them. If
  anything seems off just check with Records before doing anything.
