strong: |
  KB-Article: Replacing a Lost Hardware Security Key -- Trading-Floor Staff

  Prerequisites (all must be confirmed before starting resolution):
  - The trader's identity is verified by BOTH their desk supervisor AND IT (two-person
    verification) -- this is required because OMS access changes are an auditable event under
    the firm's SEC/FINRA recordkeeping obligations, not just a routine helpdesk reset.
  - You have confirmed, by checking the OMS directly (not by asking the trader), whether the
    trader currently has any open orders working in the system.

  Resolution steps:
  1. Have the trader's desk supervisor confirm identity verbally or in writing, and log the
     supervisor's name and timestamp in the ticket.
  2. IT independently confirms the trader's identity via a second channel (e.g., a known
     internal number or badge lookup) -- both confirmations must be logged separately.
  3. Check the OMS for open orders under the trader's account.
     - If zero open orders: proceed to step 4 now, regardless of time of day.
     - If any open orders exist: do NOT reissue during market hours. Wait until after 4:00 PM
       ET (market close) or before 9:30 AM ET (market open), then proceed to step 4.
  4. Issue a new FIDO2 hardware key, bind it to the trader's OMS account, and revoke/invalidate
     the lost key immediately so it can no longer authenticate.
  5. Have the trader confirm successful login with the new key.
  6. Log the full reissuance record (both identity verifications, open-order check result, and
     timestamp of reissuance) for the firm's compliance/audit trail.

  Failure branch: if the supervisor is unreachable, do not skip step 1 -- escalate to the desk's
  backup supervisor or trading-floor manager for the second verification instead of proceeding
  with only IT's confirmation. If the trader has open orders and it's mid-day with no way to
  safely wait (rare, escalate-only case), do not reissue; instead escalate to the trading desk
  manager to decide whether to manually work the open order through another authorized terminal
  in the meantime.
weak: |
  If a trader loses their security key, just verify who they are and get them a new key issued
  so they can get back into the trading system. Make sure IT signs off on it since it's a
  regulated environment, and try not to do it in the middle of a busy trading period if you can
  help it. Log the ticket as usual.
