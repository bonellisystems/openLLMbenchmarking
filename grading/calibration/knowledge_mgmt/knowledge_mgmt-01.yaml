strong: |
  New EHR User Access Checklist -- Outpatient Clinic (front-desk / clinical staff)

  Prerequisites (must both be true before you touch anything):
  - HR has sent the new employee's name, role, and start date.
  - The clinic's practice manager has sent WRITTEN approval (email is fine) that names the
    specific EHR access role: front-desk scheduling-only, OR clinical charting access. Do not
    infer the role from the job title -- get it in writing every time, even for roles that seem
    obvious, since a prior incident happened exactly this way.

  Steps:
  1. Confirm the written-approval email is on file and specifies exactly one access role. If it
     doesn't specify a role, or only verbal/Slack confirmation exists, STOP and request written
     confirmation before proceeding -- do not create the account yet.
  2. Create the Active Directory account for the new employee.
  3. Add the account to the EHR role group matching EXACTLY what the approval email specified.
     Never add a scheduling-only hire to the clinical-charting group, even temporarily, even if
     someone asks you to "just for today."
  4. Enable MFA on the new account before it is used for the first time. Do not allow first
     login without MFA already enabled.
  5. Log the account creation, the assigned role, and a reference/link to the approval email in
     the client's compliance folder. This clinic is a HIPAA covered entity and is audited
     annually on new-user access, so this log entry is what you'd show an auditor.

  Failure branch: if at any point you discover an account was created before written approval
  was on file (e.g., you're auditing past tickets), treat it as an access-control incident:
  verify the actual access granted against what should have been granted, correct the role
  group immediately if it's wrong, and log the correction with a note explaining what happened.
weak: |
  Basically when someone new starts, HR lets us know and we get access set up for them in the
  EHR system based on what role they're doing. We create their account, put them in the right
  group, and turn on MFA. Then we just keep a note of it in case the clinic ever gets audited
  since they're HIPAA-regulated. Should be a pretty quick process once we know their role.
