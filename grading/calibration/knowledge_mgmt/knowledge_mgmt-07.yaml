strong: |
  Doc-Rot Audit: KB-114 (Quarterly PCI DSS External Vulnerability Scan Process)

  (a) Stale/no-longer-current references:
  - The article cites "PCI DSS v3.2.1" as the governing standard. v3.2.1 was retired March 31,
    2024; PCI DSS v4.0 has been the sole active standard since then, and v4.0's previously
    future-dated requirements became mandatory as of March 31, 2025. The article needs to be
    rewritten against current v4.0 requirement language (and re-verified against the live PCI
    SSC documentation, since v4.0 also renumbered several requirements relative to v3.2.1 --
    don't assume the old requirement reference still applies unchanged).
  - "QualysGuard" reads like a legacy product name. Before relying on this article, verify with
    the vendor/account team what the scanning tool is actually called and configured as today --
    if the tool itself has changed, or just the branding, the portal URL and login steps in a
    fuller version of this article could also be stale.
  - "Last updated: March 2019" with no subsequent review date is itself a doc-rot signal on its
    own -- this article is over 5 years stale by its own timestamp, well past when the PCI
    version reference alone should have triggered a review.

  (b) Cannot confirm from the article alone / must verify before relying on it:
  - Whether jsmith@ourclient.com is still the client's current compliance contact -- people
    change roles; this should be confirmed with the client directly, not assumed from an old KB
    article, before the next scan report gets emailed to someone who may no longer be there (or
    worse, whose mailbox now routes to someone unauthorized).
  - Whether compliance-distro@ourclient.com is still an active, correctly-membered distribution
    list.

  (c) Not just stale -- actively wrong if followed today: the instruction "if the scan comes
  back with any 'High' findings, that's fine as long as nothing is rated Critical -- just note
  it and move on" is dangerous, not merely outdated. PCI ASV scanning fails a scan for any
  vulnerability scored CVSS >= 4.0, which covers the large majority of "High" severity findings
  -- following this article's instruction as written would leave staff believing a quarter's
  scan passed when it likely did not, which is worse than doing nothing, since it creates false
  confidence in the client's compliance posture. This line must be corrected to require
  remediation and a passing rescan for any finding at or above the ASV failing threshold, not
  just anything below "Critical."
weak: |
  This article is pretty old (last updated 2019) so it probably needs a refresh -- the PCI DSS
  version mentioned might not be current anymore, and QualysGuard sounds like an older tool
  name. Would recommend updating the contact info too in case that's changed. Otherwise the
  general process of running a quarterly scan and emailing the report still seems reasonable.
