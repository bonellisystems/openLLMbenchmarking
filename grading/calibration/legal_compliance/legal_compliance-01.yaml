strong: |
  Retention schedule:

  1. Signed customer service contracts -- retain 3 years past contract end date.
  2. AP/AR and general-ledger records -- retain 7 years, per the internal audit-support floor.
  3. Marketing email opt-in/consent records -- retain for the subscription period plus 2 years
  after unsubscribe or last contact.
  4. Vendor W-9/tax-ID forms -- retain 4 years after the business relationship ends.

  Flag: none of these categories should be applied on the normal schedule to correspondence or
  invoices with Vendor Greenline Supply Co. from 2023 to present -- outside counsel issued a
  litigation hold on March 2, 2026 covering exactly those records in connection with a pending
  contract dispute, and that hold suspends normal retention/destruction for them until counsel
  lifts it. Pull the Greenline records out of the normal destruction queue now and mark them
  hold-exempt.

  One general note: these retention floors are internal company policy, not a jurisdiction-
  specific legal requirement. Before anything is actually destroyed on the normal schedule,
  confirm there isn't a longer state-specific retention rule that should apply to that category in
  your jurisdiction.
weak: |
  Here's a basic retention schedule: keep contracts a few years, keep financial records around
  7 years since that's pretty standard, keep marketing records as long as needed, and keep vendor
  tax forms for a few years too. Once each period is up, records can just be cleared out on
  schedule as part of normal housekeeping.
