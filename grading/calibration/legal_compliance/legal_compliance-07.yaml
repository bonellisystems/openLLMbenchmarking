strong: |
  The substantive difference is NDA B's added exclusion (v), the "Residuals" clause -- and it's a
  much bigger deal than its size suggests. NDA A's four exclusions are the standard, narrow set
  (public info, prior knowledge, independent development, rightful third-party receipt). NDA B
  adds a fifth: anything Partner B's personnel retain in unaided memory after exposure to the
  client's information is exempt from confidentiality entirely, with no obligation to account for
  or limit its use -- the only guardrail is that personnel can't deliberately memorize information
  to dodge the NDA, which is nearly impossible to police or prove.

  For a pilot built around the client's proprietary pipeline-monitoring methodology -- exactly the
  kind of information a competitor's engineers would want to internalize -- this residuals language
  lets Partner B's team walk away and reuse anything they recall of that trade secret methodology
  with essentially no restriction. NDA B poses materially greater risk to the client's proprietary
  position than NDA A.

  Recommendation: push back on the residuals clause in NDA B -- either remove it or narrow it
  significantly (e.g., excluding it entirely for the methodology-specific technical details) --
  before proceeding with that partner. Separately, and worth raising alongside it: both NDAs cap
  survival at three (3) years, which is short for trade-secret-type methodology that arguably
  warrants longer or indefinite confidentiality. Given the JV's strategic importance, both points
  should go to counsel before either NDA is signed.
weak: |
  Both of these NDAs look like fairly standard confidentiality agreements with the usual
  exclusions for public information and prior knowledge. Either one should be fine to sign to get
  the pilot moving -- we can always revisit the terms later if there's ever an issue.
