strong: |
  Remediation plan, highest risk first:

  1. Records destroyed without the required destruction-approval workflow (3 categories, no
  sign-off on file) -- Owner: Records Manager + agency counsel. Action: freeze any further
  destruction under this workflow immediately, document what was destroyed and why sign-off was
  skipped, and have legal counsel review before this finding can be closed -- improperly destroyed
  public records can carry legal exposure of their own, separate from the audit finding, if the
  agency has open-records/public-disclosure obligations that touch those record categories. Target
  closure: after counsel review, not before.

  2. 14 workstations with local admin rights beyond IT staff (least-privilege violation) -- Owner:
  IT Security. Action: audit and remove unnecessary admin rights, document business justification
  for any that remain. Target: 2 weeks.

  3. Cloud backup vendor contract missing a required data-residency clause for PII-bearing records
  -- Owner: Procurement/IT. Action: negotiate an amendment with the vendor adding the required
  clause before renewal. Target: next contract cycle, escalate if vendor resists.

  4. Incident-response plan untested for 2+ years against an annual-test policy -- Owner: IT
  Security. Action: schedule and run a tabletop exercise. Target: 60 days.

  Only Finding 1 needs legal counsel review before closure; the other three are operational
  remediations that IT/procurement can close out and report on their own timeline.
weak: |
  These are all pretty standard audit findings. We'll clean up the extra admin rights, get the
  backup contract updated, run an IR test, and be more careful about approvals for records
  destruction going forward. Should all be wrapped up within the quarter.
