strong: |
  ACCEPTABLE USE POLICY -- Draft Sections

  1. Personal Use & Monitoring: Reasonable personal use of company-issued tablets and laptops is
  permitted. The company reserves the right to monitor device and network activity, including on
  the OT/ICS network, for security and operational purposes.

  2. Prohibited Uses: (a) Opening personal email attachments on any device connected to the
  OT/ICS network; (b) connecting unapproved personal USB drives to production-line PCs. These
  restrictions exist because the OT/ICS network controls physical production equipment, where a
  compromise carries safety consequences beyond a typical office-IT incident.

  3. Disclosure & Acknowledgment: Employees will be given clear written disclosure that monitoring
  occurs before device issuance, and must sign an acknowledgment of this policy as a condition of
  receiving a company device.

  4. Consequences: Violations involving safety-critical OT systems may result in discipline up to
  and including termination, proportional to the risk created.

  5. Protected Discussions Carve-Out: Nothing in this policy's monitoring or consequences
  provisions restricts, or should be read to restrict, employees' ability to discuss wages, hours,
  or working conditions with one another -- that kind of discussion is generally protected under
  federal labor law and is explicitly outside the scope of any monitoring-based discipline under
  this policy.

  Before rollout: because employee-monitoring and discipline policies can carry state-specific
  notice requirements, have employment/privacy counsel review this draft before it's distributed
  or employees are asked to sign.
weak: |
  ACCEPTABLE USE POLICY

  Employees should use company devices responsibly. Personal email attachments and USB drives
  should be handled carefully on the shop floor. The company may monitor activity as needed.
  Violations can lead to discipline. Employees should sign off that they've read this policy
  before getting their device.
