strong: |
  Triage:

  Notification is very likely required. The summarized trigger covers unencrypted personal
  information where name is combined with SSN or account number, and this extract had unencrypted
  names and partial SSNs together -- that's exactly the trigger, regardless of the fact that the
  account numbers in the same file were encrypted.

  Safe harbor: the summarized safe harbor only applies if ALL of the personal information involved
  was encrypted. Here it wasn't -- names and partial SSNs were not encrypted, only account numbers
  were. A partial-encryption fact pattern like this does not cleanly qualify for the safe harbor
  under the standard as described, so don't treat this as a "we're covered because the account
  numbers were encrypted" situation without confirming that read with counsel first.

  Who/when: all approximately 1,200 affected members should be notified, and because that exceeds
  the 500-resident threshold, the state Attorney General must also be notified. Working from the
  July 1 discovery date, the without-unreasonable-delay standard plus the 30-day outer limit puts
  the notification deadline no later than July 31.

  This is a general triage based on counsel's own summary of the law, not a substitute for their
  final sign-off on the encryption/safe-harbor question -- loop counsel in now given the mixed
  encryption status and the GLBA safeguarding angle that sits alongside the state-law analysis.
weak: |
  Since the account numbers were encrypted, this probably falls under the safe harbor and
  notification likely isn't required. It's a good idea to keep an eye on it, but with only
  1,200 members affected this doesn't seem like it needs urgent action right now.
