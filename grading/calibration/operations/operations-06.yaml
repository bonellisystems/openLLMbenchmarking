strong: |
  Effective throughput rates: Evisceration 50 units/min (continuous). Chill tumble: 1,000
  units / 20 min per batch = 50 units/min effective -- identical to evisceration. Portioning/cut-up
  38 units/min (continuous). Packaging 42 units/min (continuous).

  The TRUE bottleneck is Portioning at 38 units/min, NOT the chill tumbler, even though chill is
  where supervisors see the largest standing queue. That queue is a normal batching artifact --
  units necessarily pile up at the chill in-feed while a full 900-unit batch accumulates -- not
  evidence of a capacity shortfall, since chill's effective throughput (50/min) exceeds
  Portioning's (38/min). The line's overall rate is capped by its slowest continuous station:
  min(50, 50, 38, 42) = 38 units/min.

  Max daily output today: 38 units/min x 480 minutes (8-hour shift) = 18,240 units, a shortfall
  of 20,000 - 18,240 = 1,760 units (8.8%) against the daily target.

  Minimum rate Portioning needs to hit the target: 20,000/480 = 41.67 units/min, roughly a 9.6%
  increase from its current 38 units/min.

  Do NOT add a second chill tumbler. Line throughput is capped by Portioning at 38 units/min
  regardless of how much chill capacity exists -- daily output would stay at 18,240 units even
  with double the chill capacity. Capital should go toward raising Portioning's rate (a second
  cut-up line, added staffing, or process improvement at that station specifically), which is the
  only lever that moves daily output.
weak: |
  The chill station is clearly the bottleneck -- it's where the biggest pile of product builds up
  on the floor, and workers are constantly waiting on a batch to finish before moving product
  downstream. Adding a second chill tumbler would relieve that backup and should let the whole
  line run closer to the 20,000-unit daily target.
