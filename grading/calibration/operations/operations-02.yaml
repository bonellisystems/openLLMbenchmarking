strong: |
  Scorecard against SLA:
  - On-time delivery: 10/12 = 83.3% actual vs. 95% required -- FAIL, a gap of 11.7 percentage
    points below target.
  - Short-load incidents: 1/12 = 8.3% actual vs. <=2% required -- FAIL, over the ceiling by 6.3
    points.
  - Slump-test quality pass rate: 12/12 = 100% -- PASS, no issue.

  Because this is the SECOND consecutive quarter this vendor has fallen below the 95% on-time
  threshold, a first-offense soft warning is no longer the appropriate response -- that
  remedy was already used last quarter and didn't fix the problem. Escalate to a formal
  corrective action plan under the contract's SLA remedy clause, with a defined improvement
  deadline and specific metrics the vendor must hit next quarter, and put the vendor on notice
  that continued non-performance after a documented corrective action plan opens the door to
  liquidated damages per the contract terms.
weak: |
