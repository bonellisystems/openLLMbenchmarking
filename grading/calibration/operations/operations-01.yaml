strong: |
  Baseline: 3.2 days average order-to-ship time, 4.5% wrong-item rate. Root cause: staff
  manually re-key the order system's pick list onto a paper pick sheet, and every re-keying step
  creates a transposition-error opportunity; orders also sit in one unsorted queue instead of
  being grouped by warehouse zone.

  Redesign: eliminate the re-keying step entirely by printing the pick list directly from the
  order system (a report/print function that almost every order system already has, no new
  software purchase needed) so pickers work from the system-generated list instead of a
  hand-transcribed copy. Batch the print queue by warehouse zone instead of one unsorted line, so
  pickers aren't crisscrossing the floor.

  Baseline -> target KPI: order-to-ship time from 3.2 days -> target 1.5 days; wrong-item rate
  from 4.5% -> target under 1.0%.

  First three implementation steps: (1) confirm the order system's built-in print/export function
  can generate a pick list formatted for the floor, and pilot it on one shift instead of the
  hand-copied sheet; (2) once validated, roll the print-direct pick list out to all shifts and
  retire the paper re-keying step entirely; (3) reconfigure the print/export to group items by
  warehouse zone so batches match the floor layout. None of this requires purchasing a warehouse
  management system.
weak: |
  The fulfillment process could probably be tightened up in general -- maybe some staff training
  on being more careful when picking orders, and reminding the team to double-check items before
  shipping. We could also look into a new warehouse management system down the road to help
  streamline things, though that would need budget approval. In the meantime, focus on general
  process discipline and quality checks before orders go out.
