strong: |
  The bottleneck is NOT department workload or headcount -- it's the once-a-week batch check of
  the shared Building Department inbox. A packet that clears Planning on a Tuesday can sit
  untouched for up to 6 business days before Building even opens it on the next Monday. That
  batching, on top of the current 12-business-day average handoff, is the dominant driver, along
  with the 30% missing-document bounce-back rate adding a further ~5-day round trip whenever
  Planning sends a packet without verifying the site survey is attached.

  Redesign: route completed Planning packets through the county's existing case-management
  system's queue/ticket feature (already licensed, no new software spend) instead of an email
  inbox that's checked weekly, so Building sees new packets as they arrive rather than in a
  Monday batch. Add a submission checklist Planning must complete (confirming the site survey and
  other required documents are attached) before a packet is marked ready to hand off, to cut the
  bounce-back rate.

  Baseline -> target KPI: handoff time from 12 business days -> target 4 business days;
  missing-document bounce-back rate from 30% -> target under 5%.

  First two implementation steps: (1) configure the existing case-management system's queue
  feature to receive Planning-to-Building handoffs directly, replacing the shared email inbox;
  (2) build and roll out the pre-send document checklist at Planning as a required step before a
  packet can be marked complete. Neither step requires new headcount or new paid software.
weak: |
  Twelve business days is a long handoff, which suggests the Building Department is stretched
  thin and could use another staff member dedicated to processing incoming applications more
  quickly. In the meantime, we'd recommend Planning and Building touch base more regularly to
  keep applications moving.
