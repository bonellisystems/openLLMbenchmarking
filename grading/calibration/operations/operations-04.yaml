strong: |
  Current capacity: 3 technicians x 40 samples/day = 120 samples/day. Forecast demand in 6 weeks:
  150 samples/day. Capacity gap: 150 - 120 = 30 samples/day.

  Additional headcount needed: 30/40 = 0.75, which rounds up to 1 additional technician (capacity
  only comes in whole-technician, 40/day increments). One more tech brings capacity to 4 x 40 =
  160 samples/day, covering the 150/day forecast with 10/day of headroom.

  Lead time to get that technician certified and productive: 1 week hiring/budget approval + 3
  weeks training/certification = 4 weeks total. Working backward from the 6-week demand-peak
  deadline: 6 - 4 = the approval process must be INITIATED no later than the start of week 2 from
  today to have the new technician validated before the peak hits. Starting today (week 0) leaves
  a comfortable 2-week buffer; starting later than week 2 risks a capacity gap right at the peak.

  Why queuing isn't a stopgap: samples must be processed within 24 hours of the blood draw per
  the trial protocol's validated stability window. A sample held past that window is invalid and
  must be discarded, not simply processed late -- so once volume exceeds 120/day, excess samples
  can't be "caught up" the next day, they're lost. Capacity has to be in place before the peak
  hits, not shortly after.
weak: |
  With enrollment ramping up, the lab should plan to bring on more staff to keep pace with
  volume. In the meantime, if things get tight before new hires are fully trained, the team can
  hold a portion of incoming samples in the queue and work through the backlog once capacity
  catches up, so nothing gets missed.
