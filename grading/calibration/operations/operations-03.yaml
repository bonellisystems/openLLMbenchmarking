strong: |
  Average lead-time demand = 140 vials/week x 2 weeks = 280 vials. The current reorder point of
  200 vials is already BELOW average lead-time demand -- meaning the current policy is expected
  to stock out even under perfectly normal demand, before any seasonal spike is even considered.
  That's the actual root cause, not bad luck during the outreach-event weeks.

  Proposed new reorder point: average lead-time demand (280) plus a safety-stock buffer sized to
  cover one spike-level week's excess pull during the lead-time window (185-140=45 extra vials)
  = roughly 325 vials. This gives coverage through a full 2-week lead time even if a spike week
  falls inside it.

  Shelf-life check: the current 560-vial order quantity is about a 4-week supply at average
  demand (560/140=4), well inside the ~8.5-week (60-day) shelf life -- no need to shrink the
  order quantity to avoid expiry waste even with the higher reorder point.

  Baseline -> target KPI: stockout incidents from 3 per 6 months -> target 0 per 6 months (or at
  minimum, zero incidents coinciding with a known, schedulable outreach-event week).
weak: |
  Since the clinic has had a few stockouts, the safest move is to substantially increase the
  standing order quantity so there's always plenty of buffer on hand -- order enough to cover
  several months at once so this doesn't come up again. That gives the clinic a comfortable
  cushion against any future demand swings.
