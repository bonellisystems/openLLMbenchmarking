strong: |
  Timeline: 11:15 PM job fails after processing 40% of 4,200 merchants (1,680); the remaining 60%
  (2,520 merchants) don't get paid that night. Automated retries fire at 11:30, 11:45, and 12:00
  AM -- a 45-minute designed window before a human should be paged. The 12:00 AM page reached the
  on-call engineer's phone, but it was set to Do Not Disturb and this alert wasn't on the
  DND-override allowlist, so the page produced no response. Actual human awareness didn't happen
  until 2:15 AM, via a merchant support ticket -- 3 hours (180 minutes) after the failure, a 4x
  overrun versus the intended 45-minute escalation window (180/45=4).

  Merchants impacted: 2,520 of 4,200 (60%).

  Root cause has two layers. The proximate technical bug -- database connection-pool exhaustion
  under load -- is real and already tracked as an open, lower-priority ticket. But that bug is
  NOT why this became a 3-hour, customer-impacting incident: a similar-severity failure should
  normally have reached a human within 45 minutes. The true driver of the incident's severity is
  the DND-override misconfiguration that silently swallowed the escalation page.

  Process fix, no new headcount: add a settlement-batch-failure severity class that bypasses DND
  entirely (or routes through a secondary channel not subject to the individual's DND settings),
  so this class of alert always reaches a human regardless of personal notification settings --
  achievable within the existing fixed on-call rotation. The connection-pool bug should still be
  fixed on its own merits, but fixing only that bug leaves the alerting gap in place, and the next
  unrelated failure -- of any kind -- would silently swallow its page the same way.
weak: |
  The core issue was the database connection pool running out under load, which caused the
  settlement batch to fail partway through. Once that gets patched and connection pooling is
  tuned properly, this class of failure shouldn't recur, which should prevent similar incidents
  going forward. We'll also review on-call staffing levels to make sure the team has enough
  coverage.
