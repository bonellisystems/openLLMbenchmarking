strong: |
  Pattern: `TXN-\d{10}-[A-Z]{3}`, used with `re.fullmatch(pattern, s)`.

  Classification of all 7 test strings:
  1. `TXN-0048291344-USD` -> MATCH (10 digits, 3 uppercase letters, exact full-string match).
  2. `TXN-9999999999-EUR` -> MATCH.
  3. `TXN-004829134-USD` -> NO MATCH -- only 9 digits before the hyphen; `\d{10}` requires
     exactly 10 and there's no way to shift the match to make it fit.
  4. `TXN-0048291344-usd` -> NO MATCH -- `[A-Z]{3}` only matches uppercase.
  5. `TXN-00482913445-USD` -> NO MATCH -- 11 digits; `\d{10}` greedily consumes the first 10,
     leaving a stray digit that can't match the following literal `-`.
  6. `TXN-0048291344-USDX` -> NO MATCH under `fullmatch` (there's a trailing `X` that isn't
     consumed by any part of the pattern, so the full string can't match).
  7. `TXN0048291344-USD` -> NO MATCH -- the literal `TXN-` requires a hyphen immediately after
     `TXN`, which isn't present.

  Why `re.search` (or an unanchored pattern) changes #6's classification: `re.search` only
  requires the pattern to occur somewhere in the string, not to consume the whole string. Since
  `TXN-0048291344-USD` (19 characters) IS a literal prefix of `TXN-0048291344-USDX`, calling
  `re.search("TXN-\d{10}-[A-Z]{3}", "TXN-0048291344-USDX")` finds and returns a match at
  position 0-19, silently ignoring the trailing "X". Only `re.fullmatch`, or explicit anchors
  `^TXN-\d{10}-[A-Z]{3}$`, force the pattern to account for every character and correctly
  reject #6.
weak: |
  You could use something like `TXN-\d+-[A-Z]+` to match the transaction IDs. This should catch
  the valid ones and reject anything that doesn't look right.
