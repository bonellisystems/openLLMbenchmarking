strong: |
  ```python
  import math

  def round_billable(minutes):
      if minutes < 0:
          raise ValueError("minutes cannot be negative")
      if minutes == 0:
          return 0.0
      increments = math.ceil(minutes / 6)
      return round(increments * 0.1, 1)
  ```

  Trace:
  - minutes=0 -> hits the explicit `minutes == 0` branch -> returns 0.0 (not rounded up to a
    phantom increment).
  - minutes=1 -> math.ceil(1/6) = math.ceil(0.1667) = 1 -> 1 * 0.1 = 0.1.
  - minutes=6 -> math.ceil(6/6) = math.ceil(1.0) = 1 (exact multiple of 6 does NOT round up to
    a second increment) -> 1 * 0.1 = 0.1.
  - minutes=65 -> math.ceil(65/6) = math.ceil(10.833) = 11 -> 11 * 0.1 = 1.1.
  - minutes=-5 -> raises ValueError before any calculation.

  The `round(..., 1)` wrapper guards against float binary representation artifacts (e.g.
  11 * 0.1 evaluating to 1.1000000000000001 in raw floating point), so the returned value is
  a clean 1.1.
