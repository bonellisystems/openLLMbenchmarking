strong: |
  Cadence going forward for Diane Okafor (Okafor & Reyes)

  Channel: email-only. Drop LinkedIn entirely from this cadence -- she specifically flagged
  getting email and a LinkedIn request together as too much for a first touch, so the corrective
  move is fewer channels, not a different mix of the same volume.

  Frequency: no more than once every two weeks, per her explicit request. Do not compress this
  even if a touch goes unanswered.

  Timing: hold a firm pause of about 6 weeks -- nothing goes out until her jury trial wraps.
  First resumed touch at week 6, a short, low-pressure email that references her trial being
  over rather than pretending the pause didn't happen. After that, subsequent touches space out
  at the two-week minimum she asked for, each brief and email-only.

  Every resumed email includes a clear opt-out: "If you'd rather not hear from us, just reply
  'unsubscribe' and we'll stop." Respecting the reduced cadence she asked for is itself part of
  earning the follow-on conversation.
weak: |
  Let's stay on Diane's radar with a solid multi-channel cadence -- weekly emails plus LinkedIn
  touches to make sure we don't lose momentum. We can dial it back slightly since she's busy
  with a trial, but staying consistently visible across channels is important so she doesn't
  forget about us while she's heads-down.
