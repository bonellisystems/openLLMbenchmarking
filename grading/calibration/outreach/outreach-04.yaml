strong: |
  Email 1 (Day 1, day after the show):
  Subject: the John Deere Operations Center integration you asked about

  Hi Derek -- great meeting you at AgriTech Solutions. You asked whether we integrate with John
  Deere Operations Center telematics, and the answer is yes -- that's actually the most common
  data source we connect for fleets your size. With 85 units across 3 depots and zero
  integration to a maintenance-planning tool today, that data is probably sitting mostly unused
  right now. Happy to show you what it looks like connected.
  Don't want future emails? Unsubscribe here: [link]

  Email 2 (Day 8):
  Subject: worth 15 minutes before budget season?

  Following up -- you mentioned next fiscal year's budget planning kicks off in about 8 weeks.
  If predictive maintenance across your 85-unit fleet is something worth building into that
  budget, now's a good window to see the numbers ahead of time rather than scrambling once
  planning starts. Unsubscribe: [link]

  Email 3 (Day 18):
  Subject: last note before budget planning starts

  I'll leave this here -- if you want the John Deere Operations Center integration details
  ready to bring into your fiscal-year budget conversation in a few weeks, just reply and I'll
  send a one-pager sized for that. Unsubscribe anytime: [link]
weak: |
  Hi Derek,

  It was great meeting you at the expo! I wanted to follow up and see if you'd be interested in
  learning more about our predictive maintenance platform. We work with a lot of companies in
  the agriculture space and think we could be a good fit. Let me know if you'd like to set up a
  call!

  Best,
  [Sender]
