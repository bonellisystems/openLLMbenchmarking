strong: |
  First-contact flow for Jordan Alvarez, RFP #PH-2026-0219 (Overlook County Public Health
  Department)

  During the quiet period (now through the award decision, ~60 days out): zero direct contact
  with Jordan Alvarez or any other evaluation-committee member -- no calls, no emails, no
  LinkedIn messages, nothing that could read as lobbying the RFP outside the official channel.
  Any question about the RFP gets routed exclusively through the county procurement office's
  official Q&A process, in writing, per the RFP's stated rules. This isn't optional caution --
  direct contact during the quiet period risks disqualification from the RFP entirely, which
  would outweigh any benefit from a premature relationship-building call.

  What we do during the quiet period: monitor the official Q&A log for any questions/answers
  relevant to our proposal, and prepare account materials for Jordan Alvarez so we're ready to
  move quickly the moment the quiet period lifts.

  After the award decision (quiet period over): if we win, move immediately into normal
  post-award onboarding contact with Jordan Alvarez. If we lose this RFP, normal outreach
  cadence can resume for any future, non-RFP-related opportunity with Overlook County Public
  Health -- but never for this specific procurement once a decision has been made.
