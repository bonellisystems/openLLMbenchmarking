strong: |
  Search intent: primarily informational. Although "cost" sounds transactional, 70% of the
  current top-10 results are pricing/cost-guide informational content averaging about 1,400
  words, with only 30% product/service pages -- the ranking pages are the clearest intent
  signal available.

  Target word count: roughly 1,400-1,600 words to match and slightly exceed the current
  informational norm.

  H2 outline:
  - What determines hydraulic cylinder repair cost (labor, parts, seal kits, cylinder size)
  - How much does it cost to rebuild a hydraulic cylinder? (direct PAA answer, with a price
    range)
  - Is it cheaper to repair or replace a hydraulic cylinder? (direct PAA answer, with a
    decision framework by damage type/age)
  - Typical repair cost ranges by cylinder type
  - When to call a specialist vs. DIY

  CTA: soft, informational-intent-appropriate -- "Get a free repair-cost estimate" rather than
  a hard "Buy Now" or "Request Quote Today" button, since this query's monthly search volume
  (720) skews toward research-stage buyers still comparing repair vs. replace.
weak: |
  Write a comprehensive article covering everything about hydraulic cylinders, including our
  full product catalog and pricing, with a strong call-to-action to request a quote right at
  the top of the page to maximize lead capture. Make sure to include the keyword "hydraulic
  cylinder repair cost" several times throughout the content, ideally once every paragraph, to
  help it rank well.
