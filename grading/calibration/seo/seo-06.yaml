strong: |
  Scope: 340 total URLs to migrate, with 28 of those (mostly technical whitepapers and case
  studies) holding 85% of the domain's referring-domain link equity -- these 28 are the
  top-priority subset.

  The critical lesson from the prior subsidiary migration: it lost 60% of organic traffic
  because every old URL was redirected to the new homepage in bulk instead of being mapped
  individually. This migration must NOT repeat that -- build a full 1:1 page-to-page redirect
  map covering all 340 URLs, matching each old URL to its specific new-page equivalent, with the
  28 high-equity backlink pages verified first and individually, since losing that concentrated
  link equity would be the costliest possible mistake.

  Additional checklist items:
  - Update all canonical tags to reference the new domain's URLs before launch.
  - Replace robots.txt on the new domain with a verified, crawl-allowing version -- confirm no
    staging Disallow: / directive accidentally ships to production, a common launch-day
    mistake.
  - Submit an updated XML sitemap for the new domain in Search Console immediately at launch,
    and keep the old domain's sitemap live briefly to aid re-crawling of the redirects.
  - Monitor Search Console for 404 and redirect-chain errors daily for the first two weeks
    post-launch.
weak: |
  For the migration, the simplest approach is to set up a single redirect rule sending all old
  URLs to the new homepage -- that way nothing 404s and visitors always land somewhere valid.
  Then just update the sitemap and let Google recrawl the new site naturally over the following
  weeks.
