strong: |
  Priority 1 (highest impact, low effort) -- 404s: 18 broken pages, mostly old
  project-portfolio pages still linked from the main nav. Fix: either restore the pages or set
  up 301 redirects from each dead URL to its closest current equivalent (a relevant live
  project or the portfolio index), and remove or update the nav links pointing to them.

  Priority 2 (high impact, low effort) -- duplicate title tags: 34 project pages share the
  same generic Yoast-generated title. Fix: customize the WordPress project post type's Yoast
  title template to pull in the project name dynamically (e.g., "%%title%% | [Firm Name]
  Project") so each of the 34 pages gets a unique title.

  Priority 3 (medium impact, medium effort) -- paginated blog series: add proper canonical
  tags to each of the 12 paginated pages (each page canonicals to itself, not page 1, under
  current guidance) or configure Yoast's pagination handling correctly to stop the
  near-duplicate-content flags.

  Priority 4 (impact clear, effort higher) -- homepage LCP at 4.8s vs. the 2.5s "good"
  threshold: compress and lazy-load hero images, defer non-critical JS, and consider a
  caching/CDN layer -- likely the largest engineering lift of the four, so sequenced last
  despite being a real ranking and UX issue.
weak: |
  Overall the site would benefit from general SEO best practices -- making sure pages have
  good titles and descriptions, keeping content fresh and updated regularly, and working on
  site speed where possible. Building quality backlinks over time will also help strengthen
  the site's authority in search results.
