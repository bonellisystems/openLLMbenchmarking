strong: |
  Baseline: 38 reviews at a 4.1-star average, versus top competitors averaging 4.6 stars
  across 150-300 reviews -- both a rating gap and a much bigger volume gap to close.

  Priority 1 -- GBP completeness: fill in the missing 60% of Google Business Profile (GBP)
  fields immediately -- holiday hours, a complete services list, and expand photos well beyond
  the current 3 (aim for 15-20 covering the clinic, staff, and common procedures).

  Priority 2 -- NAP consistency: correct the outdated address on Yelp and the outdated phone
  number on Healthgrades so name, address, and phone (NAP) match the GBP listing and website
  exactly across every directory -- inconsistent NAP data undermines local ranking signals and
  confuses potential clients.

  Priority 3 -- review generation: implement a simple post-visit review-request process
  (text/email link sent within 24 hours of a visit) with a target of growing from 38 to 100
  reviews within 6 months, closing the volume gap with competitors while working on the
  underlying rating through service-quality follow-up on any negative reviews.
weak: |
  To improve local visibility, the clinic should focus on general search engine optimization
  best practices -- posting more on social media, adding relevant keywords to the website, and
  encouraging happy customers to leave positive reviews when possible. Building more backlinks
  over time will also help improve rankings.
