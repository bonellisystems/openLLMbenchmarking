strong: |
  CTR by query: auto loan rates [state] = 62/8,200 = 0.76%. Personal loan calculator =
  480/5,100 = 9.41%. Credit union near me = 108/12,000 = 0.90%. How to refinance a car loan =
  15/3,400 = 0.44%.

  Quick win: "credit union near me," at position 9.8 with 12,000 impressions -- the highest
  impression volume of any near-page-1 query -- but only a 0.9% CTR, far below what a
  position-9-10 local-intent query should convert at. Title/snippet optimization and confirming
  local-pack eligibility could realistically lift this into the top 5-8 and capture much more of
  that existing impression volume.

  Protect, don't reinvest: "personal loan calculator" is already strong at position 3.2 with a
  9.41% CTR -- keep monitoring but no urgent action needed.

  Longer-term play: "how to refinance a car loan" sits at position 22.1 with only 3,400
  impressions and a 0.44% CTR -- this needs a dedicated content investment (a full refinance
  guide) to build rank from page 3, not a quick on-page fix.
weak: |
  All four of these keywords are performing reasonably well and could benefit from continued
  content updates and general on-page SEO improvements like better meta descriptions and
  internal linking. Building more topical authority around loan-related content over time
  should help improve rankings across the board.
