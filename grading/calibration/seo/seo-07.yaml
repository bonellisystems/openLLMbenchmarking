strong: |
  This is keyword cannibalization: three pages competing for the same "hipaa training" intent,
  causing Google to alternate which one it ranks week to week (positions 6-14, never breaking
  into the top 5) and fragmenting authority so badly that 4,200 combined monthly impressions
  convert to only 95 clicks.

  Primary page: /hipaa-training should be the designated target for the head term -- it has by
  far the most authority at 45 referring domains, versus 8 for
  /hipaa-compliance-training-for-employees and 3 for /online-hipaa-training-courses.

  Resolution: consolidate the weakest page, /online-hipaa-training-courses (3 referring
  domains, narrowest scope), by merging its unique content into /hipaa-training and
  301-redirecting it. Re-scope /hipaa-compliance-training-for-employees toward a genuinely
  distinct intent (e.g., an employee-specific training-program purchase page rather than
  general information) and add a canonical or clear internal link back to /hipaa-training for
  the general term, so the two pages stop competing for the same query.

  Internal linking: update main navigation, related-resources modules, and any blog posts
  currently linking to any of the three pages so they all point to /hipaa-training with
  consistent "HIPAA training" anchor text for the head term, reserving links to the other two
  pages for their newly distinct, more specific intents.
weak: |
  All three pages are relevant to HIPAA training topics, so it's probably fine to keep them all
  live and just make sure they each have good internal links pointing to related content on
  the site. Adding more blog posts about HIPAA compliance over time should help build up
  authority across the board.
