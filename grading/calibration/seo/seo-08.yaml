strong: |
  Baseline: 28,000 average monthly organic sessions, down to 16,240 post-relaunch -- a 42%
  drop within 30 days.

  Ruling out the obvious hypotheses: content-quality decline is contradicted directly -- the
  content team confirms no page content was rewritten or removed, only the template/design
  changed. An algorithm update is ruled out since none was announced in this window. A manual
  action is ruled out since there's no manual action notice on the account.

  Most likely cause: a technical indexation/canonical regression introduced by the new
  template, not a content or algorithmic issue. The evidence: "Crawled - currently not indexed"
  pages jumped from a baseline of about 40 to 1,100 since the relaunch, and "Duplicate, Google
  chose different canonical than user" jumped from near-zero to 380 URLs -- both spikes are
  coincident with the relaunch date, and both are classic symptoms of a canonical-tag
  misconfiguration in the new templating (e.g., self-referencing canonicals pointing to the
  wrong URL, or a URL-structure change without a matching redirect map causing Google to see
  many pages as duplicates of each other).

  What to check first, in order: (1) inspect the canonical tag output across a sample of
  affected page templates to confirm they self-reference correctly; (2) check robots.txt on the
  live domain to rule out an accidentally-shipped Disallow directive from staging; (3) audit
  whether the redesign changed URL structure and, if so, whether old URLs redirect (301) to
  their correct new equivalents rather than 404ing or falling back to a default canonical.
weak: |
  The traffic drop is concerning and could be related to a recent Google algorithm update
  affecting government sites, or possibly a decline in content quality that search engines are
  picking up on. Recommend refreshing older content across the site and monitoring for the next
  few weeks to see if rankings recover on their own.
