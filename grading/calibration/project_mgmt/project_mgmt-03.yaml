strong: |
  Status, by workstream:
  - Data migration: GREEN. 92% complete, on track, no open issues.
  - Integration testing: RED. Blocked on vendor sandbox credentials, now 6 business days past
    the vendor's own promised date with no new ETA. This is a critical-path blocker, not a minor
    delay.
  - Staff training: AMBER (not started, but not yet late on its own start date) -- however, it
    is structurally at risk because it cannot start until integration testing clears, and it
    needs 11 days of runway before the Aug 15 go-live (training is scheduled to start Aug 4).
    If integration testing doesn't clear soon, training's own start date starts slipping too.
  - Budget: GREEN. $42,000 of $65,000 spent, tracking to plan.

  Overall status: RED. Three of four areas looking fine does not offset the fact that the
  critical-path blocker (integration testing) directly threatens the hard Aug 15 go-live date
  through its dependency on training's 11-day runway requirement. An honest report cannot round
  this up to Amber just because the other workstreams look good in isolation.

  Recommended escalation: do not simply "monitor and wait" on the vendor. Escalate today to the
  vendor's account manager with a firm ask for a committed new ETA, and in parallel start
  evaluating a fallback (e.g., a shared/generic sandbox environment) that could let integration
  testing begin even partially before the vendor delivers dedicated credentials, so training's
  11-day runway isn't lost entirely to the vendor's timeline.
weak: |
  Overall we're in decent shape this week -- Amber, trending toward Green. Migration is basically
  done, budget's on track, and the team is fully staffed with no attrition risk. The vendor
  credentials for integration testing are running a bit behind, but that's a fairly normal kind
  of delay and shouldn't be a big deal in the end. We'll keep monitoring it and update again next
  week.
notes: |
  Weak answer calls the week "Amber, trending toward Green" and characterizes the vendor
  blocker as "a fairly normal kind of delay" that "shouldn't be a big deal," recommending
  "keep monitoring" rather than escalating -- the anchors' RAG-honesty failure mode this fixture
  targets, since it lets three green-looking areas paper over a real critical-path risk. Fails
  the RED regex (never uses the word, uses Amber instead), fails the 92 numeric signal (says
  migration is "basically done" without restating the actual percentage), and fails the 11
  numeric signal (never computes or states the training-runway requirement). It does mention
  "vendor credentials," so that evidence regex passes.
