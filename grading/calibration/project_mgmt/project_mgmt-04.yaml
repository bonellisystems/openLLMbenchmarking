strong: |
  Priority: Riverside. It carries a hard external deadline -- the city submittal window this
  Friday -- and missing it means a 6-week delay before the next permit window opens. Harborview's
  review has no external deadline this week and carries 2 weeks of schedule float before it
  affects Harborview's timeline at all.

  Capacity check: Priya's nominal 40 hours/week isn't really 40 productive hours -- roughly 4
  hours/week goes to unavoidable meetings/admin, leaving 36 productive hours. Riverside's 24-hour
  need plus that ~4-hour overhead = 28 hours, which fits comfortably inside the 36 productive
  hours. That leaves about 8 spare productive hours this week.

  So Riverside's full 24 hours should be protected as-is. Of Harborview's 16-hour ask, up to
  about 8 hours could still happen this week inside that spare capacity if useful, but the
  remaining ~8 hours should be explicitly deferred into Harborview's 2-week float rather than
  forced in -- there's no need to compress Harborview's timeline just because it's on the same
  week as Riverside.

  If Riverside were deprioritized instead: the firm would miss the city's permit submittal
  window entirely, triggering a 6-week project delay until the next window opens -- a far worse
  outcome than deferring part of Harborview's flexible, float-cushioned review by a few days.
weak: |
  Priya has 40 hours available and the two projects need 40 hours combined, so it works out
  evenly if she just splits her time between Riverside and Harborview this week and gets both
  done in full. No real conflict here as long as she manages her time well.
notes: |
  Weak answer takes the 24+16=40 raw-hours match at face value as "no real conflict" (restating
  only the combined 40-hour total, never the 24-hour Riverside figure on its own), never accounts
  for unavoidable overhead (so never derives the actual 36 productive hours), never invokes
  Harborview's schedule float as the reason it can flex, and never prioritizes Riverside or
  quantifies the 6-week permit-window delay risk. Fails all four signals: no 24, no 6, no float
  language, and no 36.
