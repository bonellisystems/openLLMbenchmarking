strong: |
  Dependency order: T1 (vendor contract signature) must happen first -- everything else depends
  on it directly or indirectly. Once T1 is done, T2 (HIPAA security risk assessment) and T3
  (training content build) can both start -- they can run in PARALLEL, since each only depends
  on T1 and not on each other. T4 (EHR integration) depends on T2 and can only start once the
  security risk assessment clears. T5 (compliance sign-off) depends on both T2 and T4. T6
  (training delivery) depends on both T3 and T4. Go-live depends on both T5 and T6.

  T2, the HIPAA security risk assessment, is the single blocking prerequisite for the most
  downstream work: T4 depends directly on it, T5 depends directly on it (twice over, in effect,
  since T5 also depends on T4 which itself depends on T2), and T6 depends on it indirectly
  through T4. In effect, every task except T3 depends on T2 either directly or transitively.

  Rushing or skipping T2 to save time would be the highest-risk shortcut on the whole board, even
  though it sits early and isn't adjacent to Go-live -- a system that handles PHI cannot be
  connected to the EHR (T4) or approved for go-live (T5) without a real, completed HIPAA risk
  assessment, so cutting corners here doesn't just create schedule risk, it creates a compliance
  gate failure that blocks nearly the entire downstream chain.
weak: |
  The order is basically: sign the contract, then build out training, get the system assessed,
  connect it to the EHR, and go live once everything's ready. Most of this can happen back to
  back in sequence, and the team should just work through the list in order to keep things
  simple and avoid confusion about what's next.
notes: |
  Weak answer describes a purely SEQUENTIAL ordering with no parallel work identified, never
  names T2 (the HIPAA security risk assessment) as the critical blocking prerequisite, and never
  uses the term HIPAA at all. Fails the HIPAA regex, fails the parallel regex (explicitly argues
  against parallelizing -- "work through the list in order"), fails the "security risk
  assessment" regex (never names it), and fails the T2 contains-check (never references any task
  by its ID).
