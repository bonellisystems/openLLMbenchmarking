strong: |
  Charter: Objective -- deploy the new POS system to all 18 stores within the 10-week window,
  on budget, with no more than 3 stores offline for cutover at once, and fully complete before
  the Black-Friday freeze. In-scope: POS hardware/software cutover, staff training, go-live
  support per store. Out-of-scope: any new store openings, any non-POS system changes, any
  cutover work during the 2-week freeze itself.

  Wave math: 18 stores / 3-store simultaneous cap = 6 rollout waves minimum. Usable deployment
  window: the 10-week project minus the 2-week Black-Friday freeze = 8 weeks available for
  actual cutovers. Six waves inside an 8-week usable window is workable at roughly one wave per
  week, which leaves about 2 weeks of schedule buffer before the freeze begins -- call this out
  explicitly as a constraint satisfied with margin, not just "it'll probably fit."

  Roles: PM owns sequencing/vendor coordination; the 2 implementation engineers execute the
  hardware/software cutover per wave; the trainer runs go-live training per wave.

  Top risks: (1) Trainer capacity -- one trainer covering up to 3 stores per wave is the
  tightest resource in the plan; owner: PM, mitigation: stagger wave cutover days within a week
  so the trainer isn't covering 3 stores simultaneously. (2) Any wave slipping past its week
  eats directly into the 2-week buffer before the freeze; owner: PM, mitigation: track wave
  completion weekly and pull forward a later wave if an earlier one slips. (3) The
  ≤3-stores-at-once rule being violated under schedule pressure near the freeze; owner: Ops
  lead, mitigation: hard-gate wave scheduling against the 3-store cap regardless of time
  pressure.
weak: |
  We'll kick this off with the standard rollout phases: planning, execution, and closeout.
  During planning we'll finalize the store list and vendor coordination; during execution we'll
  roll out to stores in batches; during closeout we'll confirm everything is live and hand off
  to support. The team should be able to get through all 18 stores comfortably within the
  10-week window.
notes: |
  Weak answer uses generic phase labels (planning/execution/closeout) with no reference to the
  3-store simultaneous cap, the Black-Friday freeze, or any computed wave/week arithmetic --
  exactly the anchors' "adequate" ceiling example ("a phase list that could describe almost any
  project"). Fails the 6 numeric signal (no wave count computed), fails the 8 numeric signal (no
  usable-window computed), and fails the black-friday/freeze regex entirely (never mentions the
  freeze constraint at all, despite it being a stated hard constraint).
