strong: |
  Forward pass (ES/EF): T1 0-5. T2 5-9 (after T1). T3 0-20 (no predecessor). T4 5-11 (after T1).
  T5 starts once T2, T3, AND T4 are all done: max(EF T2=9, EF T3=20, EF T4=11) = 20, so T5 is
  20-28. T6 28-33 (after T5). T7 28-31 (after T5). T8 (go-live) starts once both T6 and T7 are
  done: max(33, 31) = 33, so T8 is 33-33.

  Total project duration: 33 days.

  Backward pass (LS/LF) from a 33-day deadline: T8 LS=33. T6 LF=33, LS=28. T7 LF=33, LS=30. T5
  LF=min(28,30)=28, LS=20. T3 LF=20, LS=0. T4 LF=20, LS=14. T2 LF=20, LS=16. T1 LF=min(16,14)=14,
  LS=9.

  Float: T1=9, T2=11, T3=0, T4=9, T5=0, T6=0, T7=2, T8=0.

  Critical path: T3 -> T5 -> T6 -> T8 (20+8+5+0 = 33 days), all with zero float.

  This is counterintuitive: T3 (equipment procurement, a 20-day vendor lead-time item with no
  visible on-site activity) is what actually drives the schedule, not the construction chain
  (T1-T2 or T1-T4 feeding T5), which totals at most 11 days into T5 and carries 9-11 days of
  float. Floor supervisors watching site work would naturally assume the visible construction
  activity is critical, but it's the "invisible" procurement lead time sitting in parallel that
  has zero slack -- if it slips even a day, the whole project slips a day; the construction chain
  could slip by up to 9-11 days with no schedule impact at all.

  Among non-critical tasks, T7 (operator training, 3 days, float=2) has the LEAST float and is
  the biggest hidden risk -- if training runs more than 2 days over its 3-day estimate, it flips
  onto the critical path itself.
weak: |
  Looking at the plan, the critical path is clearly the construction sequence: site prep, then
  electrical rough-in, then equipment installation, commissioning, and go-live -- that's the
  chain of physical work that has to happen in order, so it drives the 33-day-ish total. The
  procurement task is just background ordering that happens in parallel and shouldn't be on the
  critical path since nothing is actively "being done" during that time.
notes: |
  Weak answer asserts the construction chain is critical purely by intuition ("the chain of
  physical work... drives the total") without computing ES/EF/LS/LF or float for any task, and
  explicitly (and incorrectly) dismisses procurement from the critical path -- exactly the trap
  the fixture is built to catch. Fails the T3 regex (never claims T3 is critical -- explicitly
  argues the opposite), fails the float regex (never computes float for anything), and fails the
  20 numeric signal (never states T3's 20-day duration as the schedule driver). It does land on
  "33-ish" for the total, so the 33 numeric signal may pass depending on how that's read, but the
  critical-path identification itself is wrong.
