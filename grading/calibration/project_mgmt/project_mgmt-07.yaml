strong: |
  Baseline: S1 0-10, S2 0-15, S3 10-14, S4 14-17, S5 starts once both S4 and S2 are done: max(17,
  15)=17, so S5 is 17-23, S6 23-28, S7 28-30. Baseline duration: 30 days. Baseline critical path:
  S1-S3-S4-S5-S6-S7 (10+4+3+6+5+2=30), all zero float. S2 has 2 days of float (it only needs to
  finish by day 17 when S5 needs it, but finishes at day 15).

  Scope change (EMQ added, 15 days, starts after S2, feeds S5 alongside S4): S1 0-10, S2 0-15
  (unchanged), S3 10-14, S4 14-17, EMQ starts after S2 at day 15, so EMQ is 15-30. S5 now starts
  once S4, S2, AND EMQ are all done: max(17, 15, 30)=30, so S5 is 30-36, S6 36-41, S7 41-43.

  New total duration: 43 days. Schedule impact: 43-30 = 13 days -- NOT a naive "+15 days," since
  EMQ overlaps partly with time that was already elapsing on the S2/S4 side; the actual slip is
  13 days.

  New critical path: S2-EMQ-S5-S6-S7 (15+15+6+5+2=43), all zero float.

  What happened to the old critical path (S1-S3-S4): it is NO LONGER critical. It still finishes
  at day 17 as before, but S5 no longer needs it until day 30 (gated by EMQ instead), so S1-S3-S4
  now has 13 days of slack (LS on S1 moves from 0 to 13). This is the key finding: the critical
  path shifted from the equipment-installation/calibration/documentation chain to the
  utility/HVAC-cert-plus-environmental-monitoring chain.

  EMQ's 15-day duration is given by the facility's standard environmental monitoring SOP, which
  requires a minimum continuous 15-day particle-count cycle to establish a statistically valid
  baseline -- that is the estimate basis, and I'm using it as given rather than substituting a
  different number. Since EMQ is a regulatory-floor requirement, it likely cannot be compressed;
  the one lever worth exploring is whether EMQ can start any earlier by beginning HVAC
  certification (S2) sooner, since EMQ is gated entirely by S2's completion, not by anything
  else in the network.
weak: |
  Adding the new 15-day EMQ (environmental monitoring) step is a straightforward addition -- just
  tack it onto the end of the existing 30-day plan, so the new total comes to 45 days. The
  original critical path (equipment installation, calibration, and IQ documentation) still holds;
  we're just adding one more sequential step after PQ and before go-live. The team should plan
  for a 45-day timeline now.
notes: |
  Weak answer commits the naive linear-add trap this fixture is built to catch (30+15=45,
  instead of the correct 43-day recomputation that accounts for EMQ's partial parallelism with
  the existing S2/S4 chain), and asserts the OLD critical path "still holds" -- the opposite of
  the correct finding that it gained 13 days of slack and is no longer critical. It also
  misplaces EMQ as happening "after PQ and before go-live," when it actually gates OQ (S5), much
  earlier in the sequence. Fails the 43 numeric signal (states 45 instead), fails the 13 numeric
  signal (implies a 15-day slip, not 13), and fails the slack/float regex (never mentions slack
  or float on the old chain -- claims the opposite, that it "still holds"). It does mention "EMQ"
  by name, so that regex signal passes.
