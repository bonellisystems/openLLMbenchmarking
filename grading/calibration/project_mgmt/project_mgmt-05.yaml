strong: |
  Risk register:

  1. Compressor seal vendor slippage. Description: replacement seal is on backorder; this
  vendor has slipped an average of 2 days on each of the last 3 orders. Likelihood: high (a
  consistent historical pattern, not a one-off). Impact: high -- a 2-day slip alone would push
  restart 2 days past Day 6, costing 2 x $40,000/day = $80,000 in delivery penalties. Owner:
  Procurement lead. Mitigation: place the order with explicit buffer against the vendor's
  historical 2-day average slip, and identify a backup seal supplier now, before it's needed.

  2. Welding contractor single-crew / overrun risk. Description: only 1 certified pressure-
  vessel welding crew available, no backup, and this scope has run 8-14 hours over schedule
  about 1 in 3 times historically. Likelihood: moderate (~1-in-3 historical rate). Impact:
  moderate-to-high -- an overrun of a day or more directly threatens the Day-6 restart and the
  $40,000/day penalty. Owner: Turnaround site supervisor. Mitigation: pre-negotiate access to a
  second regional crew on standby, and front-load the welding scope earlier in the 5-day window
  to absorb an overrun without threatening restart.

  3. Day-3 wind advisory halting crane work. Description: 40% chance of a high-wind advisory on
  Day 3 that would stop all crane-lift work needed for the compressor swap. Likelihood: 40%
  (given). Impact: high if it hits, since it directly delays the compressor swap on the critical
  path. Owner: Turnaround planner. Mitigation: build a 1-day weather contingency buffer into the
  Day-3 crane-lift schedule, or shift crane-dependent work earlier if the forecast firms up.

  The single risk that most threatens the Day-6 restart if it materializes is the compressor
  seal vendor slippage, because it has the most consistent historical pattern (2 days on all
  last 3 orders, not just a probability) and directly delays the critical compressor swap before
  any downstream work can start. If the turnaround finishes 2 days late, the dollar exposure is
  2 x $40,000 = $80,000.
weak: |
