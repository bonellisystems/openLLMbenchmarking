strong: |
  Pricing-Negotiation Guardrails -- Harvest Line Equipment (200-sensor deployment)

  List price: $1,200/sensor x 200 sensors = $240,000/year.

  Rep discount authority: up to 15% off list, or $204,000/year, can be approved unilaterally by
  the account team with no further sign-off required.

  Harvest Line's ask: a 3-year contract in exchange for 20% off list, or $192,000/year. That
  20% ask sits below the $204,000 unilateral floor, so it exceeds rep discount authority and
  requires VP of Sales approval given the margin impact of a discount that deep on a multi-year
  commitment.

  Recommended counter: offer the full 15% ($204,000/year) tied to the same 3-year term the
  customer is already asking for, which we can approve today without escalation. If Harvest
  Line pushes past 15%, take the ask to the VP of Sales with the 3-year term and total contract
  value ($612,000 over 3 years at the 15% rate) before agreeing to anything beyond $204,000/year.
weak: |
  Harvest Line wants a good deal on 200 sensors, and a 20% discount seems reasonable to get this
  contract signed, especially with a 3-year commitment attached. We should have some flexibility
  to approve this quickly to keep the deal moving and not lose momentum with the customer.
