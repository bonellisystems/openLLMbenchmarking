strong: |
  Talk track -- displacing DrillTrack at Continental Pipeline Services

  Open by naming the real gap, not a fabricated one: "You've run DrillTrack for 8 years, and it
  works, but your inspectors are still filling out paper forms in the field and your team
  re-keys that data back at the office -- that's roughly a 3-day lag before an inspection result
  is even visible in the system. Our platform captures that data on mobile, in the field, in
  real time. Same-day visibility instead of a 3-day lag."

  On price, address it head-on rather than avoiding it: "Yes, our list price is $110,000/year
  versus DrillTrack's $95,000 -- that's $15,000 more on paper. But you're currently paying about
  $40,000/year in labor for two staff re-keying paper forms into DrillTrack, work that goes away
  entirely with real-time mobile entry. Net that out and switching saves Continental about
  $25,000/year, not counting the value of same-day data instead of a 3-day lag."

  Close: propose a 2-week pilot with one field crew, comparing time-to-visible-data against
  DrillTrack's current process, with a decision checkpoint at the end of the pilot.
weak: |
  DrillTrack is outdated technology and honestly can't compete with what we offer -- our
  platform has better reporting, a nicer interface, and way more features overall. We're
  confident once Continental sees a demo they'll want to switch. Price shouldn't really be a
  concern since the value we provide more than justifies the investment.
