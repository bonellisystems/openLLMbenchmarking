strong: |
  Hand-off summary -- Ridgeline Structural Engineering

  Deal: 45 seats at $840/seat/year, for a total annual contract value of $37,800. Start date:
  August 1.

  Onboarding priority #1: import Ridgeline's 12 currently active projects before go-live so
  their team isn't working from a blank slate on day one.

  Hard requirements -- do not treat these as optional:
  - Integration with ProjectWise, Ridgeline's existing document management system. This was a
    contractual hard requirement during the sales cycle, not a preference.
  - Mandatory two-factor authentication (2FA) enabled for every user from day one. The champion,
    Director of Operations Sana Ruiz, was firm on this during negotiation -- do not launch any
    user without it enabled.

  Primary contact for onboarding: Sana Ruiz. Recommend scheduling the kickoff call with her in
  the next 5 business days to lock the ProjectWise integration scope before the August 1 start
  date.
weak: |
  We closed a new deal with Ridgeline. They're excited to get started and the team seems easy
  to work with. Standard onboarding process applies -- get them set up with logins and walk
  them through the platform basics. Let me know if you have any questions about the account.
