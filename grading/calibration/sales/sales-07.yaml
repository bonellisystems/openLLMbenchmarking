strong: |
  Renewal-at-risk save plan -- Northfield Regional Health System ($54,000/year, renews in 45
  days)

  Real risk driver: this isn't a generic "usage is down" problem. Dr. Elaine Cho, the Chief
  Compliance Officer who personally championed the rollout and drove Q1 completion to 85%, left
  the organization 4 months ago. Since then, completion has collapsed to 40% and compliance-
  department logins are down 70% month-over-month -- and the interim compliance lead, Grace Liu,
  has never once logged into the platform. The account isn't failing because the product stopped
  working; it's failing because the champion left and no one has picked up ownership.

  Plan, working backward from the 45-day renewal date:
  1. This week: request a 30-minute executive call with Grace Liu specifically -- not a generic
     "checking in on renewal" call, but a "let's get you set up as the new platform owner" call,
     acknowledging she inherited this with zero handoff from Dr. Cho.
  2. Week 2: run a short live walkthrough for Grace Liu and her team, focused on rebuilding basic
     platform familiarity from zero, plus a report showing the Q1-to-Q2 completion drop so she
     understands the compliance exposure she's inheriting.
  3. Week 3: help Grace Liu draft an internal reminder to staff re-establishing training
     expectations, positioning her as the new sponsor.
  4. By day 40: confirm renewal with a written commitment from Grace Liu as the new named
     executive sponsor, not just a signed PO with no owner behind it -- to prevent this same
     ownership gap from recurring next cycle.
weak: |
  Usage has dropped a bit this quarter, but that's pretty normal fluctuation. We should send a
  reminder email to the compliance team encouraging them to log more training completions before
  renewal, and maybe offer a small discount to make sure they renew on time.
