strong: |
  Call goal: confirm Dr. Patel is ready to move off the 15-year-old desktop scheduler onto a
  platform that directly attacks the two pains she already named, and leave the call with a
  scheduled demo date -- since she's the sole decision-maker, there's no committee to loop in
  before that can happen.

  Questions to ask, each tied to what she already told us:
  1. "You mentioned an 18% no-show rate -- do you know roughly what that costs you in lost
     exam-slot revenue per month?" (quantify the pain in her own terms before pitching)
  2. "Your front desk spends about 2 hours a day on manual reminder calls -- if that dropped to
     near zero with automated text/email reminders, what would that staff time go toward
     instead?"
  3. "Walk me through what a missed appointment actually costs you -- the exam slot, or does it
     cascade into rescheduling headaches too?"
  4. "Who else, if anyone, needs to sign off before you'd move forward -- or is this your call
     alone?" (confirm the single-decision-maker assumption directly)

  Next step: propose a 20-minute live demo this Thursday at 2pm focused specifically on the
  automated no-show reminder workflow, since that's the pain she led with -- not a generic
  full-platform walkthrough.
weak: |
  Great, thanks for the intro call! For the next conversation, I'll plan to walk Dr. Patel
  through all of our platform's features -- scheduling, billing, e-prescribing, reporting, and
  more. We'll cover the full feature set so she can see everything we offer. I'll ask some
  general questions about her practice's needs and pain points, and we'll figure out next steps
  from there, maybe circle back in a couple weeks.
