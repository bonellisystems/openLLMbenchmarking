strong: |
  Executive Summary -- Fraud Detection Platform Proposal for Palisade Community Bank

  Year 1 total investment: $87,000, comprising the $60,000/year core platform license, the
  $15,000 one-time implementation and onboarding fee, and the $12,000/year real-time
  transaction-alerting add-on your compliance team requested. This is a one-time-elevated year:
  the implementation fee applies only in year 1.

  Ongoing annual cost from year 2 onward: $72,000/year ($60,000 platform license + $12,000
  add-on), with the $15,000 implementation fee dropping off entirely once onboarding is
  complete.

  This structure gives the board a clear, board-ready number for approval: $87,000 to launch,
  stepping down to a steady-state $72,000/year -- a figure that reconciles cleanly against the
  itemized scope above with no hidden costs.
weak: |
  We're excited to propose our fraud detection platform to Palisade Community Bank. The
  investment is a great value considering the risk reduction and compliance benefits. Total
  cost will be in the ballpark of $75,000 or so for the first year, with similar costs
  continuing in future years. We're confident the board will see this as a smart investment for
  the bank's fraud prevention strategy.
