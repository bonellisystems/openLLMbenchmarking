strong: |
  Segmentation plan: split the current flat 10.10.0.0/22 into at least four VLANs -- EHR
  (application server + clinical workstations), medical IoT (infusion pumps, patient monitors),
  guest WiFi, and back-office admin -- each on its own subnet, with the guest VLAN routed only
  to the internet, never to any internal VLAN.

  Closing the specific gap: the finding was that a guest-WiFi laptop could reach the EHR server
  directly over RDP (port 3389, no ACL). Once guest traffic is on its own VLAN, add an explicit
  inter-VLAN ACL/firewall rule denying guest-VLAN -> EHR-VLAN entirely (not just blocking port
  3389 -- block the VLAN-to-VLAN path outright, since leaving other ports open would just move
  the exposure to a different service). Medical IoT should similarly be denied any inbound
  access from guest or admin VLANs, with only the specific EHR-integration traffic it needs
  explicitly allowed outbound.

  Change plan and downtime: because the clinic cannot tolerate EHR downtime 8 AM-6 PM, do the
  VLAN re-IP and ACL cutover after 6 PM, verify normal EHR-workstation-to-server connectivity
  immediately after the change (before providers arrive the next morning), and keep the old flat
  ACL/switch config exported and ready to reapply as a rollback if the new ACLs unexpectedly
  block legitimate EHR-to-workstation or EHR-to-billing traffic discovered only once staff are
  back on the network.
weak: |
  We noticed the network isn't really segmented well, so we'd recommend setting up VLANs at some
  point to improve security. In general it's good practice to separate guest WiFi from the rest
  of the network. We can look at firewall rules and IoT device policies as part of a broader
  network review. We'll get this scheduled and keep you posted on progress.
