strong: |
  Cutover approach: Exchange 2016 is already past end of support, which cuts against a slow,
  long-staged hybrid migration that keeps the unsupported source environment running for months
  -- every extra week on Exchange 2016 is unpatched-vulnerability exposure with no vendor fixes
  coming. Instead, run a hybrid migration but compress the timeline: stand up Exchange hybrid
  connectivity, then migrate mailboxes in scheduled batches by branch/time-zone group so no
  branch loses email during its own 9-5 hours, targeting full completion well inside a few weeks
  rather than drawing it out for the full 45 days available.

  Chain-of-custody / retention: use a native mailbox-move (not export/import or a third-party
  PST-based tool) so message metadata, including original delivery timestamps, is preserved
  bit-for-bit as required, and log each batch's migration report as the documented chain of
  custody for the regulatory retention obligation.

  Sequencing against the core-banking cutover: the core-banking conversion goes live in 45 days.
  Schedule the LAST mailbox batch to complete at least a full week before that cutover week, and
  put a hard freeze on any further mailbox migration activity during the core-banking cutover
  week itself -- both teams cannot be in a change window simultaneously. Blast radius of getting
  this wrong: if email migration is still in progress or unstable during the core-banking
  cutover week, branch staff lose reliable email exactly when they need it most to field
  customer questions about the new core-banking system, compounding two simultaneous outages
  into one much harder incident to triage and communicate around.

  Rollback: if a mailbox batch fails partway, leave the successfully-migrated mailboxes in M365
  and do not migrate the remainder of that batch again until the cause is found -- keep the
  not-yet-migrated users' mail flowing on the original Exchange 2016 environment (still
  functional, just unsupported) rather than leaving anyone without a working mailbox mid-batch.
weak: |
  We'll plan to migrate the 340 mailboxes from Exchange 2016 to Microsoft 365 over the next
  couple of months, doing it gradually so we don't disrupt anyone. We'll pick times that work
  around branch hours as best we can and keep both teams in the loop. This should align fine
  with the core-banking project timeline and we don't expect any major issues.
