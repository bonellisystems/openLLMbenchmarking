strong: |
  Gaps against RPO/RTO: nightly-only backups mean up to 24 hours of data loss on a bad day, far
  outside the required 4-hour RPO -- you'd need at least 4-hourly incremental/transaction-log
  backups of the SQL Server database to meet that. RTO of 8 business hours is plausible IF a
  restore has actually been validated to work in that time, but with no tested restore in 18
  months, the firm currently has no evidence the 8-hour RTO is even achievable -- it could be
  much worse, or the backups could simply fail to restore at all.

  Ransomware resilience gap: the backup NAS sits in the same closet, on the same network segment,
  and is domain-joined using a domain service account. That is a single point of failure -- a
  domain-credential-based ransomware event (exactly what hit the peer firm) can reach and encrypt
  both production AND backups in one incident, because the backup target is reachable with the
  same compromised domain credentials. Blast radius if this isn't fixed: a single ransomware
  event could destroy both live case data and the only backup copy simultaneously, leaving the
  firm with zero recovery path for privileged case files under active client matters -- total,
  not partial, data loss.

  Remediation, in priority order: (1) add an offsite or immutable backup target that is NOT
  domain-joined and not reachable with domain credentials (e.g., cloud backup with
  object-lock/immutability, or an air-gapped rotation), so a domain compromise can't touch it;
  (2) increase backup frequency to meet the 4-hour RPO; (3) formally schedule quarterly restore
  tests going forward. Critically: do NOT decommission or overwrite the existing nightly-NAS
  backup regime until a full restore has been tested end-to-end against the new setup -- given 18
  months without a verified restore, there's a real chance the current backups don't actually
  work, and retiring them before proving the replacement restores cleanly could leave the firm
  with no working backup at all during the transition.
weak: |
  The backup setup here isn't great -- no offsite copy and backups haven't been tested in a
  while. We'd recommend moving to a cloud backup solution to replace the current NAS setup and
  decommissioning the old NAS once the new one is configured, which should get you a much better
  RPO/RTO. We can get a quote together for cloud backup licensing and have this stood up in the
  next few weeks.
