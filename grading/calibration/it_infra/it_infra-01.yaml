strong: |
  Right-sizing: current utilization is sustained 91% CPU for ~20 minutes at each of the three
  daily shift changes -- that is a real, recurring peak, not a one-off spike, so size for it
  with headroom rather than for the calmer baseline between shift changes. Recommend moving
  from 8 vCPU/32GB to 12 vCPU/48GB. That gives roughly 33% more CPU headroom over the 91%
  observed peak (targeting sustained utilization in the 65-70% range even during the burst) so
  a slightly larger re-sync burst doesn't immediately re-saturate the VM, and the added RAM
  gives the OS more file-cache room for the scan-log writes.

  Storage: 82% full and growing ~23GB/week from lot-tracking logs that must be retained for 2
  years under USDA rules -- you cannot solve this by purging old logs. Instead, add a second
  attached data volume (e.g., 1TB) dedicated to lot-tracking logs older than 90 days, moved
  there by a scheduled job, so the OS/application volume stops filling while the full 2-year
  retention is preserved untouched, just relocated. Size the new volume for at least 3 years of
  growth at the current ~23GB/week rate to avoid revisiting this again soon.

  Timeline: because the plant cannot tolerate scanner downtime during any of the three daily
  shift changes (07:00, 15:00, 23:00) -- a coverage gap there is itself a USDA finding -- do the
  vCPU/RAM resize and the storage attach in a single maintenance window scheduled well clear of
  all three windows, e.g., mid-morning around 10:00-11:00, when the VM is furthest from the next
  shift-change burst. Snapshot the VM before the resize so you can roll back immediately if the
  hypervisor-level change causes any issue, and verify scanner sync succeeds cleanly through the
  very next shift change afterward before considering the change complete.
weak: |
  This server is getting pretty loaded, so we'd recommend bumping it up to a bigger VM with more
  CPU and RAM to handle the extra load, maybe double the specs to be safe. For storage, since
  it's getting full, we can clean up some of the older log files to free up space, or just add a
  bigger disk. We can schedule the upgrade for whenever there's a slow time on the plant floor.
  Should be a quick change with minimal downtime. Let us know if you'd like us to proceed.
