strong: |
  The "rates are being cut" narrative is WRONG. Both payers are reimbursing at exactly their
  budgeted per-visit rate: Commercial is still $220/visit and Medicare is still $110/visit,
  unchanged from budget. Total visit volume is also unchanged (2,000 budgeted = 2,000 actual).

  Total revenue variance: actual $319,000 - budget $352,000 = -$33,000 (-9.375%).

  Decomposition:
  - Rate variance = $0. Neither payer's per-visit rate moved from budget.
  - Volume variance = $0. Total visits are identical to budget (2,000 = 2,000).
  - Mix variance = the entire -$33,000. 300 visits shifted from Commercial to Medicare (Commercial
    fell from 1,200 to 900 visits, Medicare rose from 800 to 1,100 -- both a 300-visit swing).
    Each shifted visit is reimbursed $110 less (220-110), so 300 x $110 = $33,000, which accounts
    for the entire shortfall.

  The blended revenue-per-visit figure did fall, from $352,000/2,000=$176.00 to
  $319,000/2,000=$159.50 -- an apparent $16.50 (9.4%) per-visit drop that is exactly what
  produced the "rates are being cut" first impression. But that blended-rate decline is a pure
  artifact of the payer-mix shift, not an actual per-payer rate cut. Recommended corrective
  action: this is a mix problem, not a rate problem -- focus on commercial-payer scheduling
  capacity, referral-source outreach, or intake triage that favors commercial slots, and add a
  payer-mix-percentage KPI to the monthly dashboard so a shift like this is caught earlier than a
  full month's revenue miss. Renegotiating reimbursement rates would not address the actual
  driver here.
weak: |
  The numbers confirm what the administrator suspected -- revenue per visit fell noticeably from
  budget, coming in about $33,000 below plan for the month. This points to reimbursement pressure
  from payers. We'd recommend the practice open renegotiation conversations with its payer
  contracts to push rates back toward budgeted levels, and tighten scheduling to make sure visit
  volume doesn't slip further next month.
