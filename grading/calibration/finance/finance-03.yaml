strong: |
  3-way match result: EXCEPTION. Certified progress this period = $186,000 x 65% = $120,900.
  Delta Concrete's invoice bills $128,000, which exceeds the certified completed work by
  $128,000 - $120,900 = $7,100. The invoice does not match the field-certified progress, so this
  is an overbilling exception, not a clean match.

  Correct net payment: retainage must be applied to the CERTIFIED amount, not the invoiced
  amount. 10% of $120,900 = $12,090 retainage held. Correct net payment this period = $120,900 -
  $12,090 = $108,810.

  Recommended action: hold the invoice and return it to Delta Concrete with the $7,100
  discrepancy flagged against the engineer's certified progress report -- do not release payment
  against the $128,000 face amount. Once the invoice is corrected to match certified progress (or
  the discrepancy is resolved with supporting documentation), release the net $108,810, with the
  $12,090 retainage continuing to be held until substantial completion per the contract terms.
weak: |
  The invoice looks reasonably close to the PO amount, so it seems fine to process. Applying the
  standard 10% retainage to the $128,000 invoice: $128,000 x 10% = $12,800 retainage, so pay
  Delta Concrete $128,000 - $12,800 = $115,200 this period.
