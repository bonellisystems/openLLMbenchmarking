strong: |
  New variable cost per unit: blank garment rises 15% from $8.00 to $9.20 (8.00 x 1.15 = 9.20);
  printing ($3.00) and packaging ($1.00) are unchanged, so new total variable cost = 9.20 + 3.00
  + 1.00 = $13.20/unit (up from $12.00).

  New contribution margin at the current $30.00 price: $30.00 - $13.20 = $16.80/unit, or
  16.80/30.00 = 56% (down from $18.00/unit, 60%).

  Profit impact of doing nothing at 1,450 units/month: before the increase, monthly profit =
  1,450 x $18.00 - $21,600 fixed overhead = $26,100 - $21,600 = $4,500. After, at the same price
  and volume: 1,450 x $16.80 - $21,600 = $24,360 - $21,600 = $2,760. That's a monthly profit
  erosion of $4,500 - $2,760 = $1,740 if you hold price flat.

  Price to restore the original 60% margin: solve (P - 13.20)/P = 0.60 -> 0.40P = 13.20 ->
  P = $33.00. Check: (33.00 - 13.20)/33.00 = 19.80/33.00 = 0.60 exactly.

  Breakeven at the new cost structure and current price: $21,600 / $16.80 = 1,285.7 units/month,
  up from the original breakeven of 1,200 units. Note this assumes volume holds flat at $33.00 --
  worth sanity-checking price elasticity before committing to the increase, since a 10% price
  increase could soften demand somewhat even though the margin math supports it.
weak: |
  Costs went up a bit because the garment supplier raised prices, so our margin will shrink some.
  We estimate we might lose somewhere in the range of $1,000-$2,000 a month if we don't adjust
  anything. To offset it, we'd recommend bumping the price up a couple dollars, maybe to around
  $32, which should get margin back close to where it was before.
