strong: |
  Break quantification: OpCo's intercompany receivable, per the JIB on ACTUAL costs, is 25% x
  $2,600,000 = $650,000. NonOpCo's intercompany payable, accrued off the ORIGINAL AFE budget, is
  25% x $2,400,000 = $600,000. The break is $650,000 - $600,000 = $50,000.

  This is NOT a booking error by either side. OpCo billed correctly against actual costs per the
  JIB. NonOpCo closed its books before the final JIB statement arrived (JIBs routinely lag field
  costs by 30-45 days) and used the best information available at its own close -- the approved
  AFE budget. This is a timing/cutoff difference between two correctly-applied processes, not a
  mistake either accounting team made.

  True-up needed: NonOpCo should true up its intercompany payable from $600,000 to $650,000 once
  the actual-cost JIB is received and booked, closing the $50,000 gap. Process fix: have NonOpCo
  accrue off a preliminary actual-cost estimate communicated intercompany ahead of the formal JIB
  (rather than defaulting to the AFE budget) during any month with an active, potentially
  overrunning AFE project, so this break doesn't recur every reporting period.

  Separately: the workover overran its AFE by ($2,600,000 - $2,400,000)/$2,400,000 = 8.33%.
  Whether that overrun triggers a mandatory notice/consent obligation to NonOpCo as the
  non-operating partner depends on the specific terms of this well's Joint Operating Agreement --
  that should be checked against the actual JOA language rather than assumed from a general rule
  of thumb.
weak: |
  It looks like NonOpCo did their accrual correctly based on the AFE, so the real problem is that
  OpCo's JIB billing is overstated and needs to be corrected down to match the approved budget.
  Both entities should just book the $600,000 AFE-based figure going forward and OpCo should
  explain why it billed more than what was authorized.
