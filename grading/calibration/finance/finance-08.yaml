strong: |
  Week-by-week ending cash balance (burn $185k/wk weeks 1-7, $215k/wk weeks 8-13; +$450k
  inflow in week 6, +$900k inflow in week 10):

  W1 $3,015,000 | W2 $2,830,000 | W3 $2,645,000 | W4 $2,460,000 | W5 $2,275,000 |
  W6 $2,540,000 (2,275,000-185,000+450,000) | W7 $2,355,000 | W8 $2,140,000 | W9 $1,925,000 |
  W10 $2,610,000 (1,925,000-215,000+900,000) | W11 $2,395,000 | W12 $2,180,000 |
  W13 $1,965,000.

  Cross-check: total burn = 7x185,000 + 6x215,000 = 1,295,000+1,290,000 = $2,585,000; total
  inflows = $450,000+$900,000 = $1,350,000; net change = -$1,235,000; $3,200,000-$1,235,000 =
  $1,965,000, matching the Week 13 figure above.

  Week 13 ending balance: $1,965,000. The LOWEST point across the 13 weeks is not Week 13 -- it's
  Week 9, at $1,925,000, the week immediately before the Week 10 milestone payment lands. The
  $500,000 minimum-liquidity covenant is NOT breached anywhere in the 13-week window; the closest
  approach is Week 9's $1,925,000, still well above the floor.

  Runway estimate past Week 13 (unfunded scenario, no further inflows, burn flat at $215,000/wk):
  ($1,965,000 - $500,000)/$215,000 = 6.8 additional weeks before hitting the covenant floor --
  this is an illustrative estimate to flag the urgency of the next fundraise or milestone, not a
  committed forecast, since it assumes zero new inflows for over a month and a half beyond the
  modeled window.
weak: |
  Applying the new $215,000/week burn rate across the full 13-week forecast for simplicity, and
  adding in the two milestone payments, cash burns down from $3,200,000 to roughly $1,755,000 by
  Week 13. That's the low point of the forecast -- cash declines steadily throughout and is
  lowest at the end of the period. The $500,000 covenant floor is not an immediate concern since
  there's still over a million dollars of cushion at Week 13.
