strong: |
  Aging summary (Net 30 terms):
  - 1-30 days past due: Client C, $42,000
  - 31-60 days past due: Client B, $6,200
  - 91+ days past due: Client A $18,500 + Client D $9,800 = $28,300
  - Total AR: $42,000 + $6,200 + $28,300 = $76,500 (checks against the sum of all four invoices:
    18,500+6,200+42,000+9,800 = 76,500). The 91+ bucket alone is $28,300/$76,500 = 37.0% of
    total AR -- a high concentration of severely aged, harder-to-collect balances.

  Dunning plan, priority order:
  1. Client D ($9,800, 130 days past due) -- oldest balance, highest collectability risk.
     Escalate to a final-demand letter with a firm payment deadline; consider a payment plan if
     the client is unresponsive to a single letter.
  2. Client A ($18,500, 95 days past due) -- second priority by age and largest dollar amount in
     the 91+ bucket. A standard collections letter/call is appropriate here. Client A's $22,000
     IOLTA trust balance is NOT available to offset this invoice on our own initiative -- that
     money belongs to the client and is earmarked for future expert-witness costs per the
     engagement letter. Applying trust funds against unrelated fees requires (a) the engagement
     letter's fee-application terms explicitly permitting it, (b) written client notice/consent
     to the specific transfer, and (c) proper trust-ledger documentation of the transfer before
     any funds move -- this cannot be done by simply netting the balances.
  3. Client B ($6,200, 40 days past due) -- least urgent; a routine reminder/statement is
     sufficient at this stage.
weak: |
  Total AR looks manageable once you factor in that Client A already has money sitting with the
  firm. Since Client A has $22,000 in their account, we can just apply that against their $18,500
  invoice and consider it paid -- that brings effective AR down to about $54,500. For the
  remaining balances, send Clients B and D a standard reminder email.
