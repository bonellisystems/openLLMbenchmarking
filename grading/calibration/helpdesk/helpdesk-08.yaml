strong: |
  Actual root cause: this is not a client-side issue at all -- it's the VPN concentrator's own
  max-session / re-authentication interval, configured at 45 minutes. The tell is the 35-50
  minute disconnect window holding steady across 7 different CRAs on entirely different ISPs,
  home networks, and laptop hardware. If this were a client, WiFi, or ISP problem, you'd expect
  the timing to vary a lot between users; instead it clusters tightly around the same interval
  regardless of who or what they're connecting with, which points straight at something shared
  on the server/concentrator side forcibly ending sessions around that mark -- and the
  concentrator's connection logs confirm the sessions are ending on a code unrelated to idle
  timeout, not from inactivity.

  Why the earlier fixes appeared to work: the idle-timeout increase for one user and the
  wired-connection suggestion for another were both coincidental. Neither touched the
  concentrator's 45-minute re-authentication interval, which is what was actually killing the
  session -- if those two users' uploads happened to finish before hitting the 45-minute mark
  after the change (e.g., a wired connection sped up their specific upload enough to finish in
  time), the "fix" looked successful by luck, not because the real cause was addressed.

  Actual fix: extend the VPN concentrator's re-authentication/session-renewal interval, or
  better, configure it so an in-progress upload/transfer is exempted from a forced
  re-authentication mid-session (many concentrators support a "don't drop active data
  connections" or seamless re-key setting) rather than simply hard-terminating the session at 45
  minutes regardless of activity.

  Process lesson: this should have been caught by the 2nd or 3rd ticket if tickets were
  correlated by symptom and timing instead of each being treated as an isolated, one-off
  network issue -- once two unrelated users hit the same "disconnects around 35-50 minutes in"
  pattern, that's a strong trend/chronic-issue signal that warrants checking shared
  infrastructure (the concentrator config) rather than continuing to apply per-user band-aids
  through eleven tickets.
weak: |
  It sounds like different users are having different WiFi and connection issues that are
  causing the VPN to drop. We'll keep recommending users switch to a wired connection if
  possible and adjust individual timeout settings as needed on a case-by-case basis. If it keeps
  happening we can look at getting everyone new equipment or upgrading their home internet.
