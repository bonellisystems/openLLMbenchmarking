strong: |
  Priority calls, based on actual business/legal impact, not who submitted the ticket:

  Ticket D (DMS down firm-wide) -- P1. All 30 attorneys lose access to every active case file
  at once; this is business-critical by definition and almost certainly the highest-blast-radius
  issue in the queue.

  Ticket B (e-filing portal login failure, court deadline in 90 minutes) -- P1. A missed court
  filing deadline has real legal and malpractice consequences for the firm and the client's
  matter; the 90-minute window makes this time-critical in a way the DMS outage, serious as it
  is, is not on the same clock.

  Handling order: work both P1s in parallel if you have two available techs -- assign your most
  senior available tech to Ticket B first specifically because it has a hard, non-negotiable
  90-minute deadline that cannot slip, while a second tech begins triaging the DMS outage (D)
  immediately, since a firm-wide system down is likely to take longer to resolve regardless of
  who starts it. If only one tech is available, take B first: a blown filing deadline cannot be
  undone once the window passes, while the DMS outage, though worse in scope, is still
  resolvable minutes later without the same hard cutoff.

  Ticket A (VIP partner's email signature) -- P3, next business day. Despite being submitted by
  a name partner and VIP-flagged in the system, this is purely cosmetic with zero business or
  legal impact -- VIP status does not override actual severity, and treating it as urgent would
  pull a tech off the two genuinely urgent tickets for no operational reason.

  Ticket C (flickering monitor) -- P2 at most, likely P3 depending on whether it's fully
  blocking the paralegal's work; a monitor that "sometimes" flickers is an annoyance, not a
  business-impact issue, and should not compete for resources with B or D.
weak: |
  Since Ticket A is from a name partner we should probably get that logo update done first to
  keep leadership happy. Then we can look at the DMS outage since that affects everyone, and
  after that the e-filing portal issue for the associate. The monitor flicker can wait until
  someone has time. We'll keep everyone posted as we work through the queue.
