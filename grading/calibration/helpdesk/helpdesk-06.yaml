strong: |
  Before touching the corrupted central model at all: immediately make a byte-for-byte copy of
  each of the 3 architects' local worksharing files (the ones that had unsynced changes open at
  11:40 PM) to a separate location, untouched. Those local files may still contain the changes
  those architects made since their last sync to the central model -- once someone "fixes" or
  overwrites the central model, or those workstations are used for anything else, that recovery
  option can be lost. This step costs almost nothing and preserves every option, so it happens
  first regardless of what you decide next.

  Restoring from the 10:00 PM backup: this is a real option -- since the backup predates the
  reboot by only 1h40m, it loses only that 1h40m window, nothing earlier. The cost is specific:
  each of the 3 architects who had local sessions open loses whatever work they did in that
  1h40m and has to redo it. That's a real but bounded cost, and it's a legitimate fallback if the
  central model truly cannot be recovered -- but it should not be the first move, because it's
  strictly worse than a clean recovery from the architects' local copies if those turn out to be
  intact, and once you restore over the current (possibly-recoverable) central model, that
  cleaner option is gone.

  Escalation: central-model corruption recovery is not something Tier 1/2 helpdesk is trained
  for, and a botched in-place repair attempt risks making the file unrecoverable entirely. Given
  the 26-hour deadline and the fact that this specific failure mode (worksharing corruption from
  an interrupted sync) is exactly what Autodesk support and BIM-specialist consultants handle
  routinely, escalate to one of them now, in parallel with preserving the local copies -- don't
  wait until an internal attempt fails first, since that wastes hours you don't have. If Autodesk/
  the BIM specialist can't recover it in time, fall back to the 10:00 PM backup restore as the
  last resort before the presentation.
weak: |
  Since the central model won't open, the fastest way to get this fixed is to restore the file
  server from last night's 10:00 PM backup right away so the team has something working before
  the deadline. We can also try opening and repairing the file ourselves first since we have
  some experience with file recovery tools. If that doesn't work we can reach out to Autodesk
  support afterward. The 3 architects will need to redo any unsaved work from last night.
