strong: |
  Customer-facing banner (website/app):
  "Scheduled Maintenance: Saturday, 2:00-3:30 AM ET. Online banking, the mobile app, and debit
  card purchases will be temporarily unavailable during this 90-minute window while we perform
  routine system maintenance. No action is needed on your part, and your accounts and funds are
  not affected. Full service will resume automatically by 3:30 AM ET. Thank you for your
  patience."

  Push notification:
  "Heads up: online and mobile banking, plus debit card purchases, will be briefly unavailable
  Sat. 2:00-3:30 AM ET for routine maintenance. Your accounts aren't affected -- service resumes
  automatically."

  Both are deliberately factual and low-key: "routine maintenance" and "your accounts and funds
  are not affected" are there specifically so this doesn't read like a security incident notice,
  since that framing could spook customers unnecessarily for a planned, low-traffic-hour
  maintenance window.

  Internal Slack message to branch staff:
  "Reminder: core-banking maintenance this Saturday 2:00-3:30 AM ET. Online banking, mobile app,
  and debit card purchases will be down for that 90-minute window; no branch systems are
  affected and branches are closed at that hour anyway. If a customer calls in confused about a
  declined card or app error during/right after that window, let them know it was scheduled
  maintenance, fully resolved by 3:30 AM ET, and their account/funds were never at risk. No
  further action needed on your end."
weak: |
