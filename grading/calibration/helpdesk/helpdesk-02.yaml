strong: |
  Neither of the standard recovery channels work here -- push notification needs internet the
  saturated VSAT link won't reliably deliver, and SMS needs cell signal the site doesn't have --
  so use a channel that doesn't depend on live connectivity at all:

  1. Ask if the technician has offline backup/recovery codes for their authenticator account
  (most MFA setups generate a set of one-time backup codes at enrollment, meant for exactly this
  kind of situation) -- if they have them recorded (paper, or saved before deployment), that's
  the fastest path and requires no network round-trip at all.

  2. If no backup codes exist, check whether the account also has a TOTP-based authenticator
  app configured (a rotating 6-digit code generated locally on the device, not push-based) --
  TOTP codes don't need a live connection to generate or validate, only for the initial app
  setup, so if one was ever provisioned it will still work offline at the rig.

  3. If neither is available, verify identity out-of-band instead of via the on-file cell
  number: have a known supervisor or site lead who can be reached through the rig's operational
  comms (radio, sat phone used for drilling ops) positively identify the technician, and issue a
  time-limited temporary access grant tied specifically to that individual -- not a shared
  credential, and not a blanket MFA disable for the account.

  Afterward: document exactly which verification path was used, who vouched for the technician
  if step 3 was used, and the time-limited nature of any temporary access, then re-enable
  standard MFA enforcement on the account once connectivity is restored and confirm the user's
  authenticator is fully functional again.
weak: |
  Since the technician can't get the push notification or a text message out there, we'll just
  go ahead and disable MFA on their account for now so they can log in and get the report
  submitted. We can turn it back on once they're back in range of a signal. We'll make a note in
  the ticket that this happened.
