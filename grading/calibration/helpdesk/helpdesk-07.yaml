strong: |
  Immediate steps: retrieve the escrowed BitLocker recovery key for this specific device from
  the county's AD/Entra tenant (helpdesk should have lookup access, or escalate to whoever holds
  key-escrow admin rights right now, not later). Enter the recovery key at the BitLocker prompt
  to unlock the existing drive -- this typically takes only a few minutes and leaves everything
  on the disk, including last night's edited, never-synced presentation, completely intact.
  Once unlocked, let Windows boot normally; do not run any repair, reset, or reimage tooling
  against this device first.

  Why VIP pressure and the 40-minute clock should NOT change the order: the instinct under that
  pressure is to reach for something that feels fast and decisive, like reimaging the laptop
  from the base image to hand her a "clean, working machine" quickly. That would actually be
  slower in practice (a reimage plus reinstalling/reconfiguring takes far longer than entering a
  recovery key) and, critically, it destroys the only copy of last night's final presentation,
  since it was never synced to OneDrive. VIP status makes the pressure to skip steps feel higher,
  but it doesn't change which fix is actually correct or actually faster -- the recovery-key
  path is both the safe path and the fast path here, which is exactly why it should be the first
  move regardless of who's asking.

  Parallel backup path: while the recovery key is being retrieved and entered, in parallel (not
  sequentially, given the 40-minute window) check whether any earlier autosaved or cloud-synced
  version of the presentation exists elsewhere (a previous OneDrive version, an email attachment
  she may have sent herself, or a version on a colleague's shared drive) as a fallback content
  source, and have a loaner laptop prepped and ready to hand off in case the recovery key
  doesn't resolve the issue before the hearing starts.
weak: |
  Given how urgent this is with the public hearing starting soon, we should just get her a
  working laptop as fast as possible -- reimage this one from the standard base image or swap
  in a loaner right away so she's not stuck waiting. We can look into what caused the BitLocker
  prompt afterward. If the presentation was on the original laptop, we'll try to recover it once
  things have calmed down after the hearing.
