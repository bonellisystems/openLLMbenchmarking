strong: |
  I'd hold off on denying this outright. Jumping straight to "no" based on an assumption that the
  job requires being in the office, without ever talking to the employee, skips a step that's
  central to how these requests should be handled: the interactive process. That means engaging
  directly with the employee (and, given the medical note, likely HR/an ADA coordinator) to
  explore whether a reasonable accommodation is actually possible before concluding it isn't.

  Here, the barrier is narrow and concrete: one weekly manual reconciliation task that needs the
  secure on-site server, which normally requires VPN plus a hardware token she doesn't currently
  have. That's not a "the whole job requires being in the office" problem -- it's a single-task
  access problem. The interactive process here should explore options like: issuing her the
  hardware token so that one task can be done remotely via VPN on her remote days, or reassigning
  that specific weekly task to an on-site colleague on the days she's remote, alongside a 3-day
  hybrid schedule.

  If, after actually going through that process, there's a genuine business reason none of those
  options work, an "undue hardship" conclusion needs to be documented with real specifics (cost,
  operational impact) -- not just asserted the way the initial "I don't think we can do this" reads
  now. Loop in HR/the ADA coordinator, and likely counsel, before finalizing anything given the
  medical documentation involved. On that note: the doctor's note itself should be kept
  confidential and stored separately from her regular personnel file, not shared beyond the people
  who need it to evaluate the request.
weak: |
  If the role really does need someone on-site for that task, it's reasonable to deny the
  work-from-home request and let her know the job requires being in the office. That keeps things
  simple and consistent with how the role has always worked.
