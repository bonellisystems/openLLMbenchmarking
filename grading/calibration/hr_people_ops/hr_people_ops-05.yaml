strong: |
  Layoff plan -- field office closure (32 of 210 employees):

  1. Employee communication: individual, in-person (or video) notifications to each of the 32
  affected employees, same day if possible, followed by a written notice confirming effective
  date, severance terms, and benefits-continuation details. Be direct about the reason (lost
  contract) and avoid vague language that leaves people guessing about timing.

  2. WARN-notice flag -- urgent: the plan currently gives 45 days of notice, which is less than the
  general 60-day figure commonly associated with WARN-type mass-layoff/plant-closing notice
  requirements. That gap needs to go to employment counsel immediately, today, not after the
  communication plan is finalized -- counsel needs to confirm whether this closure meets the
  coverage thresholds for WARN or a state equivalent, and if so, whether the 45-day timeline needs
  to be extended or whether other steps (e.g., pay in lieu of the shortfall) are needed to avoid
  statutory exposure. Don't proceed with the 45-day plan as final until that's confirmed.

  3. Standard elements: severance calculated by tenure, continuation of health benefits for a
  defined period, reference-letter commitments from direct managers, and outplacement support
  (resume help, job-search resources) offered to all 32 affected employees.
weak: |
  We'll notify the 32 affected employees about the office closure with 45 days' notice, and put
  together severance and benefits-continuation details as part of the announcement. We can also
  offer some outplacement resources if budget allows. Should be a straightforward process overall.
