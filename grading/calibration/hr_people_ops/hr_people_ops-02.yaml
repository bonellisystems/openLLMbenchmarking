strong: |
  Per Section 4.3 of the handbook: up to 5 of your 8 unused PTO days carry over into next year.
  The remaining 3 days, the amount above the 5-day cap, would be forfeited as of December 31 under
  the default policy.

  That said, Section 4.3 itself has a built-in exception: "except where carryover in excess of
  this limit is required by applicable state law." Since you're at the satellite office rather
  than headquarters, your work state may be different, and some states restrict "use-it-or-lose-
  it" PTO forfeiture. Before we apply the standard 5-carryover/3-forfeited split to your balance,
  we're going to confirm which state's law applies to your work location -- if that state requires
  full or partial carryover above 5 days, Section 4.3's own exception means the state rule would
  override the 5-day cap for you specifically.
weak: |
  Per our PTO policy, you can carry over up to 5 days into the new year, so most of your balance
  should be fine. Anything past that is generally forfeited, but don't worry about it too much --
  it's a pretty small amount either way.
