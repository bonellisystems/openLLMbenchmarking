strong: |
  Talking points for the manager:

  "As part of our market comp study, the Loan Processor role has been placed in a new band of
  $52,000-$64,000. Your current pay of $58,500 already falls within that band, so there's no
  change to your pay as a result of this update -- the banding is about making sure the role is
  positioned correctly against the market, not a signal that everyone's pay moves."

  If the employee brings up a coworker's pay (e.g., "I heard someone else in this role makes
  $61,000"): don't discourage or push back on the fact that they discussed pay with a coworker --
  employees discussing their own pay with each other is generally protected activity, and treating
  it as something they shouldn't have done would be the wrong move. It's fine to acknowledge that
  pay within a band can vary based on tenure, performance, and market factors, without confirming
  or denying the specific coworker figure.

  What the manager should NOT do: commit to a raise, a band re-placement, or a specific dollar
  figure on the spot. Any question about moving the employee's pay within or beyond the band
  should be routed to the compensation team/HR leadership for review, not decided informally in
  this conversation.
weak: |
  Just let them know their pay is within the new band so nothing changes. If they bring up what a
  coworker makes, it's best to steer the conversation away from that -- pay is meant to stay
  private between the employee and the company, so it's better if coworkers aren't comparing
  notes on that. Should be a quick conversation.
