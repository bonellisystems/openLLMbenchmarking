strong: |
  Investigation plan:

  Investigator: someone entirely outside the supervisor's chain of command -- ideally a trained
  HR investigator from a different department or an outside investigator if the county's HR office
  is small enough that independence is a concern -- to keep this impartial.

  Interview sequence: complainant first (to get full detail and identify witnesses), then relevant
  witnesses/colleagues who may have observed the comments or the project reassignment, then the
  supervisor last, after the factual picture is established.

  Evidence to gather: any emails or messages referencing the pregnancy or the county-fair
  vendor-logistics reassignment, documentation of who was assigned the project and when relative to
  the pregnancy disclosure, and notes from anyone who witnessed the comments described.

  Interim measures: consider whether the project reassignment should be paused or reviewed pending
  the investigation's outcome, and make clear to the supervisor (without detailing the complaint's
  content) that any change in the complainant's treatment during this period will be scrutinized
  closely for retaliation.

  On confidentiality -- this needs to be answered honestly, not with a blanket promise: we cannot
  guarantee 100% confidentiality, because a fair, credible investigation requires interviewing the
  supervisor and likely witnesses, which will necessarily reveal that some complaint was made. What
  we CAN commit to: sharing details only with people who genuinely need to know to conduct the
  investigation, and actively protecting the complainant against retaliation for having raised it,
  which is a separate and serious violation in its own right if it happens.

  The pregnancy-related comments and the timing of the project reassignment point to a protected-
  class concern that raises the stakes here -- this should be documented carefully throughout, and
  given the potential exposure, county legal counsel should be looped in alongside HR.
weak: |
  Don't worry, we'll keep this completely confidential -- no one will find out you filed a
  complaint. We'll look into the comments and the project reassignment and get back to you once
  we've reviewed things.
