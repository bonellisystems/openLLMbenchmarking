strong: |
  PERFORMANCE IMPROVEMENT PLAN -- CAD Drafter

  This PIP builds directly on the three documented check-ins already on file (Week 3 deadline
  miss on the Meridian Tower package, Week 6 QA flag of 4 drawing-revision errors, Week 9 client
  complaint on RFI response time) -- it formalizes a pattern that's already been raised informally,
  not a new set of complaints.

  Days 1-30: Deadline adherence -- zero missed deliverable deadlines; QA error rate -- no more
  than 1 revision error per deliverable (down from the 4-error incident); RFI response time --
  respond within 1 business day. Weekly check-in with manager to review against these three
  metrics.

  Days 31-60: Same three metrics sustained for a full 30-day period with no violations; check-in
  moves to biweekly.

  Days 61-90: Full 90-day review against all three documented issues. Sustained improvement across
  the period supports coming off the PIP; a relapse on any of the three original issues supports
  moving to next steps, which should go through HR/employment counsel before any termination
  decision is finalized -- this PIP alone isn't grounds for termination without that review.

  Important carve-out: if the drafter raises a protected leave or accommodation request at any
  point during this 90-day window, the PIP clock and goals should be paused/adjusted to account for
  it rather than treated as a new performance failure or held against the existing timeline.
weak: |
  Let's put together a PIP for the next 90 days that lays out expectations around meeting
  deadlines, reducing errors, and responding to clients more quickly. We'll check in periodically
  and see how things go from there.
