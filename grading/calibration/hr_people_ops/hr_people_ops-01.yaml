strong: |
  ONBOARDING PLAN -- Operations Coordinator (Start: 2 weeks out)

  1. Pre-boarding paperwork: Send new-hire paperwork ahead of day one. Complete Form I-9
  employment-eligibility verification within 3 business days of the start date -- schedule this
  for day one or two so there's buffer if a document issue comes up.

  2. Systems/access: Laptop imaged, email/calendar, and scheduling-software accounts provisioned
  before day one so everything is ready when they walk in.

  3. First week: Day-one welcome + facilities tour, buddy assigned for the first two weeks,
  intro meetings with adjacent teams, and a first-week schedule with specific times, not just a
  task list.

  4. 30-60-90 day plan: 30 days -- shadow existing processes, complete core system training; 60
  days -- own routine scheduling tasks independently; 90 days -- take full ownership of the role's
  core responsibilities with manager check-ins at each milestone.

  One classification note: don't assume this role's exempt/non-exempt pay status from the job
  title alone -- confirm it against the actual duties before finalizing the pay-related onboarding
  paperwork.
weak: |
  We'll get the new coordinator set up with a laptop and accounts before they start, do a quick
  intro on day one, and have them shadow the team for a bit to learn the ropes. Standard new-hire
  paperwork will go out beforehand too. Should be a smooth start.
