# Netlify configuration for openllms.bonellisystems.com
# (Netlify project "openllmbenchmarking"; the netlify.app subdomain remains as an alias.)
#
# The site is the dashboard + explorer, which are STATIC and pre-built: build_data.py and
# build_explorer.py run locally and commit their output (data is embedded straight into
# index.html, and the explorer's data ships as .js files). So there is no build step here
# on purpose - Netlify would need Python, PyYAML and the whole results/ tree to reproduce
# what is already committed, and a build that can fail is a worse deal than one that
# cannot run at all.

[build]
  publish = "dashboard"
  command = ""

# ---------------------------------------------------------------------------
# Caching. The data files are NOT content-hashed - build_explorer.py rewrites
# ornith-1-0-35b.js and friends in place - so a long max-age would pin visitors to a
# stale roster after every rerun. must-revalidate keeps them fast via ETag/304 while
# guaranteeing a refresh is picked up on the next load.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# The explorer payload is ~34MB across 22 files, so revalidation matters more here than
# anywhere else on the site: a 304 costs a round trip, a re-download costs megabytes.
[[headers]]
  for = "/explorer/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The one-shot game builds are MODEL OUTPUT, served verbatim so the explorer shows what
# each model actually wrote. They are framed by the explorer; nothing else should frame
# them, and they have no reason to be indexed as standalone pages.
[[headers]]
  for = "/explorer/games/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Convenience: /explorer and /dashboard both land somewhere sensible.
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/explorer"
  to = "/explorer/index.html"
  status = 301
