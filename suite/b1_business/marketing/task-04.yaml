id: marketing-04
unit: marketing
difficulty: medium
class: standard
industry: oil_gas_energy
prompt: |
  You handle demand generation for a B2B pipeline-integrity inspection services company. The
  average sales cycle from first contact to signed contract is 7 months, and the primary buyer
  persona engaging with marketing content is a technical engineering manager (not the economic
  buyer), who evaluates vendors on technical accuracy before anything else reaches budget
  approval. Sales has flagged that the single most common objection blocking deals from
  advancing is: "We need to see field data or case studies before we'll take this to budget
  approval."

  Current state: leads get exactly one follow-up email after a demo, which has a 4% reply rate,
  and un-replied leads are marked cold and dropped after 30 days with no further contact. The
  stated goal is to raise the 90-day engaged-lead rate (leads still actively responding to
  outreach 90 days after first contact) from the current 22% baseline to 35%.

  Design an email nurture sequence for this technical buyer across the long sales cycle: specify
  the number of touches, the cadence/timing between them, and the content focus of each touch.
  The sequence must directly address the field-data/case-study objection sales has identified,
  and should not feel like a pushy sales cadence to an engineer who is 7 months from a decision.
signals:
  - {type: numeric, value: 7, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 22, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 35, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(case stud(y|ies)|field data)\\b", weight: critical}
notes: |
  Marketing Task 04 -- email-nurture sequence design (medium). Industry: oil_gas_energy (B2B
  pipeline-integrity inspection services). Load-bearing industry constraint: long B2B sales
  cycle (7 months, stated) with a technical, non-economic-buyer persona (engineering manager)
  who needs field data / case studies before championing internally -- the nurture sequence
  must be paced across the full cycle (not a short 2-week drip) and each touch's content focus
  must be tied to the technical-credibility objection sales flagged, not generic promotional
  copy. Baseline 22% -> target 35% 90-day engaged-lead rate are given facts to cite accurately,
  not figures the model must derive.
