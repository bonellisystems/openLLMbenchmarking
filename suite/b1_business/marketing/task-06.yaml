id: marketing-06
unit: marketing
difficulty: hard
class: long
industry: healthcare_compliance
prompt: |
  You market a HIPAA compliance-training and audit-readiness software product sold to
  healthcare provider organizations. You have win/loss data for the last 12 closed deals:

  Won (7 deals): org sizes of 15, 40, 60, 90, 180, 300, and 450 providers/beds. All 7 of these
  organizations had a documented compliance audit finding or citation within the 12 months
  before they engaged with you.

  Lost (5 deals): org sizes of 20, 75, 140, 260, and 500 providers/beds. None of these 5
  organizations had a recent audit finding or citation -- each was described in sales notes as
  "proactively evaluating options, no urgent trigger."

  Define the ideal customer profile (ICP) for this product using the win/loss data. Be explicit
  about what percentage of wins shared the audit-finding/citation trait, and address directly
  why organization size is or isn't a reliable ICP signal given the size ranges in both the won
  and lost columns.
signals:
  - {type: numeric, value: 7, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 100, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(audit (finding|citation)|citation)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(trigger|triggering event)\\b", weight: evidence}
notes: |
  Marketing Task 06 -- ICP definition from win/loss data (hard). Industry: healthcare_compliance.
  Non-obvious hard element: organization size looks like it might be the natural ICP axis to
  reach for, but the size ranges in the won column (15-450) and lost column (20-500) overlap
  almost completely, so size carries no separating signal. The real driver, verified in the data
  (verify_arith.py: 7 of 7 wins = 100%), is a recent compliance audit finding/citation -- a
  trigger event -- present in 100% of wins and 0% of losses regardless of org size. A correct
  ICP definition centers on "has a recent audit finding/citation" as the qualifying trigger
  rather than a size-based segment (e.g. "target 200+ bed hospital systems"), which the data
  does not support.
