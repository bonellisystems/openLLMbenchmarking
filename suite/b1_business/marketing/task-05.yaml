id: marketing-05
unit: marketing
difficulty: hard
class: long
industry: aec
prompt: |
  You lead marketing for a mid-size architecture firm that designs K-12 school facilities. A
  rival firm, Meridian Design Group, just announced a 15% fee discount on new institutional
  (K-12) contracts. In the past 6 months your firm lost 5 institutional bids to Meridian. Sales
  debrief notes from those 5 losses show the client's stated reason for choosing Meridian in
  each case:

  - Loss 1: "Meridian promised a design-development timeline 20% shorter than yours."
  - Loss 2: "Their fee was lower, but honestly the deciding factor was they could start sooner
    and finish design faster -- our board wanted to break ground this fiscal year."
  - Loss 3: "Price was a factor, we went with the lower bid."
  - Loss 4: "We needed the design phase done fast to hit a grant-funding construction deadline,
    and Meridian's schedule commitment was the only one that worked."
  - Loss 5: "Their proposed schedule was significantly faster than yours, which mattered more to
    the board than the fee difference."

  Write a competitive-response memo to firm leadership. Quantify, from the debrief notes, how
  many of the 5 losses were actually price-driven versus schedule-driven, and use that to argue
  for or against matching Meridian's 15% fee discount. Recommend a concrete response strategy.
signals:
  - {type: numeric, value: 15, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 80, tolerance: 0.05, weight: critical}
  - {type: regex, value: "(?i)\\b(schedule|timeline|design[- ]development speed)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bMeridian\\b", weight: evidence}
notes: |
  Marketing Task 05 -- competitive-response memo from provided intel (hard). Industry: aec
  (K-12 school architecture). Non-obvious hard element: the knee-jerk response to a competitor's
  publicized price cut is to price-match it, but the debrief data shows only 1 of 5 losses
  (Loss 3, 20%) was purely price-driven -- the other 4 of 5 (80%, verified: 4/5*100=80,
  verify_arith.py) cite schedule/design-development speed as the actual deciding factor, with
  price mentioned only as a secondary or non-deciding factor in 2 of those. A correct memo
  reads past the surface competitive threat (the discount) to the real pattern in the loss data
  and recommends competing on delivery speed (compressed design-development process, schedule
  commitments) rather than eroding margin by matching the 15% discount, which the anchors would
  score as tightly tied to the stated brief rather than a generic "match the competitor" reflex.
