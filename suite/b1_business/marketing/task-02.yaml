id: marketing-02
unit: marketing
difficulty: medium
class: standard
industry: financial_services
prompt: |
  You run marketing for a regional credit union launching a Q3 campaign to generate qualified
  HELOC (home equity line of credit) applications. The total Q3 marketing budget is $60,000.
  Two line items are already locked and cannot be reallocated: $18,000 for direct mail (already
  under contract with the printer) and $9,000 for in-branch signage (already ordered).

  Historical channel performance for the remaining flexible budget: paid search has historically
  cost $180 per qualified application; paid social has historically cost $260 per qualified
  application; an email newsletter sponsorship costs a flat $2,000 regardless of volume and has
  historically driven about 20 applications per quarter (a hard ceiling -- the newsletter list
  isn't growing this quarter).

  The stated Q3 goal is 150 qualified HELOC applications at a blended cost-per-application (CPA)
  across the flexible channels of $220 or under. Determine how much flexible budget remains
  after the two locked line items, then propose a channel allocation (with dollar amounts and
  expected application volume per channel) that hits the 150-application goal without exceeding
  the flexible budget, using the historical channel CPA data given.
signals:
  - {type: numeric, value: 33000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 150, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(cost per application|CPA)\\b", weight: evidence}
  - {type: numeric, value: 220, tolerance: 0.01, weight: evidence}
notes: |
  Marketing Task 02 -- campaign plan with budget allocation, arithmetic must be verified
  (medium). Industry: financial_services. Remaining flexible budget = $60,000 - $18,000 -
  $9,000 = $33,000 (signal target, a derived figure the answer must compute, not one handed
  to it). $33,000 / $220 blended target CPA = exactly 150 applications, so the goal is
  achievable within budget -- verified independently with a channel-level allocation
  (verify_arith.py): email $2,000 flat for 20 apps + search 130 apps x $180 = $23,400, total
  $25,400 spent of $33,000 available, $7,600 under budget even without touching the pricier
  paid-social channel. Any allocation the model proposes should reconcile to the $33,000 cap
  and the 150-application goal; exact channel split is not over-constrained since several valid
  allocations exist.
