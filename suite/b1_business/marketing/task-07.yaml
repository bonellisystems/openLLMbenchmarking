id: marketing-07
unit: marketing
difficulty: easy
class: short
industry: life_sciences
prompt: |
  You market a consumer genetic-testing diagnostics startup. The company is preparing to launch
  a new at-home test in Q4. Clinical validation and FDA clearance for the new test are still
  pending -- not yet complete -- so marketing content published before launch must not make any
  claims about the new test's clinical accuracy, diagnostic performance, or medical efficacy.

  Marketing goal: build organic awareness and trust in the category ahead of the Q4 launch. You
  have 10 weeks until launch and a cadence goal of 2 educational blog posts per week over that
  period.

  Build a content calendar for the pre-launch window: state the total number of pieces the
  cadence produces, give topic categories appropriate for this stage (e.g., category education,
  general genetics literacy, patient-journey stories), and state explicitly what kind of claims
  the content must avoid given the pending clearance status.
signals:
  - {type: numeric, value: 20, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 10, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(claim|efficacy|clinical(ly)? (accura(te|cy)|valid(ated|ation)))\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(pending|not yet (cleared|approved|validated))\\b", weight: evidence}
notes: |
  Marketing Task 07 -- content calendar tied to stated goals (easy). Industry: life_sciences
  (consumer genetic-testing diagnostics). Load-bearing constraint: claim-substantiation caution
  -- content published before FDA clearance/clinical validation is complete must not assert
  diagnostic accuracy or clinical efficacy, so the calendar's topic choices must stay in
  education/category-awareness territory rather than performance claims. Arithmetic: 2
  posts/week x 10 weeks = 20 total pieces (verify_arith.py), the signal's derived total the
  answer must state correctly, not a number handed to it directly.
