id: marketing-03
unit: marketing
difficulty: medium
class: standard
industry: legal
prompt: |
  You're doing a landing-page critique for a solo estate-planning attorney's new PPC landing
  page. Current page performance: 1.2% conversion rate on this page, versus a 3.8% average
  across the firm's other service pages, and a 74% bounce rate. Here is the page copy as it
  exists today:

  Headline: "We Guarantee You'll Protect 100% of Your Assets From Probate -- Guaranteed Results
  or Your Money Back."

  Body (three dense paragraphs of legal-jargon-heavy explanation of probate law follow the
  headline, with no call-to-action visible until the very bottom of the page).

  Testimonial block: "John saved his family $200,000!" -- no disclaimer of any kind attached.

  Contact form: located below all three paragraphs, requiring a scroll past roughly 600 words
  before a visitor sees it.

  Critique this page. Flag anything that is a problem for an attorney-advertising context
  specifically (not just general conversion-rate-optimization advice), and recommend concrete
  fixes, including what should replace the "guarantee" framing and what the testimonial needs.
  Reference the page's current conversion rate and bounce rate as your baseline for the audit.
signals:
  - {type: numeric, value: 1.2, tolerance: 0.05, weight: critical}
  - {type: numeric, value: 74, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bguarantee(s|d|ing)?\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(disclaimer|no guarantee|cannot guarantee|does not guarantee|results (may )?vary)\\b", weight: critical}
notes: |
  Marketing Task 03 -- landing-page critique of provided copy (medium). Industry: legal (estate
  planning attorney). Load-bearing constraint: attorney-advertising ethics rules broadly
  prohibit guaranteeing case outcomes and require that testimonials/results not be presented as
  a promise of similar results for future clients -- the fixture states this only at the level
  of "prohibits guaranteeing outcomes / needs a results disclaimer," not a specific state bar
  citation, so the answer isn't required to assert jurisdiction-specific rule numbers as fact. A
  correct critique must (a) flag the "guaranteed results or your money back" headline as an
  outcome-guarantee problem needing rewrite, (b) require a results-may-vary style disclaimer on
  the testimonial, (c) address the buried CTA/thin-value-prop-before-conversion issue, and (d)
  cite the given 1.2% conversion / 74% bounce baseline as the audit's evidence, not a
  fabricated benchmark.
