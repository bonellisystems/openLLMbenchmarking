id: marketing-08
unit: marketing
difficulty: hard
class: long
industry: msp_internal
prompt: |
  You run marketing for the MSP itself and are presenting this quarter's funnel readout.
  Quarterly figures: 40,000 website visitors -> 800 leads (form fills, a 2% visitor-to-lead
  rate) -> 320 MQLs (40% of leads) -> 96 SQLs (30% of MQLs) -> 24 closed customers (25% of
  SQLs). Total marketing spend this quarter was $48,000. Average annual contract value (ACV)
  per customer is $9,600, and gross margin is 70%.

  A prior readout assumed a 3-year average customer lifetime when calculating LTV. New cohort
  data just came in: the actual measured average customer tenure, based on churn among
  customers acquired over the last two years, is 14 months -- not 3 years (36 months).

  Compute customer acquisition cost (CAC). Compute lifetime value (LTV) twice: once using the
  old 3-year lifetime assumption, and once using the actual 14-month measured tenure. State
  both resulting LTV:CAC ratios. Then explain, using the two ratios, whether this quarter's real
  constraint on growth is the acquisition funnel (traffic, lead conversion, CAC) or something
  else, and name that constraint explicitly.
signals:
  - {type: numeric, value: 2000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 7840, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(CAC|customer acquisition cost)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(churn|retention)\\b", weight: evidence}
  - {type: numeric, value: 14, tolerance: 0.01, weight: evidence}
notes: |
  Marketing Task 08 -- marketing-metrics readout with CAC/LTV from provided funnel numbers
  (hard). Industry: msp_internal. Non-obvious hard element: CAC = $48,000 / 24 customers =
  $2,000 (verify_arith.py). LTV under the old 3-year assumption = $9,600 x 3 x 0.70 = $20,160,
  giving a naive LTV:CAC ratio of 10.08:1 -- comfortably above the conventional ~3:1 healthy
  benchmark, which would tempt a shallow answer to conclude "acquisition is efficient, scale
  spend." Recomputed with the actual 14-month measured tenure, LTV = $9,600 x (14/12) x 0.70 =
  $7,840, giving a real ratio of 3.92:1 -- still workable but far below the naive figure. The
  funnel and CAC are healthy; the real constraint dragging economics down is retention/churn
  (customers leaving well before the previously assumed 3-year lifetime), not acquisition, which
  is the correct diagnosis a strong answer must name explicitly rather than recommending more
  top-of-funnel spend.
