id: sales-01
unit: sales
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You sell a cloud-based practice-management platform (scheduling, billing, e-prescribing) to
  veterinary clinics. You just finished an intake call with Fetch & Wellness Animal Hospital, a
  single-location practice with 3 veterinarians. Notes from the call:

  - The practice owner, Dr. Patel, is the sole decision-maker -- there is no procurement
    committee or IT department to loop in.
  - They currently run scheduling on a 15-year-old desktop application that has no cloud or
    mobile access.
  - Dr. Patel estimated their no-show rate at 18% of booked appointments.
  - Front-desk staff spend about 2 hours a day making manual phone call reminders to try to
    keep that no-show rate down.

  Build a discovery-call plan for the next conversation with Dr. Patel: state the call's goal,
  list the specific questions you'll ask that build directly on what she already told you (the
  no-show rate and the manual reminder time), and recommend a concrete next step to close the
  call. Keep the plan appropriate for a single-owner practice making a fast, direct decision --
  not a multi-stakeholder enterprise sales process.
signals:
  - {type: numeric, value: 18, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bno-shows?\\b", weight: critical}
  - {type: regex, value: "(?i)\\breminders?\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bDr\\.?\\s*Patel\\b", weight: evidence}
notes: |
  Sales Task 01 -- discovery-call plan from provided account intel (easy). Industry: generic_smb
  (3-veterinarian practice). Load-bearing industry element: a 3-vet practice has a single
  fast-moving decision-maker (the owner) and no procurement process -- a different game from a
  committee-based enterprise sale -- so the discovery-call plan should be direct and owner-
  focused rather than built around multi-stakeholder buy-in. Discriminating signals: the 18%
  no-show rate and the manual-reminder pain point are specific account intel the plan must build
  its questions around, not generic discovery-call boilerplate.
