id: sales-05
unit: sales
difficulty: medium
class: standard
industry: manufacturing_ag
prompt: |
  You sell IoT predictive-maintenance monitoring software, priced at $1,200/sensor/year. Harvest
  Line Equipment, a mid-size manufacturing_ag equipment plant, wants to deploy across 200
  sensors -- a list-price deal of $240,000/year. They're requesting a 3-year contract in
  exchange for a 20% discount off list ($192,000/year).

  Your discount authority: sales reps can approve up to 15% off list ($204,000/year) without
  further sign-off. Any discount beyond 15% -- including Harvest Line's 20% ask -- requires VP
  of Sales approval because of the margin impact at that depth.

  Write a pricing-negotiation guardrails memo for the account team: state the list price, the
  15% floor a rep can approve unilaterally, why the 20% ask exceeds that floor and needs VP
  approval, and a recommended counter-offer that keeps the numbers internally consistent with
  the stated discount authority.
signals:
  - {type: numeric, value: 240000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 204000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bVP\\b", weight: critical}
  - {type: numeric, value: 15, tolerance: 0.01, weight: evidence}
notes: |
  Sales Task 05 -- pricing-negotiation guardrails memo (medium). Industry: manufacturing_ag.
  Arithmetic: list price = 200 sensors x $1,200 = $240,000/year (signal target, verified);
  15% floor = $240,000 x 0.85 = $204,000/year (signal target, verified); 20% ask = $240,000 x
  0.80 = $192,000/year, which sits below the rep's unilateral floor and must be flagged as
  requiring VP of Sales approval rather than approved on the spot. A correct memo keeps all
  three figures (list, floor, ask) mutually consistent rather than treating the discount
  percentages as disconnected from the dollar amounts.
