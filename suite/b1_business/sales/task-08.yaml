id: sales-08
unit: sales
difficulty: hard
class: long
industry: public_sector
prompt: |
  Weekly pipeline review. Four open opportunities:

  - Opportunity A -- the state Department of Transportation, $420,000 ARR. Prospect is "very
    interested" but no formal procurement process has started; no RFP, no confirmed budget, and
    the champion is a mid-level analyst. Expected timeline: "sometime next year."
  - Opportunity B -- Fairview County Parks & Recreation Department, $85,000 ARR. An RFP has been
    issued with a hard submission deadline in 6 days. You meet every stated requirement. It's a
    competitive RFP (3 vendors invited), and under this agency's public-sector procurement
    rules, missing the submission deadline means automatic disqualification -- no exceptions,
    no late submissions accepted.
  - Opportunity C -- Bristol City IT Department, $210,000 ARR. Verbal budget approval is in
    hand, but the formal purchase order requires a city council vote at their next public
    meeting, 90 days out, per the city's budget-cycle rules. The deal is effectively done
    pending that vote.
  - Opportunity D -- the Town of Millbrook, $30,000 ARR. Still an informal, early-stage
    conversation.

  Triage all four opportunities, put them in order for handling this week, and justify each
  ranking using the actual procurement constraints and signals described -- not deal size.
signals:
  - {type: numeric, value: 85000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bRFP\\b", weight: critical}
  - {type: regex, value: "(?i)\\bdisqualif", weight: critical}
  - {type: numeric, value: 420000, tolerance: 0.01, weight: evidence}
notes: |
  Sales Task 08 -- pipeline review triage from provided opportunities (hard). Industry:
  public_sector. Load-bearing industry element: RFP submission deadlines in public-sector
  procurement are immutable -- missing one means automatic disqualification regardless of
  relationship or fit, a constraint that doesn't exist in most private-sector pipelines. Non-
  obvious hard element: Opportunity A is the largest deal by far ($420,000) but has no real
  urgency or process; the correct top priority this week is the much smaller Opportunity B
  ($85,000) because its 6-day RFP deadline is a hard, disqualifying constraint. A weak answer
  ranks by deal size (A first); a strong answer ranks B first on the immutable-deadline logic,
  mirroring "priority tracks actual constraint, not who's biggest."
