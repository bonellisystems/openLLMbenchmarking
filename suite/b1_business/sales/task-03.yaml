id: sales-03
unit: sales
difficulty: medium
class: standard
industry: financial_services
prompt: |
  You sell fraud-detection software to regional banks. You're finalizing a proposal for Palisade
  Community Bank. Scope and pricing agreed with their fraud/compliance team:

  - Core platform license: $60,000/year.
  - One-time implementation and onboarding fee: $15,000, billed only in year 1.
  - Optional add-on module (real-time transaction alerting), which they've requested: $12,000/year.

  Write the executive summary section of the proposal, aimed at the bank's board, who will be
  approving this spend and need the numbers to be exactly right (this is a regulated
  environment -- an internally inconsistent proposal undermines credibility). State the total
  year-1 investment and the ongoing annual cost from year 2 onward, with a clear breakdown of
  what's included in each figure.
signals:
  - {type: numeric, value: 87000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 72000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 60000, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bimplementation\\b", weight: evidence}
notes: |
  Sales Task 03 -- proposal executive summary from given scope/pricing, arithmetic must be
  internally consistent (medium). Industry: financial_services. Year-1 total = $60,000 +
  $15,000 + $12,000 = $87,000 (signal target, verified). Year-2-onward recurring = $60,000 +
  $12,000 = $72,000 (the one-time implementation fee drops off; signal target, verified). Load-
  bearing industry element: a bank board reviewing a fraud/compliance spend needs figures that
  reconcile cleanly -- an answer that conflates the one-time and recurring totals, or omits the
  add-on from the year-1 figure, fails the anchors' internally-consistent-numbers marker.
