id: sales-07
unit: sales
difficulty: hard
class: long
industry: healthcare_compliance
prompt: |
  Northfield Regional Health System's HIPAA compliance-training platform renewal ($54,000/year)
  is due in 45 days. Usage data over the last two quarters:

  - The platform was originally championed and driven by Dr. Elaine Cho, then Chief Compliance
    Officer, who personally sponsored the rollout. Under her sponsorship, Q1 mandatory-training
    completion across required staff was 85%.
  - Dr. Cho left Northfield 4 months ago. Since then, Q2 completion has fallen to 40%, and
    logins from the compliance department are down 70% month-over-month.
  - The interim compliance lead, Grace Liu, has never logged into the platform.

  Write a renewal-at-risk save plan. Diagnose the actual risk driver using the usage data -- not
  a generic "usage is down" framing -- and lay out a concrete plan to re-engage the account
  before the 45-day renewal date, addressing the ownership gap the data reveals.
signals:
  - {type: numeric, value: 45, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(champion|chief compliance officer|CCO)\\b", weight: critical}
  - {type: numeric, value: 40, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\binterim\\b", weight: evidence}
notes: |
  Sales Task 07 -- renewal-at-risk save plan from provided usage data (hard). Industry:
  healthcare_compliance. Non-obvious hard element: the surface metric is "completion and logins
  are down," but the actual cause is that the champion (Dr. Cho) who drove adoption left 4
  months ago and no one has taken ownership -- the interim lead has never even logged in. A weak
  answer proposes generic re-engagement tactics (reminder emails, a webinar) without naming the
  champion-departure/ownership-gap root cause; a strong answer targets rebuilding executive
  sponsorship with Grace Liu specifically, ahead of the 45-day renewal date.
