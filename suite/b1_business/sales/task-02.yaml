id: sales-02
unit: sales
difficulty: easy
class: short
industry: aec
prompt: |
  You just closed a deal with Ridgeline Structural Engineering, a 45-person structural
  engineering firm, for your project-management software. Deal specifics from the signed
  contract:

  - 45 seats at $840/seat/year.
  - Start date is August 1.
  - Onboarding priority #1: import their 12 currently active projects.
  - Ridgeline's existing document management system is ProjectWise, and the contract requires
    the new platform to integrate with it -- this was a hard requirement during the sales
    process, not a nice-to-have.
  - The champion who negotiated the deal, Director of Operations Sana Ruiz, was firm that
    mandatory two-factor authentication (2FA) must be enabled for every user from day one.

  Write a hand-off-to-delivery document for the implementation/onboarding team, summarizing the
  deal so they can plan onboarding without needing to re-contact the prospect for basics. State
  the total annual contract value.
signals:
  - {type: numeric, value: 45, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 37800, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(two-factor|2FA|MFA)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bProjectWise\\b", weight: evidence}
notes: |
  Sales Task 02 -- hand-off-to-delivery doc from closed-deal specifics (easy). Industry: aec
  (structural engineering firm). Arithmetic check: 45 seats x $840/seat/year = $37,800 total
  annual contract value (signal target, verified independently). Discriminating signals: the
  ProjectWise DMS-integration requirement and the mandatory-2FA champion requirement are
  deal-specific facts the hand-off doc must carry forward accurately so onboarding doesn't drop
  either hard requirement.
