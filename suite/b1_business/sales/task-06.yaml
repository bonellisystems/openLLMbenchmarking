id: sales-06
unit: sales
difficulty: hard
class: long
industry: legal
prompt: |
  You sell a cloud-based, multi-tenant SaaS e-discovery and document-review platform. During a
  demo with Kestrel & Voss LLP, a 60-attorney litigation firm, IT Director Priya Anand raised
  this objection:

  "Our biggest client is a defense contractor bound by strict data-residency and
  on-premises-only requirements for anything touching their litigation documents. We need this
  platform hosted entirely on our own servers, not your cloud. If it's not on-prem, we can't use
  it for that client's matters."

  Your product is cloud-only -- there is no on-premises deployment option, and there never has
  been. What you do offer: dedicated single-tenant cloud instances (each client's data is
  physically isolated, never co-mingled with other tenants), SOC 2 Type II certification, and a
  full chain-of-custody audit log for every document access. Of Kestrel & Voss's 40 currently
  active matters, only 2 (5%) carry a contractual on-premises-only mandate like the defense
  contractor's; the remaining 38 (95%) have no such requirement.

  Write the objection response. Do not claim or imply an on-premises option exists -- it
  doesn't. Address the objection honestly: be direct that the platform is not the right fit for
  matters bound by a literal on-prem mandate, then make the case, using the actual figures
  above, for why it's still the right fit for the bulk of their caseload, and propose a concrete
  next step.
signals:
  - {type: regex, value: "(?i)\\bon-prem(ises)?\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(SOC ?2|single-tenant)\\b", weight: critical}
  - {type: numeric, value: 95, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bchain[- ]of[- ]custody\\b", weight: evidence}
notes: |
  Sales Task 06 -- objection-response from a provided objection + context (hard). Industry:
  legal (litigation firm; confidentiality/data-residency posture is a real, load-bearing buying
  criterion for law-firm clients, not incidental). Non-obvious hard element: the honest answer to
  this objection is "we're not the right fit for the 2 on-prem-mandated matters, but..." -- a
  weak answer either fabricates an on-prem option that does not exist, or pitches past the
  objection entirely. Arithmetic: 2/40 = 5% of matters carry the on-prem mandate; 38/40 = 95% do
  not (signal target, verified) -- the correct response leans on that 95% figure plus the actual
  supported capabilities (single-tenant isolation, SOC 2 Type II, audit logging) rather than
  overclaiming.
