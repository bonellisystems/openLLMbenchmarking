id: sales-04
unit: sales
difficulty: medium
class: standard
industry: oil_gas_energy
prompt: |
  You sell pipeline-integrity compliance-tracking software. Continental Pipeline Services has
  used a competitor product, DrillTrack, for the past 8 years, and DrillTrack is deeply
  entrenched with their field-inspection team. Battle-card facts for this displacement:

  - DrillTrack has no real-time mobile field-data entry. Inspectors fill out paper forms in the
    field, then re-enter that data by hand back at the office -- a roughly 3-day data lag before
    inspection results are visible in the system.
  - Your platform captures inspection data on mobile in real time, cutting that lag to the same
    day.
  - DrillTrack costs Continental $95,000/year. Your platform lists at $110,000/year.
  - Continental currently pays 2 administrative staff at 0.5 FTE each (1.0 FTE combined) just to
    re-key paper inspection forms into DrillTrack, at a fully-loaded cost of about $40,000/year
    for that re-entry labor -- work your real-time mobile entry would eliminate entirely.

  Write a competitive-displacement talk track for the sales rep to use with Continental's VP of
  Field Operations. Use the battle-card facts above -- don't invent capabilities DrillTrack may
  or may not have beyond what's stated. Address the sticker-shock of the higher list price
  directly using the labor-cost savings, and state the net annual cost impact of switching.
signals:
  - {type: contains, value: "DrillTrack", weight: critical}
  - {type: numeric, value: 15000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 25000, tolerance: 0.05, weight: critical}
  - {type: regex, value: "(?i)\\breal-time\\b", weight: evidence}
notes: |
  Sales Task 04 -- competitive-displacement talk track from provided battle-card facts (medium).
  Industry: oil_gas_energy (pipeline-integrity compliance). Arithmetic: list-price delta =
  $110,000 - $95,000 = $15,000/year more expensive (signal target, verified); eliminated re-entry
  labor cost = $40,000/year, so net annual impact = $40,000 - $15,000 = $25,000/year net savings
  despite the higher list price (signal target, verified). The talk track must engage the price
  objection on its substance (using the labor-savings math) rather than either ignoring the
  higher sticker price or fabricating DrillTrack weaknesses beyond the stated real-time-entry gap.
