id: it_infra-06
unit: it_infra
difficulty: hard
class: long
industry: legal
prompt: |
  Your MSP client is a 40-attorney law firm. Its case-management system (case files, billing,
  and privileged client communications) runs on an on-prem SQL Server VM. Current backup
  configuration: a nightly full backup to a NAS appliance sitting in the same server closet as
  the production VM host, retained for 14 days, no offsite or cloud copy, and the backup NAS is
  domain-joined using a domain service account so scheduled jobs can authenticate to it. Per
  the firm's last IT audit, no restore from this backup has actually been tested in 18 months.
  The firm's malpractice insurance policy requires an RPO of at most 4 hours and an RTO of at
  most 8 business hours (the case-management system must be restorable within 8 business hours
  to avoid missing court filing deadlines). A peer firm was recently hit by ransomware that
  encrypted both its production server AND its backup NAS, because the backup storage was
  reachable on the same network segment using domain credentials. Write a backup/DR gap
  analysis: name every gap against the stated RPO/RTO and against ransomware resilience
  (specifically call out the co-located, domain-joined backup as a single point of failure),
  give a remediation plan in priority order, quantify the blast radius if ransomware hits before
  this is fixed, and state what must happen BEFORE any change is made to the current backup
  regime to avoid discovering -- only after the old backups are gone -- that the new setup
  doesn't actually work.
signals:
  - {type: regex, value: "(?i)\\b(offsite|off-site|air[- ]gap|immutable)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bRPO\\b", weight: critical}
  - {type: regex, value: "(?i)\\bdomain[- ]?joined\\b", weight: critical}
  - {type: regex, value: "(?i)\\btest.{0,15}restore\\b|\\brestore.{0,15}test\\b", weight: evidence}
notes: |
  IT Infra Task 06 -- backup/DR gap analysis (hard). Industry: legal (privileged case files
  under implicit retention/confidentiality expectations). Non-obvious hard element (matches the
  anchors' rollback-before-change marker): the correct answer must NOT retire or overwrite the
  existing (flawed) nightly-backup regime until a real restore has been tested against the new
  setup, because 18 months without a tested restore means there's a real chance the current
  backups don't actually work -- deleting/replacing them first, before proving the replacement
  restores cleanly, could leave the firm with zero working backup during the transition. Also
  requires quantifying blast radius (co-located + domain-joined backup = single ransomware event
  can take out primary AND backup, as already happened to a peer firm) rather than treating the
  backup gap as independent of the ransomware risk.
