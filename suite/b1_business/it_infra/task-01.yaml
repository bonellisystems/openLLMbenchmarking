id: it_infra-01
unit: it_infra
difficulty: easy
class: short
industry: manufacturing_ag
prompt: |
  Your MSP manages IT for a USDA-inspected poultry processing plant. The plant's file-and-scan
  server (a Hyper-V VM: 8 vCPU, 32GB RAM, 500GB SSD volume) hosts the shared folder that
  handheld barcode scanners on the production floor write to for USDA-mandated lot-tracking
  records. Current monitoring shows two things: (1) CPU is sustained at 91% for roughly 20
  minutes at each of the plant's three daily shift changes (07:00, 15:00, 23:00), when all
  scanners re-sync in a burst; and (2) the SSD volume is 82% full, growing at about 23GB per
  week from retained lot-tracking scan logs -- a 2-year USDA retention requirement means the
  old logs can't simply be purged to reclaim space. The plant cannot tolerate any scanner
  downtime during a shift-change window, because a gap in lot-tracking coverage during a shift
  change is itself a USDA compliance finding. Recommend a right-sized VM spec (vCPU/RAM), a
  storage plan that respects the 2-year retention requirement, and a timeline for making the
  change that avoids all three daily shift-change windows.
signals:
  - {type: numeric, value: 91, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)shift[- ]?change", weight: critical}
  - {type: regex, value: "(?i)\\bretent", weight: critical}
notes: |
  IT Infra Task 01 -- capacity sizing from given metrics (easy). Industry: manufacturing_ag
  (USDA-inspected poultry plant). Load-bearing industry facts: USDA 2-year lot-tracking
  retention rules out the generic "just delete old logs to reclaim space" answer, and the
  three-shift production schedule creates hard no-touch windows that a generic "schedule
  during off-hours" answer would miss (this plant runs continuously across shifts, so
  "off-hours" is only the ~20-minute non-shift-change gaps). No real product versions or
  CVE/KB references invoked, so nothing to verify against a vendor advisory.
