id: it_infra-04
unit: it_infra
difficulty: medium
class: standard
industry: aec
prompt: |
  Two architecture firms are merging. Firm A (120 users) is absorbing Firm B (45 users) into
  Firm A's Microsoft 365 / Active Directory tenant. Firm B's active project files live on an
  on-prem file share, and many of Firm B's AutoCAD drawings contain external references
  (Xrefs) that point to that share using absolute UNC paths (e.g., \\FIRMB-FS01\Projects\...).
  Changing the file share's path or name, or moving a drafter's mailbox/UPN, during active work
  hours risks breaking those Xref links mid-drawing for engineers who have files open. Firm B
  currently has two projects with permit-submission deadlines to the local building department
  in 10 business days. Write an M365/AD tenant-consolidation change plan: sequence the
  mailbox and file-share migration so Xref links are not broken while either permit deadline is
  still open, name which changes must happen only AFTER both permit deadlines pass, and include
  a rollback approach for the mailbox migration if a batch fails partway.
signals:
  - {type: regex, value: "(?i)\\b(rollback|roll back|revert)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bx-?ref", weight: critical}
  - {type: regex, value: "(?i)\\bpermit\\b", weight: evidence}
notes: |
  IT Infra Task 04 -- M365/AD change plan (medium). Industry: aec (architecture firm merger).
  Load-bearing industry fact: AutoCAD Xrefs resolve via the absolute UNC path baked into each
  drawing, so a file-share rename/move during active use breaks open drawings in a way that a
  generic "move the file share" migration plan would not anticipate -- the correct plan
  sequences the path-changing steps after both permit deadlines, not on a generic off-hours
  cutover.
