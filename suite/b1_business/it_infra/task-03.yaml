id: it_infra-03
unit: it_infra
difficulty: medium
class: standard
industry: healthcare_compliance
prompt: |
  Your MSP manages IT for a multi-provider outpatient clinic. The clinic's network is
  effectively flat: EHR workstations, medical IoT devices (infusion pumps, patient monitors),
  guest WiFi, and back-office admin systems all sit on the same VLAN (10.10.0.0/22). A recent
  internal security review found that a laptop connected to the guest WiFi could reach the EHR
  application server directly over RDP (port 3389 open, no ACL blocking it) -- guest traffic
  should never be able to reach a system that touches electronic protected health information
  (ePHI). This is a real gap against the clinic's HIPAA Security Rule access-control
  obligations. The clinic cannot tolerate any EHR downtime between 8:00 AM and 6:00 PM, since
  providers need the EHR live for patient charting during clinic hours. Write a network
  segmentation review: propose the VLAN structure that closes this specific gap, state exactly
  what closes the guest-to-EHR RDP path, and give a change plan (including a rollback step) that
  respects the 8 AM-6 PM no-downtime window.
signals:
  - {type: regex, value: "(?i)\\bVLAN\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(rollback|roll back|revert)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(3389|RDP)\\b", weight: critical}
notes: |
  IT Infra Task 03 -- network segmentation review (medium). Industry: healthcare_compliance
  (outpatient clinic). Load-bearing industry facts: the specific vulnerable path (guest VLAN ->
  RDP 3389 -> EHR server) must be named and closed, not just generically "segment the network,"
  and the 8 AM-6 PM clinic-hours no-downtime window rules out a same-day daytime cutover.
  Deliberately phrased the regulatory basis generically ("HIPAA Security Rule access-control
  obligations") rather than citing a specific CFR subsection, to avoid an unverifiable pinned
  citation while keeping the constraint real and correctly characterized.
