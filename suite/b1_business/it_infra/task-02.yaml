id: it_infra-02
unit: it_infra
difficulty: easy
class: short
industry: oil_gas_energy
prompt: |
  Your MSP supports IT for a remote drilling rig site whose only network backhaul is a
  VSAT satellite link (2 Mbps up / 10 Mbps down), shared with the SCADA/drilling-telemetry
  systems. This month's Windows Server 2022 cumulative security update needs to be deployed
  to the rig's 14 domain-joined endpoints, including the domain controller that authenticates
  the SCADA operator workstations. The rig runs on a 14-day hitch schedule (crews rotate in
  and out every 14 days), and the site's only approved maintenance window is a 4-hour block
  during the day-to-night crew changeover, once per hitch, because the rig cannot tolerate
  degraded authentication or network performance while drilling operations are active at any
  other time. Pushing the update to all 14 endpoints at once over the VSAT link would saturate
  the link and disrupt SCADA telemetry. Write a patch-window runbook: the pre-patch step to
  take before touching anything, how you sequence the 14 endpoints given the bandwidth
  constraint, and how the plan fits the 14-day hitch cadence.
signals:
  - {type: regex, value: "(?i)\\b(rollback|roll back|revert)\\b", weight: critical}
  - {type: numeric, value: 14, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(snapshot|backup|back up)\\b", weight: critical}
notes: |
  IT Infra Task 02 -- patch-window runbook (easy). Industry: oil_gas_energy (remote rig site).
  Load-bearing industry facts: the VSAT bandwidth ceiling forces a staggered rollout (not a
  push-all-at-once answer), and the 14-day hitch cadence plus SCADA-adjacent domain controller
  means the maintenance window can't be treated as an arbitrary off-hours slot. Deliberately
  did NOT invent a specific KB article number for "this month's cumulative update" -- phrased
  generically per the no-fabricated-reference rule, since a specific KB number would need to be
  a real, dated one and the task doesn't need it to be gradable.
