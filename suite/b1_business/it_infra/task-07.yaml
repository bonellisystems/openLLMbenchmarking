id: it_infra-07
unit: it_infra
difficulty: hard
class: long
industry: public_sector
prompt: |
  Your MSP supports IT for a county government whose 911 dispatch / computer-aided-dispatch
  (CAD) system is hosted by a third-party SaaS vendor. The vendor had a 5-hour-40-minute
  regional outage. The vendor's own status page attributes the cause to "a database failover
  that did not complete cleanly during a routine maintenance window." During the outage,
  dispatchers fell back to the county's paper/radio continuity-of-operations plan, and
  911 call-to-dispatch time reportedly increased. The vendor contract has a 99.9% monthly
  uptime SLA with service credits for breaches, and a liability cap for consequential damages
  of $50,000 -- a figure the county's risk manager has flagged as inadequate given the
  public-safety stakes of a CAD outage. Write a vendor-outage postmortem for county leadership:
  quantify the SLA breach against the 99.9% target, state what should be independently verified
  before accepting the vendor's self-reported root cause at face value, call out the liability
  cap mismatch as a business/legal risk that IT configuration changes cannot fix, and recommend
  one concrete resiliency step plus what the county should demand from the vendor before
  trusting this postmortem as final.
signals:
  - {type: numeric, value: 99.9, tolerance: 0.01, weight: evidence}
  - {type: numeric, value: 50000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(independent(ly)?|verify|substantiat|third[- ]party audit)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(fallback|fall back|manual process|continuity)\\b", weight: note}
notes: |
  IT Infra Task 07 -- vendor outage postmortem (hard). Industry: public_sector (county 911/CAD).
  Non-obvious hard element (matches the anchors' calibration-about-verification marker): a mid
  answer accepts "database failover during routine maintenance" as the final cause because the
  vendor said so; the strong answer treats a vendor's self-reported root cause as unverified
  from the customer side and states what should be independently confirmed (e.g., an
  independent post-incident report or third-party audit rights under the contract) before
  treating it as closed. Also requires recognizing the $50,000 liability cap versus
  public-safety impact is a contract/business-risk problem, not something IT can remediate with
  a config change.
