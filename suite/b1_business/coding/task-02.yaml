id: coding-02
unit: coding
difficulty: easy
class: short
industry: financial_services
prompt: |
  A payments processor uses transaction reference IDs in the exact format
  `TXN-` followed by 10 digits, followed by `-`, followed by a 3-letter uppercase ISO currency
  code -- for example `TXN-0048291344-USD`.

  Construct a single Python regular expression, intended to be used with `re.fullmatch`, that
  correctly classifies each of the following 7 test strings as MATCH or NO MATCH:

  1. `TXN-0048291344-USD` -> should MATCH
  2. `TXN-9999999999-EUR` -> should MATCH
  3. `TXN-004829134-USD` -> should NOT match (only 9 digits)
  4. `TXN-0048291344-usd` -> should NOT match (lowercase currency code)
  5. `TXN-00482913445-USD` -> should NOT match (11 digits)
  6. `TXN-0048291344-USDX` -> should NOT match (trailing extra character after the currency
     code)
  7. `TXN0048291344-USD` -> should NOT match (missing the hyphen right after TXN)

  Give the regex, classify all 7 strings against it, and explain specifically why using
  `re.search` with your pattern instead of `re.fullmatch` (or omitting start/end anchors)
  would change the correct classification of test string 6.
signals:
  - {type: contains, value: "d{10}", weight: critical}
  - {type: regex, value: "(?i)\\bfullmatch\\b", weight: critical}
  - {type: contains, value: "USDX", weight: evidence}
notes: |
  Coding Task 02 -- regex construction w/ test strings (easy).
  Industry: financial_services (payments-processor transaction reference IDs).
  Correct pattern: `TXN-\d{10}-[A-Z]{3}` used with `re.fullmatch`. Traced against all 7 cases:
  #1/#2 match (10 digits, 3 uppercase letters); #3 fails because `\d{10}` requires exactly 10
  digits and only 9 are present before the next literal `-`, so the fixed-count group cannot
  satisfy the pattern anywhere in the string (true regardless of anchoring); #4 fails because
  `[A-Z]{3}` cannot match lowercase; #5 fails for the same fixed-count reason as #3 (11 digits
  leaves a stray digit before the literal `-`, which cannot match); #7 fails because the literal
  `TXN-` cannot align with `TXN0`. Test #6 is the deliberate anchoring trap: verified by hand
  that `re.search("TXN-\d{10}-[A-Z]{3}", "TXN-0048291344-USDX")` DOES find a match (it matches
  the first 19 characters "TXN-0048291344-USD" and simply ignores the trailing "X", since
  `re.search` only requires the pattern to occur somewhere, not to consume the whole string) --
  this is real, verified Python `re` semantics, not a made-up gotcha. Only `re.fullmatch` (or
  explicit `^...$` anchors) correctly rejects #6.
