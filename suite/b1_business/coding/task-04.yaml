id: coding-04
unit: coding
difficulty: medium
class: standard
industry: public_sector
prompt: |
  A county government's online building-permit portal throws the error below when an applicant
  submits a permit fee calculation. Explain exactly why the error occurs, and provide a fixed
  version of the function.

  Code (`permits.py`):
  ```
   1  FEE_SCHEDULE = {
   2      "residential_addition": 150,
   3      "large_project_surcharge": 2.5,
   4  }
   5
   6  def calculate_permit_fee(permit_type, square_footage, fee_schedule):
   7      base_fee = fee_schedule[permit_type]
   8      if square_footage > 5000:
   9          surcharge = fee_schedule.get("large_project_surcharge")
  10      total = base_fee + surcharge * square_footage / 1000
  11      return round(total, 2)
  12
  13  fee = calculate_permit_fee("residential_addition", 1200, FEE_SCHEDULE)
  14  print(fee)
  ```

  Traceback:
  ```
  Traceback (most recent call last):
    File "permits.py", line 13, in <module>
      fee = calculate_permit_fee("residential_addition", 1200, FEE_SCHEDULE)
    File "permits.py", line 10, in calculate_permit_fee
      total = base_fee + surcharge * square_footage / 1000
  UnboundLocalError: local variable 'surcharge' referenced before assignment
  ```

  Explain why line 10 fails specifically for this call (`square_footage=1200`), then rewrite
  `calculate_permit_fee` so it still applies the large-project surcharge only when
  `square_footage > 5000`, but never leaves `surcharge` undefined for the normal case -- and
  also handle the case where `fee_schedule` is missing the `"large_project_surcharge"` key at
  all, for a lot over 5000 sq ft.
signals:
  - {type: contains, value: "UnboundLocalError", weight: critical}
  - {type: regex, value: "(?i)\\bline 10\\b", weight: critical}
  - {type: contains, value: "surcharge = 0", weight: evidence}
notes: |
  Coding Task 04 -- explain-and-fix a provided stack trace vs code (medium).
  Industry: public_sector (county permit-fee calculator).
  Traced by hand: with square_footage=1200, the condition on line 8 (`square_footage > 5000`)
  is False, so line 9 never executes and `surcharge` is never assigned on this code path.
  Because Python determines a variable is local to a function at compile time based on ANY
  assignment appearing anywhere in the function body (line 9 assigns `surcharge`), the name
  `surcharge` is treated as local for the whole function -- referencing it on line 10 before
  it was ever bound on this path raises `UnboundLocalError`, not a fallback to some outer
  scope. This is real, verified CPython scoping behavior, not a made-up error. Minimal correct
  fix: initialize `surcharge = 0` before the `if` block (or before line 8) so the else-implicit
  path always has a defined value. The second, easy-to-miss edge case the prompt explicitly
  asks for: even in the `square_footage > 5000` branch, `fee_schedule.get("large_project_
  surcharge")` returns `None` if the key is absent, and `None * square_footage` raises
  `TypeError` on line 10 -- so a complete fix also needs `fee_schedule.get("large_project_
  surcharge", 0)` with an explicit default, not just moving the initialization.
