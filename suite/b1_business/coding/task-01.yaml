id: coding-01
unit: coding
difficulty: easy
class: short
industry: legal
prompt: |
  A law firm's billing system needs a function that converts raw minutes worked into billable
  hours under the firm's outside-counsel-guideline (OCG) rounding rule: time is billed in
  tenth-of-an-hour (6-minute) increments, and any partial increment is always rounded UP, never
  down -- except that zero minutes worked must bill as exactly 0.0, not rounded up to a phantom
  0.1.

  Write a Python function `round_billable(minutes)` that:
  - Returns `0.0` if `minutes == 0`.
  - Otherwise returns the number of hours, rounded UP to the nearest 0.1 (i.e., the nearest
    6-minute increment), for any `minutes > 0`.
  - Raises `ValueError` if `minutes` is negative, since a billing entry can't have negative
    time.

  Trace your function against these cases and show the results: `minutes=0`, `minutes=1`,
  `minutes=6`, `minutes=65`, and `minutes=-5`.
signals:
  - {type: contains, value: "def round_billable", weight: critical}
  - {type: regex, value: "(?i)\\bValueError\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(ceil|round(ed|s)?\\s*up|roundup)\\b", weight: evidence}
  - {type: numeric, value: 1.1, tolerance: 0.01, weight: note}
notes: |
  Coding Task 01 -- write a function to a precise spec + edge cases (easy).
  Industry: legal (law firm OCG billing-increment rounding).
  Traced by hand: minutes=0 -> 0.0 (explicit special case, NOT ceil(0/6)*0.1 which would also
  correctly give 0.0, but the spec calls it out because a naive "always round up" reading could
  wrongly special-case 0 minutes as 0.1); minutes=1 -> ceil(1/6)=1 increment -> 0.1; minutes=6
  -> ceil(6/6)=1 increment exactly, not rounded up to 2 -> 0.1 (this is the edge case a
  boundary-unsafe implementation, e.g. using `minutes // 6 + 1` unconditionally, gets wrong --
  it must check whether minutes is an exact multiple of 6 first); minutes=65 -> 65/6 = 10.833,
  ceil = 11 increments -> 1.1 hours (the worked numeric-signal case); minutes=-5 -> raises
  ValueError. A correct Python implementation: `math.ceil(minutes / 6) * 0.1` naturally handles
  the exact-multiple-of-6 case correctly (ceil(6/6)=ceil(1.0)=1), so the real risk is an
  off-by-one implementation using floor+1 instead of ceil, or forgetting the 0-minutes and
  negative-minutes special cases.
