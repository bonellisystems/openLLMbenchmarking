id: coding-07
unit: coding
difficulty: hard
class: long
industry: aec
prompt: |
  Refactor this construction-billing helper for clarity while preserving its EXACT behavior
  for every input combination -- do not just simplify it and assume it's equivalent, prove it.

  ```python
  def get_retention_rate(percent_complete, is_final_punchlist):
      if is_final_punchlist == True:
          if percent_complete >= 100:
              rate = 0
          else:
              rate = 0.05
      else:
          if percent_complete < 50:
              rate = 0.10
          else:
              if percent_complete < 90:
                  rate = 0.10
              else:
                  if percent_complete <= 100:
                      rate = 0.05
                  else:
                      rate = 0.05
      return rate
  ```

  A naive refactor is likely to combine the two branches into something like:
  `return 0 if (is_final_punchlist and percent_complete >= 100) else (0.10 if percent_complete
  < 90 else 0.05)`. Trace that candidate against `is_final_punchlist=True,
  percent_complete=70` and state whether it actually matches the original function's output
  for that input. Then give your final, clean refactor, and show it handles that same input
  correctly.
signals:
  - {type: regex, value: "(?i)\\b(mismatch|incorrect|wrong for|does(n't| not) match)\\b", weight: critical}
  - {type: contains, value: "70", weight: critical}
  - {type: contains, value: "is_final_punchlist", weight: evidence}
  - {type: regex, value: "(?i)\\b(0\\.05|5%)\\b", weight: note}
notes: |
  Coding Task 07 -- refactor-for-clarity of provided code (hard).
  Industry: aec (construction retention-withholding rate).
  Original behavior, traced exhaustively: is_final_punchlist=True -> rate is 0 if
  percent_complete>=100, else 0.05 for ANY percent_complete<100 (including low values --
  unusual business logic, but that's what the given code does, and a refactor must preserve
  it exactly). is_final_punchlist=False -> both the `<50` and `50<=x<90` branches give 0.10
  (dead duplication), and both the `<=100` and final `else` branches after `<90` is false give
  0.05 (more dead duplication) -- so the non-final-punchlist case genuinely collapses to
  "0.10 if percent_complete<90 else 0.05".
  The trap: the tempting one-line "naive refactor" combines both branches by testing
  `is_final_punchlist and percent_complete>=100` first, then falling through to the
  <90/>=90 split. Traced against is_final_punchlist=True, percent_complete=70: ORIGINAL code
  takes the `is_final_punchlist==True` branch, percent_complete(70)>=100 is False, so
  rate=0.05. The NAIVE refactor: `is_final_punchlist and percent_complete>=100` is False (70
  is not >=100), so it falls through to `0.10 if percent_complete<90 else 0.05`; 70<90 is
  True, so it returns 0.10. 0.10 != 0.05 -- the naive refactor is WRONG for this input; this
  is the hard task's non-obvious edge case, verified by hand-tracing both versions. A correct
  refactor must keep the final-punchlist case fully independent, e.g.: `if is_final_punchlist:
  return 0 if percent_complete >= 100 else 0.05` followed by `return 0.10 if percent_complete
  < 90 else 0.05`.
