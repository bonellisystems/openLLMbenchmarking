id: operations-01
unit: operations
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You run operations for a small e-commerce apparel retailer's order-fulfillment process.
  Current baseline: average time from order placed to shipment = 3.2 days, and 4.5% of orders
  ship with the wrong item. Root cause investigation found that warehouse staff manually re-key
  each order's pick list from the order system into a paper pick sheet before pulling items --
  and every re-keying step is a chance to transpose a SKU. Orders also sit in one unsorted
  queue rather than being grouped by warehouse zone.

  Redesign the SOP to reduce both the time-to-ship and the wrong-item rate. State a baseline ->
  target KPI for each metric, and sequence the first three implementation steps. There is no
  budget approved this quarter for new warehouse management software -- your redesign has to be
  a process fix using the tools already in place, not a system purchase.
signals:
  - {type: numeric, value: 3.2, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 4.5, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(re-?key|manual (transcri|entry)|transcri)\\b", weight: evidence}
notes: |
  Operations Task 01 -- SOP redesign with baseline -> target KPI (easy). Industry: generic_smb.
  Core numbers (3.2 days, 4.5% error rate) are given facts the answer must cite accurately as
  its baseline, not derived figures. Root cause given explicitly (manual re-keying of the pick
  list) so a correct answer targets eliminating the re-keying step (e.g., print the pick list
  directly from the order system, or read a barcode/order number instead of hand-transcribing
  it) and zone-batches the queue, without requiring new paid software -- respecting the stated
  no-budget constraint per the anchors' resourcing-constraint marker.
