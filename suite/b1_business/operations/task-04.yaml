id: operations-04
unit: operations
difficulty: medium
class: standard
industry: life_sciences
prompt: |
  You manage capacity planning for a clinical-trial central lab that processes patient blood
  samples. Facts:
  - Current staffing: 3 technicians, each validated to process 40 samples/day
  - Current actual volume: 85 samples/day (comfortably within current capacity)
  - Sponsor's enrollment-ramp forecast: volume will reach 150 samples/day within 6 weeks as new
    trial sites activate
  - Samples must be processed within 24 hours of the blood draw per the trial protocol's
    validated stability window -- they cannot be queued or held over as a workaround
  - A new technician takes 3 weeks of training and mandatory certification before they can
    independently process protocol samples, and hiring/budget approval itself takes 1 week
    before training can even start

  Calculate current lab capacity and the capacity gap against the 6-week demand forecast.
  Determine the minimum additional headcount needed (capacity comes in whole-technician
  increments). Work backward from the 6-week deadline through the approval-plus-training lead
  time to state the LATEST week from today that hiring approval must be initiated to have the
  new technician certified before the demand peak hits. Explain why queuing samples is not a
  viable stopgap given the 24-hour stability window.
signals:
  - {type: numeric, value: 120, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 30, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 160, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(24[- ]hour|same[- ]day|stability)\\b", weight: critical}
notes: |
  Operations Task 04 -- capacity plan (medium). Industry: life_sciences (clinical-trial central
  lab ahead of an enrollment ramp).
  Arithmetic verified: current capacity = 3 x 40 = 120 samples/day. Gap vs. 150/day forecast =
  150 - 120 = 30 samples/day. Additional techs needed = 30/40 = 0.75, rounds up to 1 whole
  technician (capacity comes in 40/day increments); new capacity = 4 x 40 = 160/day, covering
  the 150/day forecast with 10/day of headroom. Lead time = 1 week approval + 3 weeks
  training/certification = 4 weeks. Latest start week = 6-week deadline - 4-week lead time =
  week 2 (not gated by a numeric signal since it requires a subtraction the model must show
  work for, but the two upstream numbers, 120 and 30, anchor the calculation). The 24-hour
  sample-stability constraint is the hard resourcing constraint from the anchors: it rules out
  "just let orders back up a bit" as a stopgap, since a held-over sample outside the validated
  window must be discarded, not merely delayed.
