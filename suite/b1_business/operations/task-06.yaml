id: operations-06
unit: operations
difficulty: hard
class: long
industry: manufacturing_ag
prompt: |
  You're doing a bottleneck analysis on a poultry processing line with four stations in series:

  1. Evisceration -- continuous process, 50 units/min.
  2. Chill tumble -- BATCH process. The tumbler only runs once it has a full 900-unit batch
     accumulated (it cannot run partial batches without compromising chill efficacy), and each
     batch cycle (load + chill + unload) takes 20 minutes for 1,000 units per batch. Because
     units visibly pile up at the chill in-feed while a batch accumulates, floor supervisors
     have flagged chilling as "the bottleneck" -- it's where they see the largest standing queue
     on the line.
  3. Portioning/cut-up -- continuous process, 38 units/min.
  4. Packaging -- continuous process, 42 units/min.

  The plant runs one 8-hour shift/day and has a daily processing target of 20,000 units.

  Calculate each station's effective throughput rate (including the chill tumbler's batch
  math). Determine the TRUE line-limiting bottleneck and explain, with numbers, why it is NOT
  the chill station despite chill having the largest visible work-in-process queue. Calculate
  today's maximum achievable daily output at the true bottleneck's rate and the shortfall
  against the 20,000-unit target. State the minimum rate the true bottleneck station needs to
  hit in order to reach the daily target. Warn against the "obvious" fix of adding a second
  chill tumbler, and explain with numbers why it would not move daily output at all.
signals:
  - {type: numeric, value: 38, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 18240, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bportion", weight: critical}
  - {type: regex, value: "(?i)\\bbatch", weight: evidence}
notes: |
  Operations Task 06 -- bottleneck analysis from provided throughput data (hard). Industry:
  manufacturing_ag. This is the brief's explicit calibration example: "the bottleneck that
  ISN'T the slowest station because of batching."
  Arithmetic verified: chill tumbler effective rate = 1,000 units / 20 min = 50 units/min --
  identical to evisceration's 50/min, so despite the large visible accumulation queue at the
  chill in-feed (a normal batching artifact, since units must pile up before a full 900-unit
  batch can run), chilling's effective throughput is NOT the constraint. Line rate = min(50
  evis, 50 chill, 38 portioning, 42 packaging) = 38 units/min at Portioning -- the true
  bottleneck, which has a smaller visible queue precisely because it's a continuous process, not
  because it has spare capacity. Max daily output at 8 hours (480 min): 38 x 480 = 18,240 units,
  a shortfall of 20,000 - 18,240 = 1,760 units (8.8%) against target. Required Portioning rate
  to hit 20,000/day: 20,000/480 = 41.67 units/min (a ~9.6% increase from 38). Adding chill
  capacity is a wasted-capital trap: line throughput is capped by Portioning at 38/min
  regardless of how much chill capacity exists, so daily output would stay at 18,240 units even
  with a second tumbler -- only raising Portioning's rate moves the target.
