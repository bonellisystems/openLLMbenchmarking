id: operations-02
unit: operations
difficulty: easy
class: short
industry: aec
prompt: |
  You manage vendor performance for a general contractor's ready-mix concrete supplier. The
  supply contract's SLA requires: on-time delivery >= 95%, and short-load (under-delivered
  volume) incidents <= 2% of deliveries. Below either threshold, the contract allows either a
  formal corrective action plan or liquidated damages.

  This quarter's data (12 deliveries):
  - On-time: 10 of 12 deliveries
  - Short-load incidents: 1 of 12 deliveries
  - Slump-test (quality) pass rate: 12 of 12 deliveries

  This is the SECOND consecutive quarter this vendor has fallen below the on-time threshold.

  Build a scorecard against each SLA metric (pass/fail), calculate the on-time performance gap
  in percentage points versus the 95% requirement, and recommend the next contractual action
  given this is a repeat, not first-time, shortfall.
signals:
  - {type: numeric, value: 83.3, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 95, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(corrective action|second consecutive|repeat|escalat)\\b", weight: evidence}
notes: |
  Operations Task 02 -- vendor SLA scorecard from given metrics (easy). Industry: aec.
  Arithmetic verified: on-time = 10/12 = 83.33%, versus the 95% SLA target -- a gap of 11.67
  percentage points, a clear fail. Short-load = 1/12 = 8.33%, versus the <=2% SLA target -- also
  a fail (over by 6.33 points). Quality = 12/12 = 100%, a pass. The "second consecutive quarter"
  fact is load-bearing: it should escalate the recommended remedy beyond a first-offense warning
  toward a formal corrective action plan (or invoking liquidated damages), not a repeat of the
  same soft warning already given last quarter.
