id: operations-08
unit: operations
difficulty: hard
class: long
industry: msp_internal
prompt: |
  Leadership at your MSP needs to cut $18,000/month in internal operating cost within this
  quarter (3 months), without breaching any client SLA or eating an avoidable vendor penalty.
  Candidate actions:

  A. Cancel the underutilized RMM overflow-tier license: saves $4,200/month, no penalty,
     effective immediately.
  B. Terminate the secondary data-center colo contract early: saves $9,500/month, BUT 8 months
     remain on the contract with an early-termination penalty of $6,000 per remaining month
     ($48,000 total if canceled now). The contract converts to penalty-free month-to-month in
     4 months.
  C. Renegotiate the internal software/tooling stack down a tier: saves $2,800/month, takes 6
     weeks to implement (vendor renewal-cycle timing), no penalty.
  D. Optimize on-call shift scheduling to eliminate redundant overlap coverage: saves
     $3,100/month, effective immediately. Confirmed compliant with the SLA-required minimum of
     2 named on-call engineers covering every shift at all times.
  E. Sublease unused office floor space: saves $7,900/month, but requires landlord sign-off with
     a mandatory 60-day notice period before the savings take effect.

  Sequence which actions to take, and when, to reach the $18,000/month target within the
  quarter. Specifically evaluate option B: calculate the penalty cost of canceling it now versus
  the value of capturing its savings 4 months earlier, and state whether canceling it now is a
  net gain or a net loss compared to simply waiting for the penalty-free window -- and whether B
  is even needed to hit the $18,000/month target at all. Confirm the on-call SLA floor is
  preserved under D.
signals:
  - {type: numeric, value: 18000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 48000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(penalty|termination fee)\\b", weight: critical}
  - {type: numeric, value: 10000, tolerance: 0.02, weight: evidence}
notes: |
  Operations Task 08 -- cost-reduction sequencing (hard). Industry: msp_internal.
  Arithmetic verified: A+C+D+E = 4,200+2,800+3,100+7,900 = $18,000/month exactly -- the full
  target is achievable WITHOUT touching option B at all. Run-rate timing: A+D effective
  immediately ($7,300/month), C effective ~6 weeks in (+$2,800 -> $10,100/month), E effective
  once the 60-day landlord notice completes, by month 3 (+$7,900 -> full $18,000/month run
  rate by month 3, within the quarter).
  Non-obvious hard element: option B has the largest single monthly savings figure ($9,500),
  making it look like the obvious first lever to pull -- that is the trap. Canceling it now
  costs a $48,000 penalty (8 months x $6,000). Waiting the 4 months to the penalty-free window
  instead means forgoing $9,500/month for those 4 months, an opportunity cost of 4 x $9,500 =
  $38,000. Since $48,000 (cost of acting now) > $38,000 (value of the 4 months of earlier
  savings), canceling B now is a net loss of $48,000 - $38,000 = $10,000 versus simply waiting
  -- and since the $18,000/month target is already fully met by A+C+D+E, there is no reason to
  touch B this quarter at all; it should be deferred to month 5+ when it becomes free money on
  top of the achieved target.
