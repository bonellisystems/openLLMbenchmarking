id: operations-03
unit: operations
difficulty: medium
class: standard
industry: healthcare_compliance
prompt: |
  You manage inventory policy for a clinic's refrigerated insulin vial stock. Facts:
  - Average demand: 140 vials/week
  - Supplier lead time: 2 weeks
  - Current reorder point (ROP): 200 vials
  - Vials have a 60-day shelf life from receipt (roughly 8.5 weeks)
  - Current replenishment order quantity: 560 vials (about a 4-week supply at average demand)
  - Three stockout events in the past 6 months, each lasting 4-5 days, all coinciding with weeks
    where a local seasonal diabetes-outreach event pushed demand to about 185 vials/week (about
    32% above average)

  Calculate the average demand expected DURING the 2-week lead time and compare it to the
  current reorder point to explain why stockouts are close to inevitable even without a demand
  spike. Propose a new reorder point that builds in a safety-stock buffer sized to cover one
  spike-level week during the lead-time window. Confirm your recommended order quantity still
  respects the 60-day shelf-life limit (no overstocking into expiry waste). State a baseline ->
  target KPI for stockout incidents.
signals:
  - {type: numeric, value: 280, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 200, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bsafety[- ]stock\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(60[- ]day|shelf life|expir)\\b", weight: note}
notes: |
  Operations Task 03 -- inventory/stockout policy from demand data (medium). Industry:
  healthcare_compliance (cold-chain pharmaceutical inventory).
  Arithmetic verified: average lead-time demand = 140 vials/week x 2 weeks = 280 vials -- this
  already exceeds the current 200-vial reorder point, so the current policy runs out even under
  perfectly average demand, before any spike is even considered; that's the core diagnostic
  finding a correct answer must surface (root cause is a reorder point set below baseline
  lead-time demand, not "bad luck" during the spike weeks). Proposed reorder point: 280 (average
  lead-time demand) + spike excess of 185-140=45 (one elevated week's extra pull) = ~325 vials;
  not gated by a signal at that exact figure since reasonable safety-stock sizing varies, but
  the two anchor numbers (280 and the flawed 200 ROP) must appear. Order quantity check: 560
  vials at 140/week = 4 weeks of supply, comfortably inside the ~8.5-week shelf life, so the
  existing order quantity does not need to shrink to avoid expiry waste even after the ROP fix.
