id: operations-07
unit: operations
difficulty: hard
class: long
industry: financial_services
prompt: |
  Run an incident postmortem for a payments company. Facts:

  - The nightly ACH settlement batch processes payouts for 4,200 merchants. The job failed
    partway through at 11:15 PM after successfully processing 40% of merchants; the remaining
    60% did not receive their payout that night.
  - The automated retry policy fires 3 retries spaced 15 minutes apart (11:30 PM, 11:45 PM,
    12:00 AM) before a human on-call engineer is paged -- a 45-minute designed escalation
    window.
  - The on-call engineer's phone was set to Do Not Disturb, and this settlement-batch alert was
    not on their configured DND-override allowlist, so the 12:00 AM page produced no human
    response.
  - Human awareness of the incident did not actually occur until 2:15 AM, when a merchant's
    support ticket about a missing payout reached an engineer.
  - Root-cause investigation of the batch job failure itself traced it to a known, already
    open, lower-priority ticket: database connection-pool exhaustion under load.
  - Constraint: the team has a fixed on-call rotation with no budget approved for a dedicated
    24/7 NOC team -- any fix must work within the existing on-call model.

  Build the incident timeline. Quantify the merchant impact and the gap between the designed
  45-minute escalation window and the actual time to human awareness. Distinguish the proximate
  technical bug from the true driver of why this became a multi-hour, customer-impacting
  incident instead of a quick blip, and propose a process fix that targets the real driver
  without adding headcount. State explicitly why fixing only the database bug would not prevent
  a similarly bad incident recurring from a different, unrelated failure.
signals:
  - {type: numeric, value: 2520, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 180, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(DND|do not disturb)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(connection[- ]pool|database timeout)\\b", weight: note}
notes: |
  Operations Task 07 -- incident postmortem to process fix (hard). Industry: financial_services
  (ACH settlement batch incident).
  Arithmetic verified: merchants impacted = 4,200 x 60% = 2,520 (processed = 4,200 x 40% =
  1,680). Time from failure (11:15 PM) to actual human awareness (2:15 AM) = 3 hours = 180
  minutes, versus the designed 45-minute automated-escalation window -- a 4x overrun (180/45=4).
  Non-obvious hard element: the proximate bug (DB connection-pool exhaustion) is real and
  already tracked, but it is NOT why this became a 3-hour, 2,520-merchant incident -- a
  quick-blip failure of similar severity would normally have paged a human within 45 minutes.
  The true incident-severity driver is the DND-override misconfiguration in the alerting chain,
  which silently swallowed the page. A correct fix targets the alerting/escalation gap
  specifically (e.g., a settlement-batch failure severity class that bypasses DND entirely,
  or a secondary backup on-call path), achievable within the existing fixed-rotation on-call
  model without new headcount -- and the answer should note the DB bug still needs fixing, but
  fixing only it leaves the alerting gap in place for the next unrelated failure.
