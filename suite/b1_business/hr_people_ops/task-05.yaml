id: hr_people_ops-05
unit: hr_people_ops
difficulty: medium
class: standard
industry: oil_gas_energy
prompt: |
  A midstream services company is closing one field office due to a lost contract, effective in
  45 days. The closure affects 32 employees at that single site; total company headcount is 210
  employees across 3 locations.

  General background, not case-specific: WARN-type federal and state laws can require covered
  employers to give affected employees written notice -- often generally understood to be around
  60 days -- before a qualifying mass layoff or plant closing; exact coverage thresholds and notice
  requirements are jurisdiction- and fact-specific.

  Build the layoff plan: (1) the employee communication/talking points for the affected 32
  employees, (2) an explicit flag on the WARN-notice timing given that 45 days is less than the
  general 60-day figure above, and what should happen about that gap immediately, and (3) standard
  elements to include: severance, benefits continuation, references, and outplacement support.
signals:
  - {type: numeric, value: 45, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 60, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bwarn\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(employment counsel|counsel)\\b", weight: critical}
notes: |
  HR & People Ops Task 05 -- layoff-communication + WARN-awareness at a general level (medium).
  Industry: oil_gas_energy. The 60-day WARN awareness figure is given directly in the prompt as
  general background (not asserted as this jurisdiction's specific rule), consistent with
  citation discipline -- "WARN-awareness at general level" per the authoring brief. Non-obvious
  element: 45 days of planned notice is LESS than the general 60-day figure just given, so a
  correct answer must catch this gap itself rather than treating 45 days as a fixed internal
  planning constant, and must flag that employment counsel should confirm WARN
  applicability/coverage thresholds immediately given the shortfall -- a late catch could carry
  statutory exposure if WARN applies here.
