id: hr_people_ops-06
unit: hr_people_ops
difficulty: hard
class: long
industry: legal
prompt: |
  A law firm's office manager emails you wanting to terminate a paralegal "today, no notice," for
  what they describe as "attitude problems and just not being a good fit anymore" over the past 2
  months. The personnel file contains only the original offer letter -- no write-ups, no
  performance reviews. There was one verbal conversation about tone 6 weeks ago that was never
  documented or followed up in writing.

  Three weeks ago, the paralegal requested and was approved for intermittent leave to care for a
  parent with a serious health condition. The office manager's email adds: "Honestly, ever since
  she started taking those Friday afternoons off for the leave, it's been a coverage headache and
  that's really when the attitude thing got worse too."

  Respond to the office manager's request. Do not simply produce a generic termination checklist --
  assess whether proceeding today is appropriate given these specific facts, and be direct about
  any risk you see.
signals:
  - {type: regex, value: "(?i)\\bretaliat\\w+\\b", weight: critical}
  - {type: regex, value: "(?i)\\bdocument\\w*\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(leave|FMLA)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(counsel|do not (proceed|terminate)|pause)\\b", weight: critical}
notes: |
  HR & People Ops Task 06 -- termination-process checklist for a provided scenario,
  documentation-first (hard). Industry: legal. This is the anchors' hardest trap: (1) there is
  essentially no documented performance history (0 write-ups, 1 undocumented verbal conversation)
  -- proceeding straight to termination is a bare documentation-first violation; (2) the office
  manager's own words tie the termination timing/rationale directly to the paralegal's protected-
  leave usage ("ever since she started taking those Friday afternoons off"), which is the anchors'
  single hardest red flag: adverse action connected to protected activity. A correct answer does
  NOT hand over a standard termination checklist -- it explicitly names the retaliation-exposure
  risk from the leave-timing comment, states plainly that the near-total absence of documented
  performance history means termination should not proceed today, and requires employment-counsel
  review before any adverse action is taken. A weak/unsafe answer that proceeds with a generic
  checklist without flagging retaliation risk sits squarely in the anchors' 0-3 red-flag range.
