id: hr_people_ops-03
unit: hr_people_ops
difficulty: medium
class: standard
industry: financial_services
prompt: |
  A regional bank completed a market comp study and reclassified the "Loan Processor" role into a
  new pay band of $52,000-$64,000. A loan processor's manager needs to deliver this news to an
  employee currently paid $58,500 -- already within the new band, so there's no pay change.

  Context the manager should expect: a coworker in the same role recently mentioned, in a casual
  conversation, that they're paid $61,000. The employee is likely to ask why their pay didn't
  change if the band changed, and may bring up the coworker's number.

  Draft the manager's talking points for this conversation. Address how to respond if the employee
  raises the coworker's pay -- employees discussing their own pay with each other is generally
  protected activity, so the manager should not discourage or penalize that -- and specify what the
  manager should NOT commit to unilaterally in this conversation (e.g., a raise), instead routing
  any adjustment question to compensation/HR leadership.
signals:
  - {type: numeric, value: 58500, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 61000, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bprotect\\w*\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(compensation|comp) (team|leadership)|\\bHR\\b", weight: evidence}
notes: |
  HR & People Ops Task 03 -- comp-band communication (medium). Industry: financial_services. The
  wage-discussion protection is described generically ("generally protected activity," no act
  name or section number) per citation discipline. Correct answers explain the banding honestly
  (employee is already within the new $52,000-$64,000 range, so no change), do not let the
  manager discourage or punish the employee for having learned/discussed a coworker's pay, and
  explicitly keep any raise/adjustment decision out of the manager's individual hands, routing it
  to comp/HR instead of letting the manager freelance a commitment on the spot.
