id: hr_people_ops-01
unit: hr_people_ops
difficulty: easy
class: short
industry: generic_smb
prompt: |
  A small retail-services business just hired its first-ever operations coordinator, starting in
  2 weeks. The hiring manager wants a plan covering:

  1. Pre-boarding paperwork, including federal employment-eligibility verification (Form I-9),
     which generally must be completed within 3 business days of the employee's start date.
  2. Systems and access provisioning (laptop, email, scheduling software) ready on day one.
  3. A first-week schedule and a buddy assignment.
  4. A 30-60-90 day outline of ramp-up goals.

  Build the onboarding plan covering these four points. Note briefly whether anything about this
  role's pay classification (exempt vs. non-exempt) should be double-checked against actual job
  duties before finalizing the pay-related paperwork, rather than assumed from the job title.
signals:
  - {type: regex, value: "(?i)\\bi-?9\\b", weight: critical}
  - {type: numeric, value: 3, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(30-?60-?90|first[- ]week)\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(exempt|non-exempt)\\b", weight: evidence}
notes: |
  HR & People Ops Task 01 -- onboarding plan (easy). Industry: generic_smb. Low-stakes,
  document-work task as intended for the easy tier. The I-9 3-business-day figure is stated as a
  general, well-established fact directly in the prompt (not something the model must recall or
  cite to a specific code section), consistent with citation discipline. The exempt/non-exempt
  classification check is a light, general FLSA-adjacent awareness touch (referenced only at the
  general level, no section number) rather than a definitive classification call.
