id: hr_people_ops-07
unit: hr_people_ops
difficulty: hard
class: long
industry: healthcare_compliance
prompt: |
  A hospital-system billing-department employee submits a doctor's note documenting a chronic back
  condition and requests to work from home 3 days per week as an accommodation. The role's only
  on-site requirement is a weekly manual reconciliation task that touches a secure on-site server;
  IT policy says that server cannot be accessed remotely without a VPN connection plus a hardware
  security token, which this employee does not currently have issued but which IT could issue.

  The employee's manager emails you: "I don't think we can do this -- the job requires being in
  the office, so I'm just going to deny the request and tell her no." The manager has not spoken
  with the employee beyond receiving the note.

  Respond to the manager. Explain what's wrong with jumping straight to a denial here, describe
  what should happen next given the one concrete access barrier described, and address how the
  medical documentation itself should be handled.
signals:
  - {type: regex, value: "(?i)\\binteractive process\\b", weight: critical}
  - {type: regex, value: "(?i)\\bundue hardship\\b", weight: critical}
  - {type: regex, value: "(?i)\\bconfidential\\w*\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(HR|counsel|ADA coordinator)\\b", weight: evidence}
notes: |
  HR & People Ops Task 07 -- accommodation-request interactive process, ADA general level (hard).
  Industry: healthcare_compliance. Textbook version of the brief's "accommodation where the
  obvious answer skips the interactive process": the manager's instinct is a flat, unilateral
  denial based on an assumption ("the job requires being in the office") without ever engaging the
  employee. A correct answer explains that ADA practice generally calls for an interactive process
  before concluding a request can't be accommodated, outlines what that process looks like here
  given the single concrete barrier (issuing the hardware token so the one recurring on-site task
  can be done via VPN, or reassigning that task on remote days), states that any eventual "undue
  hardship" conclusion needs to be documented with specifics rather than asserted, flags HR/ADA-
  coordinator and likely counsel involvement given the medical documentation, and addresses
  keeping the medical note confidential and separate from the regular personnel file. ADA is
  referenced only at the general level per citation discipline, consistent with the authoring
  brief's explicit call for "ADA general level."
