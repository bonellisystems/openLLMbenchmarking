id: hr_people_ops-04
unit: hr_people_ops
difficulty: medium
class: standard
industry: aec
prompt: |
  A structural-engineering firm's project manager has a CAD drafter with documented performance
  issues over the past 90 days. Three prior written check-in notes are already on file:

  - Week 3: missed the deadline for the Meridian Tower drawing package by 4 days.
  - Week 6: QA flagged 4 drawing-revision errors in a single deliverable that should have been
    caught before submission.
  - Week 9: a client contact emailed a complaint about slow response times on RFIs (requests for
    information).

  The manager wants to move to a formal Performance Improvement Plan (PIP) rather than further
  informal check-ins. Build a 30-60-90 day PIP with specific, measurable goals tied to the three
  documented issues above (deadline adherence, QA error rate, RFI response-time), and state what
  should happen at each checkpoint. Note how the PIP should reference the prior documented
  check-ins, and what should happen if a protected leave or accommodation request comes up during
  the PIP period.
signals:
  - {type: regex, value: "(?i)\\bdocument\\w*\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(30|60|90)[- ]day\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(HR|employment counsel)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(accommodation|protected leave)\\b", weight: critical}
notes: |
  HR & People Ops Task 04 -- performance-improvement-plan from provided documentation (medium).
  Industry: aec. All performance facts (the 3 prior check-ins with specific dates/figures) are
  given inline; a correct PIP references this existing paper trail rather than treating the
  issues as newly surfaced. Excellence markers per the anchors: the PIP ties measurable goals
  directly to the 3 documented issues, flags that any post-PIP termination decision should go
  through HR/employment counsel before execution, and explicitly notes that a protected-leave or
  accommodation request arising during the PIP period must pause/adjust the plan rather than be
  read as a further performance failure -- the protected-class-awareness weave the anchors call
  for.
