id: hr_people_ops-02
unit: hr_people_ops
difficulty: easy
class: short
industry: manufacturing_ag
prompt: |
  An employee at an ag-equipment manufacturer emails HR:

  "I have 8 PTO days left as of December 31 -- do I lose any of them, or does it all roll over
  automatically since nobody told me otherwise? Also, I work out of the satellite office, not
  headquarters, if that matters."

  The employee handbook, Section 4.3 (Paid Time Off), states: "Full-time employees accrue PTO at a
  rate of 1.25 days per month (15 days/year). Up to 5 unused PTO days may be carried over into the
  next calendar year; any balance above 5 days as of December 31 is forfeited, except where
  carryover in excess of this limit is required by applicable state law."

  Answer the employee using Section 4.3: state exactly how many of the 8 days carry over and how
  many are forfeited under the general policy, and address why the satellite-office detail matters
  given the clause's state-law exception.
signals:
  - {type: numeric, value: 5, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 3, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bsection 4\\.3\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bstate law\\b", weight: critical}
notes: |
  HR & People Ops Task 02 -- policy Q&A from a provided handbook excerpt (easy). Industry:
  manufacturing_ag. Arithmetic: 8 days - 5-day carryover cap = 3 days forfeited under the default
  policy (simple, unambiguous derivation from given numbers, same pattern as the finance-01
  exemplar). The satellite-office detail is the point of the question: Section 4.3's own text
  carves out an exception where state law requires carryover above the 5-day cap, so a correct
  answer flags that HR should confirm the employee's work-state before applying the default 5/3
  split, rather than mechanically forfeiting the 3 days without checking.
