id: helpdesk-02
unit: helpdesk
difficulty: easy
class: short
industry: oil_gas_energy
prompt: |
  A field technician at a remote drilling rig is locked out of their corporate laptop. Login
  requires MFA via a push notification to an authenticator app, but the rig's only connectivity
  is a metered VSAT satellite link currently saturated by SCADA/drilling telemetry, so the push
  notification never arrives. The technician's personal cell phone also has no signal at the
  site, so SMS-based backup MFA won't work either. The technician needs access today to submit
  a drilling report with a regulatory submission deadline. Your team's standard MFA-reset
  procedure requires verifying the user's identity via a callback to their on-file cell number
  -- which is not possible here since there's no cell signal at the site. Describe the
  identity-verification and account-recovery path you would use in this situation that doesn't
  depend on SMS or push delivery, while still actually verifying it's the technician (not
  disabling MFA for the account or issuing a shared/generic credential), and what you would
  document afterward.
signals:
  - {type: regex, value: "(?i)\\b(TOTP|authenticator app|hardware token|backup code|recovery code)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(document|logged|audit)\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(out[- ]of[- ]band|verify|supervisor)\\b", weight: note}
notes: |
  Helpdesk Task 02 -- password/MFA lockout flow (easy). Industry: oil_gas_energy (remote rig,
  no cell/SMS coverage). Load-bearing element: the site's connectivity profile rules out both
  of the two normal MFA-recovery channels (push over VSAT, SMS callback), so a generic "reset
  MFA and text them a code" answer fails; the correct path uses a connectivity-independent
  method (offline TOTP code, pre-issued hardware token, or printed backup/recovery codes) plus
  an alternate identity-verification channel (e.g., a supervisor vouching), not a blanket
  MFA-disable for the account.
