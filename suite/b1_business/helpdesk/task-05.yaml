id: helpdesk-05
unit: helpdesk
difficulty: medium
class: standard
industry: manufacturing_ag
prompt: |
  Convert this resolved ticket into a knowledge-base article for the rest of the helpdesk team.

  Ticket summary: Handheld barcode scanners used in a poultry plant's freezer/cold-storage area
  repeatedly dropped WiFi and failed to sync lot-tracking scans, forcing workers to re-scan
  pallets and creating a risk of a gap in USDA lot-tracking coverage. Investigation: the
  freezer-area WiFi access point was mounted on a metal support beam near the walk-in cooler
  door; signal degraded further whenever the door (with its metal-clad outer skin) was closed,
  and condensation had formed inside the AP's outdoor-rated enclosure from the cold. Fix
  applied: relocated the AP away from the metal beam and the door's swing path, and enabled
  2.4GHz band steering for that access point specifically, since 2.4GHz penetrates the metal/
  cold environment better than 5GHz at this location. No scan drops since the relocation.

  Write the KB article using your team's standard structure -- Symptom, Root Cause, Resolution,
  Prevention -- and make sure Prevention covers what to check FIRST next time (a faster
  diagnostic than immediately rolling a truck to physically relocate hardware again).
signals:
  - {type: regex, value: "(?i)\\bRoot Cause\\b", weight: critical}
  - {type: regex, value: "(?i)\\bPrevention\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(metal|RF interference|signal)\\b", weight: evidence}
notes: |
  Helpdesk Task 05 -- KB article from a resolved ticket (medium). Industry: manufacturing_ag
  (poultry plant cold-storage). Load-bearing element: the root cause is specific to the physical
  environment (metal beam/door + cold-induced condensation degrading RF), which a generic
  "check the WiFi settings" KB article would not capture, and the USDA lot-tracking stakes are
  why the article needs a real Prevention section rather than just a fix log.
