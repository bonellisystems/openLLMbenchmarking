id: helpdesk-04
unit: helpdesk
difficulty: medium
class: standard
industry: financial_services
prompt: |
  A regional bank's core-banking system needs a 90-minute planned maintenance window this
  Saturday, 2:00-3:30 AM ET -- the lowest-traffic period. During that window, online banking,
  the mobile app, and debit card authorizations will all be unavailable; branches are closed at
  that hour, so there is no teller-facing impact. For a bank, any customer-facing outage notice
  has to stay factual and calm, and must not imply that account security has been compromised
  (wording that reads like a breach notice can itself trigger unnecessary customer panic).
  Produce two things: (1) the customer-facing communication -- a short website/app banner and a
  one-paragraph push notification -- announcing the maintenance window, written so it reads as
  routine and not alarming, and (2) a short internal Slack message to branch staff so they can
  reassure any customer who calls in during or right after the window, without repeating a full
  incident-style writeup.
signals:
  - {type: numeric, value: 90, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(debit card|online banking|mobile banking)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bbranch staff\\b|\\bteller\\b", weight: note}
notes: |
  Helpdesk Task 04 -- user-comms drafting (medium). Industry: financial_services (bank customer
  comms). Load-bearing element: banking-specific tone constraint (must not read as a
  security/breach notice, since that reads very differently for a bank than a generic outage
  notice would) drives specific word-choice requirements a generic maintenance-window template
  would miss. Task explicitly requires two distinct deliverables (external + internal) so the
  response can't satisfy the signal by producing only the customer-facing piece.
