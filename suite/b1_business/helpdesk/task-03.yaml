id: helpdesk-03
unit: helpdesk
difficulty: medium
class: standard
industry: healthcare_compliance
prompt: |
  A clinic's ticket, "Scheduling system won't load for front-desk staff," was submitted at
  8:02 AM and tagged P2 (4-hour SLA per your MSP's contract). The assigned tech picked it up at
  8:15 AM, tried one remote fix, then left a voicemail asking the clinic's office manager to
  call back to confirm before doing anything further, and moved on to other tickets. No one
  called back. At 1:45 PM -- 5 hours 43 minutes after the ticket was created, 1 hour 43 minutes
  past the P2 SLA -- the clinic manager escalated, upset. In the meantime, front-desk staff had
  been manually logging patients on paper because the scheduling system was still down, and
  those paper logs (containing patient names and appointment reasons) had been sitting openly
  at the front desk rather than being handled per the clinic's PHI-safeguard policy. Address
  three things: (a) specifically what process failure caused the SLA breach -- not just "the
  tech should have followed up faster," (b) the immediate steps to take right now for both the
  still-open ticket and the paper-log PHI exposure, and (c) what should change in the workflow
  so a single unreturned callback doesn't silently blow through an SLA again.
signals:
  - {type: regex, value: "(?i)\\b(escalat|follow[- ]up|re-?attempt)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(PHI|protected health information)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bbreach(ed)?\\b", weight: evidence}
notes: |
  Helpdesk Task 03 -- SLA breach handling (medium). Industry: healthcare_compliance (clinic,
  PHI exposure). Non-obvious element for a medium task: the real process failure isn't "the
  tech was slow" -- it's that the tech let the SLA clock run with no fallback trigger once the
  callback went unanswered (no re-attempt, no proactive escalation), effectively treating an
  SLA-clocked ticket as paused-by-default on an outbound voicemail with no such stop-clock
  provision stated. A strong answer should also treat the exposed paper patient logs as its own
  parallel PHI-handling problem, not just a scheduling-system outage.
