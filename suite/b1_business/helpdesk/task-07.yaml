id: helpdesk-07
unit: helpdesk
difficulty: hard
class: long
industry: public_sector
prompt: |
  A county commissioner's county-issued laptop won't boot -- it shows a BitLocker recovery-key
  prompt, most likely triggered by firmware/TPM drift after the county's overnight BIOS update
  push. She is due to present the county's public, livestreamed annual budget hearing in 40
  minutes, from a presentation she finished editing on this laptop last night; the final version
  was saved locally and never synced to OneDrive. She is a VIP (elected official) and is
  understandably anxious about the clock. The BitLocker recovery key for her device is escrowed
  in the county's Active Directory / Entra tenant and retrievable by the helpdesk. Give the
  immediate step-by-step response, explain why the VIP pressure and the 40-minute clock should
  NOT change the order of the standard non-disruptive-first process (i.e., why reimaging the
  laptop to "just get her working fast" would be the wrong move here), and describe a backup
  path you'd work in parallel in case the escrowed key doesn't resolve it in time.
signals:
  - {type: regex, value: "(?i)\\bBitLocker\\b", weight: note}
  - {type: regex, value: "(?i)\\brecovery key\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(parallel|simultaneous|at the same time)\\b", weight: evidence}
  - {type: numeric, value: 40, tolerance: 0.01, weight: note}
notes: |
  Helpdesk Task 07 -- VIP incident (hard). Industry: public_sector (elected official, public
  hearing). Non-obvious hard element: VIP urgency is exactly the pressure that tempts a
  disruptive first move (reimage to get her a "clean working laptop" fast), which would destroy
  the only local copy of last night's edited deck; the correct move is retrieving the escrowed
  BitLocker recovery key to unlock the existing drive intact. Given the tight 40-minute window,
  the strong answer should also run a backup path (checking for any earlier synced version, or
  prepping a loaner) in parallel rather than only sequentially after the primary path.
