id: helpdesk-01
unit: helpdesk
difficulty: easy
class: short
industry: legal
prompt: |
  You are the helpdesk lead for a 30-attorney law firm. Four tickets came in within the last
  30 minutes:

  Ticket A -- Submitted by a name partner (flagged VIP in the ticketing system): "Need my
  email signature updated with the new firm logo."
  Ticket B -- Submitted by an associate: "Can't log into the court's e-filing portal. We have
  a filing deadline with the court in 90 minutes on an active litigation matter."
  Ticket C -- Submitted by a paralegal: "My second monitor flickers on and off sometimes."
  Ticket D -- Submitted by the office manager: "The document management system (DMS) that
  holds every active case file is down for the entire firm -- all 30 attorneys are affected."

  Your standard SLA tiers: P1 = business-critical or an imminent legal/court deadline, 1-hour
  SLA. P2 = significant single-user impact, 4-hour SLA. P3 = minor or cosmetic, next-business-
  day. Triage all four tickets: give each one a priority tier, order them for handling, and
  justify each call using the actual business/legal impact described -- not who submitted it.
signals:
  - {type: regex, value: "(?i)\\bP1\\b", weight: critical}
  - {type: regex, value: "(?i)\\bP3\\b", weight: critical}
  - {type: regex, value: "(?i)\\bdeadline\\b", weight: evidence}
notes: |
  Helpdesk Task 01 -- ticket triage queue (easy). Industry: legal (law firm court deadline).
  Load-bearing element: the VIP-flagged ticket (A, a cosmetic signature change) must NOT be
  prioritized above the firm-wide DMS outage (D) or the 90-minute court filing deadline (B) --
  this is the core "triage priority matches actual business impact, not who asked" anchor
  marker. Both B and D are legitimately P1 (firm-wide outage vs. a hard external deadline); a
  strong answer should be able to justify handling either first, but the signature request (A)
  must land at P3 and the flickering monitor (C) is not urgent.
