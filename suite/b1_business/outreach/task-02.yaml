id: outreach-02
unit: outreach
difficulty: easy
class: short
industry: aec
prompt: |
  You sell BIM (Building Information Modeling) clash-detection coordination software. Ironwood
  Structural Group, a happy existing customer for 14 months, just had a check-in call with your
  CSM. Notes from that call:

  - Their 22-engineer team ran 340 clash-detection runs last quarter and estimates the tool
    caught about $180,000 in field-rework costs before construction started.
  - The champion mentioned they know the principal at Bramwell Architecture Partners, a firm
    Ironwood frequently co-bids projects with, and said: "Bramwell's still doing clash
    detection by hand -- I've told them they need this."

  Write a referral-ask email to the Ironwood champion, referencing their own account's specific
  usage and savings figures, and directly naming Bramwell Architecture Partners as the referral
  ask.
signals:
  - {type: contains, value: "Bramwell", weight: critical}
  - {type: numeric, value: 180000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 340, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bclash detection\\b", weight: evidence}
notes: |
  Outreach Task 02 -- referral-ask email from a provided customer dossier (easy). Industry: aec.
  Discriminating signals: the $180,000 rework-savings figure and the 340 clash-detection runs
  are the customer's own account-specific results the ask must reference to feel earned rather
  than generic; "Bramwell Architecture Partners" is the specific named referral target the
  dossier volunteers. This is a warm 1:1 relationship email to an existing champion, not bulk
  cold outreach, so an unsubscribe line is not required here.
