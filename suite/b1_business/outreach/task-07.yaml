id: outreach-07
unit: outreach
difficulty: hard
class: long
industry: legal
prompt: |
  You sell e-discovery software to law firms. Two weeks ago your SDR sent litigation partner
  Diane Okafor, of the 12-attorney firm Okafor & Reyes, an initial cold email about the product;
  a LinkedIn connection request went out the same day. She replied -- the only reply on
  record:

  "I got your first email and the LinkedIn request together within the same day -- that's a lot
  for a first touch, and we're heads-down through a jury trial starting in 3 weeks. If this is
  worth pursuing: email only, no more than once every two weeks, and nothing until after the
  trial wraps -- about 6 weeks out."

  She did not decline. She left the door open, explicitly at reduced frequency and a single
  channel. Design the multi-channel cadence going forward. The correct design pulls back sharply
  from a typical multi-touch, multi-channel cadence: honor the single-channel (email-only)
  request, cap frequency at no more than once every two weeks, and hold a firm pause of about 6
  weeks before the first resumed touch. Include an unsubscribe line on the resumed emails.
signals:
  - {type: regex, value: "(?i)\\b(biweekly|bi-weekly|every (two|2) weeks)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(email[- ]only|single[- ]channel)\\b", weight: critical}
  - {type: regex, value: "(?i)\\btrial\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(unsubscribe|opt[- ]?out)\\b", weight: critical}
notes: |
  Outreach Task 07 -- multi-channel cadence design (hard). Industry: legal. Load-bearing
  industry element: the litigation partner's reduced-contact, single-channel request reads as a
  confidentiality/bandwidth-conscious posture typical of law-firm buyers reluctant to be
  publicly or repeatedly contacted mid-trial. Non-obvious hard element: the correct cadence is
  LESS frequent and narrower in channel than a normal multi-touch cadence would recommend -- a
  weak answer resumes a standard multi-channel drip (email + LinkedIn + calls) or shortens rather
  than honors the requested two-week-minimum spacing and 6-week pause tied to her trial.
