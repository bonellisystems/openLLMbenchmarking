id: outreach-06
unit: outreach
difficulty: hard
class: long
industry: public_sector
prompt: |
  Your company submitted a response to an open RFP (RFP #PH-2026-0219, records-management
  software) issued 12 days ago by the Overlook County Public Health Department. The RFP's
  procurement rules include an explicit "quiet period" / no-contact clause: from the RFP's
  issuance date until the contract-award decision, vendors are prohibited from any direct
  contact with evaluation-committee members or agency staff about the RFP outside the official
  Q&A process administered by the county procurement office. Violating the quiet period can
  result in disqualification from the RFP. The award decision isn't expected for another 60
  days.

  Jordan Alvarez, IT Procurement Analyst, is a listed member of the evaluation committee for
  this RFP.

  Design a first-contact/call-scheduling flow for engaging Jordan Alvarez, given the quiet-
  period rule above. Be explicit about what the flow does and does not do during the 60-day
  quiet period, and when normal outreach cadence can resume.
signals:
  - {type: regex, value: "(?i)\\b(quiet period|no-contact|blackout)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bdisqualif", weight: critical}
  - {type: regex, value: "(?i)\\b(Q&A|procurement office)\\b", weight: critical}
  - {type: contains, value: "Jordan Alvarez", weight: evidence}
notes: |
  Outreach Task 06 -- first-call scheduling flow with opt-out/compliance framing (hard).
  Industry: public_sector (RFP procurement rules are the load-bearing industry element). Non-
  obvious hard element: the instinct is to schedule a call with the named contact as soon as
  possible; the correct, compliant flow is the opposite -- no direct outreach whatsoever to
  Jordan Alvarez or any evaluation-committee member during the 60-day quiet period, with all
  questions routed through the official procurement Q&A channel, and normal cadence resuming
  only after the award decision (or for unrelated, non-RFP opportunities). A weak answer designs
  a standard cold-call cadence that ignores the quiet-period rule entirely.
