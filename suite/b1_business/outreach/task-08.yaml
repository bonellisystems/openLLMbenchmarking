id: outreach-08
unit: outreach
difficulty: hard
class: long
industry: oil_gas_energy
prompt: |
  Cascade Midstream Services, a pipeline-services company, went completely dark 5 months ago.
  The last CRM note, from VP of Engineering Tom Brennan, reads: "Corporate froze all new
  software spend after the Q3 layoffs -- 15% of the engineering team was let go. Check back
  after the new fiscal year starts, about 6 weeks out, once the new budget is approved." Two
  generic follow-up emails sent since then have gone unanswered.

  Write a re-engagement message for Tom Brennan. The correct approach references the SPECIFIC
  reason he gave -- the budget freeze following the Q3 layoffs -- and times the outreach to
  their actual fiscal-year budget reopening, rather than sending another generic "just checking
  in" message right away. A single, well-timed, specific message beats resuming a generic
  cadence immediately. Include an unsubscribe line.
signals:
  - {type: regex, value: "(?i)\\b(budget freeze|froze)\\b", weight: critical}
  - {type: numeric, value: 15, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bfiscal year\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(unsubscribe|opt[- ]?out)\\b", weight: critical}
notes: |
  Outreach Task 08 -- re-engagement of a gone-dark prospect (hard). Industry: oil_gas_energy
  (commodity-driven budget volatility and layoffs are a load-bearing industry pattern). Non-
  obvious hard element: the naive move after 5 months of silence is a generic "just checking in"
  nudge sent immediately; the correct move references the specific stated reason (the 15%
  post-layoff budget freeze) and times the message to the actual ~6-week fiscal-year budget
  reopening Tom Brennan named, rather than resuming a full generic cadence right away.
