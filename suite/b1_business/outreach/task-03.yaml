id: outreach-03
unit: outreach
difficulty: medium
class: standard
industry: financial_services
prompt: |
  You sell reconciliation-automation software for community banks. Prospect dossier for Elena
  Vasquez, VP of Operations at Alder Community Bank (~$2.1B in assets):

  - Two weeks ago she posted on LinkedIn: "Our reconciliation team is still doing month-end
    close with spreadsheets across 6 different systems -- 3 full days every month just to close
    the books. There has to be a better way in 2026."
  - You share a mutual LinkedIn connection, Marcus Webb, a former colleague of Elena's who is
    now a customer of yours at a different bank.

  Write a short LinkedIn connection request message (respecting LinkedIn's roughly 300-character
  limit on connection notes) plus a follow-up message to send after she accepts. Personalize
  using her specific post content (the 6-system, 3-day month-end close) and the Marcus Webb
  mutual-connection angle -- not a generic connection request.
signals:
  - {type: regex, value: "(?i)\\breconciliation\\b", weight: critical}
  - {type: regex, value: "(?i)\\bMarcus Webb\\b", weight: critical}
  - {type: numeric, value: 6, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bmonth-end\\b", weight: evidence}
notes: |
  Outreach Task 03 -- LinkedIn connection request + follow-up from a provided prospect dossier
  (medium). Industry: financial_services. Discriminating signals: the "6 different systems"
  detail from her own LinkedIn post and the named mutual connection Marcus Webb are dossier-
  specific personalization the outreach must actually use. LinkedIn connection/follow-up
  messages don't carry a legal unsubscribe requirement the way cold email does, so no opt-out
  signal is required here -- an intentional contrast with outreach-01's cold-email opt-out
  requirement, per the anchors' "wherever the channel or scenario implies one is required" test.
