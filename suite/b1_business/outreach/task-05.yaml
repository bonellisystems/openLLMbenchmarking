id: outreach-05
unit: outreach
difficulty: medium
class: standard
industry: healthcare_compliance
prompt: |
  You sent a cold email to hospital compliance officers about your HIPAA risk-assessment
  automation tool. Three replies came back. Write a branch response for each, handling them
  appropriately rather than with one copy-pasted reply:

  Reply 1 (positive), from Redwood Health Alliance: "This is actually well timed -- we have a
  Joint Commission survey in 6 weeks and our last risk assessment is over a year old. Can we
  grab 20 minutes this week?"

  Reply 2 (negative/objection): "We already have an internal compliance team that handles this
  manually. We're not looking to add another vendor tool right now."

  Reply 3 (out-of-office auto-reply): "I am out of the office until [date] with limited email
  access. For urgent compliance matters, please contact [backup contact]."

  For Reply 1, propose specific meeting logistics tied to the stated 6-week Joint Commission
  deadline. For Reply 2, address the objection honestly rather than pitching past it -- don't
  claim they need to switch tools if the honest answer is they may not. For Reply 3, describe
  how to handle the OOO correctly (don't immediately re-send; note the stated return context and
  time the next touch appropriately).
signals:
  - {type: numeric, value: 6, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bJoint Commission\\b", weight: critical}
  - {type: regex, value: "(?i)\\bout of office\\b", weight: evidence}
  - {type: regex, value: "(?i)\\binternal compliance team\\b", weight: evidence}
notes: |
  Outreach Task 05 -- reply-handling with positive/negative/OOO branches (medium). Industry:
  healthcare_compliance. Discriminating signals: the "6 weeks" Joint Commission survey deadline
  in Reply 1 must drive the proposed meeting timing, and "internal compliance team" from Reply 2
  must be engaged honestly rather than dismissed with a generic switch-vendors pitch, per the
  anchors' "don't pitch past the stated objection" red flag.
