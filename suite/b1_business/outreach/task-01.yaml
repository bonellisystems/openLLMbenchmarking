id: outreach-01
unit: outreach
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You sell a checkout-optimization and cart-recovery SaaS tool that integrates directly with
  Shopify. Prospect dossier for Coastal Trail Outfitters, a direct-to-consumer outdoor apparel
  brand:

  - They run their store on Shopify.
  - They launched a new hiking-boot product line 3 weeks ago.
  - The founder, in a podcast interview last month, said: "We're losing almost 40% of shoppers
    at checkout -- cart abandonment is brutal, and I don't know why."
  - It's an 8-person company; the founder is the sole decision-maker.

  Write a 3-touch cold email sequence (specify the timing between touches) that opens the deal.
  Personalize using the specific dossier details above -- the podcast quote, the Shopify
  platform, the new hiking-boot launch -- rather than a generic {first_name}-only merge. Include
  a clear sender identity and an unsubscribe/opt-out line, since this is unsolicited cold email.
signals:
  - {type: contains, value: "Shopify", weight: critical}
  - {type: regex, value: "(?i)\\bcart abandonment\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(unsubscribe|opt[- ]?out)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bhiking\\b", weight: evidence}
notes: |
  Outreach Task 01 -- cold-email 3-touch sequence from a provided prospect dossier (easy).
  Industry: generic_smb (DTC apparel e-commerce). Discriminating signals: "Shopify," "cart
  abandonment," and the hiking-boot launch are dossier-specific tokens the personalized sequence
  must actually use, not just a name merge tag. Cold outbound email requires an opt-out path per
  the anchors' compliance marker.
