id: outreach-04
unit: outreach
difficulty: medium
class: standard
industry: manufacturing_ag
prompt: |
  You met Derek Chen, Fleet Maintenance Manager at Prairie Grain Cooperative, at your booth at
  the AgriTech Solutions Expo last week. Notes from the booth scan:

  - Derek manages 85 pieces of John Deere precision-ag equipment across 3 regional depots.
  - He specifically asked whether your predictive-maintenance platform integrates with John
    Deere Operations Center telematics data, since that's his team's current data source. His
    team currently has zero integration between that data and any maintenance-planning tool, and
    relies on manual inspection logs.
  - He mentioned budget planning for next fiscal year starts in about 8 weeks.

  Write a 3-email event-follow-up sequence for the ~3 weeks after the show, specifying the
  cadence between emails. Personalize using the specific dossier details -- the John Deere
  Operations Center integration question and his 85-unit fleet across 3 depots -- and build the
  sequence toward being useful ahead of his 8-week budget-planning window. Include an unsubscribe
  line, since this follows a booth scan and is effectively cold email outreach.
signals:
  - {type: contains, value: "John Deere", weight: critical}
  - {type: numeric, value: 85, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(unsubscribe|opt[- ]?out)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bOperations Center\\b", weight: evidence}
notes: |
  Outreach Task 04 -- event-follow-up sequence from a provided booth-scan dossier (medium).
  Industry: manufacturing_ag. Discriminating signals: the John Deere Operations Center
  integration question and the 85-unit/3-depot fleet size are dossier-specific facts the
  sequence must reference, not generic "great meeting you at the show" boilerplate. A booth-scan
  follow-up is unsolicited commercial email, so an opt-out line is required per the anchors'
  compliance marker.
