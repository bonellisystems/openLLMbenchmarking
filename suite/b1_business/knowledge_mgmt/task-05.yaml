id: knowledge_mgmt-05
unit: knowledge_mgmt
difficulty: medium
class: standard
industry: manufacturing_ag
prompt: |
  Your MSP manages the file server for a USDA-inspected poultry processing plant with three
  production lines running in parallel. Right now, each line's barcode scanner writes
  lot-tracking scan logs into a single shared folder using a generic filename like
  "lot_log.csv", which gets overwritten every time a new lot starts on any line. A recent
  internal audit also found that the plant's own lot-numbering scheme -- a running 4-digit
  counter that resets to 0001 every quarter -- had produced the same lot number on two
  different lines within the same quarter, meaning two physically different lots of poultry
  now share an identical lot number in the retained records. That is exactly the kind of
  ambiguity a USDA lot-tracking audit is designed to catch.

  Propose a file/folder naming and lot-ID taxonomy that makes every retained scan-log filename
  unique and self-describing without opening the file, and that eliminates the lot-number
  collision across lines going forward. State what you do about the already-recorded,
  currently-ambiguous lot numbers from this quarter -- they cannot simply be renamed after the
  fact, because product has already shipped under those numbers.
signals:
  - {type: regex, value: "(?i)\\b(line[- ]?prefix|line identifier|per[- ]line|line[- ]?code)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(collision|duplicate|ambiguous|ambiguity)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(already[- ]shipped|already recorded|retroactive(ly)?|cannot (be )?renam)\\b", weight: note}
notes: |
  Knowledge Management Task 05 -- taxonomy/naming convention proposal (medium).
  Industry: manufacturing_ag (USDA-inspected poultry plant, multi-line lot tracking).
  Load-bearing industry fact: the naming/taxonomy fix must specifically prevent cross-line lot
  ID collisions (a plain running counter without a line identifier will collide again next
  quarter), and generic filenames must become self-describing without needing to open the
  file, because scan-log filenames are exactly what a USDA auditor would sample by name. The
  non-obvious element for a medium task: a taxonomy proposal only for GOING FORWARD is
  incomplete -- the prompt explicitly forces the answer to address the already-shipped,
  already-ambiguous historical records too, since simply renaming them after shipment would
  break traceability rather than fix it (the correct move is documenting/flagging the
  ambiguous historical pair with a compensating record, not silently renaming history).
