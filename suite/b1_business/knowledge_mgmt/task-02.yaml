id: knowledge_mgmt-02
unit: knowledge_mgmt
difficulty: easy
class: short
industry: aec
prompt: |
  Your MSP runs a weekly backup-verification process for a structural-engineering firm's
  project file server, which stores stamped structural calculation packages and construction
  drawings. Most state licensing boards require engineers to be able to produce these stamped
  records for a statute-of-repose period (commonly a decade or more after a project finishes)
  in case a professional-liability claim is filed years later -- so a silently failed backup
  here isn't just an inconvenience, it can leave the firm unable to defend a claim long after
  the project is closed out. Right now, verification is informal: whoever is free on Friday
  afternoon glances at a couple of recent filenames and calls it done.

  Write a Standard Operating Procedure, as a numbered list, for the recurring weekly
  backup-verification process. It must: confirm the backup job actually completed rather than
  just started, include a real restore-test of a sample file rather than only checking a
  completion log, and state exactly what to do if the same backup job fails verification two
  weeks in a row.
signals:
  - {type: regex, value: "(?i)\\brestore\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(two weeks|second (consecutive )?week|consecutive)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(statute[- ]of[- ]repose|retention)\\b", weight: evidence}
notes: |
  Knowledge Management Task 02 -- SOP for a recurring process (easy).
  Industry: aec (structural-engineering firm, stamped project records).
  Load-bearing industry fact: the statute-of-repose exposure means "backup completed" logging
  alone is not an acceptable verification standard for this client -- the SOP must include an
  actual restore-test of a sample file, not merely a green checkmark in a backup console,
  because a corrupt-but-"completed" backup would only be discovered years later when it's too
  late to matter. The escalation branch (two consecutive weekly failures) is the anchor's
  "failure/rollback branch for a step that can fail" marker; a weak answer states the routine
  weekly check but never says what happens when the SOP itself detects a real problem.
