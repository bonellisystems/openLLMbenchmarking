id: knowledge_mgmt-08
unit: knowledge_mgmt
difficulty: hard
class: long
industry: msp_internal
prompt: |
  Your MSP's leadership team met to decide on migrating all 40 client environments from your
  current RMM platform ("RMM-A") to a new one ("RMM-B"), and the meeting notes below are all
  that exist so far. Write this up as a proper decision record (ADR-style: Context, Decision,
  Consequences) that a future hire could read to understand not just what was decided but what
  happens if it goes wrong.

  Meeting notes: "RMM-A's per-endpoint pricing is getting expensive and it's missing the
  patch-approval workflows we keep needing. RMM-B has both. Plan: migrate client environments
  in phases over the next 90 days, starting with our smallest clients first. RMM-A auto-renews
  annually; the current term renews in 60 days unless we send written cancellation at least 30
  days before the renewal date. Everyone in the room agreed: let's do it, send the RMM-A
  cancellation notice, and start the phased migration."

  Write the ADR. It needs to explicitly deal with the timing conflict between the 90-day
  migration and the 30-day cancellation deadline, and state what happens to the clients not
  yet migrated if something goes wrong with RMM-B after RMM-A has already been cancelled.
signals:
  - {type: numeric, value: 30, tolerance: 0.05, weight: critical}
  - {type: regex, value: "(?i)\\bauto-?renew", weight: critical}
  - {type: regex, value: "(?i)\\b(rollback|fallback|contingency|parallel run|bridge|extension)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bconsequences\\b", weight: note}
notes: |
  Knowledge Management Task 08 -- decision-record (ADR-style) from a meeting summary (hard).
  Industry: msp_internal (the MSP's own RMM-platform migration decision).
  Non-obvious hard element (the anchors' "rollback branch everyone forgets," applied to a
  vendor-transition ADR rather than an incident runbook): the meeting notes' own plan is
  internally inconsistent -- migration is phased over 90 days, starting with the SMALLEST
  clients first, while the RMM-A cancellation notice must go out within 30 days to avoid
  auto-renewal. That means at the moment the cancellation notice is sent (day 30), only a
  fraction of clients (the early, smallest-first batch) have actually migrated, and RMM-A
  coverage will lapse well before the 90-day migration finishes for the remaining, larger
  clients. A naive ADR just restates the meeting's "send notice and migrate" plan as the
  decision. The correct ADR treats this as a real risk needing an explicit contingency --
  e.g., negotiating a short paid extension/month-to-month bridge with the RMM-A vendor, or not
  committing to full cancellation until enough of the client base has been validated on RMM-B
  -- rather than accepting a coverage gap as an unstated side effect of "everyone agreed."
