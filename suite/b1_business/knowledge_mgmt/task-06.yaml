id: knowledge_mgmt-06
unit: knowledge_mgmt
difficulty: hard
class: long
industry: public_sector
prompt: |
  Below is the incident chat transcript from a county 911 dispatch center's CAD
  (computer-aided-dispatch) outage last month, now fully resolved. Turn it into a reusable
  runbook for the next time this happens -- covering both the failover and the failback, as
  numbered steps, with prerequisites and a failure/rollback branch for the one step in this
  transcript that is easiest to get wrong.

  14:02 -- Dispatcher: Primary CAD (vendor-hosted) is unresponsive. Falling back to paper/radio
    per COOP now.
  14:04 -- IT: Bringing up the on-prem backup dispatch console, BACKUP-CAD01, as our fallback
    logging system.
  14:07 -- Dispatcher: BACKUP-CAD01 is up. Logging all new calls there directly since primary
    is still down.
  14:09 -- IT: Confirmed, primary CAD vendor says they're aware, no ETA yet.
  16:35 -- IT: Vendor confirms primary CAD is restored and passing their health check.
  16:40 -- Dispatcher: Should we just cut back over to primary now?
  16:42 -- IT: Cutting back now -- new calls go to primary again as of 16:42.
  16:50 -- Dispatcher: Primary's fine, we're all back on it. Are we done?

  Write the runbook. It should make explicit what has to happen to BACKUP-CAD01's data --
  everything logged there between 14:07 and 16:42 -- before that system is considered safe to
  leave idle again, and what you would have told the 16:50 dispatcher instead of "yes, we're
  done."
signals:
  - {type: regex, value: "(?i)\\b(reconcile|merge|export|import|sync)\\b", weight: critical}
  - {type: contains, value: "BACKUP-CAD01", weight: critical}
  - {type: regex, value: "(?i)\\b(record counts?|counts? match|no calls (are )?(lost|missing))\\b", weight: critical}
notes: |
  Knowledge Management Task 06 -- runbook from a resolved-incident transcript (hard).
  Industry: public_sector (county 911/CAD dispatch).
  Non-obvious hard element (matches the anchors' "rollback branch everyone forgets"): the
  transcript's own participants treat cutting back to primary at 16:42 as the end of the
  incident ("Primary's fine, we're all back on it. Are we done?"), but 2 hours 35 minutes of
  live dispatch data (14:07-16:42) now lives ONLY on BACKUP-CAD01 and was never in primary CAD
  at all. A mid-tier answer writes a clean failover runbook and stops there; the correct
  runbook adds an explicit failback/reconciliation step -- export or merge BACKUP-CAD01's
  calls into primary and verify the record count/completeness before treating BACKUP-CAD01 as
  idle again -- because skipping it silently loses the only record of every call handled
  during the outage. Public-sector 911 records also typically carry their own retention/
  public-records obligations, reinforcing why "just leave it on the backup box" is not an
  acceptable resolution. BACKUP-CAD01 and COOP (continuity of operations plan) are synthetic/
  generic terms, not invented specific product names.
