id: knowledge_mgmt-07
unit: knowledge_mgmt
difficulty: hard
class: long
industry: generic_smb
prompt: |
  Below is an existing KB article your MSP's compliance team found while cleaning up the
  knowledge base for a client (a regional retail chain that processes its own card payments
  in-store). Audit it for doc rot and say specifically what needs to change before this article
  can be trusted again -- don't just say "update it," name the actual stale elements.

  ---
  KB-114: Quarterly PCI DSS External Vulnerability Scan Process
  Last updated: March 2019. Tags: pci, compliance, scanning.

  Every quarter, log into the scanning portal and run an external scan against all Cardholder
  Data Environment IP ranges, per PCI DSS v3.2.1's quarterly external-scan requirement (scans
  must be run by an Approved Scanning Vendor). We use QualysGuard for this. Once the scan
  finishes, export the PDF report and email it to compliance-distro@ourclient.com, cc:
  jsmith@ourclient.com, since jsmith is our client contact and files it for the quarter. If the
  scan comes back with any "High" findings, that's fine as long as nothing is rated "Critical"
  -- just note it in the file and move on.
  ---

  Audit this article. Call out: (a) anything that references a standard, version, or
  requirement that is no longer current, (b) anything you cannot personally confirm is still
  accurate just from reading the article, and what you would check before relying on it, and
  (c) any instruction in the article that is not just stale but is actually the wrong thing to
  do if followed today.
signals:
  - {type: regex, value: "(?i)\\bPCI DSS v?4(\\.0)?\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(re-?scan|remediat)", weight: critical}
  - {type: contains, value: "Qualys", weight: evidence}
  - {type: regex, value: "(?i)\\bjsmith\\b", weight: note}
notes: |
  Knowledge Management Task 07 -- doc-rot audit of a provided stale article (hard).
  Industry: generic_smb (retail chain, in-store card processing / PCI scope).
  Real, verifiable staleness: PCI DSS v3.2.1 was retired March 31, 2024, and PCI DSS v4.0 is
  the sole current standard (v4.0's future-dated requirements became mandatory March 31,
  2025) -- an article that still cites v3.2.1 as current, with a "Last updated: March 2019"
  stamp and no owner/currency signal beyond a possibly-departed contact, is a clean doc-rot
  case per the anchors. "QualysGuard" is a legacy pre-rebrand product name the vendor has not
  marketed under in years, which the answer should flag as needing verification against the
  vendor's current offering (not asserted as a fact requiring an exact rebrand date). The
  non-obvious hard element (dangerous-if-followed instruction, not just cosmetically old): PCI
  ASV scanning fails a scan for any vulnerability at CVSS >= 4.0, which covers most "High"
  findings -- the article's "High findings are fine, just note it" instruction is not merely
  outdated, it is actively wrong guidance that would leave the client believing they passed a
  scan they didn't, which is exactly the anchors' "gives a dangerously wrong sequence" red
  flag distinguishing this from ordinary staleness. jsmith@ourclient.com being named as "the"
  contact with no verification note is the missing-currency/ownership-signal marker.
