id: knowledge_mgmt-04
unit: knowledge_mgmt
difficulty: medium
class: standard
industry: legal
prompt: |
  A retiring senior IT admin at a 60-attorney law firm left you these tribal-knowledge notes on
  their last day. Turn them into a proper onboarding document for the new IT support hire --
  numbered steps or clear rules, each with a short reason attached so the new hire understands
  why the rule exists, not just what to do.

  Notes, as left:
  - "Never create a new matter folder in iManage before Records confirms the conflicts check
    has cleared. If you jump the gun and the conflict check later comes back positive, you've
    already given the wrong people file access, and that's an ethics problem, not just an IT
    mess to clean up."
  - "Ethical walls: some clients are on the restricted list. When a request looks anywhere near
    one of those, check with Records -- do not just guess from the matter name."
  - "iManage access for a new matter always follows the matter team list from the intake form.
    It does not follow whoever emails you asking to be added."
  - "Partner password resets go through the partner's Executive Assistant, never straight to
    the partner. Otherwise you'll eventually get a request that did not actually come from the
    partner."

  Write the onboarding document.
signals:
  - {type: regex, value: "(?i)\\bconflicts? check\\b", weight: critical}
  - {type: regex, value: "(?i)\\bethic(al|s) wall", weight: critical}
  - {type: regex, value: "(?i)\\bintake form\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(executive assistant|EA)\\b", weight: evidence}
notes: |
  Knowledge Management Task 04 -- onboarding doc from tribal-knowledge notes (medium).
  Industry: legal (law firm, iManage DMS, ethical walls).
  Load-bearing industry facts: "conflicts check before matter-folder creation" and "ethical
  wall" handling are law-firm-specific risk controls with no generic-IT equivalent -- getting
  the order wrong (creating access before conflicts clear) is a legal-ethics exposure, not
  just an access-control mistake, which a generic "grant access on request" onboarding doc
  would miss entirely. The intake-form-is-the-source-of-truth rule and the Executive-Assistant
  password-reset routing are both real tribal-knowledge guardrails against social-engineering-
  shaped requests ("whoever emails asking to be added," "a request that didn't actually come
  from the partner"). A weak answer restates the four notes as loose prose; a strong answer
  turns them into an onboarding doc a brand-new hire could apply unaided, with the reasoning
  preserved so the rule doesn't get "optimized away" by a future hire who doesn't know why it
  exists.
