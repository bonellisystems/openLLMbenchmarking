id: knowledge_mgmt-03
unit: knowledge_mgmt
difficulty: medium
class: standard
industry: financial_services
prompt: |
  Write a KB article for your MSP's helpdesk team titled "Replacing a Lost Hardware Security
  Key for Trading-Floor Staff" at a broker-dealer client. Context: traders authenticate to the
  order-management system (OMS) with a physical FIDO2 hardware security key; losing it locks
  the trader out of the OMS entirely.

  Two facts specific to this client:
  1. Compliance requires documented two-person identity verification -- the trader's desk
     supervisor AND IT, both -- before any credential is reissued, because the firm's SEC/FINRA
     recordkeeping obligations treat OMS access changes as an auditable event.
  2. A hardware-key reissuance can only happen immediately if the trader currently has zero
     open orders working in the OMS. If they have open orders, the reissuance must wait until
     after market close (4:00 PM ET) or before market open (9:30 AM ET), because interrupting
     an OMS session that has open orders mid-session risks the order landing in an inconsistent
     state.

  Write the KB article with a Prerequisites section (what must be verified before you start),
  numbered resolution steps, and at least one explicit failure branch covering what to do if a
  prerequisite is not met -- for example, the supervisor is unreachable, or the trader has open
  orders during market hours.
signals:
  - {type: regex, value: "(?i)\\bprerequisite", weight: critical}
  - {type: regex, value: "(?i)\\b(two[- ]person|supervisor)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bopen orders?\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(9:30|4:00|market clos|market open)\\b", weight: note}
notes: |
  Knowledge Management Task 03 -- KB article with prerequisites and failure branches (medium).
  Industry: financial_services (broker-dealer trading floor).
  Load-bearing industry facts: the two-person compliance verification exists specifically
  because OMS access changes are a FINRA/SEC-auditable event (not a generic "verify identity"
  helpdesk step), and the market-hours constraint is not a generic maintenance-window idea --
  it exists because an open order mid-reissuance can land in an inconsistent state, a risk that
  only applies to a live trading system. A mid-tier answer produces numbered resolution steps
  but treats "verify identity" and "do it whenever" generically, missing that the industry
  facts change WHO must sign off and WHEN the action is even allowed to happen. The required
  failure branch (supervisor unreachable / open orders during market hours) matches the
  anchor's rollback/failure-branch excellence marker.
