id: finance-04
unit: finance
difficulty: medium
class: standard
industry: legal
prompt: |
  You manage billing/collections for a law firm. Current fee (operating) AR ledger, terms
  Net 30:

  - Client A: $18,500 invoice, 95 days past due
  - Client B: $6,200 invoice, 40 days past due
  - Client C: $42,000 invoice, 15 days past due
  - Client D: $9,800 invoice, 130 days past due

  Separately, the firm's IOLTA client trust ledger shows Client A also has $22,000 held in
  trust -- an advance the client provided specifically to cover future expert-witness costs on
  their litigation matter, per the engagement letter. That trust balance is the client's money,
  not the firm's, until it is properly earned or a specific trust-to-fee transfer is authorized.

  Build an aging summary by bucket (1-30, 31-60, 91+ days past due) with bucket totals and the
  total AR balance. Then produce a dunning plan in priority order for Clients A, B, and D. Your
  plan must NOT simply sweep Client A's trust balance to cover their overdue fee invoice --
  state what a proper trust-to-fee transfer requires before any trust funds could be applied
  against fees.
signals:
  - {type: numeric, value: 76500, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 28300, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(IOLTA|trust account|trust fund)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(authoriz|consent|engagement letter|written notice)\\b", weight: evidence}
notes: |
  Finance Task 04 -- AR aging analysis + dunning plan (medium). Industry: legal. Load-bearing
  legal concept: IOLTA/client trust accounting -- trust funds cannot be unilaterally applied
  against an unrelated fee shortfall without a documented, client-authorized transfer; doing so
  is a trust-accounting/ethics violation regardless of how overdue the fee invoice is.
  Arithmetic verified: total AR = 18,500 + 6,200 + 42,000 + 9,800 = $76,500. Bucket totals:
  1-30 days = Client C $42,000; 31-60 days = Client B $6,200; 91+ days = Client A $18,500 +
  Client D $9,800 = $28,300 (sums back to $76,500: 42,000 + 6,200 + 28,300 = 76,500). The
  91+ bucket is 28,300 / 76,500 = 36.99% of total AR -- the concentration figure a strong
  answer should call out. The trust balance ($22,000) is deliberately NOT part of the AR total
  or dunning math; a weak answer conflates it with collectible AR or nets it against the
  invoice, which is exactly the red flag this fixture is built to catch.
