id: finance-06
unit: finance
difficulty: hard
class: long
industry: oil_gas_energy
prompt: |
  Parent company owns two E&P subsidiaries that are intercompany affiliates: OpCo (operator,
  75% working interest in a well) and NonOpCo (non-operating partner, 25% working interest in
  the same well, per the Joint Operating Agreement).

  An AFE (Authorization for Expenditure) for a workover project on the well was approved at a
  total project budget of $2,400,000. Actual costs incurred on the workover came in at
  $2,600,000 -- over the AFE budget.

  OpCo's books: OpCo operates the well and issues a JIB (Joint Interest Billing) statement to
  NonOpCo for its working-interest share of ACTUAL costs. OpCo booked an intercompany
  receivable from NonOpCo of 25% of the $2,600,000 actual cost.

  NonOpCo's books: NonOpCo's month-end close happened before it received OpCo's final JIB
  statement (JIB statements routinely lag field costs by 30-45 days). With no actual-cost JIB
  in hand yet, NonOpCo's accounting team accrued its intercompany payable to OpCo based on the
  best information it had: its 25% working-interest share of the original $2,400,000 AFE
  budget.

  At parent-level consolidation, the intercompany receivable on OpCo's books does not tie to
  the intercompany payable on NonOpCo's books. Quantify the break, determine which side needs a
  true-up adjustment (and to what correct balance), and explain why this is NOT a booking error
  by either subsidiary. State the AFE overrun percentage separately, and note that the
  non-operating partner's notification/consent requirements for cost overruns are governed by
  the specific Joint Operating Agreement's terms, which should be checked rather than assumed.
signals:
  - {type: numeric, value: 50000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 650000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(timing|cut-?off|cutoff)\\b", weight: critical}
  - {type: regex, value: "(?i)\\btrue-?up\\b", weight: evidence}
notes: |
  Finance Task 06 -- intercompany reconciliation break (hard). Industry: oil_gas_energy.
  Load-bearing vertical concepts: AFE (Authorization for Expenditure -- the pre-approved budget
  for a drilling/workover project) and JIB (Joint Interest Billing -- the operator's statement
  billing non-operating working-interest partners their proportionate share of joint account
  costs per the JOA working-interest percentages).
  Arithmetic verified: NonOpCo's AFE-based accrual = $2,400,000 x 0.25 = $600,000. OpCo's
  actual-cost JIB receivable = $2,600,000 x 0.25 = $650,000. Break = $650,000 - $600,000 =
  $50,000. AFE overrun = ($2,600,000 - $2,400,000) / $2,400,000 = 8.33%.
  Non-obvious hard element (matches the brief's calibration example): neither side booked an
  error. OpCo billed actual costs correctly per the JIB; NonOpCo accrued the best information
  available at its own close (the AFE budget) because the actual JIB hadn't arrived yet. This
  is a timing/cutoff difference between two correctly-applied processes, not a mistake to
  assign blame for. The correct fix is a true-up entry on NonOpCo's books to $650,000 once the
  JIB is received, plus a process fix (e.g., NonOpCo accrues off a preliminary actual-cost
  estimate communicated intercompany before the formal JIB, rather than defaulting to the AFE
  budget) so the break doesn't recur every month an active AFE project overruns. The prompt
  deliberately does not assert a specific overrun-notification threshold as fact (e.g., "JOAs
  require notice above 10%") since that's JOA-specific and would be a fabricated-statistic red
  flag if stated as universal; the answer should flag it as something to verify against this
  JOA rather than assume.
