id: finance-07
unit: finance
difficulty: hard
class: long
industry: healthcare_compliance
prompt: |
  You're doing a monthly budget variance analysis for a multi-provider medical practice's net
  patient revenue. Two payers only, for simplicity.

  Budget:
  - Total visits: 2,000
  - Payer mix: 60% Commercial (1,200 visits), 40% Medicare (800 visits)
  - Reimbursement rate: Commercial $220/visit, Medicare $110/visit
  - Budgeted revenue: Commercial $264,000, Medicare $88,000, Total $352,000

  Actual:
  - Total visits: 2,000 (same total volume as budget)
  - Payer mix: 45% Commercial (900 visits), 55% Medicare (1,100 visits)
  - Reimbursement rate: Commercial $220/visit (unchanged), Medicare $110/visit (unchanged)
  - Actual revenue: Commercial $198,000, Medicare $121,000, Total $319,000

  The practice administrator's first-draft narrative says "reimbursement rates are being cut --
  average revenue per visit fell from budget." Determine whether that narrative is correct.
  Compute the total revenue variance in dollars and as a percentage, and decompose it: how much
  of the shortfall is a true rate variance (payer actually reimbursing less per visit), how much
  is a volume variance (fewer total visits), and how much is a payer-mix variance (a shift in
  the proportion of visits between payers, each still paid at its budgeted rate)? Recommend one
  driver-based corrective action rather than a generic cost-cutting response.
signals:
  - {type: numeric, value: 33000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 300, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bmix\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(rate variance|volume variance)\\b", weight: note}
notes: |
  Finance Task 07 -- budget variance analysis with mix-vs-rate decomposition (hard). Industry:
  healthcare_compliance (payer-mix variance is a standard medical-practice revenue-cycle
  analysis).
  Arithmetic verified: budgeted revenue = 1,200x220 + 800x110 = 264,000 + 88,000 = 352,000.
  Actual revenue = 900x220 + 1,100x110 = 198,000 + 121,000 = 319,000. Total variance =
  319,000 - 352,000 = -$33,000 (-9.375%). Both payers' per-visit rates are IDENTICAL to budget
  (Commercial still $220, Medicare still $110) and total volume is identical (2,000 = 2,000),
  so rate variance = $0 and volume variance = $0 -- the ENTIRE $33,000 shortfall is a pure mix
  effect: 300 visits shifted from Commercial ($220) to Medicare ($110) (1,200-900=300 fewer
  Commercial; 1,100-800=300 more Medicare), costing 300 x ($220-$110) = 300 x $110 = $33,000,
  which matches the total variance exactly. Non-obvious hard element (matches the brief's
  calibration example): the naive read -- blended revenue per visit fell from $352,000/2,000=
  $176.00 to $319,000/2,000=$159.50, a real $16.50/visit (9.375%) drop -- looks like a rate cut,
  but every payer is still paying exactly its budgeted rate; the "rates are being cut" narrative
  is flatly wrong and a correct answer must say so explicitly, attributing 100% of the shortfall
  to the mix shift and recommending a mix-focused fix (e.g., commercial-payer scheduling/referral
  emphasis or a payer-mix tracking KPI) rather than a rate-negotiation or cost-cutting response.
