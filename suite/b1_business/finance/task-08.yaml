id: finance-08
unit: finance
difficulty: hard
class: long
industry: life_sciences
prompt: |
  You're building a 13-week cash-flow forecast for a clinical-stage biotech. Assume all weekly
  burn and all inflows are recognized at the end of each week (no intra-week timing to model).

  - Starting cash balance (beginning of Week 1): $3,200,000
  - Weekly net operating cash burn, Weeks 1-7: $185,000/week
  - Starting Week 8, a new lab-operations hire cohort begins, raising weekly burn to
    $215,000/week for Weeks 8-13
  - Week 6 inflow: NIH grant milestone payment, $450,000
  - Week 10 inflow: pharma-partner collaboration/licensing milestone payment, $900,000
  - The company's venture debt agreement includes a minimum-liquidity covenant: unrestricted
    cash may never fall below $500,000

  Build the week-by-week ending cash balance for all 13 weeks. State the Week 13 ending balance,
  and identify which week has the LOWEST ending cash balance across the full 13-week window --
  it is not necessarily Week 13. State whether the minimum-liquidity covenant is breached at any
  point in the 13-week window. Then, using the Week 13 ending balance and the Week 8-13 burn
  rate, estimate approximately how many additional weeks of runway remain past Week 13 (assuming
  no further inflows and burn stays flat) before the company would breach the $500,000 covenant
  floor, and flag this explicitly as an unfunded-scenario estimate, not a forecast commitment.
signals:
  - {type: numeric, value: 1965000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 1925000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bweek 9\\b", weight: critical}
  - {type: numeric, value: 500000, tolerance: 0.01, weight: note}
notes: |
  Finance Task 08 -- 13-week cash-flow forecast (hard). Industry: life_sciences (biotech
  burn-rate/runway tracking against a venture-debt minimum-liquidity covenant is a canonical
  life-sciences finance scenario).
  Week-by-week arithmetic verified by direct simulation: W1 3,015,000; W2 2,830,000; W3
  2,645,000; W4 2,460,000; W5 2,275,000; W6 2,540,000 (185k burn then +450k grant); W7
  2,355,000; W8 2,140,000; W9 1,925,000; W10 2,610,000 (215k burn then +900k milestone); W11
  2,395,000; W12 2,180,000; W13 1,965,000. Cross-check via totals: total burn = 7x185,000 +
  6x215,000 = 1,295,000 + 1,290,000 = 2,585,000; total inflows = 450,000+900,000=1,350,000; net
  change = -2,585,000+1,350,000 = -1,235,000; 3,200,000 - 1,235,000 = 1,965,000, matches the
  week-by-week Week 13 figure exactly.
  Non-obvious hard element (matches the brief's calibration example -- the low point isn't where
  it looks): the lowest ending balance across all 13 weeks is Week 9 ($1,925,000), the week
  right before the Week 10 milestone lands -- NOT Week 13 ($1,965,000), even though Week 13 is
  later and burn is higher by then. An answer that only reports the Week 13 ending balance and
  calls it the trough misses this. The covenant ($500,000 floor) is not breached anywhere in the
  13-week window (minimum $1,925,000 is well above it). Runway extrapolation past Week 13:
  (1,965,000 - 500,000) / 215,000 = 6.81 additional weeks -- not gated by a signal (estimate,
  wide reasonable range) but the prompt asks for it and for the explicit "not a forecast
  commitment" caveat, matching the anchors' "calibrated about when a professional must verify"
  excellence marker.
