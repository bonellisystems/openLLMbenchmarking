id: finance-01
unit: finance
difficulty: easy
class: short
industry: msp_internal
prompt: |
  You're the accounting manager closing the books for an MSP's own internal finance team for
  May. Your close checklist status is:

  1. Operating bank account reconciliation -- DONE, ties to GL.
  2. Payroll clearing account reconciliation -- NOT done; the clearing account shows an
     unexplained variance of $1,842.17 between the bank statement and the GL balance.
  3. AP subledger tied to GL -- DONE.
  4. AR subledger tied to GL -- DONE.
  5. Prepaid expense amortization -- a $7,200 annual software license was paid in full in
     January and set up as a prepaid asset, to be amortized evenly over the 12-month license
     term. No amortization entries have been booked in any of the 5 months since (Jan-May), so
     the full $7,200 is still sitting on the balance sheet as a prepaid asset.
  6. Fixed asset depreciation run -- DONE.
  7. Accrued payroll -- DONE.
  8. Deferred revenue schedule -- DONE.
  9. Journal entry review/approval -- 4 JEs posted this month are still pending controller
     sign-off.
  10. Trial balance / suspense account review -- the suspense account, which should always net
      to zero at close, carries a $612.50 balance.

  Identify the close gaps that pose the highest risk to a reliable close, calculate the dollar
  amount of P&L expense that is currently missing because of the unamortized prepaid, and
  recommend the sequence of actions to close the books cleanly this month -- including what
  must happen before the controller can sign off on these financials as final.
signals:
  - {type: numeric, value: 3000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 1842.17, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bprepaid\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(controller|sign-?off)\\b", weight: evidence}
notes: |
  Finance Task 01 -- month-end close checklist gap review (easy). Industry: msp_internal (the
  MSP's own books, not a client engagement).
  Arithmetic verified: $7,200 / 12 months = $600/month amortization; 5 unamortized months
  (Jan-May) = 5 x $600 = $3,000 of missing P&L expense (and an overstated prepaid asset by the
  same amount). The bank-rec variance ($1,842.17) and suspense balance ($612.50) are given,
  unexplained figures the answer should flag as needing investigation before controller
  sign-off, not numbers requiring further derivation. Correct answer sequences: resolve the
  unreconciled payroll-clearing variance and the suspense balance (both indicate something is
  mis-posted), book the catch-up prepaid amortization entry, clear the pending JE approvals,
  and only then present financials as closed -- not the reverse order of "close first, fix
  later."
