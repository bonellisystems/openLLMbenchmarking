id: finance-05
unit: finance
difficulty: medium
class: standard
industry: financial_services
prompt: |
  You're preparing the quarterly board finance summary for a specialty consumer lender. Given
  figures (pre-tax, $):

  Q1 (prior quarter):
  - Net interest income (NII): $4,200,000
  - Provision for credit losses: $600,000
  - Non-interest (operating) expense: $2,800,000
  - Total loans outstanding: $290,000,000
  - Allowance for loan losses (ALL) balance: $4,060,000

  Q2 (this quarter):
  - Net interest income (NII): $4,410,000
  - Provision for credit losses: $930,000
  - Non-interest (operating) expense: $2,884,000
  - Total loans outstanding: $310,000,000
  - Allowance for loan losses (ALL) balance: $4,650,000

  Write a one-page board summary that: (1) derives pre-tax net income for both quarters from
  the given P&L lines and shows the reconciliation, (2) correctly explains WHY net income
  changed the way it did between quarters -- attribute the change to the correct driver among
  NII growth, provision growth, and opex growth, don't just say "costs went up," (3) computes
  the allowance-for-loan-losses coverage ratio (ALL / total loans) for both quarters and flags
  the trend, and (4) states one item that needs board discussion or a decision.
signals:
  - {type: numeric, value: 596000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 204000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 4650000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(provision|reserve|allowance)\\b", weight: critical}
notes: |
  Finance Task 05 -- board-level finance summary from provided statements (medium). Industry:
  financial_services.
  Arithmetic verified (all deltas deliberately distinct dollar amounts so no signal number
  could accidentally be satisfied by the wrong driver): NII +5% (4,200,000 x 1.05 = 4,410,000,
  delta +210,000); Provision +55% (600,000 x 1.55 = 930,000, delta +330,000); Opex +3%
  (2,800,000 x 1.03 = 2,884,000, delta +84,000). Net income Q1 = 4,200,000 - 600,000 -
  2,800,000 = $800,000. Net income Q2 = 4,410,000 - 930,000 - 2,884,000 = $596,000. Decline =
  800,000 - 596,000 = $204,000 (25.5%). The correct attribution: NII grew fastest in dollar
  terms of the three lines (+210,000) and opex grew least (+84,000), but provision grew far
  faster in both dollar (+330,000) and percentage (+55%) terms than NII -- net income fell
  because loan-loss provisioning outpaced revenue growth, NOT because operating costs are out
  of control. ALL coverage: Q1 = 4,060,000 / 290,000,000 = 1.40% exactly; Q2 = 4,650,000 /
  310,000,000 = 1.50% exactly -- coverage is rising in lockstep with the provision build,
  meaning management is proactively reserving for anticipated credit deterioration, which is a
  materially different board message than "expenses grew."
