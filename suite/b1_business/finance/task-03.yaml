id: finance-03
unit: finance
difficulty: medium
class: standard
industry: aec
prompt: |
  You handle AP for a general contractor. Subcontractor "Delta Concrete LLC" is on PO #4471 for
  foundation work, total contract value $186,000, with standard contract terms: 10% retainage
  withheld from every progress payment until substantial completion.

  This period's documents:
  - PO #4471: total scope $186,000 (unchanged).
  - Field-certified progress report: the project engineer certifies 65% of the foundation scope
    is actually complete as of this pay period.
  - Delta Concrete's invoice this period: bills $128,000 for progress to date this period.

  Run the 3-way match (PO vs. certified progress vs. invoice). Identify any exception, quantify
  the dollar discrepancy, and calculate the correct net amount that should actually be released
  to Delta Concrete this period once retainage is properly applied to the certified (not
  invoiced) amount. State what should happen before any payment is released.
signals:
  - {type: numeric, value: 7100, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 108810, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bretainage\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(hold|dispute|reject|return|clarif)\\b", weight: evidence}
notes: |
  Finance Task 03 -- AP 3-way-match exception handling (medium). Industry: aec. Load-bearing
  AEC concept: retainage withheld from progress billings until substantial completion.
  Arithmetic verified: certified complete = $186,000 x 0.65 = $120,900. The invoice ($128,000)
  exceeds the certified complete amount by $128,000 - $120,900 = $7,100 -- this is the 3-way
  match exception (invoice doesn't match certified progress, the AEC equivalent of a
  goods-receipt in a standard PO/receipt/invoice match). Separately, even on the certified
  $120,900, 10% retainage must be withheld: $120,900 x 0.10 = $12,090, so the correct net
  payment (paying against certified progress, not the inflated invoice) = $120,900 - $12,090 =
  $108,810. Correct answer holds the invoice for the $7,100 overbilling discrepancy rather than
  paying the face amount, and pays no more than $108,810 net even once resolved.
