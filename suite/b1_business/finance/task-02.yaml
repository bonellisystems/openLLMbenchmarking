id: finance-02
unit: finance
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You run finance for a small custom-apparel print shop. Current unit economics per printed
  shirt:
  - Sell price: $30.00
  - Variable costs: blank garment $8.00, printing/ink $3.00, packaging $1.00 (total $12.00)
  - Current contribution margin: $18.00/unit (60%)
  - Fixed monthly overhead: $21,600
  - Current monthly volume: 1,450 units

  Your blank-garment supplier just raised the blank garment price by 15%, with no change to
  printing or packaging costs, effective immediately. You have not changed your sell price.

  Calculate: (1) the new variable cost per unit and the new contribution margin in dollars and
  as a percentage at the current $30.00 price, (2) the monthly profit impact of doing nothing
  (same price, same 1,450-unit volume) compared to before the cost increase, and (3) the sell
  price you would need to charge to restore the original 60% contribution margin percentage.
  State your breakeven volume at the new cost structure at the current price too.
signals:
  - {type: numeric, value: 13.20, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 1740, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 33.00, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bmargin\\b", weight: evidence}
notes: |
  Finance Task 02 -- pricing/margin what-if with given costs (easy). Industry: generic_smb.
  Arithmetic verified: blank garment $8.00 x 1.15 = $9.20 (new); new variable cost = 9.20 +
  3.00 + 1.00 = $13.20/unit; new margin at $30 = $30 - $13.20 = $16.80 (56%). Profit at
  1,450 units before: 1,450 x $18.00 - $21,600 = $26,100 - $21,600 = $4,500. Profit at 1,450
  units after (do nothing): 1,450 x $16.80 - $21,600 = $24,360 - $21,600 = $2,760. Monthly
  profit erosion = $4,500 - $2,760 = $1,740. Price to restore 60% margin: solve
  (P - 13.20)/P = 0.60 -> 0.40P = 13.20 -> P = $33.00 (verified: (33-13.20)/33 = 0.60 exactly).
  Breakeven at new cost structure and current $30 price: $21,600 / $16.80 = 1,285.71 units
  (up from the original breakeven of $21,600 / $18.00 = 1,200 units) -- not gated by a signal
  since it's a secondary check, but the core three numbers above all reconcile exactly.
