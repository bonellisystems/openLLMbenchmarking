id: project_mgmt-03
unit: project_mgmt
difficulty: medium
class: standard
industry: msp_internal
prompt: |
  You're the PM for your MSP's own internal project: migrating the internal ticketing/PSA
  platform to a new vendor. Facts as of this week's status report:

  - Planned go-live: Aug 15, 2026.
  - Data migration workstream: 92% complete, on track, no open issues.
  - Integration testing workstream: BLOCKED. The third-party API vendor promised sandbox
    credentials "by end of last week"; that promise is now 6 business days overdue with no new
    ETA from the vendor.
  - Staff training workstream: not started; scheduled to start Aug 4 (11 days before go-live).
    Training cannot start until integration testing is complete, because training uses the live
    integration sandbox.
  - Budget: $42,000 spent of $65,000 approved, tracking to plan.
  - Team capacity: fully staffed, no attrition risk.

  Write this week's RAG (Red/Amber/Green) status report, per workstream and overall. Give the
  honest overall call, not the most comfortable one -- three of four areas look fine on their
  own, but state clearly whether the blocked integration-testing workstream puts the Aug 15
  go-live at real risk, and why, tying your reasoning to the training workstream's dependency on
  it and its 11-day runway requirement. Recommend a specific escalation action rather than
  "monitor and wait."
signals:
  - {type: regex, value: "(?i)\\bRED\\b", weight: critical}
  - {type: numeric, value: 92, tolerance: 0.02, weight: evidence}
  - {type: numeric, value: 11, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\b(vendor|sandbox credentials)\\b", weight: evidence}
notes: |
  Project Management Task 03 -- status report from provided facts, RAG honesty (medium).
  Industry: msp_internal (the MSP's own PSA migration).
  The correct overall call is RED (or, at the softest defensible framing, Amber-trending-Red --
  the fixture requires the literal word RED since three of four workstreams looking fine is
  exactly the trap the anchors' RAG-honesty framing warns against: budget on track and migration
  at 92% do not offset a blocked, dependency-gating workstream with no vendor ETA). Training
  needs 11 days of runway before the Aug 15 go-live and cannot start until integration testing
  clears, and integration testing is already 6 business days past its own promised date with no
  new commitment -- a materially at-risk critical dependency, not a minor blip to "monitor."
  Matches the anchors' red flag against reporting status that ignores a real, already-manifested
  risk to a stated hard deadline.
