id: project_mgmt-04
unit: project_mgmt
difficulty: medium
class: standard
industry: aec
prompt: |
  Your structural engineering firm has exactly one engineer, Priya, licensed to stamp drawings
  in this state, and she is double-booked this week across two active projects:

  Project Riverside (client-deadline-driven): needs Priya for 24 hours this week to review and
  stamp final structural drawings. The city submittal deadline is this Friday, tied to a permit
  application window that only opens periodically -- missing this window delays the whole
  project 6 weeks until the next window opens.

  Project Harborview (internal, flexible): needs Priya for 16 hours this week for a mid-design
  structural review. There is no external deadline this week; the next natural checkpoint is 3
  weeks out, and this specific review has 2 weeks of schedule float before it would affect
  Harborview's overall timeline.

  Priya has 40 available hours this week on paper, but roughly 4 hours/week are unavoidably
  consumed by meetings and admin, leaving fewer productive hours than the raw 40.

  Resolve the conflict: state which project gets priority this week and why, quantify Priya's
  actual productive capacity after overhead, determine whether Riverside's full 24-hour need
  fits inside that productive capacity, and state how much (if any) of Harborview's 16 hours can
  still happen this week versus should be deferred into its 2-week float. State what happens if
  Riverside is deprioritized instead.
signals:
  - {type: numeric, value: 24, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 6, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bfloat\\b", weight: critical}
  - {type: numeric, value: 36, tolerance: 0.02, weight: evidence}
notes: |
  Project Management Task 04 -- resource-conflict resolution (medium). Industry: aec.
  Arithmetic verified (verify_arith_da_pm.py): raw demand = 24+16 = 40 hours, exactly matching
  Priya's nominal 40-hour week -- but that ignores ~4 hours/week of unavoidable overhead, leaving
  36 productive hours against 40 hours of demand, a real shortfall. Riverside's priority is
  correct because it carries a hard external permit-window deadline with a 6-week delay penalty
  if missed, versus Harborview which has 2 weeks of schedule float and no external deadline this
  week. Riverside's 24 hours plus ~4 hours of overhead = 28 hours, which fits inside the 36
  productive hours, leaving 8 spare productive hours -- meaning up to 8 of Harborview's 16 hours
  could still happen this week if desired, with the remainder deferred into Harborview's float,
  rather than either project needing to fully stop.
