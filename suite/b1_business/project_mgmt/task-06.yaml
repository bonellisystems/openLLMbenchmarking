id: project_mgmt-06
unit: project_mgmt
difficulty: hard
class: long
industry: manufacturing_ag
prompt: |
  You're doing a schedule risk assessment for installing a new grain-processing line. Find the
  critical path yourself from the task table below -- do not take anyone's word for which tasks
  are "obviously" critical. All durations are in working days.

  Task | Description | Duration | Predecessors
  T1 | Site prep | 5 | none
  T2 | Electrical rough-in | 4 | T1
  T3 | Equipment procurement (vendor lead time -- order placed Day 0) | 20 | none
  T4 | Foundation / concrete pad pour | 6 | T1
  T5 | Equipment installation | 8 | T2, T3, T4
  T6 | Equipment commissioning/testing | 5 | T5
  T7 | Operator training | 3 | T5
  T8 | Go-live (milestone) | 0 | T6, T7

  Compute the earliest start and earliest finish for every task, then the latest start and
  latest finish, then the float for every task. State the total project duration. List the
  critical-path task IDs in order. Explain, with the float numbers, why the critical path runs
  through T3 (equipment procurement) rather than through the construction chain (T1-T2/T4-T5)
  that most people would assume is critical because it's the visible on-site work. Identify
  which non-critical task has the LEAST float and is therefore the biggest hidden schedule risk
  if its estimate proves optimistic.
signals:
  - {type: numeric, value: 33, tolerance: 0.01, weight: critical}
  - {type: regex, value: "\\bT3\\b", weight: critical}
  - {type: regex, value: "(?i)\\bfloat\\b", weight: critical}
  - {type: numeric, value: 20, tolerance: 0.02, weight: evidence}
notes: |
  Project Management Task 06 -- schedule risk assessment, critical path computed by hand + script
  (hard). Industry: manufacturing_ag.
  CPM verified programmatically (verify_cpm.py, forward+backward pass): ES/EF -- T1 0-5, T2 5-9,
  T3 0-20, T4 5-11, T5 20-28 (gated by T3's EF=20, the latest of T2=9/T3=20/T4=11), T6 28-33, T7
  28-31, T8 33-33. Project duration = 33 days. Backward pass floats: T3=0, T5=0, T6=0, T8=0 (all
  critical); T1=9, T4=9, T2=11, T7=2. Critical path = T3 -> T5 -> T6 -> T8 (20+8+5+0=33). This is
  the hard task's non-obvious element: the 20-day equipment-procurement lead time (an "invisible"
  task with nothing happening on-site) is what actually drives the schedule with ZERO float,
  while the visible construction chain (T1/T2/T4, totaling at most 11 days into T5) carries 9-11
  days of slack and is NOT critical, contrary to the intuitive assumption that on-site
  construction work is "the real work." T7 (operator training, float=2) is the non-critical task
  with the least float and the biggest hidden risk -- its 3-day estimate only has 2 spare days
  before it flips onto the critical path itself (any slip beyond 2 days makes T7, not just T3,
  drive the go-live date).
