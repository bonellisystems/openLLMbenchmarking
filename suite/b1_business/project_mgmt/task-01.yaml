id: project_mgmt-01
unit: project_mgmt
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You're kicking off a project to roll out a new point-of-sale (POS) system across all 18
  stores of a regional retail chain. Constraints: a 10-week project window, a $180,000 budget,
  a 4-person team (1 PM, 2 implementation engineers, 1 trainer), a hard company freeze on any
  new store deployments during the final 2 weeks before Black Friday (which falls at the very
  end of week 10), and an operations requirement that no more than 3 stores can be down for
  cutover at the same time (to protect regional coverage).

  Write a kickoff plan: charter basics (objective, in-scope, explicitly out-of-scope), a phased
  rollout approach that respects both the "≤3 stores at once" limit and the Black-Friday freeze,
  key roles, and the top 2-3 kickoff risks with an owner for each. Show your math for how many
  rollout waves are required given 18 stores and the 3-store limit, and how many weeks are
  actually usable for deployment once the freeze window is excluded from the 10-week window.
signals:
  - {type: numeric, value: 6, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 8, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(black[- ]?friday|freeze)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bowner\\b", weight: evidence}
notes: |
  Project Management Task 01 -- kickoff plan (easy). Industry: generic_smb.
  Arithmetic verified (verify_arith_da_pm.py): minimum rollout waves = 18 stores / 3-store cap
  = 6 waves. Usable deployment window = 10-week project minus the 2-week Black-Friday freeze =
  8 weeks. A correct plan ties the wave count and usable-window arithmetic directly to the
  stated hard constraints (per the anchors' excellence marker: "plan structure tied to the
  specific scope given, not generic phase names") rather than presenting a generic 3-phase
  rollout that ignores the freeze or the 3-store cap.
