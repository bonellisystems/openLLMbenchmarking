id: project_mgmt-07
unit: project_mgmt
difficulty: hard
class: long
industry: life_sciences
prompt: |
  A biotech is building out a new assay-validation lab. The BASELINE schedule (working days,
  activity-on-node) is:

  Task | Description | Duration | Predecessors
  S1 | Equipment installation | 10 | none
  S2 | Utility/HVAC certification | 15 | none
  S3 | Equipment calibration | 4 | S1
  S4 | IQ (Installation Qualification) documentation | 3 | S3
  S5 | OQ (Operational Qualification) testing | 6 | S4, S2
  S6 | PQ (Performance Qualification) run | 5 | S5
  S7 | QA sign-off / lab go-live | 2 | S6

  Compute the baseline critical path and total duration.

  SCOPE CHANGE: the quality unit now requires an additional Environmental Monitoring
  Qualification step, "EMQ," lasting 15 working days (per the facility's standard environmental
  monitoring SOP, which requires a minimum continuous 15-day particle-count cycle to establish a
  statistically valid baseline -- this is the basis for the 15-day estimate; do not substitute a
  different number). EMQ can only start once S2 (HVAC certification) is complete, and S5 (OQ
  testing) now cannot start until BOTH S4 and EMQ are complete (in addition to S2).

  Recompute the full schedule with EMQ added. State the new total project duration and the
  schedule impact in days versus baseline. List the new critical-path task IDs. Explain
  specifically what happens to the OLD baseline critical path (S1-S3-S4) now -- is it still
  critical, and if not, how much float does it now have? State the estimate basis for EMQ's
  duration as given. Recommend one concrete way to recover schedule, or explain why the delay is
  a hard floor that cannot be compressed.
signals:
  - {type: numeric, value: 43, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 13, tolerance: 0.02, weight: critical}
  - {type: regex, value: "\\bEMQ\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(slack|float)\\b", weight: critical}
notes: |
  Project Management Task 07 -- scope-change impact with estimate basis, critical path SHIFTS
  after the scope change (hard). Industry: life_sciences.
  CPM verified programmatically (verify_cpm.py) for both the baseline and scope-changed networks.

  Baseline: ES/EF -- S1 0-10, S2 0-15, S3 10-14, S4 14-17, S5 17-23 (gated by S4's EF=17, since
  S2's EF=15 < 17), S6 23-28, S7 28-30. Baseline duration = 30 days. Baseline critical path =
  S1-S3-S4-S5-S6-S7 (float=0 on all six); S2 has 2 days of float (LS=2, since it only needs to
  finish by day 17 when S5 needs it, not by day 15).

  Scope-changed (EMQ inserted, predecessor S2, duration 15, feeds into S5 alongside S4): S1 0-10,
  S2 0-15 (unchanged), S3 10-14, S4 14-17, EMQ 15-30 (starts after S2 at day 15, EF=30), S5 30-36
  (now gated by EMQ's EF=30, since S4's EF=17 << 30), S6 36-41, S7 41-43. New duration = 43 days
  -- a 13-day slip versus the 30-day baseline (43-30=13), NOT a naive "+15 days" (the naive
  linear-add trap this task is designed to catch, since EMQ runs partly in parallel with the
  slower-finishing S2/EMQ chain, not purely serial after the old critical path).

  This is the hard task's non-obvious element required by the brief: the critical path SHIFTS.
  New critical path = S2-EMQ-S5-S6-S7 (15+15+6+5+2=43, float=0). The OLD baseline critical chain
  S1-S3-S4 is NO LONGER critical -- it now finishes at day 17 but doesn't feed S5 until day 30,
  so it has gained 13 days of float (LS on S1/S3/S4 verified at 13/13/13 by the backward pass) --
  a correct answer must explicitly say the old chain is no longer the constraint and now has
  slack, not merely note that the schedule got longer. EMQ's 15-day duration is given with an
  explicit SOP-based basis in the prompt and must be cited as-is, not re-derived or replaced with
  a different number (per the anchors' "estimates show their basis" marker and the red flag
  against fabricated figures).
