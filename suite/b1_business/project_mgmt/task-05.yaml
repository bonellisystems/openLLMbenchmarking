id: project_mgmt-05
unit: project_mgmt
difficulty: medium
class: standard
industry: oil_gas_energy
prompt: |
  You're planning a 5-day scheduled turnaround (maintenance shutdown) at a midstream
  gas-processing plant. Budget: $1.2M. Hard constraint: the plant must restart by Day 6 morning,
  because a downstream customer delivery contract carries a $40,000/day penalty for every day
  the plant is offline beyond Day 5.

  Known risk factors:
  - A critical replacement compressor seal is on backorder; based on this vendor's history with
    this plant, the promised ship date has slipped by an average of 2 days on each of the last 3
    orders.
  - The specialty pressure-vessel welding contractor has only 1 certified crew available this
    week (no backup crew available on short notice), and this scope of pressure-vessel welding
    has historically run 8-14 hours over its scheduled time about 1 in 3 turnarounds.
  - The weather forecast shows a 40% chance of a high-wind advisory on Day 3, which would halt
    all crane-lift work (required for the compressor swap) for that day.

  Build a risk register: for each risk, give a description, likelihood, impact (tie impact to
  the $40,000/day penalty where relevant), and a mitigation with a named owner. Identify the
  single risk that most threatens the Day-6 restart if it materializes, and state the dollar
  exposure if the turnaround finishes 2 days late.
signals:
  - {type: numeric, value: 40000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 80000, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\bowner\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(seal|compressor|weld\\w*|wind)\\b", weight: evidence}
notes: |
  Project Management Task 05 -- risk register from a scenario (medium). Industry:
  oil_gas_energy.
  Arithmetic verified: daily late penalty = $40,000/day (given); 2-day-late exposure = 2 x
  $40,000 = $80,000. Three distinct, scenario-specific risks are given (vendor seal-delivery
  slippage with a documented historical pattern, single-crew welding contractor with a documented
  1-in-3 overrun rate, and a 40% Day-3 weather risk that halts crane work needed for the
  compressor swap) so a correct answer must name and quantify these specific risks rather than
  a generic risk list, per the anchors' red flag against "no risk register or mitigation despite
  a clearly risky scope" and its excellence marker for owner-assigned, named mitigations.
