id: project_mgmt-08
unit: project_mgmt
difficulty: hard
class: long
industry: financial_services
prompt: |
  A community bank's core-banking system upgrade project has a regulator-mandated cutover
  deadline of Sept 30, 2026, tied to a consent order from a prior exam finding -- this is not a
  soft internal target. Facts:

  - Original 16-week plan started June 1, 2026, giving a planned completion of Sept 21, 2026
    (9 business days of schedule buffer before the Sept 30 hard deadline).
  - Data-conversion testing (a critical-path task) uncovered a defect requiring a vendor patch.
    The vendor's committed patch delivery is 9 business days from today, which pushes the
    data-conversion testing task itself 9 business days later than planned.
  - The remaining downstream tasks after data-conversion testing (user acceptance testing, staff
    training, a mandatory 5-day parallel-run week, and go-live) total 5 weeks and cannot be
    compressed below 4 weeks without dropping the parallel-run week -- which is a specific
    condition of the consent order, not a task the bank can choose to cut to save time.

  Write the stakeholder communication to the executive sponsor and the compliance officer. Give
  the honest RAG status and say explicitly why: a 9-business-day slip against a 9-business-day
  buffer consumes the ENTIRE buffer, meaning the deadline is only still theoretically achievable
  if every remaining task goes perfectly with zero further slippage -- which is a poor
  assumption given the project has already slipped once. State the specific escalation ask (not
  "monitor and wait"). State explicitly that the parallel-run week cannot be cut to buy back
  schedule because it is a consent-order condition, not a discretionary task. State what you
  would tell the regulator/examiner today if asked, and why proactive disclosure is safer than a
  surprise miss.
signals:
  - {type: regex, value: "(?i)\\bRED\\b", weight: critical}
  - {type: numeric, value: 9, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\bconsent order\\b", weight: critical}
  - {type: regex, value: "(?i)\\bparallel[- ]run\\b", weight: evidence}
notes: |
  Project Management Task 08 -- stakeholder comms for a slip (hard). Industry:
  financial_services.
  Date arithmetic verified: June 1, 2026 + 16 weeks (112 days) = Sept 21, 2026 (June 1 + 29 days
  = June 30; +31 = July 31; +31 = Aug 31; +21 = Sept 21; 29+31+31+21=112, confirmed). Sept 21 to
  the Sept 30 hard deadline = 9 days of buffer, matching the stated "9 business days of buffer"
  given as a fact in the prompt. The vendor-patch delay is also 9 business days -- consuming the
  buffer exactly, landing the project at the deadline itself with zero remaining margin, not
  "still comfortably on track." Correct RAG call is RED: even though the deadline is
  arithmetically still reachable on paper, zero schedule buffer against a regulator-mandated,
  consent-order deadline -- on a project that has already slipped once -- is a serious,
  honesty-demanding risk, not a "we're fine" situation; softening this to Amber/Green to avoid an
  uncomfortable conversation is exactly the RAG-honesty failure mode the anchors flag. The 5-day
  parallel-run week is explicitly non-negotiable (a consent-order condition) and must not be
  presented as a lever available to recover schedule.
