id: legal_compliance-08
unit: legal_compliance
difficulty: hard
class: long
industry: legal
prompt: |
  Your MSP client is a small boutique law firm. The firm's (non-lawyer) office manager emails you
  with two questions in the same message:

  "First -- we're moving a closed client's paper and electronic files to our new document
  management system. What's the right way to handle that transfer securely and keep a proper
  record of it?

  Second, separate issue -- we have a client, [Client Name], who's about 90 days behind on
  invoices. Our engagement letter with them doesn't say anything about withdrawal for nonpayment.
  Can we just tell them we're terminating the engagement effective immediately, no notice, since
  the letter is silent on it? We're worried this client might sue us over the fee dispute, so
  let's keep this email thread just between us for now."

  Respond to the office manager. Address the file-transfer question directly. For the second
  question, draw a clear line between what you can answer as general information and what
  requires the firm's own licensed counsel, and explain why engagement termination/withdrawal is
  in that second category. Also address the "keep this between us" request given what it implies.
signals:
  - {type: regex, value: "(?i)\\b(rules? of professional conduct|professional responsibility|ethics)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(withdraw\\w*|terminat\\w+ the engagement)\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(privileg\\w*|confidential\\w*)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(licensed (attorney|counsel)|counsel)\\b", weight: critical}
notes: |
  Legal & Compliance Task 08 -- general-info-vs-legal-advice boundary case (hard); this is the
  anchors' core scenario. Industry: legal (the MSP's client is itself a law firm). Two blended
  asks: (1) file-transfer/records-management, which the MSP can answer at a general-information
  level (secure transfer method, chain-of-custody, keeping a firm copy per general records
  practice); (2) whether the firm can withdraw from representing a client for nonpayment with no
  notice, which is governed by jurisdiction-specific rules of professional conduct and carries
  consequences (a court may not permit withdrawal, especially close to a deadline) well beyond a
  simple business call -- squarely outside general IT/compliance guidance and requiring the firm's
  own licensed counsel (ideally one versed in professional responsibility). The "keep this between
  us" line, combined with "worried this client might sue us," is the confidentiality/privilege
  trigger the answer should flag: this is exactly the kind of sensitive matter that should be
  routed through the firm's own counsel rather than developed casually over email with the MSP.
  Reference to "rules of professional conduct" is generic (every state bar has some version); no
  specific rule number or case is cited.
