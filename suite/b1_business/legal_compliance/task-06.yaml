id: legal_compliance-06
unit: legal_compliance
difficulty: hard
class: long
industry: aec
prompt: |
  You are supporting an architecture/engineering firm negotiating a new IT-managed-services
  contract. The vendor's draft contains this liability structure:

  "Section 8.1 (Indemnification): Vendor shall indemnify, defend, and hold harmless Client from
  any third-party claims arising out of Vendor's gross negligence or willful misconduct in
  performing the Services.

  Section 8.2 (Limitation of Liability): Except for Vendor's indemnification obligations under
  Section 8.1, in no event shall either party's aggregate liability under this Agreement exceed
  the fees paid in the twelve (12) months preceding the claim. Notwithstanding the foregoing, this
  limitation shall not apply to claims arising from a party's breach of Section 6
  (Confidentiality), Section 9 (Data Protection), or a party's indemnification obligations under
  Section 8.1."

  At first read, this looks favorable to the client: the liability cap has broad carve-outs for
  confidentiality, data protection, and indemnification claims, which sounds like strong,
  largely-uncapped protection.

  Review Sections 8.1 and 8.2 together and assess whether that first read holds up. Specifically:
  if the vendor causes a data breach through ordinary negligence (not gross negligence or willful
  misconduct) while performing the Services, would that claim actually fall under the
  indemnification carve-out and be uncapped, or would it fall under the ordinary 12-month-fees
  cap? Propose a redline to close any gap you find, and flag this point for counsel review given
  the contract's value.
signals:
  - {type: regex, value: "(?i)\\bindemnif\\w+\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(gross negligence|willful misconduct)\\b", weight: critical}
  - {type: numeric, value: 12, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bcounsel\\b", weight: critical}
notes: |
  Legal & Compliance Task 06 -- contract-clause review, indemnification/limitation-of-liability
  redline (hard). Industry: aec. Non-obvious trap: Section 8.2's carve-outs look broad, but
  Section 8.1's indemnification duty is narrowly scoped to "gross negligence or willful
  misconduct" only. An ordinary-negligence data breach -- the most realistic real-world incident
  -- would NOT trigger Section 8.1 indemnification (it isn't gross negligence or willful
  misconduct), so it would NOT benefit from the "indemnification obligations" carve-out in 8.2
  either; it would instead fall under the plain 12-months'-fees cap. The client's apparent broad
  protection is largely illusory for the most likely failure mode. A correct answer catches this
  and redlines Section 8.1 to also cover ordinary negligence (or expands the carve-out to include
  data-breach claims regardless of fault level), and flags the point for counsel given deal value.
  All clause text is provided inline; no real-world statute or case citation is used or needed.
