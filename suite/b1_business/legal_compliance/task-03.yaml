id: legal_compliance-03
unit: legal_compliance
difficulty: medium
class: standard
industry: financial_services
prompt: |
  Your client is a regional credit union. On July 1, IT discovered that a misconfigured export
  job had exposed a database extract to an unauthorized third party. The extract contained names,
  partial account numbers, and partial SSNs for approximately 1,200 members. Account numbers in
  the extract were field-level encrypted; names and partial SSNs in the same extract were not.

  The credit union's outside counsel has summarized the applicable state breach-notification law
  (paraphrased, not the statute text itself) as follows: notification is triggered when
  unencrypted personal information -- defined to include name combined with SSN or account
  number -- is reasonably believed to have been acquired by an unauthorized person; affected
  residents must be notified without unreasonable delay and no later than 30 days after
  discovery; the state Attorney General must also be notified if the incident affects 500 or more
  residents; and there is a safe harbor from notification if ALL of the personal information
  involved was encrypted using a method meeting an industry-standard threshold.

  General background, not case-specific: credit unions are also generally subject to federal
  safeguarding-of-customer-information obligations under GLBA, separate from any state breach-
  notification analysis.

  Triage this incident: does it trigger notification, who must be notified, by what date (working
  from the July 1 discovery date), and how does the mixed encrypted/unencrypted nature of the
  extract affect whether the safe harbor applies?
signals:
  - {type: numeric, value: 500, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 1200, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\bsafe harbor\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(counsel|legal)\\b", weight: evidence}
notes: |
  Legal & Compliance Task 03 -- incident-notification obligation triage from a provided fact
  pattern + provided law summary (medium). Industry: financial_services. The state
  breach-notification law is presented as counsel's own summary (paraphrase, not statute text),
  and GLBA is referenced only at the general, existence level -- no section numbers, no state
  named. Non-obvious element: because names and partial SSNs (unencrypted) were present in the
  SAME extract as the encrypted account numbers, the safe harbor (which requires ALL personal
  information to be encrypted) does not cleanly apply -- a shallow answer might see "account
  numbers were encrypted" and wrongly conclude no notification is needed. Correct triage:
  notification is very likely required (unencrypted name+SSN combination is exactly what the
  summarized trigger covers); both the 1,200 affected residents (>500) and the state AG must be
  notified; the July 1 discovery date plus the 30-day window sets the deadline; and the mixed-
  encryption safe-harbor question should be confirmed with counsel rather than assumed away.
