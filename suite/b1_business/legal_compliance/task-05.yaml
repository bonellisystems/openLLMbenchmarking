id: legal_compliance-05
unit: legal_compliance
difficulty: medium
class: standard
industry: public_sector
prompt: |
  A county agency just completed a compliance audit. The findings:

  1. 14 workstations were found with local administrator rights beyond IT staff, violating the
     agency's least-privilege policy.
  2. The records-management log shows 3 categories of public records were destroyed in the past
     quarter without following the agency's required destruction-approval workflow (no sign-off
     on file).
  3. The vendor contract for cloud backup storage lacks a data-residency clause, which agency
     policy requires for any records containing constituent personally identifiable information
     (PII).
  4. The incident-response plan has not been tabletop-tested in over 2 years; policy requires an
     annual test.

  Build a remediation response plan: for each finding, name an owner, the remediation action, and
  a target closure date, prioritized by risk. Flag which finding(s) need review by the agency's
  legal counsel before the finding can be closed out, and explain why.
signals:
  - {type: regex, value: "(?i)\\bleast[- ]privilege\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(records? destr\\w+|destroyed)\\b", weight: critical}
  - {type: numeric, value: 14, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(counsel|legal)\\b", weight: critical}
notes: |
  Legal & Compliance Task 05 -- compliance-audit-response plan from provided findings (medium).
  Industry: public_sector. No specific public-records statute is cited -- the answer should
  reason from the general, widely-understood fact that public entities typically have open-
  records/public-disclosure obligations, without naming a specific act or section. The finding
  that most clearly needs legal counsel review before closure is Finding 2 (records destroyed
  without the required sign-off workflow): improperly destroyed public records can carry
  independent legal exposure distinct from the audit finding itself, separate from the
  workstation-admin-rights, contract-clause, and IR-testing findings, which are more
  straightforwardly operational remediations.
