id: legal_compliance-01
unit: legal_compliance
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You support the compliance function for a small e-commerce retailer building its first
  records-retention schedule. Company policy -- informed by general recordkeeping practice, not
  any specific statute you should cite -- sets these retention floors:

  1. Signed customer service contracts: retain 3 years past the contract's end date.
  2. Accounts payable/receivable and general-ledger records: retain 7 years, the company's
     internal floor for audit-support purposes.
  3. Marketing email opt-in/consent records: retain for as long as the contact remains subscribed,
     plus 2 years after unsubscribe or last contact.
  4. Vendor W-9 / tax-ID forms: retain 4 years after the business relationship ends.

  One additional fact: on March 2, 2026, the company's outside counsel issued a litigation-hold
  notice covering all correspondence and invoices with Vendor Greenline Supply Co. from 2023 to
  present, in connection with a pending contract dispute. This hold suspends normal
  retention/destruction schedules for those specific records until counsel lifts it.

  Build a simple retention schedule (category, retention floor, note on the litigation hold where
  it applies), and flag anything that should NOT be destroyed on the normal schedule right now.
signals:
  - {type: regex, value: "(?i)\\blitigation hold\\b", weight: critical}
  - {type: contains, value: "Greenline", weight: critical}
  - {type: numeric, value: 7, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(jurisdiction|counsel)\\b", weight: evidence}
notes: |
  Legal & Compliance Task 01 -- records-retention schedule from provided categories (easy).
  Industry: generic_smb. Safest citation pattern: all retention floors are given as company
  policy inline, not attributed to any specific statute or section number -- the model works
  from provided facts, not recalled law. The one substantive test is whether the answer catches
  that the Greenline Supply Co. litigation hold overrides the normal 2023-present
  correspondence/invoice retention/destruction schedule for that vendor specifically, and flags
  that final jurisdiction-specific retention periods should be confirmed with counsel before
  actual destruction of anything.
