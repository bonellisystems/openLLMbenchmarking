id: data_analytics-05
unit: data_analytics
difficulty: medium
class: standard
industry: public_sector
prompt: |
  A city's Department of Permitting ran an A/B test on two versions of an email reminder sent
  to applicants with an incomplete permit application, measuring "completion rate" (recipient
  finishes and resubmits within 7 days of the email).

  Version A (control, plain-text reminder): sent to 240 recipients, 42 completed within 7 days.
  Version B (adds a countdown-to-deadline banner and a direct resume link): sent to 235
  recipients, 51 completed within 7 days.

  A staffer's draft summary for the department director says: "Version B lifts completion by
  24% -- let's roll it out to everyone immediately." Compute the completion rate for each
  version and the point-to-point lift. Assess whether a difference of this size, at these sample
  sizes (roughly 40-50 completions per arm), is large enough to be confident it reflects a real
  effect of the new email design rather than normal week-to-week noise in a modest sample.
  State what you would need (larger sample, longer run, formal significance test) before
  recommending a full rollout, and what you would do in the meantime given Version B costs
  nothing extra to keep running.
signals:
  - {type: numeric, value: 17.5, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 21.7, tolerance: 0.03, weight: critical}
  - {type: numeric, value: 4.2, tolerance: 0.1, weight: evidence}
  - {type: regex, value: "(?i)\\b(significan\\w*|sample size|underpowered|not conclusive|confidence interval)\\b", weight: critical}
notes: |
  Data Analytics Task 05 -- A/B result readout with significance caution (medium). Industry:
  public_sector (city permitting department).
  Arithmetic verified: Version A rate = 42/240 = 17.5%. Version B rate = 51/235 = 21.702% ~
  21.7%. Point lift = 21.7 - 17.5 = 4.2 percentage points (the staffer's "24%" figure is the
  RELATIVE lift, 4.2/17.5 = 24%, which is a real and correctly-computed number but is being used
  to imply more certainty than the sample supports). Back-of-envelope: with ~42 and ~51 events on
  bases of 240/235, the standard error of the difference in proportions is roughly 3.6 points --
  a 4.2-point observed difference is only about 1.2 standard errors, well short of the ~2 SE
  threshold conventionally used for statistical significance. A correct answer does not need to
  reproduce that exact SE math, but must flag that a sample this size cannot yet support a
  confident "roll out to everyone" claim, and should not just repeat the relative-lift framing
  uncritically -- matching the anchors' correlation/certainty-hedging excellence marker.
