id: data_analytics-04
unit: data_analytics
difficulty: medium
class: standard
industry: financial_services
prompt: |
  A fintech lending SaaS product's Finance team and Product team walked into the June board
  meeting with two different churn numbers for the same month, and the board wants a
  reconciliation, not a re-argument. The account activity for June:

  - Active accounts at June 1: 500.
  - 20 accounts fully cancelled (account closed/deleted) during June.
  - 8 accounts downgraded from a paid plan to the $0 free tier during June (still logged in and
    actively using the product, but billing $0).
  - 5 accounts went on a contractual billing pause during June (a pause clause in their
    contract suspends billing for up to 60 days with an automatic resume -- they are not
    billed in June but are still under contract and will resume paying).

  Finance's churn definition: "Customer Churn Rate" = accounts with zero billed revenue at
  month end / accounts active at month start. Product's churn definition: "Logo Churn Rate" =
  accounts fully cancelled / accounts active at month start (Product excludes downgrades,
  since those users are still actively using the product, and excludes contractual pauses,
  since those customers have not left).

  Compute Finance's Customer Churn Rate and Product's Logo Churn Rate as each team currently
  defines them. Determine whether one team is simply wrong, or whether this is a
  metric-definition mismatch rather than a calculation error -- and say which. Then recommend a
  reconciliation: should the 5 contractually-paused accounts count as churned under EITHER
  definition? Recompute Finance's rate with the paused accounts correctly excluded, and state
  the final set of churn numbers the board should see, each clearly labeled by what it measures.
signals:
  - {type: numeric, value: 6.6, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 4.0, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 5.6, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\bdefinition\\b", weight: evidence}
notes: |
  Data Analytics Task 04 -- metric-definition dispute / churn reconciliation (medium). Industry:
  financial_services (fintech lending SaaS).
  Arithmetic verified: Finance's original Customer Churn Rate = (20 cancelled + 8 downgraded +
  5 paused) / 500 = 33/500 = 6.6%. Product's Logo Churn Rate = 20/500 = 4.0%. Neither team made
  an arithmetic error -- each number is internally correct under its own definition; the dispute
  is definitional (revenue-churn vs. logo-churn), not a calculation bug, which is the point a
  correct answer must make explicitly. Reconciliation: contractually-paused accounts (5) have a
  guaranteed resume date and are not lost customers, so they should NOT count as churned under
  either lens -- recomputing Finance's rate excluding the 5 paused accounts gives (20+8)/500 =
  28/500 = 5.6%, the correct "dollar/revenue churn excluding temporary pauses" figure to present
  alongside Product's unchanged 4.0% logo churn.
