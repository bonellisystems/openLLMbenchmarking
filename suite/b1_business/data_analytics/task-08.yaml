id: data_analytics-08
unit: data_analytics
difficulty: hard
class: long
industry: oil_gas_energy
prompt: |
  An oilfield-services company's average realized price per barrel-of-oil-equivalent (BOE) sold
  rose from $60.00/BOE in Q1 to $64.00/BOE in Q2. The Slack chatter among leadership is "the
  market must finally be paying us more for our product." You have the underlying data:

  Benchmark (market) price, WTI-linked index: Q1 average $61.00, Q2 average $61.20 -- essentially
  flat quarter over quarter.

  Product-level volume and per-unit realized price (both products' own per-unit prices are
  UNCHANGED between Q1 and Q2):
  - Crude oil: Q1 volume 4,000 BOE/d @ $70/BOE. Q2 volume 4,800 BOE/d @ $70/BOE (same price).
  - NGLs (natural gas liquids): Q1 volume 2,000 BOE/d @ $40/BOE. Q2 volume 1,200 BOE/d @ $40/BOE
    (same price).
  - Total volume: 6,000 BOE/d in both Q1 and Q2 (unchanged).

  First, check the leadership theory against the benchmark data -- is "the market is paying more"
  consistent with what the benchmark actually did? Lay out your investigation plan: what you'd
  check first (product mix, then each product's own per-unit price, then total volume), and what
  you find at each step. Compute the Q1 and Q2 blended $/BOE from the volume and price data given
  and confirm they match the $60.00 -> $64.00 figures. Determine how much of the $4.00/BOE
  increase is explained by a shift in product mix versus an actual per-product price/rate change,
  and state your conclusion about whether the "better pricing" narrative is correct.
signals:
  - {type: numeric, value: 60, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 64, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\bmix\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(flat|unchanged|did not (move|change))\\b", weight: evidence}
notes: |
  Data Analytics Task 08 -- "why did metric X move" investigation plan, mix-shift trap (hard).
  Industry: oil_gas_energy.
  Arithmetic verified (verify_arith_da_pm.py): Q1 blended = (4,000x70 + 2,000x40)/6,000 =
  (280,000+80,000)/6,000 = 360,000/6,000 = $60.00/BOE. Q2 blended = (4,800x70 + 1,200x40)/6,000 =
  (336,000+48,000)/6,000 = 384,000/6,000 = $64.00/BOE. Delta = +$4.00/BOE. Both products' own
  per-unit prices are IDENTICAL Q1 vs Q2 ($70 crude, $40 NGL) and total volume is identical
  (6,000 BOE/d both quarters), so the rate effect is $0 and the volume effect is $0 -- the ENTIRE
  $4.00/BOE increase is a pure product-mix shift (crude's share of the 6,000 BOE/d total rose
  from 4,000/6,000=66.7% to 4,800/6,000=80%, and crude is priced nearly 2x NGL, so a mix shift
  toward crude alone lifts the blend). The benchmark (market) price barely moved ($61.00 ->
  $61.20, +0.3%), which flatly contradicts the "market is paying us more" narrative -- a correct
  answer must state that the leadership theory is wrong and that the increase is 100% mix-driven,
  matching the anchors' correlation-vs-causation and traceable-findings excellence markers (this
  is the unit's mix-shift analogue to the fan-out-join trap in task-06, applied to metric
  movement rather than SQL).
