id: data_analytics-01
unit: data_analytics
difficulty: easy
class: short
industry: life_sciences
prompt: |
  You're the analyst for a lab-supply company that sells reagent-kit subscriptions to
  university and biotech research labs. Leadership wants a cohort dollar-retention read from
  the following signup-cohort table (all figures are Monthly Recurring Revenue, "MRR"):

  Cohort Jan-2026 -- 40 customers. Month 1 MRR (signup month): $20,000. Month 2 MRR retained:
  $17,000. Month 3 MRR retained: $15,000.

  Cohort Feb-2026 -- 50 customers. Month 1 MRR (signup month): $25,000. Month 2 MRR retained:
  $21,250. (Month 3 has not happened yet for this cohort -- it is only 2 months old.)

  Cohort Mar-2026 -- 35 customers. Month 1 MRR (signup month): $17,500. (No Month 2 figure
  exists yet -- this cohort is only 1 month old.)

  Compute the Month-2 net dollar retention rate for every cohort where it can actually be
  computed, and the Month-3 net dollar retention rate for the Jan cohort. Compute the absolute
  dollar churn (not just the percentage) for the Jan and Feb cohorts at Month 2, and state which
  of the two lost more revenue in absolute dollars. Explain why the Feb cohort has no Month-3
  figure and the Mar cohort has no Month-2 figure -- do not invent numbers to fill the gap -- and
  explain why blending all three cohorts into one "average retention" number right now would be
  misleading given they are not the same age.
signals:
  - {type: numeric, value: 85, tolerance: 0.02, weight: evidence}
  - {type: numeric, value: 75, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 3750, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\b(not yet|too (early|soon)|insufficient|immature|hasn'?t happened)\\b", weight: evidence}
notes: |
  Data Analytics Task 01 -- cohort dollar-retention read from a provided table (easy).
  Industry: life_sciences (reagent-kit subscription vendor).
  Arithmetic verified (verify_arith_da_pm.py): Jan Month-2 retention = 17,000/20,000 = 85%;
  Jan Month-3 retention = 15,000/20,000 = 75%; Feb Month-2 retention = 21,250/25,000 = 85%
  (identical percentage to Jan). Jan Month-2 dollar churn = 20,000-17,000 = $3,000. Feb Month-2
  dollar churn = 25,000-21,250 = $3,750. Non-obvious-for-easy point: despite Jan and Feb having
  the IDENTICAL 85% retention rate, Feb lost more absolute dollars ($3,750 vs $3,000) because its
  starting MRR base is larger -- percentage and absolute-dollar views can rank cohorts
  differently. The Feb Month-3 and Mar Month-2 figures are intentionally absent because those
  cohorts have not reached that age yet (a grain/maturity gap, not a data-quality gap) -- a
  correct answer must say so rather than fabricate a number, per the anchors' red flag on
  presenting fabricated numbers as query/data output.
