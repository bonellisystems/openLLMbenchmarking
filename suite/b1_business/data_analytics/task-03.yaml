id: data_analytics-03
unit: data_analytics
difficulty: medium
class: standard
industry: manufacturing_ag
prompt: |
  You're building a KPI tree for an ag-equipment distributor's new BI dashboard, rooted at
  quarterly Revenue and decomposed down to levers the sales and marketing teams actually
  control. Current quarter actuals:

  - Units Sold: 350 tractors/implements.
  - Average Selling Price (ASP): $12,000/unit.
  - Revenue = Units Sold x ASP.
  - Units Sold is itself produced by: Leads (2,800) x Lead-to-Quote Rate (25%) x
    Quote-to-Close Rate (50%).

  Build the KPI tree (Revenue at the root, Units Sold and ASP as its direct children, then
  Leads / Lead-to-Quote Rate / Quote-to-Close Rate as children of Units Sold), and verify the
  tree's numbers actually reconcile up to the stated Revenue. Label which KPIs are directly
  controllable by the sales/marketing team versus mostly driven by external market conditions.
  Then compute the dollar revenue impact of a 10% improvement in ASP alone, and separately the
  dollar revenue impact of a 10% improvement in Leads alone (holding the other levers fixed).
  State which lever produces the bigger revenue impact, or whether they're the same, and explain
  why -- and recommend how leadership should actually prioritize between levers given what you
  found (hint: revenue impact size is not the only thing that should drive prioritization).
signals:
  - {type: numeric, value: 4200000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 420000, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 2800, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(equal(ly)?|identical|same (size|impact|magnitude))\\b", weight: evidence}
notes: |
  Data Analytics Task 03 -- KPI tree design with reconciliation (medium). Industry:
  manufacturing_ag.
  Arithmetic verified (verify_arith_da_pm.py): baseline Revenue = 350 x $12,000 = $4,200,000.
  Funnel check: 2,800 leads x 25% x 50% = 350 units -- reconciles exactly to the stated Units
  Sold. ASP +10% -> 350 x $13,200 = $4,620,000, a +$420,000 impact. Leads +10% -> 3,080 leads x
  25% x 50% = 385 units x $12,000 ASP = $4,620,000, ALSO a +$420,000 impact -- identical in
  dollar terms. Non-obvious point for a medium task: because Revenue = Leads x L2Q% x Q2C% x ASP
  is a pure multiplicative chain, a 10% move in ANY single factor (holding the others fixed)
  produces the same +10% (here, +$420,000) revenue effect, regardless of how "close to revenue"
  that lever sits in the tree. A correct answer should flag that lever prioritization therefore
  cannot be based on which lever has the biggest revenue impact (they tie) -- it has to be based
  on which lever is cheapest/fastest to actually move by 10% (e.g., a small ASP price increase
  vs. a much harder 10% lift in raw lead volume).
