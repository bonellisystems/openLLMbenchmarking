id: data_analytics-02
unit: data_analytics
difficulty: easy
class: short
industry: msp_internal
prompt: |
  Your MSP's internal ops dashboard shows a weekly help-desk ticket-volume line chart that
  leadership is pointing to in a staffing-budget meeting, saying "ticket volume is exploding --
  we need to hire two more techs immediately." The chart's y-axis is drawn starting at 380
  (not 0) and topping out at 450, and it only shows the last 6 weeks. The underlying weekly
  ticket counts, read off the dashboard's data table, are:

  Week 1: 410. Week 2: 415. Week 3: 420. Week 4: 428. Week 5: 433. Week 6: 441.

  Compute the actual percentage change in ticket volume from Week 1 to Week 6. Explain
  specifically why drawing the y-axis starting at 380 instead of 0 exaggerates how steep that
  change looks on screen. State what the chart's 450-unit axis top and 380 axis bottom compress
  the visual range to, and recommend how you would redraw the chart so it does not visually
  mislead the room. Do not recommend the hiring decision based on the "exploding" framing without
  first noting the corrected, modest percentage change.
signals:
  - {type: numeric, value: 7.56, tolerance: 0.03, weight: critical}
  - {type: regex, value: "(?i)\\btruncat(ed|ion)\\b", weight: critical}
  - {type: numeric, value: 380, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\b(mislead\\w*|distort\\w*|deceiv\\w*)\\b", weight: evidence}
notes: |
  Data Analytics Task 02 -- dashboard interpretation + misleading-chart-framing flag (easy).
  Industry: msp_internal (the MSP's own help-desk ops dashboard).
  Arithmetic verified: (441-410)/410 = 31/410 = 7.561% ~ 7.56% actual six-week change. The
  truncated y-axis (380-450, a 70-unit visible range) makes a real ~7.6% rise look like the line
  travels most of the chart's height, since 410 sits near the very bottom of that compressed
  range and 441 sits near the top -- classic truncated-axis distortion, the anchors' explicit red
  flag ("chart design that would visually mislead ... recommended without caveat"). Correct
  answer must compute the honest 7.56% change, name the axis truncation as the cause of the
  visual exaggeration, and recommend redrawing with a zero-based axis (or showing more trailing
  history for context) before that chart is used to justify a hiring decision.
