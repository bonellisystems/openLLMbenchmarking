id: seo-04
unit: seo
difficulty: medium
class: standard
industry: financial_services
prompt: |
  You're building a keyword strategy for a regional credit union from Search Console-style
  performance data (last 90 days):

  - "auto loan rates [state]" -- 8,200 impressions, 62 clicks, average position 11.4
  - "personal loan calculator" -- 5,100 impressions, 480 clicks, average position 3.2
  - "credit union near me" -- 12,000 impressions, 108 clicks, average position 9.8
  - "how to refinance a car loan" -- 3,400 impressions, 15 clicks, average position 22.1

  Compute the click-through rate (CTR) for each query. Identify which query is the best "quick
  win" -- high impression volume, positioned close enough to page 1 that on-page/title
  optimization could realistically lift it, and currently converting that visibility into clicks
  poorly. Identify which query is already performing well and needs protection rather than
  investment, and which query would require a longer-term content investment given its position.
  State the CTR and position for the query you identify as the quick win.
signals:
  - {type: numeric, value: 9.8, tolerance: 0.02, weight: critical}
  - {type: numeric, value: 12000, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bCTR\\b", weight: evidence}
  - {type: numeric, value: 0.9, tolerance: 0.06, weight: evidence}
notes: |
  SEO Task 04 -- keyword strategy from provided search-console-style data (medium). Industry:
  financial_services (regional credit union). CTRs verified (verify_arith.py): auto loan rates
  0.76%, personal loan calculator 9.41%, credit union near me 0.90%, refinance 0.44%. "Credit
  union near me" is the intended quick win: highest impression volume (12,000) among the two
  page-1-adjacent queries (position 9.8 vs. 11.4), with a CTR (0.9%) far below what its position
  should support, versus "personal loan calculator" which already converts well (9.41% CTR,
  position 3.2, needs protection not investment) and "how to refinance" which sits at position
  22.1, too far back for quick on-page fixes to move.
