id: seo-01
unit: seo
difficulty: easy
class: short
industry: generic_smb
prompt: |
  You're building a local SEO plan for a single-location veterinary clinic. Current state:

  - Google Business Profile (GBP): 38 reviews, average rating 4.1 stars. The top 3 competing
    clinics within a 5-mile radius average 4.6 stars across 150-300 reviews each.
  - Only about 40% of the GBP profile fields are filled in -- holiday hours are missing, the
    services list is not populated, and there are only 3 photos uploaded.
  - NAP (name, address, phone) consistency check: the clinic's old address is still listed on
    Yelp, and an old phone number is still listed on Healthgrades. Both are correct on the GBP
    listing and the clinic's own website.

  Build a local SEO plan covering GBP profile completeness, a review-generation process with a
  concrete review-volume target, and NAP consistency fixes across directories. State the
  clinic's current review count and rating as your baseline, and give a target review count and
  timeframe. Prioritize the actions.
signals:
  - {type: numeric, value: 38, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 4.1, tolerance: 0.02, weight: evidence}
  - {type: regex, value: "(?i)\\b(NAP|name,? address,? (and )?phone)\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(Google Business Profile|GBP)\\b", weight: evidence}
notes: |
  SEO Task 01 -- local SEO plan (GBP/reviews/NAP) (easy). Industry: generic_smb (veterinary
  clinic). Load-bearing constraint: local-service businesses like a vet clinic live or die on
  local-search and review dynamics (GBP completeness, review volume/velocity relative to
  competitors, NAP consistency across directories) rather than the broader organic-content SEO
  playbook. Baseline facts (38 reviews / 4.1 rating, competitors at 4.6 across 150-300 reviews,
  NAP mismatches on 2 named directories) are given and must be cited accurately, not invented.
