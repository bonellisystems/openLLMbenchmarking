id: seo-07
unit: seo
difficulty: hard
class: long
industry: healthcare_compliance
prompt: |
  A HIPAA compliance-training company has three separate pages all targeting overlapping
  "HIPAA training" search terms:

  - /hipaa-training -- general overview page, published 3 years ago, 45 referring domains.
  - /hipaa-compliance-training-for-employees -- published 1 year ago, 8 referring domains.
  - /online-hipaa-training-courses -- published 6 months ago, 3 referring domains.

  Search Console shows all three pages alternate ranking for "hipaa training" week to week
  between positions 6 and 14, with none consistently breaking into the top 5. Combined, the
  three pages get 4,200 monthly impressions but only 95 combined clicks for that term.

  Diagnose what's happening across these three pages and design an internal-linking plan that
  resolves it. State which of the three pages should be the designated primary target for the
  head term "hipaa training" and why (cite the referring-domain counts). Recommend what to do
  with the other two pages (consolidate, redirect, or re-scope to a distinct intent), and
  describe how sitewide internal links (navigation, related-resources modules, blog posts)
  should be restructured to support the primary page.
signals:
  - {type: numeric, value: 45, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 4200, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bcanniba(l|liz)", weight: critical}
  - {type: regex, value: "(?i)\\bcanonical\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(301|redirect|consolidat(e|ion)|merge)\\b", weight: evidence}
notes: |
  SEO Task 07 -- internal-linking plan from a described architecture (hard). Industry:
  healthcare_compliance. Non-obvious hard element: cannibalization between pages. The
  week-to-week position volatility across three overlapping pages plus the low combined CTR
  (95/4,200 = 2.26%, verify_arith.py) is the classic cannibalization signature -- a correct
  answer must name the phenomenon explicitly (not just diagnose "these pages compete") and
  designate /hipaa-training as the primary target because it holds the most referring-domain
  authority (45, versus 8 and 3), then recommend consolidating/redirecting or re-scoping the
  other two and pointing internal links at the primary page, rather than treating this as a
  generic internal-linking exercise unrelated to the cannibalization diagnosis.
