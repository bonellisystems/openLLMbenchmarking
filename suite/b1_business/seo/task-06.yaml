id: seo-06
unit: seo
difficulty: hard
class: long
industry: oil_gas_energy
prompt: |
  Apex Pipeline Solutions, a B2B industrial pipeline-inspection services company, is migrating
  its 340-URL site from an old domain to a new domain and a new CMS as part of a rebrand,
  launching in 6 weeks. Backlink data shows that 28 of the 340 URLs -- mostly technical
  whitepaper and case-study pages -- hold 85% of the domain's total referring-domain link
  equity.

  Two years ago, a different subsidiary site went through a similar migration and lost 60% of
  its organic traffic within 3 months, because the team redirected every old URL to the new
  homepage instead of mapping each old page to its specific new-page equivalent.

  Produce a prioritized SEO migration checklist for the 6-week timeline. State the total URL
  count and the count of high-equity URLs as the scope of the redirect-mapping effort, and be
  explicit about what the redirect approach must be (referencing what went wrong in the prior
  migration) versus what must NOT be done. Cover canonical tags, robots.txt, and XML sitemap
  handling for the new domain as well.
signals:
  - {type: numeric, value: 340, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 28, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(1:1|one-to-one|page-to-page|page[- ]level)[\\s-]*redirect", weight: critical}
  - {type: regex, value: "(?i)\\brobots\\.txt\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bcanonical\\b", weight: evidence}
notes: |
  SEO Task 06 -- site-migration SEO checklist (hard). Industry: oil_gas_energy (B2B pipeline
  services). Non-obvious hard element (the migration checklist item everyone forgets): the prior
  subsidiary migration's 60% traffic loss is explicitly attributed to blanket redirect-to-
  homepage instead of 1:1 page-to-page redirect mapping -- a correct checklist must call out
  building a 1:1 redirect map across all 340 URLs (not a shortcut blanket redirect), with the 28
  high-equity backlink pages treated as the top-priority subset to get exactly right, since
  losing that concentrated 85% of referring-domain equity would be the costliest possible
  mistake. Canonical/robots.txt/sitemap items are included as the secondary, more commonly
  remembered migration checklist items.
