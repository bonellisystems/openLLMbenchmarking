id: seo-02
unit: seo
difficulty: easy
class: short
industry: manufacturing_ag
prompt: |
  You're writing a content brief for an industrial-parts distributor targeting the search query
  "hydraulic cylinder repair cost." Research data:

  - Average monthly search volume: 720.
  - The current top 10 ranking pages are 70% pricing/cost-guide informational content
    (average word count approximately 1,400 words) and 30% product or repair-service pages.
  - "People Also Ask" boxes for this query include: "How much does it cost to rebuild a
    hydraulic cylinder?" and "Is it cheaper to repair or replace a hydraulic cylinder?"

  Write a content brief for this query: classify the dominant search intent, set a target word
  count informed by what's currently ranking, list the H2 sections the piece needs (including
  answers to both People Also Ask questions), and specify a call-to-action appropriate to the
  intent you classified (not a hard "buy now" CTA if the intent is primarily informational).
signals:
  - {type: numeric, value: 1400, tolerance: 0.05, weight: critical}
  - {type: numeric, value: 720, tolerance: 0.01, weight: evidence}
  - {type: regex, value: "(?i)\\brepair or replace\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bintent\\b", weight: critical}
notes: |
  SEO Task 02 -- content brief for a target query (easy). Industry: manufacturing_ag (industrial
  hydraulic-parts distributor). SERP composition (70% informational cost-guide content,
  ~1,400-word norm) signals the query is primarily informational despite "cost" sounding
  commercial, so a correct brief classifies intent accordingly and sets a competitive word-count
  target near the 1,400-word norm rather than defaulting to a short product-page format.
