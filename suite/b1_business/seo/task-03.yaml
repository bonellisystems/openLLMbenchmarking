id: seo-03
unit: seo
difficulty: medium
class: standard
industry: aec
prompt: |
  You're running a technical SEO audit for an architecture firm's WordPress site (Yoast SEO
  plugin installed, title templates not customized per post type). Crawl findings from 240
  total pages:

  - 18 pages return a 404 -- mostly old project-portfolio pages that are still linked from the
    main navigation menu.
  - 34 pages have duplicate title tags -- the project-page template outputs the same generic
    title on every project regardless of which project it is, with no unique project name
    inserted.
  - A 12-page paginated blog series has no canonical or rel=next/prev handling configured,
    triggering near-duplicate-content flags across the series.
  - Homepage Largest Contentful Paint (LCP) measures 4.8 seconds, versus Google's "good"
    threshold of under 2.5 seconds.

  Produce a prioritized technical audit: for each issue, state the cause, the fix, and a
  priority ranking by expected impact versus effort. Address how the fixes apply specifically
  to a WordPress + Yoast setup.
signals:
  - {type: numeric, value: 18, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 34, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bcanonical\\b", weight: critical}
  - {type: regex, value: "(?i)\\b(301 redirects?|redirects?)\\b", weight: evidence}
notes: |
  SEO Task 03 -- technical audit from provided crawl findings (medium). Industry: aec
  (architecture firm, WordPress + Yoast). Platform constraint (WordPress/Yoast) must be
  respected in the fix recommendations rather than generic CMS-agnostic advice. Four distinct
  issues given (404s, duplicate titles, missing canonical/pagination handling, slow LCP) so the
  answer must prioritize rather than treat all four as equally urgent; the anchors' "correct
  technical implementation detail (canonical, redirects, schema, robots)" excellence marker
  applies directly to the canonical/redirect fixes here.
