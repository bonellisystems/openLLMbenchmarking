id: seo-05
unit: seo
difficulty: medium
class: standard
industry: legal
prompt: |
  You're critiquing an existing service page for a personal-injury law firm ahead of a rewrite.
  Current page:

  Title tag: "Best Personal Injury Lawyer Personal Injury Attorney Personal Injury Law Firm |
  Springfield Personal Injury Lawyers"

  Body content: 180 words total, covering only a brief generic overview of personal injury law.
  No attorney name, bio, or credentials appear anywhere on the page. No disclaimer accompanies
  the page's case-result mentions. Meta description: none written -- the page relies on
  Google's auto-generated snippet.

  Critique this page for SEO. Name the specific problem with the title tag as written. State the
  current word count as your content-depth baseline and recommend a target length. Recommend
  what needs to be added given that legal content is treated by Google as YMYL ("Your Money or
  Your Life") content requiring stronger trust and expertise signals, and provide a proper meta
  description.
signals:
  - {type: regex, value: "(?i)\\bkeyword stuff(ing)?\\b", weight: critical}
  - {type: numeric, value: 180, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\b(E-E-A-T|E-A-T|expertise|credential|attorney bio)\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bmeta description\\b", weight: evidence}
notes: |
  SEO Task 05 -- provided-page rewrite critique (medium). Industry: legal (personal-injury law
  firm). The title tag repeats "personal injury" four times -- a textbook keyword-stuffing
  pattern the answer must name explicitly as a problem to fix (not recommend), directly
  supporting the anchors' black-hat/keyword-stuffing red flag by testing that the model
  correctly treats it as something to remove rather than an optimization tactic. Legal content
  is a classic YMYL category, so the fix set should include author/attorney credential signals
  (E-E-A-T) alongside the more generic thin-content and missing-meta-description fixes.
