id: seo-08
unit: seo
difficulty: hard
class: long
industry: public_sector
prompt: |
  A county government services website's organic traffic dropped from a baseline average of
  28,000 monthly organic sessions to 16,240 -- a 42% drop -- over a 30-day window. The drop
  coincided exactly with a site redesign/relaunch 5 weeks ago that changed the CMS templating
  and site structure. The content team states no actual page content was rewritten or removed --
  only the visual design and template changed.

  Additional data pulled from Search Console since the relaunch: pages marked "Crawled --
  currently not indexed" jumped from a baseline of about 40 pages to 1,100 pages, and pages
  flagged "Duplicate, Google chose different canonical than user" jumped from near-zero to 380
  URLs. There is no manual action notice on the account, and no Google core algorithm update was
  announced during this window.

  Write a diagnostic plan. State the baseline and post-drop session counts. Rule out the
  hypotheses the data contradicts (content-quality decline, algorithm update, manual penalty)
  and explain why. Identify the most likely technical root cause given the indexation and
  canonical data, and specify what to check first (and in what order) to confirm it.
signals:
  - {type: numeric, value: 28000, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 1100, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)\\bcanonical\\b", weight: critical}
  - {type: regex, value: "(?i)\\brobots\\.txt\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b(redirect|301)\\b", weight: evidence}
notes: |
  SEO Task 08 -- "traffic dropped" diagnostic plan from provided analytics deltas (hard).
  Industry: public_sector (county government site). Non-obvious hard element: the obvious
  suspects (content quality, an algorithm update, a manual penalty) are each ruled out by a
  stated fact in the prompt (content unchanged; no algorithm update announced; no manual action
  notice), leaving the real cause as a technical indexation/canonical regression introduced by
  the redesign's new templating -- signaled by the spike in "crawled - not indexed" pages
  (40 -> 1,100) and "Google chose different canonical" URLs (0 -> 380). A correct answer traces
  the drop to that technical regression (likely mis-emitted canonical tags and/or an
  overly-aggressive robots.txt/meta-robots directive shipped with the new templates) and
  prescribes checking robots.txt and canonical tag output first, not a content or algorithm
  fix. 28,000 -> 16,240 is an exact 42% drop (verify_arith.py: 28000*0.58=16240).
