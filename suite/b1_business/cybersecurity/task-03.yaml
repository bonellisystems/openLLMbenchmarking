id: cybersecurity-03
unit: cybersecurity
difficulty: medium
class: standard
industry: life_sciences
prompt: |
  You are the on-call SOC analyst for an MSP client: a veterinary diagnostics laboratory that
  runs contract drug-safety trials for animal-health pharmaceutical sponsors. The lab's EDR
  and Windows event log pipeline just surfaced the following excerpt. All timestamps are UTC.

    2026-02-11 03:14:22 WIN-LABDC01 Security 4625 Failed logon: user=svc_backup,
      source=10.20.4.187, logon_type=3, status=0xC000006A
    2026-02-11 03:14:26 WIN-LABDC01 Security 4625 Failed logon: user=svc_backup,
      source=10.20.4.187, logon_type=3, status=0xC000006A
    2026-02-11 03:15:03 WIN-LABDC01 Security 4624 Successful logon: user=svc_backup,
      source=10.20.4.187, logon_type=3
    2026-02-11 03:16:47 WIN-LIMS02 Sysmon 1 ProcessCreate: parent=svchost.exe,
      image=C:\Windows\Temp\psexesvc.exe, user=svc_backup,
      commandline="psexesvc.exe -accepteula \\WIN-LIMS02 -u svc_backup cmd.exe"
    2026-02-11 03:17:12 WIN-LIMS02 Sysmon 3 NetworkConnect: image=cmd.exe,
      dest=198.51.100.44, dest_port=443

  WIN-LIMS02 is the Laboratory Information Management System (LIMS) server that stores
  confidential, unpublished trial results for the lab's pharmaceutical sponsors. The MSP's
  written escalation policy states: "P1 = confirmed lateral movement into a system holding
  confidential trial data, 1-hour SLA. P2 = suspicious authentication activity only, no
  confirmed lateral movement, 4-hour SLA." Triage this alert: name the MITRE ATT&CK
  technique(s) represented in the log excerpt, state which SLA tier applies and why, and state
  the single containment action that should happen FIRST, before anything else.
signals:
  - {type: regex, value: "(?i)\\bisolat", weight: critical}
  - {type: regex, value: "(?i)\\bT1021(\\.002)?\\b|(?i)\\bT1569(\\.002)?\\b", weight: critical}
  - {type: numeric, value: 1, tolerance: 0.01, weight: evidence}
notes: |
  Cybersecurity Task 03 -- alert triage from a provided log excerpt (medium).
  Synthetic log excerpt (realistic Windows Security/Sysmon event shapes: 4625/4624 logon
  events, PsExec service-name artifact "psexesvc.exe", outbound 443 beacon). PsExec-style
  lateral movement maps to ATT&CK T1021.002 (Remote Services: SMB/Windows Admin Shares) and/or
  T1569.002 (System Services: Service Execution) -- both accepted. Non-obvious element: the
  correct FIRST containment action is isolating WIN-LIMS02 (the compromised host holding
  confidential trial data) from the network, not merely resetting svc_backup's password or
  blocking the external IP -- a mid-tier answer often reaches for the reset/block first.
  Industry: life_sciences (veterinary diagnostics / contract trial data).
