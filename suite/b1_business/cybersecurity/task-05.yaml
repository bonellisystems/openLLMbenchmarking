id: cybersecurity-05
unit: cybersecurity
difficulty: medium
class: standard
industry: aec
prompt: |
  Your MSP just completed an M365 tenant hardening review for an architecture, engineering,
  and construction (AEC) firm client. The audit findings are:

  - Legacy authentication protocols (POP3, IMAP, Exchange ActiveSync basic auth) are still
    enabled tenant-wide.
  - Security Defaults are OFF, and no Conditional Access policies exist.
  - 7 of the tenant's 9 Global Administrator accounts do not have MFA enrolled.
  - An SPF record exists for the domain, but DMARC is not published.
  - Outlook desktop client patch level is unverified fleet-wide. CVE-2023-23397 (a zero-click
    Outlook NTLM-relay vulnerability triggered via a malicious calendar reminder sound, no user
    interaction required) was patched in the March 2023 Patch Tuesday cycle.

  Write a prioritized remediation plan, most critical finding first, and state which control
  you would enable to close the Conditional Access / legacy-auth gap, which DNS record closes
  the email-spoofing gap, and what you would do to confirm the Outlook fleet is no longer
  exposed to CVE-2023-23397.
signals:
  - {type: regex, value: "(?i)conditional access", weight: critical}
  - {type: regex, value: "(?i)\\bdmarc\\b", weight: evidence}
  - {type: numeric, value: 7, tolerance: 0.01, weight: critical}
  - {type: contains, value: "CVE-2023-23397", weight: note}
notes: |
  Cybersecurity Task 05 -- M365 hardening review (medium).
  Real CVE: CVE-2023-23397 (Microsoft Outlook NTLM-relay elevation of privilege, zero-click via
  calendar reminder sound path; patched March 2023 Patch Tuesday). Non-obvious element: a
  mid-tier answer treats all five findings as an equal-priority checklist; the correct
  prioritization puts the 7-of-9 unprotected Global Administrator accounts FIRST (highest blast
  radius: full tenant compromise), ahead of legacy auth / DMARC, matching the anchors' 10-vs-5
  distinction (prioritized-by-severity vs. generic unprioritized checklist). Industry: aec.
