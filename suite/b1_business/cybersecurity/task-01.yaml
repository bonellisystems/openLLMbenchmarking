id: cybersecurity-01
unit: cybersecurity
difficulty: easy
class: short
industry: financial_services
prompt: |
  You are a security analyst at an MSP supporting a financial services client (a regional
  credit union). A vulnerability scan of the client's perimeter firewall (a Palo Alto Networks
  PAN-OS GlobalProtect gateway) flagged CVE-2024-3400, a critical (CVSS 10.0) unauthenticated
  command injection vulnerability that is being actively exploited in the wild. The affected
  gateway provides VPN access for 42 branch workstations. Your remediation vendor quotes $4,200
  per system for emergency patching, configuration hardening, and forensic log review, for a
  total project cost of $176,400. Write a brief internal incident summary for the client's IT
  director that states the CVE, explains the business impact, gives the total remediation cost,
  and recommends a remediation timeline that includes enforcing MFA on the VPN gateway during
  the patch window.
signals:
  - {type: contains, value: "CVE-2024-3400", weight: critical}
  - {type: regex, value: "(?i)\\b(MFA|multi-factor)\\b", weight: evidence}
  - {type: numeric, value: 4200, tolerance: 0.01, weight: note}
notes: |
  Cybersecurity Task 01 -- CVE impact assessment / remediation cost estimate (easy).
  Real CVE: CVE-2024-3400 (Palo Alto Networks PAN-OS GlobalProtect command injection,
  CVSS 10.0, actively exploited by UTA0218 starting April 2024; CISA KEV-listed).
  Industry: financial_services (credit union). Deliberately close in shape to the earlier
  placeholder fixture so the existing loader/execute unit tests (tests/test_b1.py) that build
  a fixed stub response around this task's signal set remain valid.
