id: cybersecurity-02
unit: cybersecurity
difficulty: easy
class: short
industry: healthcare_compliance
prompt: |
  Your MSP manages IT for a mid-size medical imaging practice, a HIPAA covered entity. After
  the 2023 MOVEit Transfer breach (CVE-2023-34362, a SQL injection vulnerability in a managed
  file transfer product) affected several healthcare vendors nationally, the practice's
  compliance officer is re-vetting third-party vendors and has asked you, as the MSP's security
  lead, to complete Section 4 ("Incident Response & Breach Notification") of a vendor security
  questionnaire on the MSP's own behalf, since the MSP has administrative access to systems that
  store the practice's protected health information (PHI). Answer these three questionnaire
  items in your response:
  1. What is your organization's regulatory timeline for notifying the covered entity after
     discovering a breach of unsecured PHI?
  2. Do you enforce multi-factor authentication for all remote administrative access to systems
     that touch PHI?
  3. Describe your process for verifying whether a third-party software component you rely on,
     such as a managed file transfer tool, has a known CVE before you deploy it in the
     practice's environment.
signals:
  - {type: contains, value: "CVE-2023-34362", weight: note}
  - {type: regex, value: "(?i)\\b(MFA|multi-factor)\\b", weight: evidence}
  - {type: numeric, value: 60, tolerance: 0.01, weight: critical}
notes: |
  Cybersecurity Task 02 -- vendor security questionnaire section (easy).
  Real CVE: CVE-2023-34362 (Progress Software MOVEit Transfer SQL injection, exploited at
  scale by Cl0p in the 2023 mass-breach campaign that hit many healthcare and public-sector
  vendors). Numeric signal 60 = HIPAA/HITECH Breach Notification Rule outer bound
  (45 CFR 164.404: notify affected individuals without unreasonable delay, no later than
  60 days after discovery). Industry: healthcare_compliance.
