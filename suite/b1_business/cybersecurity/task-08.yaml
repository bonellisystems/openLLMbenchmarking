id: cybersecurity-08
unit: cybersecurity
difficulty: hard
class: long
industry: public_sector
prompt: |
  Your MSP client is the Clerk's Office of a mid-size county government. The county's
  third-party document-transfer vendor was compromised via CVE-2023-34362 (a SQL injection
  vulnerability in the MOVEit Transfer managed file transfer product), exposing a database
  containing Social Security numbers and driver's license numbers for approximately 8,400
  residents who filed public records requests over the past five years. The compromise was
  discovered 6 days ago via the vendor's own breach disclosure. The county's outside counsel has
  confirmed the applicable state breach-notification statute requires: (a) notification to
  affected residents within 30 days of discovery, and (b) notification to the state Attorney
  General's office, because more than 500 residents are affected.

  Draft the client-facing incident summary the County Clerk will review before it is sent to
  affected residents and to the state Attorney General. Write in plain, accessible,
  non-alarmist language appropriate for public release, state the scope and the two
  notification obligations and their deadlines, recommend a concrete step to protect affected
  residents given the types of data exposed, and avoid language that reads as an admission of
  fault or legal liability.
signals:
  - {type: contains, value: "CVE-2023-34362", weight: critical}
  - {type: numeric, value: 8400, tolerance: 0.01, weight: critical}
  - {type: numeric, value: 30, tolerance: 0.01, weight: critical}
  - {type: regex, value: "(?i)attorney general", weight: evidence}
notes: |
  Cybersecurity Task 08 -- client-facing incident summary (hard).
  Real CVE: CVE-2023-34362 (Progress Software MOVEit Transfer SQL injection, exploited by Cl0p
  in the 2023 mass-breach campaign that hit numerous government and public-sector vendors). The
  state-law notification timeline (30 days / >500-resident AG threshold) is given as an
  in-scenario fact, not asserted as any specific real jurisdiction's actual statute, so the task
  stays self-contained. Non-obvious elements: (a) correctly distinguish the two separate
  notification obligations and audiences (residents within 30 days; state AG because the
  >500-resident threshold is met) rather than collapsing them into one; (b) recommend credit
  monitoring / identity-theft protection given SSN + driver's-license exposure; (c) avoid
  fault-admitting/liability language, appropriate for public-sector optics and legal exposure.
  Industry: public_sector.
