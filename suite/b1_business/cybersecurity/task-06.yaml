id: cybersecurity-06
unit: cybersecurity
difficulty: hard
class: long
industry: legal
prompt: |
  Run a tabletop-exercise response for a mid-size law firm client based on the following
  injected facts, in order:

  Day 1, 08:14 -- The firm's NetScaler ADC administrator reports unusual session behavior. The
  SOC confirms exploitation consistent with CVE-2023-4966 ("Citrix Bleed"), a session-token
  theft vulnerability in Citrix NetScaler ADC/Gateway. No MFA prompt was observed for the
  hijacked sessions, because session-token theft replays an already-authenticated session and
  bypasses the MFA challenge entirely -- MFA re-enrollment does not, by itself, invalidate a
  stolen session token.

  Day 1, 14:30 -- EDR flags mass file encryption beginning on FS-DOCS02, the file server hosting
  case files for three active litigation matters that are under a litigation hold, including
  attorney work product.

  Day 1, 15:00 -- A ransom note demands 12 BTC (approximately $780,000 at Day-1 spot price)
  within 96 hours. The firm's cyber insurance policy is claims-made with a consent-to-settle
  clause requiring the carrier's pre-approval of any incident-response vendor engagement or
  cost before the firm spends against the policy.

  Walk through the response in priority order. Specifically address: (1) the correct technical
  containment steps given that MFA does not stop this attack vector, (2) how you preserve
  evidence on FS-DOCS02 without violating the active litigation holds or destroying privileged
  work product, (3) who must be engaged BEFORE remediation spending begins and why acting first
  could jeopardize insurance coverage under the consent-to-settle clause, and (4) how you would
  approach the ransom demand without unconditionally recommending payment.
signals:
  - {type: contains, value: "CVE-2023-4966", weight: critical}
  - {type: regex, value: "(?i)\\b(insurance|carrier)\\b", weight: critical}
  - {type: regex, value: "(?i)\\bprivileg", weight: evidence}
  - {type: numeric, value: 96, tolerance: 0.01, weight: note}
notes: |
  Cybersecurity Task 06 -- tabletop scenario (hard).
  Real CVE: CVE-2023-4966 ("Citrix Bleed", NetScaler ADC/Gateway session-token disclosure,
  exploited widely against law firms and other targets in late 2023). Non-obvious elements a
  mid model commonly misses: (a) MFA does not remediate token theft -- the fix is patching
  NetScaler and invalidating/killing active sessions, not "enforce MFA harder"; (b) engaging
  the cyber-insurance carrier and breach counsel BEFORE incurring remediation costs, because a
  claims-made consent-to-settle clause can void coverage for unapproved spend; (c) preserving
  evidence on files under active litigation hold without altering privileged work product,
  ideally coordinating forensics through outside breach counsel to preserve privilege over the
  forensic report itself. Industry: legal.
