id: cybersecurity-07
unit: cybersecurity
difficulty: hard
class: long
industry: generic_smb
prompt: |
  A 60-employee industrial-parts distributor (an MSP client with no dedicated security staff)
  was hit by a phishing campaign. The facts, as confirmed by your team so far:

  - 6 employees opened an emailed Word attachment that exploited CVE-2022-30190 ("Follina"), a
    Microsoft Office/MSDT remote-code-execution vulnerability triggered via a malicious external
    link with no macros and no user interaction beyond opening the document, to drop a
    credential-harvesting page that captured their Microsoft 365 passwords.
  - Sign-in logs show all 6 accounts had successful M365 logins from an unfamiliar ASN in
    another country within 48 hours of the phishing email, and none of these logins triggered an
    MFA challenge.
  - Two mailboxes, accountspayable@ and controller@, now have newly created inbox rules that
    silently forward a copy of, and then delete, any message whose subject contains the word
    "invoice".

  Write a phishing-response runbook, in priority order, that a level-1 helpdesk technician with
  no security background could execute. Specifically address why a password reset alone will
  not fully remediate this incident given what the sign-in logs show, and what you would check
  in each affected mailbox beyond the inbox rules already described.
signals:
  - {type: contains, value: "CVE-2022-30190", weight: critical}
  - {type: regex, value: "(?i)\\brevo(k|cat)", weight: critical}
  - {type: regex, value: "(?i)\\b(forward(ing)?|inbox rule)", weight: evidence}
  - {type: numeric, value: 6, tolerance: 0.01, weight: note}
notes: |
  Cybersecurity Task 07 -- phishing-campaign response runbook (hard).
  Real CVE: CVE-2022-30190 ("Follina", MSDT RCE via Office external-link diagnostic-tool
  handler, no macros required). Non-obvious elements: (a) since sign-ins never triggered MFA,
  the attacker is replaying a valid session/refresh token, not just a password -- a password
  reset alone leaves the stolen token live, so the runbook must explicitly REVOKE refresh
  tokens / sign the user out of all sessions (a step a mid model commonly omits in favor of
  "just reset the password"); (b) beyond the two already-found inbox forwarding rules (classic
  BEC persistence), the runbook should also check for illicit OAuth app-consent grants, which
  likewise survive a password reset. Industry: generic_smb.
