id: cybersecurity-04
unit: cybersecurity
difficulty: medium
class: standard
industry: oil_gas_energy
prompt: |
  Your MSP manages the CORPORATE IT network (not the OT/SCADA pipeline-control network, which
  is operated separately by the client's automation team) for a regional oil & gas pipeline
  operator. A detection engineer handed you the following Sigma rule and asked you to reason
  about whether a specific log line matches it, and what to do next.

    title: Possible Zerologon Netlogon Exploitation (CVE-2020-1472)
    status: stable
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 5829
        Provider_Name: 'Netlogon'
      condition: selection
    level: critical
    tags:
      - attack.privilege_escalation
      - attack.t1210

  The log line under review:

    2026-03-04 22:41:09 DC-PIPE01 System 5829 Netlogon: This computer was not able to set up
    a secure session with a domain controller due to insufficient access rights, using an
    insecure Netlogon secure channel. Source computer: WKSTN-4471.

  DC-PIPE01 is the client's primary Active Directory domain controller. State whether this log
  line matches the Sigma rule, name the MITRE ATT&CK technique the rule tags, explain why a
  match on this event ID is significant for CVE-2020-1472 specifically, and state what the
  correct next step is regarding the OT/SCADA network -- given that IT and OT are supposed to
  be segmented, should the response assume pipeline-control systems are unaffected, or verify
  that the segmentation actually held?
signals:
  - {type: contains, value: "CVE-2020-1472", weight: critical}
  - {type: regex, value: "(?i)\\bT1210\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bverif", weight: critical}
notes: |
  Cybersecurity Task 04 -- Sigma-rule reasoning (medium).
  Real CVE: CVE-2020-1472 ("Zerologon", Netlogon elevation of privilege, patched August 2020).
  Windows Event ID 5829 is Microsoft's own documented Zerologon-vulnerable-channel warning
  event (added by the Zerologon enforcement patches to flag non-compliant/insecure Netlogon
  secure channel usage), making the Sigma rule's EventID/Provider_Name selection realistic.
  ATT&CK tag t1210 = Exploitation of Remote Services (the SigmaHQ community mapping for this
  rule family). Non-obvious element, aimed at the anchors' "calibrated about what needs live
  forensics vs. what can be assessed from the facts given" marker: DC-PIPE01 being hit is
  critical for the IT domain regardless, but the client is a pipeline operator with a nominally
  air-gapped OT network -- the correct answer VERIFIES the IT/OT segmentation boundary held
  rather than assuming it (in either direction: neither panicking about pipeline impact nor
  complacently assuming isolation). Industry: oil_gas_energy.
