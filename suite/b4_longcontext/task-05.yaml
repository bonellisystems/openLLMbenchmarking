id: multi-hop-01
kind: multi_hop
filler_template: |
  Ticket queue audit trail -- routine reassignments and status updates logged per
  the standard workflow. No SLA-impacting delays observed. Automated reminders
  sent for tickets approaching their review window.
needles:
  - depth_pct: 20
    text: >-
      TICKET LOG -- ticket #4471 (client-reported VPN instability) was escalated
      to on-call engineer Dana Kowalski for deep-dive analysis.
  - depth_pct: 72
    text: >-
      ON-CALL DIRECTORY -- Dana Kowalski's on-call PIN for after-hours dispatch
      confirmation is 7734.
question: >-
  What is the on-call PIN of the engineer who was assigned ticket #4471? (The
  document names the engineer in one place and their PIN in another -- you must
  combine both.)
signals:
  - {type: contains, value: "7734"}
notes: |
  Two-hop chained retrieval: ticket -> engineer name (depth 20%) -> engineer's PIN
  (depth 72%). Pure lookup chaining, no arithmetic required, so failure isolates
  to retrieval/reasoning rather than math.
