id: single-needle-02
kind: single_needle
filler_template: |
  Helpdesk queue snapshot -- ticket volume nominal, no SLA breaches in the trailing
  window. Auto-triage classified 94% of new tickets without human escalation. Backup
  jobs, patch compliance scans, and endpoint health checks all reported green across
  the monitored fleet. No action required from the on-call engineer at this time.
needles:
  - depth_pct: 8
    text: >-
      ROOT-CAUSE NOTE (incident INC-55210): the outage was traced to expired TLS
      certificate serial 0x4F1A9C on the client's internal CA. Renewal ticket
      CHG-88231 was filed to prevent recurrence.
question: >-
  According to the document, what is the change ticket number filed to prevent
  recurrence of incident INC-55210?
signals:
  - {type: contains, value: "CHG-88231"}
notes: |
  Single-needle NIAH planted near the START of the document (depth 8%) -- tests
  whether early-context information survives once the document is padded out to
  the full target length (the opposite failure mode from mid-document loss).
