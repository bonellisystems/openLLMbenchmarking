id: multi-needle-02
kind: multi_needle
filler_template: |
  Quarterly compliance rollup -- endpoint agent coverage steady, no lapses reported
  by the monitoring platform this cycle. Vulnerability scan cadence held at the
  contracted interval across all managed sites. Report distributed to stakeholders
  on schedule.
needles:
  - depth_pct: 10
    text: >-
      SITE COMPLIANCE -- Meridian Robotics (site code MER-01): patch compliance
      97.4% for Q1.
  - depth_pct: 35
    text: >-
      SITE COMPLIANCE -- Harborview Logistics (site code HRB-02): patch compliance
      88.1% for Q1.
  - depth_pct: 62
    text: >-
      SITE COMPLIANCE -- Coldwater Ag Co-op (site code CWA-03): patch compliance
      91.6% for Q1.
  - depth_pct: 90
    text: >-
      SITE COMPLIANCE -- Bristol Legal Partners (site code BLP-04): patch compliance
      99.9% for Q1.
question: >-
  Which site had the lowest Q1 patch compliance percentage, and what was that
  percentage?
signals:
  - {type: contains, value: "Harborview Logistics"}
  - {type: contains, value: "88.1"}
notes: |
  Multi-needle variant requiring retrieval of ALL four planted values before the
  correct minimum can be identified -- a partial scan that misses even one site
  can silently produce a wrong "lowest" answer.
