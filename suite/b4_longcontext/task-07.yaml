id: distractor-01
kind: distractor
filler_template: |
  Physical security log -- badge reader firmware current across all monitored
  entrances. No tailgating events flagged by the video analytics platform this
  cycle. Visitor log reconciliation completed on schedule.
needles:
  - depth_pct: 20
    text: >-
      BADGE ACCESS -- server-room override code for Site A (Riverside DC) is 4471.
  - depth_pct: 50
    text: >-
      BADGE ACCESS -- server-room override code for Site B (Lakeside DC) is 8823.
  - depth_pct: 80
    text: >-
      BADGE ACCESS -- server-room override code for Site C (Northgate DC) is 1190.
question: What is the server-room override code for Site B (Lakeside DC)?
signals:
  - {type: contains, value: "8823"}
  - {type: not_contains, value: "4471"}
  - {type: not_contains, value: "1190"}
notes: |
  Distractor-heavy NIAH -- three same-shape decoy facts differing only by site
  and code; the not_contains signals are advisory (a correct answer legitimately
  reasoning "not Site A's 4471" would flip that pass bit, so it is read as a
  soft signal, not a hard gate).
