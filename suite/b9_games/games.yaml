# B9 — one-shot browser game builds.
#
# The roster written into the v2.1 agentic-quality design and never implemented.
# Deliberately BARE one-line prompts: the point is what the model volunteers when
# it is not told what to build, which is where models separate. Every task demands
# a single self-contained HTML file so the artefact is directly playable and can be
# scored by driving it in a real browser (llmtest/harness/game_oracle.py).
#
# Scoring is deliberately split:
#   deterministic  loads / surface / paints / animates / keys_wired / input_safe
#                  -> objective, reproducible, catches crash-on-load and
#                     crash-on-input, which are the failures a source read misses
#   human          gameplay quality, feature depth, bug count
#                  -> graded in the explorer against the screenshot + playable file,
#                     because a browser cannot tell "the snake advanced" from
#                     "a particle blinked" (validated: a frozen snake with an
#                     animated particle layer changes MORE of the board than a
#                     working one)
version: 1.0.0
output_contract: |
  Reply with ONE complete HTML file and nothing else: no explanation, no markdown
  fence, no commentary. It must be fully self-contained (inline CSS and JS, no
  external files, no CDN, no network) and must run by opening the file directly in
  a browser. Keyboard controls must work without clicking anything first.
tasks:
  - id: snake
    title: Snake
    prompt: Write a complete Snake game as a single self-contained HTML file.
    keys: [ArrowUp, ArrowRight, ArrowDown, ArrowLeft]
    expect_features: [grid or canvas board, food spawning, growth on eat, self/wall collision, score]

  - id: tetris
    title: Tetris
    prompt: Write a complete Tetris game as a single self-contained HTML file.
    keys: [ArrowLeft, ArrowRight, ArrowDown, ArrowUp, Space]
    expect_features: [7 tetrominoes, rotation, line clear, gravity/drop, next piece, game over]

  - id: arkanoid
    title: Arkanoid / Breakout
    prompt: Write a complete Arkanoid (breakout) game as a single self-contained HTML file.
    keys: [ArrowLeft, ArrowRight, Space]
    expect_features: [paddle, ball physics, brick grid, brick destruction, lives or score]

  - id: flappy
    title: Flappy Bird
    prompt: Write a complete Flappy Bird game as a single self-contained HTML file.
    keys: [Space, ArrowUp]
    expect_features: [gravity, flap impulse, scrolling pipes, gap collision, score]

  - id: doodle
    title: Doodle Jump
    prompt: Write a complete Doodle Jump style game with procedurally generated platforms as a single self-contained HTML file.
    keys: [ArrowLeft, ArrowRight]
    expect_features: [procedural platforms, bounce on landing, upward camera scroll, fall = game over]

  - id: asteroids
    title: Asteroids
    prompt: Write a complete Asteroids game with a procedurally generated field and rocks that split when shot, as a single self-contained HTML file.
    keys: [ArrowUp, ArrowLeft, ArrowRight, Space]
    expect_features: [ship thrust and rotation, inertia, screen wrap, shooting, rocks split]

  - id: roguelike
    title: Tiny roguelike
    prompt: Write a tiny roguelike with a procedurally generated dungeon as a single self-contained HTML file. ASCII rendering on a grid is fine.
    keys: [ArrowUp, ArrowRight, ArrowDown, ArrowLeft]
    expect_features: [procedural dungeon, walls block movement, player moves on grid, enemies or items]

  - id: flightsim
    title: fly.pieter-style 3D flight sim
    prompt: |
      Write a fly.pieter.com style 3D browser flight simulator as a single
      self-contained HTML file: a plane you fly over a procedurally generated
      city of skyscrapers, using Three.js written inline (do not load anything
      from a CDN - implement the 3D yourself with WebGL or plain canvas if you
      cannot inline a library).
    keys: [ArrowUp, ArrowDown, ArrowLeft, ArrowRight, KeyW, KeyS]
    expect_features: [3D perspective, procedural city, flight controls, forward motion, horizon]
    notes: the flagship stress test - long-horizon, 3D maths, procedural generation
