<!DOCTYPE html>
<!-- B9 FIXTURE: authored known-good Snake. We own this code, so per TESTPLAN 5.6
     amendment 18 the FIXTURE profile may expose hooks (window.__game__). Model-authored
     one-shot builds stay black-box and never see this file.

     Deterministic by construction: seeded RNG and a fixed tick, so a probe gets the
     same board every run and an invariant that fails is a real regression, not luck.
     Bug variants are generated from this file by scripts/plant_game_bugs.py. -->
<html lang="en">
<head><meta charset="utf-8"><title>Snake (fixture)</title>
<style>
  body{margin:0;background:#0a0e14;color:#e8eef6;font-family:system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}
  canvas{background:#05080d;border:1px solid #243244;border-radius:6px}
  #hud{font-family:ui-monospace,Consolas,monospace;font-size:14px}
</style></head>
<body>
<div id="hud">score <span id="score">0</span> · len <span id="len">3</span></div>
<canvas id="c" width="400" height="400"></canvas>
<script>
(() => {
  const SIZE = 20, CELL = 20, TICK_MS = 150;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score'), lenEl = document.getElementById('len');

  // Seeded RNG: food placement is reproducible, so probes are deterministic.
  let seed = (window.__SEED__ === undefined) ? 12345 : window.__SEED__;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  let snake, dir, nextDir, food, score, alive, ticks;

  function reset() {
    snake = [{x: 3, y: 10}, {x: 2, y: 10}, {x: 1, y: 10}];
    dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
    score = 0; alive = true; ticks = 0;
    placeFood();
    publish();
  }
  function placeFood() {
    do { food = {x: Math.floor(rnd() * SIZE), y: Math.floor(rnd() * SIZE)}; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function publish() {
    window.__game__ = {score, length: snake.length, head: {...snake[0]},
                       food: {...food}, alive, ticks, size: SIZE, dir: {...dir}};
    scoreEl.textContent = score; lenEl.textContent = snake.length;
  }

  function step() {
    if (!alive) return;
    ticks++;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    // wall collision: a cell AT the boundary index is still on the board
    if (head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE) { alive = false; publish(); return; }
    if (snake.some(s => s.x === head.x && s.y === head.y)) { alive = false; publish(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score += 1; placeFood(); }
    else { snake.pop(); }
    publish();
  }

  function draw() {
    ctx.fillStyle = '#05080d'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#e05248';
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#7fe08a' : '#46b95a';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
    if (!alive) {
      ctx.fillStyle = 'rgba(10,14,20,.72)'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#e8eef6'; ctx.font = '20px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Game Over — press R', cv.width / 2, cv.height / 2);
    }
  }

  addEventListener('keydown', e => {
    const k = e.key;
    if ((k === 'ArrowUp' || k === 'w') && dir.y === 0) nextDir = {x: 0, y: -1};
    else if ((k === 'ArrowDown' || k === 's') && dir.y === 0) nextDir = {x: 0, y: 1};
    else if ((k === 'ArrowLeft' || k === 'a') && dir.x === 0) nextDir = {x: -1, y: 0};
    else if ((k === 'ArrowRight' || k === 'd') && dir.x === 0) nextDir = {x: 1, y: 0};
    else if (k === 'r' || k === 'R') reset();
  });

  reset();
  setInterval(() => { step(); draw(); }, TICK_MS);
  draw();
})();
</script>
</body>
</html>
