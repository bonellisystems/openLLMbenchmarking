<!-- planted-bug fixture: do not ship as a known-good -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #0a0a1a;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
overflow: hidden;
}

.game-wrapper {
display: flex;
flex-direction: column;
align-items: center;
gap: 16px;
}

.header {
display: flex;
justify-content: space-between;
align-items: center;
width: 600px;
padding: 0 4px;
}

.title {
font-size: 28px;
font-weight: 800;
color: #00ff88;
text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
letter-spacing: 2px;
}

.scores {
display: flex;
gap: 24px;
}

.score-item {
text-align: center;
}

.score-label {
font-size: 11px;
color: #666;
text-transform: uppercase;
letter-spacing: 2px;
margin-bottom: 2px;
}

.score-value {
font-size: 24px;
font-weight: 700;
color: #fff;
font-variant-numeric: tabular-nums;
}

.score-value.high {
color: #ffcc00;
}

canvas {
border: 2px solid #1a1a3a;
border-radius: 8px;
box-shadow: 0 0 40px rgba(0, 255, 136, 0.08), inset 0 0 40px rgba(0, 0, 0, 0.5);
background: #0d0d22;
display: block;
}

.controls-hint {
display: flex;
gap: 24px;
align-items: center;
}

.key-hint {
display: flex;
align-items: center;
gap: 6px;
color: #555;
font-size: 13px;
}

.kbd {
background: #1a1a3a;
border: 1px solid #333;
border-radius: 4px;
padding: 2px 8px;
font-size: 12px;
color: #888;
font-family: inherit;
}

.overlay {
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(10, 10, 26, 0.85);
backdrop-filter: blur(4px);
border-radius: 8px;
z-index: 10;
transition: opacity 0.3s;
}

.overlay.hidden {
opacity: 0;
pointer-events: none;
}

.overlay-title {
font-size: 42px;
font-weight: 800;
color: #00ff88;
text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
margin-bottom: 8px;
}

.overlay-title.gameover {
color: #ff4466;
text-shadow: 0 0 30px rgba(255, 68, 102, 0.5);
}

.overlay-subtitle {
color: #888;
font-size: 16px;
margin-bottom: 32px;
}

.overlay-score {
font-size: 18px;
color: #ccc;
margin-bottom: 8px;
}

.overlay-score span {
color: #00ff88;
font-weight: 700;
}

.btn {
background: linear-gradient(135deg, #00ff88, #00cc66);
color: #0a0a1a;
border: none;
padding: 12px 36px;
font-size: 16px;
font-weight: 700;
border-radius: 6px;
cursor: pointer;
letter-spacing: 1px;
text-transform: uppercase;
transition: all 0.2s;
box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
}

.btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 28px rgba(0, 255, 136, 0.5);
}

.btn:active {
transform: translateY(0);
}

.mobile-controls {
display: none;
gap: 6px;
margin-top: 8px;
}

.d-pad {
display: grid;
grid-template-columns: 60px 60px 60px;
grid-template-rows: 60px 60px;
gap: 4px;
}

.d-btn {
background: #1a1a3a;
border: 1px solid #333;
border-radius: 10px;
color: #666;
font-size: 22px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
user-select: none;
-webkit-user-select: none;
transition: all 0.1s;
}

.d-btn:active {
background: #00ff88;
color: #0a0a1a;
border-color: #00ff88;
}

.d-btn.empty {
visibility: hidden;
}

@media (hover: none) and (pointer: coarse) {
.mobile-controls { display: flex; }
.controls-hint { display: none; }
}

@media (max-width: 640px) {
.header { width: 90vw; }
canvas { width: 90vw; height: auto; }
.title { font-size: 20px; }
}
</style>
</head>
<body>

<div class="game-wrapper">
<div class="header">
<div class="title">🐍 SNAKE</div>
<div class="scores">
<div class="score-item">
<div class="score-label">Score</div>
<div class="score-value" id="score">0</div>
</div>
<div class="score-item">
<div class="score-label">Best</div>
<div class="score-value high" id="highScore">0</div>
</div>
</div>
</div>

<div style="position: relative;">
<canvas id="game" width="600" height="600"></canvas>

<div class="overlay" id="startOverlay">
<div class="overlay-title">🐍 SNAKE</div>
<div class="overlay-subtitle">Eat food. Grow. Don't crash.</div>
<button class="btn" id="startBtn">Start Game</button>
</div>

<div class="overlay hidden" id="gameOverOverlay">
<div class="overlay-title gameover">Game Over</div>
<div class="overlay-subtitle">Better luck next time!</div>
<div class="overlay-score">Score: <span id="finalScore">0</span></div>
<button class="btn" id="restartBtn">Play Again</button>
</div>
</div>

<div class="controls-hint">
<div class="key-hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
</div>

<div class="mobile-controls">
<div class="d-pad">
<div class="d-btn empty"></div>
<div class="d-btn" data-dir="up">▲</div>
<div class="d-btn empty"></div>
<div class="d-btn" data-dir="left">◀</div>
<div class="d-btn empty"></div>
<div class="d-btn" data-dir="right">▶</div>
<div class="d-btn empty"></div>
<div class="d-btn" data-dir="down">▼</div>
<div class="d-btn empty"></div>
</div>
</div>
</div>

<script>
const __cfg = __GAME_SETTINGS__.initial;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = { x: 0, y: 0 };
let score = 0;
let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
let gameState = 'start'; // start, playing, gameover
let gameSpeed = 120;
let lastTime = 0;
let accumulator = 0;
let particles = [];
let shakeTimer = 0;
let shakeIntensity = 0;

document.getElementById('highScore').textContent = highScore;

function initGame() {
const startX = Math.floor(COLS / 3);
const startY = Math.floor(ROWS / 2);
snake = [
{ x: startX, y: startY },
{ x: startX - 1, y: startY },
{ x: startX - 2, y: startY }
];
direction = { x: 1, y: 0 };
nextDirection = { x: 1, y: 0 };
score = 0;
gameSpeed = 120;
particles = [];
shakeTimer = 0;
document.getElementById('score').textContent = '0';
spawnFood();
}

function spawnFood() {
let valid = false;
while (!valid) {
food.x = Math.floor(Math.random() * COLS);
food.y = Math.floor(Math.random() * ROWS);
valid = !snake.some(s => s.x === food.x && s.y === food.y);
}
}

function spawnParticles(x, y, color, count = 12) {
for (let i = 0; i < count; i++) {
const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
const speed = 1 + Math.random() * 3;
particles.push({
x: x * GRID + GRID / 2,
y: y * GRID + GRID / 2,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed,
life: 1,
decay: 0.02 + Math.random() * 0.03,
size: 2 + Math.random() * 3,
color: color
});
}
}

function update(dt) {
accumulator += dt;
if (accumulator >= gameSpeed) {
accumulator -= gameSpeed;
updateGame();
}
updateParticles(dt);
if (shakeTimer > 0) shakeTimer -= dt;
}

function updateGame() {
direction = { ...nextDirection };
const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

// Wall collision
if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
endGame();
return;
}

// Self collision
if (snake.some(s => s.x === head.x && s.y === head.y)) {
endGame();
return;
}

snake.unshift(head);

// Check food
if (head.x === food.x && head.y === food.y) {
score++;
document.getElementById('score').textContent = score;
if (score > highScore) {
highScore = score;
localStorage.setItem('snakeHighScore', highScore);
document.getElementById('highScore').textContent = highScore;
}
// Speed up slightly
gameSpeed = Math.max(55, 120 - score * 2);
spawnFood();
spawnParticles(food.x, food.y, '#ff4466', 16);
} else {
snake.pop();
}
}

function updateParticles(dt) {
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx;
p.y += p.vy;
p.vx *= 0.96;
p.vy *= 0.96;
p.life -= p.decay;
if (p.life <= 0) particles.splice(i, 1);
}
}

function endGame() {
gameState = 'gameover';
document.getElementById('finalScore').textContent = score;
document.getElementById('gameOverOverlay').classList.remove('hidden');
shakeTimer = 300;
shakeIntensity = 8;
spawnParticles(snake[0].x, snake[0].y, '#00ff88', 20);
}

function draw() {
// Screen shake
let shakeX = 0, shakeY = 0;
if (shakeTimer > 0) {
shakeX = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 300);
shakeY = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 300);
}

ctx.save();
ctx.translate(shakeX, shakeY);

// Background
ctx.fillStyle = '#0d0d22';
ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

// Grid (subtle)
ctx.strokeStyle = 'rgba(255,255,255,0.02)';
ctx.lineWidth = 1;
for (let x = 0; x <= COLS; x++) {
ctx.beginPath();
ctx.moveTo(x * GRID, 0);
ctx.lineTo(x * GRID, canvas.height);
ctx.stroke();
}
for (let y = 0; y <= ROWS; y++) {
ctx.beginPath();
ctx.moveTo(0, y * GRID);
ctx.lineTo(canvas.width, y * GRID);
ctx.stroke();
}

// Food with pulse
const pulse = 0.8 + Math.sin(Date.now() / 200) * 0.2;
const foodSize = GRID * 0.6 * pulse;
const foodX = food.x * GRID + GRID / 2;
const foodY = food.y * GRID + GRID / 2;

// Food glow
const glow = ctx.createRadialGradient(foodX, foodY, 0, foodX, foodY, GRID);
glow.addColorStop(0, 'rgba(255, 68, 102, 0.3)');
glow.addColorStop(1, 'rgba(255, 68, 102, 0)');
ctx.fillStyle = glow;
ctx.beginPath();
ctx.arc(foodX, foodY, GRID, 0, Math.PI * 2);
ctx.fill();

// Food body
ctx.fillStyle = '#ff4466';
ctx.shadowColor = '#ff4466';
ctx.shadowBlur = 12;
ctx.beginPath();
ctx.arc(foodX, foodY, foodSize / 2, 0, Math.PI * 2);
ctx.fill();
ctx.shadowBlur = 0;

// Snake
snake.forEach((segment, index) => {
const isHead = index === 0;
const x = segment.x * GRID;
const y = segment.y * GRID;
const size = GRID - 2;

if (isHead) {
ctx.fillStyle = '#00ff88';
ctx.shadowColor = '#00ff88';
ctx.shadowBlur = 15;
} else {
const t = 1 - index / snake.length;
const r = Math.floor(0 + t * 0);
const g = Math.floor(200 + t * 55);
const b = Math.floor(100 + t * 36);
ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
ctx.shadowBlur = 0;
}

ctx.fillRect(x + 1, y + 1, size, size);

// Head eyes
if (isHead) {
ctx.shadowBlur = 0;
const eyeSize = 3;
const eyeOffset = 4;
let ex1, ey1, ex2, ey2;

if (direction.x === 1) { // right
ex1 = x + GRID - eyeOffset; ey1 = y + eyeOffset;
ex2 = x + GRID - eyeOffset; ey2 = y + GRID - eyeOffset;
} else if (direction.x === -1) { // left
ex1 = x + eyeOffset; ey1 = y + eyeOffset;
ex2 = x + eyeOffset; ey2 = y + GRID - eyeOffset;
} else if (direction.y === -1) { // up
ex1 = x + eyeOffset; ey1 = y + eyeOffset;
ex2 = x + GRID - eyeOffset; ey2 = y + eyeOffset;
} else { // down
ex1 = x + eyeOffset; ey1 = y + GRID - eyeOffset;
ex2 = x + GRID - eyeOffset; ey2 = y + GRID - eyeOffset;
}

ctx.fillStyle = '#0a0a1a';
ctx.beginPath();
ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
ctx.fill();

// Pupils
ctx.fillStyle = '#00ff88';
const pupilOffset = 1;
if (direction.x === 1) {
ctx.beginPath(); ctx.arc(ex1 + 1, ey1, 1.5, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.arc(ex2 + 1, ey2, 1.5, 0, Math.PI * 2); ctx.fill();
} else if (direction.x === -1) {
ctx.beginPath(); ctx.arc(ex1 - 1, ey1, 1.5, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.arc(ex2 - 1, ey2, 1.5, 0, Math.PI * 2); ctx.fill();
} else if (direction.y === -1) {
ctx.beginPath(); ctx.arc(ex1, ey1 - 1, 1.5, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.arc(ex2, ey2 - 1, 1.5, 0, Math.PI * 2); ctx.fill();
} else {
ctx.beginPath(); ctx.arc(ex1, ey1 + 1, 1.5, 0, Math.PI * 2); ctx.fill();
ctx.beginPath(); ctx.arc(ex2, ey2 + 1, 1.5, 0, Math.PI * 2); ctx.fill();
}
}
});

// Particles
particles.forEach(p => {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.shadowColor = p.color;
ctx.shadowBlur = 4;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
ctx.fill();
ctx.shadowBlur = 0;
ctx.globalAlpha = 1;
});

ctx.restore();
}

function gameLoop(timestamp) {
if (!lastTime) lastTime = timestamp;
const dt = timestamp - lastTime;
lastTime = timestamp;

if (gameState === 'playing') {
update(dt);
}

draw();
requestAnimationFrame(gameLoop);
}

// Input handling
document.addEventListener('keydown', (e) => {
const key = e.key;
if (gameState !== 'playing') return;

switch(key) {
case 'ArrowUp': case 'w': case 'W':
if (direction.y === 0) nextDirection = { x: 0, y: -1 };
break;
case 'ArrowDown': case 's': case 'S':
if (direction.y === 0) nextDirection = { x: 0, y: 1 };
break;
case 'ArrowLeft': case 'a': case 'A':
if (direction.x === 0) nextDirection = { x: -1, y: 0 };
break;
case 'ArrowRight': case 'd': case 'D':
if (direction.x === 0) nextDirection = { x: 1, y: 0 };
break;
}
e.preventDefault();
});

// Mobile D-pad
document.querySelectorAll('.d-btn[data-dir]').forEach(btn => {
btn.addEventListener('touchstart', (e) => {
e.preventDefault();
if (gameState !== 'playing') return;
const dir = btn.dataset.dir;
if (dir === 'up' && direction.y === 0) nextDirection = { x: 0, y: -1 };
if (dir === 'down' && direction.y === 0) nextDirection = { x: 0, y: 1 };
if (dir === 'left' && direction.x === 0) nextDirection = { x: -1, y: 0 };
if (dir === 'right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
});
});

// Buttons
document.getElementById('startBtn').addEventListener('click', () => {
document.getElementById('startOverlay').classList.add('hidden');
initGame();
gameState = 'playing';
});

document.getElementById('restartBtn').addEventListener('click', () => {
document.getElementById('gameOverOverlay').classList.add('hidden');
initGame();
gameState = 'playing';
});

// Start the loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
