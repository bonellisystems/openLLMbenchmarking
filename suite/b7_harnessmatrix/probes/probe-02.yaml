id: probe-02
prompt: |
  A client, account ID ACC-48213, is asking for the current status of their
  support ticket TCK-9027. Look up the ticket status before replying to them,
  then summarize it for the client in one short sentence.
expects_tool_call: true
tool_schema:
  type: function
  function:
    name: get_ticket_status
    description: Look up the current status of a support ticket by ID.
    parameters:
      type: object
      properties:
        ticket_id: {type: string, description: "The ticket ID, e.g. TCK-9027"}
      required: [ticket_id]
expected_tool_name: get_ticket_status
signals:
  - {type: regex, value: "(?i)TCK-9027", weight: critical}
response_format: text
notes: |
  Probe 02 -- tool-heavy probe. Exercises the toolfmt dimension: baseline
  cell uses native `tools` API, toolfmt=prompted cell embeds the schema as
  text and expects a `TOOL_CALL: get_ticket_status(...)` marker line instead.
