id: probe-01
prompt: |
  A client's helpdesk ticket reads: "Outlook won't sync new emails since this
  morning; error code 0x8004010F appears when sending." Write a first-response
  triage message to the client that (a) names the likely root cause category
  (a corrupted OST file / offline data file issue), (b) gives one immediate
  self-serve step (restart Outlook in safe mode, or repair the data file), and
  (c) sets an expectation for follow-up within 4 business hours.
signals:
  - {type: contains, value: "0x8004010F", weight: critical}
  - {type: regex, value: "(?i)\\b(OST|offline data file)\\b", weight: evidence}
  - {type: regex, value: "(?i)\\b4\\s*(business\\s*)?hours?\\b", weight: evidence}
response_format: text
notes: |
  Probe 01 -- general text-answer probe (helpdesk triage). Baseline for
  measuring whether content signals survive the matrix's config variants.
