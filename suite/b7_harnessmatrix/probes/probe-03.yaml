id: probe-03
prompt: |
  Extend the following Python function so it also caps any single line item
  at $10,000 (return the capped value), while leaving all other behavior
  unchanged:

  def apply_discount(amount, pct):
      return amount * (1 - pct / 100)

  Show the complete updated function.
signals:
  - {type: contains, value: "def apply_discount", weight: critical}
  - {type: regex, value: "\\b10000\\b|\\$10,000\\b", weight: evidence}
  - {type: regex, value: "(?i)\\bmin\\(", weight: note}
response_format: text
notes: |
  Probe 03 -- small code-edit probe (mirrors B1 coding-style tasks). Tests
  whether a precise-spec coding answer degrades under the config matrix.
