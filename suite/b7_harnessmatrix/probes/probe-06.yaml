id: probe-06
prompt: |
  List exactly 3 best practices for patch management at an MSP. Respond with
  exactly 3 bullet points, each starting with "- ", and nothing else (no
  introduction or closing sentence).
signals:
  - {type: regex, value: "(?m)^- .+$", weight: evidence}
  - {type: regex, value: "(?i)\\bpatch", weight: evidence}
response_format: text
notes: |
  Probe 06 -- strict-instruction-following probe. Deliberately format-
  sensitive: a good place to see sysp/temp drift show up in
  word_jaccard_vs_baseline / length_ratio_vs_baseline even when content
  signals still pass.
