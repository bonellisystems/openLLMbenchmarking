id: probe-08
prompt: |
  A backup job ran nightly for 30 days. It succeeded on 27 nights and failed
  on 3 nights. State the success rate as a percentage (one decimal place) and
  recommend whether this meets a 95% SLA target.
signals:
  - {type: numeric, value: 90.0, tolerance: 0.02, weight: critical}
  - {type: regex, value: "(?i)\\b(does not meet|fails to meet|below|under)\\b.*95", weight: evidence}
response_format: text
notes: |
  Probe 08 -- small reasoning/summarization probe. 27/30 = 90.0%.
