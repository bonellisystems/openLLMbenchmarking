id: probe-04
prompt: |
  Produce a JSON object (and nothing else) summarizing today's on-call queue
  with exactly these keys: "open_tickets" (integer), "sla_breaches"
  (integer), "on_call_engineer" (string). Use these values: 14 open tickets,
  2 SLA breaches, on-call engineer "J. Alvarez".
signals:
  - {type: contains, value: "on_call_engineer", weight: critical}
  - {type: numeric, value: 14, tolerance: 0.01, weight: evidence}
  - {type: numeric, value: 2, tolerance: 0.01, weight: evidence}
response_format: json
notes: |
  Probe 04 -- structured-output probe. response_format=json drives the
  `format_json` det_check (parses either the whole response or a fenced
  ```json block as JSON).
