id: probe-05
prompt: |
  A client wants to migrate 46 workstations to a new endpoint management
  platform at $85 per workstation for licensing plus a flat $1,200 setup fee.
  Calculate the total first-year cost and state it clearly.
signals:
  - {type: numeric, value: 5110, tolerance: 0.01, weight: critical}
response_format: text
notes: |
  Probe 05 -- arithmetic/estimate probe. 46*85=3910, +1200=5110.
