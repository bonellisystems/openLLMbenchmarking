id: probe-07
prompt: |
  Draft a two-sentence status update to a client explaining that their
  firewall firmware upgrade (Fortinet FortiGate, version 8.4.2) completed
  successfully overnight with zero downtime.
signals:
  - {type: contains, value: "FortiGate", weight: critical}
  - {type: contains, value: "8.4.2", weight: critical}
  - {type: regex, value: "(?i)zero\\s*downtime|no\\s*downtime", weight: evidence}
response_format: text
notes: |
  Probe 07 -- persona-sensitivity probe. Purpose-built for the sysp
  dimension: the default vs minimal system prompt should change TONE, but
  the three facts (product, version, zero-downtime) must survive either way
  -- a sysp cell that drops these facts is a real sensitivity finding, not
  noise.
