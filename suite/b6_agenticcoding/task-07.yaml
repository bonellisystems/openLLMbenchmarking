id: bugfix-02
track: bugfix
language: python
difficulty: medium
buggy_code: |
  def running_totals(nums):
      totals = []
      running = 0
      for i in range(len(nums) - 1):
          running += nums[i]
          totals.append(running)
      return totals
symptom: |
  For input [10, 20, 30], running_totals should return [10, 30, 60] (a running
  sum after each element) but it actually returns [10, 30] -- the last element
  is silently dropped from the output.
prompt: |
  The following Python function is supposed to return a list of running totals
  (the cumulative sum after including each element in order). Symptom: for
  input [10, 20, 30], it should return [10, 30, 60] but it actually returns
  [10, 30] -- the last element is silently dropped from the output.

  ```python
  def running_totals(nums):
      totals = []
      running = 0
      for i in range(len(nums) - 1):
          running += nums[i]
          totals.append(running)
      return totals
  ```

  Find the bug and return the complete corrected function inside a single
  fenced Python code block (```python ... ```) and nothing else outside the
  block.
required_signals:
  - {type: contains, value: "def running_totals("}
fix_signals:
  - {type: regex, value: "range\\(\\s*len\\(\\s*nums\\s*\\)\\s*\\)"}
regression_signals:
  - {type: absent, value: "range(len(nums) - 1)"}
notes: |
  Bugfix Task 02 -- logic/off-by-one tier. Root cause: `range(len(nums) - 1)`
  excludes the final index, so the loop never processes the last element.
  fix_signals looks for the corrected range(len(nums)) call; regression_signals
  flags a no-op patch that leaves the off-by-one range untouched.
