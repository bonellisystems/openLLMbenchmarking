id: scratch-01
track: scratch
language: python
difficulty: easy
prompt: |
  Write a Python function `is_prime(n: int) -> bool` that returns True if n is a
  prime number and False otherwise (n may be any non-negative integer, including
  0 and 1). Return your complete solution inside a single fenced Python code block
  (```python ... ```) and nothing else outside the block.
required_signals:
  - {type: regex, value: "def\\s+is_prime\\s*\\("}
  - {type: contains, value: "return"}
notes: |
  Scratch Task 01 -- from-scratch function implementation (easy). Deterministic
  scoring checks the function signature exists and the code has at least one
  return statement; compile() enforces valid syntax. Judge axis covers whether
  the primality logic is actually correct (deterministic checks cannot verify
  runtime behavior without executing untrusted code).
