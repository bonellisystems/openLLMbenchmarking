id: scratch-03
track: scratch
language: bash
difficulty: easy
prompt: |
  Write a Bash script `backup.sh` that takes a directory path as its first
  argument ($1), creates a timestamped .tar.gz archive of that directory in
  /tmp (the timestamp must be part of the archive filename), and prints the
  full path of the created archive to stdout. Return your complete solution
  inside a single fenced Bash code block (```bash ... ```) and nothing else
  outside the block.
required_signals:
  - {type: regex, value: "(?i)tar\\s+-?c[a-z]*f"}
  - {type: contains, value: "$1"}
  - {type: regex, value: "date"}
notes: |
  Scratch Task 03 -- from-scratch shell CLI (easy). Checks for tar invocation,
  use of the first positional arg, and a timestamp source. No compile() check
  is available for bash (python-only per B6 design); correctness is a judged
  axis plus these signal checks.
