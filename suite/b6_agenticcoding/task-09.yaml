id: bugfix-04
track: bugfix
language: bash
difficulty: hard
buggy_code: |
  #!/bin/bash
  # Deletes files older than N days from a directory
  DIR=$1
  DAYS=$2
  find "$DIR" -type f -mtime $DAYS -delete
symptom: |
  The script is supposed to delete files OLDER THAN N days. Running it with
  DAYS=30 against a directory full of 90-day-old files deletes almost
  nothing -- only files whose modification time is exactly 30 days old (give
  or take a day) get removed; the 90-day-old files are left untouched.
prompt: |
  The following Bash script is supposed to delete files older than N days
  from a directory. Symptom: running it with DAYS=30 against a directory full
  of 90-day-old files deletes almost nothing -- only files whose modification
  time is exactly 30 days old (give or take a day) get removed; the 90-day-old
  files are left untouched.

  ```bash
  #!/bin/bash
  # Deletes files older than N days from a directory
  DIR=$1
  DAYS=$2
  find "$DIR" -type f -mtime $DAYS -delete
  ```

  Find the bug and return the complete corrected script inside a single
  fenced Bash code block (```bash ... ```) and nothing else outside the block.
required_signals:
  - {type: contains, value: "find"}
  - {type: contains, value: "-delete"}
fix_signals:
  - {type: regex, value: "-mtime\\s+\\+\\$DAYS"}
regression_signals:
  - {type: absent, value: "-mtime $DAYS"}
notes: |
  Bugfix Task 04 -- logic tier (silent, no error output). Root cause: `-mtime
  $DAYS` matches files whose mtime falls in the single 24h bucket exactly
  DAYS days ago; `find` needs the `+` prefix (`-mtime +$DAYS`) to mean
  "older than". fix_signals requires the +$DAYS form; regression_signals
  flags a no-op patch that leaves the unprefixed form untouched.
