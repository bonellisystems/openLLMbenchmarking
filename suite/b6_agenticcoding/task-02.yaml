id: scratch-02
track: scratch
language: python
difficulty: medium
prompt: |
  Write a self-contained Python CLI script that reads text from standard input,
  then prints the total word count on the first line and the 5 most frequent
  words (word and count, one per line, most frequent first) on the following
  lines. Words should be compared case-insensitively. The script must be
  runnable as `python wordcount.py < input.txt`. Return your complete solution
  inside a single fenced Python code block (```python ... ```) and nothing else
  outside the block.
required_signals:
  - {type: regex, value: "(?i)sys\\.stdin"}
  - {type: regex, value: "if\\s+__name__\\s*==\\s*['\"]__main__['\"]"}
  - {type: contains, value: "def "}
notes: |
  Scratch Task 02 -- from-scratch CLI tool (medium). Checks for stdin reading
  and a __main__ guard (the "is it actually a runnable CLI" signal) plus at
  least one function definition. Correctness of the top-5 frequency logic is a
  judged axis.
