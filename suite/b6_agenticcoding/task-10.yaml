id: bugfix-05
track: bugfix
language: sql
difficulty: medium
buggy_code: |
  SELECT c.id, c.name
  FROM customers c
  LEFT JOIN orders o ON c.id = o.customer_id
  WHERE o.customer_id = c.id;
symptom: |
  This query is supposed to list customers who have NEVER placed an order.
  Instead it returns customers who HAVE placed orders -- the opposite of the
  intended result.
prompt: |
  The following SQL query (SQLite dialect) is supposed to list customers who
  have NEVER placed an order, using a LEFT JOIN against an `orders` table.
  Symptom: instead it returns customers who HAVE placed orders -- the
  opposite of the intended result.

  ```sql
  SELECT c.id, c.name
  FROM customers c
  LEFT JOIN orders o ON c.id = o.customer_id
  WHERE o.customer_id = c.id;
  ```

  Find the bug and return the complete corrected query inside a single fenced
  SQL code block (```sql ... ```) and nothing else outside the block.
required_signals:
  - {type: regex, value: "(?i)left\\s+join"}
fix_signals:
  - {type: regex, value: "(?i)where\\s+o\\.customer_id\\s+is\\s+null"}
regression_signals:
  - {type: absent, value: "WHERE o.customer_id = c.id"}
notes: |
  Bugfix Task 05 -- logic tier. Root cause: the WHERE clause re-filters out
  the LEFT JOIN's NULL rows (`o.customer_id = c.id` can never be true for the
  unmatched rows the LEFT JOIN produces), silently turning it back into an
  INNER JOIN. fix_signals requires the `WHERE o.customer_id IS NULL` idiom;
  regression_signals flags a no-op patch that leaves the self-defeating
  equality filter untouched.
