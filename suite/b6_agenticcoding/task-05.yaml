id: scratch-05
track: scratch
language: sql
difficulty: medium
prompt: |
  Given a table `orders(id INTEGER, customer_id INTEGER, amount NUMERIC,
  created_at DATE)`, write a single SQL query (SQLite dialect) that returns
  each customer's total spend for orders placed in the last 30 days (relative
  to the current date), with columns `customer_id` and `total_spent`, sorted
  by `total_spent` descending. Return your complete solution inside a single
  fenced SQL code block (```sql ... ```) and nothing else outside the block.
required_signals:
  - {type: regex, value: "(?i)sum\\s*\\("}
  - {type: regex, value: "(?i)group\\s+by"}
  - {type: regex, value: "(?i)order\\s+by"}
notes: |
  Scratch Task 05 -- from-scratch aggregate query (medium). Checks for SUM,
  GROUP BY, and ORDER BY presence -- the structural skeleton of the required
  aggregation. Correct date-window filtering and DESC ordering are judged axes
  (deterministic regex on direction is intentionally omitted since dialect
  varies, e.g. julianday() vs date() vs strftime()).
