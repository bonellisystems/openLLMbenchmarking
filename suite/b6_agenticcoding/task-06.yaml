id: bugfix-01
track: bugfix
language: python
difficulty: easy
buggy_code: |
  def average(nums):
      total = sum(nums)
      return total / len(nums)

  def summarize(nums)
      avg = average(nums)
      return f"summary: avg={avg:.2f}"
symptom: |
  Running this script immediately raises `SyntaxError: expected ':'` before any
  output is produced -- the program never even starts.
prompt: |
  The following Python file is supposed to compute and print a summary of a
  list of numbers, but it is broken. Symptom: running it immediately raises
  `SyntaxError: expected ':'` before any output is produced -- the program
  never even starts.

  ```python
  def average(nums):
      total = sum(nums)
      return total / len(nums)

  def summarize(nums)
      avg = average(nums)
      return f"summary: avg={avg:.2f}"
  ```

  Find the bug and return the complete corrected file inside a single fenced
  Python code block (```python ... ```) and nothing else outside the block.
required_signals:
  - {type: contains, value: "def average("}
  - {type: contains, value: "def summarize("}
fix_signals:
  - {type: regex, value: "def\\s+summarize\\s*\\(\\s*nums\\s*\\)\\s*:"}
regression_signals:
  - {type: absent, value: "def summarize(nums)\n"}
notes: |
  Bugfix Task 01 -- syntax/crash tier. Root cause: missing colon after the
  `summarize` function signature. compile() alone would catch this (compile_ok
  False pre-fix, True post-fix); fix_signals/regression_signals additionally
  pin the exact root-cause token so a model that "fixes" it by deleting the
  function entirely (still compiles) does not get credit.
