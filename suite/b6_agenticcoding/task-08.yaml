id: bugfix-03
track: bugfix
language: python
difficulty: hard
buggy_code: |
  def add_item(item, cart=[]):
      cart.append(item)
      return cart
symptom: |
  Two independent, unrelated calls in the same program -- `add_item("apple")`
  called on its own, followed later by `add_item("banana")` called on its own
  (neither call passes a cart argument) -- are supposed to each return a
  fresh single-item list. Instead the second call's result contains BOTH
  items: state is leaking between calls that share no explicit argument.
prompt: |
  The following Python function is supposed to add an item to a shopping cart
  and return the cart, defaulting to a fresh empty cart when none is given.
  Symptom: two independent, unrelated calls in the same program --
  `add_item("apple")` called on its own, followed later by `add_item("banana")`
  called on its own (neither call passes a cart argument) -- are supposed to
  each return a fresh single-item list. Instead the second call's result
  contains BOTH items: state is leaking between calls that share no explicit
  argument.

  ```python
  def add_item(item, cart=[]):
      cart.append(item)
      return cart
  ```

  Find the bug and return the complete corrected function inside a single
  fenced Python code block (```python ... ```) and nothing else outside the
  block.
required_signals:
  - {type: contains, value: "def add_item("}
fix_signals:
  - {type: regex, value: "cart\\s*=\\s*None"}
  - {type: regex, value: "if\\s+cart\\s+is\\s+None"}
regression_signals:
  - {type: absent, value: "def add_item(item, cart=[])"}
notes: |
  Bugfix Task 03 -- subtle/state-desync tier. Root cause: the classic Python
  mutable-default-argument pitfall -- `cart=[]` is evaluated ONCE at function
  definition time and shared across all calls that omit the argument.
  fix_signals require the standard `cart=None` + `if cart is None` idiom;
  regression_signals flags a no-op patch that leaves the mutable default
  untouched.
