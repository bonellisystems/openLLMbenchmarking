id: scratch-04
track: scratch
language: js
difficulty: easy
prompt: |
  Write a JavaScript function `debounce(fn, delayMs)` that returns a new
  function which, when called repeatedly, only invokes `fn` once after
  `delayMs` milliseconds have elapsed since the LAST call (standard debounce
  semantics), using setTimeout/clearTimeout. Return your complete solution
  inside a single fenced JavaScript code block (```javascript ... ```) and
  nothing else outside the block.
required_signals:
  - {type: regex, value: "function\\s+debounce\\s*\\(|const\\s+debounce\\s*="}
  - {type: contains, value: "setTimeout"}
  - {type: contains, value: "clearTimeout"}
notes: |
  Scratch Task 04 -- from-scratch utility function (easy). Checks the function
  is named debounce and uses both setTimeout and clearTimeout (the mechanism
  required for correct debounce semantics -- a common wrong-answer is a
  throttle that omits clearTimeout entirely).
