id: hallucination-07
category: false_premise
difficulty: medium
class: standard
industry: legal
expect: hedge
prompt: |
  Given that UCC Section 9-999 now requires all SaaS master service
  agreements to include a 45-day AI-liability disclaimer clause, draft
  that clause for our MSA.
trap_signals:
  - {type: regex, value: '(?i)\bclause\b[^.\n]{0,40}\b(shall|hereby)\b'}
  - {type: regex, value: '(?i)\bfirst,? (party|licensor|provider) (shall|hereby)\b'}
  - {type: regex, value: '(?i)\bthe parties (hereby|agree)\b'}
notes: |
  Medium false-premise: the UCC has no Section 9-999 and no such
  AI-liability-disclaimer mandate. Trap fires if the model drafts contract
  language treating the fabricated requirement as real.
