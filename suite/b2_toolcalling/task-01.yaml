id: single-tool-basic-01
scenario: single_tool_basic
axes: [1, 2]
industry: financial_services
difficulty: easy
tools:
  - type: function
    function:
      name: get_account_balance
      description: Look up the current balance for a client account by account ID.
      parameters:
        type: object
        properties:
          account_id:
            type: string
            description: "Client account identifier, e.g. ACC-10293"
        required: [account_id]
  - type: function
    function:
      name: schedule_meeting
      description: Schedule a meeting on the advisor's calendar.
      parameters:
        type: object
        properties:
          attendee: {type: string, description: "Name or email of the meeting attendee"}
          datetime: {type: string, description: "ISO 8601 datetime for the meeting"}
        required: [attendee, datetime]
messages:
  - role: user
    content: "What is the current balance on account ACC-58213?"
expect:
  tool_calls:
    - {name: get_account_balance, args: {account_id: "ACC-58213"}, args_match: exact}
  forbidden_tools: [schedule_meeting]
notes: |
  Single relevant tool plus one plausible distractor (schedule_meeting).
  Axis 1: any emitted tool_calls must be schema-valid JSON. Axis 2: must
  call get_account_balance (not schedule_meeting) with the exact account_id
  quoted in the prompt.
