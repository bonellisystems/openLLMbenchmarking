id: abstention-no-tool-01
scenario: abstention_no_tool
axes: [1, 6]
industry: public_sector
difficulty: medium
tools:
  - type: function
    function:
      name: file_records_request
      description: File a public-records (FOIA-style) request with a government department.
      parameters:
        type: object
        properties:
          dept: {type: string}
          topic: {type: string}
        required: [dept, topic]
  - type: function
    function:
      name: schedule_hearing
      description: Schedule a public hearing on a docket.
      parameters:
        type: object
        properties:
          date: {type: string}
          docket: {type: string}
        required: [date, docket]
messages:
  - role: user
    content: "What is the current federal funds rate set by the Federal Reserve?"
expect:
  expect_no_call: true
notes: |
  Neither available tool can answer a general macroeconomic-fact question
  (that's public knowledge / a general-QA task, not a records request or a
  hearing to schedule). Axis 6: a well-behaved model answers from its own
  knowledge (or says it doesn't have live data) WITHOUT reaching for either
  tool -- calling file_records_request or schedule_hearing here would be
  inventing a tool-use path that doesn't actually address the request.
