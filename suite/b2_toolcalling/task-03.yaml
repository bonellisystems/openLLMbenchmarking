id: nested-args-enum-01
scenario: nested_args_enum
axes: [1, 2]
industry: aec
difficulty: medium
tools:
  - type: function
    function:
      name: create_work_order
      description: Create a maintenance work order for a facility.
      parameters:
        type: object
        properties:
          site_code: {type: string, description: "Facility site code, e.g. DTC-04"}
          area_code: {type: string, description: "Area/zone code within the site"}
          priority:
            type: string
            enum: [low, medium, high, urgent]
            description: "Work order priority level"
          due_date: {type: string, description: "ISO 8601 date (YYYY-MM-DD)"}
          description: {type: string, description: "Free-text description of the issue"}
        required: [site_code, priority, description]
  - type: function
    function:
      name: close_work_order
      description: Close an existing work order by ID.
      parameters:
        type: object
        properties:
          work_order_id: {type: string}
        required: [work_order_id]
messages:
  - role: user
    content: >
      Create a high-priority work order for site DTC-04, area 3F-HVAC-2.
      Description: "HVAC unit blowing warm air, tenant complaints rising."
      Needs to be done by 2026-07-25.
expect:
  tool_calls:
    - name: create_work_order
      args: {site_code: "DTC-04", priority: "high", due_date: "2026-07-25"}
      args_match: subset
  forbidden_tools: [close_work_order]
notes: |
  Exercises nested/constrained argument correctness: priority must be the
  correct ENUM value ("high", not "urgent" or free text), due_date must be
  normalized to ISO 8601, and site_code must be threaded through verbatim.
  args_match=subset so an optional area_code/description the model adds
  isn't penalized -- only the required, checkable fields are graded.
