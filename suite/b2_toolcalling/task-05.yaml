id: chained-calls-01
scenario: chained_calls
axes: [1, 4]
industry: legal
difficulty: hard
tools:
  - type: function
    function:
      name: search_case_docket
      description: Look up docket information for a case by case number.
      parameters:
        type: object
        properties:
          case_number: {type: string}
        required: [case_number]
  - type: function
    function:
      name: file_motion
      description: File a motion on an existing docket.
      parameters:
        type: object
        properties:
          docket_id: {type: string, description: "Internal docket identifier (NOT the case number)"}
          motion_type:
            type: string
            enum: [continuance, dismissal, summary_judgment]
        required: [docket_id, motion_type]
messages:
  - role: user
    content: "Pull up docket info for case 24-CV-08871."
  - role: assistant
    content: null
    tool_calls:
      - id: call_1
        type: function
        function:
          name: search_case_docket
          arguments: '{"case_number": "24-CV-08871"}'
  - role: tool
    tool_call_id: call_1
    content: '{"docket_id": "DKT-778823", "status": "active", "next_hearing": "2026-08-14"}'
  - role: user
    content: "Great -- go ahead and file a continuance motion on that docket."
expect:
  chain_check: {arg_path: docket_id, expected_value: "DKT-778823"}
  tool_calls:
    - {name: file_motion, args: {docket_id: "DKT-778823", motion_type: "continuance"}, args_match: subset}
notes: |
  Axis 4: docket_id "DKT-778823" is INTERNAL, generated by the (simulated)
  first tool call and never mentioned anywhere in user-authored text --
  the only way file_motion's docket_id argument can be correct is if the
  model actually read the scripted tool result rather than reusing the
  case_number "24-CV-08871" it already had from the prompt (a plausible but
  wrong shortcut this fixture is specifically designed to catch).
