id: long-context-call-01
scenario: long_context_call
axes: [1, 7]
industry: life_sciences
difficulty: hard
tools:
  - type: function
    function:
      name: check_inventory_level
      description: Check current on-hand inventory for a SKU at a specific warehouse.
      parameters:
        type: object
        properties:
          sku: {type: string}
          warehouse: {type: string, description: "Warehouse city/site name"}
        required: [sku, warehouse]
  - type: function
    function:
      name: create_shipment
      description: Create an outbound shipment record.
      parameters:
        type: object
        properties:
          sku: {type: string}
          quantity: {type: integer}
          warehouse: {type: string}
        required: [sku, quantity, warehouse]
messages:
  - role: user
    content: "{{FILLER}}"
  - role: assistant
    content: "Acknowledged -- shift log entries noted. Anything else before I file the report?"
  - role: user
    content: >
      Given everything discussed above, please check current inventory
      levels for SKU AER-4471 at the Houston warehouse.
filler:
  unit_paragraph: >
    Shift log entry: Houston distribution center ambient cold-chain temp
    nominal at 4.1C, forklift unit 4 flagged for scheduled maintenance next
    Tuesday, pallet count reconciled for aisle 12 with zero discrepancies,
    incoming shipment ETA delayed 2 hours due to weather, dock door 3 sensor
    recalibrated, night-shift headcount at full staffing.
  target_tokens: 33000
expect:
  tool_calls:
    - {name: check_inventory_level, args: {sku: "AER-4471", warehouse: "Houston"}, args_match: exact}
  forbidden_tools: [create_shipment]
notes: |
  Axis 7: the actual ask is buried after ~33k tokens (target) of repetitive
  but plausible filler history. Tests whether the model still emits a
  correctly-formed, correctly-selected tool call once the request finally
  arrives, rather than losing the thread or timing out into a non-tool
  response. b2.ctx (config/suite.yaml) is sized to 40960 specifically so
  this task's filler + prompt + response all fit in one context window.
