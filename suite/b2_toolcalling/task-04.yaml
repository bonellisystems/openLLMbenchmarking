id: parallel-calls-01
scenario: parallel_calls
axes: [1, 3]
industry: generic_smb
difficulty: medium
tools:
  - type: function
    function:
      name: check_stock_level
      description: Check the current on-hand stock level for a SKU.
      parameters:
        type: object
        properties:
          sku: {type: string, description: "Stock keeping unit identifier"}
        required: [sku]
  - type: function
    function:
      name: create_purchase_order
      description: Create a purchase order to reorder stock.
      parameters:
        type: object
        properties:
          sku: {type: string}
          quantity: {type: integer}
        required: [sku, quantity]
messages:
  - role: user
    content: >
      Check current stock levels for SKU WD-2201 and SKU WD-2450 before we
      finalize the reorder.
expect:
  tool_calls:
    - {name: check_stock_level, args: {sku: "WD-2201"}, args_match: exact}
    - {name: check_stock_level, args: {sku: "WD-2450"}, args_match: exact}
  parallel_ok: true
  forbidden_tools: [create_purchase_order]
notes: |
  Two independent lookups that don't depend on each other -- a well-behaved
  model issues both check_stock_level calls in the SAME turn rather than
  asking a clarifying question or only checking one SKU. Multiset-matched
  (order-independent) against the two expected calls.
