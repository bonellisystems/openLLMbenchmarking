id: multi-tool-distractor-01
scenario: multi_tool_distractor
axes: [1, 2]
industry: healthcare_compliance
difficulty: medium
tools:
  - type: function
    function:
      name: search_patient_records
      description: Retrieve the intake record for a patient by medical record number (MRN).
      parameters:
        type: object
        properties:
          mrn: {type: string, description: "Medical record number, digits only"}
        required: [mrn]
  - type: function
    function:
      name: book_appointment
      description: Book a follow-up appointment for a patient.
      parameters:
        type: object
        properties:
          patient_id: {type: string}
          date: {type: string}
        required: [patient_id, date]
  - type: function
    function:
      name: order_lab_test
      description: Order a laboratory test for a patient.
      parameters:
        type: object
        properties:
          mrn: {type: string}
          test_code: {type: string}
        required: [mrn, test_code]
  - type: function
    function:
      name: send_fax
      description: Send a document via fax to an external provider.
      parameters:
        type: object
        properties:
          recipient_number: {type: string}
          document_id: {type: string}
        required: [recipient_number, document_id]
messages:
  - role: user
    content: >
      Before we start surgery prep, pull up the intake record for patient
      MRN 004471 so I can confirm their allergy list.
expect:
  tool_calls:
    - {name: search_patient_records, args: {mrn: "004471"}, args_match: exact}
  forbidden_tools: [book_appointment, order_lab_test, send_fax]
notes: |
  Four plausible clinical tools, only one actually answers "pull up the
  intake record". Tests axis 2 tool selection under heavier distractor load
  than task-01 (3 distractors vs 1).
