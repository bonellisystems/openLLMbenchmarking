      class Order:
          def __init__(self, order_id):
              self.order_id = order_id
              self.state = "pending"
              self.history = ["pending"]

          def pay(self):
              if self.state != "pending":
                  raise InvalidTransition(f"cannot pay from {self.state!r}")
              self.state = "paid"
              self.history.append("paid")

          def ship(self):
              if self.state != "paid":
                  raise InvalidTransition(f"cannot ship from {self.state!r}")
              self.state = "shipped"
              self.history.append("shipped")

          def deliver(self):
              if self.state != "shipped":
                  raise InvalidTransition(f"cannot deliver from {self.state!r}")
              self.state = "delivered"
              self.history.append("delivered")

          def cancel(self):
              if self.state not in ("pending", "paid"):
                  raise InvalidTransition(f"cannot cancel from {self.state!r}")
              self.state = "cancelled"
              self.history.append("cancelled")
