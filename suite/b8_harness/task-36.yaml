                self.state = "pending"
                self.history = ["pending"]

            def _advance(self, expected_current, target):
                self.state = target
                self.history.append(target)
                if expected_current not in _NEXT or _NEXT[expected_current] != target:
                    raise InvalidTransition(f"cannot go to {target!r}")

            def pay(self):
