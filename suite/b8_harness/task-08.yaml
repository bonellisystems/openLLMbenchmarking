id: py-edit-01
shape: edit
task_version: "1.0.0"
prompt: |
  The repo has one file, `greet.py`, containing a `greet(name)` function
  that always returns the same hardcoded greeting no matter what name is
  passed to it:

      >>> greet("Ada")
      'Hello, World!'

  Edit `greet.py` so `greet(name)` returns a greeting for the given NAME
  instead of the hardcoded placeholder, e.g. `greet("Ada")` must return
  exactly `"Hello, Ada!"` (and `greet("Grace")` must return exactly
  `"Hello, Grace!"`). Only modify `greet.py` -- do not create or edit any
  other file (including `NOTES.md`).
allowed_tools: [read_file, write_file, bash_exec]
budgets: {wall_clock_s: 120, tokens: 2000, steps: 6}
setup_repo:
  greet.py: |
    def greet(name):
        return "Hello, World!"
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import sys


    def main():
        try:
            import greet
        except Exception as e:
            print(f"FAIL: import greet raised {e!r}")
            sys.exit(1)

        cases = [("Ada", "Hello, Ada!"), ("Grace", "Hello, Grace!")]
        for name, want in cases:
            try:
                got = greet.greet(name)
            except Exception as e:
                print(f"FAIL: greet({name!r}) raised {e!r}")
                sys.exit(1)
            if got != want:
                print(f"FAIL: greet({name!r}) -> {got!r} (want {want!r})")
                sys.exit(1)
        print("PASS")


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [greet.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: edit -- Python counterpart of suite/b8_harness/task-01.yaml
  (edit-01, `greet.sh`); same minimal-diff-parameterization spec, ported to
  Python. Added (task-b8local) so B8 has a real Python `edit` task scored
  inside `python:3.11-slim` (via suite.yaml's `b8.sandbox.oracle_image`
  seam) rather than the pinned, Python-less nvidia/cuda sandbox image.

  Hidden oracle: `oracle_test.py` lives in `oracle_files`, never written
  into the agent's workspace by `materialize_repo`. `run_oracle`
  re-injects it into a private copy only at validation time, then IMPORTS
  the edited `greet.py` and calls `greet` with two different names,
  checking real return values -- a model that special-cases "Ada" alone
  still fails the "Grace" check. Stdlib only -- no pytest.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a) -- a distinct mechanism from withholding: NOTES.md
  is readable but tamper-checked; oracle_test.py is simply never present.
