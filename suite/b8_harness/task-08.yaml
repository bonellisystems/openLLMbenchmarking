id: py-edit-01
shape: edit
task_version: "1.2.0"
prompt: |
  The repo has one file, `greet.py`, containing a `greet(name)` function
  that always returns the same hardcoded greeting no matter what name is
  passed to it:

      >>> greet("Ada")
      'Hello, World!'

  Edit `greet.py` so `greet(name)` returns a greeting for the given NAME
  instead of the hardcoded placeholder, e.g. `greet("Ada")` must return
  exactly `"Hello, Ada!"` (and `greet("Grace")` must return exactly
  `"Hello, Grace!"`). Only modify `greet.py` -- do not create or edit any
  other file (including `NOTES.md`).
allowed_tools: [read_file, write_file, bash_exec]
budgets: {wall_clock_s: 120, tokens: 2000, steps: 6}
setup_repo:
  greet.py: |
    def greet(name):
        return "Hello, World!"
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    CASES = [("Ada", "Hello, Ada!"), ("Grace", "Hello, Grace!")]


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(name):
        """Run `greet.greet(name)` in a FRESH subprocess and return the
        completed process -- never `import greet` into THIS process
        (task-b8expand hardening: a module-level `sys.exit(0)` in the
        candidate solution can only kill the throwaway subprocess, not
        this checker -- see llmtest/harness/tasks.py module docstring)."""
        code = f"import greet\nprint(greet.greet({name!r}))\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for name, want in CASES:
            r = _run(name)
            case = f"greet({name!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [greet.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: edit -- Python counterpart of suite/b8_harness/task-01.yaml
  (edit-01, `greet.sh`); same minimal-diff-parameterization spec, ported to
  Python. Added (task-b8local) so B8 has a real Python `edit` task scored
  inside `python:3.11-slim` (via suite.yaml's `b8.sandbox.oracle_image`
  seam) rather than the pinned, Python-less nvidia/cuda sandbox image.

  Hidden oracle: `oracle_test.py` lives in `oracle_files`, never written
  into the agent's workspace by `materialize_repo`. `run_oracle`
  re-injects it into a private copy only at validation time, then calls
  `greet` with two different names, checking real return values -- a
  model that special-cases "Ada" alone still fails the "Grace" check.
  Stdlib only (`subprocess`, `sys`) -- no pytest.

  SUBPROCESS-ISOLATED (task-b8expand hardening, task_version 1.0.0 ->
  1.1.0 -- codex review Important #1, same finding/fix as
  py-bugfix-01/task-06.yaml): the 1.0.0 oracle `import`ed `greet` straight
  into this checker's own process, so a module-level `sys.exit(0)` in the
  candidate `greet.py` would kill the whole oracle with exit code 0
  before either case ran, and `hidden_validate` (exit-code-only) would
  wrongly report a pass. The 1.1.0 oracle instead launches a brand-new
  `python3 -c "import greet; print(greet.greet(...))"` subprocess PER
  CASE and asserts on ITS stdout from the outside -- a `sys.exit(0)` in
  `greet.py` now only kills that one throwaway subprocess, leaving no
  output to match, so the comparison still correctly fails.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a) -- a distinct mechanism from withholding: NOTES.md
  is readable but tamper-checked; oracle_test.py is simply never present.

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.1.0 -> 1.2.0): see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full
  `{"pass","stage","reason_code","case","expected","actual","exit_status"}`
  convention and closed vocabulary -- same `_emit`/`_classify_crash`
  pattern as py-bugfix-01/task-06.yaml, adapted to this task's single-arg
  `greet(name)` cases.
