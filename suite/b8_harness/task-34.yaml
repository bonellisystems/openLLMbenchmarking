id: py-feat-06
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small request router, split across 2 files:

  - `router.py` -- the EXISTING engine. `ROUTES` is a dict mapping path ->
    `(handler_fn, required_role)`. `route(path, required_role=None)` is a
    decorator: `@route("/x")` registers a handler with no role
    requirement; `@route("/x", required_role="admin")` registers one that
    requires the caller's role to match exactly. `handle(path, role,
    *args)` looks `path` up in `ROUTES` (raising `LookupError` if it isn't
    registered), and -- ONLY if a `required_role` was registered for that
    path AND the caller's `role` doesn't match it -- raises
    `PermissionError` WITHOUT calling the handler at all; otherwise calls
    `handler_fn(*args)` and returns its result. This enforcement is
    centralized here; individual handlers are never expected to check
    roles themselves.
  - `handlers.py` -- the EXISTING handlers, already registered via the
    `@route` decorator: `status_handler` (`@route("/status")`, no args,
    returns `"ok"`) and `profile_handler` (`@route("/profile")`, takes
    `username`, returns `f"profile: {username}"`).

  Add a new handler, `reset_handler(target)`, to `handlers.py`, registered
  at path `"/admin/reset"` and requiring role `"admin"` -- use the SAME
  `@route(...)` decorator mechanism the two existing handlers use (do not
  invent a separate, handler-internal role check; the router's own
  `required_role` enforcement is the single place authorization is meant
  to live). `reset_handler` itself should simply return `f"reset:
  {target}"` -- it does not need to know anything about roles.

  You may modify ONLY `handlers.py`. Do not create or edit `router.py` or
  `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 14}
setup_repo:
  router.py: |
    ROUTES = {}


    def route(path, required_role=None):
        """Existing decorator: registers the decorated function at `path`
        in ROUTES, alongside the required role (None = no restriction)."""
        def deco(fn):
            ROUTES[path] = (fn, required_role)
            return fn
        return deco


    def handle(path, role, *args):
        """Existing engine: centralized authorization. Looks `path` up
        (LookupError if unregistered); if a required_role was registered
        and `role` doesn't match it, raises PermissionError WITHOUT
        calling the handler; otherwise calls it and returns its result."""
        if path not in ROUTES:
            raise LookupError(f"no such route: {path}")
        fn, required_role = ROUTES[path]
        if required_role is not None and role != required_role:
            raise PermissionError(f"requires role {required_role}")
        return fn(*args)
  handlers.py: |
    from router import route


    @route("/status")
    def status_handler():
        return "ok"


    @route("/profile")
    def profile_handler(username):
        return f"profile: {username}"
