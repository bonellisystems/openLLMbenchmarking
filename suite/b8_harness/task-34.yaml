notes: |
  Shape: multi-file (Wave 4, W4B2 feature-integration batch) -- register a
  new handler into an existing route/authorization dispatcher, REUSING
  the centralized enforcement mechanism rather than reimplementing it
  ad hoc. `router.py` (protected) is the single place role-checking is
  meant to live: `handle()` consults `ROUTES[path][1]` (the
  `required_role` an `@route(...)` call recorded) BEFORE ever invoking the
  handler function. The most direct way this discipline is checked:
  `router.ROUTES['/admin/reset'][1] == "admin"` is asserted DIRECTLY, not
  just "does `handle()` reject a bad role" -- a solution that registers
  the route (`@route("/admin/reset")`) but FORGETS the `required_role`
  kwarg entirely leaves it wide open to any caller, and fails both the
  `handle('/admin/reset', 'guest', ...)` case (a `PermissionError` was
  expected, but the call quietly succeeds instead) AND the direct
  `ROUTES[...][1]` check (`actual` `None`, want `"admin"`) -- belt and
  suspenders on the same real security-relevant bug ("forgot to actually
  restrict the new admin-only route"). Also: since `route`'s signature is
  `route(path, required_role=None)`, a plausible argument-order slip
  (`@route("admin", "/admin/reset")`, positionally swapping the two)
  registers under the wrong PATH entirely, caught by every case that
  calls `handle('/admin/reset', ...)`, which raises `LookupError` instead
  of the expected result.

  Verified empirically (hermetic, host python): the reference passes every
  case; a `wrong` fixture that registers `/admin/reset` with no
  `required_role` passes the admin-role case but fails
  `handle('/admin/reset', 'guest', ...)` (`actual` `NO_EXCEPTION`, want
  `PermissionError`) and the direct `ROUTES[...][1]` check (`actual`
  `None`); a `wrong` fixture that forgets to register the new route at
  all fails immediately with `LookupError` on the very first case; a
  `wrong` fixture with path/required_role positionally swapped fails the
  same way (route registered under `"admin"`, not `"/admin/reset"`).
