    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _check_exact(code, case, want):
        r = _run(code)
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=want, actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != want:
            _emit(False, case=case, expected=want, actual=got,
                  stage="behavior", reason_code="wrong_output")


    def _check_type(code, case, want_type_name):
        r = _run(code)
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=want_type_name, actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != want_type_name:
            _emit(False, case=case, expected=want_type_name, actual=got,
                  stage="behavior", reason_code="wrong_output")


    def _raises_code(expr):
        return (
            "import handlers, router\n"
            "try:\n"
            f"    {expr}\n"
            "    print('NO_EXCEPTION')\n"
            "except PermissionError:\n"
            "    print('PermissionError')\n"
            "except LookupError:\n"
            "    print('LookupError')\n"
            "except Exception as e:\n"
            "    print(type(e).__name__)\n"
        )


    def main():
        # New route works end-to-end for the admin role.
        _check_exact(
            "import handlers, router\nprint(router.handle('/admin/reset', 'admin', 'server1'))\n",
            "handle('/admin/reset', 'admin', 'server1')", "reset: server1")
        _check_exact(
            "import handlers, router\nprint(router.handle('/admin/reset', 'admin', 'db:5'))\n",
            "handle('/admin/reset', 'admin', 'db:5')  # edge: target itself contains a colon", "reset: db:5")

        # Non-admin caller must be rejected -- and REJECTED VIA THE ROUTER'S
        # OWN enforcement, not a handler-internal check: confirmed both by
        # the exception type from handle() itself...
        _check_type(_raises_code("router.handle('/admin/reset', 'guest', 'server1')"),
                    "handle('/admin/reset', 'guest', 'server1')  # wrong role", "PermissionError")
        _check_type(_raises_code("router.handle('/admin/reset', None, 'server1')"),
                    "handle('/admin/reset', None, 'server1')  # no role at all", "PermissionError")

        # ...AND directly, by confirming the route was registered through
        # the real @route(..., required_role=...) mechanism (ROUTES itself
        # carries "admin"), not a bespoke in-handler role check that
        # would leave ROUTES's required_role slot at None.
        _check_exact(
            "import handlers, router\nprint(router.ROUTES['/admin/reset'][1])\n",
            "router.ROUTES['/admin/reset'][1]  # the registered required_role", "admin")

        # Regression: pre-existing unrestricted routes still work exactly
        # as before, for any role (including None).
        _check_exact(
            "import handlers, router\nprint(router.handle('/status', 'anyone'))\n",
            "handle('/status', 'anyone')  # regression, no role required", "ok")
        _check_exact(
            "import handlers, router\nprint(router.handle('/status', None))\n",
            "handle('/status', None)  # regression, no role at all", "ok")
        _check_exact(
            "import handlers, router\nprint(router.handle('/profile', 'anyone', 'alice'))\n",
            "handle('/profile', 'anyone', 'alice')  # regression", "profile: alice")

        # Regression: an unregistered path still raises LookupError.
        _check_type(_raises_code("router.handle('/nope', 'admin')"),
                    "handle('/nope', 'admin')  # regression, unknown path", "LookupError")

        _emit(True)


    if __name__ == "__main__":
        main()
