id: edit-01
shape: edit
task_version: "1.1.0"
prompt: |
  The repo has one file, `greet.sh`, containing a `greet`-style script that
  always prints the same hardcoded greeting no matter what name is passed
  to it:

      $ bash greet.sh Ada
      Hello, World!

  Edit `greet.sh` so it greets the NAME given as its first argument instead
  of the hardcoded placeholder, e.g. `bash greet.sh Ada` must print exactly
  `Hello, Ada!` (and `bash greet.sh Grace` must print exactly
  `Hello, Grace!`). Only modify `greet.sh` -- do not create or edit any
  other file (including `NOTES.md`).
allowed_tools: [read_file, write_file, bash_exec]
budgets: {wall_clock_s: 120, tokens: 2000, steps: 6}
setup_repo:
  greet.sh: |
    #!/bin/bash
    # Prints a greeting for the given name.
    name="$1"
    echo "Hello, World!"
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.sh: |
    #!/bin/bash
    set -e
    out="$(bash greet.sh Ada)"
    if [ "$out" != "Hello, Ada!" ]; then
      echo "FAIL: greet.sh Ada -> '$out' (want 'Hello, Ada!')"
      exit 1
    fi
    out2="$(bash greet.sh Grace)"
    if [ "$out2" != "Hello, Grace!" ]; then
      echo "FAIL: greet.sh Grace -> '$out2' (want 'Hello, Grace!')"
      exit 1
    fi
    echo PASS
protected_paths: [NOTES.md]
allowed_diff_paths: [greet.sh]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && bash oracle_test.sh"]
notes: |
  Shape: edit -- single-file, minimal-diff edit of an existing script.

  Hidden oracle (post-review hardening, task_version 1.0.0 -> 1.1.0):
  `oracle_test.sh` lives in `oracle_files`, NOT `setup_repo` -- it is never
  written into the agent's workspace by `materialize_repo`, so there is
  nothing for the agent to read and overfit against (e.g. hand-crafting
  output that satisfies a memorized check without genuinely parameterizing
  the greeting). `run_oracle` re-injects it into a private copy only at
  validation time. It actually RUNS the agent's edited greet.sh with two
  different names and checks real output, not just a text/regex signal on
  the source -- a model that special-cases "Ada" alone would still fail the
  "Grace" check.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a): a gamed edit to it is caught immediately, even if
  greet.sh itself is correctly fixed. This is a distinct mechanism from
  withholding -- NOTES.md is readable but tamper-checked; oracle_test.sh is
  simply never present to read.

  Bash, not Python: the pinned sandbox image (Task 2) has no Python/gcc/
  node interpreter, only bash/perl/coreutils -- see tasks.py module
  docstring.
