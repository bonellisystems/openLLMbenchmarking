    - paginator.py: |
        # BUG: builds a flat, already-fetched-items list lazily via
        # _fill_to(), but __next__ indexes into it WITHOUT checking that
        # the fill actually reached far enough -- once truly exhausted,
        # _fill_to() stops adding (since _exhausted is set), but the
        # unconditional self._items[self._idx] below still runs, crashing
        # with IndexError instead of raising StopIteration.
        class PageIterator:
            def __init__(self, fetch_page, page_size=3):
                self._fetch_page = fetch_page
                self._page_size = page_size
                self._items = []
                self._exhausted = False
                self._next_page_to_fetch = 0
                self._idx = 0

            def __iter__(self):
                return self

            def _fill_to(self, target_len):
                while len(self._items) < target_len and not self._exhausted:
                    page = list(self._fetch_page(self._next_page_to_fetch))
                    self._next_page_to_fetch += 1
                    self._items.extend(page)
                    if len(page) < self._page_size:
                        self._exhausted = True

            def __next__(self):
                self._fill_to(self._idx + 1)
                item = self._items[self._idx]
                self._idx += 1
                return item

            def reset(self):
                self._idx = 0
    - paginator.py: |
        # BUG: reset() rebuilds the cache from scratch instead of just
