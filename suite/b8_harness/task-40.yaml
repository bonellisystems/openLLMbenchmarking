        class PageIterator:
            def __init__(self, fetch_page, page_size=3):
                self._fetch_page = fetch_page
                self._page_size = page_size
                self._cache = []
                self._done = False
                self._pos = 0

            def __iter__(self):
                return self

            def _fetch_upto(self, page_index):
                while len(self._cache) <= page_index and not self._done:
                    items = list(self._fetch_page(len(self._cache)))
                    self._cache.append(items)
                    if len(items) < self._page_size:
                        self._done = True

            def __next__(self):
                page_index, offset = divmod(self._pos, self._page_size)
                self._fetch_upto(page_index)
                if page_index >= len(self._cache) or offset >= len(self._cache[page_index]):
                    raise StopIteration
                item = self._cache[page_index][offset]
                self._pos += 1
                return item

            def reset(self):
                self._cache = []
                self._done = False
                self._pos = 0
