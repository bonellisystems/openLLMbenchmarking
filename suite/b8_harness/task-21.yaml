id: py-brk-05
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small billing pipeline, split across 3 files:

  - `quote_cache.py` -- `memoize_quote(fn)`, a decorator that caches a
    2-argument quote function's results so repeated requests for the same
    inputs skip recomputation.
  - `pricing.py` -- `compute_quote(customer_id, plan)`, decorated with
    `@memoize_quote`: the price `customer_id` pays for `plan`, computed as
    the plan's base price minus the customer's tier discount.
  - `billing.py` -- `get_invoice_amount(customer_id, plan)` and
    `build_invoice_batch(requests)` (a list of `(customer_id, plan)`
    pairs), which format invoice lines on top of `pricing.compute_quote`.

  `build_invoice_batch` sometimes prints the WRONG price for a request --
  specifically, a customer's SECOND request (for a different plan than
  their first) sometimes comes back showing the price of their FIRST
  plan instead. `pricing.py`'s actual pricing formula (base price minus
  tier discount) is correct -- reading it will not reveal the bug. The
  real defect is in `quote_cache.py`'s caching logic: it doesn't treat two
  requests as distinct in every case where they actually ARE distinct.
  Find it and fix it. Only modify `quote_cache.py` -- do not create or
  edit any other file (including `pricing.py`, `billing.py`, or
  `NOTES.md`), even if you notice something about one of them you'd
  otherwise want to change.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  quote_cache.py: |
    _cache = {}


    def memoize_quote(fn):
        """Cache the wrapped 2-argument quote function's results, keyed on
        its arguments, so repeated quote requests for identical inputs skip
        recomputation."""
        def wrapper(customer_id, plan):
            key = customer_id
            if key in _cache:
                return _cache[key]
            result = fn(customer_id, plan)
            _cache[key] = result
            return result
        return wrapper
  pricing.py: |
    from quote_cache import memoize_quote

    _BASE_PRICE = {"basic": 10.0, "standard": 20.0, "premium": 35.0}
    _TIER_DISCOUNT = {1: 0.0, 2: 0.10, 3: 0.20}


    @memoize_quote
    def compute_quote(customer_id, plan):
        """The price `customer_id` pays for `plan`: the plan's base price
        minus their tier discount (looked up by customer_id here as a
        simplified stand-in for a real tier lookup), rounded to 2 decimals."""
        base = _BASE_PRICE[plan]
        discount = _TIER_DISCOUNT.get(customer_id, 0.0)
        return round(base * (1 - discount), 2)
  billing.py: |
    from pricing import compute_quote


    def get_invoice_amount(customer_id, plan):
        price = compute_quote(customer_id, plan)
        return f"customer {customer_id}, plan {plan}: ${price:.2f}"


    def build_invoice_batch(requests):
        """`requests`: an ordered list of (customer_id, plan) pairs. Returns
        one invoice line per request, IN ORDER."""
        return "\n".join(get_invoice_amount(c, p) for c, p in requests)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    _BASE_PRICE = {"basic": 10.0, "standard": 20.0, "premium": 35.0}
    _TIER_DISCOUNT = {1: 0.0, 2: 0.10, 3: 0.20}


    def _want_quote(customer_id, plan):
        base = _BASE_PRICE[plan]
        discount = _TIER_DISCOUNT.get(customer_id, 0.0)
        return round(base * (1 - discount), 2)


    def _want_batch(requests):
        lines = [f"customer {c}, plan {p}: ${_want_quote(c, p):.2f}" for c, p in requests]
        return "\n".join(lines)


    CASES = [
        [(1, "basic")],
        [(1, "basic"), (1, "premium")],
        [(1, "premium"), (1, "basic")],
        [(1, "basic"), (2, "basic"), (1, "premium")],
        [(3, "standard"), (3, "premium")],
        [(1, "basic"), (1, "basic")],
        [(2, "premium"), (2, "standard"), (2, "basic")],
        [(1, "basic"), (2, "standard"), (3, "premium"), (1, "standard"), (2, "premium")],
    ]


    def main():
        for requests in CASES:
            want = _want_batch(requests)
            code = ("import billing\n"
                    f"print(billing.build_invoice_batch({requests!r}))\n")
            r = _run(code)
            case = f"build_invoice_batch({requests})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [pricing.py, billing.py, NOTES.md]
allowed_diff_paths: [quote_cache.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 root-cause-localization batch) --
  `quote_cache.memoize_quote`'s cache key uses ONLY `customer_id`, ignoring
  `plan` entirely, so a customer's second quote request for a DIFFERENT
  plan wrongly hits the cache entry from their first request. `pricing.py`
  (the file with the actual pricing formula, and the file a model is most
  likely to suspect first) is fully correct -- a deliberate decoy, mirroring
  py-hard-toolheavy-01's `curve.py`. Cache state persists across calls
  WITHIN a single `build_invoice_batch` call (one process per case), which
  is exactly what's needed to observe the collision -- case 4 in particular
  interleaves a different customer's request between the colliding pair to
  prove the fix is about the (customer_id, plan) KEY, not merely "the most
  recent call".

  Verified empirically: the ORIGINAL unfixed `quote_cache.py` fails the
  second case, `build_invoice_batch([(1, "basic"), (1, "premium")])` ->
  the second line wrongly repeats the first request's $10.00 instead of
  $35.00. `check_fixtures.wrong[1]` (cache key uses `plan` only, dropping
  `customer_id` -- overcorrecting the same bug onto the OTHER argument)
  fails on the differently-shaped case 4 (`(1, "basic"), (2, "basic"),
  (1, "premium")`): customer 2's `"basic"` request wrongly returns
  customer 1's cached `"basic"` price instead of their own (different
  tier discount).
