id: py-brk-01
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small text-processing pipeline, split across 3 files:

  - `strnorm.py` -- `collapse_spaces(s)`, meant to collapse ANY run of
    consecutive whitespace characters (spaces, tabs, newlines -- anything
    `str.isspace()` would call whitespace) in `s` down to a single ASCII
    space, and strip leading/trailing whitespace. E.g.
    `collapse_spaces("  a   b\tc  ")` must return `"a b c"`.
  - `tokenizer.py` -- `tokenize(text)`, which calls `strnorm.collapse_spaces`
    and then splits the normalized text into a list of tokens.
  - `wordcount.py` -- `count_words(lines)`, which tokenizes every line (via
    `tokenizer.tokenize`) and returns a dict mapping each distinct token to
    how many times it appears across all lines combined.

  `count_words` is producing wrong counts (missing words, extra bogus
  "words", or words merged together) whenever the input text has irregular
  whitespace -- runs of 3+ spaces, or any tabs. Reading `tokenizer.py` or
  `wordcount.py` alone will not reveal the problem: both do exactly what
  their own logic says on top of whatever `collapse_spaces` hands them: the
  bug is that `collapse_spaces` does NOT actually satisfy its own stated
  contract (collapsing ANY whitespace run to a single space) in every case,
  even though it looks like a reasonable implementation and handles plenty
  of ordinary inputs correctly.

  Find the bug and fix `collapse_spaces` in `strnorm.py` so it satisfies its
  stated contract exactly, for every input (including 3+ consecutive spaces,
  tabs, newlines, and any mix of these). Only modify `strnorm.py` -- do not
  create or edit any other file (including `tokenizer.py`, `wordcount.py`,
  or `NOTES.md`), even if you notice something about one of them you'd
  otherwise want to change.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  strnorm.py: |
    def collapse_spaces(s):
        """Collapse any run of consecutive whitespace characters in `s` into
        a single ASCII space, and strip leading/trailing whitespace -- e.g.
        "  a   b\tc  " -> "a b c"."""
        return s.replace('  ', ' ').strip()
  tokenizer.py: |
    from strnorm import collapse_spaces


    def tokenize(text):
        """Split `text` into a list of whitespace-separated tokens, after
        normalizing all whitespace runs down to single spaces via
        strnorm.collapse_spaces."""
        normalized = collapse_spaces(text)
        if normalized == "":
            return []
        return normalized.split(' ')
  wordcount.py: |
    from tokenizer import tokenize


    def count_words(lines):
        """`lines`: a list of text lines. Tokenize every line and return a
        dict mapping each distinct token (case-sensitive) to how many times
        it appears across ALL lines combined."""
        counts = {}
        for line in lines:
            for tok in tokenize(line):
                counts[tok] = counts.get(tok, 0) + 1
        return counts
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    CASES = [
        (["a b"], {"a": 1, "b": 1}),
        (["a  b"], {"a": 1, "b": 1}),
        (["a   b"], {"a": 1, "b": 1}),
        (["a    b"], {"a": 1, "b": 1}),
        (["a\tb"], {"a": 1, "b": 1}),
        (["\t  hi  \t"], {"hi": 1}),
        (["hello   world", "hello there", "  world  again  "],
         {"hello": 2, "world": 2, "there": 1, "again": 1}),
        ([""], {}),
        (["   "], {}),
        (["one   two   three   four"], {"one": 1, "two": 1, "three": 1, "four": 1}),
        (["a\n\nb"], {"a": 1, "b": 1}),
        (["x   y", "x   y", "x   y"], {"x": 3, "y": 3}),
    ]


    def _run_case(lines):
        code = ("import json\nimport wordcount\n"
                f"print(json.dumps(wordcount.count_words({lines!r}), sort_keys=True))\n")
        return _run(code)


    def main():
        for lines, want in CASES:
            r = _run_case(lines)
            preview = lines if len(lines) <= 5 else f"<{len(lines)} lines>"
            case = f"count_words({preview})"
            want_json = json.dumps(want, sort_keys=True)
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want_json, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want_json:
                _emit(False, case=case, expected=want_json, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [tokenizer.py, wordcount.py, NOTES.md]
allowed_diff_paths: [strnorm.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 root-cause-localization batch) --
  the bug is planted 2 layers below the observable symptom: `strnorm.
  collapse_spaces` (leaf helper) is silently non-conformant to its own
  docstring contract (only collapses EVEN-length space runs fully via a
  single non-fixpoint `.replace('  ', ' ')` pass, and never touches
  tabs/newlines at all), consumed by `tokenizer.tokenize` (mid layer,
  itself fully correct), whose bad tokens then corrupt `wordcount.
  count_words`'s aggregate counts (top layer, fully correct) -- the
  symptom (wrong word counts) is visible only at the TOP of a 3-file call
  chain, while the actual defect lives in the BOTTOM file. `tokenizer.py`
  and `wordcount.py` are believable decoys (they are the files that
  actually "do" the splitting/counting one would first suspect) but both
  are correct and protected/hash-checked.

  Verified empirically (this batch's authoring): the ORIGINAL unfixed
  `strnorm.py` fails the very first duplicate-space-run case,
  `count_words(['a   b'])` -> a bogus empty-string token from the leftover
  un-collapsed double space (or, for the tab case, an entirely unsplit
  `"a\tb"` token) -- proving the oracle discriminates on the intended
  edge. A plausible partial fix (loop `while '  ' in s: s = s.replace('  ',
  ' ')` -- correctly collapses ANY run of literal spaces to a fixpoint) is
  covered as `check_fixtures.wrong[1]`: it still fails because it never
  generalizes to tabs/newlines, exactly the trap in the stated "whitespace
  characters" contract.
check_fixtures:
  reference:
    strnorm.py: |
      import re


      def collapse_spaces(s):
          return re.sub(r'\s+', ' ', s).strip()
  alternate:
    strnorm.py: |
      def collapse_spaces(s):
          return ' '.join(s.split())
  wrong:
    - strnorm.py: |
        def collapse_spaces(s):
            return s.replace('  ', ' ').strip()
    - strnorm.py: |
        def collapse_spaces(s):
            while '  ' in s:
                s = s.replace('  ', ' ')
            return s.strip()
