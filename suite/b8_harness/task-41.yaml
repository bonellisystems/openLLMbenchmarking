  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B3 build/config batch) -- a
  config-precedence + type-coercion contract. The starter bug is a
  MISSING coercion step entirely (precedence itself is already correct),
  so a naive fix that just "makes it typecheck" without following the
  exact coercion rules (bool-before-int check order, whitespace-tolerant
  numeric parsing, exact-unchanged string passthrough, silently-ignored
  unknown keys) will fail one of the targeted FIELD_CASES/ERROR_CASES even
  while passing the easier FULL_CASES. Traps:
  1. `bool(raw_string)` instead of the documented token set -- ANY
     non-empty string is truthy in Python, so `bool("false")` is `True`.
     Caught by the bool-false FIELD_CASES (`"false"`/`"0"`/`"no"`/`"off"`
     all mapped to `False`), not by FULL_CASES (which only exercises
     `"true"` in its one bool-override case -- `bool("true")` happens to
     be correct by coincidence).
  2. Precedence swapped (file overriding env instead of env overriding
     file) -- caught by `env_wins_over_file`, the 3rd FULL_CASES entry.
  3. Leaking unknown keys from `file_values`/`env_values` into the result
     (e.g. `result = {**defaults, **file_values, **env_values}`-shaped
     code) -- caught by `unknown_keys_ignored` (exact key-set equality via
     `sorted(dict.items())`).

  Verified empirically: the ORIGINAL unfixed `config.py` (`check_fixtures.
  wrong[0]`, identical to the starter) fails the 2nd FULL_CASES case
  (`file_overrides`) immediately -- `port`/`debug` stay raw strings
  instead of coerced. `wrong[1]` (naive `bool(raw)` coercion, correct
  everywhere else) passes every FULL_CASES entry and the bool-true
  FIELD_CASES by coincidence, then fails the first bool-false FIELD_CASE
  (`{"debug": "false"}` -> expected `'False'`, actual `'True'`).
  `wrong[2]` (env applied first, then file -- precedence backwards) fails
  `env_wins_over_file` (`actual` port `9090`, want `7000`).
