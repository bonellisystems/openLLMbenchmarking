id: py-build-01
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has two files:

  - `config.py` -- `merge_config(defaults, file_values, env_values)`,
    meant to build an effective settings dict by layering three sources,
    LOWEST to HIGHEST precedence: `defaults` (a dict of `key -> a value
    whose PYTHON TYPE is the target type for that key` -- `bool`/`int`/
    `float`/`str`), `file_values` (a dict of `key -> str`, as if read
    from a config file), then `env_values` (a dict of `key -> str`, as if
    read from environment variables -- HIGHEST precedence, wins over
    both). Contract other code relies on:
    - The returned dict has EXACTLY the same keys as `defaults` -- a key
      present only in `file_values`/`env_values` (not in `defaults`) is
      UNKNOWN and must be silently ignored, never added to the result.
    - For each key, if `env_values` has it, that value (coerced) wins;
      else if `file_values` has it, that value (coerced) wins; else the
      `defaults` value is used AS-IS (already the right type, no
      coercion needed).
    - Coercion target is decided by `type(defaults[key])`, checked in
      this order (bool MUST be checked before int -- `bool` is a
      subclass of `int` in Python, so `isinstance(x, int)` alone would
      wrongly match a bool default too):
      - `bool`: strip whitespace, lowercase, then `"true"`/`"1"`/
        `"yes"`/`"on"` -> `True`; `"false"`/`"0"`/`"no"`/`"off"` ->
        `False`; anything else -> raise `ValueError`.
      - `int`: `int(value.strip())` -- let its natural `ValueError`
        propagate on a non-integer string.
      - `float`: `float(value.strip())` -- likewise, natural
        `ValueError` on failure.
      - anything else (`str`, ...): the raw override string is used
        COMPLETELY UNCHANGED -- no stripping, no coercion.
  - `app_settings.py` -- an EXISTING caller elsewhere in this codebase:
    `resolve(file_values, env_values)` builds the effective config via
    `merge_config` and then does REAL typed operations with the result
    (`cfg["port"] + 1`, `cfg["timeout"] * 1000`, an `if cfg["debug"]:`
    branch) -- this only works if `merge_config` actually returns typed
    `int`/`float`/`bool` values for those keys, not raw strings. Must
    keep working exactly as written.

  The bug: `config.py`'s `merge_config` currently does the precedence
  layering correctly (`env_values` overrides `file_values` overrides
  `defaults`) but performs NO type coercion at all -- an override from
  `file_values`/`env_values` is used as the raw string, unchanged,
  regardless of what type `defaults[key]` says it should be. This means
  `app_settings.resolve` crashes (`TypeError`) the moment any numeric or
  boolean setting is overridden. Fix `merge_config` so it implements the
  FULL contract above (precedence + type coercion, including the
  bool-before-int check order, whitespace-tolerant numeric parsing, exact
  string passthrough for non-numeric/non-bool defaults, and silently
  ignoring unknown keys). Only modify `config.py` -- do not create or
  edit any other file (including `app_settings.py` or `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 15}
setup_repo:
  config.py: |
    def merge_config(defaults, file_values, env_values):
        """Layer defaults < file_values < env_values (env wins). BUG:
        currently does the precedence layering but NEVER coerces
        file_values/env_values strings to defaults[key]'s type -- an
        override always ends up as a raw string, even for an int/float/
        bool-typed default."""
        result = dict(defaults)
        for key in defaults:
            if key in file_values:
                result[key] = file_values[key]
            if key in env_values:
                result[key] = env_values[key]
        return result
  app_settings.py: |
    from config import merge_config

    DEFAULTS = {"port": 8080, "debug": False, "timeout": 30.5, "app_name": "worker"}


    def resolve(file_values, env_values):
        """Existing integration: builds the effective config and does real
        typed operations with the result (arithmetic on port/timeout,
        boolean branching on debug) -- relies on merge_config returning
        ACTUAL typed values (int/float/bool), not raw strings, for every
        key whose default is non-string."""
        cfg = merge_config(DEFAULTS, file_values, env_values)
        next_port = cfg["port"] + 1
        timeout_ms = cfg["timeout"] * 1000
        mode = "DEBUG" if cfg["debug"] else "PROD"
        return f"{mode}:{cfg['app_name']}:{next_port}:{timeout_ms}"
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    DEFAULTS = {"port": 8080, "debug": False, "timeout": 30.5, "app_name": "worker"}


    def _dict_snippet(file_values, env_values):
        return ("import config\n"
                f"r = config.merge_config({DEFAULTS!r}, {file_values!r}, {env_values!r})\n"
                "print(repr(sorted(r.items())))\n")


    def _field_snippet(file_values, env_values, field):
        return ("import config\n"
                f"r = config.merge_config({DEFAULTS!r}, {file_values!r}, {env_values!r})\n"
                f"print(repr(r[{field!r}]))\n")


    def _error_snippet(file_values, env_values):
        return ("import config\n"
                "try:\n"
                f"    config.merge_config({DEFAULTS!r}, {file_values!r}, {env_values!r})\n"
                "    print('NO_EXCEPTION')\n"
                "except Exception as e:\n"
                "    print(type(e).__name__)\n")


    FULL_CASES = [
        ("no_overrides", {}, {},
         "[('app_name', 'worker'), ('debug', False), ('port', 8080), ('timeout', 30.5)]"),
        ("file_overrides", {"port": "9090", "debug": "true", "app_name": "svc-a"}, {},
         "[('app_name', 'svc-a'), ('debug', True), ('port', 9090), ('timeout', 30.5)]"),
        ("env_wins_over_file", {"port": "9090"}, {"port": "7000"},
         "[('app_name', 'worker'), ('debug', False), ('port', 7000), ('timeout', 30.5)]"),
        ("unknown_keys_ignored", {"port": "1", "mystery_key": "surprise"}, {"another_mystery": "1"},
         "[('app_name', 'worker'), ('debug', False), ('port', 1), ('timeout', 30.5)]"),
    ]

    FIELD_CASES = [
        ({"debug": "true"}, {}, "debug", "True"),
        ({"debug": "TRUE"}, {}, "debug", "True"),
        ({"debug": "1"}, {}, "debug", "True"),
        ({"debug": "yes"}, {}, "debug", "True"),
        ({"debug": "On"}, {}, "debug", "True"),
        ({"debug": "false"}, {}, "debug", "False"),
        ({"debug": "FALSE"}, {}, "debug", "False"),
        ({"debug": "0"}, {}, "debug", "False"),
        ({"debug": "no"}, {}, "debug", "False"),
        ({"debug": "Off"}, {}, "debug", "False"),
        ({"timeout": "  12.5 "}, {}, "timeout", "12.5"),
        ({"port": " 42 "}, {}, "port", "42"),
        ({"app_name": "  spaced-name  "}, {}, "app_name", "'  spaced-name  '"),
    ]

    ERROR_CASES = [
        ("invalid_bool", {"debug": "maybe"}, {}),
        ("invalid_int", {"port": "not-a-number"}, {}),
        ("invalid_float", {"timeout": "abc"}, {}),
    ]


    def main():
        for label, file_values, env_values, expected in FULL_CASES:
            r = _run(_dict_snippet(file_values, env_values))
            case = f"merge_config full-dict [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        for file_values, env_values, field, expected in FIELD_CASES:
            r = _run(_field_snippet(file_values, env_values, field))
            case = f"merge_config field {field!r} file={file_values!r} env={env_values!r}"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        for label, file_values, env_values in ERROR_CASES:
            r = _run(_error_snippet(file_values, env_values))
            case = f"merge_config raises ValueError [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="ValueError", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "ValueError":
                _emit(False, case=case, expected="ValueError", actual=got,
                      stage="behavior", reason_code="wrong_output")

        integration_cases = [
            ("no_overrides", {}, {}, "PROD:worker:8081:30500.0"),
            ("overrides", {"port": "9000", "debug": "true", "timeout": "2"}, {},
             "DEBUG:worker:9001:2000.0"),
        ]
        for label, file_values, env_values, expected in integration_cases:
            code = ("import app_settings\n"
                    f"print(app_settings.resolve({file_values!r}, {env_values!r}))\n")
            r = _run(code)
            case = f"app_settings.resolve(...) [{label}]  # protected caller"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [app_settings.py, NOTES.md]
allowed_diff_paths: [config.py]
