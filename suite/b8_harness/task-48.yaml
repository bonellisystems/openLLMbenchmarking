  reference:
    safe_path.py: |
      import posixpath


      def safe_join(base_dir, user_path):
          if not isinstance(user_path, str):
              raise ValueError(f"user_path must be a string, got {type(user_path).__name__}")
          if "\x00" in user_path:
              raise ValueError("NUL byte in path")
          if "\\" in user_path:
              raise ValueError("backslash not allowed in path")
          if user_path.startswith("/"):
              raise ValueError("absolute path not allowed")
          if len(user_path) >= 2 and user_path[1] == ":" and user_path[0].isalpha():
              raise ValueError("drive-letter path not allowed")

          base_norm = posixpath.normpath(base_dir)
          joined = posixpath.normpath(posixpath.join(base_norm, user_path))

          if joined != base_norm and not joined.startswith(base_norm + "/"):
              raise ValueError(f"path escapes base directory: {user_path!r}")

          return joined
