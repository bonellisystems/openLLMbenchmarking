id: py-hard-multifile-01
shape: multi-file
task_version: "1.1.0"
prompt: |
  The repo has three files implementing a small checkout system:

  - `cart.py` -- defines `Cart`, with `add_item(unit_price, quantity)` and
    `subtotal()` (sums `unit_price * quantity` across all added items).
    This file is CORRECT. Do not edit it.
  - `pricing.py` -- defines two pure helper functions, `apply_discount
    (amount, flat_discount)` (subtracts a flat dollar amount) and
    `apply_tax(amount, tax_rate)` (multiplies by `1 + tax_rate`, e.g.
    `tax_rate=0.08` for 8%). Both are CORRECT in isolation. Do not edit
    this file either.
  - `checkout.py` -- defines `checkout_total(cart, flat_discount,
    tax_rate)`, which is supposed to orchestrate `cart.py` and
    `pricing.py` to compute the final amount the customer owes, rounded to
    2 decimal places.

  The business rule `checkout_total` must implement exactly is this:

      Sales tax is charged on the amount AFTER the flat discount has
      already been subtracted -- a customer must NEVER pay tax on the
      portion of the subtotal that was discounted away. In other words:
      take the cart's subtotal, subtract the flat discount from it FIRST,
      and only THEN apply the tax rate to what's left.

  `checkout_total` currently does not honor this rule -- it computes a
  number that is wrong whenever both `flat_discount` and `tax_rate` are
  nonzero (reading `cart.py` or `pricing.py` alone will not reveal this:
  both of those files are individually correct and do exactly what their
  own docstrings say; the bug is only visible by comparing `checkout.py`'s
  actual order of operations against the business rule stated above).
  Fix `checkout_total` in `checkout.py` so it correctly implements the
  rule. Only modify `checkout.py` -- do not create or edit any other file
  (including `cart.py`, `pricing.py`, or `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  cart.py: |
    class Cart:
        """A shopping cart: a list of (unit_price, quantity) line items."""

        def __init__(self):
            self.items = []

        def add_item(self, unit_price, quantity):
            self.items.append((unit_price, quantity))

        def subtotal(self):
            return sum(price * qty for price, qty in self.items)
  pricing.py: |
    def apply_discount(amount, flat_discount):
        """Subtract a flat dollar discount from `amount`."""
        return amount - flat_discount


    def apply_tax(amount, tax_rate):
        """Apply a sales-tax rate (e.g. 0.08 for 8%) to `amount`."""
        return amount * (1 + tax_rate)
  checkout.py: |
    from pricing import apply_discount, apply_tax


    def checkout_total(cart, flat_discount, tax_rate):
        subtotal = cart.subtotal()
        taxed = apply_tax(subtotal, tax_rate)
        total = apply_discount(taxed, flat_discount)
        return round(total, 2)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    # Each case: (items, flat_discount, tax_rate) where items is a list of
    # (unit_price, quantity) pairs.
    CASES = [
        ([(10.00, 2)], 5.00, 0.08),
        ([(19.99, 1), (5.00, 3)], 10.00, 0.0725),
        ([(100.00, 1)], 0.00, 0.10),
        ([(50.00, 1)], 50.00, 0.20),
        ([(1.00, 1)], 0.50, 0.0),
        ([], 0.00, 0.08),
        ([(9.99, 1)], 1.00, 0.05),
        ([(2.50, 100)], 50.00, 0.06),
        ([(15.00, 2), (3.50, 4)], 20.00, 0.15),
    ]


    def _expected(items, flat_discount, tax_rate):
        """Ground truth computed live and INDEPENDENTLY of cart.py/
        pricing.py (defense in depth on top of their protected-hash
        check): subtotal - discount, THEN tax, per the business rule
        stated in the prompt."""
        subtotal = sum(price * qty for price, qty in items)
        return round((subtotal - flat_discount) * (1 + tax_rate), 2)


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(items, flat_discount, tax_rate):
        """Build a real Cart and call the CANDIDATE `checkout_total` in a
        FRESH subprocess -- never imported into this checker's own
        process (see py-multifile-01's oracle notes for the full
        anti-gaming rationale: a module-level `sys.exit(0)` in
        checkout.py can only kill its own throwaway subprocess, leaving
        no matching stdout, so the comparison below still correctly
        fails)."""
        lines = ["from cart import Cart", "from checkout import checkout_total",
                 "c = Cart()"]
        for price, qty in items:
            lines.append(f"c.add_item({price!r}, {qty!r})")
        lines.append(f"print(checkout_total(c, {flat_discount!r}, {tax_rate!r}))")
        code = "\n".join(lines) + "\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for items, flat_discount, tax_rate in CASES:
            want = _expected(items, flat_discount, tax_rate)
            r = _run(items, flat_discount, tax_rate)
            case = f"checkout_total(items={items}, discount={flat_discount}, tax={tax_rate})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            out = r.stdout.strip()
            try:
                got = float(out)
            except ValueError:
                _emit(False, case=case, expected=str(want), actual=out,
                      stage="behavior", reason_code="non_numeric_output")
            # Tolerant float compare (not exact string equality): rounding a
            # currency amount to 2dp can print as "16.2" not "16.20", and
            # binary-float noise at the 1e-9 level must not fail an
            # otherwise-correct solution.
            if abs(got - want) >= 0.005:
                _emit(False, case=case, expected=str(want), actual=str(got),
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [cart.py, pricing.py, NOTES.md]
allowed_diff_paths: [checkout.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (HARD tier, task-b8hard) -- the "hard multi-file" slot
  of the harder-B8 build brief: unlike py-multifile-01 (task-09.yaml,
  where the fix genuinely requires TWO independent edits across
  calc.py/formatter.py), the difficulty here is that `checkout.py`'s bug
  is an ORDER-OF-OPERATIONS/interaction bug -- `cart.py` and `pricing.py`
  are each individually correct and internally consistent with their own
  docstrings, so reading either one in isolation reveals nothing wrong.
  The only way to see the bug is to hold the stated business rule
  (discount before tax) up against `checkout.py`'s actual call order
  (`apply_tax` then `apply_discount` -- swapped) and notice the mismatch.
  A model that skims `checkout.py`, sees it calls both pricing functions
  and superficially "looks like it does the right thing," can easily miss
  this without deliberately checking the ORDER against the spec.

  Chosen so the bug is mathematically order-SENSITIVE (this is not
  automatic -- if the discount were a percentage rather than a flat
  dollar amount, `subtotal*(1-d)*(1+t)` and `subtotal*(1+t)*(1-d)` are
  algebraically IDENTICAL by commutativity, and the "bug" would be
  invisible no matter the order): with a flat-dollar discount and a
  percentage tax, `(subtotal - discount) * (1 + tax)` (correct) and
  `(subtotal * (1 + tax)) - discount` (buggy, current) generally differ,
  because the buggy order charges tax on the soon-to-be-discounted
  portion too. Case 4 (`discount == subtotal`, i.e. a fully-discounted
  cart) is the sharpest discriminator: correct gives exactly `0.00`
  (nothing left to tax), while the buggy order gives `subtotal * tax`
  (leftover tax charged on money the customer never owed) -- a case
  chosen specifically because the two answers are not just numerically
  different but qualitatively so (zero vs. nonzero).

  Verified empirically (task-b8hard authoring): a correctly-reordered
  reference (`apply_discount` then `apply_tax`) passes every case; the
  ORIGINAL unfixed file (`apply_tax` then `apply_discount`, exactly as
  shipped above) fails on the very first case, `checkout_total(items=
  [(10.0, 2)], discount=5.0, tax=0.08)` -> `16.6` (want `16.2`) -- proving
  the oracle discriminates on the intended interaction bug, not just on
  total breakage.

  Ground truth computed LIVE in the oracle from the raw `items` list
  (`subtotal = sum(price*qty...)`, then the correctly-ordered formula) --
  INDEPENDENT of `cart.py`/`pricing.py` (belt-and-suspenders on top of
  their protected-hash check) and compared with a small float tolerance
  (`abs(got - want) < 0.005`), not brittle string equality on a rounded
  currency float's `repr` (e.g. `round(16.20, 2)` prints as `"16.2"`, not
  `"16.20"`) -- removing both transcription risk and floating-point-repr
  risk from the oracle itself.

  Hidden oracle, SUBPROCESS-ISOLATED from the start (mirrors every
  existing Python B8 oracle): `checkout`/`cart` are never `import`ed into
  this checker's own process; each case builds a real `Cart` and calls the
  candidate `checkout_total` inside a fresh `python3 -c "..."` subprocess,
  asserting on ITS stdout from the outside -- a module-level
  `sys.exit(0)` in `checkout.py` can only kill its own throwaway
  subprocess (verified directly, task-b8hard authoring, against a
  `sys.exit(0)`-at-import variant of the correct reference, which still
  correctly fails). `oracle_test.py` lives in `oracle_files`, never
  written into the agent's workspace. Stdlib only (`subprocess`, `sys`) --
  no pytest.

  `cart.py`/`pricing.py` are agent-VISIBLE, protected, hash-checked
  (Design Decision #1a) -- both individually correct, so a model cannot
  "fix" the wrong file and still pass; only `checkout.py` is in
  `allowed_diff_paths`. `NOTES.md` is the agent-VISIBLE protected fixture
  exercising the hash-cap, same convention as every other manifest.

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.0.0 -> 1.1.0): see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full
  `{"pass","stage","reason_code","case","expected","actual","exit_status"}`
  convention and closed vocabulary -- same `_emit`/`_classify_crash`
  pattern as py-bugfix-01/task-06.yaml. This task's THIRD, task-specific
  reason code, `non_numeric_output` (stage `behavior`), covers the
  pre-existing "candidate printed something that isn't a float at all"
  branch -- distinct from `wrong_output` (a numeric answer, just the wrong
  one) and from a `compile`/`import`-stage crash.
