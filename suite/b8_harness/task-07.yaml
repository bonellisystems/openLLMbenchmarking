id: py-fromscratch-01
shape: from-scratch
task_version: "1.2.0"
prompt: |
  Write a NEW Python file `textutils.py` (the repo has no such file yet)
  that defines a function `is_palindrome(s)`. Given a string, it must
  return `True` if the string reads the same forwards and backwards once
  you ignore case and drop every character that isn't a letter or digit,
  and `False` otherwise. E.g.:

      >>> is_palindrome("A man, a plan, a canal: Panama")
      True
      >>> is_palindrome("hello")
      False
      >>> is_palindrome("")
      True

  Create exactly one new file, `textutils.py`. Do not create or edit any
  other file (including `NOTES.md`).
allowed_tools: [write_file, bash_exec]
budgets: {wall_clock_s: 180, tokens: 3000, steps: 8}
setup_repo:
  NOTES.md: |
    # textutils

    See the task prompt for the exact contract `textutils.py` must satisfy.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    CASES = [
        ("A man, a plan, a canal: Panama", True),
        ("hello", False),
        ("", True),
        ("Was it a car or a cat I saw?", True),
        ("Python", False),
        ("No lemon, no melon", True),
        ("12321", True),
        ("12345", False),
    ]


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(s):
        """Run `textutils.is_palindrome(s)` in a FRESH subprocess and
        return the completed process -- never `import textutils` into
        THIS process (task-b8expand hardening: a module-level
        `sys.exit(0)` in the candidate solution can only kill the
        throwaway subprocess, not this checker -- see
        llmtest/harness/tasks.py module docstring)."""
        code = f"import textutils\nprint(bool(textutils.is_palindrome({s!r})))\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for s, want in CASES:
            r = _run(s)
            case = f"is_palindrome({s!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != str(want):
                _emit(False, case=case, expected=str(want), actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [textutils.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: from-scratch -- Python counterpart of suite/b8_harness/task-04.yaml
  (scratch-01, `is_prime.sh` written from nothing); this task writes a
  DIFFERENT small function (`is_palindrome`) rather than the identical
  spec, for variety across the two from-scratch manifests now in this
  suite. Added (task-b8local) for the same reason as py-bugfix-01: a real
  Python task the pinned nvidia/cuda sandbox image cannot run directly
  (no Python interpreter), scored inside `python:3.11-slim` via
  suite.yaml's `b8.sandbox.oracle_image` seam.

  Hidden oracle: `oracle_test.py` lives in `oracle_files`, never written
  into the agent's workspace -- the exact probe strings (including the two
  boundary/negative cases, "hello" and "Python") can't be read and
  special-cased. `run_oracle` re-injects it into a private copy only at
  validation time, then calls `is_palindrome` across palindromes,
  non-palindromes, an empty string, and a numeric-string case -- a
  genuinely behavioral pass/fail. `textutils.py` does not exist in
  `setup_repo` at all; it is only listed in `allowed_diff_paths`, which
  the diff-constraint (run_oracle Design Decision #1b) treats as "this
  exact new path may be created." Stdlib only (`subprocess`, `sys`) -- no
  pytest.

  SUBPROCESS-ISOLATED (task-b8expand hardening, task_version 1.0.0 ->
  1.1.0 -- codex review Important #1, same finding/fix as
  py-bugfix-01/task-06.yaml): the 1.0.0 oracle `import`ed `textutils`
  straight into this checker's own process, so a module-level
  `sys.exit(0)` in the candidate `textutils.py` would kill the whole
  oracle with exit code 0 before any case ran, and `hidden_validate`
  (exit-code-only) would wrongly report a pass. The 1.1.0 oracle instead
  launches a brand-new `python3 -c "import textutils; print(...)"`
  subprocess PER CASE and asserts on ITS stdout from the outside -- a
  `sys.exit(0)` in `textutils.py` now only kills that one throwaway
  subprocess, leaving no output to match, so the comparison still
  correctly fails.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a).

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.1.0 -> 1.2.0): see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full
  `{"pass","stage","reason_code","case","expected","actual","exit_status"}`
  convention and closed vocabulary -- same `_emit`/`_classify_crash`
  pattern as py-bugfix-01/task-06.yaml, adapted to this task's single-arg
  `is_palindrome(s)` cases.
