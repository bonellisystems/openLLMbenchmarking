    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    def _check_numeric(code, case, want):
        r = _run(code)
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=str(want), actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if not _numeric_match(got, want):
            _emit(False, case=case, expected=str(want), actual=got,
                  stage="behavior", reason_code="wrong_output")


    def _check_exact(code, case, want):
        r = _run(code)
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=want, actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != want:
            _emit(False, case=case, expected=want, actual=got,
                  stage="behavior", reason_code="wrong_output")


    def _check_type(code, case, want_type_name):
        r = _run(code)
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=want_type_name, actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != want_type_name:
            _emit(False, case=case, expected=want_type_name, actual=got,
                  stage="behavior", reason_code="wrong_output")


    def _construct_raises_code(expr):
        # Deliberately does NOT call .area()/.perimeter() -- only
        # constructs -- to prove validation happens EAGERLY in __init__,
        # not lazily inside a method.
        return (
            "import shapes\n"
            "try:\n"
            f"    {expr}\n"
            "    print('NO_EXCEPTION')\n"
            "except ValueError:\n"
            "    print('ValueError')\n"
            "except Exception as e:\n"
            "    print(type(e).__name__)\n"
        )


    def main():
        _check_numeric(
            "import shapes\nprint(shapes.Triangle(3, 4, 5).area())\n",
            "Triangle(3, 4, 5).area()  # right triangle", 6.0)
        _check_numeric(
            "import shapes\nprint(shapes.Triangle(3, 4, 5).perimeter())\n",
            "Triangle(3, 4, 5).perimeter()", 12.0)
        _check_numeric(
            "import shapes\nprint(shapes.Triangle(2, 2, 2).area())\n",
            "Triangle(2, 2, 2).area()  # equilateral", 1.7320508)
        _check_numeric(
            "import shapes\nprint(shapes.Triangle(2, 2, 2).perimeter())\n",
            "Triangle(2, 2, 2).perimeter()", 6.0)

        # EAGER validation: raises at CONSTRUCTION, before area()/perimeter()
        # is ever called.
        _check_type(_construct_raises_code("shapes.Triangle(1, 1, 3)"),
                    "Triangle(1, 1, 3)  # violates triangle inequality, construction only", "ValueError")
        _check_type(_construct_raises_code("shapes.Triangle(-1, 2, 2)"),
                    "Triangle(-1, 2, 2)  # negative side, construction only", "ValueError")
        _check_type(_construct_raises_code("shapes.Triangle(0, 2, 2)"),
                    "Triangle(0, 2, 2)  # zero side, construction only", "ValueError")
        _check_type(_construct_raises_code("shapes.Triangle(5, 1, 1)"),
                    "Triangle(5, 1, 1)  # degenerate/impossible, construction only", "ValueError")
        _check_type(_construct_raises_code("shapes.Triangle(2, 1, 1)"),
                    "Triangle(2, 1, 1)  # exact boundary (2 == 1+1), STRICT inequality required", "ValueError")
        _check_type(_construct_raises_code("shapes.Triangle('3', 4, 5)"),
                    "Triangle('3', 4, 5)  # non-numeric side, must be ValueError not TypeError", "ValueError")

        # describe()/total_area() -- the protected existing callers.
        _check_exact(
            "import shapes, shape_report\nprint(shape_report.describe(shapes.Triangle(3, 4, 5)))\n",
            "shape_report.describe(Triangle(3, 4, 5))", "Triangle: area=6.00, perimeter=12.00")
        _check_numeric(
            "import shapes, shape_report\n"
            "print(shape_report.total_area([shapes.Rectangle(2, 3), shapes.Triangle(3, 4, 5), shapes.Circle(1)]))\n",
            "shape_report.total_area([Rectangle, Triangle, Circle])", 6 + 6 + 3.14159265)

        # Regression: Rectangle/Circle must still validate correctly --
        # shapes.py is agent-editable (not hash-protected), so this is the
        # only thing catching accidental collateral damage while adding
        # Triangle.
        _check_type(_construct_raises_code("shapes.Rectangle(-1, 2)"),
                    "Rectangle(-1, 2)  # regression", "ValueError")
        _check_type(_construct_raises_code("shapes.Circle(0)"),
                    "Circle(0)  # regression", "ValueError")
        _check_numeric(
            "import shapes\nprint(shapes.Rectangle(2, 3).area())\n",
            "Rectangle(2, 3).area()  # regression", 6.0)

        _emit(True)


    if __name__ == "__main__":
        main()
