notes: |
  Shape: multi-file (Wave 4, W4B2 feature-integration batch) -- implement
  a new subclass against an existing ABC, matching not just its ABSTRACT
  METHOD signatures but an unwritten-but-observable PATTERN the existing
  concrete classes follow: eager (`__init__`-time) validation rather than
  lazy (first-method-call-time) validation. The trap is exactly this
  timing distinction -- deferring the triangle-inequality/positivity check
  into `area()`/`perimeter()` (e.g. `if self._is_valid(): ... else: raise
  ValueError(...)` written inside `area()`) would make every case that
  calls `.area()`/`.perimeter()` on an invalid triangle still correctly
  raise, but a construction-only check (build the object, never call a
  method on it) would silently succeed -- exactly what
  `_construct_raises_code` isolates by deliberately NOT calling either
  method. Also tests: the triangle inequality itself, STRICT not
  non-strict -- `(5, 1, 1)` is an outright violation (5 > 1+1) any
  reasonable check catches, but the load-bearing boundary case is
  `(2, 1, 1)` (2 == 1+1 exactly, three colinear points, not a real
  triangle), which only a STRICT `<` (equivalently `>=` on the "invalid"
  side of the check) rejects -- a non-strict `<=`/`>` variant wrongly
  accepts it. A separate case, a non-numeric side (`Triangle('3', 4,
  5)`), isolates the type-check half of validation from the
  positivity/inequality half: interestingly, a negative or zero side is
  ALWAYS caught by the strict pairwise-sum inequality alone (a algebraic
  consequence: if one side is <= 0, at least one of the other two
  pairwise-sum comparisons is forced to trigger), so positivity checks add
  no NEW coverage beyond what the inequality already catches for numeric
  input -- but a non-numeric side bypasses the inequality's own `<`/`>=`
  comparison with a `TypeError`, not a `ValueError`, unless there's an
  explicit `isinstance` guard first. Also non-regression on the two
  pre-existing shapes (since `shapes.py` is agent-editable, not protected,
  so a clumsy rewrite could break `Rectangle`/`Circle` without tripping
  any hard-cap check).

  Verified empirically (hermetic, host python): the reference passes every
  case; a `wrong` fixture that validates lazily (inside `area()`/
  `perimeter()` rather than `__init__`) passes every case EXCEPT the six
  construction-only ones, which report `actual` `NO_EXCEPTION`; a `wrong`
  fixture using a non-strict triangle-inequality check wrongly accepts the
  `(2, 1, 1)` boundary case at construction (`actual` `NO_EXCEPTION`,
  want `ValueError`); a `wrong` fixture that drops the `isinstance` type
  check (but keeps the correct strict inequality) wrongly lets
  `Triangle('3', 4, 5)` raise `TypeError` instead of `ValueError`.
