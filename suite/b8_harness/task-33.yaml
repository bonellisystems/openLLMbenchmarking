  shapes.py: |
    from abc import ABC, abstractmethod
    import math


    class Shape(ABC):
        @abstractmethod
        def area(self):
            raise NotImplementedError

        @abstractmethod
        def perimeter(self):
            raise NotImplementedError


    class Rectangle(Shape):
        def __init__(self, width, height):
            if not (isinstance(width, (int, float)) and isinstance(height, (int, float))):
                raise ValueError("width and height must be numbers")
            if width <= 0 or height <= 0:
                raise ValueError("width and height must be positive")
            self.width = width
            self.height = height

        def area(self):
            return self.width * self.height

        def perimeter(self):
            return 2 * (self.width + self.height)


    class Circle(Shape):
        def __init__(self, radius):
            if not isinstance(radius, (int, float)):
                raise ValueError("radius must be a number")
            if radius <= 0:
                raise ValueError("radius must be positive")
            self.radius = radius

        def area(self):
            return math.pi * self.radius ** 2

        def perimeter(self):
            return 2 * math.pi * self.radius
  shape_report.py: |
    def describe(shape):
        """Existing caller: must keep working for any Shape, including
        Triangle once it exists."""
        return f"{type(shape).__name__}: area={shape.area():.2f}, perimeter={shape.perimeter():.2f}"


    def total_area(shapes):
        """Existing caller: sums area() across a mixed list of shapes."""
        return sum(s.area() for s in shapes)
