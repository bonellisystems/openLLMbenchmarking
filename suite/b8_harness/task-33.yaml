id: py-feat-05
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small shape system, split across 2 files:

  - `shapes.py` -- an abstract base class `Shape` with two abstract
    methods, `area(self)` and `perimeter(self)`. Two concrete shapes
    already exist and are correct: `Rectangle(width, height)` and
    `Circle(radius)`. Both VALIDATE EAGERLY, in `__init__`, raising
    `ValueError` immediately at construction time if any dimension is not
    a positive number -- NOT lazily, the first time `area()`/`perimeter()`
    happens to be called.
  - `shape_report.py` -- the EXISTING caller: `describe(shape)` (returns
    `f"{type(shape).__name__}: area={shape.area():.2f},
    perimeter={shape.perimeter():.2f}"`) and `total_area(shapes)` (returns
    `sum(s.area() for s in shapes)`). Must keep working exactly as
    written.

  Add a new concrete shape, `Triangle(a, b, c)` (three side lengths), to
  `shapes.py`, following the SAME pattern `Rectangle`/`Circle` already
  use:
  - `area()` via Heron's formula: `s = (a+b+c)/2`,
    `area = sqrt(s*(s-a)*(s-b)*(s-c))`.
  - `perimeter()` is `a+b+c`.
  - VALIDATE EAGERLY, in `__init__`, exactly like the two existing shapes:
    raise `ValueError` immediately at construction time -- BEFORE
    `area()`/`perimeter()` is ever called -- if any side is not a positive
    number, OR if the three sides don't satisfy the triangle inequality
    (each side must be strictly less than the sum of the other two; three
    sides that can't form a real triangle, e.g. `(1, 1, 3)`, are invalid).

  You may modify ONLY `shapes.py`. Do not create or edit `shape_report.py`
  or `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 14}
