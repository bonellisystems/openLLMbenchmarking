id: py-fromscratch-02
shape: from-scratch
task_version: "1.0.0"
prompt: |
  Write a NEW Python file `exprcalc.py` (the repo has no such file yet)
  that defines a function `evaluate_expression(expr)`. Given a string
  containing non-negative integers, `+`, `-`, `*`, parentheses `(`/`)`,
  and optional spaces, it must evaluate the expression and return the
  integer result, respecting standard operator precedence (`*` binds
  tighter than binary `+`/`-`) and parentheses, with `+`/`-` at the same
  precedence level evaluated LEFT TO RIGHT (e.g. `10 - 2 - 3` is
  `(10 - 2) - 3 = 5`, not `10 - (2 - 3)`). There is no division and no
  unary minus / negative numbers anywhere in the input -- every number in
  `expr` is a non-negative integer literal. E.g.:

      >>> evaluate_expression("2 + 3 * 4")
      14
      >>> evaluate_expression("(2 + 3) * 4")
      20
      >>> evaluate_expression("10 - 2 - 3")
      5
      >>> evaluate_expression("2 * (3 + (4 - 1)) + 5")
      17

  Create exactly one new file, `exprcalc.py`. Do not create or edit any
  other file (including `NOTES.md`).
allowed_tools: [write_file, bash_exec]
budgets: {wall_clock_s: 240, tokens: 4500, steps: 10}
setup_repo:
  NOTES.md: |
    # exprcalc

    See the task prompt for the exact contract `exprcalc.py` must
    satisfy: `evaluate_expression(expr)`, integers/+/-/*/parens only, `*`
    before `+`/`-`, left-to-right for equal precedence, no division, no
    unary minus.
oracle_files:
  oracle_test.py: |
    import subprocess
    import sys

    CASES = [
        ("2 + 3 * 4", 14),
        ("(2 + 3) * 4", 20),
        ("10 - 2 - 3", 5),
        ("2 * (3 + (4 - 1)) + 5", 17),
        ("100", 100),
        ("1 + 2 + 3 + 4", 10),
        ("2 * 2 * 2", 8),
        ("(1 + 1) * (1 + 1)", 4),
        ("7 - (3 - 1)", 5),
        ("3 * (4 + (5 - 2) * 2)", 30),
    ]


    def _run(expr):
        """Fresh subprocess per case, never `import`ed into THIS process --
        see py-multifile-01's oracle notes for the full anti-gaming
        rationale (a module-level `sys.exit(0)` in the candidate
        `exprcalc.py` can only kill its own throwaway subprocess, leaving
        it with no matching stdout, so the comparison below still
        correctly fails)."""
        code = f"import exprcalc\nprint(exprcalc.evaluate_expression({expr!r}))\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for expr, want in CASES:
            r = _run(expr)
            got = r.stdout.strip()
            if got != str(want):
                print(f"FAIL: evaluate_expression({expr!r}) -> {got!r} "
                      f"(want {want!r}); exit={r.returncode} "
                      f"stderr={r.stderr.strip()!r}")
                sys.exit(1)
        print("PASS")


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [exprcalc.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: from-scratch (task-b8expand) -- the "harder" from-scratch
  counterpart to suite/b8_harness/task-07.yaml (py-fromscratch-01,
  `is_palindrome`): a small recursive-descent-shaped expression evaluator
  with real operator precedence and nested parentheses, rather than a
  single linear scan. Deliberately chosen to be more likely to yield some
  failures across the roster (mixed precedence + left-associativity +
  nesting is a common source of off-by-one/ordering bugs) while still
  being a self-contained, unambiguous spec (no division, no unary minus,
  so there is exactly one correct integer result per case -- no floating-
  point or truncation-direction ambiguity to fight the oracle over).

  Hidden oracle, SUBPROCESS-ISOLATED from the start (task-b8expand
  hardening, mirrors py-bugfix-01/py-fromscratch-01/py-edit-01/
  py-multifile-01/py-toolheavy-01): each case `import`s the candidate
  `exprcalc.py` inside its OWN fresh `python3` subprocess, never inside
  this checker's own process -- a module-level `sys.exit(0)` cannot
  short-circuit this oracle's exit code, only starve its own subprocess
  of the matching stdout the comparison requires. `exprcalc.py` does not
  exist in `setup_repo` at all -- only in `allowed_diff_paths`, which the
  diff-constraint (run_oracle Design Decision #1b) treats as "this exact
  new path may be created." `oracle_test.py` lives in `oracle_files`,
  never written into the agent's workspace -- the 10 exact probe
  expressions/results can't be read and special-cased. Stdlib only
  (`subprocess`, `sys`) -- no pytest.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a).
