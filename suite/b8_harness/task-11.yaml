id: py-fromscratch-02
shape: from-scratch
task_version: "1.1.0"
prompt: |
  Write a NEW Python file `exprcalc.py` (the repo has no such file yet)
  that defines a function `evaluate_expression(expr)`. Given a string
  containing non-negative integers, `+`, `-`, `*`, parentheses `(`/`)`,
  and optional spaces, it must evaluate the expression and return the
  integer result, respecting standard operator precedence (`*` binds
  tighter than binary `+`/`-`) and parentheses, with `+`/`-` at the same
  precedence level evaluated LEFT TO RIGHT (e.g. `10 - 2 - 3` is
  `(10 - 2) - 3 = 5`, not `10 - (2 - 3)`). There is no division and no
  unary minus / negative numbers anywhere in the input -- every number in
  `expr` is a non-negative integer literal. E.g.:

      >>> evaluate_expression("2 + 3 * 4")
      14
      >>> evaluate_expression("(2 + 3) * 4")
      20
      >>> evaluate_expression("10 - 2 - 3")
      5
      >>> evaluate_expression("2 * (3 + (4 - 1)) + 5")
      17

  Create exactly one new file, `exprcalc.py`. Do not create or edit any
  other file (including `NOTES.md`).
allowed_tools: [write_file, bash_exec]
budgets: {wall_clock_s: 240, tokens: 4500, steps: 10}
setup_repo:
  NOTES.md: |
    # exprcalc

    See the task prompt for the exact contract `exprcalc.py` must
    satisfy: `evaluate_expression(expr)`, integers/+/-/*/parens only, `*`
    before `+`/`-`, left-to-right for equal precedence, no division, no
    unary minus.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    CASES = [
        ("2 + 3 * 4", 14),
        ("(2 + 3) * 4", 20),
        ("10 - 2 - 3", 5),
        ("2 * (3 + (4 - 1)) + 5", 17),
        ("100", 100),
        ("1 + 2 + 3 + 4", 10),
        ("2 * 2 * 2", 8),
        ("(1 + 1) * (1 + 1)", 4),
        ("7 - (3 - 1)", 5),
        ("3 * (4 + (5 - 2) * 2)", 30),
    ]


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(expr):
        """Fresh subprocess per case, never `import`ed into THIS process --
        see py-multifile-01's oracle notes for the full anti-gaming
        rationale (a module-level `sys.exit(0)` in the candidate
        `exprcalc.py` can only kill its own throwaway subprocess, leaving
        it with no matching stdout, so the comparison below still
        correctly fails)."""
        code = f"import exprcalc\nprint(exprcalc.evaluate_expression({expr!r}))\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for expr, want in CASES:
            r = _run(expr)
            case = f"evaluate_expression({expr!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != str(want):
                _emit(False, case=case, expected=str(want), actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [exprcalc.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: from-scratch (task-b8expand) -- the "harder" from-scratch
  counterpart to suite/b8_harness/task-07.yaml (py-fromscratch-01,
  `is_palindrome`): a small recursive-descent-shaped expression evaluator
  with real operator precedence and nested parentheses, rather than a
  single linear scan. Deliberately chosen to be more likely to yield some
  failures across the roster (mixed precedence + left-associativity +
  nesting is a common source of off-by-one/ordering bugs) while still
  being a self-contained, unambiguous spec (no division, no unary minus,
  so there is exactly one correct integer result per case -- no floating-
  point or truncation-direction ambiguity to fight the oracle over).

  Hidden oracle, SUBPROCESS-ISOLATED from the start (task-b8expand
  hardening, mirrors py-bugfix-01/py-fromscratch-01/py-edit-01/
  py-multifile-01/py-toolheavy-01): each case `import`s the candidate
  `exprcalc.py` inside its OWN fresh `python3` subprocess, never inside
  this checker's own process -- a module-level `sys.exit(0)` cannot
  short-circuit this oracle's exit code, only starve its own subprocess
  of the matching stdout the comparison requires. `exprcalc.py` does not
  exist in `setup_repo` at all -- only in `allowed_diff_paths`, which the
  diff-constraint (run_oracle Design Decision #1b) treats as "this exact
  new path may be created." `oracle_test.py` lives in `oracle_files`,
  never written into the agent's workspace -- the 10 exact probe
  expressions/results can't be read and special-cased. Stdlib only
  (`subprocess`, `sys`) -- no pytest.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a).

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.0.0 -> 1.1.0): see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full
  `{"pass","stage","reason_code","case","expected","actual","exit_status"}`
  convention and closed vocabulary -- same `_emit`/`_classify_crash`
  pattern as py-bugfix-01/task-06.yaml, adapted to this task's single-arg
  `evaluate_expression(expr)` cases.
check_fixtures:
  reference:
    exprcalc.py: |
      def evaluate_expression(expr):
          tokens = _tokenize(expr)
          pos = [0]

          def parse_expr():
              value = parse_term()
              while pos[0] < len(tokens) and tokens[pos[0]] in ('+', '-'):
                  op = tokens[pos[0]]
                  pos[0] += 1
                  rhs = parse_term()
                  value = value + rhs if op == '+' else value - rhs
              return value

          def parse_term():
              value = parse_factor()
              while pos[0] < len(tokens) and tokens[pos[0]] == '*':
                  pos[0] += 1
                  rhs = parse_factor()
                  value = value * rhs
              return value

          def parse_factor():
              tok = tokens[pos[0]]
              if tok == '(':
                  pos[0] += 1
                  value = parse_expr()
                  pos[0] += 1
                  return value
              pos[0] += 1
              return int(tok)

          return parse_expr()


      def _tokenize(expr):
          tokens = []
          i = 0
          while i < len(expr):
              c = expr[i]
              if c.isspace():
                  i += 1
                  continue
              if c in '+-*()':
                  tokens.append(c)
                  i += 1
                  continue
              if c.isdigit():
                  j = i
                  while j < len(expr) and expr[j].isdigit():
                      j += 1
                  tokens.append(expr[i:j])
                  i = j
                  continue
              raise ValueError(f'unexpected character: {c!r}')
          return tokens
  alternate:
    exprcalc.py: |
      class _Parser:
          def __init__(self, tokens):
              self.tokens = tokens
              self.pos = 0

          def parse_expr(self):
              value = self.parse_term()
              while self.pos < len(self.tokens) and self.tokens[self.pos] in ('+', '-'):
                  op = self.tokens[self.pos]
                  self.pos += 1
                  rhs = self.parse_term()
                  value = value + rhs if op == '+' else value - rhs
              return value

          def parse_term(self):
              value = self.parse_factor()
              while self.pos < len(self.tokens) and self.tokens[self.pos] == '*':
                  self.pos += 1
                  rhs = self.parse_factor()
                  value = value * rhs
              return value

          def parse_factor(self):
              tok = self.tokens[self.pos]
              if tok == '(':
                  self.pos += 1
                  value = self.parse_expr()
                  self.pos += 1
                  return value
              self.pos += 1
              return int(tok)


      def evaluate_expression(expr):
          tokens = _tokenize(expr)
          return _Parser(tokens).parse_expr()


