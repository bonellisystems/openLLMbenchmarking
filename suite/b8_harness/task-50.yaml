notes: |
  Shape: multi-file (Wave 4, W4B3 robustness/security/perf batch) -- a
  nested-list parser whose central adversarial case is DEPTH, not size:
  Python's default recursion limit (~1000) is the real constraint a
  recursive-descent parser hits, at a depth (3000) that is otherwise a
  completely unremarkable amount of input (a few KB of text). A separate,
  generous-timeout LARGE-FLAT-WIDTH case (50,000 elements) checks the
  orthogonal "don't be accidentally quadratic" property without
  penalizing a correct-but-not-hyper-optimized O(n) or O(n log n)
  solution. Traps:
  1. The starter's own recursive-descent parser -- correct on every
     BASIC_CASES/MALFORMED_CASES entry (none of those nest more than a
     handful of levels), only exposed by the dedicated 3000-deep case.
  2. An iterative (recursion-safe) rewrite that drops comma-placement
     validation while making the stack explicit (a plausible
     simplification once you're no longer threading state through
     recursive calls) -- passes the deep-nesting case (it genuinely IS
     recursion-safe) and every well-formed case, but silently accepts
     `"[1,2,]"` (trailing comma) and would also mishandle
     `"[1 2]"` (missing comma) since commas are never actually checked.
  3. An iterative rewrite that forgets to guard `stack.pop()` on `']'`
     against an EMPTY stack -- crashes with `IndexError` (a raw,
     un-translated Python exception) instead of raising `ValueError` on
     an extra/unmatched closing bracket.

  Verified empirically: `check_fixtures.wrong[0]` (the starter's
  recursive-descent parser) passes every BASIC_CASES/MALFORMED_CASES
  entry and fails the 3000-deep nesting case with a `RecursionError`
  (classified `stage=behavior`, `reason_code=runtime_error`).
  `wrong[1]` (iterative but comma-placement-blind) passes the deep-
  nesting case and the first 3 MALFORMED_CASES entries, then fails
  `trailing_comma` (`actual` `'NO_EXCEPTION'`, want `'ValueError'`).
  `wrong[2]` (iterative, unguarded `stack.pop()` on `']'`) passes
  `unbalanced_missing_close` and fails `unbalanced_extra_close` (`actual`
  `'IndexError'`, want `'ValueError'`).
