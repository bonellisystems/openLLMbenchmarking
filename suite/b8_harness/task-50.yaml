prompt: |
  The repo has two files:

  - `mini_parser.py` -- `parse_nested_list(s)`, meant to parse a small
    nested-list mini-language (e.g. `"[1,[2,3],[4,[5,6]]]"` -> `[1, [2,
    3], [4, [5, 6]]]`) into real Python `list`/`int` values. Grammar:
    the top-level input must be a single bracketed list; a list is `[`,
    then zero or more comma-separated VALUES (a value is either an
    integer, optionally `-`-signed, or a nested list), then `]`;
    whitespace is allowed anywhere between tokens and must be ignored.
    Malformed input of any kind (unbalanced brackets, a missing/extra
    comma, a trailing comma, trailing data after the top-level value,
    something other than a list at the top level, an empty string, ...)
    must raise `ValueError` -- cleanly, never a different exception type,
    never a hang.
  - `loader.py` -- an EXISTING caller elsewhere in this codebase:
    `total_leaf_count(s)` parses `s` then recursively counts leaf
    (non-list) values -- relies on `parse_nested_list` actually
    SUCCEEDING (not crashing, not hanging) on well-formed input,
    including deeply-nested well-formed input, and on it raising
    `ValueError` (nothing else) for malformed input. Must keep working
    exactly as written.

  The bug: `mini_parser.py`'s `parse_nested_list` is currently a NAIVE
  RECURSIVE-DESCENT parser -- one Python function call per nesting
  level. This is correct for shallow input, but DEEPLY nested input
  (thousands of levels of `[`) blows Python's interpreter recursion limit
  (`RecursionError`) long before parsing finishes, instead of parsing
  successfully. Rewrite `parse_nested_list` to use an EXPLICIT, HEAP-
  ALLOCATED stack (e.g. a Python list you push/pop) instead of the
  interpreter's call stack, so nesting depth is bounded only by memory,
  not by `sys.getrecursionlimit()` -- every other rule above (malformed-
  input rejection, whitespace tolerance, etc.) is already correct and
  must keep working. A large FLAT list (tens of thousands of comma-
  separated integers, no real nesting) must also keep parsing in
  reasonable time -- avoid any accidental O(n^2) pattern (e.g. repeated
  string concatenation or destructive re-slicing of the whole remaining
  input on every token). Only modify `mini_parser.py` -- do not create or
  edit any other file (including `loader.py` or `NOTES.md`).
