    def parse_nested_list(s):
        """BUG: naive recursive-descent parser -- correct for shallow or
        moderate nesting, but a Python function call per nesting level
        means DEEPLY nested input (thousands of levels) blows the
        interpreter's recursion limit (RecursionError) instead of parsing
        successfully."""
        s = s.strip()
        pos = 0

        def _skip_ws():
            nonlocal pos
            while pos < len(s) and s[pos].isspace():
                pos += 1

        def parse_int():
            nonlocal pos
            start = pos
            if pos < len(s) and s[pos] == "-":
                pos += 1
            if pos >= len(s) or not s[pos].isdigit():
                raise ValueError(f"expected a number at position {start}")
            while pos < len(s) and s[pos].isdigit():
                pos += 1
            return int(s[start:pos])

        def parse_value():
            nonlocal pos
            _skip_ws()
            if pos >= len(s):
                raise ValueError("unexpected end of input")
            if s[pos] == "[":
                return parse_list()
            return parse_int()

        def parse_list():
            nonlocal pos
            if pos >= len(s) or s[pos] != "[":
                raise ValueError(f"expected '[' at position {pos}")
            pos += 1
            items = []
            _skip_ws()
            if pos < len(s) and s[pos] == "]":
                pos += 1
                return items
            while True:
                items.append(parse_value())
                _skip_ws()
                if pos >= len(s):
                    raise ValueError("unterminated list")
                if s[pos] == ",":
                    pos += 1
                    _skip_ws()
                    continue
                if s[pos] == "]":
                    pos += 1
                    return items
                raise ValueError(f"expected ',' or ']' at position {pos}")

        result = parse_value()
        _skip_ws()
        if pos != len(s):
            raise ValueError(f"trailing data at position {pos}")
        if not isinstance(result, list):
            raise ValueError("top-level input must be a list")
        return result
  loader.py: |
    from mini_parser import parse_nested_list


    def total_leaf_count(s):
        """Existing integration: parses a nested-list string and counts
        the total number of leaf (non-list) values -- relies on
        parse_nested_list itself succeeding (never RecursionError, never
        hanging) on well-formed input, including deeply-nested input, and
        on it raising ValueError (nothing else) for malformed input."""
        def _count(x):
            if isinstance(x, list):
                return sum(_count(item) for item in x)
            return 1
        return _count(parse_nested_list(s))
