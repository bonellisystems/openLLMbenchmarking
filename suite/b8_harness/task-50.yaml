    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code, timeout=10):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=timeout)


    BASIC_CASES = [
        ("empty_list", "[]", "[]"),
        ("flat_list", "[1,2,3]", "[1, 2, 3]"),
        ("nested_list", "[1,[2,3],[4,[5,6]]]", "[1, [2, 3], [4, [5, 6]]]"),
        ("negative_numbers", "[-1,-2,3]", "[-1, -2, 3]"),
        ("whitespace_tolerant", "[ 1 , 2 , [ 3 , 4 ] ]", "[1, 2, [3, 4]]"),
        ("empty_nested_list", "[[],[]]", "[[], []]"),
    ]

    MALFORMED_CASES = [
        ("unbalanced_missing_close", "[1,2"),
        ("unbalanced_extra_close", "[1,2]]"),
        ("trailing_garbage", "[1,2] extra"),
        ("trailing_comma", "[1,2,]"),
        ("missing_comma", "[1 2]"),
        ("not_a_list_bare_number", "42"),
        ("empty_string", ""),
        ("only_open_bracket", "["),
        ("double_top_level", "[1][2]"),
    ]


    def main():
        for label, input_str, expected in BASIC_CASES:
            code = f"import mini_parser\nprint(mini_parser.parse_nested_list({input_str!r}))\n"
            r = _run(code)
            case = f"parse_nested_list({input_str!r}) [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        for label, input_str in MALFORMED_CASES:
            code = ("import mini_parser\n"
                    f"s = {input_str!r}\n"
                    "try:\n"
                    "    mini_parser.parse_nested_list(s)\n"
                    "    print('NO_EXCEPTION')\n"
                    "except ValueError:\n"
                    "    print('ValueError')\n"
                    "except Exception as e:\n"
                    "    print(type(e).__name__)\n")
            r = _run(code)
            case = f"parse_nested_list({input_str!r}) raises ValueError [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="ValueError", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "ValueError":
                _emit(False, case=case, expected="ValueError", actual=got,
                      stage="behavior", reason_code="wrong_output")

        # Adversarial: thousands of nesting levels -- must NOT RecursionError,
        # and must actually parse correctly (not just "not crash"). Checked
        # with an ITERATIVE unwrap loop on the ORACLE side too (never
        # recursion), so this never risks the checker's own stack.
        depth = 3000
        deep_input = "[" * depth + "1" + "]" * depth
        code = ("import mini_parser\n"
                f"s = {deep_input!r}\n"
                "result = mini_parser.parse_nested_list(s)\n"
                "depth = 0\n"
                "cur = result\n"
                "while isinstance(cur, list):\n"
                "    depth += 1\n"
                "    cur = cur[0]\n"
                "print(f'{depth}:{cur}')\n")
        r = _run(code, timeout=30)
        case = f"parse_nested_list on {depth}-deep nested input"
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=f"{depth}:1", actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != f"{depth}:1":
            _emit(False, case=case, expected=f"{depth}:1", actual=got,
                  stage="behavior", reason_code="wrong_output")

        # Adversarial: a large FLAT list -- generous wall-time bound (an
        # accidental O(n^2) implementation still finishes; only a hang or
        # crash fails this). Written to a driver FILE rather than passed
        # via `-c` -- a 50k-element literal embedded straight into a
        # command-line argument can exceed the OS's max command-line
        # length (observed on Windows; a real risk here specifically
        # because this is the one case with a genuinely large payload).
        width = 50000
        wide_input = "[" + ",".join(str(i) for i in range(width)) + "]"
        driver = ("import mini_parser\n"
                  f"s = {wide_input!r}\n"
                  "result = mini_parser.parse_nested_list(s)\n"
                  "print(f'{len(result)}:{result[0]}:{result[-1]}')\n")
        with open("driver_wide.py", "w") as f:
            f.write(driver)
        try:
            r = subprocess.run([sys.executable, "driver_wide.py"], capture_output=True,
                               text=True, timeout=30)
        except subprocess.TimeoutExpired:
            _emit(False, case=f"parse_nested_list on a {width}-element flat list",
                  expected=f"{width}:0:{width - 1}", actual="TIMEOUT",
                  stage="behavior", reason_code="runtime_error")
        case = f"parse_nested_list on a {width}-element flat list"
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=f"{width}:0:{width - 1}", actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != f"{width}:0:{width - 1}":
            _emit(False, case=case, expected=f"{width}:0:{width - 1}", actual=got,
                  stage="behavior", reason_code="wrong_output")

        integration_cases = [
            ("shallow", "[1,[2,3],4]", "4"),
        ]
        for label, s, expected in integration_cases:
            code = f"import loader\nprint(loader.total_leaf_count({s!r}))\n"
            r = _run(code)
            case = f"loader.total_leaf_count(...) [{label}]  # protected caller"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        _emit(True)


    if __name__ == "__main__":
        main()
