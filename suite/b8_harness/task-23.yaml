id: py-xmod-01
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has three files implementing a tiny record serialization
  format, split across a producer/consumer boundary:

  - `encoder.py` -- `encode_record(fields)`, which turns a dict of
    `str -> str` into a single-line record string.
  - `decoder.py` -- `decode_record(s)`, which parses a record string back
    into a dict. This file defines the ACTUAL escaping contract
    `encode_record` must satisfy: fields are separated by UNESCAPED `;`,
    each field's key/value are separated by the first UNESCAPED `=` in
    that field, and a literal backslash, `;`, or `=` that belongs to a key
    or value must have been escaped by the encoder as `\\`, `\;`, `\=`
    respectively. Read `decoder.py`'s own code/docstring carefully -- it is
    the authoritative spec for exactly how escaping must work.
  - `store.py` -- `roundtrip(fields)`, an EXISTING caller elsewhere in this
    codebase that encodes then decodes a record and returns the result.
    Any correct `encode_record` must satisfy `roundtrip(x) == x` for every
    possible `fields` dict this caller is exercised with, including values
    or keys that themselves contain `;`, `=`, or a literal backslash.

  `encoder.py`'s `encode_record` does not escape anything at all right
  now, so `store.roundtrip` silently loses/corrupts data whenever a field's
  key or value contains one of the delimiter characters. Fix
  `encode_record` so it satisfies the escaping contract `decoder.py`
  (unchanged, correct) expects. Only modify `encoder.py` -- do not create
  or edit any other file (including `decoder.py`, `store.py`, or
  `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 16}
setup_repo:
  encoder.py: |
    def encode_record(fields):
        """Encode `fields` (a dict of str -> str) as a single-line record
        string: 'key1=value1;key2=value2;...'. Must be a valid input to
        decoder.decode_record -- i.e. decode_record(encode_record(x)) == x
        for EVERY possible `fields` dict, including values/keys that contain
        the delimiter characters (';' or '=') or a literal backslash."""
        return ";".join(f"{k}={v}" for k, v in fields.items())
  decoder.py: |
    def decode_record(s):
        """Parse a record string produced by encoder.encode_record back into
        a dict. Fields are separated by UNESCAPED ';'; each field's key and
        value are separated by the first UNESCAPED '=' in that field. A
        literal backslash, semicolon, or equals sign that belongs to a key
        or value must have been escaped by the encoder by prefixing it with
        a single backslash character -- this function reverses exactly that
        escaping. This is the contract encoder.encode_record must satisfy."""
        if s == "":
            return {}
        fields = {}
        for part in _split_unescaped(s, ";"):
            k, v = _split_first_unescaped(part, "=")
            fields[_unescape(k)] = _unescape(v)
        return fields


    def _split_unescaped(s, sep):
        out, buf, esc = [], [], False
        for ch in s:
            if esc:
                buf.append(ch)
                esc = False
            elif ch == "\\":
                buf.append(ch)
                esc = True
            elif ch == sep:
                out.append("".join(buf))
                buf = []
            else:
                buf.append(ch)
        out.append("".join(buf))
        return out


    def _split_first_unescaped(s, sep):
        buf, esc = [], False
        for idx, ch in enumerate(s):
            if esc:
                buf.append(ch)
                esc = False
            elif ch == "\\":
                buf.append(ch)
                esc = True
            elif ch == sep:
                return "".join(buf), s[idx + 1:]
            else:
                buf.append(ch)
        return "".join(buf), ""


    def _unescape(s):
        out, esc = [], False
        for ch in s:
            if esc:
                out.append(ch)
                esc = False
            elif ch == "\\":
                esc = True
            else:
                out.append(ch)
        return "".join(out)
  store.py: |
    from encoder import encode_record
    from decoder import decode_record


    def roundtrip(fields):
        """Existing integration relied on elsewhere: encode then decode a
        record and return the result. Any correct encoder must satisfy
        roundtrip(x) == x for every `fields` dict this caller is exercised
        with -- this is the integration the fix must not break."""
        return decode_record(encode_record(fields))
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    CASES = [
        {"name": "alice", "age": "30"},
        {"note": "a;b"},
        {"expr": "x=y+1"},
        {"path": "C:\\temp"},
        {"a;b": "c=d"},
        {"empty": ""},
        {"x": "1;2", "y": "a=b\\c"},
        {},
        {"k": "\\"},
        {"k": ";;==\\\\"},
        {"multi1": "va=lue", "multi2": "an;other", "multi3": "plain"},
        {"trailing\\": "value\\"},
        {"a=b": "value"},
        {"k=1": "v", "k=2": "w"},
    ]


    def main():
        for fields in CASES:
            want = json.dumps(fields, sort_keys=True)
            code = ("import json\nimport store\n"
                    f"print(json.dumps(store.roundtrip({fields!r}), sort_keys=True))\n")
            r = _run(code)
            case = f"store.roundtrip({fields!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [decoder.py, store.py, NOTES.md]
allowed_diff_paths: [encoder.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 cross-module-contract batch) --
  the classic serializer/deserializer round-trip contract: `decoder.py`
  (protected, correct) defines the escaping convention entirely on its own
  side, and `encoder.py` (the only editable file) must be fixed to match
  it EXACTLY -- there is no way to pass without actually reading
  `decoder.py`'s own splitting/unescaping logic and reverse-engineering
  what escaping it expects. `store.py` is the protected EXISTING CALLER
  central to this task's backward-compat framing: it is what actually gets
  exercised by the oracle (never `encoder.py`/`decoder.py` directly), so a
  fix must make the FULL round trip work, not just look locally
  plausible. Dict comparison uses `json.dumps(..., sort_keys=True)` on
  both sides (never raw dict `repr`/`==` printed from the subprocess) to
  stay independent of the candidate's own key insertion order.

  Verified empirically: the ORIGINAL unfixed `encoder.py` (no escaping at
  all) fails the second case, `roundtrip({"note": "a;b"})` -> decodes back
  as two separate bogus fields (`{"note": "a", "b": ""}` or similar)
  instead of the original single field. `check_fixtures.wrong[1]` (escapes
  `;` but forgets `=`) fails specifically on the `"expr": "x=y+1"` case;
  `check_fixtures.wrong[2]` (escapes `;`/`=` but forgets to escape a
  literal backslash itself) fails specifically on the backslash-containing
  cases (`"path": "C:\\temp"`, `"k": "\\"`).
