      _CONSUMED_KEYS = {"user_name", "full_name", "street", "city", "zip"}


      def migrate_record(record):
          if record.get("schema_version") == 2:
              return dict(record)
          if "user_name" not in record:
              raise KeyError("user_name")

          full_name = record.get("full_name", "")
          stripped = full_name.strip()
          if " " in stripped:
              first_name, last_name = stripped.split(" ", 1)
          else:
              first_name, last_name = stripped, ""

          address = {
              "street": record.get("street", ""),
              "city": record.get("city", ""),
              "zip": record.get("zip", ""),
          }

          result = {k: v for k, v in record.items() if k not in _CONSUMED_KEYS}
          result["username"] = record["user_name"]
          result["first_name"] = first_name
          result["last_name"] = last_name
          result["address"] = address
          if "email" not in result:
              result["email"] = None
          if "active" not in result:
              result["active"] = True
          result["schema_version"] = 2
          return result
