id: py-xmod-02
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has three files implementing a small metrics pipeline, split
  across a producer/consumer boundary:

  - `events.py` -- `make_event(name, value, tags=None)`, the PRODUCER: it
    must create an event dict satisfying the contract
    `{"name": str, "value": float, "tags": dict}` -- `tags` must default to
    a fresh empty dict when not supplied.
  - `aggregator.py` -- `total_by_name(events)`, the CONSUMER: sums each
    event's `"value"` field, grouped by `"name"`. This file defines what
    key names/shapes it actually expects from an event -- it is CORRECT
    and is the authoritative contract producer events must satisfy.
  - `pipeline.py` -- `run_pipeline(records)`, an EXISTING caller elsewhere
    in this codebase that wires `events.make_event` to `aggregator.
    total_by_name` for a list of `(name, value, tags)` records. Must keep
    working after any fix.

  `events.make_event` does not actually satisfy the contract `aggregator.py`
  expects -- reading `aggregator.py` (unchanged, correct) will tell you
  exactly which key names/shapes it needs. Fix `events.make_event` so it
  matches. Only modify `events.py` -- do not create or edit any other file
  (including `aggregator.py`, `pipeline.py`, or `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  events.py: |
    def make_event(name, value, tags=None):
        """Create a metrics event dict. Contract (relied on by
        aggregator.py and any other consumer): {"name": str, "value": float,
        "tags": dict} -- `tags` defaults to a fresh empty dict when not
        supplied."""
        return {"name": name, "val": value, "tags": tags or {}}
  aggregator.py: |
    def total_by_name(events):
        """Sum the "value" field of every event, grouped by "name". Expects
        each event to be shaped exactly per events.make_event's contract."""
        totals = {}
        for e in events:
            totals[e["name"]] = totals.get(e["name"], 0) + e["value"]
        return totals
  pipeline.py: |
    from events import make_event
    from aggregator import total_by_name


    def run_pipeline(records):
        """`records`: a list of (name, value, tags) triples (tags may be
        None). Existing integration wiring events.make_event to
        aggregator.total_by_name -- must keep working."""
        events = [make_event(name, value, tags) for name, value, tags in records]
        return total_by_name(events)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    PIPELINE_CASES = [
        [("cpu", 10, None), ("cpu", 5, None)],
        [("cpu", 10, None), ("mem", 20, None)],
        [("cpu", -5, None), ("cpu", 5, None)],
        [("cpu", 1.5, {"host": "a"}), ("cpu", 2.5, {"host": "b"})],
        [],
        [("x", 0, None)],
        [("a", 1, None), ("a", 2, None), ("a", 3, None), ("a", 4, None), ("a", 5, None)],
    ]


    def _want_pipeline(records):
        totals = {}
        for name, value, tags in records:
            totals[name] = totals.get(name, 0) + value
        return totals


    def main():
        for records in PIPELINE_CASES:
            want = json.dumps(_want_pipeline(records), sort_keys=True)
            code = ("import json\nimport pipeline\n"
                    f"print(json.dumps(pipeline.run_pipeline({records!r}), sort_keys=True))\n")
            r = _run(code)
            case = f"run_pipeline({records})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")

        # Direct contract checks on events.make_event itself -- catches a fix
        # that patches the symptom (pipeline crashing) without fully matching
        # the stated {"name","value","tags"} contract (e.g. the tags-default
        # detail, which run_pipeline's own cases never happen to exercise on
        # their own).
        DIRECT_CASES = [
            (("cpu", 3, None), {"name": "cpu", "value": 3, "tags": {}}),
            (("cpu", 3, {"a": 1}), {"name": "cpu", "value": 3, "tags": {"a": 1}}),
            (("mem", 7.5, None), {"name": "mem", "value": 7.5, "tags": {}}),
        ]
        for (name, value, tags), want_dict in DIRECT_CASES:
            want = json.dumps(want_dict, sort_keys=True)
            code = ("import json\nimport events\n"
                    f"d = events.make_event({name!r}, {value!r}, {tags!r})\n"
                    "print(json.dumps({'name': d['name'], 'value': d['value'], "
                    "'tags': d['tags']}, sort_keys=True))\n")
            r = _run(code)
            case = f"make_event({name!r}, {value!r}, {tags!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [aggregator.py, pipeline.py, NOTES.md]
allowed_diff_paths: [events.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 cross-module-contract batch) --
  a producer/consumer contract mismatch: `events.make_event` stores the
  numeric value under key `"val"`, but `aggregator.total_by_name`
  (protected, correct, the authoritative consumer-side contract) reads
  `e["value"]` -- an immediate `KeyError` two hops away in
  `pipeline.run_pipeline`, the protected existing caller. Direct checks on
  `events.make_event` itself (not just through the pipeline) additionally
  pin the `tags` default-to-`{}` detail, which `run_pipeline`'s own test
  records never happen to exercise in a way that would catch a fix that
  only renames the key.

  Verified empirically: the ORIGINAL unfixed `events.py` fails the very
  first case with a `KeyError: 'value'` crash inside the pipeline
  subprocess (stage `behavior`, reason `runtime_error`).
  `check_fixtures.wrong[1]` (renames "val" -> "value" correctly but drops
  the `tags` default entirely, returning `None` instead of `{}` when
  `tags` is omitted) passes every `PIPELINE_CASES` entry but fails the
  direct `make_event` contract check.
check_fixtures:
  reference:
    events.py: |
      def make_event(name, value, tags=None):
          return {"name": name, "value": value, "tags": tags if tags is not None else {}}
  alternate:
    events.py: |
      def make_event(name, value, tags=None):
          return {"name": name, "value": value, "tags": dict(tags) if tags else {}}
  wrong:
    - events.py: |
        def make_event(name, value, tags=None):
            return {"name": name, "val": value, "tags": tags or {}}
    - events.py: |
        def make_event(name, value, tags=None):
            return {"name": name, "value": value, "tags": tags}
