id: py-xmod-03
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has two files:

  - `discount.py` -- `apply_member_discount(price, member_level)`, which
    applies a member-tier discount to `price`: bronze 0%, silver 10%, gold
    20% (any other/unknown level: 0%). Returns the discounted price
    rounded to 2 decimals.
  - `legacy_caller.py` -- `legacy_receipt_lines()`, an EXISTING function
    elsewhere in this codebase that calls `apply_member_discount` with
    exactly its CURRENT two positional arguments, for a fixed set of
    `(price, level)` pairs, and formats a receipt line per pair. This is
    existing, already-deployed code you must not edit -- it must keep
    producing EXACTLY the same output after your change, byte-for-byte.

  Add bulk-purchase support: extend `apply_member_discount` to accept an
  optional third parameter `bulk_qty` (default `1`). When `bulk_qty >= 10`,
  apply an ADDITIONAL 5% discount on top of (i.e. multiplicatively after)
  the member-tier discount; below 10, no additional discount applies (the
  result must be identical to today). This must be a FULLY
  backward-compatible change: every existing call site in this codebase
  (see `legacy_caller.py`) calls the function with exactly the original two
  positional arguments and depends on getting EXACTLY the same price back
  as before your change -- omitting the new parameter (or passing
  `bulk_qty=1`) must reproduce today's behavior exactly. Only modify
  `discount.py` -- do not create or edit any other file (including
  `legacy_caller.py` or `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  discount.py: |
    def apply_member_discount(price, member_level):
        """Apply a member-tier discount to `price`: bronze 0%, silver 10%,
        gold 20% (any other/unknown level: 0%). Returns the discounted price
        rounded to 2 decimals."""
        rates = {"bronze": 0.0, "silver": 0.10, "gold": 0.20}
        rate = rates.get(member_level, 0.0)
        return round(price * (1 - rate), 2)
  legacy_caller.py: |
    from discount import apply_member_discount


    def legacy_receipt_lines():
        """Existing integration elsewhere in this codebase: calls
        apply_member_discount with exactly its ORIGINAL two positional
        arguments, for a fixed set of (price, level) pairs. Must keep
        producing exactly this output after any change to
        apply_member_discount -- proves a new feature was added in a fully
        backward-compatible way."""
        pairs = [(100.0, "bronze"), (100.0, "silver"), (100.0, "gold"),
                 (49.99, "silver"), (0.0, "gold"), (75.0, "unknown")]
        lines = []
        for price, level in pairs:
            lines.append(f"{level}: ${apply_member_discount(price, level):.2f}")
        return "\n".join(lines)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    def _want_legacy():
        rates = {"bronze": 0.0, "silver": 0.10, "gold": 0.20}
        pairs = [(100.0, "bronze"), (100.0, "silver"), (100.0, "gold"),
                 (49.99, "silver"), (0.0, "gold"), (75.0, "unknown")]
        lines = []
        for price, level in pairs:
            rate = rates.get(level, 0.0)
            lines.append(f"{level}: ${round(price * (1 - rate), 2):.2f}")
        return "\n".join(lines)


    def _want_discount(price, level, bulk_qty=1):
        rates = {"bronze": 0.0, "silver": 0.10, "gold": 0.20}
        rate = rates.get(level, 0.0)
        result = price * (1 - rate)
        if bulk_qty >= 10:
            result *= 0.95
        return round(result, 2)


    DIRECT_CASES = [
        (100.0, "silver", 9),
        (100.0, "silver", 10),
        (100.0, "silver", 11),
        (100.0, "bronze", 10),
        (200.0, "gold", 20),
        (0.0, "gold", 50),
        (100.0, "unknown", 10),
        (100.0, "gold", 1),
        (100.0, "gold", 0),
    ]


    def main():
        # (1) backward-compat proof -- the protected existing caller.
        want = _want_legacy()
        code = "import legacy_caller\nprint(legacy_caller.legacy_receipt_lines())\n"
        r = _run(code)
        case = "legacy_caller.legacy_receipt_lines()"
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=want, actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != want:
            _emit(False, case=case, expected=want, actual=got,
                  stage="behavior", reason_code="wrong_output")

        # (2) new bulk-discount feature, direct calls.
        for price, level, bulk_qty in DIRECT_CASES:
            want_n = _want_discount(price, level, bulk_qty)
            code = ("import discount\n"
                    f"print(discount.apply_member_discount({price!r}, {level!r}, {bulk_qty!r}))\n")
            r = _run(code)
            case = f"apply_member_discount({price}, {level!r}, {bulk_qty})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want_n), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if not _numeric_match(got, want_n):
                _emit(False, case=case, expected=str(want_n), actual=got,
                      stage="behavior", reason_code="wrong_output")

        # (3) omitted bulk_qty must equal explicit bulk_qty=1.
        for price, level in [(100.0, "gold"), (49.99, "silver"), (0.0, "bronze")]:
            want_n = _want_discount(price, level, 1)
            code = ("import discount\n"
                    f"print(discount.apply_member_discount({price!r}, {level!r}))\n")
            r = _run(code)
            case = f"apply_member_discount({price}, {level!r})  # 2-arg call"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want_n), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if not _numeric_match(got, want_n):
                _emit(False, case=case, expected=str(want_n), actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [legacy_caller.py, NOTES.md]
allowed_diff_paths: [discount.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 cross-module-contract batch) --
  "a public function whose signature/behavior other modules depend on"
  (the category description's own example): the task is to EXTEND
  `apply_member_discount` with a new optional parameter while a protected,
  already-deployed caller (`legacy_caller.py`, calling with exactly the
  original 2 positional args) proves the extension is fully backward
  compatible. Unlike this batch's root-cause tasks, there is no planted
  bug in the starting `discount.py` -- the feature is genuinely absent and
  must be added, which is the "cross-module contract" failure mode this
  category also covers (an interface other code depends on must gain a
  capability without breaking anyone already using it).

  Verified empirically: `check_fixtures.wrong[0]` (adds `bulk_qty` as a
  REQUIRED third parameter, no default -- a very plausible "I added the
  parameter" mistake that forgets backward compatibility entirely) breaks
  `legacy_caller.legacy_receipt_lines()` outright with a `TypeError:
  missing 1 required positional argument` (stage `behavior`, reason
  `runtime_error`) -- the single clearest way a change to a shared
  interface can violate this category's contract.
  `check_fixtures.wrong[1]` (applies the bulk discount ADDITIVELY,
  `price*(1-rate) - price*0.05`, instead of multiplicatively) does NOT
  break backward compatibility (the legacy caller never triggers the bulk
  branch) but fails the direct bulk-boundary cases, proving the oracle
  checks the NEW feature's correctness independently of the BC proof.
  `check_fixtures.wrong[2]` (off-by-one: `bulk_qty > 10` instead of `>=
  10`) fails specifically at the `bulk_qty == 10` boundary case.
