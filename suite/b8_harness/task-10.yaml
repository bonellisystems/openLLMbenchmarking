id: py-toolheavy-01
shape: tool-heavy
task_version: "1.1.0"
prompt: |
  The repo has 5 Python modules -- `handler_alpha.py`, `handler_bravo.py`,
  `handler_charlie.py`, `handler_delta.py`, `handler_echo.py` -- each
  defining a function `transform(x)` that is SUPPOSED to implement the
  same contract:

      transform(x) == x * 2 + 1

  Exactly ONE of the 5 files violates this contract. Read/inspect all 5
  files (or test them, e.g. via `bash_exec`) to find which one is wrong,
  then fix ONLY that one file so it correctly implements
  `transform(x) == x * 2 + 1`.

  This task touches many small files -- if your harness supports
  delegating a self-contained subtask like "check all 5 handler_*.py
  files against the contract and report which one is wrong" to a
  subagent, this is a reasonable place to do it.

  Do not edit any of the other 4 handler files, and do not create or edit
  any other file (including `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec, subagent_spawn]
budgets: {wall_clock_s: 240, tokens: 4500, steps: 14}
setup_repo:
  handler_alpha.py: |
    def transform(x):
        return x * 2 + 1
  handler_bravo.py: |
    def transform(x):
        return x * 2 + 1
  handler_charlie.py: |
    def transform(x):
        return x * 2
  handler_delta.py: |
    def transform(x):
        return x * 2 + 1
  handler_echo.py: |
    def transform(x):
        return x * 2 + 1
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    HANDLERS = ["handler_alpha", "handler_bravo", "handler_charlie",
                "handler_delta", "handler_echo"]
    CASES = [0, 1, 2, 5, 10, -3]


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(module):
        """Run `module.transform(x)` for every case in CASES inside a
        FRESH subprocess, one per handler module -- never `import`ed into
        THIS process. See py-multifile-01's oracle notes for the full
        anti-gaming rationale: a module-level `sys.exit(0)` planted in a
        candidate handler can only kill its own throwaway subprocess
        (yielding no matching stdout, so the check below still correctly
        fails), not this checker's own process/exit code."""
        code = (f"import {module}\n"
                f"for x in {CASES!r}:\n"
                f"    print({module}.transform(x))\n")
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        want_lines = [str(x * 2 + 1) for x in CASES]
        want = str(want_lines)
        for module in HANDLERS:
            r = _run(module)
            case = f"{module}.transform over {CASES}"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got_lines = r.stdout.strip().splitlines()
            if got_lines != want_lines:
                _emit(False, case=case, expected=want, actual=str(got_lines),
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [handler_alpha.py, handler_bravo.py, handler_delta.py, handler_echo.py, NOTES.md]
allowed_diff_paths: [handler_charlie.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: tool-heavy (task-b8expand) -- unlike suite/b8_harness/task-05.yaml
  (toolheavy-01, a dynamic-discovery/summing task), this variant is a
  needle-in-a-haystack BUG-FINDING task: the agent must actually
  read/inspect (or run) several files to find WHICH ONE of 5
  near-identical modules violates the stated contract, since nothing in
  the repo points at `handler_charlie.py` specifically. The other 4
  handler files are agent-VISIBLE and individually `protected_shas`-hash-
  checked -- an edit to any of them (e.g. a gamed "fix everything just in
  case") is caught as a hard-cap failure before the behavioral oracle
  ever runs, same mechanism suite/b8_harness/task-05.yaml uses for its
  `data/*.txt` inputs. `protected_paths`/`allowed_diff_paths` are oracle-
  side bookkeeping only -- never surfaced to the agent's workspace or
  tools -- so listing only `handler_charlie.py` as diff-allowed does not
  itself reveal which file is buggy; the agent still has to find it.

  Hidden oracle, SUBPROCESS-ISOLATED (task-b8expand hardening, mirrors
  py-multifile-01/py-bugfix-01/py-fromscratch-01/py-edit-01): each of the
  5 handler modules is `import`ed and exercised inside its OWN fresh
  `python3` subprocess, never inside this checker's own process, so a
  module-level `sys.exit(0)` planted in any handler (correctly-fixed or
  not) cannot short-circuit this oracle's exit code -- it can only starve
  its own subprocess of the matching stdout the comparison requires. The
  oracle also behaviorally re-verifies ALL 5 handlers (not just
  `handler_charlie.py`), reinforcing "the others are untouched" with a
  genuine behavioral check on top of the hash-cap. `oracle_test.py` lives
  in `oracle_files`, never written into the agent's workspace. Stdlib
  only (`subprocess`, `sys`) -- no pytest.

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.0.0 -> 1.1.0): see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full
  `{"pass","stage","reason_code","case","expected","actual","exit_status"}`
  convention and closed vocabulary -- same `_emit`/`_classify_crash`
  pattern as py-bugfix-01/task-06.yaml, adapted so each `case` names the
  WHOLE handler-over-CASES check (`"handler_bravo.transform over [0, 1,
  2, 5, 10, -3]"`) and `expected`/`actual` are the stringified output
  LISTS, not a single scalar.
