    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    OPS_CASES = [
        [("put", "a", 1), ("put", "a", 2), ("get", "a")],
        [("put", "a", 1), ("put", "b", 2), ("put", "a", 3), ("get", "a"), ("get", "b"),
         ("snapshot",)],
        [("get", "missing")],
        [("put", "x", 1), ("put", "x", 2), ("put", "x", 3), ("put", "x", 4), ("put", "x", 5),
         ("get", "x")],
        [("put", "a", 1), ("put", "b", 2), ("put", "c", 3), ("put", "b", 20), ("snapshot",)],
        [("snapshot",)],
        [("put", "k", "v1"), ("get", "k"), ("put", "k", "v2"), ("get", "k"), ("get", "other")],
    ]


    def _simulate(ops):
        d = {}
        results = []
        for op in ops:
            if op[0] == "put":
                _, k, v = op
                d[k] = v
            elif op[0] == "get":
                _, k = op
                results.append(d.get(k))
            elif op[0] == "snapshot":
                results.append(dict(d))
        return results


    def _build_code(backend_cls, ops):
        lines = ["import json", "import backends", "import repository",
                 f"repo = repository.Repository(backends.{backend_cls}())", "results = []"]
        for op in ops:
            if op[0] == "put":
                _, k, v = op
                lines.append(f"repo.save({k!r}, {v!r})")
            elif op[0] == "get":
                _, k = op
                lines.append(f"results.append(repo.load({k!r}))")
            elif op[0] == "snapshot":
                lines.append("results.append(repo.snapshot())")
        lines.append("print(json.dumps(results, sort_keys=True))")
        return "\n".join(lines) + "\n"


    def main():
        for backend_cls in ("DictBackend", "ListBackend"):
            for ops in OPS_CASES:
                want = json.dumps(_simulate(ops), sort_keys=True)
                code = _build_code(backend_cls, ops)
                r = _run(code)
                case = f"{backend_cls}: {ops}"
                if r.returncode != 0:
                    stage, reason_code, actual = _classify_crash(r.stderr)
                    _emit(False, case=case, expected=want, actual=actual,
                          stage=stage, reason_code=reason_code)
                got = r.stdout.strip()
                if got != want:
                    _emit(False, case=case, expected=want, actual=got,
                          stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [repository.py, NOTES.md]
allowed_diff_paths: [backends.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 cross-module-contract batch) --
  a shared, duck-typed backend interface: `repository.Repository`
  (protected, the generic existing caller) is exercised polymorphically
  against BOTH `DictBackend` (already correct) and `ListBackend` (buggy),
  using the IDENTICAL op-sequence per backend class -- the oracle re-runs
  every case against `DictBackend` too, which is what lets it catch a fix
  that "helps" `ListBackend` while accidentally regressing the
  already-correct class (the same file holds both, so there is no
  hash-protect-one-class option; only behavioral re-verification can catch
  this). `put`'s "first match wins" bug affects `get` AND `all_items`
  identically (both scan from the front and stop at the first hit) -- a
  plausible one-line fix might address only one of the two read paths.

  Verified empirically: the ORIGINAL unfixed `ListBackend` fails the very
  first case, `[("put","a",1),("put","a",2),("get","a")]` -> `1` (want
  `2`, the most recent value). `check_fixtures.wrong[1]` (fixes `get()` to
  scan for the LAST match but leaves `all_items()` with the original
  first-match-wins bug) passes every `get`-only case but fails on the
  `snapshot()` cases. `check_fixtures.wrong[2]` (fixes `ListBackend`
  correctly but "while at it" changes `DictBackend.get` to raise
  `KeyError` on a missing key instead of returning `None`) fails the
  `[("get", "missing")]` case against `DictBackend` specifically -- the
  regression-on-the-decoy failure mode this task is built to catch.
