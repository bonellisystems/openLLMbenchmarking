id: py-xmod-05
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has two files:

  - `backends.py` -- two key-value backend classes, `DictBackend` and
    `ListBackend`, that are both supposed to satisfy the EXACT SAME
    contract: `put(key, value)` stores/overwrites a value, `get(key)`
    returns the CURRENT value for `key` (or `None` if it was never
    stored), and `all_items()` returns a fresh dict snapshot reflecting
    only the CURRENT (most recently `put`) value of every key ever stored
    -- a later `put()` for an already-stored key must overwrite, never
    duplicate, its value.
  - `repository.py` -- `class Repository`, an EXISTING generic driver that
    wraps ANY object satisfying the above contract (`save`/`load`/
    `snapshot`, delegating straight to the backend's `put`/`get`/
    `all_items`). It is used with BOTH `DictBackend` and `ListBackend`
    polymorphically and must keep working correctly for BOTH.

  `DictBackend` correctly satisfies the contract. `ListBackend` does not:
  it stores entries internally as a list of `(key, value)` pairs, but
  `put`/`get`/`all_items` don't correctly handle a key being stored more
  than once. Find and fix ONLY `ListBackend`'s bug(s) inside `backends.py`
  so it satisfies the exact same contract `DictBackend` already does --
  `DictBackend` itself must remain exactly as correct as it is today.
  `backends.py` is the only file you may edit (both classes live in it),
  but `DictBackend`'s own behavior must not change. Do not create or edit
  any other file (including `repository.py` or `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 16}
setup_repo:
  backends.py: |
    class DictBackend:
        """A key-value backend. Contract: put(key, value) stores/overwrites
        a value; get(key) returns the CURRENT value for key, or None if
        never stored; all_items() returns a fresh dict snapshot reflecting
        only the CURRENT (most recently put) value of every key ever
        stored."""

        def __init__(self):
            self._data = {}

        def put(self, key, value):
            self._data[key] = value

        def get(self, key):
            return self._data.get(key)

        def all_items(self):
            return dict(self._data)


    class ListBackend:
        """A key-value backend storing entries as a list of (key, value)
        pairs internally. Must satisfy the EXACT SAME contract as
        DictBackend above: a later put() for an already-stored key must
        overwrite (not duplicate) its value, so get()/all_items() always
        reflect only the MOST RECENT value for each key."""

        def __init__(self):
            self._entries = []

        def put(self, key, value):
            self._entries.append((key, value))

        def get(self, key):
            for k, v in self._entries:
                if k == key:
                    return v
            return None

        def all_items(self):
            result = {}
            for k, v in self._entries:
                if k not in result:
                    result[k] = v
            return result
  repository.py: |
    class Repository:
        """A generic backend-agnostic store: wraps any object satisfying the
        put/get/all_items contract (see backends.py)."""

        def __init__(self, backend):
            self.backend = backend

        def save(self, key, value):
            self.backend.put(key, value)

        def load(self, key):
            return self.backend.get(key)

        def snapshot(self):
            return self.backend.all_items()
  NOTES.md: |
