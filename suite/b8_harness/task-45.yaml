    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    PARSE_CASES = [
        ("1.2.3", "(1, 2, 3, ())"),
        ("1.2.3-alpha.1", "(1, 2, 3, ('alpha', '1'))"),
        ("1.2.3+build.5", "(1, 2, 3, ())"),
        ("0.0.0", "(0, 0, 0, ())"),
    ]

    PARSE_ERROR_CASES = ["1.2", "1.2.x", "1.2.3-", "1.2.3-alpha.", "not-a-version"]

    COMPARE_CASES = [
        ("chain_alpha_lt_alpha1", "1.0.0-alpha", "1.0.0-alpha.1", -1),
        ("chain_alpha1_lt_alphabeta", "1.0.0-alpha.1", "1.0.0-alpha.beta", -1),
        ("chain_alphabeta_lt_beta", "1.0.0-alpha.beta", "1.0.0-beta", -1),
        ("chain_beta_lt_beta2", "1.0.0-beta", "1.0.0-beta.2", -1),
        ("chain_beta2_lt_beta11_numeric_not_lexical", "1.0.0-beta.2", "1.0.0-beta.11", -1),
        ("chain_beta11_lt_rc1", "1.0.0-beta.11", "1.0.0-rc.1", -1),
        ("chain_rc1_lt_release", "1.0.0-rc.1", "1.0.0", -1),
        ("reverse_of_beta_chain", "1.0.0-beta.11", "1.0.0-beta.2", 1),
        ("minor_numeric_not_lexical", "1.10.0", "1.9.0", 1),
        ("major_numeric_not_lexical", "10.0.0", "9.9.9", 1),
        ("patch_numeric_not_lexical", "1.0.10", "1.0.9", 1),
        ("equal_versions", "1.2.3", "1.2.3", 0),
        ("build_metadata_ignored_equal", "1.0.0+build1", "1.0.0+build2", 0),
        ("build_metadata_ignored_with_prerelease", "1.0.0-alpha+001", "1.0.0-alpha+002", 0),
    ]


    def main():
        for s, expected in PARSE_CASES:
            r = _run(f"import semver\nprint(repr(semver.parse_version({s!r})))\n")
            case = f"parse_version({s!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        for s in PARSE_ERROR_CASES:
            code = ("import semver\n"
                    "try:\n"
                    f"    semver.parse_version({s!r})\n"
                    "    print('NO_EXCEPTION')\n"
                    "except Exception as e:\n"
                    "    print(type(e).__name__)\n")
            r = _run(code)
            case = f"parse_version({s!r}) raises ValueError"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="ValueError", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "ValueError":
                _emit(False, case=case, expected="ValueError", actual=got,
                      stage="behavior", reason_code="wrong_output")

        for label, a, b, expected in COMPARE_CASES:
            r = _run(f"import semver\nprint(repr(semver.compare_versions({a!r}, {b!r})))\n")
            case = f"compare_versions({a!r}, {b!r}) [{label}]"
            expected_repr = repr(expected)
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected_repr, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected_repr:
                _emit(False, case=case, expected=expected_repr, actual=got,
                      stage="behavior", reason_code="wrong_output")

        integration_cases = [
            ("numeric_minor_gate", "1.10.0", "1.9.0", "True"),
            ("prerelease_below_release_gate", "1.0.0-alpha", "1.0.0", "False"),
            ("build_metadata_ignored_gate", "1.0.0+build5", "1.0.0", "True"),
        ]
        for label, candidate, minimum, expected in integration_cases:
            code = f"import deploy_gate\nprint(deploy_gate.is_compatible({candidate!r}, {minimum!r}))\n"
            r = _run(code)
            case = f"deploy_gate.is_compatible(...) [{label}]  # protected caller"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        _emit(True)


    if __name__ == "__main__":
        main()
