      import re

      _VERSION_RE = re.compile(
          r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-([0-9A-Za-z.-]+))?(\+[0-9A-Za-z.-]+)?$'
      )


      def parse_version(s):
          if not isinstance(s, str):
              raise ValueError("version must be a string")
          m = _VERSION_RE.match(s)
          if not m:
              raise ValueError(f"invalid version: {s!r}")
          major, minor, patch = (int(m.group(1)), int(m.group(2)), int(m.group(3)))
          pre_raw = m.group(5)
          if not pre_raw:
              return (major, minor, patch, ())
          parts = tuple(pre_raw.split("."))
          if any(p == "" for p in parts):
              raise ValueError(f"invalid version: {s!r}")
          return (major, minor, patch, parts)


      def _identifier_key(ident):
          return (0, int(ident)) if ident.isdigit() else (1, ident)


      def _cmp(x, y):
          return (x > y) - (x < y)


      def compare_versions(a, b):
          ma, mi, pa, pre_a = parse_version(a)
          mb, ni, pb, pre_b = parse_version(b)
          core = _cmp((ma, mi, pa), (mb, ni, pb))
          if core != 0:
              return core
          if not pre_a and not pre_b:
              return 0
          if not pre_a:
              return 1
          if not pre_b:
              return -1
          for ia, ib in zip(pre_a, pre_b):
              ka, kb = _identifier_key(ia), _identifier_key(ib)
              if ka[0] != kb[0]:
                  return _cmp(ka[0], kb[0])
              c = _cmp(ka[1], kb[1])
              if c != 0:
                  return c
          return _cmp(len(pre_a), len(pre_b))
