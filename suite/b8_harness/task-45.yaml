      import re

      _VERSION_RE = re.compile(
          r'^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)'
          r'(?:-(?P<prerelease>[0-9A-Za-z.-]+))?'
          r'(?:\+[0-9A-Za-z.-]+)?$'
      )


      def parse_version(s):
          if not isinstance(s, str):
              raise ValueError(f"version must be a string, got {type(s).__name__}")
          m = _VERSION_RE.match(s)
          if not m:
              raise ValueError(f"not a valid semantic version: {s!r}")
          major, minor, patch = int(m.group('major')), int(m.group('minor')), int(m.group('patch'))
          prerelease_raw = m.group('prerelease')
          if prerelease_raw is None:
              prerelease = ()
          else:
              parts = prerelease_raw.split('.')
              for p in parts:
                  if p == "":
                      raise ValueError(f"empty pre-release identifier in {s!r}")
              prerelease = tuple(parts)
          return (major, minor, patch, prerelease)


      def _compare_identifier(a, b):
          a_is_num, b_is_num = a.isdigit(), b.isdigit()
          if a_is_num and b_is_num:
              a_val, b_val = int(a), int(b)
              return (a_val > b_val) - (a_val < b_val)
          if a_is_num and not b_is_num:
              return -1
          if b_is_num and not a_is_num:
              return 1
          return (a > b) - (a < b)


      def _compare_prerelease(a_pre, b_pre):
          if not a_pre and not b_pre:
              return 0
          if not a_pre:
              return 1
          if not b_pre:
              return -1
          for a_id, b_id in zip(a_pre, b_pre):
              c = _compare_identifier(a_id, b_id)
              if c != 0:
                  return c
          return (len(a_pre) > len(b_pre)) - (len(a_pre) < len(b_pre))


      def compare_versions(a, b):
          a_major, a_minor, a_patch, a_pre = parse_version(a)
          b_major, b_minor, b_patch, b_pre = parse_version(b)
          for x, y in ((a_major, b_major), (a_minor, b_minor), (a_patch, b_patch)):
              if x != y:
                  return (x > y) - (x < y)
          return _compare_prerelease(a_pre, b_pre)
