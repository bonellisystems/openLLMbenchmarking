id: py-build-05
shape: from-scratch
task_version: "1.0.0"
prompt: |
  Implement Semantic Versioning 2.0.0 precedence comparison from scratch,
  in a new file `semver.py`, exposing two functions:

  - `parse_version(s)` -- parses a version string
    `MAJOR.MINOR.PATCH(-PRERELEASE)?(+BUILD)?` (`MAJOR`/`MINOR`/`PATCH`
    each a non-negative integer with no leading zero, except `0` itself;
    `PRERELEASE`, if present, a dot-separated list of alphanumeric/hyphen
    identifiers, e.g. `alpha.1`; `BUILD` metadata, if present, is
    completely ignored/discarded -- it plays NO role in precedence at
    all) and returns a 4-tuple `(major: int, minor: int, patch: int,
    prerelease: tuple[str, ...])` -- `prerelease` is `()` when the
    version has no pre-release part. Raises `ValueError` on anything that
    doesn't match this shape (missing a component, a non-numeric
    major/minor/patch, an empty pre-release identifier like the trailing
    `.` in `"1.2.3-alpha."`, etc).
  - `compare_versions(a, b)` -- takes two RAW version strings (parses them
    internally) and returns EXACTLY `-1`, `0`, or `1` (not just "any
    negative/positive number") for `a < b`, `a == b` (same precedence),
    `a > b` respectively, per full semver 2.0.0 precedence rules:
    1. Compare `major`, then `minor`, then `patch`, NUMERICALLY (never as
       strings -- e.g. `"1.10.0"` is greater than `"1.9.0"`, even though
       the string `"10"` sorts before `"9"` lexically).
    2. A version WITH a pre-release part has LOWER precedence than the
       same `major.minor.patch` WITHOUT one (e.g. `"1.0.0-alpha"` <
       `"1.0.0"`).
    3. Two pre-release parts are compared identifier-by-identifier
       (dot-separated fields), left to right:
       - If BOTH identifiers being compared consist only of digits,
         compare them NUMERICALLY (e.g. the identifier `"2"` is less than
         `"11"` -- NOT lexically, where `"11"` would sort first).
       - If exactly one of the two identifiers is purely numeric, the
         numeric one has LOWER precedence than the other, REGARDLESS of
         its value.
       - Otherwise (both contain a letter or hyphen), compare them
         lexically (plain ASCII string ordering).
       - If every identifier compared so far is equal but one pre-release
         has MORE identifiers than the other, the LONGER one has HIGHER
         precedence (e.g. `"1.0.0-alpha"` < `"1.0.0-alpha.1"`).

  An existing file, `deploy_gate.py`, already does
  `is_compatible(candidate, minimum)` (`compare_versions(candidate,
  minimum) >= 0`) -- must keep working exactly as written.

  Create ONLY `semver.py`. Do not create or edit `deploy_gate.py` or
  `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 420, tokens: 8000, steps: 18}
setup_repo:
  deploy_gate.py: |
    from semver import compare_versions


    def is_compatible(candidate, minimum):
        """Existing integration: a deployment gate -- a candidate build is
        compatible if its version has precedence >= the minimum required
        version, per full semver 2.0.0 precedence rules (numeric
        major/minor/patch, then pre-release identifier comparison, with
        build metadata ignored entirely)."""
        return compare_versions(candidate, minimum) >= 0
