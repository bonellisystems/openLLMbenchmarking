notes: |
  Shape: from-scratch (Wave 4, W4B3 build/config batch) -- semver 2.0.0
  precedence, an inherently trap-laden spec even with zero planted bugs
  (difficulty is purely "did you implement the real rules correctly").
  `COMPARE_CASES`'s first 7 entries are the EXACT chain from semver.org's
  own spec example (`1.0.0-alpha < 1.0.0-alpha.1 < 1.0.0-alpha.beta <
  1.0.0-beta < 1.0.0-beta.2 < 1.0.0-beta.11 < 1.0.0-rc.1 < 1.0.0`), so this
  task's oracle is grounded in the authoritative reference ordering, not
  an invented one. Traps:
  1. Comparing `major`/`minor`/`patch` AS STRINGS instead of ints --
     `"1.10.0"` vs `"1.9.0"`: lexically `"10"` < `"9"` (wrong), but
     numerically `10 > 9` (right). Caught by 3 different positions
     (major/minor/patch) so a solution that fixes only one component but
     not the others is still caught.
  2. Numeric PRE-RELEASE identifiers compared as strings instead of ints
     -- `"2"` vs `"11"`: lexically `"11"` < `"2"` (wrong, `'1'` < `'2'` as
     the first character), numerically `2 < 11` (right). Caught by
     `chain_beta2_lt_beta11_numeric_not_lexical` specifically (and its
     reverse-direction pair, to rule out a solution that just always
     returns a fixed sign).
  3. Reversing the release-vs-pre-release rule (treating "no pre-release"
     as LOWER precedence than "has a pre-release", an intuitive-but-wrong
     guess) -- caught by `chain_rc1_lt_release` and the two
     `prerelease_below_release_gate`-style integration checks.

  Verified empirically: `check_fixtures.wrong[0]` (major/minor/patch
  compared as strings) fails `minor_numeric_not_lexical` (`actual` `-1`,
  want `1`) -- the first of the three `_numeric_not_lexical` cases it
  reaches in case order. `wrong[1]` (pre-release identifiers always
  compared lexically, even when both numeric) passes every chain case
  EXCEPT the one built specifically to isolate it,
  `chain_beta2_lt_beta11_numeric_not_lexical` (`actual` `1`, want `-1`).
  `wrong[2]` (release-vs-pre-release precedence reversed) passes every
  identifier-comparison case and fails `chain_rc1_lt_release` (`actual`
  `1`, want `-1`).
