    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _check_exact(code, case, want):
        r = _run(code)
        if r.returncode != 0:
            stage, reason_code, actual = _classify_crash(r.stderr)
            _emit(False, case=case, expected=want, actual=actual,
                  stage=stage, reason_code=reason_code)
        got = r.stdout.strip()
        if got != want:
            _emit(False, case=case, expected=want, actual=got,
                  stage="behavior", reason_code="wrong_output")


    def _publish_code(event_type, payload):
        # Each scenario builds a FRESH app (fresh EventBus, fresh
        # module-level error_counter state, since it's a new subprocess),
        # publishes ONCE, and prints the result as a SET (order of
        # multiple handlers for the same event type isn't part of the
        # contract being tested here, only membership/count) EXCEPT the
        # "info" case, which has exactly one subscriber and is checked
        # as an exact list.
        return (
            "import app\n"
            "bus = app.build_app()\n"
            f"result = bus.publish({event_type!r}, {payload!r})\n"
            "print(sorted(str(x) for x in result))\n"
        )


    def main():
        # Regression: "info" untouched, single subscriber, exact list.
        _check_exact(
            "import app\nbus = app.build_app()\n"
            "print(bus.publish('info', 'hi'))\n",
            "publish('info', 'hi')  # regression, single subscriber", "['LOG: hi']")

        # "error" must now have TWO subscribers: error_counter (unchanged)
        # and the new alert_handler -- both fire, in a fresh bus each time
        # so error_counter's count is always 1 in each of these cases.
        _check_exact(
            _publish_code("error", {"message": "disk full", "severity": "critical"}),
            "publish('error', full payload)  # both handlers fire",
            str(sorted(["ERROR_COUNT: 1", "ALERT: disk full (severity=critical)"])))
        _check_exact(
            _publish_code("error", {"message": "oops"}),
            "publish('error', missing severity)  # defaults to 'unknown'",
            str(sorted(["ERROR_COUNT: 1", "ALERT: oops (severity=unknown)"])))
        _check_exact(
            _publish_code("error", {}),
            "publish('error', {})  # both keys missing, must not raise",
            str(sorted(["ERROR_COUNT: 1", "ALERT:  (severity=unknown)"])))
        _check_exact(
            _publish_code("error", {"severity": "low"}),
            "publish('error', missing message)  # defaults to ''",
            str(sorted(["ERROR_COUNT: 1", "ALERT:  (severity=low)"])))

        # Exactly two handlers fire for "error" -- catches a solution that
        # only registered alert_handler and dropped error_counter, or vice
        # versa, or that never actually called bus.subscribe() at all.
        _check_exact(
            "import app\nbus = app.build_app()\n"
            "print(len(bus.publish('error', {'message': 'x', 'severity': 'y'})))\n",
            "len(publish('error', ...))  # exactly 2 subscribers", "2")

        # Regression: an unregistered event type still returns [], never errors.
        _check_exact(
            "import app\nbus = app.build_app()\n"
            "print(bus.publish('warning', {}))\n",
            "publish('warning', {})  # regression, no subscribers", "[]")

        _emit(True)


    if __name__ == "__main__":
        main()
