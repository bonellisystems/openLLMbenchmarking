id: py-feat-03
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small publish/subscribe event system, split across 3 files:

  - `eventbus.py` -- the EXISTING engine, `EventBus`: `.subscribe(event_type,
    handler)` appends `handler` to that event type's subscriber list
    (order preserved, multiple handlers per event type are supported);
    `.publish(event_type, payload)` calls EVERY subscribed handler for
    `event_type`, in subscription order, with `payload`, and returns a
    list of their return values (an unknown `event_type` with no
    subscribers yields an empty list, never an error).
  - `handlers.py` -- individual handler functions plus `register_all(bus)`,
    which wires them up. Two handlers already exist and are already wired:
    `log_handler(payload)` (subscribed to `"info"`, returns `f"LOG:
    {payload}"`) and `error_counter(payload)` (subscribed to `"error"`,
    increments a module-level counter and returns `f"ERROR_COUNT: {n}"`
    where `n` is the running count).
  - `app.py` -- the EXISTING caller, `build_app()`: constructs an
    `EventBus`, calls `register_all(bus)` on it, and returns the bus. Must
    keep working exactly as written.

  Add a new handler, `alert_handler(payload)`, to `handlers.py`, and
  subscribe it to the `"error"` event type ALONGSIDE the existing
  `error_counter` handler (both must fire when `"error"` is published --
  do not replace or remove `error_counter`'s subscription). Contract:
  `alert_handler` must RETURN (not print) the string
  `f"ALERT: {message} (severity={severity})"`, where `message` is
  `payload.get("message", "")` and `severity` is
  `payload.get("severity", "unknown")` -- it must never raise, even for a
  `payload` missing one or both keys (or an empty dict).

  You may modify ONLY `handlers.py`. Do not create or edit `eventbus.py`,
  `app.py`, or `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 14}
setup_repo:
  eventbus.py: |
    from collections import defaultdict


    class EventBus:
        """Existing pub/sub engine. subscribe() appends to a per-event-type
        list (subscription order preserved, multiple handlers allowed);
        publish() calls every subscribed handler in order and collects
        their RETURN values into a list (an event type with no
        subscribers returns [], never an error)."""

        def __init__(self):
            self._subs = defaultdict(list)

        def subscribe(self, event_type, handler):
            self._subs[event_type].append(handler)

        def publish(self, event_type, payload):
            return [handler(payload) for handler in self._subs[event_type]]
  handlers.py: |
    def log_handler(payload):
        return f"LOG: {payload}"


    _error_count = {"n": 0}


    def error_counter(payload):
        _error_count["n"] += 1
        return f"ERROR_COUNT: {_error_count['n']}"


    def register_all(bus):
        """Existing wiring: subscribes every handler in this module to its
        event type. Must keep subscribing log_handler to "info" and
        error_counter to "error" exactly as today."""
        bus.subscribe("info", log_handler)
        bus.subscribe("error", error_counter)
  app.py: |
    from eventbus import EventBus
    from handlers import register_all


    def build_app():
        """Existing caller: builds a fully-wired EventBus via
        register_all(). Must keep working exactly as written."""
        bus = EventBus()
        register_all(bus)
        return bus
  NOTES.md: |
