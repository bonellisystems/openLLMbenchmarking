notes: |
  Shape: multi-file (Wave 4, W4B2 feature-integration batch) -- register a
  new handler into an EXISTING pub/sub dispatcher, coexisting with an
  already-registered handler for the SAME event type (not a fresh event
  type with no prior subscribers), which is the real coupling test: the
  natural-but-wrong move is to `bus.subscribe("error", alert_handler)`
  by REPLACING the existing `error_counter` wiring rather than adding
  alongside it (e.g. rewriting `register_all` sloppily and dropping the
  `error_counter` line), which the `len(...) == 2` and
  `error_counter`-presence checks both catch. Traps:
  1. Never calling `bus.subscribe("error", alert_handler)` at all (wrote
     the handler function but forgot to wire it) -- every `"error"` case
     shows only 1 result instead of 2.
  2. Dropping the existing `error_counter` subscription while adding the
     new one -- same symptom, `len(...) == 1`, but the surviving element
     is the ALERT string, not the ERROR_COUNT one, so the len-2 check and
     the exact-set checks both independently catch this (whichever
     handler is missing).
  3. `alert_handler` PRINTING instead of RETURNING its message -- `publish`
     collects return values into a list; a `print`-only handler returns
     `None` implicitly, so the set comparison shows `'None'` where the
     ALERT string was expected.
  4. Crashing on a missing `"message"`/`"severity"` key (e.g. `payload
     ["message"]` instead of `payload.get("message", "")`) -- caught by
     the missing-key cases via `_classify_crash`.

  Verified empirically (hermetic, host python): the reference passes every
  case; a `wrong` fixture where `alert_handler` prints instead of returns
  fails the full-payload case with `actual` containing `'None'` instead of
  the ALERT string; a `wrong` fixture that never subscribes
  `alert_handler` fails the `len(...) == 2` case with `actual` `'1'`; a
  `wrong` fixture that replaces (rather than adds to) the `"error"`
  subscription fails the same len-2 case and additionally drops the
  `ERROR_COUNT` string from the set-comparison cases.
