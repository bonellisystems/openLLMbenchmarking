id: py-bugfix-01
shape: bugfix
task_version: "1.2.0"
prompt: |
  The following Python file is supposed to compute and print a summary of a
  list of numbers, but it is broken. Symptom: importing/running it
  immediately raises `SyntaxError: expected ':'` before any output is
  produced -- the program never even starts.

  ```python
  def average(nums):
      total = sum(nums)
      return total / len(nums)

  def summarize(nums)
      avg = average(nums)
      return f"summary: avg={avg:.2f}"
  ```

  Fix `stats.py` so it is valid Python and `summarize(nums)` returns the
  correctly formatted summary string. Only modify `stats.py` -- do not
  create or edit any other file (including `NOTES.md`).
allowed_tools: [read_file, write_file, bash_exec]
budgets: {wall_clock_s: 180, tokens: 3000, steps: 8}
setup_repo:
  stats.py: |
    def average(nums):
        total = sum(nums)
        return total / len(nums)

    def summarize(nums)
        avg = average(nums)
        return f"summary: avg={avg:.2f}"
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    CASES = [
        ([2, 4, 6], "summary: avg=4.00"),
        ([10, 20], "summary: avg=15.00"),
    ]


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(nums):
        """Run `stats.summarize(nums)` in a FRESH subprocess and return the
        completed process -- never `import stats` into THIS process. A
        solution containing a module-level `sys.exit(0)` (or one that
        monkeypatches this checker) can only affect the throwaway
        subprocess, whose observable stdout is then compared against the
        exact expected text; it cannot short-circuit this oracle's own
        exit code the way an in-process `import` could (task-b8expand
        hardening -- see llmtest/harness/tasks.py module docstring)."""
        code = f"import stats\nprint(stats.summarize({nums!r}))\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for nums, want in CASES:
            r = _run(nums)
            case = f"summarize({nums})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [stats.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: bugfix -- Python counterpart of suite/b8_harness/task-03.yaml
  (bugfix-01) and its ultimate source, suite/b6_agenticcoding/task-06.yaml
  (B6 bugfix-01): the exact same planted bug (a missing trailing `:` on the
  `summarize` function signature, causing an immediate parse-time failure
  before any output), reused verbatim in its native language rather than
  re-ported to bash. Added (task-b8local) so B8 has a REAL Python task
  runnable against `python:3.11-slim` (the pinned nvidia/cuda sandbox image
  has no Python interpreter at all -- see llmtest/harness/tasks.py's module
  docstring LANGUAGE NOTE; `python:3.11-slim` is threaded in via
  suite.yaml's `b8.sandbox.oracle_image` -> `run_oracle`'s `oracle_image`
  param -> `Sandbox`, additive over the CUDA pin).

  Hidden oracle: `oracle_test.py` lives in `oracle_files`, never written
  into the agent's workspace by `materialize_repo` -- nothing for the agent
  to read and overfit against. `run_oracle` re-injects it into a private
  copy only at validation time, then runs it via
  `python3 oracle_test.py` (the Python analog of the bash manifests'
  `bash oracle_test.sh`, same `cp -r /oracle /tmp/work && cd /tmp/work &&
  ...` convention). It calls `summarize` with two different inputs,
  checking the real computed average -- not just a compile-only/syntax
  check -- so a "fix" that makes the file import cleanly by
  deleting/no-op-ing `summarize` still fails here. Stdlib only
  (`subprocess`, `sys.exit`, plain `assert`-shaped checks) -- no pytest,
  since `python:3.11-slim` doesn't have it installed.

  SUBPROCESS-ISOLATED (task-b8expand hardening, task_version 1.0.0 ->
  1.1.0 -- codex review Important #1, "the hidden oracle can be read and
  short-circuited by agent code"): the ORIGINAL 1.0.0 oracle did
  `import stats` directly into this checker's own process, which means a
  `stats.py` containing a module-level `sys.exit(0)` (the Python analog
  of the review's bash `source is_prime.sh` / `exit 0` finding) would
  raise `SystemExit(0)` -- NOT caught by the `except Exception` guard --
  and terminate the ENTIRE oracle process with exit code 0 before any
  check ran, at which point `hidden_validate` (which only inspects the
  process's exit code) would wrongly report a pass. The 1.1.0 oracle
  never imports the candidate solution into itself: each case launches a
  brand-new `python3 -c "import stats; print(stats.summarize(...))"`
  subprocess and asserts on ITS stdout from the outside. A `sys.exit(0)`
  planted in `stats.py` now only kills that one throwaway subprocess,
  which then has no output to match the expected text -- so the
  comparison still correctly fails.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a) -- a real, hash-capped fixture, not a placeholder.

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.1.0 -> 1.2.0, "make the
  completion scorer DEFENSIBLE" -- codex review: "avoid free-form stderr as
  the authoritative explanation"): the oracle now prints ONE JSON result
  line as the LAST line of stdout (`{"pass", "stage", "reason_code",
  "case", "expected", "actual", "exit_status"}`, see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full closed
  vocabulary), in addition to the unchanged human-readable PASS/FAIL line.
  `llmtest.harness.tasks.run_oracle` parses it into `det_checks.oracle`'s
  structured fields and derives a clean `detail` string FROM those fields
  (not from raw stdout/stderr). A candidate subprocess that exits nonzero
  before producing comparable output is now also classified into a
  `compile`/`import`/`behavior` stage + `syntax_error`/`import_error`/
  `runtime_error` reason code (`_classify_crash`) rather than falling into
  the same generic wrong-output bucket as a clean run with the wrong
  answer -- this task's planted bug (a `SyntaxError`) is the canonical
  `compile` example.
