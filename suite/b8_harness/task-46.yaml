  alternate:
    template.py: |
      _IDENT_START = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_")
      _IDENT_CONT = _IDENT_START | set("0123456789")


      def render(template, context):
          out = []
          i = 0
          n = len(template)
          while i < n:
              ch = template[i]
              if ch != "$":
                  out.append(ch)
                  i += 1
                  continue
              if i + 1 >= n:
                  raise ValueError("trailing '$' at end of template")
              nxt = template[i + 1]
              if nxt == "$":
                  out.append("$")
                  i += 2
                  continue
              if nxt == "{":
                  end = template.find("}", i + 2)
                  if end == -1:
                      raise ValueError(f"unterminated '${{' at position {i}")
                  name = template[i + 2:end]
                  if not name or name[0] not in _IDENT_START or \
                          any(c not in _IDENT_CONT for c in name[1:]):
                      raise ValueError(f"invalid identifier {name!r} in ${{...}}")
                  if name not in context:
                      raise KeyError(name)
                  out.append(str(context[name]))
                  i = end + 1
                  continue
              if nxt in _IDENT_START:
                  j = i + 1
                  while j < n and template[j] in _IDENT_CONT:
                      j += 1
                  name = template[i + 1:j]
                  if name not in context:
                      raise KeyError(name)
                  out.append(str(context[name]))
                  i = j
                  continue
              raise ValueError(f"invalid placeholder at position {i} in template")
          return "".join(out)
