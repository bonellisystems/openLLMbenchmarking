oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _render_snippet(template, context):
        return ("import template\n"
                f"t = {template!r}\n"
                f"ctx = {context!r}\n"
                "try:\n"
                "    print('OK:' + template.render(t, ctx))\n"
                "except Exception as e:\n"
                "    print('EXC:' + type(e).__name__)\n")


    CASES = [
        ("basic_braced", "Hello, ${name}!", {"name": "World"}, "OK:Hello, World!"),
        ("bare_identifier_stops_at_nonword", "Hi $name!", {"name": "Bob"}, "OK:Hi Bob!"),
        ("escape_dollar", "$$100 for ${item}", {"item": "widget"}, "OK:$100 for widget"),
        ("no_recursive_expansion_braced", "${a}", {"a": "${b}", "b": "x"}, "OK:${b}"),
        ("no_recursive_expansion_bare", "${a}", {"a": "$b", "b": "y"}, "OK:$b"),
        ("missing_braced_var_raises", "${missing}", {}, "EXC:KeyError"),
        ("missing_bare_var_raises", "$missing", {}, "EXC:KeyError"),
        ("invalid_trailing_dollar", "abc$", {}, "EXC:ValueError"),
        ("invalid_digit_after_dollar", "$1abc", {}, "EXC:ValueError"),
        ("empty_template", "", {}, "OK:"),
        ("no_placeholders", "plain text", {}, "OK:plain text"),
        ("multiple_placeholders_same_name", "${x}-${x}", {"x": "Z"}, "OK:Z-Z"),
        ("non_str_value_stringified", "Count: ${n}", {"n": 5}, "OK:Count: 5"),
        ("adjacent_escape_then_brace_literal", "$${x}", {"x": "Q"}, "OK:${x}"),
    ]


    def main():
        for label, template, context, expected in CASES:
            r = _run(_render_snippet(template, context))
            case = f"render({template!r}, {context!r}) [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        integration_cases = [
            ("plain",
             "Hi ${name}", "Welcome, ${name}!\nYour code: ${code}",
             {"name": "Bob", "code": "XYZ"},
             "Subject: Hi Bob\n\nWelcome, Bob!\nYour code: XYZ"),
            ("value_with_template_syntax_stays_literal",
             "Hi ${name}", "Body: ${name}",
             {"name": "${code}", "code": "SECRET"},
             "Subject: Hi ${code}\n\nBody: ${code}"),
        ]
        for label, subj, body, context, expected in integration_cases:
            code = ("import mailer\n"
                    f"subj = {subj!r}\n"
                    f"bod = {body!r}\n"
                    f"ctx = {context!r}\n"
                    "print(mailer.build_email(subj, bod, ctx))\n")
            r = _run(code)
            case = f"mailer.build_email(...) [{label}]  # protected caller"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected:
                _emit(False, case=case, expected=expected, actual=got,
                      stage="behavior", reason_code="wrong_output")

        _emit(True)


    if __name__ == "__main__":
        main()
