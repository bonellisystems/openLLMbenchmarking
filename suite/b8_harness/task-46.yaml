id: py-build-06
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has two files:

  - `template.py` -- `render(template, context)`, meant to interpolate a
    small `$`-style template language against a flat `context` dict.
    Contract other code relies on:
    - `${name}` -- substitutes `str(context[name])`; `name` must match
      `[A-Za-z_][A-Za-z0-9_]*` exactly (nothing else inside the braces is
      valid).
    - `$name` (no braces) -- the same substitution, shorthand form: reads
      the LONGEST valid identifier immediately following the `$` and
      stops there (e.g. in `"Hi $name!"`, the identifier is `name`, and
      `!` is left as literal trailing text).
    - `$$` -- a literal `$` in the output (the escape sequence).
    - Any OTHER use of `$` (a trailing `$` at the very end of the
      template, or a `$` immediately followed by a character that can't
      start an identifier and isn't `{` or another `$`, e.g. `$1abc`) is
      INVALID -- raise `ValueError`.
    - A referenced name (either form) absent from `context` -> raise
      `KeyError` (never silently substitute a blank string).
    - **Substitution is a SINGLE pass over the ORIGINAL template only.**
      A substituted VALUE is inserted as INERT literal text -- it must
      NEVER be re-scanned for more `${...}`/`$name`/`$$` syntax. E.g. with
      `context = {"a": "${b}", "b": "x"}`, rendering `"${a}"` must
      produce the literal string `"${b}"` (a's own value, verbatim) --
      NOT `"x"`, which would mean `a`'s substituted value got expanded
      AGAIN as if it were itself live template text. (This is also a
      real security property: if a value ever comes from untrusted
      input, e.g. a user's display name, it must never be able to smuggle
      in template syntax that gets executed by a second expansion pass.)
  - `mailer.py` -- an EXISTING caller elsewhere in this codebase:
    `build_email(subject_template, body_template, context)` renders both
    templates against the SAME context and joins them -- relies on the
    single-pass, non-recursive-expansion guarantee above (a `context`
    value that happens to contain `${...}` text, e.g. a stored display
    name, must appear in the rendered output completely verbatim). Must
    keep working exactly as written.

  The bug: `template.py`'s `render` currently re-applies the substitution
  in a loop, over and over, UNTIL the output stops changing -- instead of
  a SINGLE pass over the original template. This means a substituted
  value that itself contains `${...}`/`$name` syntax gets expanded AGAIN
  (and again, until it stabilizes), violating the single-pass contract
  above. Fix `render` so it performs exactly ONE substitution pass over
  the original template (every other rule -- `$$` escaping, bare-`$name`
  matching, missing-key `KeyError`, invalid-`$` `ValueError` -- is
  already implemented correctly and must keep working). Only modify
  `template.py` -- do not create or edit any other file (including
  `mailer.py` or `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 360, tokens: 7000, steps: 16}
setup_repo:
  template.py: |
    import re

    _IDENT = r'[A-Za-z_][A-Za-z0-9_]*'
    _TOKEN_RE = re.compile(r'\$(?:(\$)|\{(' + _IDENT + r')\}|(' + _IDENT + r')|(.?))')


    def _single_pass(template, context):
        result = []
        pos = 0
        for m in _TOKEN_RE.finditer(template):
            result.append(template[pos:m.start()])
            pos = m.end()
            dollar_escape, braced_name, bare_name, invalid = m.groups()
            if dollar_escape is not None:
                result.append("$")
            elif braced_name is not None:
                if braced_name not in context:
                    raise KeyError(braced_name)
                result.append(str(context[braced_name]))
            elif bare_name is not None:
                if bare_name not in context:
                    raise KeyError(bare_name)
                result.append(str(context[bare_name]))
            else:
                raise ValueError(f"invalid placeholder at position {m.start()} in template")
        result.append(template[pos:])
        return "".join(result)


    def render(template, context):
        """BUG: re-scans the substituted OUTPUT for more placeholders in a
        loop until nothing changes, instead of a single pass over the
        ORIGINAL template text -- a substituted value that itself contains
        ${...}/$name syntax gets expanded again instead of staying inert
        literal text."""
        current = template
        while True:
            nxt = _single_pass(current, context)
            if nxt == current:
                return nxt
            current = nxt
  mailer.py: |
    from template import render


    def build_email(subject_template, body_template, context):
        """Existing integration: renders subject/body templates against a
        single context dict -- relies on render() NOT re-expanding a
        substituted value's own text (e.g. a stored display name that
        happens to contain literal ${...} characters must appear
        verbatim, never treated as a live template again -- an
        injection-safety property real templating libraries provide by
        design)."""
        subject = render(subject_template, context)
        body = render(body_template, context)
        return f"Subject: {subject}\n\n{body}"
