oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B3 build/config batch) -- a `$`-template
  interpolator whose central correctness property is SECURITY-shaped:
  substitution must be exactly ONE pass over the original template, never
  a repeat-until-stable loop (which would let a value's own text be
  re-interpreted as live template syntax -- a real injection class real
  templating engines, e.g. Python's own `string.Template`, are designed to
  avoid). Traps:
  1. The starter's own repeat-until-stable loop -- in principle this is
     the bug the two dedicated `no_recursive_expansion_braced`/`_bare`
     cases exist to isolate (a substituted value whose OWN text is itself
     valid template syntax gets expanded a second time). Empirically it
     turns out to fail even EARLIER, at `escape_dollar`: once `$$` has
     produced a literal `$` in the output (e.g. `"$100 for widget"`), the
     buggy loop re-scans that OUTPUT too, and a lone `$` immediately
     followed by a digit (`$1`) matches none of the valid forms
     (`$$`/`${name}`/`$name`) -- it's classified INVALID on the second
     pass and raises `ValueError`, even though the first pass alone was
     completely correct. This is a real second-order consequence of the
     same root defect (re-scanning substituted output at all), not a
     separate bug -- it just means the escaping case alone already
     catches THIS particular implementation, before the dedicated
     anti-recursion cases even run. Those cases stay in the oracle
     anyway: a hypothetical smarter-but-still-wrong implementation that
     stops repeating once no further `${...}`/`$name` PATTERN is found
     (rather than naively re-parsing any leftover `$`) would sail
     through `escape_dollar` yet still wrongly re-expand `${a}` ->
     `${b}` -> `x`.
  2. Missing the `$$` escape alternative entirely (a regex/parser that
     only recognizes `${name}`/`$name`) -- fails `escape_dollar`
     directly, a clean single-cause failure (unlike trap 1's
     second-order crash), nothing else.
  3. Missing-key handling that silently substitutes `""` instead of
     raising `KeyError` (a "safe substitute"-flavored simplification) --
     fails only the two `missing_*_var_raises` cases; everything else,
     INCLUDING both anti-recursion cases (which never hit a missing
     key), still passes.

  Verified empirically: `check_fixtures.wrong[0]` (the starter's
  repeat-until-stable loop) fails at `escape_dollar` (`actual`
  `'EXC:ValueError'`, want `'OK:$100 for widget'`) for the second-order
  reason explained above, not at the anti-recursion cases as originally
  designed -- still a correct, unambiguous rejection of the same root
  defect. `wrong[1]` (no `$$` alternative in the token regex) also fails
  at `escape_dollar`, but for the direct reason (no branch of its regex
  recognizes `$$` at all). `wrong[2]` (missing key -> `""` instead of
  `KeyError`) passes every other case, including both anti-recursion
  ones, and fails only at `missing_braced_var_raises` (`actual`
  `'OK:'`, want `'EXC:KeyError'`).
