id: py-brk-04
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small order-tracking system, split across 3 files:

  - `basket.py` -- `make_basket(initial_items=[])` creates a new basket
    dict, and `add_item(basket, item)` appends an item to a basket's item
    list.
  - `orders.py` -- `create_order(customer_name, notes=None)` creates a new
    order (wrapping a fresh basket), `add_item_to_order(order, item)`, and
    `order_item_count(order)`.
  - `report.py` -- `build_report(customer_items)`, which takes an ordered
    list of `(customer_name, [item, item, ...])` pairs, creates one order
    per customer (in order), adds each customer's own items to their own
    order, and returns one report line per customer: `"name: N items"`.

  `build_report` is producing wrong item counts for some customers -- a
  customer's line sometimes shows MORE items than they actually have,
  including items that look like they belong to a DIFFERENT, seemingly
  unrelated customer earlier in the same batch. `report.py` and
  `orders.py` look correct on inspection (in particular, `orders.py`
  already carefully avoids the classic Python "mutable default argument"
  trap for its own `notes` parameter, using a `None` sentinel) -- the
  actual bug is elsewhere. Find the real root cause and fix ONLY the one
  file responsible. Do not create or edit any other file (including
  `orders.py`, `report.py`, or `NOTES.md`), even if you notice something
  about one of them you'd otherwise want to change.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  basket.py: |
    def make_basket(initial_items=[]):
        """Create a new basket wrapping `initial_items` (an empty list by
        default when no items are supplied)."""
        return {"items": initial_items}


    def add_item(basket, item):
        """Add `item` to `basket`'s item list, in place."""
        basket["items"].append(item)
  orders.py: |
    from basket import make_basket, add_item


    def create_order(customer_name, notes=None):
        """Create a new, empty order for `customer_name`. `notes` is an
        optional list of free-text notes attached to the order (defaults to
        a fresh empty list per order -- correctly avoids the classic
        mutable-default-argument trap by using `None` as the sentinel
        default)."""
        if notes is None:
            notes = []
        return {"customer": customer_name, "basket": make_basket(), "notes": notes}


    def add_item_to_order(order, item):
        add_item(order["basket"], item)


    def order_item_count(order):
        return len(order["basket"]["items"])
  report.py: |
    from orders import create_order, add_item_to_order, order_item_count


    def build_report(customer_items):
        """`customer_items`: an ordered list of (customer_name, [item, ...])
        pairs. Creates one order per customer (in the given order), adds
        each customer's own items to their own order, and returns one report
        line per customer: 'name: N items' -- N must count ONLY that
        customer's own items."""
        lines = []
        for name, items in customer_items:
            order = create_order(name)
            for item in items:
                add_item_to_order(order, item)
            lines.append(f"{name}: {order_item_count(order)} items")
        return "\n".join(lines)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    CASES = [
        [("Alice", ["apple"])],
        [("Alice", ["apple"]), ("Bob", ["banana", "cherry"])],
        [("A", []), ("B", ["x"]), ("C", ["x", "y", "z"])],
        [("Solo", [])],
        [("A", []), ("B", [])],
        [("Big", ["a", "b", "c", "d"]), ("Small", [])],
        [("One", ["i1"]), ("Two", ["i2", "i3"]), ("Three", ["i4"]), ("Four", [])],
        [("X", ["p", "q"]), ("Y", ["r"]), ("X2", [])],
    ]


    def _want(customer_items):
        return "\n".join(f"{name}: {len(items)} items" for name, items in customer_items)


    def main():
        for customer_items in CASES:
            want = _want(customer_items)
            code = ("import report\n"
                    f"print(report.build_report({customer_items!r}))\n")
            r = _run(code)
            case = f"build_report({customer_items})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [orders.py, report.py, NOTES.md]
allowed_diff_paths: [basket.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 root-cause-localization batch) --
  a mutable-default-argument aliasing bug (`basket.make_basket(initial_
  items=[])`) whose effect only shows up through an UNRELATED later call:
  every order created via `orders.create_order` (which always calls
  `make_basket()` with zero arguments) shares the SAME underlying list
  object, so items added to an earlier customer's basket silently leak
  into every later customer's basket in the same `build_report` call.
  `orders.py` deliberately ALSO uses a mutable-default-shaped parameter
  (`notes=None`) but handles it CORRECTLY (the `None`-sentinel idiom) --
  a genuine decoy specifically aimed at a model that pattern-matches
  "mutable default" onto the first plausible-looking parameter it reads
  rather than checking each one. Single-process manifestation is essential
  here: `build_report` calls `create_order`/`add_item_to_order` multiple
  times INSIDE one Python process per case (never across separate oracle
  subprocesses), which is exactly what a fresh module-level default
  argument object needs to actually alias across calls.

  Verified empirically: the ORIGINAL unfixed `basket.py` fails the second
  case, `build_report([("Alice", ["apple"]), ("Bob", ["banana",
  "cherry"])])` -> `"Alice: 1 items\nBob: 3 items"` (want `"...Bob: 2
  items"`, since Bob's basket wrongly starts already containing Alice's
  "apple"). `check_fixtures.wrong[1]` (moves the single shared list to a
  MODULE-level constant instead of a default argument -- a very plausible
  "I moved it out of the signature so it must be fixed now" mistake that
  leaves the exact same aliasing bug in a different place) fails
  identically.
check_fixtures:
  reference:
    basket.py: |
      def make_basket(initial_items=None):
          if initial_items is None:
              initial_items = []
          return {"items": initial_items}


      def add_item(basket, item):
          basket["items"].append(item)
  alternate:
    basket.py: |
      def make_basket(initial_items=[]):
          return {"items": list(initial_items)}


      def add_item(basket, item):
          basket["items"].append(item)
  wrong:
    - basket.py: |
        def make_basket(initial_items=[]):
            return {"items": initial_items}


        def add_item(basket, item):
            basket["items"].append(item)
    - basket.py: |
        _DEFAULT_ITEMS = []


        def make_basket(initial_items=None):
            if initial_items is None:
                initial_items = _DEFAULT_ITEMS
            return {"items": initial_items}


        def add_item(basket, item):
            basket["items"].append(item)
