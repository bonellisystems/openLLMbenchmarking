id: py-brk-03
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small sensor-calibration pipeline, split across 3 files:

  - `sensor.py` -- `calibrate_reading(raw, lo, hi, factor)`, meant to
    calibrate ONE raw sensor reading according to this exact rule: the raw
    reading must FIRST be clipped to the valid raw-sensor range `[lo, hi]`
    (out-of-range raw values are sensor noise/faults that must be clamped
    before anything else), and ONLY THEN should the calibration `factor` be
    multiplied in to produce the final calibrated reading. Clipping AFTER
    scaling would clamp the ALREADY-SCALED value against bounds that were
    only ever meant for the RAW range -- that is a different (and wrong)
    computation.
  - `batch.py` -- `process_batch(raw_readings, lo, hi, factor)`, which
    calibrates every reading in a batch (via `sensor.calibrate_reading`)
    and returns their average.
  - `report.py` -- `format_sensor_report(sensor_name, raw_readings, lo, hi,
    factor)`, which builds a formatted report line on top of `batch.py`.

  Reports produced by `report.py` show calibrated averages that are wrong
  whenever any raw reading, after scaling, would exceed the stated `[lo,
  hi]` bounds. `batch.py` and `report.py` are both correct -- they just
  average/format whatever `sensor.calibrate_reading` gives them. The actual
  bug is in `sensor.calibrate_reading` itself: it does not implement the
  "clip first, then scale" rule described above. Find it and fix it. Only
  modify `sensor.py` -- do not create or edit any other file (including
  `batch.py`, `report.py`, or `NOTES.md`), even if you notice something
  about one of them you'd otherwise want to change.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  sensor.py: |
    def calibrate_reading(raw, lo, hi, factor):
        """Calibrate one raw sensor reading: `raw` must first be clipped to
        the valid raw-sensor range [lo, hi], and ONLY THEN should `factor` be
        multiplied in to produce the calibrated reading."""
        scaled = raw * factor
        return max(lo, min(hi, scaled))
  batch.py: |
    from sensor import calibrate_reading


    def process_batch(raw_readings, lo, hi, factor):
        """Calibrate every raw reading in `raw_readings` (via
        sensor.calibrate_reading) and return their average (0.0 for an empty
        batch)."""
        if not raw_readings:
            return 0.0
        calibrated = [calibrate_reading(r, lo, hi, factor) for r in raw_readings]
        return sum(calibrated) / len(calibrated)
  report.py: |
    from batch import process_batch


    def format_sensor_report(sensor_name, raw_readings, lo, hi, factor):
        """Build a one-line calibrated-average report for `sensor_name`."""
        avg = process_batch(raw_readings, lo, hi, factor)
        return f"{sensor_name}: avg calibrated reading = {avg:.2f}"
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    def _want_calibrate(raw, lo, hi, factor):
        clipped = max(lo, min(hi, raw))
        return clipped * factor


    SINGLE_CASES = [
        (60, 0, 100, 2.0),
        (150, 0, 100, 2.0),
        (-20, 0, 100, 1.5),
        (10, 20, 200, 0.5),
        (50, 0, 100, 1.0),
        (0, 0, 100, 3.0),
        (100, 0, 100, 2.0),
    ]

    BATCH_CASES = [
        ([60, 150, -20], 0, 100, 2.0),
        ([], 0, 100, 1.0),
        ([10, 20, 30], 20, 200, 0.5),
    ]

    REPORT_CASES = [
        ("TempA", [60, 150], 0, 100, 2.0),
        ("Pressure", [10, 20, 30], 20, 200, 0.5),
    ]


    def main():
        for raw, lo, hi, factor in SINGLE_CASES:
            want = _want_calibrate(raw, lo, hi, factor)
            code = ("import sensor\n"
                    f"print(sensor.calibrate_reading({raw!r}, {lo!r}, {hi!r}, {factor!r}))\n")
            r = _run(code)
            case = f"sensor.calibrate_reading({raw}, {lo}, {hi}, {factor})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if not _numeric_match(got, want):
                _emit(False, case=case, expected=str(want), actual=got,
                      stage="behavior", reason_code="wrong_output")

        for raw_readings, lo, hi, factor in BATCH_CASES:
            calibrated = [_want_calibrate(r, lo, hi, factor) for r in raw_readings]
            want = sum(calibrated) / len(calibrated) if calibrated else 0.0
            code = ("import batch\n"
                    f"print(batch.process_batch({raw_readings!r}, {lo!r}, {hi!r}, {factor!r}))\n")
            r = _run(code)
            case = f"batch.process_batch({raw_readings}, {lo}, {hi}, {factor})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if not _numeric_match(got, want):
                _emit(False, case=case, expected=str(want), actual=got,
                      stage="behavior", reason_code="wrong_output")

        for name, raw_readings, lo, hi, factor in REPORT_CASES:
            calibrated = [_want_calibrate(r, lo, hi, factor) for r in raw_readings]
            avg = sum(calibrated) / len(calibrated) if calibrated else 0.0
            want = f"{name}: avg calibrated reading = {avg:.2f}"
            code = ("import report\n"
                    f"print(report.format_sensor_report({name!r}, {raw_readings!r}, "
                    f"{lo!r}, {hi!r}, {factor!r}))\n")
            r = _run(code)
            case = f"report.format_sensor_report({name!r}, {raw_readings}, {lo}, {hi}, {factor})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [batch.py, report.py, NOTES.md]
allowed_diff_paths: [sensor.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 root-cause-localization batch) --
  the bug lives entirely INSIDE a single leaf function's internal
  order-of-operations (`sensor.calibrate_reading` scales before clipping
  instead of after), not in how any orchestrator calls multiple functions
  -- `batch.py` and `report.py` never have an ordering choice to get right
  or wrong at all; they just average/format whatever the leaf hands back.
  This is deliberately a DIFFERENT shape of "distance" than a cross-function
  call-order bug (contrast py-hard-multifile-01/task-15.yaml, where the
  bug is the ORCHESTRATOR calling two individually-correct functions in the
  wrong order): here every file the agent reads looks clean except the one
  genuinely-buggy leaf, and the leaf itself looks like a normal one-line
  clip-then-scale-shaped function unless read carefully against its own
  docstring.

  Verified empirically: the ORIGINAL unfixed `sensor.py` fails the first
  case, `calibrate_reading(60, 0, 100, 2.0)` -> `100.0` (want `120.0`) --
  the raw reading 60 is within [0,100] so should pass through unclipped,
  then scale to 120, but the buggy scale-then-clip order re-clips the
  scaled 120 back down to the hi bound of 100. `check_fixtures.wrong[1]`
  (clips only the UPPER bound after scaling, in the right clip-then-scale
  order but with the lower-bound clamp missing entirely) still fails on
  the lower-bound-specific case, `calibrate_reading(10, 20, 200, 0.5)` ->
  `5.0` (want `10.0`).
check_fixtures:
  reference:
    sensor.py: |
      def calibrate_reading(raw, lo, hi, factor):
          clipped = max(lo, min(hi, raw))
          return clipped * factor
  alternate:
    sensor.py: |
      def calibrate_reading(raw, lo, hi, factor):
          if raw < lo:
              clipped = lo
          elif raw > hi:
              clipped = hi
          else:
              clipped = raw
          return clipped * factor
  wrong:
    - sensor.py: |
        def calibrate_reading(raw, lo, hi, factor):
            scaled = raw * factor
            return max(lo, min(hi, scaled))
    - sensor.py: |
        def calibrate_reading(raw, lo, hi, factor):
            clipped = min(hi, raw)
            return clipped * factor
