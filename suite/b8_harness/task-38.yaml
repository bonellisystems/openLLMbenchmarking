        # BUG: release() never checks whether conn was actually checked
        # out -- a double-release (or a foreign object with an .id
        # attribute) is silently accepted, corrupting the pool's counts.
        import contextlib


        class PoolExhausted(Exception):
            pass


        class Connection:
            def __init__(self, id):
                self.id = id


        class ConnectionPool:
            def __init__(self, size):
                if not isinstance(size, int) or isinstance(size, bool) or size <= 0:
                    raise ValueError("size must be a positive int")
                self._all = [Connection(i) for i in range(size)]
                self._available = list(self._all)
                self._checked_out = 0

            def acquire(self):
                if not self._available:
                    raise PoolExhausted("no available connections")
                self._checked_out += 1
                return self._available.pop()

            def release(self, conn):
                self._available.append(conn)
                self._checked_out = max(0, self._checked_out - 1)

            def available_count(self):
                return len(self._available)

            def checked_out_count(self):
                return self._checked_out

            @contextlib.contextmanager
            def connection(self):
                conn = self.acquire()
                try:
                    yield conn
                finally:
                    self.release(conn)
    - pool.py: |
        # BUG: release() checks membership in `_all` (any connection this
        # pool ever created) rather than "currently checked out" -- so it
        # rejects nothing as a double-release; ANY of this pool's own
        # connections can be released arbitrarily many times.
        import contextlib


        class PoolExhausted(Exception):
            pass


        class Connection:
            def __init__(self, id):
                self.id = id


        class ConnectionPool:
            def __init__(self, size):
                if not isinstance(size, int) or isinstance(size, bool) or size <= 0:
                    raise ValueError("size must be a positive int")
                self._all = [Connection(i) for i in range(size)]
                self._available = list(self._all)

            def acquire(self):
                if not self._available:
                    raise PoolExhausted("no available connections")
                return self._available.pop()

            def release(self, conn):
                if conn not in self._all:
                    raise ValueError("not a connection from this pool")
                self._available.append(conn)

            def available_count(self):
                return len(self._available)

            def checked_out_count(self):
                return len(self._all) - len(self._available)

            @contextlib.contextmanager
            def connection(self):
                conn = self.acquire()
                try:
                    yield conn
                finally:
                    self.release(conn)
