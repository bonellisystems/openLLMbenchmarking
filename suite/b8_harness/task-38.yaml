id: py-state-04
shape: from-scratch
task_version: "1.0.0"
prompt: |
  Implement a fixed-size connection pool from scratch, in a new file
  `pool.py`, exposing:

  - `class PoolExhausted(Exception)` -- raised when `acquire()` is called
    on a pool with no available connections.
  - `class Connection` -- has an `.id` attribute (any unique value per
    connection is fine, e.g. an int index).
  - `class ConnectionPool(size)` -- pre-creates `size` `Connection`
    objects at construction. `size` must be a positive int; `size <= 0`
    raises `ValueError` at construction.
    - `acquire()`: removes and returns one available `Connection`; raises
      `PoolExhausted` (leaving the pool's internal counts UNCHANGED) if
      none are available.
    - `release(conn)`: returns a previously-acquired `Connection` to the
      available pool. Raises `ValueError` (leaving counts UNCHANGED) for
      EITHER of two misuse cases: `conn` was never returned by this
      pool's `acquire()` at all (a foreign object), OR `conn` IS one of
      this pool's connections but is not CURRENTLY checked out (a
      double-release) -- releasing the same connection twice must never
      be allowed to silently succeed (that would let two callers hold the
      "same" connection at once).
    - `available_count()` / `checked_out_count()`: current counts:
      `available_count() + checked_out_count() == size` must hold at
      every point.
    - `connection()`: returns a context manager -- `with pool.connection()
      as conn:` must `acquire()` on entry and `release()` on exit, EVEN IF
      the code inside the `with` block raises an exception (the
      connection must never leak).

  An existing file, `db.py`, already uses `pool.connection()` as a context
  manager and reads `.id` off the acquired connection -- must keep
  working exactly as written.

  Create ONLY `pool.py`. Do not create or edit `db.py` or `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 420, tokens: 8000, steps: 18}
setup_repo:
  db.py: |
    def run_query(pool, query):
        """Existing caller: relies on pool.connection() being a context
        manager that acquires on entry and ALWAYS releases on exit, and
        on the yielded object having an .id attribute."""
        with pool.connection() as conn:
            return f"ran {query!r} via conn={conn.id}"
