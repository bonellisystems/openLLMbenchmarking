        def sorted_scores(entries):
            return sorted(entries, key=lambda e: str(e[1]), reverse=True)
    - scores.py: |
        def sorted_scores(entries):
            return sorted(entries, key=lambda e: e[1], reverse=True)
    - scores.py: |
        def sorted_scores(entries):
            return sorted(entries, key=lambda e: (-e[1], e[0]), reverse=True)
