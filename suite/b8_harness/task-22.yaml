id: py-brk-06
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo is a small leaderboard system, split across 3 files:

  - `scores.py` -- `sorted_scores(entries)`, meant to sort a list of
    `(player_name, score)` pairs (`score` an int, possibly negative) by
    score HIGHEST first, breaking ties by player_name ascending
    (alphabetical).
  - `leaderboard.py` -- `rank_entries(entries)`, which numbers
    `scores.sorted_scores`'s output starting at rank 1.
  - `display.py` -- `format_leaderboard(entries)`, which formats
    `leaderboard.rank_entries`'s output into one text line per player.

  Leaderboards are coming out in the wrong order -- sometimes a player
  with a LOWER score is ranked above one with a higher score, and ties
  aren't always broken alphabetically. `leaderboard.py`'s rank numbering
  (starting at 1, incrementing correctly) and `display.py`'s formatting
  are both correct -- neither has any sorting logic of its own to get
  wrong. The actual bug is in how `scores.sorted_scores` compares scores.
  Find it and fix it. Only modify `scores.py` -- do not create or edit any
  other file (including `leaderboard.py`, `display.py`, or `NOTES.md`),
  even if you notice something about one of them you'd otherwise want to
  change.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  scores.py: |
    def sorted_scores(entries):
        """`entries`: a list of (player_name, score) pairs, `score` an int
        (may be negative). Return a NEW list of the same pairs sorted by
        score HIGHEST first; ties are broken by player_name ascending
        (alphabetical)."""
        return sorted(entries, key=lambda e: str(e[1]), reverse=True)
  leaderboard.py: |
    from scores import sorted_scores


    def rank_entries(entries):
        """Return a list of (rank, player_name, score), rank starting at 1,
        ordered by scores.sorted_scores (already highest-score-first)."""
        ranked = sorted_scores(entries)
        return [(i + 1, name, score) for i, (name, score) in enumerate(ranked)]
  display.py: |
    from leaderboard import rank_entries


    def format_leaderboard(entries):
        """Build one text line per player: '#rank name - score pts'."""
        lines = [f"#{rank} {name} - {score} pts" for rank, name, score in rank_entries(entries)]
        return "\n".join(lines)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    def _want_format(entries):
        ranked = sorted(entries, key=lambda e: (-e[1], e[0]))
        lines = [f"#{i + 1} {name} - {score} pts" for i, (name, score) in enumerate(ranked)]
        return "\n".join(lines)


    CASES = [
        [("amy", 10), ("bob", 9)],
        [("zeb", 5), ("amy", 5)],
        [("a", 100), ("b", 99), ("c", 9)],
        [("charlie", 5), ("alice", 5), ("bob", 5)],
        [("x", -5), ("y", -1), ("z", -10)],
        [("solo", 7)],
        [],
        [("p", 20), ("q", 2), ("r", 200)],
        [("m", 0), ("n", 0), ("o", -1)],
    ]


    def main():
        for entries in CASES:
            want = _want_format(entries)
            code = ("import display\n"
                    f"print(display.format_leaderboard({entries!r}))\n")
            r = _run(code)
            case = f"format_leaderboard({entries})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=want, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != want:
                _emit(False, case=case, expected=want, actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [leaderboard.py, display.py, NOTES.md]
allowed_diff_paths: [scores.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: multi-file (Wave 4, W4B1 root-cause-localization batch) --
  `scores.sorted_scores` sorts by the STRING representation of `score`
  (`str(e[1])`, `reverse=True`), which mis-orders any pair of scores whose
  string forms don't agree with their numeric order (e.g. "9" sorts AFTER
  "10" lexicographically, so a 9-point score wrongly outranks a 10-point
  one) AND never breaks ties alphabetically (equal-string scores keep
  their original relative order, per Python's sort stability, rather than
  being name-sorted). `leaderboard.py`'s rank enumeration and `display.py`'s
  formatting are both correct and have no comparison logic to be wrong in
  -- the entire defect is the ONE lambda in `scores.py`.

  Verified empirically: the ORIGINAL unfixed `scores.py` fails the first
  case, `format_leaderboard([("amy", 10), ("bob", 9)])` -> ranks bob (9
  points) #1 and amy (10 points) #2, exactly backwards.
  `check_fixtures.wrong[1]` (fixes the numeric-vs-string bug via `key=
  lambda e: e[1], reverse=True` but never addresses the tie-break
  requirement) still fails the tie case, `[("zeb", 5), ("amy", 5)]` ->
  keeps zeb ranked #1 (original input order, since Python's stable sort
  never reorders equal keys) instead of alphabetically-first amy.
  `check_fixtures.wrong[2]` (applies `reverse=True` on TOP of an
  already-descending `(-score, name)` key -- a double-negation mistake)
  fails even the first case, ending up in fully-ascending order.
