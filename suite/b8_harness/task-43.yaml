id: py-build-03
shape: from-scratch
task_version: "1.0.0"
prompt: |
  Implement a custom, self-contained serialization format from scratch,
  in a new file `serializer.py`, exposing `encode(obj) -> str` and
  `decode(s) -> obj`. Supported Python types: `int`, `str`, `list`, and
  `dict` (with `str`-only keys) -- nested arbitrarily. `bool`, `float`,
  `None`, and any other type are NOT supported: `encode` must raise
  `TypeError` for one of these (or for a dict with a non-`str` key).

  The format (a simplified, bencode-style text encoding):
  - Integer `n` -> `i<n>e`, e.g. `42` -> `i42e`, `-3` -> `i-3e`, `0` ->
    `i0e`.
  - String `s` -> `<byte-length>:<s>`, where `<byte-length>` is the
    number of BYTES in `s.encode("utf-8")` -- NOT the number of
    characters. This matters for any non-ASCII string: e.g. `"café"`
    (4 characters, but the `é` encodes to 2 UTF-8 bytes) must encode
    as `5:café` (length `5`, the BYTE count), not `4:café`.
    `decode` must mirror this exactly -- read the declared byte-length,
    then slice that many BYTES off the (UTF-8-encoded) remainder before
    decoding them back to a `str`, NOT slice that many characters.
  - List -> `l<item1><item2>...e`, each item itself encoded per these
    same rules, e.g. `[1, "ab"]` -> `li1e2:abe`.
  - Dict (str keys only) -> `d<key1><val1><key2><val2>...e`, with entries
    in SORTED key order (`sorted(d)`) REGARDLESS of the input dict's own
    iteration order -- e.g. `{"spam": "eggs", "cow": "moo"}` must encode
    as `d3:cow3:moo4:spam4:eggse` (`"cow"` before `"spam"`, sorted), even
    though `"spam"` was inserted first.
  - Empty containers: `""` -> `0:`, `[]` -> `le`, `{}` -> `de`.

  `decode` must raise `ValueError` on malformed input: an unterminated
  list/dict/integer (missing the closing `e`), or a string whose declared
  byte-length exceeds the bytes actually available, or an unrecognized
  leading character, or trailing data left over after the top-level value.

  An existing file, `store.py`, already does
  `save_and_load(obj) -> obj` (`decode(encode(obj))`, plus a sanity check
  that `encode` returns a `str`) -- must keep working exactly as written.

  Create ONLY `serializer.py`. Do not create or edit `store.py` or
  `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 420, tokens: 8000, steps: 18}
setup_repo:
  store.py: |
    from serializer import encode, decode


    def save_and_load(obj):
        """Existing integration: a full encode/decode round trip through
        the custom format -- relies on decode(encode(x)) reproducing x
        exactly (including nested containers, unicode, and empty values),
        and on encode() always returning a str."""
        blob = encode(obj)
        if not isinstance(blob, str):
            raise TypeError("encode() must return a str")
        return decode(blob)
