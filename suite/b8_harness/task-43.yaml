    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    # Every value that crosses the subprocess boundary (either direction)
    # is routed through ascii() rather than repr()/str() -- guarantees a
    # pure-ASCII stdout stream regardless of the host/container's default
    # text encoding, so a genuinely non-ASCII payload (this task's whole
    # point) can never itself cause a false mismatch here.
    def _roundtrip_snippet(obj):
        return ("import serializer\n"
                f"obj = {ascii(obj)}\n"
                "try:\n"
                "    blob = serializer.encode(obj)\n"
                "    result = serializer.decode(blob)\n"
                "except Exception as e:\n"
                "    print('EXC:' + type(e).__name__)\n"
                "else:\n"
                "    print('MATCH' if result == obj else 'MISMATCH ' + ascii(result))\n")


    ROUND_TRIP_CASES = [
        ("empty_dict", {}),
        ("empty_list", []),
        ("empty_string", ""),
        ("zero", 0),
        ("negative_int", -17),
        ("unicode_basic", "café"),
        ("unicode_mixed", "héllo wörld \u65e5\u672c\u8a9e \U0001F600"),
        ("weird_syntax_chars", "3:e\"quoted\\slash\nline2:more"),
        ("nested_mixed", {"name": "café", "tags": ["a", "b b", ""], "count": 3,
                           "nested": {"x": -7, "y": []}}),
        ("deep_nesting", [[[[[1, 2], 3]]], {"k": [4, 5]}]),
        ("list_of_dicts", [{"a": 1}, {"b": 2}, {}]),
    ]

    CANONICAL_CASES = [
        ("encode_unicode_byte_length", "encode", "café", "5:café"),
        ("encode_sorted_keys", "encode", {"spam": "eggs", "cow": "moo"},
         "d3:cow3:moo4:spam4:eggse"),
        ("decode_unicode_byte_length", "decode", "5:café", "café"),
    ]

    MALFORMED_CASES = [
        ("unterminated_list", "l4:spam"),
        ("truncated_string", "4:abc"),
    ]

    TYPE_REJECTION_CASES = [
        ("float_unsupported", 3.14),
        ("none_unsupported", None),
        ("bool_unsupported", True),
    ]


    def main():
        for label, obj in ROUND_TRIP_CASES:
            r = _run(_roundtrip_snippet(obj))
            case = f"round-trip [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="MATCH", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "MATCH":
                _emit(False, case=case, expected="MATCH", actual=got,
                      stage="behavior", reason_code="wrong_output")

        for label, op, arg, expected in CANONICAL_CASES:
            if op == "encode":
                code = ("import serializer\n"
                        f"obj = {ascii(arg)}\n"
                        "print(ascii(serializer.encode(obj)))\n")
            else:
                code = ("import serializer\n"
                        f"s = {ascii(arg)}\n"
                        "print(ascii(serializer.decode(s)))\n")
            r = _run(code)
            case = f"canonical [{label}]"
            expected_repr = ascii(expected)
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected_repr, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected_repr:
                _emit(False, case=case, expected=expected_repr, actual=got,
                      stage="behavior", reason_code="wrong_output")

        for label, malformed in MALFORMED_CASES:
            code = ("import serializer\n"
                    f"s = {malformed!r}\n"
                    "try:\n"
                    "    serializer.decode(s)\n"
                    "    print('NO_EXCEPTION')\n"
                    "except Exception as e:\n"
                    "    print(type(e).__name__)\n")
            r = _run(code)
            case = f"decode raises ValueError [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="ValueError", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "ValueError":
                _emit(False, case=case, expected="ValueError", actual=got,
                      stage="behavior", reason_code="wrong_output")

        for label, bad_obj in TYPE_REJECTION_CASES:
            code = ("import serializer\n"
                    f"obj = {bad_obj!r}\n"
                    "try:\n"
                    "    serializer.encode(obj)\n"
                    "    print('NO_EXCEPTION')\n"
                    "except Exception as e:\n"
                    "    print(type(e).__name__)\n")
            r = _run(code)
            case = f"encode raises TypeError [{label}]"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="TypeError", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "TypeError":
                _emit(False, case=case, expected="TypeError", actual=got,
                      stage="behavior", reason_code="wrong_output")

        integration_cases = [
            ("plain", {"a": 1, "b": [2, 3]}, {"a": 1, "b": [2, 3]}),
            ("unicode", {"emoji": "\U0001F600"}, {"emoji": "\U0001F600"}),
        ]
        for label, obj, expected in integration_cases:
            code = ("import store\n"
                    f"obj = {ascii(obj)}\n"
                    "print(ascii(store.save_and_load(obj)))\n")
            r = _run(code)
            case = f"store.save_and_load(...) [{label}]  # protected caller"
            expected_repr = ascii(expected)
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=expected_repr, actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != expected_repr:
                _emit(False, case=case, expected=expected_repr, actual=got,
                      stage="behavior", reason_code="wrong_output")

        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [store.py, NOTES.md]
allowed_diff_paths: [serializer.py]
