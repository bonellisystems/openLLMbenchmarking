  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: from-scratch (Wave 4, W4B3 build/config batch) -- a bencode-style
  round-trip serializer where the two headline edge cases are UNICODE
  BYTE-LENGTH (not character count) and CANONICAL SORTED dict-key order.
  Traps:
  1. Using `len(s)` (character count) instead of `len(s.encode("utf-8"))`
     (byte count) for string length prefixes -- self-consistent for a
     round trip through the SAME (buggy) implementation, since encode and
     decode agree with each other, so it does NOT fail any
     `ROUND_TRIP_CASES` entry, even the unicode ones. Only caught by the
     CANONICAL cases, which check the exact wire format independently of
     the candidate's own encode/decode agreeing with itself:
     `encode_unicode_byte_length` (`encode("café")` must be exactly
     `"5:café"`, not `"4:café"`) and
     `decode_unicode_byte_length` (feeding the CORRECT, byte-length-
     prefixed `"5:café"` into `decode` directly).
  2. Dict keys NOT sorted on encode (using the dict's own iteration/
     insertion order instead) -- doesn't affect any round trip either
     (`decode` reconstructs an equal dict regardless of key order), only
     caught by `encode_sorted_keys`'s exact-string comparison.
  3. `encode` byte-length-correct but `decode` still character-based
     (an asymmetric copy-paste mistake) -- THIS one DOES fail a round trip
     directly (`decode(encode("café"))` slices the wrong byte range
     and either raises or returns a truncated/garbled string), unlike
     traps 1-2.

  Verified empirically: `check_fixtures.wrong[0]` (character-length both
  sides) passes every `ROUND_TRIP_CASES` entry (including
  `unicode_mixed`), then fails `encode_unicode_byte_length` (`actual`
  `ascii("4:café")`, want `ascii("5:café")`). `wrong[1]` (no
  `sorted()` on dict keys) passes every round-trip and both unicode
  canonical cases, then fails `encode_sorted_keys` (`actual`
  `"d4:spam4:eggs3:cow3:mooe"`, insertion order, not sorted). `wrong[2]`
  (byte-length encode, char-length decode) fails directly at
  `round-trip [unicode_basic]` -- `decode` slices a too-short character
  range off `"5:café"` and raises `ValueError` instead of
  reconstructing `"café"`.
