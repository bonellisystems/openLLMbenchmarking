    serializer.py: |
      class _Cursor:
          __slots__ = ("s", "pos")

          def __init__(self, s):
              self.s = s
              self.pos = 0

          def peek(self):
              if self.pos >= len(self.s):
                  raise ValueError("unexpected end of input")
              return self.s[self.pos]


      def _decode_value(cur):
          ch = cur.peek()
          if ch == "i":
              end = cur.s.find("e", cur.pos)
              if end == -1:
                  raise ValueError("unterminated integer")
              value = int(cur.s[cur.pos + 1:end])
              cur.pos = end + 1
              return value
          if ch == "l":
              cur.pos += 1
              items = []
              while cur.peek() != "e":
                  items.append(_decode_value(cur))
              cur.pos += 1
              return items
          if ch == "d":
              cur.pos += 1
              result = {}
              while cur.peek() != "e":
                  key = _decode_value(cur)
                  if not isinstance(key, str):
                      raise ValueError("dict key must be a string")
                  value = _decode_value(cur)
                  result[key] = value
              cur.pos += 1
              return result
          if ch.isdigit():
              colon = cur.s.find(":", cur.pos)
              if colon == -1:
                  raise ValueError("malformed string length")
              length = int(cur.s[cur.pos:colon])
              raw_tail = cur.s[colon + 1:].encode("utf-8")
              if length > len(raw_tail):
                  raise ValueError("string length exceeds available data")
              text_value = raw_tail[:length].decode("utf-8")
              cur.pos = colon + 1 + len(text_value)
              return text_value
          raise ValueError(f"unrecognized type prefix: {ch!r}")


      def decode(s):
          cur = _Cursor(s)
          value = _decode_value(cur)
          if cur.pos != len(s):
              raise ValueError("trailing data after top-level value")
          return value


