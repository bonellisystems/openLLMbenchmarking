      def encode(obj):
          if isinstance(obj, bool):
              raise TypeError("bool is not a supported type")
          if isinstance(obj, int):
              return f"i{obj}e"
          if isinstance(obj, str):
              return f"{len(obj.encode('utf-8'))}:{obj}"
          if isinstance(obj, list):
              return "l" + "".join(encode(item) for item in obj) + "e"
          if isinstance(obj, dict):
              if not all(isinstance(k, str) for k in obj):
                  raise TypeError("dict keys must be str")
              parts = []
              for k in sorted(obj):
                  parts.append(encode(k))
                  parts.append(encode(obj[k]))
              return "d" + "".join(parts) + "e"
          raise TypeError(f"unsupported type: {type(obj).__name__}")


      def decode(s):
          value, pos = _decode_at(s, 0)
          if pos != len(s):
              raise ValueError("trailing data after top-level value")
          return value


      def _decode_at(s, pos):
          if pos >= len(s):
              raise ValueError("unexpected end of input")
          ch = s[pos]
          if ch == "i":
              end = s.find("e", pos)
              if end == -1:
                  raise ValueError("unterminated integer")
              return int(s[pos + 1:end]), end + 1
          if ch == "l":
              pos += 1
              items = []
              while True:
                  if pos >= len(s):
                      raise ValueError("unterminated list")
                  if s[pos] == "e":
                      return items, pos + 1
                  item, pos = _decode_at(s, pos)
                  items.append(item)
          if ch == "d":
              pos += 1
              result = {}
              while True:
                  if pos >= len(s):
                      raise ValueError("unterminated dict")
                  if s[pos] == "e":
                      return result, pos + 1
                  key, pos = _decode_at(s, pos)
                  if not isinstance(key, str):
                      raise ValueError("dict key must be a string")
                  value, pos = _decode_at(s, pos)
                  result[key] = value
          if ch.isdigit():
              colon = s.find(":", pos)
              if colon == -1:
                  raise ValueError("malformed string length")
              length = int(s[pos:colon])
              body_start = colon + 1
              raw_tail = s[body_start:].encode("utf-8")
              if length > len(raw_tail):
                  raise ValueError("string length exceeds available data")
              text_value = raw_tail[:length].decode("utf-8")
              return text_value, body_start + len(text_value)
          raise ValueError(f"unrecognized type prefix: {ch!r} at position {pos}")
