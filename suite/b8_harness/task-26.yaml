notes: |
  Shape: multi-file (Wave 4, W4B1 cross-module-contract batch) --
  a versioned-schema migration/normalization contract: `normalize_profile`
  must simultaneously satisfy TWO protected existing callers, one feeding
  old-schema data (`legacy_importer.py`) and one feeding new-schema data
  (`current_importer.py`) -- both must keep working, exercising BOTH sides
  of the contract per the category's brief. `DIRECT_CASES` additionally
  covers the "present-but-empty-string counts as present" precedence rule
  and the "extra keys must be stripped" rule independently of either
  importer.

  Verified empirically: the ORIGINAL unfixed `normalize.py` fails the
  second direct case (an old-schema-only record) with
  `{"name": None, "email": None}` (want the actual values) and fails
  `legacy_importer.import_legacy_batch()` outright.
  `check_fixtures.wrong[1]` (`record.get("name") or record.get(
  "full_name")`, using `or` instead of a presence check) fails
  specifically on the present-but-empty-string case (case 8): an empty
  `""` name is falsy, so `or` wrongly falls through to the (absent)
  `full_name` key instead of keeping the explicitly-provided `""`.
  `check_fixtures.wrong[2]` (renames the legacy keys correctly via
  `dict.pop` but never strips OTHER unrelated extra keys) fails the
  extra-key cases (3, 4) and both importer batch checks (`source`/`role`
  leak into the result).
