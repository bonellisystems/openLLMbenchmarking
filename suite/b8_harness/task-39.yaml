id: py-state-05
shape: from-scratch
task_version: "1.0.0"
prompt: |
  Implement a key-value store with NESTED transactions from scratch, in a
  new file `txstore.py`, exposing:

  - `class NoActiveTransaction(Exception)` -- raised by `commit()`/
    `rollback()` when there is no open transaction to act on.
  - `class TransactionalStore()`:
    - `set(key, value)`: writes `key`/`value` into the CURRENT scope (the
      innermost open transaction, if any is open, otherwise directly into
      the base store).
    - `get(key)`: returns the value MOST-RECENTLY visible for `key` --
      considering every open transaction layer from innermost to
      outermost, then the base store. Raises `KeyError` if `key` isn't
      visible anywhere (never set, or deleted and not since re-set, in
      every layer that matters).
    - `delete(key)`: removes `key` from view within the CURRENT scope
      (innermost open transaction, or the base store if none is open).
      Raises `KeyError` if `key` isn't currently visible (per `get`'s own
      visibility rule) at the point `delete` is called.
    - `begin()`: opens a new, nested transaction layer on top of whatever
      is currently open (or on top of the base store, for the first
      transaction). Any number of transactions may be nested.
    - `commit()`: raises `NoActiveTransaction` if no transaction is open.
      Otherwise merges the innermost open transaction's changes (both
      `set`s and `delete`s) DOWN into the layer beneath it (the next
      transaction out, or the base store if this was the outermost) --
      after `commit()`, that next layer down reflects exactly what `get`
      would have returned while the committed transaction was still open.
    - `rollback()`: raises `NoActiveTransaction` if no transaction is
      open. Otherwise DISCARDS the innermost open transaction's layer
      entirely -- every `set`/`delete` made since the matching `begin()`
      is undone, as if it never happened; the layer beneath it (or the
      base store) is completely unaffected.

  A `delete()` inside a transaction must be able to hide a value that
  only exists in an OUTER (still-open) transaction or the base store --
  and a subsequent `commit()` of that transaction must propagate the
  deletion outward too.

  An existing file, `cli_txn.py`, already calls `.get()` and relies on it
  raising `KeyError` (not returning `None`) for a missing key -- must keep
  working exactly as written.

  Create ONLY `txstore.py`. Do not create or edit `cli_txn.py` or
  `NOTES.md`.
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 480, tokens: 9000, steps: 20}
setup_repo:
  cli_txn.py: |
    def get_or_default(store, key, default):
        """Existing caller: relies on store.get() raising KeyError (never
        returning None) for a key that isn't currently visible."""
        try:
            return store.get(key)
        except KeyError:
            return default
