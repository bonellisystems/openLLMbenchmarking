    - txstore.py: |
        # BUG: commit() merges via plain dict.update(), which can only
        # ADD/overwrite keys -- a delete recorded in the committed layer
        # (as a sentinel) gets copied down as a literal sentinel VALUE the
        # first time, but a second commit's update() on an already-
        # tombstoned key in the base is fine, EXCEPT get() here never
        # checks for the sentinel in the base store, so a "deleted" key
        # that reaches the base resurrects as the sentinel object itself
        # instead of raising KeyError.
        class NoActiveTransaction(Exception):
            pass


        _DELETED = object()


        class TransactionalStore:
            def __init__(self):
                self._base = {}
                self._layers = []

            def _current_layer(self):
                return self._layers[-1] if self._layers else self._base

            def set(self, key, value):
                self._current_layer()[key] = value

            def get(self, key):
                for layer in reversed(self._layers):
                    if key in layer:
                        value = layer[key]
                        if value is _DELETED:
                            raise KeyError(key)
                        return value
                if key in self._base:
                    return self._base[key]
                raise KeyError(key)

            def delete(self, key):
                self.get(key)
                self._current_layer()[key] = _DELETED

            def begin(self):
                self._layers.append({})

            def commit(self):
                if not self._layers:
                    raise NoActiveTransaction("no open transaction")
                top = self._layers.pop()
                target = self._current_layer()
                target.update(top)
                # BUG: when target is self._base, a _DELETED sentinel
                # value now sits in self._base permanently -- but get()'s
                # base-store branch above ("if key in self._base: return
                # self._base[key]") returns the SENTINEL OBJECT itself as
                # if it were a real value, instead of raising KeyError.

            def rollback(self):
                if not self._layers:
                    raise NoActiveTransaction("no open transaction")
                self._layers.pop()
