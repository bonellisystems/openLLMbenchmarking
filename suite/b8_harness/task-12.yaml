id: py-hard-bugfix-01
shape: bugfix
task_version: "1.1.0"
prompt: |
  The repo has one file, `search_utils.py`, containing a function that is
  meant to satisfy this exact contract:

      first_occurrence(nums, target) -- `nums` is a list of integers sorted
      in NON-DECREASING order (it may contain duplicate values). Return the
      index of the FIRST (left-most) occurrence of `target` in `nums`, or
      -1 if `target` does not appear anywhere in `nums`.

  E.g. `first_occurrence([1, 2, 2, 2, 3], 2)` must return `1` (the index of
  the *first* `2`, not any other one), and `first_occurrence([5, 5, 5], 5)`
  must return `0`.

  The current implementation is a binary search that looks reasonable, and
  it is valid Python (it runs fine and returns a plausible-looking answer
  for many inputs) -- but it does NOT correctly satisfy the contract above
  in every case. There is a real, non-obvious logic bug in it. Find the bug
  and fix it so `first_occurrence` satisfies the contract exactly in every
  case, including whenever `target` appears more than once in `nums`.

  ```python
  def first_occurrence(nums, target):
      """Return the index of the first (left-most) occurrence of `target`
      in `nums`, a list sorted in non-decreasing order. `nums` may contain
      duplicate values. Return -1 if `target` is not present anywhere in
      `nums`."""
      lo, hi = 0, len(nums) - 1
      result = -1
      while lo <= hi:
          mid = (lo + hi) // 2
          if nums[mid] == target:
              result = mid
              lo = mid + 1
          elif nums[mid] < target:
              lo = mid + 1
          else:
              hi = mid - 1
      return result
  ```

  Only modify `search_utils.py` -- do not create or edit any other file
  (including `NOTES.md`).
allowed_tools: [read_file, write_file, bash_exec]
budgets: {wall_clock_s: 200, tokens: 4000, steps: 10}
setup_repo:
