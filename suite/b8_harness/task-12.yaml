oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys

    CASES = [
        ([], 5),
        ([5], 5),
        ([5], 9),
        ([1, 3, 5, 7, 9], 5),
        ([1, 3, 5, 7, 9], 2),
        ([1, 3, 5, 7, 9], 1),
        ([1, 3, 5, 7, 9], 9),
        ([2, 2, 2], 2),
        ([1, 2, 2, 2, 3], 2),
        ([2, 2, 2, 3, 4], 2),
        ([0, 1, 2, 2, 2], 2),
        ([4, 4, 4, 4, 4], 4),
        ([-5, -3, -3, -3, -1], -3),
        ([-5, -3, -1], -10),
        ([-5, -3, -1], 10),
        ([v for v in range(0, 500) for _ in range(2)], 250),
        ([1, 1, 2, 3, 3, 3, 4, 5, 5], 3),
        ([7, 7], 7),
        ([7, 8], 7),
        ([7, 8], 8),
    ]


    def _want(nums, target):
        """Ground truth computed from stdlib `list.index`, which itself
        returns the LEFT-MOST matching index -- no hand-transcribed
        expected values to get wrong."""
        return nums.index(target) if target in nums else -1


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(nums, target):
        """Run `search_utils.first_occurrence(...)` in a FRESH subprocess
        and return the completed process -- never `import search_utils`
        into THIS process. A solution containing a module-level
        `sys.exit(0)` (or one that monkeypatches this checker) can only
        affect the throwaway subprocess, whose observable stdout is then
        compared against the exact expected text; it cannot short-circuit
        this oracle's own exit code the way an in-process `import` could."""
        code = f"import search_utils\nprint(search_utils.first_occurrence({nums!r}, {target!r}))\n"
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def main():
        for nums, target in CASES:
            want = _want(nums, target)
            r = _run(nums, target)
            preview = nums if len(nums) <= 20 else f"<{len(nums)} items>"
            case = f"first_occurrence({preview}, {target})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != str(want):
                _emit(False, case=case, expected=str(want), actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
protected_paths: [NOTES.md]
allowed_diff_paths: [search_utils.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: bugfix (HARD tier, task-b8hard) -- the 6 existing real Python B8
  tasks (task-06..11.yaml) are all solved 30/30 by gpt-oss-20b; this task
  and its 4 siblings (task-13..16.yaml) are deliberately calibrated to be
  genuinely failable (target ~40-80% completion for a capable 20B model),
  with difficulty coming from CORRECTNESS/EDGE-CASE reasoning rather than
  obscurity, per the "harder B8" build brief.

  THE BUG (never stated in the prompt or in a code comment -- only the
  CONTRACT is given, exactly like the shipped file's own docstring): the
  planted implementation, on finding a match at `mid`, continues searching
  the RIGHT half (`lo = mid + 1`) instead of the LEFT half (`hi = mid -
  1`). Since it keeps overwriting `result` with every match found further
  right before the loop ends, this makes it converge on the LAST
  occurrence of `target`, not the first -- the exact opposite of the
  stated contract. This is deliberately NOT a crash and NOT distinguishable
  from a correct solution on any input where `target` occurs at most once
  (first == last occurrence trivially) -- it only diverges on inputs with
  DUPLICATE target values, which is exactly the edge the hidden oracle
  hammers (`[2, 2, 2]`, `[1, 2, 2, 2, 3]`, `[2, 2, 2, 3, 4]`, `[0, 1, 2, 2,
  2]`, `[4, 4, 4, 4, 4]`, a negative-number duplicate run, and a 1000-
  element list with every value duplicated). A model that "tests" its fix
  against a handful of no-duplicate examples (which is exactly what makes
  this bug NON-obvious -- the buggy code already looks like it works) will
  not catch this without either reasoning through the binary-search
  invariant precisely or actually running a duplicate-containing case.

  Verified empirically (task-b8hard authoring): a corrected reference
  solution (`hi = mid - 1` on match) passes every case; the ORIGINAL
  unfixed file (`lo = mid + 1` on match, i.e. the file exactly as shipped
  above) fails on the very first duplicate case, `first_occurrence([2, 2,
  2], 2)` -> `2` (want `0`) -- proving the oracle actually discriminates,
  not just checks syntax.

  Ground truth computed LIVE in the oracle via stdlib `nums.index(target)`
  (which itself returns the left-most match) rather than hand-transcribed
  literals -- removes manual-arithmetic transcription risk from the oracle
  itself.

  Hidden oracle, SUBPROCESS-ISOLATED from the start (mirrors every existing
  Python B8 oracle -- task-b8expand hardening, `llmtest/harness/tasks.py`
  module docstring / codex review Important #1): `search_utils` is never
  `import`ed into this checker's own process; each case launches a fresh
  `python3 -c "import search_utils; print(search_utils.first_occurrence(...))"`
  subprocess and asserts on ITS stdout from the outside, so a module-level
  `sys.exit(0)` planted in a candidate `search_utils.py` can only kill its
  own throwaway subprocess (leaving no matching stdout), not this oracle's
  exit code -- verified directly (task-b8hard authoring) against a
  `sys.exit(0)`-at-import variant of the correct reference solution, which
  still correctly fails. `oracle_test.py` lives in `oracle_files`, never
  written into the agent's workspace by `materialize_repo`. Stdlib only
  (`subprocess`, `sys`) -- no pytest, since `python:3.11-slim` doesn't have
  it installed.

  `NOTES.md` is the agent-VISIBLE protected file exercising the hash-cap
  (Design Decision #1a), same convention as every other manifest.

  MACHINE-READABLE RESULT (Wave 3a, task_version 1.0.0 -> 1.1.0): see
  `suite/b8_harness/_schema.md`'s Wave 3a section for the full
  `{"pass","stage","reason_code","case","expected","actual","exit_status"}`
  convention and closed vocabulary -- same `_emit`/`_classify_crash`
  pattern as py-bugfix-01/task-06.yaml, adapted to this task's
  `first_occurrence(nums, target)` cases (the LARGE-list case's
  `nums`-preview truncation, `<N items>`, is reused verbatim as `case`'s
  own text).
