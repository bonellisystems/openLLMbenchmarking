              self._min = None
              self._max = None
              self._grand_count = 0
              self._grand_sum = 0
              self._grand_min = None
              self._grand_max = None

          def add(self, value):
              self._count += 1
              self._sum += value
              self._min = value if self._min is None else min(self._min, value)
              self._max = value if self._max is None else max(self._max, value)
              self._grand_count += 1
              self._grand_sum += value
              self._grand_min = value if self._grand_min is None else min(self._grand_min, value)
              self._grand_max = value if self._grand_max is None else max(self._grand_max, value)

          def end_batch(self):
              if self._count == 0:
                  raise ValueError("cannot end an empty batch")
