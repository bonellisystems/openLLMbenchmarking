                  "count": self._count,
                  "sum": self._sum,
                  "min": self._min,
                  "max": self._max,
                  "avg": self._sum / self._count,
              }
              self._count = 0
              self._sum = 0
              self._min = None
              self._max = None
              return result

          def grand_count(self):
              return self._grand_count

          def grand_sum(self):
              return self._grand_sum

