notes: |
  Shape: multi-file (Wave 4, W4B1 cross-module-contract batch) --
  an EXCEPTION-TYPE contract, a different flavor of cross-module interface
  than a signature/return-shape contract: `settings_loader.load_setting`
  (protected, the existing caller) only catches `ValueError` by design, so
  `parse_int_setting` raising anything else for an invalid input silently
  breaks the caller's fallback-to-default behavior. Malformed numeric TEXT
  already raises `ValueError` correctly via `int()`'s own behavior (not
  part of the planted bug) -- the defect is narrowly the `None`/non-str
  path, where `raw.strip()` raises `AttributeError` instead. Direct
  `try/except` checks on `parse_int_setting` itself (not just through
  `load_setting`) additionally pin down the exact exception TYPE, not
  merely "did load_setting happen to return the default".

  Verified empirically: the ORIGINAL unfixed `config_parser.py` fails the
  very first invalid case, `load_setting(None, -1)` -> the subprocess
  crashes with `AttributeError: 'NoneType' object has no attribute
  'strip'` (stage `behavior`, reason `runtime_error`) instead of returning
  `-1`. `check_fixtures.wrong[1]` (special-cases `None` by returning `0`
  directly instead of raising `ValueError`) fails
  `load_setting(None, -1)` with wrong VALUE `0` instead of `-1`, and still
  crashes on the non-`None`-non-str case (`raw=42`). `check_fixtures.
  wrong[2]` (coerces via `str(raw)` instead of type-checking, and returns
  `0` for an empty string instead of raising) fails on `raw=42` (silently
  "succeeds" as `42` instead of falling back to the default) and on
  `raw=""` (returns `0` instead of `-1`).
