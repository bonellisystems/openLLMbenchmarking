id: py-xmod-06
shape: multi-file
task_version: "1.0.0"
prompt: |
  The repo has two files:

  - `config_parser.py` -- `parse_int_setting(raw)`, meant to parse `raw` as
    an int. Contract other code relies on: on ANY invalid input -- `raw` is
    `None`, `raw` is not a string at all, or `raw` is a string that isn't a
    valid (optionally `+`/`-` signed, optional surrounding whitespace)
    integer -- this function must raise `ValueError`, and ONLY
    `ValueError`, never any other exception type. Valid integer strings
    (with any surrounding whitespace, and an optional leading `+`/`-`
    sign) must still parse correctly, unchanged.
  - `settings_loader.py` -- `load_setting(raw, default=0)`, an EXISTING
    caller elsewhere in this codebase: parses `raw` via
    `parse_int_setting`, falling back to `default` (and never raising) on
    ANY invalid input. This relies ENTIRELY on `parse_int_setting` raising
    `ValueError` -- and only `ValueError` -- for every invalid case; any
    other exception type propagates straight through `load_setting`
    uncaught. Must keep working.

  Malformed numeric TEXT (e.g. `"abc"`, `"3.5"`) already correctly raises
  `ValueError` today. The bug: when `raw` is `None` or not a string at all
  (e.g. an int, a list), `parse_int_setting` crashes with a DIFFERENT
  exception type instead of `ValueError`, which `settings_loader.
  load_setting`'s `except ValueError` does not catch -- the exception
  propagates uncaught instead of falling back to `default`. Fix
  `parse_int_setting` so it raises `ValueError` (and only `ValueError`)
  for every kind of invalid input, while valid integer strings keep
  parsing exactly as they do today. Only modify `config_parser.py` -- do
  not create or edit any other file (including `settings_loader.py` or
  `NOTES.md`).
allowed_tools: [read_file, write_file, list_files, bash_exec]
budgets: {wall_clock_s: 240, tokens: 5000, steps: 12}
setup_repo:
  config_parser.py: |
    def parse_int_setting(raw):
        """Parse `raw` as an int. Contract other code relies on: on ANY
        invalid input -- `raw` is None, `raw` is not a string at all, or
        `raw` is a string that isn't a valid (optionally +/- signed, optional
        surrounding whitespace) integer -- this function must raise
        ValueError, and ONLY ValueError, never any other exception type;
        callers catch ValueError specifically to fall back to a default."""
        stripped = raw.strip()
        return int(stripped)
  settings_loader.py: |
    from config_parser import parse_int_setting


    def load_setting(raw, default=0):
        """Existing integration: parse `raw` as an int setting, falling back
        to `default` on ANY invalid input -- relies on parse_int_setting
        raising ValueError (and ONLY ValueError) for every invalid case, per
        its documented contract."""
        try:
            return parse_int_setting(raw)
        except ValueError:
            return default
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import json
    import subprocess
    import sys


    def _classify_crash(stderr):
        """Best-effort (stage, reason_code, actual) classification for a
        candidate subprocess that exited nonzero before producing usable
        stdout -- inspects stderr TEXT only. Falls back to the generic
        "behavior"/"runtime_error" bucket for anything not recognized
        (e.g. an uncaught exception raised from inside a normal call, not
        at import/parse time) rather than guessing further."""
        text = stderr or ""
        if "SyntaxError" in text or "IndentationError" in text:
            stage, reason_code = "compile", "syntax_error"
        elif "ModuleNotFoundError" in text or "ImportError" in text:
            stage, reason_code = "import", "import_error"
        else:
            stage, reason_code = "behavior", "runtime_error"
        tail = text.strip().splitlines()
        return stage, reason_code, (tail[-1] if tail else "(no stderr)")


    def _emit(passed, *, case=None, expected=None, actual=None,
              stage="behavior", reason_code=None):
        """Print the human-readable PASS/FAIL line (unchanged, kept for
        local debugging), THEN the ONE machine-readable JSON result line
        -- the B8 oracle convention (Wave 3a; see llmtest/harness/tasks.py's
        run_oracle, which parses the LAST JSON line of stdout into
        det_checks.oracle's structured fields, falling back to this human
        line only when no JSON parses). `actual` may embed
        candidate-controlled output; run_oracle independently bounds it
        before it reaches trusted classifier evidence."""
        exit_status = 0 if passed else 1
        if passed:
            print("PASS")
        else:
            print(f"FAIL: {case} -> {actual!r} (want {expected!r})")
        print(json.dumps({
            "pass": bool(passed), "stage": stage, "reason_code": reason_code,
            "case": case, "expected": expected, "actual": actual,
            "exit_status": exit_status,
        }))
        sys.exit(exit_status)


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import` any
        candidate module into THIS process (SUBPROCESS-ISOLATED convention
        every Python B8 oracle follows: a module-level `sys.exit(0)` in any
        candidate file can only kill its own throwaway subprocess, leaving
        no matching stdout, so comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want, tol=0.005):
        try:
            return abs(float(out) - float(want)) < tol
        except ValueError:
            return False


    VALID_CASES = [
        ("42", 42), (" 7 ", 7), ("-3", -3), ("+5", 5), ("0", 0), ("  100  ", 100),
    ]

    INVALID_CASES = [
        None, 42, "", "   ", "abc", "3.5", [1, 2], 4.5,
    ]

    DEFAULT = -1


    def main():
        for raw, want in VALID_CASES:
            code = ("import settings_loader\n"
                    f"print(settings_loader.load_setting({raw!r}, {DEFAULT!r}))\n")
            r = _run(code)
            case = f"load_setting({raw!r}, {DEFAULT})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(want), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != str(want):
                _emit(False, case=case, expected=str(want), actual=got,
                      stage="behavior", reason_code="wrong_output")

        for raw in INVALID_CASES:
            code = ("import settings_loader\n"
                    f"print(settings_loader.load_setting({raw!r}, {DEFAULT!r}))\n")
            r = _run(code)
            case = f"load_setting({raw!r}, {DEFAULT})  # invalid -> default"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected=str(DEFAULT), actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != str(DEFAULT):
                _emit(False, case=case, expected=str(DEFAULT), actual=got,
                      stage="behavior", reason_code="wrong_output")

        # Direct exception-TYPE checks -- confirm it is specifically
        # ValueError, not just "some exception load_setting happens to catch".
        for raw in [None, 42, "abc", [1, 2]]:
            code = ("import config_parser\n"
                    "try:\n"
                    f"    config_parser.parse_int_setting({raw!r})\n"
                    "    print('NO_EXCEPTION')\n"
                    "except ValueError:\n"
                    "    print('ValueError')\n"
                    "except Exception as e:\n"
                    "    print(type(e).__name__)\n")
            r = _run(code)
            case = f"type(raised) for parse_int_setting({raw!r})"
            if r.returncode != 0:
                stage, reason_code, actual = _classify_crash(r.stderr)
                _emit(False, case=case, expected="ValueError", actual=actual,
                      stage=stage, reason_code=reason_code)
            got = r.stdout.strip()
            if got != "ValueError":
                _emit(False, case=case, expected="ValueError", actual=got,
                      stage="behavior", reason_code="wrong_output")
        _emit(True)


    if __name__ == "__main__":
        main()
