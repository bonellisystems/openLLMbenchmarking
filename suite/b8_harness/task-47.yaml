      import re

      _VALID_RE = re.compile(r'^[A-Za-z_][A-Za-z0-9_]*$')
      _BLOCKLIST = {"admin", "root", "administrator", "null", "undefined", "system"}


      def validate_username(raw):
          if not isinstance(raw, str):
              raise ValueError("username must be a string")
          if not (3 <= len(raw) <= 20):
              raise ValueError("username length out of range")
          if not _VALID_RE.match(raw):
              raise ValueError(f"username has an invalid format: {raw!r}")
          if raw.casefold() in _BLOCKLIST:
              raise ValueError(f"username {raw!r} is reserved")
          return raw
