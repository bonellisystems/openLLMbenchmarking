id: py-hard-toolheavy-01
shape: tool-heavy
task_version: "1.0.0"
prompt: |
  The repo is a small grade-reporting system, split across 5 files:

  - `roster.py` -- a fixed list of `(name, raw_score)` tuples.
  - `stats.py` -- `average(scores)`, the class average of a list of
    numbers.
  - `curve.py` -- `apply_curve(score, class_average, target_average=75)`,
    which shifts a raw score by half the gap between `target_average` and
    the class's actual `class_average`, then clamps the result to the
    valid 0-100 range.
  - `letter_grade.py` -- `letter_grade(score)`, which is supposed to
    convert a (curved) numeric score to a letter grade using the standard
    scale: `A` for 90-100, `B` for 80-89, `C` for 70-79, `D` for 60-69, `F`
    below 60.
  - `report.py` -- `build_report(target_average=75)`, which wires all of
    the above together: computes the class average, curves every
    student's score, converts each curved score to a letter grade, and
    formats a report line per student.

  The report is producing wrong letter grades for students whose curved
  score lands exactly on a scale boundary: for instance, a curved score of
  exactly `90.0` should be graded `A` under the stated scale above, but the
  system currently reports `B` for a score of exactly `90.0` (and the same
  kind of off-by-one shows up at the `80`, `70`, and `60` boundaries too).

  Read whatever files you need to in order to find the ACTUAL root cause
  of this discrepancy -- not every file that looks unusual or worth a
  second look is actually the source of the bug, so verify against the
  stated scale carefully rather than guessing. Once you've found it, fix
  ONLY the one file responsible so `letter_grade(score)` correctly matches
  the stated scale (inclusive on every boundary: a score of exactly `90`
  is `A`, exactly `80` is `B`, exactly `70` is `C`, exactly `60` is `D`).

  This task touches several small files -- if your harness supports
  delegating a self-contained subtask like "check each of these 5 files
  against the stated contract and report which one doesn't match" to a
  subagent, this is a reasonable place to do it.

  You may modify ONLY `letter_grade.py`. Do not create or edit any other
  file (including `roster.py`, `stats.py`, `curve.py`, `report.py`, or
  `NOTES.md`) -- even if you notice something about one of them you'd
  otherwise want to change.
allowed_tools: [read_file, write_file, list_files, bash_exec, subagent_spawn]
budgets: {wall_clock_s: 300, tokens: 6000, steps: 16}
setup_repo:
  roster.py: |
    ROSTER = [
        ("Alice", 92),
        ("Bob", 78),
        ("Carla", 65),
        ("Dev", 55),
        ("Elin", 88),
    ]
  stats.py: |
    def average(scores):
        return sum(scores) / len(scores)
  curve.py: |
    def apply_curve(score, class_average, target_average=75):
        """Shift `score` by half the gap between `target_average` and the
        class's actual `class_average`, then clamp the result to the
        valid 0-100 range."""
        adjustment = (target_average - class_average) / 2
        curved = score + adjustment
        return max(0, min(100, curved))
  letter_grade.py: |
    def letter_grade(score):
        """Convert a numeric score (0-100) to a letter grade using the
        standard scale: A 90-100, B 80-89, C 70-79, D 60-69, F below 60."""
        if score > 90:
            return "A"
        elif score > 80:
            return "B"
        elif score > 70:
            return "C"
        elif score > 60:
            return "D"
        else:
            return "F"
  report.py: |
    from stats import average
    from curve import apply_curve
    from letter_grade import letter_grade
    from roster import ROSTER


    def build_report(target_average=75):
        scores = [score for _, score in ROSTER]
        avg = average(scores)
        lines = []
        for name, score in ROSTER:
            curved = apply_curve(score, avg, target_average)
            grade = letter_grade(curved)
            lines.append(f"{name}: {curved:.1f} -> {grade}")
        return "\n".join(lines)
  NOTES.md: |
    # Task metadata

    This file is part of the task fixture. Do not edit it.
oracle_files:
  oracle_test.py: |
    import subprocess
    import sys

    GRADE_CASES = [
        (100, "A"), (95, "A"), (90, "A"), (90.0, "A"), (92.5, "A"),
        (89.999, "B"), (89, "B"), (85, "B"), (80, "B"), (80.0, "B"),
        (79.999, "C"), (79, "C"), (75, "C"), (70, "C"), (70.0, "C"),
        (69.999, "D"), (69, "D"), (65, "D"), (60, "D"), (60.0, "D"),
        (59.999, "F"), (59, "F"), (30, "F"), (0, "F"),
    ]

    AVERAGE_CASES = [
        ([80, 90, 100], 90),
        ([100], 100),
        ([70, 70, 70, 70], 70),
    ]

    CURVE_CASES = [
        (70, 75, 75, 70),
        (50, 65, 75, 55),
        (98, 60, 75, 100),
        (2, 90, 75, 0),
    ]


    def _run(code):
        """Run generated `code` in a FRESH subprocess -- never `import`
        any of these modules into THIS process (see py-multifile-01's
        oracle notes for the full anti-gaming rationale: a module-level
        `sys.exit(0)` in any candidate module can only kill its own
        throwaway subprocess, leaving no matching stdout, so the
        comparisons below still correctly fail)."""
        return subprocess.run([sys.executable, "-c", code], capture_output=True,
                              text=True, timeout=10)


    def _numeric_match(out, want):
        try:
            return abs(float(out) - float(want)) < 0.005
        except ValueError:
            return False


    def _check_average():
        for scores, want in AVERAGE_CASES:
            code = f"import stats\nprint(stats.average({scores!r}))\n"
            r = _run(code)
            got = r.stdout.strip()
            if not _numeric_match(got, want):
                print(f"FAIL: stats.average({scores!r}) -> {got!r} (want {want!r}); "
                      f"exit={r.returncode} stderr={r.stderr.strip()!r}")
                return False
        return True


    def _check_curve():
        for score, class_average, target_average, want in CURVE_CASES:
            code = (f"import curve\nprint(curve.apply_curve({score!r}, {class_average!r}, "
                    f"{target_average!r}))\n")
            r = _run(code)
            got = r.stdout.strip()
            if not _numeric_match(got, want):
                print(f"FAIL: curve.apply_curve({score!r}, {class_average!r}, "
                      f"{target_average!r}) -> {got!r} (want {want!r}); "
                      f"exit={r.returncode} stderr={r.stderr.strip()!r}")
                return False
        return True


    def _check_grades():
        for score, want in GRADE_CASES:
            code = f"import letter_grade\nprint(letter_grade.letter_grade({score!r}))\n"
            r = _run(code)
            got = r.stdout.strip()
            if got != want:
                print(f"FAIL: letter_grade.letter_grade({score!r}) -> {got!r} "
                      f"(want {want!r}); exit={r.returncode} stderr={r.stderr.strip()!r}")
                return False
        return True


    def main():
        # average()/apply_curve() are re-verified behaviorally too --
        # defense in depth on top of their protected-hash check (mirrors
        # py-toolheavy-01's rationale for re-verifying every handler, not
        # just the one that was supposed to change) -- but the REAL fix
        # target is letter_grade(), checked last and most thoroughly.
        if not _check_average():
            sys.exit(1)
        if not _check_curve():
            sys.exit(1)
        if not _check_grades():
            sys.exit(1)
        print("PASS")


    if __name__ == "__main__":
        main()
protected_paths: [roster.py, stats.py, curve.py, report.py, NOTES.md]
allowed_diff_paths: [letter_grade.py]
oracle:
  type: command
  argv: ["bash", "-c", "set -e; cp -r /oracle /tmp/work && cd /tmp/work && python3 oracle_test.py"]
notes: |
  Shape: tool-heavy (HARD tier, task-b8hard) -- unlike py-toolheavy-01
  (task-10.yaml, 5 near-identical `handler_*.py` files where exactly one
  violates an explicit numeric contract and the other 4 are simply
  correct), this variant adds a genuine DECOY: `curve.py`'s
  `apply_curve` has an unusual-looking formula (a `/2` adjustment, a
  `target_average` magic default, a min/max clamp) that is fully CORRECT
  -- it is deliberately the file most likely to draw suspicion from a
  model pattern-matching on "looks like it could be an off-by-something
  bug" without actually checking it against a spec. The REAL root cause
  is in `letter_grade.py`: a uniform `>` vs `>=` boundary bug (each of the
  four thresholds should be inclusive) that is easy to miss if a model
  either doesn't compare the code against its own docstring's stated
  scale, or spends its edit budget "fixing" the decoy instead. Both
  `roster.py` (pure data, no logic to suspect) and `stats.py` (a single
  trivial correct line) round out the "several small files to actually
  read" requirement without adding a second real bug to reason about.

  Anti-gaming note (mirrors py-toolheavy-01): `protected_paths`/
  `allowed_diff_paths` are oracle-side bookkeeping only, never surfaced to
  the agent's workspace or tools -- listing only `letter_grade.py` as
  diff-allowed does not itself reveal which file is buggy; the agent still
  has to find it. A model that "plays it safe" and edits multiple files
  (e.g. also touching `curve.py`) fails the hard-cap diff-constraint
  before the behavioral oracle even runs, regardless of whether
  `letter_grade.py` itself was correctly fixed.

  Verified empirically (task-b8hard authoring): a correctly-fixed
  reference (`>=` on all four boundaries) passes every case; the ORIGINAL
  unfixed file (`>` on all four boundaries, exactly as shipped above)
  fails on the first boundary case, `letter_grade.letter_grade(90)` ->
  `'B'` (want `'A'`) -- proving the oracle discriminates on the intended
  edge, not just on total breakage. The boundary matrix covers all four
  thresholds at the exact integer, the exact float (`90.0`), and just
  below (`89.999`) -- a `>`-vs-`>=` bug can ONLY be caught at the exact
  boundary value, so those four cases are the load-bearing ones; the
  interior values (`95`, `85`, `30`, ...) are there so a solution can't
  "pass" by special-casing just the four known boundary numbers.

  Hidden oracle, SUBPROCESS-ISOLATED from the start (mirrors every
  existing Python B8 oracle): `letter_grade`/`stats`/`curve` are never
  `import`ed into this checker's own process; every check launches a
  fresh `python3 -c "..."` subprocess and asserts on ITS stdout from the
  outside -- a module-level `sys.exit(0)` in the candidate
  `letter_grade.py` can only kill its own throwaway subprocess (verified
  directly, task-b8hard authoring, against a `sys.exit(0)`-at-import
  variant of the correct reference, which still correctly fails).
  `oracle_test.py` lives in `oracle_files`, never written into the
  agent's workspace. Stdlib only (`subprocess`, `sys`) -- no pytest.

  `roster.py`/`stats.py`/`curve.py`/`report.py` are agent-VISIBLE,
  protected, hash-checked (Design Decision #1a) AND individually
  re-verified behaviorally (`average`/`apply_curve`) for defense in depth,
  same rationale py-toolheavy-01 gives for re-checking every handler.
  `NOTES.md` is the agent-VISIBLE protected fixture exercising the
  hash-cap, same convention as every other manifest.
