<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .game-wrapper {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .side-panel {
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .panel-box {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .panel-box h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }
  .panel-box .value {
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #next-canvas {
    display: block;
    margin: 8px auto 0;
  }
  .board-container {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(123, 47, 247, 0.3), 0 0 120px rgba(0, 212, 255, 0.1);
  }
  #game-canvas {
    display: block;
    background: #0f0f3a;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 32px; }
  .overlay p { color: rgba(255,255,255,0.6); font-size: 14px; }
  button.play-btn {
    margin-top: 8px;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: linear-gradient(135deg, #7b2ff7, #00d4ff);
    color: #fff;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button.play-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(123,47,247,0.5);
  }
  .controls-info {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    line-height: 1.8;
  }
  .controls-info kbd {
    background: rgba(255,255,255,0.1);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: inherit;
    color: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="side-panel">
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next-canvas" width="100" height="80"></canvas>
    </div>
    <div class="controls-info">
      <kbd>←</kbd> <kbd>→</kbd> Move<br>
      <kbd>↑</kbd> Rotate<br>
      <kbd>↓</kbd> Soft Drop<br>
      <kbd>Space</kbd> Hard Drop<br>
      <kbd>P</kbd> Pause
    </div>
  </div>

  <div class="board-container">
    <canvas id="game-canvas" width="300" height="600"></canvas>
    <div class="overlay" id="start-overlay">
      <h2>TETRIS</h2>
      <p>A classic block puzzle game</p>
      <button class="play-btn" id="start-btn">PLAY</button>
    </div>
    <div class="overlay hidden" id="pause-overlay">
      <h2>PAUSED</h2>
      <button class="play-btn" id="resume-btn">RESUME</button>
    </div>
    <div class="overlay hidden" id="gameover-overlay">
      <h2>GAME OVER</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <button class="play-btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const COLS = 10;
const ROWS = 20;
const BLOCK = 30;
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nextCtx = nextCanvas.getContext('2d');

const COLORS = {
  I: '#00d4ff',
  O: '#ffd700',
  T: '#b44dff',
  S: '#00e676',
  Z: '#ff1744',
  J: '#2979ff',
  L: '#ff9100'
};

const SHAPES = {
  I: [[0,0],[1,0],[2,0],[3,0]],
  O: [[0,0],[1,0],[0,1],[1,1]],
  T: [[0,0],[1,0],[2,0],[1,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]]
};

const PIECE_NAMES = ['I','O','T','S','Z','J','L'];

let board, currentPiece, nextPiece, score, level, lines;
let dropInterval, dropTimer, lastTime, gameRunning, paused;
let animatingRows = [];
let animationProgress = 0;

function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function randomPiece() {
  const name = PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)];
  const blocks = SHAPES[name].map(b => [...b]);
  return { name, blocks, x: Math.floor((COLS - 3) / 2), y: 0 };
}

function rotatePiece(piece) {
  // Find center of bounding box for rotation
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  piece.blocks.forEach(([x,y]) => {
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
  });
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;

  return piece.blocks.map(([x, y]) => {
    const dx = x - cx;
    const dy = y - cy;
    return [Math.round(cx - dy + (cy - cx)), Math.round(cy + dx + (cx - cy))];
  });
}

function isValid(piece, blocks, offsetX, offsetY) {
  for (const [bx, by] of blocks) {
    const nx = piece.x + bx + offsetX;
    const ny = piece.y + by + offsetY;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
    if (ny >= 0 && board[ny][nx]) return false;
  }
  return true;
}

function lockPiece() {
  for (const [bx, by] of currentPiece.blocks) {
    const nx = currentPiece.x + bx;
    const ny = currentPiece.y + by;
    if (ny < 0) { gameOver(); return; }
    board[ny][nx] = currentPiece.name;
  }
  clearLines();
}

function clearLines() {
  const fullRows = [];
  for (let r = 0; r < ROWS; r++) {
    if (board[r].every(cell => cell !== null)) {
      fullRows.push(r);
    }
  }
  if (fullRows.length > 0) {
    animatingRows = fullRows;
    animationProgress = 0;
    setTimeout(() => {
      for (const r of fullRows.sort((a,b) => b - a)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(null));
      }
      const count = fullRows.length;
      lines += count;
      const points = [0, 100, 300, 500, 800];
      score += (points[count] || 0) * level;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(50, 1000 - (level - 1) * 80);
      updateUI();
      animatingRows = [];
    }, 300);
  } else {
    spawnPiece();
  }
}

function spawnPiece() {
  currentPiece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  // Center the piece
  let minX = Infinity, maxX = -Infinity;
  currentPiece.blocks.forEach(([x]) => { minX = Math.min(minX,x); maxX = Math.max(maxX,x); });
  currentPiece.x = Math.floor((COLS - (maxX - minX + 1)) / 2);
  currentPiece.y = -Math.min(...currentPiece.blocks.map(([,y]) => y));

  if (!isValid(currentPiece, currentPiece.blocks, 0, 0)) {
    gameOver();
  }
  drawNext();
}

function getGhostY() {
  let ghostY = 0;
  while (isValid(currentPiece, currentPiece.blocks, 0, ghostY + 1)) {
    ghostY++;
  }
  return ghostY;
}

function hardDrop() {
  const ghostY = getGhostY();
  score += ghostY * 2;
  updateUI();
  currentPiece.y += ghostY;
  lockPiece();
}

function drawBlock(context, x, y, color, size, alpha = 1) {
  const padding = 1;
  context.globalAlpha = alpha;
  context.fillStyle = color;
  context.fillRect(x * size + padding, y * size + padding, size - padding * 2, size - padding * 2);

  // Highlight
  context.fillStyle = 'rgba(255,255,255,0.2)';
  context.fillRect(x * size + padding, y * size + padding, size - padding * 2, 3);
  context.fillRect(x * size + padding, y * size + padding, 3, size - padding * 2);

  // Shadow
  context.fillStyle = 'rgba(0,0,0,0.2)';
  context.fillRect(x * size + padding, (y + 1) * size - padding - 3, size - padding * 2, 3);
  context.fillRect((x + 1) * size - padding - 3, y * size + padding, 3, size - padding * 2);

  context.globalAlpha = 1;
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * BLOCK, 0); ctx.lineTo(x * BLOCK, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * BLOCK); ctx.lineTo(canvas.width, y * BLOCK); ctx.stroke();
  }

  // Board cells
  for (let r = 0; r < ROWS; r++) {
    const isAnimating = animatingRows.includes(r);
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) {
        let alpha = 1;
        if (isAnimating) {
          // Flash effect during line clear animation
          const flash = Math.sin(Date.now() / 50) * 0.5 + 0.5;
          ctx.globalAlpha = flash;
          drawBlock(ctx, c, r, '#ffffff', BLOCK);
          ctx.globalAlpha = 1;
        } else {
          drawBlock(ctx, c, r, COLORS[board[r][c]], BLOCK);
        }
      }
    }
  }

  if (!currentPiece || animatingRows.length > 0) return;

  // Ghost piece
  const ghostY = getGhostY();
  for (const [bx, by] of currentPiece.blocks) {
    const gx = currentPiece.x + bx;
    const gy = currentPiece.y + by + ghostY;
    if (gy >= 0) {
      drawBlock(ctx, gx, gy, COLORS[currentPiece.name], BLOCK, 0.15);
    }
  }

  // Current piece
  for (const [bx, by] of currentPiece.blocks) {
    const nx = currentPiece.x + bx;
    const ny = currentPiece.y + by;
    if (ny >= 0) {
      drawBlock(ctx, nx, ny, COLORS[currentPiece.name], BLOCK);
    }
  }
}

function drawNext() {
  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nextPiece.blocks.forEach(([x,y]) => {
    minX = Math.min(minX,x); minY = Math.min(minY,y);
    maxX = Math.max(maxX,x); maxY = Math.max(maxY,y);
  });
  const w = maxX - minX + 1;
  const h = maxY - minY + 1;
  const size = 20;
  const offX = (nextCanvas.width - w * size) / 2;
  const offY = (nextCanvas.height - h * size) / 2;

  for (const [bx, by] of nextPiece.blocks) {
    const dx = bx - minX;
    const dy = by - minY;
    const px = offX + dx * size;
    const py = offY + dy * size;
    nextCtx.fillStyle = COLORS[nextPiece.name];
    nextCtx.fillRect(px + 1, py + 1, size - 2, size - 2);
    nextCtx.fillStyle = 'rgba(255,255,255,0.2)';
    nextCtx.fillRect(px + 1, py + 1, size - 2, 3);
    nextCtx.fillRect(px + 1, py + 1, 3, size - 2);
  }
}

function updateUI() {
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

function gameOver() {
  gameRunning = false;
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('gameover-overlay').classList.remove('hidden');
}

function startGame() {
  board = createBoard();
  score = 0; level = 1; lines = 0;
  dropInterval = 1000;
  dropTimer = 0;
  lastTime = 0;
  gameRunning = true;
  paused = false;
  animatingRows = [];
  nextPiece = null;
  updateUI();
  spawnPiece();
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('gameover-overlay').classList.add('hidden');
  document.getElementById('pause-overlay').classList.add('hidden');
  requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!gameRunning) return;
  if (paused) { requestAnimationFrame(gameLoop); return; }

  const delta = timestamp - lastTime;
  lastTime = timestamp;

  dropTimer += delta;
  if (dropTimer >= dropInterval && animatingRows.length === 0) {
    dropTimer = 0;
    if (!isValid(currentPiece, currentPiece.blocks, 0, 1)) {
      lockPiece();
    } else {
      currentPiece.y++;
    }
  }

  drawBoard();
  requestAnimationFrame(gameLoop);
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (!gameRunning || paused) {
    if (e.key === 'p' || e.key === 'P') {
      // handled below
    }
    return;
  }

  if (animatingRows.length > 0) return;

  switch(e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      if (isValid(currentPiece, currentPiece.blocks, -1, 0)) currentPiece.x--;
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (isValid(currentPiece, currentPiece.blocks, 1, 0)) currentPiece.x++;
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (isValid(currentPiece, currentPiece.blocks, 0, 1)) {
        currentPiece.y++;
        score += 1;
        updateUI();
        dropTimer = 0;
      }
      break;
    case 'ArrowUp':
      e.preventDefault();
      tryRotate();
      break;
    case ' ':
      e.preventDefault();
      hardDrop();
      break;
    case 'p': case 'P':
      togglePause();
      break;
  }
});

function tryRotate() {
  const rotated = rotatePiece(currentPiece);
  // Try normal rotation, then wall kicks
  const kicks = [0, -1, 1, -2, 2];
  for (const kick of kicks) {
    if (isValid(currentPiece, rotated, kick, 0)) {
      currentPiece.blocks = rotated;
      currentPiece.x += kick;
      return;
    }
    // Also try kicking up
    if (isValid(currentPiece, rotated, kick, -1)) {
      currentPiece.blocks = rotated;
      currentPiece.x += kick;
      currentPiece.y -= 1;
      return;
    }
  }
}

function togglePause() {
  paused = !paused;
  if (paused) {
    document.getElementById('pause-overlay').classList.remove('hidden');
  } else {
    document.getElementById('pause-overlay').classList.add('hidden');
    lastTime = performance.now();
  }
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('resume-btn').addEventListener('click', togglePause);
</script>
</body>
</html>
