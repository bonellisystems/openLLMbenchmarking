<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; }
  #gameBoard { margin: 20px; }
  .cell { width: 20px; height: 20px; border: 1px solid #333; display: inline-block; }
</style>
</head>
<body>

<div id="gameBoard"></div>

<script>
const rows = 20;
const cols = 10;
const gameBoard = document.getElementById('gameBoard');

// Piece shapes
const shapes = [
  [[1, 1, 1, 1]], // I
  [[1, 1], [1, 1]], // O
  [[1, 1, 1], [0, 1, 0]], // T
  [[1, 1, 0], [0, 1, 1]], // S
  [[0, 1, 1], [1, 1, 0]], // Z
  [[1, 1, 1], [1, 0, 0]], // J
  [[1, 1, 1], [0, 0, 1]]  // L
];

let board = Array(rows).fill().map(() => Array(cols).fill(0));
let currentPiece = { shape: shapes[Math.floor(Math.random() * shapes.length)], x: 0, y: 0, rotation: 0 };
let interval;

function draw() {
  gameBoard.innerHTML = '';
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.backgroundColor = board[row][col] ? 'blue' : 'transparent';
      gameBoard.appendChild(cell);
    }
  }
}

function placePiece() {
  for (let row = 0; row < currentPiece.shape.length; row++) {
    for (let col = 0; col < currentPiece.shape[row].length; col++) {
      if (currentPiece.shape[row][col]) {
        board[row + currentPiece.y][col + currentPiece.x] = 1;
      }
    }
  }
}

function clearLines() {
  for (let row = board.length - 1; row >= 0; row--) {
    if (board[row].every(cell => cell === 1)) {
      board.splice(row, 1);
      board.unshift(Array(cols).fill(0));
    }
  }
}

function checkGameOver() {
  const pieceTopRow = currentPiece.shape.length + currentPiece.y;
  return pieceTopRow < 0 && currentPiece.shape.some(row => row.includes(1) && board[pieceTopRow][currentPiece.x] === 1);
}

function rotatePiece() {
  const newShape = [];
  for (let col = 0; col < currentPiece.shape[0].length; col++) {
    const newRow = [];
    for (let row = currentPiece.shape.length - 1; row >= 0; row--) {
      newRow.push(currentPiece.shape[row][col]);
    }
    newShape.push(newRow);
  }
  currentPiece.shape = newShape;
}

function movePiece(dx, dy) {
  currentPiece.x += dx;
  currentPiece.y += dy;
  if (checkCollision()) {
    if (dy !== 0) {
      placePiece();
      clearLines();
      currentPiece = { shape: shapes[Math.floor(Math.random() * shapes.length)], x: 0, y: 0, rotation: 0 };
    } else {
      currentPiece.x -= dx;
      currentPiece.y -= dy;
    }
    if (checkGameOver()) {
      clearInterval(interval);
      alert('Game Over');
    }
  }
}

function checkCollision() {
  for (let row = 0; row < currentPiece.shape.length; row++) {
    for (let col = 0; col < currentPiece.shape[row].length; col++) {
      if (currentPiece.shape[row][col]) {
        const boardRow = row + currentPiece.y;
        const boardCol = col + currentPiece.x;
        if (boardRow < 0 || boardCol < 0 || boardCol >= cols || boardRow >= rows || board[boardRow][boardCol]) {
          return true;
        }
      }
    }
  }
  return false;
}

// Game loop
interval = setInterval(() => {
  if (checkCollision()) {
    placePiece();
    clearLines();
    currentPiece = { shape: shapes[Math.floor(Math.random() * shapes.length)], x: 0, y: 0, rotation: 0 };
  } else {
    currentPiece.y++;
  }
  if (checkGameOver()) {
    clearInterval(interval);
    alert('Game Over');
  }
  draw();
}, 1000);

// Key controls
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowLeft': movePiece(-1, 0); break;
    case 'ArrowRight': movePiece(1, 0); break;
    case 'ArrowUp': rotatePiece(); if (checkCollision()) rotatePiece(); break; // Simple rotation logic, might need adjustment
    case 'ArrowDown': movePiece(0, 1); break;
    case ' ': // Fall piece instantly
      while (!checkCollision()) {
        currentPiece.y++;
      }
      placePiece();
      clearLines();
      currentPiece = { shape: shapes[Math.floor(Math.random() * shapes.length)], x: 0, y: 0, rotation: 0 };
      break;
  }
  draw();
});

draw(); // Initial draw
</script>

</body>
</html>
