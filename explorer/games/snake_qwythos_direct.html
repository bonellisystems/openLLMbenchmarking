<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
#game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
#gameCanvas { border-radius: 8px; box-shadow: 0 0 60px rgba(0, 255, 240, 0.15), inset 0 0 120px rgba(0, 0, 0, 0.6); background: #0d0d14; }
#score-board { position: absolute; top: 20px; left: 20px; color: #00ffc8; font-weight: 700; font-size: 18px; text-shadow: 0 0 14px rgba(0, 255, 200, 0.6); letter-spacing: 1px; pointer-events: none; z-index: 10; display: flex; gap: 24px; }
#score-board span { display: flex; align-items: center; gap: 8px; }
#score-board .label { color: #4a4a5e; font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; }
#score-board .value { color: #00ffc8; font-size: 24px; }
#score-board .value.reserved { color: #3a3a4e; }
#pause-overlay, #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 10, 16, 0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
#pause-overlay.visible, #game-over.visible { opacity: 1; pointer-events: auto; }
#pause-overlay h2 { color: #fff; font-size: 42px; font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 28px rgba(255, 255, 255, 0.55); margin-bottom: 16px; text-transform: uppercase; }
#game-over h2 { color: #ff3860; font-size: 58px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 38px rgba(255, 56, 96, 0.8); margin-bottom: 12px; text-transform: uppercase; }
#game-over .sub { color: #b0b0c2; font-size: 18px; text-shadow: 0 0 14px rgba(255, 255, 255, 0.3); margin-bottom: 32px; }
#game-over .btn { background: linear-gradient(135deg, #00ffc8, #00bcd4); color: #00251e; font-size: 19px; font-weight: 800; padding: 14px 30px; border-radius: 40px; border: none; cursor: pointer; box-shadow: 0 4px 24px rgba(0, 255, 200, 0.45); letter-spacing: 1px; transition: transform 0.18s ease, box-shadow 0.18s ease; }
#game-over .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 38px rgba(0, 255, 200, 0.65); }
#game-over .btn:active { transform: translateY(1px); }
#start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 10, 16, 0.86); z-index: 30; }
#start-overlay h1 { color: #00ffc8; font-size: 64px; font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 42px rgba(0, 255, 200, 0.85); margin-bottom: 24px; text-transform: uppercase; }
#start-overlay .hint { color: #b0b0c2; font-size: 16px; margin-bottom: 40px; text-shadow: 0 0 14px rgba(255, 255, 255, 0.25); }
#start-overlay .btn { background: linear-gradient(135deg, #ff3860, #ff0055); color: #fff; font-size: 20px; font-weight: 800; padding: 16px 38px; border-radius: 42px; border: none; cursor: pointer; box-shadow: 0 6px 32px rgba(255, 56, 96, 0.65); letter-spacing: 2px; transition: transform 0.18s ease, box-shadow 0.18s ease; }
#start-overlay .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 42px rgba(255, 56, 96, 0.85); }
#start-overlay .btn:active { transform: translateY(1px); }
@media (max-width: 720px) { #gameCanvas { border-radius: 4px; } #score-board { top: 12px; left: 12px; font-size: 15px; } #score-board .value { font-size: 20px; } #pause-overlay h2, #game-over h2 { font-size: 38px; } #game-over .btn { font-size: 17px; padding: 13px 28px; } #start-overlay h1 { font-size: 48px; } }
</style>
</head>
<body>
<div id="game-container">
  <div id="score-board">
    <span><span class="label">Score</span><span class="value" id="scoreVal">0</span></span>
    <span><span class="label">Best</span><span class="value reserved" id="highVal">0</span></span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="start-overlay">
    <h1>Neon Snake</h1>
    <div class="hint">Arrow keys or WASD to move • P to pause</div>
    <button class="btn" id="startBtn">START GAME</button>
  </div>
  <div id="pause-overlay">
    <h2>PAUSED</h2>
    <div style="color:#b0b0c2;font-size:15px;letter-spacing:1px;text-shadow:0 0 14px rgba(255,255,255,0.25)">Press P to resume</div>
  </div>
  <div id="game-over">
    <h2>GAME OVER</h2>
    <div class="sub">Score: <span id="finalScore" style="color:#00ffc8;font-weight:700;font-size:24px">0</span></div>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>
<script>
// ============== CONSTANTS ==============
const TILE_SIZE = 26;
const GRID_SIZE = 25;
const BASE_DELAY = 135;
const SPEED_FACTOR = 0.98;
const MAX_SPEED = 48;
const COLORS = {
  bg: '#0d0d14',
  snakeHead: '#00ffc8',
  snakeBody: '#00e6b8',
  snakeEyes: '#0a4a38',
  food: '#ff3860',
  foodGlow: '#ff0055',
  particle: '#ff3860'
};

// ============== STATE ==============
let screenW, screenH, colCount, rowCount;
let canvas, ctx, container;
let score = 0;
let highScore = 0;
let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = { x: 0, y: 0 };
let particles = [];
let speedDelay = BASE_DELAY;
let gameLoopId = null;
let lastTime = 0;
let paused = false;
let gameOver = false;
let running = false;
let resizeFrame = 0;

// ============== DOM ==============
const scoreEl = document.getElementById('scoreVal');
const highEl = document.getElementById('highVal');
const startOverlay = document.getElementById('start-overlay');
const pauseOverlay = document.getElementById('pause-overlay');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

// ============== INITIALIZATION ==============
function init() {
  // Resize canvas once
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  container = document.getElementById('game-container');
  
  highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
  highEl.textContent = highScore;
  
  // Start loop
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  
  // Event listeners
  document.addEventListener('keydown', onKeyDown);
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
}

function resizeCanvas() {
  resizeFrame++;
  if (resizeFrame < 2) return;
  
  const w = container.clientWidth;
  const h = container.clientHeight;
  
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  
  screenW = w;
  screenH = h;
  colCount = Math.floor(w / TILE_SIZE);
  rowCount = Math.floor(h / TILE_SIZE);
}

function startGame() {
  running = true;
  paused = false;
  gameOver = false;
  
  startOverlay.classList.remove('visible');
  pauseOverlay.classList.remove('visible');
  gameOverEl.classList.remove('visible');
  
  // Reset board
  snake = [
    { x: Math.floor(colCount / 2), y: Math.floor(rowCount / 2) },
    { x: Math.floor(colCount / 2) - 1, y: Math.floor(rowCount / 2) },
    { x: Math.floor(colCount / 2) - 2, y: Math.floor(rowCount / 2) }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  speedDelay = BASE_DELAY;
  scoreEl.textContent = '0';
  placeFood();
  
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ============== INPUT ==============
function onKeyDown(e) {
  const k = e.key.toLowerCase();
  let go = false;
  
  if (k === 'arrowup' || k === 'w') {
    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
    go = true;
  } else if (k === 'arrowdown' || k === 's') {
    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
    go = true;
  } else if (k === 'arrowleft' || k === 'a') {
    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
    go = true;
  } else if (k === 'arrowright' || k === 'd') {
    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
    go = true;
  } else if (k === 'p') {
    paused = !paused;
    if (paused) {
      gameOverEl.classList.remove('visible');
      pauseOverlay.classList.add('visible');
    } else {
      pauseOverlay.classList.remove('visible');
    }
    go = true;
  } else if (running && !paused && k === 'enter') {
    startGame();
    go = true;
  }
  
  if (go) e.preventDefault();
}

// ============== GAME LOOP ==============
function gameLoop(now) {
  gameLoopId = requestAnimationFrame(gameLoop);
  const dt = now - lastTime;
  if (!running || paused || gameOver) return;
  
  lastTime = now;
  if (speedDelay <= 0) {
    update();
    speedDelay = Math.max(MAX_SPEED, speedDelay * SPEED_FACTOR);
  } else {
    speedDelay -= dt;
  }
}

// ============== UPDATE ==============
function update() {
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
  
  if (head.x < 0 || head.x >= colCount || head.y < 0 || head.y >= rowCount) {
    endGame();
    return;
  }
  
  const selfCollision = snake.slice(1).some(seg => seg.x === head.x && seg.y === head.y);
  if (selfCollision) {
    endGame();
    return;
  }
  
  snake.unshift(head);
  
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    spawnParticles(food.x * TILE_SIZE + TILE_SIZE / 2, food.y * TILE_SIZE + TILE_SIZE / 2, COLORS.food);
    placeFood();
  } else {
    snake.pop();
  }
}

// ============== DRAW ==============
function draw(now) {
  // Background
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, screenW, screenH);
  
  // Draw grid (subtle)
  ctx.strokeStyle = '#151520';
  ctx.lineWidth = 1;
  for (let i = 1; i < colCount; i++) {
    const x = i * TILE_SIZE;
    ctx.beginPath();
    ctx.rect(x, 0, 1, screenH);
    ctx.stroke();
  }
  for (let j = 1; j < rowCount; j++) {
    const y = j * TILE_SIZE;
    ctx.beginPath();
    ctx.rect(0, y, screenW, 1);
    ctx.stroke();
  }
  
  // Draw food
  drawFood(food.x * TILE_SIZE, food.y * TILE_SIZE);
  
  // Draw snake
  drawSnake();
  
  // Draw particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    drawParticle(p.x, p.y, p.vx, p.vy, p.life, p.color);
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.015;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // Draw UI overlays conditionally
  if (paused) {
    pauseOverlay.classList.add('visible');
  } else if (gameOver) {
    finalScoreEl.textContent = score;
    gameOverEl.classList.add('visible');
  } else {
    pauseOverlay.classList.remove('visible');
    gameOverEl.classList.remove('visible');
  }
}

function drawFood(x, y) {
  const pulse = Math.sin(Date.now() / 280) * 3;
  const r = (TILE_SIZE / 2) - 2 + pulse;
  const glow = r * 0.9;
  
  const grad = ctx.createRadialGradient(x + r - 6, y + r - 6, r * 0.2, x + r, y + r, r);
  grad.addColorStop(0, COLORS.food);
  grad.addColorStop(0.3, COLORS.foodGlow);
  grad.addColorStop(1, '#3a0a12');
  
  ctx.fillStyle = grad;
  ctx.shadowColor = COLORS.foodGlow;
  ctx.shadowBlur = glow + 8;
  ctx.beginPath();
  ctx.arc(x + r, y + r, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawSnake() {
  snake.forEach((seg, i) => {
    const cx = seg.x * TILE_SIZE + TILE_SIZE / 2;
    const cy = seg.y * TILE_SIZE + TILE_SIZE / 2;
    const isHead = i === 0;
    const r = isHead ? (TILE_SIZE / 2) - 2 : (TILE_SIZE / 2) - 3;
    const glow = isHead ? 16 : 6;
    
    const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.2, cx, cy, r);
    grad.addColorStop(0, COLORS.snakeHead);
    grad.addColorStop(0.5, COLORS.snakeBody);
    grad.addColorStop(1, '#005c4a');
    
    ctx.fillStyle = grad;
    ctx.shadowColor = COLORS.snakeHead;
    ctx.shadowBlur = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    if (isHead) {
      // Eyes
      const eyeOffX = direction.x !== 0 ? direction.x * 5 : 4;
      const eyeOffY = direction.y !== 0 ? direction.y * 5 : 4;
      ctx.fillStyle = COLORS.snakeEyes;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(cx - eyeOffX + 4, cy - eyeOffY + 4, 4, 0, Math.PI * 2);
      ctx.arc(cx + eyeOffX - 4, cy + eyeOffY - 4, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawParticle(x, y, vx, vy, life, color) {
  const r = Math.max(1.5, life * 3.5);
  const fade = Math.max(0.1, life);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = r * 0.8;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.globalAlpha = fade;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ============== PARTICLES ==============
function spawnParticles(x, y, color) {
  const count = 12;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
    const spd = 1 + Math.random() * 2.6;
    const vx = Math.cos(angle) * spd;
    const vy = Math.sin(angle) * spd;
    particles.push({
      x: x + 3,
      y: y + 3,
      vx: vx,
      vy: vy,
      life: 1,
      color: color
    });
  }
}

// ============== GAME OVER ==============
function endGame() {
  running = false;
  gameOver = true;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore);
    highEl.textContent = highScore;
  }
}

// ============== PLACE FOOD ==============
function placeFood() {
  do {
    food.x = Math.floor(Math.random() * colCount);
    food.y = Math.floor(Math.random() * rowCount);
  } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
}

// ============== MAIN ==============
init();
</script>
</body>
</html>
