<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
}

#game-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

#hud {
  display: flex;
  justify-content: space-between;
  width: 500px;
  padding: 0 4px;
  font-size: 14px;
  color: #888;
  letter-spacing: 0.5px;
}

.hud-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-item .label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

.hud-item .value {
  font-size: 22px;
  font-weight: 700;
  color: #00e676;
  font-variant-numeric: tabular-nums;
  min-width: 50px;
  text-align: right;
}

.hud-item .value.high { color: #ffab40; }

#canvas-wrap {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 0 0 2px #1a1a3a,
    0 0 40px rgba(0, 230, 118, 0.08),
    0 20px 60px rgba(0, 0, 0, 0.5);
}

canvas {
  display: block;
  background: #0d0d1a;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(10, 10, 26, 0.85);
  backdrop-filter: blur(4px);
  transition: opacity 0.3s;
  z-index: 10;
}

#overlay.hidden { opacity: 0; pointer-events: none; }

#overlay h1 {
  font-size: 42px;
  color: #fff;
  margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(0,230,118,0.3);
}

#overlay h2 {
  font-size: 28px;
  color: #ff5252;
  margin-bottom: 6px;
}

#overlay .subtitle {
  color: #888;
  font-size: 14px;
  margin-bottom: 24px;
}

#overlay .final-score {
  font-size: 16px;
  color: #aaa;
  margin-bottom: 8px;
}

#overlay .final-score span {
  font-size: 36px;
  font-weight: 700;
  color: #00e676;
}

#overlay .high-score {
  font-size: 14px;
  color: #ffab40;
  margin-bottom: 28px;
}

button {
  padding: 12px 40px;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, #00e676, #00c853);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(0,230,118,0.3);
  letter-spacing: 0.5px;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(0,230,118,0.45);
}

button:active { transform: translateY(0); }

#speed-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  font-size: 12px;
  color: #666;
  border: 1px solid rgba(255,255,255,0.08);
}

.speed-bar {
  display: flex;
  gap: 2px;
  align-items: center;
}

.speed-bar .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #333;
  transition: background 0.3s;
}

.speed-bar .dot.active {
  background: #00e676;
  box-shadow: 0 0 6px #00e676;
}

#controls-hint {
  display: flex;
  gap: 24px;
  margin-top: 8px;
  font-size: 12px;
  color: #555;
}

.kbd {
  display: inline-block;
  padding: 2px 7px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.12);
  font-family: inherit;
  font-size: 11px;
  color: #888;
  margin: 0 2px;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.game-over-shake {
  animation: shake 0.4s ease-in-out;
}

#mobile-controls {
  display: none;
  margin-top: 12px;
  gap: 6px;
}

.mobile-controls .dir-btn {
  width: 56px;
  height: 56px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  color: #aaa;
  font-size: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
}

.mobile-controls .dir-btn:active {
  background: rgba(0,230,118,0.2);
  color: #00e676;
}

@media (pointer: coarse) {
  #mobile-controls { display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
  }
}

@media (max-width: 540px) {
  #hud { width: 90vw; }
  canvas { width: 90vw; height: auto; }
  #overlay h1 { font-size: 30px; }
  #overlay h2 { font-size: 22px; }
}
</style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-item">
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="hud-item">
      <span class="label">Best</span>
      <span class="value high" id="high-score">0</span>
    </div>
    <div class="hud-item">
      <span class="label">Speed</span>
      <div class="speed-bar" id="speed-bar"></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game" width="500" height="500"></canvas>

    <div id="overlay">
      <h1 id="overlay-title">🐍 Snake</h1>
      <p class="subtitle" id="overlay-subtitle">Eat food. Grow longer. Don't crash.</p>
      <div class="final-score" id="final-score" style="display:none;">Score: <span id="final-score-val">0</span></div>
      <div class="high-score" id="high-score-display" style="display:none;">Best: <span id="high-score-val">0</span></div>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <div id="controls-hint">
    <span><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> or <span class="kbd">↑</span><span class="kbd">←</span><span class="kbd">↓</span><span class="kbd">→</span> Move</span>
    <span><span class="kbd">Space</span> Pause</span>
  </div>

  <div id="mobile-controls">
    <div class="dir-btn" data-dir="up">▲</div>
    <div class="dir-btn" data-dir="left">◀</div>
    <div class="dir-btn" data-dir="down">▼</div>
    <div class="dir-btn" data-dir="right">▶</div>
  </div>
</div>

<script>
// ─── Constants ───────────────────────────────────────────────────────
const COLS = 20;
const ROWS = 20;
const CELL = 25;
const CANVAS = COLS * CELL;

// ─── Audio ───────────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  ensureAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  switch (type) {
    case 'eat':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t);
      osc.stop(t + 0.12);
      break;
    case 'die':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.35);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t);
      osc.stop(t + 0.35);
      break;
    case 'start':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, t);
      osc.frequency.setValueAtTime(554, t + 0.06);
      osc.frequency.setValueAtTime(659, t + 0.12);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t);
      osc.stop(t + 0.2);
      break;
    case 'grow':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, t);
      osc.frequency.exponentialRampToValueAtTime(1400, t + 0.1);
      gain.gain.setValueAtTime(0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.start(t);
      osc.stop(t + 0.1);
      break;
  }
}

// ─── Game State ──────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let snake = [];
let dir = { x: 1, y: 0 };
let nextDir = { x: 1, y: 0 };
let food = { x: 0, y: 0 };
let score = 0;
let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
let speedLevel = 1;
let gameRunning = false;
let paused = false;
let gameOver = false;
let lastTime = 0;
let tickAccum = 0;
let tickInterval = 150; // ms per tick
let particles = [];
let foodPulse = 0;
let screenShake = 0;

// ─── DOM refs ────────────────────────────────────────────────────────
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySubtitle = document.getElementById('overlay-subtitle');
const startBtn = document.getElementById('start-btn');
const finalScoreEl = document.getElementById('final-score');
const finalScoreVal = document.getElementById('final-score-val');
const highScoreDisplay = document.getElementById('high-score-display');
const highScoreVal = document.getElementById('high-score-val');
const speedBar = document.getElementById('speed-bar');

// Build speed bar dots
for (let i = 0; i < 10; i++) {
  const dot = document.createElement('div');
  dot.className = 'dot';
  speedBar.appendChild(dot);
}

// ─── Init ────────────────────────────────────────────────────────────
function init() {
  snake = [];
  for (let i = 0; i < 3; i++) snake.push({ x: 10 - i, y: 10 });
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speedLevel = 1;
  tickInterval = 150;
  particles = [];
  gameOver = false;
  paused = false;
  gameRunning = false;
  updateHUD();
  placeFood();
  draw();
}

// ─── Place Food ──────────────────────────────────────────────────────
function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  const free = [];
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if (!occupied.has(`${x},${y}`)) free.push({ x, y });
  if (free.length === 0) {
    // Won! Wrap score
    gameOver = true;
    showGameOver(true);
    return;
  }
  food = free[Math.floor(Math.random() * free.length)];
}

// ─── Update ──────────────────────────────────────────────────────────
function update() {
  if (!gameRunning || paused || gameOver) return;

  // Apply queued direction
  dir = { ...nextDir };

  const head = snake[0];
  const newHead = {
    x: head.x + dir.x,
    y: head.y + dir.y
  };

  // Wall collision
  if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
    die();
    return;
  }

  // Self collision
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
      die();
      return;
    }
  }

  snake.unshift(newHead);

  // Eat food?
  if (newHead.x === food.x && newHead.y === food.y) {
    score++;
    playSound('eat');
    spawnParticles(newHead.x, newHead.y, '#ff6b6b');
    if (score % 5 === 0) playSound('grow');
    updateHUD();
    placeFood();
  } else {
    snake.pop();
  }
}

function die() {
  gameOver = true;
  playSound('die');
  screenShake = 1;
  spawnParticles(snake[0].x, snake[0].y, '#ff3b3b');

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore);
  }
  showGameOver(false);
}

function showGameOver(won) {
  overlayTitle.textContent = won ? '🏆 You Win!' : 'Game Over';
  overlayTitle.style.color = won ? '#ffab40' : '#ff5252';
  overlaySubtitle.textContent = won
    ? `You ate ${score} pieces and won!`
    : `Better luck next time, snake!`;
  finalScoreEl.style.display = 'block';
  finalScoreVal.textContent = score;
  highScoreDisplay.style.display = 'block';
  highScoreVal.textContent = highScore;
  startBtn.textContent = 'Play Again';
  overlay.classList.remove('hidden');
}

function startGame() {
  ensureAudio();
  playSound('start');
  init();
  gameRunning = true;
  lastTime = performance.now();
  tickAccum = 0;
  overlay.classList.add('hidden');
}

// ─── HUD ─────────────────────────────────────────────────────────────
function updateHUD() {
  scoreEl.textContent = score;
  highScoreEl.textContent = highScore;

  const dots = speedBar.querySelectorAll('.dot');
  for (let i = 0; i < dots.length; i++) {
    dots[i].classList.toggle('active', i < speedLevel);
  }
}

// ─── Particles ───────────────────────────────────────────────────────
function spawnParticles(cx, cy, color) {
  const px = cx * CELL + CELL / 2;
  const py = cy * CELL + CELL / 2;
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x: px, y: py,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── Drawing ─────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, CANVAS, CANVAS);

  // Screen shake
  ctx.save();
  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShake * 8;
    const sy = (Math.random() - 0.5) * screenShake * 8;
    ctx.translate(sx, sy);
    screenShake *= 0.85;
    if (screenShake < 0.1) screenShake = 0;
  }

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, CANVAS);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(CANVAS, y * CELL);
    ctx.stroke();
  }

  // Food
  foodPulse += 0.06;
  const pulse = 1 + Math.sin(foodPulse) * 0.1;
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  const fr = (CELL / 2 - 2) * pulse;

  // Food glow
  const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, fr * 3);
  glow.addColorStop(0, 'rgba(255, 107, 107, 0.25)');
  glow.addColorStop(1, 'rgba(255, 107, 107, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(fx - fr * 3, fy - fr * 3, fr * 6, fr * 6);

  // Food body
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(fx, fy, fr, 0, Math.PI * 2);
  ctx.fill();

  // Food highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(fx - fr * 0.25, fy - fr * 0.25, fr * 0.35, 0, Math.PI * 2);
  ctx.fill();

  // Snake
  snake.forEach((seg, i) => {
    const sx = seg.x * CELL;
    const sy = seg.y * CELL;
    const t = i / snake.length; // 0=head, 1=tail

    // Gradient from green head to darker tail
    const r = Math.round(0 + t * 0);
    const g = Math.round(230 - t * 100);
    const b = Math.round(118 - t * 60);
    const alpha = 1 - t * 0.35;

    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;

    // Rounded segment
    const pad = i === 0 ? 0 : 1;
    const radius = i === 0 ? 6 : 4;
    roundRect(ctx, sx + pad, sy + pad, CELL - pad * 2, CELL - pad * 2, radius);
    ctx.fill();

    // Head details
    if (i === 0) {
      // Eyes
      const eyeSize = 3;
      const eyeOff = 4;
      const eyeSpacing = 6;
      const ex1 = sx + CELL / 2 + (dir.x > 0 ? eyeSpacing : dir.x < 0 ? -eyeSpacing : -eyeSpacing);
      const ey1 = sy + CELL / 2 + (dir.y > 0 ? eyeSpacing : dir.y < 0 ? -eyeSpacing : -eyeSpacing);
      const ex2 = sx + CELL / 2 + (dir.x > 0 ? eyeSpacing : dir.x < 0 ? -eyeSpacing : eyeSpacing);
      const ey2 = sy + CELL / 2 + (dir.y > 0 ? eyeSpacing : dir.y < 0 ? -eyeSpacing : eyeSpacing);

      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(ex1 + dir.x, ey1 + dir.y, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2 + dir.x, ey2 + dir.y, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Pause indicator
  if (paused) {
    ctx.fillStyle = 'rgba(10,10,26,0.6)';
    ctx.fillRect(0, 0, CANVAS, CANVAS);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', CANVAS / 2, CANVAS / 2);
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.fillStyle = '#888';
    ctx.fillText('Press Space to resume', CANVAS / 2, CANVAS / 2 + 30);
  }

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── Game Loop ───────────────────────────────────────────────────────
function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  if (!gameRunning) return;

  if (paused) return;

  const dt = timestamp - lastTime;
  lastTime = timestamp;

  if (dt >= tickInterval) {
    update();
    tickAccum = 0;
  } else {
    tickAccum += dt;
  }

  updateParticles();
  draw();
}

// ─── Input ───────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!gameRunning && e.code === 'Space') {
    startGame();
    return;
  }

  if (e.code === 'Space') {
    if (gameRunning) {
      paused = !paused;
      if (paused) draw(); // redraw with pause overlay
    }
    return;
  }

  if (!gameRunning || paused) return;

  const key = e.code;
  // Prevent reversing
  if (key === 'ArrowUp' || key === 'KeyW') {
    if (dir.y !== 1) nextDir = { x: 0, y: -1 };
  } else if (key === 'ArrowDown' || key === 'KeyS') {
    if (dir.y !== -1) nextDir = { x: 0, y: 1 };
  } else if (key === 'ArrowLeft' || key === 'KeyA') {
    if (dir.x !== 1) nextDir = { x: -1, y: 0 };
  } else if (key === 'ArrowRight' || key === 'KeyD') {
    if (dir.x !== -1) nextDir = { x: 1, y: 0 };
  }

  e.preventDefault();
});

// Mobile touch controls
document.querySelectorAll('.dir-btn').forEach(btn => {
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!gameRunning || paused) return;
    const d = btn.dataset.dir;
    if (d === 'up') {
      if (dir.y !== 1) nextDir = { x: 0, y: -1 };
    } else if (d === 'down') {
      if (dir.y !== -1) nextDir = { x: 0, y: 1 };
    } else if (d === 'left') {
      if (dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else if (d === 'right') {
      if (dir.x !== -1) nextDir = { x: 1, y: 0 };
    }
  });
  btn.addEventListener('mousedown', e => {
    e.preventDefault();
    if (!gameRunning || paused) return;
    const d = btn.dataset.dir;
    if (d === 'up') {
      if (dir.y !== 1) nextDir = { x: 0, y: -1 };
    } else if (d === 'down') {
      if (dir.y !== -1) nextDir = { x: 0, y: 1 };
    } else if (d === 'left') {
      if (dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else if (d === 'right') {
      if (dir.x !== -1) nextDir = { x: 1, y: 0 };
    }
  });
});

startBtn.addEventListener('click', startGame);

// ─── Start ───────────────────────────────────────────────────────────
highScoreEl.textContent = highScore;
init();
requestAnimationFrame(gameLoop);
</script>
</body>
