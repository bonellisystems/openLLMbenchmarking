<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
canvas{border:2px solid #1a1a3e;border-radius:4px;box-shadow:0 0 40px rgba(0,120,255,0.15),0 0 80px rgba(0,80,200,0.08)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W;
canvas.height = H;

// Audio
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
function sfxBreak() { playTone(440 + Math.random()*200, 0.1, 'square', 0.06); }
function sfxPaddle() { playTone(220, 0.08, 'triangle', 0.07); }
function sfxWall() { playTone(300, 0.05, 'sine', 0.04); }
function sfxLife() { playTone(600, 0.15, 'sine', 0.08); playTone(800, 0.15, 'sine', 0.08); }
function sfxPowerup() { playTone(880, 0.1, 'sine', 0.07); playTone(1100, 0.1, 'sine', 0.07); }
function sfxGameOver() { playTone(200, 0.5, 'sawtooth', 0.08); playTone(150, 0.5, 'sawtooth', 0.08); }
function sfxLevelUp() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.15,'sine',0.07),i*100)); }

// Game state
const STATE = { MENU:0, PLAYING:1, GAMEOVER:2, WIN:3, PAUSED:4 };
let state = STATE.MENU;
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let comboTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Paddle
const PADDLE_W = 100, PADDLE_H = 14;
let paddle = { x: W/2 - PADDLE_W/2, y: H - 40, w: PADDLE_W, h: PADDLE_H, wide: false, wideTimer: 0 };

// Ball
let balls = [];
function createBall(x, y, vx, vy) {
  return { x, y, vx, vy, r: 6, trail: [] };
}

// Bricks
let bricks = [];
const BRICK_ROWS = 6, BRICK_COLS = 12;
const BRICK_W = 58, BRICK_H = 22;
const BRICK_PAD = 4;
const BRICK_OFFSET_X = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;
const BRICK_OFFSET_Y = 50;

const BRICK_COLORS = [
  ['#ff4444','#ff6b6b'],
  ['#ff8800','#ffaa00'],
  ['#ffdd00','#ffee00'],
  ['#44ff44','#66ff66'],
  ['#4488ff','#66aaff'],
  ['#aa44ff','#cc66ff'],
];

function initBricks() {
  bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const hp = r < 2 ? 1 : r < 4 ? 2 : 3;
      bricks.push({
        x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_PAD),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_PAD),
        w: BRICK_W, h: BRICK_H,
        hp: hp, maxHp: hp,
        row: r, col: c,
        alive: true,
        color: BRICK_COLORS[r % BRICK_COLORS.length]
      });
    }
  }
}

// Power-ups
let powerups = [];
const PU_TYPES = ['wide', 'multi', 'life'];
const PU_COLORS = ['#00ff88', '#ff66ff', '#ff4444'];
const PU_LABELS = ['W', 'M', '+'];

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

// Level definitions
function initLevel() {
  initBricks();
  balls = [createBall(W/2, H - 60, 0, 0)];
  paddle.w = PADDLE_W;
  paddle.wide = false;
  paddle.wideTimer = 0;
  powerups = [];
  particles = [];
  combo = 0;
  comboTimer = 0;
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter') {
    initAudio();
    if (state === STATE.MENU) {
      state = STATE.PLAYING;
      score = 0;
      lives = 3;
      level = 1;
      initLevel();
    } else if (state === STATE.GAMEOVER || state === STATE.WIN) {
      state = STATE.MENU;
    } else if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
    }
  }
  if (e.code === 'Escape' && state === STATE.PLAYING) {
    state = STATE.PAUSED;
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Update
function update() {
  if (state !== STATE.PLAYING) return;

  // Paddle movement
  const speed = 7;
  if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= speed;
  if (keys['ArrowRight'] || keys['KeyD']) paddle.x += speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // Wide paddle timer
  if (paddle.wide) {
    paddle.wideTimer--;
    if (paddle.wideTimer <= 0) {
      paddle.wide = false;
      paddle.w = PADDLE_W;
    }
  }

  // Combo timer
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) combo = 0;
  }

  // Balls
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 8) b.trail.shift();

    b.x += b.vx;
    b.y += b.vy;

    // Wall collisions
    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); sfxWall(); }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); sfxWall(); }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); sfxWall(); }

    // Paddle collision
    if (b.vy > 0 &&
        b.y + b.r >= paddle.y &&
        b.y + b.r <= paddle.y + paddle.h + 4 &&
        b.x >= paddle.x - 2 &&
        b.x <= paddle.x + paddle.w + 2) {
      const hitPos = (b.x - paddle.x) / paddle.w;
      const angle = (hitPos - 0.5) * Math.PI * 0.7;
      const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      b.vx = Math.sin(angle) * speed;
      b.vy = -Math.cos(angle) * speed;
      b.y = paddle.y - b.r;
      sfxPaddle();
    }

    // Brick collision
    let hitBrick = false;
    for (const brick of bricks) {
      if (!brick.alive) continue;
      if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
          b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
        brick.hp--;
        if (brick.hp <= 0) {
          brick.alive = false;
          sfxBreak();
          spawnParticles(brick.x + brick.w/2, brick.y + brick.h/2, brick.color[0], 12);
          shakeTimer = 4;
          shakeIntensity = 2;
          combo++;
          comboTimer = 90;
          const pts = 10 * brick.maxHp * (combo > 3 ? combo : 1);
          score += pts;
          // Drop power-up chance
          if (Math.random() < 0.15) {
            powerups.push({
              x: brick.x + brick.w/2,
              y: brick.y + brick.h/2,
              vy: 2,
              type: PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)],
              w: 20, h: 14
            });
          }
        } else {
          sfxWall();
          spawnParticles(b.x, b.y, brick.color[0], 4);
        }
        hitBrick = true;
        break;
      }
    }

    // Ball lost
    if (b.y + b.r > H) {
      balls.splice(i, 1);
      if (balls.length === 0) {
        lives--;
        sfxLife();
        if (lives <= 0) {
          state = STATE.GAMEOVER;
          sfxGameOver();
        } else {
          initLevel();
        }
      }
    }
  }

  // Power-ups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.y += pu.vy;
    if (pu.y + pu.h > paddle.y && pu.y < paddle.y + paddle.h &&
        pu.x + pu.w > paddle.x && pu.x < paddle.x + paddle.w) {
      applyPowerup(pu.type);
      powerups.splice(i, 1);
      continue;
    }
    if (pu.y > H + 20) powerups.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shake
  if (shakeTimer > 0) shakeTimer--;

  // Check level complete
  if (bricks.every(b => !b.alive)) {
    level++;
    sfxLevelUp();
    initLevel();
  }
}

function applyPowerup(type) {
  sfxPowerup();
  if (type === 'wide') {
    paddle.wide = true;
    paddle.w = PADDLE_W * 1.5;
    paddle.wideTimer = 600;
  } else if (type === 'multi') {
    if (balls.length > 0) {
      const b = balls[0];
      for (let i = 0; i < 2; i++) {
        const angle = -Math.PI/2 + (i === 0 ? -0.5 : 0.5);
        const speed = Math.sqrt(b.vx*b.vx + b.vy*b.vy) || 5;
        balls.push(createBall(b.x, b.y, Math.cos(angle)*speed, Math.sin(angle)*speed));
      }
    }
  } else if (type === 'life') {
    lives++;
    sfxLife();
  }
}

// Draw
function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(
      (Math.random()-0.5) * shakeIntensity * 2,
      (Math.random()-0.5) * shakeIntensity * 2
    );
  }

  // Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0a0a1a');
  bgGrad.addColorStop(1, '#0d0d2a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(30,30,60,0.3)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Bricks
  for (const brick of bricks) {
    if (!brick.alive) continue;
    const alpha = brick.hp / brick.maxHp;
    ctx.fillStyle = brick.color[0];
    ctx.globalAlpha = 0.7 + alpha * 0.3;
    ctx.fillRect(brick.x + 1, brick.y + 1, brick.w - 2, brick.h - 2);
    ctx.globalAlpha = 1;
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(brick.x + 2, brick.y + 2, brick.w - 4, brick.h/2 - 2);
    // HP indicator
    if (brick.maxHp > 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(brick.x + 2, brick.y + brick.h - 6, brick.w - 4, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(brick.x + 2, brick.y + brick.h - 6, (brick.w - 4) * (brick.hp / brick.maxHp), 4);
    }
  }

  // Power-ups
  for (const pu of powerups) {
    const pulse = Math.sin(Date.now() / 100) * 0.1 + 0.9;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = PU_COLORS[PU_TYPES.indexOf(pu.type)];
    ctx.beginPath();
    ctx.roundRect(pu.x - pu.w/2, pu.y - pu.h/2, pu.w, pu.h, 4);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_LABELS[PU_TYPES.indexOf(pu.type)], pu.x, pu.y);
    ctx.globalAlpha = 1;
  }

  // Paddle
  const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
  paddleGrad.addColorStop(0, '#4488ff');
  paddleGrad.addColorStop(1, '#2244aa');
  ctx.fillStyle = paddleGrad;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  ctx.fill();
  // Paddle glow
  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = 'rgba(68,136,255,0.3)';
  ctx.beginPath();
  ctx.roundRect(paddle.x - 2, paddle.y - 2, paddle.w + 4, paddle.h + 4, 9);
  ctx.fill();
  ctx.shadowBlur = 0;
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(paddle.x + 4, paddle.y + 2, paddle.w - 8, 4);

  // Balls
  for (const b of balls) {
    // Trail
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const alpha = (i / b.trail.length) * 0.4;
      const size = b.r * (i / b.trail.length);
      ctx.fillStyle = `rgba(255,200,100,${alpha})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    // Ball
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(b.x - 2, b.y - 2, b.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Courier New';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(`SCORE: ${score}`, 15, 15);
  ctx.textAlign = 'right';
  ctx.fillText(`LIVES: ${lives}`, W - 15, 15);
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${level}`, W/2, 15);

  // Combo
  if (combo > 3) {
    const comboAlpha = Math.min(1, comboTimer / 30);
    ctx.globalAlpha = comboAlpha;
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 20px Courier New';
    ctx.fillText(`COMBO x${combo}`, W/2, 40);
    ctx.globalAlpha = 1;
  }

  // Wide paddle indicator
  if (paddle.wide) {
    ctx.fillStyle = '#00ff88';
    ctx.font = '12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`WIDE PADDLE (${Math.ceil(paddle.wideTimer/60)}s)`, W/2, H - 20);
  }

  // Overlays
  if (state === STATE.MENU) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4488ff';
    ctx.font = 'bold 56px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#4488ff';
    ctx.shadowBlur = 20;
    ctx.fillText('ARKANOID', W/2, H/2 - 80);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#aaa';
    ctx.font = '16px Courier New';
    ctx.fillText('← → or A D to move', W/2, H/2 - 20);
    ctx.fillText('SPACE to launch ball', W/2, H/2 + 10);
    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 20px Courier New';
    const blink = Math.sin(Date.now() / 400) > 0;
    if (blink) ctx.fillText('PRESS SPACE TO START', W/2, H/2 + 70);
  }

  if (state === STATE.GAMEOVER) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '24px Courier New';
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2 + 10);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px Courier New';
    ctx.fillText(`Reached Level ${level}`, W/2, H/2 + 40);
    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 18px Courier New';
    const blink = Math.sin(Date.now() / 400) > 0;
    if (blink) ctx.fillText('PRESS SPACE TO CONTINUE', W/2, H/2 + 90);
  }

  if (state === STATE.WIN) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#44ff44';
    ctx.shadowBlur = 20;
    ctx.fillText('YOU WIN!', W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '24px Courier New';
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2 + 10);
    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 18px Courier New';
    const blink = Math.sin(Date.now() / 400) > 0;
    if (blink) ctx.fillText('PRESS SPACE TO CONTINUE', W/2, H/2 + 70);
  }

  if (state === STATE.PAUSED) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px Courier New';
    ctx.fillText('PRESS ESC TO RESUME', W/2, H/2 + 40);
  }

  ctx.restore();
}

// Launch ball on space
function launchBall() {
  if (state !== STATE.PLAYING) return;
  for (const b of balls) {
    if (b.y > paddle.y - 20 && b.vy <= 0) {
      b.vy = -5;
      b.vx = (Math.random() - 0.5) * 4;
      break;
    }
  }
}

// Main loop
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Polyfill roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
    return this;
  };
}

loop();
</script>
</body>
</html>
