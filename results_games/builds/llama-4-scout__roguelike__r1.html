<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: monospace;
  }
  #game {
    white-space: pre;
  }
</style>
</head>
<body>
<div id="game"></div>
<script>
  const gameDiv = document.getElementById('game');
  let playerX = 1;
  let playerY = 1;
  let dungeon = [];

  function generateDungeon() {
    const width = 20;
    const height = 20;
    for (let y = 0; y < height; y++) {
      dungeon[y] = [];
      for (let x = 0; x < width; x++) {
        if (x === 0 || y === 0 || x === width - 1 || y === height - 1) {
          dungeon[y][x] = '#';
        } else if (Math.random() < 0.2) {
          dungeon[y][x] = '#';
        } else {
          dungeon[y][x] = '.';
        }
      }
    }
    dungeon[playerY][playerX] = '@';
  }

  function drawGame() {
    let gameText = '';
    for (let y = 0; y < dungeon.length; y++) {
      for (let x = 0; x < dungeon[y].length; x++) {
        gameText += dungeon[y][x] + ' ';
      }
      gameText += '\n';
    }
    gameDiv.innerText = gameText;
  }

  document.addEventListener('keydown', (e) => {
    let newX = playerX;
    let newY = playerY;
    switch (e.key) {
      case 'ArrowUp':
        newY--;
        break;
      case 'ArrowDown':
        newY++;
        break;
      case 'ArrowLeft':
        newX--;
        break;
      case 'ArrowRight':
        newX++;
        break;
    }
    if (dungeon[newY][newX] !== '#') {
      dungeon[playerY][playerX] = '.';
      playerX = newX;
      playerY = newY;
      dungeon[playerY][playerX] = '@';
    }
    drawGame();
  });

  generateDungeon();
  drawGame();
</script>
</body>
</html>
