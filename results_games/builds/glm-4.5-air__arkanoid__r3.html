<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid - Breakout Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        canvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: #000;
            display: block;
            margin: 0 auto;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        
        .controls {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Level: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            Use ← → arrow keys to move paddle | Press SPACE to start/pause
        </div>
        <div class="game-message" id="gameMessage"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        const messageElement = document.getElementById('gameMessage');

        // Game variables
        let gameState = 'menu'; // menu, playing, paused, gameOver, win
        let score = 0;
        let lives = 3;
        let level = 1;
        let animationId;

        // Paddle
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            speed: 8,
            dx: 0
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 8,
            speed: 5,
            dx: 4,
            dy: -4
        };

        // Bricks
        const brickRowCount = 5;
        const brickColumnCount = 10;
        const brickWidth = 70;
        const brickHeight = 20;
        const brickPadding = 5;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 35;
        let bricks = [];

        // Particles for effects
        let particles = [];

        // Initialize bricks
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    const hue = (r * 60 + c * 10) % 360;
                    bricks[c][r] = {
                        x: 0,
                        y: 0,
                        status: 1,
                        color: `hsl(${hue}, 70%, 50%)`
                    };
                }
            }
        }

        // Particle class
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.color = color;
                this.life = 1;
                this.decay = 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 4, 4);
                ctx.restore();
            }
        }

        // Create particles
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                if (gameState === 'menu') {
                    startGame();
                } else if (gameState === 'playing') {
                    gameState = 'paused';
                    showMessage('PAUSED');
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    hideMessage();
                } else if (gameState === 'gameOver' || gameState === 'win') {
                    resetGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Game functions
        function startGame() {
            gameState = 'playing';
            hideMessage();
            gameLoop();
        }

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            updateUI();
            initBricks();
            resetBall();
            resetPaddle();
            particles = [];
            gameState = 'menu';
            showMessage('PRESS SPACE TO START');
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
        }

        function resetPaddle() {
            paddle.x = canvas.width / 2 - paddle.width / 2;
            paddle.dx = 0;
        }

        function updateUI() {
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
        }

        function showMessage(text) {
            messageElement.textContent = text;
            messageElement.style.display = 'block';
        }

        function hideMessage() {
            messageElement.style.display = 'none';
        }

        // Collision detection
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        if (ball.x + ball.radius > brickX &&
                            ball.x - ball.radius < brickX + brickWidth &&
                            ball.y + ball.radius > brickY &&
                            ball.y - ball.radius < brickY + brickHeight) {
                            
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            updateUI();
                            
                            createParticles(brickX + brickWidth / 2, brickY + brickHeight / 2, b.color);
                            
                            // Check if level complete
                            if (isLevelComplete()) {
                                level++;
                                updateUI();
                                initBricks();
                                ball.speed += 0.5;
                                resetBall();
                                showMessage(`LEVEL ${level}!`);
                                setTimeout(() => hideMessage(), 2000);
                            }
                        }
                    }
                }
            }
        }

        function isLevelComplete() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Update game objects
        function update() {
            if (gameState !== 'playing') return;

            // Update paddle
            if (keys['ArrowLeft'] && paddle.x > 0) {
                paddle.dx = -paddle.speed;
            } else if (keys['ArrowRight'] && paddle.x < canvas.width - paddle.width) {
                paddle.dx = paddle.speed;
            } else {
                paddle.dx *= 0.9; // Friction
            }

            paddle.x += paddle.dx;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            // Update ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball collision with walls
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // Ball collision with paddle
            if (ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                
                ball.dy = -ball.dy;
                
                // Add spin based on where ball hits paddle
                const hitPos = (ball.x - paddle.x) / paddle.width;
                ball.dx = 8 * (hitPos - 0.5);
            }

            // Ball out of bounds
            if (ball.y - ball.radius > canvas.height) {
                lives--;
                updateUI();
                
                if (lives === 0) {
                    gameState = 'gameOver';
                    showMessage('GAME OVER');
                } else {
                    resetBall();
                    showMessage(`LIVES LEFT: ${lives}`);
                    setTimeout(() => hideMessage(), 1500);
                }
            }

            // Update particles
            particles = particles.filter(particle => {
                particle.update();
                return particle.life > 0;
            });

            // Collision detection
            collisionDetection();
        }

        // Draw functions
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw bricks
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
                        
                        // Add highlight
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(brickX, brickY, brickWidth, 5);
                    }
                }
            }

            // Draw paddle
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // Paddle highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, 5);

            // Draw ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();

            // Ball glow effect
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
            ctx.closePath();

            // Draw particles
            particles.forEach(particle => particle.draw());
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            
            if (gameState === 'playing') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // Initialize game
        initBricks();
        updateUI();
        showMessage('PRESS SPACE TO START');
        draw();
    </script>
</body>
</html>
