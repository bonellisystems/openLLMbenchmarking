<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            background-color: #a2d2ff;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            border: 4px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        const GRAVITY = 0.4;
        const JUMP_FORCE = -12;
        const PLAYER_SPEED = 6;
        const PLATFORM_WIDTH = 60;
        const PLATFORM_HEIGHT = 15;
        const PLATFORM_COUNT = 8;

        let player = {
            x: 200,
            y: 500,
            width: 30,
            height: 30,
            vy: 0,
            vx: 0,
            color: '#ffcc00'
        };

        let platforms = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        function init() {
            player.x = canvas.width / 2 - 15;
            player.y = canvas.height - 100;
            player.vy = 0;
            score = 0;
            gameOver = false;
            platforms = [];

            // Starting platform
            platforms.push({ x: player.x - 15, y: player.y + 40 });

            // Initial procedural platforms
            for (let i = 1; i < PLATFORM_COUNT; i++) {
                spawnPlatform(canvas.height - (i * 80));
            }
        }

        function spawnPlatform(yValue) {
            platforms.push({
                x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                y: yValue || -20
            });
        }

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (gameOver) init();
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function update() {
            if (gameOver) return;

            // Horizontal movement
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -PLAYER_SPEED;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = PLAYER_SPEED;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            // Screen wrap
            if (player.x > canvas.width) player.x = -player.width;
            if (player.x < -player.width) player.x = canvas.width;

            // Vertical movement
            player.vy += GRAVITY;
            player.y += player.vy;

            // Platform collision
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.width > p.x && 
                        player.x < p.x + PLATFORM_WIDTH && 
                        player.y + player.height > p.y && 
                        player.y + player.height < p.y + PLATFORM_HEIGHT + player.vy) {
                        player.vy = JUMP_FORCE;
                    }
                });
            }

            // Camera scroll
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);
                platforms.forEach(p => {
                    p.y += diff;
                });
            }

            // Procedural generation: recycle platforms
            platforms.forEach((p, index) => {
                if (p.y > canvas.height) {
                    platforms.splice(index, 1);
                    spawnPlatform(-20);
                }
            });

            // Game over check
            if (player.y > canvas.height) {
                gameOver = true;
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#a2d2ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Platforms
            ctx.fillStyle = '#4caf50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
                ctx.strokeStyle = '#388e3c';
                ctx.strokeRect(p.x, p.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
            });

            // Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#d4af37';
            ctx.strokeRect(player.x, player.y, player.width, player.height);

            // Score
            ctx.fillStyle = '#333';
            ctx.font = '24px Arial';
            ctx.fillText(`Score: ${score}`, 20, 40);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Press any key to restart', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
