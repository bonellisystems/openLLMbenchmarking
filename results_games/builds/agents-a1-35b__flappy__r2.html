<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}
canvas {
    display: block;
    background: #70c5ce;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<canvas id="gameCanvas" width="320" height="480"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
const state = {
    current: 0,
    getReady: 0,
    game: 1,
    over: 2
};

// Bird
const bird = {
    x: 50,
    y: 150,
    w: 20,
    h: 20,
    speed: 0,
    gravity: 0.25,
    jump: 4.6,
    draw: function() {
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x + 12, this.y + 2, 4, 4);
        ctx.fillStyle = '#f57c00';
        ctx.fillRect(this.x + 16, this.y + 10, 6, 4);
    },
    update: function() {
        if (state.current === state.getReady) {
            this.y = 150 + Math.sin(frames * 0.1) * 5;
            this.speed = 0;
        } else if (state.current === state.game) {
            this.speed += this.gravity;
            this.y += this.speed;
            if (this.y + this.h >= canvas.height - fg.h) {
                this.y = canvas.height - fg.h - this.h;
                state.current = state.over;
            }
            if (this.y < 0) {
                this.y = 0;
                this.speed = 0;
            }
        }
    },
    flap: function() {
        this.speed = -this.jump;
    }
};

// Pipes
const pipes = {
    position: [],
    w: 50,
    gap: 100,
    dx: 2,
    draw: function() {
        for(let i = 0; i < this.position.length; i++) {
            let p = this.position[i];
            let topY = p.y;
            let bottomY = p.y + this.gap;
            
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(p.x, 0, this.w, topY);
            ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY);
            
            ctx.fillStyle = '#388e3c';
            ctx.fillRect(p.x - 2, topY - 20, this.w + 4, 20);
            ctx.fillRect(p.x - 2, bottomY, this.w + 4, 20);
        }
    },
    update: function() {
        if(state.current !== state.game) return;
        if(frames % 100 === 0) {
            this.position.push({
                x: canvas.width,
                y: Math.floor(Math.random() * (canvas.height - fg.h - this.gap - 50)) + 50
            });
        }
        for(let i = 0; i < this.position.length; i++) {
            let p = this.position[i];
            p.x -= this.dx;
            if(bird.x + bird.w > p.x && bird.x < p.x + this.w) {
                if(bird.y < p.y || bird.y + bird.h > p.y + this.gap) {
                    state.current = state.over;
                }
            }
            if(p.x + this.w <= 0) {
                this.position.shift();
                score.value += 1;
                i--;
            }
        }
    },
    reset: function() {
        this.position = [];
    }
};

// Foreground
const fg = {
    h: 80,
    draw: function() {
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(0, canvas.height - this.h, canvas.width, 10);
    }
};

// Score
const score = {
    value: 0,
    draw: function() {
        ctx.fillStyle = '#FFF';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.font = '35px Arial';
        ctx.fillText(this.value, canvas.width/2 - 10, 50);
        ctx.strokeText(this.value, canvas.width/2 - 10, 50);
    }
};

// UI
function drawUI() {
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.textAlign = 'center';
    if(state.current === state.getReady) {
        ctx.font = '30px Arial';
        ctx.fillText('Get Ready', canvas.width/2, 200);
        ctx.strokeText('Get Ready', canvas.width/2, 200);
        ctx.font = '20px Arial';
        ctx.fillText('Press Space to Start', canvas.width/2, 240);
        ctx.strokeText('Press Space to Start', canvas.width/2, 240);
    } else if(state.current === state.over) {
        ctx.font = '30px Arial';
        ctx.fillText('Game Over', canvas.width/2, 200);
        ctx.strokeText('Game Over', canvas.width/2, 200);
        ctx.font = '20px Arial';
        ctx.fillText('Press Space to Restart', canvas.width/2, 240);
        ctx.strokeText('Press Space to Restart', canvas.width/2, 240);
    }
}

// Loop
let frames = 0;
function loop() {
    bird.update();
    pipes.update();
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    pipes.draw();
    fg.draw();
    bird.draw();
    score.draw();
    drawUI();
    frames++;
    requestAnimationFrame(loop);
}

// Input
window.addEventListener('keydown', function(e) {
    if(e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if(state.current === state.getReady) {
            state.current = state.game;
            bird.flap();
        } else if(state.current === state.game) {
            bird.flap();
        } else if(state.current === state.over) {
            state.current = state.getReady;
            bird.y = 150;
            bird.speed = 0;
            pipes.reset();
            score.value = 0;
            frames = 0;
        }
    }
});

loop();
</script>
</body>
</html>
