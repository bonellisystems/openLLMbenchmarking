<!DOCTYPE html>
<html>
<head>
<title>Arkanoid (Breakout) Game</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const BALL_RADIUS = 5;
  const PADDLE_WIDTH = 60;
  const PADDLE_HEIGHT = 10;
  const BRICK_WIDTH = 60;
  const BRICK_HEIGHT = 20;
  const BRICK_COLS = 10;
  const BRICK_ROWS = 7;

  let ball = { x: 195, y: 195, dx: 2, dy: 2 };
  let paddle = { x: 170, y: 380, width: PADDLE_WIDTH, height: PADDLE_HEIGHT, dx: 0 };
  let bricks = [];
  let score = 0;
  let lives = 3;

  class Brick {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.width = BRICK_WIDTH;
      this.height = BRICK_HEIGHT;
      this.active = true;
    }
  }

  function createBricks() {
    for (let c = 0; c < BRICK_COLS; c++) {
      for (let r = 0; r < BRICK_ROWS; r++) {
        const x = c * (BRICK_WIDTH + 5) + 20;
        const y = r * (BRICK_HEIGHT + 5) + 20;
        bricks.push(new Brick(x, y));
      }
    }
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = 'red';
    ctx.fill();
    ctx.closePath();
  }

  function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.fillStyle = 'blue';
    ctx.fill();
    ctx.closePath();
  }

  function drawBricks() {
    ctx.beginPath();
    bricks.forEach(brick => {
      if (brick.active) {
        ctx.rect(brick.x, brick.y, brick.width, brick.height);
      }
    });
    ctx.fillStyle = 'green';
    ctx.fill();
    ctx.closePath();
  }

  function drawScore() {
    ctx.font = '16px Arial';
    ctx.fillStyle = 'black';
    ctx.fillText(`Score: ${score}`, 10, 20);
  }

  function drawLives() {
    ctx.font = '16px Arial';
    ctx.fillStyle = 'black';
    ctx.fillText(`Lives: ${lives}`, 300, 20);
  }

  function checkCollision() {
    // Paddle collision
    if (
      ball.x + BALL_RADIUS >= paddle.x &&
      ball.x - BALL_RADIUS <= paddle.x + paddle.width &&
      ball.y + BALL_RADIUS >= paddle.y &&
      ball.y - BALL_RADIUS <= paddle.y + paddle.height
    ) {
      ball.dy = -ball.dy;
      ball.x += ball.dx;
      ball.y += ball.dy;
      // Change ball direction based on where it hit the paddle
      const diff = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
      ball.dx = diff * 2;
    }

    // Brick collision
    bricks.forEach((brick, index) => {
      if (brick.active) {
        if (
          ball.x + BALL_RADIUS >= brick.x &&
          ball.x - BALL_RADIUS <= brick.x + brick.width &&
          ball.y + BALL_RADIUS >= brick.y &&
          ball.y - BALL_RADIUS <= brick.y + brick.height
        ) {
          ball.dy = -ball.dy;
          brick.active = false;
          score += 10;
          if (score % (BRICK_COLS * BRICK_ROWS * 10) === 0) {
            alert('You Win!');
            location.reload();
          }
        }
      }
    });
  }

  function checkBall() {
    // Wall collision
    if (ball.x + BALL_RADIUS > canvas.width || ball.x - BALL_RADIUS < 0) {
      ball.dx = -ball.dx;
    }
    if (ball.y + BALL_RADIUS > canvas.height || ball.y - BALL_RADIUS < 0) {
      ball.dy = -ball.dy;
    }
    // Paddle miss
    if (ball.y + BALL_RADIUS > canvas.height) {
      lives--;
      if (lives === 0) {
        alert('Game Over!');
        location.reload();
      } else {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx = 2;
        ball.dy = 2;
      }
    }
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBall();
    drawPaddle();
    drawBricks();
    drawScore();
    drawLives();
    checkCollision();
    checkBall();
    ball.x += ball.dx;
    ball.y += ball.dy;
    requestAnimationFrame(gameLoop);
  }

  function movePaddle(event) {
    if (event.key === 'ArrowLeft' && paddle.x > 0) {
      paddle.dx = -5;
    } else if (event.key === 'ArrowRight' && paddle.x + paddle.width < canvas.width) {
      paddle.dx = 5;
    } else {
      paddle.dx = 0;
    }
  }

  document.addEventListener('keydown', movePaddle);

  createBricks();
  gameLoop();

  setInterval(() => {
    paddle.x += paddle.dx;
  }, 10);
</script>
</body>
</html>
