<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #fafafa;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        const GRAVITY = 0.35;
        const JUMP_FORCE = -11;
        const PLAYER_SPEED = 5;
        const PLATFORM_WIDTH = 60;
        const PLATFORM_HEIGHT = 15;
        const PLATFORM_COUNT = 8;

        let player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 100,
            width: 30,
            height: 30,
            vx: 0,
            vy: 0,
            color: '#4CAF50'
        };

        let platforms = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        function initPlatforms() {
            platforms = [];
            // Starting platform
            platforms.push({ x: canvas.width / 2 - PLATFORM_WIDTH / 2, y: canvas.height - 50 });
            
            for (let i = 1; i < PLATFORM_COUNT; i++) {
                addPlatform(canvas.height - (i * (canvas.height / PLATFORM_COUNT)));
            }
        }

        function addPlatform(y) {
            platforms.push({
                x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                y: y
            });
        }

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (gameOver && e.code === 'Space') {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function resetGame() {
            player.x = canvas.width / 2 - 15;
            player.y = canvas.height - 100;
            player.vx = 0;
            player.vy = 0;
            score = 0;
            gameOver = false;
            initPlatforms();
        }

        function update() {
            if (gameOver) return;

            // Horizontal movement
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.vx = -PLAYER_SPEED;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                player.vx = PLAYER_SPEED;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            // Screen wrap
            if (player.x + player.width < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.width;

            // Vertical movement
            player.vy += GRAVITY;
            player.y += player.vy;

            // Collision with platforms (only when falling)
            if (player.vy > 0) {
                for (let plat of platforms) {
                    if (
                        player.x + player.width > plat.x &&
                        player.x < plat.x + PLATFORM_WIDTH &&
                        player.y + player.height > plat.y &&
                        player.y + player.height < plat.y + PLATFORM_HEIGHT + player.vy
                    ) {
                        player.vy = JUMP_FORCE;
                        break;
                    }
                }
            }

            // Camera shift
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);
                
                for (let plat of platforms) {
                    plat.y += diff;
                }
            }

            // Procedural generation: remove old, add new
            for (let i = 0; i < platforms.length; i++) {
                if (platforms[i].y > canvas.height) {
                    platforms.splice(i, 1);
                    addPlatform(0);
                    i--;
                }
            }

            // Game over check
            if (player.y > canvas.height) {
                gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw platforms
            ctx.fillStyle = '#8B4513';
            for (let plat of platforms) {
                ctx.fillRect(plat.x, plat.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
            }

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw score
            ctx.fillStyle = '#333';
            ctx.font = '20px Arial';
            ctx.fillText(`Score: ${score}`, 20, 30);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        initPlatforms();
        loop();
    </script>
</body>
</html>
