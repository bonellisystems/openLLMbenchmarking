<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
canvas { border: 2px solid #333; border-radius: 4px; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W;
canvas.height = H;

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur, vol, type) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.value = vol || 0.08;
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
function sndBrick() { playTone(440 + Math.random()*200, 0.1, 0.06); }
function sndWall() { playTone(220, 0.05, 0.04); }
function sndPaddle() { playTone(330, 0.08, 0.05); }
function sndLose() { playTone(110, 0.4, 0.1, 'sawtooth'); }
function sndWin() { [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 0.08), i*120)); }

// Game state
let state = 'start'; // start, playing, gameover, win
let score = 0, lives = 3, level = 1;
let combo = 0;
let particles = [];
let shake = 0;

// Paddle
const paddle = { x: W/2, y: H - 40, w: 120, h: 14, speed: 8, targetX: W/2 };

// Ball
const ball = { x: W/2, y: H - 55, r: 7, vx: 0, vy: 0, speed: 5.5, launched: false };

// Bricks
const BRICK_ROWS = 10, BRICK_COLS = 12;
const BRICK_W = 58, BRICK_H = 22;
const BRICK_PAD = 4;
const BRICK_TOP = 60;
const BRICK_LEFT = (W - BRICK_COLS * (BRICK_W + BRICK_PAD) + BRICK_PAD) / 2;
const BRICK_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#1abc9c','#e91e63'];
let bricks = [];

function initBricks() {
  bricks = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const hp = r < 2 ? 3 : r < 5 ? 2 : 1;
      bricks.push({
        x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
        y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
        w: BRICK_W, h: BRICK_H,
        hp, maxHp: hp,
        color: BRICK_COLORS[r % BRICK_COLORS.length],
        alive: true
      });
    }
  }
}

function resetBall() {
  ball.x = paddle.x;
  ball.y = paddle.y - ball.r - 2;
  ball.vx = 0;
  ball.vy = 0;
  ball.launched = false;
  combo = 0;
}

function launchBall() {
  const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.6;
  ball.vx = Math.cos(angle) * ball.speed;
  ball.vy = Math.sin(angle) * ball.speed;
  ball.launched = true;
}

// Input
const keys = {};
let mouseX = W/2;
let useMouse = false;

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (state === 'start') { state = 'playing'; initBricks(); resetBall(); }
    else if (state === 'playing' && !ball.launched) launchBall();
    else if (state === 'gameover' || state === 'win') { state = 'start'; score = 0; lives = 3; level = 1; }
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') useMouse = false;
  keys[e.key] = true;
  if (state === 'playing') audioCtx.resume();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  useMouse = true;
});
canvas.addEventListener('click', e => {
  if (state === 'start') { state = 'playing'; initBricks(); resetBall(); }
  else if (state === 'playing' && !ball.launched) launchBall();
  else if (state === 'gameover' || state === 'win') { state = 'start'; score = 0; lives = 3; level = 1; }
});

// Particles
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color, r: 2 + Math.random()*3 });
  }
}

// Update
function update() {
  // Paddle
  if (useMouse) {
    paddle.targetX = mouseX;
  }
  if (keys['ArrowLeft']) { paddle.targetX -= paddle.speed; useMouse = false; }
  if (keys['ArrowRight']) { paddle.targetX += paddle.speed; useMouse = false; }
  paddle.x += (paddle.targetX - paddle.x) * 0.25;
  paddle.x = Math.max(paddle.w/2, Math.min(W - paddle.w/2, paddle.x));

  // Ball follows paddle if not launched
  if (!ball.launched) {
    ball.x = paddle.x;
    ball.y = paddle.y - ball.r - 2;
  }

  // Ball movement
  if (ball.launched) {
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sndWall(); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sndWall(); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sndWall(); }

    // Bottom
    if (ball.y > H + 20) {
      lives--;
      sndLose();
      if (lives <= 0) { state = 'gameover'; }
      else { resetBall(); }
    }

    // Paddle collision
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y - paddle.h/2 && ball.y + ball.r <= paddle.y + paddle.h/2 + 5 &&
        ball.x >= paddle.x - paddle.w/2 - ball.r && ball.x <= paddle.x + paddle.w/2 + ball.r) {
      const hit = (ball.x - paddle.x) / (paddle.w/2);
      const angle = hit * Math.PI/3 - Math.PI/2;
      const spd = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
      ball.vx = Math.cos(angle) * spd;
      ball.vy = Math.sin(angle) * spd;
      ball.y = paddle.y - paddle.h/2 - ball.r;
      sndPaddle();
      spawnParticles(ball.x, ball.y, '#fff', 5);
    }

    // Brick collision
    for (let b of bricks) {
      if (!b.alive) continue;
      const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
      const dx = ball.x - cx, dy = ball.y - cy;
      if (dx*dx + dy*dy < ball.r*ball.r) {
        b.hp--;
        if (b.hp <= 0) {
          b.alive = false;
          score += 10 * (1 + combo * 0.1);
          combo++;
          spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 12);
        } else {
          score += 5;
          spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 4);
        }
        sndBrick();
        shake = 3;

        // Reflect
        const overlapX = ball.r - Math.abs(dx);
        const overlapY = ball.r - Math.abs(dy);
        if (overlapX < overlapY) {
          ball.vx = -ball.vx;
        } else {
          ball.vy = -ball.vy;
        }
        break;
      }
    }

    // Win check
    if (bricks.every(b => !b.alive)) {
      state = 'win';
      sndWin();
    }
  }

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.02;
    return p.life > 0;
  });

  shake *= 0.85;
}

// Draw
function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
  for (let i = 0; i < H; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }

  // Bricks
  for (let b of bricks) {
    if (!b.alive) continue;
    const alpha = b.hp / b.maxHp;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.6 + alpha * 0.4;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.globalAlpha = 1;

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(b.x, b.y, b.w, b.h * 0.4);

    // HP indicator for multi-hit bricks
    if (b.maxHp > 1) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(b.hp, b.x + b.w/2, b.y + b.h - 4);
    }
  }

  // Paddle
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#4fc3f7';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.roundRect(paddle.x - paddle.w/2, paddle.y - paddle.h/2, paddle.w, paddle.h, 4);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Paddle grip lines
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(paddle.x + i * 15, paddle.y - paddle.h/2);
    ctx.lineTo(paddle.x + i * 15, paddle.y + paddle.h/2);
    ctx.stroke();
  }

  // Ball
  if (state === 'playing' || state === 'start') {
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ball shine
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(ball.x - 2, ball.y - 2, ball.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + Math.floor(score), 20, 25);
  ctx.textAlign = 'right';
  ctx.fillText('LIVES ' + lives, W - 20, 25);
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL ' + level, W/2, 25);

  // Combo
  if (combo > 1) {
    ctx.fillStyle = '#f1c40f';
    ctx.font = '14px monospace';
    ctx.fillText('COMBO x' + combo, W/2, 45);
  }

  // Launch hint
  if (state === 'playing' && !ball.launched) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CLICK or SPACE to launch', W/2, H - 80);
  }

  // Overlays
  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ARKANOID', W/2, H/2 - 40);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('CLICK or SPACE to start', W/2, H/2 + 20);
    ctx.fillText('Mouse or Arrow Keys to move', W/2, H/2 + 50);
  }

  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Final Score: ' + Math.floor(score), W/2, H/2 + 20);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('CLICK or SPACE to restart', W/2, H/2 + 60);
  }

  if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('YOU WIN!', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: ' + Math.floor(score), W/2, H/2 + 20);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('CLICK or SPACE to play again', W/2, H/2 + 60);
  }

  ctx.restore();
}

// Game loop
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
