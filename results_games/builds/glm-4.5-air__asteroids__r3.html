<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        
        #gameCanvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        
        #gameInfo {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 18px;
            text-shadow: 0 0 5px #0ff;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f00;
            font-size: 48px;
            text-align: center;
            text-shadow: 0 0 10px #f00;
            display: none;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="gameInfo">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    <div id="gameOver">
        <div>GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px;">Press R to Restart</div>
    </div>
    <div id="instructions">
        Arrow Keys: Rotate/Thrust | Space: Shoot | R: Restart
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameOverElement = document.getElementById('gameOver');

        // Game constants
        const SHIP_SIZE = 15;
        const BULLET_SPEED = 10;
        const ASTEROID_SPEEDS = [1, 1.5, 2];
        const THRUST_POWER = 0.3;
        const ROTATION_SPEED = 0.1;
        const FRICTION = 0.99;
        const MAX_BULLETS = 4;

        // Game state
        let gameRunning = true;
        let score = 0;
        let lives = 3;
        let keys = {};

        // Game objects
        let player;
        let asteroids = [];
        let bullets = [];
        let particles = [];

        // Player class
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.angle = -Math.PI / 2;
                this.radius = SHIP_SIZE;
                this.invulnerable = 0;
            }

            update() {
                // Rotation
                if (keys['ArrowLeft']) {
                    this.angle -= ROTATION_SPEED;
                }
                if (keys['ArrowRight']) {
                    this.angle += ROTATION_SPEED;
                }

                // Thrust
                if (keys['ArrowUp']) {
                    this.vx += Math.cos(this.angle) * THRUST_POWER;
                    this.vy += Math.sin(this.angle) * THRUST_POWER;
                    
                    // Thrust particles
                    for (let i = 0; i < 3; i++) {
                        particles.push(new Particle(
                            this.x - Math.cos(this.angle) * SHIP_SIZE,
                            this.y - Math.sin(this.angle) * SHIP_SIZE,
                            -Math.cos(this.angle) * 2 + (Math.random() - 0.5),
                            -Math.sin(this.angle) * 2 + (Math.random() - 0.5),
                            '#ff6600'
                        ));
                    }
                }

                // Apply friction
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Update invulnerability
                if (this.invulnerable > 0) {
                    this.invulnerable--;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Draw ship
                ctx.strokeStyle = this.invulnerable > 0 && Math.floor(this.invulnerable / 5) % 2 ? '#666' : '#0ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(SHIP_SIZE, 0);
                ctx.lineTo(-SHIP_SIZE, -SHIP_SIZE / 2);
                ctx.lineTo(-SHIP_SIZE / 2, 0);
                ctx.lineTo(-SHIP_SIZE, SHIP_SIZE / 2);
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            }

            shoot() {
                if (bullets.length < MAX_BULLETS) {
                    bullets.push(new Bullet(
                        this.x + Math.cos(this.angle) * SHIP_SIZE,
                        this.y + Math.sin(this.angle) * SHIP_SIZE,
                        Math.cos(this.angle) * BULLET_SPEED + this.vx,
                        Math.sin(this.angle) * BULLET_SPEED + this.vy
                    ));
                }
            }
        }

        // Asteroid class
        class Asteroid {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size; // 0 = large, 1 = medium, 2 = small
                this.radius = size === 0 ? 30 : size === 1 ? 20 : 10;
                this.vx = (Math.random() - 0.5) * ASTEROID_SPEEDS[size];
                this.vy = (Math.random() - 0.5) * ASTEROID_SPEEDS[size];
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = (Math.random() - 0.5) * 0.05;
                this.vertices = this.generateVertices();
            }

            generateVertices() {
                const vertices = [];
                const numVertices = 8 + Math.floor(Math.random() * 5);
                for (let i = 0; i < numVertices; i++) {
                    const angle = (i / numVertices) * Math.PI * 2;
                    const variance = 0.8 + Math.random() * 0.4;
                    vertices.push({
                        x: Math.cos(angle) * this.radius * variance,
                        y: Math.sin(angle) * this.radius * variance
                    });
                }
                return vertices;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angleSpeed;

                // Wrap around screen
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y < -this.radius) this.y = canvas.height + this.radius;
                if (this.y > canvas.height + this.radius) this.y = -this.radius;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for (let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            }

            split() {
                const newAsteroids = [];
                if (this.size < 2) {
                    for (let i = 0; i < 2; i++) {
                        newAsteroids.push(new Asteroid(
                            this.x + (Math.random() - 0.5) * 20,
                            this.y + (Math.random() - 0.5) * 20,
                            this.size + 1
                        ));
                    }
                }
                return newAsteroids;
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 60;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Particle class for effects
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 30;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.life--;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 30;
                ctx.fillRect(this.x, this.y, 2, 2);
                ctx.globalAlpha = 1;
            }
        }

        // Collision detection
        function checkCollision(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < obj1.radius + obj2.radius;
        }

        // Initialize game
        function init() {
            player = new Player(canvas.width / 2, canvas.height / 2);
            asteroids = [];
            bullets = [];
            particles = [];
            score = 0;
            lives = 3;
            gameRunning = true;
            gameOverElement.style.display = 'none';

            // Create initial asteroids
            for (let i = 0; i < 5; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.sqrt((x - player.x) ** 2 + (y - player.y) ** 2) < 100);
                
                asteroids.push(new Asteroid(x, y, 0));
            }
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                // Update player
                player.update();

                // Update asteroids
                asteroids.forEach(asteroid => asteroid.update());

                // Update bullets
                bullets = bullets.filter(bullet => {
                    bullet.update();
                    return bullet.life > 0;
                });

                // Update particles
                particles = particles.filter(particle => {
                    particle.update();
                    return particle.life > 0;
                });

                // Check bullet-asteroid collisions
                for (let i = bullets.length - 1; i >= 0; i--) {
                    for (let j = asteroids.length - 1; j >= 0; j--) {
                        if (checkCollision(bullets[i], asteroids[j])) {
                            // Create explosion particles
                            for (let k = 0; k < 10; k++) {
                                particles.push(new Particle(
                                    asteroids[j].x,
                                    asteroids[j].y,
                                    (Math.random() - 0.5) * 4,
                                    (Math.random() - 0.5) * 4,
                                    '#888'
                                ));
                            }

                            // Split asteroid
                            const newAsteroids = asteroids[j].split();
                            asteroids.splice(j, 1);
                            asteroids.push(...newAsteroids);

                            // Update score
                            score += (3 - asteroids[j]?.size || 0) * 100;
                            scoreElement.textContent = score;

                            // Remove bullet
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }

                // Check player-asteroid collisions
                if (player.invulnerable === 0) {
                    for (let asteroid of asteroids) {
                        if (checkCollision(player, asteroid)) {
                            // Create explosion
                            for (let i = 0; i < 20; i++) {
                                particles.push(new Particle(
                                    player.x,
                                    player.y,
                                    (Math.random() - 0.5) * 6,
                                    (Math.random() - 0.5) * 6,
                                    '#0ff'
                                ));
                            }

                            lives--;
                            livesElement.textContent = lives;
                            player.invulnerable = 120;

                            if (lives <= 0) {
                                gameRunning = false;
                                gameOverElement.style.display = 'block';
                            } else {
                                // Reset player position
                                player.x = canvas.width / 2;
                                player.y = canvas.height / 2;
                                player.vx = 0;
                                player.vy = 0;
                            }
                            break;
                        }
                    }
                }

                // Check if all asteroids destroyed
                if (asteroids.length === 0) {
                    // Create new wave
                    for (let i = 0; i < 5 + Math.floor(score / 5000); i++) {
                        let x, y;
                        do {
                            x = Math.random() * canvas.width;
                            y = Math.random() * canvas.height;
                        } while (Math.sqrt((x - player.x) ** 2 + (y - player.y) ** 2) < 150);
                        
                        asteroids.push(new Asteroid(x, y, 0));
                    }
                }
            }

            // Draw everything
            asteroids.forEach(asteroid => asteroid.draw());
            bullets.forEach(bullet => bullet.draw());
            particles.forEach(particle => particle.draw());
            if (gameRunning) player.draw();

            requestAnimationFrame(gameLoop);
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                player.shoot();
            }
            
            if (e.key.toLowerCase() === 'r' && !gameRunning) {
                init();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
