<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid Clone</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#222;display:block;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
const paddle={w:120,h:10,x: (w-paddle.w)/2,y:h-40,dx:0};
const ball={r:8,x:w/2,y:h/2,vx:3,vy:-3};
const bricks=[];
const brickRowCount=5;
const brickColumnCount=8;
const brickWidth=80;
const brickHeight=20;
const brickPadding=10;
const brickOffsetTop=50;
const brickOffsetLeft=20;
for(let c=0;c<brickColumnCount;c++){
  bricks[c]=[];
  for(let r=0;r<brickRowCount;r++){
    const brickX=c*(brickWidth+brickPadding)+brickOffsetLeft;
    const brickY=r*(brickHeight+brickPadding)+brickOffsetTop;
    bricks[c][r]={x:brickX,y:brickY,status:1};
  }
}
let score=0;
function drawPaddle(){
  ctx.fillStyle='#0f0';
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
}
function drawBall(){
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
}
function drawBricks(){
  for(let c=0;c<brbrickColumnCount;c++){
    for(let r=0;r<brrickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        ctx.fillStyle='#888';
        ctx.fillRect(b.x,b.y,brickWidth,brickHeight);
        ctx.strokeStyle='#555';
        ctx.strokeRect(b.x,b.y,brickWidth,brickHeight);
      }
    }
  }
}
function movePaddle(){
  paddle.x+=paddle.dx;
  if(paddle.x<0) paddle.x=0;
  if(paddle.x+paddle.w>w) paddle.x=w-paddle.w;
}
function resetBall(){
  ball.x=paddle.x+paddle.w/2;
  ball.y=paddle.y-5;
  ball.vx=3* (Math.random()>0.5?1:-1);
  ball.vy=-3;
}
function update(){
  movePaddle();
  ball.x+=ball.vx;
  ball.y+=ball.vy;
  // Wall collision
  if(ball.x-ball.r<0||ball.x+ball.r>w){ball.vx*=-1;}
  if(ball.y-ball.r<0){ball.vy*=-1;}
  // Paddle collision
  if(ball.y+ball.r>paddle.y && ball.x>paddle.x && ball.x<paddle.x+paddle.w){
    ball.vy*=-1;
    const offset=paddle.x-paddle.w/2;
    const delta=(ball.x-offset)/ (paddle.w/2);
    ball.vx=5*delta;
  }
  // Brick collision
  for(let c=0;c<brbrickColumnCount;c++){
    for(let r=0;r<brrickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        if(ball.x>b.x && ball.x<b.x+brickWidth && ball.y>b.y && ball.y<b.y+brickHeight){
          b.status=0;
          score++;
          ball.vy*=-1;
          // Check if hitting from top or sides
          if(ball.y-ball.r<b.y){ball.vy*=-1;}
          if(ball.x-ball.r<b.x){ball.vx*=-1;}
          if(ball.x+ball.r>b.x+brickWidth){ball.vx*=-1;}
          if(ball.y+ball.r>b.y+brickHeight){ball.vy*=-1;}
        }
      }
    }
  }
  // Ball missed
  if(ball.y-ball.r>h){
    resetBall();
  }
  // Clear
  ctx.clearRect(0,0,w,h);
  drawBricks();
  drawPaddle();
  drawBall();
  // Score
  ctx.fillStyle='#fff';
  ctx.font='18px sans-serif';
  ctx.fillText('Score: '+score,10,20);
  if(score>=brickRowCount*brickColumnCount){
    ctx.fillText('You Win!',w/2-50,h/2);
    cancelAnimationFrame(loop);
  }
}
let loop=requestAnimationFrame(update);
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') paddle.dx=-6;
  else if(e.key==='ArrowRight') paddle.dx=6;
  else if(e.key==='a') paddle.dx=-6;
  else if(e.key==='d') paddle.dx=6;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='a'||e.key==='d'){
    paddle.dx=0;
  }
});
resetBall();
</script>
</body>
</html>
