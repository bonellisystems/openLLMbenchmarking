<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doodle Jump Clone</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#fff;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const player = {
    w: 50,
    h: 50,
    x: canvas.width / 2,
    y: canvas.height - 150,
    vx: 0,
    vy: 0,
    speed: 5,
    gravity: 0.6,
    jumpStrength: -12,
    onGround: false
  };

  const platforms = [];
  function addPlatform(x, y, w, h) { platforms.push({x, y, w, h}); }
  function initPlatforms() {
    addPlatform(0, canvas.height - 30, canvas.width, 30);
    for (let i = 0; i < 5; i++) {
      const pw = 80 + Math.random() * 100;
      const py = canvas.height - 150 - i * 120;
      const px = Math.random() * (canvas.width - pw);
      addPlatform(px, py, pw, 20);
    }
  }
  initPlatforms();

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'ArrowLeft') { e.preventDefault(); player.vx = -player.speed; }
    if (e.key === 'ArrowRight') { e.preventDefault(); player.vx = player.speed; }
    if (e.key === ' ') { player.vy = player.jumpStrength; }
  });
  window.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') player.vx = 0;
  });

  function checkCollision() {
    player.onGround = false;
    for (const p of platforms) {
      if (player.x < p.x + p.w && player.x + player.w > p.x &&
          player.y + player.h > p.y && player.y < p.y + p.h) {
        if (player.vy > 0 && player.y + player.h <= p.y + player.h) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
        if (player.vy < 0 && player.y >= p.y + p.h) {
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }
  }

  function generatePlatformIfNeeded() {
    if (player.y > canvas.height - 150) {
      const pw = 80 + Math.random() * 100;
      const py = Math.max(0, player.y - 150 - Math.random() * 80);
      const px = Math.random() * (canvas.width - pw);
      addPlatform(px, py, pw, 20);
      while (platforms[0].y < -200) platforms.shift();
    }
  }

  function update() {
    if (!player.onGround) player.vy += player.gravity;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    checkCollision();
    generatePlatformIfNeeded();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#8B4513';
    for (const p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(player.x, player.y, player.w, player.h);

    if (player.y > canvas.height) {
      player.x = canvas.width / 2;
      player.y = canvas.height - 150;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
    }

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
