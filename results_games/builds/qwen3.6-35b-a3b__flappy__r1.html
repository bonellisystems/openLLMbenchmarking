<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { display: block; background: #70c5ce; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

const GRAVITY = 0.45;
const FLAP_POWER = -7.5;
const PIPE_WIDTH = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_INTERVAL = 1600;
const GROUND_HEIGHT = 80;
const BIRD_SIZE = 20;

let bird, pipes, score, bestScore, gameState, groundX, lastPipeTime, frameCount;

bestScore = parseInt(localStorage.getItem('flappyBest')) || 0;

function init() {
    bird = {
        x: 80,
        y: H / 2 - 50,
        vy: 0,
        rotation: 0,
        flapFrame: 0,
        wingUp: true
    };
    pipes = [];
    score = 0;
    groundX = 0;
    lastPipeTime = 0;
    frameCount = 0;
    gameState = 'ready';
}

function flap() {
    if (gameState === 'ready') {
        gameState = 'playing';
        bird.vy = FLAP_POWER;
        bird.flapFrame = 10;
    } else if (gameState === 'playing') {
        bird.vy = FLAP_POWER;
        bird.flapFrame = 10;
    } else if (gameState === 'dead') {
        init();
    }
}

document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener('click', function() {
    flap();
});

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    flap();
});

function spawnPipe() {
    const minY = 80;
    const maxY = H - GROUND_HEIGHT - PIPE_GAP - 80;
    const topHeight = minY + Math.random() * (maxY - minY);
    pipes.push({
        x: W + 10,
        topHeight: topHeight,
        scored: false
    });
}

function update() {
    frameCount++;

    if (gameState === 'ready') {
        bird.y = H / 2 - 50 + Math.sin(frameCount * 0.08) * 12;
        groundX = (groundX - 1) % 24;
        return;
    }

    if (gameState !== 'playing') return;

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rotation = Math.min(Math.max(bird.vy * 3, -30), 90);
    if (bird.flapFrame > 0) bird.flapFrame--;

    groundX = (groundX - PIPE_SPEED) % 24;

    if (frameCount % Math.round(PIPE_INTERVAL / 16.67) === 0 || pipes.length === 0) {
        spawnPipe();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;

        if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
            pipes[i].scored = true;
            score++;
        }

        if (pipes[i].x + PIPE_WIDTH < -10) {
            pipes.splice(i, 1);
        }
    }

    const birdTop = bird.y - BIRD_SIZE;
    const birdBottom = bird.y + BIRD_SIZE;
    const birdLeft = bird.x - BIRD_SIZE;
    const birdRight = bird.x + BIRD_SIZE;

    for (let p of pipes) {
        const pipeLeft = p.x;
        const pipeRight = p.x + PIPE_WIDTH;

        if (birdRight > pipeLeft && birdLeft < pipeRight) {
            if (birdTop < p.topHeight || birdBottom > p.topHeight + PIPE_GAP) {
                die();
                return;
            }
        }
    }

    if (birdBottom > H - GROUND_HEIGHT || birdTop < 0) {
        die();
    }
}

function die() {
    gameState = 'dead';
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('flappyBest', bestScore);
    }
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    grad.addColorStop(0, '#4ec0ca');
    grad.addColorStop(1, '#70c5ce');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    ctx.fillStyle = '#e8f4f8';
    ctx.beginPath();
    ctx.arc(300, 100, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(340, 90, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(260, 110, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e8f4f8';
    ctx.beginPath();
    ctx.arc(100, 160, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(140, 150, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(70, 165, 22, 0, Math.PI * 2);
    ctx.fill();
}

function drawGround() {
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);

    ctx.fillStyle = '#54a030';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, 15);

    ctx.fillStyle = '#4a8c2a';
    for (let x = groundX; x < W + 24; x += 24) {
        ctx.fillRect(x, H - GROUND_HEIGHT, 12, 15);
    }

    ctx.strokeStyle = '#c9b45e';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_HEIGHT + 15);
    ctx.lineTo(W, H - GROUND_HEIGHT + 15);
    ctx.stroke();
}

function drawPipe(p) {
    const capHeight = 26;
    const capOverhang = 4;

    ctx.fillStyle = '#5a9e2f';
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.topHeight);
    ctx.fillStyle = '#6db83a';
    ctx.fillRect(p.x + 4, 0, PIPE_WIDTH - 8, p.topHeight);
    ctx.fillStyle = '#4a8525';
    ctx.fillRect(p.x, 0, 4, p.topHeight);
    ctx.fillRect(p.x + PIPE_WIDTH - 4, 0, 4, p.topHeight);

    ctx.fillStyle = '#5a9e2f';
    ctx.fillRect(p.x - capOverhang, p.topHeight - capHeight, PIPE_WIDTH + capOverhang * 2, capHeight);
    ctx.fillStyle = '#6db83a';
    ctx.fillRect(p.x - capOverhang + 4, p.topHeight - capHeight, PIPE_WIDTH + capOverhang * 2 - 8, capHeight);
    ctx.fillStyle = '#4a8525';
    ctx.fillRect(p.x - capOverhang, p.topHeight - capHeight, 4, capHeight);
    ctx.fillRect(p.x + PIPE_WIDTH + capOverhang - 4, p.topHeight - capHeight, 4, capHeight);

    ctx.fillStyle = '#5a9e2f';
    ctx.fillRect(p.x, p.topHeight + PIPE_GAP, PIPE_WIDTH, H - GROUND_HEIGHT - p.topHeight - PIPE_GAP);
    ctx.fillStyle = '#6db83a';
    ctx.fillRect(p.x + 4, p.topHeight + PIPE_GAP, PIPE_WIDTH - 8, H - GROUND_HEIGHT - p.topHeight - PIPE_GAP);
    ctx.fillStyle = '#4a8525';
    ctx.fillRect(p.x, p.topHeight + PIPE_GAP, 4, H - GROUND_HEIGHT - p.topHeight - PIPE_GAP);
    ctx.fillRect(p.x + PIPE_WIDTH - 4, p.topHeight + PIPE_GAP, 4, H - GROUND_HEIGHT - p.topHeight - PIPE_GAP);

    ctx.fillStyle = '#5a9e2f';
    const bottomCapY = p.topHeight + PIPE_GAP;
    ctx.fillRect(p.x - capOverhang, bottomCapY, PIPE_WIDTH + capOverhang * 2, capHeight);
    ctx.fillStyle = '#6db83a';
    ctx.fillRect(p.x - capOverhang + 4, bottomCapY, PIPE_WIDTH + capOverhang * 2 - 8, capHeight);
    ctx.fillStyle = '#4a8525';
    ctx.fillRect(p.x - capOverhang, bottomCapY, 4, capHeight);
    ctx.fillRect(p.x + PIPE_WIDTH + capOverhang - 4, bottomCapY, 4, capHeight);
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation * Math.PI / 180);

    const wingOffset = bird.flapFrame > 5 ? -6 : (bird.flapFrame > 0 ? -3 : 0);

    ctx.fillStyle = '#f5c842';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#e8b830';
    ctx.beginPath();
    ctx.ellipse(2, 3, BIRD_SIZE * 0.6, BIRD_SIZE * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f5c842';
    ctx.beginPath();
    ctx.ellipse(-2, wingOffset, 14, 8, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(10, -5, 7, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(12, -4, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e85030';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(26, 2);
    ctx.lineTo(16, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawScore() {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.font = 'bold 48px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(score, W / 2, 60);
    ctx.fillText(score, W / 2, 60);
}

function drawReady() {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.font = 'bold 40px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Flappy Bird', W / 2, H / 2 - 80);
    ctx.fillText('Flappy Bird', W / 2, H / 2 - 80);

    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.strokeText('Press Space or Click to Start', W / 2, H / 2 - 20);
    ctx.fillText('Press Space or Click to Start', W / 2, H / 2 - 20);

    ctx.font = '16px Arial, sans-serif';
    ctx.strokeText('Best: ' + bestScore, W / 2, H / 2 + 20);
    ctx.fillText('Best: ' + bestScore, W / 2, H / 2 + 20);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.font = 'bold 44px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Game Over', W / 2, H / 2 - 60);
    ctx.fillText('Game Over', W / 2, H / 2 - 60);

    ctx.font = 'bold 28px Arial, sans-serif';
    ctx.strokeText('Score: ' + score, W / 2, H / 2);
    ctx.fillText('Score: ' + score, W / 2, H / 2);

    ctx.strokeText('Best: ' + bestScore, W / 2, H / 2 + 40);
    ctx.fillText('Best: ' + bestScore, W / 2, H / 2 + 40);

    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.strokeText('Press Space or Click to Restart', W / 2, H / 2 + 90);
    ctx.fillText('Press Space or Click to Restart', W / 2, H / 2 + 90);
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    for (let p of pipes) {
        drawPipe(p);
    }

    drawGround();
    drawBird();

    if (gameState === 'playing') {
        drawScore();
    } else if (gameState === 'ready') {
        drawScore();
        drawReady();
    } else if (gameState === 'dead') {
        drawScore();
        drawGameOver();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

init();
gameLoop();
</script>
</body>
</html>
