<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  body,html{margin:0;padding:0;background:#70c5ce;overflow:hidden;height:100%;font-family:sans-serif;}
  #gameCanvas{display:block;margin:0 auto;background:#70c5ce;}
  .overlay{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:24px;
    text-shadow:0 0 5px #000;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div class="overlay" id="overlay"></div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  const GRAVITY = 0.5;
  const FLAP_STRENGTH = -8;
  const PIPE_SPEED = 2;
  const PIPE_GAP = 120;
  const PIPE_WIDTH = 60;
  const PIPE_INTERVAL = 1500; // ms

  let bird = {x: 80, y: HEIGHT/2, radius: 12, vy: 0};
  let pipes = [];
  let lastPipeTime = 0;
  let score = 0;
  let best = 0;
  let gameState = 'start'; // start, playing, over

  function resetGame() {
    bird = {x: 80, y: HEIGHT/2, radius: 12, vy: 0};
    pipes = [];
    lastPipeTime = 0;
    score = 0;
    gameState = 'playing';
    overlay.textContent = '';
  }

  function createPipe() {
    const topHeight = Math.random() * (HEIGHT - PIPE_GAP - 100) + 50;
    const bottomY = topHeight + PIPE_GAP;
    pipes.push({
      x: WIDTH,
      top: {y:0, h:topHeight},
      bottom: {y:bottomY, h:HEIGHT - bottomY}
    });
  }

  function update(delta) {
    if (gameState !== 'playing') return;

    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;

    // Pipe generation
    if (performance.now() - lastPipeTime > PIPE_INTERVAL) {
      createPipe();
      lastPipeTime = performance.now();
    }

    // Move pipes
    for (let i = pipes.length -1; i >=0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED;
      // Check for score
      if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
        p.passed = true;
        score++;
        if (score > best) best = score;
      }
      // Remove off-screen pipes
      if (p.x + PIPE_WIDTH < 0) pipes.splice(i,1);
    }

    // Collision detection
    if (bird.y + bird.radius > HEIGHT || bird.y - bird.radius < 0) {
      gameOver();
    }
    for (const p of pipes) {
      if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
        if (bird.y - bird.radius < p.top.h || bird.y + bird.radius > p.bottom.y) {
          gameOver();
        }
      }
    }
  }

  function draw() {
    // Clear
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    // Draw bird
    ctx.fillStyle = '#ff0';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI*2);
    ctx.fill();

    // Draw pipes
    ctx.fillStyle = '#0f0';
    for (const p of pipes) {
      // top
      ctx.fillRect(p.x, p.top.y, PIPE_WIDTH, p.top.h);
      // bottom
      ctx.fillRect(p.x, p.bottom.y, PIPE_WIDTH, p.bottom.h);
    }

    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText('Score: '+score, 10,30);
    ctx.fillText('Best: '+best, 10,60);
  }

  function loop(timestamp) {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function flap() {
    if (gameState === 'start') {
      resetGame();
    } else if (gameState === 'playing') {
      bird.vy = FLAP_STRENGTH;
    } else if (gameState === 'over') {
      resetGame();
    }
  }

  function gameOver() {
    gameState = 'over';
    overlay.textContent = 'Game Over - Press Space to Restart';
  }

  // Input
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      flap();
    }
  });
  document.addEventListener('mousedown', e => {
    flap();
  });

  // Initial overlay
  overlay.textContent = 'Press Space to Start';

  // Start loop
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
