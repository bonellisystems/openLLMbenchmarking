<!DOCTYPE html>
<html>
<head>
    <title>Tiny Roguelike</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game {
            line-height: 1;
            letter-spacing: 2px;
            font-size: 18px;
            white-space: pre;
        }
        #ui {
            margin-bottom: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="ui">HP: 20/20 | Find the Exit (X)</div>
    <div id="game"></div>
    <script>
        const SIZE = 25;
        const map = [];
        const player = { x: 0, y: 0, hp: 20, maxHp: 20 };
        const enemies = [];
        const goal = { x: 0, y: 0 };
        let state = 'playing';

        function init() {
            for (let y = 0; y < SIZE; y++) {
                map[y] = [];
                for (let x = 0; x < SIZE; x++) map[y][x] = '#';
            }

            const rooms = [];
            for (let i = 0; i < 6; i++) {
                const w = Math.floor(Math.random() * 4) + 3;
                const h = Math.floor(Math.random() * 4) + 3;
                const x = Math.floor(Math.random() * (SIZE - w - 1)) + 1;
                const y = Math.floor(Math.random() * (SIZE - h - 1)) + 1;
                
                for (let ry = y; ry < y + h; ry++) {
                    for (let rx = x; rx < x + w; rx++) map[ry][rx] = '.';
                }
                rooms.push({ x: x + Math.floor(w / 2), y: y + Math.floor(h / 2) });
            }

            for (let i = 0; i < rooms.length - 1; i++) {
                let cx = rooms[i].x, cy = rooms[i].y;
                const tx = rooms[i + 1].x, ty = rooms[i + 1].y;
                while (cx !== tx) { map[cy][cx] = '.'; cx += (tx > cx ? 1 : -1); }
                while (cy !== ty) { map[cy][cx] = '.'; cy += (ty > cy ? 1 : -1); }
            }

            player.x = rooms[0].x;
            player.y = rooms[0].y;
            goal.x = rooms[rooms.length - 1].x;
            goal.y = rooms[rooms.length - 1].y;

            for (let i = 0; i < 5; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * SIZE);
                    ey = Math.floor(Math.random() * SIZE);
                } while (map[ey][ex] !== '.' || (ex === player.x && ey === player.y));
                enemies.push({ x: ex, y: ey, hp: 3 });
            }
            render();
        }

        function render() {
            let view = "";
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    let char = map[y][x];
                    if (x === player.x && y === player.y) char = '@';
                    else if (x === goal.x && y === goal.y) char = 'X';
                    else {
                        const enemy = enemies.find(e => e.x === x && e.y === y);
                        if (enemy) char = 'E';
                    }
                    view += char;
                }
                view += "\n";
            }
            document.getElementById('game').innerText = view;
            document.getElementById('ui').innerText = `HP: ${player.hp}/${player.maxHp} | Find the Exit (X)`;
            if (state === 'won') document.getElementById('ui').innerText = "YOU ESCAPED! (Refresh to restart)";
            if (state === 'lost') document.getElementById('ui').innerText = "YOU DIED... (Refresh to restart)";
        }

        function movePlayer(dx, dy) {
            if (state !== 'playing') return;
            const nx = player.x + dx, ny = player.y + dy;
            if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE || map[ny][nx] === '#') return;

            const enemy = enemies.find(e => e.x === nx && e.y === ny);
            if (enemy) {
                enemy.hp--;
                if (enemy.hp <= 0) {
                    const idx = enemies.indexOf(enemy);
                    enemies.splice(idx, 1);
                }
            } else {
                player.x = nx;
                player.y = ny;
            }

            if (player.x === goal.x && player.y === goal.y) state = 'won';

            enemies.forEach(e => {
                const edx = player.x - e.x, edy = player.y - e.y;
                const dist = Math.abs(edx) + Math.abs(edy);
                if (dist === 1) {
                    player.hp--;
                } else if (dist < 6) {
                    let mx = 0, my = 0;
                    if (Math.abs(edx) > Math.abs(edy)) mx = edx > 0 ? 1 : -1;
                    else my = edy > 0 ? 1 : -1;
                    if (map[e.y + my][e.x + mx] === '.' && !(e.x + mx === player.x && e.y + my === player.y)) {
                        e.x += mx; e.y += my;
                    }
                }
            });

            if (player.hp <= 0) state = 'lost';
            render();
        }

        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': case 'w': movePlayer(0, -1); break;
                case 'ArrowDown': case 's': movePlayer(0, 1); break;
                case 'ArrowLeft': case 'a': movePlayer(-1, 0); break;
                case 'ArrowRight': case 'd': movePlayer(1, 0); break;
            }
        });

        init();
    </script>
</body>
</html>
