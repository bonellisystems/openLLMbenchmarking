<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #1a1a2e;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
overflow: hidden;
}
#gameContainer {
position: relative;
display: flex;
flex-direction: column;
align-items: center;
}
#scoreBoard {
color: #e94560;
font-size: 24px;
font-weight: bold;
margin-bottom: 12px;
letter-spacing: 2px;
text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
}
canvas {
border: 3px solid #e94560;
border-radius: 4px;
box-shadow: 0 0 30px rgba(233, 69, 96, 0.3), inset 0 0 30px rgba(0,0,0,0.3);
display: block;
}
#overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(0, 0, 0, 0.75);
border-radius: 4px;
z-index: 10;
}
#overlay.hidden { display: none; }
#overlay h1 {
color: #e94560;
font-size: 48px;
margin-bottom: 16px;
text-shadow: 0 0 20px rgba(233, 69, 96, 0.7);
}
#overlay p {
color: #eee;
font-size: 20px;
margin-bottom: 8px;
}
#overlay .finalScore {
color: #0f3460;
font-size: 28px;
font-weight: bold;
margin: 12px 0;
background: #e94560;
padding: 8px 24px;
border-radius: 8px;
}
#overlay .hint {
color: #aaa;
font-size: 16px;
margin-top: 16px;
}
</style>
</head>
<body>
<div id="gameContainer">
<div id="scoreBoard">SCORE: 0</div>
<div style="position:relative;">
<canvas id="gameCanvas"></canvas>
<div id="overlay">
<h1>SNAKE</h1>
<p>Use arrow keys or WASD to move</p>
<p class="hint">Press any key to start</p>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreBoard = document.getElementById('scoreBoard');

const GRID = 20;
const COLS = 25;
const ROWS = 25;
canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

const INITIAL_SPEED = 120;
const MIN_SPEED = 60;
const SPEED_INCREMENT = 2;

let snake, food, direction, nextDirection, score, speed, gameRunning, gameOver, started;
let lastTime = 0;
let accumulator = 0;
let particles = [];

function init() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
        { x: midX, y: midY },
        { x: midX - 1, y: midY },
        { x: midX - 2, y: midY }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = INITIAL_SPEED;
    gameRunning = false;
    gameOver = false;
    started = false;
    accumulator = 0;
    particles = [];
    scoreBoard.textContent = 'SCORE: 0';
    placeFood();
}

function placeFood() {
    let pos;
    do {
        pos = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
        };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
}

function spawnParticles(x, y) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x * GRID + GRID / 2,
            y: y * GRID + GRID / 2,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1,
            size: Math.random() * 4 + 2,
            color: Math.random() > 0.5 ? '#e94560' : '#ff6b6b'
        });
    }
}

function update() {
    direction = { ...nextDirection };
    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame();
        return;
    }

    for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreBoard.textContent = 'SCORE: ' + score;
        spawnParticles(food.x, food.y);
        placeFood();
        speed = Math.max(MIN_SPEED, speed - SPEED_INCREMENT);
    } else {
        snake.pop();
    }
}

function endGame() {
    gameOver = true;
    gameRunning = false;
    overlay.classList.remove('hidden');
    overlay.innerHTML = '<h1>GAME OVER</h1><div class="finalScore">Score: ' + score + '</div><p>Press any key to restart</p>';
}

function draw() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * GRID, 0);
        ctx.lineTo(x * GRID, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * GRID);
        ctx.lineTo(canvas.width, y * GRID);
        ctx.stroke();
    }

    // Food
    const foodX = food.x * GRID;
    const foodY = food.y * GRID;
    const pulse = Math.sin(Date.now() / 200) * 0.15 + 0.85;

    ctx.save();
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 15 * pulse;
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(foodX + GRID / 2, foodY + GRID / 2, (GRID / 2 - 2) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Snake
    for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const t = i / snake.length;
        const r = Math.floor(15 + t * 10);
        const g = Math.floor(200 - t * 80);
        const b = Math.floor(100 - t * 40);

        if (i === 0) {
            ctx.save();
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#00ff88';
            ctx.beginPath();
            ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 5);
            ctx.fill();
            ctx.restore();

            // Eyes
            const eyeSize = 3;
            ctx.fillStyle = '#1a1a2e';
            if (direction.x === 1) {
                ctx.beginPath(); ctx.arc(seg.x * GRID + 14, seg.y * GRID + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(seg.x * GRID + 14, seg.y * GRID + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
            } else if (direction.x === -1) {
                ctx.beginPath(); ctx.arc(seg.x * GRID + 6, seg.y * GRID + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(seg.x * GRID + 6, seg.y * GRID + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
            } else if (direction.y === -1) {
                ctx.beginPath(); ctx.arc(seg.x * GRID + 6, seg.y * GRID + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(seg.x * GRID + 14, seg.y * GRID + 6, eyeSize, 0, Math.PI * 2); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(seg.x * GRID + 6, seg.y * GRID + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(seg.x * GRID + 14, seg.y * GRID + 14, eyeSize, 0, Math.PI * 2); ctx.fill();
            }
        } else {
            ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
            ctx.beginPath();
            ctx.roundRect(seg.x * GRID + 1.5, seg.y * GRID + 1.5, GRID - 3, GRID - 3, 4);
            ctx.fill();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime;
    lastTime = timestamp;

    if (gameRunning) {
        accumulator += delta;
        while (accumulator >= speed) {
            update();
            accumulator -= speed;
            if (gameOver) break;
        }
    }

    draw();
    requestAnimationFrame(gameLoop);
}

function handleKey(e) {
    if (!started && !gameOver) {
        started = true;
        gameRunning = true;
        overlay.classList.add('hidden');
    }

    if (gameOver) {
        init();
        overlay.classList.add('hidden');
        started = true;
        gameRunning = true;
        return;
    }

    const key = e.key.toLowerCase();
    let newDir = null;

    if ((key === 'arrowup' || key === 'w') && direction.y !== 1) {
        newDir = { x: 0, y: -1 };
    } else if ((key === 'arrowdown' || key === 's') && direction.y !== -1) {
        newDir = { x: 0, y: 1 };
    } else if ((key === 'arrowleft' || key === 'a') && direction.x !== 1) {
        newDir = { x: -1, y: 0 };
    } else if ((key === 'arrowright' || key === 'd') && direction.x !== -1) {
        newDir = { x: 1, y: 0 };
    }

    if (newDir) {
        nextDirection = newDir;
        e.preventDefault();
    }
}

document.addEventListener('keydown', handleKey);

init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
