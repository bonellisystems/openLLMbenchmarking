<!DOCTYPE html>
<html>
<head>
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            color: white;
        }
        canvas {
            border: 1px solid #00ff00;
        }
        #gameContainer {
            position: relative;
        }
        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="score">Score: 0</div>
        <div id="gameOver">GAME OVER<br>Press R to restart</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        // Game state
        let ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            angle: 0,
            rotation: 0,
            thrusting: false,
            thrust: { x: 0, y: 0 },
            explodeTime: 0
        };

        let bullets = [];
        let asteroids = [];
        let score = 0;
        let gameOver = false;
        let keys = {};

        // Initialize asteroids
        function initAsteroids() {
            asteroids = [];
            const count = 5 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (distance(x, y, ship.x, ship.y) < 100);
                
                asteroids.push({
                    x: x,
                    y: y,
                    radius: 30 + Math.random() * 20,
                    speed: 0.5 + Math.random() * 1.5,
                    angle: Math.random() * Math.PI * 2,
                    rotation: (Math.random() - 0.5) * 0.05,
                    vertices: 8 + Math.floor(Math.random() * 5),
                    offsets: []
                });
            }
            // Generate offsets for each asteroid
            asteroids.forEach(asteroid => {
                for (let i = 0; i < asteroid.vertices; i++) {
                    const angle = (i / asteroid.vertices) * Math.PI * 2;
                    const distance = asteroid.radius * (0.7 + Math.random() * 0.6);
                    asteroid.offsets.push({
                        angle: angle,
                        distance: distance
                    });
                }
            });
        }

        // Initialize game
        function init() {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.angle = 0;
            ship.thrusting = false;
            ship.thrust = { x: 0, y: 0 };
            ship.explodeTime = 0;
            bullets = [];
            score = 0;
            gameOver = false;
            gameOverElement.style.display = 'none';
            scoreElement.textContent = 'Score: 0';
            initAsteroids();
        }

        // Calculate distance between two points
        function distance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        // Draw ship
        function drawShip() {
            if (ship.explodeTime > 0) {
                // Draw explosion
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(ship.x, ship.y, ship.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
                return;
            }

            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            
            // Ship body
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ship.radius, 0);
            ctx.lineTo(-ship.radius, -ship.radius / 2);
            ctx.lineTo(-ship.radius / 2, 0);
            ctx.lineTo(-ship.radius, ship.radius / 2);
            ctx.closePath();
            ctx.stroke();
            
            // Thrust
            if (ship.thrusting) {
                ctx.beginPath();
                ctx.moveTo(-ship.radius, -ship.radius / 4);
                ctx.lineTo(-ship.radius * 1.5, 0);
                ctx.lineTo(-ship.radius, ship.radius / 4);
                ctx.closePath();
                ctx.fillStyle = 'orange';
                ctx.fill();
            }
            
            ctx.restore();
        }

        // Draw bullet
        function drawBullet(bullet) {
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw asteroid
        function drawAsteroid(asteroid) {
            ctx.save();
            ctx.translate(asteroid.x, asteroid.y);
            ctx.rotate(asteroid.angle);
            
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < asteroid.vertices; i++) {
                const offset = asteroid.offsets[i];
                const x = Math.cos(offset.angle) * offset.distance;
                const y = Math.sin(offset.angle) * offset.distance;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // Update ship
        function updateShip() {
            if (ship.explodeTime > 0) {
                ship.explodeTime--;
                if (ship.explodeTime === 0) {
                    ship.x = canvas.width / 2;
                    ship.y = canvas.height / 2;
                    ship.thrust = { x: 0, y: 0 };
                }
                return;
            }

            // Rotation
            if (keys['ArrowLeft']) {
                ship.rotation = -0.08;
            } else if (keys['ArrowRight']) {
                ship.rotation = 0.08;
            } else {
                ship.rotation = 0;
            }
            
            ship.angle += ship.rotation;
            
            // Thrust
            if (keys['ArrowUp']) {
                ship.thrusting = true;
                ship.thrust.x += Math.cos(ship.angle) * 0.1;
                ship.thrust.y += Math.sin(ship.angle) * 0.1;
            } else {
                ship.thrusting = false;
            }
            
            // Apply thrust
            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;
            
            // Friction
            ship.thrust.x *= 0.98;
            ship.thrust.y *= 0.98;
            
            // Wrap around screen
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;
        }

        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                
                // Remove bullets that go off screen
                if (bullet.x < 0 || bullet.x > canvas.width || 
                    bullet.y < 0 || bullet.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }
                
                // Check collision with asteroids
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dist = distance(bullet.x, bullet.y, asteroid.x, asteroid.y);
                    if (dist < asteroid.radius) {
                        // Split asteroid
                        if (asteroid.radius > 10) {
                            const newRadius = asteroid.radius / 2;
                            for (let k = 0; k < 2; k++) {
                                asteroids.push({
                                    x: asteroid.x,
                                    y: asteroid.y,
                                    radius: newRadius,
                                    speed: asteroid.speed * 1.2,
                                    angle: Math.random() * Math.PI * 2,
                                    rotation: (Math.random() - 0.5) * 0.1,
                                    vertices: asteroid.vertices,
                                    offsets: asteroid.offsets.slice()
                                });
                            }
                        }
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 100;
                        scoreElement.textContent = `Score: ${score}`;
                        break;
                    }
                }
            }
        }

        // Update asteroids
        function updateAsteroids() {
            for (let i = 0; i < asteroids.length; i++) {
                const asteroid = asteroids[i];
                asteroid.x += Math.cos(asteroid.angle) * asteroid.speed;
                asteroid.y += Math.sin(asteroid.angle) * asteroid.speed;
                asteroid.angle += asteroid.rotation;
                
                // Wrap around screen
                if (asteroid.x < -asteroid.radius) asteroid.x = canvas.width + asteroid.radius;
                if (asteroid.x > canvas.width + asteroid.radius) asteroid.x = -asteroid.radius;
                if (asteroid.y < -asteroid.radius) asteroid.y = canvas.height + asteroid.radius;
                if (asteroid.y > canvas.height + asteroid.radius) asteroid.y = -asteroid.radius;
                
                // Check collision with ship
                if (ship.explodeTime === 0) {
                    const dist = distance(ship.x, ship.y, asteroid.x, asteroid.y);
                    if (dist < ship.radius + asteroid.radius) {
                        ship.explodeTime = 60;
                        break;
                    }
                }
            }
        }

        // Fire bullet
        function fireBullet() {
            if (ship.explodeTime > 0) return;
            
            const speed = 7;
            bullets.push({
                x: ship.x + Math.cos(ship.angle) * ship.radius,
                y: ship.y + Math.sin(ship.angle) * ship.radius,
                vx: Math.cos(ship.angle) * speed + ship.thrust.x,
                vy: Math.sin(ship.angle) * speed + ship.thrust.y
            });
        }

        // Game loop
        function gameLoop() {
            if (gameOver) return;
            
            // Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update game objects
            updateShip();
            updateBullets();
            updateAsteroids();
            
            // Draw game objects
            asteroids.forEach(drawAsteroid);
            bullets.forEach(drawBullet);
            drawShip();
            
            // Check win condition
            if (asteroids.length === 0) {
                initAsteroids();
            }
            
            // Check game over
            if (ship.explodeTime > 0 && ship.explodeTime < 30) {
                gameOver = true;
                gameOverElement.style.display = 'block';
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' && !gameOver) {
                fireBullet();
                e.preventDefault();
            }
            if (e.key === 'r' && gameOver) {
                init();
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.key] = false;
        });

        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
