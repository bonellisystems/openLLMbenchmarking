<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas {
border: 2px solid #333;
border-radius: 4px;
box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 600;

// Game state
let state = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Paddle
const paddle = {
    width: 120,
    height: 16,
    x: 0,
    y: canvas.height - 40,
    speed: 8,
    color: '#00bfff',
    targetX: 0,
    growing: false,
    growTimer: 0
};
paddle.x = (canvas.width - paddle.width) / 2;
paddle.targetX = paddle.x;

// Ball
const ball = {
    x: canvas.width / 2,
    y: paddle.y - 10,
    radius: 8,
    dx: 4,
    dy: -4,
    speed: 5,
    attached: true,
    trail: []
};

// Bricks
let bricks = [];
const brickRows = 7;
const brickCols = 12;
const brickWidth = 58;
const brickHeight = 22;
const brickPadding = 6;
const brickOffsetTop = 60;
const brickOffsetLeft = (canvas.width - (brickCols * (brickWidth + brickPadding) - brickPadding)) / 2;

const brickColors = [
    ['#ff4444', '#ff6666'],
    ['#ff8844', '#ffaa66'],
    ['#ffcc00', '#ffdd44'],
    ['#44cc44', '#66dd66'],
    ['#4488ff', '#66aaff'],
    ['#8844ff', '#aa66ff'],
    ['#ff44aa', '#ff66cc']
];

function createBricks() {
    bricks = [];
    for (let r = 0; r < brickRows; r++) {
        for (let c = 0; c < brickCols; c++) {
            let hp = 1;
            if (level >= 2 && r < 2) hp = 2;
            if (level >= 3 && r < 1) hp = 3;
            bricks.push({
                x: brickOffsetLeft + c * (brickWidth + brickPadding),
                y: brickOffsetTop + r * (brickHeight + brickPadding),
                width: brickWidth,
                height: brickHeight,
                color: brickColors[r][0],
                highlight: brickColors[r][1],
                alive: true,
                hp: hp,
                maxHp: hp,
                row: r
            });
        }
    }
}

// Power-ups
let powerups = [];
const powerupTypes = [
    { type: 'wide', color: '#00ff88', symbol: 'W', desc: 'Wide Paddle' },
    { type: 'multi', color: '#ff8800', symbol: 'M', desc: 'Multi Ball' },
    { type: 'slow', color: '#88ccff', symbol: 'S', desc: 'Slow Ball' },
    { type: 'life', color: '#ff4488', symbol: '+', desc: 'Extra Life' }
];

let extraBalls = [];

// Particles
let particles = [];

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            dx: (Math.random() - 0.5) * 6,
            dy: (Math.random() - 0.5) * 6,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

// Input
const keys = {};
document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    } else if ((state === 'gameover' || state === 'win') && (e.code === 'Space' || e.code === 'Enter')) {
        resetGame();
    }
    e.preventDefault();
});
document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
});

function startGame() {
    state = 'playing';
    ball.attached = false;
    ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
    ball.dy = -ball.speed;
}

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    combo = 0;
    paddle.width = 120;
    paddle.growing = false;
    extraBalls = [];
    powerups = [];
    particles = [];
    createBricks();
    resetBall();
    state = 'playing';
    ball.attached = false;
    ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
    ball.dy = -ball.speed;
}

function resetBall() {
    ball.x = paddle.x + paddle.width / 2;
    ball.y = paddle.y - ball.radius;
    ball.dx = 0;
    ball.dy = 0;
    ball.attached = true;
    ball.speed = 5;
    extraBalls = [];
}

function launchBall() {
    ball.attached = false;
    ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
    ball.dy = -ball.speed;
}

// Collision detection
function rectCollision(bx, by, br, rx, ry, rw, rh) {
    let closestX = Math.max(rx, Math.min(bx, rx + rw));
    let closestY = Math.max(ry, Math.min(by, ry + rh));
    let dx = bx - closestX;
    let dy = by - closestY;
    return (dx * dx + dy * dy) < (br * br);
}

function update() {
    if (state !== 'playing') return;

    // Paddle movement
    if (keys['ArrowLeft'] || keys['KeyA']) {
        paddle.targetX -= paddle.speed;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        paddle.targetX += paddle.speed;
    }
    paddle.targetX = Math.max(0, Math.min(canvas.width - paddle.width, paddle.targetX));
    paddle.x += (paddle.targetX - paddle.x) * 0.3;

    // Paddle grow timer
    if (paddle.growing) {
        paddle.growTimer--;
        if (paddle.growTimer <= 0) {
            paddle.width = 120;
            paddle.growing = false;
        }
    }

    // Ball attached to paddle
    if (ball.attached) {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius;
        if (keys['Space'] || keys['ArrowUp']) {
            launchBall();
        }
    } else {
        // Ball trail
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 8) ball.trail.shift();

        // Move ball
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Wall collisions
        if (ball.x - ball.radius <= 0) {
            ball.x = ball.radius;
            ball.dx = Math.abs(ball.dx);
        }
        if (ball.x + ball.radius >= canvas.width) {
            ball.x = canvas.width - ball.radius;
            ball.dx = -Math.abs(ball.dx);
        }
        if (ball.y - ball.radius <= 0) {
            ball.y = ball.radius;
            ball.dy = Math.abs(ball.dy);
        }

        // Bottom - lose life
        if (ball.y + ball.radius > canvas.height) {
            loseLife();
        }

        // Paddle collision
        if (rectCollision(ball.x, ball.y, ball.radius, paddle.x, paddle.y, paddle.width, paddle.height) && ball.dy > 0) {
            let hitPos = (ball.x - paddle.x) / paddle.width;
            let angle = (hitPos - 0.5) * Math.PI * 0.7;
            ball.speed = Math.min(ball.speed + 0.05, 9);
            ball.dx = Math.sin(angle) * ball.speed;
            ball.dy = -Math.cos(angle) * ball.speed;
            ball.y = paddle.y - ball.radius;
            combo = 0;
            spawnParticles(ball.x, ball.y, '#00bfff', 5);
        }

        // Brick collision
        for (let brick of bricks) {
            if (!brick.alive) continue;
            if (rectCollision(ball.x, ball.y, ball.radius, brick.x, brick.y, brick.width, brick.height)) {
                brick.hp--;
                if (brick.hp <= 0) {
                    brick.alive = false;
                    combo++;
                    score += 10 * combo;
                    spawnParticles(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color, 12);
                    shakeTimer = 5;
                    shakeIntensity = 3;

                    // Chance to drop powerup
                    if (Math.random() < 0.12) {
                        let type = powerupTypes[Math.floor(Math.random() * powerupTypes.length)];
                        powerups.push({
                            x: brick.x + brick.width / 2,
                            y: brick.y + brick.height / 2,
                            dy: 2,
                            ...type,
                            width: 24,
                            height: 24
                        });
                    }
                } else {
                    spawnParticles(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color, 5);
                    shakeTimer = 3;
                    shakeIntensity = 2;
                }

                // Determine bounce direction
                let ballCenterX = ball.x;
                let ballCenterY = ball.y;
                let brickCenterX = brick.x + brick.width / 2;
                let brickCenterY = brick.y + brick.height / 2;

                let overlapX = (brick.width / 2 + ball.radius) - Math.abs(ballCenterX - brickCenterX);
                let overlapY = (brick.height / 2 + ball.radius) - Math.abs(ballCenterY - brickCenterY);

                if (overlapX < overlapY) {
                    ball.dx = -ball.dx;
                } else {
                    ball.dy = -ball.dy;
                }
                break;
            }
        }

        // Check win
        if (bricks.every(b => !b.alive)) {
            if (level < 3) {
                level++;
                createBricks();
                resetBall();
                ball.speed = 5 + level * 0.5;
            } else {
                state = 'win';
            }
        }
    }

    // Extra balls
    for (let i = extraBalls.length - 1; i >= 0; i--) {
        let eb = extraBalls[i];
        eb.x += eb.dx;
        eb.y += eb.dy;

        if (eb.x - eb.radius <= 0) { eb.x = eb.radius; eb.dx = Math.abs(eb.dx); }
        if (eb.x + eb.radius >= canvas.width) { eb.x = canvas.width - eb.radius; eb.dx = -Math.abs(eb.dx); }
        if (eb.y - eb.radius <= 0) { eb.y = eb.radius; eb.dy = Math.abs(eb.dy); }
        if (eb.y + eb.radius > canvas.height) { extraBalls.splice(i, 1); continue; }

        if (rectCollision(eb.x, eb.y, eb.radius, paddle.x, paddle.y, paddle.width, paddle.height) && eb.dy > 0) {
            let hitPos = (eb.x - paddle.x) / paddle.width;
            let angle = (hitPos - 0.5) * Math.PI * 0.7;
            eb.dx = Math.sin(angle) * eb.speed;
            eb.dy = -Math.cos(angle) * eb.speed;
            eb.y = paddle.y - eb.radius;
        }

        for (let brick of bricks) {
            if (!brick.alive) continue;
            if (rectCollision(eb.x, eb.y, eb.radius, brick.x, brick.y, brick.width, brick.height)) {
                brick.hp--;
                if (brick.hp <= 0) {
                    brick.alive = false;
                    score += 10;
                    spawnParticles(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color, 12);
                }
                let overlapX = (brick.width / 2 + eb.radius) - Math.abs(eb.x - (brick.x + brick.width / 2));
                let overlapY = (brick.height / 2 + eb.radius) - Math.abs(eb.y - (brick.y + brick.height / 2));
                if (overlapX < overlapY) eb.dx = -eb.dx;
                else eb.dy = -eb.dy;
                break;
            }
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += p.dy;
        if (p.y > canvas.height) { powerups.splice(i, 1); continue; }

        if (p.y + p.height / 2 >= paddle.y && p.y - p.height / 2 <= paddle.y + paddle.height &&
            p.x >= paddle.x && p.x <= paddle.x + paddle.width) {
            applyPowerup(p);
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake
    if (shakeTimer > 0) shakeTimer--;
}

function applyPowerup(p) {
    spawnParticles(p.x, p.y, p.color, 15);
    switch (p.type) {
        case 'wide':
            paddle.width = 180;
            paddle.growing = true;
            paddle.growTimer = 600;
            break;
        case 'multi':
            for (let i = 0; i < 2; i++) {
                extraBalls.push({
                    x: ball.x, y: ball.y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: -Math.abs(ball.speed) * (0.8 + Math.random() * 0.4),
                    radius: ball.radius,
                    speed: ball.speed
                });
            }
            break;
        case 'slow':
            ball.speed = Math.max(3, ball.speed - 1.5);
            let mag = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            if (mag > 0) {
                ball.dx = (ball.dx / mag) * ball.speed;
                ball.dy = (ball.dy / mag) * ball.speed;
            }
            break;
        case 'life':
            lives = Math.min(lives + 1, 5);
            break;
    }
}

function loseLife() {
    lives--;
    combo = 0;
    spawnParticles(ball.x, ball.y, '#ff4444', 20);
    shakeTimer = 10;
    shakeIntensity = 6;
    if (lives <= 0) {
        state = 'gameover';
    } else {
        resetBall();
    }
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        let sx = (Math.random() - 0.5) * shakeIntensity;
        let sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }

    // Background
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    // Bricks
    for (let brick of bricks) {
        if (!brick.alive) continue;
        let alpha = brick.hp / brick.maxHp;
        ctx.globalAlpha = 0.5 + alpha * 0.5;

        // Brick body
        let bGrad = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.height);
        bGrad.addColorStop(0, brick.highlight);
        bGrad.addColorStop(1, brick.color);
        ctx.fillStyle = bGrad;
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);

        // Brick border
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);

        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height / 3);

        // HP indicator for multi-hit bricks
        if (brick.maxHp > 1) {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(brick.hp, brick.x + brick.width / 2, brick.y + brick.height / 2);
        }
        ctx.globalAlpha = 1;
    }

    // Powerups
    for (let p of powerups) {
        ctx.save();
        ctx.translate(p.x, p.y);

        // Glow
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;

        // Body
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.width / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;

        // Symbol
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.symbol, 0, 0);

        ctx.restore();
    }

    // Ball trail
    if (!ball.attached) {
        for (let i = 0; i < ball.trail.length; i++) {
            let t = ball.trail[i];
            let alpha = (i / ball.trail.length) * 0.4;
            let size = (i / ball.trail.length) * ball.radius;
            ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Ball
    if (state === 'playing' || state === 'start') {
        ctx.save();
        ctx.shadowColor = '#00bfff';
        ctx.shadowBlur = 15;

        let ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.radius);
        ballGrad.addColorStop(0, '#ffffff');
        ballGrad.addColorStop(0.5, '#aaddff');
        ballGrad.addColorStop(1, '#0088ff');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Extra balls
    for (let eb of extraBalls) {
        ctx.save();
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffaa44';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Paddle
    ctx.save();
    ctx.shadowColor = paddle.color;
    ctx.shadowBlur = 12;

    let pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
    pGrad.addColorStop(0, '#66ddff');
    pGrad.addColorStop(0.5, '#00bfff');
    pGrad.addColorStop(1, '#006699');
    ctx.fillStyle = pGrad;

    // Rounded paddle
    let pr = paddle.height / 2;
    ctx.beginPath();
    ctx.moveTo(paddle.x + pr, paddle.y);
    ctx.lineTo(paddle.x + paddle.width - pr, paddle.y);
    ctx.arc(paddle.x + paddle.width - pr, paddle.y + pr, pr, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(paddle.x + pr, paddle.y + paddle.height);
    ctx.arc(paddle.x + pr, paddle.y + pr, pr, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();

    // Paddle shine
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(paddle.x + 4, paddle.y + 2, paddle.width - 8, paddle.height / 3);
    ctx.restore();

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 15, 28);

    ctx.textAlign = 'center';
    ctx.fillText(`Level ${level}`, canvas.width / 2, 28);

    // Lives
    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4466';
        ctx.beginPath();
        let lx = canvas.width - 20 - i * 28;
        let ly = 24;
        ctx.arc(lx, ly, 8, 0, Math.PI * 2);
        ctx.fill();
    }

    // Combo display
    if (combo > 2 && state === 'playing') {
        ctx.fillStyle = `rgba(255, 255, 100, ${Math.min(1, combo * 0.2)})`;
        ctx.font = `bold ${16 + combo}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(`${combo}x COMBO!`, canvas.width / 2, canvas.height / 2 + 60);
    }

    // Overlays
    if (state === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00bfff';
        ctx.font = 'bold 52px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ARKANOID', canvas.width / 2, canvas.height / 2 - 60);

        ctx.fillStyle = '#fff';
        ctx.font = '22px sans-serif';
        ctx.fillText('Press SPACE or ENTER to start', canvas.width / 2, canvas.height / 2 + 10);

        ctx.fillStyle = '#aaa';
        ctx.font = '16px sans-serif';
        ctx.fillText('← → or A D to move paddle', canvas.width / 2, canvas.height / 2 + 50);
        ctx.fillText('SPACE to launch ball', canvas.width / 2, canvas.height / 2 + 75);
    }

    if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = '#fff';
        ctx.font = '24px sans-serif';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

        ctx.fillStyle = '#aaa';
        ctx.font = '18px sans-serif';
        ctx.fillText('Press SPACE or ENTER to restart', canvas.width / 2, canvas.height / 2 + 50);
    }

    if (state === 'win') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#44ff44';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = '#fff';
        ctx.font = '24px sans-serif';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

        ctx.fillStyle = '#aaa';
        ctx.font = '18px sans-serif';
        ctx.fillText('Press SPACE or ENTER to play again', canvas.width / 2, canvas.height / 2 + 50);
    }

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

createBricks();
gameLoop();
</script>
</body>
</html>
