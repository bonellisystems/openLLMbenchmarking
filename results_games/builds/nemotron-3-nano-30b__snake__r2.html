<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; }
  canvas { background:#222; display:block; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const tile = 20;
  const cols = canvas.width / tile;
  const rows = canvas.height / tile;
  let snake = [{x: 5, y: 5}];
  let dx = 1, dy = 0;
  let food = {x: 3, y: 2};
  let score = 0;
  let gameOver = false;

  function drawRect(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * tile, y * tile, tile, tile);
  }

  function draw() {
    if (gameOver) {
      ctx.fillStyle = 'white';
      ctx.font = '30px Arial';
      ctx.fillText('Game Over', canvas.width/2 - 80, canvas.height/2);
      ctx.fillText('Score: ' + score, canvas.width/2 - 45, canvas.height/2 + 30);
      return;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRect(food.x, food.y, 'red');
    snake.forEach(segment => drawRect(segment.x, segment.y, 'lime'));
    // move snake
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    // wrap around
    head.x = (head.x + cols) % cols;
    head.y = (head.y + rows) % rows;
    // check self collision
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      gameOver = true;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      food = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    } else {
      snake.pop();
    }
    requestAnimationFrame(draw);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; }
    else if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; }
    else if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; }
    else if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; }
  });

  // start
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
