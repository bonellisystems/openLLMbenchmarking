<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;color:#fff;font-family:sans-serif;}
  canvas{background:#222;border:2px solid #555;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const COLS = 10, ROWS = 20, BLOCK = 30;
  canvas.width = COLS * BLOCK;
  canvas.height = ROWS * BLOCK;

  const board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  const colors = [null, 'cyan','yellow','magenta','blue','orange','green','red'];

  const pieces = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };
  const shapes = Object.keys(pieces);
  let cur = {type: shapes[0], rot: 0, x: 3, y: -1, color: 1};

  function drawSquare(x,y,color){
    ctx.fillStyle = colors[color];
    ctx.fillRect(x*BLOCK, y*BLOCK, BLOCK, BLOCK);
    ctx.strokeStyle = '#111';
    ctx.strokeRect(x*BLOCK, y*BLOCK, BLOCK, BLOCK);
  }

  function drawBoard(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(board[y][x]) drawSquare(x,y,board[y][x]);
      }
    }
  }

  function drawPiece(piece,x,y){
    piece.forEach((row,dy)=> {
      row.forEach((val,dx)=> {
        if(val && board[y+dy]!=null){
          drawSquare(x+dx, y+dy, piece.color);
        }
      });
    });
  }

  function collision(piece,x,y){
    return piece.some((row,dy)=> {
      return row.some((val,dx)=> {
        if(!val) return false;
        const nx = x+dx, ny = y+dy;
        return nx<0||nx>=COLS||ny<0||ny>=ROWS||board[ny][nx];
      });
    });
  }

  function merge(piece,x,y){
    piece.forEach((row,dy)=> {
      row.forEach((val,dx)=> {
        if(val) board[y+dy][x+dx] = piece.color;
      });
    });
  }

  function rotate(){
    const newRot = (cur.rot + 1) % shapes[cur.type].length;
    const newPiece = cur.type;
    const test = {type: newPiece, rot: newRot, x: cur.x, y: cur.y, color: cur.color};
    if(!collision(test, cur.x, cur.y)) cur.rot = newRot;
  }

  function hardDrop(){
    while(!collision(cur, cur.x, cur.y+1)){
      cur.y++;
    }
    merge(cur, cur.x, cur.y);
    clearLines();
    spawn();
  }

  function clearLines(){
    let lines = 0;
    for(let y=board.length-1; y>=0; y--){
      if(board[y].every(v=>v)){
        board.splice(y,1);
        board.unshift(Array(COLS).fill(0));
        lines++;
        y++;
      }
    }
    if(lines){
      score += lines*100;
      document.getElementById('score').textContent = score;
    }
  }

  function spawn(){
    cur.type = shapes[Math.floor(Math.random()*shapes.length)];
    cur.rot = 0;
    cur.x = Math.floor(COLS/2)-2;
    cur.y = -1;
    cur.color = Math.floor(Math.random()*7)+1;
    if(collision(cur, cur.x, cur.y)) gameOver();
  }

  let score = 0;
  const scoreEl = document.createElement('div');
  scoreEl.id = 'score';
  scoreEl.style.position='absolute';
  scoreEl.style.top='10px';
  scoreEl.style.left='50%';
  scoreEl.style.transform='translateX(-50%)';
  scoreEl.style.fontSize='24px';
  scoreEl.textContent = score;
  document.body.appendChild(scoreEl);

  function gameOver(){
    ctx.fillStyle = '#000';
    ctx.font = '30px sans-serif';
    ctx.fillText('Game Over', canvas.width/2-80, canvas.height/2);
    cancelAnimationFrame(drop);
  }

  let dropCounter = 0;
  let dropInterval = 1000;
  let lastTime = 0;
  function drop(time=0){
    const delta = time - lastTime;
    lastTime = time;
    dropCounter += delta;
    if(dropCounter > dropInterval){
      cur.y++;
      if(collision(cur, cur.x, cur.y)){
        merge(cur, cur.x, cur.y-1);
        clearLines();
        spawn();
      }
      dropCounter = 0;
    }
    drawBoard();
    drawPiece(cur, cur.x, cur.y);
    requestAnimationFrame(drop);
  }
  requestAnimationFrame(drop);

  document.addEventListener('keydown', e=>{
    switch(e.key){
      case 'ArrowLeft': if(!collision(cur, cur.x-1, cur.y)) cur.x--; break;
      case 'ArrowRight': if(!collision(cur, cur.x+1, cur.y)) cur.x++; break;
      case 'ArrowDown': if(!collision(cur, cur.x, cur.y+1)) cur.y++; break;
      case 'ArrowUp': rotate(); break;
      case ' ': hardDrop(); break;
    }
  });
})();
</script>
</body>
</html>
