<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tiny Roguelike</title>
<style>
  body { font-family: monospace; background: #000; color: #fff; }
  #game { font-size: 14px; line-height: 1.2; }
</style>
</head>
<body>
<div id="game"></div>
<script>
(() => {
  const WIDTH = 40;
  const HEIGHT = 20;
  const DEPTH = 5;
  const FOV = 8;
  const CHAR_PLAYER = '@';
  const CHAR_EMPTY = '.';
  const CHAR_WALL = '#';
  const CHAR_MONSTER = 'M';

  const gameDiv = document.getElementById('game');
  let dungeon = [];
  let player = { x: 0, y: 0, z: 0 };
  let monsters = [];

  function init() {
    generateDungeon();
    render();
    document.addEventListener('keydown', handleKey);
  }

  function generateDungeon() {
    for (let z = 0; z < DEPTH; z++) {
      dungeon[z] = [];
      for (let y = 0; y < HEIGHT; y++) {
        dungeon[z][y] = [];
        for (let x = 0; x < WIDTH; x++) {
          dungeon[z][y][x] = Math.random() < 0.3 ? CHAR_WALL : CHAR_EMPTY;
        }
      }
      carveRooms(dungeon[z]);
      placeStairs(dungeon[z], z);
    }
    player.z = 0;
    placePlayer();
  }

  function carveRooms(level) {
    const rooms = 5;
    for (let i = 0; i < rooms; i++) {
      const w = 5 + Math.floor(Math.random() * 5);
      const h = 5 + Math.floor(Math.random() * 5);
      const x = Math.floor(Math.random() * (WIDTH - w));
      const y = Math.floor(Math.random() * (HEIGHT - h));
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          level[yy][xx] = CHAR_EMPTY;
        }
      }
    }
  }

  function placeStairs(level, z) {
    if (z === 0) {
      level[Math.floor(HEIGHT / 2)][Math.floor(WIDTH / 2)] = '>';
    } else if (z === DEPTH - 1) {
      level[Math.floor(HEIGHT / 2)][Math.floor(WIDTH / 2)] = '<';
    }
  }

  function placePlayer() {
    dungeon[player.z][player.y][player.x] = CHAR_PLAYER;
  }

  function placeMonsters() {
    monsters = [];
    const count = 10;
    for (let i = 0; i < count; i++) {
      const monster = {
        x: Math.floor(Math.random() * WIDTH),
        y: Math.floor(Math.random() * HEIGHT),
        z: player.z
      };
      while (dungeon[monster.z][monster.y][monster.x] !== CHAR_EMPTY) {
        monster.x = Math.floor(Math.random() * WIDTH);
        monster.y = Math.floor(Math.random() * HEIGHT);
      }
      dungeon[monster.z][monster.y][monster.x] = CHAR_MONSTER;
      monsters.push(monster);
    }
  }

  function render() {
    let output = '';
    const level = dungeon[player.z];
    for (let y = Math.max(0, player.y - FOV); y < Math.min(HEIGHT, player.y + FOV + 1); y++) {
      for (let x = Math.max(0, player.x - FOV); x < Math.min(WIDTH, player.x + FOV + 1); x++) {
        output += level[y][x] || CHAR_EMPTY;
      }
      output += '\n';
    }
    gameDiv.textContent = output;
  }

  function handleKey(e) {
    let moved = false;
    switch (e.key) {
      case 'w': case 'ArrowUp':    move(player, 0, -1); moved = true; break;
      case 's': case 'ArrowDown':  move(player, 0, 1);  moved = true; break;
      case 'a': case 'ArrowLeft':  move(player, -1, 0); moved = true; break;
      case 'd': case 'ArrowRight': move(player, 1, 0);  moved = true; break;
      case '>': descend(); moved = true; break;
      case '<': ascend();  moved = true; break;
    }
    if (moved) {
      render();
      checkForMonsters();
    }
  }

  function move(entity, dx, dy) {
    const newX = entity.x + dx;
    const newY = entity.y + dy;
    if (newX >= 0 && newX < WIDTH && newY >= 0 && newY < HEIGHT) {
      const level = dungeon[entity.z];
      if (level[newY][newX] === CHAR_EMPTY || level[newY][newX] === '>' || level[newY][newX] === '<') {
        dungeon[entity.z][entity.y][entity.x] = CHAR_EMPTY;
        entity.x = newX;
        entity.y = newY;
        placePlayer();
        if (level[newY][newX] === '>') {
          ascend();
        } else if (level[newY][newX] === '<') {
          descend();
        }
      }
    }
  }

  function ascend() {
    if (player.z > 0) {
      player.z--;
      placePlayer();
      placeMonsters();
      render();
    }
  }

  function descend() {
    if (player.z < DEPTH - 1) {
      player.z++;
      placePlayer();
      placeMonsters();
      render();
    }
  }

  function checkForMonsters() {
    for (const monster of monsters) {
      if (monster.x === player.x && monster.y === player.y) {
        alert('Game Over! You encountered a monster.');
        init();
        return;
      }
    }
  }

  init();
})();
</script>
</body>
</html>
