<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB, #98D8E8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        #gameOver h2 {
            margin-top: 0;
            font-size: 36px;
        }
        
        #gameOver p {
            font-size: 20px;
            margin: 10px 0;
        }
        
        #restartBtn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        #restartBtn:hover {
            background: #45a049;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="score">Score: 0</div>
        <div id="gameOver">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
        <div id="instructions">Use ← → or A D to move</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');
        const instructionsElement = document.getElementById('instructions');

        // Game variables
        let gameRunning = true;
        let score = 0;
        let camera = { y: 0 };
        let keys = {};

        // Player object
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 30,
            height: 30,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: 15,
            gravity: 0.5,
            color: '#FF6B6B'
        };

        // Platforms array
        let platforms = [];

        // Platform types
        const platformTypes = [
            { width: 80, height: 15, color: '#4ECDC4' },
            { width: 60, height: 15, color: '#45B7D1' },
            { width: 100, height: 15, color: '#96CEB4' },
            { width: 70, height: 15, color: '#FECA57' }
        ];

        // Initialize platforms
        function initPlatforms() {
            platforms = [];
            // Starting platform
            platforms.push({
                x: canvas.width / 2 - 50,
                y: canvas.height - 50,
                width: 100,
                height: 15,
                color: '#4ECDC4'
            });
            
            // Generate initial platforms
            for (let i = 1; i < 15; i++) {
                generatePlatform(canvas.height - 50 - i * 80);
            }
        }

        // Generate new platform
        function generatePlatform(y) {
            const type = platformTypes[Math.floor(Math.random() * platformTypes.length)];
            const platform = {
                x: Math.random() * (canvas.width - type.width),
                y: y,
                width: type.width,
                height: type.height,
                color: type.color
            };
            platforms.push(platform);
        }

        // Update game
        function update() {
            if (!gameRunning) return;

            // Handle input
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.velocityX = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.velocityX = player.speed;
            } else {
                player.velocityX *= 0.8; // Friction
            }

            // Apply gravity
            player.velocityY += player.gravity;

            // Update position
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Keep player in bounds horizontally
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Check platform collisions
            let onPlatform = false;
            for (let platform of platforms) {
                if (player.velocityY > 0 && 
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height < platform.y + platform.height &&
                    player.y + player.height + player.velocityY > platform.y) {
                    
                    player.y = platform.y - player.height;
                    player.velocityY = -player.jumpPower;
                    onPlatform = true;
                    
                    // Add score when jumping on new platforms
                    if (platform.y < camera.y + canvas.height - 100) {
                        score += 10;
                        scoreElement.textContent = 'Score: ' + score;
                    }
                }
            }

            // Update camera
            if (player.y < camera.y + 200) {
                camera.y = player.y - 200;
            }

            // Generate new platforms
            const highestPlatform = Math.min(...platforms.map(p => p.y));
            if (highestPlatform > camera.y - 200) {
                for (let i = 0; i < 5; i++) {
                    generatePlatform(highestPlatform - (i + 1) * 80);
                }
            }

            // Remove old platforms
            platforms = platforms.filter(platform => 
                platform.y < camera.y + canvas.height + 100
            );

            // Check game over
            if (player.y > camera.y + canvas.height) {
                gameOver();
            }
        }

        // Render game
        function render() {
            // Clear canvas
            ctx.fillStyle = 'linear-gradient(to bottom, #87CEEB, #E0F6FF)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw clouds
            drawClouds();

            // Save context for camera transform
            ctx.save();
            ctx.translate(0, -camera.y);

            // Draw platforms
            for (let platform of platforms) {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Add platform highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(platform.x, platform.y, platform.width, 3);
            }

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Add player face
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 5, 5, 5);
            ctx.fillRect(player.x + 20, player.y + 5, 5, 5);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 6, player.y + 6, 3, 3);
            ctx.fillRect(player.x + 21, player.y + 6, 3, 3);
            
            // Restore context
            ctx.restore();
        }

        // Draw clouds
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            
            // Static clouds for visual effect
            const cloudPositions = [
                { x: 50, y: 100 },
                { x: 250, y: 200 },
                { x: 150, y: 350 },
                { x: 320, y: 450 }
            ];
            
            for (let cloud of cloudPositions) {
                // Adjust cloud position based on camera
                const adjustedY = cloud.y - (camera.y * 0.3);
                if (adjustedY > -50 && adjustedY < canvas.height + 50) {
                    drawCloud(cloud.x, adjustedY);
                }
            }
        }

        // Draw individual cloud
        function drawCloud(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 25, y, 25, 0, Math.PI * 2);
            ctx.arc(x + 50, y, 20, 0, Math.PI * 2);
            ctx.arc(x + 15, y - 15, 18, 0, Math.PI * 2);
            ctx.arc(x + 35, y - 15, 18, 0, Math.PI * 2);
            ctx.fill();
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
            instructionsElement.style.display = 'none';
        }

        // Restart game
        function restart() {
            gameRunning = true;
            score = 0;
            camera.y = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.velocityX = 0;
            player.velocityY = 0;
            scoreElement.textContent = 'Score: 0';
            gameOverElement.style.display = 'none';
            instructionsElement.style.display = 'block';
            initPlatforms();
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        restartBtn.addEventListener('click', restart);

        // Initialize and start game
        initPlatforms();
        gameLoop();
    </script>
</body>
</html>
