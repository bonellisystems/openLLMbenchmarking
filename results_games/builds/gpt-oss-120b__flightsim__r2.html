<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Flight Simulator</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) { alert('WebGL not supported'); return; }

    // Resize canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0,0,canvas.width,canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    // Shaders
    const vsSource = `
    attribute vec3 aPosition;
    attribute vec3 aColor;
    uniform mat4 uMVP;
    varying vec3 vColor;
    void main(void){
        gl_Position = uMVP * vec4(aPosition,1.0);
        vColor = aColor;
    }`;
    const fsSource = `
    precision mediump float;
    varying vec3 vColor;
    void main(void){
        gl_FragColor = vec4(vColor,1.0);
    }`;

    function compileShader(src, type){
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
            console.error('Shader compile error:', gl.getShaderInfoLog(sh));
        }
        return sh;
    }
    const vertexShader = compileShader(vsSource, gl.VERTEX_SHADER);
    const fragmentShader = compileShader(fsSource, gl.FRAGMENT_SHADER);
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)){
        console.error('Program link error:', gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);
    const aPos = gl.getAttribLocation(program, 'aPosition');
    const aCol = gl.getAttribLocation(program, 'aColor');
    const uMVP = gl.getUniformLocation(program, 'uMVP');

    // Matrix utilities
    const mat4 = {
        create:()=>new Float32Array(16),
        identity:(out)=>{for(let i=0;i<16;i++)out[i]=i%5?0:1;return out;},
        perspective:(out,fovy,aspect,near,far)=>{
            const f=1.0/Math.tan(fovy/2), nf=1/(near-far);
            out[0]=f/aspect;out[1]=0;out[2]=0;out[3]=0;
            out[4]=0;out[5]=f;out[6]=0;out[7]=0;
            out[8]=0;out[9]=0;out[10]=(far+near)*nf;out[11]=-1;
            out[12]=0;out[13]=0;out[14]=(2*far*near)*nf;out[15]=0;
            return out;
        },
        lookAt:(out,eye,center,up)=>{
            const x0=eye[0],x1=eye[1],x2=eye[2];
            const z0=center[0]-x0, z1=center[1]-x1, z2=center[2]-x2;
            let len=Math.hypot(z0,z1,z2);
            if(len===0){z2=1}
            else{z0/=len;z1/=len;z2/=len}
            let x0u=up[1]*z2-up[2]*z1;
            let x1u=up[2]*z0-up[0]*z2;
            let x2u=up[0]*z1-up[1]*z0;
            len=Math.hypot(x0u,x1u,x2u);
            if(len===0){x0u=0;x1u=0;x2u=0}
            else{x0u/=len;x1u/=len;x2u/=len}
            const y0=z1*x2u-z2*x1u;
            const y1=z2*x0u-z0*x2u;
            const y2=z0*x1u-z1*x0u;
            out[0]=x0u;out[1]=y0;out[2]=z0;out[3]=0;
            out[4]=x1u;out[5]=y1;out[6]=z1;out[7]=0;
            out[8]=x2u;out[9]=y2;out[10]=z2;out[11]=0;
            out[12]=-(x0u*x0+y0*x1+z0*x2);
            out[13]=-(x1u*x0+y1*x1+z1*x2);
            out[14]=-(x2u*x0+y2*x1+z2*x2);
            out[15]=1;
            return out;
        },
        multiply:(out,a,b)=>{
            const a00=a[0],a01=a[1],a02=a[2],a03=a[3];
            const a10=a[4],a11=a[5],a12=a[6],a13=a[7];
            const a20=a[8],a21=a[9],a22=a[10],a23=a[11];
            const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
            const b00=b[0],b01=b[1],b02=b[2],b03=b[3];
            const b10=b[4],b11=b[5],b12=b[6],b13=b[7];
            const b20=b[8],b21=b[9],b22=b[10],b23=b[11];
            const b30=b[12],b31=b[13],b32=b[14],b33=b[15];
            out[0]=a00*b00+a01*b10+a02*b20+a03*b30;
            out[1]=a00*b01+a01*b11+a02*b21+a03*b31;
            out[2]=a00*b02+a01*b12+a02*b22+a03*b32;
            out[3]=a00*b03+a01*b13+a02*b23+a03*b33;
            out[4]=a10*b00+a11*b10+a12*b20+a13*b30;
            out[5]=a10*b01+a11*b11+a12*b21+a13*b31;
            out[6]=a10*b02+a11*b12+a12*b22+a13*b32;
            out[7]=a10*b03+a11*b13+a12*b23+a13*b33;
            out[8]=a20*b00+a21*b10+a22*b20+a23*b30;
            out[9]=a20*b01+a21*b11+a22*b21+a23*b31;
            out[10]=a20*b02+a21*b12+a22*b22+a23*b32;
            out[11]=a20*b03+a21*b13+a22*b23+a23*b33;
            out[12]=a30*b00+a31*b10+a32*b20+a33*b30;
            out[13]=a30*b01+a31*b11+a32*b21+a33*b31;
            out[14]=a30*b02+a31*b12+a32*b22+a33*b32;
            out[15]=a30*b03+a31*b13+a32*b23+a33*b33;
            return out;
        },
        translate:(out,a,v)=>{
            const x=v[0],y=v[1],z=v[2];
            if (a===out){
                out[12]=a[0]*x+a[4]*y+a[8]*z+a[12];
                out[13]=a[1]*x+a[5]*y+a[9]*z+a[13];
                out[14]=a[2]*x+a[6]*y+a[10]*z+a[14];
                out[15]=a[3]*x+a[7]*y+a[11]*z+a[15];
            }else{
                const a00=a[0],a01=a[1],a02=a[2],a03=a[3];
                const a10=a[4],a11=a[5],a12=a[6],a13=a[7];
                const a20=a[8],a21=a[9],a22=a[10],a23=a[11];
                const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
                out[0]=a00;out[1]=a01;out[2]=a02;out[3]=a03;
                out[4]=a10;out[5]=a11;out[6]=a12;out[7]=a13;
                out[8]=a20;out[9]=a21;out[10]=a22;out[11]=a23;
                out[12]=a00*x+a10*y+a20*z+a30;
                out[13]=a01*x+a11*y+a21*z+a31;
                out[14]=a02*x+a12*y+a22*z+a32;
                out[15]=a03*x+a13*y+a23*z+a33;
            }
            return out;
        },
        rotateY:(out,a,rad)=>{
            const s=Math.sin(rad),c=Math.cos(rad);
            const a00=a[0],a01=a[1],a02=a[2],a03=a[3];
            const a10=a[4],a11=a[5],a12=a[6],a13=a[7];
            const a20=a[8],a21=a[9],a22=a[10],a23=a[11];
            const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
            out[0]=a00*c - a20*s;
            out[1]=a01*c - a21*s;
            out[2]=a02*c - a22*s;
            out[3]=a03*c - a23*s;
            out[8]=a00*s + a20*c;
            out[9]=a01*s + a21*c;
            out[10]=a02*s + a22*c;
            out[11]=a03*s + a23*c;
            out[4]=a10;out[5]=a11;out[6]=a12;out[7]=a13;
            out[12]=a30;out[13]=a31;out[14]=a32;out[15]=a33;
            return out;
        },
        rotateX:(out,a,rad)=>{
            const s=Math.sin(rad),c=Math.cos(rad);
            const a00=a[0],a01=a[1],a02=a[2],a03=a[3];
            const a10=a[4],a11=a[5],a12=a[6],a13=a[7];
            const a20=a[8],a21=a[9],a22=a[10],a23=a[11];
            const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
            out[0]=a00;out[1]=a01;out[2]=a02;out[3]=a03;
            out[4]=a10*c + a20*s;
            out[5]=a11*c + a21*s;
            out[6]=a12*c + a22*s;
            out[7]=a13*c + a23*s;
            out[8]=a20*c - a10*s;
            out[9]=a21*c - a11*s;
            out[10]=a22*c - a12*s;
            out[11]=a23*c - a13*s;
            out[12]=a30;out[13]=a31;out[14]=a32;out[15]=a33;
            return out;
        }
    };

    // Geometry generation
    const positions = [];
    const colors = [];
    const indices = [];
    let vertexCount = 0;

    // Helper to push a box
    function addBox(x, y, z, w, h, d, col){
        const x0=x, x1=x+w;
        const y0=y, y1=y+h;
        const z0=z, z1=z+d;
        const verts = [
            x0,y0,z0, x1,y0,z0, x1,y1,z0, x0,y1,z0,
            x0,y0,z1, x1,y0,z1, x1,y1,z1, x0,y1,z1
        ];
        for(let i=0;i<8;i++){
            positions.push(verts[i*3], verts[i*3+1], verts[i*3+2]);
            colors.push(col[0],col[1],col[2]);
        }
        const faceIdx = [
            [0,1,2,0,2,3],
            [5,4,7,5,7,6],
            [4,0,3,4,3,7],
            [1,5,6,1,6,2],
            [3,2,6,3,6,7],
            [4,5,1,4,1,0]
        ];
        for(const f of faceIdx){
            indices.push(vertexCount+f[0], vertexCount+f[1], vertexCount+f[2]);
        }
        vertexCount+=8;
    }

    // Generate city
    const grid = 20;
    const spacing = 20;
    const half = grid/2;
    for(let i=-half;i<half;i++){
        for(let j=-half;j<half;j++){
            const h = 5 + Math.random()*25;
            const col = [0.5+Math.random()*0.5,0.5+Math.random()*0.5,0.5+Math.random()*0.5];
            addBox(i*spacing,0,j*spacing, spacing*0.8, h, spacing*0.8, col);
        }
    }
    const cityIndexCount = indices.length;

    // Plane geometry (simple pyramid)
    const planePos = [
        0,0.5,0,
        -0.5,0,-0.5,
        0.5,0,-0.5,
        0.5,0,0.5,
        -0.5,0,0.5
    ];
    const planeCol = [
        1,1,1,
        0.8,0.8,0.8,
        0.8,0.8,0.8,
        0.8,0.8,0.8,
        0.8,0.8,0.8
    ];
    const planeIdx = [
        0,1,2,
        0,2,3,
        0,3,4,
        0,4,1,
        1,2,3,
        1,3,4
    ];
    const planeStart = vertexCount;
    for(let i=0;i<5;i++){
        positions.push(planePos[i*3],planePos[i*3+1],planePos[i*3+2]);
        colors.push(planeCol[i*3],planeCol[i*3+1],planeCol[i*3+2]);
    }
    for(const i of planeIdx){
        indices.push(planeStart+i);
    }
    const planeIndexCount = planeIdx.length;

    // Buffers
    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);

    const colBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(aCol);
    gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,0,0);

    const idxBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuffer);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

    gl.enable(gl.DEPTH_TEST);

    // Camera
    const cam = {
        pos:[0,10,0],
        yaw:0,
        pitch:0,
        speed:0.5,
        turnSpeed:0.02
    };
    const keys = {};
    window.addEventListener('keydown',e=>{keys[e.code]=true;});
    window.addEventListener('keyup',e=>{keys[e.code]=false;});

    function updateCamera(){
        // rotation
        if(keys['ArrowLeft']) cam.yaw+=cam.turnSpeed;
        if(keys['ArrowRight']) cam.yaw-=cam.turnSpeed;
        if(keys['ArrowUp']) cam.pitch+=cam.turnSpeed;
        if(keys['ArrowDown']) cam.pitch-=cam.turnSpeed;
        // clamp pitch
        const maxPitch=Math.PI/2-0.01;
        if(cam.pitch>maxPitch) cam.pitch=maxPitch;
        if(cam.pitch<-maxPitch) cam.pitch=-maxPitch;
        // direction vectors
        const cosP=Math.cos(cam.pitch), sinP=Math.sin(cam.pitch);
        const cosY=Math.cos(cam.yaw), sinY=Math.sin(cam.yaw);
        const forward=[sinY*cosP, sinP, cosY*cosP];
        const right=[cosY,0,-sinY];
        const up=[0,1,0];
        if(keys['KeyW']){cam.pos[0]+=forward[0]*cam.speed; cam.pos[1]+=forward[1]*cam.speed; cam.pos[2]+=forward[2]*cam.speed;}
        if(keys['KeyS']){cam.pos[0]-=forward[0]*cam.speed; cam.pos[1]-=forward[1]*cam.speed; cam.pos[2]-=forward[2]*cam.speed;}
        if(keys['KeyA']){cam.pos[0]-=right[0]*cam.speed; cam.pos[2]-=right[2]*cam.speed;}
        if(keys['KeyD']){cam.pos[0]+=right[0]*cam.speed; cam.pos[2]+=right[2]*cam.speed;}
        if(keys['Space']) cam.pos[1]+=cam.speed;
        if(keys['ShiftLeft']||keys['ShiftRight']) cam.pos[1]-=cam.speed;
    }

    const proj = mat4.create();
    mat4.perspective(proj, Math.PI/3, canvas.width/canvas.height, 0.1, 1000);
    const view = mat4.create();
    const model = mat4.create();
    const mvp = mat4.create();

    function render(){
        updateCamera();
        // recompute projection if size changed
        mat4.perspective(proj, Math.PI/3, canvas.width/canvas.height, 0.1, 1000);
        // view matrix
        const eye = cam.pos;
        const cosP=Math.cos(cam.pitch), sinP=Math.sin(cam.pitch);
        const cosY=Math.cos(cam.yaw), sinY=Math.sin(cam.yaw);
        const forward=[sinY*cosP, sinP, cosY*cosP];
        const center=[eye[0]+forward[0], eye[1]+forward[1], eye[2]+forward[2]];
        const up=[0,1,0];
        mat4.lookAt(view, eye, center, up);
        // draw city
        mat4.identity(model);
        mat4.multiply(mvp, proj, view);
        mat4.multiply(mvp, mvp, model);
        gl.uniformMatrix4fv(uMVP,false,mvp);
        gl.clearColor(0.2,0.4,0.6,1);
        gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
        gl.drawElements(gl.TRIANGLES, cityIndexCount, gl.UNSIGNED_SHORT,0);
        // draw plane (relative to camera)
        mat4.identity(model);
        // translate slightly forward so plane is visible
        const planeOffset=2;
        const planePos=[eye[0]+forward[0]*planeOffset, eye[1]+forward[1]*planeOffset, eye[2]+forward[2]*planeOffset];
        mat4.translate(model, model, planePos);
        // rotate to match camera orientation
        mat4.rotateY(model, model, -cam.yaw);
        mat4.rotateX(model, model, -cam.pitch);
        mat4.multiply(mvp, proj, view);
        mat4.multiply(mvp, mvp, model);
        gl.uniformMatrix4fv(uMVP,false,mvp);
        const planeIdxOffset = cityIndexCount*2; // each index is 2 bytes
        gl.drawElements(gl.TRIANGLES, planeIndexCount, gl.UNSIGNED_SHORT, planeIdxOffset);
        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
})();
</script>
</body>
</html>
