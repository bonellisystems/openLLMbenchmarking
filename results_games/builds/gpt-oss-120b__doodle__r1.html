<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doodle Jump</title>
<style>
body{margin:0;background:#222;overflow:hidden;}
canvas{display:block;margin:auto;background:#111;}
#score{position:absolute;top:10px;left:10px;color:#fff;font:20px sans-serif;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">Score: 0</div>
<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const WIDTH = 400;
const HEIGHT = 600;
canvas.width = WIDTH;
canvas.height = HEIGHT;

let score = 0;
const scoreDiv = document.getElementById('score');

const player = {
  x: WIDTH/2 - 15,
  y: HEIGHT - 120,
  w: 30,
  h: 30,
  vx: 0,
  vy: 0,
  speed: 4,
  jumpStrength: 12,
  color: '#ff0'
};

const gravity = 0.4;
const platforms = [];
const PLAT_W = 80;
const PLAT_H = 10;
const PLAT_GAP = 80;

function createPlatform(x, y) {
  platforms.push({x, y, w: PLAT_W, h: PLAT_H, color: '#0f0'});
}

// initial platforms
for(let i=0;i<10;i++){
  createPlatform(Math.random()*(WIDTH-PLAT_W), HEIGHT - i*PLAT_GAP);
}

// input handling
const keys = {};
window.addEventListener('keydown', e=>{keys[e.key]=true;});
window.addEventListener('keyup', e=>{keys[e.key]=false;});

function update() {
  // horizontal movement
  if(keys['ArrowLeft']||keys['a']||keys['A']) player.vx = -player.speed;
  else if(keys['ArrowRight']||keys['d']||keys['D']) player.vx = player.speed;
  else player.vx = 0;
  player.x += player.vx;
  // wrap around
  if(player.x < -player.w) player.x = WIDTH;
  if(player.x > WIDTH) player.x = -player.w;
  
  // vertical physics
  player.vy += gravity;
  player.y += player.vy;
  
  // collision with platforms (only when falling)
  if(player.vy > 0){
    for(let p of platforms){
      if(
        player.x + player.w > p.x &&
        player.x < p.x + p.w &&
        player.y + player.h > p.y &&
        player.y + player.h - player.vy <= p.y
      ){
        player.vy = -player.jumpStrength;
        break;
      }
    }
  }
  
  // scroll when player reaches upper half
  if(player.y < HEIGHT/2){
    const diff = HEIGHT/2 - player.y;
    player.y = HEIGHT/2;
    for(let p of platforms) p.y += diff;
    score += Math.round(diff);
    scoreDiv.textContent = 'Score: '+score;
  }
  
  // remove off‑screen platforms
  while(platforms.length && platforms[0].y > HEIGHT){
    platforms.shift();
  }
  
  // add new platforms at top
  while(platforms.length && platforms[platforms.length-1].y > -PLAT_GAP){
    const lastY = platforms[platforms.length-1].y;
    const newY = lastY - PLAT_GAP;
    const newX = Math.random()*(WIDTH-PLAT_W);
    createPlatform(newX, newY);
  }
  
  // game over
  if(player.y > HEIGHT){
    resetGame();
  }
}

function resetGame(){
  score = 0;
  scoreDiv.textContent = 'Score: 0';
  player.x = WIDTH/2 - 15;
  player.y = HEIGHT - 120;
  player.vx = 0;
  player.vy = 0;
  platforms.length = 0;
  for(let i=0;i<10;i++){
    createPlatform(Math.random()*(WIDTH-PLAT_W), HEIGHT - i*PLAT_GAP);
  }
}

function draw() {
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  // platforms
  for(let p of platforms){
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }
  // player
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.w, player.h);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
</body>
</html>
