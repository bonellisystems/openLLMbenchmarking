<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #70c5ce; font-family: Arial, sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let bird = {
    x: 50,
    y: 150,
    size: 30,
    velocity: 0,
    gravity: 0.8,
    jumpForce: 15,
    score: 0
  };

  let pipes = [];
  let pipeGap = 150;
  let pipeSpeed = 2;
  let pipeFrequency = 2000; // milliseconds

  let lastPipeTime = 0;

  function Pipe(x, height) {
    this.x = x;
    this.height = height;
    this.top = 0;
    this.bottom = 0;
    this.passed = false;
    this.setHeights();
  }

  Pipe.prototype.setHeights = function() {
    this.top = Math.random() * (canvas.height - canvas.height / 4 - pipeGap);
    this.bottom = this.top + canvas.height / 4 + pipeGap;
  };

  function drawBird() {
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
    ctx.fillStyle = 'yellow';
    ctx.fill();
    ctx.closePath();
  }

  function drawPipes(pipe) {
    ctx.fillStyle = 'green';
    ctx.fillRect(pipe.x, 0, 50, pipe.top);
    ctx.fillRect(pipe.x, pipe.bottom, 50, canvas.height);
  }

  function updateBird() {
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;
  }

  function updatePipes() {
    for (let i = 0; i < pipes.length; i++) {
      pipes[i].x -= pipeSpeed;
      if (pipes[i].x + 50 < 0) {
        pipes.splice(i, 1);
        i--;
      } else if (pipes[i].x < bird.x + bird.size && !pipes[i].passed && bird.y < pipes[i].top) {
        pipes[i].passed = true;
        bird.score++;
      }
    }
  }

  function checkCollision() {
    if (bird.y + bird.size > canvas.height || bird.y < 0) {
      return true;
    }
    for (let i = 0; i < pipes.length; i++) {
      if (bird.x + bird.size > pipes[i].x && bird.x - bird.size < pipes[i].x + 50 &&
          (bird.y - bird.size < pipes[i].top || bird.y + bird.size > pipes[i].bottom)) {
        return true;
      }
    }
    return false;
  }

  function spawnPipe() {
    if (canvas.width - pipes[pipes.length - 1].x > 200) {
      let height = Math.random() * (canvas.height - canvas.height / 4 - pipeGap);
      pipes.push(new Pipe(canvas.width, height));
    }
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateBird();
    updatePipes();

    if (canvas.width - pipes[pipes.length - 1].x > 200 && performance.now() - lastPipeTime > pipeFrequency) {
      spawnPipe();
      lastPipeTime = performance.now();
    }

    pipes.forEach(drawPipes);
    drawBird();

    ctx.fillStyle = 'black';
    ctx.font = '24px Arial';
    ctx.fillText('Score: ' + bird.score, 10, 30);

    if (checkCollision()) {
      ctx.fillStyle = 'red';
      ctx.font = '48px Arial';
      ctx.fillText('Game Over', canvas.width / 4, canvas.height / 2);
      cancelAnimationFrame(animationId);
    } else {
      animationId = requestAnimationFrame(gameLoop);
    }
  }

  canvas.addEventListener('click', () => {
    bird.velocity = -bird.jumpForce;
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      bird.velocity = -bird.jumpForce;
    }
  });

  let animationId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
