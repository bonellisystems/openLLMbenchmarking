<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

// Scale canvas to fit screen
function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Game constants
const GRAVITY = 0.45;
const FLAP_FORCE = -7.5;
const PIPE_WIDTH = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_INTERVAL = 1600;
const GROUND_HEIGHT = 80;
const BIRD_SIZE = 20;

// Game state
let bird, pipes, score, bestScore = 0, gameState, groundX, lastPipeTime, frameCount;

function init() {
    bird = { x: 80, y: H / 2 - 50, vy: 0, rotation: 0, flapFrame: 0, alive: true };
    pipes = [];
    score = 0;
    groundX = 0;
    lastPipeTime = 0;
    frameCount = 0;
    gameState = 'ready'; // ready, playing, dead
}

function flap() {
    if (gameState === 'ready') {
        gameState = 'playing';
        bird.vy = FLAP_FORCE;
        bird.flapFrame = 10;
    } else if (gameState === 'playing') {
        bird.vy = FLAP_FORCE;
        bird.flapFrame = 10;
    } else if (gameState === 'dead') {
        init();
    }
}

// Input
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
    }
});
canvas.addEventListener('mousedown', (e) => { e.preventDefault(); flap(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });

function spawnPipe() {
    const minY = 80;
    const maxY = H - GROUND_HEIGHT - PIPE_GAP - 80;
    const topHeight = minY + Math.random() * (maxY - minY);
    pipes.push({
        x: W + 10,
        topHeight: topHeight,
        scored: false
    });
}

function update() {
    frameCount++;

    if (gameState === 'ready') {
        bird.y = H / 2 - 50 + Math.sin(frameCount * 0.08) * 12;
        bird.rotation = 0;
        groundX = (groundX - 1) % 24;
        return;
    }

    if (gameState === 'dead') return;

    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    if (bird.flapFrame > 0) bird.flapFrame--;

    // Bird rotation
    if (bird.vy < 0) {
        bird.rotation = Math.max(-0.5, bird.vy * 0.06);
    } else {
        bird.rotation = Math.min(Math.PI / 2, bird.vy * 0.08);
    }

    // Ground scroll
    groundX = (groundX - PIPE_SPEED) % 24;

    // Pipe spawning
    if (frameCount - lastPipeTime > PIPE_INTERVAL / 16.67 || pipes.length === 0) {
        spawnPipe();
        lastPipeTime = frameCount;
    }

    // Update pipes
    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;

        // Score
        if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
            pipes[i].scored = true;
            score++;
        }

        // Remove off-screen
        if (pipes[i].x + PIPE_WIDTH < -10) {
            pipes.splice(i, 1);
        }
    }

    // Collision detection
    const bx = bird.x;
    const by = bird.y;
    const br = BIRD_SIZE - 2;

    // Ground/ceiling
    if (by + br > H - GROUND_HEIGHT || by - br < 0) {
        die();
        return;
    }

    // Pipes
    for (const pipe of pipes) {
        const px = pipe.x;
        const pw = PIPE_WIDTH;
        const topH = pipe.topHeight;
        const botY = topH + PIPE_GAP;

        if (bx + br > px && bx - br < px + pw) {
            if (by - br < topH || by + br > botY) {
                die();
                return;
            }
        }
    }
}

function die() {
    gameState = 'dead';
    bird.alive = false;
    if (score > bestScore) bestScore = score;
}

function drawBackground() {
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    skyGrad.addColorStop(0, '#4EC0CA');
    skyGrad.addColorStop(1, '#71C8D4');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    drawCloud(50, 80, 60);
    drawCloud(200, 120, 45);
    drawCloud(320, 60, 50);
    drawCloud(150, 200, 35);
}

function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.4, y - size * 0.15, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
    ctx.arc(x + size * 0.35, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipe(x, topHeight) {
    const capH = 26;
    const capOverhang = 6;

    // Top pipe body
    const grad1 = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
    grad1.addColorStop(0, '#5A8C2A');
    grad1.addColorStop(0.3, '#73BF2E');
    grad1.addColorStop(0.7, '#73BF2E');
    grad1.addColorStop(1, '#4A7A20');
    ctx.fillStyle = grad1;
    ctx.fillRect(x, 0, PIPE_WIDTH, topHeight - capH);

    // Top pipe cap
    const grad2 = ctx.createLinearGradient(x - capOverhang, 0, x + PIPE_WIDTH + capOverhang, 0);
    grad2.addColorStop(0, '#4A7A20');
    grad2.addColorStop(0.3, '#73BF2E');
    grad2.addColorStop(0.7, '#73BF2E');
    grad2.addColorStop(1, '#3D6B18');
    ctx.fillStyle = grad2;
    ctx.fillRect(x - capOverhang, topHeight - capH, PIPE_WIDTH + capOverhang * 2, capH);

    // Top pipe cap border
    ctx.strokeStyle = '#2D5010';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - capOverhang, topHeight - capH, PIPE_WIDTH + capOverhang * 2, capH);

    // Bottom pipe
    const botY = topHeight + PIPE_GAP;
    ctx.fillStyle = grad1;
    ctx.fillRect(x, botY + capH, PIPE_WIDTH, H - GROUND_HEIGHT - botY - capH);

    // Bottom pipe cap
    ctx.fillStyle = grad2;
    ctx.fillRect(x - capOverhang, botY, PIPE_WIDTH + capOverhang * 2, capH);

    ctx.strokeStyle = '#2D5010';
    ctx.strokeRect(x - capOverhang, botY, PIPE_WIDTH + capOverhang * 2, capH);

    // Pipe body borders
    ctx.strokeStyle = '#2D5010';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, 0, PIPE_WIDTH, topHeight - capH);
    ctx.strokeRect(x, botY + capH, PIPE_WIDTH, H - GROUND_HEIGHT - botY - capH);
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Wing
    const wingY = bird.flapFrame > 5 ? -6 : (bird.flapFrame > 0 ? 2 : 0);

    // Body
    ctx.fillStyle = '#F5C842';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#D4A017';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Belly
    ctx.fillStyle = '#FDE88D';
    ctx.beginPath();
    ctx.ellipse(2, 4, BIRD_SIZE * 0.55, BIRD_SIZE * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    ctx.fillStyle = '#E8B830';
    ctx.beginPath();
    ctx.ellipse(-4, wingY, 10, 6, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#C49A20';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Eye white
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(8, -5, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Pupil
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(10, -5, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye highlight
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(11.5, -6.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#E87040';
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, 2);
    ctx.lineTo(14, 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#C05030';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Upper beak
    ctx.fillStyle = '#F09050';
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, 2);
    ctx.lineTo(14, 2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawGround() {
    // Ground body
    const groundY = H - GROUND_HEIGHT;
    const grad = ctx.createLinearGradient(0, groundY, 0, H);
    grad.addColorStop(0, '#DEB050');
    grad.addColorStop(0.15, '#D4A040');
    grad.addColorStop(1, '#8B6914');
    ctx.fillStyle = grad;
    ctx.fillRect(0, groundY, W, GROUND_HEIGHT);

    // Ground top stripe
    ctx.fillStyle = '#5A8C2A';
    ctx.fillRect(0, groundY, W, 15);

    // Ground pattern
    ctx.fillStyle = '#4A7A20';
    for (let x = groundX; x < W + 24; x += 24) {
        ctx.fillRect(x, groundY, 12, 15);
    }

    // Ground line
    ctx.strokeStyle = '#3D6B18';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
}

function drawScore() {
    ctx.save();
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.font = 'bold 48px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(score, W / 2, 60);
    ctx.fillText(score, W / 2, 60);
    ctx.restore();
}

function drawReady() {
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 36px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Flappy Bird', W / 2, H / 2 - 100);
    ctx.fillText('Flappy Bird', W / 2, H / 2 - 100);

    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.lineWidth = 2;
    ctx.strokeText('Press SPACE or Click to Start', W / 2, H / 2 - 50);
    ctx.fillText('Press SPACE or Click to Start', W / 2, H / 2 - 50);
}

function drawGameOver() {
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    // Panel
    const panelW = 260;
    const panelH = 180;
    const px = (W - panelW) / 2;
    const py = (H - panelH) / 2 - 40;

    ctx.fillStyle = '#DEB050';
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 4;
    roundRect(px, py, panelW, panelH, 10, true, true);

    ctx.fillStyle = '#C49A20';
    roundRect(px + 10, py + 10, panelW - 20, panelH - 20, 6, true, false);

    // Game Over text
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 32px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Game Over', W / 2, py - 15);
    ctx.fillText('Game Over', W / 2, py - 15);

    // Score
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#FFF';
    ctx.strokeText('Score: ' + score, W / 2, py + 60);
    ctx.fillText('Score: ' + score, W / 2, py + 60);

    // Best
    ctx.strokeText('Best: ' + bestScore, W / 2, py + 95);
    ctx.fillText('Best: ' + bestScore, W / 2, py + 95);

    // Medal
    if (score >= 10) {
        const medalColor = score >= 40 ? '#FFD700' : score >= 20 ? '#C0C0C0' : '#CD7F32';
        ctx.fillStyle = medalColor;
        ctx.beginPath();
        ctx.arc(px + 45, py + 75, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('★', px + 45, py + 80);
    }

    // Restart
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Press SPACE or Click to Restart', W / 2, py + panelH + 40);
    ctx.fillText('Press SPACE or Click to Restart', W / 2, py + panelH + 40);
}

function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    // Draw pipes
    for (const pipe of pipes) {
        drawPipe(pipe.x, pipe.topHeight);
    }

    drawGround();
    drawBird();
    drawScore();

    if (gameState === 'ready') drawReady();
    if (gameState === 'dead') drawGameOver();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

init();
gameLoop();
</script>
</body>
</html>
