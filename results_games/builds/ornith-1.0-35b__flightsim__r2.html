<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>City Flight Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
#hud {
  position: fixed; top: 20px; left: 20px; color: #0f0;
  font-family: 'Courier New', monospace; font-size: 14px;
  text-shadow: 0 0 5px #0f0; pointer-events: none;
  line-height: 1.8;
}
#crosshair {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none; color: rgba(255,255,255,0.4);
  font-size: 24px; font-family: monospace;
}
#controls {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.6); font-family: 'Courier New', monospace;
  font-size: 12px; text-align: center; pointer-events: none;
  background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 4px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="crosshair">+</div>
<div id="controls">W/S: Pitch &nbsp; A/D: Roll &nbsp; Q/E: Yaw &nbsp; Shift: Throttle Up &nbsp; Space: Throttle Down</div>
<script>
"use strict";

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
if (!gl) { document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40vh">WebGL not supported</h1>'; throw 'No WebGL'; }

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// --- Matrix Math ---
function mat4Create() { const m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function mat4Identity() { return mat4Create(); }
function mat4Perspective(fov, aspect, near, far) {
  const m = new Float32Array(16);
  const f = 1.0 / Math.tan(fov / 2);
  m[0] = f / aspect; m[5] = f; m[10] = (far + near) / (near - far);
  m[11] = -1; m[14] = (2 * far * near) / (near - far);
  return m;
}
function mat4LookAt(eye, center, up) {
  const m = new Float32Array(16);
  let zx = eye[0]-center[0], zy = eye[1]-center[1], zz = eye[2]-center[2];
  let len = Math.sqrt(zx*zx+zy*zy+zz*zz); zx/=len; zy/=len; zz/=len;
  let xx = up[1]*zz-up[2]*zy, xy = up[2]*zx-up[0]*zz, xz = up[0]*zy-up[1]*zx;
  len = Math.sqrt(xx*xx+xy*xy+xz*xz); xx/=len; xy/=len; xz/=len;
  let yx = zy*xz-zz*xy, yy = zz*xx-zx*xz, yz = zx*xy-zy*xx;
  m[0]=xx;m[1]=yx;m[2]=zx;m[3]=0;
  m[4]=xy;m[5]=yy;m[6]=zy;m[7]=0;
  m[8]=xz;m[9]=yz;m[10]=zz;m[11]=0;
  m[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  m[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  m[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  m[15]=1;
  return m;
}
function mat4Multiply(a, b) {
  const r = new Float32Array(16);
  for (let i = 0; i < 4; i++)
    for (let j = 0; j < 4; j++) {
      r[j*4+i] = a[i]*b[j*4] + a[4+i]*b[j*4+1] + a[8+i]*b[j*4+2] + a[12+i]*b[j*4+3];
    }
  return r;
}
function mat4Translate(m, x, y, z) {
  const t = mat4Identity();
  t[12]=x; t[13]=y; t[14]=z;
  return mat4Multiply(m, t);
}
function mat4RotateX(m, r) {
  const t = mat4Identity();
  t[5]=Math.cos(r); t[6]=Math.sin(r); t[9]=-Math.sin(r); t[10]=Math.cos(r);
  return mat4Multiply(m, t);
}
function mat4RotateY(m, r) {
  const t = mat4Identity();
  t[0]=Math.cos(r); t[2]=-Math.sin(r); t[8]=Math.sin(r); t[10]=Math.cos(r);
  return mat4Multiply(m, t);
}
function mat4RotateZ(m, r) {
  const t = mat4Identity();
  t[0]=Math.cos(r); t[1]=Math.sin(r); t[4]=-Math.sin(r); t[5]=Math.cos(r);
  return mat4Multiply(m, t);
}
function mat4Scale(m, x, y, z) {
  const t = mat4Identity();
  t[0]=x; t[5]=y; t[10]=z;
  return mat4Multiply(m, t);
}

// --- Shaders ---
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src);
    throw 'Shader compile error';
  }
  return s;
}
function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    throw 'Program link error';
  }
  return p;
}

const mainVS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform mat4 uMVP;
uniform mat4 uModel;
varying vec3 vNorm;
varying vec3 vWorldPos;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vNorm = mat3(uModel) * aNorm;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;

const mainFS = `
precision mediump float;
varying vec3 vNorm;
varying vec3 vWorldPos;
uniform vec3 uLightDir;
uniform vec3 uColor;
uniform float uFogNear;
uniform float uFogFar;
uniform vec3 uFogColor;
void main() {
  vec3 n = normalize(vNorm);
  float diff = max(dot(n, uLightDir), 0.0);
  float amb = 0.35;
  vec3 col = uColor * (amb + diff * 0.65);
  float dist = length(vWorldPos);
  float fog = clamp((dist - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
  col = mix(col, uFogColor, fog);
  gl_FragColor = vec4(col, 1.0);
}`;

const skyVS = `
attribute vec3 aPos;
varying vec3 vDir;
void main() {
  vDir = aPos;
  gl_Position = vec4(aPos.xy, 0.999, 1.0);
}`;

const skyFS = `
precision mediump float;
varying vec3 vDir;
void main() {
  vec3 d = normalize(vDir);
  float y = d.y * 0.5 + 0.5;
  vec3 bottom = vec3(0.6, 0.7, 0.85);
  vec3 top = vec3(0.2, 0.4, 0.8);
  vec3 horizon = vec3(0.8, 0.85, 0.95);
  vec3 col = mix(bottom, horizon, smoothstep(0.0, 0.15, y));
  col = mix(col, top, smoothstep(0.15, 0.6, y));
  // Sun
  vec3 sunDir = normalize(vec3(0.5, 0.3, -0.8));
  float sun = pow(max(dot(d, sunDir), 0.0), 256.0);
  float sunGlow = pow(max(dot(d, sunDir), 0.0), 8.0) * 0.3;
  col += vec3(1.0, 0.95, 0.8) * sun + vec3(1.0, 0.7, 0.4) * sunGlow;
  // Clouds
  float cloud = 0.0;
  vec3 cd = d * 3.0;
  float c1 = smoothstep(0.45, 0.55, sin(cd.x*1.2)*sin(cd.z*0.8)*0.5+0.5)*smoothstep(0.3, 0.5, cd.y);
  float c2 = smoothstep(0.4, 0.55, cos(cd.x*0.7+1.0)*sin(cd.z*1.1+2.0)*0.5+0.5)*smoothstep(0.25, 0.45, cd.y);
  cloud = max(c1, c2) * 0.4;
  col = mix(col, vec3(1.0), cloud);
  gl_FragColor = vec4(col, 1.0);
}`;

const groundVS = `
attribute vec3 aPos;
uniform mat4 uMVP;
void main() { gl_Position = uMVP * vec4(aPos, 1.0); }`;

const groundFS = `
precision mediump float;
uniform vec3 uColor;
uniform float uFogNear;
uniform float uFogFar;
uniform vec3 uFogColor;
void main() {
  float fog = clamp((gl_FragCoord.z - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0);
  vec3 col = mix(uColor, uFogColor, fog);
  gl_FragColor = vec4(col, 1.0);
}`;

const program = createProgram(mainVS, mainFS);
const skyProgram = createProgram(skyVS, skyFS);
const groundProgram = createProgram(groundVS, groundFS);

// --- Geometry ---
function createBox() {
  const p = [];
  const n = [];
  const idx = [];
  // 6 faces, 2 triangles each
  const faces = [
    { n: [0,0,1] }, { n: [0,0,-1] }, { n: [1,0,0] },
    { n: [-1,0,0] }, { n: [0,1,0] }, { n: [0,-1,0] }
  ];
  let vi = 0;
  for (let f = 0; f < 6; f++) {
    const face = faces[f];
    const nx = face.n[0], ny = face.n[1], nz = face.n[2];
    // Four corners of the face
    const corners = [];
    if (nx !== 0) {
      const s = nx > 0 ? 1 : -1;
      corners.push([s, -0.5, -0.5], [s, 0.5, -0.5], [s, 0.5, 0.5], [s, -0.5, 0.5]);
    } else if (ny !== 0) {
      const s = ny > 0 ? 1 : -1;
      corners.push([-0.5, s, -0.5], [-0.5, s, 0.5], [0.5, s, 0.5], [0.5, s, -0.5]);
    } else {
      const s = nz > 0 ? 1 : -1;
      corners.push([-0.5, -0.5, s], [0.5, -0.5, s], [0.5, 0.5, s], [-0.5, 0.5, s]);
    }
    for (const c of corners) { p.push(c[0], c[1], c[2]); n.push(nx, ny, nz); }
    idx.push(vi, vi+1, vi+2, vi, vi+2, vi+3);
    vi += 4;
  }
  return { positions: new Float32Array(p), normals: new Float32Array(n), indices: new Uint16Array(idx) };
}

function createGround() {
  const s = 2000;
  return {
    positions: new Float32Array([-s,0,-s, s,0,-s, s,0,s, -s,0,-s, s,0,s, -s,0,s]),
    indices: new Uint16Array([0,1,2, 0,2,3])
  };
}

function createSkySphere() {
  const pos = [];
  const seg = 32;
  for (let i = 0; i <= seg; i++) {
    for (let j = 0; j <= seg; j++) {
      const theta = (i / seg) * Math.PI * 2;
      const phi = (j / seg) * Math.PI;
      pos.push(Math.cos(theta)*Math.sin(phi), Math.cos(phi), Math.sin(theta)*Math.sin(phi));
    }
  }
  const idx = [];
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i*(seg+1)+j, b = a+seg+1;
      idx.push(a, b, a+1, b, b+1, a+1);
    }
  }
  return { positions: new Float32Array(pos), indices: new Uint16Array(idx) };
}

function createPlane() {
  const parts = [];
  // Fuselage
  parts.push({ geo: createBox(), transform: mat4Scale(mat4Translate(mat4Create(), 0, 0, 0), 0.8, 0.5, 3.0) });
  // Nose cone (elongated front)
  parts.push({ geo: createBox(), transform: mat4Scale(mat4Translate(mat4Create(), 0, 0.1, 2.0), 0.5, 0.4, 1.2) });
  // Wings
  parts.push({ geo: createBox(), transform: mat4Scale(mat4Translate(mat4Create(), 0, -0.1, 0.0), 5.0, 0.1, 1.2) });
  // Wing sweep (angled look via scale distortion)
  // Tail horizontal
  parts.push({ geo: createBox(), transform: mat4Scale(mat4Translate(mat4Create(), 0, 0.0, -1.3), 2.5, 0.08, 0.8) });
  // Tail vertical
  parts.push({ geo: createBox(), transform: mat4Scale(mat4Translate(mat4Create(), 0, 0.5, -1.2), 0.08, 1.0, 0.7) });
  // Cockpit
  parts.push({ geo: createBox(), transform: mat4Scale(mat4Translate(mat4Create(), 0, 0.35, 0.8), 0.5, 0.35, 0.8) });
  return parts;
}

// --- Build buffers ---
function createBuffer(data, type) {
  const b = gl.createBuffer();
  gl.bindBuffer(type || gl.ARRAY_BUFFER, b);
  gl.bufferData(type || gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  return b;
}

const boxGeo = createBox();
const boxPosBuf = createBuffer(boxGeo.positions);
const boxNormBuf = createBuffer(boxGeo.normals);
const boxIdxBuf = createBuffer(boxGeo.indices, gl.ELEMENT_ARRAY_BUFFER);

const groundGeo = createGround();
const groundPosBuf = createBuffer(groundGeo.positions);
const groundIdxBuf = createBuffer(groundGeo.indices, gl.ELEMENT_ARRAY_BUFFER);

const skyGeo = createSkySphere();
const skyPosBuf = createBuffer(skyGeo.positions);
const skyIdxBuf = createBuffer(skyGeo.indices, gl.ELEMENT_ARRAY_BUFFER);

// --- City Generation ---
const SEED = 42;
let rngState = SEED;
function rng() {
  rngState = (rngState * 1664525 + 1013904223) & 0xFFFFFFFF;
  return (rngState >>> 0) / 4294967296;
}
function rngRange(min, max) { return min + rng() * (max - min); }

const BUILDINGS = [];
const CITY_SIZE = 800;
const GRID = 40;
const CELL = CITY_SIZE / GRID;

function generateCity() {
  rngState = SEED;
  for (let gx = 0; gx < GRID; gx++) {
    for (let gz = 0; gz < GRID; gz++) {
      if (rng() < 0.25) continue; // Some empty lots
      const cx = (gx - GRID/2) * CELL + rngRange(-CELL*0.3, CELL*0.3);
      const cz = (gz - GRID/2) * CELL + rngRange(-CELL*0.3, CELL*0.3);
      const w = rngRange(CELL * 0.4, CELL * 0.85);
      const d = rngRange(CELL * 0.4, CELL * 0.85);
      const h = rngRange(10, 250);
      // Taller in city center
      const distFromCenter = Math.sqrt(gx*gx + gz*gz) / (GRID/2);
      const heightMult = 1.0 + (1.0 - distFromCenter) * 2.5;
      const finalH = Math.min(h * heightMult, 350);

      // Color
      const colorChoice = rng();
      let r, g, b;
      if (colorChoice < 0.3) { r = 0.55+rng()*0.15; g = 0.58+rng()*0.15; b = 0.62+rng()*0.15; }
      else if (colorChoice < 0.5) { r = 0.45+rng()*0.1; g = 0.5+rng()*0.1; b = 0.55+rng()*0.1; }
      else if (colorChoice < 0.65) { r = 0.5+rng()*0.1; g = 0.55+rng()*0.1; b = 0.65+rng()*0.1; }
      else if (colorChoice < 0.8) { r = 0.6+rng()*0.1; g = 0.55+rng()*0.1; b = 0.45+rng()*0.1; }
      else { r = 0.4+rng()*0.1; g = 0.45+rng()*0.1; b = 0.5+rng()*0.15; }

      BUILDINGS.push({ x: cx, z: cz, w, d, h: finalH, r, g, b });
    }
  }
}
generateCity();

// --- Plane ---
const planeParts = createPlane();

// --- State ---
let planeX = 0, planeY = 120, planeZ = 0;
let pitch = 0, roll = 0, yaw = 0;
let speed = 1.5;
let targetSpeed = 1.5;
let throttle = 0.5;

const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

// --- HUD ---
const hudEl = document.getElementById('hud');

// --- Render ---
const projMatrix = mat4Perspective(Math.PI / 3.5, canvas.width / canvas.height, 1, 5000);

function getUniformLocation(prog, name) { return gl.getUniformLocation(prog, name); }

const uMVP = getUniformLocation(program, 'uMVP');
const uModel = getUniformLocation(program, 'uModel');
const uLightDir = getUniformLocation(program, 'uLightDir');
const uColor = getUniformLocation(program, 'uColor');
const uFogNear = getUniformLocation(program, 'uFogNear');
const uFogFar = getUniformLocation(program, 'uFogFar');
const uFogColor = getUniformLocation(program, 'uFogColor');

const uSkyMVP = getUniformLocation(skyProgram, 'uMVP');

const uGroundMVP = getUniformLocation(groundProgram, 'uMVP');
const uGroundColor = getUniformLocation(groundProgram, 'uColor');
const uGroundFogNear = getUniformLocation(groundProgram, 'uFogNear');
const uGroundFogFar = getUniformLocation(groundProgram, 'uFogFar');
const uGroundFogColor = getUniformLocation(groundProgram, 'uFogColor');

const aPos = gl.getAttribLocation(program, 'aPos');
const aNorm = gl.getAttribLocation(program, 'aNorm');
const aSkyPos = gl.getAttribLocation(skyProgram, 'aPos');
const aGroundPos = gl.getAttribLocation(groundProgram, 'aPos');

const LIGHT_DIR = [0.4, 0.8, 0.3];
const FOG_NEAR = 300;
const FOG_FAR = 1800;
const FOG_COLOR = [0.65, 0.75, 0.9];

function drawBox(modelMatrix, color) {
  const mvp = mat4Multiply(projMatrix, modelMatrix);
  gl.uniformMatrix4fv(uMVP, false, mvp);
  gl.uniformMatrix4fv(uModel, false, modelMatrix);
  gl.uniform3fv(uLightDir, LIGHT_DIR);
  gl.uniform3fv(uColor, color);
  gl.uniform1f(uFogNear, FOG_NEAR);
  gl.uniform1f(uFogFar, FOG_FAR);
  gl.uniform3fv(uFogColor, FOG_COLOR);

  gl.bindBuffer(gl.ARRAY_BUFFER, boxPosBuf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, boxNormBuf);
  gl.enableVertexAttribArray(aNorm);
  gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, boxIdxBuf);
  gl.drawElements(gl.TRIANGLES, boxGeo.indices.length, gl.UNSIGNED_SHORT, 0);
}

function drawGround() {
  const eye = [planeX, planeY, planeZ];
  const lookAhead = 100;
  const pitchDir = [Math.sin(pitch)*Math.cos(yaw), Math.cos(pitch), Math.sin(pitch)*Math.sin(yaw)];
  const center = [eye[0]+pitchDir[0]*lookAhead, eye[1]+pitchDir[1]*lookAhead, eye[2]+pitchDir[2]*lookAhead];
  const view = mat4LookAt(eye, center, [0,1,0]);
  const mvp = mat4Multiply(projMatrix, view);

  gl.useProgram(groundProgram);
  gl.uniformMatrix4fv(uGroundMVP, false, mvp);
  gl.uniform3fv(uGroundColor, [0.25, 0.28, 0.22]);
  gl.uniform1f(uGroundFogNear, FOG_NEAR);
  gl.uniform1f(uGroundFogFar, FOG_FAR);
  gl.uniform3fv(uGroundFogColor, FOG_COLOR);

  gl.bindBuffer(gl.ARRAY_BUFFER, groundPosBuf);
  gl.enableVertexAttribArray(aGroundPos);
  gl.vertexAttribPointer(aGroundPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, groundIdxBuf);
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
}

function drawSky() {
  gl.useProgram(skyProgram);
  // Sky sphere centered on camera
  const eye = [planeX, planeY, planeZ];
  const lookAhead = 100;
  const pitchDir = [Math.sin(pitch)*Math.cos(yaw), Math.cos(pitch), Math.sin(pitch)*Math.sin(yaw)];
  const center = [eye[0]+pitchDir[0]*lookAhead, eye[1]+pitchDir[1]*lookAhead, eye[2]+pitchDir[2]*lookAhead];
  const view = mat4LookAt(eye, center, [0,1,0]);
  const mvp = mat4Multiply(projMatrix, view);
  gl.uniformMatrix4fv(uSkyMVP, false, mvp);

  gl.bindBuffer(gl.ARRAY_BUFFER, skyPosBuf);
  gl.enableVertexAttribArray(aSkyPos);
  gl.vertexAttribPointer(aSkyPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, skyIdxBuf);
  gl.drawElements(gl.TRIANGLES, skyGeo.indices.length, gl.UNSIGNED_SHORT, 0);
}

function drawPlane() {
  let model = mat4Translate(mat4Create(), planeX, planeY, planeZ);
  model = mat4RotateY(model, yaw);
  model = mat4RotateX(model, pitch);
  model = mat4RotateZ(model, roll);

  // Fuselage color
  drawBox(model, [0.85, 0.88, 0.92]);
  // Nose
  let noseModel = mat4Translate(mat4Create(), planeX, planeY, planeZ);
  noseModel = mat4RotateY(noseModel, yaw);
  noseModel = mat4RotateX(noseModel, pitch);
  noseModel = mat4RotateZ(noseModel, roll);
  noseModel = mat4Multiply(noseModel, planeParts[1].transform);
  drawBox(noseModel, [0.7, 0.75, 0.8]);

  // Wings - darker
  let wingModel = mat4Translate(mat4Create(), planeX, planeY, planeZ);
  wingModel = mat4RotateY(wingModel, yaw);
  wingModel = mat4RotateX(wingModel, pitch);
  wingModel = mat4RotateZ(wingModel, roll);
  wingModel = mat4Multiply(wingModel, planeParts[2].transform);
  drawBox(wingModel, [0.6, 0.65, 0.7]);

  // Tail horizontal
  let tailH = mat4Translate(mat4Create(), planeX, planeY, planeZ);
  tailH = mat4RotateY(tailH, yaw);
  tailH = mat4RotateX(tailH, pitch);
  tailH = mat4RotateZ(tailH, roll);
  tailH = mat4Multiply(tailH, planeParts[3].transform);
  drawBox(tailH, [0.6, 0.65, 0.7]);

  // Tail vertical
  let tailV = mat4Translate(mat4Create(), planeX, planeY, planeZ);
  tailV = mat4RotateY(tailV, yaw);
  tailV = mat4RotateX(tailV, pitch);
  tailV = mat4RotateZ(tailV, roll);
  tailV = mat4Multiply(tailV, planeParts[4].transform);
  drawBox(tailV, [0.7, 0.3, 0.25]); // Red tail

  // Cockpit
  let cockpit = mat4Translate(mat4Create(), planeX, planeY, planeZ);
  cockpit = mat4RotateY(cockpit, yaw);
  cockpit = mat4RotateX(cockpit, pitch);
  cockpit = mat4RotateZ(cockpit, roll);
  cockpit = mat4Multiply(cockpit, planeParts[6].transform);
  drawBox(cockpit, [0.3, 0.5, 0.7]);
}

// --- Speed lines ---
const LINE_COUNT = 60;
let linePositions = [];
for (let i = 0; i < LINE_COUNT; i++) {
  linePositions.push({
    offset: [rngRange(-200, 200), rngRange(-100, 200), rngRange(-300, -50)],
    speed: rngRange(0.8, 1.5)
  });
}

function drawSpeedLines() {
  const speedFactor = (speed - 0.5) / 3.0;
  if (speedFactor <= 0) return;

  const eye = [planeX, planeY, planeZ];
  const lookAhead = 100;
  const pitchDir = [Math.sin(pitch)*Math.cos(yaw), Math.cos(pitch), Math.sin(pitch)*Math.sin(yaw)];
  const right = [Math.cos(yaw), 0, -Math.sin(yaw)];
  const up = [0, 1, 0];

  const positions = [];
  for (const line of linePositions) {
    const t = (performance.now() * 0.001 * line.speed + line.offset[2]) % 1.0;
    const dist = 50 + t * 200 * speedFactor;
    const x = eye[0] + pitchDir[0] * dist + right[0] * line.offset[0] + up[0] * line.offset[1];
    const y = eye[1] + pitchDir[1] * dist + right[1] * line.offset[0] + up[1] * line.offset[1];
    const z = eye[2] + pitchDir[2] * dist + right[2] * line.offset[0] + up[2] * line.offset[1];
    const x2 = eye[0] + pitchDir[0] * (dist + 15 * speedFactor) + right[0] * line.offset[0] + up[0] * line.offset[1];
    const y2 = eye[1] + pitchDir[1] * (dist + 15 * speedFactor) + right[1] * line.offset[0] + up[1] * line.offset[1];
    const z2 = eye[2] + pitchDir[2] * (dist + 15 * speedFactor) + right[2] * line.offset[0] + up[2] * line.offset[1];
    positions.push(x, y, z, x2, y2, z2);
  }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);

  gl.useProgram(groundProgram);
  const look = [eye[0]+pitchDir[0]*lookAhead, eye[1]+pitchDir[1]*lookAhead, eye[2]+pitchDir[2]*lookAhead];
  const view = mat4LookAt(eye, look, [0,1,0]);
  const mvp = mat4Multiply(projMatrix, view);
  gl.uniformMatrix4fv(uGroundMVP, false, mvp);
  gl.uniform3fv(uGroundColor, [0.9, 0.95, 1.0]);
  gl.uniform1f(uGroundFogNear, 0);
  gl.uniform1f(uGroundFogFar, 1);
  gl.uniform3fv(uGroundFogColor, FOG_COLOR);

  gl.enableVertexAttribArray(aGroundPos);
  gl.vertexAttribPointer(aGroundPos, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.LINES, 0, LINE_COUNT * 2);
  gl.deleteBuffer(buf);
}

// --- Update ---
let lastTime = performance.now();

function update(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Input
  const pitchRate = 1.2;
  const rollRate = 1.5;
  const yawRate = 0.8;

  if (keys['KeyW'] || keys['ArrowUp']) pitch -= pitchRate * dt;
  if (keys['KeyS'] || keys['ArrowDown']) pitch += pitchRate * dt;
  if (keys['KeyA'] || keys['ArrowLeft']) roll -= rollRate * dt;
  if (keys['KeyD'] || keys['ArrowRight']) roll += rollRate * dt;
  if (keys['KeyQ']) yaw -= yawRate * dt;
  if (keys['KeyE']) yaw += yawRate * dt;

  if (keys['ShiftLeft'] || keys['ShiftRight']) throttle = Math.min(throttle + dt * 0.5, 1.0);
  if (keys['Space']) throttle = Math.max(throttle - dt * 0.5, 0.0);

  targetSpeed = 0.5 + throttle * 3.0;
  speed += (targetSpeed - speed) * dt * 2.0;

  // Auto-level roll slightly
  roll *= (1.0 - dt * 1.5);
  if (Math.abs(roll) < 0.01) roll = 0;

  // Clamp pitch
  pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));

  // Move forward
  const fwd = [Math.sin(pitch)*Math.cos(yaw), Math.cos(pitch), Math.sin(pitch)*Math.sin(yaw)];
  planeX += fwd[0] * speed * dt * 60;
  planeY += fwd[1] * speed * dt * 60;
  planeZ += fwd[2] * speed * dt * 60;

  // Keep above ground
  if (planeY < 15) { planeY = 15; pitch = Math.abs(pitch); }

  // Infinite world - wrap
  const halfCity = CITY_SIZE * 2;
  if (planeX > halfCity) planeX -= halfCity * 2;
  if (planeX < -halfCity) planeX += halfCity * 2;
  if (planeZ > halfCity) planeZ -= halfCity * 2;
  if (planeZ < -halfCity) planeZ += halfCity * 2;

  // HUD
  const alt = Math.round(planeY);
  const spd = Math.round(speed * 100);
  const heading = Math.round(((yaw * 180 / Math.PI) % 360 + 360) % 360);
  hudEl.innerHTML = `ALT: ${alt} ft<br>SPD: ${spd} kts<br>HDG: ${heading}°<br>THR: ${Math.round(throttle*100)}%`;
}

function render() {
  gl.clearColor(0.5, 0.65, 0.85, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  // Sky
  gl.disable(gl.DEPTH_TEST);
  drawSky();
  gl.enable(gl.DEPTH_TEST);

  // Ground
  drawGround();

  // Buildings
  gl.useProgram(program);
  const eye = [planeX, planeY, planeZ];
  const lookAhead = 100;
  const pitchDir = [Math.sin(pitch)*Math.cos(yaw), Math.cos(pitch), Math.sin(pitch)*Math.sin(yaw)];
  const center = [eye[0]+pitchDir[0]*lookAhead, eye[1]+pitchDir[1]*lookAhead, eye[2]+pitchDir[2]*lookAhead];
  const view = mat4LookAt(eye, center, [0,1,0]);

  for (const b of BUILDINGS) {
    let model = mat4Translate(mat4Create(), b.x, b.h/2, b.z);
    model = mat4Scale(model, b.w, b.h, b.d);
    const mvp = mat4Multiply(projMatrix, mat4Multiply(view, model));
    gl.uniformMatrix4fv(uMVP, false, mvp);
    gl.uniformMatrix4fv(uModel, false, model);
    gl.uniform3fv(uLightDir, LIGHT_DIR);
    gl.uniform3fv(uColor, [b.r, b.g, b.b]);
    gl.uniform1f(uFogNear, FOG_NEAR);
    gl.uniform1f(uFogFar, FOG_FAR);
    gl.uniform3fv(uFogColor, FOG_COLOR);

    gl.bindBuffer(gl.ARRAY_BUFFER, boxPosBuf);
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, boxNormBuf);
    gl.enableVertexAttribArray(aNorm);
    gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, boxIdxBuf);
    gl.drawElements(gl.TRIANGLES, boxGeo.indices.length, gl.UNSIGNED_SHORT, 0);
  }

  // Plane
  drawPlane();

  // Speed lines
  drawSpeedLines();
}

function loop(now) {
  update(now);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
