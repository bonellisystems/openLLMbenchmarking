<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Jump Clone</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}
  canvas{background:#444;border:2px solid #fff;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:2em;background:rgba(0,0,0,0.7);color:#fff;pointer-events:none;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="overlay"></div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const W = canvas.width, H = canvas.height;
  const GRAVITY = 0.4;
  const JUMP_VELOCITY = -10;
  const PLAYER_RADIUS = 15;
  const PLATFORM_WIDTH = 80;
  const PLATFORM_HEIGHT = 10;
  const PLATFORM_GAP = 80;
  const HORIZ_SPEED = 4;
  const MAX_PLATFORMS = 30;

  let keys = {left:false,right:false};
  let gameOver = false;
  let score = 0;

  const player = {x:W/2, y:H-50, vx:0, vy:0, radius:PLAYER_RADIUS};

  const platforms = [];

  function initPlatforms() {
    platforms.length = 0;
    let y = H - 100;
    while (y > -H) {
      platforms.push({
        x: Math.random() * (W - PLATFORM_WIDTH),
        y: y,
        w: PLATFORM_WIDTH,
        h: PLATFORM_HEIGHT
      });
      y -= PLATFORM_GAP;
    }
  }

  function spawnPlatform() {
    const x = Math.random() * (W - PLATFORM_WIDTH);
    const y = platforms[platforms.length-1].y - PLATFORM_GAP;
    platforms.push({x, y, w:PLATFORM_WIDTH, h:PLATFORM_HEIGHT});
  }

  function update() {
    if (gameOver) return;
    // Horizontal movement
    if (keys.left) player.vx = -HORIZ_SPEED;
    else if (keys.right) player.vx = HORIZ_SPEED;
    else player.vx = 0;
    player.x += player.vx;
    if (player.x < player.radius) player.x = player.radius;
    if (player.x > W - player.radius) player.x = W - player.radius;

    // Gravity
    player.vy += GRAVITY;
    player.y += player.vy;

    // Collision with platforms
    if (player.vy > 0) { // falling
      for (let p of platforms) {
        if (player.x + player.radius > p.x && player.x - player.radius < p.x + p.w &&
            player.y + player.radius > p.y && player.y + player.radius < p.y + p.h) {
          player.vy = JUMP_VELOCITY;
          score++;
        }
      }
    }

    // Scroll up
    if (player.y < H/2) {
      const delta = H/2 - player.y;
      player.y = H/2;
      for (let p of platforms) p.y += delta;
      // Remove platforms below canvas
      while (platforms.length && platforms[0].y > H) platforms.shift();
      // Add new platforms at top
      while (platforms.length < MAX_PLATFORMS) spawnPlatform();
    }

    // Game over
    if (player.y - player.radius > H) {
      gameOver = true;
      overlay.textContent = 'Game Over\nScore: ' + score + '\nPress any key to restart';
    }
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    // Draw platforms
    ctx.fillStyle = '#8f8';
    for (let p of platforms) {
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }
    // Draw player
    ctx.fillStyle = '#f88';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
    ctx.fill();
    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText('Score: '+score, 10, 30);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function reset() {
    player.x = W/2;
    player.y = H-50;
    player.vx = 0;
    player.vy = 0;
    score = 0;
    gameOver = false;
    overlay.textContent = '';
    initPlatforms();
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'ArrowRight') keys.right = true;
    if (gameOver) reset();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'ArrowRight') keys.right = false;
  });

  initPlatforms();
  loop();
})();
</script>
</body>
</html>
