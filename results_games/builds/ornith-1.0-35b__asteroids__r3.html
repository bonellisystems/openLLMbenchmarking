<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

const FRICTION = 0.99;
const SHIP_THRUST = 0.15;
const SHIP_ROTATION = 0.06;
const BULLET_SPEED = 8;
const BULLET_LIFE = 60;
const BULLET_COOLDOWN = 12;
const ASTEROID_SPEED = 1.5;
const ASTEROID_SIZES = { large: 40, medium: 20, small: 10 };
const ASTEROID_SPEEDS = { large: 0.8, medium: 1.5, small: 2.5 };

let ship, asteroids, bullets, particles, score, lives, gameState, shootCooldown, invincibleTimer;

function generateAsteroidShape(radius) {
    const points = [];
    const numPoints = 8 + Math.floor(Math.random() * 6);
    for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const r = radius * (0.7 + Math.random() * 0.6);
        points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    return points;
}

function createAsteroid(x, y, size) {
    const r = ASTEROID_SIZES[size];
    const speed = ASTEROID_SPEEDS[size] * (0.5 + Math.random());
    const angle = Math.random() * Math.PI * 2;
    return {
        x: x !== undefined ? x : Math.random() * canvas.width,
        y: y !== undefined ? y : Math.random() * canvas.height,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: r,
        size: size,
        shape: generateAsteroidShape(r),
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.03
    };
}

function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
        let a = createAsteroid();
        while (dist(a.x, a.y, ship.x, ship.y) < 200) {
            a = createAsteroid();
        }
        asteroids.push(a);
    }
}

function dist(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function wrap(obj) {
    if (obj.x < -50) obj.x = canvas.width + 50;
    if (obj.x > canvas.width + 50) obj.x = -50;
    if (obj.y < -50) obj.y = canvas.height + 50;
    if (obj.y > canvas.height + 50) obj.y = -50;
}

function createExplosion(x, y, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 20 + Math.random() * 30,
            maxLife: 50,
            size: 1 + Math.random() * 2
        });
    }
}

function initGame() {
    ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        angle: -Math.PI / 2,
        radius: 15
    };
    asteroids = [];
    bullets = [];
    particles = [];
    score = 0;
    lives = 3;
    gameState = 'playing';
    shootCooldown = 0;
    invincibleTimer = 120;
    spawnAsteroids(4);
}

function resetShip() {
    ship.x = canvas.width / 2;
    ship.y = canvas.height / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    invincibleTimer = 120;
}

function update() {
    if (gameState === 'gameover') {
        if (keys['Enter'] || keys['Space']) {
            initGame();
        }
        updateParticles();
        return;
    }

    if (invincibleTimer > 0) invincibleTimer--;
    if (shootCooldown > 0) shootCooldown--;

    // Ship rotation
    if (keys['ArrowLeft']) ship.angle -= SHIP_ROTATION;
    if (keys['ArrowRight']) ship.angle += SHIP_ROTATION;

    // Thrust
    if (keys['ArrowUp']) {
        ship.vx += Math.cos(ship.angle) * SHIP_THRUST;
        ship.vy += Math.sin(ship.angle) * SHIP_THRUST;
        // Thrust particles
        if (Math.random() > 0.3) {
            const px = ship.x - Math.cos(ship.angle) * 15;
            const py = ship.y - Math.sin(ship.angle) * 15;
            particles.push({
                x: px + (Math.random() - 0.5) * 4,
                y: py + (Math.random() - 0.5) * 4,
                vx: -Math.cos(ship.angle) * (1 + Math.random() * 2) + (Math.random() - 0.5),
                vy: -Math.sin(ship.angle) * (1 + Math.random() * 2) + (Math.random() - 0.5),
                life: 10 + Math.random() * 15,
                maxLife: 25,
                size: 1 + Math.random() * 2
            });
        }
    }

    // Friction
    ship.vx *= FRICTION;
    ship.vy *= FRICTION;

    // Ship position
    ship.x += ship.vx;
    ship.y += ship.vy;
    wrap(ship);

    // Shooting
    if (keys['Space'] && shootCooldown <= 0) {
        bullets.push({
            x: ship.x + Math.cos(ship.angle) * 18,
            y: ship.y + Math.sin(ship.angle) * 18,
            vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.3,
            vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.3,
            life: BULLET_LIFE
        });
        shootCooldown = BULLET_COOLDOWN;
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        wrap(b);
        if (b.life <= 0) bullets.splice(i, 1);
    }

    // Update asteroids
    for (const a of asteroids) {
        a.x += a.vx;
        a.y += a.vy;
        a.rotation += a.rotSpeed;
        wrap(a);
    }

    // Bullet-asteroid collisions
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const a = asteroids[j];
            if (dist(b.x, b.y, a.x, a.y) < a.radius) {
                bullets.splice(i, 1);
                createExplosion(a.x, a.y, a.size === 'large' ? 15 : a.size === 'medium' ? 10 : 5);

                if (a.size === 'large') {
                    asteroids.splice(j, 1);
                    asteroids.push(createAsteroid(a.x, a.y, 'medium'));
                    asteroids.push(createAsteroid(a.x, a.y, 'medium'));
                    score += 20;
                } else if (a.size === 'medium') {
                    asteroids.splice(j, 1);
                    asteroids.push(createAsteroid(a.x, a.y, 'small'));
                    asteroids.push(createAsteroid(a.x, a.y, 'small'));
                    score += 50;
                } else {
                    asteroids.splice(j, 1);
                    score += 100;
                }
                break;
            }
        }
    }

    // Ship-asteroid collisions
    if (invincibleTimer <= 0) {
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const a = asteroids[j];
            if (dist(ship.x, ship.y, a.x, a.y) < a.radius + ship.radius - 5) {
                lives--;
                createExplosion(ship.x, ship.y, 30);
                if (lives <= 0) {
                    gameState = 'gameover';
                } else {
                    resetShip();
                }
                break;
            }
        }
    }

    // Respawn asteroids if all destroyed
    if (asteroids.length === 0) {
        spawnAsteroids(4 + Math.floor(score / 500));
    }

    updateParticles();
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawShip() {
    if (gameState !== 'playing') return;
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-12, -10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-12, 10);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
}

function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);

    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(a.shape[0].x, a.shape[0].y);
    for (let i = 1; i < a.shape.length; i++) {
        ctx.lineTo(a.shape[i].x, a.shape[i].y);
    }
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
}

function drawBullets() {
    ctx.fillStyle = '#fff';
    for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = `rgba(255, ${150 + Math.floor(alpha * 105)}, 50, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);

    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
        const lx = canvas.width - 20 - i * 25;
        const ly = 25;
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(-Math.PI / 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-7, -6);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-7, 6);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
}

function drawGameOver() {
    ctx.fillStyle = '#fff';
    ctx.font = '48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('Press ENTER to restart', canvas.width / 2, canvas.height / 2 + 55);
}

function drawStars() {
    if (!drawStars.cache) {
        drawStars.cache = [];
        for (let i = 0; i < 150; i++) {
            drawStars.cache.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                brightness: 0.3 + Math.random() * 0.7
            });
        }
    }
    for (const s of drawStars.cache) {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawStars();

    if (gameState === 'playing' || gameState === 'gameover') {
        for (const a of asteroids) drawAsteroid(a);
        drawBullets();
        drawShip();
        drawParticles();
        drawHUD();
        if (gameState === 'gameover') drawGameOver();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initGame();
gameLoop();
</script>
</body>
</html>
