<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

// Scale canvas to fit screen
function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Game constants
const GRAVITY = 0.45;
const FLAP_FORCE = -7.5;
const PIPE_WIDTH = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_INTERVAL = 1600;
const GROUND_HEIGHT = 80;
const BIRD_SIZE = 20;

// Game state
let bird, pipes, score, bestScore = 0, gameState, groundX, lastPipeTime, frameCount;

function init() {
    bird = { x: 80, y: H / 2 - 50, vy: 0, rotation: 0, wingFrame: 0, wingTimer: 0 };
    pipes = [];
    score = 0;
    groundX = 0;
    lastPipeTime = 0;
    frameCount = 0;
    gameState = 'waiting';
}

function flap() {
    if (gameState === 'waiting') {
        gameState = 'playing';
        bird.vy = FLAP_FORCE;
    } else if (gameState === 'playing') {
        bird.vy = FLAP_FORCE;
    } else if (gameState === 'gameover') {
        init();
    }
}

// Input
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
    }
});
canvas.addEventListener('mousedown', (e) => { e.preventDefault(); flap(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });

function spawnPipe() {
    const minY = 80;
    const maxY = H - GROUND_HEIGHT - PIPE_GAP - 80;
    const topHeight = minY + Math.random() * (maxY - minY);
    pipes.push({
        x: W + 10,
        topHeight: topHeight,
        scored: false
    });
}

function update() {
    frameCount++;

    if (gameState === 'waiting') {
        bird.y = H / 2 - 50 + Math.sin(frameCount * 0.08) * 12;
        bird.wingTimer++;
        if (bird.wingTimer > 8) { bird.wingFrame = (bird.wingFrame + 1) % 3; bird.wingTimer = 0; }
        groundX = (groundX - 1) % 24;
        return;
    }

    if (gameState === 'gameover') return;

    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rotation = Math.min(Math.max(bird.vy * 3, -30), 90);
    bird.wingTimer++;
    if (bird.wingTimer > 6) { bird.wingFrame = (bird.wingFrame + 1) % 3; bird.wingTimer = 0; }

    // Ground scroll
    groundX = (groundX - PIPE_SPEED) % 24;

    // Pipe spawning
    if (frameCount - lastPipeTime > PIPE_INTERVAL / 16.67 || pipes.length === 0) {
        spawnPipe();
        lastPipeTime = frameCount;
    }

    // Pipe movement
    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;

        // Score
        if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
            pipes[i].scored = true;
            score++;
        }

        // Remove off-screen
        if (pipes[i].x + PIPE_WIDTH < -10) {
            pipes.splice(i, 1);
        }
    }

    // Collision detection
    const bx = bird.x;
    const by = bird.y;
    const br = BIRD_SIZE - 2;

    // Ground/ceiling
    if (by + br > H - GROUND_HEIGHT || by - br < 0) {
        die();
        return;
    }

    // Pipes
    for (const pipe of pipes) {
        const px = pipe.x;
        const pw = PIPE_WIDTH;
        const topH = pipe.topHeight;
        const botY = topH + PIPE_GAP;

        if (bx + br > px && bx - br < px + pw) {
            if (by - br < topH || by + br > botY) {
                die();
                return;
            }
        }
    }
}

function die() {
    gameState = 'gameover';
    if (score > bestScore) bestScore = score;
}

function drawBackground() {
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    skyGrad.addColorStop(0, '#4EC0CA');
    skyGrad.addColorStop(1, '#71C8D4');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    drawCloud(50, 80, 60);
    drawCloud(200, 120, 45);
    drawCloud(320, 60, 50);
    drawCloud(150, 200, 35);
}

function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.4, y - size * 0.15, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
    ctx.arc(x + size * 0.35, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
}

function drawPipe(x, topHeight) {
    const capH = 26;
    const capOverhang = 6;

    // Top pipe body
    const grad1 = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
    grad1.addColorStop(0, '#5A8C2A');
    grad1.addColorStop(0.3, '#73BF2E');
    grad1.addColorStop(0.7, '#73BF2E');
    grad1.addColorStop(1, '#4A7A20');
    ctx.fillStyle = grad1;
    ctx.fillRect(x, 0, PIPE_WIDTH, topHeight - capH);

    // Top pipe cap
    const grad2 = ctx.createLinearGradient(x - capOverhang, 0, x + PIPE_WIDTH + capOverhang, 0);
    grad2.addColorStop(0, '#4A7A20');
    grad2.addColorStop(0.3, '#73BF2E');
    grad2.addColorStop(0.7, '#73BF2E');
    grad2.addColorStop(1, '#3D6B18');
    ctx.fillStyle = grad2;
    ctx.fillRect(x - capOverhang, topHeight - capH, PIPE_WIDTH + capOverhang * 2, capH);

    // Top pipe cap border
    ctx.strokeStyle = '#2D5010';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - capOverhang, topHeight - capH, PIPE_WIDTH + capOverhang * 2, capH);

    // Bottom pipe
    const botY = topHeight + PIPE_GAP;
    ctx.fillStyle = grad1;
    ctx.fillRect(x, botY + capH, PIPE_WIDTH, H - GROUND_HEIGHT - botY - capH);

    // Bottom pipe cap
    ctx.fillStyle = grad2;
    ctx.fillRect(x - capOverhang, botY, PIPE_WIDTH + capOverhang * 2, capH);

    ctx.strokeStyle = '#2D5010';
    ctx.strokeRect(x - capOverhang, botY, PIPE_WIDTH + capOverhang * 2, capH);

    // Pipe body borders
    ctx.strokeStyle = '#2D5010';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, 0, PIPE_WIDTH, topHeight - capH);
    ctx.strokeRect(x, botY + capH, PIPE_WIDTH, H - GROUND_HEIGHT - botY - capH);
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation * Math.PI / 180);

    // Body
    ctx.fillStyle = '#F7DC6F';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#D4AC0D';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wing
    ctx.fillStyle = '#F0C040';
    const wingOffsets = [-3, -6, -2];
    const wingY = wingOffsets[bird.wingFrame];
    ctx.beginPath();
    ctx.ellipse(-4, wingY, 12, 7, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#D4AC0D';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Eye white
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(8, -5, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Pupil
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(10, -5, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye highlight
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(11.5, -6.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#E67E22';
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, 2);
    ctx.lineTo(14, 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#D35400';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Beak line
    ctx.strokeStyle = '#D35400';
    ctx.beginPath();
    ctx.moveTo(14, 3);
    ctx.lineTo(22, 3);
    ctx.stroke();

    ctx.restore();
}

function drawGround() {
    // Ground body
    const groundGrad = ctx.createLinearGradient(0, H - GROUND_HEIGHT, 0, H);
    groundGrad.addColorStop(0, '#DEB887');
    groundGrad.addColorStop(0.15, '#D2A86E');
    groundGrad.addColorStop(1, '#8B6914');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);

    // Ground top stripe
    ctx.fillStyle = '#5A8C2A';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, 15);

    // Ground pattern
    ctx.fillStyle = '#C49A5C';
    for (let x = groundX; x < W + 24; x += 24) {
        ctx.fillRect(x, H - GROUND_HEIGHT + 15, 12, 4);
        ctx.fillRect(x + 12, H - GROUND_HEIGHT + 25, 12, 4);
    }

    // Ground border
    ctx.strokeStyle = '#2D5010';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_HEIGHT);
    ctx.lineTo(W, H - GROUND_HEIGHT);
    ctx.stroke();
}

function drawScore() {
    ctx.save();
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.font = 'bold 48px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(score, W / 2, 60);
    ctx.fillText(score, W / 2, 60);
    ctx.restore();
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.font = 'bold 42px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Flappy Bird', W / 2, H / 2 - 80);
    ctx.fillText('Flappy Bird', W / 2, H / 2 - 80);

    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeText('Press SPACE or Click', W / 2, H / 2 + 20);
    ctx.fillText('Press SPACE or Click', W / 2, H / 2 + 20);
    ctx.restore();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    // Panel
    const px = W / 2 - 120;
    const py = H / 2 - 100;
    const pw = 240;
    const ph = 200;

    ctx.fillStyle = '#DEB050';
    ctx.strokeStyle = '#543847';
    ctx.lineWidth = 4;
    roundRect(px, py, pw, ph, 12);

    ctx.fillStyle = '#F5E6C8';
    roundRect(px + 10, py + 10, pw - 20, ph - 20, 8);

    ctx.save();
    ctx.fillStyle = '#543847';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 36px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('Game Over', W / 2, py + 55);
    ctx.fillText('Game Over', W / 2, py + 55);

    ctx.font = 'bold 24px Arial, sans-serif';
    ctx.lineWidth = 2;
    ctx.strokeText('Score: ' + score, W / 2, py + 100);
    ctx.fillText('Score: ' + score, W / 2, py + 100);

    ctx.strokeText('Best: ' + bestScore, W / 2, py + 135);
    ctx.fillText('Best: ' + bestScore, W / 2, py + 135);

    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Press SPACE or Click', W / 2, py + 180);
    ctx.fillText('Press SPACE or Click', W / 2, py + 180);
    ctx.restore();
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    // Draw pipes
    for (const pipe of pipes) {
        drawPipe(pipe.x, pipe.topHeight);
    }

    drawGround();
    drawBird();
    drawScore();

    if (gameState === 'waiting') drawStartScreen();
    if (gameState === 'gameover') drawGameOver();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

init();
gameLoop();
</script>
</body>
</html>
