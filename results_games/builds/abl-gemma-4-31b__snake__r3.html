<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
canvas { background: #000; border: 4px solid #555; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
#score { font-size: 30px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gridSize = 20;
const tileCount = 20;
let score = 0;
let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let dx = 0;
let dy = 0;
let nextDx = 0;
let nextDy = 0;

function loop() {
    dx = nextDx;
    dy = nextDy;
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = "Score: " + score;
        food = {x: Math.floor(Math.random()*tileCount), y: Math.floor(Math.random()*tileCount)};
    } else {
        snake.pop();
    }

    if (dx !== 0 || dy !== 0) {
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || snake.slice(1).some(p => p.x === head.x && p.y === head.y)) {
            ctx.fillStyle = "white";
            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", 200, 200);
            return;
        }
    }

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle = "red";
    ctx.fillRect(food.x*gridSize, food.y*gridSize, gridSize-2, gridSize-2);
    ctx.fillStyle = "lime";
    snake.forEach(p => ctx.fillRect(p.x*gridSize, p.y*gridSize, gridSize-2, gridSize-2));
    
    setTimeout(loop, 100);
}

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && dy === 0) { nextDx = 0; nextDy = -1; }
    if (e.key === 'ArrowDown' && dy === 0) { nextDx = 0; nextDy = 1; }
    if (e.key === 'ArrowLeft' && dx === 0) { nextDx = -1; nextDy = 0; }
    if (e.key === 'ArrowRight' && dx === 0) { nextDx = 1; nextDy = 0; }
});

loop();
</script>
</body>
</html>
