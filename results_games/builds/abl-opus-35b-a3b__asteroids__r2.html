<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function makeRocks(count, size) {
  const rocks = [];
  for (let i = 0; i < count; i++) {
    const r = size * (0.8 + Math.random() * 0.4);
    const verts = [];
    const n = 7 + Math.floor(Math.random() * 6);
    for (let j = 0; j < n; j++) {
      const a = (j / n) * Math.PI * 2;
      const rr = r * (0.7 + Math.random() * 0.6);
      verts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr });
    }
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.3 + Math.random() * 1.2;
    rocks.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      r, verts, rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02,
      alive: true, size
    });
  }
  return rocks;
}

let ship, bullets, rocks, score, lives, gameOver, respawnTimer, level;
let particles = [];

function init() {
  ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, r: 12, thrust: 0.08, rotSpeed: 0.05, alive: true, invuln: 0 };
  bullets = [];
  rocks = makeRocks(6, 40);
  score = 0; lives = 3; gameOver = false; respawnTimer = 0; level = 1;
}
init();

function shoot() {
  if (!ship.alive || gameOver) return;
  const speed = 8;
  bullets.push({
    x: ship.x + Math.cos(ship.angle) * ship.r,
    y: ship.y + Math.sin(ship.angle) * ship.r,
    vx: Math.cos(ship.angle) * speed + ship.vx * 0.3,
    vy: Math.sin(ship.angle) * speed + ship.vy * 0.3,
    life: 60
  });
}

function explode(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 30, color });
  }
}

function update() {
  if (gameOver) return;

  if (ship.alive) {
    if (keys['ArrowLeft']) ship.angle -= ship.rotSpeed;
    if (keys['ArrowRight']) ship.angle += ship.rotSpeed;
    if (keys['ArrowUp']) {
      ship.vx += Math.cos(ship.angle) * ship.thrust;
      ship.vy += Math.sin(ship.angle) * ship.thrust;
    }
    if (keys['Space']) shoot();
    ship.x += ship.vx;
    ship.y += ship.vy;
    ship.vx *= 0.995;
    ship.vy *= 0.995;
    if (ship.x < -ship.r) ship.x = W + ship.r;
    if (ship.x > W + ship.r) ship.x = -ship.r;
    if (ship.y < -ship.r) ship.y = H + ship.r;
    if (ship.y > H + ship.r) ship.y = -ship.r;
  }

  if (keys['Space'] && !ship.alive) {
    respawnTimer = 0;
    ship.alive = true;
    ship.x = W / 2;
    ship.y = H / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.invuln = 90;
  }

  if (ship.invuln > 0) ship.invuln--;

  for (let b of bullets) {
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.x < 0) b.x += W;
    if (b.x > W) b.x -= W;
    if (b.y < 0) b.y += H;
    if (b.y > H) b.y -= H;
  }
  bullets = bullets.filter(b => b.life > 0);

  for (let r of rocks) {
    r.x += r.vx;
    r.y += r.vy;
    r.rot += r.rotSpeed;
    if (r.x < -r.r) r.x += W + r.r * 2;
    if (r.x > W + r.r) r.x -= W + r.r * 2;
    if (r.y < -r.r) r.y += H + r.r * 2;
    if (r.y > H + r.r) r.y -= H + r.r * 2;
  }

  for (let b of bullets) {
    for (let r of rocks) {
      if (!r.alive) continue;
      if (dist(b, r) < r.r + 4) {
        r.alive = false;
        b.life = 0;
        score += r.size === 3 ? 20 : r.size === 2 ? 50 : 100;
        explode(r.x, r.y, 12, '#fff');
        if (r.size > 1) {
          const n = 2;
          for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = 0.5 + Math.random() * 1;
            rocks.push({
              x: r.x, y: r.y,
              vx: r.vx + Math.cos(a) * s, vy: r.vy + Math.sin(a) * s,
              r: r.r * 0.6, verts: r.verts.map(v => ({ x: v.x * 0.6, y: v.y * 0.6 })),
              rot: r.rot, rotSpeed: r.rotSpeed * 1.5, alive: true, size: r.size - 1
            });
          }
        }
        break;
      }
    }
  }

  if (ship.alive && ship.invuln <= 0) {
    for (let r of rocks) {
      if (!r.alive) continue;
      if (dist(ship, r) < ship.r + r.r) {
        ship.alive = false;
        lives--;
        explode(ship.x, ship.y, 30, '#f44');
        if (lives <= 0) gameOver = true;
        break;
      }
    }
  }

  if (rocks.filter(r => r.alive).length === 0 && !gameOver) {
    level++;
    rocks = makeRocks(6 + level, 40);
  }

  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
    ctx.font = '24px monospace';
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 20);
    ctx.fillText('Press SPACE to restart', W / 2, H / 2 + 60);
    if (keys['Space']) init();
    return;
  }

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';

  for (let r of rocks) {
    if (!r.alive) continue;
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.beginPath();
    ctx.moveTo(r.verts[0].x, r.verts[0].y);
    for (let i = 1; i < r.verts.length; i++) ctx.lineTo(r.verts[i].x, r.verts[i].y);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  if (ship.alive) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.beginPath();
    ctx.moveTo(ship.r + 2, 0);
    ctx.lineTo(-ship.r, -ship.r * 0.7);
    ctx.lineTo(-ship.r * 0.6, 0);
    ctx.lineTo(-ship.r, ship.r * 0.7);
    ctx.closePath();
    ctx.stroke();
    if (keys['ArrowUp']) {
      ctx.beginPath();
      ctx.moveTo(-ship.r * 0.6, 0);
      ctx.lineTo(-ship.r * 1.5, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  for (let b of bullets) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let p of particles) {
    const a = p.life / 60;
    ctx.fillStyle = p.color === '#f44' ? `rgba(255,68,68,${a})` : `rgba(255,255,255,${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 20, 30);
  ctx.textAlign = 'right';
  ctx.fillText('Lives: ' + lives, W - 20, 30);
  ctx.textAlign = 'center';
  ctx.fillText('Level ' + level, W / 2, 30);

  if (!ship.alive) {
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Press SPACE to respawn', W / 2, H / 2);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
