<!DOCTYPE html>
<html>
<head>
    <title>Asteroids</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <div id="msg"><h1>GAME OVER</h1><p>Press R to Restart</p></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const msgEl = document.getElementById("msg");

        let width, height, ship, asteroids, bullets, score, gameOver;
        const FPS = 60;
        const FRICTION = 0.7; 
        const SHIP_SIZE = 20;
        const SHIP_THRUST = 5; 
        const SHIP_TURN_SPEED = 360; 
        const BULLET_SPEED = 500;
        const BULLET_MAX = 10;
        const BULLET_DIST = 0.6; 
        const ASTEROID_NUM = 5;
        const ASTEROID_SIZE = 100;
        const ASTEROID_SPEED = 50;
        const ASTEROID_VERT = 10;
        const ASTEROID_JAG = 0.4;

        const keys = {};

        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (gameOver && e.code === "KeyR") init();
        });
        window.addEventListener("keyup", e => keys[e.code] = false);
        window.addEventListener("resize", resize);

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            score = 0;
            gameOver = false;
            scoreEl.innerText = score;
            msgEl.style.display = "none";
            
            ship = {
                x: width / 2,
                y: height / 2,
                r: SHIP_SIZE / 2,
                a: 90 / 180 * Math.PI,
                rot: 0,
                thrusting: false,
                thrust: { x: 0, y: 0 }
            };

            asteroids = [];
            for (let i = 0; i < ASTEROID_NUM; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * width);
                    y = Math.floor(Math.random() * height);
                } while (distBetweenPoints(ship.x, ship.y, x, y) < ASTEROID_SIZE * 2);
                asteroids.push(newAsteroid(x, y, Math.ceil(ASTEROID_SIZE / 2)));
            }
            bullets = [];
        }

        function newAsteroid(x, y, r) {
            let lvlMult = 1 + (score / 1000);
            let ast = {
                x: x, y: y,
                xv: Math.random() * ASTEROID_SPEED * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
                yv: Math.random() * ASTEROID_SPEED * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
                r: r,
                a: Math.random() * Math.PI * 2,
                vert: Math.floor(Math.random() * (ASTEROID_VERT + 1) + ASTEROID_VERT / 2),
                offs: []
            };
            for (let i = 0; i < ast.vert; i++) {
                ast.offs.push(Math.random() * ASTEROID_JAG * 2 + 1 - ASTEROID_JAG);
            }
            return ast;
        }

        function distBetweenPoints(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function shootBullet() {
            if (bullets.length < BULLET_MAX) {
                bullets.push({
                    x: ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                    y: ship.y - 4 / 3 * ship.r * Math.sin(ship.a),
                    xv: BULLET_SPEED * Math.cos(ship.a) / FPS,
                    yv: -BULLET_SPEED * Math.sin(ship.a) / FPS,
                    dist: 0
                });
            }
        }

        function update() {
            if (gameOver) return;

            ship.rot = (keys["ArrowLeft"] || keys["KeyA"] ? SHIP_TURN_SPEED : keys["ArrowRight"] || keys["KeyD"] ? -SHIP_TURN_SPEED : 0) / 180 * Math.PI / FPS;
            ship.a += ship.rot;

            if (keys["ArrowUp"] || keys["KeyW"]) {
                ship.thrusting = true;
                ship.thrust.x += SHIP_THRUST * Math.cos(ship.a) / FPS;
                ship.thrust.y -= SHIP_THRUST * Math.sin(ship.a) / FPS;
            } else {
                ship.thrusting = false;
                ship.thrust.x -= FRICTION * ship.thrust.x / FPS;
                ship.thrust.y -= FRICTION * ship.thrust.y / FPS;
            }

            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;

            if (ship.x < 0 - ship.r) ship.x = width + ship.r;
            else if (ship.x > width + ship.r) ship.x = 0 - ship.r;
            if (ship.y < 0 - ship.r) ship.y = height + ship.r;
            else if (ship.y > height + ship.r) ship.y = 0 - ship.r;

            if (keys["Space"]) {
                shootBullet();
                keys["Space"] = false; 
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].xv;
                bullets[i].y += bullets[i].yv;
                bullets[i].dist += Math.sqrt(bullets[i].xv**2 + bullets[i].yv**2);

                if (bullets[i].x < 0) bullets[i].x = width; else if (bullets[i].x > width) bullets[i].x = 0;
                if (bullets[i].y < 0) bullets[i].y = height; else if (bullets[i].y > height) bullets[i].y = 0;

                if (bullets[i].dist > BULLET_DIST * width) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = asteroids.length - 1; j >= 0; j--) {
                    if (distBetweenPoints(bullets[i].x, bullets[i].y, asteroids[j].x, asteroids[j].y) < asteroids[j].r) {
                        let r = asteroids[j].r;
                        let x = asteroids[j].x;
                        let y = asteroids[j].y;
                        bullets.splice(i, 1);
                        if (r > ASTEROID_SIZE / 8) {
                            asteroids.push(newAsteroid(x, y, r / 2));
                            asteroids.push(newAsteroid(x, y, r / 2));
                        }
                        asteroids.splice(j, 1);
                        score += 100;
                        scoreEl.innerText = score;
                        break;
                    }
                }
            }

            for (let ast of asteroids) {
                ast.x += ast.xv;
                ast.y += ast.yv;
                if (ast.x < 0 - ast.r) ast.x = width + ast.r; else if (ast.x > width + ast.r) ast.x = 0 - ast.r;
                if (ast.y < 0 - ast.r) ast.y = height + ast.r; else if (ast.y > height + ast.r) ast.y = 0 - ast.r;
                if (distBetweenPoints(ship.x, ship.y, ast.x, ast.y) < ship.r + ast.r) {
                    gameOver = true;
                    msgEl.style.display = "block";
                }
            }

            if (asteroids.length === 0) {
                for (let i = 0; i < ASTEROID_NUM + Math.floor(score/1000); i++) {
                    asteroids.push(newAsteroid(Math.random() * width, Math.random() * height, Math.ceil(ASTEROID_SIZE / 2)));
                }
            }
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(ship.x + 4/3 * ship.r * Math.cos(ship.a), ship.y - 4/3 * ship.r * Math.sin(ship.a));
            ctx.lineTo(ship.x - ship.r * (2/3 * Math.cos(ship.a) + Math.sin(ship.a)), ship.y + ship.r * (2/3 * Math.sin(ship.a) - Math.cos(ship.a)));
            ctx.lineTo(ship.x - ship.r * (2/3 * Math.cos(ship.a) - Math.sin(ship.a)), ship.y + ship.r * (2/3 * Math.sin(ship.a) + Math.cos(ship.a)));
            ctx.closePath();
            ctx.stroke();

            if (ship.thrusting) {
                ctx.beginPath();
                ctx.moveTo(ship.x - ship.r * (2/3 * Math.cos(ship.a) + 0.5 * Math.sin(ship.a)), ship.y + ship.r * (2/3 * Math.sin(ship.a) - 0.5 * Math.cos(ship.a)));
                ctx.lineTo(ship.x - ship.r * 5/3 * Math.cos(ship.a), ship.y + ship.r * 5/3 * Math.sin(ship.a));
                ctx.lineTo(ship.x - ship.r * (2/3 * Math.cos(ship.a) - 0.5 * Math.sin(ship.a)), ship.y + ship.r * (2/3 * Math.sin(ship.a) + 0.5 * Math.cos(ship.a)));
                ctx.stroke();
            }

            for (let ast of asteroids) {
                ctx.beginPath();
                ctx.moveTo(ast.x + ast.r * ast.offs[0] * Math.cos(ast.a), ast.y + ast.r * ast.offs[0] * Math.sin(ast.a));
                for (let j = 1; j < ast.vert; j++) {
                    ctx.lineTo(ast.x + ast.r * ast.offs[j] * Math.cos(ast.a + j * Math.PI * 2 / ast.vert), ast.y + ast.r * ast.offs[j] * Math.sin(ast.a + j * Math.PI * 2 / ast.vert));
                }
                ctx.closePath();
                ctx.stroke();
            }

            ctx.fillStyle = "white";
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
