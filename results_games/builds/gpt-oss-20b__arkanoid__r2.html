<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;}
  canvas{background:#111;display:block;margin:0 auto;}
  #info{margin-top:10px;}
</style>
</head>
<body tabindex="0">
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="info"></div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const info=document.getElementById('info');
canvas.tabIndex=0;
canvas.focus();

const paddleWidth=100, paddleHeight=20, paddleSpeed=7;
const ballRadius=10, ballSpeed=4;
const brickRowCount=5, brickColumnCount=10;
const brickWidth=70, brickHeight=20, brickPadding=5, brickOffsetTop=50, brickOffsetLeft=35;

let paddleX=(canvas.width-paddleWidth)/2;
let rightPressed=false, leftPressed=false;
let ballX=canvas.width/2, ballY=canvas.height-30;
let ballDX=ballSpeed*Math.random()*2-1, ballDY=-ballSpeed;
let bricks=[];
let score=0, lives=3;
let gameOver=false, gameWon=false;

function initBricks(){
  bricks=[];
  for(let c=0;c<brickColumnCount;c++){
    bricks[c]=[];
    for(let r=0;r<brickRowCount;r++){
      const brickX=brickOffsetLeft+c*(brickWidth+brickPadding);
      const brickY=brickOffsetTop+r*(brickHeight+brickPadding);
      bricks[c][r]={x:brickX,y:brickY,status:1};
    }
  }
}
initBricks();

function drawPaddle(){
  ctx.fillStyle="#0095DD";
  ctx.fillRect(paddleX,canvas.height-paddleHeight-10,paddleWidth,paddleHeight);
}
function drawBall(){
  ctx.beginPath();
  ctx.arc(ballX,ballY,ballRadius,0,Math.PI*2);
  ctx.fillStyle="#0095DD";
  ctx.fill();
  ctx.closePath();
}
function drawBricks(){
  for(let c=0;c<brickColumnCount;c++){
    for(let r=0;r<brickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        ctx.fillStyle="#0095DD";
        ctx.fillRect(b.x,b.y,brickWidth,brickHeight);
      }
    }
  }
}
function drawInfo(){
  info.textContent=`Score: ${score}  Lives: ${lives}`;
}
function collisionDetection(){
  for(let c=0;c<brickColumnCount;c++){
    for(let r=0;r<brickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        if(ballX+ballRadius>b.x && ballX-ballRadius<b.x+brickWidth &&
           ballY+ballRadius>b.y && ballY-ballRadius<b.y+brickHeight){
          ballDY=-ballDY;
          b.status=0;
          score+=10;
          if(score===brickRowCount*brickColumnCount*10){
            gameWon=true;
          }
        }
      }
    }
  }
}
function resetBall(){
  ballX=canvas.width/2;
  ballY=canvas.height-30;
  ballDX=ballSpeed*Math.random()*2-1;
  ballDY=-ballSpeed;
}
function keyDownHandler(e){
  if(e.key==='Right' || e.key==='ArrowRight' || e.key==='d' || e.key==='D'){
    rightPressed=true;
  }else if(e.key==='Left' || e.key==='ArrowLeft' || e.key==='a' || e.key==='A'){
    leftPressed=true;
  }else if(e.key==='r' || e.key==='R'){
    if(gameOver || gameWon){
      restartGame();
    }
  }
}
function keyUpHandler(e){
  if(e.key==='Right' || e.key==='ArrowRight' || e.key==='d' || e.key==='D'){
    rightPressed=false;
  }else if(e.key==='Left' || e.key==='ArrowLeft' || e.key==='a' || e.key==='A'){
    leftPressed=false;
  }
}
document.addEventListener('keydown',keyDownHandler,false);
document.addEventListener('keyup',keyUpHandler,false);

function restartGame(){
  lives=3;
  score=0;
  gameOver=false;
  gameWon=false;
  initBricks();
  resetBall();
  paddleX=(canvas.width-paddleWidth)/2;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBricks();
  drawPaddle();
  drawBall();
  drawInfo();
  collisionDetection();

  if(ballX+ballDX>canvas.width-ballRadius || ballX+ballDX<ballRadius){
    ballDX=-ballDX;
  }
  if(ballY+ballDY<ballRadius){
    ballDY=-ballDY;
  }else if(ballY+ballDY>canvas.height-ballRadius){
    lives--;
    if(!lives){
      gameOver=true;
    }else{
      resetBall();
      paddleX=(canvas.width-paddleWidth)/2;
    }
  }

  if(rightPressed && paddleX<paddleWidth*2){
    paddleX+=paddleSpeed;
  }else if(leftPressed && paddleX>0){
    paddleX-=paddleSpeed;
  }

  if(paddleX+ballDX>canvas.width-paddleWidth-10 && ballY+ballDY>canvas.height-paddleHeight-10){
    ballDY=-ballDY;
  }

  if(!gameOver && !gameWon){
    requestAnimationFrame(draw);
  }else{
    ctx.font="48px sans-serif";
    ctx.fillStyle="#0095DD";
    ctx.textAlign="center";
    ctx.fillText(gameWon?"You Win! Press R to Restart":"Game Over! Press R to Restart",canvas.width/2,canvas.height/2);
  }
}
draw();
</script>
</body>
</html>
