<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tiny Roguelike</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #game { line-height: 1; font-size: 18px; white-space: pre; cursor: default; }
        #ui { margin-top: 10px; font-size: 16px; color: #aaa; }
        .stat { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="ui">HP: <span id="hp" class="stat">20</span> | Floor: <span id="lvl" class="stat">1</span> | <span id="msg">Find the exit (G)!</span></div>
    <script>
        const W = 40, H = 20;
        let map = [], player = {x:0, y:0, hp:20, lvl:1};
        let msg = "Find the exit (G)!";

        function init() {
            map = Array(H).fill().map(() => Array(W).fill('#'));
            let rooms = [];
            for(let i=0; i<6; i++) {
                let rw = Math.floor(Math.random()*6)+3, rh = Math.floor(Math.random()*6)+3;
                let rx = Math.floor(Math.random()*(W-rw-1))+1, ry = Math.floor(Math.random()*(H-rh-1))+1;
                rooms.push({x:rx, y:ry, w:rw, h:rh});
                for(let y=ry; y<ry+rh; y++) for(let x=rx; x<rx+rw; x++) map[y][x] = '.';
            }
            for(let i=1; i<rooms.length; i++) {
                let p1 = {x:rooms[i-1].x+Math.floor(rooms[i-1].w/2), y:rooms[i-1].y+Math.floor(rooms[i-1].h/2)};
                let p2 = {x:rooms[i].x+Math.floor(rooms[i].w/2), y:rooms[i].y+Math.floor(rooms[i].h/2)};
                for(let x=Math.min(p1.x,p2.x); x<=Math.max(p1.x,p2.x); x++) map[p1.y][x] = '.';
                for(let y=Math.min(p1.y,p2.y); y<=Math.max(p1.y,p2.y); y++) map[y][p2.x] = '.';
            }
            player.x = rooms[0].x + 1; player.y = rooms[0].y + 1;
            map[rooms[rooms.length-1].y+1][rooms[rooms.length-1].x+1] = 'G';
            for(let y=0; y<H; y++) for(let x=0; x<W; x++) if(map[y][x]==='.' && Math.random()<0.1) map[y][x]='M';
            render();
        }

        function render() {
            let out = "";
            for(let y=0; y<H; y++) {
                for(let x=0; x<W; x++) {
                    if(x==player.x && y==player.y) out += '@';
                    else out += map[y][x];
                }
                out += "\n";
            }
            document.getElementById('game').textContent = out;
            document.getElementById('hp').textContent = player.hp;
            document.getElementById('lvl').textContent = player.lvl;
            document.getElementById('msg').textContent = msg;
        }

        window.addEventListener('keydown', e => {
            let dx=0, dy=0;
            if(e.key==='ArrowUp' || e.key==='w') dy=-1;
            else if(e.key==='ArrowDown' || e.key==='s') dy=1;
            else if(e.key==='ArrowLeft' || e.key==='a') dx=-1;
            else if(e.key==='ArrowRight' || e.key==='d') dx=1;
            else return;

            let nx = player.x + dx, ny = player.y + dy;
            if(nx>=0 && nx<W && ny>=0 && ny<H) {
                let cell = map[ny][nx];
                if(cell==='#') msg = "You hit a wall!";
                else if(cell==='M') {
                    player.hp -= Math.floor(Math.random()*3);
                    msg = "Fought a monster!";
                    map[ny][nx] = '.';
                    player.x = nx; player.y = ny;
                } else if(cell==='G') {
                    player.lvl++;
                    msg = "Descended deeper...";
                    init(); return;
                } else {
                    msg = "Walking...";
                    player.x = nx; player.y = ny;
                }
            }
            if(player.hp<=0) { msg = "YOU DIED!"; render(); window.removeEventListener('keydown', arguments); }
            render();
        });

        init();
    </script>
</body>
</html>
