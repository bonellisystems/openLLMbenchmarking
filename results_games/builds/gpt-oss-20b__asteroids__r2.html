<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;}
  canvas{display:block;margin:auto;background:#000;}
  #info{position:absolute;top:10px;left:10px;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width, height = canvas.height;
  const keys = {};
  let lastShot = 0;
  const bulletCooldown = 200; // ms
  const ship = {x: width/2, y: height/2, angle: 0, radius: 10, speed: 0, vx:0, vy:0};
  const asteroids = [];
  const bullets = [];
  let score = 0;
  let lives = 3;
  let state = 'playing'; // 'playing' or 'gameover'

  function initGame() {
    ship.x = width/2; ship.y = height/2; ship.angle = 0; ship.vx = 0; ship.vy = 0;
    asteroids.length = 0;
    bullets.length = 0;
    score = 0;
    lives = 3;
    state = 'playing';
    createAsteroids(5);
  }

  function createAsteroids(count) {
    for (let i=0;i<count;i++) {
      let a = randomAsteroid();
      // Ensure not too close to ship
      while (dist(a.x,a.y,ship.x,ship.y) < 100) {
        a = randomAsteroid();
      }
      asteroids.push(a);
    }
  }

  function randomAsteroid() {
    const size = 'large';
    const radius = 40;
    const x = Math.random()*width;
    const y = Math.random()*height;
    const angle = Math.random()*Math.PI*2;
    const speed = 0.5 + Math.random()*0.5;
    return {x,y,vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,radius,size};
  }

  function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}

  function wrap(val, max){return (val<0?val+max:val>max?val-max:val);}

  function update(dt){
    if(state!=='playing') return;
    // Ship controls
    if(keys['ArrowLeft']||keys['KeyA']) ship.angle -= 0.05;
    if(keys['ArrowRight']||keys['KeyD']) ship.angle += 0.05;
    if(keys['ArrowUp']||keys['KeyW']){
      ship.vx += Math.cos(ship.angle)*0.1;
      ship.vy += Math.sin(ship.angle)*0.1;
    }
    // Fire
    if((keys['Space']||keys['KeyK']) && Date.now()-lastShot>bulletCooldown){
      fireBullet();
      lastShot = Date.now();
    }
    // Update ship
    ship.x = wrap(ship.x + ship.vx, width);
    ship.y = wrap(ship.y + ship.vy, height);
    ship.vx *= 0.99; ship.vy *= 0.99;

    // Update bullets
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.x = wrap(b.x + b.vx, width);
      b.y = wrap(b.y + b.vy, height);
      b.life -= dt;
      if(b.life<=0) bullets.splice(i,1);
    }

    // Update asteroids
    for(const a of asteroids){
      a.x = wrap(a.x + a.vx, width);
      a.y = wrap(a.y + a.vy, height);
    }

    // Collisions
    // Ship vs asteroid
    for(const a of asteroids){
      if(dist(ship.x,ship.y,a.x,a.y) < ship.radius + a.radius){
        lives--;
        if(lives<=0){
          state='gameover';
        }else{
          resetShip();
        }
        break;
      }
    }

    // Bullet vs asteroid
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      for(let j=asteroids.length-1;j>=0;j--){
        const a = asteroids[j];
        if(dist(b.x,b.y,a.x,a.y) < 2 + a.radius){
          bullets.splice(i,1);
          splitAsteroid(a);
          asteroids.splice(j,1);
          break;
        }
      }
    }
  }

  function resetShip(){
    ship.x = width/2; ship.y = height/2; ship.vx=0; ship.vy=0; ship.angle=0;
  }

  function fireBullet(){
    const speed = 5;
    const vx = Math.cos(ship.angle)*speed + ship.vx;
    const vy = Math.sin(ship.angle)*speed + ship.vy;
    bullets.push({x:ship.x, y:ship.y, vx, vy, life:60});
  }

  function splitAsteroid(a){
    if(a.size==='large'){
      score+=20;
      for(let i=0;i<2;i++){
        const angle = Math.random()*Math.PI*2;
        const speed = 0.5 + Math.random()*0.5;
        asteroids.push({x:a.x, y:a.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, radius:20, size:'medium'});
      }
    }else if(a.size==='medium'){
      score+=50;
      for(let i=0;i<2;i++){
        const angle = Math.random()*Math.PI*2;
        const speed = 0.5 + Math.random()*0.5;
        asteroids.push({x:a.x, y:a.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, radius:10, size:'small'});
      }
    }else{
      score+=100;
    }
  }

  function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,width,height);
    // Draw ship
    ctx.save();
    ctx.translate(ship.x,ship.y);
    ctx.rotate(ship.angle);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,-10);
    ctx.lineTo(7,10);
    ctx.lineTo(-7,10);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Draw asteroids
    for(const a of asteroids){
      ctx.strokeStyle='#fff';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(a.x,a.y,a.radius,0,Math.PI*2);
      ctx.stroke();
    }

    // Draw bullets
    ctx.fillStyle='#ff0';
    for(const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x,b.y,2,0,Math.PI*2);
      ctx.fill();
    }

    // UI
    ctx.fillStyle='#fff';
    ctx.font='20px Arial';
    ctx.fillText('Score: '+score,10,30);
    ctx.fillText('Lives: '+lives,10,60);
    if(state==='gameover'){
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle='#fff';
      ctx.font='40px Arial';
      ctx.textAlign='center';
      ctx.fillText('Game Over',width/2, height/2-20);
      ctx.font='20px Arial';
      ctx.fillText('Press R to Restart',width/2, height/2+20);
    }
  }

  let lastTime = performance.now();
  function loop(){
    const now = performance.now();
    const dt = now - lastTime;
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown',(e)=>{
    keys[e.code]=true;
    if(state==='gameover' && e.code==='KeyR'){
      initGame();
    }
  });
  window.addEventListener('keyup',(e)=>{keys[e.code]=false;});

  initGame();
  loop();
})();
</script>
</body>
</html>
