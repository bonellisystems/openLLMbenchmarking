<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #ecf0f1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Game Constants
            const GRAVITY = 0.5;
            const JUMP_FORCE = -11;
            const MOVE_SPEED = 5;
            const PLATFORM_WIDTH = 60;
            const PLATFORM_HEIGHT = 15;
            const PLATFORM_GAP_MIN = 60;
            const PLATFORM_GAP_MAX = 120;
            
            // Game State
            let player = {
                x: 185,
                y: 400,
                w: 30,
                h: 30,
                vx: 0,
                vy: 0
            };
            
            let platforms = [];
            let keys = {};
            let score = 0;
            let gameOver = false;
            let scrollSpeed = 0;
            
            function init() {
                player.x = 185;
                player.y = 400;
                player.vx = 0;
                player.vy = 0;
                score = 0;
                gameOver = false;
                platforms = [];
                
                // Generate initial platforms
                let y = 500;
                while (y > 0) {
                    let x = Math.random() * (canvas.width - PLATFORM_WIDTH);
                    platforms.push({ x: x, y: y });
                    y -= (PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN));
                }
            }
            
            function update() {
                if (gameOver) return;
                
                // Input Handling
                if (keys['ArrowLeft']) player.vx = -MOVE_SPEED;
                else if (keys['ArrowRight']) player.vx = MOVE_SPEED;
                else player.vx = 0;
                
                // Physics
                player.vy += GRAVITY;
                player.x += player.vx;
                player.y += player.vy;
                
                // Screen Wrapping
                if (player.x + player.w < 0) player.x = canvas.width;
                else if (player.x > canvas.width) player.x = -player.w;
                
                // Platform Collision
                let onPlatform = false;
                for (let p of platforms) {
                    // Check collision only if falling
                    if (player.vy > 0) {
                        if (player.x + player.w > p.x && 
                            player.x < p.x + PLATFORM_WIDTH &&
                            player.y + player.h >= p.y &&
                            player.y + player.h <= p.y + PLATFORM_HEIGHT + player.vy) {
                            
                            player.vy = JUMP_FORCE;
                            onPlatform = true;
                        }
                    }
                }
                
                // Platform Movement & Generation
                for (let i = platforms.length - 1; i >= 0; i--) {
                    let p = platforms[i];
                    p.y += 2; // Move platforms down
                    
                    // Remove off-screen platforms and add new ones
                    if (p.y > canvas.height) {
                        platforms.splice(i, 1);
                        let newY = 0;
                        // Ensure new platform is reachable
                        let lastY = platforms.length > 0 ? platforms[platforms.length - 1].y : canvas.height;
                        let gap = Math.max(PLATFORM_GAP_MIN, lastY - canvas.height + 100);
                        if (gap < PLATFORM_GAP_MIN) gap = PLATFORM_GAP_MIN;
                        
                        // Actually, simpler logic: just place at top
                        // But we need to ensure connectivity
                        // Let's just place at top with random X
                        let x = Math.random() * (canvas.width - PLATFORM_WIDTH);
                        platforms.push({ x: x, y: 0 });
                        score++;
                    }
                }
                
                // Game Over Condition
                if (player.y > canvas.height) {
                    gameOver = true;
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw Player
                ctx.fillStyle = '#27ae60';
                ctx.fillRect(player.x, player.y, player.w, player.h);
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.fillRect(player.x + 5, player.y + 5, 5, 5);
                ctx.fillRect(player.x + 20, player.y + 5, 5, 5);
                
                // Draw Platforms
                ctx.fillStyle = '#d35400';
                for (let p of platforms) {
                    ctx.fillRect(p.x, p.y, PLATFORM_WIDTH, PLATFORM_HEIGHT);
                    // Highlight
                    ctx.fillStyle = '#e67e22';
                    ctx.fillRect(p.x, p.y, PLATFORM_WIDTH, 4);
                    ctx.fillStyle = '#d35400';
                }
                
                // Draw Score
                ctx.fillStyle = '#333';
                ctx.font = '20px Arial';
                ctx.fillText('Score: ' + score, 10, 30);
                
                // Draw Game Over Screen
                if (gameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.font = '30px Arial';
                    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
                    
                    ctx.font = '20px Arial';
                    ctx.fillText('Press Space to Restart', canvas.width / 2, canvas.height / 2 + 40);
                    ctx.textAlign = 'left';
                }
            }
            
            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }
            
            // Event Listeners
            window.addEventListener('keydown', function(e) {
                keys[e.code] = true;
                if (gameOver && e.code === 'Space') {
                    init();
                }
            });
            
            window.addEventListener('keyup', function(e) {
                keys[e.code] = false;
            });
            
            // Start Game
            init();
            loop();
        })();
    </script>
</body>
</html>
