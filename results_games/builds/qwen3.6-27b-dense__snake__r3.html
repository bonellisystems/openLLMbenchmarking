<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #111;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
overflow: hidden;
}
#gameContainer {
position: relative;
display: flex;
flex-direction: column;
align-items: center;
}
#scoreBoard {
display: flex;
justify-content: space-between;
width: 602px;
margin-bottom: 8px;
color: #aaa;
font-size: 18px;
}
#scoreBoard span { color: #4f4; }
canvas {
border: 1px solid #333;
background: #1a1a2e;
display: block;
}
#overlay {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
text-align: center;
color: #fff;
pointer-events: none;
}
#overlay h1 {
font-size: 48px;
margin-bottom: 10px;
text-shadow: 0 0 20px rgba(0,255,0,0.5);
}
#overlay p {
font-size: 18px;
color: #aaa;
}
#overlay .score-display {
font-size: 24px;
color: #4f4;
margin: 10px 0;
}
</style>
</head>
<body>
<div id="gameContainer">
<div id="scoreBoard">
<div>Score: <span id="score">0</span></div>
<div>High Score: <span id="highScore">0</span></div>
</div>
<canvas id="gameCanvas" width="602" height="602"></canvas>
<div id="overlay">
<h1>SNAKE</h1>
<p>Press any arrow key to start</p>
</div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');

const GRID = 20;
const COLS = 30;
const ROWS = 30;
const CELL = canvas.width / COLS;

let snake, direction, nextDirection, food, score, highScore, gameState, speed, lastTime, accumulator, particles;

highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
highScoreEl.textContent = highScore;

function init() {
    snake = [
        { x: 15, y: 15 },
        { x: 14, y: 15 },
        { x: 13, y: 15 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = 110;
    scoreEl.textContent = score;
    particles = [];
    spawnFood();
    gameState = 'waiting';
    overlay.innerHTML = '<h1>SNAKE</h1><p>Press any arrow key to start</p>';
    overlay.style.display = 'block';
}

function spawnFood() {
    let pos;
    do {
        pos = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
        };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
}

function createParticles(x, y) {
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: x * CELL + CELL / 2,
            y: y * CELL + CELL / 2,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1,
            size: Math.random() * 4 + 2,
            color: Math.random() > 0.5 ? '#ff4444' : '#ff8844'
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        p.vx *= 0.96;
        p.vy *= 0.96;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function update() {
    direction = { ...nextDirection };
    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
    }

    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        createParticles(food.x, food.y);
        spawnFood();
        if (speed > 50) speed -= 1.5;
    } else {
        snake.pop();
    }
}

function gameOver() {
    gameState = 'dead';
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        highScoreEl.textContent = highScore;
    }
    overlay.innerHTML = '<h1>GAME OVER</h1><div class="score-display">Score: ' + score + '</div><p>Press any arrow key to restart</p>';
    overlay.style.display = 'block';
}

function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(canvas.width, y * CELL);
        ctx.stroke();
    }
}

function drawSnake() {
    snake.forEach((seg, i) => {
        const t = i / snake.length;
        const r = Math.floor(0 + t * 0);
        const g = Math.floor(220 - t * 120);
        const b = Math.floor(80 - t * 40);
        const padding = 1;

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.shadowColor = i === 0 ? 'rgba(0,255,0,0.6)' : 'transparent';
        ctx.shadowBlur = i === 0 ? 10 : 0;

        const radius = i === 0 ? 5 : 3;
        const x = seg.x * CELL + padding;
        const y = seg.y * CELL + padding;
        const w = CELL - padding * 2;
        const h = CELL - padding * 2;

        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.fill();

        ctx.shadowBlur = 0;

        if (i === 0) {
            ctx.fillStyle = '#fff';
            const eyeSize = 3;
            let ex1, ey1, ex2, ey2;
            const cx = seg.x * CELL + CELL / 2;
            const cy = seg.y * CELL + CELL / 2;

            if (direction.x === 1) {
                ex1 = cx + 4; ey1 = cy - 4;
                ex2 = cx + 4; ey2 = cy + 4;
            } else if (direction.x === -1) {
                ex1 = cx - 4; ey1 = cy - 4;
                ex2 = cx - 4; ey2 = cy + 4;
            } else if (direction.y === -1) {
                ex1 = cx - 4; ey1 = cy - 4;
                ex2 = cx + 4; ey2 = cy - 4;
            } else {
                ex1 = cx - 4; ey1 = cy + 4;
                ex2 = cx + 4; ey2 = cy + 4;
            }

            ctx.beginPath();
            ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(ex1 + direction.x, ey1 + direction.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ex2 + direction.x, ey2 + direction.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

function drawFood() {
    const pulse = Math.sin(Date.now() / 200) * 2;
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const r = CELL / 2 - 3 + pulse;

    ctx.shadowColor = 'rgba(255,50,50,0.8)';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ff3333';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.arc(cx - 2, cy - 2, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawFood();
    drawSnake();
    updateParticles();
    drawParticles();
}

function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);

    if (!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime;
    lastTime = timestamp;

    if (gameState === 'playing') {
        accumulator += delta;
        while (accumulator >= speed) {
            update();
            accumulator -= speed;
            if (gameState !== 'playing') break;
        }
    }

    draw();
}

let accumulator = 0;
let lastTime = null;

document.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
        e.preventDefault();
    }

    if (gameState === 'waiting' || gameState === 'dead') {
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
            if (gameState === 'dead') init();
            gameState = 'playing';
            overlay.style.display = 'none';
            accumulator = 0;
            lastTime = null;

            if (e.code === 'ArrowUp') nextDirection = { x: 0, y: -1 };
            else if (e.code === 'ArrowDown') nextDirection = { x: 0, y: 1 };
            else if (e.code === 'ArrowLeft') nextDirection = { x: -1, y: 0 };
            else if (e.code === 'ArrowRight') nextDirection = { x: 1, y: 0 };
        }
        return;
    }

    if (gameState === 'playing') {
        if (e.code === 'ArrowUp' && direction.y !== 1) nextDirection = { x: 0, y: -1 };
        else if (e.code === 'ArrowDown' && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        else if (e.code === 'ArrowLeft' && direction.x !== 1) nextDirection = { x: -1, y: 0 };
        else if (e.code === 'ArrowRight' && direction.x !== -1) nextDirection = { x: 1, y: 0 };
    }
});

init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
