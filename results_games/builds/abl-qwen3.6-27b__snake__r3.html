<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #1a1a2e;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
overflow: hidden;
}
#gameContainer {
position: relative;
}
canvas {
display: block;
border: 3px solid #e94560;
border-radius: 8px;
box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
}
#score {
position: absolute;
top: -45px;
left: 0;
right: 0;
text-align: center;
color: #e94560;
font-size: 24px;
font-weight: bold;
letter-spacing: 2px;
text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
}
#overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(26, 26, 46, 0.92);
border-radius: 8px;
z-index: 10;
}
#overlay.hidden { display: none; }
#overlay h1 {
color: #e94560;
font-size: 42px;
margin-bottom: 10px;
text-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
}
#overlay p {
color: #eee;
font-size: 18px;
margin-bottom: 8px;
}
#overlay .final-score {
color: #0f3460;
font-size: 28px;
font-weight: bold;
margin: 15px 0;
background: #e94560;
padding: 8px 24px;
border-radius: 20px;
}
#overlay .hint {
color: #aaa;
font-size: 14px;
margin-top: 20px;
}
</style>
</head>
<body>
<div id="gameContainer">
<div id="score">SCORE: 0</div>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
<h1>SNAKE</h1>
<p>Use arrow keys or WASD to move</p>
<p class="hint">Press any key to start</p>
</div>
</div>
<script>
(function() {
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');

const GRID = 20;
const COLS = 25;
const ROWS = 25;
canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

let snake, direction, nextDirection, food, score, gameRunning, gameLoop, speed;

function init() {
    snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    speed = 120;
    scoreEl.textContent = 'SCORE: 0';
    placeFood();
}

function placeFood() {
    let valid = false;
    while (!valid) {
        food = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
        };
        valid = true;
        for (let seg of snake) {
            if (seg.x === food.x && seg.y === food.y) {
                valid = false;
                break;
            }
        }
    }
}

function update() {
    direction = { ...nextDirection };
    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
    }

    // Self collision
    for (let seg of snake) {
        if (seg.x === head.x && seg.y === head.y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = 'SCORE: ' + score;
        placeFood();
        // Speed up slightly
        if (speed > 60) speed -= 2;
        clearInterval(gameLoop);
        gameLoop = setInterval(update, speed);
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    // Background
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
    }

    // Snake body
    for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const t = i / snake.length;
        if (i === 0) {
            // Head
            ctx.fillStyle = '#e94560';
            ctx.shadowColor = 'rgba(233, 69, 96, 0.6)';
            ctx.shadowBlur = 12;
        } else {
            const r = Math.round(233 - (233 - 15) * t);
            const g = Math.round(69 - (69 - 50) * t);
            const b = Math.round(96 - (96 - 80) * t);
            ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
            ctx.shadowBlur = 0;
        }
        const padding = 1;
        ctx.beginPath();
        ctx.roundRect(
            seg.x * GRID + padding,
            seg.y * GRID + padding,
            GRID - padding * 2,
            GRID - padding * 2,
            4
        );
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Snake eyes on head
    const head = snake[0];
    ctx.fillStyle = '#fff';
    const eyeSize = 3;
    let ex1, ey1, ex2, ey2;
    if (direction.x === 1) {
        ex1 = head.x * GRID + 14; ey1 = head.y * GRID + 5;
        ex2 = head.x * GRID + 14; ey2 = head.y * GRID + 13;
    } else if (direction.x === -1) {
        ex1 = head.x * GRID + 5; ey1 = head.y * GRID + 5;
        ex2 = head.x * GRID + 5; ey2 = head.y * GRID + 13;
    } else if (direction.y === -1) {
        ex1 = head.x * GRID + 5; ey1 = head.y * GRID + 5;
        ex2 = head.x * GRID + 13; ey2 = head.y * GRID + 5;
    } else {
        ex1 = head.x * GRID + 5; ey1 = head.y * GRID + 14;
        ex2 = head.x * GRID + 13; ey2 = head.y * GRID + 14;
    }
    ctx.beginPath();
    ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
    ctx.fill();

    // Food
    ctx.fillStyle = '#0f3460';
    ctx.shadowColor = 'rgba(15, 52, 96, 0.8)';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(
        food.x * GRID + GRID / 2,
        food.y * GRID + GRID / 2,
        GRID / 2 - 2,
        0, Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;

    // Food inner glow
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.arc(
        food.x * GRID + GRID / 2,
        food.y * GRID + GRID / 2,
        GRID / 2 - 5,
        0, Math.PI * 2
    );
    ctx.fill();

    // Food highlight
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(
        food.x * GRID + GRID / 2 - 2,
        food.y * GRID + GRID / 2 - 2,
        3,
        0, Math.PI * 2
    );
    ctx.fill();
}

function gameOver() {
    gameRunning = false;
    clearInterval(gameLoop);
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'GAME OVER';
    overlay.querySelector('p').textContent = 'Your score:';
    const finalScore = document.createElement('div');
    finalScore.className = 'final-score';
    finalScore.textContent = score;
    overlay.appendChild(finalScore);
    overlay.querySelector('.hint').textContent = 'Press any key to play again';
}

function startGame() {
    overlay.classList.add('hidden');
    // Remove old final score if exists
    const old = overlay.querySelector('.final-score');
    if (old) old.remove();
    init();
    draw();
    gameRunning = true;
    gameLoop = setInterval(update, speed);
}

// Keyboard handling
document.addEventListener('keydown', function(e) {
    if (!gameRunning) {
        startGame();
        return;
    }

    switch(e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            e.preventDefault();
            break;
        case 'ArrowDown': case 's': case 'S':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            e.preventDefault();
            break;
        case 'ArrowLeft': case 'a': case 'A':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            e.preventDefault();
            break;
        case 'ArrowRight': case 'd': case 'D':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            e.preventDefault();
            break;
    }
});

// Initial draw
init();
draw();
})();
</script>
</body>
</html>
