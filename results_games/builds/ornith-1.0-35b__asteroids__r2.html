<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

const FRICTION = 0.99;
const SHIP_THRUST = 0.15;
const SHIP_ROTATION = 0.07;
const BULLET_SPEED = 8;
const BULLET_LIFE = 60;
const BULLET_COOLDOWN = 12;
const ASTEROID_SPEED = 1.5;

let ship, bullets, asteroids, particles, score, lives, gameState, respawnTimer, invincibleTimer, highScore;

function generateAsteroidShape(radius) {
    const points = [];
    const numPoints = 8 + Math.floor(Math.random() * 6);
    for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const r = radius * (0.7 + Math.random() * 0.6);
        points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    return points;
}

function createAsteroid(x, y, size) {
    const radii = { large: 40, medium: 20, small: 10 };
    const radius = radii[size] || 40;
    const speed = ASTEROID_SPEED * (1 + Math.random() * 0.5) * (3 - size) / 3;
    const angle = Math.random() * Math.PI * 2;
    return {
        x: x !== undefined ? x : Math.random() * canvas.width,
        y: y !== undefined ? y : Math.random() * canvas.height,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: radius,
        size: size,
        shape: generateAsteroidShape(radius),
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.03
    };
}

function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (dist(x, y, ship.x, ship.y) < 200);
        asteroids.push(createAsteroid(x, y, 'large'));
    }
}

function dist(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function wrap(obj) {
    if (obj.x < -obj.radius) obj.x = canvas.width + obj.radius;
    if (obj.x > canvas.width + obj.radius) obj.x = -obj.radius;
    if (obj.y < -obj.radius) obj.y = canvas.height + obj.radius;
    if (obj.y > canvas.height + obj.radius) obj.y = -obj.radius;
}

function createExplosion(x, y, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            size: 1 + Math.random() * 2
        });
    }
}

function createThrustParticle() {
    const angle = ship.angle + Math.PI + (Math.random() - 0.5) * 0.5;
    const speed = 2 + Math.random() * 2;
    particles.push({
        x: ship.x - Math.cos(ship.angle) * 15,
        y: ship.y - Math.sin(ship.angle) * 15,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 15 + Math.random() * 15,
        maxLife: 30,
        size: 1 + Math.random() * 2
    });
}

function initGame() {
    ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        angle: -Math.PI / 2,
        radius: 15,
        shooting: false,
        shootCooldown: 0
    };
    bullets = [];
    asteroids = [];
    particles = [];
    score = 0;
    lives = 3;
    gameState = 'playing';
    respawnTimer = 0;
    invincibleTimer = 0;
    highScore = highScore || 0;
    spawnAsteroids(4);
}

function resetShip() {
    ship.x = canvas.width / 2;
    ship.y = canvas.height / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.shootCooldown = 0;
    invincibleTimer = 120;
}

function update() {
    if (gameState === 'title') {
        if (keys['Space'] || keys['Enter']) {
            initGame();
            gameState = 'playing';
        }
        return;
    }

    if (gameState === 'gameover') {
        if (keys['Space'] || keys['Enter']) {
            initGame();
            gameState = 'playing';
        }
        return;
    }

    if (gameState === 'playing') {
        // Ship rotation
        if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= SHIP_ROTATION;
        if (keys['ArrowRight'] || keys['KeyD']) ship.angle += SHIP_ROTATION;

        // Thrust
        let thrusting = false;
        if (keys['ArrowUp'] || keys['KeyW']) {
            ship.vx += Math.cos(ship.angle) * SHIP_THRUST;
            ship.vy += Math.sin(ship.angle) * SHIP_THRUST;
            thrusting = true;
        }

        // Shooting
        if (ship.shootCooldown > 0) ship.shootCooldown--;
        if (keys['Space'] && ship.shootCooldown <= 0) {
            bullets.push({
                x: ship.x + Math.cos(ship.angle) * 18,
                y: ship.y + Math.sin(ship.angle) * 18,
                vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.3,
                vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.3,
                life: BULLET_LIFE
            });
            ship.shootCooldown = BULLET_COOLDOWN;
        }

        // Physics
        ship.vx *= FRICTION;
        ship.vy *= FRICTION;
        ship.x += ship.vx;
        ship.y += ship.vy;
        wrap(ship);

        if (thrusting) createThrustParticle();

        if (invincibleTimer > 0) invincibleTimer--;

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            wrap(b);
            if (b.life <= 0) bullets.splice(i, 1);
        }

        // Asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            a.rotation += a.rotSpeed;
            wrap(a);
        }

        // Bullet-asteroid collisions
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            for (let j = asteroids.length - 1; j >= 0; j--) {
                const a = asteroids[j];
                if (dist(b.x, b.y, a.x, a.y) < a.radius) {
                    bullets.splice(i, 1);
                    createExplosion(a.x, a.y, 8);

                    if (a.size === 'large') {
                        asteroids.splice(j, 1);
                        asteroids.push(createAsteroid(a.x, a.y, 'medium'));
                        asteroids.push(createAsteroid(a.x, a.y, 'medium'));
                        score += 20;
                    } else if (a.size === 'medium') {
                        asteroids.splice(j, 1);
                        asteroids.push(createAsteroid(a.x, a.y, 'small'));
                        asteroids.push(createAsteroid(a.x, a.y, 'small'));
                        score += 50;
                    } else {
                        asteroids.splice(j, 1);
                        score += 100;
                    }
                    break;
                }
            }
        }

        // Ship-asteroid collisions
        if (invincibleTimer <= 0) {
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                if (dist(ship.x, ship.y, a.x, a.y) < a.radius + ship.radius - 5) {
                    createExplosion(ship.x, ship.y, 20);
                    lives--;
                    if (lives <= 0) {
                        gameState = 'gameover';
                        if (score > highScore) highScore = score;
                    } else {
                        resetShip();
                    }
                    break;
                }
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.98;
            p.vy *= 0.98;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Respawn asteroids if all destroyed
        if (asteroids.length === 0) {
            spawnAsteroids(4 + Math.floor(score / 500));
        }
    }
}

function drawShip() {
    if (gameState !== 'playing') return;
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-12, -10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-12, 10);
    ctx.closePath();
    ctx.stroke();

    if (keys['ArrowUp'] || keys['KeyW']) {
        ctx.strokeStyle = '#f80';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-8, -4);
        ctx.lineTo(-18 - Math.random() * 8, 0);
        ctx.lineTo(-8, 4);
        ctx.stroke();
    }

    ctx.restore();
}

function drawAsteroids() {
    for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotation);

        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(a.shape[0].x, a.shape[0].y);
        for (let i = 1; i < a.shape.length; i++) {
            ctx.lineTo(a.shape[i].x, a.shape[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }
}

function drawBullets() {
    for (const b of bullets) {
        ctx.fillStyle = '#ff0';
        ctx.shadowColor = '#ff0';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = `rgba(255, ${150 + Math.random() * 100}, 0, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawStars() {
    if (!drawStars.cache) {
        drawStars.cache = [];
        for (let i = 0; i < 200; i++) {
            drawStars.cache.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                brightness: 0.3 + Math.random() * 0.7
            });
        }
    }
    for (const s of drawStars.cache) {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);

    ctx.textAlign = 'right';
    ctx.fillText(`HIGH: ${highScore}`, canvas.width - 20, 30);

    // Lives as ship icons
    ctx.textAlign = 'left';
    for (let i = 0; i < lives; i++) {
        ctx.save();
        ctx.translate(20 + i * 25, 55);
        ctx.rotate(-Math.PI / 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-5, -5);
        ctx.lineTo(-3, 0);
        ctx.lineTo(-5, 5);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
}

function drawTitle() {
    ctx.fillStyle = '#fff';
    ctx.font = '60px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROIDS', canvas.width / 2, canvas.height / 2 - 40);

    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2 + 20);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#666';
    ctx.fillText('ARROW KEYS / WASD TO MOVE  |  SPACE TO SHOOT', canvas.width / 2, canvas.height / 2 + 60);
}

function drawGameOver() {
    ctx.fillStyle = '#fff';
    ctx.font = '50px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

    ctx.font = '24px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, canvas.height / 2 + 20);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 60);
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawStars();

    if (gameState === 'title') {
        drawTitle();
        return;
    }

    drawParticles();
    drawAsteroids();
    drawBullets();
    drawShip();
    drawHUD();

    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
gameState = 'title';
loop();
</script>
</body>
</html>
