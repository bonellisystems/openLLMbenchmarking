<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
canvas{display:block;background:#000;}
#score{position:absolute;top:10px;left:10px;color:#fff;font:20px monospace;pointer-events:none;}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game"></canvas>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});

    // Input
    const keys = {};
    window.addEventListener('keydown',e=>{keys[e.code]=true;});
    window.addEventListener('keyup',e=>{keys[e.code]=false;});

    // Game objects
    const ship = {
        x: W/2, y: H/2,
        vx:0, vy:0,
        angle:0,
        radius:10,
        thrusting:false,
        turn:0,
        dead:false
    };
    const bullets = [];
    const asteroids = [];
    let score=0;

    // Constants
    const FPS=60;
    const FRICTION=0.99;
    const THRUST=0.15;
    const TURN_SPEED=0.07;
    const BULLET_SPEED=6;
    const BULLET_LIFE=60; // frames
    const ASTEROID_SIZES=[0,15,30,60]; // index = size level

    // Helper
    function rand(min,max){return Math.random()*(max-min)+min;}
    function dist(ax,ay,bx,by){return Math.hypot(ax-bx, ay-by);}
    function wrap(obj){
        if(obj.x<0) obj.x+=W;
        if(obj.x>W) obj.x-=W;
        if(obj.y<0) obj.y+=H;
        if(obj.y>H) obj.y-=H;
    }

    // Ship functions
    function updateShip(){
        if(keys['ArrowLeft']) ship.angle-=TURN_SPEED;
        if(keys['ArrowRight']) ship.angle+=TURN_SPEED;
        ship.thrusting = keys['ArrowUp'];
        if(ship.thrusting){
            ship.vx+=Math.cos(ship.angle)*THRUST;
            ship.vy+=Math.sin(ship.angle)*THRUST;
        }
        ship.vx*=FRICTION;
        ship.vy*=FRICTION;
        ship.x+=ship.vx;
        ship.y+=ship.vy;
        wrap(ship);
        if(keys['Space']) fireBullet();
    }

    function drawShip(){
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.strokeStyle='#fff';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo( ship.radius, 0);
        ctx.lineTo(-ship.radius, ship.radius/2);
        ctx.lineTo(-ship.radius, -ship.radius/2);
        ctx.closePath();
        ctx.stroke();
        if(ship.thrusting){
            ctx.beginPath();
            ctx.moveTo(-ship.radius, ship.radius/3);
            ctx.lineTo(-ship.radius-10, 0);
            ctx.lineTo(-ship.radius, -ship.radius/3);
            ctx.stroke();
        }
        ctx.restore();
    }

    // Bullet functions
    function fireBullet(){
        if(bullets.length>10) return; // limit
        const b = {
            x: ship.x + Math.cos(ship.angle)*ship.radius,
            y: ship.y + Math.sin(ship.angle)*ship.radius,
            vx: ship.vx + Math.cos(ship.angle)*BULLET_SPEED,
            vy: ship.vy + Math.sin(ship.angle)*BULLET_SPEED,
            life: BULLET_LIFE
        };
        bullets.push(b);
    }

    function updateBullets(){
        for(let i=bullets.length-1;i>=0;i--){
            const b=bullets[i];
            b.x+=b.vx;
            b.y+=b.vy;
            wrap(b);
            b.life--;
            if(b.life<=0) bullets.splice(i,1);
        }
    }

    function drawBullets(){
        ctx.fillStyle='#fff';
        bullets.forEach(b=>{
            ctx.beginPath();
            ctx.arc(b.x,b.y,2,0,Math.PI*2);
            ctx.fill();
        });
    }

    // Asteroid functions
    function createAsteroid(x,y,size){
        const a = {
            x:x!==undefined?x:rand(0,W),
            y:y!==undefined?y:rand(0,H),
            vx:rand(-1.5,1.5),
            vy:rand(-1.5,1.5),
            size:size, // 3 large,2 med,1 small
            radius:ASTEROID_SIZES[size],
            vertices:[],
            angle:rand(0,Math.PI*2)
        };
        const points = rand(8,12);
        for(let i=0;i<points;i++){
            const angle = (i/points)*Math.PI*2;
            const offset = rand(0.7,1);
            a.vertices.push({x:Math.cos(angle)*a.radius*offset, y:Math.sin(angle)*a.radius*offset});
        }
        asteroids.push(a);
    }

    function initField(){
        for(let i=0;i<5;i++) createAsteroid(undefined,undefined,3);
    }

    function updateAsteroids(){
        for(let i=asteroids.length-1;i>=0;i--){
            const a=asteroids[i];
            a.x+=a.vx;
            a.y+=a.vy;
            wrap(a);
        }
    }

    function drawAsteroids(){
        ctx.strokeStyle='#fff';
        ctx.lineWidth=2;
        asteroids.forEach(a=>{
            ctx.save();
            ctx.translate(a.x,a.y);
            ctx.rotate(a.angle);
            ctx.beginPath();
            a.vertices.forEach((v,idx)=>{
                if(idx===0) ctx.moveTo(v.x,v.y);
                else ctx.lineTo(v.x,v.y);
            });
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        });
    }

    function splitAsteroid(index){
        const a=asteroids[index];
        if(a.size>1){
            for(let i=0;i<2;i++){
                const newA = {
                    x:a.x,
                    y:a.y,
                    vx:a.vx+rand(-1,1),
                    vy:a.vy+rand(-1,1),
                    size:a.size-1,
                    radius:ASTEROID_SIZES[a.size-1],
                    vertices:[],
                    angle:rand(0,Math.PI*2)
                };
                const points = rand(8,12);
                for(let j=0;j<points;j++){
                    const ang = (j/points)*Math.PI*2;
                    const off = rand(0.7,1);
                    newA.vertices.push({x:Math.cos(ang)*newA.radius*off, y:Math.sin(ang)*newA.radius*off});
                }
                asteroids.push(newA);
            }
        }
        asteroids.splice(index,1);
    }

    // Collision detection
    function checkCollisions(){
        // bullets vs asteroids
        for(let i=bullets.length-1;i>=0;i--){
            const b=bullets[i];
            for(let j=asteroids.length-1;j>=0;j--){
                const a=asteroids[j];
                if(dist(b.x,b.y,a.x,a.y)<a.radius){
                    bullets.splice(i,1);
                    splitAsteroid(j);
                    score+=100;
                    break;
                }
            }
        }
        // ship vs asteroids
        for(let i=0;i<asteroids.length;i++){
            const a=asteroids[i];
            if(dist(ship.x,ship.y,a.x,a.y)<a.radius+ship.radius){
                ship.dead=true;
                break;
            }
        }
    }

    // Main loop
    function loop(){
        ctx.clearRect(0,0,W,H);
        updateShip();
        updateBullets();
        updateAsteroids();
        checkCollisions();
        drawShip();
        drawBullets();
        drawAsteroids();
        scoreEl.textContent='Score: '+score;
        if(!ship.dead) requestAnimationFrame(loop);
        else{
            ctx.fillStyle='white';
            ctx.font='48px monospace';
            ctx.textAlign='center';
            ctx.fillText('Game Over',W/2,H/2);
        }
    }

    // Start
    initField();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
