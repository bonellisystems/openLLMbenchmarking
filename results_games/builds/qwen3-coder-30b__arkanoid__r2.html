<!DOCTYPE html>
<html>
<head>
    <title>Arkanoid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            background-color: #111;
            border: 2px solid #444;
        }
        #scoreDisplay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            text-align: center;
            display: none;
        }
        #restartButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="scoreDisplay">Score: 0</div>
    <div id="gameOver">
        Game Over
        <br>
        <button id="restartButton">Restart</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameOverScreen = document.getElementById('gameOver');
        const restartButton = document.getElementById('restartButton');

        // Game variables
        let score = 0;
        let gameRunning = true;
        let bricks = [];
        let paddle = {
            x: canvas.width / 2 - 60,
            y: canvas.height - 30,
            width: 120,
            height: 20,
            speed: 8
        };
        let ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            speed: 5,
            dx: 4,
            dy: -4
        };

        // Create bricks
        function createBricks() {
            const rows = 5;
            const cols = 10;
            const brickWidth = 75;
            const brickHeight = 20;
            const brickPadding = 10;
            const brickOffsetTop = 60;
            const brickOffsetLeft = 30;

            bricks = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks.push({
                        x: brickX,
                        y: brickY,
                        width: brickWidth,
                        height: brickHeight,
                        status: 1,
                        color: `hsl(${r * 60}, 100%, 50%)`
                    });
                }
            }
        }

        // Draw paddle
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = '#4CAF50';
            ctx.fill();
            ctx.closePath();
        }

        // Draw ball
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FF5722';
            ctx.fill();
            ctx.closePath();
        }

        // Draw bricks
        function drawBricks() {
            for (let i = 0; i < bricks.length; i++) {
                if (bricks[i].status === 1) {
                    ctx.beginPath();
                    ctx.rect(bricks[i].x, bricks[i].y, bricks[i].width, bricks[i].height);
                    ctx.fillStyle = bricks[i].color;
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }

        // Move paddle
        function movePaddle(e) {
            if (e.key === 'ArrowLeft') {
                paddle.x = Math.max(0, paddle.x - paddle.speed);
            } else if (e.key === 'ArrowRight') {
                paddle.x = Math.min(canvas.width - paddle.width, paddle.x + paddle.speed);
            }
        }

        // Move ball
        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collision (left/right)
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }

            // Wall collision (top)
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }

            // Paddle collision
            if (
                ball.y + ball.dy > paddle.y - ball.radius &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                ball.dy = -ball.dy;
                // Add some angle based on where the ball hits the paddle
                const hitPosition = (ball.x - paddle.x) / paddle.width;
                ball.dx = (hitPosition - 0.5) * 8;
            }

            // Brick collision
            for (let i = 0; i < bricks.length; i++) {
                if (bricks[i].status === 1) {
                    if (
                        ball.x > bricks[i].x &&
                        ball.x < bricks[i].x + bricks[i].width &&
                        ball.y > bricks[i].y &&
                        ball.y < bricks[i].y + bricks[i].height
                    ) {
                        ball.dy = -ball.dy;
                        bricks[i].status = 0;
                        score += 10;
                        scoreDisplay.textContent = `Score: ${score}`;
                        
                        // Check if all bricks are destroyed
                        if (bricks.every(brick => brick.status === 0)) {
                            gameRunning = false;
                            gameOverScreen.style.display = 'block';
                        }
                        break;
                    }
                }
            }

            // Bottom wall collision (game over)
            if (ball.y + ball.dy > canvas.height - ball.radius) {
                gameRunning = false;
                gameOverScreen.style.display = 'block';
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw game objects
            drawBricks();
            drawPaddle();
            drawBall();

            // Move ball
            if (gameRunning) {
                moveBall();
            }
        }

        // Game loop
        function gameLoop() {
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Initialize game
        function init() {
            score = 0;
            scoreDisplay.textContent = `Score: ${score}`;
            gameRunning = true;
            gameOverScreen.style.display = 'none';
            
            // Reset paddle
            paddle.x = canvas.width / 2 - 60;
            
            // Reset ball
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = 4;
            ball.dy = -4;
            
            // Create bricks
            createBricks();
            
            // Start game loop
            gameLoop();
        }

        // Event listeners
        document.addEventListener('keydown', movePaddle);
        restartButton.addEventListener('click', init);

        // Start the game
        init();
    </script>
</body>
</html>
