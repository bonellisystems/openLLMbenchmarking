<!DOCTYPE html>
<html>
<head>
  <title>Flight Simulator</title>
  <style>
    body { margin: 0; }
    canvas { width: 100%; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!ctx) { alert('WebGL not supported'); }

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.viewport(0, 0, canvas.width, canvas.height);

    const scene = {};
    scene.camera = { x: 0, y: 10, z: 20 };
    scene.rotation = { x: 0, y: 0 };
    scene.skyscrapers = [];

    for (let i = 0; i < 100; i++) {
      scene.skyscrapers.push({
        x: Math.random() * 100 - 50,
        z: Math.random() * 100 - 50,
        height: Math.random() * 10 + 5,
      });
    }

    const gl = ctx;
    gl.clearColor(0.2, 0.2, 0.2, 1);
    gl.clearDepth(1.0);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);

    function draw() {
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      gl.matrixMode(gl.MODELVIEW);
      gl.loadIdentity();

      gl.translate(0, 0, -scene.camera.z);
      gl.rotate(scene.rotation.x, 1, 0, 0);
      gl.rotate(scene.rotation.y, 0, 1, 0);
      gl.translate(scene.camera.x, scene.camera.y, 0);

      gl.begin(gl.QUADS);

      // Ground
      gl.color3f(0.5, 0.5, 0.5);
      gl.vertex3f(-50, 0, 50);
      gl.vertex3f(50, 0, 50);
      gl.vertex3f(50, 0, -50);
      gl.vertex3f(-50, 0, -50);

      // Skyscrapers
      for (const skyscraper of scene.skyscrapers) {
        gl.pushMatrix();
        gl.translate(skyscraper.x, 0, skyscraper.z);
        gl.color3f(0.8, 0.8, 0.8);
        gl.begin(gl.QUADS);
        gl.vertex3f(-1, 0, 1);
        gl.vertex3f(1, 0, 1);
        gl.vertex3f(1, skyscraper.height, 1);
        gl.vertex3f(-1, skyscraper.height, 1);

        gl.vertex3f(1, 0, 1);
        gl.vertex3f(1, 0, -1);
        gl.vertex3f(1, skyscraper.height, -1);
        gl.vertex3f(1, skyscraper.height, 1);

        gl.vertex3f(1, 0, -1);
        gl.vertex3f(-1, 0, -1);
        gl.vertex3f(-1, skyscraper.height, -1);
        gl.vertex3f(1, skyscraper.height, -1);

        gl.vertex3f(-1, 0, -1);
        gl.vertex3f(-1, 0, 1);
        gl.vertex3f(-1, skyscraper.height, 1);
        gl.vertex3f(-1, skyscraper.height, -1);

        gl.vertex3f(-1, skyscraper.height, 1);
        gl.vertex3f(1, skyscraper.height, 1);
        gl.vertex3f(1, skyscraper.height, -1);
        gl.vertex3f(-1, skyscraper.height, -1);

        gl.vertex3f(-1, 0, 1);
        gl.vertex3f(-1, 0, -1);
        gl.vertex3f(1, 0, -1);
        gl.vertex3f(1, 0, 1);
        gl.end();
        gl.popMatrix();
      }
      gl.end();

      requestAnimationFrame(draw);
    }

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'w':
          scene.camera.z -= 1;
          break;
        case 's':
          scene.camera.z += 1;
          break;
        case 'a':
          scene.camera.x -= 1;
          break;
        case 'd':
          scene.camera.x += 1;
          break;
        case 'ArrowUp':
          scene.rotation.x -= 0.1;
          break;
        case 'ArrowDown':
          scene.rotation.x += 0.1;
          break;
        case 'ArrowLeft':
          scene.rotation.y -= 0.1;
          break;
        case 'ArrowRight':
          scene.rotation.y += 0.1;
          break;
      }
    });

    draw();
  </script>
</body>
</html>
