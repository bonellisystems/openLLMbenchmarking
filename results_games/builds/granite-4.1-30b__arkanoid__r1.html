<!DOCTYPE html>
<html>
<head>
<title>Arkanoid (Breakout) Game</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const BALL_RADIUS = 8;
  const PADDLE_WIDTH = 60;
  const PADDLE_HEIGHT = 10;
  const BRICK_WIDTH = 60;
  const BRICK_HEIGHT = 20;
  const BRICK_COLS = 10;
  const BRICK_ROWS = 7;

  let ball = { x: 0, y: 0, dx: 2, dy: 2 };
  let paddle = { x: 0, y: 0, width: PADDLE_WIDTH, height: PADDLE_HEIGHT };
  let bricks = [];
  let score = 0;

  function initGame() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height - BALL_RADIUS * 2;
    paddle.x = canvas.width / 2 - PADDLE_WIDTH / 2;
    createBricks();
  }

  function createBricks() {
    let brickX = 0;
    let brickY = 0;
    for (let row = 0; row < BRICK_ROWS; row++) {
      for (let col = 0; col < BRICK_COLS; col++) {
        brickX = col * (BRICK_WIDTH + 5) + 5;
        brickY = row * (BRICK_HEIGHT + 5) + 5;
        bricks.push({ x: brickX, y: brickY, width: BRICK_WIDTH, height: BRICK_HEIGHT, status: 1 });
      }
    }
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = 'red';
    ctx.fill();
    ctx.closePath();
  }

  function drawPaddle() {
    ctx.fillStyle = 'blue';
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
  }

  function drawBricks() {
    ctx.fillStyle = 'green';
    bricks.forEach(brick => {
      if (brick.status === 1) {
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      }
    });
  }

  function drawScore() {
    ctx.fillStyle = 'black';
    ctx.font = '16px Arial';
    ctx.fillText(`Score: ${score}`, 10, 20);
  }

  function update() {
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Ball collision with walls
    if (ball.x < BALL_RADIUS || ball.x > canvas.width - BALL_RADIUS) ball.dx = -ball.dx;
    if (ball.y < BALL_RADIUS) ball.dy = -ball.dy;
    if (ball.y > canvas.height - BALL_RADIUS * 2) {
      // Reset game if ball misses paddle
      initGame();
    }

    // Ball collision with paddle
    if (
      ball.x > paddle.x &&
      ball.x < paddle.x + paddle.width &&
      ball.y + BALL_RADIUS >= paddle.y
    ) {
      ball.dy = -ball.dy;
      ball.y = paddle.y - BALL_RADIUS * 2; // Adjust ball position to be on top of paddle
    }

    // Ball collision with bricks
    bricks.forEach((brick, index) => {
      if (brick.status === 1) {
        if (
          ball.x > brick.x &&
          ball.x < brick.x + brick.width &&
          ball.y + BALL_RADIUS >= brick.y &&
          ball.y <= brick.y + brick.height
        ) {
          ball.dy = -ball.dy;
          brick.status = 0;
          score++;
          if (score === BRICK_COLS * BRICK_ROWS) alert('You Win!');
        }
      }
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBall();
    drawPaddle();
    drawBricks();
    drawScore();
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function movePaddle(event) {
    const keyCode = event.keyCode;
    if (keyCode === 37 && paddle.x > 0) { // Left arrow
      paddle.x -= 5;
    } else if (keyCode === 39 && paddle.x < canvas.width - paddle.width) { // Right arrow
      paddle.x += 5;
    }
  }

  document.addEventListener('keydown', movePaddle);
  initGame();
  gameLoop();
</script>
</body>
</html>
