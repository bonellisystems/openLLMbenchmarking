<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Segoe UI', Arial, sans-serif;
}
canvas {
border: 3px solid #5a8f3c;
border-radius: 4px;
image-rendering: pixelated;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

const GRAVITY = 0.45;
const JUMP_FORCE = -11;
const MOVE_SPEED = 6;
const PLATFORM_COUNT = 14;
const PLATFORM_MIN_W = 60;
const PLATFORM_MAX_W = 100;
const PLATFORM_H = 14;

let player, platforms, score, highScore, gameOver, keys, cameraY, particles, springs, gameStarted;

highScore = 0;
keys = {};
gameOver = false;
gameStarted = false;
particles = [];

function init() {
    player = {
        x: W / 2 - 20,
        y: H - 100,
        w: 40,
        h: 40,
        vx: 0,
        vy: 0,
        dir: 1,
        onGround: false
    };
    platforms = [];
    particles = [];
    score = 0;
    cameraY = 0;
    gameOver = false;

    platforms.push({ x: W / 2 - 40, y: H - 40, w: 80, h: PLATFORM_H, type: 'normal' });

    for (let i = 1; i < PLATFORM_COUNT; i++) {
        generatePlatform(H - 40 - i * (H / PLATFORM_COUNT));
    }
}

function generatePlatform(y) {
    let w = PLATFORM_MIN_W + Math.random() * (PLATFORM_MAX_W - PLATFORM_MIN_W);
    let x = Math.random() * (W - w);
    let type = 'normal';
    let r = Math.random();
    if (r < 0.08 && score > 200) {
        type = 'moving';
    } else if (r < 0.14 && score > 400) {
        type = 'breakable';
    } else if (r < 0.18 && score > 100) {
        type = 'spring';
    }
    platforms.push({ x, y, w, h: PLATFORM_H, type, dx: type === 'moving' ? (Math.random() > 0.5 ? 1.5 : -1.5) : 0, broken: false });
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            size: 2 + Math.random() * 4,
            color
        });
    }
}

function update() {
    if (gameOver) {
        if (keys[' '] || keys['Enter']) {
            init();
        }
        return;
    }

    if (!gameStarted) {
        if (keys['ArrowLeft'] || keys['ArrowRight'] || keys[' '] || keys['Enter']) {
            gameStarted = true;
        }
        return;
    }

    // Player horizontal movement
    if (keys['ArrowLeft'] || keys['a']) {
        player.vx = -MOVE_SPEED;
        player.dir = -1;
    } else if (keys['ArrowRight'] || keys['d']) {
        player.vx = MOVE_SPEED;
        player.dir = 1;
    } else {
        player.vx *= 0.85;
    }

    player.x += player.vx;

    // Wrap around
    if (player.x + player.w < 0) player.x = W;
    if (player.x > W) player.x = -player.w;

    // Gravity
    player.vy += GRAVITY;
    player.y += player.vy;

    // Platform collision (only when falling)
    if (player.vy > 0) {
        for (let p of platforms) {
            if (p.broken) continue;
            let prevBottom = player.y + player.h - player.vy;
            let currBottom = player.y + player.h;
            if (
                player.x + player.w - 5 > p.x &&
                player.x + 5 < p.x + p.w &&
                prevBottom <= p.y + 4 &&
                currBottom >= p.y
            ) {
                if (p.type === 'breakable') {
                    p.broken = true;
                    spawnParticles(p.x + p.w / 2, p.y, '#c4a44a', 8);
                    player.vy = 2;
                } else {
                    player.y = p.y - player.h;
                    player.vy = JUMP_FORCE;
                    player.onGround = true;
                    spawnParticles(player.x + player.w / 2, player.y + player.h, '#8bc34a', 4);

                    if (p.type === 'spring') {
                        player.vy = JUMP_FORCE * 1.8;
                        spawnParticles(player.x + player.w / 2, player.y + player.h, '#ff9800', 8);
                    }
                }
                break;
            }
        }
    }

    // Moving platforms
    for (let p of platforms) {
        if (p.type === 'moving') {
            p.x += p.dx;
            if (p.x <= 0 || p.x + p.w >= W) p.dx *= -1;
        }
    }

    // Camera scroll
    let threshold = H * 0.4;
    if (player.y < threshold) {
        let diff = threshold - player.y;
        player.y = threshold;
        cameraY += diff;
        score += Math.floor(diff);

        for (let p of platforms) {
            p.y += diff;
        }
        for (let pt of particles) {
            pt.y += diff;
        }

        // Remove platforms below screen
        platforms = platforms.filter(p => p.y < H + 50);

        // Generate new platforms above
        while (platforms.length < PLATFORM_COUNT) {
            let highestY = Math.min(...platforms.map(p => p.y));
            let gap = 40 + Math.random() * 50 + Math.min(score * 0.02, 30);
            generatePlatform(highestY - gap);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.1;
        pt.life -= pt.decay;
        if (pt.life <= 0) particles.splice(i, 1);
    }

    // Game over
    if (player.y > H + 50) {
        gameOver = true;
        if (score > highScore) highScore = score;
        spawnParticles(player.x + player.w / 2, H, '#ff5722', 20);
    }
}

function drawBackground() {
    // Sky gradient
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    let skyProgress = Math.min(score / 5000, 1);
    if (skyProgress < 0.5) {
        grad.addColorStop(0, '#e8f5e9');
        grad.addColorStop(1, '#c8e6c9');
    } else {
        let t = (skyProgress - 0.5) * 2;
        grad.addColorStop(0, lerpColor('#e8f5e9', '#1a237e', t));
        grad.addColorStop(1, lerpColor('#c8e6c9', '#283593', t));
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Grid lines (notebook style)
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    let gridOffset = (-cameraY * 0.3) % 30;
    for (let y = gridOffset; y < H; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
    for (let x = 0; x < W; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
}

function lerpColor(a, b, t) {
    let ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    let br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
    let rr = Math.round(ar + (br - ar) * t);
    let rg = Math.round(ag + (bg - ag) * t);
    let rb = Math.round(ab + (bb - ab) * t);
    return '#' + [rr, rg, rb].map(v => v.toString(16).padStart(2, '0')).join('');
}

function drawPlatform(p) {
    if (p.broken) return;
    let x = p.x, y = p.y, w = p.w, h = p.h;

    if (p.type === 'normal') {
        // Green platform with gradient
        let grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, '#66bb6a');
        grad.addColorStop(1, '#388e3c');
        ctx.fillStyle = grad;
        roundRect(x, y, w, h, 6);
        ctx.fill();
        // Top highlight
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        roundRect(x + 2, y + 1, w - 4, h / 2, 3);
        ctx.fill();
        // Grass tufts
        ctx.fillStyle = '#4caf50';
        for (let i = 0; i < 3; i++) {
            let gx = x + 8 + i * (w - 16) / 2;
            ctx.beginPath();
            ctx.arc(gx, y, 3, Math.PI, 0);
            ctx.fill();
        }
    } else if (p.type === 'moving') {
        let grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, '#42a5f5');
        grad.addColorStop(1, '#1565c0');
        ctx.fillStyle = grad;
        roundRect(x, y, w, h, 6);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        roundRect(x + 2, y + 1, w - 4, h / 2, 3);
        ctx.fill();
        // Arrow indicators
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(p.dx > 0 ? '→' : '←', x + w / 2, y + h - 2);
    } else if (p.type === 'breakable') {
        let grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, '#d4a843');
        grad.addColorStop(1, '#a67c2e');
        ctx.fillStyle = grad;
        roundRect(x, y, w, h, 6);
        ctx.fill();
        // Crack lines
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + w * 0.3, y + 2);
        ctx.lineTo(x + w * 0.4, y + h - 2);
        ctx.moveTo(x + w * 0.7, y + 1);
        ctx.lineTo(x + w * 0.6, y + h - 1);
        ctx.stroke();
    } else if (p.type === 'spring') {
        let grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, '#ef5350');
        grad.addColorStop(1, '#c62828');
        ctx.fillStyle = grad;
        roundRect(x, y, w, h, 6);
        ctx.fill();
        // Spring coil
        ctx.strokeStyle = '#ffcc02';
        ctx.lineWidth = 2;
        let cx = x + w / 2;
        let springH = 12;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            let sy = y - springH + (springH / 4) * i;
            ctx.moveTo(cx - 6, sy);
            ctx.lineTo(cx + 6, sy + springH / 8);
            ctx.lineTo(cx - 6, sy + springH / 4);
        }
        ctx.stroke();
    }
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawPlayer() {
    let px = player.x, py = player.y;
    let w = player.w, h = player.h;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(px + w / 2, py + h + 2, w / 2 + 2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    let bodyGrad = ctx.createRadialGradient(px + w / 2, py + h / 2 - 4, 2, px + w / 2, py + h / 2, w / 2 + 4);
    bodyGrad.addColorStop(0, '#a5d6a7');
    bodyGrad.addColorStop(1, '#66bb6a');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(px + w / 2, py + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Outline
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Eyes
    let eyeOffX = player.dir * 4;
    let eyeY = py + h * 0.35;
    // White
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(px + w / 2 - 7 + eyeOffX, eyeY, 6, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(px + w / 2 + 7 + eyeOffX, eyeY, 6, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pupils
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.arc(px + w / 2 - 6 + eyeOffX * 1.2, eyeY + 1, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + w / 2 + 8 + eyeOffX * 1.2, eyeY + 1, 3, 0, Math.PI * 2);
    ctx.fill();
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px + w / 2 - 5 + eyeOffX * 1.2, eyeY - 1, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + w / 2 + 9 + eyeOffX * 1.2, eyeY - 1, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Mouth
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (player.vy < -2) {
        // Happy open mouth when jumping up
        ctx.arc(px + w / 2 + eyeOffX, py + h * 0.6, 4, 0, Math.PI);
    } else {
        // Small smile
        ctx.arc(px + w / 2 + eyeOffX, py + h * 0.55, 3, 0.1, Math.PI - 0.1);
    }
    ctx.stroke();

    // Feet
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.ellipse(px + w / 2 - 8, py + h - 2, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(px + w / 2 + 8, py + h - 2, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(px + w / 2 - 8, py + h - 2, 6, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(px + w / 2 + 8, py + h - 2, 6, 4, 0, 0, Math.PI * 2);
    ctx.stroke();
}

function drawParticles() {
    for (let pt of particles) {
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawUI() {
    // Score
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(10, 10, 130, 36, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 22, 34);

    // High score
    if (highScore > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        roundRect(W - 140, 10, 130, 36, 8);
        ctx.fill();
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 16px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('Best: ' + highScore, W - 22, 34);
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Doodle Jump', W / 2, H / 2 - 60);

    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#e8f5e9';
    ctx.fillText('← → or A/D to move', W / 2, H / 2);
    ctx.fillText('Press any key to start', W / 2, H / 2 + 30);

    // Draw a little doodle
    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.ellipse(W / 2, H / 2 - 110, 25, 25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(W / 2 - 7, H / 2 - 114, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W / 2 + 7, H / 2 - 114, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.arc(W / 2 - 6, H / 2 - 113, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W / 2 + 8, H / 2 - 113, 2.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff5722';
    ctx.font = 'bold 40px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, H / 2 - 50);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Score: ' + score, W / 2, H / 2);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
        ctx.fillText('🏆 New Best!', W / 2, H / 2 + 35);
    }

    ctx.fillStyle = '#e8f5e9';
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Press Space or Enter to restart', W / 2, H / 2 + 80);
}

function draw() {
    drawBackground();

    for (let p of platforms) {
        drawPlatform(p);
    }

    drawParticles();
    drawPlayer();
    drawUI();

    if (!gameStarted) {
        drawStartScreen();
    }

    if (gameOver) {
        drawGameOver();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
        e.preventDefault();
    }
});

document.addEventListener('keyup', function(e) {
    keys[e.key] = false;
});

init();
gameLoop();
</script>
</body>
</html>
