<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }
    .game-container {
        position: relative;
        text-align: center;
    }
    .score-board {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .score {
        font-size: 2.5rem;
        font-weight: bold;
        color: #4ecca3;
        text-shadow: 0 0 10px rgba(78, 202, 163, 0.5);
    }
    .high-score {
        font-size: 1.2rem;
        color: #a0a0c0;
        margin-top: 10px;
    }
    canvas {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        box-shadow: 
            inset 0 0 20px rgba(0, 0, 0, 0.5),
            0 0 30px rgba(78, 202, 163, 0.2);
        display: block;
    }
    .game-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(26, 26, 46, 0.95);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        display: none;
        border: 2px solid #e74c3c;
        box-shadow: 0 0 50px rgba(231, 76, 60, 0.5);
    }
    .game-over h1 {
        color: #e74c3c;
        font-size: 3rem;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(231, 76, 60, 0.7);
    }
    .game-over p {
        color: #a0a0c0;
        font-size: 1.2rem;
        margin-bottom: 30px;
    }
    .restart-btn {
        background: linear-gradient(45deg, #e74c3c, #c0392b);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
    }
    .restart-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(231, 76, 60, 0.6);
    }
    .instructions {
        color: #a0a0c0;
        font-size: 1rem;
        margin-top: 15px;
    }
    .controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .control-btn {
        width: 50px;
        height: 50px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #4ecca3;
        font-size: 1.5rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .control-btn:hover {
        background: rgba(78, 202, 163, 0.2);
        transform: scale(1.1);
    }
    .control-btn:active {
        transform: scale(0.95);
    }
    .control-row {
        display: flex;
        gap: 10px;
        margin: 5px 0;
    }
    .control-row.center {
        justify-content: center;
    }
</style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="high-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="game-over" id="gameOver">
            <h1>Game Over</h1>
            <p>Your score: <span id="finalScore">0</span></p>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
        <div class="instructions">
            Use arrow keys or WASD to control the snake
        </div>
        <div class="controls">
            <div class="control-row center">
                <button class="control-btn" id="upBtn">▲</button>
            </div>
            <div class="control-row">
                <button class="control-btn" id="leftBtn">◄</button>
                <button class="control-btn" id="downBtn">▼</button>
                <button class="control-btn" id="rightBtn">►</button>
            </div>
        </div>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game constants
        const GRID_SIZE = 20;
        const GRID_WIDTH = canvas.width / GRID_SIZE;
        const GRID_HEIGHT = canvas.height / GRID_SIZE;
        
        // Game variables
        let snake, food, gameInterval, score = 0, highScore = 0;
        let gameRunning = false;
        
        // Colors
        const COLORS = {
            background: '#0f0f23',
            grid: '#1a1a3e',
            snakeHead: '#4ecca3',
            snakeBody: '#45b393',
            food: '#e74c3c',
            text: '#ffffff'
        };
        
        // Initialize game
        function init() {
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            snakeDirection = {x: 1, y: 0};
            createFood();
            score = 0;
            updateScore();
            gameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150);
        }
        
        // Create food at random position
        function createFood() {
            food = {
                x: Math.floor(Math.random() * GRID_WIDTH),
                y: Math.floor(Math.random() * GRID_HEIGHT)
            };
            // Make sure food doesn't appear on snake
            for (let cell of snake) {
                if (cell.x === food.x && cell.y === food.y) {
                    return createFood();
                }
            }
        }
        
        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move snake
            const head = {x: snake[0].x + snakeDirection.x, y: snake[0].y + snakeDirection.y};
            
            // Check wall collision
            if (head.x < 0 || head.x >= GRID_WIDTH || head.y < 0 || head.y >= GRID_HEIGHT) {
                gameOver();
                return;
            }
            
            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                updateScore();
                createFood();
            } else {
                // Remove tail
                snake.pop();
            }
            
            // Draw everything
            draw();
        }
        
        // Draw game elements
        function draw() {
            // Clear canvas
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 0.5;
            for (let x = 0; x < GRID_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < GRID_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }
            
            // Draw food
            ctx.fillStyle = COLORS.food;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            // Add shine effect to food
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2 - 5,
                food.y * GRID_SIZE + GRID_SIZE / 2 - 5,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                
                if (i === 0) {
                    // Draw head
                    ctx.fillStyle = COLORS.snakeHead;
                    ctx.fillRect(x, y, GRID_SIZE, GRID_SIZE);
                    ctx.strokeStyle = '#3a9a7a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, GRID_SIZE, GRID_SIZE);
                    
                    // Draw eyes
                    ctx.fillStyle = '#000';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    let eyeX1, eyeY1, eyeX2, eyeY2;
                    
                    if (snakeDirection.x > 0) {
                        // Moving right
                        eyeX1 = x + GRID_SIZE - eyeOffset;
                        eyeY1 = y + eyeOffset;
                        eyeX2 = x + GRID_SIZE - eyeOffset;
                        eyeY2 = y + GRID_SIZE - eyeOffset;
                    } else if (snakeDirection.x < 0) {
                        // Moving left
                        eyeX1 = x + eyeOffset;
                        eyeY1 = y + eyeOffset;
                        eyeX2 = x + eyeOffset;
                        eyeY2 = y + GRID_SIZE - eyeOffset;
                    } else if (snakeDirection.y > 0) {
                        // Moving down
                        eyeX1 = x + eyeOffset;
                        eyeY1 = y + GRID_SIZE - eyeOffset;
                        eyeX2 = x + GRID_SIZE - eyeOffset;
                        eyeY2 = y + GRID_SIZE - eyeOffset;
                    } else {
                        // Moving up
                        eyeX1 = x + eyeOffset;
                        eyeY1 = y + eyeOffset;
                        eyeX2 = x + GRID_SIZE - eyeOffset;
                        eyeY2 = y + eyeOffset;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Draw body
                    ctx.fillStyle = COLORS.snakeBody;
                    ctx.fillRect(x, y, GRID_SIZE, GRID_SIZE);
                    ctx.strokeStyle = '#3a9a7a';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, GRID_SIZE, GRID_SIZE);
                }
            }
        }
        
        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }
            document.getElementById('high-score').textContent = highScore;
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Change snake direction
        function changeDirection(event) {
            const key = event.key;
            
            // Prevent reverse direction
            if (key === 'ArrowUp' || key === 'w' || key === 'W') {
                if (snakeDirection.y !== 1) {
                    snakeDirection = {x: 0, y: -1};
                }
            } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
                if (snakeDirection.y !== -1) {
                    snakeDirection = {x: 0, y: 1};
                }
            } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                if (snakeDirection.x !== 1) {
                    snakeDirection = {x: -1, y: 0};
                }
            } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                if (snakeDirection.x !== -1) {
                    snakeDirection = {x: 1, y: 0};
                }
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', changeDirection);
        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOver').style.display = 'none';
            init();
        });
        
        // Control buttons
        document.getElementById('upBtn').addEventListener('click', () => {
            if (snakeDirection.y !== 1) snakeDirection = {x: 0, y: -1};
        });
        document.getElementById('downBtn').addEventListener('click', () => {
            if (snakeDirection.y !== -1) snakeDirection = {x: 0, y: 1};
        });
        document.getElementById('leftBtn').addEventListener('click', () => {
            if (snakeDirection.x !== 1) snakeDirection = {x: -1, y: 0};
        });
        document.getElementById('rightBtn').addEventListener('click', () => {
            if (snakeDirection.x !== -1) snakeDirection = {x: 1, y: 0};
        });
        
        // Load high score from localStorage
        window.addEventListener('load', () => {
            const savedHighScore = localStorage.getItem('snakeHighScore');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore);
                document.getElementById('high-score').textContent = highScore;
            }
            init();
        });
    </script>
</body>
</html>
