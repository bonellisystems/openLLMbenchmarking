<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            border: 2px solid #000;
            background-color: #70c5ce;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 320;
        canvas.height = 480;

        // Game Constants
        const GRAVITY = 0.25;
        const JUMP = -4.5;
        const PIPE_SPEED = 2;
        const PIPE_GAP = 120;
        const PIPE_WIDTH = 50;

        // Game State
        let bird = { x: 50, y: 240, w: 30, h: 30, velocity: 0 };
        let pipes = [];
        let score = 0;
        let frame = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER

        function resetGame() {
            bird.y = 240;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frame = 0;
        }

        function spawnPipe() {
            const minPipeHeight = 50;
            const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight;
            const height = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            pipes.push({ x: canvas.width, top: height, bottom: canvas.height - height - PIPE_GAP });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            bird.velocity += GRAVITY;
            bird.y += bird.velocity;

            if (frame % 90 === 0) spawnPipe();

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED;

                // Collision
                if (bird.x + bird.w > pipes[i].x && bird.x < pipes[i].x + PIPE_WIDTH) {
                    if (bird.y < pipes[i].top || bird.y + bird.h > canvas.height - pipes[i].bottom) {
                        gameState = 'GAMEOVER';
                    }
                }

                // Score
                if (pipes[i].x + PIPE_WIDTH < bird.x && !pipes[i].passed) {
                    score++;
                    pipes[i].passed = true;
                }

                if (pipes[i].x + PIPE_WIDTH < 0) pipes.splice(i, 1);
            }

            if (bird.y + bird.h > canvas.height || bird.y < 0) {
                gameState = 'GAMEOVER';
            }

            frame++;
        }

        function draw() {
            // Background
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pipes
            ctx.fillStyle = '#2e7d32';
            pipes.forEach(p => {
                ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, PIPE_WIDTH, p.bottom);
            });

            // Bird
            ctx.fillStyle = '#fdd835';
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(bird.x, bird.y, bird.w, bird.h);

            // UI
            ctx.fillStyle = '#fff';
            ctx.font = '30px Courier New';
            ctx.textAlign = 'center';

            if (gameState === 'START') {
                ctx.fillText('PRESS SPACE', canvas.width / 2, canvas.height / 2);
                ctx.fillText('TO START', canvas.width / 2, canvas.height / 2 + 40);
            } else if (gameState === 'GAMEOVER') {
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillText('PRESS SPACE', canvas.width / 2, canvas.height / 2 + 40);
                ctx.fillText('SCORE: ' + score, canvas.width / 2, canvas.height / 2 - 40);
            } else {
                ctx.fillText(score, canvas.width / 2, 50);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameState === 'START') {
                    gameState = 'PLAYING';
                } else if (gameState === 'PLAYING') {
                    bird.velocity = JUMP;
                } else if (gameState === 'GAMEOVER') {
                    resetGame();
                    gameState = 'PLAYING';
                }
            }
        });

        loop();
    </script>
</body>
</html>
