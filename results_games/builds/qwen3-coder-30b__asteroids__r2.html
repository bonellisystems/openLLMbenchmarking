<!DOCTYPE html>
<html>
<head>
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            color: white;
        }
        canvas {
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            angle: 0,
            rotation: 0,
            thrusting: false,
            thrust: { x: 0, y: 0 },
            explodeTime: 0
        };
        
        let bullets = [];
        let asteroids = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let keys = {};
        
        // Create initial asteroids
        function createAsteroids(count) {
            for (let i = 0; i < count; i++) {
                let asteroid = {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 30 + Math.random() * 20,
                    speed: 0.5 + Math.random() * 1.5,
                    angle: Math.random() * Math.PI * 2,
                    rotation: (Math.random() - 0.5) * 0.05,
                    vertices: 8 + Math.floor(Math.random() * 5),
                    offsets: []
                };
                
                // Generate random offsets for asteroid shape
                for (let j = 0; j < asteroid.vertices; j++) {
                    asteroid.offsets.push(0.5 + Math.random() * 0.5);
                }
                
                // Make sure asteroid doesn't spawn on ship
                const dx = asteroid.x - ship.x;
                const dy = asteroid.y - ship.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    asteroid.x = Math.random() * canvas.width;
                    asteroid.y = Math.random() * canvas.height;
                }
                
                asteroids.push(asteroid);
            }
        }
        
        // Initialize game
        function init() {
            createAsteroids(5);
            document.addEventListener('keydown', (e) => keys[e.key] = true);
            document.addEventListener('keyup', (e) => keys[e.key] = false);
            gameLoop();
        }
        
        // Draw ship
        function drawShip() {
            if (ship.explodeTime > 0) return;
            
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            
            // Ship body
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-10, -10);
            ctx.lineTo(-5, 0);
            ctx.lineTo(-10, 10);
            ctx.closePath();
            ctx.stroke();
            
            // Thrust
            if (ship.thrusting) {
                ctx.beginPath();
                ctx.moveTo(-10, -5);
                ctx.lineTo(-15, 0);
                ctx.lineTo(-10, 5);
                ctx.closePath();
                ctx.fillStyle = 'orange';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // Draw bullets
        function drawBullets() {
            bullets.forEach(bullet => {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Draw asteroids
        function drawAsteroids() {
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < asteroid.vertices; i++) {
                    const angle = (i / asteroid.vertices) * Math.PI * 2;
                    const radius = asteroid.radius * asteroid.offsets[i];
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            });
        }
        
        // Update ship
        function updateShip() {
            if (ship.explodeTime > 0) {
                ship.explodeTime--;
                return;
            }
            
            // Rotation
            if (keys['ArrowLeft']) {
                ship.rotation = -0.08;
            } else if (keys['ArrowRight']) {
                ship.rotation = 0.08;
            } else {
                ship.rotation = 0;
            }
            
            ship.angle += ship.rotation;
            
            // Thrust
            ship.thrusting = keys['ArrowUp'];
            if (ship.thrusting) {
                ship.thrust.x += Math.cos(ship.angle) * 0.1;
                ship.thrust.y += Math.sin(ship.angle) * 0.1;
            } else {
                ship.thrust.x *= 0.98;
                ship.thrust.y *= 0.98;
            }
            
            // Update position
            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;
            
            // Wrap around screen
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].dx;
                bullets[i].y += bullets[i].dy;
                
                // Remove bullets that go off screen
                if (bullets[i].x < 0 || bullets[i].x > canvas.width ||
                    bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }
                
                // Check for collisions with asteroids
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const dx = bullets[i].x - asteroids[j].x;
                    const dy = bullets[i].y - asteroids[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < asteroids[j].radius) {
                        // Split asteroid
                        if (asteroids[j].radius > 15) {
                            // Create two smaller asteroids
                            for (let k = 0; k < 2; k++) {
                                const newAsteroid = {
                                    x: asteroids[j].x,
                                    y: asteroids[j].y,
                                    radius: asteroids[j].radius / 2,
                                    speed: asteroids[j].speed * 1.2,
                                    angle: Math.random() * Math.PI * 2,
                                    rotation: (Math.random() - 0.5) * 0.05,
                                    vertices: asteroids[j].vertices,
                                    offsets: [...asteroids[j].offsets]
                                };
                                asteroids.push(newAsteroid);
                            }
                        }
                        
                        // Remove bullet and asteroid
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        score += 100;
                        break;
                    }
                }
            }
        }
        
        // Update asteroids
        function updateAsteroids() {
            asteroids.forEach(asteroid => {
                asteroid.x += Math.cos(asteroid.angle) * asteroid.speed;
                asteroid.y += Math.sin(asteroid.angle) * asteroid.speed;
                asteroid.angle += asteroid.rotation;
                
                // Wrap around screen
                if (asteroid.x < -asteroid.radius) asteroid.x = canvas.width + asteroid.radius;
                if (asteroid.x > canvas.width + asteroid.radius) asteroid.x = -asteroid.radius;
                if (asteroid.y < -asteroid.radius) asteroid.y = canvas.height + asteroid.radius;
                if (asteroid.y > canvas.height + asteroid.radius) asteroid.y = -asteroid.radius;
            });
        }
        
        // Check collisions
        function checkCollisions() {
            if (ship.explodeTime > 0) return;
            
            for (let i = 0; i < asteroids.length; i++) {
                const dx = ship.x - asteroids[i].x;
                const dy = ship.y - asteroids[i].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < ship.radius + asteroids[i].radius) {
                    ship.explodeTime = 60;
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        // Reset ship position
                        ship.x = canvas.width / 2;
                        ship.y = canvas.height / 2;
                        ship.thrust.x = 0;
                        ship.thrust.y = 0;
                    }
                    break;
                }
            }
        }
        
        // Fire bullet
        function fireBullet() {
            if (ship.explodeTime > 0) return;
            
            const bullet = {
                x: ship.x + Math.cos(ship.angle) * 15,
                y: ship.y + Math.sin(ship.angle) * 15,
                dx: Math.cos(ship.angle) * 7 + ship.thrust.x,
                dy: Math.sin(ship.angle) * 7 + ship.thrust.y
            };
            bullets.push(bullet);
        }
        
        // Draw UI
        function drawUI() {
            // Score
            ctx.fillStyle = 'white';
            ctx.font = '20px monospace';
            ctx.fillText(`Score: ${score}`, 20, 30);
            
            // Lives
            ctx.fillText(`Lives: ${lives}`, 20, 55);
            
            // Game over
            if (gameOver) {
                ctx.fillStyle = 'white';
                ctx.font = '40px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px monospace';
                ctx.fillText('Press F5 to restart', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
            
            // Instructions
            if (!gameOver && asteroids.length === 0) {
                ctx.fillStyle = 'white';
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Press SPACE to shoot', canvas.width / 2, canvas.height - 20);
                ctx.textAlign = 'left';
            }
        }
        
        // Draw explosion
        function drawExplosion() {
            if (ship.explodeTime > 0) {
                const time = 60 - ship.explodeTime;
                const radius = time * 0.5;
                
                ctx.fillStyle = `rgba(255, ${255 - time * 4}, 0, ${1 - time / 60})`;
                ctx.beginPath();
                ctx.arc(ship.x, ship.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Main game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!gameOver) {
                // Update game objects
                updateShip();
                updateBullets();
                updateAsteroids();
                checkCollisions();
                
                // Handle shooting
                if (keys[' '] && bullets.length < 10) {
                    fireBullet();
                }
                
                // Check if all asteroids destroyed
                if (asteroids.length === 0) {
                    createAsteroids(5);
                }
            }
            
            // Draw everything
            drawAsteroids();
            drawBullets();
            drawShip();
            drawExplosion();
            drawUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        init();
    </script>
</body>
</html>
