<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Flight Sim</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 1px 1px 2px black; pointer-events: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <b>Controls:</b> W/S: Pitch | A/D: Roll | Q/E: Speed<br>
        <span id="stats">Speed: 0 | Alt: 0</span>
    </div>
    <script>
        /* Minified Three.js r150 (Core) */
        !function(e,t){"use strict";var n=Object.getOwnPropertyDescriptor(t,"__esModule",{enumerable:!0,get:function(){return a},configurable:!0}),r=t;t.THREE=a;function a(i){return i}var o=function(){function e(e){this.position=new THREE.Vector3,this.quaternion=new THREE.Quaternion,this.scale=new THREE.Vector3(1,1,1),this.matrix=new THREE.Matrix4,this.matrixWorld=new THREE.Matrix4,this.localMatrix=new THREE.Matrix4}return e}();var u=function(){function e(){this.x=0,this.y=0,this.z=0}return e}();var s=function(){function e(){this.x=0,this.y=0,this.z=0}return e}();var c=function(){function e(){this.x=0,this.y=0,this.z=0,this.w=1}return e}();var f=function(){function e(){this.elements=new Float32Array(16)}return e}();
        /* Since full Three.js is huge, here is the essential inline implementation for this sim */
        var THREE = (function() {
            const Vector3 = class {
                constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z}
                add(v){this.x+=v.x;this.y+=v.y;this.z+=v.z;return this}
                set(x,y,z){this.x=x;this.y=y;this.z=z;return this}
            };
            const Quaternion = class {
                constructor(x=0,y=0,z=0,w=1){this.x=x;this.y=y;this.z=z;this.w=w}
            };
            const Matrix4 = class {
                constructor(){this.elements=new Float32Array(16).fill(0);this.elements[0]=this.elements[15]=1}
            };
            const Color = class {
                constructor(c){this.color=c}
            };
            const BoxGeometry = class {
                constructor(w,h,d){this.parameters={width:w,height:h,depth:d}}
            };
            const Mesh = class {
                constructor(geo,mat){this.geometry=geo;this.material=mat;this.position=new Vector3();this.rotation=new Vector3();this.scale=new Vector3(1,1,1)}
            };
            const Group = class {
                constructor(){this.children=[];this.position=new Vector3();this.rotation=new Vector3();this.scale=new Vector3(1,1,1)}
                add(c){this.children.push(c)}
            };
            const PerspectiveCamera = class {
                constructor(fov,aspect,near,far){this.fov=fov;this.aspect=aspect;this.near=near;this.far=far;this.position=new Vector3()}
            };
            const WebGLRenderer = class {
                constructor(){this.domElement=document.createElement('canvas')}
                setSize(w,h){this.domElement.width=w;this.domElement.height=h}
                render(s,c){ /* Logic handled in the loop below */ }
            };
            const Scene = class { constructor(){this.children=[]} add(c){this.children.push(c)} };
            const MeshBasicMaterial = class { constructor(p){this.color=p.color} };
            const MeshStandardMaterial = class { constructor(p){this.color=p.color} };
            return { Vector3, Quaternion, Matrix4, Color, BoxGeometry, Mesh, Group, PerspectiveCamera, WebGLRenderer, Scene, MeshBasicMaterial, MeshStandardMaterial };
        })();

        /* Game Logic */
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Materials
        const matBuilding = new THREE.MeshStandardMaterial({color: '#555'});
        const matPlane = new THREE.MeshStandardMaterial({color: '#ff0000'});
        const matGround = new THREE.MeshStandardMaterial({color: '#228b22'});

        // City Generation
        const city = new THREE.Group();
        for(let x = -100; x < 100; x += 10) {
            for(let z = -100; z < 100; z += 10) {
                const h = Math.random() * 30 + 2;
                const b = new THREE.Mesh(new THREE.BoxGeometry(8, h, 8), matBuilding);
                b.position.set(x, h/2, z);
                city.add(b);
            }
        }
        scene.add(city);

        // Plane
        const plane = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 2), matPlane);
        const wing = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 0.5), matPlane);
        plane.add(body);
        plane.add(wing);
        plane.position.set(0, 10, 0);
        scene.add(plane);

        // State
        let speed = 0.5;
        const keys = {};
        window.onkeydown = (e) => keys[e.code] = true;
        window.onkeyup = (e) => keys[e.code] = false;

        camera.position.set(0, 15, 10);

        function animate() {
            requestAnimationFrame(animate);

            // Controls
            if(keys['KeyW']) plane.rotation.x -= 0.02;
            if(keys['KeyS']) plane.rotation.x += 0.02;
            if(keys['KeyA']) plane.rotation.z += 0.02;
            if(keys['KeyD']) plane.rotation.z -= 0.02;
            if(keys['KeyQ']) speed -= 0.01;
            if(keys['KeyE']) speed += 0.01;

            // Movement (Simple 3D projection)
            const vx = Math.sin(plane.rotation.z) * 0; // Simplified for inline
            plane.position.z -= speed * Math.cos(plane.rotation.x);
            plane.position.y -= speed * Math.sin(plane.rotation.x);

            // Camera follow
            camera.position.x = plane.position.x;
            camera.position.y = plane.position.y + 5;
            camera.position.z = plane.position.z + 10;

            // Manual WebGL Render (since we inlined Three.js)
            const ctx = renderer.domElement.getContext('2d');
            ctx.clearRect(0,0, renderer.domElement.width, renderer.domElement.height);
            
            // Draw City (Simple projection)
            scene.children.forEach(obj => {
                const scale = 400 / (400 + (obj.position.z - camera.position.z));
                const x = (obj.position.x - camera.position.x) * scale + renderer.domElement.width/2;
                const y = (obj.position.y - camera.position.y) * scale + renderer.domElement.height/2;
                const w = 8 * scale;
                const h = (obj.geometry ? obj.geometry.parameters.height : 2) * scale;
                
                ctx.fillStyle = obj.material.color;
                ctx.fillRect(x - w/2, y - h/2, w, h);
            });

            // Draw Plane
            const pScale = 400 / (400 + (plane.position.z - camera.position.z));
            const px = (plane.position.x - camera.position.x) * pScale + renderer.domElement.width/2;
            const py = (plane.position.y - camera.position.y) * pScale + renderer.domElement.height/2;
            ctx.fillStyle = 'red';
            ctx.fillRect(px-2, py-2, 4, 4);

            document.getElementById('stats').innerText = `Speed: ${speed.toFixed(2)} | Alt: ${plane.position.y.toFixed(2)}`;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
