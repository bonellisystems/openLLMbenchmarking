<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tiny Roguelike</title>
    <style>
        body { background: #111; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #game { line-height: 1.2; font-size: 20px; white-space: pre; cursor: default; }
        #ui { margin-top: 10px; color: #aaa; font-size: 16px; text-align: center; }
        .stat { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="ui">HP: <span id="hp" class="stat">0</span> | Floor: <span id="fl" class="stat">1</span><br><span id="msg">Use WASD or Arrows to move</span></div>
    <script>
        const W = 30, H = 20;
        let map = [], player = {x: 0, y: 0, hp: 20}, enemies = [], exit = {x: 0, y: 0}, floor = 1;
        const msg = document.getElementById('msg'), hpEl = document.getElementById('hp'), flEl = document.getElementById('fl'), gameEl = document.getElementById('game');

        function init() {
            map = Array.from({length: H}, () => Array(W).fill('#'));
            let rooms = [];
            for (let i = 0; i < 6; i++) {
                let rw = Math.floor(Math.random() * 4) + 3, rh = Math.floor(Math.random() * 4) + 3;
                let rx = Math.floor(Math.random() * (W - rw - 1)) + 1, ry = Math.floor(Math.random() * (H - rh - 1)) + 1;
                if (rooms.some(r => !(rx > r.x + r.w || rx + rw < r.x || ry > r.y + r.h || ry + rh < r.y))) {
                    for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) map[y][x] = '.';
                    if (rooms.length > 0) {
                        let prev = rooms[rooms.length - 1];
                        let cx1 = Math.floor(prev.x + prev.w / 2), cy1 = Math.floor(prev.y + prev.h / 2);
                        let cx2 = Math.floor(rx + rw / 2), cy2 = Math.floor(ry + rh / 2);
                        for (let x = Math.min(cx1, cx2); x <= Math.max(cx1, cx2); x++) map[cy1][x] = '.';
                        for (let y = Math.min(cy1, cy2); y <= Math.max(cy1, cy2); y++) map[y][cx2] = '.';
                    }
                    rooms.push({x: rx, y: ry, w: rw, h: rh});
                }
            }
            let start = rooms[0], end = rooms[rooms.length - 1];
            player.x = Math.floor(start.x + start.w / 2); player.y = Math.floor(start.y + start.h / 2);
            exit.x = Math.floor(end.x + end.w / 2); exit.y = Math.floor(end.y + end.h / 2);
            enemies = [];
            for (let i = 1; i < rooms.length; i++) {
                enemies.push({x: Math.floor(rooms[i].x + Math.random() * (rooms[i].w - 1)), y: Math.floor(rooms[i].y + Math.random() * (rooms[i].h - 1)), hp: 5});
            }
            render();
        }

        function render() {
            let out = "";
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    let char = map[y][x];
                    if (x === player.x && y === player.y) char = '@';
                    else if (enemies.some(e => e.x === x && e.y === y)) char = 'M';
                    else if (x === exit.x && y === exit.y) char = '>';
                    out += char;
                }
                out += "\n";
            }
            gameEl.innerText = out;
            hpEl.innerText = player.hp;
            flEl.innerText = floor;
        }

        window.addEventListener('keydown', e => {
            let dx = 0, dy = 0;
            if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
            else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
            else if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
            else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
            else return;

            let nx = player.x + dx, ny = player.y + dy;
            if (nx < 0 || nx >= W || ny < 0 || ny >= H) return;

            let enemy = enemies.find(e => e.x === nx && e.y === ny);
            if (enemy) {
                enemy.hp -= 2;
                msg.innerText = "You hit the monster!";
                if (enemy.hp <= 0) enemies = enemies.filter(e => e !== enemy);
            } else if (map[ny][nx] === '.') {
                player.x = nx; player.y = ny;
                msg.innerText = "You move forward.";
            } else if (map[ny][nx] === '#') {
                msg.innerText = "You bump into a wall.";
                return;
            }

            if (player.x === exit.x && player.y === exit.y) {
                floor++;
                msg.innerText = "You descend deeper!";
                init();
                return;
            }

            enemies.forEach(e => {
                let edx = player.x - e.x, edy = player.y - e.y;
                let mx = 0, my = 0;
                if (Math.abs(edx) > Math.abs(edy)) mx = edx > 0 ? 1 : -1; else my = edy > 0 ? 1 : -1;
                if (map[e.y + my][e.x + mx] === '.' && !(player.x === e.x + mx && player.y === e.y + my)) {
                    e.x += mx; e.y += my;
                } else if (player.x === e.x + mx && player.y === e.y + my) {
                    player.hp -= 1;
                    msg.innerText = "Monster attacks you!";
                }
            });

            if (player.hp <= 0) { msg.innerText = "GAME OVER"; render(); throw "Dead"; }
            render();
        });

        init();
    </script>
</body>
</html>
