<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        
        #gameCanvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        
        #gameInfo {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 18px;
            text-shadow: 0 0 5px #0ff;
        }
        
        #gameMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 36px;
            text-align: center;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="gameInfo">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    <div id="gameMessage"></div>
    <div class="controls">
        Arrow Keys: Move | Space: Shoot | P: Pause
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const messageElement = document.getElementById('gameMessage');

        // Game constants
        const SHIP_SIZE = 15;
        const BULLET_SPEED = 10;
        const ASTEROID_SPEED = 2;
        const ROTATION_SPEED = 0.1;
        const THRUST_POWER = 0.3;
        const FRICTION = 0.99;
        const MAX_BULLETS = 4;

        // Game state
        let gameState = 'start'; // start, playing, paused, gameOver
        let score = 0;
        let lives = 3;
        let keys = {};
        let bullets = [];
        let asteroids = [];
        let particles = [];

        // Player ship
        class Ship {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.angle = -Math.PI / 2;
                this.size = SHIP_SIZE;
            }

            update() {
                // Rotation
                if (keys['ArrowLeft']) {
                    this.angle -= ROTATION_SPEED;
                }
                if (keys['ArrowRight']) {
                    this.angle += ROTATION_SPEED;
                }

                // Thrust
                if (keys['ArrowUp']) {
                    this.vx += Math.cos(this.angle) * THRUST_POWER;
                    this.vy += Math.sin(this.angle) * THRUST_POWER;
                    
                    // Thruster particles
                    for (let i = 0; i < 3; i++) {
                        particles.push(new Particle(
                            this.x - Math.cos(this.angle) * this.size,
                            this.y - Math.sin(this.angle) * this.size,
                            -Math.cos(this.angle) * 2 + (Math.random() - 0.5),
                            -Math.sin(this.angle) * 2 + (Math.random() - 0.5),
                            '#ff6600'
                        ));
                    }
                }

                // Apply friction
                this.vx *= FRICTION;
                this.vy *= FRICTION;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Ship body
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.size, 0);
                ctx.lineTo(-this.size, -this.size / 2);
                ctx.lineTo(-this.size / 2, 0);
                ctx.lineTo(-this.size, this.size / 2);
                ctx.closePath();
                ctx.stroke();
                
                // Ship glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.stroke();
                
                ctx.restore();
            }

            shoot() {
                if (bullets.length < MAX_BULLETS) {
                    bullets.push(new Bullet(
                        this.x + Math.cos(this.angle) * this.size,
                        this.y + Math.sin(this.angle) * this.size,
                        Math.cos(this.angle) * BULLET_SPEED + this.vx,
                        Math.sin(this.angle) * BULLET_SPEED + this.vy
                    ));
                }
            }
        }

        // Bullet class
        class Bullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 60;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = '#ff0';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ff0';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            isDead() {
                return this.life <= 0;
            }
        }

        // Asteroid class
        class Asteroid {
            constructor(x, y, size, vx = 0, vy = 0) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.vx = vx || (Math.random() - 0.5) * ASTEROID_SPEED;
                this.vy = vy || (Math.random() - 0.5) * ASTEROID_SPEED;
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = (Math.random() - 0.5) * 0.02;
                this.vertices = this.generateVertices();
            }

            generateVertices() {
                const vertices = [];
                const numVertices = 8 + Math.floor(Math.random() * 5);
                for (let i = 0; i < numVertices; i++) {
                    const angle = (i / numVertices) * Math.PI * 2;
                    const radius = this.size * (0.8 + Math.random() * 0.4);
                    vertices.push({
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius
                    });
                }
                return vertices;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angleSpeed;

                // Wrap around screen
                if (this.x < -this.size) this.x = canvas.width + this.size;
                if (this.x > canvas.width + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = canvas.height + this.size;
                if (this.y > canvas.height + this.size) this.y = -this.size;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < this.vertices.length; i++) {
                    const v = this.vertices[i];
                    if (i === 0) {
                        ctx.moveTo(v.x, v.y);
                    } else {
                        ctx.lineTo(v.x, v.y);
                    }
                }
                
                ctx.closePath();
                ctx.stroke();
                
                // Asteroid glow
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#888';
                ctx.stroke();
                
                ctx.restore();
            }

            split() {
                const newAsteroids = [];
                if (this.size > 20) {
                    for (let i = 0; i < 2; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = ASTEROID_SPEED * 1.5;
                        newAsteroids.push(new Asteroid(
                            this.x,
                            this.y,
                            this.size / 2,
                            Math.cos(angle) * speed,
                            Math.sin(angle) * speed
                        ));
                    }
                }
                return newAsteroids;
            }
        }

        // Particle class for effects
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = 30;
                this.maxLife = 30;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
                ctx.globalAlpha = 1;
            }

            isDead() {
                return this.life <= 0;
            }
        }

        // Initialize game
        let ship = new Ship(canvas.width / 2, canvas.height / 2);

        function createAsteroids() {
            asteroids = [];
            const numAsteroids = 5;
            for (let i = 0; i < numAsteroids; i++) {
                let x, y;
                do {
                    x = Math.random() * canvas.width;
                    y = Math.random() * canvas.height;
                } while (Math.hypot(x - ship.x, y - ship.y) < 100);
                
                asteroids.push(new Asteroid(x, y, 40));
            }
        }

        function checkCollisions() {
            // Bullet-asteroid collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dist = Math.hypot(bullet.x - asteroid.x, bullet.y - asteroid.y);
                    
                    if (dist < asteroid.size) {
                        // Create explosion particles
                        for (let k = 0; k < 10; k++) {
                            particles.push(new Particle(
                                asteroid.x,
                                asteroid.y,
                                (Math.random() - 0.5) * 5,
                                (Math.random() - 0.5) * 5,
                                '#ff6600'
                            ));
                        }
                        
                        // Split asteroid
                        const newAsteroids = asteroid.split();
                        asteroids.splice(j, 1);
                        asteroids.push(...newAsteroids);
                        
                        // Remove bullet
                        bullets.splice(i, 1);
                        
                        // Update score
                        score += asteroid.size === 40 ? 20 : asteroid.size === 20 ? 50 : 100;
                        scoreElement.textContent = score;
                        
                        break;
                    }
                }
            }

            // Ship-asteroid collisions
            for (let asteroid of asteroids) {
                const dist = Math.hypot(ship.x - asteroid.x, ship.y - asteroid.y);
                if (dist < asteroid.size + ship.size) {
                    // Create explosion
                    for (let i = 0; i < 20; i++) {
                        particles.push(new Particle(
                            ship.x,
                            ship.y,
                            (Math.random() - 0.5) * 8,
                            (Math.random() - 0.5) * 8,
                            '#ff0000'
                        ));
                    }
                    
                    // Reset ship
                    ship = new Ship(canvas.width / 2, canvas.height / 2);
                    lives--;
                    livesElement.textContent = lives;
                    
                    if (lives <= 0) {
                        gameState = 'gameOver';
                        messageElement.textContent = 'GAME OVER\nPress R to Restart';
                    }
                    
                    break;
                }
            }
        }

        function update() {
            if (gameState !== 'playing') return;

            ship.update();
            
            bullets = bullets.filter(bullet => {
                bullet.update();
                return !bullet.isDead();
            });
            
            asteroids.forEach(asteroid => asteroid.update());
            particles = particles.filter(particle => {
                particle.update();
                return !particle.isDead();
            });
            
            checkCollisions();
            
            // Check if all asteroids destroyed
            if (asteroids.length === 0) {
                createAsteroids();
                score += 1000;
                scoreElement.textContent = score;
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 100; i++) {
                const x = (i * 137.5) % canvas.width;
                const y = (i * 89.7) % canvas.height;
                const size = (i % 3) + 1;
                ctx.globalAlpha = 0.3 + (i % 5) * 0.1;
                ctx.fillRect(x, y, size, size);
            }
            ctx.globalAlpha = 1;
            
            // Draw game objects
            if (gameState === 'playing' || gameState === 'paused') {
                ship.draw();
                bullets.forEach(bullet => bullet.draw());
                asteroids.forEach(asteroid => asteroid.draw());
                particles.forEach(particle => particle.draw());
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Input handling
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                if (gameState === 'playing') {
                    ship.shoot();
                }
            }
            
            if (e.key === 'p' || e.key === 'P') {
                if (gameState === 'playing') {
                    gameState = 'paused';
                    messageElement.textContent = 'PAUSED\nPress P to Resume';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    messageElement.textContent = '';
                }
            }
            
            if (e.key === 'r' || e.key === 'R') {
                if (gameState === 'gameOver') {
                    // Reset game
                    score = 0;
                    lives = 3;
                    bullets = [];
                    particles = [];
                    ship = new Ship(canvas.width / 2, canvas.height / 2);
                    createAsteroids();
                    scoreElement.textContent = score;
                    livesElement.textContent = lives;
                    gameState = 'playing';
                    messageElement.textContent = '';
                }
            }
            
            if (e.key === 'Enter' && gameState === 'start') {
                gameState = 'playing';
                messageElement.textContent = '';
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Start game
        createAsteroids();
        messageElement.textContent = 'ASTEROIDS\nPress Enter to Start';
        gameLoop();
    </script>
</body>
</html>
