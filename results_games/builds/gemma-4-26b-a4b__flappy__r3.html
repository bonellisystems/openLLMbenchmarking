<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #70c5ce;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Constants
        const GRAVITY = 0.25;
        const JUMP = -4.5;
        const PIPE_SPEED = 2;
        const PIPE_SPAWN_RATE = 90; // frames
        const PIPE_WIDTH = 50;
        const PIPE_GAP = 120;

        // Game State
        let bird = { x: 50, y: 200, w: 24, h: 18, velocity: 0 };
        let pipes = [];
        let score = 0;
        let highScore = 0;
        let frameCount = 0;
        let gameOver = false;
        let gameStarted = false;

        // Input Handling
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleAction();
            }
        });

        // Touch/Click support
        canvas.addEventListener('mousedown', handleAction);

        function handleAction() {
            if (!gameStarted) {
                gameStarted = true;
            } else if (gameOver) {
                resetGame();
            } else {
                bird.velocity = JUMP;
            }
        }

        function resetGame() {
            bird = { x: 50, y: 200, w: 24, h: 18, velocity: 0 };
            pipes = [];
            score = 0;
            frameCount = 0;
            gameOver = false;
        }

        function drawBird() {
            ctx.fillStyle = '#f7d308';
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
            // Eye
            ctx.fillStyle = 'white';
            ctx.fillRect(bird.x + 14, bird.y + 3, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(bird.x + 17, bird.y + 4, 3, 3);
            // Beak
            ctx.fillStyle = '#f75308';
            ctx.fillRect(bird.x + 20, bird.y + 8, 8, 6);
        }

        function drawPipes() {
            ctx.fillStyle = '#73bf2e';
            pipes.forEach(pipe => {
                // Top pipe
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.top);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, pipe.top);
                
                // Bottom pipe
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, PIPE_WIDTH, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, PIPE_WIDTH, pipe.bottom);
            });
        }

        function update() {
            if (!gameStarted || gameOver) return;

            bird.velocity += GRAVITY;
            bird.y += bird.velocity;

            // Collision: Floor or Ceiling
            if (bird.y + bird.h > canvas.height || bird.y < 0) {
                endGame();
            }

            // Pipe Logic
            if (frameCount % PIPE_SPAWN_RATE === 0) {
                let minPipeHeight = 50;
                let maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight;
                let topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
                pipes.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: canvas.height - topHeight - PIPE_GAP,
                    passed: false
                });
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= PIPE_SPEED;

                // Collision: Pipes
                if (
                    bird.x < pipe.x + PIPE_WIDTH &&
                    bird.x + bird.w > pipe.x &&
                    (bird.y < pipe.top || bird.y + bird.h > canvas.height - pipe.bottom)
                ) {
                    endGame();
                }

                // Score increment
                if (!pipe.passed && bird.x > pipe.x + PIPE_WIDTH) {
                    score++;
                    pipe.passed = true;
                }

                // Remove off-screen pipes
                if (pipe.x + PIPE_WIDTH < 0) {
                    pipes.splice(index, 1);
                }
            });

            frameCount++;
        }

        function endGame() {
            gameOver = true;
            if (score > highScore) highScore = score;
        }

        function draw() {
            // Background
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawPipes();
            drawBird();

            // UI
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.font = '24px Courier New';
            ctx.textAlign = 'center';

            if (!gameStarted) {
                ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2);
            } else if (gameOver) {
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText('SCORE: ' + score, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('HIGH: ' + highScore, canvas.width / 2, canvas.height / 2 + 50);
                ctx.font = '16px Courier New';
                ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 90);
            } else {
                ctx.fillText(score, canvas.width / 2, 50);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
