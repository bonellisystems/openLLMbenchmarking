<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Jump Clone</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:sans-serif;text-align:center;}
  canvas{background:#444;display:block;margin:0 auto;}
  #info{margin-top:10px;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="info">Score: <span id="score">0</span> | Press R to restart</div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const width = canvas.width, height = canvas.height;

  const player = {
    x: width/2,
    y: height - 50,
    radius: 15,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpForce: -12,
    onGround: false
  };

  const gravity = 0.4;
  const platforms = [];
  const platformHeight = 10;
  const platformWidth = 60;
  const platformGap = 80;
  const platformSpeed = 0; // world scroll handled by offset
  let offsetY = 0;
  let score = 0;
  let gameOver = false;
  let keys = {};

  function init() {
    player.x = width/2;
    player.y = height - 50;
    player.vx = 0;
    player.vy = 0;
    offsetY = 0;
    score = 0;
    gameOver = false;
    platforms.length = 0;
    generateInitialPlatforms();
    scoreEl.textContent = score;
    requestAnimationFrame(update);
  }

  function generateInitialPlatforms() {
    let y = height - 100;
    while (y > -height) {
      const x = Math.random() * (width - platformWidth);
      platforms.push({x, y, w: platformWidth, h: platformHeight});
      y -= platformGap;
    }
  }

  function generatePlatform() {
    const x = Math.random() * (width - platformWidth);
    const y = platforms[platforms.length-1].y - platformGap;
    platforms.push({x, y, w: platformWidth, h: platformHeight});
  }

  function update() {
    if (gameOver) return;
    // Input
    if (keys['ArrowLeft'] || keys['a']) player.vx = -player.speed;
    else if (keys['ArrowRight'] || keys['d']) player.vx = player.speed;
    else player.vx = 0;

    // Physics
    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    // Horizontal bounds
    if (player.x < 0) player.x = 0;
    if (player.x > width) player.x = width;

    // Platform collision
    if (player.vy > 0) {
      for (let p of platforms) {
        const px = p.x;
        const py = p.y + offsetY;
        if (player.x + player.radius > px && player.x - player.radius < px + p.w &&
            player.y + player.radius > py && player.y + player.radius < py + p.h) {
          player.vy = player.jumpForce;
          break;
        }
      }
    }

    // Scroll world
    if (player.y < height/2) {
      const delta = height/2 - player.y;
      offsetY += delta;
      player.y = height/2;
      score += Math.floor(delta);
      scoreEl.textContent = score;
    }

    // Remove off-screen platforms
    while (platforms.length && platforms[0].y + offsetY > height) {
      platforms.shift();
    }

    // Generate new platforms
    while (platforms.length && platforms[platforms.length-1].y + offsetY > -platformGap) {
      generatePlatform();
    }

    // Game over
    if (player.y - player.radius > height) {
      gameOver = true;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle = '#fff';
      ctx.font = '30px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', width/2, height/2);
      ctx.font = '20px sans-serif';
      ctx.fillText('Score: '+score, width/2, height/2+30);
      ctx.fillText('Press R to restart', width/2, height/2+60);
      return;
    }

    // Draw
    ctx.clearRect(0,0,width,height);
    // Draw platforms
    ctx.fillStyle = '#8f8';
    for (let p of platforms) {
      ctx.fillRect(p.x, p.y + offsetY, p.w, p.h);
    }
    // Draw player
    ctx.fillStyle = '#f88';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
    ctx.fill();

    requestAnimationFrame(update);
  }

  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') {
      if (player.vy > 0) player.vy = player.jumpForce;
    }
    if (e.key.toLowerCase() === 'r' && gameOver) init();
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  init();
})();
</script>
</body>
</html>
