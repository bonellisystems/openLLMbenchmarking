<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  color: #fff;
  user-select: none;
}
#game {
  position: relative;
}
canvas {
  display: block;
  border: 2px solid #444;
  background: #0a0a0a;
}
#info {
  position: absolute;
  top: -40px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 18px;
}
#score { color: #0f0; }
#high { color: #888; }
#msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  text-align: center;
  pointer-events: none;
  text-shadow: 0 0 10px rgba(0,255,0,0.5);
}
</style>
</head>
<body>
<div id="game">
  <div id="info">
    <span id="score">Score: 0</span>
    <span id="high">Best: 0</span>
  </div>
  <canvas id="c"></canvas>
  <div id="msg">Press any key</div>
</div>
<script>
var C = document.getElementById('c');
var X = C.getContext('2d');
var W = 400, H = 400, N = 20;
C.width = W; C.height = H;
var S = W / N;
var dir, next, food, snake, score, over, best = 0;
var tick = 120;
var last = 0;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0};
  next = {x:1,y:0};
  score = 0;
  over = false;
  place();
  document.getElementById('msg').style.display = 'none';
}

function place() {
  var t;
  do { t = {x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x===t.x && s.y===t.y));
  food = t;
}

function update() {
  dir = next;
  var h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.x>=N||h.y<0||h.y>=N) return die();
  if (snake.some(s => s.x===h.x && s.y===h.y)) return die();
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) {
    score += 10;
    place();
    tick = Math.max(50, 120 - Math.floor(score/50)*5);
  } else {
    snake.pop();
  }
}

function die() {
  over = true;
  if (score > best) best = score;
  document.getElementById('msg').innerHTML = 'Game Over<br><small>Press any key</small>';
  document.getElementById('msg').style.display = 'block';
}

function draw() {
  X.fillStyle = '#0a0a0a';
  X.fillRect(0,0,W,H);
  X.fillStyle = '#1a1a1a';
  for (var i=0;i<N;i++) for (var j=0;j<N;j++) if ((i+j)%2===0) X.fillRect(i*S,j*S,S,S);
  X.fillStyle = '#0f0';
  X.shadowColor = '#0f0';
  X.shadowBlur = 8;
  X.fillRect(food.x*S+1, food.y*S+1, S-2, S-2);
  X.shadowBlur = 0;
  for (var i=0;i<snake.length;i++) {
    var s = snake[i];
    var g = i===0 ? '#0f0' : '#0a0';
    X.fillStyle = g;
    X.fillRect(s.x*S+1, s.y*S+1, S-2, S-2);
  }
  document.getElementById('score').textContent = 'Score: ' + score;
  document.getElementById('high').textContent = 'Best: ' + best;
}

function loop(t) {
  if (!over) {
    if (t - last >= tick) { update(); last = t; }
  }
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', function(e) {
  if (over) { reset(); return; }
  var k = e.key;
  if (k==='ArrowUp'||k==='w') next = {x:0,y:-1};
  if (k==='ArrowDown'||k==='s') next = {x:0,y:1};
  if (k==='ArrowLeft'||k==='a') next = {x:-1,y:0};
  if (k==='ArrowRight'||k==='d') next = {x:1,y:0};
  if (k==='ArrowUp'||k==='w'||k==='ArrowDown'||k==='s'||k==='ArrowLeft'||k==='ArrowRight'||k==='a'||k==='d') e.preventDefault();
});

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
