<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;}
  canvas{background:#000;border:2px solid #555;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:2em;background:rgba(0,0,0,0.7);color:#fff;pointer-events:none;}
</style>
</head>
<body tabindex="0">
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="overlay"></div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const gridSize = 20;
  const tileSize = canvas.width / gridSize;
  let snake = [{x:10,y:10}];
  let direction = {x:1,y:0};
  let food = {x:5,y:5};
  let gameOver = false;
  let interval = null;

  function placeFood() {
    let valid = false;
    while (!valid) {
      food.x = Math.floor(Math.random()*gridSize);
      food.y = Math.floor(Math.random()*gridSize);
      valid = !snake.some(seg => seg.x===food.x && seg.y===food.y);
    }
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // draw food
    ctx.fillStyle = 'red';
    ctx.fillRect(food.x*tileSize, food.y*tileSize, tileSize, tileSize);
    // draw snake
    ctx.fillStyle = 'lime';
    snake.forEach(seg => {
      ctx.fillRect(seg.x*tileSize, seg.y*tileSize, tileSize, tileSize);
    });
  }

  function update() {
    if (gameOver) return;
    const newHead = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    // wall collision
    if (newHead.x < 0 || newHead.x >= gridSize || newHead.y < 0 || newHead.y >= gridSize) {
      endGame();
      return;
    }
    // self collision
    if (snake.some(seg => seg.x===newHead.x && seg.y===newHead.y)) {
      endGame();
      return;
    }
    snake.unshift(newHead);
    // food collision
    if (newHead.x===food.x && newHead.y===food.y) {
      placeFood();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    overlay.textContent = 'Game Over! Press any key to restart.';
  }

  function reset() {
    snake = [{x:10,y:10}];
    direction = {x:1,y:0};
    placeFood();
    gameOver = false;
    overlay.textContent = '';
  }

  function keyHandler(e) {
    if (gameOver) {
      reset();
      return;
    }
    const key = e.key;
    if (key === 'ArrowUp' && direction.y !== 1) direction = {x:0,y:-1};
    else if (key === 'ArrowDown' && direction.y !== -1) direction = {x:0,y:1};
    else if (key === 'ArrowLeft' && direction.x !== 1) direction = {x:-1,y:0};
    else if (key === 'ArrowRight' && direction.x !== -1) direction = {x:1,y:0};
    else if (key === 'w' && direction.y !== 1) direction = {x:0,y:-1};
    else if (key === 's' && direction.y !== -1) direction = {x:0,y:1};
    else if (key === 'a' && direction.x !== 1) direction = {x:-1,y:0};
    else if (key === 'd' && direction.x !== -1) direction = {x:1,y:0};
  }

  document.addEventListener('keydown', keyHandler);
  canvas.focus();

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  placeFood();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
