<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; background: #111; }
    #score { position: absolute; top: 10px; left: 10px; color: #fff; font-family: Arial, sans-serif; font-size: 18px; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="800" height="600"></canvas>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');

    let score = 0;
    let gameOver = false;

    const paddle = {
        x: canvas.width / 2 - 60,
        y: canvas.height - 20,
        width: 120,
        height: 15,
        speed: 8,
        dx: 0
    };

    const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 10,
        speed: 5,
        dx: 4,
        dy: -4
    };

    const brick = {
        width: 80,
        height: 20,
        padding: 5,
        visible: true
    };

    const brickRows = 6;
    const brickCols = 10;
    const bricks = [];

    for (let r = 0; r < brickRows; r++) {
        bricks[r] = [];
        for (let c = 0; c < brickCols; c++) {
            const x = c * (brick.width + brick.padding) + 30;
            const y = r * (brick.height + brick.padding) + 50;
            const colors = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22'];
            bricks[r][c] = {
                x, y,
                width: brick.width,
                height: brick.height,
                visible: true,
                color: colors[r % colors.length]
            };
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
            paddle.dx = -paddle.speed;
        } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
            paddle.dx = paddle.speed;
        }
        if (gameOver && e.key === ' ') {
            resetGame();
        }
    });

    document.addEventListener('keyup', () => {
        paddle.dx = 0;
    });

    function resetGame() {
        paddle.x = canvas.width / 2 - 60;
        paddle.y = canvas.height - 20;
        paddle.dx = 0;
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.dx = 4;
        ball.dy = -4;
        score = 0;
        gameOver = false;
        scoreDisplay.textContent = 'Score: 0';
        for (let r = 0; r < brickRows; r++) {
            for (let c = 0; c < brickCols; c++) {
                bricks[r][c].visible = true;
            }
        }
    }

    function movePaddle() {
        paddle.x += paddle.dx;
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
    }

    function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Wall collisions
        if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
            ball.dx *= -1;
        }
        if (ball.y - ball.radius < 0) {
            ball.dy *= -1;
        }

        // Bottom - Game Over
        if (ball.y + ball.radius > canvas.height) {
            gameOver = true;
        }

        // Paddle collision
        if (
            ball.y + ball.radius > paddle.y &&
            ball.x > paddle.x &&
            ball.x < paddle.x + paddle.width
        ) {
            ball.dy = -Math.abs(ball.dy);
            ball.y = paddle.y - ball.radius;
        }

        // Brick collisions
        for (let r = 0; r < brickRows; r++) {
            for (let c = 0; c < brickCols; c++) {
                const b = bricks[r][c];
                if (b.visible) {
                    if (
                        ball.x > b.x &&
                        ball.x < b.x + b.width &&
                        ball.y + ball.radius > b.y &&
                        ball.y - ball.radius < b.y + b.height
                    ) {
                        b.visible = false;
                        ball.dy *= -1;
                        score += 10;
                        scoreDisplay.textContent = 'Score: ' + score;
                    }
                }
            }
        }
    }

    function drawPaddle() {
        ctx.fillStyle = '#fff';
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawBricks() {
        for (let r = 0; r < brickRows; r++) {
            for (let c = 0; c < brickCols; c++) {
                const b = bricks[r][c];
                if (b.visible) {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.width, b.height);
                }
            }
        }
    }

    function drawGameOver() {
        ctx.fillStyle = '#fff';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 30);
        ctx.font = '24px Arial';
        ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 10);
    }

    function update() {
        if (gameOver) {
            drawGameOver();
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        movePaddle();
        moveBall();

        drawBricks();
        drawPaddle();
        drawBall();

        requestAnimationFrame(update);
    }

    update();
</script>
</body>
</html>
