<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Roguelike</title>
<style>
  body{background:#000;color:#0f0;font-family:monospace;text-align:center;margin:0;padding:20px;}
  #game{display:inline-block;white-space:pre;font-size:18px;}
</style>
</head>
<body>
<pre id="game"></pre>
<script>
(() => {
  const W=21, H=11;
  const gameDiv=document.getElementById('game');
  const map=[];
  for(let y=0;y<H;y++){
    map[y]=[];
    for(let x=0;x<W;x++){
      map[y][x]=Math.random()<0.15?'#':'.';
    }
  }
  // ensure start is floor
  let startX,startY;
  do{
    startX=Math.floor(Math.random()*W);
    startY=Math.floor(Math.random()*H);
  }while(map[startY][startX]!=='.');
  let player={x:startX,y:startY};
  // place a few monsters
  const monsters=[];
  for(let i=0;i<5;i++){
    let mx,my;
    do{
      mx=Math.floor(Math.random()*W);
      my=Math.floor(Math.random()*H);
    }while(!(map[my][mx]=='.' && !(mx===player.x && my===player.y));
    monsters.push({x:mx,y:my});
  }
  // place treasure
  let tx,ty;
  do{
    tx=Math.floor(Math.random()*W);
    ty=Math.floor(Math.random()*H);
  }while(!(map[ty][tx]=='.' && !(tx===player.x && ty===player.y) && !monsters.some(m=>m.x===tx && m.y===ty));
  const treasure={x:tx,y:ty};

  function render(){
    let out='';
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        if(x===player.x && y===player.y) out+='@';
        else if(monsters.some(m=>m.x===x && m.y===y)) out+='G';
        else if(x===treasure.x && y===treasure.y) out+='*';
        else out+=map[y][x];
      }
      out+='\n';
    }
    gameDiv.textContent=out;
  }
  function move(dx,dy){
    const nx=player.x+dx, ny=player.y+dy;
    if(nx<0||nx>=W||ny<0||ny>=H) return;
    if(map[ny][nx]!=='.') return;
    player.x=nx; player.y=ny;
    // check treasure
    if(nx===treasure.x && ny===treasure.y){
      alert('You found the treasure!'); 
      init();
      return;
    }
    // check monster
    if(monsters.some(m=>m.x===nx && m.y===ny)){
      alert('Game over!'); 
      init();
      return;
    }
    render();
  }
  function init(){
    // regenerate map and objects
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        map[y][x]=Math.random()<0.15?'#':'.';
      }
    }
    // ensure start floor
    let sx,sy;
    do{
      sx=Math.floor(Math.random()*W);
      sy=Math.floor(Math.random()*H);
    }while(map[sy][sx]!=='.');
    player={x:sx,y:sy};
    monsters.length=0;
    for(let i=0;i<5;i++){
      let mx,my;
      do{
        mx=Math.floor(Math.random()*W);
        my=Math.floor(Math.random()*H);
      }while(!(map[my][mx]=='.' && !(mx===player.x && my===player.y)));
      monsters.push({x:mx,y:my});
    }
    // treasure
    let tx,ty;
    do{
      tx=Math.floor(Math.random()*W);
      ty=Math.floor(Math.random()*H);
    }while(!(map[ty][tx]=='.' && !(tx===player.x && ty===player.y) && !monsters.some(m=>m.x===tx && m.y===ty)));
    treasure={x:tx,y:ty};
    render();
  }
  init();
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp') move(0,-1);
    else if(e.key==='ArrowDown') move(0,1);
    else if(e.key==='ArrowLeft') move(-1,0);
    else if(e.key==='ArrowRight') move(1,0);
  });
})();
</script>
</body>
</html>
