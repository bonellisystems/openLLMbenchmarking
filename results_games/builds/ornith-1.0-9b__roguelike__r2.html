<!DOCTYPE html>
<html>
<head>
<title>ASCII Roguelike</title>
<style>
    body {
        background-color: #111;
        color: #ccc;
        font-family: 'Courier New', Courier, monospace;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    pre {
        background-color: #000;
        color: #eee;
        padding: 10px;
        font-size: 14px;
        line-height: 14px;
        white-space: pre;
        outline: none;
        border: 1px solid #333;
    }
</style>
</head>
<body>
<pre id="game"></pre>
<script>
const COLS = 80;
const ROWS = 24;
const gameEl = document.getElementById('game');

// --- Game State ---
let map = [];
let rooms = [];
let entities = [];
let player = { x: 1, y: 1, hp: 10, maxHp: 10, atk: 2, name: 'Hero' };
let level = 1;
let gameOver = false;

// --- Map Generation ---
function generateMap() {
    // Fill with walls
    map = [];
    for (let y = 0; y < ROWS; y++) {
        map[y] = [];
        for (let x = 0; x < COLS; x++) {
            map[y][x] = 1; // 1 = wall
        }
    }

    // Carve rooms
    const maxRooms = 15;
    const minSize = 4;
    const maxSize = 8;
    const roomAttempts = 200;

    for (let i = 0; i < maxRooms; i++) {
        const w = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
        const h = Math.floor(Math.random() * (maxSize - minSize + 1)) + minSize;
        const x = Math.floor(Math.random() * (COLS - w - 2)) + 1;
        const y = Math.floor(Math.random() * (ROWS - h - 2)) + 1;

        const newRoom = { x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) };

        let failed = false;
        for (let other of rooms) {
            if (x < other.x + other.w && x + newRoom.w > other.x &&
                y < other.y + other.h && y + newRoom.h > other.y) {
                failed = true;
                break;
            }
        }

        if (!failed) {
            carveRoom(newRoom);
            rooms.push(newRoom);
            if (rooms.length > 1) {
                connectRooms(rooms[rooms.length - 2], rooms[rooms.length - 1]);
            }
        }
    }

    // Place Player in first room
    player.x = rooms[0].cx;
    player.y = rooms[0].cy;

    // Place Enemies
    const enemyCount = 3 + Math.floor(level * 1.5);
    for (let i = 0; i < enemyCount; i++) {
        placeEntity({
            type: 'enemy',
            name: ['Slime', 'Skeleton', 'Goblin', 'Orc'][Math.floor(Math.random() * 4)],
            hp: 3 + level,
            maxHp: 3 + level,
            atk: 1 + Math.floor(level / 2),
            x: rooms[Math.floor(Math.random() * rooms.length)].cx,
            y: rooms[Math.floor(Math.random() * rooms.length)].cy
        });
    }

    // Place Items
    const itemCount = 2 + Math.floor(level / 2);
    for (let i = 0; i < itemCount; i++) {
        const types = ['potion', 'sword', 'shield'];
        const type = types[Math.floor(Math.random() * types.length)];
        placeEntity({
            type: 'item',
            name: type === 'potion' ? 'Potion' : (type === 'sword' ? 'Sword' : 'Shield'),
            x: rooms[Math.floor(Math.random() * rooms.length)].cx,
            y: rooms[Math.floor(Math.random() * rooms.length)].cy
        });
    }
}

function carveRoom(room) {
    for (let y = room.y; y < room.y + room.h; y++) {
        for (let x = room.x; x < room.x + room.w; x++) {
            if (y > 0 && y < ROWS - 1 && x > 0 && x < COLS - 1) {
                map[y][x] = 0;
            }
        }
    }
}

function connectRooms(a, b) {
    // Horizontal then vertical
    let x = a.cx;
    let y = a.cy;
    // Randomly choose to go horizontal first or vertical first
    if (Math.random() > 0.5) {
        while (x !== b.cx) {
            x += Math.random() > 0.5 ? 1 : -1;
            if (x < a.x || x >= a.x + a.w || x < b.x || x >= b.x + b.w) continue;
            map[y][x] = 0;
        }
        while (y !== b.cy) {
            y += Math.random() > 0.5 ? 1 : -1;
            if (y < a.y || y >= a.y + a.h || y < b.y || y >= b.y + b.h) continue;
            map[y][x] = 0;
        }
    } else {
        while (y !== b.cy) {
            y += Math.random() > 0.5 ? 1 : -1;
            if (y < a.y || y >= a.y + a.h || y < b.y || y >= b.y + b.h) continue;
            map[y][x] = 0;
        }
        while (x !== b.cx) {
            x += Math.random() > 0.5 ? 1 : -1;
            if (x < a.x || x >= a.x + a.w || x < b.x || x >= b.x + b.w) continue;
            map[y][x] = 0;
        }
        while (y !== b.cy) {
            y += Math.random() > 0.5 ? 1 : -1;
            if (y < a.y || y >= a.y + a.h || y < b.y || y >= b.y + b.h) continue;
            map[y][x] = 0;
        }
    }
}

function placeEntity(ent) {
    // Ensure entity is on a floor tile and not on another entity
    let valid = false;
    while (!valid) {
        ent.x = Math.floor(Math.random() * COLS);
        ent.y = Math.floor(Math.random() * ROWS);
        if (map[ent.y][ent.x] === 0) {
            valid = true;
            for (let e of entities) {
                if (e.x === ent.x && e.y === ent.y && e !== ent) valid = false;
            }
        }
    }
    entities.push(ent);
}

// --- Rendering ---
function render() {
    let output = '';
    // Header
    output += '\x1b[1;36mLevel ' + level + ' | HP: ' + player.hp + '/' + player.maxHp + ' | ATK: ' + player.atk + '\x1b[0m\n';
    output += '\n';

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            let char = ' ';
            let fg = '#eee';
            let bg = '#000';

            // Check FOV (simple distance)
            const dist = Math.hypot(x - player.x, y - player.y);
            const inFov = dist < 7;

            if (!inFov) {
                char = '#';
                fg = '#333';
            } else {
                // Check entities
                let ent = entities.find(e => e.x === x && e.y === y);
                if (ent) {
                    if (ent.type === 'enemy') {
                        char = '^';
                        fg = '#f55';
                    } else if (ent.type === 'item') {
                        char = '*';
                        fg = '#ff0';
                    }
                } else if (map[y][x] === 0) {
                    char = '.';
                    fg = '#555';
                } else {
                    char = '#';
                    fg = '#333';
                }

                // Player
                if (x === player.x && y === player.y) {
                    char = '@';
                    fg = '#0f0';
                }
            }

            output += '\x1b[' + fg + ';' + bg + 'm' + char + '\x1b[0m';
        }
        output += '\n';
    }

    // Footer
    output += '\n';
    output += '\x1b[1;33mControls: Arrows/WASD to move. Enter to attack.\x1b[0m\n';

    gameEl.textContent = output;
}

// --- Game Logic ---
function handleInput(e) {
    if (gameOver) return;

    const key = e.key;
    let dx = 0, dy = 0;

    if (key === 'ArrowUp' || key === 'w') dy = -1;
    else if (key === 'ArrowDown' || key === 's') dy = 1;
    else if (key === 'ArrowLeft' || key === 'a') dx = -1;
    else if (key === 'ArrowRight' || key === 'd') dx = 1;
    else if (key === 'Enter') {
        // Attack
        for (let ent of entities) {
            if (ent.type === 'enemy' && ent.x === player.x && ent.y === player.y) {
                ent.hp -= player.atk;
                if (ent.hp <= 0) {
                    // Enemy dies, drop item
                    placeEntity({ type: 'item', name: 'Gold', x: ent.x, y: ent.y });
                    entities = entities.filter(e => e !== ent);
                }
            }
        }
        render();
        return;
    } else {
        return;
    }

    e.preventDefault();

    const newX = player.x + dx;
    const newY = player.y + dy;

    // Bounds check
    if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) return;

    // Wall check
    if (map[newY][newX] === 1) return;

    // Entity collision
    let target = entities.find(e => e.x === newX && e.y === newY);

    if (target) {
        if (target.type === 'enemy') {
            // Attack enemy
            target.hp -= player.atk;
            if (target.hp <= 0) {
                entities = entities.filter(e => e !== target);
            } else {
                // Enemy counter-attack
                player.hp -= target.atk;
            }
        } else if (target.type === 'item') {
            // Pick up item
            if (target.name === 'Potion') {
                player.hp = Math.min(player.hp + 3, player.maxHp);
            } else if (target.name === 'Sword') {
                player.atk += 1;
            } else if (target.name === 'Shield') {
                player.maxHp += 2;
                player.hp += 2;
            } else if (target.name === 'Gold') {
                // Just a flavor item, maybe heal slightly
                player.hp = Math.min(player.hp + 1, player.maxHp);
            }
            entities = entities.filter(e => e !== target);
        }
    } else {
        // Move
        player.x = newX;
        player.y = newY;
    }

    // Update Enemies
    updateEnemies();

    // Check Death
    if (player.hp <= 0) {
        gameOver = true;
        render();
        return;
    }

    // Level Up
    if (entities.length === 0) {
        level++;
        generateMap();
        render();
        return;
    }

    render();
}

function updateEnemies() {
    for (let ent of entities) {
        if (ent.type !== 'enemy') continue;
        if (Math.random() > 0.3) continue; // 30% move chance

        let dx = 0, dy = 0;
        if (player.x > ent.x) dx = 1;
        else if (player.x < ent.x) dx = -1;
        else if (player.y > ent.y) dy = 1;
        else if (player.y < ent.y) dy = -1;

        // Try to move
        const nx = ent.x + dx;
        const ny = ent.y + dy;

        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] === 0) {
            // Check if moving there kills player
            const collision = entities.find(e => e.x === nx && e.y === ny && e !== ent);
            if (!collision || collision.type !== 'enemy') {
                ent.x = nx;
                ent.y = ny;
            }
        }
    }
}

// --- Init ---
function init() {
    generateMap();
    render();
    gameEl.focus();
}

document.addEventListener('keydown', handleInput);
init();
</script>
</body>
</html>
