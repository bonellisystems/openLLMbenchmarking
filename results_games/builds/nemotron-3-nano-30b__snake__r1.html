<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;color:#fff;font-family:sans-serif}
canvas{background:#222;display:block}
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const tileSize=20;
const cols=canvas.width/tileSize;
const rows=canvas.height/tileSize;
let snake=[{x:5*tileSize,y:5*tileSize}];
let dx=tileSize; let dy=0;
let food={x:Math.floor(Math.random()*cols)*tileSize, y:Math.floor(Math.random()*rows)*tileSize};
let score=0;
let gameOver=false;
function drawRect(x,y,color){
ctx.fillStyle=color;
ctx.fillRect(x,y,tileSize,tileSize);
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
drawRect(food.x,food.y,'red');
snake.forEach(segment=>drawRect(segment.x,segment.y,'lime'));
}
function update(){
if(gameOver)return;
dx=dx||0; dy=dy||0;
const newHead={x:(snake[0].x+dx), y:(snake[0].y+dy)};
if(newHead.x<0||newHead.x>=canvas.width||newHead.y<0||newHead.y>=canvas.height){gameOver=true;return;}
if(snake.some(seg=>seg.x===newHead.x && seg.y===newHead.y)){gameOver=true;return;}
snake.unshift(newHead);
if(newHead.x===food.x && newHead.y===food.y){
score++;
food={x:Math.floor(Math.random()*cols)*tileSize, y:Math.floor(Math.random()*rows)*tileSize};
}else{
snake.pop();
}
}
function loop(){
if(!gameOver)requestAnimationFrame(loop);
update();
draw();
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-tileSize;}
else if(e.key==='ArrowDown'&&dy===0){dx=0;dy=tileSize;}
else if(e.key==='ArrowLeft'&&dx===0){dx=-tileSize;dy=0;}
else if(e.key==='ArrowRight'&&dx===0){dx=tileSize;dy=0;}
});
loop();
</script>
</body>
</html>
