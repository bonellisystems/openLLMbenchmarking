<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }
    .game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    .score-board {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px 40px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .score {
        font-size: 2rem;
        font-weight: bold;
        color: #4ecca3;
        text-align: center;
    }
    .high-score {
        font-size: 1rem;
        color: #a0a0c0;
        margin-top: 5px;
    }
    canvas {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        box-shadow: 
            inset 0 0 20px rgba(0, 0, 0, 0.5),
            0 0 30px rgba(78, 202, 163, 0.2);
        border: 2px solid rgba(78, 202, 163, 0.3);
    }
    .game-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(26, 26, 46, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 0 50px rgba(255, 100, 100, 0.4);
        border: 1px solid rgba(255, 100, 100, 0.5);
        display: none;
    }
    .game-over h1 {
        color: #ff6b6b;
        font-size: 3rem;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(255, 107, 107, 0.7);
    }
    .game-over p {
        color: #a0a0c0;
        font-size: 1.2rem;
        margin-bottom: 30px;
    }
    .restart-btn {
        background: linear-gradient(45deg, #4ecca3, #45b39d);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(78, 202, 163, 0.4);
    }
    .restart-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(78, 202, 163, 0.6);
    }
    .instructions {
        color: #a0a0c0;
        font-size: 0.9rem;
        text-align: center;
        max-width: 400px;
        line-height: 1.6;
    }
    .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
    }
    .control-key {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #4ecca3;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div class="score" id="score">Score: 0</div>
            <div class="high-score" id="high-score">High Score: 0</div>
        </div>
        <canvas id="game-canvas" width="600" height="600"></canvas>
        <div class="instructions">
            Use arrow keys or WASD to control the snake. Eat the red food to grow longer!
            <div class="controls">
                <div class="control-key">↑</div>
                <div class="control-key">↓</div>
                <div class="control-key">←</div>
                <div class="control-key">→</div>
            </div>
        </div>
    </div>
    <div class="game-over" id="game-over">
        <h1>Game Over!</h1>
        <p id="final-score">Your score: 0</p>
        <button class="restart-btn" id="restart-btn">Play Again</button>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        // Game constants
        const GRID_SIZE = 20;
        const GRID_WIDTH = canvas.width / GRID_SIZE;
        const GRID_HEIGHT = canvas.height / GRID_SIZE;
        
        // Game variables
        let snake, food, gameInterval, score = 0, highScore = 0;
        let gameRunning = false;
        
        // Colors
        const COLORS = {
            background: '#0f0f23',
            grid: '#1a1a3e',
            snakeHead: '#4ecca3',
            snakeBody: '#45b39d',
            food: '#ff6b6b',
            text: '#ffffff'
        };
        
        // Initialize game
        function init() {
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            snakeDirection = {x: 1, y: 0};
            placeFood();
            score = 0;
            updateScore();
            gameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150);
        }
        
        // Place food at random position
        function placeFood() {
            food = {
                x: Math.floor(Math.random() * GRID_WIDTH),
                y: Math.floor(Math.random() * GRID_HEIGHT)
            };
            // Make sure food doesn't appear on snake
            for (let cell of snake) {
                if (cell.x === food.x && cell.y === food.y) {
                    return placeFood();
                }
            }
        }
        
        // Main game loop
        function gameLoop() {
            // Move snake
            const head = {x: snake[0].x + snakeDirection.x, y: snake[0].y + snakeDirection.y};
            
            // Check wall collision
            if (head.x < 0 || head.x >= GRID_WIDTH || head.y < 0 || head.y >= GRID_HEIGHT) {
                gameOver();
                return;
            }
            
            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                updateScore();
                placeFood();
            } else {
                // Remove tail
                snake.pop();
            }
            
            // Draw everything
            draw();
        }
        
        // Draw the game
        function draw() {
            // Clear canvas
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 0.5;
            for (let x = 0; x < GRID_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < GRID_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }
            
            // Draw food
            ctx.fillStyle = COLORS.food;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            // Add highlight to food
            ctx.fillStyle = '#ff8e8e';
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2 - 3,
                food.y * GRID_SIZE + GRID_SIZE / 2 - 3,
                GRID_SIZE / 6,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Draw snake
            for (let i = snake.length - 1; i >= 0; i--) {
                const segment = snake[i];
                const isHead = i === 0;
                
                // Draw segment
                ctx.fillStyle = isHead ? COLORS.snakeHead : COLORS.snakeBody;
                ctx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
                
                // Add rounded corners effect
                ctx.strokeStyle = isHead ? COLORS.snakeHead : COLORS.snakeBody;
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
                
                // Draw eyes on head
                if (isHead) {
                    ctx.fillStyle = '#000000';
                    const eyeSize = 3;
                    const eyeOffset = 4;
                    
                    // Determine eye positions based on direction
                    let eye1X, eye1Y, eye2X, eye2Y;
                    
                    if (snakeDirection.x > 0) { // Moving right
                        eye1X = segment.x * GRID_SIZE + GRID_SIZE - 8;
                        eye1Y = segment.y * GRID_SIZE + 6;
                        eye2X = segment.x * GRID_SIZE + GRID_SIZE - 8;
                        eye2Y = segment.y * GRID_SIZE + 14;
                    } else if (snakeDirection.x < 0) { // Moving left
                        eye1X = segment.x * GRID_SIZE + 4;
                        eye1Y = segment.y * GRID_SIZE + 6;
                        eye2X = segment.x * GRID_SIZE + 4;
                        eye2Y = segment.y * GRID_SIZE + 14;
                    } else if (snakeDirection.y > 0) { // Moving down
                        eye1X = segment.x * GRID_SIZE + 6;
                        eye1Y = segment.y * GRID_SIZE + GRID_SIZE - 8;
                        eye2X = segment.x * GRID_SIZE + 14;
                        eye2Y = segment.y * GRID_SIZE + GRID_SIZE - 8;
                    } else { // Moving up
                        eye1X = segment.x * GRID_SIZE + 6;
                        eye1Y = segment.y * GRID_SIZE + 4;
                        eye2X = segment.x * GRID_SIZE + 14;
                        eye2Y = segment.y * GRID_SIZE + 4;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = `Score: ${score}`;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }
            document.getElementById('high-score').textContent = `High Score: ${highScore}`;
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('final-score').textContent = `Your score: ${score}`;
            document.getElementById('game-over').style.display = 'block';
        }
        
        // Restart game
        function restart() {
            document.getElementById('game-over').style.display = 'none';
            init();
        }
        
        // Keyboard controls
        let snakeDirection = {x: 1, y: 0};
        
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (snakeDirection.y !== 1) {
                        snakeDirection = {x: 0, y: -1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (snakeDirection.y !== -1) {
                        snakeDirection = {x: 0, y: 1};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (snakeDirection.x !== 1) {
                        snakeDirection = {x: -1, y: 0};
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (snakeDirection.x !== -1) {
                        snakeDirection = {x: 1, y: 0};
                    }
                    e.preventDefault();
                    break;
            }
        });
        
        // Restart button
        document.getElementById('restart-btn').addEventListener('click', restart);
        
        // Load high score from localStorage
        window.addEventListener('load', () => {
            const savedHighScore = localStorage.getItem('snakeHighScore');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore);
                document.getElementById('high-score').textContent = `High Score: ${highScore}`;
            }
            init();
        });
        
        // Prevent scrolling with arrow keys
        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
