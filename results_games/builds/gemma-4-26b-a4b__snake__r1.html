<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            border: 5px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #000;
        }
        .score-container {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="score-container">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0;
        let dy = 0;
        let snake = [
            {x: 10, y: 10},
            {x: 10, y: 11},
            {x: 10, y: 12}
        ];
        let food = {x: 5, y: 5};
        let nextDirection = {dx: 0, dy: -1};
        let gameSpeed = 100;
        let gameLoopTimeout;

        // Initialize direction so it starts moving immediately
        dx = 0;
        dy = -1;
        nextDirection = {dx: 0, dy: -1};

        document.addEventListener("keydown", changeDirection);

        function main() {
            if (didGameEnd()) {
                ctx.fillStyle = "white";
                ctx.font = "40px Courier New";
                ctx.fillText("GAME OVER", canvas.width / 6.5, canvas.height / 2);
                ctx.font = "20px Courier New";
                ctx.fillText("Press F5 to Restart", canvas.width / 4, canvas.height / 2 + 40);
                return;
            }

            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, gameSpeed);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#8BC34A";
                ctx.strokeStyle = "#1a1a1a";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function advanceSnake() {
            // Apply the buffered direction
            dx = nextDirection.dx;
            dy = nextDirection.dy;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            const didEatFood = snake[0].x === food.x && snake[0].y === food.y;
            if (didEatFood) {
                score += 10;
                scoreElement.innerHTML = score;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            for (let i = 0; i < snake.length - 1; i++) {
                const part = snake[i];
                if (part.x === snake[0].x && part.y === snake[0].y) return true;
            }
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x > tileCount - 1;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y > tileCount - 1;
            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function createFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Make sure food doesn't spawn on snake body
            snake.forEach(function(part) {
                if (part.x == food.x && part.y == food.y) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.strokeStyle = "white";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                nextDirection = {dx: -1, dy: 0};
            }
            if (keyPressed === UP_KEY && !goingDown) {
                nextDirection = {dx: 0, dy: -1};
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                nextDirection = {dx: 1, dy: 0};
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                nextDirection = {dx: 0, dy: 1};
            }
        }

        // Start the game
        createFood();
        main();
    </script>
</body>
</html>
