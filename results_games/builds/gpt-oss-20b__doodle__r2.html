<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Jump Clone</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:sans-serif;text-align:center;}
  canvas{background:#111;display:block;margin:0 auto;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2em;pointer-events:none;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="overlay"></div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const W = canvas.width, H = canvas.height;

  let player = {x: W/2, y: H-50, r: 15, vy: 0};
  const gravity = 0.4;
  const jumpVel = -10;
  const moveSpeed = 5;
  let left = false, right = false;
  let platforms = [];
  const platformHeight = 10;
  const platformGap = 80;
  let score = 0;
  let gameOver = false;

  function init() {
    player = {x: W/2, y: H-50, r: 15, vy: 0};
    platforms = [];
    score = 0;
    gameOver = false;
    overlay.textContent = '';
    // generate initial platforms
    let y = H - 100;
    while (y > -H) {
      const w = Math.random() * 50 + 50;
      const x = Math.random() * (W - w);
      platforms.push({x, y, w, h: platformHeight});
      y -= platformGap;
    }
  }

  function update() {
    if (gameOver) return;
    // horizontal movement
    if (left) player.x -= moveSpeed;
    if (right) player.x += moveSpeed;
    if (player.x < player.r) player.x = player.r;
    if (player.x > W - player.r) player.x = W - player.r;

    // apply gravity
    player.vy += gravity;
    player.y += player.vy;

    // collision with platforms
    if (player.vy > 0) {
      for (let p of platforms) {
        if (player.y + player.r >= p.y && player.y + player.r <= p.y + p.h &&
            player.x + player.r >= p.x && player.x - player.r <= p.x + p.w) {
          player.y = p.y - player.r;
          player.vy = jumpVel;
          score++;
        }
      }
    }

    // scroll platforms up when player reaches top quarter
    if (player.y < H/4) {
      const diff = H/4 - player.y;
      player.y = H/4;
      for (let p of platforms) p.y += diff;
      // generate new platforms above
      while (platforms[0] && platforms[0].y > -platformHeight) {
        const w = Math.random() * 50 + 50;
        const x = Math.random() * (W - w);
        const y = platforms[0].y - platformGap;
        platforms.unshift({x, y, w, h: platformHeight});
      }
      // remove platforms below canvas
      while (platforms[platforms.length-1] && platforms[platforms.length-1].y > H) {
        platforms.pop();
      }
    }

    // game over if player falls below canvas
    if (player.y - player.r > H) {
      gameOver = true;
      overlay.textContent = 'Game Over\nScore: ' + score + '\nPress Space to Restart';
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // draw platforms
    ctx.fillStyle = '#4caf50';
    for (let p of platforms) {
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }
    // draw player
    ctx.fillStyle = '#ff5722';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fill();
    // draw score
    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText('Score: ' + score, 10, 30);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // input handling
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') right = true;
    if (e.code === 'Space') {
      if (gameOver) init();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') right = false;
  });

  init();
  loop();
})();
</script>
</body>
</html>
