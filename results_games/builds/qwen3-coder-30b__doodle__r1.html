<!DOCTYPE html>
<html>
<head>
    <title>Doodle Jump</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        #gameCanvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        #scoreDisplay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        #restartButton {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        #startButton {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="scoreDisplay">Score: 0</div>
        <div id="gameOver">
            <h2>Game Over</h2>
            <p id="finalScore">Score: 0</p>
            <button id="restartButton">Play Again</button>
        </div>
        <div id="startScreen">
            <h2>Doodle Jump</h2>
            <p>Use Arrow Keys to move</p>
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');

        // Game state
        let gameRunning = false;
        let score = 0;
        let cameraY = 0;
        let platforms = [];
        let doodle = {
            x: 200,
            y: 500,
            width: 40,
            height: 40,
            velocityX: 0,
            velocityY: 0,
            jumping: false
        };

        // Platform class
        class Platform {
            constructor(x, y, width, height, type = 'normal') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
                this.color = type === 'moving' ? '#FF5722' : 
                           type === 'breakable' ? '#9E9E9E' : 
                           type === 'spring' ? '#FFEB3B' : '#4CAF50';
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y - cameraY, this.width, this.height);
                
                // Add platform details
                ctx.fillStyle = '#388E3C';
                ctx.fillRect(this.x, this.y - cameraY, this.width, 5);
            }

            update() {
                if (this.type === 'moving') {
                    this.x += 2;
                    if (this.x > canvas.width - this.width) {
                        this.x = canvas.width - this.width;
                    }
                    if (this.x < 0) {
                        this.x = 0;
                    }
                }
            }
        }

        // Initialize game
        function initGame() {
            gameRunning = true;
            score = 0;
            cameraY = 0;
            doodle = {
                x: 200,
                y: 500,
                width: 40,
                height: 40,
                velocityX: 0,
                velocityY: 0,
                jumping: false
            };
            platforms = [];
            generatePlatforms();
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'none';
        }

        // Generate platforms
        function generatePlatforms() {
            // Ground platform
            platforms.push(new Platform(150, 580, 100, 20, 'normal'));
            
            // Generate platforms going upward
            for (let i = 0; i < 20; i++) {
                const y = 580 - i * 30;
                const x = Math.random() * (canvas.width - 100);
                const width = 80 + Math.random() * 40;
                const type = Math.random() < 0.1 ? 'breakable' : 
                            Math.random() < 0.05 ? 'spring' : 
                            Math.random() < 0.1 ? 'moving' : 'normal';
                
                platforms.push(new Platform(x, y, width, 15, type));
            }
        }

        // Draw doodle
        function drawDoodle() {
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(doodle.x, doodle.y - cameraY, doodle.width, doodle.height);
            
            // Draw eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(doodle.x + 10, doodle.y - cameraY + 10, 8, 8);
            ctx.fillRect(doodle.x + 22, doodle.y - cameraY + 10, 8, 8);
            
            // Draw pupils
            ctx.fillStyle = 'black';
            ctx.fillRect(doodle.x + 12, doodle.y - cameraY + 12, 4, 4);
            ctx.fillRect(doodle.x + 24, doodle.y - cameraY + 12, 4, 4);
            
            // Draw mouth
            ctx.fillStyle = 'black';
            ctx.fillRect(doodle.x + 15, doodle.y - cameraY + 25, 10, 3);
        }

        // Update game state
        function update() {
            if (!gameRunning) return;

            // Apply gravity
            doodle.velocityY += 0.5;
            
            // Update doodle position
            doodle.x += doodle.velocityX;
            doodle.y += doodle.velocityY;
            
            // Screen boundaries
            if (doodle.x < 0) doodle.x = 0;
            if (doodle.x > canvas.width - doodle.width) doodle.x = canvas.width - doodle.width;
            
            // Camera follows doodle
            if (doodle.y < canvas.height / 3) {
                cameraY += (canvas.height / 3 - doodle.y) * 0.1;
            }
            
            // Check if doodle is falling off screen
            if (doodle.y > canvas.height + 100) {
                gameOver();
                return;
            }
            
            // Update platforms
            platforms.forEach(platform => {
                platform.update();
            });
            
            // Platform collision
            let onPlatform = false;
            platforms.forEach(platform => {
                if (doodle.velocityY > 0 && 
                    doodle.x + doodle.width > platform.x &&
                    doodle.x < platform.x + platform.width &&
                    doodle.y + doodle.height > platform.y &&
                    doodle.y + doodle.height < platform.y + platform.height + 10 &&
                    doodle.y + doodle.height + doodle.velocityY > platform.y) {
                    
                    // Spring platform
                    if (platform.type === 'spring') {
                        doodle.velocityY = -15;
                        doodle.jumping = true;
                    } else {
                        doodle.velocityY = 0;
                        doodle.jumping = false;
                        doodle.y = platform.y - doodle.height;
                        onPlatform = true;
                    }
                    
                    // Breakable platform
                    if (platform.type === 'breakable') {
                        platforms = platforms.filter(p => p !== platform);
                    }
                }
            });
            
            // Update score based on height
            score = Math.max(score, Math.floor((580 - doodle.y) / 10));
            scoreDisplay.textContent = `Score: ${score}`;
            
            // Generate new platforms as needed
            if (platforms.length < 25) {
                const lastPlatform = platforms[platforms.length - 1];
                const y = lastPlatform.y - 30;
                const x = Math.random() * (canvas.width - 100);
                const width = 80 + Math.random() * 40;
                const type = Math.random() < 0.1 ? 'breakable' : 
                            Math.random() < 0.05 ? 'spring' : 
                            Math.random() < 0.1 ? 'moving' : 'normal';
                
                platforms.push(new Platform(x, y, width, 15, type));
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background elements
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(100, 100, 30, 0, Math.PI * 2);
            ctx.arc(130, 90, 35, 0, Math.PI * 2);
            ctx.arc(160, 100, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(300, 150, 30, 0, Math.PI * 2);
            ctx.arc(330, 140, 35, 0, Math.PI * 2);
            ctx.arc(360, 150, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw platforms
            platforms.forEach(platform => {
                platform.draw();
            });
            
            // Draw doodle
            drawDoodle();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Handle keyboard input
        const keys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === 'ArrowLeft') {
                doodle.velocityX = -5;
            }
            if (e.key === 'ArrowRight') {
                doodle.velocityX = 5;
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            
            if (e.key === 'ArrowLeft' && doodle.velocityX < 0) {
                doodle.velocityX = 0;
            }
            if (e.key === 'ArrowRight' && doodle.velocityX > 0) {
                doodle.velocityX = 0;
            }
        });

        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'block';
        }

        // Event listeners for buttons
        restartButton.addEventListener('click', () => {
            initGame();
            gameLoop();
        });

        startButton.addEventListener('click', () => {
            initGame();
            gameLoop();
        });

        // Initialize the game
        initGame();
    </script>
</body>
</html>
