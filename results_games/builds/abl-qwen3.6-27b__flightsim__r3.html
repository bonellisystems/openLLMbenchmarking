<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flight Simulator</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:10px;color:#0f0;font:14px monospace;text-shadow:0 0 4px #000;pointer-events:none;z-index:10}
#help{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#fff;font:12px monospace;text-shadow:0 0 4px #000;pointer-events:none;opacity:.7;z-index:10}

<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="help">W/S Pitch | A/D Roll | Q/E Yaw | Shift/Ctrl Throttle | Space Brake</div>
<script>
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.body.innerHTML='<h1 style="color:white;text-align:center;margin-top:40vh">WebGL not supported</h1>';throw'no webgl';}

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;gl.viewport(0,0,canvas.width,canvas.height);}
window.addEventListener('resize',resize);resize();

// Matrix math
const M4={
create(){return new Float32Array(16)},
identity(o){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o},
perspective(o,fov,asp,n,f){const t=Math.tan(fov/2);o.fill(0);o[0]=1/(asp*t);o[5]=1/t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o},
multiply(o,a,b){const t=M4.create();for(let i=0;i<4;i++)for(let j=0;j<4;j++){t[j*4+i]=0;for(let k=0;k<4;k++)t[j*4+i]+=a[k*4+i]*b[j*4+k];}for(let i=0;i<16;i++)o[i]=t[i];return o},
translate(o,a,v){const t=M4.create();M4.identity(t);t[12]=v[0];t[13]=v[1];t[14]=v[2];return M4.multiply(o,a,t)},
rotateX(o,a,r){const c=Math.cos(r),s=Math.sin(r),t=M4.create();M4.identity(t);t[5]=c;t[6]=s;t[9]=-s;t[10]=c;return M4.multiply(o,a,t)},
rotateY(o,a,r){const c=Math.cos(r),s=Math.sin(r),t=M4.create();M4.identity(t);t[0]=c;t[2]=-s;t[8]=s;t[10]=c;return M4.multiply(o,a,t)},
rotateZ(o,a,r){const c=Math.cos(r),s=Math.sin(r),t=M4.create();M4.identity(t);t[0]=c;t[1]=s;t[4]=-s;t[5]=c;return M4.multiply(o,a,t)},
scale(o,a,v){const t=M4.create();M4.identity(t);t[0]=v[0];t[5]=v[1];t[10]=v[2];return M4.multiply(o,a,t)},
lookAt(o,eye,center,up){let zx=eye[0]-center[0],zy=eye[1]-center[1],zz=eye[2]-center[2];let l=1/Math.sqrt(zx*zx+zy*zy+zz*zz);zx*=l;zy*=l;zz*=l;let xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx;l=Math.sqrt(xx*xx+xy*xy+xz*xz);if(l){l=1/l;xx*=l;xy*=l;xz*=l;}else{xx=0;xy=0;xz=0;}let yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);o[15]=1;return o},
invert(o,a){const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;let d=b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;if(!d)return o;d=1/d;o[0]=(a11*b11-a12*b10+a13*b09)*d;o[1]=(a02*b10-a01*b11-a03*b09)*d;o[2]=(a31*b05-a32*b04+a33*b03)*d;o[3]=(a22*b04-a21*b05-a23*b03)*d;o[4]=(a12*b08-a10*b11-a13*b07)*d;o[5]=(a00*b11-a02*b08+a03*b07)*d;o[6]=(a32*b02-a30*b05-a33*b01)*d;o[7]=(a20*b05-a22*b02+a23*b01)*d;o[8]=(a10*b10-a11*b08+a13*b06)*d;o[9]=(a01*b08-a00*b10-a03*b06)*d;o[10]=(a30*b04-a31*b02+a33*b00)*d;o[11]=(a21*b02-a20*b04-a23*b00)*d;o[12]=(a11*b07-a10*b09-a12*b06)*d;o[13]=(a00*b09-a01*b07+a02*b06)*d;o[14]=(a31*b01-a30*b03-a32*b00)*d;o[15]=(a20*b03-a21*b01+a22*b00)*d;return o}
};

// Shaders
const vsSource=`
attribute vec3 aPos;
attribute vec3 aNorm;
attribute vec3 aColor;
uniform mat4 uProj;
uniform mat4 uView;
uniform mat4 uModel;
varying vec3 vNorm;
varying vec3 vColor;
varying vec3 vWorldPos;
void main(){
vec4 wp=uModel*vec4(aPos,1.0);
vWorldPos=wp.xyz;
vNorm=mat3(uModel)*aNorm;
vColor=aColor;
gl_Position=uProj*uView*wp;
}`;

const fsSource=`
precision mediump float;
varying vec3 vNorm;
varying vec3 vColor;
varying vec3 vWorldPos;
uniform vec3 uLightDir;
uniform vec3 uEye;
uniform float uFogDist;
uniform vec3 uFogColor;
void main(){
vec3 n=normalize(vNorm);
float diff=max(dot(n,uLightDir),0.0)*0.7+0.3;
vec3 col=vColor*diff;
float d=length(vWorldPos-uEye);
float fog=clamp(d/uFogDist,0.0,1.0);
col=mix(col,uFogColor,fog);
gl_FragColor=vec4(col,1.0);
}`;

const vsSky=`
attribute vec3 aPos;
varying vec3 vDir;
uniform mat4 uProj;
uniform mat4 uView;
void main(){
vDir=aPos;
vec4 p=uProj*uView*vec4(aPos*5000.0,1.0);
gl_Position=p.xyww;
}`;

const fsSky=`
precision mediump float;
varying vec3 vDir;
void main(){
vec3 d=normalize(vDir);
float y=d.y*0.5+0.5;
vec3 sky=mix(vec3(0.6,0.75,0.95),vec3(0.2,0.35,0.7),y);
sky=mix(sky,vec3(0.85,0.9,0.95),pow(1.0-y,3.0)*0.5);
gl_FragColor=vec4(sky,1.0);
}`;

function compileShader(src,type){
const s=gl.createShader(type);
gl.shaderSource(s,src);
gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));}
return s;
}

function createProgram(vs,fs){
const p=gl.createProgram();
gl.attachShader(p,compileShader(vs,gl.VERTEX_SHADER));
gl.attachShader(p,compileShader(fs,gl.FRAGMENT_SHADER));
gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));}
return p;
}

const prog=createProgram(vsSource,fsSource);
const progSky=createProgram(vsSky,fsSky);

const uProj=gl.getUniformLocation(prog,'uProj');
const uView=gl.getUniformLocation(prog,'uView');
const uModel=gl.getUniformLocation(prog,'uModel');
const uLightDir=gl.getUniformLocation(prog,'uLightDir');
const uEye=gl.getUniformLocation(prog,'uEye');
const uFogDist=gl.getUniformLocation(prog,'uFogDist');
const uFogColor=gl.getUniformLocation(prog,'uFogColor');
const aPos=gl.getAttribLocation(prog,'aPos');
const aNorm=gl.getAttribLocation(prog,'aNorm');
const aColor=gl.getAttribLocation(prog,'aColor');

const uProjSky=gl.getUniformLocation(progSky,'uProj');
const uViewSky=gl.getUniformLocation(progSky,'uView');
const aPosSky=gl.getAttribLocation(progSky,'aPos');

// Geometry builders
function createBuffer(data){
const b=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
return b;
}

function createBox(w,h,d,r,g,b){
const hw=w/2,hh=h/2,hd=d/2;
const verts=[
// front
-hw,-hh,hd, 0,0,1, hw,-hh,hd, 0,0,1, hw,hh,hd, 0,0,1, -hw,-hh,hd, 0,0,1, hw,hh,hd, 0,0,1, -hw,hh,hd, 0,0,1,
// back
hw,-hh,-hd, 0,0,-1, -hw,-hh,-hd, 0,0,-1, -hw,hh,-hd, 0,0,-1, hw,-hh,-hd, 0,0,-1, -hw,hh,-hd, 0,0,-1, hw,hh,-hd, 0,0,-1,
// top
-hw,hh,hd, 0,1,0, hw,hh,hd, 0,1,0, hw,hh,-hd, 0,1,0, -hw,hh,hd, 0,1,0, hw,hh,-hd, 0,1,0, -hw,hh,-hd, 0,1,0,
// bottom
-hw,-hh,-hd, 0,-1,0, hw,-hh,-hd, 0,-1,0, hw,-hh,hd, 0,-1,0, -hw,-hh,-hd, 0,-1,0, hw,-hh,hd, 0,-1,0, -hw,-hh,hd, 0,-1,0,
// right
hw,-hh,hd, 1,0,0, hw,-hh,-hd, 1,0,0, hw,hh,-hd, 1,0,0, hw,-hh,hd, 1,0,0, hw,hh,-hd, 1,0,0, hw,hh,hd, 1,0,0,
// left
-hw,-hh,-hd, -1,0,0, -hw,-hh,hd, -1,0,0, -hw,hh,hd, -1,0,0, -hw,-hh,-hd, -1,0,0, -hw,hh,hd, -1,0,0, -hw,hh,-hd, -1,0,0
];
const cols=[];
for(let i=0;i<verts.length;i+=9){
const shade=1.0;
cols.push(r*shade,g*shade,b*shade, r*shade,g*shade,b*shade, r*shade,g*shade,b*shade,
r*shade,g*shade,b*shade, r*shade,g*shade,b*shade, r*shade,g*shade,b*shade);
}
const posBuf=createBuffer(verts);
const normBuf=createBuffer(verts.slice(verts.length/2));
const colBuf=createBuffer(cols);
const count=verts.length/9;
return{posBuf,normBuf,colBuf,count};
}

function createPlane(){
const verts=[
// Fuselage
0,-0.3,1.5, 0,1,0, 0.3,-0.3,1.5, 0,1,0, 0.3,-0.3,0, 0,1,0,
0,-0.3,1.5, 0,1,0, 0.3,-0.3,0, 0,1,0, 0,-0.3,0, 0,1,0,
0,-0.3,1.5, 0,1,0, 0,-0.3,0, 0,1,0, -0.3,-0.3,0, 0,1,0,
0,-0.3,1.5, 0,1,0, -0.3,-0.3,0, 0,1,0, -0.3,-0.3,1.5, 0,1,0,
0,0.3,1.5, 0,1,0, 0.3,0.3,1.5, 0,1,0, 0.3,0.3,0, 0,1,0,
0,0.3,1.5, 0,1,0, 0.3,0.3,0, 0,1,0, 0,0.3,0, 0,1,0,
0,0.3,1.5, 0,1,0, 0,0.3,0, 0,1,0, -0.3,0.3,0, 0,1,0,
0,0.3,1.5, 0,1,0, -0.3,0.3,0, 0,1,0, -0.3,0.3,1.5, 0,1,0,
// Wings
0.3,-0.2,0.5, 0,1,0, 4,-0.2,-0.5, 0,1,0, 4,-0.2,0.5, 0,1,0,
0.3,-0.2,0.5, 0,1,0, 0.3,-0.2,-0.5, 0,1,0, 4,-0.2,-0.5, 0,1,0,
-0.3,-0.2,0.5, 0,1,0, -4,-0.2,-0.5, 0,1,0, -4,-0.2,0.5, 0,1,0,
-0.3,-0.2,0.5, 0,1,0, -4,-0.2,-0.5, 0,1,0, -0.3,-0.2,-0.5, 0,1,0,
// Tail
0,0.3,0, 0,1,0, 0,0.8,-1, 0,1,0, 0,-0.3,0, 0,1,0,
0,0.3,0, 0,1,0, 0,-0.3,0, 0,1,0, 0,0.3,-1, 0,1,0,
0,0.3,-1, 0,1,0, 0,0.8,-1, 0,1,0, 0,-0.3,-1, 0,1,0,
// Tail wings
0,0.3,-0.8, 0,1,0, 1.5,0.3,-1.2, 0,1,0, 1.5,0.3,-0.8, 0,1,0,
0,0.3,-0.8, 0,1,0, 0,0.3,-1.2, 0,1,0, 1.5,0.3,-1.2, 0,1,0,
0,0.3,-0.8, 0,1,0, -1.5,0.3,-1.2, 0,1,0, -1.5,0.3,-0.8, 0,1,0,
0,0.3,-0.8, 0,1,0, -1.5,0.3,-1.2, 0,1,0, 0,0.3,-1.2, 0,1,0,
// Nose cone
0,0.3,1.5, 0,1,0, 0.3,0.3,1.5, 0,1,0, 0,0,2.2, 0,1,0,
0,-0.3,1.5, 0,1,0, 0.3,-0.3,1.5, 0,1,0, 0,0,2.2, 0,1,0,
0,0.3,1.5, 0,1,0, -0.3,0.3,1.5, 0,1,0, 0,0,2.2, 0,1,0,
0,-0.3,1.5, 0,1,0, -0.3,-0.3,1.5, 0,1,0, 0,0,2.2, 0,1,0,
];
const cols=[];
for(let i=0;i<verts.length;i+=9){
cols.push(0.9,0.9,0.95, 0.9,0.9,0.95, 0.9,0.9,0.95,
0.9,0.9,0.95, 0.9,0.9,0.95, 0.9,0.9,0.95);
}
const posBuf=createBuffer(verts);
const normBuf=createBuffer(verts.slice(verts.length/2));
const colBuf=createBuffer(cols);
return{posBuf,normBuf,colBuf,count:verts.length/9};
}

function createGround(){
const s=2000;
const verts=[-s,0,-s, 0,1,0, s,0,-s, 0,1,0, s,0,s, 0,1,0, -s,0,-s, 0,1,0, s,0,s, 0,1,0, -s,0,s, 0,1,0];
const cols=[];
for(let i=0;i<verts.length;i+=9){cols.push(0.35,0.45,0.3, 0.35,0.45,0.3, 0.35,0.45,0.3, 0.35,0.45,0.3, 0.35,0.45,0.3, 0.35,0.45,0.3);}
const posBuf=createBuffer(verts);
const normBuf=createBuffer(verts.slice(verts.length/2));
const colBuf=createBuffer(cols);
return{posBuf,normBuf,colBuf,count:2};
}

function createSkySphere(){
const verts=[];
for(let i=0;i<20;i++){
for(let j=0;j<20;j++){
const a1=i/20*Math.PI*2,a2=(i+1)/20*Math.PI*2;
const b1=j/20*Math.PI,b2=(j+1)/20*Math.PI;
verts.push(Math.cos(a1)*Math.sin(b1),Math.cos(b1),Math.sin(a1)*Math.sin(b1),
Math.cos(a2)*Math.sin(b1),Math.cos(b1),Math.sin(a2)*Math.sin(b1),
Math.cos(a2)*Math.sin(b2),Math.cos(b2),Math.sin(a2)*Math.sin(b2),
Math.cos(a1)*Math.sin(b1),Math.cos(b1),Math.sin(a1)*Math.sin(b1),
Math.cos(a2)*Math.sin(b2),Math.cos(b2),Math.sin(a2)*Math.sin(b2),
Math.cos(a1)*Math.sin(b2),Math.cos(b2),Math.sin(a1)*Math.sin(b2));
}
}
return createBuffer(verts);
}

// Build scene
const plane=createPlane();
const ground=createGround();
const skyBuf=createSkySphere();

// Procedural city
const buildings=[];
const citySize=800;
const grid=40;
const cellSize=citySize/grid;

function hash(x,y){let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return(h^(h>>16))&0x7fffffff;}
function rand(x,y){return(hash(x,y)/2147483647);}

for(let i=0;i<grid;i++){
for(let j=0;j<grid;j++){
const r=rand(i,j);
if(r<0.15)continue;
const cx=(i-grid/2)*cellSize+cellSize/2;
const cz=(j-grid/2)*cellSize+cellSize/2;
const h=5+rand(i+100,j+100)*60+rand(i+200,j+200)*30;
const w=cellSize*0.6*(0.5+rand(i+300,j+300)*0.5);
const d=cellSize*0.6*(0.5+rand(i+400,j+400)*0.5);
const hue=rand(i+500,j+500);
let cr,cg,cb;
if(hue<0.3){cr=0.55+rand(i,j)*0.15;cg=0.55+rand(i,j)*0.15;cb=0.6+rand(i,j)*0.1;}
else if(hue<0.6){cr=0.6+rand(i,j)*0.1;cg=0.55+rand(i,j)*0.1;cb=0.5+rand(i,j)*0.1;}
else{cr=0.5+rand(i,j)*0.15;cg=0.5+rand(i,j)*0.15;cb=0.55+rand(i,j)*0.15;}
buildings.push({x:cx,z:cz,w,h,d,r:cr,g:cg,b:cb});
}
}

// Draw function
function drawMesh(mesh,modelMat){
gl.uniformMatrix4fv(uModel,false,modelMat);
gl.bindBuffer(gl.ARRAY_BUFFER,mesh.posBuf);
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,mesh.normBuf);
gl.enableVertexAttribArray(aNorm);
gl.vertexAttribPointer(aNorm,3,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,mesh.colBuf);
gl.enableVertexAttribArray(aColor);
gl.vertexAttribPointer(aColor,3,gl.FLOAT,false,0,0);
gl.drawArrays(gl.TRIANGLES,0,mesh.count);
}

// Flight state
const planeState={
x:0,y:80,z:0,
vx:0,vy:0,vz:0,
pitch:0,roll:0,yaw:0,
speed:80,
throttle:0.5
};

// Input
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// Camera
const camDist=25;
const camHeight=8;

const projMat=M4.create();
const viewMat=M4.create();
const modelMat=M4.create();
const tempMat=M4.create();
const tempMat2=M4.create();

const hud=document.getElementById('hud');

let time=0;
let lastTime=performance.now();

function update(dt){
const p=planeState;
const turnRate=1.8;
const pitchRate=1.5;
const rollRate=2.0;
const yawRate=1.2;
const maxSpeed=150;
const minSpeed=20;
const accel=40;

// Throttle
if(keys['ShiftLeft']||keys['ShiftRight'])p.throttle=Math.min(1,p.throttle+dt*0.8);
if(keys['ControlLeft']||keys['ControlRight'])p.throttle=Math.max(0,p.throttle-dt*0.8);
if(keys['Space'])p.speed=Math.max(minSpeed,p.speed-dt*80);

// Pitch
if(keys['KeyW']||keys['ArrowUp'])p.pitch-=pitchRate*dt;
if(keys['KeyS']||keys['ArrowDown'])p.pitch+=pitchRate*dt;
p.pitch=Math.max(-Math.PI/2.5,Math.min(Math.PI/2.5,p.pitch));

// Roll
if(keys['KeyA']||keys['ArrowLeft'])p.roll-=rollRate*dt;
if(keys['KeyD']||keys['ArrowRight'])p.roll+=rollRate*dt;
p.roll=Math.max(-Math.PI/2.5,Math.min(Math.PI/2.5,p.roll));

// Yaw
if(keys['KeyQ'])p.yaw-=yawRate*dt;
if(keys['KeyE'])p.yaw+=yawRate*dt;

// Auto-center roll slightly
p.roll*=(1-dt*0.5);

// Speed
const targetSpeed=minSpeed+p.throttle*(maxSpeed-minSpeed);
p.speed+=(targetSpeed-p.speed)*dt*2;

// Move
const spd=p.speed*dt;
p.x+=Math.sin(p.yaw)*Math.cos(p.pitch)*spd;
p.y+=Math.sin(p.pitch)*spd;
p.z+=Math.cos(p.yaw)*Math.cos(p.pitch)*spd;

// Banked turn
p.yaw+=Math.sin(p.roll)*turnRate*dt;

// Ground collision
if(p.y<5){p.y=5;p.pitch=Math.max(0,p.pitch);p.vy=Math.max(0,p.vy);}

// Auto-climb on steep pitch
if(p.pitch<-0.3)p.y+=dt*10;
}

function render(){
const now=performance.now();
const dt=Math.min((now-lastTime)/1000,0.05);
lastTime=now;
time+=dt;

update(dt);

const p=planeState;

// Resize
if(canvas.width!==window.innerWidth||canvas.height!==window.innerHeight)resize();

// Clear
gl.clearColor(0.6,0.75,0.95,1);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.cullFace(gl.BACK);

// Projection
const asp=canvas.width/canvas.height;
M4.perspective(projMat,Math.PI/3,asp,1,5000);

// Camera position behind plane
const camX=p.x-Math.sin(p.yaw)*camDist*Math.cos(p.pitch);
const camY=p.y+camHeight-Math.sin(p.pitch)*camDist;
const camZ=p.z-Math.cos(p.yaw)*camDist*Math.cos(p.pitch);

M4.lookAt(viewMat,[camX,camY,camZ],[p.x,p.y,p.z],[0,1,0]);

// Light
const lightDir=[0.5,0.8,0.3];
const lLen=Math.sqrt(lightDir[0]**2+lightDir[1]**2+lightDir[2]**2);
lightDir[0]/=lLen;lightDir[1]/=lLen;lightDir[2]/=lLen;

// Fog
const fogDist=600;
const fogColor=[0.6,0.75,0.95];

// Draw sky
gl.disable(gl.DEPTH_TEST);
gl.useProgram(progSky);
gl.uniformMatrix4fv(uProjSky,false,projMat);
gl.uniformMatrix4fv(uViewSky,false,viewMat);
gl.bindBuffer(gl.ARRAY_BUFFER,skyBuf);
gl.enableVertexAttribArray(aPosSky);
gl.vertexAttribPointer(aPosSky,3,gl.FLOAT,false,0,0);
gl.drawArrays(gl.TRIANGLES,0,skyBuf.length/3/9*6);
gl.enable(gl.DEPTH_TEST);

// Draw scene
gl.useProgram(prog);
gl.uniformMatrix4fv(uProj,false,projMat);
gl.uniformMatrix4fv(uView,false,viewMat);
gl.uniform3fv(uLightDir,lightDir);
gl.uniform3fv(uEye,[camX,camY,camZ]);
gl.uniform1f(uFogDist,fogDist);
gl.uniform3fv(uFogColor,fogColor);

// Ground
M4.identity(modelMat);
drawMesh(ground,modelMat);

// Buildings - frustum culling by distance
const sortedBuildings=buildings.map(b=>{
const dx=b.x-p.x,dz=b.z-p.z;
return{...b,dist:dx*dx+dz*dz};
}).sort((a,b)=>a.dist-b.dist);

for(const b of sortedBuildings){
if(b.dist>400*400)continue;
M4.identity(modelMat);
M4.translate(modelMat,modelMat,[b.x,b.h/2,b.z]);
const box=createBox(b.w,b.h,b.d,b.r,b.g,b.b);
drawMesh(box,modelMat);
}

// Plane
M4.identity(modelMat);
M4.translate(modelMat,modelMat,[p.x,p.y,p.z]);
M4.rotateZ(modelMat,modelMat,p.roll);
M4.rotateX(modelMat,modelMat,p.pitch);
M4.rotateY(modelMat,modelMat,p.yaw);
drawMesh(plane,modelMat);

// HUD
const alt=Math.round(p.y);
const spd=Math.round(p.speed);
const hdg=Math.round(((p.yaw*180/Math.PI)%360+360)%360);
hud.innerHTML=`ALT: ${alt}m<br>SPD: ${spd} m/s<br>HDG: ${hdg}°<br>THR: ${Math.round(p.throttle*100)}%`;

requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
