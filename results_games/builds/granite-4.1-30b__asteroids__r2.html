<!DOCTYPE html>
<html>
<head>
<title>Asteroids</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GAME_STATE = { TITLE: 0, PLAYING: 1, GAME_OVER: 2 };
let gameState = GAME_STATE.TITLE;

const ROCK_SIZES = [20, 10, 5];
const ROCK_SPEED = 2;
const SHIP_SPEED = 5;
const BULLET_SPEED = 10;
const ROTATION_SPEED = Math.PI / 90;

let ship;
let bullets = [];
let rocks = [];

function Ship() {
  this.x = canvas.width / 2;
  this.y = canvas.height / 2;
  this.angle = 0;
  this.radius = 15;
  this.thrust = false;
  this.bulletCooldown = 0;
}

Ship.prototype.draw = function() {
  ctx.save();
  ctx.translate(this.x, this.y);
  ctx.rotate(this.angle);
  ctx.beginPath();
  ctx.moveTo(0, -this.radius * 2);
  ctx.lineTo(-this.radius, this.radius * 2);
  ctx.lineTo(this.radius, this.radius * 2);
  ctx.closePath();
  ctx.fillStyle = 'white';
  ctx.fill();
  ctx.restore();
};

Ship.prototype.thrustForward = function() {
  this.thrust = true;
};

Ship.prototype.releaseThrust = function() {
  this.thrust = false;
};

Ship.prototype.rotateLeft = function() {
  this.angle -= ROTATION_SPEED;
};

Ship.prototype.rotateRight = function() {
  this.angle += ROTATION_SPEED;
};

Ship.prototype.shoot = function() {
  if (this.bulletCooldown <= 0) {
    bullets.push({
      x: this.x,
      y: this.y,
      angle: this.angle
    });
    this.bulletCooldown = 10;
  }
};

Ship.prototype.update = function() {
  if (this.thrust) {
    this.x += Math.cos(this.angle) * SHIP_SPEED;
    this.y += Math.sin(this.angle) * SHIP_SPEED;
  }
  this.x = (this.x + canvas.width) % canvas.width;
  this.y = (this.y + canvas.height) % canvas.height;
  if (this.bulletCooldown > 0) this.bulletCooldown--;
};

function Rock(x, y, size, angle, speed) {
  this.x = x;
  this.y = y;
  this.size = size;
  this.radius = size;
  this.angle = angle;
  this.speed = speed;
}

Rock.prototype.draw = function() {
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
  ctx.fillStyle = 'gray';
  ctx.fill();
};

Rock.prototype.update = function() {
  this.x += Math.cos(this.angle) * this.speed;
  this.y += Math.sin(this.angle) * this.speed;
  this.x = (this.x + canvas.width) % canvas.width;
  this.y = (this.y + canvas.height) % canvas.height;
};

function Bullet(x, y, angle) {
  this.x = x;
  this.y = y;
  this.angle = angle;
}

Bullet.prototype.draw = function() {
  ctx.beginPath();
  ctx.moveTo(this.x, this.y);
  this.x += Math.cos(this.angle) * BULLET_SPEED;
  this.y += Math.sin(this.angle) * BULLET_SPEED;
  ctx.lineTo(this.x, this.y);
  ctx.strokeStyle = 'white';
  ctx.stroke();
};

Bullet.prototype.update = function() {
  this.x += Math.cos(this.angle) * BULLET_SPEED;
  this.y += Math.sin(this.angle) * BULLET_SPEED;
  this.x = (this.x + canvas.width) % canvas.width;
  this.y = (this.y + canvas.height) % canvas.height;
};

function checkCollision(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance <= a.radius + b.radius;
}

function splitRock(rock) {
  if (rock.size > ROCK_SIZES[ROCK_SIZES.length - 1]) {
    const newSize = ROCK_SIZES[ROCK_SIZES.indexOf(rock.size) + 1];
    const newSpeed = rock.speed * 1.5;
    rocks.push(new Rock(rock.x, rock.y, newSize, rock.angle + Math.PI / 4, newSpeed));
    rocks.push(new Rock(rock.x, rock.y, newSize, rock.angle - Math.PI / 4, newSpeed));
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === GAME_STATE.PLAYING) {
    ship.update();
    ship.draw();

    bullets.forEach((bullet, index) => {
      bullet.draw();
      bullet.update();
      rocks.forEach(rock => {
        if (checkCollision(bullet, rock)) {
          rocks.splice(rocks.indexOf(rock), 1);
          splitRock(rock);
          bullets.splice(index, 1);
        }
      });
    });

    rocks.forEach(rock => {
      rock.draw();
      rock.update();
      if (checkCollision(ship, rock)) {
        gameState = GAME_STATE.GAME_OVER;
      }
    });

    if (Math.random() < 0.01) {
      const size = ROCK_SIZES[0];
      const angle = Math.random() * Math.PI * 2;
      const speed = ROCK_SPEED;
      rocks.push(new Rock(Math.random() * canvas.width, Math.random() * canvas.height, size, angle, speed));
    }
  } else if (gameState === GAME_STATE.TITLE) {
    ctx.fillStyle = 'white';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Asteroids', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillText('Press Space to Start', canvas.width / 2, canvas.height / 2 + 20);
  } else if (gameState === GAME_STATE.GAME_OVER) {
    ctx.fillStyle = 'white';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 20);
  }

  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', event => {
  if (event.code === 'Space' && gameState === GAME_STATE.TITLE) {
    gameState = GAME_STATE.PLAYING;
    ship = new Ship();
    rocks = [];
  } else if (event.code === 'ArrowLeft') {
    ship.rotateLeft();
  } else if (event.code === 'ArrowRight') {
    ship.rotateRight();
  } else if (event.code === 'KeyW' || event.code === 'ArrowUp') {
    ship.thrustForward();
  } else if (event.code === 'KeyS' || event.code === 'ArrowDown') {
    ship.releaseThrust();
  } else if (event.code === 'Space') {
    ship.shoot();
  } else if (event.code === 'KeyR' && gameState === GAME_STATE.GAME_OVER) {
    gameState = GAME_STATE.PLAYING;
    ship = new Ship();
    rocks = [];
  }
});

document.addEventListener('keyup', event => {
  if (event.code === 'KeyW' || event.code === 'ArrowUp') {
    ship.releaseThrust();
  }
});

gameLoop();
</script>
</body>
</html>
