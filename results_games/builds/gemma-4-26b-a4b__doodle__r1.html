<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #fafafa;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        // Game Constants
        const GRAVITY = 0.4;
        const JUMP_FORCE = -10;
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 15;
        const PLAYER_SIZE = 30;

        // Game State
        let score = 0;
        let gameActive = true;
        let platforms = [];
        let particles = [];

        const player = {
            x: canvas.width / 2 - PLAYER_SIZE / 2,
            y: canvas.height - 150,
            width: PLAYER_SIZE,
            height: PLAYER_SIZE,
            vx: 0,
            vy: 0,
            color: '#8BC34A'
        };

        const keys = {};

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function init() {
            score = 0;
            gameActive = true;
            player.x = canvas.width / 2 - PLAYER_SIZE / 2;
            player.y = canvas.height - 150;
            player.vx = 0;
            player.vy = 0;
            
            platforms = [];
            // Starting platform
            platforms.push({
                x: canvas.width / 2 - PLATFORM_WIDTH / 2,
                y: canvas.height - 50,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT
            });

            // Initial procedural platforms
            for (let i = 1; i < 7; i++) {
                spawnPlatform(canvas.height - (i * 100));
            }
            
            requestAnimationFrame(gameLoop);
        }

        function spawnPlatform(yPos) {
            platforms.push({
                x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                y: yPos,
                width: PLATFORM_WIDTH,
                height: PLATFORM_HEIGHT
            });
        }

        function update() {
            if (!gameActive) return;

            // Player Movement
            if (keys['ArrowLeft']) player.vx = -5;
            else if (keys['ArrowRight']) player.vx = 5;
            else player.vx *= 0.8;

            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            // Screen Wrap
            if (player.x + player.width < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.width;

            // Platform Collision (Only when falling)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x < p.x + p.width &&
                        player.x + player.width > p.x &&
                        player.y + player.height > p.y &&
                        player.y + player.height < p.y + p.height + player.vy) {
                        player.vy = JUMP_FORCE;
                    }
                });
            }

            // Camera Scroll & Platform Generation
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);

                platforms.forEach(p => {
                    p.y += diff;
                });
            }

            // Remove off-screen platforms and spawn new ones
            platforms = platforms.filter(p => p.y < canvas.height);
            while (platforms.length < 7) {
                let lowestY = Math.min(...platforms.map(p => p.y));
                spawnPlatform(lowestY - 100);
            }

            // Game Over
            if (player.y > canvas.height) {
                gameActive = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#4CAF50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = '#2E7D32';
                ctx.strokeRect(p.x, p.y, p.width, p.height);
            });

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 5, 6, 6);
            ctx.fillRect(player.x + 19, player.y + 5, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 7, player.y + 7, 2, 2);
            ctx.fillRect(player.x + 21, player.y + 7, 2, 2);

            // Draw Score
            ctx.fillStyle = '#333';
            ctx.font = '24px Arial';
            ctx.fillText(`Score: ${score}`, 10, 35);

            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.font = '40px Arial';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Press Space to Restart', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            } else {
                // Check for restart
                const checkRestart = (e) => {
                    if (e.code === 'Space') {
                        window.removeEventListener('keydown', checkRestart);
                        init();
                    }
                };
                window.addEventListener('keydown', checkRestart);
            }
        }

        // Start Game
        init();
    </script>
</body>
</html>
