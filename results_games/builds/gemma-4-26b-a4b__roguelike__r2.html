<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tiny Roguelike</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { position: relative; border: 2px solid #444; padding: 10px; background: #000; }
        #output { white-space: pre; line-height: 1.2; font-size: 18px; }
        #stats { margin-bottom: 10px; font-size: 16px; color: #aaa; }
        #log { margin-top: 10px; font-size: 14px; color: #888; height: 1.2em; }
    </style>
</head>
<body>
    <div id="stats">HP: 20 | Floor: 1 | Kills: 0</div>
    <div id="game-container"><div id="output"></div></div>
    <div id="log">Welcome! Use WASD to move.</div>

    <script>
        const WIDTH = 30;
        const HEIGHT = 20;
        const logEl = document.getElementById('log');
        const statsEl = document.getElementById('stats');
        const outputEl = document.getElementById('output');

        let player = { x: 0, y: 0, hp: 20, maxHp: 20, kills: 0 };
        let dungeon = [];
        let enemies = [];
        let floor = 1;

        function initDungeon() {
            dungeon = Array(HEIGHT).fill().map(() => Array(WIDTH).fill('#'));
            enemies = [];
            
            // Simple Room Generation
            for (let i = 0; i < 5; i++) {
                let rw = Math.floor(Math.random() * 5) + 4;
                let rh = Math.floor(Math.random() * 4) + 3;
                let rx = Math.floor(Math.random() * (WIDTH - rw - 2)) + 1;
                let ry = Math.floor(Math.random() * (HEIGHT - rh - 2)) + 1;

                for (let y = ry; y < ry + rh; y++) {
                    for (let x = rx; x < rx + rw; x++) {
                        dungeon[y][x] = '.';
                    }
                }
            }

            // Ensure player start is in a room
            let placed = false;
            while (!placed) {
                let rx = Math.floor(Math.random() * WIDTH);
                let ry = Math.floor(Math.random() * HEIGHT);
                if (dungeon[ry][rx] === '.') {
                    player.x = rx;
                    player.y = ry;
                    placed = true;
                }
            }

            // Place enemies
            for (let i = 0; i < 2 + floor; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * WIDTH);
                    ey = Math.floor(Math.random() * HEIGHT);
                } while (dungeon[ey][ex] !== '.' || (ex === player.x && ey === player.y));
                enemies.push({ x: ex, y: ey, hp: 5 + floor, icon: 'E' });
            }
        }

        function draw() {
            let display = "";
            for (let y = 0; y < HEIGHT; y++) {
                for (let x = 0; x < WIDTH; x++) {
                    let char = dungeon[y][x];
                    let color = "#444";
                    if (char === '#') color = "#555";
                    
                    let isEnemy = enemies.find(e => e.x === x && e.y === y);
                    if (x === player.x && y === player.y) {
                        char = '@';
                        color = "#0f0";
                    } else if (isEnemy) {
                        char = isEnemy.icon;
                        color = "#f00";
                    }

                    display += `<span style="color:${color}">${char}</span>`;
                }
                display += "\n";
            }
            outputEl.innerHTML = display;
            statsEl.innerText = `HP: ${player.hp}/${player.maxHp} | Floor: ${floor} | Kills: ${player.kills}`;
        }

        function move(dx, dy) {
            let nx = player.x + dx;
            let ny = player.y + dy;

            if (dungeon[ny][nx] === '#') return;

            let enemy = enemies.find(e => e.x === nx && e.y === ny);
            if (enemy) {
                enemy.hp -= 2;
                logEl.innerText = "You hit the enemy!";
                if (enemy.hp <= 0) {
                    enemies = enemies.filter(e => e !== enemy);
                    player.kills++;
                    logEl.innerText = "Enemy defeated!";
                }
            } else {
                player.x = nx;
                player.y = ny;
            }

            enemyTurn();
            checkDeath();
            draw();
        }

        function enemyTurn() {
            enemies.forEach(e => {
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.abs(dx) + Math.abs(dy);

                if (dist === 1) {
                    player.hp -= 1;
                    logEl.innerText = "Enemy attacks you!";
                } else if (dist < 4) {
                    let mx = Math.sign(dx);
                    let my = Math.sign(dy);
                    // Try to move towards player
                    if (dungeon[e.y][e.x + mx] !== '#' && !(e.x + mx === player.x && e.y === player.y)) {
                        e.x += mx;
                    } else if (dungeon[e.y + my][e.x] !== '#' && !(e.x === player.x && e.y + my === player.y)) {
                        e.y += my;
                    }
                }
            });
        }

        function checkDeath() {
            if (player.hp <= 0) {
                alert("Game Over! Kills: " + player.kills);
                player.hp = 20;
                player.kills = 0;
                floor = 1;
                initDungeon();
            }
            if (enemies.length === 0) {
                floor++;
                logEl.innerText = "Descending deeper...";
                initDungeon();
            }
        }

        window.addEventListener('keydown', e => {
            switch(e.key.toLowerCase()) {
                case 'w': move(0, -1); break;
                case 's': move(0, 1); break;
                case 'a': move(-1, 0); break;
                case 'd': move(1, 0); break;
            }
        });

        initDungeon();
        draw();
    </script>
</body>
</html>
