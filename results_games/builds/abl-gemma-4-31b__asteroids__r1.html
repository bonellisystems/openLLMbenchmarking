<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #fff;
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            user-select: none;
        }
        .stat {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">Lives: <span id="lives">3</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const FPS = 60;
        const FRICTION = 0.7; 
        const SHIP_SIZE = 30; 
        const SHIP_THRUST = 5; 
        const SHIP_TURN_SPEED = 360; 
        const BULLET_SPEED = 500; 
        const BULLET_MAX = 10; 
        const BULLET_DIST = 0.6; 
        const ASTEROID_NUM = 5; 
        const ASTEROID_SIZE = 100; 
        const ASTEROID_SPEED = 50; 
        const ASTEROID_VERT = 10; 
        const ASTEROID_JAG = 0.4; 
        const SHOW_BOUNDING = false;

        let score = 0;
        let lives = 3;
        let level = 0;

        const ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            r: SHIP_SIZE / 2,
            a: 90 / 180 * Math.PI,
            rot: 0,
            thrusting: false,
            thrust: { x: 0, y: 0 },
            blinkTime: 0,
            blinkNum: 0,
            canShoot: true,
            dead: false
        };

        let asteroids = [];
        let bullets = [];

        function createAsteroids() {
            asteroids = [];
            let x, y;
            for (let i = 0; i < ASTEROID_NUM + level; i++) {
                do {
                    x = Math.floor(Math.random() * canvas.width);
                    y = Math.floor(Math.random() * canvas.height);
                } while (distBetweenPoints(ship.x, ship.y, x, y) < ASTEROID_SIZE * 2 + ship.r);
                asteroids.push(newAsteroid(x, y, Math.ceil(ASTEROID_SIZE / 2)));
            }
        }

        function newAsteroid(x, y, r) {
            let lvlMult = 1 + level * 0.1;
            let ast = {
                x: x,
                y: y,
                xv: Math.random() * ASTEROID_SPEED * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
                yv: Math.random() * ASTEROID_SPEED * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
                r: r,
                a: Math.random() * Math.PI * 2,
                vert: Math.floor(Math.random() * (ASTEROID_VERT + 1) + ASTEROID_VERT / 2),
                offs: []
            };
            for (let i = 0; i < ast.vert; i++) {
                ast.offs.push(Math.random() * ASTEROID_JAG * 2 + 1 - ASTEROID_JAG);
            }
            return ast;
        }

        function distBetweenPoints(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function fireBullet() {
            if (bullets.length < BULLET_MAX) {
                bullets.push({
                    x: ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                    y: ship.y - 4 / 3 * ship.r * Math.sin(ship.a),
                    xv: BULLET_SPEED * Math.cos(ship.a) / FPS,
                    yv: -BULLET_SPEED * Math.sin(ship.a) / FPS,
                    dist: 0
                });
            }
        }

        function destroyAsteroid(index) {
            let x = asteroids[index].x;
            let y = asteroids[index].y;
            let r = asteroids[index].r;

            if (r === Math.ceil(ASTEROID_SIZE / 2)) {
                asteroids.push(newAsteroid(x, y, Math.ceil(ASTEROID_SIZE / 4)));
                asteroids.push(newAsteroid(x, y, Math.ceil(ASTEROID_SIZE / 4)));
                score += 20;
            } else if (r === Math.ceil(ASTEROID_SIZE / 4)) {
                asteroids.push(newAsteroid(x, y, Math.ceil(ASTEROID_SIZE / 8)));
                asteroids.push(newAsteroid(x, y, Math.ceil(ASTEROID_SIZE / 8)));
                score += 50;
            } else {
                score += 100;
            }
            scoreEl.innerText = score;
            asteroids.splice(index, 1);
        }

        function explodeShip() {
            ship.dead = true;
            ship.blinkTime = 0;
            ship.blinkNum = 30;
        }

        function resetShip() {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.thrust = { x: 0, y: 0 };
            ship.dead = false;
            ship.blinkTime = 0;
            ship.blinkNum = 30;
        }

        window.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'ArrowLeft': ship.rot = SHIP_TURN_SPEED / 180 * Math.PI / FPS; break;
                case 'ArrowRight': ship.rot = -SHIP_TURN_SPEED / 180 * Math.PI / FPS; break;
                case 'ArrowUp': ship.thrusting = true; break;
                case 'Space': 
                    if (ship.canShoot && !ship.dead) {
                        fireBullet();
                        ship.canShoot = false;
                    }
                    break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'ArrowLeft': 
                case 'ArrowRight': ship.rot = 0; break;
                case 'ArrowUp': ship.thrusting = false; break;
                case 'Space': ship.canShoot = true; break;
            }
        });

        function update() {
            let blinkOn = ship.blinkNum % 2 === 0;
            let exploding = ship.blinkNum > 0 && ship.dead;

            if (!exploding) {
                if (ship.thrusting) {
                    ship.thrust.x += SHIP_THRUST * Math.cos(ship.a) / FPS;
                    ship.thrust.y -= SHIP_THRUST * Math.sin(ship.a) / FPS;
                } else {
                    ship.thrust.x -= FRICTION * ship.thrust.x / FPS;
                    ship.thrust.y -= FRICTION * ship.thrust.y / FPS;
                }

                ship.x += ship.thrust.x;
                ship.y += ship.thrust.y;
                ship.a += ship.rot;

                if (ship.x < 0 - ship.r) ship.x = canvas.width + ship.r;
                else if (ship.x > canvas.width + ship.r) ship.x = 0 - ship.r;
                if (ship.y < 0 - ship.r) ship.y = canvas.height + ship.r;
                else if (ship.y > canvas.height + ship.r) ship.y = 0 - ship.r;
            }

            if (ship.blinkNum > 0) {
                ship.blinkNum--;
                if (ship.blinkNum === 0 && ship.dead) {
                    lives--;
                    livesEl.innerText = lives;
                    if (lives === 0) {
                        alert("Game Over! Score: " + score);
                        location.reload();
                    } else {
                        resetShip();
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].xv;
                bullets[i].y += bullets[i].yv;
                bullets[i].dist += Math.sqrt(Math.pow(bullets[i].xv, 2) + Math.pow(bullets[i].yv, 2));

                if (bullets[i].x < 0) bullets[i].x = canvas.width;
                else if (bullets[i].x > canvas.width) bullets[i].x = 0;
                if (bullets[i].y < 0) bullets[i].y = canvas.height;
                else if (bullets[i].y > canvas.height) bullets[i].y = 0;

                if (bullets[i].dist > BULLET_DIST * canvas.width) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = asteroids.length - 1; j >= 0; j--) {
                    if (distBetweenPoints(bullets[i].x, bullets[i].y, asteroids[j].x, asteroids[j].y) < asteroids[j].r) {
                        destroyAsteroid(j);
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            for (let i = 0; i < asteroids.length; i++) {
                asteroids[i].x += asteroids[i].xv;
                asteroids[i].y += asteroids[i].yv;

                if (asteroids[i].x < 0 - asteroids[i].r) asteroids[i].x = canvas.width + asteroids[i].r;
                else if (asteroids[i].x > canvas.width + asteroids[i].r) asteroids[i].x = 0 - asteroids[i].r;
                if (asteroids[i].y < 0 - asteroids[i].r) asteroids[i].y = canvas.height + asteroids[i].r;
                else if (asteroids[i].y > canvas.height + asteroids[i].r) asteroids[i].y = 0 - asteroids[i].r;

                if (!ship.dead && ship.blinkNum === 0) {
                    if (distBetweenPoints(ship.x, ship.y, asteroids[i].x, asteroids[i].y) < ship.r + asteroids[i].r) {
                        explodeShip();
                    }
                }
            }

            if (asteroids.length === 0) {
                level++;
                createAsteroids();
            }
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!ship.dead || ship.blinkNum % 2 === 0) {
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(
                    ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                    ship.y - 4 / 3 * ship.r * Math.sin(ship.a)
                );
                ctx.lineTo(
                    ship.x - ship.r * (2 / 3 * Math.cos(ship.a) + Math.sin(ship.a)),
                    ship.y + ship.r * (2 / 3 * Math.sin(ship.a) - Math.cos(ship.a))
                );
                ctx.lineTo(
                    ship.x - ship.r * (2 / 3 * Math.cos(ship.a) - Math.sin(ship.a)),
                    ship.y + ship.r * (2 / 3 * Math.sin(ship.a) + Math.cos(ship.a))
                );
                ctx.closePath();
                ctx.stroke();
            }

            ctx.fillStyle = "white";
            for (let i = 0; i < bullets.length; i++) {
                ctx.beginPath();
                ctx.arc(bullets[i].x, bullets[i].y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = "white";
            for (let i = 0; i < asteroids.length; i++) {
                let a = asteroids[i];
                ctx.beginPath();
                ctx.moveTo(
                    a.x + a.r * a.offs[0] * Math.cos(a.a),
                    a.y + a.r * a.offs[0] * Math.sin(a.a)
                );
                for (let j = 1; j < a.vert; j++) {
                    ctx.lineTo(
                        a.x + a.r * a.offs[j] * Math.cos(a.a + j * Math.PI * 2 / a.vert),
                        a.y + a.r * a.offs[j] * Math.sin(a.a + j * Math.PI * 2 / a.vert)
                    );
                }
                ctx.closePath();
                ctx.stroke();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        createAsteroids();
        gameLoop();
    </script>
</body>
</html>
