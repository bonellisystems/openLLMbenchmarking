<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid Clone</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
canvas{background:#222;border:2px solid #fff;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
const paddle={width:120,height:10,x: (w-paddle.width)/2,y:h-30,dx:0};
const ball={radius:8,x:w/2,y:h/2,vx:4,vy:-4};
const brickRowCount=5;
const brickColumnCount=8;
const brickWidth=70;
const brickHeight=20;
const brickPadding=5;
const brickOffsetTop=50;
const brickOffsetLeft=20;
let bricks=[];
for(let c=0;c<brickColumnCount;c++){
  bricks[c]=[];
  for(let r=0;r<brickRowCount;r++){
    const brickX=c*(brickWidth+brickPadding)+brickOffsetLeft;
    const brickY=r*(brickHeight+brickPadding)+brickOffsetTop;
    bricks[c][r]={x:brickX,y:brickY,status:1};
  }
}
let score=0;
function drawPaddle(){
  ctx.fillStyle='#0f0';
  ctx.fillRect(paddle.x,paddle.y,paddle.width,paddle.height);
}
function drawBall(){
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
  ctx.fill();
}
function drawBricks(){
  for(let c=0;c<brrickColumnCount;c++){
    for(let r=0;r<brrickRowCount;r++){
      if(bricks[c][r].status){
        const brickX=c*(brickWidth+brickPadding)+brickOffsetLeft;
        const brickY=r*(brickHeight+brickPadding)+brickOffsetTop;
        ctx.fillStyle='#888';
        ctx.fillRect(brickX,brickY,brickWidth,brickHeight);
        ctx.strokeStyle='#555';
        ctx.strokeRect(brickX,brickY,brickWidth,brickHeight);
      }
    }
  }
}
function movePaddle(){
  paddle.x+=paddle.dx;
  if(paddle.x<0) paddle.x=0;
  if(paddle.x+paddle.width>w) paddle.x=w-paddle.width;
}
function resetBall(){
  ball.x=w/2;
  ball.y=h/2;
  ball.vx=4* (Math.random()>0.5?1:-1);
  ball.vy=-4* (Math.random()>0.5?1:-1);
}
function update(){
  movePaddle();
  ball.x+=ball.vx;
  ball.y+=ball.vy;
  // Wall collision
  if(ball.x-ball.radius<0||ball.x+ball.radius>w){
    ball.vx*=-1;
  }
  if(ball.y-ball.radius<0){
    ball.vy*=-1;
  }
  // Paddle collision
  if(ball.y+ball.radius>paddle.y &&
     ball.x>paddle.x&&ball.x<paddle.x+paddle.width){
    const angle=Math.atan2(ball.y-paddle.y,paddle.x+paddle.width/2-ball.x);
    const offset=(ball.x-paddle.x)/paddle.width;
    const bounceAngle=angle+Math.PI*offset*2;
    const speed=ballSpeed();
    ball.vx=speed*Math.cos(bounceAngle);
    ball.vy=-speed*Math.sin(bounceAngle);
    ball.vy*=-1;
  }
  // Brick collision
  for(let c=0;c<brrickColumnCount;c++){
    for(let r=0;r<brrickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        if(ball.x>b.x && ball.x<b.x+brickWidth && ball.y>b.y && ball.y<b.y+brickHeight){
          b.status=0;
          score++;
          ball.vy*=-1;
        }
      }
    }
  }
  // Ball falls below paddle
  if(ball.y-ball.radius>h){
    resetBall();
  }
  // Check win
  const allBricks=bricks.flat().every(b=>b.status===0);
  if(allBricks){
    alert('You Win! Score: '+score);
    resetBall();
  }
}
function ballSpeed(){
  return Math.hypot(ball.vx,ball.vy);
}
function render(){
  ctx.clearRect(0,0,w,h);
  drawBricks();
  drawBall();
  drawPaddle();
}
function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){
    paddle.dx=-8;
  }else if(e.key==='ArrowRight'){
    paddle.dx=8;
  }
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    paddle.dx=0;
  }
});
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});
resetBall();
loop();
</script>
</body>
</html>
