<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #000;
            border: 4px solid #555;
        }
        #ui {
            position: absolute;
            top: -40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            visibility: hidden;
        }
        #overlay h1 { margin: 0 0 10px 0; color: #ff4444; }
        #overlay p { margin: 0; font-size: 18px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="high-score">Best: 0</div>
        </div>
        <canvas id="snakeGame" width="400" height="400"></canvas>
        <div id="overlay">
            <h1>GAME OVER</h1>
            <p>Press SPACE to Restart</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snakeGame');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreElement.innerText = `Best: ${highScore}`;

        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let gameRunning = false;
        let gameLoopTimeout;

        window.addEventListener('keydown', handleKeyDown);

        function handleKeyDown(e) {
            switch(e.keyCode) {
                case 37: // Left
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    break;
                case 38: // Up
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    break;
                case 39: // Right
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    break;
                case 40: // Down
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    break;
                case 32: // Space
                    if (!gameRunning) resetGame();
                    break;
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            generateFood();
            dx = 0; dy = 0;
            nextDx = 0; nextDy = 0;
            score = 0;
            scoreElement.innerText = `Score: ${score}`;
            overlay.style.visibility = 'hidden';
            gameRunning = true;
            clearTimeout(gameLoopTimeout);
            main();
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Ensure food doesn't spawn on snake
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                    break;
                }
            }
        }

        function main() {
            if (!gameRunning) return;

            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                updateSnake();
                drawFood();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Subtle grid
            ctx.strokeStyle = '#111';
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
        }

        function updateSnake() {
            dx = nextDx;
            dy = nextDy;

            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = `Score: ${score}`;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = '#ff4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff4444';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
            ctx.shadowBlur = 0;
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#4CAF50' : '#388E3C';
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function gameOver() {
            gameRunning = false;
            overlay.style.visibility = 'visible';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.innerText = `Best: ${highScore}`;
            }
        }

        // Initial state
        clearCanvas();
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.font = '20px Courier New';
        ctx.fillText('Press SPACE to Start', canvas.width/2, canvas.height/2);
        overlay.style.visibility = 'hidden';
        gameRunning = false;

    </script>
</body>
</html>
