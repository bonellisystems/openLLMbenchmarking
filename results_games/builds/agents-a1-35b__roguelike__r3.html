<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tiny Roguelike</title>
<style>
    body { background: #000; color: #fff; font-family: monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; user-select: none; }
    #game { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; }
    .cell { width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .wall { background: #444; color: #444; }
    .floor { background: #222; color: #222; }
    .player { background: #000; color: #0f0; }
    .enemy { background: #000; color: #f00; }
    .stairs { background: #000; color: #ff0; }
    #ui { margin-bottom: 10px; font-size: 14px; }
</style>
</head>
<body>
<div id="ui">HP: 10 | Level: 1</div>
<div id="game"></div>
<script>
const W = 20;
const H = 15;
const map = [];
const player = { x: 1, y: 1, hp: 10 };
const enemies = [];
let stairs = { x: 0, y: 0 };

function init() {
    for (let y = 0; y < H; y++) {
        let row = [];
        for (let x = 0; x < W; x++) {
            row.push('#');
        }
        map.push(row);
    }

    let x = 1, y = 1;
    map[y][x] = '.';
    for (let i = 0; i < 150; i++) {
        const dir = Math.floor(Math.random() * 4);
        if (dir === 0 && y > 1) { y--; map[y][x] = '.'; }
        else if (dir === 1 && y < H - 2) { y++; map[y][x] = '.'; }
        else if (dir === 2 && x > 1) { x--; map[y][x] = '.'; }
        else if (dir === 3 && x < W - 2) { x++; map[y][x] = '.'; }
    }
    player.x = x; player.y = y;

    let sx = 0, sy = 0;
    while (map[sy][sx] !== '.') {
        sx = Math.floor(Math.random() * W);
        sy = Math.floor(Math.random() * H);
    }
    stairs = { x: sx, y: sy };

    for (let i = 0; i < 5; i++) {
        let ex = 0, ey = 0;
        while (map[ey][ex] !== '.' || (ex === player.x && ey === player.y)) {
            ex = Math.floor(Math.random() * W);
            ey = Math.floor(Math.random() * H);
        }
        enemies.push({ x: ex, y: ey, hp: 3 });
    }

    render();
}

function render() {
    const grid = document.getElementById('game');
    grid.innerHTML = '';
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            let char = map[y][x];
            let type = 'floor';
            if (char === '#') { type = 'wall'; char = '#'; }
            else if (char === '.') { char = '.'; }
            
            if (x === player.x && y === player.y) { type = 'player'; char = '@'; }
            else if (x === stairs.x && y === stairs.y) { type = 'stairs'; char = '>'; }
            else {
                const enemy = enemies.find(e => e.x === x && e.y === y);
                if (enemy) { type = 'enemy'; char = 'E'; }
            }
            
            cell.textContent = char;
            cell.classList.add(type);
            grid.appendChild(cell);
        }
    }
    document.getElementById('ui').textContent = `HP: ${player.hp} | Enemies: ${enemies.length}`;
}

function move(dx, dy) {
    if (player.hp <= 0) return;
    const nx = player.x + dx;
    const ny = player.y + dy;

    if (ny < 0 || ny >= H || nx < 0 || nx >= W) return;
    if (map[ny][nx] === '#') return;

    const enemy = enemies.find(e => e.x === nx && e.y === ny);
    if (enemy) {
        enemy.hp--;
        if (enemy.hp <= 0) enemies.splice(enemies.indexOf(enemy), 1);
        render();
        return;
    }

    player.x = nx;
    player.y = ny;

    if (player.x === stairs.x && player.y === stairs.y) {
        alert('You Win!');
        location.reload();
        return;
    }

    enemyTurn();
    render();
}

function enemyTurn() {
    enemies.forEach(e => {
        if (e.hp <= 0) return;
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        let ex = e.x, ey = e.y;
        if (Math.abs(dx) > Math.abs(dy)) {
            ex += Math.sign(dx);
        } else {
            ey += Math.sign(dy);
        }
        if (map[ey][ex] !== '#' && !(player.x === ex && player.y === ey)) {
            e.x = ex;
            e.y = ey;
        }
        if (e.x === player.x && e.y === player.y) {
            player.hp--;
        }
    });
}

window.addEventListener('keydown', e => {
    if (player.hp <= 0) return;
    switch(e.key) {
        case 'ArrowUp': case 'w': move(0, -1); break;
        case 'ArrowDown': case 's': move(0, 1); break;
        case 'ArrowLeft': case 'a': move(-1, 0); break;
        case 'ArrowRight': case 'd': move(1, 0); break;
    }
});

init();
</script>
</body>
</html>
