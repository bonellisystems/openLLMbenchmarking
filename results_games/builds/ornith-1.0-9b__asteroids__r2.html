<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
    body { margin: 0; padding: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
    'use strict';

    // --- Configuration ---
    const W = 800, H = 600;
    const FPS = 60;
    const SHIP_THRUST = 0.15;
    const SHIP_FRICTION = 0.99;
    const SHIP_TURN = 0.06;
    const BULLET_SPEED = 5;
    const BULLET_LIFE = 60;
    const ASTEROID_FRICTION = 0.999;
    const ASTEROID_COUNT = 8;
    const BIG_RADIUS = 30;
    const MED_RADIUS = 18;
    const SMALL_RADIUS = 10;

    // --- Setup ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = W;
    canvas.height = H;

    // --- State ---
    let keys = {};
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let stars = [];

    // --- Input ---
    document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    // --- Math Helpers ---
    function rotatePoint(x, y, angle) {
        return {
            x: x * Math.cos(angle) - y * Math.sin(angle),
            y: x * Math.sin(angle) + y * Math.cos(angle)
        };
    }

    function wrap(x) {
        if (x < 0) x += W;
        if (x >= W) x -= W;
        return x;
    }

    function wrapY(y) {
        if (y < 0) y += H;
        if (y >= H) y -= H;
        return y;
    }

    // --- Starfield ---
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.5 + 0.3
        });
    }

    // --- Entities ---
    const player = {
        x: W / 2, y: H / 2,
        angle: -Math.PI / 2,
        vx: 0, vy: 0,
        thrusting: false,
        invincible: 120, // frames
        radius: 12
    };

    let bullets = [];
    let asteroids = [];

    // --- Procedural Rock Generation ---
    function generateRock(cx, cy, radius) {
        const vertices = [];
        const numVerts = 12;
        for (let i = 0; i < numVerts; i++) {
            const angle = (i / numVerts) * Math.PI * 2;
            // Organic distortion using sine waves
            const dist = radius * (0.8 + 0.4 * Math.sin(i * 1.3 + Math.random() * 2));
            vertices.push({
                x: cx + Math.cos(angle) * dist,
                y: cy + Math.sin(angle) * dist
            });
        }
        return vertices;
    }

    function spawnAsteroid(x, y, radius) {
        const verts = generateRock(x, y, radius);
        // Give it a slight random velocity
        const angle = Math.random() * Math.PI * 2;
        const speed = (1 / radius) * 0.5;
        asteroids.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: radius,
            vertices: verts,
            angle: 0,
            rotationSpeed: (Math.random() - 0.5) * 0.05,
            type: 'rock'
        });
    }

    function initGame() {
        score = 0;
        lives = 3;
        gameOver = false;
        player.x = W / 2;
        player.y = H / 2;
        player.vx = 0;
        player.vy = 0;
        player.invincible = 180;
        bullets = [];
        asteroids = [];
        // Fill screen with rocks
        for (let i = 0; i < ASTEROID_COUNT; i++) {
            let x, y, safe;
            do {
                x = Math.random() * W;
                y = Math.random() * H;
                safe = true;
                for (let a of asteroids) {
                    const dx = x - a.x, dy = y - a.y;
                    if (Math.sqrt(dx*dx + dy*dy) < a.radius * 2) safe = false;
                }
            } while (!safe);
            spawnAsteroid(x, y, BIG_RADIUS);
        }
    }

    // --- Update ---
    function update() {
        if (gameOver) return;

        // Player Movement
        if (keys['ArrowLeft']) player.angle -= SHIP_TURN;
        if (keys['ArrowRight']) player.angle += SHIP_TURN;

        if (keys['ArrowUp']) {
            player.thrusting = true;
            player.vx += Math.cos(player.angle) * SHIP_THRUST;
            player.vy += Math.sin(player.angle) * SHIP_THRUST;
        } else {
            player.thrusting = false;
            player.vx *= SHIP_FRICTION;
            player.vy *= SHIP_FRICTION;
        }

        player.x += player.vx;
        player.y += player.vy;

        // Wrap
        player.x = wrap(player.x);
        player.y = wrapY(player.y);

        // Invincibility
        if (player.invincible > 0) player.invincible--;

        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            if (b.life <= 0) bullets.splice(i, 1);
        }

        // Asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            let a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            a.angle += a.rotationSpeed;
            a.vx *= ASTEROID_FRICTION;
            a.vy *= ASTEROID_FRICTION;
            a.x = wrap(a.x);
            a.y = wrapY(a.y);

            // Ship vs Asteroid Collision
            if (player.invincible <= 0) {
                const dx = player.x - a.x;
                const dy = player.y - a.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < player.radius + a.radius) {
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        player.invincible = 120;
                        // Push ship away
                        const pushAngle = Math.atan2(dy, dx);
                        player.vx += Math.cos(pushAngle) * 5;
                        player.vy += Math.sin(pushAngle) * 5;
                    }
                }
            }
        }

        // Bullet vs Asteroid Collision
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            for (let j = asteroids.length - 1; j >= 0; j--) {
                let a = asteroids[j];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < a.radius) {
                    // Hit!
                    bullets.splice(i, 1);
                    score += (a.radius === BIG_RADIUS ? 20 : a.radius === MED_RADIUS ? 50 : 100);

                    if (a.radius === BIG_RADIUS) {
                        spawnAsteroid(a.x, a.y, MED_RADIUS);
                        spawnAsteroid(a.x, a.y, MED_RADIUS);
                    } else if (a.radius === MED_RADIUS) {
                        spawnAsteroid(a.x, a.y, SMALL_RADIUS);
                        spawnAsteroid(a.x, a.y, SMALL_RADIUS);
                    }
                    // Small asteroids are destroyed
                    asteroids.splice(j, 1);
                    break;
                }
            }
        }
    }

    // --- Draw ---
    function draw() {
        // Background
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        // Stars
        ctx.fillStyle = '#FFF';
        for (let s of stars) {
            ctx.globalAlpha = s.alpha;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        }
        ctx.globalAlpha = 1.0;

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#FFF';
            ctx.font = '48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', W/2, H/2 - 20);
            ctx.font = '24px monospace';
            ctx.fillText('Press Space to Restart', W/2, H/2 + 30);
            return;
        }

        // Asteroids
        for (let a of asteroids) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.angle);
            ctx.beginPath();
            ctx.moveTo(a.vertices[0].x, a.vertices[0].y);
            for (let k = 1; k < a.vertices.length; k++) {
                ctx.lineTo(a.vertices[k].x, a.vertices[k].y);
            }
            ctx.closePath();
            ctx.strokeStyle = '#AAA';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.restore();
        }

        // Bullets
        for (let b of bullets) {
            ctx.fillStyle = '#FF0';
            ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
        }

        // Player
        if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // Ship body
            ctx.beginPath();
            ctx.moveTo(12, 0);
            ctx.lineTo(-8, 8);
            ctx.lineTo(-4, 0);
            ctx.lineTo(-8, -8);
            ctx.closePath();
            ctx.fillStyle = '#FFF';
            ctx.fill();

            // Thrust flame
            if (player.thrusting) {
                ctx.beginPath();
                ctx.moveTo(-6, 0);
                ctx.lineTo(-16, 4);
                ctx.lineTo(-16, -4);
                ctx.closePath();
                ctx.fillStyle = '#F80';
                ctx.fill();
            }

            ctx.restore();
        }

        // HUD
        ctx.fillStyle = '#FFF';
        ctx.font = '20px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCORE: ' + score, 10, 30);
        ctx.textAlign = 'right';
        ctx.fillText('LIVES: ' + lives, W - 10, 30);
    }

    // --- Loop ---
    let lastTime = 0;
    function loop(timestamp) {
        const dt = timestamp - lastTime;
        lastTime = timestamp;

        update();
        draw();
        requestAnimationFrame(loop);
    }

    // --- Start ---
    initGame();
    requestAnimationFrame(loop);

})();
</script>
</body>
</html>
