<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  body{margin:0;background:#70c5ce;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
  canvas{background:#70c5ce;display:block;}
  .overlay{position:absolute;color:#fff;font-family:sans-serif;text-align:center;width:100%;top:40%;font-size:24px;pointer-events:none;}
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<div class="overlay" id="overlay"></div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  const GRAVITY = 0.5;
  const FLAP_STRENGTH = -8;
  const PIPE_SPEED = 2;
  const PIPE_WIDTH = 60;
  const GAP_HEIGHT = 130;
  const PIPE_INTERVAL = 1500; // ms

  let bird = { x: 80, y: HEIGHT/2, radius: 12, vy: 0 };
  let pipes = [];
  let lastPipeTime = 0;
  let score = 0;
  let best = 0;
  let gameState = 'start'; // start, playing, over

  function reset() {
    bird = { x: 80, y: HEIGHT/2, radius: 12, vy: 0 };
    pipes = [];
    lastPipeTime = 0;
    score = 0;
    gameState = 'playing';
    overlay.textContent = '';
  }

  function spawnPipe() {
    const gapY = Math.random() * (HEIGHT - GAP_HEIGHT - 80) + 40;
    pipes.push({ x: WIDTH, gapY });
  }

  function update(delta) {
    if (gameState !== 'playing') return;

    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;

    // Pipes movement
    for (let p of pipes) p.x -= PIPE_SPEED;

    // Remove off-screen pipes
    if (pipes.length && pipes[0].x + PIPE_WIDTH < 0) {
      pipes.shift();
      score++;
    }

    // Spawn new pipes
    if (performance.now() - lastPipeTime > PIPE_INTERVAL) {
      spawnPipe();
      lastPipeTime = performance.now();
    }

    // Collision detection
    if (bird.y + bird.radius > HEIGHT || bird.y - bird.radius < 0) {
      gameOver();
    }
    for (let p of pipes) {
      if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
        if (bird.y - bird.radius < p.gapY || bird.y + bird.radius > p.gapY + GAP_HEIGHT) {
          gameOver();
        }
      }
    }
  }

  function gameOver() {
    gameState = 'over';
    if (score > best) best = score;
    overlay.innerHTML = `Game Over<br>Score: ${score}<br>Best: ${best}<br>Press Space to Restart`;
  }

  function draw() {
    // Background
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    // Pipes
    ctx.fillStyle = '#5cba5c';
    for (let p of pipes) {
      // top pipe
      ctx.fillRect(p.x,0,PIPE_WIDTH,p.gapY);
      // bottom pipe
      ctx.fillRect(p.x,p.gapY+GAP_HEIGHT,PIPE_WIDTH,HEIGHT - (p.gapY+GAP_HEIGHT));
    }

    // Bird
    ctx.fillStyle = '#ffdd00';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI*2);
    ctx.fill();

    // Score
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText(`Score: ${score}`, 10, 30);
  }

  let lastTime = 0;
  function loop(timestamp) {
    const delta = timestamp - lastTime;
    lastTime = timestamp;
    update(delta);
    draw();
    requestAnimationFrame(loop);
  }

  // Input
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (gameState === 'start') {
        reset();
      } else if (gameState === 'playing') {
        bird.vy = FLAP_STRENGTH;
      } else if (gameState === 'over') {
        reset();
      }
    }
  });

  // Initial screen
  overlay.innerHTML = 'Press Space to Start';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
