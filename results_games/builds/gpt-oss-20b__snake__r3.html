<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Snake Game</title>
<style>
body{margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#222;color:#fff;font-family:Arial,Helvetica,sans-serif;}
#game{border:2px solid #fff;background:#000;}
#score{margin-top:10px;text-align:center;}
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<div id="score">Score: 0</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const cellSize=20;
const cols=canvas.width/cellSize;
const rows=canvas.height/cellSize;
let snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];
let dir={x:1,y:0};
let food=null;
let score=0;
let gameOver=false;
let interval=null;

function placeFood(){
  let x=Math.floor(Math.random()*cols);
  let y=Math.floor(Math.random()*rows);
  while(snake.some(s=>s.x===x&&s.y===y)){
    x=Math.floor(Math.random()*cols);
    y=Math.floor(Math.random()*rows);
  }
  food={x,y};
}

function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#f00';
  ctx.fillRect(food.x*cellSize,food.y*cellSize,cellSize,cellSize);
  ctx.fillStyle='#0f0';
  snake.forEach(s=>{
    ctx.fillRect(s.x*cellSize,s.y*cellSize,cellSize,cellSize);
  });
  document.getElementById('score').textContent='Score: '+score;
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    ctx.font='30px Arial';
    ctx.textAlign='center';
    ctx.fillText('Game Over',canvas.width/2,canvas.height/2-20);
    ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+20);
  }
}

function update(){
  if(gameOver)return;
  const newHead={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(newHead.x<0||newHead.x>=cols||newHead.y<0||newHead.y>=rows){
    gameOver=true;
    return;
  }
  if(snake.some(s=>s.x===newHead.x&&s.y===newHead.y)){
    gameOver=true;
    return;
  }
  snake.unshift(newHead);
  if(newHead.x===food.x&&newHead.y===food.y){
    score++;
    placeFood();
  }else{
    snake.pop();
  }
}

function gameLoop(){
  update();
  draw();
}

function start(){
  snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];
  dir={x:1,y:0};
  score=0;
  gameOver=false;
  placeFood();
  if(interval)clearInterval(interval);
  interval=setInterval(gameLoop,150);
}

document.addEventListener('keydown',e=>{
  if(gameOver && (e.key===' '||e.key==='r'||e.key==='R')){
    start();
    return;
  }
  const key=e.key;
  if(key==='ArrowUp'||key==='w'||key==='W'){
    if(dir.y!==1){dir={x:0,y:-1};}
  }else if(key==='ArrowDown'||key==='s'||key==='S'){
    if(dir.y!==-1){dir={x:0,y:1};}
  }else if(key==='ArrowLeft'||key==='a'||key==='A'){
    if(dir.x!==1){dir={x:-1,y:0};}
  }else if(key==='ArrowRight'||key==='d'||key==='D'){
    if(dir.x!==-1){dir={x:1,y:0};}
  }
});

start();
</script>
</body>
</html>
