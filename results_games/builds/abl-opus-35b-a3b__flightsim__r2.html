<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:-apple-system,'Helvetica Neue',sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#title{position:absolute;top:32px;left:36px;color:#fff;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:300}
#title span{font-weight:600;opacity:.9}
#info{position:absolute;bottom:32px;right:36px;color:#fff;font-size:12px;letter-spacing:.08em;text-align:right;line-height:1.8;opacity:.45}
#info b{font-weight:400;opacity:.7}
#speed{position:absolute;bottom:32px;left:36px;color:#fff;font-size:11px;letter-spacing:.1em;opacity:.4}
#speed b{font-size:28px;font-weight:200;letter-spacing:.04em;opacity:.85}
#speed span{font-size:10px;opacity:.5}
#compass{position:absolute;top:50%;right:36px;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(255,255,255,.15);border-radius:50%;opacity:.4}
#compass::after{content:'';position:absolute;top:50%;left:50%;width:2px;height:18px;background:#fff;transform-origin:bottom center;transform:translate(-50%,-100%)}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;opacity:.2}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff}
#crosshair::before{width:1px;height:100%;left:50%;transform:translateX(-50%)}
#crosshair::after{height:1px;width:100%;top:50%;transform:translateY(-50%)}
#loading{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;letter-spacing:.15em;opacity:.4;z-index:100}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<div id="title"><span>fly</span> · pieter</div>
<div id="info">
<b>W</b> forward <b>S</b> back<br>
<b>A</b> <b>D</b> strafe <b>Q</b> <b>E</b> up/down<br>
<b>↑</b> <b>↓</b> pitch <b>←</b> <b>→</b> yaw<br>
<b>SHIFT</b> boost <b>SPACE</b> brake
</div>
<div id="speed"><b id="spd">0</b> <span>km/h</span></div>
<div id="crosshair"></div>
</div>
<div id="loading">loading...</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var gl=canvas.getContext('webgl',{antialias:true,alpha:false});
if(!gl){document.getElementById('loading').textContent='webgl required';return;}
var W,H;
function resize(){
var dpr=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;H=window.innerHeight;
canvas.width=W*dpr;canvas.height=H*dpr;
gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize',resize);
resize();

var PI=Math.PI,TAU=PI*2;
function mat4(){return new Float32Array(16);}
function identity(){var m=mat4();m[0]=m[5]=m[10]=m[15]=1;return m;}
function perspective(fov,asp,near,far){
var m=mat4(),f=1/Math.tan(fov/2),nf=1/(near-far);
m[0]=f/asp;m[5]=f;m[10]=(far+near)*nf;m[11]=-1;m[14]=2*far*near*nf;return m;
}
function lookAt(eye,center,up){
var m=mat4(),zx=eye[0]-center[0],zy=eye[1]-center[1],zz=eye[2]-center[2],
l=Math.sqrt(zx*zx+zy*zy+zz*zz);
zx/=l;zy/=l;zz/=l;
var xx=up[1]*zz-up[2]*zy,xy=up[2]*zx-up[0]*zz,xz=up[0]*zy-up[1]*zx,
lx=Math.sqrt(xx*xx+xy*xy+xz*xz);
xx/=lx;xy/=lx;xz/=lx;
var yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;
m[12]=-(m[0]*eye[0]+m[4]*eye[1]+m[8]*eye[2]);
m[13]=-(m[1]*eye[0]+m[5]*eye[1]+m[9]*eye[2]);
m[14]=-(m[2]*eye[0]+m[6]*eye[1]+m[10]*eye[2]);
return m;
}
function rotY(a){var m=mat4(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[2]=s;m[8]=-s;m[10]=c;return m;}
function rotX(a){var m=mat4(),c=Math.cos(a),s=Math.sin(a);m[5]=c;m[6]=-s;m[9]=s;m[10]=c;return m;}
function rotZ(a){var m=mat4(),c=Math.cos(a),s=Math.sin(a);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;}
function mul(a,b){var m=mat4();for(var i=0;i<4;i++)for(var j=0;j<4;j++)for(var k=0;k<4;k++)m[i*4+j]+=a[i*4+k]*b[k*4+j];return m;}
function translate(x,y,z){var m=mat4();m[12]=x;m[13]=y;m[14]=z;return m;}
function scale(x,y,z){var m=mat4();m[0]=x;m[5]=y;m[10]=z;return m;}

var vsSource='attribute vec3 p;attribute vec3 n;uniform mat4 mvp;uniform mat4 mv;varying vec3 vN;varying vec3 vP;varying float vH;void main(){vN=mat3(mv)*n;vP=(mv*vec4(p,1.0)).xyz;vH=p.y;gl_Position=mvp*vec4(p,1.0);gl_PointSize=1.0;}';
var fsSource='precision mediump float;varying vec3 vN;varying vec3 vP;varying float vH;uniform vec3 cam;uniform float fog;uniform vec3 fogC;uniform float time;void main(){vec3 n=normalize(vN);vec3 l=normalize(vec3(0.3,0.8,0.5));float d=max(dot(n,l),0.0);vec3 sky=mix(vec3(0.02,0.02,0.06),vec3(0.15,0.2,0.35),smoothstep(-0.1,0.5,vH));vec3 c=mix(sky,vec3(0.85,0.88,0.92),d*0.65);float fog2=exp(-fog*length(vP-cam));c=mix(c,fogC,fog2);float a=0.85+0.15*smoothstep(0.0,0.3,vH);gl_FragColor=vec4(c,a);}';
var vsSky='attribute vec3 p;uniform mat4 mvp;void main(){gl_Position=mvp*vec4(p,1.0);gl_PointSize=1.0;}';
var fsSky='precision mediump float;varying vec3 vP;uniform float time;void main(){float h=normalize(vP).y;vec3 c=mix(vec3(0.01,0.01,0.04),vec3(0.12,0.18,0.35),smoothstep(-0.05,0.6,h));float d=length(vP);float a=smoothstep(0.0,0.3,h)*smoothstep(1.0,0.5,h);gl_FragColor=vec4(c,a);}';
var vsStar='attribute vec3 p;uniform mat4 mvp;uniform float time;void main(){gl_Position=mvp*vec4(p,1.0);gl_PointSize=1.0;}';
var fsStar='precision mediump float;varying vec3 vP;uniform float time;void main(){float d=length(vP);float a=smoothstep(0.0,0.3,normalize(vP).y)*smoothstep(1.0,0.5,normalize(vP).y);float twinkle=0.7+0.3*sin(time*2.0+vP.x*100.0+vP.z*100.0);gl_FragColor=vec4(vec3(0.9,0.92,1.0),a*twinkle);}';

function compile(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
var prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vsSource));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fsSource));gl.linkProgram(prog);gl.useProgram(prog);
var skyProg=gl.createProgram();gl.attachShader(skyProg,compile(gl.VERTEX_SHADER,vsSky));gl.attachShader(skyProg,compile(gl.FRAGMENT_SHADER,fsSky));gl.linkProgram(skyProg);gl.useProgram(skyProg);
var starProg=gl.createProgram();gl.attachShader(starProg,compile(gl.VERTEX_SHADER,vsStar));gl.attachShader(starProg,compile(gl.FRAGMENT_SHADER,fsStar));gl.linkProgram(starProg);gl.useProgram(starProg);

var mvpLoc=gl.getUniformLocation(prog,'mvp');var mvLoc=gl.getUniformLocation(prog,'mv');var camLoc=gl.getUniformLocation(prog,'cam');var fogLoc=gl.getUniformLocation(prog,'fog');var fogCLoc=gl.getUniformLocation(prog,'fogC');var timeLoc=gl.getUniformLocation(prog,'time');
var skyMvpLoc=gl.getUniformLocation(skyProg,'mvp');var skyTimeLoc=gl.getUniformLocation(skyProg,'time');
var starMvpLoc=gl.getUniformLocation(starProg,'mvp');var starTimeLoc=gl.getUniformLocation(starProg,'time');
var pLoc=gl.getAttribLocation(prog,'p');var nLoc=gl.getAttribLocation(prog,'n');
var skyPLoc=gl.getAttribLocation(skyProg,'p');var starPLoc=gl.getAttribLocation(starProg,'p');

function mkBuf(d){var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,d,gl.STATIC_DRAW);return b;}
function mkIdxBuf(d){var b=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,d,gl.STATIC_DRAW);return b;}

var verts=[],norms=[],idxs=[],vCount=0;
function addBox(x,y,z,w,h,d,r,g,b){
var hw=w/2,hh=h/2,hd=d/2;
var faces=[
[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],[0,0,-1]],
[[hw,-hh,-hd],[hw,hh,-hd],[hw,hh,hd],[hw,-hh,hd],[1,0,0]],
[[-hw,hh,-hd],[hw,hh,-hd],[hw,hh,hd],[-hw,hh,hd],[0,1,0]],
[[-hw,-hh,hd],[hw,-hh,hd],[hw,-hh,-hd],[-hw,-hh,-hd],[0,-1,0]],
[[-hw,-hh,hd],[-hw,hh,hd],[-hw,hh,-hd],[-hw,-hh,-hd],[-1,0,0]],
[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,-hh,hd],[-hw,-hh,hd],[0,0,1]]
];
for(var f=0;f<6;f++){
var v=faces[f],n=faces[f][4];
var c=[r,g,b];
for(var i=0;i<4;i++){
verts.push(x+v[i][0],y+v[i][1],z+v[i][2]);
norms.push(n[0],n[1],n[2]);
}
var base=vCount;
idxs.push(base,base+1,base+2,base,base+2,base+3);
vCount+=4;
}
}

var citySize=200,buildingCount=0;
var buildings=[];
for(var i=0;i<buildingCount;i++){
var bx=(Math.random()-0.5)*citySize*2;
var bz=(Math.random()-0.5)*citySize*2;
var bw=2+Math.random()*6;
var bh=5+Math.random()*40;
var bd=2+Math.random()*6;
var h=Math.random();
var r=0.75+h*0.15;
var g=0.78+h*0.12;
var b=0.82+h*0.1;
addBox(bx,0,bz,bw,bh,bd,r,g,b);
buildings.push({x:bx,z:bz,w:bw,d:bd,h:bh});
}

var vBuf=mkBuf(new Float32Array(verts));
var nBuf=mkBuf(new Float32Array(norms));
var iBuf=mkIdxBuf(new Uint16Array(idxs));

var skyVerts=[];
for(var i=0;i<8;i++){
var a=i*PI/4;
skyVerts.push(Math.cos(a),0.001,Math.sin(a));
}
var skyBuf=mkBuf(new Float32Array(skyVerts));
var skyIdxBuf=mkIdxBuf(new Uint16Array([0,1,2,0,2,3,0,3,4,0,4,5,0,5,6,0,6,7,0,7,1,0,1,2,0,2,3,0,3,4,0,4,5,0,5,6,0,6,7,0,7,1]));

var starVerts=[];
for(var i=0;i<500;i++){
var a=Math.random()*TAU;
var e=Math.random()*PI;
var r=50+Math.random()*100;
starVerts.push(r*Math.sin(e)*Math.cos(a),r*Math.cos(e),r*Math.sin(e)*Math.sin(a));
}
var starBuf=mkBuf(new Float32Array(starVerts));

var groundVerts=[];
var groundSize=citySize*3;
var gs=100;
for(var gy=0;gy<gs;gy++){
for(var gx=0;gx<gs;gx++){
var x=(gx-gs/2)*2;
var z=(gy-gs/2)*2;
var h=Math.sin(x*0.05)*Math.cos(z*0.05)*0.5;
groundVerts.push(x,h-0.5,z);
}
}
var groundBuf=mkBuf(new Float32Array(groundVerts));
var groundIdxs=[];
for(var gy=0;gy<gs-1;gy++){
for(var gx=0;gx<gs-1;gx++){
var i=gy*gs+gx;
groundIdxs.push(i,i+1,i+gs,i+1,i+gs+1,i+gs);
}
}
var groundIdxBuf=mkIdxBuf(new Uint16Array(groundIdxs));

var camX=0,camY=80,camZ=0;
var yaw=0,pitch=0;
var speed=0,boost=false,brake=false;
var keys={};
window.addEventListener('keydown',function(e){keys[e.code]=true;e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
document.getElementById('loading').style.display='none';

var time=0;
function frame(){
requestAnimationFrame(frame);
time+=0.016;
var dt=0.016;
if(keys['KeyW'])speed+=30*dt;
if(keys['KeyS'])speed-=30*dt;
if(keys['ShiftLeft']||keys['ShiftRight'])boost=true;else boost=false;
if(keys['Space'])brake=true;else brake=false;
if(boost)speed*=1.005;
if(brake)speed*=0.98;
speed=Math.max(-20,Math.min(200,speed));
var turn=0;
if(keys['ArrowLeft'])turn+=2*dt;
if(keys['ArrowRight'])turn-=2*dt;
yaw+=turn;
if(keys['ArrowUp'])pitch-=1.5*dt;
if(keys['ArrowDown'])pitch+=1.5*dt;
if(keys['KeyQ'])camY+=20*dt;
if(keys['KeyE'])camY-=20*dt;
var fx=Math.sin(yaw)*Math.cos(pitch);
var fy=Math.sin(pitch);
var fz=Math.cos(yaw)*Math.cos(pitch);
camX+=fx*speed*dt;
camY+=fy*speed*dt;
camZ+=fz*speed*dt;
var mv=lookAt([camX,camY,camZ],[camX+fx,camY+fy,camZ+fz],[0,1,0]);
var vp=perspective(PI/3,W/H,0.5,500);
var mvp=mul(vp,mv);
gl.clearColor(0.02,0.02,0.06,1);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
gl.useProgram(prog);
gl.uniformMatrix4fv(mvpLoc,false,mvp);
gl.uniformMatrix4fv(mvLoc,false,mv);
gl.uniform3f(camLoc,camX,camY,camZ);
gl.uniform1f(fogLoc,0.003);
gl.uniform3f(fogCLoc,0.02,0.02,0.06);
gl.uniform1f(timeLoc,time);
gl.bindBuffer(gl.ARRAY_BUFFER,vBuf);
gl.vertexAttribPointer(pLoc,3,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,nBuf);
gl.vertexAttribPointer(nLoc,3,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,iBuf);
gl.drawElements(gl.TRIANGLES,vCount*3,gl.UNSIGNED_SHORT,0);

gl.useProgram(skyProg);
gl.uniformMatrix4fv(skyMvpLoc,false,mvp);
gl.uniform1f(skyTimeLoc,time);
gl.bindBuffer(gl.ARRAY_BUFFER,skyBuf);
gl.vertexAttribPointer(skyPLoc,3,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,skyIdxBuf);
gl.drawElements(gl.TRIANGLES,24,gl.UNSIGNED_SHORT,0);

gl.useProgram(starProg);
gl.uniformMatrix4fv(starMvpLoc,false,mvp);
gl.uniform1f(starTimeLoc,time);
gl.bindBuffer(gl.ARRAY_BUFFER,starBuf);
gl.vertexAttribPointer(starPLoc,3,gl.FLOAT,false,0,0);
gl.drawArrays(gl.POINTS,0,500);

document.getElementById('spd').textContent=Math.round(speed*3.6);
}
frame();
})();
</script>
</body>
</html>
