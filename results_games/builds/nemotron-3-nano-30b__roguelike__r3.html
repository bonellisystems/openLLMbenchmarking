<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Roguelike</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;color:#fff;font-family monospace;}
canvas{border:2px solid #555;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// configuration
const MAP_W=21, MAP_H=21;
const TILE=20; // pixel size
const canvas=document.getElementById('game');
canvas.width=MAP_W*TILE;
canvas.height=MAP_H*TILE;
const ctx=canvas.getContext('2d');
const FONT='12px monospace';

// map: 0=wall, 1=floor, 2=player (we keep player separate)
let map=new Array(MAP_H).fill(0).map(()=>new Array(MAP_W).fill(0));
let px, py; // player position

function isWall(x,y){
 if(x<0||y<0||x>=MAP_W||y>=MAP_H) return true;
 return map[y][x]===0;
}
function generate(){
 // start with random walls/floors
 for(let y=0;y<MAP_H;y++){
  for(let x=0;x<MAP_W;x++){
   map[y][x]=Math.random()<0.45?0:1; // ~45% walls
  }
 }
 // place player on a floor cell
 while(true){
  px=Math.floor(Math.random()*MAP_W);
  py=Math.floor(Math.random()*MAP_H);
  if(map[py][px]===1) break;
 }
 // optionally clear some adjacent walls to make a small opening
 for(let dx=-1;dx<=1;dx++){
  for(let dy=-1;dy<=1;dy++){
   if(dx*dx+dy*dy===1){
    map[py+dy][px+dx]=1;
   }
  }
}
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let y=0;y<MAP_H;y++){
  for(let x=0;x<MAP_W;x++){
   const tx=x*TILE, ty=y*TILE;
   if(map[y][x]===0){
    ctx.fillStyle='#555';
    ctx.fillRect(tx,ty,TILE,TILE);
   }else{
    ctx.fillStyle='#222';
    ctx.fillRect(tx,ty,TILE,TILE);
    ctx.fillStyle='#fff';
    ctx.font=FONT;
    ctx.textBaseline='top';
    ctx.fillText('.',tx+4,ty+12);
   }
  }
 }
 // draw player
 ctx.fillStyle='@';
 ctx.font=FONT;
 ctx.fillText('@',px*TILE+4,py*TILE+14);
}
function move(dx,dy){
 const nx=px+dx, ny=py+dy;
 if(!isWall(nx,ny)){
  // revert old position to floor
  map[py][px]=1;
  // update player position
  px=nx; py=ny;
 }
}
document.addEventListener('keydown',e=>{
 const key=e.key;
 if(key==='ArrowUp') move(0,-1);
 else if(key==='ArrowDown') move(0,1);
 else if(key==='ArrowLeft') move(-1,0);
 else if(key==='ArrowRight') move(1,0);
 draw();
});
generate();
draw();
</script>
</body>
</html>
