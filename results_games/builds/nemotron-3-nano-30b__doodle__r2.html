<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doodle Jump Clone</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#fff;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(() => {
  const canvas = document.createElement('canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  const player = {
    width: 30,
    height: 30,
    x: canvas.width / 2,
    y: canvas.height - 100,
    vx: 0,
    vy: 0,
    onGround: false,
    color: '#f00'
  };

  const platforms = [];
  const generatePlatform = (y) => {
    const width = 100 + Math.random() * 200;
    const x = Math.random() * (canvas.width - width);
    platforms.push({x, y, width, height: 20, color: '#888'});
  };
  generatePlatform(canvas.height - 30);
  for (let i = 0; i < 5; i++) {
    generatePlatform(canvas.height - 150 - i * 100);
  }

  const GRAVITY = 0.6;
  const JUMP_STRENGTH = -12;
  const MOVE_SPEED = 5;

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    keys[e.key] = false;
  });

  const update = () => {
    player.vy += GRAVITY;
    if (keys['ArrowLeft']) player.vx = -MOVE_SPEED;
    else if (keys['ArrowRight']) player.vx = MOVE_SPEED;
    else player.vx = 0;
    player.x += player.vx;
    player.y += player.vy;

    player.onGround = false;
    for (const p of platforms) {
      const intersect = player.x < p.x + p.width &&
                        player.x + player.width > p.x &&
                        player.y < p.y + p.height &&
                        player.y + player.height > p.y;
      if (player.vy > 0 && intersect) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.onGround = true;
        break;
      }
    }

    if (keys[' '] && player.onGround) {
      player.vy = JUMP_STRENGTH;
      player.onGround = false;
    }

    while (platforms.length && platforms[0].y > canvas.height + 100) {
      platforms.shift();
    }

    if (player.vy < 0 && player.y < 100) {
      generatePlatform(player.y - 150);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of platforms) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.width, p.height);
    }
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    requestAnimationFrame(update);
  };

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
