<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; overflow: hidden; background: #87CEEB; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: canvas.width/2, y: canvas.height-100, vx: 0, vy: 0, size: 40, onGround: false };
let platforms = [];
let cameraY = 0;
let score = 0;
let gameOver = false;
let keys = {};

// Generate initial platforms
function initPlatforms() {
    platforms = [];
    for (let i = 0; i < 10; i++) {
        platforms.push({
            x: Math.random() * (canvas.width - 80),
            y: canvas.height - (i * 80) - 100,
            width: 80,
            height: 20
        });
    }
}

// Generate new platforms above
function generatePlatforms() {
    while (platforms[platforms.length-1].y > cameraY - 200) {
        let lastY = platforms[platforms.length-1].y;
        platforms.push({
            x: Math.random() * (canvas.width - 80),
            y: lastY - 60 - Math.random() * 40,
            width: 80,
            height: 20
        });
    }
}

// Input handling
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameOver && e.code === 'Space') {
        resetGame();
    }
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

function resetGame() {
    player = { x: canvas.width/2, y: canvas.height-100, vx: 0, vy: 0, size: 40, onGround: false };
    cameraY = 0;
    score = 0;
    gameOver = false;
    initPlatforms();
}

function update() {
    if (gameOver) return;

    // Horizontal movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -6;
    else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 6;
    else player.vx *= 0.8;

    player.x += player.vx;

    // Wrap around screen
    if (player.x < -player.size) player.x = canvas.width;
    if (player.x > canvas.width) player.x = -player.size;

    // Gravity
    player.vy += 0.5;
    player.y += player.vy;

    // Platform collision
    player.onGround = false;
    for (let p of platforms) {
        if (player.vy > 0 &&
            player.x + player.size > p.x &&
            player.x < p.x + p.width &&
            player.y + player.size > p.y &&
            player.y + player.size < p.y + p.height + 10) {
            player.vy = -15;
            player.onGround = true;
            player.y = p.y - player.size;
        }
    }

    // Update camera
    if (player.y < cameraY + canvas.height * 0.3) {
        cameraY = player.y - canvas.height * 0.3;
    }

    // Score
    score = Math.max(score, Math.floor(-cameraY / 10));

    // Generate platforms
    generatePlatforms();

    // Remove off-screen platforms
    platforms = platforms.filter(p => p.y > cameraY - 100);

    // Check game over
    if (player.y > cameraY + canvas.height) {
        gameOver = true;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw platforms
    ctx.fillStyle = '#8B4513';
    for (let p of platforms) {
        ctx.fillRect(p.x, p.y - cameraY, p.width, p.height);
    }

    // Draw player
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(player.x, player.y - cameraY, player.size, player.size);

    // Draw score
    ctx.fillStyle = '#000';
    ctx.font = '24px Arial';
    ctx.fillText('Score: ' + score, 20, 40);

    // Draw game over
    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFF';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 50);
        ctx.font = '24px Arial';
        ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2);
        ctx.fillText('Press SPACE to restart', canvas.width/2, canvas.height/2 + 50);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initPlatforms();
gameLoop();
</script>
</body>
</html>
