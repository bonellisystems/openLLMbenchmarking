<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #000;
            border: 4px solid #444;
        }
        #ui {
            text-align: center;
            margin-bottom: 10px;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="score">Score: 0</div>
    </div>
    <div id="game-container">
        <canvas id="snakeGame" width="400" height="400"></canvas>
        <div id="message">
            <h1>GAME OVER</h1>
            <p>Press any key to restart</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snakeGame');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let gameRunning = true;

        function main() {
            if (!gameRunning) return;

            setTimeout(function onTick() {
                update();
                draw();
                main();
            }, 100);
        }

        function update() {
            // Update direction from input
            dx = nextDx;
            dy = nextDy;

            // Move snake head
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = `Score: ${score}`;
                placeFood();
            } else {
                // Only remove tail if we didn't eat food (and if we are actually moving)
                if (dx !== 0 || dy !== 0) {
                    snake.pop();
                }
            }
        }

        function draw() {
            // Clear background
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = '#ff4d4d';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            // Draw snake
            ctx.fillStyle = '#4CAF50';
            snake.forEach((part, index) => {
                if (index === 0) ctx.fillStyle = '#8bc34a'; // Head color
                else ctx.fillStyle = '#4CAF50';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Ensure food doesn't spawn on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) placeFood();
            });
        }

        function gameOver() {
            gameRunning = false;
            messageElement.style.display = 'block';
        }

        function resetGame() {
            score = 0;
            scoreElement.innerText = `Score: 0`;
            snake = [{x: 10, y: 10}];
            dx = 0; dy = 0; nextDx = 0; nextDy = 0;
            placeFood();
            messageElement.style.display = 'none';
            gameRunning = true;
            main();
        }

        window.addEventListener('keydown', e => {
            if (!gameRunning) {
                resetGame();
                return;
            }

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
            }
        });

        main();
    </script>
</body>
</html>
