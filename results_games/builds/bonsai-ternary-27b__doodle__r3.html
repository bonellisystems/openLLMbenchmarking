<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;display:flex;justify-content:center;align-items:center}
canvas{display:block;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  canvas.width = Math.min(800, window.innerWidth);
  canvas.height = Math.min(600, window.innerHeight);
}
resize();
window.addEventListener('resize', resize);

// Game constants
const GRAVITY = 0.55;
const JUMP_FORCE = -11.5;
const MOVE_SPEED = 3.5;
const PLATFORM_WIDTH_MIN = 60;
const PLATFORM_WIDTH_MAX = 180;
const PLATFORM_HEIGHT = 14;
const PLATFORM_GAP_MIN = 80;
const PLATFORM_GAP_MAX = 160;
const PLATFORM_HEIGHT_VARIATION = 120;
const GENERATION_DISTANCE = 400;
const CAMERA_SMOOTH = 0.08;

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
let frameCount = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Player
let player = {
  x: 100, y: 300,
  vx: 0, vy: 0,
  width: 24, height: 32,
  onGround: false,
  facing: 1,
  jumpBuffer: 0,
  coyoteTime: 0,
  squash: 1, stretch: 1,
  trail: []
};

// Platforms
let platforms = [];
let particles = [];
let stars = [];

// Camera
let camera = { x: 0, y: 0 };

// Input
let keys = {};
let jumpPressed = false;

// Generate starfield
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * 2000,
      y: Math.random() * 400,
      size: Math.random() * 2 + 0.5,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    });
  }
}

// Generate platforms
function generatePlatforms() {
  let lastX = platforms.length > 0 ? platforms[platforms.length - 1].x + platforms[platforms.length - 1].w : 0;
  let lastY = platforms.length > 0 ? platforms[platforms.length - 1].y : 300;

  for (let i = 0; i < 15; i++) {
    let gap = PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
    let w = PLATFORM_WIDTH_MIN + Math.random() * (PLATFORM_WIDTH_MAX - PLATFORM_WIDTH_MIN);
    let y = lastY + (Math.random() - 0.5) * PLATFORM_HEIGHT_VARIATION;
    y = Math.max(100, Math.min(500, y));

    platforms.push({
      x: lastX + gap,
      y: y,
      w: w,
      h: PLATFORM_HEIGHT,
      color: Math.random() > 0.5 ? '#4a90d9' : '#7b68ee',
      topColor: Math.random() > 0.5 ? '#5aa0e8' : '#8b79f4',
      passed: false
    });

    lastX = platforms[i].x + platforms[i].w;
    lastY = platforms[i].y;
  }
}

// Spawn particles
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4 - 2,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: Math.random() * 3 + 1,
      color: color
    });
  }
}

// Reset game
function resetGame() {
  player.x = 100;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.facing = 1;
  player.jumpBuffer = 0;
  player.coyoteTime = 0;
  player.squash = 1;
  player.stretch = 1;
  player.trail = [];

  platforms = [];
  particles = [];

  // Initial platforms
  platforms.push({ x: 0, y: 350, w: 200, h: PLATFORM_HEIGHT, color: '#4a90d9', topColor: '#5aa0e8', passed: false });
  platforms.push({ x: 250, y: 300, w: 120, h: PLATFORM_HEIGHT, color: '#7b68ee', topColor: '#8b79f4', passed: false });
  platforms.push({ x: 420, y: 380, w: 100, h: PLATFORM_HEIGHT, color: '#4a90d9', topColor: '#5aa0e8', passed: false });

  generatePlatforms();

  score = 0;
  frameCount = 0;
  camera.x = 0;
  camera.y = 0;
  shakeTimer = 0;
}

// Check collision with platforms
function checkPlatformCollision() {
  player.onGround = false;

  for (let p of platforms) {
    // Check if player is above platform and falling
    if (player.x + player.width > p.x &&
        player.x < p.x + p.w &&
        player.y + player.height >= p.y &&
        player.y + player.height <= p.y + p.h + player.vy + 2 &&
        player.vy >= 0) {

      player.y = p.y - player.height;
      player.vy = 0;
      player.onGround = true;

      // Squash effect
      if (player.vy === 0 && player.squash < 1) {
        player.squash = 1;
        player.stretch = 1;
      }

      // Landing particles
      if (player.vy === 0 && player.y === p.y - player.height) {
        spawnParticles(player.x + player.width / 2, player.y + player.height, 3, '#ffffff');
      }

      // Mark as passed for scoring
      if (!p.passed && player.x > p.x + p.w / 2) {
        p.passed = true;
        score++;
      }
    }
  }
}

// Jump
function jump() {
  if (player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    player.squash = 0.7;
    player.stretch = 1.3;
    spawnParticles(player.x + player.width / 2, player.y + player.height, 5, '#aaddff');
  }
}

// Update
function update() {
  if (state !== 'playing') return;

  frameCount++;

  // Input
  if (keys['ArrowLeft'] || keys['KeyA']) {
    player.vx = -MOVE_SPEED;
    player.facing = -1;
  } else if (keys['ArrowRight'] || keys['KeyD']) {
    player.vx = MOVE_SPEED;
    player.facing = 1;
  } else {
    player.vx *= 0.8;
  }

  // Jump
  if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) {
    jump();
  }

  // Apply gravity
  player.vy += GRAVITY;
  player.vy = Math.min(player.vy, 12);

  // Update position
  player.x += player.vx;
  player.y += player.vy;

  // Trail
  if (frameCount % 3 === 0) {
    player.trail.push({ x: player.x + player.width / 2, y: player.y + player.height / 2, life: 1 });
  }
  player.trail = player.trail.filter(t => { t.life -= 0.05; return t.life > 0; });

  // Check collisions
  checkPlatformCollision();

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Camera
  let targetX = player.x - canvas.width * 0.3;
  targetX = Math.max(0, targetX);
  camera.x += (targetX - camera.x) * CAMERA_SMOOTH;

  // Generate new platforms
  let lastPlatform = platforms[platforms.length - 1];
  if (player.x > lastPlatform.x + lastPlatform.w + GENERATION_DISTANCE) {
    generatePlatforms();
  }

  // Remove old platforms
  if (platforms.length > 0 && platforms[0].x + platforms[0].w < camera.x - 200) {
    platforms.shift();
  }

  // Squash/stretch recovery
  player.squash += (1 - player.squash) * 0.15;
  player.stretch += (1 - player.stretch) * 0.15;

  // Screen shake decay
  if (shakeTimer > 0) {
    shakeTimer--;
  }

  // Check death (fell too far)
  if (player.y > canvas.height + 100) {
    gameOver();
  }

  // Update stars
  for (let s of stars) {
    s.x -= 0.3;
    s.twinkle += s.speed;
    if (s.x < -10) s.x = canvas.width + 10;
  }
}

// Draw
function draw() {
  // Background gradient
  let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  for (let s of stars) {
    let alpha = 0.3 + 0.7 * Math.abs(Math.sin(s.twinkle));
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // Apply camera transform
  ctx.save();
  ctx.translate(-camera.x, 0);

  // Draw platforms
  for (let p of platforms) {
    // Platform body
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    // Platform top (lighter)
    ctx.fillStyle = p.topColor;
    ctx.fillRect(p.x, p.y, p.w, 4);

    // Platform bottom shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);

    // Platform edge highlights
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(p.x, p.y, 2, p.h);
    ctx.fillRect(p.x + p.w - 2, p.y, 2, p.h);
  }

  // Draw particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Draw player trail
  for (let t of player.trail) {
    ctx.globalAlpha = t.life * 0.3;
    ctx.fillStyle = '#aaddff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, 3 * t.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Draw player
  let px = player.x;
  let py = player.y;
  let pw = player.width;
  let ph = player.height;

  // Apply squash/stretch
  let sx = player.x + pw / 2;
  let sy = player.y + ph;
  let drawW = pw * player.squash;
  let drawH = ph * player.stretch;
  let drawX = sx - drawW / 2;
  let drawY = sy - drawH;

  // Body
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.roundRect(drawX + 2, drawY + 8, drawW - 4, drawH - 8, 4);
  ctx.fill();

  // Head
  ctx.fillStyle = '#ff6b81';
  ctx.beginPath();
  ctx.arc(sx, drawY + 6, 8, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#fff';
  let eyeOffset = player.facing * 2;
  ctx.beginPath();
  ctx.arc(sx + eyeOffset - 2, drawY + 5, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx + eyeOffset + 2, drawY + 5, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Pupils
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(sx + eyeOffset - 1.5, drawY + 5.5, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx + eyeOffset + 2.5, drawY + 5.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.fillStyle = '#c0392b';
  if (player.onGround) {
    // Standing legs
    ctx.fillRect(drawX + 4, drawY + drawH - 6, 5, 6);
    ctx.fillRect(drawX + drawW - 9, drawY + drawH - 6, 5, 6);
  } else {
    // Jumping legs
    ctx.fillRect(drawX + 2, drawY + drawH - 8, 6, 4);
    ctx.fillRect(drawX + drawW - 8, drawY + drawH - 4, 6, 4);
  }

  // Jump indicator (small arrow when jumping)
  if (!player.onGround && player.vy < 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(sx - 4, drawY + 12);
    ctx.lineTo(sx, drawY + 16);
    ctx.lineTo(sx + 4, drawY + 12);
    ctx.fill();
  }

  ctx.restore();

  // Screen shake
  if (shakeTimer > 0) {
    ctx.save();
    ctx.translate(
      (Math.random() - 0.5) * shakeIntensity,
      (Math.random() - 0.5) * shakeIntensity
    );
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`Score: ${score}`, 20, 40);

  if (highScore > 0) {
    ctx.font = '16px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`Best: ${highScore}`, 20, 62);
  }

  // Controls hint
  if (state === 'start') {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = 'bold 36px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('DOODLE JUMP', canvas.width / 2, canvas.height / 2 - 60);

    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Press SPACE or UP to jump', canvas.width / 2, canvas.height / 2);
    ctx.fillText('← → or A D to move', canvas.width / 2, canvas.height / 2 + 30);

    // Pulsing start text
    let pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.05);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * pulse})`;
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Press SPACE to start', canvas.width / 2, canvas.height / 2 + 80);
  }

  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 40px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

    ctx.fillStyle = '#fff';
    ctx.font = '24px "Segoe UI", Arial, sans-serif';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
      ctx.fillText('★ NEW BEST! ★', canvas.width / 2, canvas.height / 2 + 40);
    }

    let pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.05);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * pulse})`;
    ctx.font = '18px "Segoe UI", Arial, sans-serif';
    ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 80);
  }

  ctx.restore();
}

// Game over
function gameOver() {
  state = 'gameover';
  if (score > highScore) highScore = score;
  shakeTimer = 15;
  shakeIntensity = 8;
  spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 20, '#e94560');
}

// Keyboard handling
document.addEventListener('keydown', (e) => {
  keys[e.code] = true;

  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'start') {
      state = 'playing';
      resetGame();
    } else if (state === 'gameover') {
      state = 'playing';
      resetGame();
    } else if (state === 'playing') {
      jump();
    }
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (state === 'start' || state === 'gameover') {
    state = 'playing';
    resetGame();
  } else if (state === 'playing') {
    jump();
  }
});

// Polyfill roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
    return this;
  };
}

// Init
initStars();
resetGame();

// Game loop
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
