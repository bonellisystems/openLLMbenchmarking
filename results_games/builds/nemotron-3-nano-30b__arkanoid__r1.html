<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
  body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}
  canvas{background:#111;display:block;}
</style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const WIDTH=canvas.width;
const HEIGHT=canvas.height;

// Game objects
const paddle={w:100,h:10,x:WIDTH/2-50,y:HEIGHT-30,dx:0,speed:6};
const ball={r:8,x:WIDTH/2,y:HEIGHT/2,vx:2,vy:-2};
const brickRowCount=5;
const brickColumnCount=7;
const brickWidth=80;
const brickHeight=20;
const brickPadding=10;
const brickOffsetTop=50;
const brickOffsetLeft=30;
let bricks=[];
let score=0;
let lives=3;

// Initialize bricks
function initBricks(){
  bricks=[];
  for(let c=0;c<brickColumnCount;c++){
    bricks[c]=[];
    for(let r=0;r<brickRowCount;r++){
      const brickX=c*(brickWidth+brickPadding)+brickOffsetLeft;
      const brickY=r*(brickHeight+brickPadding)+brickOffsetTop;
      bricks[c][r]={x:brickX,y:brickY,status:1};
    }
  }
}
initBricks();

// Keyboard controls
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') paddle.dx=-paddle.speed;
  if(e.key==='ArrowRight') paddle.dx=paddle.speed;
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') paddle.dx=0;
});

// Collision detection
function collision(ball,brick){
  const ballLeft=ball.x;
  const ballRight=ball.x+ball.r*2;
  const ballTop=ball.y;
  const ballBottom=ball.y+ball.r*2;
  const brickLeft=brick.x;
  const brickRight=brick.x+brickWidth;
  const brickTop=brick.y;
  const brickBottom=brick.y+brickHeight;
  return ballLeft<brickRight && ballRight>brickLeft && ballTop<brbrickBottom && ballBottom>brickTop;
}

// Update game state
function update(){
  // Move paddle
  paddle.x+=paddle.dx;
  if(paddle.x<0) paddle.x=0;
  if(paddle.x+paddle.w>WIDTH) paddle.x=WIDTH-paddle.w;

  // Move ball
  ball.x+=ball.vx;
  ball.y+=ball.vy;

  // Wall collision
  if(ball.x<=0||ball.x+ball.r*2>=WIDTH) ball.vx*=-1;
  if(ball.y+ball.r*2>=HEIGHT) ball.vy*=-1;

  // Paddle collision
  if(ball.x+ball.r>=paddle.x && ball.x<=paddle.x+paddle.w && ball.y+ball.r*2>=paddle.y){
    const angle=ball.x-paddle.x - paddle.w/2;
    const deflection=angle/(paddle.w/2)*Math.PI/4;
    ball.vx=Math.cos(deflection)*5;
    ball.vy=-Math.sin(deflection)*5;
    // Ensure vertical bounce
    if(ball.vy>0) ball.vy*=-1;
  }

  // Brick collision
  for(let c=0;c<brickColumnCount;c++){
    for(let r=0;r<brickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        if(collision(ball,b)){
          b.status=0;
          score++;
          ball.vy*=-1;
          // Check if ball hits side of brick
          if(ball.x< b.x || ball.x+ball.r*2> b.x+brickWidth){
            ball.vx*=-1;
          }
        }
      }
    }
  }

  // Reset ball if missed
  if(ball.y+ball.r*2>HEIGHT){
    lives--;
    if(!lives){
      alert('Game Over! Score: '+score);
      document.location.reload();
    }else{
      ball.x=WIDTH/2;
      ball.y=HEIGHT/2;
      ball.vx=2;
      ball.vy=-2;
    }
  }

  // Win condition
  if(score===brickRowCount*brickColumnCount){
    alert('You Win! Score: '+score);
    document.location.reload();
  }
}

// Draw everything
function draw(){
  // Clear canvas
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  // Draw bricks
  for(let c=0;c<brickColumnCount;c++){
    for(let r=0;r<brickRowCount;r++){
      const b=bricks[c][r];
      if(b.status){
        ctx.fillStyle='#888';
        ctx.fillRect(b.x,b.y,brickWidth,brickHeight);
        ctx.strokeStyle='#555';
        ctx.strokeRect(b.x,b.y,brickWidth,brickHeight);
      }
    }
  }
  // Draw paddle
  ctx.fillStyle='#0f0';
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  // Draw ball
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
  // Draw score & lives
  ctx.fillStyle='#fff';
  ctx.font='16px Arial';
  ctx.fillText('Score: '+score,8,16);
  ctx.fillText('Lives: '+lives,8,32);
}

// Game loop
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
