<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  body{margin:0;background:#70c5ce;font-family:sans-serif;}
  canvas{display:block;margin:auto;background:#70c5ce;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:white;font-size:48px;text-shadow:2px 2px 4px #000;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="320" height="480"></canvas>
<div id="overlay" style="display:none;">Game Over<br>Press Space to Restart</div>
<script>
(function(){
  const canvas=document.getElementById('gameCanvas');
  const ctx=canvas.getContext('2d');
  const overlay=document.getElementById('overlay');
  const W=canvas.width, H=canvas.height;
  const bird={x:50,y:150,width:34,height:24,vy:0};
  const gravity=0.5,lift=-10;
  const pipeW=52,pipeGap=150,pipeSpeed=2,pipeInterval=1500;
  let pipes=[],lastPipe=0,score=0,highScore=0,gameOver=false,started=false;
  function reset(){
    bird.y=150;bird.vy=0;
    pipes=[];lastPipe=0;score=0;gameOver=false;started=false;
    overlay.style.display='none';
  }
  function addPipe(){
    const gapY=Math.random()*(H-pipeGap-40)+20;
    pipes.push({x:W,y:gapY,passed:false});
  }
  function update(dt){
    if(!started)return;
    bird.vy+=gravity;
    bird.y+=bird.vy;
    if(bird.y<0){bird.y=0;bird.vy=0;}
    if(bird.y+bird.height>H){bird.y=H-bird.height;gameOver=true;}
    // pipes
    for(let i=0;i<pipes.length;i++){
      const p=pipes[i];
      p.x-=pipeSpeed;
      // collision
      if(bird.x< p.x+pipeW && bird.x+bird.width>p.x){
        if(bird.y< p.y || bird.y+bird.height>p.y+pipeGap){gameOver=true;}
      }
      // score
      if(!p.passed && p.x+pipeW<bird.x){
        p.passed=true;score++;if(score>highScore)highScore=score;
      }
    }
    // remove off-screen pipes
    while(pipes.length && pipes[0].x+pipeW<0)pipes.shift();
    // add new pipe
    if(Date.now()-lastPipe>pipeInterval)addPipe();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // background
    ctx.fillStyle='#70c5ce';
    ctx.fillRect(0,0,W,H);
    // bird
    ctx.fillStyle='#ff0';
    ctx.fillRect(bird.x,bird.y,bird.width,bird.height);
    // pipes
    ctx.fillStyle='#0f0';
    pipes.forEach(p=>{
      ctx.fillRect(p.x,0,pipeW,p.y);
      ctx.fillRect(p.x,p.y+pipeGap,pipeW,H);
    });
    // score
    ctx.fillStyle='#fff';
    ctx.font='24px sans-serif';
    ctx.fillText('Score: '+score,10,30);
    ctx.fillText('High: '+highScore,10,60);
    if(gameOver){
      overlay.style.display='flex';
    }
  }
  let lastTime=0;
  function loop(timestamp){
    const dt=timestamp-lastTime;
    lastTime=timestamp;
    update(dt);
    draw();
    if(!gameOver)requestAnimationFrame(loop);
  }
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){
      if(gameOver){reset();requestAnimationFrame(loop);return;}
      if(!started){started=true;}
      bird.vy=lift;
    }
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
