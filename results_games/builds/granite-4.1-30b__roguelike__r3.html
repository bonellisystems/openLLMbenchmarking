<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tiny Roguelike</title>
<style>
  body { font-family: monospace; background: #000; color: #fff; }
  #game { font-size: 14px; line-height: 1.2; }
</style>
</head>
<body>
<div id="game"></div>
<script>
(() => {
  const WIDTH = 40, HEIGHT = 20;
  const MAP = Array.from({length: HEIGHT}, () => Array(WIDTH).fill(0));
  const PLAYER = {x: 1, y: 1};
  const ENEMY = {x: 1, y: 1};
  const render = () => {
    let output = '';
    for (let y = 0; y < HEIGHT; y++) {
      for (let x = 0; x < WIDTH; x++) {
        if (x === PLAYER.x && y === PLAYER.y) output += '@';
        else if (x === ENEMY.x && y === ENEMY.y) output += 'E';
        else if (MAP[y][x] === 1) output += '#';
        else output += '.';
      }
      output += '\n';
    }
    document.getElementById('game').textContent = output;
  };
  const generateMap = () => {
    for (let y = 0; y < HEIGHT; y++) {
      for (let x = 0; x < WIDTH; x++) {
        MAP[y][x] = Math.random() < 0.3 ? 1 : 0;
      }
    }
  };
  const move = (dx, dy) => {
    const newX = PLAYER.x + dx;
    const newY = PLAYER.y + dy;
    if (newX >= 0 && newX < WIDTH && newY >= 0 && newY < HEIGHT && MAP[newY][newX] === 0) {
      PLAYER.x = newX;
      PLAYER.y = newY;
    }
  };
  const gameLoop = () => {
    render();
    moveEnemy();
    if (PLAYER.x === ENEMY.x && PLAYER.y === ENEMY.y) {
      alert('Game Over!');
      return;
    }
    requestAnimationFrame(gameLoop);
  };
  const moveEnemy = () => {
    const dx = Math.random() < 0.5 ? Math.floor(Math.random() * 3 - 1) : 0;
    const dy = Math.random() < 0.5 ? Math.floor(Math.random() * 3 - 1) : 0;
    const newX = ENEMY.x + dx;
    const newY = ENEMY.y + dy;
    if (newX >= 0 && newX < WIDTH && newY >= 0 && newY < HEIGHT && MAP[newY][newX] === 0) {
      ENEMY.x = newX;
      ENEMY.y = newY;
    }
  };
  generateMap();
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp': move(0, -1); break;
      case 'ArrowDown': move(0, 1); break;
      case 'ArrowLeft': move(-1, 0); break;
      case 'ArrowRight': move(1, 0); break;
    }
  });
  gameLoop();
})();
</script>
</body>
</html>
