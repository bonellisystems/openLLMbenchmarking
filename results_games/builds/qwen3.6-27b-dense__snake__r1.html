<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #111;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
overflow: hidden;
}
#gameContainer {
position: relative;
}
canvas {
display: block;
border: 2px solid #333;
border-radius: 4px;
box-shadow: 0 0 40px rgba(0, 255, 100, 0.15);
}
#ui {
position: absolute;
top: -45px;
left: 0;
right: 0;
display: flex;
justify-content: space-between;
align-items: center;
color: #fff;
font-size: 18px;
}
#score { color: #4f8; font-weight: bold; }
#highScore { color: #888; font-size: 14px; }
#overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: rgba(0,0,0,0.75);
border-radius: 4px;
color: #fff;
text-align: center;
}
#overlay h1 { font-size: 36px; margin-bottom: 10px; color: #4f8; }
#overlay p { font-size: 16px; color: #aaa; margin-bottom: 6px; }
#overlay .sub { font-size: 13px; color: #666; margin-top: 16px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameContainer">
<div id="ui">
<span id="score">Score: 0</span>
<span id="highScore">Best: 0</span>
</div>
<canvas id="gameCanvas"></canvas>
<div id="overlay">
<h1>🐍 Snake</h1>
<p>Use arrow keys or WASD to move</p>
<p class="sub">Press any key to start</p>
</div>
</div>
<script>
(function() {
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');

const GRID = 20;
const COLS = 30;
const ROWS = 25;
canvas.width = COLS * GRID;
canvas.height = ROWS * GRID;

let snake, direction, nextDirection, food, score, highScore, gameState, speed, lastTime, accumulator, particles;

highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
highScoreEl.textContent = 'Best: ' + highScore;

function init() {
const midX = Math.floor(COLS / 2);
const midY = Math.floor(ROWS / 2);
snake = [
{ x: midX, y: midY },
{ x: midX - 1, y: midY },
{ x: midX - 2, y: midY }
];
direction = { x: 1, y: 0 };
nextDirection = { x: 1, y: 0 };
score = 0;
speed = 110;
particles = [];
scoreEl.textContent = 'Score: 0';
placeFood();
}

function placeFood() {
let pos;
do {
pos = {
x: Math.floor(Math.random() * COLS),
y: Math.floor(Math.random() * ROWS)
};
} while (snake.some(s => s.x === pos.x && s.y === pos.y));
food = pos;
}

function spawnParticles(x, y) {
for (let i = 0; i < 12; i++) {
const angle = Math.random() * Math.PI * 2;
const vel = 1 + Math.random() * 3;
particles.push({
x: x * GRID + GRID / 2,
y: y * GRID + GRID / 2,
vx: Math.cos(angle) * vel,
vy: Math.sin(angle) * vel,
life: 1,
color: Math.random() > 0.5 ? '#4f8' : '#ff6',
size: 2 + Math.random() * 3
});
}
}

function update() {
direction = { ...nextDirection };
const head = {
x: snake[0].x + direction.x,
y: snake[0].y + direction.y
};

if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
gameOver();
return;
}

if (snake.some(s => s.x === head.x && s.y === head.y)) {
gameOver();
return;
}

snake.unshift(head);

if (head.x === food.x && head.y === food.y) {
score += 10;
scoreEl.textContent = 'Score: ' + score;
spawnParticles(food.x, food.y);
placeFood();
if (speed > 50) speed -= 1.5;
} else {
snake.pop();
}
}

function gameOver() {
gameState = 'dead';
if (score > highScore) {
highScore = score;
localStorage.setItem('snakeHighScore', highScore);
highScoreEl.textContent = 'Best: ' + highScore;
}
overlay.classList.remove('hidden');
overlay.innerHTML = '<h1>Game Over</h1><p>Score: ' + score + '</p><p class="sub">Press any key to restart</p>';
}

function draw() {
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.strokeStyle = 'rgba(255,255,255,0.03)';
ctx.lineWidth = 1;
for (let x = 0; x <= COLS; x++) {
ctx.beginPath();
ctx.moveTo(x * GRID, 0);
ctx.lineTo(x * GRID, canvas.height);
ctx.stroke();
}
for (let y = 0; y <= ROWS; y++) {
ctx.beginPath();
ctx.moveTo(0, y * GRID);
ctx.lineTo(canvas.width, y * GRID);
ctx.stroke();
}

if (food) {
const pulse = 1 + 0.15 * Math.sin(Date.now() / 200);
const fx = food.x * GRID + GRID / 2;
const fy = food.y * GRID + GRID / 2;
const fr = (GRID / 2 - 2) * pulse;

ctx.shadowColor = '#f44';
ctx.shadowBlur = 15;
ctx.fillStyle = '#f44';
ctx.beginPath();
ctx.arc(fx, fy, fr, 0, Math.PI * 2);
ctx.fill();
ctx.shadowBlur = 0;

ctx.fillStyle = '#faa';
ctx.beginPath();
ctx.arc(fx - 2, fy - 2, fr * 0.3, 0, Math.PI * 2);
ctx.fill();
}

snake.forEach((seg, i) => {
const x = seg.x * GRID;
const y = seg.y * GRID;
const t = i / snake.length;
const r = Math.round(30 + t * 10);
const g = Math.round(220 - t * 120);
const b = Math.round(80 + t * 40);

ctx.fillStyle = `rgb(${r},${g},${b})`;
const pad = i === 0 ? 1 : 2;
const radius = i === 0 ? 5 : 3;

ctx.beginPath();
ctx.roundRect(x + pad, y + pad, GRID - pad * 2, GRID - pad * 2, radius);
ctx.fill();

if (i === 0) {
ctx.shadowColor = '#4f8';
ctx.shadowBlur = 10;
ctx.fill();
ctx.shadowBlur = 0;

const ex = seg.x * GRID + GRID / 2 + direction.x * 3;
const ey = seg.y * GRID + GRID / 2 + direction.y * 3;

ctx.fillStyle = '#fff';
const perpX = -direction.y;
const perpY = direction.x;
const eyeOff = 3;

ctx.beginPath();
ctx.arc(ex + perpX * eyeOff, ey + perpY * eyeOff, 2.5, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.arc(ex - perpX * eyeOff, ey - perpY * eyeOff, 2.5, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#111';
ctx.beginPath();
ctx.arc(ex + perpX * eyeOff + direction.x, ey + perpY * eyeOff + direction.y, 1.2, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.arc(ex - perpX * eyeOff + direction.x, ey - perpY * eyeOff + direction.y, 1.2, 0, Math.PI * 2);
ctx.fill();
}
});

particles.forEach(p => {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
ctx.fill();
});
ctx.globalAlpha = 1;
}

function updateParticles() {
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx;
p.y += p.vy;
p.vx *= 0.96;
p.vy *= 0.96;
p.life -= 0.025;
if (p.life <= 0) particles.splice(i, 1);
}
}

function gameLoop(timestamp) {
requestAnimationFrame(gameLoop);

if (!lastTime) lastTime = timestamp;
const delta = timestamp - lastTime;
lastTime = timestamp;

if (gameState === 'playing') {
accumulator += delta;
while (accumulator >= speed) {
accumulator -= speed;
update();
if (gameState !== 'playing') break;
}
}

updateParticles();
draw();
}

function handleKey(e) {
if (gameState === 'idle' || gameState === 'dead') {
if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D',' '].includes(e.key)) {
gameState = 'playing';
overlay.classList.add('hidden');
init();
accumulator = 0;
lastTime = 0;
}
return;
}

if (gameState !== 'playing') return;

switch(e.key) {
case 'ArrowUp': case 'w': case 'W':
if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
break;
case 'ArrowDown': case 's': case 'S':
if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
break;
case 'ArrowLeft': case 'a': case 'A':
if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
break;
case 'ArrowRight': case 'd': case 'D':
if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
break;
}
e.preventDefault();
}

document.addEventListener('keydown', handleKey);

gameState = 'idle';
accumulator = 0;
lastTime = 0;
init();
draw();
requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
