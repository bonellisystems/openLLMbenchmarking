<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; overflow: hidden; background: #87CEEB; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: canvas.width/2, y: canvas.height-100, vx: 0, vy: 0, size: 30 };
let platforms = [];
let score = 0;
let highScore = localStorage.getItem('doodleHighScore') || 0;
let gameOver = false;
let springCount = 0;
let jetCount = 0;

// Generate initial platforms
function initPlatforms() {
    platforms = [];
    for (let i = 0; i < 10; i++) {
        platforms.push({
            x: Math.random() * (canvas.width - 80),
            y: i * 80 + 100,
            width: 80,
            height: 20
        });
    }
}

// Add new platform above
function addPlatform(y) {
    platforms.push({
        x: Math.random() * (canvas.width - 80),
        y: y,
        width: 80,
        height: 20
    });
}

// Input handling
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameOver && e.code === 'Space') {
        resetGame();
    }
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

// Touch controls
let touchStartX = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
});
window.addEventListener('touchmove', e => {
    if (!gameOver) {
        let touch = e.touches[0];
        let deltaX = touch.clientX - touchStartX;
        player.vx = deltaX * 0.1;
    }
});
window.addEventListener('touchend', () => {
    player.vx = 0;
});

function resetGame() {
    player = { x: canvas.width/2, y: canvas.height-100, vx: 0, vy: 0, size: 30 };
    score = 0;
    gameOver = false;
    initPlatforms();
}

function update() {
    if (gameOver) return;

    // Horizontal movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -8;
    else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 8;
    else if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['KeyA'] && !keys['KeyD']) {
        player.vx *= 0.9;
    }

    player.x += player.vx;
    
    // Screen wrapping
    if (player.x < 0) player.x = canvas.width;
    if (player.x > canvas.width) player.x = 0;

    // Gravity
    player.vy += 0.5;
    player.y += player.vy;

    // Platform collision
    for (let i = platforms.length - 1; i >= 0; i--) {
        let p = platforms[i];
        if (player.vy > 0 && 
            player.x + player.size > p.x && 
            player.x < p.x + p.width && 
            player.y + player.size > p.y && 
            player.y + player.size < p.y + p.height) {
            
            player.vy = -15;
            player.y = p.y - player.size;
            
            // Remove platform if it's below screen
            if (p.y > canvas.height) {
                platforms.splice(i, 1);
            }
        }
    }

    // Generate new platforms
    while (platforms.length > 0 && platforms[platforms.length-1].y > -50) {
        addPlatform(platforms[platforms.length-1].y - 80);
    }
    
    // Keep minimum platforms
    while (platforms.length < 10) {
        let lastY = platforms.length > 0 ? platforms[platforms.length-1].y : canvas.height;
        addPlatform(lastY - 80);
    }

    // Score based on height
    score = Math.max(score, Math.floor((canvas.height - player.y) / 10));

    // Game over
    if (player.y > canvas.height) {
        gameOver = true;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('doodleHighScore', highScore);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw platforms
    ctx.fillStyle = '#8B4513';
    for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    }

    // Draw player
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(player.x, player.y, player.size, player.size);

    // Draw score
    ctx.fillStyle = '#000';
    ctx.font = '24px Arial';
    ctx.fillText('Score: ' + score, 20, 40);
    ctx.fillText('Best: ' + highScore, 20, 70);

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFF';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 50);
        ctx.font = '24px Arial';
        ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2);
        ctx.fillText('Best: ' + highScore, canvas.width/2, canvas.height/2 + 40);
        ctx.fillText('Press SPACE to restart', canvas.width/2, canvas.height/2 + 100);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initPlatforms();
gameLoop();
</script>
</body>
</html>
