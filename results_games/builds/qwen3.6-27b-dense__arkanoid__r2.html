<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Courier New', monospace;
}
canvas {
display: block;
border: 2px solid #333;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 800;
const H = 600;
canvas.width = W;
canvas.height = H;

// Audio context
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(freq, duration, type = 'square', volume = 0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playHitSound() { playSound(440, 0.08); }
function playBrickSound() { playSound(600 + Math.random() * 400, 0.12, 'square', 0.1); }
function playWallSound() { playSound(300, 0.06); }
function playLoseSound() { playSound(150, 0.4, 'sawtooth', 0.2); }
function playWinSound() {
    [523, 659, 784, 1047].forEach((f, i) => {
        setTimeout(() => playSound(f, 0.2, 'square', 0.12), i * 100);
    });
}
function playPowerupSound() { playSound(880, 0.15, 'sine', 0.15); }

// Game state
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, WIN: 4, LEVEL_COMPLETE: 5 };
let state = STATE.MENU;
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let comboTimer = 0;

// Paddle
const paddle = {
    x: W / 2 - 60,
    y: H - 40,
    w: 120,
    h: 14,
    speed: 8,
    color: '#00ccff',
    targetX: W / 2 - 60
};

// Balls
let balls = [];
function createBall(x, y, dx, dy) {
    return { x: x || W / 2, y: y || H - 60, dx: dx || 4 * (Math.random() > 0.5 ? 1 : -1), dy: dy || -5, r: 7, speed: 5, attached: !dx };
}

// Bricks
let bricks = [];
const BRICK_ROWS = 8;
const BRICK_COLS = 12;
const BRICK_W = 58;
const BRICK_H = 20;
const BRICK_PAD = 4;
const BRICK_OFFSET_TOP = 50;
const BRICK_OFFSET_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;

const BRICK_COLORS = [
    ['#ff4444', '#ff6666'],
    ['#ff8800', '#ffaa44'],
    ['#ffdd00', '#ffee66'],
    ['#44dd44', '#66ff66'],
    ['#00ccff', '#44ddff'],
    ['#4488ff', '#66aaff'],
    ['#aa44ff', '#cc66ff'],
    ['#ff44aa', '#ff66cc']
];

// Particles
let particles = [];
function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

// Power-ups
let powerups = [];
const POWERUP_TYPES = ['wide', 'multi', 'life', 'fire'];
const POWERUP_COLORS = { wide: '#00ff88', multi: '#ff8800', life: '#ff4444', fire: '#ffdd00' };
const POWERUP_LABELS = { wide: 'W', multi: 'M', life: '+', fire: 'F' };

function spawnPowerup(x, y) {
    if (Math.random() > 0.15) return;
    const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    powerups.push({ x, y, dy: 2, type, w: 24, h: 14 });
}

// Fire mode
let fireMode = false;
let fireTimer = 0;

// Input
const keys = {};
document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    initAudio();

    if (state === STATE.MENU && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    } else if (state === STATE.GAMEOVER && (e.code === 'Space' || e.code === 'Enter')) {
        state = STATE.MENU;
    } else if (state === STATE.WIN && (e.code === 'Space' || e.code === 'Enter')) {
        state = STATE.MENU;
    } else if (state === STATE.LEVEL_COMPLETE && (e.code === 'Space' || e.code === 'Enter')) {
        nextLevel();
    } else if (state === STATE.PLAYING && e.code === 'Escape') {
        state = STATE.PAUSED;
    } else if (state === STATE.PAUSED && e.code === 'Escape') {
        state = STATE.PLAYING;
    }

    e.preventDefault();
});
document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    e.preventDefault();
});

// Level layouts
function generateLevel(lvl) {
    bricks = [];
    const patterns = [
        // Level 1: Simple rows
        () => {
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    bricks.push({
                        x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PAD),
                        y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PAD),
                        w: BRICK_W, h: BRICK_H,
                        hp: 1, maxHp: 1,
                        color: BRICK_COLORS[r % BRICK_COLORS.length],
                        alive: true
                    });
                }
            }
        },
        // Level 2: Diamond
        () => {
            const center = BRICK_COLS / 2;
            for (let r = 0; r < 6; r++) {
                const halfWidth = Math.abs(r - 2.5);
                const startCol = Math.floor(center - 3 + halfWidth);
                const endCol = Math.floor(center + 3 - halfWidth);
                for (let c = startCol; c <= endCol; c++) {
                    if (c >= 0 && c < BRICK_COLS) {
                        bricks.push({
                            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PAD),
                            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PAD),
                            w: BRICK_W, h: BRICK_H,
                            hp: r < 2 ? 2 : 1, maxHp: r < 2 ? 2 : 1,
                            color: BRICK_COLORS[r % BRICK_COLORS.length],
                            alive: true
                        });
                    }
                }
            }
        },
        // Level 3: Checkerboard with tough bricks
        () => {
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    if ((r + c) % 2 === 0 || r < 2) {
                        bricks.push({
                            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PAD),
                            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PAD),
                            w: BRICK_W, h: BRICK_H,
                            hp: r < 2 ? 3 : (r < 4 ? 2 : 1),
                            maxHp: r < 2 ? 3 : (r < 4 ? 2 : 1),
                            color: BRICK_COLORS[r % BRICK_COLORS.length],
                            alive: true
                        });
                    }
                }
            }
        },
        // Level 4: Fortress
        () => {
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    const isBorder = r === 0 || r === 6 || c === 0 || c === BRICK_COLS - 1;
                    const isInner = r >= 2 && r <= 4 && c >= 3 && c <= 8;
                    if (isBorder || isInner) {
                        bricks.push({
                            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PAD),
                            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PAD),
                            w: BRICK_W, h: BRICK_H,
                            hp: isBorder ? 2 : 1,
                            maxHp: isBorder ? 2 : 1,
                            color: BRICK_COLORS[r % BRICK_COLORS.length],
                            alive: true
                        });
                    }
                }
            }
        },
        // Level 5: Random dense
        () => {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    if (Math.random() > 0.2) {
                        bricks.push({
                            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_PAD),
                            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_PAD),
                            w: BRICK_W, h: BRICK_H,
                            hp: Math.random() > 0.7 ? 3 : (Math.random() > 0.5 ? 2 : 1),
                            maxHp: Math.random() > 0.7 ? 3 : (Math.random() > 0.5 ? 2 : 1),
                            color: BRICK_COLORS[r % BRICK_COLORS.length],
                            alive: true
                        });
                    }
                }
            }
        }
    ];

    const patternIndex = (lvl - 1) % patterns.length;
    patterns[patternIndex]();
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    fireMode = false;
    fireTimer = 0;
    paddle.w = 120;
    resetLevel();
    state = STATE.PLAYING;
}

function resetLevel() {
    generateLevel(level);
    balls = [createBall()];
    powerups = [];
    particles = [];
    paddle.x = W / 2 - paddle.w / 2;
    paddle.w = 120;
    fireMode = false;
    fireTimer = 0;
}

function nextLevel() {
    level++;
    if (level > 5) {
        state = STATE.WIN;
        playWinSound();
        return;
    }
    resetLevel();
    state = STATE.PLAYING;
}

function loseLife() {
    lives--;
    playLoseSound();
    if (lives <= 0) {
        state = STATE.GAMEOVER;
    } else {
        balls = [createBall()];
        paddle.x = W / 2 - paddle.w / 2;
    }
}

// Collision detection
function rectCollision(bx, by, br, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(bx, rx + rw));
    const closestY = Math.max(ry, Math.min(by, ry + rh));
    const dx = bx - closestX;
    const dy = by - closestY;
    return (dx * dx + dy * dy) < (br * br);
}

// Update
function update() {
    if (state !== STATE.PLAYING) return;

    // Paddle movement
    if (keys['ArrowLeft'] || keys['KeyA']) {
        paddle.x -= paddle.speed;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        paddle.x += paddle.speed;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // Fire mode timer
    if (fireMode) {
        fireTimer--;
        if (fireTimer <= 0) fireMode = false;
    }

    // Combo timer
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) combo = 0;
    }

    // Update balls
    for (let bi = balls.length - 1; bi >= 0; bi--) {
        const ball = balls[bi];

        if (ball.attached) {
            ball.x = paddle.x + paddle.w / 2;
            ball.y = paddle.y - ball.r;
            if (keys['Space'] || keys['ArrowUp'] || keys['KeyW']) {
                ball.attached = false;
                ball.dy = -ball.speed;
                ball.dx = 3 * (Math.random() > 0.5 ? 1 : -1);
                playSound(500, 0.1);
            }
            continue;
        }

        ball.x += ball.dx;
        ball.y += ball.dy;

        // Wall collisions
        if (ball.x - ball.r <= 0) {
            ball.x = ball.r;
            ball.dx = Math.abs(ball.dx);
            playWallSound();
        }
        if (ball.x + ball.r >= W) {
            ball.x = W - ball.r;
            ball.dx = -Math.abs(ball.dx);
            playWallSound();
        }
        if (ball.y - ball.r <= 0) {
            ball.y = ball.r;
            ball.dy = Math.abs(ball.dy);
            playWallSound();
        }

        // Bottom - lose ball
        if (ball.y + ball.r > H) {
            balls.splice(bi, 1);
            if (balls.length === 0) {
                loseLife();
            }
            continue;
        }

        // Paddle collision
        if (rectCollision(ball.x, ball.y, ball.r, paddle.x, paddle.y, paddle.w, paddle.h) && ball.dy > 0) {
            const hitPos = (ball.x - paddle.x) / paddle.w;
            const angle = (hitPos - 0.5) * Math.PI * 0.7;
            const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
            ball.dx = Math.sin(angle) * speed;
            ball.dy = -Math.cos(angle) * speed;
            ball.y = paddle.y - ball.r;
            playHitSound();
            spawnParticles(ball.x, ball.y, '#00ccff', 4);
        }

        // Brick collisions
        for (let brick of bricks) {
            if (!brick.alive) continue;
            if (rectCollision(ball.x, ball.y, ball.r, brick.x, brick.y, brick.w, brick.h)) {
                brick.hp--;
                if (brick.hp <= 0) {
                    brick.alive = false;
                    combo++;
                    comboTimer = 120;
                    const points = 10 * combo * level;
                    score += points;
                    spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color[0], 12);
                    spawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
                    playBrickSound();
                } else {
                    playSound(800, 0.08);
                    spawnParticles(ball.x, ball.y, brick.color[0], 4);
                }

                if (!fireMode) {
                    // Determine bounce direction
                    const ballCenterX = ball.x;
                    const ballCenterY = ball.y;
                    const brickCenterX = brick.x + brick.w / 2;
                    const brickCenterY = brick.y + brick.h / 2;

                    const overlapX = (brick.w / 2 + ball.r) - Math.abs(ballCenterX - brickCenterX);
                    const overlapY = (brick.h / 2 + ball.r) - Math.abs(ballCenterY - brickCenterY);

                    if (overlapX < overlapY) {
                        ball.dx = -ball.dx;
                    } else {
                        ball.dy = -ball.dy;
                    }
                }
                break;
            }
        }
    }

    // Update powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const pu = powerups[i];
        pu.y += pu.dy;

        if (pu.y > H) {
            powerups.splice(i, 1);
            continue;
        }

        // Paddle catch
        if (pu.x + pu.w / 2 > paddle.x && pu.x - pu.w / 2 < paddle.x + paddle.w &&
            pu.y + pu.h > paddle.y && pu.y < paddle.y + paddle.h) {
            playPowerupSound();
            switch (pu.type) {
                case 'wide':
                    paddle.w = Math.min(200, paddle.w + 30);
                    break;
                case 'multi':
                    const newBalls = [];
                    balls.forEach(b => {
                        if (!b.attached) {
                            newBalls.push(createBall(b.x, b.y, b.dx + 1, b.dy - 1));
                            newBalls.push(createBall(b.x, b.y, b.dx - 1, b.dy + 1));
                        }
                    });
                    balls = balls.concat(newBalls.slice(0, 4));
                    break;
                case 'life':
                    lives = Math.min(5, lives + 1);
                    break;
                case 'fire':
                    fireMode = true;
                    fireTimer = 600;
                    break;
            }
            spawnParticles(pu.x, pu.y, POWERUP_COLORS[pu.type], 8);
            powerups.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.05;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Check level complete
    if (bricks.every(b => !b.alive)) {
        state = STATE.LEVEL_COMPLETE;
        playWinSound();
    }
}

// Draw
function draw() {
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Grid pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    if (state === STATE.MENU) {
        drawMenu();
        return;
    }

    // Draw bricks
    for (const brick of bricks) {
        if (!brick.alive) continue;
        const alpha = brick.hp / brick.maxHp;
        ctx.fillStyle = brick.color[0];
        ctx.globalAlpha = 0.5 + alpha * 0.5;
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);

        // Highlight
        ctx.fillStyle = brick.color[1];
        ctx.globalAlpha = 0.3;
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h / 3);

        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = 1;
        ctx.globalAlpha = 1;
        ctx.strokeRect(brick.x, brick.y, brick.w, brick.h);

        // HP indicator for multi-hit bricks
        if (brick.maxHp > 1) {
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.8;
            ctx.font = 'bold 11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(brick.hp, brick.x + brick.w / 2, brick.y + brick.h / 2 + 4);
            ctx.globalAlpha = 1;
        }
    }
    ctx.globalAlpha = 1;

    // Draw powerups
    for (const pu of powerups) {
        ctx.fillStyle = POWERUP_COLORS[pu.type];
        ctx.fillRect(pu.x - pu.w / 2, pu.y - pu.h / 2, pu.w, pu.h);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(POWERUP_LABELS[pu.type], pu.x, pu.y);
    }

    // Draw paddle
    const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    paddleGrad.addColorStop(0, fireMode ? '#ffdd00' : '#00eeff');
    paddleGrad.addColorStop(1, fireMode ? '#ff8800' : '#0066aa');
    ctx.fillStyle = paddleGrad;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 4);
    ctx.fill();

    // Paddle glow
    ctx.shadowColor = fireMode ? '#ffdd00' : '#00ccff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'transparent';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.shadowBlur = 0;

    // Draw balls
    for (const ball of balls) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = fireMode ? '#ffdd00' : '#ffffff';
        ctx.fill();

        // Ball glow
        ctx.shadowColor = fireMode ? '#ffdd00' : '#ffffff';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // HUD
    drawHUD();

    // Overlays
    if (state === STATE.PAUSED) drawOverlay('PAUSED', 'Press ESC to resume');
    if (state === STATE.GAMEOVER) drawOverlay('GAME OVER', 'Press SPACE to continue');
    if (state === STATE.WIN) drawOverlay('YOU WIN!', 'Press SPACE to continue');
    if (state === STATE.LEVEL_COMPLETE) drawOverlay(`LEVEL ${level} COMPLETE!`, 'Press SPACE for next level');
}

function drawHUD() {
    // Score
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 28);

    // Level
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${level}`, W / 2, 28);

    // Lives
    ctx.textAlign = 'right';
    ctx.fillText('LIVES:', W - 80, 28);
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(W - 65 + i * 22, 24, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    // Combo
    if (combo > 1 && comboTimer > 0) {
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.globalAlpha = comboTimer / 120;
        ctx.fillText(`COMBO x${combo}`, W / 2, 50);
        ctx.globalAlpha = 1;
    }

    // Fire mode indicator
    if (fireMode) {
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(`FIRE: ${Math.ceil(fireTimer / 60)}s`, W - 15, 48);
    }

    // Ball count
    if (balls.length > 1) {
        ctx.fillStyle = '#aaa';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText(`BALLS: ${balls.length}`, 15, 48);
    }
}

function drawMenu() {
    // Title
    ctx.fillStyle = '#00ccff';
    ctx.font = 'bold 64px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 30;
    ctx.fillText('ARKANOID', W / 2, H / 2 - 80);
    ctx.shadowBlur = 0;

    // Subtitle
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px Courier New';
    ctx.fillText('Breakout Clone', W / 2, H / 2 - 30);

    // Instructions
    ctx.fillStyle = '#aaaaaa';
    ctx.font = '16px Courier New';
    ctx.fillText('← → or A D to move paddle', W / 2, H / 2 + 30);
    ctx.fillText('SPACE or ↑ to launch ball', W / 2, H / 2 + 55);
    ctx.fillText('ESC to pause', W / 2, H / 2 + 80);

    // Start prompt
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + pulse * 0.5})`;
    ctx.font = 'bold 22px Courier New';
    ctx.fillText('Press SPACE or ENTER to start', W / 2, H / 2 + 140);

    // Decorative bricks
    const time = Date.now() / 1000;
    for (let i = 0; i < 12; i++) {
        const bx = W / 2 - 350 + i * 60;
        const by = H / 2 + 190 + Math.sin(time + i * 0.5) * 5;
        ctx.fillStyle = BRICK_COLORS[i % BRICK_COLORS.length][0];
        ctx.globalAlpha = 0.6;
        ctx.fillRect(bx, by, 50, 14);
    }
    ctx.globalAlpha = 1;
}

function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#aaaaaa';
    ctx.font = '18px Courier New';
    ctx.fillText(subtitle, W / 2, H / 2 + 30);

    if (state === STATE.GAMEOVER || state === STATE.WIN) {
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 24px Courier New';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 80);
    }
}

// Game loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Polyfill roundRect if needed
if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r, r, r, r];
        this.moveTo(x + r[0], y);
        this.lineTo(x + w - r[1], y);
        this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
        this.lineTo(x + w, y + h - r[2]);
        this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
        this.lineTo(x + r[3], y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
        this.lineTo(x, y + r[0]);
        this.quadraticCurveTo(x, y, x + r[0], y);
        this.closePath();
    };
}

gameLoop();
</script>
