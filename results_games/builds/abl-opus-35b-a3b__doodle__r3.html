    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }
  function jumpSound() { playTone(440, 0.12, 0.06); }
  function landSound() { playTone(220, 0.08, 0.04); }

  });

  var PLAYER_W = 36;
  var PLAYER_H = 40;

  var PLATFORM_MIN_W = 60;
  var PLATFORM_MAX_W = 120;
  var PLATFORM_GAP = 80;

    gameOver = false;
    started = true;

    }
    for (var i = 0; i < 20; i++) {
      var pw = PLATFORM_MIN_W + Math.random() * (PLATFORM_MAX_W - PLATFORM_MIN_W);
      platforms.push({ x: Math.random() * (W - pw), y: H - 50 - i * 70, w: pw, h: PLATFORM_H, type: 'normal' });
    }
  }

  function spawnPlatform(y) {
    var pw = PLATFORM_MIN_W + Math.random() * (PLATFORM_MAX_W - PLATFORM_MIN_W);
    var px = Math.random() * (W - pw);
    var type = 'normal';
    if (score > 500 && Math.random() < 0.15) type = 'moving';
    else if (score > 1000 && Math.random() < 0.1) type = 'fragile';
    platforms.push({ x: px, y: y, w: pw, h: PLATFORM_H, type: type, vx: type === 'moving' ? (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1) : 0 });
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i < 6; i++) {

  }

    if (moveLeft) { player.vx -= 0.6; player.dir = -1; }
    if (moveRight) { player.vx += 0.6; player.dir = 1; }

    if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;
