<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Courier New', monospace;
}
canvas {
display: block;
border: 2px solid #333;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 800;
const H = 600;
canvas.width = W;
canvas.height = H;

// Audio context
let audioCtx = null;
function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
}

function playSound(freq, duration, type, volume) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || 'square';
osc.frequency.value = freq;
gain.gain.value = volume || 0.1;
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + duration);
}

function playHitBrick(freq) {
playSound(freq || 440, 0.1, 'square', 0.12);
}
function playHitPaddle() {
playSound(300, 0.1, 'triangle', 0.15);
}
function playHitWall() {
playSound(200, 0.08, 'triangle', 0.1);
}
function playLoseLife() {
playSound(150, 0.3, 'sawtooth', 0.15);
setTimeout(() => playSound(100, 0.4, 'sawtooth', 0.15), 200);
}
function playLevelUp() {
playSound(523, 0.15, 'square', 0.12);
setTimeout(() => playSound(659, 0.15, 'square', 0.12), 150);
setTimeout(() => playSound(784, 0.2, 'square', 0.12), 300);
}
function playGameOver() {
playSound(400, 0.2, 'sawtooth', 0.15);
setTimeout(() => playSound(300, 0.2, 'sawtooth', 0.15), 200);
setTimeout(() => playSound(200, 0.4, 'sawtooth', 0.15), 400);
}
function playWin() {
[523,659,784,1047].forEach((f,i) => {
setTimeout(() => playSound(f, 0.3, 'square', 0.12), i * 200);
});
}

// Game state
const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, WIN: 4, LEVEL_TRANS: 5 };
let state = STATE.MENU;
let score = 0;
let lives = 3;
let level = 1;
let highScore = parseInt(localStorage.getItem('arkanoid_high') || '0');

// Paddle
const paddle = {
w: 100, h: 16, x: 0, y: H - 40, speed: 8, dx: 0, color: '#00ffcc'
};
paddle.x = (W - paddle.w) / 2;

// Ball
const balls = [];
function createBall(x, y, dx, dy) {
return { x: x || W / 2, y: y || paddle.y - 10, dx: dx || 4, dy: dy || -4, r: 8, speed: 5, stuck: !dx };
}

// Bricks
const BRICK_ROWS = 8;
const BRICK_COLS = 12;
const BRICK_W = 62;
const BRICK_H = 22;
const BRICK_PAD = 4;
const BRICK_TOP = 60;
const BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD) - BRICK_PAD)) / 2;

const BRICK_COLORS = [
['#ff4444', '#ff6666'],
['#ff8844', '#ffaa66'],
['#ffcc44', '#ffee66'],
['#88cc44', '#aaff66'],
['#44cc88', '#66ffaa'],
['#44aacc', '#66ccff'],
['#4466ff', '#6688ff'],
['#8844ff', '#aa66ff'],
['#ff44aa', '#ff66cc'],
];

let bricks = [];
let particles = [];
let powerups = [];
let trail = [];

function createBricks() {
bricks = [];
for (let r = 0; r < BRICK_ROWS; r++) {
bricks[r] = [];
for (let c = 0; c < BRICK_COLS; c++) {
let hp = 1;
if (level >= 2 && r < 3) hp = 2;
if (level >= 3 && r < 2) hp = 3;
bricks[r][c] = {
x: BRICK_LEFT + c * (BRICK_W + BRICK_PAD),
y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
w: BRICK_W, h: BRICK_H,
hp: hp, maxHp: hp,
alive: true,
color: BRICK_COLORS[r % BRICK_COLORS.length][0],
colorLight: BRICK_COLORS[r % BRICK_COLORS.length][1],
points: (BRICK_ROWS - r) * 10
};
}
}
}

function resetBall() {
balls.length = 0;
balls.push(createBall(paddle.x + paddle.w / 2, paddle.y - 10, 0, 0));
}

function startGame() {
initAudio();
score = 0;
lives = 3;
level = 1;
createBricks();
resetBall();
particles = [];
powerups = [];
state = STATE.PLAYING;
}

function nextLevel() {
level++;
createBricks();
balls.length = 0;
balls.push(createBall(paddle.x + paddle.w / 2, paddle.y - 10, 0, 0));
powerups = [];
particles = [];
state = STATE.LEVEL_TRANS;
setTimeout(() => { state = STATE.PLAYING; }, 1500);
}

// Powerup types
const POWERUP_TYPES = {
WIDE: 0,       // wider paddle
MULTIBALL: 1,  // extra balls
FASTBALL: 2,   // faster ball
SLOWBALL: 3,   // slower ball
FIREFBALL: 4,  // fireball (destroys through bricks)
LIFE: 5,       // extra life
SHRINK: 6,     // shrink bricks
};

const POWERUP_COLORS = ['#00ff00', '#ffff00', '#ff4444', '#4488ff', '#ff00ff', '#00ff88', '#ff8800'];
const POWERUP_LABELS = ['W', 'M', 'F', 'S', '★', '+', '↔'];

function spawnPowerup(x, y) {
if (Math.random() > 0.15) return;
const type = Math.floor(Math.random() * Object.keys(POWERUP_TYPES).length);
powerups.push({ x, y, type, w: 30, h: 16, dy: 2, alive: true });
}

function applyPowerup(type) {
switch (type) {
case POWERUP_TYPES.WIDE:
paddle.w = Math.min(200, paddle.w + 40);
break;
case POWERUP_TYPES.MULTIBALL:
if (balls.length > 0) {
const b = balls[0];
balls.push(createBall(b.x, b.y, b.dx + 2, b.dy));
balls.push(createBall(b.x, b.y, b.dx - 2, b.dy));
}
break;
case POWERUP_TYPES.FASTBALL:
balls.forEach(b => {
const spd = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
if (spd < 10) {
b.dx *= 1.3;
b.dy *= 1.3;
}
});
break;
case POWERUP_TYPES.SLOWBALL:
balls.forEach(b => {
const spd = Math.sqrt(b.dx * b.dx + b.dy * b.dy);
if (spd > 3) {
b.dx *= 0.7;
b.dy *= 0.7;
}
});
break;
case POWERUP_TYPES.FIREFBALL:
balls.forEach(b => { b.fire = true; b.r = 10; });
break;
case POWERUP_TYPES.LIFE:
lives++;
break;
case POWERUP_TYPES.SHRINK:
bricks.forEach(row => row.forEach(b => {
if (b.alive) {
b.w = Math.max(30, b.w - 10);
b.x += 5;
}
}));
break;
}
playSound(880, 0.15, 'sine', 0.15);
}

// Particles
function spawnParticles(x, y, color, count) {
for (let i = 0; i < count; i++) {
particles.push({
x, y,
dx: (Math.random() - 0.5) * 8,
dy: (Math.random() - 0.5) * 8,
life: 1,
decay: 0.02 + Math.random() * 0.03,
color: color,
size: 2 + Math.random() * 4
});
}
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
keys[e.key] = true;
if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
e.preventDefault();
}

if (state === STATE.MENU) {
startGame();
return;
}
if (state === STATE.PLAYING) {
if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
state = STATE.PAUSED;
}
if (e.key === ' ' && balls.length > 0 && balls[0].stuck) {
balls[0].stuck = false;
balls[0].dy = -balls[0].speed;
balls[0].dx = (Math.random() - 0.5) * 4;
playSound(400, 0.05, 'sine', 0.1);
}
}
if (state === STATE.PAUSED) {
if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
state = STATE.PLAYING;
}
}
if (state === STATE.GAMEOVER || state === STATE.WIN) {
if (e.key === 'Enter' || e.key === ' ') {
state = STATE.MENU;
}
}
});

document.addEventListener('keyup', e => { keys[e.key] = false; });

// Collision helpers
function rectCollision(bx, by, br, rx, ry, rw, rh) {
const closestX = Math.max(rx, Math.min(bx, rx + rw));
const closestY = Math.max(ry, Math.min(by, ry + rh));
const dx = bx - closestX;
const dy = by - closestY;
return dx * dx + dy * dy < br * br;
}

// Update
function update() {
if (state !== STATE.PLAYING) return;

// Paddle movement
paddle.dx = 0;
if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.dx = -paddle.speed;
if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.dx = paddle.speed;
paddle.x += paddle.dx;
paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

// Update balls
for (let bi = balls.length - 1; bi >= 0; bi--) {
const ball = balls[bi];

if (ball.stuck) {
ball.x = paddle.x + paddle.w / 2;
ball.y = paddle.y - ball.r;
continue;
}

// Trail
trail.push({ x: ball.x, y: ball.y, life: 1 });
if (trail.length > 12) trail.shift();

ball.x += ball.dx;
ball.y += ball.dy;

// Wall collisions
if (ball.x - ball.r < 0) {
ball.x = ball.r;
ball.dx = Math.abs(ball.dx);
playHitWall();
}
if (ball.x + ball.r > W) {
ball.x = W - ball.r;
ball.dx = -Math.abs(ball.dx);
playHitWall();
}
if (ball.y - ball.r < 0) {
ball.y = ball.r;
ball.dy = Math.abs(ball.dy);
playHitWall();
}

// Bottom - lose ball
if (ball.y + ball.r > H + 20) {
balls.splice(bi, 1);
if (balls.length === 0) {
lives--;
playLoseLife();
if (lives <= 0) {
if (score > highScore) {
highScore = score;
localStorage.setItem('arkanoid_high', highScore.toString());
}
state = STATE.GAMEOVER;
playGameOver();
} else {
resetBall();
}
}
continue;
}

// Paddle collision
if (ball.dy > 0 && rectCollision(ball.x, ball.y, ball.r, paddle.x, paddle.y, paddle.w, paddle.h)) {
const hitPos = (ball.x - paddle.x) / paddle.w; // 0 to 1
const angle = (hitPos - 0.5) * Math.PI * 0.7; // -70 to 70 degrees
const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
const newSpeed = Math.min(speed * 1.002, 12); // slight acceleration, cap
ball.dx = newSpeed * Math.sin(angle);
ball.dy = -newSpeed * Math.cos(angle);
ball.y = paddle.y - ball.r;
playHitPaddle();
spawnParticles(ball.x, ball.y, '#00ffcc', 5);
}

// Brick collisions
for (let r = 0; r < BRICK_ROWS; r++) {
for (let c = 0; c < BRICK_COLS; c++) {
const brick = bricks[r][c];
if (!brick.alive) continue;

if (rectCollision(ball.x, ball.y, ball.r, brick.x, brick.y, brick.w, brick.h)) {
if (!ball.fire) {
// Determine collision side
const overlapLeft = (ball.x + ball.r) - brick.x;
const overlapRight = (brick.x + brick.w) - (ball.x - ball.r);
const overlapTop = (ball.y + ball.r) - brick.y;
const overlapBottom = (brick.y + brick.h) - (ball.y - ball.r);

const minOverlapX = Math.min(overlapLeft, overlapRight);
const minOverlapY = Math.min(overlapTop, overlapBottom);

if (minOverlapX < minOverlapY) {
ball.dx = -ball.dx;
} else {
ball.dy = -ball.dy;
}
}

brick.hp--;
if (brick.hp <= 0) {
brick.alive = false;
score += brick.points;
spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 12);
spawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
playHitBrick(300 + (BRICK_ROWS - r) * 50);
} else {
playHitBrick(200 + Math.random() * 200);
spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 5);
}
}
}
}
}

// Update powerups
for (let i = powerups.length - 1; i >= 0; i--) {
const p = powerups[i];
p.y += p.dy;
if (p.y > H) { powerups.splice(i, 1); continue; }
if (rectCollision(paddle.x + paddle.w / 2, paddle.y, 5, p.x - p.w / 2, p.y - p.h / 2, p.w, p.h)) {
applyPowerup(p.type);
spawnParticles(p.x, p.y, POWERUP_COLORS[p.type], 10);
powerups.splice(i, 1);
}
}

// Update particles
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.dx;
p.y += p.dy;
p.dy += 0.1;
p.life -= p.decay;
if (p.life <= 0) particles.splice(i, 1);
}

// Update trail
for (let i = trail.length - 1; i >= 0; i--) {
trail[i].life -= 0.1;
if (trail[i].life <= 0) trail.splice(i, 1);
}

// Check win
let allDestroyed = true;
for (let r = 0; r < BRICK_ROWS; r++) {
for (let c = 0; c < BRICK_COLS; c++) {
if (bricks[r][c].alive) { allDestroyed = false; break; }
}
if (!allDestroyed) break;
}
if (allDestroyed) {
playLevelUp();
nextLevel();
}
}

// Draw
function draw() {
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);

// Draw bricks
for (let r = 0; r < BRICK_ROWS; r++) {
for (let c = 0; c < BRICK_COLS; c++) {
const b = bricks[r][c];
if (!b.alive) continue;

ctx.fillStyle = b.color;
ctx.fillRect(b.x, b.y, b.w, b.h);

// Highlight
ctx.fillStyle = b.colorLight;
ctx.fillRect(b.x, b.y, b.w, b.h / 3);

// Border
ctx.strokeStyle = 'rgba(0,0,0,0.3)';
ctx.strokeRect(b.x, b.y, b.w, b.h);

// Crack overlay for damaged bricks
if (b.hp < b.maxHp) {
ctx.fillStyle = 'rgba(0,0,0,0.3)';
ctx.fillRect(b.x, b.y + b.h * 0.4, b.w, b.h * 0.6);
}
}
}

// Draw trail
trail.forEach(t => {
ctx.fillStyle = `rgba(0, 255, 200, ${t.life * 0.3})`;
ctx.beginPath();
ctx.arc(t.x, t.y, 4 * t.life, 0, Math.PI * 2);
ctx.fill();
});

// Draw balls
balls.forEach(ball => {
// Glow
const gradient = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 3);
if (ball.fire) {
gradient.addColorStop(0, 'rgba(255, 100, 0, 0.4)');
gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');
} else {
gradient.addColorStop(0, 'rgba(0, 255, 200, 0.3)');
gradient.addColorStop(1, 'rgba(0, 255, 200, 0)');
}
ctx.fillStyle = gradient;
ctx.beginPath();
ctx.arc(ball.x, ball.y, ball.r * 3, 0, Math.PI * 2);
ctx.fill();

// Ball
ctx.fillStyle = ball.fire ? '#ff6600' : '#ffffff';
ctx.beginPath();
ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = ball.fire ? '#ffaa00' : '#00ffcc';
ctx.beginPath();
ctx.arc(ball.x - 2, ball.y - 2, ball.r * 0.4, 0, Math.PI * 2);
ctx.fill();
});

// Draw paddle
const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
paddleGrad.addColorStop(0, '#00ffcc');
paddleGrad.addColorStop(1, '#008866');
ctx.fillStyle = paddleGrad;
ctx.beginPath();
ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
ctx.fill();

// Paddle glow
ctx.shadowColor = '#00ffcc';
ctx.shadowBlur = 10;
ctx.fillStyle = 'transparent';
ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
ctx.shadowBlur = 0;

// Draw powerups
powerups.forEach(p => {
ctx.fillStyle = POWERUP_COLORS[p.type];
ctx.beginPath();
ctx.roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 4);
ctx.fill();
ctx.fillStyle = '#000';
ctx.font = 'bold 11px Courier New';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(POWERUP_LABELS[p.type], p.x, p.y);
});

// Draw particles
particles.forEach(p => {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
});
ctx.globalAlpha = 1;

// HUD
ctx.fillStyle = '#ffffff';
ctx.font = '18px Courier New';
ctx.textAlign = 'left';
ctx.fillText(`SCORE: ${score}`, 15, 30);
ctx.textAlign = 'center';
ctx.fillText(`LEVEL ${level}`, W / 2, 30);
ctx.textAlign = 'right';
ctx.fillText(`HIGH: ${highScore}`, W - 15, 30);

// Lives
ctx.textAlign = 'left';
for (let i = 0; i < lives; i++) {
ctx.fillStyle = '#ff4466';
ctx.beginPath();
const lx = 15 + i * 22;
const ly = 50;
ctx.moveTo(lx, ly + 4);
ctx.bezierCurveTo(lx, ly, lx - 8, ly, lx - 8, ly + 4);
ctx.bezierCurveTo(lx - 8, ly + 10, lx, ly + 14, lx, ly + 16);
ctx.bezierCurveTo(lx, ly + 14, lx + 8, ly + 10, lx + 8, ly + 4);
ctx.bezierCurveTo(lx + 8, ly, lx, ly, lx, ly + 4);
ctx.fill();
}

// Messages
if (state === STATE.MENU) {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);

ctx.fillStyle = '#00ffcc';
ctx.font = 'bold 48px Courier New';
ctx.textAlign = 'center';
ctx.fillText('ARKANOID', W / 2, H / 2 - 80);

ctx.fillStyle = '#ffffff';
ctx.font = '20px Courier New';
ctx.fillText('Arrow Keys / A,D - Move Paddle', W / 2, H / 2 - 10);
ctx.fillText('Space / Enter - Launch Ball', W / 2, H / 2 + 25);
ctx.fillText('P / Esc - Pause', W / 2, H / 2 + 60);

ctx.fillStyle = '#ffcc00';
ctx.font = '22px Courier New';
ctx.fillText('Press Enter or Space to Start', W / 2, H / 2 + 120);

if (highScore > 0) {
ctx.fillStyle = '#888';
ctx.font = '16px Courier New';
ctx.fillText(`High Score: ${highScore}`, W / 2, H / 2 + 160);
}
}

if (state === STATE.PAUSED) {
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#ffcc00';
ctx.font = 'bold 36px Courier New';
ctx.textAlign = 'center';
ctx.fillText('PAUSED', W / 2, H / 2);
ctx.fillStyle = '#aaa';
ctx.font = '18px Courier New';
ctx.fillText('Press P or Esc to Resume', W / 2, H / 2 + 40);
}

if (state === STATE.GAMEOVER) {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#ff4444';
ctx.font = 'bold 48px Courier New';
ctx.textAlign = 'center';
ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
ctx.fillStyle = '#ffffff';
ctx.font = '22px Courier New';
ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 10);
if (score >= highScore && score > 0) {
ctx.fillStyle = '#ffcc00';
ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 45);
}
ctx.fillStyle = '#aaa';
ctx.font = '18px Courier New';
ctx.fillText('Press Enter or Space for Menu', W / 2, H / 2 + 90);
}

if (state === STATE.WIN) {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#00ffcc';
ctx.font = 'bold 48px Courier New';
ctx.textAlign = 'center';
ctx.fillText('YOU WIN!', W / 2, H / 2);
ctx.fillStyle = '#ffffff';
ctx.font = '22px Courier New';
ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 40);
}

if (state === STATE.LEVEL_TRANS) {
ctx.fillStyle = 'rgba(0,0,0,0.5)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#00ffcc';
ctx.font = 'bold 40px Courier New';
ctx.textAlign = 'center';
ctx.fillText(`LEVEL ${level}`, W / 2, H / 2);
}
}

// Game loop
function loop() {
update();
draw();
requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
