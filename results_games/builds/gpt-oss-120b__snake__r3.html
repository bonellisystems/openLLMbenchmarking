<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body,html{margin:0;padding:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Arial,Helvetica,sans-serif}
  #game{border:2px solid #555;background:#000}
  #score{position:absolute;top:10px;left:10px;font-size:18px}
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<div id="score">Score: 0</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  let snake = [{x:10, y:10}];
  let velocity = {x:0, y:0};
  let food = {x:0, y:0};
  let score = 0;
  let gameOver = false;
  const scoreDiv = document.getElementById('score');

  function randomFood() {
    food.x = Math.floor(Math.random()*tileCount);
    food.y = Math.floor(Math.random()*tileCount);
    // ensure food not on snake
    for (let part of snake) {
      if (part.x===food.x && part.y===food.y) return randomFood();
    }
  }

  function draw() {
    // background
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // snake
    ctx.fillStyle = '#0f0';
    for (let part of snake) {
      ctx.fillRect(part.x*gridSize, part.y*gridSize, gridSize-1, gridSize-1);
    }
    // food
    ctx.fillStyle = '#f00';
    ctx.fillRect(food.x*gridSize, food.y*gridSize, gridSize-1, gridSize-1);
  }

  function update() {
    if (gameOver) return;
    // move snake
    const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

    // wall collision
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
      endGame();
      return;
    }

    // self collision
    for (let part of snake) {
      if (part.x===head.x && part.y===head.y) {
        endGame();
        return;
      }
    }

    snake.unshift(head);

    // eat food
    if (head.x===food.x && head.y===food.y) {
      score++;
      scoreDiv.textContent = 'Score: '+score;
      randomFood();
    } else {
      snake.pop();
    }
  }

  function loop() {
    update();
    draw();
    if (!gameOver) requestAnimationFrame(loop);
  }

  function endGame() {
    gameOver = true;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
  }

  function keyHandler(e) {
    switch(e.key) {
      case 'ArrowUp':
        if (velocity.y===1) break;
        velocity = {x:0, y:-1};
        break;
      case 'ArrowDown':
        if (velocity.y===-1) break;
        velocity = {x:0, y:1};
        break;
      case 'ArrowLeft':
        if (velocity.x===1) break;
        velocity = {x:-1, y:0};
        break;
      case 'ArrowRight':
        if (velocity.x===-1) break;
        velocity = {x:1, y:0};
        break;
    }
    e.preventDefault();
  }

  // init
  randomFood();
  document.addEventListener('keydown', keyHandler);
  // start moving after first direction
  setTimeout(() => {
    if (velocity.x===0 && velocity.y===0) velocity = {x:1, y:0};
    requestAnimationFrame(loop);
  }, 100);
})();
</script>
</body>
</html>
