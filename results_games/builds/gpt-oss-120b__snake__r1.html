<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    color:#fff;
    font-family:sans-serif;
    user-select:none;
}
canvas{
    background:#000;
    display:block;
}
#score{
    position:absolute;
    top:10px;
    left:10px;
    font-size:20px;
}
</style>
</head>
<body tabindex="0">
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="400"></canvas>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const cols = 20, rows = 20;
    const cellSize = canvas.width / cols;
    let snake = [{x:10,y:10}];
    let dir = {x:0,y:0};
    let food = randomFood();
    let score = 0;
    let speed = 150;
    let gameInterval;

    function randomFood(){
        let f;
        do{
            f = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
        }while(snake.some(s=>s.x===f.x && s.y===f.y));
        return f;
    }
    function drawCell(x,y,color){
        ctx.fillStyle = color;
        ctx.fillRect(x*cellSize, y*cellSize, cellSize-1, cellSize-1);
    }
    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        drawCell(food.x, food.y, 'red');
        snake.forEach((seg,i)=>drawCell(seg.x, seg.y, i===0?'lime':'green'));
    }
    function update(){
        if(dir.x===0 && dir.y===0) return;
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
        if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){
            gameOver(); return;
        }
        if(snake.some(s=>s.x===head.x && s.y===head.y)){
            gameOver(); return;
        }
        snake.unshift(head);
        if(head.x===food.x && head.y===food.y){
            score++;
            document.getElementById('score').textContent='Score: '+score;
            food = randomFood();
            if(speed>50) speed-=5;
            clearInterval(gameInterval);
            gameInterval = setInterval(loop, speed);
        }else{
            snake.pop();
        }
    }
    function loop(){
        update();
        draw();
    }
    function gameOver(){
        alert('Game Over! Score: '+score);
        snake = [{x:10,y:10}];
        dir = {x:0,y:0};
        food = randomFood();
        score = 0;
        document.getElementById('score').textContent='Score: 0';
        speed = 150;
        clearInterval(gameInterval);
        gameInterval = setInterval(loop, speed);
    }
    document.addEventListener('keydown', e=>{
        switch(e.key){
            case 'ArrowUp':    if(dir.y!==1) dir={x:0,y:-1}; break;
            case 'ArrowDown':  if(dir.y!==-1) dir={x:0,y:1}; break;
            case 'ArrowLeft':  if(dir.x!==1) dir={x:-1,y:0}; break;
            case 'ArrowRight': if(dir.x!==-1) dir={x:1,y:0}; break;
        }
    });
    window.addEventListener('load',()=>{
        document.body.focus();
        gameInterval = setInterval(loop, speed);
    });
})();
</script>
</body>
</html>
