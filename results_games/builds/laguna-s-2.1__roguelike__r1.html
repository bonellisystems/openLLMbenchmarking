<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; overflow: hidden; background: #000; }
#game { font-family: monospace; font-size: 16px; line-height: 1; }
</style>
</head>
<body>
<pre id="game"></pre>
<script>
const SIZE = 80;
const MAP_W = 80;
const MAP_H = 40;
const MAX_ROOMS = 15;
const ROOM_MIN = 5;
const ROOM_MAX = 12;

let map = [];
let player = {x:0, y:0};
let stairs = {x:0, y:0};
let level = 1;
let gameOver = false;

function initMap() {
    map = [];
    for (let y = 0; y < MAP_H; y++) {
        let row = [];
        for (let x = 0; x < MAP_W; x++) {
            row.push('#');
        }
        map.push(row);
    }
}

function createRoom(x, y, w, h) {
    for (let dy = 0; dy < h; dy++) {
        for (let dx = 0; dx < w; dx++) {
            if (x+dx > 0 && x+dx < MAP_W-1 && y+dy > 0 && y+dy < MAP_H-1) {
                map[y+dy][x+dx] = '.';
            }
        }
    }
}

function canPlaceRoom(x, y, w, h) {
    if (x < 1 || y < 1 || x+w >= MAP_W-1 || y+h >= MAP_H-1) return false;
    for (let dy = -1; dy <= h; dy++) {
        for (let dx = -1; dx <= w; dx++) {
            if (map[y+dy] && map[y+dy][x+dx] !== '#') return false;
        }
    }
    return true;
}

function placeRooms() {
    let rooms = [];
    for (let i = 0; i < MAX_ROOMS; i++) {
        let w = ROOM_MIN + Math.floor(Math.random() * (ROOM_MAX - ROOM_MIN));
        let h = ROOM_MIN + Math.floor(Math.random() * (ROOM_MAX - ROOM_MIN));
        let x = Math.floor(Math.random() * (MAP_W - w - 2)) + 1;
        let y = Math.floor(Math.random() * (MAP_H - h - 2)) + 1;
        
        if (canPlaceRoom(x, y, w, h)) {
            createRoom(x, y, w, h);
            rooms.push({x: x + Math.floor(w/2), y: y + Math.floor(h/2)});
        }
    }
    
    // Connect rooms with corridors
    for (let i = 0; i < rooms.length - 1; i++) {
        let x1 = rooms[i].x, y1 = rooms[i].y;
        let x2 = rooms[i+1].x, y2 = rooms[i+1].y;
        
        // Horizontal then vertical
        if (Math.random() < 0.5) {
            for (let x = Math.min(x1,x2); x <= Math.max(x1,x2); x++) map[y1][x] = '.';
            for (let y = Math.min(y1,y2); y <= Math.max(y1,y2); y++) map[y][x2] = '.';
        } else {
            for (let y = Math.min(y1,y2); y <= Math.max(y1,y2); y++) map[y][x1] = '.';
            for (let x = Math.min(x1,x2); x <= Math.max(x1,x2); x++) map[y2][x] = '.';
        }
    }
    
    return rooms;
}

function placeEntities(rooms) {
    if (rooms.length > 0) {
        player.x = rooms[0].x;
        player.y = rooms[0].y;
        stairs.x = rooms[rooms.length-1].x;
        stairs.y = rooms[rooms.length-1].y;
    }
}

function generateLevel() {
    initMap();
    let rooms = placeRooms();
    placeEntities(rooms);
}

function render() {
    let output = '';
    for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
            if (x === player.x && y === player.y) {
                output += '@';
            } else if (x === stairs.x && y === stairs.y) {
                output += '>';
            } else {
                output += map[y][x];
            }
        }
        output += '\n';
    }
    output += `Level: ${level}  Use arrow keys or WASD to move. Reach > to descend.`;
    document.getElementById('game').textContent = output;
}

function move(dx, dy) {
    if (gameOver) return;
    let nx = player.x + dx;
    let ny = player.y + dy;
    if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H && map[ny][nx] === '.') {
        player.x = nx;
        player.y = ny;
        if (player.x === stairs.x && player.y === stairs.y) {
            level++;
            generateLevel();
        }
    }
    render();
}

document.addEventListener('keydown', function(e) {
    switch(e.key) {
        case 'ArrowUp': case 'w': case 'W': e.preventDefault(); move(0, -1); break;
        case 'ArrowDown': case 's': case 'S': e.preventDefault(); move(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move(1, 0); break;
    }
});

generateLevel();
render();
</script>
</body>
</html>
