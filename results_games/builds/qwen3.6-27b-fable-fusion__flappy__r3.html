<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Arial', sans-serif;
}
canvas {
border: 2px solid #333;
display: block;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 400;
canvas.height = 600;

const GRAVITY = 0.5;
const FLAP_STRENGTH = -8;
const PIPE_SPEED = 3;
const PIPE_GAP = 150;
const PIPE_WIDTH = 60;
const PIPE_SPAWN_INTERVAL = 100;
const BIRD_SIZE = 20;
const GROUND_HEIGHT = 80;

let bird, pipes, score, gameState, frameCount, groundOffset;

function init() {
bird = {
x: 80,
y: canvas.height / 2,
velocity: 0,
rotation: 0
};
pipes = [];
score = 0;
gameState = 'start';
frameCount = 0;
groundOffset = 0;
}

function flap() {
if (gameState === 'start') {
gameState = 'playing';
bird.velocity = FLAP_STRENGTH;
} else if (gameState === 'playing') {
bird.velocity = FLAP_STRENGTH;
} else if (gameState === 'gameover') {
init();
}
}

document.addEventListener('keydown', (e) => {
if (e.code === 'Space' || e.code === 'ArrowUp') {
e.preventDefault();
flap();
}
});

canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', (e) => {
e.preventDefault();
flap();
});

function spawnPipe() {
const minY = 80;
const maxY = canvas.height - GROUND_HEIGHT - PIPE_GAP - 80;
const topHeight = Math.random() * (maxY - minY) + minY;
pipes.push({
x: canvas.width,
topHeight: topHeight,
scored: false
});
}

function update() {
frameCount++;

if (gameState === 'playing') {
bird.velocity += GRAVITY;
bird.y += bird.velocity;

bird.rotation = Math.min(Math.max(bird.velocity * 3, -30), 70);

if (frameCount % PIPE_SPAWN_INTERVAL === 0) {
spawnPipe();
}

for (let i = pipes.length - 1; i >= 0; i--) {
pipes[i].x -= PIPE_SPEED;

if (!pipes[i].scored && pipes[i].x + PIPE_WIDTH < bird.x) {
pipes[i].scored = true;
score++;
}

if (pipes[i].x + PIPE_WIDTH < 0) {
pipes.splice(i, 1);
}
}

groundOffset = (groundOffset + PIPE_SPEED) % 24;

if (bird.y + BIRD_SIZE > canvas.height - GROUND_HEIGHT || bird.y - BIRD_SIZE < 0) {
gameState = 'gameover';
}

for (const pipe of pipes) {
if (bird.x + BIRD_SIZE > pipe.x && bird.x - BIRD_SIZE < pipe.x + PIPE_WIDTH) {
if (bird.y - BIRD_SIZE < pipe.topHeight || bird.y + BIRD_SIZE > pipe.topHeight + PIPE_GAP) {
gameState = 'gameover';
}
}
}
} else if (gameState === 'start') {
bird.y = canvas.height / 2 + Math.sin(frameCount * 0.05) * 10;
groundOffset = (groundOffset + PIPE_SPEED) % 24;
}
}

function drawBackground() {
const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height - GROUND_HEIGHT);
gradient.addColorStop(0, '#4EC0CA');
gradient.addColorStop(1, '#87CEEB');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, canvas.width, canvas.height - GROUND_HEIGHT);

ctx.fillStyle = '#E8F5E9';
for (let i = 0; i < 5; i++) {
const cloudX = ((i * 120 + frameCount * 0.3) % (canvas.width + 100)) - 50;
const cloudY = 60 + i * 30;
ctx.beginPath();
ctx.arc(cloudX, cloudY, 20, 0, Math.PI * 2);
ctx.arc(cloudX + 25, cloudY - 5, 25, 0, Math.PI * 2);
ctx.arc(cloudX + 50, cloudY, 20, 0, Math.PI * 2);
ctx.fill();
}
}

function drawGround() {
const groundY = canvas.height - GROUND_HEIGHT;

ctx.fillStyle = '#DEB887';
ctx.fillRect(0, groundY, canvas.width, GROUND_HEIGHT);

ctx.fillStyle = '#8B4513';
ctx.fillRect(0, groundY, canvas.width, 4);

ctx.fillStyle = '#90EE90';
ctx.fillRect(0, groundY, canvas.width, 15);

ctx.strokeStyle = '#228B22';
ctx.lineWidth = 2;
for (let x = -groundOffset; x < canvas.width; x += 24) {
ctx.beginPath();
ctx.moveTo(x, groundY + 15);
ctx.lineTo(x + 12, groundY + 25);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(x + 12, groundY + 15);
ctx.lineTo(x, groundY + 25);
ctx.stroke();
}
}

function drawPipe(pipe) {
const capHeight = 25;
const capOverhang = 5;

ctx.fillStyle = '#2ECC40';
ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);
ctx.fillRect(pipe.x, pipe.topHeight + PIPE_GAP, PIPE_WIDTH, canvas.height - GROUND_HEIGHT - pipe.topHeight - PIPE_GAP);

ctx.fillStyle = '#01FF70';
ctx.fillRect(pipe.x + 3, 0, 8, pipe.topHeight);
ctx.fillRect(pipe.x + 3, pipe.topHeight + PIPE_GAP, 8, canvas.height - GROUND_HEIGHT - pipe.topHeight - PIPE_GAP);

ctx.fillStyle = '#006400';
ctx.fillRect(pipe.x + PIPE_WIDTH - 8, 0, 5, pipe.topHeight);
ctx.fillRect(pipe.x + PIPE_WIDTH - 8, pipe.topHeight + PIPE_GAP, 5, canvas.height - GROUND_HEIGHT - pipe.topHeight - PIPE_GAP);

ctx.fillStyle = '#2ECC40';
ctx.fillRect(pipe.x - capOverhang, pipe.topHeight - capHeight, PIPE_WIDTH + capOverhang * 2, capHeight);
ctx.fillRect(pipe.x - capOverhang, pipe.topHeight + PIPE_GAP, PIPE_WIDTH + capOverhang * 2, capHeight);

ctx.fillStyle = '#01FF70';
ctx.fillRect(pipe.x - capOverhang + 2, pipe.topHeight - capHeight + 2, 6, capHeight - 4);
ctx.fillRect(pipe.x - capOverhang + 2, pipe.topHeight + PIPE_GAP + 2, 6, capHeight - 4);

ctx.fillStyle = '#006400';
ctx.fillRect(pipe.x + PIPE_WIDTH + capOverhang - 7, pipe.topHeight - capHeight + 2, 5, capHeight - 4);
ctx.fillRect(pipe.x + PIPE_WIDTH + capOverhang - 7, pipe.topHeight + PIPE_GAP + 2, 5, capHeight - 4);

ctx.strokeStyle = '#004D00';
ctx.lineWidth = 2;
ctx.strokeRect(pipe.x - capOverhang, pipe.topHeight - capHeight, PIPE_WIDTH + capOverhang * 2, capHeight);
ctx.strokeRect(pipe.x - capOverhang, pipe.topHeight + PIPE_GAP, PIPE_WIDTH + capOverhang * 2, capHeight);
}

function drawBird() {
ctx.save();
ctx.translate(bird.x, bird.y);
ctx.rotate(bird.rotation * Math.PI / 180);

ctx.fillStyle = '#FFD700';
ctx.beginPath();
ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FFA500';
ctx.beginPath();
ctx.ellipse(0, 4, BIRD_SIZE * 0.7, BIRD_SIZE * 0.5, 0, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FFFFFF';
ctx.beginPath();
ctx.arc(6, -6, 6, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#000000';
ctx.beginPath();
ctx.arc(8, -6, 3, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FF4500';
ctx.beginPath();
ctx.moveTo(12, 0);
ctx.lineTo(22, -3);
ctx.lineTo(22, 3);
ctx.closePath();
ctx.fill();

ctx.fillStyle = '#FFD700';
ctx.beginPath();
ctx.moveTo(-10, -8);
ctx.lineTo(-18, -14);
ctx.lineTo(-6, -6);
ctx.closePath();
ctx.fill();

ctx.strokeStyle = '#B8860B';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
ctx.stroke();

ctx.restore();
}

function drawScore() {
ctx.fillStyle = '#FFFFFF';
ctx.strokeStyle = '#000000';
ctx.lineWidth = 4;
ctx.font = 'bold 48px Arial';
ctx.textAlign = 'center';
ctx.strokeText(score, canvas.width / 2, 60);
ctx.fillText(score, canvas.width / 2, 60);
}

function drawStartScreen() {
ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#FFFFFF';
ctx.strokeStyle = '#000000';
ctx.lineWidth = 4;
ctx.font = 'bold 42px Arial';
ctx.textAlign = 'center';
ctx.strokeText('FLAPPY BIRD', canvas.width / 2, canvas.height / 2 - 60);
ctx.fillText('FLAPPY BIRD', canvas.width / 2, canvas.height / 2 - 60);

ctx.font = 'bold 22px Arial';
ctx.lineWidth = 3;
ctx.strokeText('Press SPACE or UP to flap', canvas.width / 2, canvas.height / 2 + 10);
ctx.fillText('Press SPACE or UP to flap', canvas.width / 2, canvas.height / 2 + 10);

ctx.font = '18px Arial';
ctx.lineWidth = 2;
ctx.strokeText('Click or tap also works!', canvas.width / 2, canvas.height / 2 + 45);
ctx.fillText('Click or tap also works!', canvas.width / 2, canvas.height / 2 + 45);
}

function drawGameOver() {
ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#FF4500';
ctx.strokeStyle = '#000000';
ctx.lineWidth = 4;
ctx.font = 'bold 48px Arial';
ctx.textAlign = 'center';
ctx.strokeText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);
ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);

ctx.fillStyle = '#FFFFFF';
ctx.font = 'bold 32px Arial';
ctx.lineWidth = 3;
ctx.strokeText('Score: ' + score, canvas.width / 2, canvas.height / 2);
ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2);

ctx.font = 'bold 20px Arial';
ctx.lineWidth = 2;
ctx.strokeText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 50);
ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 50);
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

drawBackground();

for (const pipe of pipes) {
drawPipe(pipe);
}

drawGround();
drawBird();
drawScore();

if (gameState === 'start') {
drawStartScreen();
} else if (gameState === 'gameover') {
drawGameOver();
}
}

function gameLoop() {
update();
draw();
requestAnimationFrame(gameLoop);
}

init();
gameLoop();
</script>
</body>
</html>
