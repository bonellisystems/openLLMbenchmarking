<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  color: #fff;
  user-select: none;
}
#wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#info {
  display: flex;
  justify-content: space-between;
  width: 400px;
  font-size: 18px;
}
#info span { font-weight: bold; }
canvas {
  border: 2px solid #444;
  background: #0a0a0a;
  display: block;
}
#msg {
  font-size: 16px;
  color: #888;
  height: 20px;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="info">
    <span>Score: <span id="score">0</span></span>
    <span>Best: <span id="best">0</span></span>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="msg">Press any arrow key or WASD to start</div>
</div>
<script>
var C = document.getElementById('c');
var X = C.getContext('2d');
var W = 20, N = 20;
var snake, dir, next, food, score, best = 0, dead, started, loop;

function reset() {
  var i = 5;
  snake = [];
  while (i--) snake.push({ x: 3 + i, y: 10 });
  dir = { x: 1, y: 0 };
  next = { x: 1, y: 0 };
  score = 0;
  dead = false;
  started = false;
  place();
  document.getElementById('score').textContent = 0;
  document.getElementById('msg').textContent = 'Press any arrow key or WASD to start';
}

function place() {
  var i, x, y, ok;
  do {
    x = Math.floor(Math.random() * N);
    y = Math.floor(Math.random() * N);
    ok = true;
    for (i = 0; i < snake.length; i++)
      if (snake[i].x === x && snake[i].y === y) { ok = false; break; }
  } while (!ok);
  food = { x: x, y: y };
}

function tick() {
  if (dead) return;
  dir = next;
  var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (h.x < 0 || h.x >= N || h.y < 0 || h.y >= N) { die(); return; }
  var i;
  for (i = 0; i < snake.length - 1; i++)
    if (snake[i].x === h.x && snake[i].y === h.y) { die(); return; }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    place();
  } else {
    snake.pop();
  }
}

function die() {
  dead = true;
  if (score > best) { best = score; document.getElementById('best').textContent = best; }
  document.getElementById('msg').textContent = 'Press any arrow key or WASD to restart';
}

function draw() {
  X.fillStyle = '#0a0a0a';
  X.fillRect(0, 0, 400, 400);
  var i, s;
  for (i = 0; i < snake.length; i++) {
    s = snake[i];
    X.fillStyle = i === 0 ? '#0f0' : '#0a0';
    X.fillRect(s.x * W + 1, s.y * W + 1, W - 2, W - 2);
  }
  X.fillStyle = '#f44';
  X.fillRect(food.x * W + 2, food.y * W + 2, W - 4, W - 4);
}

function loopFn() {
  tick();
  draw();
}

document.addEventListener('keydown', function(e) {
  var k = e.key;
  if (dead) { reset(); started = true; loop = setInterval(loopFn, 100); return; }
  if (!started) { started = true; loop = setInterval(loopFn, 100); }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { if (dir.y !== 1) next = { x: 0, y: -1 }; e.preventDefault(); }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { if (dir.y !== -1) next = { x: 0, y: 1 }; e.preventDefault(); }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (dir.x !== 1) next = { x: -1, y: 0 }; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (dir.x !== -1) next = { x: 1, y: 0 }; e.preventDefault(); }
});

reset();
draw();
</script>
</body>
</html>
