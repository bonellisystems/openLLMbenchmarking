<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }
    canvas {
        display: block;
        background-color: #70c5ce;
        border: 2px solid #000;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="320" height="480"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let frames = 0;
    const state = {
        current: 0,
        getReady: 0,
        game: 1,
        over: 2
    };

    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            switch (state.current) {
                case state.getReady:
                    state.current = state.game;
                    break;
                case state.game:
                    bird.flap();
                    break;
                case state.over:
                    resetGame();
                    state.current = state.getReady;
                    break;
            }
            e.preventDefault();
        }
    });

    const bird = {
        x: 50,
        y: 150,
        w: 34,
        h: 24,
        radius: 12,
        speed: 0,
        gravity: 0.25,
        jump: 4.6,
        rotation: 0,

        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
            ctx.fillStyle = "#FFF";
            ctx.fillRect(6, -8, 8, 8);
            ctx.fillStyle = "#000";
            ctx.fillRect(10, -6, 2, 2);
            ctx.fillStyle = "#FFA500";
            ctx.fillRect(8, 2, 10, 6);
            ctx.restore();
        },

        flap: function() {
            this.speed = -this.jump;
        },

        update: function() {
            this.speed += this.gravity;
            this.y += this.speed;

            if (this.y + this.h / 2 >= canvas.height - fg.h) {
                this.y = canvas.height - fg.h - this.h / 2;
                state.current = state.over;
            }

            if (this.y - this.h / 2 <= 0) {
                this.y = this.h / 2;
                this.speed = 0;
            }

            if (this.speed < 0) {
                this.rotation = -25 * Math.PI / 180;
            } else {
                this.rotation += 2 * Math.PI / 180;
                if (this.rotation > 90 * Math.PI / 180) {
                    this.rotation = 90 * Math.PI / 180;
                }
            }
        }
    };

    const bg = {
        draw: function() {
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#FFF";
            ctx.beginPath();
            ctx.arc(50, 50, 20, 0, Math.PI * 2);
            ctx.arc(70, 60, 25, 0, Math.PI * 2);
            ctx.arc(90, 50, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(200, 100, 30, 0, Math.PI * 2);
            ctx.arc(230, 110, 35, 0, Math.PI * 2);
            ctx.arc(260, 100, 30, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    const fg = {
        h: 112,
        x: 0,
        dx: 2,
        draw: function() {
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
            ctx.fillStyle = "#73bf2e";
            ctx.fillRect(0, canvas.height - this.h, canvas.width, 15);
            ctx.strokeStyle = "#cbb968";
            ctx.beginPath();
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.moveTo(i + this.x % 20, canvas.height - this.h);
                ctx.lineTo(i + this.x % 20 - 10, canvas.height - this.h + 15);
            }
            ctx.stroke();
        },
        update: function() {
            if (state.current == state.game) {
                this.x = (this.x + this.dx) % 20;
            }
        }
    };

    const pipes = {
        position: [],
        w: 52,
        h: 400,
        gap: 100,
        dx: 2,

        draw: function() {
            for (let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                let topY = p.y;
                let bottomY = p.y + this.h + this.gap;

                ctx.fillStyle = "#73bf2e";

                ctx.fillRect(p.x, topY, this.w, this.h);
                ctx.strokeStyle = "#558c22";
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, topY, this.w, this.h);

                ctx.fillRect(p.x, bottomY, this.w, this.h);
                ctx.strokeRect(p.x, bottomY, this.w, this.h);
            }
        },

        update: function() {
            if (state.current != state.game) return;

            if (frames % 100 == 0) {
                this.position.push({
                    x: canvas.width,
                    y: -150 * (Math.random() + 1),
                    passed: false
                });
            }

            for (let i = 0; i < this.position.length; i++) {
                let p = this.position[i];
                p.x -= this.dx;

                let bottomPipeY = p.y + this.h + this.gap;

                if (bird.x + bird.w / 2 > p.x && bird.x - bird.w / 2 < p.x + this.w) {
                    if (bird.y - bird.h / 2 < p.y + this.h || bird.y + bird.h / 2 > bottomPipeY) {
                        state.current = state.over;
                    }
                }

                if (p.x + this.w < bird.x && !p.passed) {
                    score.value++;
                    p.passed = true;
                }

                if (p.x + this.w <= 0) {
                    this.position.shift();
                    i--;
                }
            }
        },

        reset: function() {
            this.position = [];
        }
    };

    const score = {
        value: 0,
        draw: function() {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.font = "35px Arial";
            ctx.fillText(this.value, canvas.width / 2 - 10, 50);
            ctx.strokeText(this.value, canvas.width / 2 - 10, 50);
        }
    };

    function drawUI() {
        if (state.current == state.getReady) {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.font = "30px Arial";
            ctx.fillText("Get Ready!", canvas.width / 2 - 60, 200);
            ctx.strokeText("Get Ready!", canvas.width / 2 - 60, 200);
            ctx.font = "20px Arial";
            ctx.fillText("Press Space", canvas.width / 2 - 50, 240);
            ctx.strokeText("Press Space", canvas.width / 2 - 50, 240);
        }
        if (state.current == state.over) {
            ctx.fillStyle = "#FFF";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.font = "35px Arial";
            ctx.fillText("Game Over", canvas.width / 2 - 70, 200);
            ctx.strokeText("Game Over", canvas.width / 2 - 70, 200);
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score.value, canvas.width / 2 - 50, 240);
            ctx.strokeText("Score: " + score.value, canvas.width / 2 - 50, 240);
            ctx.fillText("Press Space", canvas.width / 2 - 50, 280);
            ctx.strokeText("Press Space", canvas.width / 2 - 50, 280);
        }
    }

    function resetGame() {
        bird.speed = 0;
        bird.y = 150;
        bird.rotation = 0;
        pipes.reset();
        score.value = 0;
        frames = 0;
    }

    function loop() {
        bg.draw();
        pipes.draw();
        fg.draw();
        bird.draw();
        score.draw();
        drawUI();

        if (state.current == state.game) {
            pipes.update();
            fg.update();
            bird.update();
            frames++;
        } else if (state.current == state.getReady) {
            fg.update();
            bird.y = 150 + Math.sin(frames * 0.05) * 5;
            bird.rotation = 0;
            frames++;
        }

        requestAnimationFrame(loop);
    }

    resetGame();
    loop();
</script>
</body>
</html>
