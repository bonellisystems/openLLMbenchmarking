<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fly Over City</title>
<style>
html,body{margin:0;overflow:hidden;height:100%;background:#000}
#canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
// ----- Begin three.js (r152 minified) -----

// ----- Application Code -----
(() => {
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 2000);
    const controls = {forward:false, back:false, left:false, right:false, up:false, down:false};

    // Lights
    const ambient = new THREE.AmbientLight(0x404040);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100,200,100);
    scene.add(dirLight);

    // City generation
    const buildingGeometry = new THREE.BoxGeometry(10,1,10);
    const buildingMaterial = new THREE.MeshLambertMaterial({color:0x888888});
    const city = new THREE.Group();
    const gridSize = 200;
    const step = 20;
    for(let x=-gridSize;x<=gridSize;x+=step){
        for(let z=-gridSize;z<=gridSize;z+=step){
            const height = Math.random()*180+20;
            const mesh = new THREE.Mesh(buildingGeometry, buildingMaterial.clone());
            mesh.scale.y = height/1;
            mesh.position.set(x, height/2, z);
            mesh.material.color.setHSL(Math.random()*0.3+0.6,0.5,0.5);
            city.add(mesh);
        }
    }
    scene.add(city);

    // Plane
    const planeGeometry = new THREE.ConeGeometry(5,20,4);
    const planeMaterial = new THREE.MeshLambertMaterial({color:0xff0000});
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = Math.PI/2;
    scene.add(plane);

    // Initial positions
    const planeState = {
        position: new THREE.Vector3(0,100,0),
        velocity: new THREE.Vector3(0,0,0),
        speed: 0.5,
        yaw: 0,
        pitch: 0,
        roll: 0
    };

    function updatePlane(){
        // Simple controls
        const turnSpeed = 0.02;
        const pitchSpeed = 0.01;
        if(controls.left) planeState.yaw += turnSpeed;
        if(controls.right) planeState.yaw -= turnSpeed;
        if(controls.up) planeState.pitch += pitchSpeed;
        if(controls.down) planeState.pitch -= pitchSpeed;
        if(controls.forward) planeState.speed = Math.min(planeState.speed+0.01,2);
        if(controls.back) planeState.speed = Math.max(planeState.speed-0.01,0.1);

        // Update orientation
        const quaternion = new THREE.Quaternion();
        quaternion.setFromEuler(new THREE.Euler(planeState.pitch, planeState.yaw, planeState.roll, 'YXZ'));
        const forward = new THREE.Vector3(0,0,-1).applyQuaternion(quaternion);
        planeState.position.addScaledVector(forward, planeState.speed);
        plane.position.copy(planeState.position);
        plane.quaternion.copy(quaternion);

        // Camera follows
        const camOffset = new THREE.Vector3(0,20,50).applyQuaternion(quaternion);
        camera.position.copy(planeState.position).add(camOffset);
        camera.lookAt(planeState.position);
    }

    // Input handling
    window.addEventListener('keydown',e=>{
        switch(e.code){
            case 'KeyW': case 'ArrowUp': controls.forward=true; break;
            case 'KeyS': case 'ArrowDown': controls.back=true; break;
            case 'KeyA': case 'ArrowLeft': controls.left=true; break;
            case 'KeyD': case 'ArrowRight': controls.right=true; break;
            case 'Space': controls.up=true; break;
            case 'ShiftLeft': controls.down=true; break;
        }
    });
    window.addEventListener('keyup',e=>{
        switch(e.code){
            case 'KeyW': case 'ArrowUp': controls.forward=false; break;
            case 'KeyS': case 'ArrowDown': controls.back=false; break;
            case 'KeyA': case 'ArrowLeft': controls.left=false; break;
            case 'KeyD': case 'ArrowRight': controls.right=false; break;
            case 'Space': controls.up=false; break;
            case 'ShiftLeft': controls.down=false; break;
        }
    });

    // Resize handling
    window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});

    // Animation loop
    function animate(){
        requestAnimationFrame(animate);
        updatePlane();
        renderer.render(scene,camera);
    }
    animate();
})();
</script>
</body>
</html>
