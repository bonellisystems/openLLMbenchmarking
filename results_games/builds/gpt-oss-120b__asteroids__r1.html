<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:sans-serif;}
#game{display:block;background:#000;width:100%;height:100%;}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;color:#fff;font-size:24px;text-align:center;padding-top:20vh;}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="overlay"></div>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    let W, H;
    function resize() {
        canvas.width = W = window.innerWidth;
        canvas.height = H = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const KEY = {LEFT:37, RIGHT:39, UP:38, SPACE:32, R:82};
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.keyCode] = true;
        e.preventDefault();
    });
    window.addEventListener('keyup', e => {
        keys[e.keyCode] = false;
        e.preventDefault();
    });
    canvas.focus();

    // Game objects
    class Ship {
        constructor() {
            this.x = W/2; this.y = H/2;
            this.r = 10;
            this.angle = 0;
            this.vel = {x:0, y:0};
            this.thrust = false;
            this.dead = false;
        }
        reset() {
            this.x = W/2; this.y = H/2;
            this.vel = {x:0,y:0};
            this.angle = 0;
            this.thrust = false;
            this.dead = false;
        }
        update() {
            if (keys[KEY.LEFT]) this.angle -= 0.07;
            if (keys[KEY.RIGHT]) this.angle += 0.07;
            if (keys[KEY.UP]) {
                this.thrust = true;
                this.vel.x += Math.cos(this.angle) * 0.1;
                this.vel.y += Math.sin(this.angle) * 0.1;
            } else this.thrust = false;
            // friction
            this.vel.x *= 0.99;
            this.vel.y *= 0.99;
            this.x += this.vel.x;
            this.y += this.vel.y;
            // wrap
            if (this.x < 0) this.x += W;
            if (this.x > W) this.x -= W;
            if (this.y < 0) this.y += H;
            if (this.y > H) this.y -= H;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.r,0);
            ctx.lineTo(-this.r, -this.r/2);
            ctx.lineTo(-this.r, this.r/2);
            ctx.closePath();
            ctx.stroke();
            if (this.thrust) {
                ctx.beginPath();
                ctx.moveTo(-this.r, -this.r/3);
                ctx.lineTo(-this.r-5,0);
                ctx.lineTo(-this.r, this.r/3);
                ctx.stroke();
            }
            ctx.restore();
        }
        shoot() {
            const bullet = new Bullet(this.x, this.y, this.angle);
            bullets.push(bullet);
        }
    }

    class Bullet {
        constructor(x,y,angle) {
            this.x = x;
            this.y = y;
            this.vel = {
                x: Math.cos(angle)*5,
                y: Math.sin(angle)*5
            };
            this.life = 60; // frames
        }
        update() {
            this.x += this.vel.x;
            this.y += this.vel.y;
            // wrap
            if (this.x < 0) this.x += W;
            if (this.x > W) this.x -= W;
            if (this.y < 0) this.y += H;
            if (this.y > H) this.y -= H;
            this.life--;
        }
        draw() {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
            ctx.fill();
        }
    }

    class Asteroid {
        constructor(x,y,r,level=0) {
            this.x = x;
            this.y = y;
            this.r = r;
            this.level = level; // 0 largest
            const speed = 1.5 - level*0.3;
            const angle = Math.random()*Math.PI*2;
            this.vel = {
                x: Math.cos(angle)*speed,
                y: Math.sin(angle)*speed
            };
            this.vertices = Math.floor(Math.random()*5)+5;
            this.offsets = [];
            for(let i=0;i<this.vertices;i++) this.offsets.push(Math.random()*0.4+0.6);
        }
        update() {
            this.x += this.vel.x;
            this.y += this.vel.y;
            if (this.x < -this.r) this.x += W+2*this.r;
            if (this.x > W+this.r) this.x -= W+2*this.r;
            if (this.y < -this.r) this.y += H+2*this.r;
            if (this.y > H+this.r) this.y -= H+2*this.r;
        }
        draw() {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0;i<this.vertices;i++) {
                const angle = ((Math.PI*2)/this.vertices)*i;
                const rad = this.r * this.offsets[i];
                const x = this.x + Math.cos(angle)*rad;
                const y = this.y + Math.sin(angle)*rad;
                if (i===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.closePath();
            ctx.stroke();
        }
        split() {
            if (this.r < 15) return [];
            const newR = this.r/2;
            const a1 = new Asteroid(this.x, this.y, newR, this.level+1);
            const a2 = new Asteroid(this.x, this.y, newR, this.level+1);
            return [a1,a2];
        }
    }

    let ship = new Ship();
    let bullets = [];
    let asteroids = [];
    let score = 0;
    let gameOver = false;

    function init() {
        ship.reset();
        bullets = [];
        asteroids = [];
        score = 0;
        gameOver = false;
        const count = 5 + Math.floor(Math.min(W,H)/200);
        for(let i=0;i<count;i++) {
            let x,y;
            do {
                x = Math.random()*W;
                y = Math.random()*H;
            } while (Math.hypot(x-ship.x, y-ship.y) < 100);
            const r = Math.random()*30+30;
            asteroids.push(new Asteroid(x,y,r));
        }
        overlay.textContent = '';
    }

    function update() {
        if (gameOver) return;
        ship.update();
        bullets.forEach(b=>b.update());
        bullets = bullets.filter(b=>b.life>0);
        asteroids.forEach(a=>a.update());

        // shooting
        if (keys[KEY.SPACE]) {
            if (!ship.lastShot || Date.now()-ship.lastShot>200) {
                ship.shoot();
                ship.lastShot = Date.now();
            }
        }

        // collisions bullet-asteroid
        for(let i=bullets.length-1;i>=0;i--) {
            const b = bullets[i];
            for(let j=asteroids.length-1;j>=0;j--) {
                const a = asteroids[j];
                const d = Math.hypot(b.x-a.x, b.y-a.y);
                if (d < a.r) {
                    // split
                    const newA = a.split();
                    asteroids.splice(j,1);
                    asteroids.push(...newA);
                    bullets.splice(i,1);
                    score += 10;
                    break;
                }
            }
        }

        // ship-asteroid collision
        for(let a of asteroids) {
            const d = Math.hypot(ship.x-a.x, ship.y-a.y);
            if (d < a.r + ship.r) {
                gameOver = true;
                overlay.innerHTML = `Game Over<br>Score: ${score}<br>Press R to Restart`;
                break;
            }
        }
    }

    function draw() {
        ctx.clearRect(0,0,W,H);
        ship.draw();
        bullets.forEach(b=>b.draw());
        asteroids.forEach(a=>a.draw());
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText('Score: '+score, 20,30);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // restart
    window.addEventListener('keydown', e=>{
        if (gameOver && e.keyCode===KEY.R) init();
    });

    init();
    loop();
})();
</script>
</body>
</html>
