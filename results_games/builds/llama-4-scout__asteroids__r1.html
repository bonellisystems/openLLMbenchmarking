<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Asteroids</title>
  <style>
    canvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    let ship = { x: width / 2, y: height / 2, vx: 0, vy: 0, angle: 0 };
    let rocks = [];
    let bullets = [];

    for (let i = 0; i < 10; i++) {
      rocks.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: Math.random() * 2 - 1,
        vy: Math.random() * 2 - 1,
        radius: Math.random() * 20 + 10
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        ship.vx += Math.cos(ship.angle) * 0.1;
        ship.vy += Math.sin(ship.angle) * 0.1;
      } else if (e.key === 'ArrowDown') {
        ship.vx -= Math.cos(ship.angle) * 0.1;
        ship.vy -= Math.sin(ship.angle) * 0.1;
      } else if (e.key === 'ArrowLeft') {
        ship.angle -= 0.1;
      } else if (e.key === 'ArrowRight') {
        ship.angle += 0.1;
      } else if (e.key === ' ') {
        bullets.push({
          x: ship.x,
          y: ship.y,
          vx: Math.cos(ship.angle) * 5,
          vy: Math.sin(ship.angle) * 5
        });
      }
    });

    function update() {
      ctx.clearRect(0, 0, width, height);

      // Update ship
      ship.x += ship.vx;
      ship.y += ship.vy;
      if (ship.x < 0) ship.x = width;
      if (ship.x > width) ship.x = 0;
      if (ship.y < 0) ship.y = height;
      if (ship.y > height) ship.y = 0;

      // Draw ship
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-20, 20);
      ctx.lineTo(20, 20);
      ctx.closePath();
      ctx.fillStyle = 'white';
      ctx.fill();
      ctx.restore();

      // Update rocks
      for (let i = 0; i < rocks.length; i++) {
        rocks[i].x += rocks[i].vx;
        rocks[i].y += rocks[i].vy;
        if (rocks[i].x < 0) rocks[i].x = width;
        if (rocks[i].x > width) rocks[i].x = 0;
        if (rocks[i].y < 0) rocks[i].y = height;
        if (rocks[i].y > height) rocks[i].y = 0;

        // Draw rocks
        ctx.beginPath();
        ctx.arc(rocks[i].x, rocks[i].y, rocks[i].radius, 0, 2 * Math.PI);
        ctx.fillStyle = 'gray';
        ctx.fill();

        // Check collision with ship
        const dx = ship.x - rocks[i].x;
        const dy = ship.y - rocks[i].y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < rocks[i].radius) {
          alert('Game Over');
          location.reload();
        }

        // Check collision with bullets
        for (let j = 0; j < bullets.length; j++) {
          const dx2 = bullets[j].x - rocks[i].x;
          const dy2 = bullets[j].y - rocks[i].y;
          const distance2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
          if (distance2 < rocks[i].radius) {
            if (rocks[i].radius > 10) {
              rocks.push({
                x: rocks[i].x,
                y: rocks[i].y,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                radius: rocks[i].radius / 2
              });
              rocks.push({
                x: rocks[i].x,
                y: rocks[i].y,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                radius: rocks[i].radius / 2
              });
            }
            rocks.splice(i, 1);
            bullets.splice(j, 1);
            i--;
            break;
          }
        }
      }

      // Update bullets
      for (let i = 0; i < bullets.length; i++) {
        bullets[i].x += bullets[i].vx;
        bullets[i].y += bullets[i].vy;
        if (bullets[i].x < 0 || bullets[i].x > width || bullets[i].y < 0 || bullets[i].y > height) {
          bullets.splice(i, 1);
          i--;
        } else {
          // Draw bullets
          ctx.beginPath();
          ctx.arc(bullets[i].x, bullets[i].y, 2, 0, 2 * Math.PI);
          ctx.fillStyle = 'white';
          ctx.fill();
        }
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
