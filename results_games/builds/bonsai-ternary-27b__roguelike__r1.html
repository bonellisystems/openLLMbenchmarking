<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tiny Roguelike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#game{display:flex;gap:12px;padding:12px}
#dungeon{background:#0a0a0a;border:2px solid #333;padding:4px}
#dungeon pre{margin:0;white-space:pre;overflow:hidden}
#info{width:200px;background:#0a0a0a;border:2px solid #333;padding:10px;font-size:14px}
#info h2{color:#ffaa00;margin-bottom:6px}
#info p{margin:3px 0}
#controls{color:#666;font-size:11px;margin-top:8px;border-top:1px solid #333;padding-top:6px}
#msg{color:#ffcc00;font-weight:bold;margin-top:4px;min-height:16px}
</style>
</head>
<body>
<div id="game">
<div id="dungeon"><pre id="grid"></pre></div>
<div id="info">
<h2>⚔️ DUNGEON</h2>
<p id="hp">HP: 100/100</p>
<p id="mp">MP: 50/50</p>
<p id="floor">Floor: 1/5</p>
<p id="score">Score: 0</p>
<p id="msg"></p>
<p id="controls">WASD/Arrows: Move<br>Space: Attack<br>Shift: Use item<br>Enter: Stairs</p>
</div>
</div>
<script>
const COLS=40,ROWS=24;
const grid=new Array(ROWS).fill().map(()=>new Array(COLS).fill('.'));
let player={x:1,y:1,hp:100,maxHp:100,mp:50,maxMp:50};
let enemies=[],items=[],stairs=null;
let floor=1,maxFloors=5,score=0;
let msg='';
let keys={};
let turn=0;

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function dist(a,b){return Math.abs(a.x-a.x)+Math.abs(a.y-b.y)}

function generateFloor(){
grid.fill(null).map(r=>r.fill('.'));
enemies=[];items=[];stairs=null;
const rooms=[];
for(let i=0;i<rand(5,8);i++){
const w=rand(4,8),h=rand(3,6);
const x=rand(1,COLS-w-1),y=rand(1,ROWS-h-1);
rooms.push({x,y,w,h});
for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)
grid[y+dy][x+dx]='.';
}
for(let i=0;i<rooms.length-1;i++){
const a=rooms[i],b=rooms[i+1];
const cx=Math.floor((a.x+a.x+a.w)/2),cy=a.y+a.h/2;
const dx=b.x+b.w/2-cx,dy=b.y+b.h/2-cy;
if(dx>0)for(let x=cx;x<b.x+b.w;x++)grid[cy][x]='.';
else for(let x=cx;x>b.x;x--)grid[cy][x]='.';
if(dy>0)for(let y=cy;y<b.y+b.h;y++)grid[y][b.x+b.w/2]='.';
else for(let y=cy;y>b.y;y--)grid[y][b.x+b.w/2]='.';
}
player.x=rooms[0].x+1;player.y=rooms[0].y+1;
for(let i=0;i<rooms.length-1;i++){
const a=rooms[i],b=rooms[i+1];
const mx=(a.x+a.x+a.w)/2,my=(a.y+a.y+a.h)/2;
const ex=b.x+b.w/2,ey=b.y+b.h/2;
enemies.push({x:Math.floor(mx),y:Math.floor(my),hp:20+floor*10,atk:5+floor*2,name:'goblin'});
}
for(let i=0;i<rooms.length-1;i++){
const a=rooms[i],b=rooms[i+1];
const ix=a.x+a.w/2,iy=a.y+a.h/2;
if(Math.random()<0.4)items.push({x:Math.floor(ix),y:Math.floor(iy),type:'potion'});
}
const last=rooms[rooms.length-1];
stairs={x:last.x+last.w/2,y:last.y+last.h/2};
grid[stairs.y][stairs.x]='>';
}

function render(){
let out='';
for(let y=0;y<ROWS;y++){
for(let x=0;x<COLS;x++){
let c=grid[y][x];
if(y===player.y&&x===player.x)c='@';
else if(stairs&&y===stairs.y&&x===stairs.x)c='>';
else if(c!=='.'&&c!=='#')c='.';
out+=c;
}
out+='\n';
}
document.getElementById('grid').textContent=out;
document.getElementById('hp').textContent='HP: '+player.hp+'/'+player.maxHp;
document.getElementById('mp').textContent='MP: '+player.mp+'/'+player.maxMp;
document.getElementById('floor').textContent='Floor: '+floor+'/'+maxFloors;
document.getElementById('score').textContent='Score: '+score;
document.getElementById('msg').textContent=msg;
}

function movePlayer(dx,dy){
const nx=player.x+dx,ny=player.y+dy;
if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
if(grid[ny][nx]==='#')return;
if(stairs&&ny===stairs.y&&nx===stairs.x){
if(floor<maxFloors){floor++;generateFloor();msg='Floor '+floor+'!';}
else{msg='You escaped! Score: '+score;render();}
return;
}
player.x=nx;player.y=ny;
turn++;
checkEnemies();
checkItems();
render();
}

function checkEnemies(){
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
if(dist(player,e)>1){
const dx=Math.sign(e.x-player.x),dy=Math.sign(e.y-player.y);
if(Math.random()<0.3){
const nx=e.x+dx,ny=e.y+dy;
if(grid[ny][nx]==='.'){e.x=nx;e.y=ny;}
}
}
if(dist(player,e)<=1){
e.hp-=player.atk||5;
player.hp-=e.atk;
msg='Hit '+e.name+'!';
if(e.hp<=0){enemies.splice(i,1);score+=100;msg='Killed '+e.name+'!';}
}
}
}

function checkItems(){
for(let i=items.length-1;i>=0;i--){
const it=items[i];
if(player.x===it.x&&player.y===it.y){
if(it.type==='potion'){player.hp=Math.min(player.maxHp,player.hp+30);msg='Healed +30 HP!';}
items.splice(i,1);
}
}
}

function attack(){
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
if(dist(player,e)<=1){
e.hp-=10;
player.hp-=e.atk;
msg='Attacked '+e.name+'!';
if(e.hp<=0){enemies.splice(i,1);score+=100;msg='Killed '+e.name+'!';}
}
}
}

document.addEventListener('keydown',e=>{
if(e.repeat)return;
const k=e.key;
if(k==='w'||k==='ArrowUp')movePlayer(0,-1);
else if(k==='s'||k==='ArrowDown')movePlayer(0,1);
else if(k==='a'||k==='ArrowLeft')movePlayer(-1,0);
else if(k==='d'||k==='ArrowRight')movePlayer(1,0);
else if(k===' '){attack();render();}
else if(k==='Enter'){
if(stairs&&player.x===stairs.x&&player.y===stairs.y){
if(floor<maxFloors){floor++;generateFloor();msg='Floor '+floor+'!';}
else{msg='You escaped! Score: '+score;render();}
}
}
});

generateFloor();
render();
</script>
</body>
</html>
