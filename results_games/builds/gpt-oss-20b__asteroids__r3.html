<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

const keys = {left:false,right:false,up:false,space:false};
let spacePressed = false;
let running = true;
let score = 0;

class Ship {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = width/2;
    this.y = height/2;
    this.vx = 0;
    this.vy = 0;
    this.angle = 0; // 0 points up
    this.rotation = 0;
    this.thrust = 0;
    this.radius = 10;
  }
  update() {
    if (keys.left) this.rotation = -0.05;
    else if (keys.right) this.rotation = 0.05;
    else this.rotation = 0;
    this.angle += this.rotation;
    if (this.angle < 0) this.angle += Math.PI*2;
    if (this.angle > Math.PI*2) this.angle -= Math.PI*2;
    if (keys.up) this.thrust = 0.1;
    else this.thrust = 0;
    if (this.thrust) {
      this.vx += Math.cos(this.angle)*this.thrust;
      this.vy += Math.sin(this.angle)*this.thrust;
    }
    this.vx *= 0.99;
    this.vy *= 0.99;
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0) this.x += width;
    if (this.x > width) this.x -= width;
    if (this.y < 0) this.y += height;
    if (this.y > height) this.y -= height;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0,-15);
    ctx.lineTo(-10,10);
    ctx.lineTo(10,10);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

class Bullet {
  constructor(x,y,angle) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle)*5;
    this.vy = Math.sin(angle)*5;
    this.life = 60;
    this.radius = 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (this.x < 0) this.x += width;
    if (this.x > width) this.x -= width;
    if (this.y < 0) this.y += height;
    if (this.y > height) this.y -= height;
  }
  draw() {
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fill();
  }
}

class Asteroid {
  constructor(x,y,velocity,size) {
    this.x = x;
    this.y = y;
    this.vx = velocity.x;
    this.vy = velocity.y;
    this.size = size; // 3 large, 2 medium, 1 small
    this.radius = size * 20;
    this.points = 8 + Math.floor(Math.random()*4);
    this.vertices = [];
    for (let i=0;i<this.points;i++) {
      const angle = i / this.points * Math.PI*2;
      const r = this.radius * (0.8 + Math.random()*0.4);
      this.vertices.push({x: Math.cos(angle)*r, y: Math.sin(angle)*r});
    }
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0) this.x += width;
    if (this.x > width) this.x -= width;
    if (this.y < 0) this.y += height;
    if (this.y > height) this.y -= height;
  }
  draw() {
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.x + this.vertices[0].x, this.y + this.vertices[0].y);
    for (let i=1;i<this.vertices.length;i++) {
      ctx.lineTo(this.x + this.vertices[i].x, this.y + this.vertices[i].y);
    }
    ctx.closePath();
    ctx.stroke();
  }
}

let ship = new Ship();
let bullets = [];
let asteroids = [];

function initAsteroids() {
  asteroids = [];
  for (let i=0;i<5;i++) {
    const x = Math.random()*width;
    const y = Math.random()*height;
    const angle = Math.random()*Math.PI*2;
    const speed = 0.5 + Math.random()*0.5;
    const velocity = {x: Math.cos(angle)*speed, y: Math.sin(angle)*speed};
    asteroids.push(new Asteroid(x,y,velocity,3));
  }
}

function resetGame() {
  ship.reset();
  bullets = [];
  initAsteroids();
  score = 0;
  running = true;
}

resetGame();

function update() {
  if (!running) return;
  ship.update();
  bullets.forEach(b => b.update());
  bullets = bullets.filter(b => b.life > 0);
  asteroids.forEach(a => a.update());

  // Collision: bullets vs asteroids
  for (let i=asteroids.length-1;i>=0;i--) {
    const a = asteroids[i];
    for (let j=bullets.length-1;j>=0;j--) {
      const b = bullets[j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx,dy);
      if (dist < a.radius + b.radius) {
        bullets.splice(j,1);
        // split or destroy
        if (a.size > 1) {
          for (let k=0;k<2;k++) {
            const angle = Math.random()*Math.PI*2;
            const speed = 0.5 + Math.random()*0.5;
            const velocity = {x: Math.cos(angle)*speed, y: Math.sin(angle)*speed};
            asteroids.push(new Asteroid(a.x,a.y,velocity,a.size-1));
          }
        } else {
          score += 10;
        }
        asteroids.splice(i,1);
        break;
      }
    }
  }

  // Collision: ship vs asteroids
  for (let a of asteroids) {
    const dx = a.x - ship.x;
    const dy = a.y - ship.y;
    const dist = Math.hypot(dx,dy);
    if (dist < a.radius + ship.radius) {
      running = false;
      break;
    }
  }

  // If all asteroids destroyed, spawn new wave
  if (asteroids.length === 0) {
    initAsteroids();
  }
}

function draw() {
  ctx.fillStyle = 'black';
  ctx.fillRect(0,0,width,height);
  ship.draw();
  bullets.forEach(b => b.draw());
  asteroids.forEach(a => a.draw());
  ctx.fillStyle = 'white';
  ctx.font = '20px sans-serif';
  ctx.fillText('Score: '+score, 10, 30);
  if (!running) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,width,height);
    ctx.fillStyle = 'white';
    ctx.font = '40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', width/2, height/2 - 20);
    ctx.font = '20px sans-serif';
    ctx.fillText('Press R to Restart', width/2, height/2 + 20);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.code === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.code === 'ArrowUp' || e.key === 'w') keys.up = true;
  if (e.code === 'Space') {
    if (!spacePressed) {
      const tipX = ship.x + Math.cos(ship.angle)*15;
      const tipY = ship.y + Math.sin(ship.angle)*15;
      bullets.push(new Bullet(tipX, tipY, ship.angle));
      spacePressed = true;
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    if (!running) resetGame();
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.code === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.code === 'ArrowUp' || e.key === 'w') keys.up = false;
  if (e.code === 'Space') spacePressed = false;
});
})();
</script>
</body>
</html>
