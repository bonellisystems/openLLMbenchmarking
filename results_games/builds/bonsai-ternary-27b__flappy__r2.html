<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;display:flex;justify-content:center;align-items:center}
canvas{display:block;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Configuration ---
const W = 400, H = 600;
canvas.width = W; canvas.height = H;

const GRAVITY = 0.45;
const FLAP = -7.5;
const PIPE_SPEED = 2.5;
const PIPE_GAP = 140;
const PIPE_WIDTH = 56;
const PIPE_INTERVAL = 160;
const GROUND_H = 80;
const BIRD_R = 14;

// --- Game State ---
let state = 'START'; // START, PLAYING, GAME_OVER
let score = 0;
let best = parseInt(localStorage.getItem('flappyBest') || '0');
let frame = 0;
let shake = 0;

// Bird
let bird = { x: 80, y: H/2, vy: 0, rot: 0, wing: 0 };

// Pipes
let pipes = [];
let pipeTimer = 0;

// Ground
let groundX = 0;

// Particles
let particles = [];

// --- Input ---
function flap() {
  if (state === 'START') {
    state = 'PLAYING';
    bird.vy = FLAP;
  } else if (state === 'PLAYING') {
    bird.vy = FLAP;
  } else if (state === 'GAME_OVER') {
    resetGame();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('mousedown', e => { e.preventDefault(); flap(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });

// --- Reset ---
function resetGame() {
  bird = { x: 80, y: H/2, vy: 0, rot: 0, wing: 0 };
  pipes = [];
  pipeTimer = 0;
  score = 0;
  particles = [];
  shake = 0;
  state = 'START';
}

// --- Spawn Pipe ---
function spawnPipe() {
  const minTop = 60;
  const maxTop = H - GROUND_H - PIPE_GAP - 60;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W + 10, topH: topH, scored: false });
}

// --- Particles ---
function addParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 1,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

// --- Update ---
function update() {
  frame++;

  if (state === 'START') {
    bird.y = H/2 + Math.sin(frame * 0.05) * 12;
    bird.wing += 0.15;
    groundX = (groundX - 1) % 24;
    return;
  }

  if (state === 'GAME_OVER') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.min(bird.rot + 0.08, Math.PI/2);
    groundX = (groundX - 1) % 24;
    updateParticles();
    if (shake > 0) shake *= 0.9;
    return;
  }

  // Playing
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.wing += 0.2;
  bird.rot = Math.min(bird.rot + 0.05, Math.PI/2);
  if (bird.vy < 0) bird.rot = Math.max(bird.rot - 0.1, -0.5);

  groundX = (groundX - PIPE_SPEED) % 24;

  // Pipe spawning
  pipeTimer += PIPE_SPEED;
  if (pipeTimer >= PIPE_INTERVAL) {
    pipeTimer = 0;
    spawnPipe();
  }

  // Move pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;
    if (pipes[i].x + PIPE_WIDTH < -10) {
      pipes.splice(i, 1);
    }
  }

  // Score
  for (let p of pipes) {
    if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
      p.scored = true;
      score++;
    }
  }

  // Collision
  const bx = bird.x, by = bird.y, br = BIRD_R - 2;

  // Ground / ceiling
  if (by + br >= H - GROUND_H || by - br <= 0) {
    die();
    return;
  }

  // Pipes
  for (let p of pipes) {
    const px = p.x, pw = PIPE_WIDTH;
    const topBottom = p.topH;
    const botTop = p.topH + PIPE_GAP;

    if (bx + br > px && bx - br < px + pw) {
      if (by - br < topBottom || by + br > botTop) {
        die();
        return;
      }
    }
  }

  updateParticles();
  if (shake > 0) shake *= 0.9;
}

function die() {
  state = 'GAME_OVER';
  shake = 8;
  addParticles(bird.x, bird.y, 15, '#FFD700');
  addParticles(bird.x, bird.y, 10, '#FF6B35');
  if (score > best) {
    best = score;
    localStorage.setItem('flappyBest', best);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// --- Draw ---
function draw() {
  ctx.save();

  if (shake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#4EC0CA');
  skyGrad.addColorStop(0.5, '#87CEEB');
  skyGrad.addColorStop(1, '#E0F7FA');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  drawClouds();

  // Pipes
  for (let p of pipes) {
    drawPipe(p.x, p.topH);
  }

  // Ground
  drawGround();

  // Bird
  drawBird();

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Score
  if (state === 'PLAYING' || state === 'GAME_OVER') {
    drawScore();
  }

  // Start screen
  if (state === 'START') {
    drawStartScreen();
  }

  // Game over screen
  if (state === 'GAME_OVER') {
    drawGameOver();
  }

  ctx.restore();
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const cloudY = [80, 140, 200];
  const cloudX = [(frame * 0.2) % (W + 100) - 50, (frame * 0.15 + 100) % (W + 100) - 50, (frame * 0.1 + 200) % (W + 100) - 50];
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(cloudX[i], cloudY[i], 30 + i * 5, 0, Math.PI * 2);
    ctx.arc(cloudX[i] + 25, cloudY[i] - 5, 25 + i * 4, 0, Math.PI * 2);
    ctx.arc(cloudX[i] + 50, cloudY[i], 30 + i * 5, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPipe(x, topH) {
  const pw = PIPE_WIDTH;
  const capH = 26;
  const capOverhang = 6;

  // Top pipe body
  const topGrad = ctx.createLinearGradient(x, 0, x + pw, 0);
  topGrad.addColorStop(0, '#5CB85C');
  topGrad.addColorStop(0.3, '#7CB342');
  topGrad.addColorStop(0.7, '#689F38');
  topGrad.addColorStop(1, '#558B2F');
  ctx.fillStyle = topGrad;
  ctx.fillRect(x, 0, pw, topH);

  // Top pipe cap
  const capGrad = ctx.createLinearGradient(x - capOverhang, 0, x + pw + capOverhang, 0);
  capGrad.addColorStop(0, '#4CAF50');
  capGrad.addColorStop(0.3, '#66BB6A');
  capGrad.addColorStop(0.7, '#43A047');
  capGrad.addColorStop(1, '#388E3C');
  ctx.fillStyle = capGrad;
  ctx.fillRect(x - capOverhang, topH - capH, pw + capOverhang * 2, capH);

  // Top pipe border
  ctx.strokeStyle = '#2E7D32';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, 0, pw, topH);
  ctx.strokeRect(x - capOverhang, topH - capH, pw + capOverhang * 2, capH);

  // Bottom pipe body
  const botY = topH + PIPE_GAP;
  const botGrad = ctx.createLinearGradient(x, 0, x + pw, 0);
  botGrad.addColorStop(0, '#5CB85C');
  botGrad.addColorStop(0.3, '#7CB342');
  botGrad.addColorStop(0.7, '#689F38');
  botGrad.addColorStop(1, '#558B2F');
  ctx.fillStyle = botGrad;
  ctx.fillRect(x, botY, pw, H - GROUND_H - botY);

  // Bottom pipe cap
  ctx.fillStyle = capGrad;
  ctx.fillRect(x - capOverhang, botY, pw + capOverhang * 2, capH);

  // Bottom pipe border
  ctx.strokeStyle = '#2E7D32';
  ctx.strokeRect(x, botY, pw, H - GROUND_H - botY);
  ctx.strokeRect(x - capOverhang, botY, pw + capOverhang * 2, capH);

  // Highlight on pipes
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x + 4, 0, 6, topH);
  ctx.fillRect(x + 4, botY, 6, H - GROUND_H - botY);
}

function drawGround() {
  const gy = H - GROUND_H;

  // Ground body
  const gGrad = ctx.createLinearGradient(0, gy, 0, H);
  gGrad.addColorStop(0, '#D2B48C');
  gGrad.addColorStop(0.15, '#C4A46C');
  gGrad.addColorStop(1, '#8B7355');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, gy, W, GROUND_H);

  // Grass top
  ctx.fillStyle = '#66BB6A';
  ctx.fillRect(0, gy, W, 12);
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, gy, W, 6);

  // Grass detail
  ctx.fillStyle = '#81C784';
  for (let i = groundX; i < W + 24; i += 24) {
    ctx.fillRect(i, gy, 12, 4);
  }

  // Dirt pattern
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  for (let i = groundX; i < W + 24; i += 24) {
    ctx.fillRect(i + 12, gy + 16, 10, 3);
    ctx.fillRect(i + 6, gy + 28, 8, 3);
  }

  // Border
  ctx.strokeStyle = '#5D4037';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, gy);
  ctx.lineTo(W, gy);
  ctx.stroke();
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  // Body
  const bodyGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, BIRD_R);
  bodyGrad.addColorStop(0, '#FFE082');
  bodyGrad.addColorStop(0.6, '#FFB300');
  bodyGrad.addColorStop(1, '#FF8F00');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, BIRD_R + 2, BIRD_R, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body outline
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Wing
  const wingY = Math.sin(bird.wing) * 4;
  ctx.fillStyle = '#FF8F00';
  ctx.beginPath();
  ctx.ellipse(-4, wingY, 8, 5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Eye white
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.ellipse(6, -4, 6, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Pupil
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Eye highlight
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.arc(9, -5.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#FF7043';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(20, 2);
  ctx.lineTo(12, 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#E65100';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Beak line
  ctx.strokeStyle = '#E65100';
  ctx.beginPath();
  ctx.moveTo(12, 2.5);
  ctx.lineTo(19, 2.5);
  ctx.stroke();

  ctx.restore();
}

function drawScore() {
  ctx.save();
  ctx.font = 'bold 48px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText(score, W/2 + 2, 52);

  // Outline
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.strokeText(score, W/2, 50);

  // Fill
  ctx.fillStyle = '#FFF';
  ctx.fillText(score, W/2, 50);

  ctx.restore();
}

function drawStartScreen() {
  ctx.save();

  // Title
  ctx.font = 'bold 42px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillText('Flappy Bird', W/2 + 2, H/3 + 2);

  // Outline
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.strokeText('Flappy Bird', W/2, H/3);

  // Fill
  ctx.fillStyle = '#FFF';
  ctx.fillText('Flappy Bird', W/2, H/3);

  // Subtitle
  ctx.font = '18px "Arial", sans-serif';
  ctx.fillStyle = '#FFF';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.strokeText('Press SPACE or tap to start', W/2, H/2 + 80);
  ctx.fillText('Press SPACE or tap to start', W/2, H/2 + 80);

  // Best score
  if (best > 0) {
    ctx.font = 'bold 20px "Arial Black", sans-serif';
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 3;
    ctx.strokeText('Best: ' + best, W/2, H/2 + 120);
    ctx.fillStyle = '#FFD700';
    ctx.fillText('Best: ' + best, W/2, H/2 + 120);
  }

  ctx.restore();
}

function drawGameOver() {
  ctx.save();

  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);

  // Panel
  const pw = 260, ph = 200;
  const px = (W - pw) / 2, py = (H - ph) / 2 - 20;

  // Panel shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  roundRect(ctx, px + 4, py + 4, pw, ph, 12, true, false);

  // Panel background
  const pGrad = ctx.createLinearGradient(px, py, px, py + ph);
  pGrad.addColorStop(0, '#FFF8E1');
  pGrad.addColorStop(1, '#FFE0B2');
  ctx.fillStyle = pGrad;
  roundRect(ctx, px, py, pw, ph, 12, true, false);

  // Panel border
  ctx.strokeStyle = '#8D6E63';
  ctx.lineWidth = 3;
  roundRect(ctx, px, py, pw, ph, 12, false, true);

  // Game Over text
  ctx.font = 'bold 32px "Arial Black", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3;
  ctx.strokeText('Game Over', W/2, py + 40);
  ctx.fillStyle = '#E65100';
  ctx.fillText('Game Over', W/2, py + 40);

  // Score
  ctx.font = '18px "Arial", sans-serif';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'left';
  ctx.fillText('Score:', px + 30, py + 85);
  ctx.font = 'bold 24px "Arial Black", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#333';
  ctx.fillText(score, px + pw - 30, py + 85);

  // Best
  ctx.font = '18px "Arial", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#555';
  ctx.fillText('Best:', px + 30, py + 115);
  ctx.font = 'bold 24px "Arial Black", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#FFD700';
  ctx.fillText(best, px + pw - 30, py + 115);

  // Medal
  if (score >= 10) {
    const medalColor = score >= 40 ? '#FFD700' : score >= 20 ? '#C0C0C0' : '#CD7F32';
    ctx.fillStyle = medalColor;
    ctx.beginPath();
    ctx.arc(px + 40, py + 145, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 12px "Arial", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', px + 40, py + 145);
  }

  // Restart hint
  ctx.font = '16px "Arial", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#555';
  ctx.fillText('Press SPACE or tap to restart', W/2, py + ph + 35);

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// --- Main Loop ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
