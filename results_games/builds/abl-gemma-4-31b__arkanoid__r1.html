<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid</title>
    <style>
        body {
            background: #222;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background: #000;
            display: block;
            border: 4px solid #444;
        }
        #ui {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            visibility: hidden;
        }
        h1 { margin: 0 0 10px 0; }
        p { margin: 0; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="lives">Lives: 3</div>
    </div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="overlay">
        <h1 id="status">GAME OVER</h1>
        <p>Press SPACE to Restart</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');

    // Game Constants
    const BALL_RADIUS = 8;
    const PADDLE_WIDTH = 80;
    const PADDLE_HEIGHT = 12;
    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_PADDING = 10;
    const BRICK_OFFSET_TOP = 30;
    const BRICK_OFFSET_LEFT = 35;
    const BRICK_WIDTH = (canvas.width - (BRICK_OFFSET_LEFT * 2)) / BRICK_COLS - BRICK_PADDING;
    const BRICK_HEIGHT = 20;

    // Game State
    let score = 0;
    let lives = 3;
    let gameRunning = true;
    let rightPressed = false;
    let leftPressed = false;

    let paddle = {
        x: canvas.width / 2 - PADDLE_WIDTH / 2,
        y: canvas.height - PADDLE_HEIGHT - 10,
        width: PADDLE_WIDTH,
        height: PADDLE_HEIGHT
    };

    let ball = {
        x: canvas.width / 2,
        y: canvas.height - PADDLE_HEIGHT - 20,
        dx: 4,
        dy: -4,
        radius: BALL_RADIUS
    };

    let bricks = [];
    function initBricks() {
        bricks = [];
        for (let r = 0; r < BRICK_ROWS; r++) {
            bricks[r] = [];
            for (let c = 0; c < BRICK_COLS; c++) {
                bricks[r][c] = { x: 0, y: 0, status: 1 };
            }
        }
    }

    function drawBricks() {
        for (let r = 0; r < BRICK_ROWS; r++) {
            for (let c = 0; c < BRICK_COLS; c++) {
                if (bricks[r][c].status === 1) {
                    let bx = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                    let by = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                    bricks[r][c].x = bx;
                    bricks[r][c].y = by;
                    ctx.beginPath();
                    ctx.rect(bx, by, BRICK_WIDTH, BRICK_HEIGHT);
                    ctx.fillStyle = `hsl(${r * 40}, 70%, 50%)`;
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
    }

    function collisionDetection() {
        for (let r = 0; r < BRICK_ROWS; r++) {
            for (let c = 0; c < BRICK_COLS; c++) {
                let b = bricks[r][c];
                if (b.status === 1) {
                    if (ball.x > b.x && ball.x < b.x + BRICK_WIDTH && ball.y > b.y && ball.y < b.y + BRICK_HEIGHT) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score += 10;
                        scoreEl.innerText = `Score: ${score}`;
                        if (score === BRICK_ROWS * BRICK_COLS * 10) {
                            gameOver(true);
                        }
                    }
                }
            }
        }
    }

    function gameOver(win) {
        gameRunning = false;
        overlay.style.visibility = 'visible';
        statusEl.innerText = win ? "YOU WIN!" : "GAME OVER";
        statusEl.style.color = win ? "#0f0" : "#f00";
    }

    function resetGame() {
        score = 0;
        lives = 3;
        scoreEl.innerText = `Score: 0`;
        livesEl.innerText = `Lives: 3`;
        initBricks();
        ball.x = canvas.width / 2;
        ball.y = canvas.height - PADDLE_HEIGHT - 20;
        ball.dx = 4;
        ball.dy = -4;
        paddle.x = canvas.width / 2 - PADDLE_WIDTH / 2;
        gameRunning = true;
        overlay.style.visibility = 'hidden';
        requestAnimationFrame(draw);
    }

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "d") rightPressed = true;
        if (e.key === "ArrowLeft" || e.key === "a") leftPressed = true;
        if (e.key === " " && !gameRunning) resetGame();
    });

    document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowRight" || e.key === "d") rightPressed = false;
        if (e.key === "ArrowLeft" || e.key === "a") leftPressed = false;
    });

    function draw() {
        if (!gameRunning) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        collisionDetection();

        // Ball movement & wall collision
        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
            ball.dx = -ball.dx;
        }
        if (ball.y + ball.dy < ball.radius) {
            ball.dy = -ball.dy;
        } else if (ball.y + ball.dy > canvas.height - ball.radius) {
            if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                // Add slight angle change based on where it hits the paddle
                let hitPos = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width/2);
                ball.dx = -hitPos * 5;
            } else {
                lives--;
                livesEl.innerText = `Lives: ${lives}`;
                if (!lives) {
                    gameOver(false);
                    return;
                } else {
                    ball.x = canvas.width / 2;
                    ball.y = canvas.height - PADDLE_HEIGHT - 20;
                    ball.dx = 4;
                    ball.dy = -4;
                    paddle.x = canvas.width / 2 - PADDLE_WIDTH / 2;
                }
            }
        }

        // Paddle movement
        if (rightPressed && paddle.x < canvas.width - paddle.width) {
            paddle.x += 7;
        } else if (leftPressed && paddle.x > 0) {
            paddle.x -= 7;
        }

        ball.x += ball.dx;
        ball.y += ball.dy;

        requestAnimationFrame(draw);
    }

    initBricks();
    draw();
</script>
</body>
</html>
