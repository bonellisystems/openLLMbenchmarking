<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:sans-serif;}
    #game{background:#111;display:block;margin:auto;}
    #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;pointer-events:none;}
</style>
</head>
<body tabindex="0">
<canvas id="game" width="400" height="400"></canvas>
<div id="overlay"></div>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const tileSize = 20;
    const cols = canvas.width / tileSize;
    const rows = canvas.height / tileSize;
    let snake, direction, nextDirection, food, gameLoop, speed = 100, gameOver = false;

    function init() {
        snake = [{x: Math.floor(cols/2), y: Math.floor(rows/2)}];
        direction = {x: 1, y: 0};
        nextDirection = direction;
        placeFood();
        gameOver = false;
        overlay.textContent = '';
        clearInterval(gameLoop);
        gameLoop = setInterval(tick, speed);
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            food = {
                x: Math.floor(Math.random()*cols),
                y: Math.floor(Math.random()*rows)
            };
            valid = !snake.some(seg => seg.x===food.x && seg.y===food.y);
        }
    }

    function tick() {
        // update direction
        if (!isOpposite(nextDirection, direction)) direction = nextDirection;

        const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

        // wall collision
        if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return endGame();

        // self collision
        if (snake.some(seg => seg.x===head.x && seg.y===head.y)) return endGame();

        snake.unshift(head);

        // food check
        if (head.x===food.x && head.y===food.y) {
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // food
        ctx.fillStyle = 'red';
        ctx.fillRect(food.x*tileSize, food.y*tileSize, tileSize, tileSize);

        // snake
        ctx.fillStyle = 'lime';
        snake.forEach(seg => {
            ctx.fillRect(seg.x*tileSize, seg.y*tileSize, tileSize, tileSize);
        });
    }

    function endGame() {
        clearInterval(gameLoop);
        gameOver = true;
        overlay.innerHTML = '<div>Game Over<br>Press Space or Enter to Restart</div>';
    }

    function isOpposite(dir1, dir2) {
        return dir1.x===-dir2.x && dir1.y===-dir2.y;
    }

    // keyboard handling
    window.addEventListener('keydown', e => {
        if (gameOver && (e.code==='Space' || e.code==='Enter')) {
            init();
            return;
        }
        switch(e.code) {
            case 'ArrowUp':    nextDirection = {x:0, y:-1}; break;
            case 'ArrowDown':  nextDirection = {x:0, y:1}; break;
            case 'ArrowLeft':  nextDirection = {x:-1, y:0}; break;
            case 'ArrowRight': nextDirection = {x:1, y:0}; break;
            default: return;
        }
        e.preventDefault();
    });

    // start
    window.onload = () => {
        document.body.focus();
        init();
    };
})();
</script>
</body>
</html>
