<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #fafafa;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #333;
            pointer-events: none;
            user-select: none;
        }
        #msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 32px;
            color: #333;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">Score: 0</div>
    <div id="msg">GAME OVER<br>Press Space to Restart</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const msg = document.getElementById('msg');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let gameActive = true;
        let cameraY = 0;

        const gravity = 0.25;
        const jumpPower = -10;
        const moveSpeed = 5;

        const player = {
            x: 200,
            y: 500,
            w: 30,
            h: 30,
            vx: 0,
            vy: 0,
            color: '#4CAF50'
        };

        let platforms = [];
        const platformWidth = 60;
        const platformHeight = 15;
        const maxPlatforms = 7;

        const keys = {};

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (!gameActive && e.code === 'Space') resetGame();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function initPlatforms() {
            platforms = [];
            // Starting platform
            platforms.push({ x: 170, y: 550 });
            
            for (let i = 1; i < maxPlatforms; i++) {
                addPlatform(canvas.height - (i * 100));
            }
        }

        function addPlatform(y) {
            platforms.push({
                x: Math.random() * (canvas.width - platformWidth),
                y: y
            });
        }

        function resetGame() {
            score = 0;
            cameraY = 0;
            player.x = 200;
            player.y = 500;
            player.vx = 0;
            player.vy = 0;
            gameActive = true;
            msg.style.display = 'none';
            initPlatforms();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!gameActive) return;

            // Horizontal movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -moveSpeed;
            else if (keys['ArrowRight'] || keys['KeyD']) player.vx = moveSpeed;
            else player.vx *= 0.8;

            player.x += player.vx;

            // Screen wrap
            if (player.x > canvas.width) player.x = -player.w;
            if (player.x < -player.w) player.x = canvas.width;

            // Vertical movement
            player.vy += gravity;
            player.y += player.vy;

            // Collision with platforms (only when falling)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.w > p.x && 
                        player.x < p.x + platformWidth && 
                        player.y + player.h > p.y && 
                        player.y + player.h < p.y + platformHeight + player.vy) {
                        player.vy = jumpPower;
                    }
                });
            }

            // Camera scroll
            if (player.y < canvas.height / 2) {
                let diff = (canvas.height / 2) - player.y;
                player.y = canvas.height / 2;
                cameraY += diff;
                score += Math.floor(diff / 10);
                
                platforms.forEach(p => {
                    p.y += diff;
                });
            }

            // Procedural generation
            if (platforms[0].y > canvas.height) {
                platforms.shift();
                const highestY = platforms.reduce((min, p) => Math.min(min, p.y), canvas.height);
                addPlatform(highestY - 100);
            }

            // Game over
            if (player.y > canvas.height) {
                gameActive = false;
                msg.style.display = 'block';
            }

            ui.innerText = `Score: ${score}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw platforms
            ctx.fillStyle = '#2196F3';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, platformWidth, platformHeight);
                ctx.strokeStyle = '#1565C0';
                ctx.strokeRect(p.x, p.y, platformWidth, platformHeight);
            });

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.w, player.h);
            
            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 5, 6, 6);
            ctx.fillRect(player.x + 19, player.y + 5, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 7, player.y + 7, 3, 3);
            ctx.fillRect(player.x + 21, player.y + 7, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        initPlatforms();
        gameLoop();
    </script>
</body>
</html>
