<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            overflow: hidden;
        }
        canvas {
            background-color: #70c5ce;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Constants
        const GRAVITY = 0.25;
        const JUMP_STRENGTH = -4.5;
        const PIPE_SPEED = 2;
        const PIPE_SPAWN_RATE = 90;
        const PIPE_WIDTH = 50;
        const PIPE_GAP = 120;

        // Game Variables
        let bird, pipes, score, frames, gameState;

        // Game States: 'START', 'PLAYING', 'GAME_OVER'
        function init() {
            bird = {
                x: 50,
                y: 240,
                velocity: 0,
                radius: 12
            };
            pipes = [];
            score = 0;
            frames = 0;
            gameState = 'START';
        }

        function spawnPipe() {
            const minPipeHeight = 50;
            const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight;
            const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            pipes.push({
                x: canvas.width,
                top: topHeight,
                passed: false
            });
        }

        function update() {
            if (gameState === 'PLAYING') {
                // Bird Physics
                bird.velocity += GRAVITY;
                bird.y += bird.velocity;

                // Collision: Ceiling and Floor
                if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                    gameState = 'GAME_OVER';
                }

                // Pipes Logic
                if (frames % PIPE_SPAWN_RATE === 0) {
                    spawnPipe();
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    const p = pipes[i];
                    p.x -= PIPE_SPEED;

                    // Collision: Pipes
                    if (
                        bird.x + bird.radius > p.x &&
                        bird.x - bird.radius < p.x + PIPE_WIDTH &&
                        (bird.y - bird.radius < p.top || bird.y + bird.radius > p.top + PIPE_GAP)
                    ) {
                        gameState = 'GAME_OVER';
                    }

                    // Score increment
                    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
                        score++;
                        p.passed = true;
                    }

                    // Remove off-screen pipes
                    if (p.x + PIPE_WIDTH < 0) {
                        pipes.splice(i, 1);
                    }
                }
            }
            frames++;
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Pipes
            ctx.fillStyle = '#73bf2e';
            pipes.forEach(p => {
                // Top pipe
                ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
                ctx.strokeStyle = '#538021';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
                
                // Bottom pipe
                ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_WIDTH, canvas.height);
                ctx.strokeRect(p.x, p.top + PIPE_GAP, PIPE_WIDTH, canvas.height);
            });

            // Draw Bird
            ctx.fillStyle = '#f7e61c';
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Draw Score
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(score, canvas.width / 2, 50);
            ctx.strokeText(score, canvas.width / 2, 50);

            // Overlays
            if (gameState === 'START') {
                drawOverlay('PRESS SPACE', 'TO START');
            } else if (gameState === 'GAME_OVER') {
                drawOverlay('GAME OVER', 'PRESS SPACE TO RESTART');
            }
        }

        function drawOverlay(text1, text2) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(text1, canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '20px Arial';
            ctx.fillText(text2, canvas.width / 2, canvas.height / 2 + 25);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'START') {
                    gameState = 'PLAYING';
                    bird.velocity = JUMP_STRENGTH;
                } else if (gameState === 'PLAYING') {
                    bird.velocity = JUMP_STRENGTH;
                } else if (gameState === 'GAME_OVER') {
                    init();
                    gameState = 'PLAYING';
                    bird.velocity = JUMP_STRENGTH;
                }
            }
        });

        // Start the game
        init();
        loop();
    </script>
</body>
</html>
