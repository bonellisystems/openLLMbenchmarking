<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
    }
    canvas {
        display: block;
        background: #000;
    }
    #score {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #0f0;
        font-family: monospace;
        font-size: 16px;
    }
</style>
</head>
<body>
<div id="score">SCORE: 0</div>
<canvas id="game"></canvas>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Game state
    let score = 0;
    let gameOver = false;

    // Player ship
    const ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        angle: 0,
        thrust: 0.1,
        friction: 0.99,
        size: 15,
        invincible: 0
    };

    // Bullets
    const bullets = [];

    // Asteroids
    const asteroids = [];

    // Particles
    const particles = [];

    // Generate random polygon points
    function generateAsteroidPoints(size) {
        const points = [];
        const numPoints = 8 + Math.floor(Math.random() * 4);
        const angleStep = (Math.PI * 2) / numPoints;
        for (let i = 0; i < numPoints; i++) {
            const angle = i * angleStep;
            const radius = size * (0.7 + Math.random() * 0.3);
            points.push({
                x: Math.cos(angle) * radius,
                y: Math.sin(angle) * radius
            });
        }
        return points;
    }

    // Create asteroid
    function createAsteroid(x, y, size, vx, vy) {
        return {
            x: x,
            y: y,
            vx: vx,
            vy: vy,
            size: size,
            points: generateAsteroidPoints(size),
            angle: Math.random() * Math.PI * 2,
            rotation: (Math.random() - 0.5) * 0.1
        };
    }

    // Initialize asteroids
    function initAsteroids() {
        asteroids.length = 0;
        for (let i = 0; i < 5; i++) {
            const size = 30 + Math.random() * 20;
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const speed = 0.5 + Math.random() * 1.5;
            const angle = Math.random() * Math.PI * 2;
            asteroids.push(createAsteroid(
                x, y, size,
                Math.cos(angle) * speed,
                Math.sin(angle) * speed
            ));
        }
    }

    // Split asteroid
    function splitAsteroid(asteroid) {
        const newSize = asteroid.size * 0.6;
        if (newSize < 10) {
            // Small asteroid destroyed
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: asteroid.x,
                    y: asteroid.y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    life: 30
                });
            }
            score += 100;
        } else {
            // Split into two smaller asteroids
            for (let i = 0; i < 2; i++) {
                const speed = 1 + Math.random() * 2;
                const angle = Math.random() * Math.PI * 2;
                asteroids.push(createAsteroid(
                    asteroid.x, asteroid.y, newSize,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed
                ));
            }
            score += 50;
        }
    }

    // Update game
    function update() {
        if (gameOver) return;

        // Ship controls
        if (keys['ArrowLeft']) {
            ship.angle -= 0.08;
        }
        if (keys['ArrowRight']) {
            ship.angle += 0.08;
        }
        if (keys['ArrowUp']) {
            ship.vx += Math.cos(ship.angle) * ship.thrust;
            ship.vy += Math.sin(ship.angle) * ship.thrust;
        }
        if (keys['Space']) {
            // Shoot
            if (bullets.length < 10) {
                bullets.push({
                    x: ship.x + Math.cos(ship.angle) * ship.size,
                    y: ship.y + Math.sin(ship.angle) * ship.size,
                    vx: Math.cos(ship.angle) * 5 + ship.vx,
                    vy: Math.sin(ship.angle) * 5 + ship.vy,
                    life: 60
                });
            }
            keys['Space'] = false;
        }

        // Apply friction
        ship.vx *= ship.friction;
        ship.vy *= ship.friction;

        // Update ship position
        ship.x += ship.vx;
        ship.y += ship.vy;

        // Wrap ship around screen
        if (ship.x < 0) ship.x = canvas.width;
        if (ship.x > canvas.width) ship.x = 0;
        if (ship.y < 0) ship.y = canvas.height;
        if (ship.y > canvas.height) ship.y = 0;

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;

            // Wrap bullets
            if (b.x < 0) b.x = canvas.width;
            if (b.x > canvas.width) b.x = 0;
            if (b.y < 0) b.y = canvas.height;
            if (b.y > canvas.height) b.y = 0;

            if (b.life <= 0) {
                bullets.splice(i, 1);
            }
        }

        // Update asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            a.angle += a.rotation;

            // Wrap asteroids
            if (a.x < 0) a.x = canvas.width;
            if (a.x > canvas.width) a.x = 0;
            if (a.y < 0) a.y = canvas.height;
            if (a.y > canvas.height) a.y = 0;

            // Check collision with bullets
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < a.size) {
                    // Hit!
                    splitAsteroid(a);
                    asteroids.splice(i, 1);
                    bullets.splice(j, 1);
                    break;
                }
            }

            // Check collision with ship
            if (ship.invincible <= 0) {
                const dx = a.x - ship.x;
                const dy = a.y - ship.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < a.size + ship.size) {
                    gameOver = true;
                }
            }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        // Update score
        scoreEl.textContent = 'SCORE: ' + score;

        // Check win condition
        if (asteroids.length === 0) {
            initAsteroids();
        }
    }

    // Draw everything
    function draw() {
        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw ship
        if (ship.invincible > 0) {
            ship.invincible--;
        }
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ship.size, 0);
        ctx.lineTo(-ship.size / 2, -ship.size / 1.5);
        ctx.lineTo(-ship.size / 2, ship.size / 1.5);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();

        // Draw bullets
        ctx.fillStyle = '#0f0';
        for (const b of bullets) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw asteroids
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        for (const a of asteroids) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.angle);
            ctx.beginPath();
            if (a.points.length > 0) {
                ctx.moveTo(a.points[0].x, a.points[0].y);
                for (let i = 1; i < a.points.length; i++) {
                    ctx.lineTo(a.points[i].x, a.points[i].y);
                }
                ctx.closePath();
            }
            ctx.stroke();
            ctx.restore();
        }

        // Draw particles
        ctx.fillStyle = '#0f0';
        for (const p of particles) {
            ctx.globalAlpha = p.life / 30;
            ctx.fillRect(p.x, p.y, 2, 2);
            ctx.globalAlpha = 1;
        }

        // Draw game over
        if (gameOver) {
            ctx.fillStyle = '#0f0';
            ctx.font = '48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            ctx.font = '24px monospace';
            ctx.fillText('Refresh to restart', canvas.width / 2, canvas.height / 2 + 40);
        }
    }

    // Game loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Start game
    initAsteroids();
    loop();
</script>
</body>
</html>
