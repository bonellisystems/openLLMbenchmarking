<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Simulator</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  #glcanvas{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script>
// ----- Helper Functions -----
function compileShader(gl, src, type) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(sh));
    return null;
  }
  return sh;
}
function createProgram(gl, vs, fs) {
  const vsh = compileShader(gl, vs, gl.VERTEX_SHADER);
  const fsh = compileShader(gl, fs, gl.FRAGMENT_SHADER);
  const prog = gl.createProgram();
  gl.attachShader(prog, vsh);
  gl.attachShader(prog, fsh);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(prog));
    return null;
  }
  return prog;
}
function createBuffer(gl, data) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  return buf;
}
function createMesh(gl, positions, colors) {
  const prog = createProgram(gl,
    `attribute vec3 aPos;
     attribute vec3 aColor;
     varying vec3 vColor;
     uniform mat4 uMVP;
     void main(void){
       gl_Position = uMVP * vec4(aPos,1.0);
       vColor = aColor;
     }`,
    `precision mediump float;
     varying vec3 vColor;
     void main(void){
       gl_FragColor = vec4(vColor,1.0);
     }`
  );
  gl.useProgram(prog);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  const aColor = gl.getAttribLocation(prog, 'aColor');
  const uMVP = gl.getUniformLocation(prog, 'uMVP');
  const ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
  const indices = new Uint16Array([0,1,2,0,2,3]);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  const posBuf = createBuffer(gl, positions);
  const colBuf = createBuffer(gl, colors);
  gl.enableVertexAttribArray(aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aColor);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);
  return {prog, ibo, uMVP};
}
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1.0/Math.tan(fovy/2), nf = 1/(near-far);
  out[0] = f*aspect; out[1] = 0; out[2] = 0; out[3] = 0;
  out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
  out[8] = 0; out[9] = 0; out[10] = (far+near)*nf; out[11] = -1;
  out[12] = 0; out[13] = 0; out[14] = (2*far*near)*nf; out[15] = 0;
  return out;
}
function mat4LookAt(out, eye, center, up) {
  const z0 = eye[0]-center[0], z1 = eye[1]-center[1], z2 = eye[2]-center[2];
  const length = Math.hypot(z0,z1,z2);
  if (length===0) { out[0]=0;out[1]=0;out[2]=0;out[3]=0;out[4]=0;out[5]=0;out[6]=0;out[7]=0;out[8]=0;out[9]=0;out[10]=0;out[11]=0;out[12]=0;out[13]=0;out[14]=0;out[15]=0; return out; }
  const z = [z0/length, z1/length, z2/length];
  const x = [
    up[1]*z[2] - up[2]*z[1],
    up[2]*z[0] - up[0]*z[2],
    up[0]*z[1] - up[1]*z[0]
  ];
  const xlen = Math.hypot(x[0],x[1],x[2]);
  if (xlen===0) { out[0]=0;out[1]=0;out[2]=0;out[3]=0;out[4]=0;out[5]=0;out[6]=0;out[7]=0;out[8]=0;out[9]=0;out[10]=0;out[11]=0;out[12]=0;out[13]=0;out[14]=0;out[15]=0; return out; }
  const xn = [x[0]/xlen, x[1]/xlen, x[2]/xlen];
  const y = [
    z[1]*xn[2] - z[2]*xn[1],
    z[2]*xn[0] - z[0]*xn[2],
    z[0]*xn[1] - z[1]*xn[0]
  ];
  out[0]=xn[0]; out[1]=y[0]; out[2]=z[0]; out[3]=0;
  out[4]=xn[1]; out[5]=y[1]; out[6]=z[1]; out[7]=0;
  out[8]=xn[2]; out[9]=y[2]; out[10]=z[2]; out[11]=0;
  out[12]=-(xn[0]*eye[0]+xn[1]*eye[1]+xn[2]*eye[2]);
  out[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
  out[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
  out[15]=1;
  return out;
}
function mat4Multiply(out, a, b) {
  const a00=a[0],a01=a[1],a02=a[2],a03=a[3];
  const a10=a[4],a11=a[5],a12=a[6],a13=a[7];
  const a20=a[8],a21=a[9],a22=a[10],a23=a[11];
  const a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  const b00=b[0],b01=b[1],b02=b[2],b03=b[3];
  const b10=b[4],b11=b[5],b12=b[6],b13=b[7];
  const b20=b[8],b21=b[9],b22=b[10],b23=b[11];
  const b30=b[12],b31=b[13],b32=b[14],b33=b[15];
  out[0]=a00*b00+a01*b10+a02*b20+a03*b30;
  out[1]=a00*b01+a01*b11+a02*b21+a03*b31;
  out[2]=a00*b02+a01*b12+a02*b22+a03*b32;
  out[3]=a00*b03+a01*b13+a02*b23+a03*b33;
  out[4]=a10*b00+a11*b10+a12*b20+a13*b30;
  out[5]=a10*b01+a11*b11+a12*b21+a13*b31;
  out[6]=a10*b02+a11*b12+a12*b22+a13*b32;
  out[7]=a10*b03+a11*b13+a12*b23+a13*b33;
  out[8]=a20*b00+a21*b10+a22*b20+a23*b30;
  out[9]=a20*b01+a21*b11+a22*b21+a23*b31;
  out[10]=a20*b02+a21*b12+a22*b22+a23*b32;
  out[11]=a20*b03+a21*b13+a22*b23+a23*b33;
  out[12]=a30*b00+a31*b10+a32*b20+a33*b30;
  out[13]=a30*b01+a31*b11+a32*b21+a33*b31;
  out[14]=a30*b02+a31*b12+a32*b22+a33*b32;
  out[15]=a30*b03+a31*b13+a32*b23+a33*b33;
  return out;
}
function mat4Translate(out, a, v) {
  const x=v[0], y=v[1], z=v[2];
  out[12]=a[0]*x + a[4]*y + a[8]*z + a[12];
  out[13]=a[1]*x + a[5]*y + a[9]*z + a[13];
  out[14]=a[2]*x + a[6]*y + a[10]*z + a[14];
  out[15]=a[3]*x + a[7]*y + a[11]*z + a[15];
  return out;
}
function mat4RotateY(out, a, rad) {
  const c=Math.cos(rad), s=Math.sin(rad);
  out[0]=a[0]*c + a[8]*s;
  out[2]=a[2]*c - a[10]*s;
  out[4]=a[4]*c - a[12]*s;
  out[6]=a[6]*c + a[14]*s;
  out[8]=a[8]*c - a[0]*s;
  out[10]=a[10]*c + a[2]*s;
  out[12]=a[12]*c - a[4]*s;
  out[14]=a[14]*c + a[6]*s;
  out[1]=a[1]; out[3]=a[3]; out[5]=a[5]; out[7]=a[7];
  out[9]=a[9]; out[11]=a[11]; out[13]=a[13]; out[15]=a[15];
  return out;
}
function mat4Scale(out, a, s) {
  out[0]=a[0]*s; out[1]=a[1]*s; out[2]=a[2]*s; out[3]=a[3]*s;
  out[4]=a[4]*s; out[5]=a[5]*s; out[6]=a[6]*s; out[7]=a[7]*s;
  out[8]=a[8]*s; out[9]=a[9]*s; out[10]=a[10]*s; out[11]=a[11]*s;
  out[12]=a[12]*s; out[13]=a[13]*s; out[14]=a[14]*s; out[15]=a[15]*s;
  return out;
}
function lookAt(eye, center, up) {
  const m = new Float32Array(16);
  mat4LookAt(m, eye, center, up);
  return m;
}
function perspective(fovy, aspect, near, far) {
  const m = new Float32Array(16);
  mat4Perspective(m, fovy, aspect, near, far);
  return m;
}
function translate(m, v) {
  const r = new Float32Array(16);
  mat4Translate(r, m, v);
  return r;
}
function rotateY(m, rad) {
  const r = new Float32Array(16);
  mat4RotateY(r, m, rad);
  return r;
}
function scale(m, s) {
  const r = new Float32Array(16);
  mat4Scale(r, m, s);
  return r;
}
function createBuilding(x,z,height,color) {
  const w = 5, d = 5;
  const positions = [
    x-w, z-d, 0,   x+w, z-d, 0,   x+w, z+d, 0,   x-w, z+d, 0,   // bottom
    x-w, z-d, height, x+w, z-d, height, x+w, z+d, height, x-w, z+d, height // top
  ];
  const colors = [
    ...Array(positions.length/3).fill(color)
  ];
  const indices = [
    0,1,2,0,2,3,   // bottom
    4,5,6,4,6,7,   // top
    0,4,7,0,7,3,   // side 1
    1,0,3,1,3,2,   // side 2
    2,1,4,2,4,6,   // side 3
    3,7,6,3,6,5    // side 4
  ];
  const posBuf = createBuffer(gl, positions);
  const colBuf = createBuffer(gl, colors);
  const ibuf = createBuffer(gl, indices);
  const mesh = createMesh(gl, [], []); // dummy to get program
  const prog = mesh.prog;
  // set attributes
  const aPos = gl.getAttribLocation(prog, 'aPos');
  const aColor = gl.getAttribLocation(prog, 'aColor');
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aColor);
  // set index buffer
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibuf);
  // store data for later use
  return {positions:posBuf, colors:colBuf, indices:ibuf, uMVP:gl.getUniformLocation(prog,'uMVP')};
}
function drawBuilding(mesh, mvp, model) {
  const gl = canvas.gl;
  const pos = mesh.positions, col = mesh.colors, idx = mesh.indices;
  const aPos = gl.getAttribLocation(mesh.prog, 'aPos');
  const aColor = gl.getAttribLocation(mesh.prog, 'aColor');
  gl.bindBuffer(gl.ARRAY_BUFFER, pos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER, col);
  gl.vertexAttribPointer(aColor, 3, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(aColor);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx);
  const uMVP = mesh.uMVP;
  gl.uniformMatrix4fv(uMVP, false, mvp);
  // draw
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
}

// ----- Main -----
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { alert('WebGL not supported'); }
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
gl.viewport(0,0,canvas.width,canvas.height);
gl.clearColor(0,0,0,1);
gl.enable(gl.DEPTH_TEST);

// Shaders (same as in createProgram above but extracted for reuse)
const vsSource = `
attribute vec3 aPos;
attribute vec3 aColor;
varying vec3 vColor;
uniform mat4 uMVP;
void main(void){
  gl_Position = uMVP * vec4(aPos,1.0);
  vColor = aColor;
}
`;
const fsSource = `
precision mediump float;
varying vec3 vColor;
void main(void){
  gl_FragColor = vec4(vColor,1.0);
}
`;
const program = createProgram(gl, vsSource, fsSource);
gl.useProgram(program);

// Camera state
let camRadius = 30;
let camYaw = 0;      // rotation around Y
let camPitch = 0;    // elevation
let camX = 0, camY = 0, camZ = 0;
function updateCamera() {
  const r = camRadius;
  const sinP = Math.sin(camPitch);
  const cosP = Math.cos(camPitch);
  camX = r * Math.sin(camYaw) * cosP;
  camY = r * sinP;
  camZ = r * Math.cos(camYaw) * cosP;
}
updateCamera();

// Controls
const keys = {ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false,W:false,S:false,A:false,D:false};
window.addEventListener('keydown', e=>{ keys[e.key]=true; });
window.addEventListener('keyup',   e=>{ keys[e.key]=false; });
function handleKeys(dt) {
  const speed = 15 * dt; // units per second
  const rotSpeed = 1.5 * dt;
  if (keys.ArrowLeft)  camYaw -= rotSpeed;
  if (keys.ArrowRight) camYaw += rotSpeed;
  if (keys.ArrowUp)    camPitch = Math.min(camPitch+rotSpeed, Math.PI/2-0.01);
  if (keys.ArrowDown)  camPitch = Math.max(camPitch-rotSpeed, -Math.PI/2+0.01);
  // forward/backward
  const forward = [Math.sin(camYaw), 0, -Math.cos(camYaw)];
  if (keys.W) { camX += forward[0]*speed; camZ += forward[2]*speed; }
  if (keys.S) { camX -= forward[0]*speed; camZ -= forward[2]*speed; }
  // strafe
  const right = [Math.cos(camYaw), 0, Math.sin(camYaw)];
  if (keys.A) { camX -= right[0]*speed; camZ -= right[2]*speed; }
  if (keys.D) { camX += right[0]*speed; camZ += right[2]*speed; }
  updateCamera();
}
let lastTime = performance.now();
function animate(now) {
  const dt = (now-lastTime)/1000;
  lastTime = now;
  handleKeys(dt);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  // Build simple perspective+view matrix
  const proj = perspective(45, canvas.width/canvas.height, 1, 1000);
  const view = lookAt([camX,camY,camZ], [0,0,0], [0,1,0]);
  const mvp = new Float32Array(16);
  mat4Multiply(mvp, proj, view);
  // Generate buildings around current position (simple grid)
  const gridSize = 10;
  const spacing = 12;
  // Remove old meshes (simple approach: recreate each frame)
  buildings = [];
  const colors = ['#ff5555','#55ff55','#5555ff','#ffdd55','#dd55ff','#55ffdd'];
  for (let ix=-gridSize; ix<=gridSize; ix++) {
    for (let iz=-gridSize; iz<=gridSize; iz++) {
      const dx = ix*spacing, dz = iz*spacing;
      // simple culling: if too far from camera, skip
      const dist = Math.hypot(camX-dx, camZ-dz);
      if (dist > 150) continue;
      const h = 5 + Math.random()*15;
      const mesh = createBuilding(dx, dz, h, colors[Math.floor(Math.random()*colors.length)]);
      buildings.push(mesh);
    }
  }
  // Draw all buildings
  for (const b of buildings) {
    const model = new Float32Array(16);
    // translate to building position
    const t = translate(model, mvp, [b.positions?.[0]?.[0]??0,0, b.positions?.[0]?.[2]??0]); // placeholder
    // Actually we need to compute model matrix: translation only
    const m1 = new Float32Array(16);
    mat4Translate(m1, new Float32Array(16), [dx,0,dz]);
    const m2 = scale(m1, 1); // no scaling
    const m3 = new Float32Array(16);
    mat4Multiply(m3, mvp, m2);
    drawBuilding(b, m3, null);
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;gl.viewport(0,0,canvas.width,canvas.height);});
</script>
</body>
</html>
