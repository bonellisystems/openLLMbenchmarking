<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function rand(a, b) { return a + Math.random() * (b - a); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function makeRock(x, y, size) {
  const verts = [];
  const n = Math.floor(rand(7, 12));
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2;
    const r = size * rand(0.7, 1.0);
    verts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
  }
  return { x, y, size, verts, angle: rand(0, Math.PI * 2), rotSpeed: rand(-0.02, 0.02), vx: rand(-0.5, 0.5), vy: rand(-0.5, 0.5), alive: true };
}

function splitRock(rock) {
  const sizes = { large: 'medium', medium: 'small', small: null };
  const size = sizes[rock.size];
  if (!size) return [];
  const count = size === 'small' ? 1 : 2;
  const newRocks = [];
  for (let i = 0; i < count; i++) {
    const r = makeRock(rock.x + rand(-10, 10), rock.y + rand(-10, 10), size === 'medium' ? 25 : 12);
    r.vx = rock.vx + rand(-1, 1);
    r.vy = rock.vy + rand(-1, 1);
    r.size = size;
    newRocks.push(r);
  }
  return newRocks;
}

const ship = { x: W / 2, y: H / 2, angle: -Math.PI / 2, vx: 0, vy: 0, size: 15, alive: true, thrusting: false, invincible: 0, shootCooldown: 0 };
const bullets = [];
const rocks = [];
const particles = [];
let score = 0;
let lives = 3;
let gameOver = false;
let respawnTimer = 0;
let shake = 0;

function spawnRocks() {
  const count = 4;
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = rand(0, W);
      y = rand(0, H);
    } while (dist({ x, y }, ship) < 200);
    rocks.push(makeRock(x, y, 'large'));
  }
}

function shoot() {
  if (ship.shootCooldown > 0) return;
  ship.shootCooldown = 10;
  bullets.push({
    x: ship.x + Math.cos(ship.angle) * ship.size,
    y: ship.y + Math.sin(ship.angle) * ship.size,
    vx: Math.cos(ship.angle) * 8 + ship.vx * 0.3,
    vy: Math.sin(ship.angle) * 8 + ship.vy * 0.3,
    life: 60
  });
}

function explode(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const a = rand(0, Math.PI * 2);
    const s = rand(1, 4);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 50), color: color || '#fff', size: rand(1, 3) });
  }
}

function resetShip() {
  ship.x = W / 2;
  ship.y = H / 2;
  ship.vx = 0;
  ship.vy = 0;
  ship.alive = true;
  ship.invincible = 120;
  ship.shootCooldown = 0;
}

function init() {
  score = 0;
  lives = 3;
  gameOver = false;
  bullets.length = 0;
  rocks.length = 0;
  particles.length = 0;
  spawnRocks();
  resetShip();
}

init();

function update() {
  if (gameOver) {
    if (keys['Space'] || keys['Enter']) init();
    return;
  }

  if (ship.invincible > 0) ship.invincible--;
  if (ship.shootCooldown > 0) ship.shootCooldown--;

  if (ship.alive) {
    if (keys['ArrowLeft']) ship.angle -= 0.05;
    if (keys['ArrowRight']) ship.angle += 0.05;
    ship.thrusting = keys['ArrowUp'];
    if (ship.thrusting) {
      ship.vx += Math.cos(ship.angle) * 0.15;
      ship.vy += Math.sin(ship.angle) * 0.15;
    }
    if (keys['Space']) shoot();
    ship.vx *= 0.99;
    ship.vy *= 0.99;
    ship.x += ship.vx;
    ship.y += ship.vy;
    if (ship.x < 0) ship.x += W;
    if (ship.x > W) ship.x -= W;
    if (ship.y < 0) ship.y += H;
    if (ship.y > H) ship.y -= H;
  }

  for (const b of bullets) {
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.x < 0) b.x += W;
    if (b.x > W) b.x -= W;
    if (b.y < 0) b.y += H;
    if (b.y > H) b.y -= H;
  }

  for (const r of rocks) {
    r.x += r.vx;
    r.y += r.vy;
    r.angle += r.rotSpeed;
    if (r.x < -r.size) r.x += W + r.size * 2;
    if (r.x > W + r.size) r.x -= W + r.size * 2;
    if (r.y < -r.size) r.y += H + r.size * 2;
    if (r.y > H + r.size) r.y -= H + r.size * 2;
  }

  for (const b of bullets) {
    if (b.life <= 0) continue;
    for (const r of rocks) {
      if (!r.alive) continue;
      if (dist(b, r) < r.size + 3) {
        b.life = 0;
        r.alive = false;
        explode(r.x, r.y, 15, '#aaa');
        const newRocks = splitRock(r);
        rocks.push(...newRocks);
        score += r.size === 'large' ? 20 : r.size === 'medium' ? 50 : 100;
        shake = 5;
        break;
      }
    }
  }

  if (ship.alive && ship.invincible <= 0) {
    for (const r of rocks) {
      if (!r.alive) continue;
      if (dist(ship, r) < ship.size + r.size - 5) {
        ship.alive = false;
        explode(ship.x, ship.y, 30, '#f80');
        lives--;
        shake = 10;
        if (lives <= 0) {
          gameOver = true;
        } else {
          respawnTimer = 60;
        }
        break;
      }
    }
  }

  if (!ship.alive) {
    respawnTimer--;
    if (respawnTimer <= 0) resetShip();
  }

  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life--;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    if (bullets[i].life <= 0) bullets.splice(i, 1);
  }

  for (let i = rocks.length - 1; i >= 0; i--) {
    if (!rocks[i].alive) rocks.splice(i, 1);
  }

  if (rocks.length === 0 && !gameOver) spawnRocks();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0) {
    ctx.translate(rand(-shake, shake), rand(-shake, shake));
    shake *= 0.9;
    if (shake < 0.5) shake = 0;
  }

  for (const p of particles) {
    const a = p.life / 50;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  for (const r of rocks) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.angle);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(r.verts[0].x, r.verts[0].y);
    for (let i = 1; i < r.verts.length; i++) {
      ctx.lineTo(r.verts[i].x, r.verts[i].y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  if (ship.alive && (ship.invincible <= 0 || Math.floor(ship.invincible / 4) % 2 === 0)) {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ship.size, 0);
    ctx.lineTo(-ship.size * 0.7, -ship.size * 0.6);
    ctx.lineTo(-ship.size * 0.4, 0);
    ctx.lineTo(-ship.size * 0.7, ship.size * 0.6);
    ctx.closePath();
    ctx.stroke();
    if (ship.thrusting) {
      ctx.strokeStyle = '#f80';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-ship.size * 0.4, 0);
      ctx.lineTo(-ship.size * 0.9, -ship.size * 0.3);
      ctx.moveTo(-ship.size * 0.4, 0);
      ctx.lineTo(-ship.size * 0.9, ship.size * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  for (const b of bullets) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(b.x - 1, b.y - 1, 3, 3);
  }

  ctx.restore();

  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 20, 30);
  ctx.textAlign = 'right';
  ctx.fillText('LIVES ' + lives, W - 20, 30);

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = '48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
    ctx.font = '20px monospace';
    ctx.fillText('Press SPACE to restart', W / 2, H / 2 + 20);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
