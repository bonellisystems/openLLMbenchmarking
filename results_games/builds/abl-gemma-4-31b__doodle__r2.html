<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #e0f7fa;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let gameOver = false;

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 15,
            vx: 0,
            vy: 0,
            jumpStrength: -10,
            gravity: 0.3,
            speed: 5
        };

        const platforms = [];
        const platformWidth = 60;
        const platformHeight = 15;

        const keys = {};

        function createPlatform(y) {
            return {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                w: platformWidth,
                h: platformHeight
            };
        }

        function init() {
            // Initial platforms
            for (let i = 0; i < 7; i++) {
                platforms.push(createPlatform(canvas.height - (i * 100)));
            }
            // Ensure first platform is under player
            platforms[0].x = canvas.width / 2 - platformWidth / 2;
        }

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (gameOver) return;

            // Horizontal movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
            else if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            // Screen wrap
            if (player.x < -player.radius) player.x = canvas.width + player.radius;
            if (player.x > canvas.width + player.radius) player.x = -player.radius;

            // Platform collision
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.radius > p.x && 
                        player.x - player.radius < p.x + p.w && 
                        player.y + player.radius > p.y && 
                        player.y + player.radius < p.y + p.h + player.vy) {
                        player.vy = player.jumpStrength;
                    }
                });
            }

            // Camera scroll
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);
                platforms.forEach(p => {
                    p.y += diff;
                });
            }

            // Procedural generation
            while (platforms[platforms.length - 1].y < 0) {
                platforms.shift();
                platforms.push(createPlatform(platforms[platforms.length - 1].y - 100));
            }

            // Game over check
            if (player.y > canvas.height) {
                gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw platforms
            ctx.fillStyle = '#4caf50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#388e3c';
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Draw player
            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#bf360c';
            ctx.stroke();

            // Draw score
            ctx.fillStyle = '#333';
            ctx.font = '20px Arial';
            ctx.fillText(`Score: ${score}`, 20, 30);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Refresh to Restart', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
