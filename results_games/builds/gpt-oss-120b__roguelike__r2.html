<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Roguelike</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;overflow:hidden;}
#game{white-space:pre;line-height:1;}
</style>
</head>
<body tabindex="0">
<div id="game"></div>
<script>
(() => {
const WIDTH = 80, HEIGHT = 25;
const map = Array.from({length: HEIGHT}, () => Array(WIDTH).fill('#'));

function rect(x, y, w, h, ch) {
  for (let i = y; i < y + h; i++) {
    for (let j = x; j < x + w; j++) {
      if (i >= 0 && i < HEIGHT && j >= 0 && j < WIDTH) map[i][j] = ch;
    }
  }
}
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function carveH(x1, x2, y) {
  const [a, b] = x1 < x2 ? [x1, x2] : [x2, x1];
  for (let x = a; x <= b; x++) if (map[y][x] === '#') map[y][x] = '.';
}
function carveV(y1, y2, x) {
  const [a, b] = y1 < y2 ? [y1, y2] : [y2, y1];
  for (let y = a; y <= b; y++) if (map[y][x] === '#') map[y][x] = '.';
}

const rooms = [];
const MAX_ROOMS = 8;
const ROOM_MIN = 4, ROOM_MAX = 10;

for (let i = 0; i < MAX_ROOMS; i++) {
  const w = randInt(ROOM_MIN, ROOM_MAX);
  const h = randInt(ROOM_MIN, ROOM_MAX);
  const x = randInt(1, WIDTH - w - 2);
  const y = randInt(1, HEIGHT - h - 2);
  let failed = false;
  for (const r of rooms) {
    if (x < r.x + r.w && x + w > r.x && y < r.y + r.h && y + h > r.y) {
      failed = true; break;
    }
  }
  if (failed) continue;
  rect(x, y, w, h, '.');
  const newRoom = {x, y, w, h, centerX: Math.floor(x + w / 2), centerY: Math.floor(y + h / 2)};
  if (rooms.length > 0) {
    const prev = rooms[rooms.length - 1];
    if (Math.random() < 0.5) {
      carveH(prev.centerX, newRoom.centerX, prev.centerY);
      carveV(prev.centerY, newRoom.centerY, newRoom.centerX);
    } else {
      carveV(prev.centerY, newRoom.centerY, prev.centerX);
      carveH(prev.centerX, newRoom.centerX, newRoom.centerY);
    }
  }
  rooms.push(newRoom);
}

let player = {x: rooms[0].centerX, y: rooms[0].centerY};

function draw() {
  const lines = [];
  for (let y = 0; y < HEIGHT; y++) {
    let row = '';
    for (let x = 0; x < WIDTH; x++) {
      row += (x === player.x && y === player.y) ? '@' : map[y][x];
    }
    lines.push(row);
  }
  document.getElementById('game').textContent = lines.join('\n');
}
function move(dx, dy) {
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || nx >= WIDTH || ny < 0 || ny >= HEIGHT) return;
  if (map[ny][nx] === '.') { player.x = nx; player.y = ny; }
}
document.body.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w') move(0, -1);
  else if (k === 'ArrowDown' || k === 's') move(0, 1);
  else if (k === 'ArrowLeft' || k === 'a') move(-1, 0);
  else if (k === 'ArrowRight' || k === 'd') move(1, 0);
  draw();
});
draw();
document.body.focus();
})();
</script>
</body>
</html>
