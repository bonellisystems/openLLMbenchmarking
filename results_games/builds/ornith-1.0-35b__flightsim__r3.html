<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flight Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud {
  position: fixed; top: 20px; left: 20px; color: #0f0;
  font-family: 'Courier New', monospace; font-size: 14px;
  text-shadow: 0 0 5px #0f0; pointer-events: none;
  line-height: 1.8;
}
#crosshair {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none; color: rgba(255,255,255,0.4);
  font-size: 24px;
}
#controls {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.5);
  font-family: 'Courier New', monospace; font-size: 12px;
  text-align: center; pointer-events: none;
  background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 4px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="crosshair">+</div>
<div id="controls">W/S: Pitch &nbsp; A/D: Roll &nbsp; Q/E: Yaw &nbsp; Shift/Space: Throttle &nbsp; R: Reset</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
if (!gl) { alert('WebGL not supported'); }

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// Matrix math
const Mat4 = {
  create() { const m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; },
  perspective(out, fovy, aspect, near, far) {
    const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
    out[0]=f/aspect; out[1]=0; out[2]=0; out[3]=0;
    out[4]=0; out[5]=f; out[6]=0; out[7]=0;
    out[8]=0; out[9]=0; out[10]=(far+near)*nf; out[11]=-1;
    out[12]=0; out[13]=0; out[14]=2*far*near*nf; out[15]=0;
    return out;
  },
  lookAt(out, eye, center, up) {
    let x0,x1,x2,y0,y1,y2,z0,z1,z2,len;
    z0=eye[0]-center[0]; z1=eye[1]-center[1]; z2=eye[2]-center[2];
    len=1/Math.hypot(z0,z1,z2); z0*=len; z1*=len; z2*=len;
    x0=up[1]*z2-up[2]*z1; x1=up[2]*z0-up[0]*z2; x2=up[0]*z1-up[1]*z0;
    len=Math.hypot(x0,x1,x2); if(len){len=1/len; x0*=len; x1*=len; x2*=len;}
    y0=z1*x2-z2*x1; y1=z2*x0-z0*x2; y2=z0*x1-z1*x0;
    len=Math.hypot(y0,y1,y2); if(len){len=1/len; y0*=len; y1*=len; y2*=len;}
    out[0]=x0;out[1]=y0;out[2]=z0;out[3]=0;
    out[4]=x1;out[5]=y1;out[6]=z1;out[7]=0;
    out[8]=x2;out[9]=y2;out[10]=z2;out[11]=0;
    out[12]=-(x0*eye[0]+x1*eye[1]+x2*eye[2]);
    out[13]=-(y0*eye[0]+y1*eye[1]+y2*eye[2]);
    out[14]=-(z0*eye[0]+z1*eye[1]+z2*eye[2]);
    out[15]=1;
    return out;
  },
  multiply(out, a, b) {
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],
          a10=a[4],a11=a[5],a12=a[6],a13=a[7],
          a20=a[8],a21=a[9],a22=a[10],a23=a[11],
          a30=a[12],a31=a[13],a32=a[14],a33=a[15];
    let b0,b1,b2,b3;
    b0=b[0];b1=b[1];b2=b[2];b3=b[3];
    out[0]=b0*a00+b1*a10+b2*a20+b3*a30;out[1]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[2]=b0*a02+b1*a12+b2*a22+b3*a32;out[3]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[4];b1=b[5];b2=b[6];b3=b[7];
    out[4]=b0*a00+b1*a10+b2*a20+b3*a30;out[5]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[6]=b0*a02+b1*a12+b2*a22+b3*a32;out[7]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[8];b1=b[9];b2=b[10];b3=b[11];
    out[8]=b0*a00+b1*a10+b2*a20+b3*a30;out[9]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[10]=b0*a02+b1*a12+b2*a22+b3*a32;out[11]=b0*a03+b1*a13+b2*a23+b3*a33;
    b0=b[12];b1=b[13];b2=b[14];b3=b[15];
    out[12]=b0*a00+b1*a10+b2*a20+b3*a30;out[13]=b0*a01+b1*a11+b2*a21+b3*a31;
    out[14]=b0*a02+b1*a12+b2*a22+b3*a32;out[15]=b0*a03+b1*a13+b2*a23+b3*a33;
    return out;
  },
  translate(out, a, v) {
    const x=v[0],y=v[1],z=v[2];
    if(a===out){out[12]=a[0]*x+a[4]*y+a[8]*z+a[12];out[13]=a[1]*x+a[5]*y+a[9]*z+a[13];out[14]=a[2]*x+a[6]*y+a[10]*z+a[14];out[15]=a[3]*x+a[7]*y+a[11]*z+a[15];}
    else{for(let i=0;i<12;i++){out[i]=a[i];}out[12]=a[0]*x+a[4]*y+a[8]*z+a[12];out[13]=a[1]*x+a[5]*y+a[9]*z+a[13];out[14]=a[2]*x+a[6]*y+a[10]*z+a[14];out[15]=a[3]*x+a[7]*y+a[11]*z+a[15];}
    return out;
  },
  rotateY(out, a, rad) {
    const s=Math.sin(rad),c=Math.cos(rad);
    const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a20=a[8],a21=a[9],a22=a[10],a23=a[11];
    if(a!==out){out[4]=a[4];out[5]=a[5];out[6]=a[6];out[7]=a[7];out[12]=a[12];out[13]=a[13];out[14]=a[14];out[15]=a[15];}
    out[0]=a00*c-a20*s;out[1]=a01*c-a21*s;out[2]=a02*c-a22*s;out[3]=a03*c-a23*s;
    out[8]=a00*s+a20*c;out[9]=a01*s+a21*c;out[10]=a02*s+a22*c;out[11]=a03*s+a23*c;
    return out;
  },
  rotateX(out, a, rad) {
    const s=Math.sin(rad),c=Math.cos(rad);
    const a10=a[4],a11=a[5],a12=a[6],a13=a[7],a20=a[8],a21=a[9],a22=a[10],a23=a[11];
    if(a!==out){out[0]=a[0];out[1]=a[1];out[2]=a[2];out[3]=a[3];out[12]=a[12];out[13]=a[13];out[14]=a[14];out[15]=a[15];}
    out[4]=a10*c+a20*s;out[5]=a11*c+a21*s;out[6]=a12*c+a22*s;out[7]=a13*c+a23*s;
    out[8]=a20*c-a10*s;out[9]=a21*c-a11*s;out[10]=a22*c-a12*s;out[11]=a23*c-a13*s;
    return out;
  },
  scale(out, a, v) {
    const x=v[0],y=v[1],z=v[2];
    out[0]=a[0]*x;out[1]=a[1]*x;out[2]=a[2]*x;out[3]=a[3]*x;
    out[4]=a[4]*y;out[5]=a[5]*y;out[6]=a[6]*y;out[7]=a[7]*y;
    out[8]=a[8]*z;out[9]=a[9]*z;out[10]=a[10]*z;out[11]=a[11]*z;
    out[12]=a[12];out[13]=a[13];out[14]=a[14];out[15]=a[15];
    return out;
  },
  identity(out) {
    for(let i=0;i<16;i++) out[i]=(i%5===0)?1:0;
    return out;
  }
};

// Shader compilation
function createShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function createProgram(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, createShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, createShader(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

// Main shader
const mainVS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
varying vec3 vNorm;
varying vec3 vWorldPos;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vNorm = mat3(uModel) * aNorm;
  gl_Position = uProj * uView * wp;
}`;

const mainFS = `
precision mediump float;
varying vec3 vNorm;
varying vec3 vWorldPos;
uniform vec3 uColor;
uniform vec3 uLightDir;
uniform float uFog;
uniform vec3 uFogColor;
uniform float uAlpha;
void main() {
  vec3 n = normalize(vNorm);
  float diff = max(dot(n, normalize(uLightDir)), 0.0);
  float amb = 0.35;
  vec3 col = uColor * (amb + diff * 0.65);
  float dist = length(vWorldPos);
  float fog = clamp((dist - uFog) / 800.0, 0.0, 1.0);
  col = mix(col, uFogColor, fog);
  gl_FragColor = vec4(col, uAlpha);
}`;

const skyVS = `
attribute vec3 aPos;
uniform mat4 uView;
uniform mat4 uProj;
void main() {
  gl_Position = uProj * uView * vec4(aPos, 1.0);
}`;

const skyFS = `
precision mediump float;
void main() {
  float y = gl_FragCoord.y / 800.0;
  vec3 top = vec3(0.15, 0.3, 0.6);
  vec3 bot = vec3(0.5, 0.65, 0.85);
  vec3 col = mix(bot, top, pow(y, 0.6));
  gl_FragColor = vec4(col, 1.0);
}`;

const groundVS = `
attribute vec3 aPos;
attribute vec2 aUV;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
varying vec2 vUV;
varying vec3 vWorldPos;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vUV = aUV;
  gl_Position = uProj * uView * wp;
}`;

const groundFS = `
precision mediump float;
varying vec2 vUV;
varying vec3 vWorldPos;
uniform vec3 uLightDir;
uniform float uFog;
uniform vec3 uFogColor;
void main() {
  vec2 uv = vUV;
  float grid = 0.0;
  vec2 g = fract(uv * 20.0);
  if (abs(g.x - 0.5) < 0.02 || abs(g.y - 0.5) < 0.02) grid = 1.0;
  vec3 col = vec3(0.12, 0.14, 0.12) + grid * vec3(0.05, 0.06, 0.05);
  float dist = length(vWorldPos);
  float fog = clamp((dist - uFog) / 800.0, 0.0, 1.0);
  col = mix(col, uFogColor, fog);
  gl_FragColor = vec4(col, 1.0);
}`;

const cloudVS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;
varying vec3 vNorm;
varying vec3 vWorldPos;
void main() {
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorldPos = wp.xyz;
  vNorm = mat3(uModel) * aNorm;
  gl_Position = uProj * uView * wp;
}`;

const cloudFS = `
precision mediump float;
varying vec3 vNorm;
varying vec3 vWorldPos;
uniform vec3 uLightDir;
uniform float uFog;
uniform vec3 uFogColor;
void main() {
  vec3 n = normalize(vNorm);
  float diff = max(dot(n, normalize(uLightDir)), 0.0);
  float amb = 0.7;
  vec3 col = vec3(1.0) * (amb + diff * 0.3);
  float dist = length(vWorldPos);
  float fog = clamp((dist - uFog) / 600.0, 0.0, 1.0);
  col = mix(col, uFogColor, fog * 0.5);
  gl_FragColor = vec4(col, 0.85);
}`;

const program = createProgram(mainVS, mainFS);
const skyProgram = createProgram(skyVS, skyFS);
const groundProgram = createProgram(groundVS, groundFS);
const cloudProgram = createProgram(cloudVS, cloudFS);

// Geometry helpers
function createBuffer(data) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  return b;
}
function createIndexBuffer(data) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(data), gl.STATIC_DRAW);
  return b;
}

// Box geometry
function createBox(w, h, d) {
  const hw=w/2, hh=h/2, hd=d/2;
  const verts = [
    // Front
    -hw,-hh,hd, 0,0,1,  hw,-hh,hd, 0,0,1,  hw, hh,hd, 0,0,1, -hw, hh,hd, 0,0,1,
    // Back
     hw,-hh,-hd, 0,0,-1, -hw,-hh,-hd, 0,0,-1, -hw, hh,-hd, 0,0,-1,  hw, hh,-hd, 0,0,-1,
    // Top
    -hw, hh,hd, 0,1,0,  hw, hh,hd, 0,1,0,  hw, hh,-hd, 0,1,0, -hw, hh,-hd, 0,1,0,
    // Bottom
    -hw,-hh,-hd, 0,-1,0,  hw,-hh,-hd, 0,-1,0,  hw,-hh,hd, 0,-1,0, -hw,-hh,hd, 0,-1,0,
    // Right
     hw,-hh,hd, 1,0,0,  hw,-hh,-hd, 1,0,0,  hw, hh,-hd, 1,0,0,  hw, hh,hd, 1,0,0,
    // Left
    -hw,-hh,-hd,-1,0,0, -hw,-hh,hd,-1,0,0, -hw, hh,hd,-1,0,0, -hw, hh,-hd,-1,0,0,
  ];
  const idx = [];
  for(let f=0;f<6;f++){const o=f*4;idx.push(o,o+1,o+2,o,o+2,o+3);}
  return { verts, idx };
}

// Plane geometry
function createPlane() {
  const verts = [];
  const idx = [];
  let vi = 0;

  function addFace(v, n) {
    for(const p of v) { verts.push(p[0],p[1],p[2],n[0],n[1],n[2]); }
    idx.push(vi,vi+1,vi+2, vi,vi+2,vi+3);
    vi += 4;
  }

  // Fuselage - elongated diamond shape
  const f = [
    // Top
    [[0,0.4,1.5],[0,0.4,-1.5],[0,0.4,-2.5],[0,0.4,2.5]],
    // Bottom
    [[0,-0.1,1.5],[0,-0.1,-1.5],[0,-0.1,-2.5],[0,-0.1,2.5]],
    // Left
    [[-0.3,0.2,1.5],[-0.3,-0.1,1.5],[-0.3,-0.1,-2.5],[-0.3,0.2,-2.5]],
    // Right
    [[0.3,0.2,1.5],[0.3,-0.1,1.5],[0.3,-0.1,-2.5],[0.3,0.2,-2.5]],
  ];
  addFace(f[0], [0,1,0]);
  addFace(f[1], [0,-1,0]);
  addFace(f[2], [-1,0,0]);
  addFace(f[3], [1,0,0]);

  // Nose cone
  const nose = [
    [[0,0.35,2.5],[0,0.35,3.5],[0,-0.05,3.5],[0,-0.05,2.5]],
    [[0.25,0.2,2.5],[0.25,0.2,3.5],[0,-0.05,3.5],[0,-0.05,2.5]],
    [[-0.25,0.2,2.5],[-0.25,0.2,3.5],[0,-0.05,3.5],[0,-0.05,2.5]],
  ];
  addFace(nose[0], [0,0.7,0.7]);
  addFace(nose[1], [0.7,0.3,0.7]);
  addFace(nose[2], [-0.7,0.3,0.7]);

  // Wings
  const wing = [
    // Top
    [[-3.5,0.05,0],[-0.5,0.05,0.3],[-0.5,0.05,-0.3],[-3.5,0.05,0]],
    // Bottom
    [[-3.5,-0.05,0],[-0.5,-0.05,0.3],[-0.5,-0.05,-0.3],[-3.5,-0.05,0]],
  ];
  addFace(wing[0], [0,0.1,0]);
  addFace(wing[1], [0,-0.1,0]);

  // Wing tips (trapezoid approximation)
  const wingTip = [
    [[-3.5,0.05,0],[-3.5,0.05,1.2],[-3.5,-0.05,1.2],[-3.5,-0.05,0]],
    [[-3.5,0.05,0],[-3.5,0.05,-1.2],[-3.5,-0.05,-1.2],[-3.5,-0.05,0]],
  ];
  addFace(wingTip[0], [-1,0,0]);
  addFace(wingTip[1], [-1,0,0]);

  // Tail wing (horizontal stabilizer)
  const tailW = [
    [[0.5,0.05,-1.5],[2.5,0.05,-1.5],[2.5,0.05,1.5],[0.5,0.05,1.5]],
    [[0.5,-0.05,-1.5],[2.5,-0.05,-1.5],[2.5,-0.05,1.5],[0.5,-0.05,1.5]],
  ];
  addFace(tailW[0], [0,0.1,0]);
  addFace(tailW[1], [0,-0.1,0]);

  // Tail fin (vertical stabilizer)
  const tailF = [
    [[0,0.4,-0.8],[0,1.2,-0.8],[0,1.2,0.8],[0,0.4,0.8]],
    [[0.15,0.4,-0.8],[0.15,1.2,-0.8],[0.15,1.2,0.8],[0.15,0.4,0.8]],
    [[-0.15,0.4,-0.8],[-0.15,1.2,-0.8],[-0.15,1.2,0.8],[-0.15,0.4,0.8]],
  ];
  addFace(tailF[0], [0,1,0]);
  addFace(tailF[1], [1,0,0]);
  addFace(tailF[2], [-1,0,0]);

  // Engine nacelles
  for (const side of [-1, 1]) {
    const eng = [
      [[side*0.8, -0.1, 0.5],[side*1.2, -0.1, 0.7],[side*1.2, -0.1, -0.7],[side*0.8, -0.1, -0.7]],
      [[side*0.8, 0.15, 0.5],[side*1.2, 0.15, 0.7],[side*1.2, 0.15, -0.7],[side*0.8, 0.15, -0.7]],
      [[side*0.8, -0.1, 0.5],[side*0.8, 0.15, 0.5],[side*1.2, 0.15, 0.7],[side*1.2, -0.1, 0.7]],
      [[side*0.8, -0.1, -0.7],[side*1.2, -0.1, -0.7],[side*1.2, 0.15, -0.7],[side*0.8, 0.15, -0.7]],
    ];
    addFace(eng[0], [0,-1,0]);
    addFace(eng[1], [0,1,0]);
    addFace(eng[2], [0,0,1]);
    addFace(eng[3], [0,0,-1]);
  }

  return { verts, idx };
}

// Sphere-ish geometry for clouds
function createSphere(r, seg) {
  const verts = [], idx = [];
  for (let lat = 0; lat <= seg; lat++) {
    const theta = lat * Math.PI / seg;
    const sinT = Math.sin(theta), cosT = Math.cos(theta);
    for (let lon = 0; lon <= seg; lon++) {
      const phi = lon * 2 * Math.PI / seg;
      const x = Math.cos(phi) * sinT, y = cosT, z = Math.sin(phi) * sinT;
      verts.push(r*x, r*y, r*z, x, y, z);
    }
  }
  for (let lat = 0; lat < seg; lat++) {
    for (let lon = 0; lon < seg; lon++) {
      const a = lat*(seg+1)+lon, b = a+seg+1;
      idx.push(a, b, a+1, b, b+1, a+1);
    }
  }
  return { verts, idx };
}

// Create ground plane
const groundSize = 2000;
const gVerts = [-groundSize/2,0,groundSize/2, 0,0,0,  groundSize/2,0,groundSize/2, 1,0,0,
                 groundSize/2,0,-groundSize/2, 1,0,0, -groundSize/2,0,-groundSize/2, 0,0,0];
const gIdx = [0,1,2, 0,2,3];
const groundVB = createBuffer(gVerts);
const groundIB = createIndexBuffer(gIdx);

// Create sky sphere
const skyVerts = [];
const skyIdx = [];
const skyR = 1500;
const skySeg = 16;
for (let lat = 0; lat <= skySeg; lat++) {
  const theta = lat * Math.PI / skySeg;
  const sinT = Math.sin(theta), cosT = Math.cos(theta);
  for (let lon = 0; lon <= skySeg; lon++) {
    const phi = lon * 2 * Math.PI / skySeg;
    skyVerts.push(skyR*Math.cos(phi)*sinT, skyR*cosT, skyR*Math.sin(phi)*sinT);
  }
}
for (let lat = 0; lat < skySeg; lat++) {
  for (let lon = 0; lon < skySeg; lon++) {
    const a = lat*(skySeg+1)+lon, b = a+skySeg+1;
    skyIdx.push(a, a+1, b, b, a+1, b+1);
  }
}
const skyVB = createBuffer(skyVerts);
const skyIB = createIndexBuffer(skyIdx);

// Create plane mesh
const planeGeo = createPlane();
const planeVB = createBuffer(planeGeo.verts);
const planeIB = createIndexBuffer(planeGeo.idx);

// Create cloud geometry
const cloudGeo = createSphere(1, 8);
const cloudVB = createBuffer(cloudGeo.verts);
const cloudIB = createIndexBuffer(cloudGeo.idx);

// Procedural city
const buildings = [];
const rng = (seed) => { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; };
const rand = rng(42);

const citySize = 800;
const blockSize = 30;
const roadWidth = 8;

for (let x = -citySize/2; x < citySize/2; x += blockSize) {
  for (let z = -citySize/2; z < citySize/2; z += blockSize) {
    if (rand() < 0.15) continue; // empty lot
    const numBuildings = 1 + Math.floor(rand() * 3);
    for (let b = 0; b < numBuildings; b++) {
      const bw = 5 + rand() * 12;
      const bd = 5 + rand() * 12;
      const bh = 10 + rand() * 80;
      const ox = x + rand() * (blockSize - bw);
      const oz = z + rand() * (blockSize - bd);
      // Color based on height
      const hue = rand();
      const sat = 0.1 + rand() * 0.3;
      const lit = 0.2 + rand() * 0.35;
      const r = Math.floor((Math.sin(hue*6.28)*0.5+0.5)*sat + lit*0.3);
      const g = Math.floor((Math.sin(hue*6.28+2)*0.5+0.5)*sat + lit*0.3);
      const b2 = Math.floor((Math.sin(hue*6.28+4)*0.5+0.5)*sat + lit*0.3);
      buildings.push({ x: ox, y: bh/2, z: oz, sx: bw/2, sy: bh/2, sz: bd/2,
        color: [r/255, g/255, b2/255] });
    }
  }
}

// Clouds
const clouds = [];
for (let i = 0; i < 60; i++) {
  clouds.push({
    x: (rand() - 0.5) * 1600,
    y: 150 + rand() * 200,
    z: (rand() - 0.5) * 1600,
    s: 20 + rand() * 40,
    scale: 0.5 + rand() * 1.5
  });
}

// Flight state
const state = {
  pos: [0, 120, 100],
  vel: 0.8,
  pitch: 0,
  roll: 0,
  yaw: 0,
  throttle: 0.5,
  maxSpeed: 3.0,
  minSpeed: 0.3
};

const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

// Uniform locations
const uModel = gl.getUniformLocation(program, 'uModel');
const uView = gl.getUniformLocation(program, 'uView');
const uProj = gl.getUniformLocation(program, 'uProj');
const uColor = gl.getUniformLocation(program, 'uColor');
const uLightDir = gl.getUniformLocation(program, 'uLightDir');
const uFog = gl.getUniformLocation(program, 'uFog');
const uFogColor = gl.getUniformLocation(program, 'uFogColor');
const uAlpha = gl.getUniformLocation(program, 'uAlpha');

const uSkyView = gl.getUniformLocation(skyProgram, 'uView');
const uSkyProj = gl.getUniformLocation(skyProgram, 'uProj');

const uGroundModel = gl.getUniformLocation(groundProgram, 'uModel');
const uGroundView = gl.getUniformLocation(groundProgram, 'uView');
const uGroundProj = gl.getUniformLocation(groundProgram, 'uProj');
const uGroundLightDir = gl.getUniformLocation(groundProgram, 'uLightDir');
const uGroundFog = gl.getUniformLocation(groundProgram, 'uFog');
const uGroundFogColor = gl.getUniformLocation(groundProgram, 'uFogColor');

const uCloudModel = gl.getUniformLocation(cloudProgram, 'uModel');
const uCloudView = gl.getUniformLocation(cloudProgram, 'uView');
const uCloudProj = gl.getUniformLocation(cloudProgram, 'uProj');
const uCloudLightDir = gl.getUniformLocation(cloudProgram, 'uLightDir');
const uCloudFog = gl.getUniformLocation(cloudProgram, 'uFog');
const uCloudFogColor = gl.getUniformLocation(cloudProgram, 'uFogColor');

const aPos = gl.getAttribLocation(program, 'aPos');
const aNorm = gl.getAttribLocation(program, 'aNorm');
const aPosSky = gl.getAttribLocation(skyProgram, 'aPos');
const aPosGround = gl.getAttribLocation(groundProgram, 'aPos');
const aUV = gl.getAttribLocation(groundProgram, 'aUV');
const aPosCloud = gl.getAttribLocation(cloudProgram, 'aPos');
const aNormCloud = gl.getAttribLocation(cloudProgram, 'aNorm');

const tmpMat = Mat4.create();
const viewMat = Mat4.create();
const projMat = Mat4.create();
const modelMat = Mat4.create();
const eye = [0, 0, 0];
const center = [0, 0, -1];
const up = [0, 1, 0];

let lastTime = performance.now();

function update(dt) {
  const throttleInput = (keys['ShiftLeft'] || keys['ShiftRight']) ? 1 : (keys['Space'] ? -1 : 0);
  state.throttle = Math.max(0, Math.min(1, state.throttle + throttleInput * dt * 0.5));
  const targetSpeed = state.minSpeed + state.throttle * (state.maxSpeed - state.minSpeed);
  state.vel += (targetSpeed - state.vel) * dt * 2;

  const pitchRate = 1.2;
  const rollRate = 1.8;
  const yawRate = 0.8;

  if (keys['KeyW']) state.pitch -= pitchRate * dt;
  if (keys['KeyS']) state.pitch += pitchRate * dt;
  if (keys['KeyA']) state.roll += rollRate * dt;
  if (keys['KeyD']) state.roll -= rollRate * dt;
  if (keys['KeyQ']) state.yaw -= yawRate * dt;
  if (keys['KeyE']) state.yaw += yawRate * dt;

  // Auto-level roll
  state.roll *= (1 - dt * 2);
  if (Math.abs(state.roll) < 0.01) state.roll = 0;

  // Pitch limits
  state.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, state.pitch));

  // Compute direction from yaw + pitch
  const cosP = Math.cos(state.pitch), sinP = Math.sin(state.pitch);
  const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);

  state.pos[0] += sinY * cosP * state.vel * dt * 60;
  state.pos[1] += sinP * state.vel * dt * 60;
  state.pos[2] += cosY * cosP * state.vel * dt * 60;

  // Ground collision
  if (state.pos[1] < 3) { state.pos[1] = 3; state.pitch = Math.abs(state.pitch) * 0.5; }

  if (keys['KeyR']) {
    state.pos = [0, 120, 100];
    state.vel = 0.8; state.pitch = 0; state.roll = 0; state.yaw = 0; state.throttle = 0.5;
  }
}

function render() {
  gl.clearColor(0.5, 0.65, 0.85, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);

  const aspect = canvas.width / canvas.height;
  Mat4.perspective(projMat, Math.PI / 3.5, aspect, 1, 3000);

  // Camera
  const cosP = Math.cos(state.pitch), sinP = Math.sin(state.pitch);
  const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
  eye[0] = state.pos[0];
  eye[1] = state.pos[1];
  eye[2] = state.pos[2];
  center[0] = state.pos[0] + sinY * cosP;
  center[1] = state.pos[1] + sinP;
  center[2] = state.pos[2] + cosY * cosP;
  Mat4.lookAt(viewMat, eye, center, up);

  // Sky
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(skyProgram);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyVB);
  gl.enableVertexAttribArray(aPosSky);
  gl.vertexAttribPointer(aPosSky, 3, gl.FLOAT, false, 0, 0);
  gl.uniformMatrix4fv(uSkyView, false, viewMat);
  gl.uniformMatrix4fv(uSkyProj, false, projMat);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, skyIB);
  gl.drawElements(gl.TRIANGLES, skyIdx.length, gl.UNSIGNED_SHORT, 0);
  gl.disableVertexAttribArray(aPosSky);
  gl.enable(gl.DEPTH_TEST);

  // Ground
  gl.useProgram(groundProgram);
  gl.bindBuffer(gl.ARRAY_BUFFER, groundVB);
  gl.enableVertexAttribArray(aPosGround);
  gl.vertexAttribPointer(aPosGround, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(AUV);
  gl.vertexAttribPointer(AUV, 2, gl.FLOAT, false, 24, 12);
  Mat4.identity(modelMat);
  gl.uniformMatrix4fv(uGroundModel, false, modelMat);
  gl.uniformMatrix4fv(uGroundView, false, viewMat);
  gl.uniformMatrix4fv(uGroundProj, false, projMat);
  gl.uniform3f(uGroundLightDir, 0.5, 1.0, 0.3);
  gl.uniform1f(uGroundFog, 300);
  gl.uniform3f(uGroundFogColor, 0.5, 0.65, 0.85);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, groundIB);
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  gl.disableVertexAttribArray(aPosGround);
  gl.disableVertexAttribArray(AUV);

  // Main program
  gl.useProgram(program);
  gl.uniformMatrix4fv(uView, false, viewMat);
  gl.uniformMatrix4fv(uProj, false, projMat);
  gl.uniform3f(uLightDir, 0.5, 1.0, 0.3);
  gl.uniform1f(uFog, 200);
  gl.uniform3f(uFogColor, 0.5, 0.65, 0.85);

  gl.bindBuffer(gl.ARRAY_BUFFER, planeVB);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(aNorm);
  gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 24, 12);

  Mat4.identity(modelMat);
  Mat4.translate(modelMat, modelMat, state.pos);
  Mat4.rotateX(modelMat, modelMat, state.pitch);
  Mat4.rotateY(modelMat, modelMat, state.yaw);
  Mat4.rotateZ(modelMat, modelMat, state.roll);
  gl.uniformMatrix4fv(uModel, false, modelMat);
  gl.uniform3f(uColor, 0.9, 0.15, 0.1);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, planeIB);
  gl.drawElements(gl.TRIANGLES, planeGeo.idx.length, gl.UNSIGNED_SHORT, 0);

  // Buildings
  gl.bindBuffer(gl.ARRAY_BUFFER, planeVB);
  for (const b of buildings) {
    Mat4.identity(modelMat);
    Mat4.translate(modelMat, modelMat, [b.x, b.y, b.z]);
    Mat4.scale(modelMat, modelMat, [b.sx, b.sy, b.sz]);
    gl.uniformMatrix4fv(uModel, false, modelMat);
    gl.uniform3f(uColor, b.color[0], b.color[1], b.color[2]);
    gl.drawElements(gl.TRIANGLES, planeGeo.idx.length, gl.UNSIGNED_SHORT, 0);
  }

  // Clouds
  gl.useProgram(cloudProgram);
  gl.uniformMatrix4fv(uCloudView, false, viewMat);
  gl.uniformMatrix4fv(uCloudProj, false, projMat);
  gl.uniform3f(uCloudLightDir, 0.5, 1.0, 0.3);
  gl.uniform1f(uCloudFog, 300);
  gl.uniform3f(uCloudFogColor, 0.5, 0.65, 0.85);

  gl.bindBuffer(gl.ARRAY_BUFFER, cloudVB);
  gl.enableVertexAttribArray(aPosCloud);
  gl.vertexAttribPointer(aPosCloud, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(aNormCloud);
  gl.vertexAttribPointer(aNormCloud, 3, gl.FLOAT, false, 24, 12);

  for (const c of clouds) {
    Mat4.identity(modelMat);
    Mat4.translate(modelMat, modelMat, [c.x, c.y, c.z]);
    Mat4.scale(modelMat, modelMat, [c.scale, c.scale, c.scale]);
    gl.uniformMatrix4fv(uCloudModel, false, modelMat);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, cloudIB);
    gl.drawElements(gl.TRIANGLES, cloudGeo.idx.length, gl.UNSIGNED_SHORT, 0);
  }

  gl.disableVertexAttribArray(aPosCloud);
  gl.disableVertexAttribArray(aNormCloud);
}

// Fix the AUV references
const AUV = gl.getAttribLocation(groundProgram, 'aUV');

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();

  // HUD
  const speed = (state.vel * 200).toFixed(0);
  const alt = (state.pos[1] * 3.28).toFixed(0);
  const heading = (((state.yaw * 180 / Math.PI) % 360 + 360) % 360).toFixed(0);
  const pitchDeg = (state.pitch * 180 / Math.PI).toFixed(1);
  const rollDeg = (state.roll * 180 / Math.PI).toFixed(1);
  document.getElementById('hud').innerHTML =
    `SPD: ${speed} kt<br>ALT: ${alt} ft<br>HDG: ${heading}°<br>PIT: ${pitchDeg}°<br>ROL: ${rollDeg}°<br>THR: ${(state.throttle*100).toFixed(0)}%`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
