<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 800;
canvas.height = 600;

const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

let ship, asteroids, bullets, particles, score, lives, level, gameOver, invulnTimer, shootCooldown;

function rand(min, max) { return Math.random() * (max - min) + min; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function createShip() {
    return {
        x: canvas.width / 2,
        y: canvas.height / 2,
        angle: -Math.PI / 2,
        vx: 0,
        vy: 0,
        radius: 15,
        thrusting: false
    };
}

function createAsteroid(x, y, size) {
    const numVerts = Math.floor(rand(7, 12));
    const verts = [];
    const baseRadius = size === 'large' ? 40 : size === 'medium' ? 25 : 15;
    for (let i = 0; i < numVerts; i++) {
        const angle = (i / numVerts) * Math.PI * 2;
        const r = baseRadius * rand(0.7, 1.3);
        verts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    const speed = size === 'large' ? rand(0.5, 1.5) : size === 'medium' ? rand(1, 2.5) : rand(1.5, 3.5);
    const angle = rand(0, Math.PI * 2);
    return {
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        verts,
        size,
        radius: baseRadius,
        rotAngle: 0,
        rotSpeed: rand(-0.02, 0.02)
    };
}

function createBullet(ship) {
    const speed = 7;
    return {
        x: ship.x + Math.cos(ship.angle) * 20,
        y: ship.y + Math.sin(ship.angle) * 20,
        vx: Math.cos(ship.angle) * speed + ship.vx * 0.3,
        vy: Math.sin(ship.angle) * speed + ship.vy * 0.3,
        life: 60
    };
}

function createParticle(x, y, vx, vy, life, color) {
    return { x, y, vx, vy, life, maxLife: life, color };
}

function spawnAsteroids(count) {
    const arr = [];
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = rand(50, canvas.width - 50);
            y = rand(50, canvas.height - 50);
        } while (dist({x, y}, ship) < 150);
        arr.push(createAsteroid(x, y, 'large'));
    }
    return arr;
}

function initGame() {
    ship = createShip();
    asteroids = spawnAsteroids(4);
    bullets = [];
    particles = [];
    score = 0;
    lives = 3;
    level = 1;
    gameOver = false;
    invulnTimer = 0;
    shootCooldown = 0;
}

function wrap(obj) {
    if (obj.x < -50) obj.x = canvas.width + 50;
    if (obj.x > canvas.width + 50) obj.x = -50;
    if (obj.y < -50) obj.y = canvas.height + 50;
    if (obj.y > canvas.height + 50) obj.y = -50;
}

function updateShip() {
    if (gameOver) return;
    if (keys['ArrowLeft']) ship.angle -= 0.05;
    if (keys['ArrowRight']) ship.angle += 0.05;
    ship.thrusting = keys['ArrowUp'];
    if (ship.thrusting) {
        ship.vx += Math.cos(ship.angle) * 0.15;
        ship.vy += Math.sin(ship.angle) * 0.15;
        particles.push(createParticle(
            ship.x - Math.cos(ship.angle) * 15,
            ship.y - Math.sin(ship.angle) * 15,
            -Math.cos(ship.angle) * rand(1, 3) + rand(-0.5, 0.5),
            -Math.sin(ship.angle) * rand(1, 3) + rand(-0.5, 0.5),
            rand(10, 20),
            '#ff8800'
        ));
    }
    ship.vx *= 0.99;
    ship.vy *= 0.99;
    ship.x += ship.vx;
    ship.y += ship.vy;
    wrap(ship);
    if (invulnTimer > 0) invulnTimer--;
    if (shootCooldown > 0) shootCooldown--;
    if (keys['Space'] && shootCooldown <= 0) {
        bullets.push(createBullet(ship));
        shootCooldown = 8;
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        wrap(b);
        if (b.life <= 0) bullets.splice(i, 1);
    }
}

function updateAsteroids() {
    for (const a of asteroids) {
        a.x += a.vx;
        a.y += a.vy;
        a.rotAngle += a.rotSpeed;
        wrap(a);
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function splitAsteroid(a) {
    const points = a.size === 'large' ? 20 : a.size === 'medium' ? 50 : 100;
    score += points;
    if (a.size !== 'small') {
        const newSize = a.size === 'large' ? 'medium' : 'small';
        for (let i = 0; i < 2; i++) {
            asteroids.push(createAsteroid(a.x, a.y, newSize));
        }
    }
    for (let i = 0; i < 10; i++) {
        particles.push(createParticle(
            a.x, a.y,
            rand(-3, 3), rand(-3, 3),
            rand(15, 30),
            '#aaaaaa'
        ));
    }
}

function checkCollisions() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const a = asteroids[j];
            if (dist(b, a) < a.radius) {
                splitAsteroid(a);
                asteroids.splice(j, 1);
                bullets.splice(i, 1);
                break;
            }
        }
    }
    if (!gameOver && invulnTimer <= 0) {
        for (const a of asteroids) {
            if (dist(ship, a) < a.radius + ship.radius - 5) {
                lives--;
                for (let i = 0; i < 30; i++) {
                    particles.push(createParticle(
                        ship.x, ship.y,
                        rand(-5, 5), rand(-5, 5),
                        rand(20, 40),
                        '#ff4444'
                    ));
                }
                if (lives <= 0) {
                    gameOver = true;
                } else {
                    ship.x = canvas.width / 2;
                    ship.y = canvas.height / 2;
                    ship.vx = 0;
                    ship.vy = 0;
                    invulnTimer = 120;
                }
                break;
            }
        }
    }
    if (asteroids.length === 0 && !gameOver) {
        level++;
        asteroids = spawnAsteroids(3 + level);
    }
}

function drawShip() {
    if (gameOver) return;
    if (invulnTimer > 0 && Math.floor(invulnTimer / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-12, -10);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-12, 10);
    ctx.closePath();
    ctx.stroke();
    if (ship.thrusting) {
        ctx.strokeStyle = '#ff8800';
        ctx.beginPath();
        ctx.moveTo(-10, -5);
        ctx.lineTo(-20, 0);
        ctx.lineTo(-10, 5);
        ctx.stroke();
    }
    ctx.restore();
}

function drawAsteroids() {
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotAngle);
        ctx.beginPath();
        ctx.moveTo(a.verts[0].x, a.verts[0].y);
        for (let i = 1; i < a.verts.length; i++) {
            ctx.lineTo(a.verts[i].x, a.verts[i].y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
}

function drawBullets() {
    ctx.fillStyle = '#fff';
    for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color || '#fff';
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE: ' + score, 15, 30);
    ctx.textAlign = 'right';
    ctx.fillText('LEVEL ' + level, canvas.width - 15, 30);
    ctx.textAlign = 'left';
    for (let i = 0; i < lives; i++) {
        ctx.save();
        ctx.translate(20 + i * 25, 55);
        ctx.rotate(-Math.PI / 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-6, -5);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-6, 5);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
    if (gameOver) {
        ctx.fillStyle = '#fff';
        ctx.font = '48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px monospace';
        ctx.fillText('Press ENTER to restart', canvas.width / 2, canvas.height / 2 + 20);
    }
}

function gameLoop() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!gameOver) {
        updateShip();
        updateBullets();
        updateAsteroids();
        updateParticles();
        checkCollisions();
    } else {
        updateParticles();
        if (keys['Enter']) initGame();
    }
    drawAsteroids();
    drawBullets();
    drawShip();
    drawParticles();
    drawHUD();
    requestAnimationFrame(gameLoop);
}

initGame();
gameLoop();
</script>
</body>
</html>
