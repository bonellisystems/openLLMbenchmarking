<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:Arial,Helvetica,sans-serif;text-align:center;}
  #game{display:inline-block;position:relative;}
  canvas{background:#111;border:2px solid #555;}
  #score{margin-top:10px;font-size:18px;}
  #gameover{margin-top:20px;font-size:24px;color:#f00;display:none;}
</style>
</head>
<body>
<div id="game">
  <canvas id="tetris" width="200" height="400"></canvas>
  <div id="score">Score: 0</div>
  <div id="gameover">Game Over</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('tetris');
  const ctx = canvas.getContext('2d');
  const COL = 10, ROW = 20, BLOCK = 20;
  const COLORS = ['cyan','blue','orange','yellow','green','purple','red'];
  const SHAPES = [
    // I
    [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]],
    // J
    [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[0,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[2,0],[1,1],[1,2]]],
    // L
    [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]],
    // O
    [[[1,0],[2,0],[1,1],[2,1]]],
    // S
    [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]],
    // T
    [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    // Z
    [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]]
  ];
  let board = createMatrix(COL, ROW);
  let score = 0;
  let dropInterval = 500;
  let dropCounter = 0;
  let lastTime = 0;
  let gameOver = false;
  let current = null;
  const scoreEl = document.getElementById('score');
  const gameOverEl = document.getElementById('gameover');

  function createMatrix(w,h){const m=[];for(let i=0;i<h;i++){m.push(new Array(w).fill(0));}return m;}
  function drawMatrix(matrix,color){matrix.forEach((row,y)=>row.forEach((value,x)=>{if(value!==0){drawBlock(x,y,color);}});}
  function drawBlock(x,y,color){ctx.fillStyle=color;ctx.fillRect(x*BLOCK,y*BLOCK,BLOCK,BLOCK);ctx.strokeStyle='#000';ctx.strokeRect(x*BLOCK,y*BLOCK,BLOCK,BLOCK);}
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawMatrix(board,'#444');if(current){drawMatrix(current.matrix, COLORS[current.shape]);}}
  function merge(){current.matrix.forEach((row,y)=>row.forEach((value,x)=>{if(value!==0){board[y+current.pos.y][x+current.pos.x]=value;}});}
  function collide(){for(let y=0;y<current.matrix.length;y++){for(let x=0;x<current.matrix[y].length;x++){if(current.matrix[y][x]!==0){const posX=x+current.pos.x;const posY=y+current.pos.y;if(posX<0||posX>=COL||posY>=ROW||board[posY][posX]!==0){return true;}}}}return false;}
  function rotate(matrix){const N=matrix.length-1;for(let y=0;y<N;y++){for(let x=0;x<y;x++){const temp=matrix[y][x];matrix[y][x]=matrix[N-x][N-y];matrix[N-x][N-y]=temp;}}}
  function playerDrop(){current.pos.y++;if(collide()){current.pos.y--;merge();clearLines();spawnPiece();if(collide()){gameOver=true;gameOverEl.style.display='block';clearInterval(dropTimer);}}}
  function playerMove(dir){current.pos.x+=dir;if(collide()){current.pos.x-=dir;}}
  function playerRotate(){const pos=current.pos.x;let offset=1;const matrix=current.matrix;rotate(matrix);if(collide()){current.pos.x=pos;rotate(matrix);rotate(matrix);rotate(matrix);}}
  function clearLines(){let row=ROW-1;let lines=0;while(row>=0){if(board[row].every(v=>v!==0)){board.splice(row,1);board.unshift(new Array(COL).fill(0));lines++;}else{row--;} }if(lines>0){score+=lines*100;scoreEl.textContent='Score: '+score;}}
  function spawnPiece(){const index=Math.floor(Math.random()*SHAPES.length);const shape=SHAPES[index];const rotation=0;const matrix=shape[rotation];current={matrix:matrix.map(row=>row.slice()),shape:index,pos:{x:3,y:0}};}
  function reset(){board=createMatrix(COL,ROW);score=0;scoreEl.textContent='Score: 0';gameOver=false;gameOverEl.style.display='none';spawnPiece();}
  function update(time=0){const delta=time-lastTime;lastTime=time;dropCounter+=delta;if(dropCounter>dropInterval){dropCounter=0;playerDrop();}draw();}
  function loop(){requestAnimationFrame(update);}
  const dropTimer=setInterval(()=>{playerDrop();},dropInterval);
  loop();
  reset();
  document.addEventListener('keydown',e=>{
    if(gameOver)return;
    if(e.key==='ArrowLeft'){playerMove(-1);}
    else if(e.key==='ArrowRight'){playerMove(1);}
    else if(e.key==='ArrowDown'){playerDrop();}
    else if(e.key==='ArrowUp'){playerRotate();}
    else if(e.key==='r'||e.key==='R'){reset();}
  });
})();
</script>
</body>
</html>
