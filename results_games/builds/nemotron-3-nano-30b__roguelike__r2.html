<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Roguelike</title>
<style>
body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;}
#game{font-size:18px;letter-spacing:1px;}
</style>
</head>
<body>
<pre id="game"></pre>
<script>
// maze generation
const width=21;
const height=21;
let grid=[];
let playerX,playerY;

// init grid
function init() {
  grid=Array.from({length:height},()=>Array(width).fill('#'));
}

// generate maze using recursive backtracker
function generate() {
  const visited=Array.from({length:height},()=>Array(width).fill(false));
  const stack=[];
  const startX=1+Math.floor(Math.random()*((width-2)/2))*2;
  const startY=1+Math.floor(Math.random()*((height-2)/2))*2;
  stack.push([startX,startY]);
  visited[startY][startX]=true;
  grid[startY][startX]=' ';

  const dirs=[[0,-2],[-2,0],[0,2],[2,0]];
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const neighbors=[];
    for(const [dx,dy] of dirs){
      const nx=x+dx, ny=y+dy;
      if(nx>0 && nx<width-1 && ny>0 && ny<height-1 && !visited[ny][nx]){
        neighbors.push([nx,ny,dx,dy]);
      }
    }
    if(neighbors.length){
      const [nx,ny,dx,dy]=neighbors[Math.floor(Math.random()*neighbors.length)];
      grid[y+dy/2][x+dx/2]=' ';
      if(!visited[ny][nx]){
        visited[ny][nx]=true;
        grid[ny][nx]=' ';
        stack.push([nx,ny]);
      }
    }else{
      stack.pop();
    }
  }
}

// place player on a passage
function placePlayer(){
  const cells=[];
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      if(grid[y][x]===' ') cells.push([x,y]);
    }
  }
  const [px,py]=cells[Math.floor(Math.random()*cells.length)];
  playerX=px; playerY=py;
  grid[py][px]='@';
}

// render to <pre>
function render(){
  document.getElementById('game').textContent=grid.map(r=>r.join('')).join('\n');
}

// movement
document.addEventListener('keydown',e=>{
  let nx=playerX, ny=playerY;
  if(e.key==='ArrowUp') ny--;
  else if(e.key==='ArrowDown') ny++;
  else if(e.key==='ArrowLeft') nx--;
  else if(e.key==='ArrowRight') nx++;
  else return;
  if(grid[ny][nx]===''){
    grid[playerY][playerX]=' ';
    grid[ny][nx]='@';
    playerX=nx; playerY=ny;
    render();
  }
});

// start
init();
generate();
placePlayer();
render();
</script>
</body>
</html>
