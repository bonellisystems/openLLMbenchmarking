<!DOCTYPE html>
<html>
<head>
<title>Doodle Jump Style Game</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { background: #000; display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.8;
const JUMP_FORCE = -12;
const PLATFORM_WIDTH = 80;
const PLATFORM_HEIGHT = 20;
const GAP = 100;

let player = { x: 100, y: 300, width: 30, height: 30, velocityY: 0 };
let platforms = [];
let score = 0;

function Platform(x, y) {
  this.x = x;
  this.y = y;
  this.width = PLATFORM_WIDTH;
  this.height = PLATFORM_HEIGHT;
}

function createPlatform() {
  const x = Math.random() * (canvas.width - PLATFORM_WIDTH);
  const y = platforms.length === 0 ? canvas.height - PLATFORM_HEIGHT : platforms[platforms.length - 1].y - GAP - Math.random() * 200;
  platforms.push(new Platform(x, y));
}

function checkCollision() {
  platforms.forEach(platform => {
    if (
      player.x < platform.x + platform.width &&
      player.x + player.width > platform.x &&
      player.y < platform.y + platform.height &&
      player.y + player.height > platform.y - 5
    ) {
      player.velocityY = 0;
      player.y = platform.y - player.height;
    }
  });
}

function update() {
  player.velocityY += GRAVITY;
  player.y += player.velocityY;

  if (player.y > canvas.height) {
    player.y = canvas.height;
    player.velocityY = 0;
    // Game over logic can be added here
  }

  if (platforms.length === 0 || platforms[platforms.length - 1].y < canvas.height - GAP) {
    createPlatform();
  }

  platforms = platforms.filter(platform => platform.y > -PLATFORM_HEIGHT);

  checkCollision();

  score += 0.1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  platforms.forEach(platform => {
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
  });

  ctx.fillStyle = '#ff0000';
  ctx.fillRect(player.x, player.y, player.width, player.height);

  ctx.fillStyle = '#fff';
  ctx.font = '20px Arial';
  ctx.fillText(`Score: ${Math.floor(score)}`, 10, 30);
}

function jump() {
  if (platforms.some(platform =>
    platform.x < player.x + player.width &&
    platform.x + platform.width > player.x &&
    platform.y < player.y + player.height &&
    platform.y > player.y - 5
  )) {
    player.velocityY = JUMP_FORCE;
  }
}

document.addEventListener('keydown', event => {
  if (event.code === 'Space') {
    jump();
  }
});

setInterval(update, 10);
</script>
</body>
</html>
