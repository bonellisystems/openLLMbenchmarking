<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #70c5ce;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 320;
        canvas.height = 480;

        // Game constants
        const GRAVITY = 0.25;
        const JUMP = -4.6;
        const PIPE_SPEED = 2;
        const PIPE_SPAWN_RATE = 90; // frames
        const PIPE_GAP = 120;

        // Game state
        let bird = { x: 50, y: 150, w: 34, h: 24, velocity: 0 };
        let pipes = [];
        let frameCount = 0;
        let score = 0;
        let gameState = 'START'; // START, PLAYING, GAME_OVER

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
            gameState = 'PLAYING';
        }

        function spawnPipe() {
            const minPipeHeight = 50;
            const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight - 50;
            const height = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: height,
                passed: false
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            bird.velocity += GRAVITY;
            bird.y += bird.velocity;

            // Floor/Ceiling collision
            if (bird.y + bird.h > canvas.height || bird.y < 0) {
                gameState = 'GAME_OVER';
            }

            // Pipe logic
            if (frameCount % PIPE_SPAWN_RATE === 0) {
                spawnPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                let p = pipes[i];
                p.x -= PIPE_SPEED;

                // Collision detection
                if (bird.x < p.x + 50 && bird.x + bird.w > p.x && 
                    (bird.y < p.topHeight || bird.y + bird.h > p.topHeight + PIPE_GAP)) {
                    gameState = 'GAME_OVER';
                }

                // Score increment
                if (!p.passed && p.x + 50 < bird.x) {
                    score++;
                    p.passed = true;
                }

                // Remove off-screen pipes
                if (p.x < -50) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            // Background
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pipes
            ctx.fillStyle = '#73bf2e';
            pipes.forEach(p => {
                // Top pipe
                ctx.fillRect(p.x, 0, 50, p.topHeight);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(p.x, 0, 50, p.topHeight);
                
                // Bottom pipe
                ctx.fillRect(p.x, p.topHeight + PIPE_GAP, 50, canvas.height - (p.topHeight + PIPE_GAP));
                ctx.strokeRect(p.x, p.topHeight + PIPE_GAP, 50, canvas.height - (p.topHeight + PIPE_GAP));
            });

            // Bird
            ctx.fillStyle = '#f7e61c';
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(bird.x, bird.y, bird.w, bird.h);

            // UI
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';

            if (gameState === 'START') {
                ctx.fillText('FLAPPY BIRD', canvas.width / 2, 150);
                ctx.strokeText('FLAPPY BIRD', canvas.width / 2, 150);
                ctx.font = '20px Arial';
                ctx.fillText('Press SPACE or UP to Start', canvas.width / 2, 250);
                ctx.strokeText('Press SPACE or UP to Start', canvas.width / 2, 250);
            } else if (gameState === 'PLAYING') {
                ctx.font = '40px Arial';
                ctx.fillText(score, canvas.width / 2, 50);
                ctx.strokeText(score, canvas.width / 2, 50);
            } else if (gameState === 'GAME_OVER') {
                ctx.font = '30px Arial';
                ctx.fillText('GAME OVER', canvas.width / 2, 150);
                ctx.strokeText('GAME OVER', canvas.width / 2, 150);
                ctx.font = '20px Arial';
                ctx.fillText(`Score: ${score}`, canvas.width / 2, 200);
                ctx.strokeText(`Score: ${score}`, canvas.width / 2, 200);
                ctx.fillText('Press SPACE to Restart', canvas.width / 2, 250);
                ctx.strokeText('Press SPACE to Restart', canvas.width / 2, 250);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameState === 'START') {
                    resetGame();
                } else if (gameState === 'PLAYING') {
                    bird.velocity = JUMP;
                } else if (gameState === 'GAME_OVER') {
                    resetGame();
                }
                // Prevent scrolling
                e.preventDefault();
            }
        });

        loop();
    </script>
</body>
</html>
