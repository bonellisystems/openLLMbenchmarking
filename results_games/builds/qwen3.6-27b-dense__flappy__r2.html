<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

// Scale canvas to fit screen
function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// Game constants
const GRAVITY = 0.45;
const FLAP_FORCE = -7.5;
const PIPE_WIDTH = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_INTERVAL = 1600;
const GROUND_HEIGHT = 80;
const BIRD_SIZE = 20;

// Game state
let bird, pipes, score, bestScore, gameState, groundX, lastPipeTime, frameCount;
let particles = [];
let stars = [];

// Colors
const SKY_TOP = '#4EC0CA';
const SKY_BOTTOM = '#71C8D4';
const PIPE_GREEN = '#73BF2E';
const PIPE_DARK = '#558B20';
const PIPE_CAP = '#82D936';
const GROUND_COLOR = '#DED895';
const GROUND_DARK = '#C9B45C';
const BIRD_YELLOW = '#F5C842';
const BIRD_ORANGE = '#E89E3A';
const BIRD_WHITE = '#FFFFFF';
const BIRD_EYE = '#000000';

function init() {
    bird = {
        x: 80,
        y: H / 2 - 50,
        vy: 0,
        rotation: 0,
        wingFrame: 0,
        wingTimer: 0,
        alive: true
    };
    pipes = [];
    score = 0;
    bestScore = parseInt(localStorage.getItem('flappyBest') || '0');
    gameState = 'waiting'; // waiting, playing, dead
    groundX = 0;
    lastPipeTime = 0;
    frameCount = 0;
    particles = [];
    stars = [];
    for (let i = 0; i < 5; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * (H - GROUND_HEIGHT - 100), s: Math.random() * 2 + 1, a: Math.random() * Math.PI * 2 });
    }
}

function flap() {
    if (gameState === 'waiting') {
        gameState = 'playing';
        bird.vy = FLAP_FORCE;
        lastPipeTime = performance.now();
    } else if (gameState === 'playing') {
        bird.vy = FLAP_FORCE;
        // Add flap particles
        for (let i = 0; i < 4; i++) {
            particles.push({
                x: bird.x - 5,
                y: bird.y + 5,
                vx: -Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                life: 1,
                size: Math.random() * 3 + 1
            });
        }
    } else if (gameState === 'dead') {
        init();
    }
}

// Input
document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        flap();
    }
});
canvas.addEventListener('mousedown', (e) => { e.preventDefault(); flap(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });

function spawnPipe() {
    const minY = 80;
    const maxY = H - GROUND_HEIGHT - PIPE_GAP - 80;
    const topHeight = Math.random() * (maxY - minY) + minY;
    pipes.push({
        x: W + 10,
        topHeight: topHeight,
        scored: false
    });
}

function update(dt) {
    frameCount++;

    // Update stars
    stars.forEach(s => { s.a += 0.02; });

    // Update particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
    });
    particles = particles.filter(p => p.life > 0);

    if (gameState === 'waiting') {
        bird.y = H / 2 - 50 + Math.sin(frameCount * 0.05) * 10;
        bird.wingTimer += 0.15;
        groundX = (groundX - 1) % 24;
        return;
    }

    if (gameState === 'dead') {
        if (bird.y < H - GROUND_HEIGHT - BIRD_SIZE) {
            bird.vy += GRAVITY;
            bird.y += bird.vy;
            bird.rotation = Math.min(bird.rotation + 0.08, Math.PI / 2);
        } else {
            bird.y = H - GROUND_HEIGHT - BIRD_SIZE;
        }
        return;
    }

    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;

    // Bird rotation
    if (bird.vy < 0) {
        bird.rotation = Math.max(bird.rotation - 0.12, -0.5);
    } else {
        bird.rotation = Math.min(bird.rotation + 0.04, Math.PI / 2);
    }

    // Wing animation
    bird.wingTimer += 0.2;

    // Ground scroll
    groundX = (groundX - PIPE_SPEED) % 24;

    // Spawn pipes
    const now = performance.now();
    if (now - lastPipeTime > PIPE_INTERVAL) {
        spawnPipe();
        lastPipeTime = now;
    }

    // Update pipes
    pipes.forEach(pipe => {
        pipe.x -= PIPE_SPEED;

        // Score
        if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
            pipe.scored = true;
            score++;
            // Score particles
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 / 8) * i;
                particles.push({
                    x: bird.x,
                    y: bird.y,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 1,
                    size: 3
                });
            }
        }
    });
    pipes = pipes.filter(p => p.x > -PIPE_WIDTH - 10);

    // Collision detection
    const bx = bird.x;
    const by = bird.y;
    const br = BIRD_SIZE - 2;

    // Ground/ceiling
    if (by + br > H - GROUND_HEIGHT || by - br < 0) {
        die();
        return;
    }

    // Pipes
    for (const pipe of pipes) {
        const px = pipe.x;
        const pw = PIPE_WIDTH;
        const topH = pipe.topHeight;
        const botY = topH + PIPE_GAP;

        if (bx + br > px && bx - br < px + pw) {
            if (by - br < topH || by + br > botY) {
                die();
                return;
            }
        }
    }
}

function die() {
    gameState = 'dead';
    bird.alive = false;
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('flappyBest', bestScore.toString());
    }
    // Death particles
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: bird.x,
            y: bird.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1,
            size: Math.random() * 4 + 2
        });
    }
}

function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    grad.addColorStop(0, '#4EC0CA');
    grad.addColorStop(1, '#A0E4EA');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const cloudOffset = (frameCount * 0.3) % (W + 200);
    drawCloud(100 - cloudOffset + W + 100, 80, 1);
    drawCloud(300 - cloudOffset * 0.7 + W + 100, 140, 0.7);
    drawCloud(500 - cloudOffset * 0.5 + W + 100, 60, 0.85);
    drawCloud(700 - cloudOffset * 0.6 + W + 100, 180, 0.6);

    // Distant city silhouette
    ctx.fillStyle = '#8BC48A';
    const cityY = H - GROUND_HEIGHT - 40;
    for (let i = 0; i < W; i += 30) {
        const h = 15 + Math.sin(i * 0.1) * 10 + Math.cos(i * 0.07) * 8;
        ctx.fillRect(i, cityY + 40 - h, 28, h);
    }
    ctx.fillStyle = '#7AB879';
    for (let i = 15; i < W; i += 40) {
        const h = 10 + Math.cos(i * 0.13) * 8;
        ctx.fillRect(i, cityY + 40 - h, 35, h);
    }
}

function drawCloud(x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.arc(25, -5, 20, 0, Math.PI * 2);
    ctx.arc(-20, 2, 18, 0, Math.PI * 2);
    ctx.arc(10, 5, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawGround() {
    // Main ground
    ctx.fillStyle = GROUND_COLOR;
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);

    // Ground top stripe
    ctx.fillStyle = '#5EBB3B';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, 15);

    // Ground pattern
    ctx.fillStyle = GROUND_DARK;
    for (let x = groundX; x < W + 24; x += 24) {
        ctx.fillRect(x, H - GROUND_HEIGHT + 15, 12, 4);
        ctx.fillRect(x + 6, H - GROUND_HEIGHT + 25, 12, 4);
    }

    // Ground bottom
    ctx.fillStyle = '#B8A450';
    ctx.fillRect(0, H - GROUND_HEIGHT + 50, W, GROUND_HEIGHT - 50);
}

function drawPipe(pipe) {
    const x = pipe.x;
    const topH = pipe.topHeight;
    const botY = topH + PIPE_GAP;
    const capH = 26;
    const capOverhang = 4;

    // Top pipe body
    const grad1 = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
    grad1.addColorStop(0, '#5A9E22');
    grad1.addColorStop(0.3, PIPE_GREEN);
    grad1.addColorStop(0.7, PIPE_GREEN);
    grad1.addColorStop(1, '#5A9E22');
    ctx.fillStyle = grad1;
    ctx.fillRect(x, 0, PIPE_WIDTH, topH - capH);

    // Top pipe cap
    const grad2 = ctx.createLinearGradient(x - capOverhang, 0, x + PIPE_WIDTH + capOverhang, 0);
    grad2.addColorStop(0, '#5A9E22');
    grad2.addColorStop(0.3, PIPE_CAP);
    grad2.addColorStop(0.7, PIPE_CAP);
    grad2.addColorStop(1, '#5A9E22');
    ctx.fillStyle = grad2;
    ctx.fillRect(x - capOverhang, topH - capH, PIPE_WIDTH + capOverhang * 2, capH);

    // Top pipe cap border
    ctx.strokeStyle = '#3D7518';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - capOverhang, topH - capH, PIPE_WIDTH + capOverhang * 2, capH);

    // Top pipe body border
    ctx.strokeRect(x, 0, PIPE_WIDTH, topH - capH);

    // Bottom pipe body
    ctx.fillStyle = grad1;
    ctx.fillRect(x, botY + capH, PIPE_WIDTH, H - GROUND_HEIGHT - botY - capH);

    // Bottom pipe cap
    ctx.fillStyle = grad2;
    ctx.fillRect(x - capOverhang, botY, PIPE_WIDTH + capOverhang * 2, capH);

    // Bottom pipe cap border
    ctx.strokeStyle = '#3D7518';
    ctx.strokeRect(x - capOverhang, botY, PIPE_WIDTH + capOverhang * 2, capH);

    // Bottom pipe body border
    ctx.strokeRect(x, botY + capH, PIPE_WIDTH, H - GROUND_HEIGHT - botY - capH);

    // Pipe shine
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 6, 0, 8, topH - capH);
    ctx.fillRect(x + 6, botY + capH, 8, H - GROUND_HEIGHT - botY - capH);
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Body
    ctx.fillStyle = BIRD_YELLOW;
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#D4A017';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Belly
    ctx.fillStyle = '#F7DC6F';
    ctx.beginPath();
    ctx.ellipse(2, 4, BIRD_SIZE * 0.6, BIRD_SIZE * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    const wingY = Math.sin(bird.wingTimer) * 5;
    ctx.fillStyle = BIRD_ORANGE;
    ctx.beginPath();
    ctx.ellipse(-4, wingY, 12, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#C4802A';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Eye white
    ctx.fillStyle = BIRD_WHITE;
    ctx.beginPath();
    ctx.arc(10, -5, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Pupil
    ctx.fillStyle = BIRD_EYE;
    ctx.beginPath();
    ctx.arc(12, -5, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(13, -6.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#E87040';
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(26, 2);
    ctx.lineTo(16, 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#C45A30';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Beak line
    ctx.strokeStyle = '#C45A30';
    ctx.beginPath();
    ctx.moveTo(16, 3);
    ctx.lineTo(24, 3);
    ctx.stroke();

    ctx.restore();
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawScore() {
    // Score text with outline
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    if (gameState === 'playing' || gameState === 'waiting') {
        ctx.font = 'bold 52px Arial, sans-serif';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';
        ctx.strokeText(score, W / 2, 40);
        ctx.fillStyle = '#FFF';
        ctx.fillText(score, W / 2, 40);
    }
}

function drawWaitingScreen() {
    // Title
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold 42px Arial, sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.strokeText('Flappy Bird', W / 2, 100);
    ctx.fillStyle = '#FFF';
    ctx.fillText('Flappy Bird', W / 2, 100);

    // Instructions
    const pulse = 0.7 + Math.sin(frameCount * 0.06) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('Press SPACE or Click to Start', W / 2, H / 2 + 80);
    ctx.fillStyle = '#FFF';
    ctx.fillText('Press SPACE or Click to Start', W / 2, H / 2 + 80);
    ctx.globalAlpha = 1;
}

function drawDeadScreen() {
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, W, H);

    // Game Over panel
    const panelW = 260;
    const panelH = 200;
    const px = (W - panelW) / 2;
    const py = (H - panelH) / 2 - 30;

    // Panel background
    ctx.fillStyle = '#DEB050';
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 4;
    roundRect(px, py, panelW, panelH, 12);

    // Inner panel
    ctx.fillStyle = '#C4943C';
    roundRect(px + 12, py + 40, panelW - 24, panelH - 52, 6);

    // Game Over text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 36px Arial, sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.strokeText('Game Over', W / 2, py + 22);
    ctx.fillStyle = '#FF6B6B';
    ctx.fillText('Game Over', W / 2, py + 22);

    // Score
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Score: ' + score, W / 2, py + 75);
    ctx.fillText('Score: ' + score, W / 2, py + 75);

    // Best
    ctx.strokeText('Best: ' + bestScore, W / 2, py + 110);
    ctx.fillText('Best: ' + bestScore, W / 2, py + 110);

    // Medal
    if (score >= 10) {
        const medalColor = score >= 40 ? '#FFD700' : score >= 20 ? '#C0C0C0' : '#CD7F32';
        ctx.fillStyle = medalColor;
        ctx.beginPath();
        ctx.arc(px + 45, py + 95, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('★', px + 45, py + 96);
    }

    // Restart
    const pulse = 0.7 + Math.sin(frameCount * 0.06) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeText('Press SPACE or Click to Restart', W / 2, py + panelH + 30);
    ctx.fillStyle = '#FFF';
    ctx.fillText('Press SPACE or Click to Restart', W / 2, py + panelH + 30);
    ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    // Draw pipes
    pipes.forEach(drawPipe);

    drawGround();
    drawParticles();
    drawBird();
    drawScore();

    if (gameState === 'waiting') drawWaitingScreen();
    if (gameState === 'dead') drawDeadScreen();
}

let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min(timestamp - lastTime, 33);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

init();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
