<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>body{background:#000;color:#0f0;font-family:monospace;margin:0;overflow:hidden;}canvas{display:block;margin:0 auto;}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=40,H=20,S=16;
c.width=W*S;c.height=H*S;
ctx.font=S+'px monospace';ctx.textBaseline='top';
let map=[],p={x:0,y:0,hp:10},enemies=[],stairs={x:0,y:0};

function gen(){
    map=[];
    for(let y=0;y<H;y++){
        let r=[];
        for(let x=0;x<W;x++)r.push(Math.random()<0.45?0:1);
        map.push(r);
    }
    for(let i=0;i<4;i++){
        let n=JSON.parse(JSON.stringify(map));
        for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
            let k=0;
            for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)k+=map[y+dy][x+dx];
            if(k>4)n[y][x]=1;else if(k<4)n[y][x]=0;
        }
        map=n;
    }
    let f=[];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]===0)f.push({x,y});
    if(f.length<2)return gen();
    p.x=f[0].x;p.y=f[0].y;
    stairs.x=f[f.length-1].x;stairs.y=f[f.length-1].y;
    enemies=[];
    for(let i=0;i<5;i++){
        let e=f[Math.floor(Math.random()*f.length)];
        if(e.x!==p.x||e.y!==p.y)enemies.push(e);
    }
}

function move(dx,dy){
    let nx=p.x+dx,ny=p.y+dy;
    if(map[ny][nx]===1)return;
    let i=enemies.findIndex(e=>e.x===nx&&e.y===ny);
    if(i!==-1){enemies.splice(i,1);return;}
    p.x=nx;p.y=ny;
    enemies.forEach(e=>{
        if(Math.abs(e.x-p.x)+Math.abs(e.y-p.y)<=1){
            p.hp--;
            if(p.hp<=0){alert('Game Over');location.reload();}
        }else{
            let ex=e.x+(p.x>e.x?1:p.x<e.x?-1:0);
            let ey=e.y+(p.y>e.y?1:p.y<e.y?-1:0);
            if(map[ey][ex]===0&&(ex!==p.x||ey!==p.y)){e.x=ex;e.y=ey;}
        }
    });
    if(p.x===stairs.x&&p.y===stairs.y){alert('You Win!');location.reload();}
}

window.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'||e.key==='w')move(0,-1);
    if(e.key==='ArrowDown'||e.key==='s')move(0,1);
    if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);
    if(e.key==='ArrowRight'||e.key==='d')move(1,0);
});

function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        if(map[y][x]===1){
            ctx.fillStyle='#333';ctx.fillRect(x*S,y*S,S,S);
            ctx.fillStyle='#555';ctx.fillText('#',x*S,y*S);
        }else{
            ctx.fillStyle='#0f0';ctx.fillText('.',x*S,y*S);
        }
    }
    ctx.fillStyle='#0f0';ctx.fillText('@',p.x*S,p.y*S);
    enemies.forEach(e=>{ctx.fillStyle='#f00';ctx.fillText('E',e.x*S,e.y*S);});
    ctx.fillStyle='#ff0';ctx.fillText('>',stairs.x*S,stairs.y*S);
    ctx.fillStyle='#fff';ctx.fillText('HP:'+p.hp,10,10);
    requestAnimationFrame(draw);
}

gen();draw();document.body.focus();
</script>
</body>
</html>
