<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #000;
            border: 4px solid #444;
            border-radius: 5px;
        }
        #ui {
            text-align: center;
            margin-bottom: 10px;
        }
        #score {
            font-size: 32px;
            font-weight: bold;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            text-align: center;
            transition: opacity 0.3s;
        }
        .hidden {
            display: none !important;
        }
        h1 { margin: 0 0 10px 0; color: #4CAF50; }
        p { margin: 5px 0; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score">Score: 0</div>
    </div>

    <div id="game-container">
        <canvas id="snakeGame" width="400" height="400"></canvas>
        <div id="overlay">
            <h1>SNAKE</h1>
            <p>Use Arrow Keys to Move</p>
            <p>Press any key to start</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snakeGame');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let score = 0;
        let dx = 0;
        let dy = 0;
        let snake = [
            {x: 10, y: 10},
            {x: 10, y: 11},
            {x: 10, y: 12}
        ];
        let food = {x: 5, y: 5};
        let gameRunning = false;
        let gameLoopTimeout;

        function main() {
            if (didGameEnd()) {
                gameRunning = false;
                overlay.classList.remove('hidden');
                overlay.querySelector('h1').innerText = "GAME OVER";
                overlay.querySelector('p').innerText = "Final Score: " + score;
                overlay.querySelector('p:last-child').innerText = "Press any key to restart";
                return;
            }

            gameLoopTimeout = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Subtle grid
            ctx.strokeStyle = "#111";
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#4CAF50" : "#2E7D32";
                ctx.strokeStyle = "#000";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerHTML = `Score: ${score}`;
                createFood();
            } else {
                snake.pop();
            }
        }

        function didGameEnd() {
            if (!gameRunning) return false;
            
            const head = snake[0];
            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
            
            // Self collision
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Make sure food doesn't spawn on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) createFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.strokeStyle = "#B71C1C";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        function handleKeyDown(event) {
            const key = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

            if (!gameRunning) {
                resetGame();
                return;
            }

            if (key === LEFT && dx !== 1) { dx = -1; dy = 0; }
            if (key === UP && dy !== 1) { dx = 0; dy = -1; }
            if (key === RIGHT && dx !== -1) { dx = 1; dy = 0; }
            if (key === DOWN && dy !== -1) { dx = 0; dy = 1; }

            // Prevent scrolling
            if([37, 38, 39, 40].indexOf(key) > -1) {
                event.preventDefault();
            }
        }

        function resetGame() {
            score = 0;
            scoreElement.innerHTML = `Score: 0`;
            snake = [
                {x: 10, y: 10},
                {x: 10, y: 11},
                {x: 10, y: 12}
            ];
            dx = 0;
            dy = -1;
            gameRunning = true;
            overlay.classList.add('hidden');
            createFood();
            clearTimeout(gameLoopTimeout);
            main();
        }

        window.addEventListener('keydown', handleKeyDown);
        
        // Initial draw
        clearCanvas();
        drawSnake();
        drawFood();
    </script>
</body>
</html>
