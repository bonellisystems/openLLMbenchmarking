<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tiny Roguelike</title>
<style>
    body{
        margin:0;
        background:#000;
        color:#0f0;
        font-family:monospace;
        overflow:hidden;
    }
    #game{
        white-space:pre;
        line-height:1;
        user-select:none;
    }
</style>
</head>
<body>
<div id="game"></div>
<script>
(() => {
    const WIDTH = 40;
    const HEIGHT = 20;
    const ROOM_COUNT = 8;
    const MIN_ROOM = 4;
    const MAX_ROOM = 8;

    const map = Array.from({length: HEIGHT}, () => Array(WIDTH).fill('#'));
    const rooms = [];

    function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

    // generate rooms
    for(let i=0;i<ROOM_COUNT;i++){
        const w = randInt(MIN_ROOM, MAX_ROOM);
        const h = randInt(MIN_ROOM, MAX_ROOM);
        const x = randInt(1, WIDTH - w - 2);
        const y = randInt(1, HEIGHT - h - 2);
        const newRoom = {x,y,w,h, cx:x+Math.floor(w/2), cy:y+Math.floor(h/2)};
        // carve
        for(let yy=y; yy<y+h; yy++){
            for(let xx=x; xx<x+w; xx++){
                map[yy][xx] = '.';
            }
        }
        rooms.push(newRoom);
        // connect to previous room
        if(i>0){
            const prev = rooms[i-1];
            // L-shaped corridor
            let cx = prev.cx, cy = prev.cy;
            while(cx !== newRoom.cx){
                map[cy][cx] = '.';
                cx += (newRoom.cx > cx) ? 1 : -1;
            }
            while(cy !== newRoom.cy){
                map[cy][cx] = '.';
                cy += (newRoom.cy > cy) ? 1 : -1;
            }
        }
    }

    // player
    const player = {x: rooms[0].cx, y: rooms[0].cy};

    const gameDiv = document.getElementById('game');

    function render(){
        let lines = [];
        for(let y=0;y<HEIGHT;y++){
            let line = '';
            for(let x=0;x<WIDTH;x++){
                if(x===player.x && y===player.y) line+='@';
                else line+=map[y][x];
            }
            lines.push(line);
        }
        gameDiv.textContent = lines.join('\n');
    }

    function move(dx,dy){
        const nx = player.x + dx;
        const ny = player.y + dy;
        if(nx<0||ny<0||nx>=WIDTH||ny>=HEIGHT) return;
        if(map[ny][nx] === '.') {
            player.x = nx;
            player.y = ny;
            render();
        }
    }

    window.addEventListener('keydown', e=>{
        let handled = true;
        switch(e.key){
            case 'ArrowUp': case 'w': case 'W': move(0,-1); break;
            case 'ArrowDown': case 's': case 'S': move(0,1); break;
            case 'ArrowLeft': case 'a': case 'A': move(-1,0); break;
            case 'ArrowRight': case 'd': case 'D': move(1,0); break;
            default: handled = false;
        }
        if(handled) e.preventDefault();
    });

    render();
})();
</script>
</body>
</html>
