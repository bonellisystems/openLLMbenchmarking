<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #game {
    display: grid;
    grid-template-columns: repeat(10, 20px);
    grid-template-rows: repeat(20, 20px);
    gap: 1px;
  }
  .cell {
    width: 20px;
    height: 20px;
    background-color: #ccc;
    border: 1px solid #666;
  }
  .filled {
    background-color: #666;
  }
</style>
</head>
<body>
<div id="game"></div>
<script>
  let game = [];
  let score = 0;
  let lines = 0;
  let level = 1;
  let piece = {
    x: 5,
    y: 0,
    type: getRandomPieceType(),
    rotation: 0
  };

  const pieceTypes = [
    [[1, 1, 1, 1]], // I
    [[1, 1], [1, 1]], // O
    [[1, 0, 0], [1, 1, 1]], // J
    [[0, 0, 1], [1, 1, 1]], // L
    [[0, 1, 1], [1, 1, 0]], // S
    [[1, 1, 0], [0, 1, 1]], // Z
    [[1, 1, 1], [0, 1, 0]] // T
  ];

  function getRandomPieceType() {
    return pieceTypes[Math.floor(Math.random() * pieceTypes.length)];
  }

  function initGame() {
    for (let i = 0; i < 20; i++) {
      game[i] = [];
      for (let j = 0; j < 10; j++) {
        game[i][j] = 0;
      }
    }
    updateGame();
  }

  function updateGame() {
    const gameDiv = document.getElementById('game');
    gameDiv.innerHTML = '';
    for (let i = 0; i < 20; i++) {
      for (let j = 0; j < 10; j++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if (game[i][j] === 1) {
          cell.classList.add('filled');
        }
        gameDiv.appendChild(cell);
      }
    }
    drawPiece();
  }

  function drawPiece() {
    const gameDiv = document.getElementById('game');
    const pieceCells = getPieceCells();
    for (let i = 0; i < pieceCells.length; i++) {
      const x = piece.x + pieceCells[i].x;
      const y = piece.y + pieceCells[i].y;
      if (x >= 0 && x < 10 && y >= 0 && y < 20) {
        const cell = gameDiv.children[y * 10 + x];
        cell.style.background = 'red';
      }
    }
  }

  function getPieceCells() {
    const cells = [];
    for (let i = 0; i < piece.type.length; i++) {
      for (let j = 0; j < piece.type[i].length; j++) {
        if (piece.type[i][j] === 1) {
          cells.push({x: j, y: i});
        }
      }
    }
    return cells;
  }

  function movePiece(dx, dy) {
    const pieceCells = getPieceCells();
    for (let i = 0; i < pieceCells.length; i++) {
      const x = piece.x + pieceCells[i].x + dx;
      const y = piece.y + pieceCells[i].y + dy;
      if (x < 0 || x >= 10 || y < 0 || y >= 20 || game[y][x] === 1) {
        return;
      }
    }
    piece.x += dx;
    piece.y += dy;
    updateGame();
  }

  function rotatePiece() {
    piece.rotation = (piece.rotation + 1) % 4;
    const newType = rotatePieceType(piece.type, piece.rotation);
    const pieceCells = getPieceCells();
    for (let i = 0; i < pieceCells.length; i++) {
      const x = piece.x + pieceCells[i].x;
      const y = piece.y + pieceCells[i].y;
      if (x < 0 || x >= 10 || y < 0 || y >= 20 || game[y][x] === 1) {
        piece.rotation = (piece.rotation - 1 + 4) % 4;
        return;
      }
    }
    piece.type = newType;
    updateGame();
  }

  function rotatePieceType(type, rotation) {
    if (rotation === 0) return type;
    if (rotation === 1) {
      const newType = [];
      for (let j = 0; j < type[0].length; j++) {
        newType.push([]);
        for (let i = type.length - 1; i >= 0; i--) {
          newType[j].push(type[i][j]);
        }
      }
      return newType;
    }
    if (rotation === 2) {
      const newType = [];
      for (let i = type.length - 1; i >= 0; i--) {
        newType.push([]);
        for (let j = type[0].length - 1; j >= 0; j--) {
          newType[type.length - 1 - i].push(type[i][j]);
        }
      }
      return newType;
    }
    if (rotation === 3) {
      const newType = [];
      for (let j = type[0].length - 1; j >= 0; j--) {
        newType.push([]);
        for (let i = 0; i < type.length; i++) {
          newType[type[0].length - 1 - j].push(type[i][j]);
        }
      }
      return newType;
    }
  }

  function checkCollision() {
    const pieceCells = getPieceCells();
    for (let i = 0; i < pieceCells.length; i++) {
      const x = piece.x + pieceCells[i].x;
      const y = piece.y + pieceCells[i].y;
      if (y >= 20 || game[y][x] === 1) {
        return true;
      }
    }
    return false;
  }

  function placePiece() {
    const pieceCells = getPieceCells();
    for (let i = 0; i < pieceCells.length; i++) {
      const x = piece.x + pieceCells[i].x;
      const y = piece.y + pieceCells[i].y;
      game[y][x] = 1;
    }
    checkLines();
    piece = {
      x: 5,
      y: 0,
      type: getRandomPieceType(),
      rotation: 0
    };
  }

  function checkLines() {
    let linesCleared = 0;
    for (let i = 0; i < 20; i++) {
      let lineFilled = true;
      for (let j = 0; j < 10; j++) {
        if (game[i][j] === 0) {
          lineFilled = false;
          break;
        }
      }
      if (lineFilled) {
        game.splice(i, 1);
        game.unshift([]);
        for (let j = 0; j < 10; j++) {
          game[0][j] = 0;
        }
        linesCleared++;
      }
    }
    lines += linesCleared;
    score += linesCleared * linesCleared * 100;
    updateGame();
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowLeft':
        movePiece(-1, 0);
        break;
      case 'ArrowRight':
        movePiece(1, 0);
        break;
      case 'ArrowDown':
        movePiece(0, 1);
        break;
      case 'ArrowUp':
        rotatePiece();
        break;
    }
  });

  initGame();
  setInterval(() => {
    if (checkCollision()) {
      placePiece();
    } else {
      movePiece(0, 1);
    }
  }, 500);
</script>
</body>
</html>
