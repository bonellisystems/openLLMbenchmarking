<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Arkanoid</title>
  <style>
    canvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="600"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const ball = { x: 200, y: 300, vx: 5, vy: -5, radius: 10 };
    const paddle = { x: 175, y: 550, width: 50, height: 10, speed: 8 };
    const bricks = [];
    for (let i = 0; i < 10; i++) {
      for (let j = 0; j < 5; j++) {
        bricks.push({ x: i * 40, y: j * 20, width: 40, height: 20 });
      }
    }
    let score = 0;
    let lives = 3;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'black';
      ctx.font = '24px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`Score: ${score}`, 10, 10);
      ctx.textAlign = 'right';
      ctx.fillText(`Lives: ${lives}`, 390, 10);
      ctx.fillStyle = 'white';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, 2 * Math.PI);
      ctx.fill();
      bricks.forEach(brick => {
        ctx.fillStyle = 'green';
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      });
    }

    function update() {
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.vx = -ball.vx;
      }
      if (ball.y - ball.radius < 0) {
        ball.vy = -ball.vy;
      }
      if (ball.y + ball.radius > canvas.height) {
        lives--;
        ball.x = 200;
        ball.y = 300;
        ball.vy = -5;
      }
      if (ball.x > paddle.x && ball.x < paddle.x + paddle.width && ball.y + ball.radius > paddle.y && ball.y - ball.radius < paddle.y + paddle.height) {
        ball.vy = -ball.vy;
      }
      bricks.forEach((brick, index) => {
        if (ball.x > brick.x && ball.x < brick.x + brick.width && ball.y > brick.y && ball.y < brick.y + brick.height) {
          bricks.splice(index, 1);
          ball.vy = -ball.vy;
          score++;
        }
      });
      if (paddle.x < 0) {
        paddle.x = 0;
      } else if (paddle.x > canvas.width - paddle.width) {
        paddle.x = canvas.width - paddle.width;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') {
        paddle.x -= paddle.speed;
      } else if (e.key === 'ArrowRight') {
        paddle.x += paddle.speed;
      }
    });

    function loop() {
      update();
      draw();
      if (lives > 0 && bricks.length > 0) {
        requestAnimationFrame(loop);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'black';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (lives === 0) {
          ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
        } else {
          ctx.fillText('You Win!', canvas.width / 2, canvas.height / 2);
        }
      }
    }

    loop();
  </script>
</body>
</html>
