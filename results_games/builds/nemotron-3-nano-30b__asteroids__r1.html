<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Asteroids</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;});

const keys={left:false,right:false,up:false,space:false};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(['arrowleft','arrowright','arrowup',' '].includes(e.key))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false; if(['arrowleft','arrowright','arrowup',' '].includes(e.key))e.preventDefault();});

const ship={
  x:w/2,
  y:h/2,
  radius:12,
  angle:0,
  angularVelocity:0,
  thrust:0.1,
  rotationSpeed:0.07,
  friction:0.99,
  vx:0,
  vy:0,
  update(){
    if(keys.left) this.angularVelocity=-this.rotationSpeed;
    if(keys.right) this.angularVelocity=this.rotationSpeed;
    if(keys.up){
      this.vx+=Math.cos(this.angle)*this.thrust;
      this.vy+=Math.sin(this.angle)*this.thrust;
    }
    this.angle+=this.angularVelocity;
    this.angularVelocity*=0.9;
    this.vx*=this.friction;
    this.vy*=this.friction;
    this.x+=this.vx;
    this.y+=this.vy;
    this.x+= (this.x+w)%w;
    this.y+= (this.y+h)%h;
  },
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(6,-4);
    ctx.lineTo(0,-2);
    ctx.lineTo(-6,-4);
    ctx.lineTo(0,12);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
};

const bullets=[];
const rocks=[];
function spawnRock(radius=20){
  const r=radius||20;
  const rock={
    x:Math.random()*w,
    y:Math.random()*h,
    vx:(Math.random()*2-1)*2,
    vy:(Math.random()*2-1)*2,
    radius:r,
    mass:r*r,
    update(){
      this.x+=this.vx;
      this.y+=this.vy;
      this.x+= (this.x+w)%w;
      this.y+= (this.y+h)%h;
    },
    draw(){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.strokeStyle='#888';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(0,-r);
      ctx.lineTo(r*0.5,-r*0.866);
      ctx.lineTo(r*0.866,-r*0.5);
      ctx.lineTo(r*0.5,r*0.5);
      ctx.lineTo(0,r);
      ctx.lineTo(-r*0.5,r*0.5);
      ctx.lineTo(-r*0.866,r*0.5);
      ctx.lineTo(-r*0.5,-r*0.5);
      ctx.lineTo(-r*0.5,-r*0.866);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
  };
  for(let i=0;i<3;i++) rocks.push(rock);
}
for(let i=0;i<5;i++) spawnRock();

const bulletsMax=5;
function update(){
  ship.update();
  bullets.forEach(b=>b.update());
  bullets.splice(bullets.findIndex(b=>b.life<=0),1);
  rocks.forEach(r=>r.update());
  rocks.splice(rocks.findIndex(r=>r.radius<2),1);
  // bullets-rock collisions
  bullets.forEach((b,i)=>{
    for(let j=rocks.length-1;j>=0;j--){
      const r=rocks[j];
      const dx=r.x-b.x, dy=r.y-b.y;
      const dist=Math.hypot(dx,dy);
      if(dist<r.radius+b.radius){
        // split rock
        if(r.radius>8){
          const newR1=Object.assign({},r);
          newR1.radius*=0.5;
          const newR2=Object.assign({},r);
          newR2.radius*=0.5;
          const angle=Math.atan2(dy,dx);
          const offset=Math.random()*Math.PI*0.5;
          newR1.vx+=Math.cos(angle+offset)*0.5+Math.cos(angle-offset)*0.5;
          newR1.vy+=Math.sin(angle+offset)*0.5+Math.sin(angle-offset)*0.5;
          newR2.vx+=Math.cos(angle+offset+Math.PI)*0.5+Math.cos(angle-offset+Math.PI)*0.5;
          newR2.vy+=Math.sin(angle+offset+Math.PI)*0.5+Math.sin(angle-offset+Math.PI)*0.5;
          rocks.splice(j,1,newR1,newR2);
        }
        bullets.splice(i,1);
        break;
      }
    }
  });
}
function draw(){
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.fillRect(0,0,w,h);
  rocks.forEach(r=>r.draw());
  bullets.forEach(b=>b.draw());
  ship.draw();
}
class Bullet{
  constructor(x,y,angle){
    this.x=x;
    this.y=y;
    const s=2;
    this.vx=Math.cos(angle)*s;
    this.vy=Math.sin(angle)*s;
    this.life=30;
    this.radius=2;
  }
  update(){
    this.x+=this.vx;
    this.y+=this.vy;
    this.x+= (this.x+w)%w;
    this.y+= (this.y+h)%h;
    this.life--;
  }
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.fillStyle='#fff';
    ctx.fillRect(-1,-1,2,2);
    ctx.restore();
  }
}
function fire(){
  if(bullets.length>=bulletsMax) return;
  const b=new Bullet(ship.x,ship.y,ship.angle);
  bullets.push(b);
}
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
function init(){
  requestAnimationFrame(loop);
}
init();
</script>
</body>
</html>
