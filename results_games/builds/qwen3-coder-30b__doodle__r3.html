<!DOCTYPE html>
<html>
<head>
    <title>Doodle Jump</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        #gameCanvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
        }
        #scoreDisplay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        #restartButton {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        #startButton {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="scoreDisplay">Score: 0</div>
        <div id="gameOver">
            <h2>Game Over</h2>
            <p id="finalScore">Score: 0</p>
            <button id="restartButton">Play Again</button>
        </div>
        <div id="startScreen">
            <h2>Doodle Jump</h2>
            <p>Use Arrow Keys to move</p>
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');

        // Game state
        let gameRunning = false;
        let score = 0;
        let cameraY = 0;
        let platforms = [];
        let doodle = {
            x: 200,
            y: 500,
            width: 40,
            height: 40,
            velocityX: 0,
            velocityY: 0,
            jumping: false
        };

        // Platform class
        class Platform {
            constructor(x, y, width, height, type) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type; // 'normal', 'moving', 'breakable'
                this.moveDirection = Math.random() > 0.5 ? 1 : -1;
                this.moveSpeed = 0.5;
                this.breakTimer = 0;
            }

            update() {
                if (this.type === 'moving') {
                    this.x += this.moveDirection * this.moveSpeed;
                    if (this.x < 0 || this.x + this.width > canvas.width) {
                        this.moveDirection *= -1;
                    }
                }
                if (this.type === 'breakable') {
                    this.breakTimer--;
                }
            }

            draw() {
                if (this.type === 'breakable' && this.breakTimer <= 0) return;
                
                ctx.fillStyle = this.type === 'breakable' ? '#8B4513' : 
                               this.type === 'moving' ? '#FF8C00' : '#228B22';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Add platform details
                ctx.fillStyle = '#006400';
                ctx.fillRect(this.x, this.y, this.width, 5);
            }
        }

        // Initialize game
        function initGame() {
            gameRunning = true;
            score = 0;
            cameraY = 0;
            doodle = {
                x: 200,
                y: 500,
                width: 40,
                height: 40,
                velocityX: 0,
                velocityY: 0,
                jumping: false
            };
            platforms = [];
            generatePlatforms();
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'none';
        }

        // Generate platforms
        function generatePlatforms() {
            // Ground platform
            platforms.push(new Platform(150, 580, 100, 20, 'normal'));
            
            // Generate platforms going upward
            for (let i = 0; i < 20; i++) {
                const y = 580 - i * 30;
                const x = Math.random() * (canvas.width - 100);
                const width = 60 + Math.random() * 40;
                const type = Math.random() > 0.8 ? 'breakable' : 
                            Math.random() > 0.7 ? 'moving' : 'normal';
                
                platforms.push(new Platform(x, y, width, 15, type));
            }
        }

        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Apply gravity
            doodle.velocityY += 0.5;
            
            // Update doodle position
            doodle.x += doodle.velocityX;
            doodle.y += doodle.velocityY;
            
            // Screen boundaries
            if (doodle.x < -doodle.width) doodle.x = canvas.width;
            if (doodle.x > canvas.width) doodle.x = -doodle.width;
            
            // Camera follows doodle
            if (doodle.y < canvas.height / 3) {
                cameraY += (canvas.height / 3 - doodle.y) * 0.1;
                doodle.y = canvas.height / 3;
            }
            
            // Platform collision
            let onPlatform = false;
            for (let platform of platforms) {
                platform.update();
                
                if (doodle.velocityY > 0 && 
                    doodle.y + doodle.height <= platform.y + 10 &&
                    doodle.y + doodle.height + doodle.velocityY >= platform.y &&
                    doodle.x + doodle.width > platform.x &&
                    doodle.x < platform.x + platform.width) {
                    
                    doodle.velocityY = -12;
                    doodle.jumping = true;
                    onPlatform = true;
                    
                    // Breakable platform
                    if (platform.type === 'breakable') {
                        platform.breakTimer = 30;
                    }
                }
            }
            
            // Update score based on height
            const newScore = Math.max(0, Math.floor((580 - doodle.y - cameraY) / 10));
            if (newScore > score) {
                score = newScore;
                scoreDisplay.textContent = `Score: ${score}`;
            }
            
            // Game over condition
            if (doodle.y > canvas.height + cameraY) {
                gameOver();
            }
            
            // Generate new platforms as needed
            if (platforms.length < 25) {
                const lastPlatform = platforms[platforms.length - 1];
                if (lastPlatform.y > -100) {
                    const y = lastPlatform.y - 30 - Math.random() * 20;
                    const x = Math.random() * (canvas.width - 100);
                    const width = 60 + Math.random() * 40;
                    const type = Math.random() > 0.8 ? 'breakable' : 
                                Math.random() > 0.7 ? 'moving' : 'normal';
                    
                    platforms.push(new Platform(x, y, width, 15, type));
                }
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 5; i++) {
                const x = (i * 100 + Date.now() * 0.01) % (canvas.width + 100) - 50;
                const y = 50 + i * 30;
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.arc(x + 15, y - 10, 15, 0, Math.PI * 2);
                ctx.arc(x + 30, y, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw platforms
            for (let platform of platforms) {
                platform.draw();
            }
            
            // Draw doodle
            ctx.fillStyle = '#FF69B4';
            ctx.fillRect(doodle.x, doodle.y - cameraY, doodle.width, doodle.height);
            
            // Draw doodle details
            ctx.fillStyle = '#000';
            ctx.fillRect(doodle.x + 10, doodle.y - cameraY + 10, 5, 5); // Eye
            ctx.fillRect(doodle.x + 25, doodle.y - cameraY + 10, 5, 5); // Eye
            ctx.fillRect(doodle.x + 15, doodle.y - cameraY + 25, 10, 3); // Mouth
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'block';
        }

        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    doodle.velocityX = -5;
                    break;
                case 'ArrowRight':
                    doodle.velocityX = 5;
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameRunning) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                case 'ArrowRight':
                    doodle.velocityX = 0;
                    break;
            }
        });

        restartButton.addEventListener('click', initGame);
        startButton.addEventListener('click', initGame);

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
