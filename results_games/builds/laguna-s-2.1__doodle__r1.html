<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; overflow: hidden; background: #87CEEB; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = { x: canvas.width/2, y: canvas.height-100, vx: 0, vy: 0, size: 30 };
let platforms = [];
let score = 0;
let highScore = localStorage.getItem('doodleHighScore') || 0;
let gameOver = false;
let springCount = 0;
let jetCount = 0;

// Generate initial platforms
function initPlatforms() {
    platforms = [];
    for (let i = 0; i < 10; i++) {
        platforms.push({
            x: Math.random() * (canvas.width - 80),
            y: i * 80 + 80,
            width: 80,
            height: 15
        });
    }
}

// Add new platform above
function addPlatform(y) {
    platforms.push({
        x: Math.random() * (canvas.width - 80),
        y: y,
        width: 80,
        height: 15
    });
}

// Input handling
let keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Touch controls
let touchStartX = 0;
window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
});
window.addEventListener('touchmove', e => {
    if (gameOver) return;
    let touch = e.touches[0];
    let dx = touch.clientX - touchStartX;
    player.vx = dx * 0.05;
    touchStartX = touch.clientX;
});
window.addEventListener('touchend', () => {
    player.vx *= 0.9;
});

function update() {
    if (gameOver) return;

    // Horizontal movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -8;
    else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 8;
    else player.vx *= 0.9;

    player.x += player.vx;
    
    // Wrap around screen
    if (player.x < -player.size) player.x = canvas.width;
    if (player.x > canvas.width) player.x = -player.size;

    // Apply gravity
    player.vy += 0.5;
    player.y += player.vy;

    // Check collisions with platforms
    for (let i = platforms.length - 1; i >= 0; i--) {
        let p = platforms[i];
        if (player.vy > 0 && 
            player.x + player.size > p.x && 
            player.x < p.x + p.width && 
            player.y + player.size > p.y && 
            player.y + player.size < p.y + p.height) {
            player.vy = -15;
            player.y = p.y - player.size;
            score += 10;
            if (score > highScore) highScore = score;
        }
    }

    // Remove off-screen platforms and add new ones
    if (player.vy < 0) {
        let scrollY = player.vy;
        for (let i = platforms.length - 1; i >= 0; i--) {
            platforms[i].y -= scrollY;
            if (platforms[i].y > canvas.height) {
                platforms.splice(i, 1);
                addPlatform(Math.random() * 100);
            }
        }
    }

    // Keep enough platforms
    while (platforms.length < 10) {
        addPlatform(Math.random() * -100);
    }

    // Check if player falls below screen
    if (player.y > canvas.height) {
        gameOver = true;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw player
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(player.x, player.y, player.size, player.size);

    // Draw platforms
    ctx.fillStyle = '#4CAF50';
    for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    }

    // Draw score
    ctx.fillStyle = '#000';
    ctx.font = '24px Arial';
    ctx.fillText('Score: ' + score, 20, 40);
    ctx.fillText('High: ' + highScore, 20, 70);

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFF';
        ctx.font = '48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 50);
        ctx.font = '24px Arial';
        ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2);
        ctx.fillText('High Score: ' + highScore, canvas.width/2, canvas.height/2 + 40);
        ctx.fillText('Press SPACE to restart', canvas.width/2, canvas.height/2 + 80);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Restart on spacebar
window.addEventListener('keydown', e => {
    if (e.code === 'Space' && gameOver) {
        player = { x: canvas.width/2, y: canvas.height-100, vx: 0, vy: 0, size: 30 };
        score = 0;
        gameOver = false;
        initPlatforms();
    }
});

initPlatforms();
gameLoop();
</script>
</body>
</html>
