<!DOCTYPE html>
<html>
<head>
<style>
  canvas {
    border: 1px solid black;
  }
</style>
</head>
<body>
<canvas id="canvas" width="400" height="600"></canvas>
<script>
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var bird = { x: 50, y: 200, vy: 0, size: 20 };
  var pipes = [];
  var score = 0;
  var gameOver = false;

  function drawBird() {
    ctx.fillStyle = 'yellow';
    ctx.fillRect(bird.x, bird.y, bird.size, bird.size);
  }

  function drawPipes() {
    for (var i = 0; i < pipes.length; i++) {
      ctx.fillStyle = 'green';
      ctx.fillRect(pipes[i].x, 0, pipes[i].width, pipes[i].topHeight);
      ctx.fillRect(pipes[i].x, pipes[i].topHeight + pipes[i].gap, pipes[i].width, canvas.height - pipes[i].topHeight - pipes[i].gap);
    }
  }

  function updatePipes() {
    for (var i = 0; i < pipes.length; i++) {
      pipes[i].x -= 2;
      if (pipes[i].x < -pipes[i].width) {
        pipes.splice(i, 1);
        score++;
      }
    }
    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
      pipes.push({ x: canvas.width, width: 80, topHeight: Math.random() * 200, gap: 150 });
    }
  }

  function checkCollisions() {
    for (var i = 0; i < pipes.length; i++) {
      if (bird.x + bird.size > pipes[i].x && bird.x < pipes[i].x + pipes[i].width && (bird.y < pipes[i].topHeight || bird.y + bird.size > pipes[i].topHeight + pipes[i].gap)) {
        gameOver = true;
      }
    }
    if (bird.y < 0 || bird.y + bird.size > canvas.height) {
      gameOver = true;
    }
  }

  function updateBird() {
    bird.y += bird.vy;
    bird.vy += 0.5;
  }

  function drawScore() {
    ctx.font = '24px Arial';
    ctx.fillStyle = 'black';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('Score: ' + score, 10, 10);
  }

  function drawGameOver() {
    ctx.font = '48px Arial';
    ctx.fillStyle = 'black';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
  }

  function handleKeyDown(e) {
    if (e.key === ' ') {
      bird.vy = -8;
    }
    if (e.key === 'r' && gameOver) {
      gameOver = false;
      bird = { x: 50, y: 200, vy: 0, size: 20 };
      pipes = [];
      score = 0;
    }
  }

  document.addEventListener('keydown', handleKeyDown);

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!gameOver) {
      updateBird();
      updatePipes();
      checkCollisions();
      drawBird();
      drawPipes();
      drawScore();
    } else {
      drawGameOver();
      ctx.font = '24px Arial';
      ctx.fillStyle = 'black';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 50);
    }
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
