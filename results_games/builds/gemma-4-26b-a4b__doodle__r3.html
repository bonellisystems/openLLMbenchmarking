<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            background: #fafafa;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRAVITY = 0.4;
        const JUMP_STRENGTH = -12;
        const PLAYER_SPEED = 6;
        const PLATFORM_WIDTH = 60;
        const PLATFORM_HEIGHT = 15;

        let player, platforms, cameraY, score, gameOver, keys;

        function init() {
            player = {
                x: canvas.width / 2 - 15,
                y: canvas.height - 150,
                w: 30,
                h: 30,
                dy: 0,
                dx: 0
            };
            platforms = [];
            cameraY = 0;
            score = 0;
            gameOver = false;
            keys = {};

            // Initial platforms
            for (let i = 0; i < 7; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                    y: canvas.height - (i * 100),
                    w: PLATFORM_WIDTH,
                    h: PLATFORM_HEIGHT
                });
            }
            // Ensure first platform is under player
            platforms[0].x = player.x - 15;
            platforms[0].y = player.y + 50;
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (gameOver && e.code === 'Space') init();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (gameOver) return;

            // Player movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -PLAYER_SPEED;
            else if (keys['ArrowRight'] || keys['KeyD']) player.dx = PLAYER_SPEED;
            else player.dx = 0;

            player.x += player.dx;
            player.dy += GRAVITY;
            player.y += player.dy;

            // Screen wrap
            if (player.x + player.w < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.w;

            // Camera follow
            if (player.y < cameraY + 250) {
                cameraY = player.y - 250;
            }

            // Platform collision (only when falling)
            if (player.dy > 0) {
                platforms.forEach(p => {
                    if (player.x < p.x + p.w &&
                        player.x + player.w > p.x &&
                        player.y + player.h > p.y &&
                        player.y + player.h < p.y + p.h + player.dy + 5) {
                        player.dy = JUMP_STRENGTH;
                    }
                });
            }

            // Procedural generation
            if (platforms[platforms.length - 1].y > cameraY - 100) {
                platforms.push({
                    x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                    y: platforms[platforms.length - 1].y - (Math.random() * 60 + 70),
                    w: PLATFORM_WIDTH,
                    h: PLATFORM_HEIGHT
                });
            }

            // Remove old platforms
            if (platforms[0].y > cameraY + canvas.height + 100) {
                platforms.shift();
            }

            // Score
            let currentScore = Math.floor(Math.abs(cameraY / 50));
            if (currentScore > score) score = currentScore;

            // Game over
            if (player.y > cameraY + canvas.height) {
                gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, -cameraY);

            // Draw platforms
            ctx.fillStyle = '#4CAF50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Draw player
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            ctx.restore();

            // Draw score
            ctx.fillStyle = '#333';
            ctx.font = '24px Arial';
            ctx.fillText(`Score: ${score}`, 10, 30);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = '40px Arial';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
