<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #2c3e50;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas {
border: 3px solid #34495e;
border-radius: 8px;
box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 400;
canvas.height = 600;

const GRAVITY = 0.4;
const JUMP_FORCE = -12;
const MOVE_SPEED = 5;
const PLATFORM_WIDTH = 70;
const PLATFORM_HEIGHT = 15;
const PLATFORM_GAP_MIN = 60;
const PLATFORM_GAP_MAX = 110;

let player = {
x: canvas.width / 2 - 20,
y: canvas.height - 150,
width: 40,
height: 40,
vx: 0,
vy: 0,
facing: 1
};

let platforms = [];
let score = 0;
let highScore = 0;
let gameOver = false;
let cameraY = 0;
let keys = {};

function initPlatforms() {
platforms = [];
let y = canvas.height - 50;
platforms.push({ x: canvas.width / 2 - PLATFORM_WIDTH / 2, y: y, type: 'normal' });

while (y > 0) {
y -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
let x = Math.random() * (canvas.width - PLATFORM_WIDTH);
let type = 'normal';
let rand = Math.random();
if (rand < 0.08) type = 'moving';
else if (rand < 0.12) type = 'breakable';
else if (rand < 0.15) type = 'spring';
platforms.push({ x: x, y: y, type: type, vx: type === 'moving' ? (Math.random() < 0.5 ? -2 : 2) : 0 });
}
}

function generatePlatformsAbove() {
let highestPlatform = platforms.reduce((min, p) => p.y < min.y ? p : min, platforms[0]);
while (highestPlatform.y - cameraY > -PLATFORM_GAP_MAX) {
let y = highestPlatform.y - (PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN));
let x = Math.random() * (canvas.width - PLATFORM_WIDTH);
let type = 'normal';
let rand = Math.random();
if (rand < 0.08) type = 'moving';
else if (rand < 0.12) type = 'breakable';
else if (rand < 0.15) type = 'spring';
platforms.push({ x: x, y: y, type: type, vx: type === 'moving' ? (Math.random() < 0.5 ? -2 : 2) : 0 });
highestPlatform = platforms[platforms.length - 1];
}
}

function updatePlayer() {
if (keys['ArrowLeft'] || keys['a']) {
player.vx = -MOVE_SPEED;
player.facing = -1;
} else if (keys['ArrowRight'] || keys['d']) {
player.vx = MOVE_SPEED;
player.facing = 1;
} else {
player.vx *= 0.8;
}

player.vy += GRAVITY;
player.x += player.vx;
player.y += player.vy;

if (player.x < 0) {
player.x = canvas.width - player.width;
} else if (player.x > canvas.width - player.width) {
player.x = 0;
}

if (player.y - cameraY > canvas.height) {
gameOver = true;
}

let targetCameraY = player.y - canvas.height * 0.4;
if (targetCameraY < cameraY) {
cameraY = targetCameraY;
}

score = Math.max(score, Math.floor(-cameraY / 10));
}

function updatePlatforms() {
platforms.forEach(p => {
if (p.type === 'moving') {
p.x += p.vx;
if (p.x <= 0 || p.x + PLATFORM_WIDTH >= canvas.width) {
p.vx *= -1;
}
}
});

platforms = platforms.filter(p => p.y - cameraY < canvas.height + 100);
generatePlatformsAbove();
}

function checkCollisions() {
if (player.vy > 0) {
platforms.forEach(p => {
if (p.broken) return;
if (player.x + player.width > p.x && player.x < p.x + PLATFORM_WIDTH &&
player.y + player.height > p.y && player.y + player.height < p.y + PLATFORM_HEIGHT + player.vy) {
if (p.type === 'breakable') {
p.broken = true;
} else if (p.type === 'spring') {
player.vy = JUMP_FORCE * 1.8;
} else {
player.vy = JUMP_FORCE;
}
}
});
}
}

function drawBackground() {
ctx.fillStyle = '#f0f8ff';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.strokeStyle = '#e0e8f0';
ctx.lineWidth = 1;
for (let i = 0; i < canvas.width; i += 25) {
ctx.beginPath();
ctx.moveTo(i, 0);
ctx.lineTo(i, canvas.height);
ctx.stroke();
}
for (let i = 0; i < canvas.height; i += 25) {
ctx.beginPath();
ctx.moveTo(0, i);
ctx.lineTo(canvas.width, i);
ctx.stroke();
}
}

function drawPlayer() {
let screenY = player.y - cameraY;
let cx = player.x + player.width / 2;
let cy = screenY + player.height / 2;

ctx.save();
ctx.translate(cx, cy);
ctx.scale(player.facing, 1);

ctx.fillStyle = '#4CAF50';
ctx.beginPath();
ctx.ellipse(0, 5, 18, 16, 0, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#388E3C';
ctx.beginPath();
ctx.ellipse(0, 10, 14, 8, 0, 0, Math.PI);
ctx.fill();

ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.ellipse(6, -4, 6, 7, 0, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#000';
ctx.beginPath();
ctx.arc(8, -3, 3, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#4CAF50';
ctx.beginPath();
ctx.ellipse(-10, -12, 5, 8, -0.3, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FFD700';
ctx.fillRect(-3, -22, 6, 10);

ctx.fillStyle = '#4CAF50';
ctx.beginPath();
ctx.ellipse(-12, 14, 6, 4, -0.5, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.ellipse(12, 14, 6, 4, 0.5, 0, Math.PI * 2);
ctx.fill();

ctx.restore();
}

function drawPlatforms() {
platforms.forEach(p => {
if (p.broken) return;
let screenY = p.y - cameraY;
if (screenY < -50 || screenY > canvas.height + 50) return;

if (p.type === 'normal') {
ctx.fillStyle = '#8BC34A';
ctx.beginPath();
ctx.roundRect(p.x, screenY, PLATFORM_WIDTH, PLATFORM_HEIGHT, 5);
ctx.fill();
ctx.fillStyle = '#7CB342';
ctx.fillRect(p.x + 3, screenY + PLATFORM_HEIGHT - 4, PLATFORM_WIDTH - 6, 4);
} else if (p.type === 'moving') {
ctx.fillStyle = '#FF9800';
ctx.beginPath();
ctx.roundRect(p.x, screenY, PLATFORM_WIDTH, PLATFORM_HEIGHT, 5);
ctx.fill();
ctx.fillStyle = '#F57C00';
ctx.fillRect(p.x + 3, screenY + PLATFORM_HEIGHT - 4, PLATFORM_WIDTH - 6, 4);
ctx.fillStyle = '#fff';
ctx.font = '10px Arial';
ctx.fillText('→', p.x + PLATFORM_WIDTH / 2 - 4, screenY + 11);
} else if (p.type === 'breakable') {
ctx.fillStyle = '#9E9E9E';
ctx.beginPath();
ctx.roundRect(p.x, screenY, PLATFORM_WIDTH, PLATFORM_HEIGHT, 5);
ctx.fill();
ctx.strokeStyle = '#757575';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(p.x + 15, screenY + 2);
ctx.lineTo(p.x + 25, screenY + PLATFORM_HEIGHT - 2);
ctx.moveTo(p.x + 40, screenY + 2);
ctx.lineTo(p.x + 50, screenY + PLATFORM_HEIGHT - 2);
ctx.stroke();
} else if (p.type === 'spring') {
ctx.fillStyle = '#E91E63';
ctx.beginPath();
ctx.roundRect(p.x, screenY, PLATFORM_WIDTH, PLATFORM_HEIGHT, 5);
ctx.fill();
ctx.fillStyle = '#C2185B';
ctx.fillRect(p.x + 15, screenY - 8, 40, 8);
ctx.fillStyle = '#FFC107';
ctx.beginPath();
ctx.arc(p.x + PLATFORM_WIDTH / 2, screenY - 4, 6, 0, Math.PI * 2);
ctx.fill();
}
});
}

function drawUI() {
ctx.fillStyle = '#333';
ctx.font = 'bold 20px Arial';
ctx.textAlign = 'left';
ctx.fillText('Score: ' + score, 15, 30);

ctx.textAlign = 'right';
ctx.fillText('Best: ' + highScore, canvas.width - 15, 30);

if (gameOver) {
ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#fff';
ctx.font = 'bold 40px Arial';
ctx.textAlign = 'center';
ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

ctx.font = '24px Arial';
ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);

ctx.font = '18px Arial';
ctx.fillStyle = '#aaa';
ctx.fillText('Press SPACE or ENTER to restart', canvas.width / 2, canvas.height / 2 + 50);
ctx.fillText('Arrow keys or A/D to move', canvas.width / 2, canvas.height / 2 + 80);
}
}

function resetGame() {
player.x = canvas.width / 2 - 20;
player.y = canvas.height - 150;
player.vx = 0;
player.vy = 0;
player.facing = 1;
score = 0;
cameraY = 0;
gameOver = false;
initPlatforms();
}

function gameLoop() {
if (!gameOver) {
updatePlayer();
updatePlatforms();
checkCollisions();
}

drawBackground();
drawPlatforms();
drawPlayer();
drawUI();

requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
keys[e.key] = true;

if ((e.key === ' ' || e.key === 'Enter') && gameOver) {
highScore = Math.max(highScore, score);
resetGame();
}

if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
e.preventDefault();
}
});

document.addEventListener('keyup', (e) => {
keys[e.key] = false;
});

initPlatforms();
gameLoop();
</script>
</body>
</html>
