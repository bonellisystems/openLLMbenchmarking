<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; }
canvas { background:#222; display:block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<script>
// Game constants
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, direction, nextDirection, food, score, gameRunning;

// Initialize game
function init() {
  snake = [{x: 9, y: 9}];
  direction = 'ArrowRight';
  nextDirection = direction;
  placeFood();
  score = 0;
  gameRunning = true;
  requestAnimationFrame(gameLoop);
}

// Place food at random position not occupied by snake
function placeFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  // Ensure food not on snake
  for (let segment of snake) {
    if (segment.x === food.x && segment.y === food.y) {
      placeFood();
      return;
    }
  }
}

// Draw everything
function draw() {
  // Clear canvas
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw snake
  ctx.fillStyle = '#0f0';
  for (let segment of snake) {
    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize-1, gridSize-1);
  }

  // Draw food
  ctx.fillStyle = '#f00';
  ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize-1, gridSize-1);

  // Draw score
  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText('Score: ' + score, 10, canvas.height - 10);
}

// Update snake position and handle collisions
function update() {
  // Apply next direction
  direction = nextDirection;

  // Compute new head position
  const headX = snake[0].x;
  const headY = snake[0].y;
  switch (direction) {
    case 'ArrowUp': headY--; break;
    case 'ArrowDown': headY++; break;
    case 'ArrowLeft': headX--; break;
    case 'ArrowRight': headX++; break;
  }

  // Check wall collision
  if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
    gameOver();
    return;
  }

  // Check self collision
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === headX && snake[i].y === headY) {
      gameOver();
      return;
    }
  }

  // Create new head
  const newHead = {x: headX, y: headY};
  snake.unshift(newHead);

  // Check food collision
  if (headX === food.x && headY === food.y) {
    score++;
    placeFood();
  } else {
    // Remove tail
    snake.pop();
  }
}

// Game over handling
function gameOver() {
  gameRunning = false;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = '30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
  ctx.font = '20px Arial';
  ctx.fillText('Press R to Restart', canvas.width/2, canvas.height/2 + 30);
}

// Game loop
function gameLoop() {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// Keyboard controls
document.addEventListener('keydown', event => {
  switch (event.key) {
    case 'ArrowUp':
    case 'ArrowDown':
    case 'ArrowLeft':
    case 'ArrowRight':
      // Prevent default scrolling
      event.preventDefault();
      // Disallow reversing direction
      if (event.key === 'ArrowUp' && direction !== 'ArrowDown') nextDirection = 'ArrowUp';
      else if (event.key === 'ArrowDown' && direction !== 'ArrowUp') nextDirection = 'ArrowDown';
      else if (event.key === 'ArrowLeft' && direction !== 'ArrowRight') nextDirection = 'ArrowLeft';
      else if (event.key === 'ArrowRight' && direction !== 'ArrowLeft') nextDirection = 'ArrowRight';
      break;
    case 'r':
    case 'R':
      if (!gameRunning) init();
      break;
  }
});

// Start game
init();
</script>
</body>
</html>
