<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Procedural City Flight</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<script>
(() => {
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl');
    if (!gl) { alert('WebGL not supported'); return; }

    // Resize canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0,0,canvas.width,canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    // Shaders
    const vsSource = `
    attribute vec3 aPosition;
    uniform mat4 uMVP;
    void main(void) {
        gl_Position = uMVP * vec4(aPosition,1.0);
    }`;
    const fsSource = `
    precision mediump float;
    uniform vec3 uColor;
    void main(void) {
        gl_FragColor = vec4(uColor,1.0);
    }`;

    function compileShader(src, type) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(sh));
            return null;
        }
        return sh;
    }
    const vertexShader = compileShader(vsSource, gl.VERTEX_SHADER);
    const fragmentShader = compileShader(fsSource, gl.FRAGMENT_SHADER);
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return;
    }
    gl.useProgram(program);
    const aPosition = gl.getAttribLocation(program, 'aPosition');
    const uMVP = gl.getUniformLocation(program, 'uMVP');
    const uColor = gl.getUniformLocation(program, 'uColor');

    // Cube geometry (size 1 centered at origin)
    const cubeVerts = new Float32Array([
        // Front
        -0.5,-0.5, 0.5,  0.5,-0.5, 0.5,  0.5, 0.5, 0.5,
        -0.5,-0.5, 0.5,  0.5, 0.5, 0.5, -0.5, 0.5, 0.5,
        // Back
        -0.5,-0.5,-0.5, -0.5, 0.5,-0.5,  0.5, 0.5,-0.5,
        -0.5,-0.5,-0.5,  0.5, 0.5,-0.5,  0.5,-0.5,-0.5,
        // Top
        -0.5, 0.5,-0.5, -0.5, 0.5, 0.5,  0.5, 0.5, 0.5,
        -0.5, 0.5,-0.5,  0.5, 0.5, 0.5,  0.5, 0.5,-0.5,
        // Bottom
        -0.5,-0.5,-0.5,  0.5,-0.5,-0.5,  0.5,-0.5, 0.5,
        -0.5,-0.5,-0.5,  0.5,-0.5, 0.5, -0.5,-0.5, 0.5,
        // Right
        0.5,-0.5,-0.5,  0.5, 0.5,-0.5,  0.5, 0.5, 0.5,
        0.5,-0.5,-0.5,  0.5, 0.5, 0.5,  0.5,-0.5, 0.5,
        // Left
        -0.5,-0.5,-0.5, -0.5,-0.5, 0.5, -0.5, 0.5, 0.5,
        -0.5,-0.5,-0.5, -0.5, 0.5, 0.5, -0.5, 0.5,-0.5
    ]);
    const cubeVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, cubeVBO);
    gl.bufferData(gl.ARRAY_BUFFER, cubeVerts, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(aPosition,3,gl.FLOAT,false,0,0);

    gl.enable(gl.DEPTH_TEST);
    gl.clearColor(0.5,0.8,0.9,1.0);

    // Matrix utilities (column-major)
    function mat4Identity() {
        const m = new Float32Array(16);
        m[0]=m[5]=m[10]=m[15]=1;
        return m;
    }
    function mat4Perspective(fov,aspect,near,far){
        const f = 1.0/Math.tan(fov/2);
        const nf = 1/(near-far);
        const m = new Float32Array(16);
        m[0]=f/aspect; m[5]=f; m[10]=(far+near)*nf; m[11]=-1;
        m[14]=(2*far*near)*nf;
        return m;
    }
    function mat4Multiply(a,b){
        const out = new Float32Array(16);
        for(let i=0;i<4;i++){
            for(let j=0;j<4;j++){
                out[i*4+j]=a[i*4+0]*b[0*4+j]+a[i*4+1]*b[1*4+j]+a[i*4+2]*b[2*4+j]+a[i*4+3]*b[3*4+j];
            }
        }
        return out;
    }
    function mat4Translate(m,x,y,z){
        const t = mat4Identity();
        t[12]=x; t[13]=y; t[14]=z;
        return mat4Multiply(m,t);
    }
    function mat4Scale(m,x,y,z){
        const s = mat4Identity();
        s[0]=x; s[5]=y; s[10]=z;
        return mat4Multiply(m,s);
    }
    function vec3Normalize(v){
        const len=Math.hypot(v[0],v[1],v[2]);
        return len>0?[v[0]/len,v[1]/len,v[2]/len]:[0,0,0];
    }
    function vec3Cross(a,b){
        return [
            a[1]*b[2]-a[2]*b[1],
            a[2]*b[0]-a[0]*b[2],
            a[0]*b[1]-a[1]*b[0]
        ];
    }
    function mat4LookAt(eye,center,up){
        const z = vec3Normalize([eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]]);
        const x = vec3Normalize(vec3Cross(up,z));
        const y = vec3Cross(z,x);
        const m = mat4Identity();
        m[0]=x[0]; m[1]=y[0]; m[2]=z[0];
        m[4]=x[1]; m[5]=y[1]; m[6]=z[1];
        m[8]=x[2]; m[9]=y[2]; m[10]=z[2];
        m[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);
        m[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
        m[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
        return m;
    }

    // City generation
    const city = [];
    const gridSize = 30;
    const spacing = 8;
    for(let i=-gridSize;i<=gridSize;i++){
        for(let j=-gridSize;j<=gridSize;j++){
            const height = 1+Math.random()*8;
            city.push({x:i*spacing, z:j*spacing, h:height});
        }
    }

    // Camera (plane) state
    const cam = {
        pos:[0,5,20],
        yaw:0, // rotation around Y axis
        pitch:0 // rotation around X axis
    };
    const keys = {};
    window.addEventListener('keydown',e=>{keys[e.code]=true;});
    window.addEventListener('keyup',e=>{keys[e.code]=false;});

    function update(dt){
        const speed=20*dt;
        const turnSpeed=1.5*dt;
        // Yaw/Pitch
        if(keys['ArrowLeft']) cam.yaw+=turnSpeed;
        if(keys['ArrowRight']) cam.yaw-=turnSpeed;
        if(keys['ArrowUp']) cam.pitch+=turnSpeed;
        if(keys['ArrowDown']) cam.pitch-=turnSpeed;
        // Clamp pitch
        const maxPitch=Math.PI/2-0.01;
        if(cam.pitch>maxPitch) cam.pitch=maxPitch;
        if(cam.pitch<-maxPitch) cam.pitch=-maxPitch;
        // Direction vectors
        const forward = [
            Math.cos(cam.pitch)*Math.sin(cam.yaw),
            Math.sin(cam.pitch),
            Math.cos(cam.pitch)*Math.cos(cam.yaw)
        ];
        const right = [
            Math.sin(cam.yaw - Math.PI/2),
            0,
            Math.cos(cam.yaw - Math.PI/2)
        ];
        if(keys['KeyW']) cam.pos = cam.pos.map((v,i)=>v+forward[i]*speed);
        if(keys['KeyS']) cam.pos = cam.pos.map((v,i)=>v-forward[i]*speed);
        if(keys['KeyA']) cam.pos = cam.pos.map((v,i)=>v-right[i]*speed);
        if(keys['KeyD']) cam.pos = cam.pos.map((v,i)=>v+right[i]*speed);
    }

    // Render loop
    let lastTime=0;
    function render(time){
        const dt=(time-lastTime)/1000;
        lastTime=time;
        update(dt);
        gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
        const aspect=canvas.width/canvas.height;
        const proj=mat4Perspective(Math.PI/3,aspect,0.1,1000);
        const target = [
            cam.pos[0]+Math.cos(cam.pitch)*Math.sin(cam.yaw),
            cam.pos[1]+Math.sin(cam.pitch),
            cam.pos[2]+Math.cos(cam.pitch)*Math.cos(cam.yaw)
        ];
        const view=mat4LookAt(cam.pos,target,[0,1,0]);
        const vp=mat4Multiply(proj,view);
        // Draw buildings
        for(const b of city){
            let model=mat4Identity();
            model=mat4Translate(model,b.x, b.h/2, b.z);
            model=mat4Scale(model,1,b.h,1);
            const mvp=mat4Multiply(vp,model);
            gl.uniformMatrix4fv(uMVP,false,mvp);
            const hue = b.h/10;
            const r = Math.abs(Math.sin(hue*Math.PI));
            const g = Math.abs(Math.sin((hue+0.33)*Math.PI));
            const bcol = Math.abs(Math.sin((hue+0.66)*Math.PI));
            gl.uniform3f(uColor,r,g,bcol);
            gl.drawArrays(gl.TRIANGLES,0,cubeVerts.length/3);
        }
        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
})();
</script>
</body>
</html>
