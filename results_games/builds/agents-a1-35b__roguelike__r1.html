<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Roguelike</title>
<style>
body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; background: #000; }
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 40;
const H = 20;
const S = 20;

let map = [];
let player = {x: 1, y: 1};
let stairs = {x: 0, y: 0};
let enemies = [];

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generate() {
    map = [];
    enemies = [];
    for (let y = 0; y < H; y++) {
        let row = [];
        for (let x = 0; x < W; x++) {
            row.push(1);
        }
        map.push(row);
    }

    let rooms = [];
    for (let i = 0; i < 6; i++) {
        let w = rand(3, 6);
        let h = rand(3, 6);
        let x = rand(1, W - w - 1);
        let y = rand(1, H - h - 1);
        rooms.push({x, y, w, h});
        for (let ry = y; ry < y + h; ry++) {
            for (let rx = x; rx < x + w; rx++) {
                map[ry][rx] = 0;
            }
        }
    }

    for (let i = 0; i < rooms.length - 1; i++) {
        let r1 = rooms[i];
        let r2 = rooms[i+1];
        let c1x = Math.floor(r1.x + r1.w / 2);
        let c1y = Math.floor(r1.y + r1.h / 2);
        let c2x = Math.floor(r2.x + r2.w / 2);
        let c2y = Math.floor(r2.y + r2.h / 2);

        let cx = c2x;
        let cy = c1y;
        for (let x = Math.min(c1x, cx); x <= Math.max(c1x, cx); x++) map[c1y][x] = 0;
        for (let y = Math.min(c1y, cy); y <= Math.max(c1y, cy); y++) map[y][cx] = 0;
        for (let x = Math.min(cx, c2x); x <= Math.max(cx, c2x); x++) map[cy][x] = 0;
        for (let y = Math.min(cy, c2y); y <= Math.max(cy, c2y); y++) map[y][c2x] = 0;
    }

    player.x = Math.floor(rooms[0].x + rooms[0].w / 2);
    player.y = Math.floor(rooms[0].y + rooms[0].h / 2);

    stairs.x = Math.floor(rooms[rooms.length-1].x + rooms[rooms.length-1].w / 2);
    stairs.y = Math.floor(rooms[rooms.length-1].y + rooms[rooms.length-1].h / 2);

    for (let i = 0; i < 5; i++) {
        let ex, ey;
        do {
            ex = rand(1, W-2);
            ey = rand(1, H-2);
        } while (map[ey][ex] !== 0 || (ex === player.x && ey === player.y));
        enemies.push({x: ex, y: ey});
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            let t = map[y][x];
            let px = x * S + S/2;
            let py = y * S + S/2;
            if (t === 1) {
                ctx.fillStyle = '#333';
                ctx.fillText('#', px, py);
            } else {
                ctx.fillStyle = '#555';
                ctx.fillText('.', px, py);
            }
        }
    }

    ctx.fillStyle = '#0F0';
    ctx.fillText('>', stairs.x * S + S/2, stairs.y * S + S/2);

    ctx.fillStyle = '#FF0';
    ctx.fillText('@', player.x * S + S/2, player.y * S + S/2);

    ctx.fillStyle = '#F00';
    for (let e of enemies) {
        ctx.fillText('E', e.x * S + S/2, e.y * S + S/2);
    }
}

function move(dx, dy) {
    let nx = player.x + dx;
    let ny = player.y + dy;

    if (map[ny][nx] === 1) return;

    for (let e of enemies) {
        if (e.x === nx && e.y === ny) {
            generate();
            return;
        }
    }

    player.x = nx;
    player.y = ny;

    for (let e of enemies) {
        let ex = e.x + rand(-1, 1);
        let ey = e.y + rand(-1, 1);
        if (map[ey][ex] === 0 && !(ex === player.x && ey === player.y)) {
            e.x = ex;
            e.y = ey;
        }
    }

    if (player.x === stairs.x && player.y === stairs.y) {
        generate();
    }

    draw();
}

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') move(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's') move(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a') move(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd') move(1, 0);
});

generate();
draw();
</script>
</body>
</html>
