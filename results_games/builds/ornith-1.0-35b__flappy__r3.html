<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Arial', sans-serif;
}
canvas {
display: block;
border: 2px solid #333;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 400;
const H = 600;
canvas.width = W;
canvas.height = H;

const GRAVITY = 0.45;
const FLAP_POWER = -7.5;
const PIPE_WIDTH = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_SPAWN_INTERVAL = 100;
const BIRD_SIZE = 20;
const GROUND_HEIGHT = 80;

let bird, pipes, score, bestScore, gameState, frameCount, groundOffset;

bestScore = 0;

function init() {
    bird = {
        x: 80,
        y: H / 2 - 50,
        vy: 0,
        rotation: 0,
        flapFrame: 0
    };
    pipes = [];
    score = 0;
    frameCount = 0;
    groundOffset = 0;
    gameState = 'ready';
}

function flap() {
    if (gameState === 'ready') {
        gameState = 'playing';
        bird.vy = FLAP_POWER;
        bird.flapFrame = 10;
    } else if (gameState === 'playing') {
        bird.vy = FLAP_POWER;
        bird.flapFrame = 10;
    } else if (gameState === 'dead') {
        init();
    }
}

document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener('click', function(e) {
    e.preventDefault();
    flap();
});

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    flap();
});

function spawnPipe() {
    const minY = 80;
    const maxY = H - GROUND_HEIGHT - PIPE_GAP - 80;
    const topHeight = minY + Math.random() * (maxY - minY);
    pipes.push({
        x: W + 10,
        topHeight: topHeight,
        scored: false
    });
}

function update() {
    frameCount++;

    if (gameState === 'ready') {
        bird.y = H / 2 - 50 + Math.sin(frameCount * 0.05) * 15;
        groundOffset = (groundOffset + PIPE_SPEED) % 24;
        return;
    }

    if (gameState !== 'playing') return;

    bird.vy += GRAVITY;
    bird.y += bird.vy;
    if (bird.flapFrame > 0) bird.flapFrame--;

    bird.rotation = Math.min(bird.vy * 3, 90);
    if (bird.vy < 0) bird.rotation = Math.max(bird.vy * 4, -30);

    groundOffset = (groundOffset + PIPE_SPEED) % 24;

    if (frameCount % PIPE_SPAWN_INTERVAL === 0) {
        spawnPipe();
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;

        if (pipes[i].x + PIPE_WIDTH < bird.x && !pipes[i].scored) {
            pipes[i].scored = true;
            score++;
        }

        if (pipes[i].x < -PIPE_WIDTH - 10) {
            pipes.splice(i, 1);
        }
    }

    if (bird.y + BIRD_SIZE > H - GROUND_HEIGHT || bird.y - BIRD_SIZE < 0) {
        die();
        return;
    }

    for (let pipe of pipes) {
        if (bird.x + BIRD_SIZE > pipe.x && bird.x - BIRD_SIZE < pipe.x + PIPE_WIDTH) {
            if (bird.y - BIRD_SIZE < pipe.topHeight || bird.y + BIRD_SIZE > pipe.topHeight + PIPE_GAP) {
                die();
                return;
            }
        }
    }
}

function die() {
    gameState = 'dead';
    if (score > bestScore) bestScore = score;
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H - GROUND_HEIGHT);
    gradient.addColorStop(0, '#4ec0ca');
    gradient.addColorStop(1, '#71c5cf');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H - GROUND_HEIGHT);

    ctx.fillStyle = '#5eb54a';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);

    ctx.fillStyle = '#4a9e3a';
    ctx.fillRect(0, H - GROUND_HEIGHT, W, 15);

    ctx.fillStyle = '#8B6914';
    for (let x = -groundOffset; x < W + 24; x += 24) {
        ctx.fillRect(x, H - GROUND_HEIGHT + 15, 12, GROUND_HEIGHT - 15);
        ctx.fillStyle = '#7a5c12';
        ctx.fillRect(x + 12, H - GROUND_HEIGHT + 15, 12, GROUND_HEIGHT - 15);
        ctx.fillStyle = '#8B6914';
    }

    ctx.fillStyle = '#2d8a2d';
    for (let x = -groundOffset; x < W + 24; x += 24) {
        ctx.fillRect(x + 4, H - GROUND_HEIGHT + 15, 4, 8);
    }
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation * Math.PI / 180);

    ctx.fillStyle = '#f5c842';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_SIZE, BIRD_SIZE * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -4, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(9, -3, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e85830';
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(24, 2);
    ctx.lineTo(14, 5);
    ctx.closePath();
    ctx.fill();

    if (bird.flapFrame > 5) {
        ctx.fillStyle = '#f5c842';
        ctx.beginPath();
        ctx.ellipse(-2, 6, 10, 6, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d4a017';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    } else if (bird.flapFrame > 0) {
        ctx.fillStyle = '#f5c842';
        ctx.beginPath();
        ctx.ellipse(-2, 4, 10, 5, -0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d4a017';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    ctx.restore();
}

function drawPipe(pipe) {
    const capWidth = PIPE_WIDTH + 10;
    const capOverhang = 5;

    ctx.fillStyle = '#5cb85c';
    ctx.strokeStyle = '#3a7a3a';
    ctx.lineWidth = 2;

    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);
    ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, pipe.topHeight);

    ctx.fillStyle = '#4da84d';
    ctx.fillRect(pipe.x + 4, 0, PIPE_WIDTH - 8, pipe.topHeight);

    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(pipe.x - capOverhang, pipe.topHeight - 26, capWidth, 26);
    ctx.strokeRect(pipe.x - capOverhang, pipe.topHeight - 26, capWidth, 26);

    ctx.fillStyle = '#4da84d';
    ctx.fillRect(pipe.x - capOverhang + 3, pipe.topHeight - 26, capWidth - 6, 26);

    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(pipe.x, pipe.topHeight + PIPE_GAP, PIPE_WIDTH, H - GROUND_HEIGHT - pipe.topHeight - PIPE_GAP);
    ctx.strokeRect(pipe.x, pipe.topHeight + PIPE_GAP, PIPE_WIDTH, H - GROUND_HEIGHT - pipe.topHeight - PIPE_GAP);

    ctx.fillStyle = '#4da84d';
    ctx.fillRect(pipe.x + 4, pipe.topHeight + PIPE_GAP, PIPE_WIDTH - 8, H - GROUND_HEIGHT - pipe.topHeight - PIPE_GAP);

    ctx.fillStyle = '#5cb85c';
    ctx.fillRect(pipe.x - capOverhang, pipe.topHeight + PIPE_GAP, capWidth, 26);
    ctx.strokeRect(pipe.x - capOverhang, pipe.topHeight + PIPE_GAP, capWidth, 26);

    ctx.fillStyle = '#4da84d';
    ctx.fillRect(pipe.x - capOverhang + 3, pipe.topHeight + PIPE_GAP, capWidth - 6, 26);
}

function drawScore() {
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText(score, W / 2, 70);
    ctx.fillText(score, W / 2, 70);
}

function drawReady() {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText('Flappy Bird', W / 2, H / 2 - 60);
    ctx.fillText('Flappy Bird', W / 2, H / 2 - 60);

    ctx.font = '20px Arial';
    ctx.lineWidth = 2;
    ctx.strokeText('Press Space or Click to Start', W / 2, H / 2);
    ctx.fillText('Press Space or Click to Start', W / 2, H / 2);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.strokeText('Game Over', W / 2, H / 2 - 50);
    ctx.fillText('Game Over', W / 2, H / 2 - 50);

    ctx.font = '24px Arial';
    ctx.lineWidth = 2;
    ctx.strokeText('Score: ' + score, W / 2, H / 2 + 10);
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 10);

    ctx.strokeText('Best: ' + bestScore, W / 2, H / 2 + 45);
    ctx.fillText('Best: ' + bestScore, W / 2, H / 2 + 45);

    ctx.font = '18px Arial';
    ctx.strokeText('Press Space or Click to Restart', W / 2, H / 2 + 90);
    ctx.fillText('Press Space or Click to Restart', W / 2, H / 2 + 90);
}

function draw() {
    drawBackground();

    for (let pipe of pipes) {
        drawPipe(pipe);
    }

    drawBird();
    drawScore();

    if (gameState === 'ready') drawReady();
    if (gameState === 'dead') drawGameOver();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

init();
gameLoop();
</script>
</body>
</html>
