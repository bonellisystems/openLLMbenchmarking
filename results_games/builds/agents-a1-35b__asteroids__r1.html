<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
    body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: monospace; }
    canvas { border: 2px solid #555; background: #000; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // Game State
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let asteroids = [];
    let lasers = [];
    let keys = {};
    let frame = 0;

    // Ship
    const ship = {
        x: W/2, y: H/2,
        angle: -Math.PI/2,
        vx: 0, vy: 0,
        radius: 15,
        thrusting: false,
        rotLeft: false,
        rotRight: false,
        invulnerable: true,
        invulnTime: 180, // 3 sec at 60fps
        blink: 0,
        shootTimer: 0
    };

    // Input
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Helper: Random
    const rand = (min, max) => Math.random() * (max - min) + min;

    // Helper: Spawn Asteroid
    function spawnAsteroid(size) {
        let x, y, vx, vy, dist;
        // Ensure not too close to ship
        do {
            x = rand(0, W);
            y = rand(0, H);
            vx = rand(-2, 2);
            vy = rand(-2, 2);
            dist = Math.hypot(x - ship.x, y - ship.y);
        } while (dist < 150);

        const vertices = [];
        const sides = Math.floor(rand(5, 9));
        for (let i = 0; i < sides; i++) {
            const r = rand(size * 0.8, size * 1.2);
            const a = rand(0, Math.PI * 2);
            vertices.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }

        asteroids.push({
            x, y, vx, vy,
            size, radius: size,
            vertices,
            type: size === 40 ? 'large' : size === 20 ? 'medium' : 'small'
        });
    }

    // Init
    for(let i=0; i<4; i++) spawnAsteroid(40);

    // Update
    function update() {
        if (gameOver) {
            if (keys['Space']) resetGame();
            return;
        }

        frame++;

        // Ship Controls
        if (keys['ArrowUp']) {
            ship.thrusting = true;
            ship.vx += Math.cos(ship.angle) * 0.15;
            ship.vy += Math.sin(ship.angle) * 0.15;
        } else {
            ship.thrusting = false;
        }
        if (keys['ArrowLeft']) ship.angle -= 0.1;
        if (keys['ArrowRight']) ship.angle += 0.1;

        // Ship Physics
        ship.x += ship.vx;
        ship.y += ship.vy;
        ship.vx *= 0.99; // Friction
        ship.vy *= 0.99;

        // Screen Wrap
        if (ship.x < 0) ship.x = W;
        if (ship.x > W) ship.x = 0;
        if (ship.y < 0) ship.y = H;
        if (ship.y > H) ship.y = 0;

        // Invulnerability
        if (ship.invulnerable) {
            ship.invulnTime--;
            ship.blink = Math.floor(ship.invulnTime / 5) % 2;
            if (ship.invulnTime <= 0) ship.invulnerable = false;
        }

        // Shooting
        if (ship.shootTimer > 0) ship.shootTimer--;
        if (keys['Space'] && ship.shootTimer <= 0) {
            lasers.push({
                x: ship.x + Math.cos(ship.angle) * 20,
                y: ship.y + Math.sin(ship.angle) * 20,
                vx: Math.cos(ship.angle) * 8,
                vy: Math.sin(ship.angle) * 8,
                life: 60
            });
            ship.shootTimer = 15;
        }

        // Lasers
        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i];
            l.x += l.vx;
            l.y += l.vy;
            l.life--;
            if (l.life <= 0) {
                lasers.splice(i, 1);
                continue;
            }
            // Wrap
            if (l.x < 0) l.x = W;
            if (l.x > W) l.x = 0;
            if (l.y < 0) l.y = H;
            if (l.y > H) l.y = 0;
        }

        // Asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            let a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            // Wrap
            if (a.x < 0) a.x = W;
            if (a.x > W) a.x = 0;
            if (a.y < 0) a.y = H;
            if (a.y > H) a.y = 0;

            // Collision: Laser vs Asteroid
            let laserHit = false;
            for (let j = lasers.length - 1; j >= 0; j--) {
                let l = lasers[j];
                let dist = Math.hypot(a.x - l.x, a.y - l.y);
                if (dist < a.radius + 5) {
                    lasers.splice(j, 1);
                    // Split or Destroy
                    if (a.size > 20) {
                        spawnAsteroid(a.size / 2);
                        spawnAsteroid(a.size / 2);
                    }
                    asteroids.splice(i, 1);
                    score += (a.size === 40 ? 20 : a.size === 20 ? 50 : 100);
                    laserHit = true;
                    break;
                }
            }
            if (laserHit) continue;

            // Collision: Ship vs Asteroid
            if (!ship.invulnerable) {
                let dist = Math.hypot(a.x - ship.x, a.y - ship.y);
                if (dist < a.radius + ship.radius) {
                    lives--;
                    asteroids.splice(i, 1);
                    if (lives <= 0) {
                        gameOver = true;
                    } else {
                        ship.x = W/2; ship.y = H/2;
                        ship.vx = 0; ship.vy = 0;
                        ship.invulnerable = true;
                        ship.invulnTime = 180;
                    }
                    continue;
                }
            }
        }

        // Respawn Asteroids if too few
        if (asteroids.length < 3) spawnAsteroid(40);
    }

    // Draw
    function draw() {
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, W, H);

        if (gameOver) {
            ctx.fillStyle = 'white';
            ctx.font = '40px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', W/2, H/2);
            ctx.font = '20px monospace';
            ctx.fillText('Press Space to Restart', W/2, H/2 + 40);
            return;
        }

        // Draw Ship
        if (!ship.invulnerable || ship.blink) {
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ship.x + Math.cos(ship.angle) * 20, ship.y + Math.sin(ship.angle) * 20);
            ctx.lineTo(ship.x + Math.cos(ship.angle + 2.5) * 15, ship.y + Math.sin(ship.angle + 2.5) * 10);
            ctx.lineTo(ship.x + Math.cos(ship.angle - 2.5) * 15, ship.y + Math.sin(ship.angle - 2.5) * 10);
            ctx.closePath();
            ctx.stroke();
            if (ship.thrusting) {
                ctx.fillStyle = 'orange';
                ctx.beginPath();
                ctx.arc(ship.x - Math.cos(ship.angle) * 15, ship.y - Math.sin(ship.angle) * 15, 5, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // Draw Lasers
        ctx.fillStyle = 'yellow';
        for (let l of lasers) {
            ctx.fillRect(l.x - 2, l.y - 2, 4, 4);
        }

        // Draw Asteroids
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        for (let a of asteroids) {
            ctx.beginPath();
            ctx.moveTo(a.x + a.vertices[0].x, a.y + a.vertices[0].y);
            for (let v of a.vertices) {
                ctx.lineTo(a.x + v.x, a.y + v.y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        // UI
        ctx.fillStyle = 'white';
        ctx.font = '20px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('Score: ' + score, 10, 30);
        ctx.textAlign = 'right';
        ctx.fillText('Lives: ' + lives, W - 10, 30);
    }

    function resetGame() {
        score = 0;
        lives = 3;
        gameOver = false;
        asteroids = [];
        lasers = [];
        ship.x = W/2; ship.y = H/2;
        ship.vx = 0; ship.vy = 0;
        ship.invulnerable = true;
        ship.invulnTime = 180;
        for(let i=0; i<4; i++) spawnAsteroid(40);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
})();
</script>
</body>
</html>
