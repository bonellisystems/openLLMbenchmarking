<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; overflow: hidden; background: #000; }
#game { white-space: pre; font-family: monospace; font-size: 16px; line-height: 16px; color: #0f0; }
</style>
</head>
<body>
<div id="game"></div>
<script>
const TILE_SIZE = 16;
const MAP_WIDTH = 60;
const MAP_HEIGHT = 40;
const MAX_ROOMS = 8;
const ROOM_MIN = 4;
const ROOM_MAX = 8;

let dungeon = [];
let player = {x:0, y:0};
let exit = {x:0, y:0};
let gameOver = false;

function initDungeon() {
    dungeon = Array(MAP_HEIGHT).fill().map(() => Array(MAP_WIDTH).fill('#'));
    let rooms = [];
    
    for (let i = 0; i < MAX_ROOMS; i++) {
        let w = Math.floor(Math.random() * (ROOM_MAX - ROOM_MIN + 1)) + ROOM_MIN;
        let h = Math.floor(Math.random() * (ROOM_MAX - ROOM_MIN + 1)) + ROOM_MIN;
        let x = Math.floor(Math.random() * (MAP_WIDTH - w - 2)) + 1;
        let y = Math.floor(Math.random() * (MAP_HEIGHT - h - 2)) + 1;
        
        let roomOk = true;
        for (let ry = y - 1; ry <= y + h; ry++) {
            for (let rx = x - 1; rx <= x + w; rx++) {
                if (dungeon[ry] && dungeon[ry][rx] === '.') {
                    roomOk = false;
                    break;
                }
            }
            if (!roomOk) break;
        }
        
        if (roomOk) {
            for (let ry = y; ry < y + h; ry++) {
                for (let rx = x; rx < x + w; rx++) {
                    dungeon[ry][rx] = '.';
                }
            }
            
            if (rooms.length > 0) {
                let prev = rooms[rooms.length - 1];
                let prevCenterX = prev.x + Math.floor(prev.w / 2);
                let prevCenterY = prev.y + Math.floor(prev.h / 2);
                let newCenterX = x + Math.floor(w / 2);
                let newCenterY = y + Math.floor(h / 2);
                
                // Horizontal then vertical tunnel
                let startX = Math.min(prevCenterX, newCenterX);
                let endX = Math.max(prevCenterX, newCenterX);
                for (let tx = startX; tx <= endX; tx++) {
                    dungeon[prevCenterY][tx] = '.';
                }
                let startY = Math.min(prevCenterY, newCenterY);
                let endY = Math.max(prevCenterY, newCenterY);
                for (let ty = startY; ty <= endY; ty++) {
                    dungeon[ty][newCenterX] = '.';
                }
            }
            
            rooms.push({x, y, w, h});
        }
    }
    
    if (rooms.length > 0) {
        let startRoom = rooms[0];
        player.x = startRoom.x + Math.floor(startRoom.w / 2);
        player.y = startRoom.y + Math.floor(startRoom.h / 2);
        
        let endRoom = rooms[rooms.length - 1];
        exit.x = endRoom.x + Math.floor(endRoom.w / 2);
        exit.y = endRoom.y + Math.floor(endRoom.h / 2);
    }
}

function render() {
    let html = '';
    for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
            if (x === player.x && y === player.y) {
                html += '@';
            } else if (x === exit.x && y === exit.y) {
                html += '<';
            } else {
                html += dungeon[y][x];
            }
        }
        html += '\n';
    }
    if (gameOver) {
        html += '\n\nGAME OVER - Refresh to restart';
    }
    document.getElementById('game').textContent = html;
}

function move(dx, dy) {
    if (gameOver) return;
    let newX = player.x + dx;
    let newY = player.y + dy;
    if (newX >= 0 && newX < MAP_WIDTH && newY >= 0 && newY < MAP_HEIGHT) {
        if (dungeon[newY][newX] === '.') {
            player.x = newX;
            player.y = newY;
            if (player.x === exit.x && player.y === exit.y) {
                gameOver = true;
                render();
            }
        }
    }
}

document.addEventListener('keydown', function(e) {
    switch(e.key) {
        case 'ArrowUp': case 'w': case 'W': e.preventDefault(); move(0, -1); break;
        case 'ArrowDown': case 's': case 'S': e.preventDefault(); move(0, 1); break;
        case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move(1, 0); break;
    }
});

initDungeon();
render();
</script>
</body>
</html>
