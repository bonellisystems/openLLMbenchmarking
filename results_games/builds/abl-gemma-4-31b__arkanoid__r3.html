<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid</title>
    <style>
        body {
            background: #222;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            color: white;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background: #000;
            display: block;
            border: 4px solid #444;
        }
        #ui {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { margin: 0 0 10px 0; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="lives">Lives: 3</div>
    </div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="overlay">
        <h1 id="msg">ARKANOID</h1>
        <p>Use Left/Right Arrows to move<br>Press SPACE to start</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const msgEl = document.getElementById('msg');

    // Game Constants
    const BALL_RADIUS = 8;
    const PADDLE_WIDTH = 80;
    const PADDLE_HEIGHT = 15;
    const BRICK_ROWS = 5;
    const BRICK_COLS = 8;
    const BRICK_PADDING = 10;
    const BRICK_OFFSET_TOP = 30;
    const BRICK_OFFSET_LEFT = 35;
    const BRICK_WIDTH = (canvas.width - (BRICK_OFFSET_LEFT * 2)) / BRICK_COLS - BRICK_PADDING;
    const BRICK_HEIGHT = 20;

    // Game State
    let score = 0;
    let lives = 3;
    let gameRunning = false;
    let rightPressed = false;
    let leftPressed = false;

    let paddle = { x: canvas.width / 2 - PADDLE_WIDTH / 2, y: canvas.height - PADDLE_HEIGHT - 10 };
    let ball = { x: canvas.width / 2, y: canvas.height - PADDLE_HEIGHT - 20, dx: 4, dy: -4 };
    let bricks = [];

    function initBricks() {
        bricks = [];
        for (let c = 0; c < BRICK_COLS; c++) {
            bricks[c] = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }
    }

    function drawBricks() {
        for (let c = 0; c < BRICK_COLS; c++) {
            for (let r = 0; r < BRICK_ROWS; r++) {
                if (bricks[c][r].status === 1) {
                    let bx = c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT;
                    let by = r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP;
                    bricks[c][r].x = bx;
                    bricks[c][r].y = by;
                    ctx.beginPath();
                    ctx.rect(bx, by, BRICK_WIDTH, BRICK_HEIGHT);
                    ctx.fillStyle = `hsl(${r * 40}, 70%, 50%)`;
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, PADDLE_WIDTH, PADDLE_HEIGHT);
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
    }

    function collisionDetection() {
        for (let c = 0; c < BRICK_COLS; c++) {
            for (let r = 0; r < BRICK_ROWS; r++) {
                let b = bricks[c][r];
                if (b.status === 1) {
                    if (ball.x > b.x && ball.x < b.x + BRICK_WIDTH && ball.y > b.y && ball.y < b.y + BRICK_HEIGHT) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score += 10;
                        scoreEl.innerText = `Score: ${score}`;
                        if (score === BRICK_ROWS * BRICK_COLS * 10) {
                            gameOver(true);
                        }
                    }
                }
            }
        }
    }

    function gameOver(win) {
        gameRunning = false;
        overlay.classList.remove('hidden');
        msgEl.innerText = win ? "YOU WIN!" : "GAME OVER";
        msgEl.style.color = win ? "#0f0" : "#f00";
    }

    function update() {
        if (!gameRunning) return;

        if (rightPressed && paddle.x < canvas.width - PADDLE_WIDTH) paddle.x += 7;
        if (leftPressed && paddle.x > 0) paddle.x -= 7;

        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.x + BALL_RADIUS > canvas.width || ball.x - BALL_RADIUS < 0) ball.dx = -ball.dx;
        if (ball.y - BALL_RADIUS < 0) ball.dy = -ball.dy;

        if (ball.y + BALL_RADIUS > canvas.height - PADDLE_HEIGHT - 10) {
            if (ball.x > paddle.x && ball.x < paddle.x + PADDLE_WIDTH) {
                ball.dy = -ball.dy;
                // Add slight angle variation based on where it hits the paddle
                let hitPos = (ball.x - (paddle.x + PADDLE_WIDTH/2)) / (PADDLE_WIDTH/2);
                ball.dx = -ball.dx * 0.9 + hitPos * 2; 
            } else if (ball.y + BALL_RADIUS > canvas.height) {
                lives--;
                livesEl.innerText = `Lives: ${lives}`;
                if (lives <= 0) {
                    gameOver(false);
                } else {
                    resetBall();
                }
            }
        }

        collisionDetection();
    }

    function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height - PADDLE_HEIGHT - 20;
        ball.dx = 4;
        ball.dy = -4;
        paddle.x = canvas.width / 2 - PADDLE_WIDTH / 2;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        update();
        requestAnimationFrame(draw);
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "ArrowRight") rightPressed = true;
        if (e.code === "ArrowLeft") leftPressed = true;
        if (e.code === "Space") {
            if (!gameRunning) {
                if (lives <= 0) {
                    score = 0;
                    lives = 3;
                    initBricks();
                    resetBall();
                }
                gameRunning = true;
                overlay.classList.add('hidden');
            }
        }
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowRight") rightPressed = false;
        if (e.code === "ArrowLeft") leftPressed = false;
    });

    initBricks();
    draw();
</script>
</body>
</html>
