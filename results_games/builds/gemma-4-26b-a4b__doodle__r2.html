<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        // Game Constants
        const GRAVITY = 0.4;
        const JUMP_STRENGTH = -12;
        const PLAYER_SPEED = 5;
        const PLATFORM_WIDTH = 70;
        const PLATFORM_HEIGHT = 15;

        // Game State
        let player, platforms, score, cameraY, gameOver, keys;

        function init() {
            player = {
                x: canvas.width / 2 - 15,
                y: canvas.height - 150,
                width: 30,
                height: 30,
                dx: 0,
                dy: 0
            };

            platforms = [];
            // Initial platforms
            for (let i = 0; i < 7; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                    y: (canvas.height / 6) * i,
                    width: PLATFORM_WIDTH,
                    height: PLATFORM_HEIGHT
                });
            }
            // Ensure first platform is under player
            platforms[0].x = player.x - 20;
            platforms[0].y = player.y + player.playerHeight + 20; // Wait, logic error here, let's fix

            // Corrected initial platforms
            platforms = [];
            for (let i = 0; i < 8; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - PLATFORM_WIDTH),
                    y: canvas.height - (i * 100),
                    width: PLATFORM_WIDTH,
                    height: PLATFORM_HEIGHT
                });
            }
            // Ensure player starts on a platform
            platforms[0].x = player.x - 15;
            platforms[0].y = player.y + 40;

            score = 0;
            cameraY = 0;
            gameOver = false;
            keys = {};
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (gameOver && e.code === 'KeyR') {
                init();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function update() {
            if (gameOver) return;

            // Player movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.dx = -PLAYER_SPEED;
            else if (keys['ArrowRight'] || keys['KeyD']) player.dx = PLAYER_SPEED;
            else player.dx = 0;

            player.dy += GRAVITY;
            player.x += player.dx;
            player.y += player.dy;

            // Screen wrap
            if (player.x + player.width < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.width;

            // Camera follow
            if (player.y < cameraY + 250) {
                cameraY = player.y - 250;
            }

            // Platform collision (only when falling)
            if (player.dy > 0) {
                platforms.forEach(p => {
                    if (player.x < p.x + p.width &&
                        player.x + player.width > p.x &&
                        player.y + player.height > p.y &&
                        player.y + player.height < p.y + p.height + player.dy) {
                        player.dy = JUMP_STRENGTH;
                    }
                });
            }

            // Procedural generation
            platforms.forEach(p => {
                if (p.y > cameraY + canvas.height) {
                    p.y = cameraY - 20;
                    p.x = Math.random() * (canvas.width - PLATFORM_WIDTH);
                }
            });

            // Score
            let currentScore = Math.floor(Math.abs(cameraY / 50));
            if (currentScore > score) score = currentScore;

            // Game Over
            if (player.y > cameraY + canvas.height) {
                gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, -cameraY);

            // Draw Platforms
            ctx.fillStyle = '#4CAF50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
                // Platform shadow/detail
                ctx.fillStyle = '#388E3C';
                ctx.fillRect(p.x, p.y + p.height - 5, p.width, 5);
                ctx.fillStyle = '#4CAF50';
            });

            // Draw Player
            ctx.fillStyle = '#2196F3';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Player eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 5, 6, 6);
            ctx.fillRect(player.x + 19, player.y + 5, 6, 6);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 7, player.y + 7, 2, 2);
            ctx.fillRect(player.x + 21, player.y + 7, 2, 2);

            ctx.restore();

            // Draw Score
            ctx.fillStyle = '#333';
            ctx.font = '24px Arial';
            ctx.fillText(`Score: ${score}`, 10, 35);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.font = '40px Arial';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'start';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
