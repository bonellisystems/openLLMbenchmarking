<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #2c3e50;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas {
border: 3px solid #34495e;
border-radius: 8px;
box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 400;
canvas.height = 600;

const GRAVITY = 0.4;
const JUMP_FORCE = -12;
const MOVE_SPEED = 5;
const PLATFORM_WIDTH = 70;
const PLATFORM_HEIGHT = 15;
const PLATFORM_COUNT = 10;
const DOODLER_SIZE = 30;

let doodler = {
x: canvas.width / 2 - DOODLER_SIZE / 2,
y: canvas.height - 150,
vy: 0,
vx: 0,
width: DOODLER_SIZE,
height: DOODLER_SIZE,
facing: 1
};

let platforms = [];
let score = 0;
let highScore = 0;
let gameOver = false;
let cameraY = 0;
let keys = {};

function initPlatforms() {
platforms = [];
for (let i = 0; i < PLATFORM_COUNT; i++) {
platforms.push({
x: Math.random() * (canvas.width - PLATFORM_WIDTH),
y: canvas.height - 80 - i * (canvas.height / PLATFORM_COUNT),
width: PLATFORM_WIDTH,
height: PLATFORM_HEIGHT,
type: Math.random() < 0.15 ? 'moving' : (Math.random() < 0.1 ? 'breakable' : 'normal'),
speed: (Math.random() - 0.5) * 3
});
}
platforms[0] = {
x: canvas.width / 2 - PLATFORM_WIDTH / 2,
y: canvas.height - 50,
width: PLATFORM_WIDTH,
height: PLATFORM_HEIGHT,
type: 'normal',
speed: 0
};
}

function generatePlatform(y) {
const typeRoll = Math.random();
let type = 'normal';
if (typeRoll < 0.15) type = 'moving';
else if (typeRoll < 0.25) type = 'breakable';

return {
x: Math.random() * (canvas.width - PLATFORM_WIDTH),
y: y,
width: PLATFORM_WIDTH,
height: PLATFORM_HEIGHT,
type: type,
speed: type === 'moving' ? (Math.random() - 0.5) * 4 : 0
};
}

function update() {
if (gameOver) {
if (keys[' '] || keys['Enter']) {
resetGame();
}
return;
}

if (keys['ArrowLeft'] || keys['a']) {
doodler.vx = -MOVE_SPEED;
doodler.facing = -1;
} else if (keys['ArrowRight'] || keys['d']) {
doodler.vx = MOVE_SPEED;
doodler.facing = 1;
} else {
doodler.vx *= 0.8;
}

doodler.vy += GRAVITY;
doodler.x += doodler.vx;
doodler.y += doodler.vy;

if (doodler.x < 0) {
doodler.x = canvas.width - doodler.width;
} else if (doodler.x > canvas.width - doodler.width) {
doodler.x = 0;
}

for (let p of platforms) {
if (p.type === 'moving') {
p.x += p.speed;
if (p.x <= 0 || p.x + p.width >= canvas.width) {
p.speed *= -1;
}
}
}

if (doodler.vy > 0) {
for (let p of platforms) {
if (doodler.x + doodler.width > p.x &&
doodler.x < p.x + p.width &&
doodler.y + doodler.height > p.y &&
doodler.y + doodler.height < p.y + p.height + doodler.vy + 2) {
if (p.type === 'breakable') {
p.y = -1000;
} else {
doodler.vy = JUMP_FORCE;
}
}
}
}

if (doodler.y < cameraY + canvas.height * 0.4) {
const diff = (cameraY + canvas.height * 0.4) - doodler.y;
cameraY -= diff;
score += Math.floor(diff);

for (let p of platforms) {
p.y -= diff;
}

while (platforms[platforms.length - 1].y > 100) {
platforms.push(generatePlatform(platforms[platforms.length - 1].y - (canvas.height / PLATFORM_COUNT) + Math.random() * 30));
}

platforms = platforms.filter(p => p.y < canvas.height + 50);
}

if (doodler.y > cameraY + canvas.height) {
gameOver = true;
if (score > highScore) highScore = score;
}
}

function drawDoodler() {
const x = doodler.x;
const y = doodler.y - cameraY;

ctx.save();
ctx.translate(x + doodler.width / 2, y + doodler.height / 2);
ctx.scale(doodler.facing, 1);
ctx.translate(-(x + doodler.width / 2), -(y + doodler.height / 2));

ctx.fillStyle = '#2ecc71';
ctx.beginPath();
ctx.roundRect(x, y + 8, doodler.width, doodler.height - 8, 8);
ctx.fill();

ctx.fillStyle = '#27ae60';
ctx.beginPath();
ctx.roundRect(x + 2, y + 10, doodler.width - 4, doodler.height - 14, 6);
ctx.fill();

ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(x + doodler.width * 0.65, y + 14, 5, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#2c3e50';
ctx.beginPath();
ctx.arc(x + doodler.width * 0.7, y + 14, 2.5, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#e74c3c';
ctx.beginPath();
ctx.arc(x + doodler.width * 0.35, y + 16, 2, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#2ecc71';
ctx.beginPath();
ctx.moveTo(x + doodler.width * 0.3, y + 5);
ctx.quadraticCurveTo(x + doodler.width * 0.5, y - 5, x + doodler.width * 0.7, y + 5);
ctx.fill();

ctx.fillStyle = '#27ae60';
ctx.fillRect(x + doodler.width * 0.45, y + 2, 4, 6);

ctx.restore();
}

function drawPlatform(p) {
const y = p.y - cameraY;
if (y < -20 || y > canvas.height + 20) return;

if (p.type === 'normal') {
ctx.fillStyle = '#27ae60';
ctx.beginPath();
ctx.roundRect(p.x, y, p.width, p.height, 5);
ctx.fill();
ctx.fillStyle = '#2ecc71';
ctx.beginPath();
ctx.roundRect(p.x + 2, y + 2, p.width - 4, p.height - 6, 4);
ctx.fill();
} else if (p.type === 'moving') {
ctx.fillStyle = '#3498db';
ctx.beginPath();
ctx.roundRect(p.x, y, p.width, p.height, 5);
ctx.fill();
ctx.fillStyle = '#5dade2';
ctx.beginPath();
ctx.roundRect(p.x + 2, y + 2, p.width - 4, p.height - 6, 4);
ctx.fill();
ctx.fillStyle = '#fff';
ctx.font = '10px Arial';
ctx.fillText('→', p.x + p.width / 2 - 4, y + 11);
} else if (p.type === 'breakable') {
ctx.fillStyle = '#e67e22';
ctx.beginPath();
ctx.roundRect(p.x, y, p.width, p.height, 5);
ctx.fill();
ctx.fillStyle = '#f39c12';
ctx.beginPath();
ctx.roundRect(p.x + 2, y + 2, p.width - 4, p.height - 6, 4);
ctx.fill();
ctx.strokeStyle = '#d35400';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(p.x + p.width * 0.3, y + 2);
ctx.lineTo(p.x + p.width * 0.3, y + p.height - 2);
ctx.moveTo(p.x + p.width * 0.7, y + 2);
ctx.lineTo(p.x + p.width * 0.7, y + p.height - 2);
ctx.stroke();
}
}

function drawBackground() {
const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
gradient.addColorStop(0, '#ecf0f1');
gradient.addColorStop(1, '#bdc3c7');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.strokeStyle = 'rgba(0,0,0,0.03)';
ctx.lineWidth = 1;
for (let i = 0; i < canvas.width; i += 20) {
ctx.beginPath();
ctx.moveTo(i, 0);
ctx.lineTo(i, canvas.height);
ctx.stroke();
}
for (let i = 0; i < canvas.height; i += 20) {
ctx.beginPath();
ctx.moveTo(0, i);
ctx.lineTo(canvas.width, i);
ctx.stroke();
}
}

function drawUI() {
ctx.fillStyle = '#2c3e50';
ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
ctx.textAlign = 'left';
ctx.fillText('Score: ' + score, 15, 30);

ctx.textAlign = 'right';
ctx.font = '14px "Segoe UI", Arial, sans-serif';
ctx.fillText('Best: ' + highScore, canvas.width - 15, 30);

if (gameOver) {
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#e74c3c';
ctx.font = 'bold 40px "Segoe UI", Arial, sans-serif';
ctx.textAlign = 'center';
ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

ctx.fillStyle = '#ecf0f1';
ctx.font = '24px "Segoe UI", Arial, sans-serif';
ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);

ctx.fillStyle = '#bdc3c7';
ctx.font = '18px "Segoe UI", Arial, sans-serif';
ctx.fillText('Press SPACE or ENTER to restart', canvas.width / 2, canvas.height / 2 + 50);

ctx.fillStyle = '#95a5a6';
ctx.font = '14px "Segoe UI", Arial, sans-serif';
ctx.fillText('Use ← → arrow keys or A/D to move', canvas.width / 2, canvas.height / 2 + 85);
}
}

function resetGame() {
doodler = {
x: canvas.width / 2 - DOODLER_SIZE / 2,
y: canvas.height - 150,
vy: 0,
vx: 0,
width: DOODLER_SIZE,
height: DOODLER_SIZE,
facing: 1
};
score = 0;
cameraY = 0;
gameOver = false;
initPlatforms();
}

function gameLoop() {
update();
drawBackground();
for (let p of platforms) {
drawPlatform(p);
}
drawDoodler();
drawUI();
requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
keys[e.key] = true;
if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
e.preventDefault();
}
});

document.addEventListener('keyup', (e) => {
keys[e.key] = false;
});

initPlatforms();
gameLoop();
</script>
</body>
</html>
