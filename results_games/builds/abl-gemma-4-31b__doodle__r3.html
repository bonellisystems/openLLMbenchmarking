<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            background-color: #fafafa;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            border: 2px solid #333;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="score">Score: <span id="scoreVal">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreVal');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let gameActive = true;

        const gravity = 0.35;
        const jumpStrength = -10;
        const moveSpeed = 5;

        const player = {
            x: 200,
            y: 300,
            radius: 12,
            vx: 0,
            vy: 0,
            color: '#4CAF50'
        };

        let platforms = [];
        const platWidth = 60;
        const platHeight = 15;

        function createPlatform(y) {
            return {
                x: Math.random() * (canvas.width - platWidth),
                y: y,
                w: platWidth,
                h: platHeight
            };
        }

        function init() {
            platforms = [];
            for (let i = 0; i < 7; i++) {
                platforms.push(createPlatform(i * 100));
            }
        }

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (!gameActive) return;

            // Movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -moveSpeed;
            else if (keys['ArrowRight'] || keys['KeyD']) player.vx = moveSpeed;
            else player.vx = 0;

            player.x += player.vx;
            player.vy += gravity;
            player.y += player.vy;

            // Screen wrap
            if (player.x < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = 0;

            // Collision
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.radius > p.x && 
                        player.x - player.radius < p.x + p.w && 
                        player.y + player.radius > p.y && 
                        player.y + player.radius < p.y + p.h) {
                        player.vy = jumpStrength;
                    }
                });
            }

            // Scrolling
            if (player.y < canvas.height / 2) {
                let diff = (canvas.height / 2) - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);
                scoreElement.innerText = score;
                platforms.forEach(p => p.y += diff);
            }

            // Procedural Generation
            while (platforms[platforms.length - 1].y < 0) {
                platforms.shift();
                let lastY = platforms[platforms.length - 1].y;
                platforms.push(createPlatform(lastY - 100));
            }

            // Game Over
            if (player.y > canvas.height) {
                gameActive = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Platforms
            ctx.fillStyle = '#2196F3';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Draw Player
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.closePath();

            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText('Refresh to Restart', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
