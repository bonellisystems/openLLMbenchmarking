<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flappy Bird</title>
<style>
body{margin:0;background:#70c5ce;font-family:sans-serif;}
canvas{display:block;margin:auto;background:#70c5ce;}
#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:48px;color:white;text-shadow:2px 2px 4px #000;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<div id="score">0</div>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const gravity=0.5;
const flap=-10;
const pipeGap=120;
const pipeWidth=60;
const pipeSpeed=2;
const birdSize=30;
let bird={x:80,y:canvas.height/2,width:birdSize,height:birdSize,vy:0};
let pipes=[];
let frame=0;
let score=0;
let gameOver=false;
function reset(){
  bird.y=canvas.height/2;
  bird.vy=0;
  pipes=[];
  frame=0;
  score=0;
  gameOver=false;
  scoreEl.textContent=score;
}
function createPipe(){
  const topHeight=Math.random()*(canvas.height-pipeGap-100)+50;
  const bottomY=topHeight+pipeGap;
  pipes.push({x:canvas.width,y:0,width:pipeWidth,height:topHeight,passed:false});
  pipes.push({x:canvas.width,y:bottomY,width:pipeWidth,height:canvas.height-bottomY,passed:false});
}
function update(){
  if(gameOver)return;
  frame++;
  bird.vy+=gravity;
  bird.y+=bird.vy;
  if(frame%90===0)createPipe();
  for(let i=0;i<pipes.length;i++){
    pipes[i].x-=pipeSpeed;
  }
  pipes=pipes.filter(p=>p.x+p.width>0);
  if(bird.y+bird.height>=canvas.height||bird.y<=0){
    gameOver=true;
  }
  for(let p of pipes){
    if(bird.x< p.x+p.width && bird.x+bird.width>p.x && bird.y< p.y+p.height && bird.y+bird.height>p.y){
      gameOver=true;
    }
    if(!p.passed && p.x+pipeWidth<bird.x){
      p.passed=true;
      if(p.y===0){
        score++;
        scoreEl.textContent=score;
      }
    }
  }
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='yellow';
  ctx.fillRect(bird.x,bird.y,bird.width,bird.height);
  ctx.fillStyle='green';
  for(let p of pipes){
    ctx.fillRect(p.x,p.y,p.width,p.height);
  }
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='white';
    ctx.font='48px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('Game Over',canvas.width/2,canvas.height/2);
    ctx.font='24px sans-serif';
    ctx.fillText('Press Space to Restart',canvas.width/2,canvas.height/2+40);
  }
}
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    if(gameOver){
      reset();
    }else{
      bird.vy=flap;
    }
  }
});
reset();
loop();
</script>
</body>
</html>
