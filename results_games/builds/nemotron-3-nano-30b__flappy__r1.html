<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
body{margin:0;overflow:hidden;background:#70c5ce;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// game variables
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);
resize();
let bird = {x:50, y:canvas.height/2, radius:20, vy:0};
let pipes = [];
let score = 0;
let bestScore = localStorage.getItem('best')||0;
let gameOver = false;
let frame = 0;

// generate pipe every 1.5 seconds
function addPipe(){
    const gap = 120;
    const minHeight = 50;
    const maxHeight = canvas.height - minHeight - gap;
    const height = Math.floor(Math.random()*maxHeight)+minHeight;
    pipes.push({x:canvas.width, minHeight, maxHeight, gap, height});
}
setInterval(addPipe,1500);

// physics constants
const gravity = 0.5;
const jump = -8;

// handle jump
document.addEventListener('keydown',e=>{
    if(e.code==='Space' || e.code==='ArrowUp'){
        bird.vy = jump;
        if(gameOver){reset();}
    }
});

// collision detection
function collides(pipe){
    // bird circle vs top pipe
    if(bird.x+bird.radius>pipe.x && bird.x-bird.radius<pipe.x+50){
        if(bird.y-bird.radius<pipe.minHeight || bird.y+bird.radius>pipe.maxHeight+pipe.gap){
            return true;
        }
    }
    // check walls
    if(bird.x+bird.radius>canvas.width || bird.x-bird.radius<0 ||
       bird.y+bird.radius>canvas.height || bird.y-bird.radius<0){
        return true;
    }
    return false;
}

// update
function update(){
    if(gameOver) return;
    bird.vy += gravity;
    bird.y += bird.vy;
    // move pipes
    for(let i=pipes.length-1;i>=0;i--){
        pipes[i].x -= 2;
        if(pipes[i].x+50<0){
            pipes.splice(i,1);
            score++;
            if(score>bestScore){bestScore=score;localStorage.setItem('best',bestScore);}
        }
        if(collides(pipes[i])){
            gameOver=true;
        }
    }
    // floor/ceiling collision
    if(bird.y+bird.radius>canvas.height || bird.y-bird.radius<0){
        gameOver=true;
    }
}

// draw
function draw(){
    // clear
    ctx.fillStyle='white';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // background gradient
    const grad = ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,'#70c5ce');
    grad.addColorStop(1,'#4a90e2');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // bird
    ctx.fillStyle='yellow';
    ctx.beginPath();
    ctx.arc(bird.x,bird.y,bird.radius,0,Math.PI*2);
    ctx.fill();
    // pipes
    ctx.fillStyle='green';
    for(const p of pipes){
        // top pipe
        ctx.fillRect(p.x,0,50,p.minHeight);
        // bottom pipe
        ctx.fillRect(p.x,p.maxHeight+ p.gap,50,canvas.height-p.maxHeight-p.gap);
    }
    // score
    ctx.fillStyle='black';
    ctx.font='24px Arial';
    ctx.fillText('Score: '+score, 20, 30);
    ctx.fillText('Best: '+bestScore, 20, 60);
    // game over overlay
    if(gameOver){
        ctx.fillStyle='rgba(0,0,0,0.5)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='white';
        ctx.font='48px Arial';
        ctx.textAlign='center';
        ctx.fillText('Game Over',canvas.width/2,canvas.height/2);
        ctx.font='24px Arial';
        ctx.fillText('Press Space to Restart',canvas.width/2,canvas.height/2+40);
    }
}

// reset
function reset(){
    bird = {x:50, y:canvas.height/2, radius:20, vy:0};
    pipes = [];
    score = 0;
    gameOver = false;
}

// main loop
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
