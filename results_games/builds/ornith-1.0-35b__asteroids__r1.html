<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const FRICTION = 0.99;
const SHIP_THRUST = 0.15;
const SHIP_ROTATION = 0.07;
const BULLET_SPEED = 8;
const BULLET_LIFE = 60;
const BULLET_COOLDOWN = 12;
const ASTEROID_SPEED = 1.5;
const INVINCIBILITY_TIME = 120;

let ship, bullets, asteroids, particles, score, lives, gameState, shootTimer, invincibleTimer, frameCount;

function randomAngle() { return Math.random() * Math.PI * 2; }
function randomRange(min, max) { return Math.random() * (max - min) + min; }

function generateAsteroidShape(radius) {
    const points = [];
    const numPoints = Math.floor(randomRange(8, 14));
    for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const r = radius * randomRange(0.7, 1.3);
        points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    return points;
}

function createAsteroid(x, y, size) {
    const radii = { large: 40, medium: 20, small: 10 };
    const radius = radii[size] || 40;
    const angle = randomAngle();
    const speed = randomRange(0.3, ASTEROID_SPEED) * (2.5 - size) / 2;
    return {
        x: x !== undefined ? x : randomRange(radius, canvas.width - radius),
        y: y !== undefined ? y : randomRange(radius, canvas.height - radius),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: radius,
        size: size,
        shape: generateAsteroidShape(radius),
        rotation: 0,
        rotSpeed: randomRange(-0.02, 0.02)
    };
}

function spawnAsteroids(count, size) {
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = randomRange(50, canvas.width - 50);
            y = randomRange(50, canvas.height - 50);
        } while (ship && Math.hypot(x - ship.x, y - ship.y) > 200);
        asteroids.push(createAsteroid(x, y, size));
    }
}

function createParticle(x, y, color) {
    const angle = randomAngle();
    const speed = randomRange(1, 4);
    return {
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: randomRange(15, 35),
        maxLife: 35,
        color: color || '#fff'
    };
}

function initGame() {
    ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        angle: -Math.PI / 2,
        radius: 15,
        thrusting: false
    };
    bullets = [];
    asteroids = [];
    particles = [];
    score = 0;
    lives = 3;
    gameState = 'playing';
    shootTimer = 0;
    invincibleTimer = INVINCIBILITY_TIME;
    frameCount = 0;
    spawnAsteroids(4, 'large');
}

function resetShip() {
    ship.x = canvas.width / 2;
    ship.y = canvas.height / 2;
    ship.vx = 0;
    ship.vy = 0;
    ship.angle = -Math.PI / 2;
    ship.thrusting = false;
    invincibleTimer = INVINCIBILITY_TIME;
}

function wrap(obj) {
    if (obj.x < -50) obj.x = canvas.width + 50;
    if (obj.x > canvas.width + 50) obj.x = -50;
    if (obj.y < -50) obj.y = canvas.height + 50;
    if (obj.y > canvas.height + 50) obj.y = -50;
}

function update() {
    frameCount++;

    if (gameState === 'gameover') {
        if (keys['Enter'] || keys['Space']) {
            initGame();
        }
        updateParticles();
        return;
    }

    if (gameState === 'playing') {
        // Ship rotation
        if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= SHIP_ROTATION;
        if (keys['ArrowRight'] || keys['KeyD']) ship.angle += SHIP_ROTATION;

        // Thrust
        ship.thrusting = (keys['ArrowUp'] || keys['KeyW']);
        if (ship.thrusting) {
            ship.vx += Math.cos(ship.angle) * SHIP_THRUST;
            ship.vy += Math.sin(ship.angle) * SHIP_THRUST;
            if (frameCount % 3 === 0) {
                const exhaustX = ship.x - Math.cos(ship.angle) * 15;
                const exhaustY = ship.y - Math.sin(ship.angle) * 15;
                particles.push(createParticle(exhaustX, exhaustY, '#f80'));
                particles.push(createParticle(exhaustX, exhaustY, '#ff0'));
            }
        }

        // Friction
        ship.vx *= FRICTION;
        ship.vy *= FRICTION;

        // Speed cap
        const speed = Math.hypot(ship.vx, ship.vy);
        if (speed > 8) {
            ship.vx = (ship.vx / speed) * 8;
            ship.vy = (ship.vy / speed) * 8;
        }

        ship.x += ship.vx;
        ship.y += ship.vy;
        wrap(ship);

        // Shooting
        if (shootTimer > 0) shootTimer--;
        if ((keys['Space'] || keys['KeyF']) && shootTimer <= 0 && bullets.length < 6) {
            bullets.push({
                x: ship.x + Math.cos(ship.angle) * 18,
                y: ship.y + Math.sin(ship.angle) * 18,
                vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.3,
                vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.3,
                life: BULLET_LIFE
            });
            shootTimer = BULLET_COOLDOWN;
        }

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            wrap(b);
            if (b.life <= 0) bullets.splice(i, 1);
        }

        // Update asteroids
        for (const a of asteroids) {
            a.x += a.vx;
            a.y += a.vy;
            a.rotation += a.rotSpeed;
            wrap(a);
        }

        // Bullet-asteroid collisions
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            for (let j = asteroids.length - 1; j >= 0; j--) {
                const a = asteroids[j];
                if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
                    bullets.splice(i, 1);
                    asteroids.splice(j, 1);
                    score += { large: 20, medium: 50, small: 100 }[a.size];

                    for (let k = 0; k < 8; k++) {
                        particles.push(createParticle(a.x, a.y, '#aaa'));
                    }

                    if (a.size === 'large') {
                        spawnAsteroids(2, 'medium');
                    } else if (a.size === 'medium') {
                        spawnAsteroids(2, 'small');
                    }
                    break;
                }
            }
        }

        // Ship-asteroid collisions
        if (invincibleTimer <= 0) {
            for (const a of asteroids) {
                if (Math.hypot(ship.x - a.x, ship.y - a.y) < a.radius + ship.radius - 5) {
                    lives--;
                    for (let k = 0; k < 20; k++) {
                        particles.push(createParticle(ship.x, ship.y, '#f00'));
                    }
                    if (lives <= 0) {
                        gameState = 'gameover';
                    } else {
                        resetShip();
                    }
                    break;
                }
            }
        }

        if (invincibleTimer > 0) invincibleTimer--;

        // Respawn asteroids if all destroyed
        if (asteroids.length === 0) {
            const count = Math.min(4 + Math.floor(score / 500), 10);
            spawnAsteroids(count, 'large');
        }

        updateParticles();
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawShip() {
    if (!ship) return;
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-12, -10);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-12, 10);
    ctx.closePath();
    ctx.stroke();

    if (ship.thrusting) {
        ctx.strokeStyle = '#f80';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-8, -5);
        ctx.lineTo(-18 - Math.random() * 8, 0);
        ctx.lineTo(-8, 5);
        ctx.stroke();

        ctx.strokeStyle = '#ff0';
        ctx.beginPath();
        ctx.moveTo(-8, -3);
        ctx.lineTo(-14 - Math.random() * 5, 0);
        ctx.lineTo(-8, 3);
        ctx.stroke();
    }

    ctx.restore();
}

function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);

    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(a.shape[0].x, a.shape[0].y);
    for (let i = 1; i < a.shape.length; i++) {
        ctx.lineTo(a.shape[i].x, a.shape[i].y);
    }
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
}

function drawBullets() {
    ctx.fillStyle = '#fff';
    for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE: ' + score, 20, 35);

    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
        ctx.save();
        ctx.translate(canvas.width - 20 - i * 25, 30);
        ctx.rotate(-Math.PI / 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-7, -6);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-7, 6);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = '48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROIDS', canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '18px monospace';
    ctx.fillText('Arrow Keys / WASD to move', canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('Space / F to shoot', canvas.width / 2, canvas.height / 2 + 50);
    ctx.fillText('Press any key to start', canvas.width / 2, canvas.height / 2 + 90);
}

function drawGameOver() {
    ctx.fillStyle = '#fff';
    ctx.font = '48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '24px monospace';
    ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
    ctx.font = '18px monospace';
    ctx.fillText('Press Enter to restart', canvas.width / 2, canvas.height / 2 + 60);
}

let started = false;

function gameLoop() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (!started) {
        drawStartScreen();
        for (const k in keys) {
            if (keys[k]) {
                started = true;
                initGame();
                break;
            }
        }
        requestAnimationFrame(gameLoop);
        return;
    }

    update();

    drawParticles();
    drawBullets();
    for (const a of asteroids) drawAsteroid(a);
    drawShip();
    drawHUD();

    if (gameState === 'gameover') drawGameOver();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
