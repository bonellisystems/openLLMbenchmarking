<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Doodle Jump</title>
<style>
    body { margin: 0; padding: 0; background: #333; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }
    canvas { background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
(function() {
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    var width = canvas.width;
    var height = canvas.height;

    var keys = {};
    var player = {
        x: width / 2 - 15,
        y: height - 100,
        w: 30,
        h: 30,
        vx: 0,
        vy: 0,
        speed: 5,
        jump: -12,
        gravity: 0.6
    };

    var platforms = [];
    var score = 0;
    var gameRunning = true;
    var cameraY = 0;

    function init() {
        platforms = [];
        score = 0;
        cameraY = 0;
        player.x = width / 2 - 15;
        player.y = height - 100;
        player.vx = 0;
        player.vy = 0;
        gameRunning = true;
        // Initial platforms
        for (var i = 0; i < 6; i++) {
            platforms.push({
                x: Math.random() * (width - 60),
                y: height - 50 - i * 100
            });
        }
    }

    function update() {
        if (!gameRunning) return;

        // Input
        if (keys['ArrowLeft']) player.vx = -player.speed;
        else if (keys['ArrowRight']) player.vx = player.speed;
        else player.vx = 0;

        player.x += player.vx;

        // Wrap around
        if (player.x + player.w < 0) player.x = width;
        else if (player.x > width) player.x = 0;

        // Physics
        player.vy += player.gravity;
        player.y += player.vy;

        // Camera / Scrolling
        if (player.y < height / 2) {
            var diff = (height / 2) - player.y;
            player.y += diff;
            cameraY += diff;
            score += Math.floor(diff);
            // Move platforms down
            for (var i = 0; i < platforms.length; i++) {
                platforms[i].y += diff;
            }
        }

        // Collision
        for (var i = 0; i < platforms.length; i++) {
            var p = platforms[i];
            if (player.vy > 0 && // falling
                player.x < p.x + 60 &&
                player.x + player.w > p.x &&
                player.y + player.h > p.y &&
                player.y + player.h < p.y + 20) { // hit top of platform
                player.vy = player.jump;
            }
        }

        // Platform Management
        // Remove off-screen platforms
        for (var i = platforms.length - 1; i >= 0; i--) {
            if (platforms[i].y > height) {
                platforms.splice(i, 1);
            }
        }
        // Add new platforms
        var highest = Infinity;
        for (var i = 0; i < platforms.length; i++) {
            if (platforms[i].y < highest) {
                highest = platforms[i].y;
            }
        }
        if (highest < height - 200) {
            platforms.push({
                x: Math.random() * (width - 60),
                y: highest - 80 - Math.random() * 50
            });
        }

        // Game Over
        if (player.y > height) {
            gameRunning = false;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Draw Platforms
        ctx.fillStyle = '#8B4513';
        for (var i = 0; i < platforms.length; i++) {
            var p = platforms[i];
            ctx.fillRect(p.x, p.y, 60, 15);
        }

        // Draw Player
        ctx.fillStyle = '#32CD32';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(player.x + 5, player.y + 5, 5, 5);
        ctx.fillRect(player.x + 20, player.y + 5, 5, 5);

        // Draw Score
        ctx.fillStyle = '#000';
        ctx.font = '20px Arial';
        ctx.fillText('Score: ' + score, 10, 30);

        if (!gameRunning) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#fff';
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', width / 2, height / 2);
            ctx.font = '20px Arial';
            ctx.fillText('Press Space to Restart', width / 2, height / 2 + 40);
            ctx.textAlign = 'left';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', function(e) {
        keys[e.code] = true;
        if (!gameRunning && e.code === 'Space') {
            init();
        }
        // Prevent scrolling
        if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) !== -1) {
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', function(e) {
        keys[e.code] = false;
    });

    init();
    loop();
})();
</script>
</body>
</html>
