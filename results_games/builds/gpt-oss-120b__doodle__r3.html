<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Jump Clone</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#222;}
#gameCanvas{display:block;margin:auto;background:#87CEEB;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const GRAVITY = 0.4;
    const JUMP_VELOCITY = -10;
    const PLAYER_SPEED = 5;
    const PLATFORM_WIDTH = 80;
    const PLATFORM_HEIGHT = 12;
    const MIN_PLATFORM_GAP = 70;
    const MAX_PLATFORM_GAP = 120;

    let keys = {left:false,right:false};

    // Player
    const player = {
        x: W/2-15,
        y: H-60,
        w: 30,
        h: 30,
        vy: 0,
        color:'#ff0'
    };

    // Platforms
    let platforms = [];

    function initPlatforms() {
        // Base platform
        platforms.push({x:0, y:H-10, w:W, h:10});
        // Generate initial platforms upward
        let y = H - 100;
        while (y > -H) {
            addPlatform(y);
            y -= randomBetween(MIN_PLATFORM_GAP, MAX_PLATFORM_GAP);
        }
    }

    function addPlatform(yPos) {
        const xPos = randomBetween(0, W-PLATFORM_WIDTH);
        platforms.push({x:xPos, y:yPos, w:PLATFORM_WIDTH, h:PLATFORM_HEIGHT});
    }

    function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
    }

    function update() {
        // Horizontal movement
        if (keys.left) player.x -= PLAYER_SPEED;
        if (keys.right) player.x += PLAYER_SPEED;
        // Wrap around
        if (player.x + player.w < 0) player.x = W;
        if (player.x > W) player.x = -player.w;

        // Apply gravity
        player.vy += GRAVITY;
        player.y += player.vy;

        // Collision detection (only when falling)
        if (player.vy > 0) {
            for (let p of platforms) {
                if (player.x + player.w > p.x && player.x < p.x + p.w) {
                    if (player.y + player.h > p.y && player.y + player.h - player.vy <= p.y) {
                        player.y = p.y - player.h;
                        player.vy = JUMP_VELOCITY;
                        break;
                    }
                }
            }
        }

        // Scroll up when player reaches upper half
        if (player.y < H/2) {
            const delta = H/2 - player.y;
            player.y = H/2;
            for (let p of platforms) {
                p.y += delta;
            }
            // Remove platforms that go off screen bottom
            platforms = platforms.filter(p => p.y < H);
            // Add new platforms at top
            let highest = Math.min(...platforms.map(p=>p.y));
            while (highest > -H) {
                highest -= randomBetween(MIN_PLATFORM_GAP, MAX_PLATFORM_GAP);
                addPlatform(highest);
            }
        }

        // Game over
        if (player.y > H) {
            resetGame();
        }
    }

    function draw() {
        ctx.clearRect(0,0,W,H);
        // Draw platforms
        ctx.fillStyle = '#654321';
        for (let p of platforms) {
            ctx.fillRect(p.x, p.y, p.w, p.h);
        }
        // Draw player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);
        // Score (height)
        ctx.fillStyle = '#000';
        ctx.font = '16px sans-serif';
        const score = Math.max(0, Math.floor(-player.y + H));
        ctx.fillText('Score: '+score, 10, 20);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function resetGame() {
        player.x = W/2-15;
        player.y = H-60;
        player.vy = 0;
        platforms = [];
        initPlatforms();
    }

    // Input handling
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        e.preventDefault();
    });
    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        e.preventDefault();
    });

    // Start
    initPlatforms();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
