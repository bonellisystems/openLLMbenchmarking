<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
  body{margin:0;overflow:hidden;background:#000;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
const WIDTH=canvas.width,HEIGHT=canvas.height;

//--- Game objects -------------------------------------------------
class Ship{
  constructor(){this.x=WIDTH/2;this.y=HEIGHT/2;this.ang=0;this.velX=0;this.velY=0;}
  update(){ 
    this.x+=this.velX; this.y+=this.velY;
    this.x= (this.x+WIDTH)%WIDTH; this.y= (this.y+HEIGHT)%HEIGHT;
  }
  draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.ang);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,5);ctx.lineTo(-7,5);ctx.closePath();ctx.stroke();ctx.restore();}
  rotate(d){this.ang+=d;}
  thrust(){this.velX+=Math.sin(this.ang)*0.1; this.velY+=Math.cos(this.ang)*0.1;}
}
const ship=new Ship();

//--- Rocks ---------------------------------------------------------
class Rock{
  constructor(x,y,size){
    this.x=x; this.y=y; this.size=size;
    const speed=2+Math.random()*2;
    const ang=Math.random()*Math.PI*2;
    this.velX=speed*Math.sin(ang);
    this.velY=speed*Math.cos(ang);
    this.age=0;
  }
  update(){ this.x+=this.velX; this.y+=this.velY; this.x=(this.x+WIDTH)%WIDTH; this.y=(this.y+HEIGHT)%HEIGHT; }
  draw(){ 
    ctx.save();ctx.translate(this.x,this.y);ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-this.size);ctx.lineTo(this.size*0.5,this.size*0.86);ctx.lineTo(-this.size*0.5,this.size*0.86);ctx.closePath();ctx.stroke();ctx.restore(); }
}
const rocks=[];
function spawnRocks(n=8){
  for(let i=0;i<n;i++) rocks.push(new Rock(Math.random()*WIDTH,Math.random()*HEIGHT,30));
}
spawnRocks();

//--- Bullets -------------------------------------------------------
class Bullet{
  constructor(x,y,ang){
    this.x=x; this.y=y; this.velX=Math.sin(ang)*4; this.velY=Math.cos(ang)*4; this.life=30;
  }
  update(){ this.x+=this.velX; this.y+=this.velY; this.life--; }
  draw(){ ctx.save();ctx.translate(this.x,this.y);ctx.fillStyle='#ff0';ctx.fillRect(-1,-1,2,2);ctx.restore();} 
}
const bullets=[];

//--- Collision -----------------------------------------------------
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function collide(a,b){return dist(a,b)<(a.size+b.size)/2;}

//--- Game state ----------------------------------------------------
let keys={};window.addEventListener('keydown',e=>keys[e.key]=true);window.addEventListener('keyup',e=>keys[e.key]=false);
let angle=0;

//--- Main loop ------------------------------------------------------
function loop(){
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  // ship controls
  if(keys['ArrowLeft'])  ship.rotate(-0.07);
  if(keys['ArrowRight']) ship.rotate(0.07);
  if(keys['ArrowUp'])    ship.thrust();
  ship.update();

  // spawn new rocks periodically
  if(Math.random()<0.001) rocks.push(new Rock(Math.random()*WIDTH,Math.random()*HEIGHT,30));

  // update rocks & bullets
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];
    r.update(); r.draw();
    // split if hit by bullet
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(collide(b,r)){
        bullets.splice(j,1);
        if(r.size>10){
          const s=r.size/2;
          for(let k=0;k<2;k++) rocks.push(new Rock(r.x,r.y,s));
        }
        rocks.splice(i,1);
        break;
      }
    }
  }

  // update bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.update(); b.draw();
    if(b.life<=0) bullets.splice(i,1);
  }

  // fire bullet
  if(keys[' '] && !keys[' ']._pressed){
    const ang=ship.ang+Math.PI/2;
    bullets.push(new Bullet(ship.x+Math.cos(ang)*12, ship.y+Math.sin(ang)*12, ang));
    keys[' ']._pressed=true;
  }
  if(!keys[' ']) keys[' ']._pressed=false;

  // draw ship
  ship.draw();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
