<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }
    .game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }
    .score-board {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px 40px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .score {
        font-size: 2rem;
        font-weight: bold;
        color: #4ecca3;
        text-align: center;
    }
    .high-score {
        font-size: 1rem;
        color: #a0a0a0;
        margin-top: 5px;
    }
    canvas {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        box-shadow: 
            inset 0 0 20px rgba(0, 0, 0, 0.5),
            0 0 30px rgba(78, 202, 163, 0.2);
        border: 2px solid rgba(78, 202, 163, 0.3);
    }
    .game-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(26, 26, 46, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: none;
    }
    .game-over h1 {
        color: #ff6b6b;
        font-size: 3rem;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(255, 107, 107, 0.7);
    }
    .game-over p {
        color: #a0a0a0;
        font-size: 1.2rem;
        margin-bottom: 30px;
    }
    .restart-btn {
        background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.2rem;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
    }
    .restart-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
    }
    .instructions {
        color: #a0a0a0;
        font-size: 0.9rem;
        text-align: center;
        margin-top: 10px;
    }
    .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
    }
    .control-btn {
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: #a0a0a0;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .control-btn:hover {
        background: rgba(78, 202, 163, 0.3);
        color: #4ecca3;
    }
    .control-btn:active {
        transform: scale(0.95);
    }
    .controls-row {
        display: flex;
        gap: 10px;
    }
</style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="high-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="instructions">
            Use arrow keys or WASD to control the snake
        </div>
        <div class="controls">
            <div class="controls-row">
                <button class="control-btn" id="upBtn">▲</button>
            </div>
            <div class="controls-row">
                <button class="control-btn" id="leftBtn">◄</button>
                <button class="control-btn" id="downBtn">▼</button>
                <button class="control-btn" id="rightBtn">►</button>
            </div>
        </div>
    </div>
    <div class="game-over" id="gameOver">
        <h1>Game Over</h1>
        <p>Your score: <span id="finalScore">0</span></p>
        <button class="restart-btn" id="restartBtn">Play Again</button>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game constants
        const GRID_SIZE = 20;
        const GRID_WIDTH = canvas.width / GRID_SIZE;
        const GRID_HEIGHT = canvas.height / GRID_SIZE;
        
        // Game variables
        let snake, food, gameInterval, score = 0, highScore = 0;
        let gameRunning = false;
        
        // Colors
        const COLORS = {
            background: '#0f0f23',
            grid: '#1a1a3e',
            snakeHead: '#4ecca3',
            snakeBody: '#45b393',
            food: '#ff6b6b',
            text: '#ffffff'
        };
        
        // Initialize game
        function init() {
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            snakeDirection = {x: 1, y: 0};
            createFood();
            score = 0;
            updateScore();
            gameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 150);
        }
        
        // Create food at random position
        function createFood() {
            food = {
                x: Math.floor(Math.random() * GRID_WIDTH),
                y: Math.floor(Math.random() * GRID_HEIGHT)
            };
            // Make sure food doesn't appear on snake
            for (let cell of snake) {
                if (cell.x === food.x && cell.y === food.y) {
                    return createFood();
                }
            }
        }
        
        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move snake
            const head = {x: snake[0].x + snakeDirection.x, y: snake[0].y + snakeDirection.y};
            
            // Check wall collision
            if (head.x < 0 || head.x >= GRID_WIDTH || head.y < 0 || head.y >= GRID_HEIGHT) {
                gameOver();
                return;
            }
            
            // Check self collision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                updateScore();
                createFood();
            } else {
                // Remove tail
                snake.pop();
            }
            
            // Draw everything
            draw();
        }
        
        // Draw game elements
        function draw() {
            // Clear canvas
            ctx.fillStyle = COLORS.background;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = COLORS.grid;
            ctx.lineWidth = 0.5;
            for (let x = 0; x < GRID_WIDTH; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < GRID_HEIGHT; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }
            
            // Draw food
            ctx.fillStyle = COLORS.food;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                ctx.fillStyle = i === 0 ? COLORS.snakeHead : COLORS.snakeBody;
                ctx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
                
                // Add some detail to snake segments
                if (i === 0) {
                    // Draw eyes on head
                    ctx.fillStyle = '#000';
                    const eyeSize = 3;
                    const eyeOffset = 4;
                    ctx.beginPath();
                    ctx.arc(
                        segment.x * GRID_SIZE + GRID_SIZE / 2 - eyeOffset,
                        segment.y * GRID_SIZE + GRID_SIZE / 2 - eyeOffset,
                        eyeSize, 0, Math.PI * 2
                    );
                    ctx.arc(
                        segment.x * GRID_SIZE + GRID_SIZE / 2 + eyeOffset,
                        segment.y * GRID_SIZE + GRID_SIZE / 2 - eyeOffset,
                        eyeSize, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
            }
        }
        
        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }
            document.getElementById('high-score').textContent = highScore;
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            clearInterval(gameInterval);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'flex';
        }
        
        // Change snake direction
        function changeDirection(event) {
            const key = event.keyCode;
            // Prevent reverse direction
            if (key === 37 || key === 65) { // Left or A
                if (snakeDirection.x !== 1) {
                    snakeDirection = {x: -1, y: 0};
                }
            } else if (key === 38 || key === 87) { // Up or W
                if (snakeDirection.y !== 1) {
                    snakeDirection = {x: 0, y: -1};
                }
            } else if (key === 39 || key === 68) { // Right or D
                if (snakeDirection.x !== -1) {
                    snakeDirection = {x: 1, y: 0};
                }
            } else if (key === 40 || key === 83) { // Down or S
                if (snakeDirection.y !== -1) {
                    snakeDirection = {x: 0, y: 1};
                }
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', changeDirection);
        
        // Button controls
        document.getElementById('upBtn').addEventListener('click', () => {
            if (snakeDirection.y !== 1) snakeDirection = {x: 0, y: -1};
        });
        document.getElementById('downBtn').addEventListener('click', () => {
            if (snakeDirection.y !== -1) snakeDirection = {x: 0, y: 1};
        });
        document.getElementById('leftBtn').addEventListener('click', () => {
            if (snakeDirection.x !== 1) snakeDirection = {x: -1, y: 0};
        });
        document.getElementById('rightBtn').addEventListener('click', () => {
            if (snakeDirection.x !== -1) snakeDirection = {x: 1, y: 0};
        });
        
        // Restart button
        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOver').style.display = 'none';
            init();
        });
        
        // Load high score from localStorage
        window.addEventListener('load', () => {
            const savedHighScore = localStorage.getItem('snakeHighScore');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore);
                document.getElementById('high-score').textContent = highScore;
            }
            init();
        });
        
        // Ensure keyboard controls work without clicking
        window.addEventListener('keydown', function(e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
