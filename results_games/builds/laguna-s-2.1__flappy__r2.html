<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #f0f0f0; }
        canvas { display: block; margin: 20px auto; background: #fff; border: 2px solid #333; }
        #score { text-align: center; font-family: Arial, sans-serif; font-size: 24px; margin: 10px; }
        #game-over { text-align: center; font-family: Arial, sans-serif; font-size: 24px; color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="600"></canvas>
    <div id="game-over"></div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('game-over');

        // Game variables
        let bird = {
            x: 80,
            y: canvas.height / 2,
            radius: 12,
            velocity: 0,
            gravity: 0.6,
            jump: -10
        };

        let pipes = [];
        let pipeWidth = 50;
        let pipeGap = 120;
        let pipeSpeed = 2;
        let score = 0;
        let gameRunning = true;
        let animationId;

        // Input handling
        document.addEventListener('keydown', function(e) {
            if (!gameRunning) return;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                e.preventDefault();
                bird.velocity = bird.jump;
            }
        });

        // Touch support
        canvas.addEventListener('click', function(e) {
            if (!gameRunning) return;
            bird.velocity = bird.jump;
        });

        // Generate new pipe
        function createPipe() {
            let topHeight = Math.random() * (canvas.height - pipeGap - 100) + 50;
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                width: pipeWidth,
                scored: false
            });
        }

        // Reset game
        function resetGame() {
            bird.y = canvas.height / 2;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            gameRunning = true;
            gameOverElement.textContent = '';
            scoreElement.textContent = 'Score: 0';
            createPipe();
            createPipe();
            pipes[0].x = canvas.width;
            pipes[1].x = canvas.width + canvas.width / 2 + 50;
        }

        // Collision detection
        function checkCollision(pipe) {
            // Check collision with pipe
            if (bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipe.width) {
                if (bird.y - bird.radius < pipe.topHeight || bird.y + bird.radius > pipe.bottomY) {
                    return true;
                }
            }
            // Check collision with ground/ceiling
            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                return true;
            }
            return false;
        }

        // Game loop
        function update() {
            if (!gameRunning) return;

            // Update bird
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Update pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                // Remove off-screen pipes
                if (pipes[i].x + pipes[i].width < 0) {
                    pipes.splice(i, 1);
                }

                // Check collision
                if (checkCollision(pipes[i])) {
                    gameRunning = false;
                    gameOverElement.textContent = 'Game Over! Press SPACE to restart';
                    return;
                }

                // Score
                if (!pipes[i].scored && pipes[i].x + pipes[i].width < bird.x) {
                    score++;
                    pipes[i].scored = true;
                    scoreElement.textContent = 'Score: ' + score;
                }
            }

            // Add new pipes
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                createPipe();
            }

            // Draw everything
            draw();

            animationId = requestAnimationFrame(update);
        }

        // Draw function
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw bird
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff6b6b';
            ctx.fill();
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            // Draw pipes
            for (let pipe of pipes) {
                // Top pipe
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 2;
                ctx.strokeRect(pipe.x, 0, pipe.width, pipe.topHeight);

                // Bottom pipe
                ctx.fillRect(pipe.x, pipe.bottomY, pipe.width, canvas.height - pipe.bottomY);
                ctx.strokeRect(pipe.x, pipe.bottomY, pipe.width, canvas.height - pipe.bottomY);
            }

            // Draw ground
            ctx.fillStyle = '#8d6e63';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = '#a1887f';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);
        }

        // Start game
        resetGame();
        update();

        // Restart on spacebar when game over
        document.addEventListener('keydown', function(e) {
            if (!gameRunning && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown')) {
                e.preventDefault();
                resetGame();
                update();
            }
        });
    </script>
</body>
</html>
