<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    canvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scale = 20;
    let score = 0;

    let snake = [
      {x: scale * 5, y: scale * 5},
      {x: scale * 4, y: scale * 5},
      {x: scale * 3, y: scale * 5},
      {x: scale * 2, y: scale * 5},
      {x: scale * 1, y: scale * 5}
    ];

    let direction = 'right';
    let food = {x: Math.floor(Math.random() * (canvas.width / scale)) * scale, 
                y: Math.floor(Math.random() * (canvas.height / scale)) * scale};

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
          if (direction !== 'down') direction = 'up';
          break;
        case 'ArrowDown':
          if (direction !== 'up') direction = 'down';
          break;
        case 'ArrowLeft':
          if (direction !== 'right') direction = 'left';
          break;
        case 'ArrowRight':
          if (direction !== 'left') direction = 'right';
          break;
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      snake.forEach((part) => {
        ctx.fillStyle = 'green';
        ctx.fillRect(part.x, part.y, scale, scale);
      });
      ctx.fillStyle = 'red';
      ctx.fillRect(food.x, food.y, scale, scale);
      ctx.fillStyle = 'black';
      ctx.font = '24px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`Score: ${score}`, 10, 10);
    }

    function update() {
      let head = snake[0];
      let newHead = head;
      switch (direction) {
        case 'up':
          newHead = {x: head.x, y: head.y - scale};
          break;
        case 'down':
          newHead = {x: head.x, y: head.y + scale};
          break;
        case 'left':
          newHead = {x: head.x - scale, y: head.y};
          break;
        case 'right':
          newHead = {x: head.x + scale, y: head.y};
          break;
      }
      snake.unshift(newHead);
      if (newHead.x === food.x && newHead.y === food.y) {
        score++;
        food = {x: Math.floor(Math.random() * (canvas.width / scale)) * scale, 
                y: Math.floor(Math.random() * (canvas.height / scale)) * scale};
      } else {
        snake.pop();
      }
      if (newHead.x < 0 || newHead.x >= canvas.width || 
          newHead.y < 0 || newHead.y >= canvas.height || 
          snake.slice(1).some((part) => part.x === newHead.x && part.y === newHead.y)) {
        alert(`Game Over! Your score: ${score}`);
        score = 0;
        snake = [
          {x: scale * 5, y: scale * 5},
          {x: scale * 4, y: scale * 5},
          {x: scale * 3, y: scale * 5},
          {x: scale * 2, y: scale * 5},
          {x: scale * 1, y: scale * 5}
        ];
        direction = 'right';
      }
    }

    function loop() {
      update();
      draw();
      setTimeout(loop, 100);
    }

    loop();
  </script>
</body>
</html>
