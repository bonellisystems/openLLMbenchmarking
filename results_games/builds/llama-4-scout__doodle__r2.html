<!DOCTYPE html>
<html>
<head>
<style>
  canvas {
    border: 1px solid black;
  }
</style>
</head>
<body>
<canvas id="canvas" width="400" height="600"></canvas>
<script>
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var player = {x: 200, y: 300, vy: 0, size: 20};
  var platforms = [];
  var score = 0;

  function generatePlatforms() {
    platforms = [];
    for (var i = 0; i < 10; i++) {
      var x = Math.random() * (canvas.width - 100);
      var y = canvas.height - (i + 1) * 50;
      platforms.push({x: x, y: y, w: 100, h: 20});
    }
  }

  generatePlatforms();

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'black';
    ctx.fillRect(player.x, player.y, player.size, player.size);
    for (var i = 0; i < platforms.length; i++) {
      ctx.fillRect(platforms[i].x, platforms[i].y, platforms[i].w, platforms[i].h);
    }
    ctx.font = '24px Arial';
    ctx.fillStyle = 'black';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('Score: ' + score, 10, 10);
  }

  function update() {
    player.vy += 0.5;
    player.y += player.vy;
    if (player.y + player.size > canvas.height) {
      player.y = 300;
      player.vy = 0;
      score = 0;
      generatePlatforms();
    }
    for (var i = 0; i < platforms.length; i++) {
      if (player.y + player.size > platforms[i].y &&
          player.y < platforms[i].y + platforms[i].h &&
          player.x + player.size > platforms[i].x &&
          player.x < platforms[i].x + platforms[i].w) {
        player.y = platforms[i].y - player.size;
        player.vy = 0;
      }
    }
    if (player.x < 0) player.x = 0;
    if (player.x + player.size > canvas.width) player.x = canvas.width - player.size;
    score++;
  }

  document.addEventListener('keydown', function(e) {
    if (e.key == 'ArrowLeft') player.x -= 10;
    if (e.key == 'ArrowRight') player.x += 10;
    if (e.key == 'ArrowUp' && player.vy == 0) player.vy = -10;
  });

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
