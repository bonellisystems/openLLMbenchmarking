<!DOCTYPE html>
<html>
<head>
    <title>Tiny Roguelike</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        #game {
            display: inline-block;
            border: 1px solid #0f0;
            background-color: #000;
            font-size: 14px;
            line-height: 1;
            letter-spacing: 0;
        }
        #info {
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="info">Use WASD or arrow keys to move. Find the stairs (>) to descend.</div>

    <script>
        // Game constants
        const WIDTH = 40;
        const HEIGHT = 20;
        const WALL = '#';
        const FLOOR = '.';
        const STAIRS = '>';
        const PLAYER = '@';
        const ENEMY = 'e';
        const ITEM = '$';

        // Game state
        let dungeon = [];
        let player = { x: 0, y: 0 };
        let level = 1;
        let gameOver = false;
        let gameWon = false;

        // Generate dungeon
        function generateDungeon() {
            dungeon = [];
            for (let y = 0; y < HEIGHT; y++) {
                let row = [];
                for (let x = 0; x < WIDTH; x++) {
                    if (x === 0 || y === 0 || x === WIDTH - 1 || y === HEIGHT - 1) {
                        row.push(WALL);
                    } else {
                        row.push(Math.random() > 0.7 ? WALL : FLOOR);
                    }
                }
                dungeon.push(row);
            }

            // Ensure player start is floor
            player.x = Math.floor(WIDTH / 2);
            player.y = Math.floor(HEIGHT / 2);
            dungeon[player.y][player.x] = FLOOR;

            // Add stairs
            let stairsX, stairsY;
            do {
                stairsX = Math.floor(Math.random() * (WIDTH - 2)) + 1;
                stairsY = Math.floor(Math.random() * (HEIGHT - 2)) + 1;
            } while (dungeon[stairsY][stairsX] !== FLOOR);
            dungeon[stairsY][stairsX] = STAIRS;

            // Add enemies
            for (let i = 0; i < 5 + level; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * (WIDTH - 2)) + 1;
                    ey = Math.floor(Math.random() * (HEIGHT - 2)) + 1;
                } while (dungeon[ey][ex] !== FLOOR);
                dungeon[ey][ex] = ENEMY;
            }

            // Add items
            for (let i = 0; i < 3; i++) {
                let ix, iy;
                do {
                    ix = Math.floor(Math.random() * (WIDTH - 2)) + 1;
                    iy = Math.floor(Math.random() * (HEIGHT - 2)) + 1;
                } while (dungeon[iy][ix] !== FLOOR);
                dungeon[iy][ix] = ITEM;
            }
        }

        // Render game
        function render() {
            let output = '';
            for (let y = 0; y < HEIGHT; y++) {
                for (let x = 0; x < WIDTH; x++) {
                    if (x === player.x && y === player.y) {
                        output += PLAYER;
                    } else {
                        output += dungeon[y][x];
                    }
                }
                output += '\n';
            }
            document.getElementById('game').textContent = output;
        }

        // Move player
        function movePlayer(dx, dy) {
            if (gameOver || gameWon) return;

            const newX = player.x + dx;
            const newY = player.y + dy;

            if (newX < 0 || newX >= WIDTH || newY < 0 || newY >= HEIGHT) return;
            if (dungeon[newY][newX] === WALL) return;

            // Handle enemy collision
            if (dungeon[newY][newX] === ENEMY) {
                gameOver = true;
                render();
                return;
            }

            // Handle item pickup
            if (dungeon[newY][newX] === ITEM) {
                // Simple item effect - could be expanded
            }

            // Handle stairs
            if (dungeon[newY][newX] === STAIRS) {
                level++;
                generateDungeon();
                render();
                return;
            }

            // Move player
            player.x = newX;
            player.y = newY;
            render();
        }

        // Initialize game
        function init() {
            generateDungeon();
            render();
            document.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        movePlayer(0, -1);
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        movePlayer(0, 1);
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        movePlayer(-1, 0);
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        movePlayer(1, 0);
                        break;
                }
            });
        }

        // Start game
        init();
    </script>
</body>
</html>
