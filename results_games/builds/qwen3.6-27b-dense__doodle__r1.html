<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 400, H = 600;
canvas.width = W;
canvas.height = H;

// Audio context for sound effects
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'square', vol = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function jumpSound() { playSound(400, 0.1, 'square', 0.08); setTimeout(() => playSound(500, 0.1, 'square', 0.06), 50); }
function springSound() { playSound(600, 0.15, 'sine', 0.1); setTimeout(() => playSound(900, 0.15, 'sine', 0.08), 80); }
function breakSound() { playSound(150, 0.2, 'sawtooth', 0.06); }
function dieSound() { playSound(200, 0.3, 'sawtooth', 0.1); setTimeout(() => playSound(100, 0.4, 'sawtooth', 0.08), 150); }
function monsterSound() { playSound(80, 0.3, 'sawtooth', 0.05); }

// Game state
let gameState = 'menu'; // menu, playing, dead
let score = 0;
let highScore = parseInt(localStorage.getItem('doodleHighScore') || '0');
let cameraY = 0;
let maxHeight = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Player
const player = {
    x: W / 2,
    y: H - 100,
    w: 30,
    h: 35,
    vx: 0,
    vy: 0,
    dir: 1,
    onGround: false,
    alive: true,
    frame: 0,
    frameTimer: 0,
    jetpack: false,
    jetpackFuel: 0
};

// Platforms
let platforms = [];
const PLATFORM_W = 60;
const PLATFORM_H = 14;
const GRAVITY = 0.45;
const JUMP_FORCE = -11;
const SPRING_FORCE = -18;
const MOVE_SPEED = 5;
const MAX_FALL = 12;

// Platform types
const PLAT_NORMAL = 0;
const PLAT_MOVING = 1;
const PLAT_BREAK = 2;
const PLAT_SPRING = 3;
const PLAT_VANISH = 4;

// Monsters
let monsters = [];

// Particles
let particles = [];

// Stars for background
let stars = [];
for (let i = 0; i < 50; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 3, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (gameState === 'menu' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp')) {
        startGame();
    } else if (gameState === 'dead' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    }
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls
let touchLeft = false, touchRight = false;
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    initAudio();
    if (gameState === 'menu' || gameState === 'dead') { startGame(); return; }
    for (let t of e.changedTouches) {
        const rect = canvas.getBoundingClientRect();
        const x = (t.clientX - rect.left) / rect.width * W;
        if (x < W / 2) touchLeft = true;
        else touchRight = true;
    }
}, { passive: false });
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    touchLeft = false;
    touchRight = false;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    touchLeft = false;
    touchRight = false;
    for (let t of e.touches) {
        const rect = canvas.getBoundingClientRect();
        const x = (t.clientX - rect.left) / rect.width * W;
        if (x < W / 2) touchLeft = true;
        else touchRight = true;
    }
}, { passive: false });

function startGame() {
    gameState = 'playing';
    score = 0;
    maxHeight = 0;
    cameraY = 0;
    player.x = W / 2;
    player.y = H - 100;
    player.vx = 0;
    player.vy = JUMP_FORCE;
    player.alive = true;
    player.dir = 1;
    player.jetpack = false;
    player.jetpackFuel = 0;
    platforms = [];
    monsters = [];
    particles = [];

    // Generate initial platforms
    for (let y = H - 60; y > -200; y -= 70 + Math.random() * 40) {
        addPlatform(y, Math.random() * (W - PLATFORM_W));
    }
    // Ground platform
    platforms.push({ x: 0, y: H - 30, w: W, h: 30, type: PLAT_NORMAL, broken: false, vanishTimer: 0, springActive: false, springTimer: 0, moveDir: 1, moveSpeed: 0, origX: 0 });
}

function addPlatform(y, x) {
    const difficulty = Math.min(maxHeight / 5000, 1);
    let type = PLAT_NORMAL;
    const r = Math.random();
    if (difficulty > 0.1 && r < 0.15) type = PLAT_MOVING;
    else if (difficulty > 0.2 && r < 0.25) type = PLAT_BREAK;
    else if (difficulty > 0.3 && r < 0.35) type = PLAT_VANISH;
    else if (r < 0.42) type = PLAT_SPRING;

    const plat = {
        x: x !== undefined ? x : Math.random() * (W - PLATFORM_W),
        y: y,
        w: PLATFORM_W,
        h: PLATFORM_H,
        type: type,
        broken: false,
        vanishTimer: 0,
        springActive: false,
        springTimer: 0,
        moveDir: Math.random() > 0.5 ? 1 : -1,
        moveSpeed: 1 + Math.random() * 1.5,
        origX: x !== undefined ? x : Math.random() * (W - PLATFORM_W)
    };
    platforms.push(plat);

    // Add monsters at higher difficulties
    if (difficulty > 0.3 && Math.random() < difficulty * 0.15) {
        monsters.push({
            x: Math.random() * (W - 30),
            y: y - 40,
            w: 30,
            h: 30,
            vx: (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random()),
            alive: true,
            frame: 0
        });
    }
}

function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 2,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

function update() {
    if (gameState !== 'playing') return;

    // Input
    let moveLeft = keys['ArrowLeft'] || keys['KeyA'] || touchLeft;
    let moveRight = keys['ArrowRight'] || keys['KeyD'] || touchRight;

    if (moveLeft) { player.vx = -MOVE_SPEED; player.dir = -1; }
    else if (moveRight) { player.vx = MOVE_SPEED; player.dir = 1; }
    else { player.vx *= 0.85; }

    // Physics
    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
    player.x += player.vx;
    player.y += player.vy;

    // Wrap around screen
    if (player.x < -player.w / 2) player.x = W + player.w / 2;
    if (player.x > W + player.w / 2) player.x = -player.w / 2;

    // Animation
    player.frameTimer++;
    if (player.frameTimer > 8) { player.frame = (player.frame + 1) % 4; player.frameTimer = 0; }

    // Platform collision (only when falling)
    if (player.vy >= 0) {
        for (let p of platforms) {
            if (p.broken) continue;
            const px = player.x - player.w / 2;
            const py = player.y;
            if (px + player.w > p.x && px < p.x + p.w &&
                py + player.h > p.y && py + player.h < p.y + p.h + player.vy + 2) {

                if (p.type === PLAT_BREAK) {
                    p.broken = true;
                    breakSound();
                    spawnParticles(p.x + p.w / 2, p.y, '#8B4513', 8, 3);
                    continue;
                }

                player.y = p.y - player.h;
                player.onGround = true;

                if (p.type === PLAT_SPRING) {
                    player.vy = SPRING_FORCE;
                    springSound();
                    p.springActive = true;
                    p.springTimer = 10;
                    spawnParticles(p.x + p.w / 2, p.y, '#FFD700', 6, 2);
                } else {
                    player.vy = JUMP_FORCE;
                    jumpSound();
                }

                if (p.type === PLAT_VANISH) {
                    p.vanishTimer = 15;
                }

                spawnParticles(player.x, player.y + player.h, '#90EE90', 3, 1.5);
                break;
            }
        }
    }

    // Update platforms
    for (let p of platforms) {
        if (p.type === PLAT_MOVING && !p.broken) {
            p.x += p.moveDir * p.moveSpeed;
            if (p.x <= 0 || p.x + p.w >= W) p.moveDir *= -1;
        }
        if (p.type === PLAT_VANISH && p.vanishTimer > 0) {
            p.vanishTimer--;
            if (p.vanishTimer <= 0) p.broken = true;
        }
        if (p.springActive) {
            p.springTimer--;
            if (p.springTimer <= 0) p.springActive = false;
        }
    }

    // Update monsters
    for (let m of monsters) {
        if (!m.alive) continue;
        m.x += m.vx;
        if (m.x <= 0 || m.x + m.w >= W) m.vx *= -1;
        m.frame += 0.1;

        // Collision with player
        const px = player.x - player.w / 2;
        const py = player.y;
        if (px + player.w > m.x && px < m.x + m.w &&
            py + player.h > m.y && py < m.y + m.h) {
            // Check if landing on top
            if (player.vy > 0 && py + player.h < m.y + m.h / 2 + 10) {
                m.alive = false;
                player.vy = JUMP_FORCE;
                jumpSound();
                spawnParticles(m.x + m.w / 2, m.y + m.h / 2, '#FF4444', 10, 4);
                score += 50;
            } else {
                killPlayer();
            }
        }
    }

    // Camera follow
    const targetCam = player.y - H * 0.4;
    if (targetCam < cameraY) {
        cameraY += (targetCam - cameraY) * 0.15;
    }

    // Track max height
    const currentHeight = Math.floor(-player.y / 10);
    if (currentHeight > maxHeight) maxHeight = currentHeight;
    score = maxHeight;

    // Generate new platforms
    const highestPlat = Math.min(...platforms.map(p => p.y));
    while (highestPlat > cameraY - 100) {
        const gap = 55 + Math.random() * 50 + Math.min(maxHeight / 100, 30);
        highestPlat -= gap;
        addPlatform(highestPlat);
    }

    // Remove off-screen platforms and monsters
    platforms = platforms.filter(p => p.y < cameraY + H + 100);
    monsters = monsters.filter(m => m.y < cameraY + H + 100);

    // Update particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);

    // Screen shake
    if (shakeTimer > 0) shakeTimer--;

    // Death check
    if (player.y > cameraY + H + 50) {
        killPlayer();
    }
}

function killPlayer() {
    if (!player.alive) return;
    player.alive = false;
    gameState = 'dead';
    dieSound();
    shakeTimer = 20;
    shakeIntensity = 8;
    spawnParticles(player.x, player.y, '#FF0000', 20, 5);
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('doodleHighScore', highScore.toString());
    }
}

function drawDoodle(x, y, dir, frame, alive) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir, 1);

    if (!alive) {
        // Dead face
        ctx.fillStyle = '#8BC34A';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#33691E';
        ctx.lineWidth = 2;
        ctx.stroke();

        // X eyes
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-7, -5); ctx.lineTo(-3, -1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-3, -5); ctx.lineTo(-7, -1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, -5); ctx.lineTo(7, -1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(7, -5); ctx.lineTo(3, -1); ctx.stroke();

        // Sad mouth
        ctx.beginPath();
        ctx.arc(0, 8, 5, Math.PI, 0);
        ctx.stroke();
    } else {
        // Body
        ctx.fillStyle = '#8BC34A';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#33691E';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.ellipse(-6, -5, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(6, -5, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pupils (look in movement direction)
        const pupilOffX = player.vx > 0.5 ? 2 : player.vx < -0.5 ? -2 : 0;
        const pupilOffY = player.vy < 0 ? -1 : player.vy > 2 ? 1 : 0;
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(-6 + pupilOffX, -5 + pupilOffY, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(6 + pupilOffX, -5 + pupilOffY, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Mouth
        if (player.vy < -2) {
            // Excited mouth when jumping up
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(0, 5, 4, 0, Math.PI);
            ctx.fill();
        } else if (player.vy > 3) {
            // Worried mouth when falling
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 8, 4, Math.PI + 0.3, -0.3);
            ctx.stroke();
        } else {
            // Normal smile
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 4, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        // Legs animation
        const legAnim = Math.sin(frame * Math.PI / 2) * 4;
        ctx.strokeStyle = '#33691E';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-5, 14);
        ctx.lineTo(-8, 20 + legAnim);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(5, 14);
        ctx.lineTo(8, 20 - legAnim);
        ctx.stroke();
    }

    ctx.restore();
}

function drawPlatform(p) {
    if (p.broken) return;

    const screenY = p.y - cameraY;
    if (screenY > H + 20 || screenY < -40) return;

    ctx.save();

    if (p.type === PLAT_VANISH && p.vanishTimer > 0) {
        ctx.globalAlpha = p.vanishTimer / 15;
    }

    if (p.w === W) {
        // Ground
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(p.x, screenY, p.w, p.h);
        ctx.fillStyle = '#388E3C';
        ctx.fillRect(p.x, screenY, p.w, 4);
        // Grass tufts
        ctx.fillStyle = '#66BB6A';
        for (let gx = 10; gx < W; gx += 25) {
            ctx.beginPath();
            ctx.moveTo(gx, screenY);
            ctx.lineTo(gx + 5, screenY - 8);
            ctx.lineTo(gx + 10, screenY);
            ctx.fill();
        }
    } else {
        let color1, color2, color3;
        switch (p.type) {
            case PLAT_NORMAL: color1 = '#4CAF50'; color2 = '#388E3C'; color3 = '#66BB6A'; break;
            case PLAT_MOVING: color1 = '#2196F3'; color2 = '#1565C0'; color3 = '#42A5F5'; break;
            case PLAT_BREAK: color1 = '#8D6E63'; color2 = '#5D4037'; color3 = '#A1887F'; break;
            case PLAT_SPRING: color1 = '#FF9800'; color2 = '#E65100'; color3 = '#FFB74D'; break;
            case PLAT_VANISH: color1 = '#9C27B0'; color2 = '#6A1B9A'; color3 = '#BA68C8'; break;
        }

        // Platform body
        ctx.fillStyle = color1;
        roundRect(ctx, p.x, screenY, p.w, p.h, 5);
        ctx.fill();

        // Top highlight
        ctx.fillStyle = color3;
        roundRect(ctx, p.x + 2, screenY, p.w - 4, 5, 3);
        ctx.fill();

        // Bottom shadow
        ctx.fillStyle = color2;
        ctx.fillRect(p.x + 3, screenY + p.h - 3, p.w - 6, 3);

        // Spring
        if (p.type === PLAT_SPRING) {
            const springH = p.springActive ? 18 : 10;
            ctx.fillStyle = '#FFD700';
            ctx.strokeStyle = '#FF8F00';
            ctx.lineWidth = 2;
            const sx = p.x + p.w / 2 - 6;
            const sy = screenY - springH;
            ctx.fillRect(sx, sy, 12, springH);
            ctx.strokeRect(sx, sy, 12, springH);
            // Spring coils
            ctx.strokeStyle = '#FF8F00';
            for (let i = 0; i < 3; i++) {
                const cy = sy + 3 + i * (springH / 3);
                ctx.beginPath();
                ctx.moveTo(sx + 2, cy);
                ctx.lineTo(sx + 10, cy + 2);
                ctx.stroke();
            }
        }

        // Crack for breakable
        if (p.type === PLAT_BREAK) {
            ctx.strokeStyle = '#3E2723';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w * 0.3, screenY);
            ctx.lineTo(p.x + p.w * 0.4, screenY + p.h * 0.5);
            ctx.lineTo(p.x + p.w * 0.35, screenY + p.h);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(p.x + p.w * 0.7, screenY);
            ctx.lineTo(p.x + p.w * 0.6, screenY + p.h * 0.6);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawMonster(m) {
    if (!m.alive) return;
    const screenY = m.y - cameraY;
    if (screenY > H + 40 || screenY < -40) return;

    ctx.save();
    ctx.translate(m.x + m.w / 2, screenY + m.h / 2);

    // Body
    ctx.fillStyle = '#E53935';
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#B71C1C';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Spikes
    ctx.fillStyle = '#C62828';
    for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + m.frame;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * 12, Math.sin(angle) * 11);
        ctx.lineTo(Math.cos(angle) * 20, Math.sin(angle) * 18);
        ctx.lineTo(Math.cos(angle + 0.3) * 12, Math.sin(angle + 0.3) * 11);
        ctx.fill();
    }

    // Eyes
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.ellipse(-5, -3, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(5, -3, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-5, -2, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(5, -2, 2, 0, Math.PI * 2);
    ctx.fill();

    // Angry eyebrows
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-9, -8);
    ctx.lineTo(-3, -6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(9, -8);
    ctx.lineTo(3, -6);
    ctx.stroke();

    // Mouth
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 5, 4, 0, Math.PI);
    ctx.fill();
    // Teeth
    ctx.fillStyle = '#FFF';
    ctx.fillRect(-3, 4, 2, 3);
    ctx.fillRect(1, 4, 2, 3);

    ctx.restore();
}

function drawBackground() {
    // Sky gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    const heightFactor = Math.min(maxHeight / 10000, 1);
    if (heightFactor < 0.5) {
        gradient.addColorStop(0, '#E8F5E9');
        gradient.addColorStop(1, '#C8E6C9');
    } else {
        const t = (heightFactor - 0.5) * 2;
        gradient.addColorStop(0, lerpColor('#E8F5E9', '#1A237E', t));
        gradient.addColorStop(1, lerpColor('#C8E6C9', '#283593', t));
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Grid lines (notebook paper style)
    ctx.strokeStyle = 'rgba(0,0,0,0.04)';
    ctx.lineWidth = 1;
    const gridOffset = (-cameraY * 0.3) % 30;
    for (let y = gridOffset; y < H; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
    for (let x = 0; x < W; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }

    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const cloudOffset = (-cameraY * 0.1) % (H * 2);
    for (let i = 0; i < 5; i++) {
        const cx = (i * 137 + 50) % W;
        const cy = ((i * 200 + cloudOffset) % (H + 100)) - 50;
        drawCloud(cx, cy, 30 + i * 5);
    }
}

function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.4, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
    ctx.arc(x + size * 0.3, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
}

function lerpColor(a, b, t) {
    const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    const br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
}

function drawHUD() {
    // Score
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(ctx, 10, 10, 120, 35, 8);
    ctx.fill();

    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 20, 34);

    // High score
    if (highScore > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        roundRect(ctx, W - 130, 10, 120, 35, 8);
        ctx.fill();

        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 14px Arial, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('Best: ' + highScore, W - 20, 33);
    }
}

function drawMenu() {
    drawBackground();

    // Title
    ctx.save();
    const titleY = H * 0.25;
    const bounce = Math.sin(Date.now() / 500) * 5;

    ctx.fillStyle = '#4CAF50';
    ctx.strokeStyle = '#2E7D32';
    ctx.lineWidth = 4;
    ctx.font = 'bold 48px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('DOODLE JUMP', W / 2, titleY + bounce);
    ctx.fillText('DOODLE JUMP', W / 2, titleY + bounce);

    // Doodle character on menu
    drawDoodle(W / 2, H * 0.45 + Math.sin(Date.now() / 300) * 10, 1, Math.floor(Date.now() / 200) % 4, true);

    // Instructions
    ctx.fillStyle = '#333';
    ctx.font = '18px Arial, sans-serif';
    ctx.fillText('Arrow Keys / A,D to move', W / 2, H * 0.65);
    ctx.fillText('Jump on platforms to climb!', W / 2, H * 0.72);

    // Start prompt
    const alpha = 0.5 + Math.sin(Date.now() / 400) * 0.5;
    ctx.fillStyle = `rgba(50,50,50,${alpha})`;
    ctx.font = 'bold 22px Arial, sans-serif';
    ctx.fillText('Press SPACE or ENTER to start', W / 2, H * 0.85);

    if (highScore > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.fillText('High Score: ' + highScore, W / 2, H * 0.93);
    }

    ctx.restore();
}

function drawDead() {
    // Darken
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.textAlign = 'center';

    // Game Over
    ctx.fillStyle = '#FF5252';
    ctx.strokeStyle = '#B71C1C';
    ctx.lineWidth = 3;
    ctx.font = 'bold 44px Arial, sans-serif';
    ctx.strokeText('GAME OVER', W / 2, H * 0.3);
    ctx.fillText('GAME OVER', W / 2, H * 0.3);

    // Score
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 28px Arial, sans-serif';
    ctx.fillText('Score: ' + score, W / 2, H * 0.45);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 20px Arial, sans-serif';
        ctx.fillText('★ NEW HIGH SCORE! ★', W / 2, H * 0.55);
    } else {
        ctx.fillStyle = '#AAA';
        ctx.font = '18px Arial, sans-serif';
        ctx.fillText('Best: ' + highScore, W / 2, H * 0.55);
    }

    // Restart
    const alpha = 0.5 + Math.sin(Date.now() / 400) * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.font = 'bold 20px Arial, sans-serif';
    ctx.fillText('Press SPACE to retry', W / 2, H * 0.72);

    ctx.restore();
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 20);
        const sy = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 20);
        ctx.translate(sx, sy);
    }

    if (gameState === 'menu') {
        drawMenu();
        ctx.restore();
        return;
    }

    drawBackground();

    // Draw platforms
    for (let p of platforms) {
        drawPlatform(p);
    }

    // Draw monsters
    for (let m of monsters) {
        drawMonster(m);
    }

    // Draw particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y - cameraY, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw player
    const playerScreenY = player.y - cameraY;
    if (player.alive) {
        drawDoodle(player.x, playerScreenY, player.dir, player.frame, true);
    } else {
        drawDoodle(player.x, playerScreenY, player.dir, 0, false);
    }

    drawHUD();

    if (gameState === 'dead') {
        drawDead();
    }

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
