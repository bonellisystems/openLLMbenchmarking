<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Doodle Jump</title>
<style>
body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { background: #fff; box-shadow: 0 0 10px #000; }
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const keys = {};
let platforms = [];
let score = 0;
let gameOver = false;

const p = { x: 175, y: 400, w: 30, h: 30, vx: 0, vy: 0, speed: 4, jump: -9, gravity: 0.4 };
const pw = 60, ph = 15;

function init() {
    gameOver = false;
    score = 0;
    p.x = 175; p.y = 400; p.vx = 0; p.vy = 0;
    platforms = [];
    for (let i = 0; i < 5; i++) {
        platforms.push({ x: Math.random() * (c.width - pw), y: 550 - i * 100, w: pw, h: ph });
    }
}

function update() {
    if (gameOver) return;

    if (keys['ArrowLeft']) p.vx = -p.speed;
    else if (keys['ArrowRight']) p.vx = p.speed;
    else p.vx = 0;

    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;

    if (p.x + p.w < 0) p.x = c.width;
    if (p.x > c.width) p.x = -p.w;

    if (p.y < c.height / 2) {
        const dy = c.height / 2 - p.y;
        p.y = c.height / 2;
        platforms.forEach(plat => plat.y += dy);
        score += Math.floor(dy);
    }

    if (p.vy > 0) {
        for (let i = 0; i < platforms.length; i++) {
            const plat = platforms[i];
            if (p.x < plat.x + plat.w && p.x + p.w > plat.x && p.y + p.h > plat.y && p.y + p.h < plat.y + plat.h + 10) {
                p.vy = p.jump;
                p.y = plat.y - p.h;
            }
        }
    }

    platforms = platforms.filter(plat => plat.y < c.height);

    let highest = c.height;
    for (let i = 0; i < platforms.length; i++) {
        if (platforms[i].y < highest) highest = platforms[i].y;
    }

    if (highest > 100) {
        platforms.push({ x: Math.random() * (c.width - pw), y: highest - 70 - Math.random() * 50, w: pw, h: ph });
    }

    if (p.y > c.height) gameOver = true;
}

function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#654321';
    for (let i = 0; i < platforms.length; i++) {
        ctx.fillRect(platforms[i].x, platforms[i].y, platforms[i].w, platforms[i].h);
    }

    ctx.fillStyle = '#00FF00';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#000';
    ctx.fillRect(p.x + 5, p.y + 5, 5, 5);
    ctx.fillRect(p.x + 20, p.y + 5, 5, 5);

    ctx.fillStyle = '#000';
    ctx.font = '20px Arial';
    ctx.fillText('Score: ' + score, 10, 30);

    if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '30px Arial';
        ctx.fillText('Game Over', c.width / 2, c.height / 2);
        ctx.font = '20px Arial';
        ctx.fillText('Press Space to Restart', c.width / 2, c.height / 2 + 40);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' && gameOver) init();
});

window.addEventListener('keyup', e => {
    keys[e.key] = false;
});

init();
loop();
</script>
</body>
</html>
