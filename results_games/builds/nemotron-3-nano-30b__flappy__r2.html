<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  body,html{margin:0;padding:0;overflow:hidden;background:#70c5ce;}
  canvas{display:block;margin:0 auto;background:#70c5ce;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);
resize();
let bird={x:50,y:canvas.height/2,vy:0,width:34,height:24};
let pipes=[];
let score=0;
let best=0;
let frame=0;
let gameOver=false;
let animationId;
function reset(){bird.x=50;bird.y=canvas.height/2;bird.vy=0;pipes=[];score=0;gameOver=false;frame=0;}
function flap(){bird.vy=-8;}
window.addEventListener('keydown',e=>{if(e.code==='Space')flap();});
function randomPipe(){return {x:canvas.width,width:52,height:canvas.height*Math.random()*0.6+20,topHeight:canvas.height*Math.random()*0.6,bottomHeight:canvas.height*Math.random()*0.6};}
function addPipe(){pipes.push(randomPipe());}
function update(){if(gameOver)return;
bird.vy+=0.5;
bird.y+=bird.vy;
if(bird.y+bird.height>canvas.height){bird.y=canvas.height-bird.height;bird.vy=0;gameOver=true;}
if(bird.y<0){bird.y=0;bird.vy=0;gameOver=true;}
for(let i=pipes.length-1;i>=0;i--){
  let p=pipes[i];
  p.x-=2;
  if(p.x+52<0) pipes.splice(i,1);
  if(p.x+52===bird.x && bird.y+bird.height>p.topHeight && bird.y<p.topHeight+p.topHeight){
    gameOver=true;
  }
  if(p.x===bird.x && bird.y+bird.height>p.topHeight+p.topHeight && bird.y<p.topHeight+p.topHeight){
    gameOver=true;
  }
}
if(frame%120===0)addPipe();
frame++;
if(gameOver){
  if(score>best)best=score;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';
  ctx.font='48px Arial';
  ctx.textAlign='center';
  ctx.fillText('Game Over',canvas.width/2,canvas.height/2-20);
  ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+20);
  ctx.fillText('Best: '+best,canvas.width/2,canvas.height/2+60);
  cancelAnimationFrame(animationId);
  return;
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // bird
  ctx.fillStyle='#ff0';
  ctx.beginPath();
  ctx.arc(bird.x+bird.width/2,bird.y+bird.height/2,bird.width/2,0,Math.PI*2);
  ctx.fill();
  // pipes
  ctx.fillStyle='#0f0';
  for(let p of pipes){
    // top
    ctx.fillRect(p.x,0,p.width,p.topHeight);
    // bottom
    ctx.fillRect(p.x,p.topHeight+p.height,p.width,canvas.height-p.topHeight-p.bottomHeight);
  }
  // score
  ctx.fillStyle='#fff';
  ctx.font='20px Arial';
  ctx.fillText('Score: '+score,10,30);
  animationId=requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
