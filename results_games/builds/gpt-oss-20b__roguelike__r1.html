<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Roguelike</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;overflow:hidden;}
pre{margin:0;padding:0;}
</style>
</head>
<body tabindex="0">
<pre id="screen"></pre>
<script>
const WIDTH=40, HEIGHT=20;
let map, player, monsters, gameOver;

function init(){
  map=Array.from({length:HEIGHT},()=>Array(WIDTH).fill('#'));
  let x=Math.floor(WIDTH/2), y=Math.floor(HEIGHT/2);
  for(let i=0;i<2000;i++){
    map[y][x]='.';
    const dir=Math.floor(Math.random()*4);
    if(dir===0&&x>0)x--; if(dir===1&&x<WIDTH-1)x++; if(dir===2&&y>0)y--; if(dir===3&&y<HEIGHT-1)y++;
  }
  player={x,y};
  monsters=[];
  for(let i=0;i<5;i++){
    let mx, my;
    do{mx=Math.floor(Math.random()*WIDTH); my=Math.floor(Math.random()*HEIGHT);}while(map[my][mx]!=='.' || (mx===x&&my===y));
    monsters.push({x:mx,y:my});
  }
  gameOver=false;
  render();
}

function render(){
  let s='';
  for(let y=0;y<HEIGHT;y++){
    for(let x=0;x<WIDTH;x++){
      if(player.x===x&&player.y===y)s+='@';
      else if(monsters.some(m=>m.x===x&&m.y===y))s+='M';
      else s+=map[y][x];
    }
    s+='\n';
  }
  if(gameOver)s+='Game Over! Press R to restart.\n';
  else s+='Use arrow keys or WASD to move.\n';
  document.getElementById('screen').textContent=s;
}

function movePlayer(dx,dy){
  if(gameOver)return;
  const nx=player.x+dx, ny=player.y+dy;
  if(nx<0||nx>=WIDTH||ny<0||ny>=HEIGHT)return;
  if(map[ny][nx]==='#')return;
  const m=monsters.find(m=>m.x===nx&&m.y===ny);
  if(m){monsters.splice(monsters.indexOf(m),1);player.x=nx;player.y=ny;}
  else{player.x=nx;player.y=ny;}
  moveMonsters();
  render();
}

function moveMonsters(){
  for(const m of monsters){
    const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
    const dir=dirs[Math.floor(Math.random()*4)];
    const nx=m.x+dir[0], ny=m.y+dir[1];
    if(nx<0||nx>=WIDTH||ny<0||ny>=HEIGHT)continue;
    if(map[ny][nx]==='#')continue;
    if(nx===player.x&&ny===player.y){gameOver=true;return;}
    if(monsters.some(o=>o.x===nx&&o.y===ny))continue;
    m.x=nx; m.y=ny;
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){init();return;}
  if(gameOver)return;
  switch(e.key){
    case 'ArrowUp':case 'w':case 'W':movePlayer(0,-1);break;
    case 'ArrowDown':case 's':case 'S':movePlayer(0,1);break;
    case 'ArrowLeft':case 'a':case 'A':movePlayer(-1,0);break;
    case 'ArrowRight':case 'd':case 'D':movePlayer(1,0);break;
  }
});

window.onload=function(){document.body.focus();init();};
</script>
</body>
</html>
