<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function wrap(obj) {
    if (obj.x < -50) obj.x += canvas.width + 50;
    if (obj.x > canvas.width + 50) obj.x -= canvas.width + 50;
    if (obj.y < -50) obj.y += canvas.height + 50;
    if (obj.y > canvas.height + 50) obj.y -= canvas.height + 50;
}

function dist(a, b) {
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
}

function randomPolygon(cx, cy, radius, vertices) {
    const points = [];
    for (let i = 0; i < vertices; i++) {
        const angle = (Math.PI * 2 / vertices) * i + (Math.random() - 0.5) * 0.5;
        const r = radius * (0.7 + Math.random() * 0.3);
        points.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
    }
    return points;
}

let ship, bullets, asteroids, score, lives, gameState, respawnTimer, invulTimer, particles;

function initGame() {
    ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        angle: -Math.PI / 2,
        vx: 0,
        vy: 0,
        radius: 15,
        thrust: false,
        thrustFlicker: 0
    };
    bullets = [];
    asteroids = [];
    particles = [];
    score = 0;
    lives = 3;
    gameState = 'playing';
    respawnTimer = 0;
    invulTimer = 0;
    spawnAsteroids(4);
}

function spawnAsteroids(count) {
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (dist({ x, y }, ship) < 200);
        const size = 3;
        const radius = 30 + size * 15;
        const speed = (1 + Math.random() * 1.5) * (4 - size) * 0.5;
        const angle = Math.random() * Math.PI * 2;
        const verts = 8 + Math.floor(Math.random() * 6);
        asteroids.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius,
            size,
            verts,
            rotation: 0,
            rotSpeed: (Math.random() - 0.5) * 0.03,
            points: randomPolygon(0, 0, radius, verts)
        });
    }
}

function shoot() {
    if (gameState !== 'playing') return;
    const speed = 8;
    bullets.push({
        x: ship.x + Math.cos(ship.angle) * 20,
        y: ship.y + Math.sin(ship.angle) * 20,
        vx: Math.cos(ship.angle) * speed + ship.vx * 0.3,
        vy: Math.sin(ship.angle) * speed + ship.vy * 0.3,
        life: 60
    });
}

function createExplosion(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            color: color || '#fff'
        });
    }
}

function hitAsteroid(index) {
    const a = asteroids[index];
    createExplosion(a.x, a.y, a.size * 8 + 5, '#aaa');
    score += (4 - a.size) * 20;

    if (a.size > 0) {
        for (let i = 0; i < 2; i++) {
            let x, y;
            do {
                x = a.x + (Math.random() - 0.5) * 20;
                y = a.y + (Math.random() - 0.5) * 20;
            } while (dist({ x, y }, ship) < 80);
            const speed = (1 + Math.random() * 2) * (4 - a.size) * 0.5;
            const angle = Math.random() * Math.PI * 2;
            const radius = 15 + a.size * 10;
            const verts = 7 + Math.floor(Math.random() * 5);
            asteroids.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius,
                size: a.size - 1,
                verts,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.04,
                points: randomPolygon(0, 0, radius, verts)
            });
        }
    }
    asteroids.splice(index, 1);
}

function shipHit() {
    createExplosion(ship.x, ship.y, 30, '#0ff');
    lives--;
    if (lives <= 0) {
        gameState = 'gameover';
    } else {
        ship.x = canvas.width / 2;
        ship.y = canvas.height / 2;
        ship.vx = 0;
        ship.vy = 0;
        ship.angle = -Math.PI / 2;
        invulTimer = 180;
    }
}

function update() {
    if (gameState === 'gameover') {
        if (keys['Enter'] || keys['Space']) {
            initGame();
        }
        return;
    }

    if (invulTimer > 0) invulTimer--;

    // Ship rotation
    if (keys['ArrowLeft']) ship.angle -= 0.06;
    if (keys['ArrowRight']) ship.angle += 0.06;

    // Thrust
    ship.thrust = keys['ArrowUp'];
    if (ship.thrust) {
        ship.vx += Math.cos(ship.angle) * 0.15;
        ship.vy += Math.sin(ship.angle) * 0.15;
        ship.thrustFlicker++;
        if (ship.thrustFlicker % 3 === 0) {
            const backAngle = ship.angle + Math.PI + (Math.random() - 0.5) * 0.5;
            particles.push({
                x: ship.x - Math.cos(ship.angle) * 18,
                y: ship.y - Math.sin(ship.angle) * 18,
                vx: Math.cos(backAngle) * (1 + Math.random()) + ship.vx * 0.5,
                vy: Math.sin(backAngle) * (1 + Math.random()) + ship.vy * 0.5,
                life: 15 + Math.random() * 10,
                maxLife: 25,
                color: '#f80'
            });
        }
    }

    // Friction
    ship.vx *= 0.995;
    ship.vy *= 0.995;

    // Speed cap
    const spd = Math.sqrt(ship.vx ** 2 + ship.vy ** 2);
    if (spd > 7) {
        ship.vx = (ship.vx / spd) * 7;
        ship.vy = (ship.vy / spd) * 7;
    }

    ship.x += ship.vx;
    ship.y += ship.vy;
    wrap(ship);

    // Shooting
    if (keys['Space']) {
        if (!ship.cooldown) {
            shoot();
            ship.cooldown = 10;
        }
    }
    if (ship.cooldown > 0) ship.cooldown--;

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        wrap(b);
        if (b.life <= 0) {
            bullets.splice(i, 1);
            continue;
        }
        // Bullet-asteroid collision
        for (let j = asteroids.length - 1; j >= 0; j--) {
            if (dist(b, asteroids[j]) < asteroids[j].radius) {
                hitAsteroid(j);
                bullets.splice(i, 1);
                break;
            }
        }
    }

    // Asteroids
    for (const a of asteroids) {
        a.x += a.vx;
        a.y += a.vy;
        a.rotation += a.rotSpeed;
        wrap(a);
    }

    // Ship-asteroid collision
    if (invulTimer <= 0) {
        for (const a of asteroids) {
            if (dist(ship, a) < ship.radius + a.radius * 0.8) {
                shipHit();
                break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Respawn asteroids
    if (asteroids.length === 0) {
        spawnAsteroids(4 + Math.floor(score / 500));
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars
    ctx.fillStyle = '#333';
    for (let i = 0; i < 100; i++) {
        const sx = ((i * 7919 + 13) % canvas.width);
        const sy = ((i * 6271 + 37) % canvas.height);
        ctx.fillRect(sx, sy, 1, 1);
    }

    // Particles
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Asteroids
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotation);
        ctx.beginPath();
        ctx.moveTo(a.points[0].x, a.points[0].y);
        for (let i = 1; i < a.points.length; i++) {
            ctx.lineTo(a.points[i].x, a.points[i].y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }

    // Bullets
    ctx.fillStyle = '#fff';
    for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Ship
    if (gameState === 'playing' || gameState === 'respawn') {
        if (invulTimer > 0 && Math.floor(invulTimer / 4) % 2 === 0) {
            // blink
        } else {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);

            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(20, 0);
            ctx.lineTo(-14, -10);
            ctx.lineTo(-8, 0);
            ctx.lineTo(-14, 10);
            ctx.closePath();
            ctx.stroke();

            // Thrust flame
            if (ship.thrust) {
                ctx.strokeStyle = '#f80';
                ctx.lineWidth = 2;
                const flicker = Math.sin(ship.thrustFlicker * 0.8) * 5;
                ctx.beginPath();
                ctx.moveTo(-8, -4);
                ctx.lineTo(-20 - flicker, 0);
                ctx.lineTo(-8, 4);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE: ' + score, 20, 35);

    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.save();
        ctx.translate(25 + i * 25, 65);
        ctx.rotate(-Math.PI / 2);
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-7, -5);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-7, 5);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
    }

    // Game over
    if (gameState === 'gameover') {
        ctx.fillStyle = '#fff';
        ctx.font = '48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px monospace';
        ctx.fillText('Press ENTER or SPACE to restart', canvas.width / 2, canvas.height / 2 + 30);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
