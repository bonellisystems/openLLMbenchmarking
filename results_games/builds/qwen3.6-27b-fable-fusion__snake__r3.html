<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #0f0;
    overflow: hidden;
}
#game-container {
    text-align: center;
}
#score {
    font-size: 24px;
    margin-bottom: 10px;
    letter-spacing: 2px;
}
canvas {
    border: 2px solid #0f0;
    background: #000;
    display: block;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
}
#message {
    font-size: 18px;
    margin-top: 10px;
    min-height: 24px;
}
</style>
</head>
<body>
<div id="game-container">
    <div id="score">SCORE: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="message">Press any arrow key to start</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score');
const messageDisplay = document.getElementById('message');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [];
let food = { x: 0, y: 0 };
let dx = 0;
let dy = 0;
let nextDx = 0;
let nextDy = 0;
let score = 0;
let gameRunning = false;
let gameSpeed = 100;
let lastTime = 0;
let accumulator = 0;

function initGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    dx = 1;
    dy = 0;
    nextDx = 1;
    nextDy = 0;
    score = 0;
    gameRunning = false;
    gameSpeed = 100;
    scoreDisplay.textContent = 'SCORE: 0';
    messageDisplay.textContent = 'Press any arrow key to start';
    placeFood();
    draw();
}

function placeFood() {
    let valid = false;
    while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = true;
        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                valid = false;
                break;
            }
        }
    }
}

function update() {
    dx = nextDx;
    dy = nextDy;

    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
    }

    for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.textContent = 'SCORE: ' + score;
        placeFood();
        if (gameSpeed > 50) {
            gameSpeed -= 2;
        }
    } else {
        snake.pop();
    }
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        if (i === 0) {
            ctx.fillStyle = '#0f0';
        } else {
            const shade = Math.max(100, 255 - i * 5);
            ctx.fillStyle = 'rgb(0, ' + shade + ', 0)';
        }
        ctx.fillRect(
            segment.x * gridSize + 1,
            segment.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
        );
    }

    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function gameOver() {
    gameRunning = false;
    messageDisplay.textContent = 'GAME OVER! Press any arrow key to restart';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f00';
    ctx.font = '36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#0f0';
    ctx.font = '20px Courier New';
    ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 25);
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime;
    lastTime = timestamp;

    if (gameRunning) {
        accumulator += delta;
        while (accumulator >= gameSpeed) {
            update();
            accumulator -= gameSpeed;
            if (!gameRunning) break;
        }
    }

    draw();
    requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', function(e) {
    const key = e.key;

    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
        e.preventDefault();
    }

    if (!gameRunning && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
        if (snake.length === 0 || messageDisplay.textContent.includes('GAME OVER')) {
            initGame();
        }
        gameRunning = true;
        messageDisplay.textContent = '';
    }

    if (!gameRunning) return;

    switch (key) {
        case 'ArrowUp':
            if (dy !== 1) { nextDx = 0; nextDy = -1; }
            break;
        case 'ArrowDown':
            if (dy !== -1) { nextDx = 0; nextDy = 1; }
            break;
        case 'ArrowLeft':
            if (dx !== 1) { nextDx = -1; nextDy = 0; }
            break;
        case 'ArrowRight':
            if (dx !== -1) { nextDx = 1; nextDy = 0; }
            break;
    }
});

initGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
