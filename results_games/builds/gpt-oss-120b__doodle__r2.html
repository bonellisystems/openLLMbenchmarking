<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Jump Clone</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#111;color:#fff;font-family:sans-serif;}
canvas{display:block;background:#222;}
#score{position:absolute;top:10px;left:10px;font-size:24px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">0</div>
<script>
(() => {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreDiv = document.getElementById('score');
    const W = () => canvas.width = window.innerWidth;
    const H = () => canvas.height = window.innerHeight;
    W(); H();
    window.addEventListener('resize',()=>{W();H();});
    
    const GRAVITY = 0.4;
    const JUMP_SPEED = -10;
    const PLAYER_W = 40;
    const PLAYER_H = 40;
    const PLAYER_SPEED = 5;
    const PLAT_W = 80;
    const PLAT_H = 12;
    const PLAT_GAP_MIN = 80;
    const PLAT_GAP_MAX = 120;
    
    let keys = {left:false,right:false};
    window.addEventListener('keydown',e=>{
        if(e.code==='ArrowLeft'||e.key==='a') keys.left=true;
        if(e.code==='ArrowRight'||e.key==='d') keys.right=true;
        if(e.code==='Space' && gameOver) restart();
    });
    window.addEventListener('keyup',e=>{
        if(e.code==='ArrowLeft'||e.key==='a') keys.left=false;
        if(e.code==='ArrowRight'||e.key==='d') keys.right=false;
    });
    
    let player, platforms, offsetY, maxHeight, gameOver;
    
    function init(){
        player = {x:canvas.width/2-PLAYER_W/2, y:canvas.height-PLAYER_H-10, vy:0, w:PLAYER_W, h:PLAYER_H};
        platforms = [];
        offsetY = 0;
        maxHeight = 0;
        gameOver = false;
        // base platform
        platforms.push({x:player.x-10, y:player.y+PLAYER_H, w:PLAT_W, h:PLAT_H});
        // generate initial platforms upward
        let y = canvas.height - 150;
        while(y > -canvas.height){
            addPlatform(y);
            y -= randomBetween(PLAT_GAP_MIN, PLAT_GAP_MAX);
        }
    }
    
    function restart(){
        init();
    }
    
    function randomBetween(min,max){
        return Math.random()*(max-min)+min;
    }
    
    function addPlatform(y){
        const x = randomBetween(0, canvas.width-PLAT_W);
        platforms.push({x, y, w:PLAT_W, h:PLAT_H});
    }
    
    function update(){
        if(gameOver) return;
        // horizontal movement
        if(keys.left) player.x -= PLAYER_SPEED;
        if(keys.right) player.x += PLAYER_SPEED;
        // wrap
        if(player.x < -PLAYER_W) player.x = canvas.width;
        if(player.x > canvas.width) player.x = -PLAYER_W;
        // gravity
        player.vy += GRAVITY;
        player.y += player.vy;
        // collision with platforms (only when falling)
        if(player.vy > 0){
            for(let p of platforms){
                if(
                    player.x + player.w > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.h > p.y &&
                    player.y + player.h - player.vy <= p.y
                ){
                    player.vy = JUMP_SPEED;
                    break;
                }
            }
        }
        // scroll up when player passes middle
        if(player.y < canvas.height/2){
            const diff = canvas.height/2 - player.y;
            player.y = canvas.height/2;
            offsetY += diff;
            for(let p of platforms){
                p.y += diff;
            }
        }
        // generate new platforms above view
        while(platforms.length && platforms[platforms.length-1].y > -PLAT_H){
            const lastY = platforms[platforms.length-1].y;
            addPlatform(lastY - randomBetween(PLAT_GAP_MIN, PLAT_GAP_MAX));
        }
        // remove platforms below view
        platforms = platforms.filter(p=>p.y < canvas.height + PLAT_H);
        // update max height
        if(-offsetY > maxHeight) maxHeight = -offsetY;
        scoreDiv.textContent = Math.floor(maxHeight);
        // game over if falls below screen
        if(player.y - offsetY > canvas.height){
            gameOver = true;
        }
    }
    
    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // draw platforms
        ctx.fillStyle = '#0f0';
        for(let p of platforms){
            ctx.fillRect(p.x, p.y, p.w, p.h);
        }
        // draw player
        ctx.fillStyle = '#ff0';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        // game over overlay
        if(gameOver){
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width/2, canvas.height/2);
            ctx.font = '24px sans-serif';
            ctx.fillText('Press Space to Restart', canvas.width/2, canvas.height/2+40);
        }
    }
    
    function loop(){
        update();
        draw();
        requestAnimationFrame(loop);
    }
    
    init();
    loop();
})();
</script>
</body>
</html>
