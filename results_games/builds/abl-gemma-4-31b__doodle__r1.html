<!DOCTYPE html>
<html>
<head>
    <title>Doodle Jump Clone</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #e0f7fa; box-shadow: 0 0 20px rgba(0,0,0,0.2); display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        #score { font-size: 30px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="ui"><div id="score">Score: 0</div></div>
    <canvas id="game"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let gameActive = true;
        const gravity = 0.25;
        const jumpStrength = -8;
        const platformWidth = 60;
        const platformHeight = 15;

        const player = {
            x: 200, y: 300, w: 30, h: 30,
            vx: 0, vy: 0,
            color: '#ffeb3b'
        };

        let platforms = [];
        const keys = {};

        function createPlatform(y) {
            return {
                x: Math.random() * (canvas.width - platformWidth),
                y: y,
                w: platformWidth,
                h: platformHeight
            };
        }

        function init() {
            platforms = [];
            for (let i = 0; i < 7; i++) {
                platforms.push(createPlatform(i * 100));
            }
            // Ensure first platform is under player
            platforms[0].x = 170;
            platforms[0].y = 500;
        }

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (!gameActive) return;

            if (keys['ArrowLeft']) player.vx = -5;
            else if (keys['ArrowRight']) player.vx = 5;
            else player.vx = 0;

            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Screen wrap
            if (player.x > canvas.width) player.x = -player.w;
            if (player.x < -player.w) player.x = canvas.width;

            // Collision
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.w > p.x && player.x < p.x + p.w &&
                        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 15) {
                        player.vy = jumpStrength;
                    }
                });
            }

            // Camera scroll
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                platforms.forEach(p => {
                    p.y += diff;
                });
                score += Math.floor(diff);
                scoreEl.innerText = `Score: ${score}`;
            }

            // Procedural generation
            while (platforms[platforms.length - 1].y < 0) {
                platforms.shift();
                platforms.push(createPlatform(platforms[platforms.length - 1].y - 100));
            }

            // Game over
            if (player.y > canvas.height) {
                gameActive = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw platforms
            ctx.fillStyle = '#4caf50';
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#388e3c';
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            // Draw player
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x + player.w/2, player.y + player.h/2, player.w/2, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = '#fbc02d';
            ctx.lineWidth = 3;
            ctx.stroke();

            if (!gameActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                ctx.font = '20px sans-serif';
                ctx.fillText('Refresh to Restart', canvas.width/2, canvas.height/2 + 40);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
