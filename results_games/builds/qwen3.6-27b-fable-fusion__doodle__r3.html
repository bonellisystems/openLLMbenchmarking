<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #2c3e50;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
canvas {
border: 3px solid #34495e;
border-radius: 8px;
box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 400;
canvas.height = 600;

const GRAVITY = 0.4;
const JUMP_FORCE = -10;
const MOVE_SPEED = 5;
const PLATFORM_WIDTH = 70;
const PLATFORM_HEIGHT = 15;
const PLATFORM_GAP_MIN = 60;
const PLATFORM_GAP_MAX = 110;
const NUM_PLATFORMS = 10;

let player = {
x: canvas.width / 2 - 20,
y: canvas.height - 150,
width: 40,
height: 40,
vx: 0,
vy: 0,
facing: 1
};

let platforms = [];
let score = 0;
let highScore = 0;
let gameOver = false;
let cameraY = 0;
let keys = {};

function initPlatforms() {
platforms = [];
platforms.push({ x: canvas.width / 2 - PLATFORM_WIDTH / 2, y: canvas.height - 50, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT, type: 'normal' });

let y = canvas.height - 50;
for (let i = 1; i < NUM_PLATFORMS; i++) {
y -= PLATFORM_GAP_MIN + Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
let x = Math.random() * (canvas.width - PLATFORM_WIDTH);
let type = 'normal';
let rand = Math.random();
if (rand < 0.08) type = 'moving';
else if (rand < 0.12) type = 'breakable';
platforms.push({ x, y, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT, type, vx: type === 'moving' ? (Math.random() < 0.5 ? -2 : 2) : 0 });
}
}

function generatePlatform(y) {
let x = Math.random() * (canvas.width - PLATFORM_WIDTH);
let type = 'normal';
let rand = Math.random();
if (rand < 0.08) type = 'moving';
else if (rand < 0.12) type = 'breakable';
platforms.push({ x, y, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT, type, vx: type === 'moving' ? (Math.random() < 0.5 ? -2 : 2) : 0 });
}

function update() {
if (gameOver) {
if (keys[' '] || keys['Enter']) {
resetGame();
}
return;
}

if (keys['ArrowLeft'] || keys['a']) {
player.vx = -MOVE_SPEED;
player.facing = -1;
} else if (keys['ArrowRight'] || keys['d']) {
player.vx = MOVE_SPEED;
player.facing = 1;
} else {
player.vx *= 0.8;
}

player.vy += GRAVITY;
player.x += player.vx;
player.y += player.vy;

if (player.x < -player.width) player.x = canvas.width;
if (player.x > canvas.width) player.x = -player.width;

let scroll = false;
if (player.y < canvas.height * 0.4) {
let diff = canvas.height * 0.4 - player.y;
player.y = canvas.height * 0.4;
scroll = true;
cameraY += diff;
score += Math.floor(diff);
}

if (scroll) {
platforms.forEach(p => p.y += diff);
platforms = platforms.filter(p => p.y < canvas.height + 50);

while (platforms.length < NUM_PLATFORMS) {
let highestY = Math.min(...platforms.map(p => p.y));
let newY = highestY - PLATFORM_GAP_MIN - Math.random() * (PLATFORM_GAP_MAX - PLATFORM_GAP_MIN);
generatePlatform(newY);
}
}

platforms.forEach(p => {
if (p.type === 'moving') {
p.x += p.vx;
if (p.x <= 0 || p.x + p.width >= canvas.width) p.vx *= -1;
}
});

platforms.forEach((p, i) => {
if (player.vy > 0 &&
player.x + player.width > p.x &&
player.x < p.x + p.width &&
player.y + player.height > p.y &&
player.y + player.height < p.y + p.height + player.vy + 2) {
if (p.type === 'breakable') {
platforms.splice(i, 1);
} else {
player.vy = JUMP_FORCE;
}
}
});

if (player.y > canvas.height + 50) {
gameOver = true;
if (score > highScore) highScore = score;
}
}

function drawDoodler(x, y) {
ctx.save();
ctx.translate(x + player.width / 2, y + player.height / 2);
ctx.scale(player.facing, 1);

ctx.fillStyle = '#7ED321';
ctx.beginPath();
ctx.ellipse(0, -5, 18, 20, 0, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#5DA816';
ctx.beginPath();
ctx.ellipse(0, 5, 14, 10, 0, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FFFFFF';
ctx.beginPath();
ctx.arc(6, -10, 6, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#000000';
ctx.beginPath();
ctx.arc(8, -10, 3, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FFFFFF';
ctx.beginPath();
ctx.arc(-4, -10, 4, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#000000';
ctx.beginPath();
ctx.arc(-3, -10, 2, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#FF6B6B';
ctx.beginPath();
ctx.arc(10, -2, 3, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = '#5DA816';
ctx.fillRect(-12, -25, 6, 10);
ctx.fillRect(6, -25, 6, 10);

ctx.fillStyle = '#7ED321';
ctx.fillRect(-14, -28, 10, 5);
ctx.fillRect(4, -28, 10, 5);

ctx.restore();
}

function drawPlatform(p) {
if (p.type === 'normal') {
ctx.fillStyle = '#4CAF50';
ctx.beginPath();
ctx.roundRect(p.x, p.y, p.width, p.height, 5);
ctx.fill();
ctx.fillStyle = '#66BB6A';
ctx.beginPath();
ctx.roundRect(p.x + 3, p.y + 2, p.width - 6, p.height - 8, 3);
ctx.fill();
} else if (p.type === 'moving') {
ctx.fillStyle = '#2196F3';
ctx.beginPath();
ctx.roundRect(p.x, p.y, p.width, p.height, 5);
ctx.fill();
ctx.fillStyle = '#64B5F6';
ctx.beginPath();
ctx.roundRect(p.x + 3, p.y + 2, p.width - 6, p.height - 8, 3);
ctx.fill();
ctx.fillStyle = '#FFFFFF';
ctx.font = '10px Arial';
ctx.fillText('→', p.x + p.width / 2 - 4, p.y + 11);
} else if (p.type === 'breakable') {
ctx.fillStyle = '#FF9800';
ctx.beginPath();
ctx.roundRect(p.x, p.y, p.width, p.height, 5);
ctx.fill();
ctx.fillStyle = '#FFB74D';
ctx.beginPath();
ctx.roundRect(p.x + 3, p.y + 2, p.width - 6, p.height - 8, 3);
ctx.fill();
ctx.strokeStyle = '#E65100';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(p.x + 10, p.y + 3);
ctx.lineTo(p.x + 20, p.y + 12);
ctx.moveTo(p.x + 30, p.y + 3);
ctx.lineTo(p.x + 40, p.y + 12);
ctx.stroke();
}
}

function drawBackground() {
ctx.fillStyle = '#F5F5DC';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.strokeStyle = '#E0E0C0';
ctx.lineWidth = 1;
for (let i = 0; i < canvas.width; i += 25) {
ctx.beginPath();
ctx.moveTo(i, 0);
ctx.lineTo(i, canvas.height);
ctx.stroke();
}
for (let i = 0; i < canvas.height; i += 25) {
ctx.beginPath();
ctx.moveTo(0, i);
ctx.lineTo(canvas.width, i);
ctx.stroke();
}
}

function draw() {
drawBackground();

platforms.forEach(drawPlatform);

drawDoodler(player.x, player.y);

ctx.fillStyle = '#333333';
ctx.font = 'bold 24px Arial';
ctx.textAlign = 'left';
ctx.fillText('Score: ' + score, 15, 35);

ctx.font = '16px Arial';
ctx.fillText('Best: ' + highScore, 15, 58);

if (gameOver) {
ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
ctx.fillRect(0, 0, canvas.width, canvas.height);

ctx.fillStyle = '#FFFFFF';
ctx.font = 'bold 48px Arial';
ctx.textAlign = 'center';
ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

ctx.font = '24px Arial';
ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 10);

ctx.font = '18px Arial';
ctx.fillStyle = '#AAAAAA';
ctx.fillText('Press SPACE or ENTER to restart', canvas.width / 2, canvas.height / 2 + 50);
}
}

function resetGame() {
player.x = canvas.width / 2 - 20;
player.y = canvas.height - 150;
player.vx = 0;
player.vy = 0;
score = 0;
cameraY = 0;
gameOver = false;
initPlatforms();
}

document.addEventListener('keydown', (e) => {
keys[e.key] = true;
if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
e.preventDefault();
}
});

document.addEventListener('keyup', (e) => {
keys[e.key] = false;
});

function gameLoop() {
update();
draw();
requestAnimationFrame(gameLoop);
}

initPlatforms();
gameLoop();
</script>
</body>
</html>
