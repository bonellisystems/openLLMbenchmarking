<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkanoid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        canvas {
            background: #000;
            display: block;
            border: 4px solid #444;
            border-radius: 4px;
        }
        #ui {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        #overlay h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }
        #overlay p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 25px;
            background: #0ff;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #0ff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="lives">Lives: 3</div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="overlay">
            <h1 id="status-title">ARKANOID</h1>
            <p id="status-msg">Use Left/Right Arrow keys to move</p>
            <button class="btn" id="start-btn">Start Game</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const statusTitle = document.getElementById('status-title');
        const statusMsg = document.getElementById('status-msg');
        const startBtn = document.getElementById('start-btn');

        // Game Constants
        const PADDLE_WIDTH = 100;
        const PADDLE_HEIGHT = 15;
        const BALL_RADIUS = 8;
        const BRICK_ROWS = 6;
        const BRICK_COLS = 10;
        const BRICK_PADDING = 10;
        const BRICK_OFFSET_TOP = 50;
        const BRICK_OFFSET_LEFT = 35;
        const BRICK_WIDTH = 65;
        const BRICK_HEIGHT = 20;

        // Game State
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let paddleX = (canvas.width - PADDLE_WIDTH) / 2;
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 50;
        let ballDX = 4;
        let ballDY = -4;
        let rightPressed = false;
        let leftPressed = false;

        const bricks = [];
        const colors = ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#0000ff', '#8800ff'];

        function initBricks() {
            for (let c = 0; c < BRICK_COLS; c++) {
                bricks[c] = [];
                for (let r = 0; r < BRICK_ROWS; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
            if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
            if (!gameRunning && e.key === ' ') startGame();
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
            if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
        });

        startBtn.addEventListener('click', startGame);

        function startGame() {
            score = 0;
            lives = 3;
            gameRunning = true;
            overlay.classList.add('hidden');
            initBricks();
            resetBall();
            requestAnimationFrame(draw);
        }

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height - 50;
            ballDX = (Math.random() - 0.5) * 6;
            ballDY = -4;
            paddleX = (canvas.width - PADDLE_WIDTH) / 2;
        }

        function collisionDetection() {
            for (let c = 0; c < BRICK_COLS; c++) {
                for (let r = 0; r < BRICK_ROWS; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (ballX > b.x && ballX < b.x + BRICK_WIDTH && ballY > b.y && ballY < b.y + BRICK_HEIGHT) {
                            ballDY = -ballDY;
                            b.status = 0;
                            score += 10;
                            scoreEl.innerText = `Score: ${score}`;
                            if (score === BRICK_ROWS * BRICK_COLS * 10) {
                                endGame(true);
                            }
                        }
                    }
                }
            }
        }

        function endGame(win) {
            gameRunning = false;
            overlay.classList.remove('hidden');
            statusTitle.innerText = win ? "YOU WIN!" : "GAME OVER";
            statusTitle.style.color = win ? "#0f0" : "#f00";
            statusTitle.style.textShadow = win ? "0 0 10px #0f0" : "0 0 10px #f00";
            statusMsg.innerText = `Final Score: ${score}`;
            startBtn.innerText = "Play Again";
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - PADDLE_HEIGHT - 10, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillStyle = "#0ff";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < BRICK_COLS; c++) {
                for (let r = 0; r < BRICK_ROWS; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = (c * (BRICK_WIDTH + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                        let brickY = (r * (BRICK_HEIGHT + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Wall collisions
            if (ballX + ballDX > canvas.width - BALL_RADIUS || ballX + ballDX < BALL_RADIUS) {
                ballDX = -ballDX;
            }
            if (ballY + ballDY < BALL_RADIUS) {
                ballDY = -ballDY;
            } else if (ballY + ballDY > canvas.height - BALL_RADIUS - 10) {
                // Paddle collision
                if (ballX > paddleX && ballX < paddleX + PADDLE_WIDTH) {
                    // Calculate bounce angle based on where it hits the paddle
                    let hitPos = (ballX - (paddleX + PADDLE_WIDTH / 2)) / (PADDLE_WIDTH / 2);
                    ballDX = hitPos * 5;
                    ballDY = -ballDY;
                } else if (ballY + ballDY > canvas.height) {
                    lives--;
                    livesEl.innerText = `Lives: ${lives}`;
                    if (!lives) {
                        endGame(false);
                    } else {
                        resetBall();
                    }
                }
            }

            if (rightPressed && paddleX < canvas.width - PADDLE_WIDTH) {
                paddleX += 7;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 7;
            }

            ballX += ballDX;
            ballY += ballDY;

            requestAnimationFrame(draw);
        }

        // Initial setup
        initBricks();
        // Draw initial state
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawPaddle();
        drawBall();

    </script>
</body>
</html>
