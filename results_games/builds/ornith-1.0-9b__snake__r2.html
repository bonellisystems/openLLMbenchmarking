<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background-color: #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: 'Courier New', Courier, monospace;
        color: #e0e0e0;
        overflow: hidden;
    }
    #header {
        display: flex;
        justify-content: space-between;
        width: 400px;
        margin-bottom: 10px;
        font-size: 1.2rem;
        font-weight: bold;
    }
    #score-val { color: #4caf50; }
    #high-val { color: #ffeb3b; }
    canvas {
        border: 2px solid #333;
        background-color: #0f0f23;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        display: block;
    }
    #overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        display: none;
        z-index: 10;
    }
    #overlay h1 {
        font-size: 3rem;
        color: #ff5252;
        text-shadow: 0 0 10px rgba(255, 82, 82, 0.5);
        margin-bottom: 10px;
    }
    #overlay p { font-size: 1.2rem; margin-bottom: 20px; }
    #overlay button {
        padding: 10px 25px;
        font-size: 1rem;
        font-family: inherit;
        background: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        transition: background 0.2s;
    }
    #overlay button:hover { background: #45a049; }
    #controls-hint {
        margin-top: 15px;
        font-size: 0.8rem;
        color: #666;
    }
</style>
</head>
<body>

<div id="header">
    <span>SCORE: <span id="score-val">0</span></span>
    <span>HIGH: <span id="high-val">0</span></span>
</div>

<div style="position: relative; display: inline-block;">
    <canvas id="gameCanvas" width="400" height="400" tabindex="0"></canvas>
    <div id="overlay">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>

<div id="controls-hint">Use Arrow Keys or WASD to move</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-val');
    const highEl = document.getElementById('high-val');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('final-score');

    const GRID = 20;
    const TILE = canvas.width / GRID;
    let speed = 100; // ms per frame

    let snake, dx, dy, food, score, highScore, gameLoop, running;

    function init() {
        snake = [{x: 10, y: 10}];
        dx = 0;
        dy = 0;
        score = 0;
        running = true;
        scoreEl.innerText = 0;
        overlay.style.display = 'none';
        placeFood();
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, speed);
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            food = {
                x: Math.floor(Math.random() * GRID),
                y: Math.floor(Math.random() * GRID)
            };
            valid = !snake.some(s => s.x === food.x && s.y === food.y);
        }
    }

    function update() {
        if (!running) return;

        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Wall collision
        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
            gameOver();
            return;
        }

        // Self collision
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
            gameOver();
            return;
        }

        snake.unshift(head);

        // Eat food
        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.innerText = score;
            placeFood();
            // Slight speed increase cap
            if (speed > 60) speed -= 1;
            clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // Background
        ctx.fillStyle = '#0f0f23';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Grid lines (subtle)
        ctx.strokeStyle = '#1a1a35';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < GRID; i++) {
            ctx.beginPath();
            ctx.moveTo(i * TILE, 0);
            ctx.lineTo(i * TILE, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * TILE);
            ctx.lineTo(canvas.width, i * TILE);
            ctx.stroke();
        }

        // Food
        ctx.fillStyle = '#ff5252';
        ctx.shadowColor = '#ff5252';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(food.x * TILE + TILE/2, food.y * TILE + TILE/2, TILE/2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Snake
        snake.forEach((seg, index) => {
            const isHead = index === 0;
            ctx.fillStyle = isHead ? '#4caf50' : '#388e3c';
            if (isHead) {
                ctx.shadowColor = '#4caf50';
                ctx.shadowBlur = 5;
            }
            ctx.fillRect(seg.x * TILE + 1, seg.y * TILE + 1, TILE - 2, TILE - 2);
            ctx.shadowBlur = 0;
        });
    }

    function gameOver() {
        running = false;
        clearInterval(gameLoop);
        if (score > highScore) {
            highScore = score;
            highEl.innerText = highScore;
        }
        finalScoreEl.innerText = score;
        overlay.style.display = 'block';
    }

    function resetGame() {
        speed = 100;
        init();
    }

    // Input Handling
    document.addEventListener('keydown', (e) => {
        // Prevent scrolling with arrow keys
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }

        // Restart on Enter if game over
        if (!running && e.code === 'Enter') {
            resetGame();
            return;
        }

        // Direction changes
        const last = snake[0];
        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingLeft = dx === -1;
        const goingRight = dx === 1;

        switch(e.key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                if (!goingDown) { dx = 0; dy = -1; }
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                if (!goingUp) { dx = 0; dy = 1; }
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                if (!goingRight) { dx = -1; dy = 0; }
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                if (!goingLeft) { dx = 1; dy = 0; }
                break;
        }
    });

    // Initial Draw
    init();
    draw();
</script>
</body>
</html>
