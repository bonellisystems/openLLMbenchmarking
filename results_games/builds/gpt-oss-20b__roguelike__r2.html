<html>
<head>
<meta charset="utf-8">
<title>Mini Roguelike</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;overflow:hidden;}
pre{margin:0;padding:0;}
</style>
</head>
<body tabindex="0" onload="init()">
<pre id="screen"></pre>
<script>
const WIDTH=40, HEIGHT=20;
const WALL='#', FLOOR='.', PLAYER='@', MONSTER='M';
let dungeon=Array.from({length:HEIGHT},()=>Array(WIDTH).fill(WALL));
let player={x:Math.floor(WIDTH/2),y:Math.floor(HEIGHT/2)};
let monsters=[];
function carveRandomWalk() {
  let x=player.x, y=player.y;
  dungeon[y][x]=FLOOR;
  for(let i=0;i<2000;i++){
    let dir=Math.floor(Math.random()*4);
    if(dir===0&&x>0)x--; // left
    else if(dir===1&&x<WIDTH-1)x++; // right
    else if(dir===2&&y>0)y--; // up
    else if(dir===3&&y<HEIGHT-1)y++; // down
    dungeon[y][x]=FLOOR;
  }
}
function spawnMonsters(n){
  let count=0;
  while(count<n){
    let x=Math.floor(Math.random()*WIDTH);
    let y=Math.floor(Math.random()*HEIGHT);
    if(dungeon[y][x]===FLOOR && !(x===player.x&&y===player.y)){
      monsters.push({x,y});
      count++;
    }
  }
}
function render(){
  let lines=[];
  for(let y=0;y<HEIGHT;y++){
    let line='';
    for(let x=0;x<WIDTH;x++){
      if(x===player.x&&y===player.y)line+=PLAYER;
      else if(monsters.some(m=>m.x===x&&m.y===y))line+=MONSTER;
      else line+=dungeon[y][x];
    }
    lines.push(line);
  }
  document.getElementById('screen').innerText=lines.join('\n');
}
function movePlayer(dx,dy){
  let nx=player.x+dx, ny=player.y+dy;
  if(nx<0||nx>=WIDTH||ny<0||ny>=HEIGHT)return;
  if(dungeon[ny][nx]!==FLOOR)return;
  let m=monsters.find(m=>m.x===nx&&m.y===ny);
  if(m){ // kill monster
    monsters=monsters.filter(m=>m!==m);
  }
  player.x=nx; player.y=ny;
}
function moveMonsters(){
  for(let m of monsters){
    let dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    let moved=false;
    for(let i=0;i<4;i++){
      let d=dirs[Math.floor(Math.random()*4)];
      let nx=m.x+d[0], ny=m.y+d[1];
      if(nx<0||nx>=WIDTH||ny<0||ny>=HEIGHT)continue;
      if(dungeon[ny][nx]!==FLOOR)continue;
      if(nx===player.x&&ny===player.y)continue;
      if(monsters.some(o=>o.x===nx&&o.y===ny))continue;
      m.x=nx; m.y=ny; moved=true; break;
    }
    if(!moved){
      // stay
    }
  }
}
function handleKey(e){
  let dx=0,dy=0;
  switch(e.key){
    case 'ArrowLeft':case 'a':case 'A':dx=-1;break;
    case 'ArrowRight':case 'd':case 'D':dx=1;break;
    case 'ArrowUp':case 'w':case 'W':dy=-1;break;
    case 'ArrowDown':case 's':case 'S':dy=1;break;
    default:return;
  }
  movePlayer(dx,dy);
  moveMonsters();
  render();
  e.preventDefault();
}
function init(){
  carveRandomWalk();
  spawnMonsters(10);
  render();
  document.addEventListener('keydown',handleKey);
  document.body.focus();
}
</script>
</body>
</html>
