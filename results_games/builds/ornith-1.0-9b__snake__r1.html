<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
    body {
        background-color: #1a1a1a;
        color: #eee;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }
    #game-container {
        position: relative;
        border: 2px solid #555;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
    }
    canvas {
        display: block;
        background-color: #000;
    }
    #score-board {
        width: 400px;
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: bold;
    }
    #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        display: none;
    }
    #overlay h1 {
        font-size: 40px;
        color: #ff4444;
        margin: 0 0 10px 0;
    }
    #overlay p {
        font-size: 16px;
        color: #aaa;
    }
    #final-score {
        font-size: 24px;
        color: #fff;
        margin-bottom: 20px;
    }
</style>
</head>
<body>

<div id="score-board">
    <span>SCORE: <span id="score">0</span></span>
    <span>HIGH: <span id="high-score">0</span></span>
</div>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay">
        <h1>GAME OVER</h1>
        <div id="final-score">Score: 0</div>
        <p>Press any Arrow Key to Restart</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('final-score');

    const TILE_COUNT = 20;
    const TILE_SIZE = canvas.width / TILE_COUNT;
    const SPEED = 1000 / 15; // Initial speed in ms

    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    highScoreEl.textContent = highScore;

    let velocity = { x: 0, y: 0 };
    let snake = [];
    let food = { x: 15, y: 15 };
    let gameRunning = false;
    let gameLoop = null;
    let changingDirection = false;

    // Initialize
    function init() {
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        velocity = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = score;
        placeFood();
        overlay.style.display = 'none';
        gameRunning = true;
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, SPEED);
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);
            valid = true;
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    valid = false;
                    break;
                }
            }
        }
    }

    function update() {
        if (!gameRunning) return;

        const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

        // Wall Collision
        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
            gameOver();
            return;
        }

        // Self Collision
        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        // Eat Food
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            placeFood();
            // Speed up slightly every 50 points
            if (score % 50 === 0 && SPEED > 50) {
                clearInterval(gameLoop);
                gameLoop = setInterval(update, SPEED - 5);
            }
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // Clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid (Subtle)
        ctx.strokeStyle = '#111';
        for (let i = 0; i < TILE_COUNT; i++) {
            ctx.beginPath();
            ctx.moveTo(i * TILE_SIZE, 0);
            ctx.lineTo(i * TILE_SIZE, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * TILE_SIZE);
            ctx.lineTo(canvas.width, i * TILE_SIZE);
            ctx.stroke();
        }

        // Draw Food
        ctx.fillStyle = '#ff4444';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0000';
        ctx.fillRect(food.x * TILE_SIZE + 1, food.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        ctx.shadowBlur = 0;

        // Draw Snake
        snake.forEach((part, index) => {
            if (index === 0) {
                ctx.fillStyle = '#44ff44';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#00ff00';
            } else {
                // Gradient effect for tail
                const ratio = index / snake.length;
                ctx.fillStyle = `rgb(${100 + ratio * 55}, ${255 - ratio * 100}, ${100 + ratio * 55})`;
                ctx.shadowBlur = 0;
            }
            ctx.fillRect(part.x * TILE_SIZE + 1, part.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        });
        ctx.shadowBlur = 0;
    }

    function gameOver() {
        gameRunning = false;
        clearInterval(gameLoop);
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.textContent = highScore;
        }
        finalScoreEl.textContent = 'Score: ' + score;
        overlay.style.display = 'flex';
    }

    // Input Handling
    document.addEventListener('keydown', (e) => {
        // Prevent scrolling with arrow keys
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }

        // Restart on any arrow key if game over
        if (!gameRunning && overlay.style.display === 'flex') {
            init();
            return;
        }

        if (changingDirection) return;
        changingDirection = true;

        const key = e.key;

        switch (key) {
            case 'ArrowUp':
            case 'w':
            case 'W':
                if (velocity.y !== 1) velocity = { x: 0, y: -1 };
                break;
            case 'ArrowDown':
            case 's':
            case 'S':
                if (velocity.y !== -1) velocity = { x: 0, y: 1 };
                break;
            case 'ArrowLeft':
            case 'a':
            case 'A':
                if (velocity.x !== 1) velocity = { x: -1, y: 0 };
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                if (velocity.x !== -1) velocity = { x: 1, y: 0 };
                break;
        }
    });

    // Initial Draw
    init();
    draw();
</script>
</body>
</html>
