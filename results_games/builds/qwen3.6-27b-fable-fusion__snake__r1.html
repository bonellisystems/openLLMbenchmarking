<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #eee;
}
#game-container {
    text-align: center;
}
#score {
    font-size: 24px;
    margin-bottom: 10px;
    color: #0f0;
    text-shadow: 0 0 10px #0f0;
}
canvas {
    border: 3px solid #0f0;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    background: #0a0a15;
    display: block;
    margin: 0 auto;
}
#message {
    font-size: 18px;
    margin-top: 10px;
    color: #ff0;
    min-height: 24px;
}
</style>
</head>
<body>
<div id="game-container">
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="message">Press any arrow key to start</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score');
const messageDisplay = document.getElementById('message');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [];
let food = { x: 0, y: 0 };
let dx = 0;
let dy = 0;
let nextDx = 0;
let nextDy = 0;
let score = 0;
let gameRunning = false;
let gameLoop = null;
const gameSpeed = 100;

function initGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    dx = 1;
    dy = 0;
    nextDx = 1;
    nextDy = 0;
    score = 0;
    scoreDisplay.textContent = 'Score: 0';
    placeFood();
    gameRunning = false;
    messageDisplay.textContent = 'Press any arrow key to start';
    draw();
}

function placeFood() {
    let valid = false;
    while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = true;
        for (let segment of snake) {
            if (segment.x === food.x && segment.y === food.y) {
                valid = false;
                break;
            }
        }
    }
}

function update() {
    dx = nextDx;
    dy = nextDy;

    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
    }

    for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.textContent = 'Score: ' + score;
        placeFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {
    ctx.fillStyle = '#0a0a15';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < tileCount; i++) {
        for (let j = 0; j < tileCount; j++) {
            if ((i + j) % 2 === 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                ctx.fillRect(i * gridSize, j * gridSize, gridSize, gridSize);
            }
        }
    }

    for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        const brightness = Math.max(0.4, 1 - (i / snake.length) * 0.6);
        ctx.fillStyle = `rgb(0, ${Math.floor(255 * brightness)}, 0)`;
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);

        if (i === 0) {
            ctx.fillStyle = '#fff';
            const eyeSize = 3;
            if (dx === 1) {
                ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, eyeSize, eyeSize);
                ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
            } else if (dx === -1) {
                ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, eyeSize, eyeSize);
                ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 12, eyeSize, eyeSize);
            } else if (dy === -1) {
                ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, eyeSize, eyeSize);
                ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, eyeSize, eyeSize);
            } else {
                ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 12, eyeSize, eyeSize);
                ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
            }
        }
    }

    ctx.fillStyle = '#f00';
    ctx.shadowColor = '#f00';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;
}

function gameOver() {
    gameRunning = false;
    clearInterval(gameLoop);
    messageDisplay.textContent = 'Game Over! Press any arrow key to restart';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f00';
    ctx.font = '36px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '18px Courier New';
    ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 25);
}

function startGame() {
    if (!gameRunning) {
        gameRunning = true;
        messageDisplay.textContent = '';
        gameLoop = setInterval(update, gameSpeed);
    }
}

document.addEventListener('keydown', function(e) {
    const key = e.key;

    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
        e.preventDefault();
    }

    if (!gameRunning && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
        if (snake.length === 0 || snake[0].x === 10 && snake[0].y === 10 && score === 0 && !gameLoop) {
            initGame();
        }
        startGame();
    }

    if (key === 'ArrowUp' && dy !== 1) {
        nextDx = 0;
        nextDy = -1;
    } else if (key === 'ArrowDown' && dy !== -1) {
        nextDx = 0;
        nextDy = 1;
    } else if (key === 'ArrowLeft' && dx !== 1) {
        nextDx = -1;
        nextDy = 0;
    } else if (key === 'ArrowRight' && dx !== -1) {
        nextDx = 1;
        nextDy = 0;
    }
});

initGame();
</script>
</body>
</html>
