<!DOCTYPE html>
<html>
<head>
    <title>Tiny Roguelike</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; margin: 0; padding: 20px; }
        #game { display: grid; grid-template-columns: repeat(40, 20px); gap: 1px; }
        .cell { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .wall { background: #333; }
        .floor { background: #111; }
        .player { color: #0ff; }
        .monster { color: #f00; }
        .item { color: #ff0; }
        #status { margin-top: 10px; }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="status">Use arrow keys to move</div>
    <script>
        const WIDTH = 40;
        const HEIGHT = 30;
        const TILE = { WALL: '#', FLOOR: '.', PLAYER: '@', MONSTER: 'g', ITEM: '$' };
        
        let player = { x: 0, y: 0, health: 100 };
        let monsters = [];
        let items = [];
        let dungeon = [];
        
        function generateDungeon() {
            dungeon = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(TILE.WALL));
            
            // Create rooms
            for (let i = 0; i < 15; i++) {
                const w = Math.floor(Math.random() * 8) + 4;
                const h = Math.floor(Math.random() * 6) + 3;
                const x = Math.floor(Math.random() * (WIDTH - w - 2)) + 1;
                const y = Math.floor(Math.random() * (HEIGHT - h - 2)) + 1;
                
                for (let dy = 0; dy < h; dy++) {
                    for (let dx = 0; dx < w; dx++) {
                        dungeon[y + dy][x + dx] = TILE.FLOOR;
                    }
                }
            }
            
            // Connect rooms with corridors
            for (let y = 1; y < HEIGHT - 1; y++) {
                for (let x = 1; x < WIDTH - 1; x++) {
                    if (dungeon[y][x] === TILE.WALL) {
                        if (dungeon[y-1][x] === TILE.FLOOR || dungeon[y+1][x] === TILE.FLOOR ||
                            dungeon[y][x-1] === TILE.FLOOR || dungeon[y][x+1] === TILE.FLOOR) {
                            if (Math.random() > 0.3) dungeon[y][x] = TILE.FLOOR;
                        }
                    }
                }
            }
            
            // Place player
            do {
                player.x = Math.floor(Math.random() * WIDTH);
                player.y = Math.floor(Math.random() * HEIGHT);
            } while (dungeon[player.y][player.x] !== TILE.FLOOR);
            
            // Place monsters
            monsters = [];
            for (let i = 0; i < 20; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * WIDTH);
                    y = Math.floor(Math.random() * HEIGHT);
                } while (dungeon[y][x] !== TILE.FLOOR || (x === player.x && y === player.y));
                monsters.push({ x, y, health: 30 });
            }
            
            // Place items
            items = [];
            for (let i = 0; i < 10; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * WIDTH);
                    y = Math.floor(Math.random() * HEIGHT);
                } while (dungeon[y][x] !== TILE.FLOOR || (x === player.x && y === player.y));
                items.push({ x, y });
            }
        }
        
        function render() {
            const game = document.getElementById('game');
            game.innerHTML = '';
            
            for (let y = 0; y < HEIGHT; y++) {
                for (let x = 0; x < WIDTH; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (x === player.x && y === player.y) {
                        cell.classList.add('player');
                        cell.textContent = TILE.PLAYER;
                    } else if (monsters.some(m => m.x === x && m.y === y)) {
                        cell.classList.add('monster');
                        cell.textContent = TILE.MONSTER;
                    } else if (items.some(i => i.x === x && i.y === y)) {
                        cell.classList.add('item');
                        cell.textContent = TILE.ITEM;
                    } else {
                        cell.classList.add(dungeon[y][x] === TILE.WALL ? 'wall' : 'floor');
                        cell.textContent = dungeon[y][x];
                    }
                    
                    game.appendChild(cell);
                }
            }
            
            document.getElementById('status').textContent = 
                `Health: ${player.health} | Monsters: ${monsters.length}`;
        }
        
        function movePlayer(dx, dy) {
            const newX = player.x + dx;
            const newY = player.y + dy;
            
            if (newX < 0 || newX >= WIDTH || newY < 0 || newY >= HEIGHT) return;
            if (dungeon[newY][newX] === TILE.WALL) return;
            
            player.x = newX;
            player.y = newY;
            
            // Check for item pickup
            const itemIndex = items.findIndex(i => i.x === player.x && i.y === player.y);
            if (itemIndex !== -1) {
                items.splice(itemIndex, 1);
                player.health = Math.min(100, player.health + 20);
            }
            
            // Check for monster collision
            const monsterIndex = monsters.findIndex(m => m.x === player.x && m.y === player.y);
            if (monsterIndex !== -1) {
                monsters[monsterIndex].health -= 25;
                player.health -= 10;
                if (monsters[monsterIndex].health <= 0) {
                    monsters.splice(monsterIndex, 1);
                }
            }
            
            moveMonsters();
            render();
        }
        
        function moveMonsters() {
            monsters.forEach(monster => {
                const dx = Math.sign(player.x - monster.x);
                const dy = Math.sign(player.y - monster.y);
                
                const newX = monster.x + (Math.random() > 0.5 ? dx : 0);
                const newY = monster.y + (Math.random() > 0.5 ? dy : 0);
                
                if (newX >= 0 && newX < WIDTH && newY >= 0 && newY < HEIGHT &&
                    dungeon[newY][newX] === TILE.FLOOR &&
                    !monsters.some(m => m !== monster && m.x === newX && m.y === newY)) {
                    monster.x = newX;
                    monster.y = newY;
                }
            });
        }
        
        document.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp': movePlayer(0, -1); break;
                case 'ArrowDown': movePlayer(0, 1); break;
                case 'ArrowLeft': movePlayer(-1, 0); break;
                case 'ArrowRight': movePlayer(1, 0); break;
            }
        });
        
        generateDungeon();
        render();
    </script>
</body>
</html>
