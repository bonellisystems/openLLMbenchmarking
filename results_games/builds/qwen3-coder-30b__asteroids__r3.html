<!DOCTYPE html>
<html>
<head>
    <title>Asteroids</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            color: white;
        }
        canvas {
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 10,
            angle: 0,
            rotation: 0,
            thrusting: false,
            thrust: { x: 0, y: 0 },
            explodeTime: 0
        };
        
        let bullets = [];
        let asteroids = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let keys = {};
        
        // Create initial asteroids
        function createAsteroids(count) {
            asteroids = [];
            for (let i = 0; i < count; i++) {
                let asteroid = {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 30 + Math.random() * 20,
                    velocity: {
                        x: (Math.random() - 0.5) * 2,
                        y: (Math.random() - 0.5) * 2
                    },
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.02,
                    vertices: 8 + Math.floor(Math.random() * 5),
                    offsets: []
                };
                
                // Generate random offsets for asteroid shape
                for (let j = 0; j < asteroid.vertices; j++) {
                    asteroid.offsets.push(0.5 + Math.random() * 0.5);
                }
                
                // Make sure asteroid doesn't spawn on ship
                const dx = asteroid.x - ship.x;
                const dy = asteroid.y - ship.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    asteroid.x = Math.random() * canvas.width;
                    asteroid.y = Math.random() * canvas.height;
                }
                
                asteroids.push(asteroid);
            }
        }
        
        // Initialize game
        function init() {
            ship = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 10,
                angle: 0,
                rotation: 0,
                thrusting: false,
                thrust: { x: 0, y: 0 },
                explodeTime: 0
            };
            bullets = [];
            score = 0;
            lives = 3;
            gameOver = false;
            createAsteroids(5);
        }
        
        // Draw ship
        function drawShip() {
            if (ship.explodeTime > 0) return;
            
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            
            // Ship body
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-10, -8);
            ctx.lineTo(-10, 8);
            ctx.closePath();
            ctx.stroke();
            
            // Thrust
            if (ship.thrusting) {
                ctx.beginPath();
                ctx.moveTo(-10, -4);
                ctx.lineTo(-18, 0);
                ctx.lineTo(-10, 4);
                ctx.closePath();
                ctx.fillStyle = 'orange';
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // Draw bullet
        function drawBullet(bullet) {
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw asteroid
        function drawAsteroid(asteroid) {
            ctx.save();
            ctx.translate(asteroid.x, asteroid.y);
            ctx.rotate(asteroid.rotation);
            
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < asteroid.vertices; i++) {
                const angle = (i / asteroid.vertices) * Math.PI * 2;
                const radius = asteroid.radius * asteroid.offsets[i];
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }
        
        // Draw explosion
        function drawExplosion() {
            if (ship.explodeTime <= 0) return;
            
            const time = ship.explodeTime;
            const radius = 20 + time * 2;
            
            ctx.fillStyle = `rgba(255, ${255 - time * 10}, 0, ${1 - time / 30})`;
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, radius, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw UI
        function drawUI() {
            ctx.fillStyle = 'white';
            ctx.font = '16px monospace';
            ctx.fillText(`Score: ${score}`, 10, 20);
            ctx.fillText(`Lives: ${lives}`, 10, 40);
            
            if (gameOver) {
                ctx.fillStyle = 'white';
                ctx.font = '36px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px monospace';
                ctx.fillText('Press R to restart', canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }
        }
        
        // Update ship
        function updateShip() {
            if (ship.explodeTime > 0) {
                ship.explodeTime--;
                if (ship.explodeTime === 0) {
                    if (lives > 0) {
                        ship.x = canvas.width / 2;
                        ship.y = canvas.height / 2;
                        ship.thrust.x = 0;
                        ship.thrust.y = 0;
                    }
                }
                return;
            }
            
            // Rotation
            if (keys['ArrowLeft']) {
                ship.rotation = -0.08;
            } else if (keys['ArrowRight']) {
                ship.rotation = 0.08;
            } else {
                ship.rotation = 0;
            }
            
            ship.angle += ship.rotation;
            
            // Thrust
            ship.thrusting = keys['ArrowUp'];
            if (ship.thrusting) {
                ship.thrust.x += Math.cos(ship.angle) * 0.1;
                ship.thrust.y += Math.sin(ship.angle) * 0.1;
            }
            
            // Apply thrust
            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;
            
            // Friction
            ship.thrust.x *= 0.98;
            ship.thrust.y *= 0.98;
            
            // Wrap around screen
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;
        }
        
        // Update bullets
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.velocity.x;
                bullet.y += bullet.velocity.y;
                
                // Remove bullets that go off screen
                if (bullet.x < 0 || bullet.x > canvas.width || 
                    bullet.y < 0 || bullet.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }
                
                // Check collision with asteroids
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < asteroid.radius) {
                        // Split asteroid
                        if (asteroid.radius > 10) {
                            for (let k = 0; k < 2; k++) {
                                const newAsteroid = {
                                    x: asteroid.x,
                                    y: asteroid.y,
                                    radius: asteroid.radius / 2,
                                    velocity: {
                                        x: (Math.random() - 0.5) * 4,
                                        y: (Math.random() - 0.5) * 4
                                    },
                                    rotation: Math.random() * Math.PI * 2,
                                    rotationSpeed: (Math.random() - 0.5) * 0.04,
                                    vertices: 8 + Math.floor(Math.random() * 5),
                                    offsets: []
                                };
                                
                                // Generate random offsets
                                for (let l = 0; l < newAsteroid.vertices; l++) {
                                    newAsteroid.offsets.push(0.5 + Math.random() * 0.5);
                                }
                                
                                asteroids.push(newAsteroid);
                            }
                        }
                        
                        // Remove bullet and asteroid
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        score += 100;
                        break;
                    }
                }
            }
        }
        
        // Update asteroids
        function updateAsteroids() {
            for (let i = 0; i < asteroids.length; i++) {
                const asteroid = asteroids[i];
                
                // Move asteroid
                asteroid.x += asteroid.velocity.x;
                asteroid.y += asteroid.velocity.y;
                asteroid.rotation += asteroid.rotationSpeed;
                
                // Wrap around screen
                if (asteroid.x < -asteroid.radius) asteroid.x = canvas.width + asteroid.radius;
                if (asteroid.x > canvas.width + asteroid.radius) asteroid.x = -asteroid.radius;
                if (asteroid.y < -asteroid.radius) asteroid.y = canvas.height + asteroid.radius;
                if (asteroid.y > canvas.height + asteroid.radius) asteroid.y = -asteroid.radius;
                
                // Check collision with ship
                if (ship.explodeTime === 0) {
                    const dx = ship.x - asteroid.x;
                    const dy = ship.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < ship.radius + asteroid.radius) {
                        ship.explodeTime = 30;
                        lives--;
                        if (lives <= 0) {
                            gameOver = true;
                        }
                        break;
                    }
                }
            }
        }
        
        // Fire bullet
        function fireBullet() {
            if (ship.explodeTime > 0) return;
            
            const bullet = {
                x: ship.x + Math.cos(ship.angle) * 15,
                y: ship.y + Math.sin(ship.angle) * 15,
                velocity: {
                    x: Math.cos(ship.angle) * 7 + ship.thrust.x,
                    y: Math.sin(ship.angle) * 7 + ship.thrust.y
                }
            };
            
            bullets.push(bullet);
        }
        
        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (!gameOver) {
                // Update game objects
                updateShip();
                updateBullets();
                updateAsteroids();
                
                // Draw game objects
                asteroids.forEach(drawAsteroid);
                bullets.forEach(drawBullet);
                drawShip();
                drawExplosion();
                drawUI();
            } else {
                drawUI();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && !gameOver) {
                fireBullet();
                e.preventDefault();
            }
            
            if (e.key === 'r' && gameOver) {
                init();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
