<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;}
  canvas{display:block;margin:0 auto;background:#111;}
  #info{margin-top:10px;}
</style>
</head>
<body tabindex="0">
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="info"></div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const info = document.getElementById('info');
  const width = canvas.width, height = canvas.height;

  const paddle = { w: 100, h: 20, x: (width-100)/2, y: height-30, speed: 7, dx: 0 };
  const ball = { r: 10, x: width/2, y: height/2, speed: 4, dx: 4, dy: -4 };
  const brick = { w: 70, h: 20, padding: 10, offsetTop: 50, offsetLeft: 35 };
  const rows = 5, cols = 10;
  let bricks = [];
  let score = 0, lives = 3, gameOver = false, win = false;

  function initBricks() {
    bricks = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = brick.offsetLeft + c * (brick.w + brick.padding);
        const y = brick.offsetTop + r * (brick.h + brick.padding);
        bricks.push({ x, y, w: brick.w, h: brick.h, status: 1 });
      }
    }
  }

  function drawPaddle() {
    ctx.fillStyle = '#0095DD';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#FF5722';
    ctx.fill();
    ctx.closePath();
  }

  function drawBricks() {
    bricks.forEach(b => {
      if (b.status) {
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    });
  }

  function drawInfo() {
    info.textContent = `Score: ${score}  Lives: ${lives}`;
  }

  function collisionDetection() {
    bricks.forEach(b => {
      if (b.status) {
        if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
          ball.dy = -ball.dy;
          b.status = 0;
          score += 10;
          if (score === rows*cols*10) win = true;
        }
      }
    });
  }

  function resetBallPaddle() {
    ball.x = width/2;
    ball.y = height/2;
    ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
    ball.dy = -ball.speed;
    paddle.x = (width - paddle.w)/2;
  }

  function update() {
    if (gameOver || win) return;
    // Move paddle
    paddle.x += paddle.dx;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > width) paddle.x = width - paddle.w;

    // Move ball
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wall collision
    if (ball.x + ball.r > width || ball.x - ball.r < 0) ball.dx = -ball.dx;
    if (ball.y - ball.r < 0) ball.dy = -ball.dy;

    // Paddle collision
    if (ball.y + ball.r > paddle.y && ball.y + ball.r < paddle.y + paddle.h &&
        ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
      ball.dy = -ball.dy;
      // adjust dx based on where it hit the paddle
      const hitPos = (ball.x - paddle.x) / paddle.w;
      ball.dx = (hitPos - 0.5) * 10;
    }

    // Bottom
    if (ball.y - ball.r > height) {
      lives--;
      if (!lives) {
        gameOver = true;
      } else {
        resetBallPaddle();
      }
    }

    collisionDetection();
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    drawBricks();
    drawPaddle();
    drawBall();
    drawInfo();
    if (gameOver) {
      ctx.fillStyle = '#fff';
      ctx.font = '48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', width/2, height/2);
      ctx.font = '24px sans-serif';
      ctx.fillText('Press R to Restart', width/2, height/2 + 40);
    }
    if (win) {
      ctx.fillStyle = '#fff';
      ctx.font = '48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('You Win!', width/2, height/2);
      ctx.font = '24px sans-serif';
      ctx.fillText('Press R to Restart', width/2, height/2 + 40);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'd') paddle.dx = paddle.speed;
    else if (e.key === 'ArrowLeft' || e.key === 'a') paddle.dx = -paddle.speed;
    else if (e.key === 'r' || e.key === 'R') {
      if (gameOver || win) {
        lives = 3;
        score = 0;
        gameOver = false;
        win = false;
        initBricks();
        resetBallPaddle();
      }
    }
  });
  document.addEventListener('keyup', e => {
    if ((e.key === 'ArrowRight' || e.key === 'd') && paddle.dx > 0) paddle.dx = 0;
    else if ((e.key === 'ArrowLeft' || e.key === 'a') && paddle.dx < 0) paddle.dx = 0;
  });

  // Init
  initBricks();
  resetBallPaddle();
  loop();
})();
</script>
</body>
</html>
