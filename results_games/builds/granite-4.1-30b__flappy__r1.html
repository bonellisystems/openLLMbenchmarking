<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #70c5ce; font-family: Arial, sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let bird = {
    x: 50,
    y: 150,
    size: 30,
    velocity: 0,
    acceleration: 0.5,
    jumpForce: -8,
    score: 0
  };

  let pipes = [];
  let pipeGap = 150;
  let pipeFrequency = 100;
  let pipeSpeed = 2;

  let bestScore = 0;

  function Pipe(x, height) {
    this.x = x;
    this.height = height;
    this.top = 0;
    this.bottom = 0;
    this.passed = false;
    this.setHeights();
  }

  Pipe.prototype.setHeights = function() {
    this.top = Math.random() * (canvas.height - pipeGap - 100);
    this.bottom = this.top + canvas.height - pipeGap;
  };

  Pipe.prototype.draw = function() {
    ctx.fillStyle = '#fffac2';
    ctx.fillRect(this.x, 0, 50, this.top);
    ctx.fillRect(this.x, this.bottom, 50, canvas.height - this.bottom);
  };

  function Bird(x, y) {
    this.x = x;
    this.y = y;
    this.size = 30;
    this.velocity = 0;
    this.acceleration = 0.5;
    this.jumpForce = -8;
  }

  Bird.prototype.draw = function() {
    ctx.fillStyle = '#facc5a';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  };

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    bird.velocity += bird.acceleration;
    bird.y += bird.velocity;

    if (bird.y + bird.size > canvas.height || bird.y < 0) {
      gameOver();
    }

    for (let i = 0; i < pipes.length; i++) {
      if (pipes[i].x + 50 < 0) {
        pipes.splice(i, 1);
        i--;
        continue;
      }

      pipes[i].x -= pipeSpeed;

      if (!pipes[i].passed && pipes[i].x + 50 >= bird.x && bird.x >= pipes[i].x) {
        if (bird.y - bird.size < pipes[i].top || bird.y + bird.size > pipes[i].bottom) {
          gameOver();
        } else {
          pipes[i].passed = true;
          bird.score++;
        }
      }

      pipes[i].draw();
    }

    if (pipes.length === 0 || pipes[pipes.length - 1].x + 50 < canvas.width - pipeFrequency) {
      pipes.push(new Pipe(canvas.width, 0));
      pipes[pipes.length - 1].setHeights();
    }

    bird.draw();
    ctx.fillStyle = '#f8f871';
    ctx.font = '24px Arial';
    ctx.fillText(`Score: ${bird.score}`, 10, 30);
    ctx.fillText(`Best: ${bestScore}`, 10, 60);

    requestAnimationFrame(update);
  }

  function gameOver() {
    if (bird.score > bestScore) {
      bestScore = bird.score;
    }
    bird = {
      x: 50,
      y: 150,
      size: 30,
      velocity: 0,
      acceleration: 0.5,
      jumpForce: -8,
      score: 0
    };
    pipes = [];
  }

  function jump() {
    bird.velocity = bird.jumpForce;
  }

  document.addEventListener('keydown', jump);

  update();
</script>
</body>
</html>
