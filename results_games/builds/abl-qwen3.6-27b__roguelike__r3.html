<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Tiny Roguelike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#ccc;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#game{display:flex;flex-direction:column;align-items:center}
#map{font-size:14px;line-height:14px;letter-spacing:2px;white-space:pre;user-select:none}
#hud{color:#888;font-size:13px;margin-top:6px;text-align:center}
#log{color:#666;font-size:12px;margin-top:4px;height:42px;overflow:hidden;text-align:center;width:720px}
.w{color:#556}.f{color:#888}.p{color:#ff0}.g{color:#f44}.o{color:#4f4}.s{color:#ff8}.v{color:#aaa}.d{color:#333}
</style>
</head>
<body>
<div id="game"><pre id="map"></pre><div id="hud"></div><div id="log"></div></div>
<script>
const W=60,H=24,MAXD=10;
const T={WALL:0,FLOOR:1,CORR:2};
let map,rooms,player,enemies,stairs,level,log,seen,visible,turns,dead;

function init(){
  level=1;turns=0;dead=false;log=[];
  player={x:0,y:0,hp:30,maxHp:30,atk:4,def:1,level:1,xp:0,xpNext:10};
  genLevel();
  addLog("Welcome to the dungeon. Find the stairs (>) to descend.");
  addLog("Use arrow keys or WASD to move. Bump enemies to attack.");
  render();
}

function genLevel(){
  map=[];rooms=[];enemies=[];seen=[];visible=[];
  for(let y=0;y<H;y++){map[y]=[];seen[y]=[];visible[y]=[];for(let x=0;x<W;x++){map[y][x]=T.WALL;seen[y][x]=false;visible[y][x]=false;}}
  const n=6+Math.floor(Math.random()*4)+Math.floor(level/2);
  for(let i=0;i<n;i++){
    let rx=2+Math.floor(Math.random()*(W-8)),ry=1+Math.floor(Math.random()*(H-6));
    let rw=4+Math.floor(Math.random()*5),rh=3+Math.floor(Math.random()*4);
    let ok=true;
    for(let r of rooms){
      if(rx<r.x+r.w+2&&rx+rw+2>r.x&&ry<r.y+r.h+2&&ry+rh+2>r.y){ok=false;break;}
    }
    if(ok){
      rooms.push({x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)});
      for(let dy=ry;dy<ry+rh;dy++)for(let dx=rx;dx<rx+rw;dx++)map[dy][dx]=T.FLOOR;
    }
  }
  for(let i=1;i<rooms.length;i++)carveCorridor(rooms[i-1].cx,rooms[i-1].cy,rooms[i].cx,rooms[i].cy);
  player.x=rooms[0].cx;player.y=rooms[0].cy;
  stairs={x:rooms[rooms.length-1].cx,y:rooms[rooms.length-1].cy};
  for(let i=1;i<rooms.length;i++){
    let ne=1+Math.floor(Math.random()*Math.min(2,Math.floor(level/2)));
    for(let j=0;j<ne;j++){
      let ex=rooms[i].x+Math.floor(Math.random()*rooms[i].w);
      let ey=rooms[i].y+Math.floor(Math.random()*rooms[i].h);
      if(ex===player.x&&ey===player.y)continue;
      let types=['g','o','e'];
      let t=types[Math.floor(Math.random()*Math.min(types.length,1+Math.floor(level/3)))];
      let hp=t==='g'?3+level:t==='o'?6+level*2:10+level*3;
      let atk=t==='g'?1+Math.floor(level/3):t==='o'?2+Math.floor(level/2):3+Math.floor(level/2);
      let def=t==='g'?0:Math.floor(level/4);
      let xp=t==='g'?2:t==='o'?4:7;
      enemies.push({x:ex,y:ey,hp,maxHp:hp,atk,def,xp,type:t,name:t==='g'?'Goblin':t==='o'?'Orc':'Ogre'});
    }
  }
  computeVision();
}

function carveCorridor(x1,y1,x2,y2){
  if(Math.random()<0.5){
    while(y1!==y2){map[y1][x1]=T.CORR;y1+=y1<y2?1:-1;}
    while(x1!==x2){map[y1][x1]=T.CORR;x1+=x1<x2?1:-1;}
  }else{
    while(x1!==x2){map[y1][x1]=T.CORR;x1+=x1<x2?1:-1;}
    while(y1!==y2){map[y1][x1]=T.CORR;y1+=y1<y2?1:-1;}
  }
}

function computeVision(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)visible[y][x]=false;
  const R=8;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>R*R)continue;
    let tx=player.x+dx,ty=player.y+dy;
    if(tx<0||tx>=W||ty<0||ty>=H)continue;
    if(lineOfSight(player.x,player.y,tx,ty)){visible[ty][tx]=true;seen[ty][tx]=true;}
  }
}

function lineOfSight(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let d=dx-dy;
  let cx=x0,cy=y0;
  while(true){
    if(cx===x1&&cy===y1)return true;
    if(map[cy][cx]===T.WALL)return false;
    if(d>0){d-=2*dy;cx+=sx;}else{d+=2*dx;cy+=sy;}
  }
}

function movePlayer(dx,dy){
  if(dead)return;
  let nx=player.x+dx,ny=player.y+dy;
  if(nx<0||nx>=W||ny<0||ny>=H)return;
  if(map[ny][nx]===T.WALL)return;
  let e=enemies.find(e=>e.x===nx&&e.y===ny&&e.hp>0);
  if(e){attack(e);doTurn();return;}
  player.x=nx;player.y=ny;
  if(player.x===stairs.x&&player.y===stairs.y){
    level++;
    addLog("You descend deeper... (Level "+level+")");
    genLevel();render();return;
  }
  doTurn();
}

function attack(e){
  let dmg=Math.max(1,player.atk-e.def+Math.floor(Math.random()*2));
  e.hp-=dmg;
  addLog("You hit the "+e.name+" for "+dmg+" damage.");
  if(e.hp<=0){
    addLog("The "+e.name+" dies! (+"+e.xp+" XP)");
    player.xp+=e.xp;
    while(player.xp>=player.xpNext){
      player.xp-=player.xpNext;player.level++;
      player.maxHp+=3;player.hp=Math.min(player.hp+3,player.maxHp);
      player.atk+=1;player.def+=1;player.xpNext=Math.floor(player.xpNext*1.5);
      addLog("Level up! You are now level "+player.level+"!");
    }
  }
}

function doTurn(){
  turns++;
  for(let e of enemies){
    if(e.hp<=0)continue;
    let dx=player.x-e.x,dy=player.y-e.y;
    let dist=Math.abs(dx)+Math.abs(dy);
    if(dist>10)continue;
    if(dist<=1){
      let dmg=Math.max(1,e.atk-player.def+Math.floor(Math.random()*2));
      player.hp-=dmg;
      addLog(e.name+" hits you for "+dmg+" damage.");
      if(player.hp<=0){dead=true;addLog("You have died! Press R to restart.");}
      continue;
    }
    let mx=dx!==0?Math.sign(dx):0,my=dy!==0?Math.sign(dy):0;
    let nx=e.x+mx,ny=e.y+my;
    if(nx>=0&&nx<W&&ny>=0&&ny<H&&map[ny][nx]!==T.WALL){
      let blocked=enemies.find(o=>o!==e&&o.hp>0&&o.x===nx&&o.y===ny);
      if(!blocked&&(nx!==player.x||ny!==player.y)){e.x=nx;e.y=ny;}
    }else{
      nx=e.x+my;ny=e.y-mx;
      if(nx>=0&&nx<W&&ny>=0&&ny<H&&map[ny][nx]!==T.WALL){
        let blocked=enemies.find(o=>o!==e&&o.hp>0&&o.x===nx&&o.y===ny);
        if(!blocked&&(nx!==player.x||ny!==player.y)){e.x=nx;e.y=ny;}
      }
    }
  }
  computeVision();
  render();
}

function addLog(msg){log.unshift(msg);if(log.length>3)log.pop();}

function render(){
  let html='';
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      if(x===player.x&&y===player.y){html+='<span class="p">@</span>';continue;}
      if(!visible[y][x]&&!seen[y][x]){html+='<span class="d"> </span>';continue;}
      let e=enemies.find(e=>e.x===x&&e.y===y&&e.hp>0);
      if(e){
        let c=e.type==='g'?'g':e.type==='o'?'o':'v';
        html+='<span class="'+c+'">'+e.type+'</span>';continue;
      }
      if(x===stairs.x&&y===stairs.y){html+='<span class="s">></span>';continue;}
      if(map[y][x]===T.WALL){html+='<span class="w">#</span>';continue;}
      if(visible[y][x]){html+='<span class="f">.</span>';}
      else{html+='<span class="d">.</span>';}
    }
    html+='\n';
  }
  document.getElementById('map').innerHTML=html;
  let h='HP: '+player.hp+'/'+player.maxHp+' | ATK:'+player.atk+' DEF:'+player.def+' | Lvl:'+player.level+' | Dungeon:'+level+' | Turns:'+turns;
  if(dead)h+=' | DEAD - Press R';
  document.getElementById('hud').textContent=h;
  document.getElementById('log').textContent=log.join(' | ');
}

document.addEventListener('keydown',function(ev){
  if(dead&&ev.key.toLowerCase()==='r'){init();return;}
  let dx=0,dy=0;
  if(ev.key==='ArrowUp'||ev.key==='w')dy=-1;
  else if(ev.key==='ArrowDown'||ev.key==='s')dy=1;
  else if(ev.key==='ArrowLeft'||ev.key==='a')dx=-1;
  else if(ev.key==='ArrowRight'||ev.key==='d')dx=1;
  else if(ev.key===' '||ev.key==='5'){/* wait */doTurn();return;}
  else return;
  ev.preventDefault();
  movePlayer(dx,dy);
});

init();
</script>
</body>
</html>
