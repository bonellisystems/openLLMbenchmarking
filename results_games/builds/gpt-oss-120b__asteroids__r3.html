<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial;}
#game{display:block;background:#000;}
#score{position:absolute;top:10px;left:10px;color:#fff;font-size:20px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">Score: 0</div>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreDiv = document.getElementById('score');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    window.addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});
    canvas.tabIndex = 1;
    canvas.focus();

    const keys = {};
    document.addEventListener('keydown',e=>{keys[e.code]=true;});
    document.addEventListener('keyup',e=>{keys[e.code]=false;});

    const ship = {
        x: W/2, y: H/2,
        angle: 0,
        vx:0, vy:0,
        radius:10,
        thrust:0,
        cooldown:0
    };
    const bullets = [];
    const rocks = [];
    let score = 0;

    const MAX_ROCKS = 5;
    const ROCK_LEVELS = 3; // 3 = big, 2 = medium, 1 = small
    const ROCK_SIZES = {3:40,2:20,1:10};
    const ROCK_SPEED = {3:0.5,2:0.8,1:1.2};

    function wrap(obj){
        if(obj.x<0) obj.x+=W;
        if(obj.x>W) obj.x-=W;
        if(obj.y<0) obj.y+=H;
        if(obj.y>H) obj.y-=H;
    }

    function createRock(x,y,level){
        const angle = Math.random()*Math.PI*2;
        const speed = ROCK_SPEED[level];
        rocks.push({
            x:x||Math.random()*W,
            y:y||Math.random()*H,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            level:level,
            radius:ROCK_SIZES[level],
            angle:Math.random()*Math.PI*2,
            rotSpeed:(Math.random()-0.5)*0.02
        });
    }

    function initRocks(){
        while(rocks.length<MAX_ROCKS){
            const r = Math.random()*2*Math.PI;
            const dist = Math.max(W,H)/2;
            const x = ship.x + Math.cos(r)*dist;
            const y = ship.y + Math.sin(r)*dist;
            createRock(x%W,y%H,ROCK_LEVELS);
        }
    }

    function fireBullet(){
        if(ship.cooldown>0) return;
        const speed = 6;
        const bx = ship.x + Math.cos(ship.angle)*ship.radius;
        const by = ship.y + Math.sin(ship.angle)*ship.radius;
        bullets.push({
            x:bx,
            y:by,
            vx:ship.vx + Math.cos(ship.angle)*speed,
            vy:ship.vy + Math.sin(ship.angle)*speed,
            life:60
        });
        ship.cooldown=15;
    }

    function splitRock(rock){
        if(rock.level<=1) return;
        for(let i=0;i<2;i++){
            const newLevel = rock.level-1;
            const angle = Math.random()*Math.PI*2;
            const speed = ROCK_SPEED[newLevel];
            createRock(rock.x,rock.y,newLevel);
            const nr = rocks[rocks.length-1];
            nr.vx = Math.cos(angle)*speed;
            nr.vy = Math.sin(angle)*speed;
        }
    }

    function update(){
        // ship controls
        if(keys['ArrowLeft']) ship.angle-=0.07;
        if(keys['ArrowRight']) ship.angle+=0.07;
        if(keys['ArrowUp']){
            ship.thrust=0.1;
        }else ship.thrust=0;
        ship.vx+=Math.cos(ship.angle)*ship.thrust;
        ship.vy+=Math.sin(ship.angle)*ship.thrust;
        // friction
        ship.vx*=0.99;
        ship.vy*=0.99;
        ship.x+=ship.vx;
        ship.y+=ship.vy;
        wrap(ship);
        if(keys['Space']) fireBullet();
        if(ship.cooldown>0) ship.cooldown--;

        // bullets
        for(let i=bullets.length-1;i>=0;i--){
            const b=bullets[i];
            b.x+=b.vx; b.y+=b.vy;
            wrap(b);
            b.life--;
            if(b.life<=0) bullets.splice(i,1);
        }

        // rocks
        for(let i=0;i<rocks.length;i++){
            const r=rocks[i];
            r.x+=r.vx; r.y+=r.vy;
            r.angle+=r.rotSpeed;
            wrap(r);
        }

        // collisions bullet-rock
        for(let i=bullets.length-1;i>=0;i--){
            const b=bullets[i];
            for(let j=rocks.length-1;j>=0;j--){
                const r=rocks[j];
                const dx=b.x-r.x, dy=b.y-r.y;
                const dist=Math.hypot(dx,dy);
                if(dist<r.radius){
                    // hit
                    splitRock(r);
                    rocks.splice(j,1);
                    bullets.splice(i,1);
                    score+=100;
                    break;
                }
            }
        }

        // collisions ship-rock
        for(let i=rocks.length-1;i>=0;i--){
            const r=rocks[i];
            const dx=ship.x-r.x, dy=ship.y-r.y;
            const dist=Math.hypot(dx,dy);
            if(dist<r.radius+ship.radius){
                // reset
                ship.x=W/2; ship.y=H/2; ship.vx=ship.vy=0; ship.angle=0;
                score=0;
                rocks.length=0;
                initRocks();
                break;
            }
        }

        // maintain rock count
        while(rocks.length<MAX_ROCKS) createRock(null,null,ROCK_LEVELS);
    }

    function drawShip(){
        ctx.save();
        ctx.translate(ship.x,ship.y);
        ctx.rotate(ship.angle);
        ctx.beginPath();
        ctx.moveTo(ship.radius,0);
        ctx.lineTo(-ship.radius,ship.radius/2);
        ctx.lineTo(-ship.radius,-ship.radius/2);
        ctx.closePath();
        ctx.strokeStyle="#fff";
        ctx.stroke();
        ctx.restore();
    }

    function drawBullets(){
        ctx.fillStyle="#fff";
        bullets.forEach(b=>{
            ctx.beginPath();
            ctx.arc(b.x,b.y,2,0,Math.PI*2);
            ctx.fill();
        });
    }

    function drawRocks(){
        ctx.strokeStyle="#fff";
        rocks.forEach(r=>{
            ctx.save();
            ctx.translate(r.x,r.y);
            ctx.rotate(r.angle);
            ctx.beginPath();
            const sides=8;
            for(let i=0;i<sides;i++){
                const theta = (i/sides)*Math.PI*2;
                const rad = r.radius + Math.random()*r.radius*0.3;
                const x = Math.cos(theta)*rad;
                const y = Math.sin(theta)*rad;
                if(i===0) ctx.moveTo(x,y);
                else ctx.lineTo(x,y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        });
    }

    function render(){
        ctx.clearRect(0,0,W,H);
        drawShip();
        drawBullets();
        drawRocks();
        scoreDiv.textContent = "Score: "+score;
    }

    function loop(){
        update();
        render();
        requestAnimationFrame(loop);
    }

    initRocks();
    loop();
})();
</script>
</body>
</html>
