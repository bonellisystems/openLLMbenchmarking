<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:sans-serif;text-align:center;}
  canvas{background:#000;display:block;margin:20px auto;border:2px solid #555;}
  #info{margin-top:10px;}
  button{padding:5px 10px;font-size:16px;}
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="info">
  <span id="score">Score: 0</span> | 
  <span id="lives">Lives: 3</span> | 
  <span id="message"></span>
</div>
<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const messageEl = document.getElementById('message');
  const width = canvas.width, height = canvas.height;

  const paddle = { w: 100, h: 10, x: (width-100)/2, y: height-30, speed: 7, dx: 0 };
  const ball = { r: 8, x: width/2, y: height/2, speed: 4, dx: 4, dy: -4 };
  const brick = { w: 70, h: 20, padding: 5, offsetTop: 50, offsetLeft: 35 };
  const rows = 5, cols = 10;
  let bricks = [];
  let score = 0, lives = 3, gameState = 'playing';

  function initBricks() {
    bricks = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = brick.offsetLeft + c * (brick.w + brick.padding);
        const y = brick.offsetTop + r * (brick.h + brick.padding);
        bricks.push({ x, y, w: brick.w, h: brick.h, status: 1 });
      }
    }
  }

  function drawPaddle() {
    ctx.fillStyle = '#0095DD';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#FF5722';
    ctx.fill();
    ctx.closePath();
  }

  function drawBricks() {
    bricks.forEach(b => {
      if (b.status) {
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    });
  }

  function drawInfo() {
    scoreEl.textContent = 'Score: ' + score;
    livesEl.textContent = 'Lives: ' + lives;
  }

  function collisionDetection() {
    bricks.forEach(b => {
      if (b.status) {
        if (ball.x > b.x && ball.x < b.x + b.w &&
            ball.y > b.y && ball.y < b.y + b.h) {
          ball.dy = -ball.dy;
          b.status = 0;
          score += 10;
          if (score === rows*cols*10) {
            gameState = 'win';
            messageEl.textContent = 'You Win! Press R to Restart';
          }
        }
      }
    });
  }

  function resetBallPaddle() {
    ball.x = width/2;
    ball.y = height/2;
    ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
    ball.dy = -ball.speed;
    paddle.x = (width - paddle.w)/2;
  }

  function update() {
    if (gameState !== 'playing') return;

    // Move paddle
    paddle.x += paddle.dx;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > width) paddle.x = width - paddle.w;

    // Move ball
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wall collision
    if (ball.x + ball.r > width || ball.x - ball.r < 0) ball.dx = -ball.dx;
    if (ball.y - ball.r < 0) ball.dy = -ball.dy;

    // Paddle collision
    if (ball.y + ball.r > paddle.y &&
        ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
      ball.dy = -ball.dy;
      // adjust angle based on hit position
      const hitPos = (ball.x - paddle.x) / paddle.w;
      ball.dx = ball.speed * (hitPos - 0.5) * 2;
    }

    // Bottom collision
    if (ball.y - ball.r > height) {
      lives--;
      if (lives <= 0) {
        gameState = 'gameover';
        messageEl.textContent = 'Game Over! Press R to Restart';
      } else {
        resetBallPaddle();
      }
    }

    collisionDetection();
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    drawBricks();
    drawPaddle();
    drawBall();
    drawInfo();
    if (gameState !== 'playing') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle = '#fff';
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(messageEl.textContent, width/2, height/2);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Keyboard
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') paddle.dx = -paddle.speed;
    if (e.key === 'ArrowRight' || e.key === 'd') paddle.dx = paddle.speed;
    if (e.key === 'r' || e.key === 'R') {
      if (gameState !== 'playing') {
        lives = 3;
        score = 0;
        gameState = 'playing';
        messageEl.textContent = '';
        initBricks();
        resetBallPaddle();
      }
    }
  });
  document.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (!keys['ArrowLeft'] && !keys['a'] && !keys['ArrowRight'] && !keys['d']) {
      paddle.dx = 0;
    }
  });

  // Initialize
  initBricks();
  resetBallPaddle();
  loop();
})();
</script>
</body>
</html>
