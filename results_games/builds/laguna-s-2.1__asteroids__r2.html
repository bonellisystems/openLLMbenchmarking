<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
    }
    canvas {
        display: block;
        background: #000;
    }
    #score {
        position: absolute;
        top: 10px;
        left: 10px;
        color: #0f0;
        font-family: monospace;
        font-size: 16px;
    }
</style>
</head>
<body>
<div id="score">SCORE: 0</div>
<canvas id="game"></canvas>
<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Game state
    let score = 0;
    let gameOver = false;

    // Player ship
    const ship = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        angle: 0,
        thrust: 0.1,
        friction: 0.99,
        size: 15,
        invincible: 0
    };

    // Bullets
    const bullets = [];

    // Asteroids
    const asteroids = [];

    // Particles
    const particles = [];

    // Generate random number
    function rand(min, max) {
        return Math.random() * (max - min) + min;
    }

    // Create asteroid
    function createAsteroid(x, y, size) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(0.5, 2);
        const vertices = Math.floor(rand(5, 8));
        const points = [];
        for (let i = 0; i < vertices; i++) {
            const a = (i / vertices) * Math.PI * 2;
            const r = size * rand(0.7, 1);
            points.push({
                x: Math.cos(a) * r,
                y: Math.sin(a) * r
            });
        }
        return {
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            angle: angle,
            size: size,
            points: points
        };
    }

    // Initialize asteroids
    function initAsteroids() {
        asteroids.length = 0;
        for (let i = 0; i < 5; i++) {
            let x, y;
            do {
                x = rand(0, canvas.width);
                y = rand(0, canvas.height);
            } while (Math.hypot(x - ship.x, y - ship.y) < 100);
            asteroids.push(createAsteroid(x, y, 30));
        }
    }

    // Update game
    function update() {
        if (gameOver) return;

        // Ship movement
        if (keys['ArrowUp']) {
            ship.vx += Math.cos(ship.angle) * ship.thrust;
            ship.vy += Math.sin(ship.angle) * ship.thrust;
        }
        if (keys['ArrowLeft']) {
            ship.angle -= 0.08;
        }
        if (keys['ArrowRight']) {
            ship.angle += 0.08;
        }
        if (keys['Space']) {
            // Shoot
            if (bullets.length < 10) {
                bullets.push({
                    x: ship.x + Math.cos(ship.angle) * ship.size,
                    y: ship.y + Math.sin(ship.angle) * ship.size,
                    vx: Math.cos(ship.angle) * 5 + ship.vx,
                    vy: Math.sin(ship.angle) * 5 + ship.vy,
                    life: 60
                });
            }
        }

        ship.vx *= ship.friction;
        ship.vy *= ship.friction;
        ship.x += ship.vx;
        ship.y += ship.vy;

        // Wrap screen
        if (ship.x < 0) ship.x = canvas.width;
        if (ship.x > canvas.width) ship.x = 0;
        if (ship.y < 0) ship.y = canvas.height;
        if (ship.y > canvas.height) ship.y = 0;

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height || b.life <= 0) {
                bullets.splice(i, 1);
            }
        }

        // Update asteroids
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            if (a.x < 0) a.x = canvas.width;
            if (a.x > canvas.width) a.x = 0;
            if (a.y < 0) a.y = canvas.height;
            if (a.y > canvas.height) a.y = 0;
        }

        // Collision: bullets and asteroids
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            for (let j = asteroids.length - 1; j >= 0; j--) {
                const a = asteroids[j];
                const dist = Math.hypot(b.x - a.x, b.y - a.y);
                if (dist < a.size) {
                    // Hit!
                    bullets.splice(i, 1);
                    if (a.size > 15) {
                        // Split
                        asteroids.splice(j, 1);
                        asteroids.push(createAsteroid(a.x, a.y, a.size / 2));
                        asteroids.push(createAsteroid(a.x, a.y, a.size / 2));
                    } else {
                        asteroids.splice(j, 1);
                    }
                    score += 10;
                    scoreEl.textContent = 'SCORE: ' + score;
                    break;
                }
            }
        }

        // Collision: ship and asteroids
        if (ship.invincible <= 0) {
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                const dist = Math.hypot(ship.x - a.x, ship.y - a.y);
                if (dist < a.size + ship.size) {
                    gameOver = true;
                    break;
                }
            }
        } else {
            ship.invincible--;
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    // Draw everything
    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw ship
        if (ship.invincible > 0 && ship.invincible % 10 < 5) {
            // Blink when invincible
        } else {
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(ship.angle);
            ctx.beginPath();
            ctx.moveTo(ship.size, 0);
            ctx.lineTo(-ship.size, -ship.size / 2);
            ctx.lineTo(-ship.size, ship.size / 2);
            ctx.closePath();
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        // Draw bullets
        ctx.fillStyle = '#0f0';
        for (const b of bullets) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw asteroids
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        for (const a of asteroids) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.angle);
            ctx.beginPath();
            for (let i = 0; i < a.points.length; i++) {
                const p = a.points[i];
                if (i === 0) {
                    ctx.moveTo(p.x, p.y);
                } else {
                    ctx.lineTo(p.x, p.y);
                }
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // Draw particles
        ctx.fillStyle = '#0f0';
        for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }

        if (gameOver) {
            ctx.fillStyle = '#0f0';
            ctx.font = '48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            ctx.font = '24px monospace';
            ctx.fillText('Refresh to restart', canvas.width / 2, canvas.height / 2 + 40);
        }
    }

    // Game loop
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // Start
    initAsteroids();
    loop();
</script>
</body>
</html>
