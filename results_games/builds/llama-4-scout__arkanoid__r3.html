<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Arkanoid</title>
  <style>
    canvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="600"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const ball = { x: 200, y: 300, vx: 5, vy: -5, radius: 10 };
    const paddle = { x: 175, y: 550, width: 50, height: 10, speed: 8 };
    const bricks = [];
    for (let i = 0; i < 10; i++) {
      for (let j = 0; j < 5; j++) {
        bricks.push({ x: i * 40, y: j * 20, width: 40, height: 20 });
      }
    }
    let score = 0;
    let lives = 3;

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && paddle.x > 0) {
        paddle.x -= paddle.speed;
      } else if (e.key === 'ArrowRight' && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.speed;
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'black';
      ctx.font = '24px Arial';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`Score: ${score}`, 10, 10);
      ctx.textAlign = 'right';
      ctx.fillText(`Lives: ${lives}`, canvas.width - 10, 10);
      ctx.fillStyle = 'white';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, 2 * Math.PI);
      ctx.fill();
      for (const brick of bricks) {
        ctx.fillStyle = 'blue';
        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
      }
    }

    function update() {
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.vx = -ball.vx;
      }
      if (ball.y - ball.radius < 0) {
        ball.vy = -ball.vy;
      }
      if (ball.y + ball.radius > canvas.height) {
        lives--;
        ball.x = 200;
        ball.y = 300;
        ball.vy = -5;
      }
      if (ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
        ball.vy = -ball.vy;
      }
      for (const brick of bricks) {
        if (ball.x > brick.x && ball.x < brick.x + brick.width && ball.y > brick.y && ball.y < brick.y + brick.height) {
          bricks.splice(bricks.indexOf(brick), 1);
          ball.vy = -ball.vy;
          score++;
        }
      }
      if (lives === 0) {
        alert(`Game Over! Final Score: ${score}`);
        location.reload();
      }
      if (bricks.length === 0) {
        alert(`You Win! Final Score: ${score}`);
        location.reload();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
