<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
#game { line-height: 1; font-size: 20px; white-space: pre; cursor: default; }
#msg { margin-top: 10px; font-size: 18px; color: #aaa; height: 1.2em; }
</style>
</head>
<body>
<pre id="game"></pre>
<div id="msg">Use Arrows/WASD to move. Reach G!</div>
<script>
const W = 40, H = 20;
let map = Array(H).fill().map(() => Array(W).fill('#'));
let p = {x: 0, y: 0};
let msg = document.getElementById('msg');
let display = document.getElementById('game');

function init() {
    let rooms = [];
    while (rooms.length < 6) {
        let w = Math.floor(Math.random() * 4) + 3;
        let h = Math.floor(Math.random() * 4) + 3;
        let x = Math.floor(Math.random() * (W - w - 1)) + 1;
        let y = Math.floor(Math.random() * (H - h - 1)) + 1;
        let overlap = false;
        for (let r of rooms) {
            if (!(x >= r.x + r.w || x + w <= r.x || y >= r.y + r.h || y + h <= r.y)) {
                overlap = true; break;
            }
        }
        if (!overlap) {
            for (let i = y; i < y + h; i++) {
                for (let j = x; j < x + w; j++) map[i][j] = '.';
            }
            if (rooms.length > 0) {
                let prev = rooms[rooms.length - 1];
                let cx1 = prev.x + Math.floor(prev.w / 2), cy1 = prev.y + Math.floor(prev.h / 2);
                let cx2 = x + Math.floor(w / 2), cy2 = y + Math.floor(h / 2);
                for (let i = Math.min(cy1, cy2); i <= Math.max(cy1, cy2); i++) map[i][cx1] = '.';
                for (let j = Math.min(cx1, cx2); j <= Math.max(cx1, cx2); j++) map[cy2][j] = '.';
            }
            rooms.push({x, y, w, h, cx: x + Math.floor(w / 2), cy: y + Math.floor(h / 2)});
        }
    }
    p.x = rooms[0].cx; p.y = rooms[0].cy;
    map[rooms[rooms.length - 1].cy][rooms[rooms.length - 1].cx] = 'G';
    for (let i = 0; i < H; i++) {
        for (let j = 0; j < W; j++) {
            if (map[i][j] === '.' && Math.random() < 0.1) map[i][j] = 'M';
        }
    }
    render();
}

function render() {
    let out = "";
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            if (x === p.x && y === p.y) out += "@";
            else out += map[y][x];
        }
        out += "\n";
    }
    display.textContent = out;
}

window.addEventListener('keydown', e => {
    let dx = 0, dy = 0;
    if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
    else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
    else if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
    else return;

    let nx = p.x + dx, ny = p.y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
        let target = map[ny][nx];
        if (target !== '#') {
            if (target === 'M') msg.textContent = "You killed a monster!";
            else if (target === 'G') msg.textContent = "YOU ESCAPED!";
            else msg.textContent = "";
            p.x = nx; p.y = ny;
            if (target === 'M') map[ny][nx] = '.';
            render();
        }
    }
});

init();
</script>
</body>
</html>
