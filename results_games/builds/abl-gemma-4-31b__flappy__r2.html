<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            border: 2px solid #000;
            background-color: #70c5ce;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Constants
        const GRAVITY = 0.25;
        const JUMP = -4.5;
        const PIPE_SPEED = 2;
        const PIPE_GAP = 120;
        const PIPE_WIDTH = 50;
        const BIRD_SIZE = 20;

        // Game State
        let bird = { x: 50, y: 240, v: 0 };
        let pipes = [];
        let score = 0;
        let frame = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER

        function resetGame() {
            bird = { x: 50, y: 240, v: 0 };
            pipes = [];
            score = 0;
            frame = 0;
            gameState = 'PLAYING';
        }

        function spawnPipe() {
            const minPipeHeight = 50;
            const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight;
            const height = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            pipes.push({ x: canvas.width, top: height });
        }

        function update() {
            if (gameState === 'START') return;

            if (gameState === 'PLAYING') {
                bird.v += GRAVITY;
                bird.y += bird.v;

                if (frame % 90 === 0) spawnPipe();

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= PIPE_SPEED;

                    // Collision detection
                    if (
                        bird.x + BIRD_SIZE > pipes[i].x &&
                        bird.x < pipes[i].x + PIPE_WIDTH &&
                        (bird.y < pipes[i].top || bird.y + BIRD_SIZE > pipes[i].top + PIPE_GAP)
                    ) {
                        gameState = 'GAMEOVER';
                    }

                    // Score increment
                    if (pipes[i].x + PIPE_WIDTH < bird.x && !pipes[i].passed) {
                        score++;
                        pipes[i].passed = true;
                    }

                    if (pipes[i].x + PIPE_WIDTH < 0) pipes.splice(i, 1);
                }

                if (bird.y + BIRD_SIZE > canvas.height || bird.y < 0) {
                    gameState = 'GAMEOVER';
                }
                frame++;
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pipes
            ctx.fillStyle = '#2e7d32';
            pipes.forEach(p => {
                ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
                ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_WIDTH, canvas.height);
            });

            // Bird
            ctx.fillStyle = '#fdd835';
            ctx.fillRect(bird.x, bird.y, BIRD_SIZE, BIRD_SIZE);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(bird.x, bird.y, BIRD_SIZE, BIRD_SIZE);

            // Score
            ctx.fillStyle = '#fff';
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(score, canvas.width / 2, 50);

            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2);
            }

            if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (gameState === 'START') {
                    resetGame();
                } else if (gameState === 'PLAYING') {
                    bird.v = JUMP;
                } else if (gameState === 'GAMEOVER') {
                    resetGame();
                }
            }
        });

        loop();
    </script>
</body>
</html>
