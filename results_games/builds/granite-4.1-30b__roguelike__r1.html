<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tiny Roguelike</title>
<style>
  body { font-family: monospace; background: black; color: white; margin: 0; padding: 0; }
  #game { width: 80ch; height: 24em; margin: auto; line-break: anywhere; }
</style>
</head>
<body>
<div id="game"></div>
<script>
(() => {
  const WIDTH = 80;
  const HEIGHT = 24;
  const DEPTH = 5;
  const ROOM_MAX_SIZE = 10;
  const ROOM_MIN_SIZE = 3;
  const ROOMS_PER_LEVEL = 6;

  const map = Array.from({length: DEPTH}, () => 
    Array.from({length: HEIGHT}, () => 
      Array.from({length: WIDTH}, () => '.')
    )
  );

  const player = { x: 0, y: 0, z: 0 };

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function createRoom(level, x, y, w, h) {
    for (let j = y; j < y + h; j++) {
      for (let i = x; i < x + w; i++) {
        if (i >= 0 && i < WIDTH && j >= 0 && j < HEIGHT) {
          map[level][j][i] = ' ';
        }
      }
    }
  }

  function generateDungeon() {
    for (let z = 0; z < DEPTH; z++) {
      let rooms = [];
      for (let i = 0; i < ROOMS_PER_LEVEL; i++) {
        const w = randomInt(ROOM_MIN_SIZE, ROOM_MAX_SIZE);
        const h = randomInt(ROOM_MIN_SIZE, ROOM_MAX_SIZE);
        const x = randomInt(0, WIDTH - w);
        const y = randomInt(0, HEIGHT - h);
        createRoom(z, x, y, w, h);
        rooms.push({x, y, w, h});
      }
      // Connect rooms with corridors (simplified)
      for (let i = 1; i < rooms.length; i++) {
        const prev = rooms[i-1];
        const cur = rooms[i];
        // Horizontal corridor
        const startX = Math.min(prev.x + prev.w, cur.x);
        const endX = Math.max(prev.x, cur.x + cur.w - 1);
        for (let x = startX; x <= endX; x++) {
          map[z][Math.min(prev.y + prev.h, cur.y)][x] = ' ';
        }
        // Vertical corridor
        const startY = Math.min(prev.y + prev.h, cur.y);
        const endY = Math.max(prev.y, cur.y + cur.h - 1);
        for (let y = startY; y <= endY; y++) {
          map[z][y][Math.min(prev.x + prev.w, cur.x)] = ' ';
        }
      }
    }
    // Place player
    player.x = randomInt(0, WIDTH - 1);
    player.y = randomInt(0, HEIGHT - 1);
    player.z = 0;
    map[player.z][player.y][player.x] = '@';
  }

  function render() {
    const gameDiv = document.getElementById('game');
    let output = '';
    for (let y = 0; y < HEIGHT; y++) {
      for (let x = 0; x < WIDTH; x++) {
        output += map[player.z][y][x];
      }
      output += '\n';
    }
    gameDiv.textContent = output;
  }

  function move(dx, dy, dz) {
    const newX = player.x + dx;
    const newY = player.y + dy;
    const newZ = player.z + dz;
    if (newX >= 0 && newX < WIDTH && newY >= 0 && newY < HEIGHT && newZ >= 0 && newZ < DEPTH && map[newZ][newY][newX] === ' ') {
      map[player.z][player.y][player.x] = '.';
      player.x = newX;
      player.y = newY;
      player.z = newZ;
      map[player.z][player.y][player.x] = '@';
      render();
    } else if (dz !== 0 && (newZ === 0 || newZ === DEPTH - 1)) {
      // Change level if at top or bottom and trying to move vertically
      const newLevel = Math.max(0, Math.min(DEPTH - 1, newZ));
      if (newLevel !== player.z) {
        player.z = newLevel;
        render();
      }
    }
  }

  generateDungeon();
  render();

  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'w': case 'ArrowUp':    move(0, -1, 0); break;
      case 's': case 'ArrowDown':  move(0, 1, 0); break;
      case 'a': case 'ArrowLeft':  move(-1, 0, 0); break;
      case 'd': case 'ArrowRight': move(1, 0, 0); break;
      case 'q': move(0, 0, -1); break; // Up a level
      case 'e': move(0, 0, 1); break;  // Down a level
    }
  });
})();
</script>
</body>
</html>
