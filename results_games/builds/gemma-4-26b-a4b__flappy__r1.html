<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #70c5ce;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 320;
        canvas.height = 480;

        // Game Constants
        const GRAVITY = 0.25;
        const JUMP = -4.5;
        const PIPE_SPEED = 2;
        const PIPE_SPAWN_RATE = 90; // frames
        const PIPE_WIDTH = 50;
        const PIPE_GAP = 120;

        // Game State
        let bird = {
            x: 50,
            y: 200,
            w: 24,
            h: 24,
            velocity: 0,
            radius: 12
        };

        let pipes = [];
        let frameCount = 0;
        let score = 0;
        let highScore = localStorage.getItem('flappyHighScore') || 0;
        let gameState = 'START'; // START, PLAYING, GAME_OVER

        // Input Handling
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleInput();
            }
        });

        // Touch support for mobile
        window.addEventListener('touchstart', (e) => {
            handleInput();
            e.preventDefault();
        }, {passive: false});

        function handleInput() {
            if (gameState === 'START') {
                resetGame();
                gameState = 'PLAYING';
            } else if (gameState === 'PLAYING') {
                bird.velocity = JUMP;
            } else if (gameState === 'GAME_OVER') {
                resetGame();
                gameState = 'PLAYING';
            }
        }

        function resetGame() {
            bird.y = 200;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
        }

        function createPipe() {
            const minPipeHeight = 40;
            const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight;
            const height = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
            
            pipes.push({
                x: canvas.width,
                top: height,
                bottom: canvas.height - height - PIPE_GAP,
                passed: false
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Bird Physics
            bird.velocity += GRAVITY;
            bird.y += bird.velocity;

            // Collision: Floor and Ceiling
            if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
                gameOver();
            }

            // Pipes Logic
            if (frameCount % PIPE_SPAWN_RATE === 0) {
                createPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED;

                // Collision: Pipes
                if (
                    bird.x + bird.radius > pipes[i].x &&
                    bird.x - bird.radius < pipes[i].x + PIPE_WIDTH &&
                    (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > canvas.height - pipes[i].bottom)
                ) {
                    gameOver();
                }

                // Score increment
                if (!pipes[i].passed && pipes[i].x + PIPE_WIDTH < bird.x) {
                    score++;
                    pipes[i].passed = true;
                }

                // Remove off-screen pipes
                if (pipes[i].x + PIPE_WIDTH < 0) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function gameOver() {
            gameState = 'GAME_OVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore);
            }
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Pipes
            ctx.fillStyle = '#2e7d32';
            pipes.forEach(pipe => {
                // Top Pipe
                ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.top);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, pipe.top);

                // Bottom Pipe
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, PIPE_WIDTH, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, PIPE_WIDTH, pipe.bottom);
            });

            // Draw Bird
            ctx.fillStyle = '#fdd835';
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(bird.x + 6, bird.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(bird.x + 8, bird.y - 4, 2, 0, Math.PI * 2);
            ctx.fill();

            // UI
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.textAlign = 'center';

            if (gameState === 'START') {
                ctx.font = '30px Courier New';
                ctx.fillText('FLAPPY BIRD', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '20px Courier New';
                ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2);
            }

            if (gameState === 'PLAYING') {
                ctx.font = '40px Courier New';
                ctx.strokeText(score, canvas.width / 2, 50);
                ctx.fillText(score, canvas.width / 2, 50);
            }

            if (gameState === 'GAME_OVER') {
                ctx.font = '30px Courier New';
                ctx.strokeText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                
                ctx.font = '20px Courier New';
                ctx.fillText(`SCORE: ${score}`, canvas.width / 2, canvas.height / 2);
                ctx.fillText(`BEST: ${highScore}`, canvas.width / 2, canvas.height / 2 + 30);
                ctx.font = '16px Courier New';
                ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 70);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
