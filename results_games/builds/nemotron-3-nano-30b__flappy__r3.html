<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  body{margin:0;overflow:hidden;background:#87CEEB;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const bird = {
    x: canvas.width * 0.2,
    y: canvas.height / 2,
    radius: 20,
    velocity: 0,
    gravity: 0.5,
    lift: -8,
    color: '#FFD700'
  };

  const pipeWidth = 50;
  const pipeGapHeight = 150;
  const pipes = [];
  let frame = 0;
  let gameOver = false;

  function reset() {
    bird.y = canvas.height / 2;
    bird.velocity = 0;
    pipes.length = 0;
    gameOver = false;
    frame = 0;
  }

  function createPipe() {
    const gapY = Math.random() * (canvas.height - pipeGapHeight) + pipeGapHeight / 2;
    const topHeight = gapY - pipeGapHeight / 2;
    const bottomY = gapY + pipeGapHeight / 2;
    pipes.push({
      x: canvas.width,
      topHeight,
      bottomY,
      width: pipeWidth,
      gapY,
      color: '#2E8B57'
    });
  }

  function update() {
    if (gameOver) return;
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Move pipes
    for (let i = 0; i < pipes.length; i++) {
      pipes[i].x -= 2;
    }

    // Remove off-screen pipes
    while (pipes.length && pipes[0].x + pipeWidth < 0) {
      pipes.shift();
    }

    // Add new pipe when needed
    if (!pipes.length || pipes[pipes.length - 1].x < canvas.width - 200) {
      createPipe();
    }

    // Collision detection
    for (let p of pipes) {
      if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + p.width) {
        if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > p.bottomY) {
          gameOver = true;
          return;
        }
      }
    }
    if (bird.y - bird.radius < 0 || bird.y + bird.radius > canvas.height) {
      gameOver = true;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Sky
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Pipes
    for (let p of pipes) {
      // Top pipe
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, 0, p.width, p.topHeight);
      // Bottom pipe
      ctx.fillRect(p.x, p.bottomY, p.width, canvas.height - p.bottomY);
    }
    // Bird
    ctx.fillStyle = bird.color;
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    update();
    draw();
    if (!gameOver) requestAnimationFrame(loop);
  }

  // Handle flap
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === ' ') {
      if (gameOver) reset();
      else bird.velocity = bird.lift;
    }
  });

  // Resize handling
  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  // Init
  createPipe();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
