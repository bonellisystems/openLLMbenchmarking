<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>
<style>
  body { margin: 0; padding: 0; overflow: hidden; background: #70c5ce; font-family: Arial, sans-serif; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let bird = {
    x: 50,
    y: 150,
    size: 30,
    velocity: 0,
    gravity: 0.8,
    jumpForce: 15,
    score: 0
  };

  let pipes = [];
  let pipeGap = 200;
  let pipeWidth = 80;
  let pipeSpeed = 2;
  let spawnInterval = 1500;
  let lastSpawn = 0;

  function Pipe(x, height) {
    this.x = x;
    this.topHeight = height;
    this.bottomHeight = canvas.height - (height + pipeGap);
    this.width = pipeWidth;
  }

  function drawBird() {
    ctx.fillStyle = 'yellow';
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.closePath();
  }

  function drawPipes(pipe) {
    ctx.fillStyle = 'green';
    ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
    ctx.fillRect(pipe.x, pipe.bottomHeight, pipe.width, canvas.height - pipe.bottomHeight);
  }

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update bird position
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Draw bird
    drawBird();

    // Update and draw pipes
    if (canvas.width - pipes[0].x > pipeSpeed) {
      pipes.push(new Pipe(canvas.width, Math.random() * (canvas.height - pipeGap - 100) + 100));
    }
    for (let i = 0; i < pipes.length; i++) {
      pipes[i].x -= pipeSpeed;
      drawPipes(pipes[i]);

      // Check collision
      if (
        bird.x + bird.size > pipes[i].x &&
        bird.x - bird.size < pipes[i].x + pipes[i].width &&
        (bird.y - bird.size < pipes[i].topHeight || bird.y + bird.size > pipes[i].bottomHeight)
      ) {
        alert('Game Over! Your score: ' + bird.score);
        bird.y = 150;
        bird.velocity = 0;
        pipes = [];
        bird.score = 0;
        return;
      }

      // Remove pipes that are out of view
      if (pipes[i].x + pipes[i].width < 0) {
        pipes.shift();
        bird.score++;
      }
    }

    // Jump
    if (bird.y + bird.size >= canvas.height || bird.y - bird.size <= 0) {
      alert('Game Over! Your score: ' + bird.score);
      bird.y = 150;
      bird.velocity = 0;
      pipes = [];
      bird.score = 0;
      return;
    }

    requestAnimationFrame(update);
  }

  function handleKeyPress(event) {
    if (event.code === 'Space') {
      bird.velocity = -bird.jumpForce;
    }
  }

  document.addEventListener('keydown', handleKeyPress);
  update();
</script>
</body>
</html>
