<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Doodle Jump Clone</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#f0f0f0;}
canvas{display:block;margin:auto;background:#fff;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
const cw=canvas.width,ch=canvas.height;

// Player
const player={w:40,h:40,x:cw/2-20,y:ch-100,vx:0,vy:0,onGround:false,color:'#ff6600'};
const playerSpeed=4;
const gravity=0.6;
const bounce=-0.6;
const platforms=[];

// Platform factory
function Platform(x,y,w,h,col){
 this.x=x; this.y=y; this.w=w; this.h=h; this.col=col;
}
function random(min,max){return Math.random()*(max-min)+min;}
function randomColor(){
 const letters='0123456789ABCDEF';
 let c='#';
 for(let i=0;i<6;i++) c+=letters[Math.floor(Math.random()*16)];
 return c;
}

// Ground platform
platforms.push(new Platform(0,ch-20,cw,20,'#888'));

// Generate a random platform above current highest one
function genPlatform(){
 const y=random(0,ch/2);
 const w=random(30,80);
 const x=random(0,cw-w);
 platforms.push(new Platform(x,y,w,10,randomColor()));
}
for(let i=0;i<8;i++) genPlatform();

// Keyboard handling
let movingLeft=false,movingRight=false;
window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft') movingLeft=true;
 if(e.key==='ArrowRight') movingRight=true;
});
window.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft') movingLeft=false;
 if(e.key==='ArrowRight') movingRight=false;
});

// Game state
let gameOver=false;

// Update loop
function update(){
 if(gameOver) return;
 // Horizontal movement
 if(movingLeft) player.vx=-playerSpeed;
 else if(movingRight) player.vx=playerSpeed;
 else player.vx=0;
 // Clamp horizontally
 player.x=Math.max(0,Math.min(cw-player.w,player.x+player.vx));
 // Apply gravity
 player.vy+=gravity;
 player.x+=player.vx;
 player.y+=player.vy;
 // Platform collision
 player.onGround=false;
 for(const p of platforms){
 if(player.vy>0 && player.y+player.h>=p.y && player.y<=p.y+p.h && player.x+player.w>p.x && player.x<p.x+p.w){
 player.y=p.y-player.h;
 player.vy=bounce;
 player.onGround=true;
 break;
 }
 }
 // Game over check
 if(player.y>ch){
 gameOver=true;
 }
 // Generate new platform when near top
 if(player.y<100) genPlatform();
}
function draw(){
 ctx.clearRect(0,0,cw,ch);
 // Platforms
 for(const p of platforms){
 ctx.fillStyle=p.col;
 ctx.fillRect(p.x,p.y,p.w,p.h);
 }
 // Player
 ctx.fillStyle=player.color;
 ctx.fillRect(player.x,player.y,player.w,player.h);
 // Ground
 ctx.fillStyle='#888';
 ctx.fillRect(0,ch-20,cw,20);
 // Game over text
 if(gameOver){
 ctx.fillStyle='#000';
 ctx.font='48px sans-serif';
 ctx.textAlign='center';
 ctx.fillText('Game Over',cw/2,ch/2);
 }
 requestAnimationFrame(draw);
}
requestAnimationFrame(function loop(){ update(); draw(); loop(); });
</script>
</body>
</html>
