<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  color: #fff;
  user-select: none;
}
#wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#info {
  display: flex;
  justify-content: space-between;
  width: 400px;
  font-size: 18px;
}
canvas {
  border: 2px solid #444;
  background: #0a0a0a;
  display: block;
}
#msg {
  font-size: 14px;
  color: #888;
  height: 20px;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="info">
    <span>Score: <span id="score">0</span></span>
    <span>Best: <span id="best">0</span></span>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div id="msg">Press any arrow key or WASD to start</div>
</div>
<script>
var C = document.getElementById('c');
var X = C.getContext('2d');
var S = 20;
var W = C.width / S;
var H = C.height / S;
var snake, dir, next, food, score, best = 0, alive, started, tick, last;

function init() {
  var x = Math.floor(W / 2), y = Math.floor(H / 2);
  snake = [{x: x, y: y}, {x: x - 1, y: y}, {x: x - 2, y: y}];
  dir = {x: 1, y: 0};
  next = {x: 1, y: 0};
  score = 0;
  alive = true;
  started = false;
  tick = 100;
  last = 0;
  placeFood();
  document.getElementById('score').textContent = 0;
  document.getElementById('msg').textContent = 'Press any arrow key or WASD to start';
}

function placeFood() {
  var free = [];
  for (var i = 0; i < W; i++)
    for (var j = 0; j < H; j++) {
      var hit = false;
      for (var k = 0; k < snake.length; k++)
        if (snake[k].x === i && snake[k].y === j) { hit = true; break; }
      if (!hit) free.push({x: i, y: j});
    }
  food = free[Math.floor(Math.random() * free.length)];
}

function update() {
  dir = {x: next.x, y: next.y};
  var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H) {
    alive = false;
    return;
  }
  for (var i = 0; i < snake.length; i++)
    if (snake[i].x === head.x && snake[i].y === head.y) {
      alive = false;
      return;
    }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  X.fillStyle = '#0a0a0a';
  X.fillRect(0, 0, C.width, C.height);
  X.fillStyle = '#222';
  for (var i = 0; i < W; i++)
    for (var j = 0; j < H; j++)
      if ((i + j) % 2 === 0)
        X.fillRect(i * S, j * S, S, S);
  X.fillStyle = '#e74c3c';
  X.beginPath();
  X.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 2, 0, Math.PI * 2);
  X.fill();
  for (var i = 0; i < snake.length; i++) {
    var t = i / snake.length;
    var r = Math.floor(39 + t * 26);
    var g = Math.floor(180 - t * 100);
    var b = Math.floor(60 - t * 30);
    X.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    X.fillRect(snake[i].x * S + 1, snake[i].y * S + 1, S - 2, S - 2);
  }
  if (!alive) {
    X.fillStyle = 'rgba(0,0,0,0.6)';
    X.fillRect(0, 0, C.width, C.height);
    X.fillStyle = '#fff';
    X.font = 'bold 36px Courier New';
    X.textAlign = 'center';
    X.fillText('GAME OVER', C.width / 2, C.height / 2 - 10);
    X.font = '16px Courier New';
    X.fillText('Press SPACE to restart', C.width / 2, C.height / 2 + 25);
  }
}

function loop(ts) {
  if (alive && started && ts - last >= tick) {
    update();
    last = ts;
  }
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', function(e) {
  var k = e.key;
  if (!alive && k === ' ') {
    init();
    return;
  }
  if (!alive) return;
  if (!started) started = true;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { if (dir.y !== 1) next = {x: 0, y: -1}; e.preventDefault(); }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { if (dir.y !== -1) next = {x: 0, y: 1}; e.preventDefault(); }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (dir.x !== 1) next = {x: -1, y: 0}; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (dir.x !== -1) next = {x: 1, y: 0}; e.preventDefault(); }
  if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') e.preventDefault();
});

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
