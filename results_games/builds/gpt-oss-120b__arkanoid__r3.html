<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arkanoid</title>
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
canvas{display:block;margin:auto;background:#111;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 480, H = 320;
    canvas.width = W;
    canvas.height = H;

    // Game objects
    const paddle = { w: 80, h: 12, x: (W-80)/2, y: H-20, speed: 6 };
    const ball = { r: 6, x: W/2, y: H-30, vx: 0, vy: 0, speed: 4, moving:false };
    const rows = 5, cols = 8;
    const brick = { w: 55, h: 20, padding: 5, offsetTop: 30, offsetLeft: 30 };
    let bricks = [];

    // Init bricks
    for(let r=0;r<rows;r++){
        bricks[r]=[];
        for(let c=0;c<cols;c++){
            const bx = brick.offsetLeft + c*(brick.w+brick.padding);
            const by = brick.offsetTop + r*(brick.h+brick.padding);
            bricks[r][c]={x:bx,y:by,hit:true};
        }
    }

    // Input
    const keys = {};
    document.addEventListener('keydown',e=>{
        keys[e.key]=true;
        if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) e.preventDefault();
        if(e.key===' ' && !ball.moving){
            ball.moving=true;
            // launch at random angle upward
            const angle = (Math.random()*Math.PI/3)+Math.PI/3; // 60-120 deg
            ball.vx = ball.speed*Math.cos(angle);
            ball.vy = -ball.speed*Math.sin(angle);
        }
    });
    document.addEventListener('keyup',e=>{keys[e.key]=false;});

    // Ensure focus for keyboard
    window.focus();

    function update(){
        // Paddle movement
        if(keys['ArrowLeft']||keys['a']||keys['A']) paddle.x -= paddle.speed;
        if(keys['ArrowRight']||keys['d']||keys['D']) paddle.x += paddle.speed;
        // Clamp paddle
        if(paddle.x<0) paddle.x=0;
        if(paddle.x+paddle.w>W) paddle.x=W-paddle.w;

        // Ball movement
        if(ball.moving){
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Wall collisions
            if(ball.x-ball.r<0){ ball.x=ball.r; ball.vx*=-1; }
            if(ball.x+ball.r>W){ ball.x=W-ball.r; ball.vx*=-1; }
            if(ball.y-ball.r<0){ ball.y=ball.r; ball.vy*=-1; }

            // Paddle collision
            if(ball.y+ball.r>paddle.y && ball.y+ball.r<paddle.y+paddle.h &&
               ball.x>paddle.x && ball.x<paddle.x+paddle.w){
                // reflect based on hit position
                const hitPos = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
                const angle = hitPos * Math.PI/3 + Math.PI/2; // 30deg to 150deg
                ball.vx = ball.speed*Math.cos(angle);
                ball.vy = -ball.speed*Math.sin(angle);
                ball.y = paddle.y - ball.r; // reposition above paddle
            }

            // Brick collisions
            for(let r=0;r<rows;r++){
                for(let c=0;c<cols;c++){
                    const b = bricks[r][c];
                    if(!b.hit) continue;
                    if(ball.x+ball.r> b.x && ball.x-ball.r< b.x+brick.w &&
                       ball.y+ball.r> b.y && ball.y-ball.r< b.y+brick.h){
                        // simple reverse Y direction
                        ball.vy*=-1;
                        b.hit=false;
                    }
                }
            }

            // Bottom loss
            if(ball.y-ball.r>H){
                // reset ball
                ball.moving=false;
                ball.x = W/2;
                ball.y = H-30;
                ball.vx = ball.vy = 0;
            }
        }else{
            // keep ball on paddle before launch
            ball.x = paddle.x + paddle.w/2;
            ball.y = paddle.y - ball.r;
        }
    }

    function draw(){
        ctx.clearRect(0,0,W,H);
        // Draw paddle
        ctx.fillStyle = '#fff';
        ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
        // Draw ball
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
        ctx.fill();
        // Draw bricks
        for(let r=0;r<rows;r++){
            for(let c=0;c<cols;c++){
                const b = bricks[r][c];
                if(b.hit){
                    ctx.fillStyle = '#'+((r*3+c*5)%10).toString()+((r*7)%10).toString()+'8';
                    ctx.fillRect(b.x,b.y,brick.w,brick.h);
                }
            }
        }
    }

    function loop(){
        update();
        draw();
        requestAnimationFrame(loop);
    }
    loop();
})();
</script>
</body>
</html>
