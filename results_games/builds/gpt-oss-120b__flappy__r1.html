<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#70c5ce;overflow:hidden;font-family:sans-serif;}
  #game{display:block;margin:auto;background:#70c5ce;}
  .overlay{
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#fff;
    font-size:24px;
    text-shadow:0 0 5px #000;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<div class="overlay" id="overlay">Press Space or Up Arrow to Start</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  const GRAVITY = 0.5;
  const FLAP_STRENGTH = -8;
  const PIPE_SPEED = 2;
  const PIPE_GAP = 120;
  const PIPE_WIDTH = 60;
  const BIRD_SIZE = 30;

  let bird, pipes, score, best, gameState, animationId;

  function reset() {
    bird = {x: 80, y: HEIGHT/2, vy: 0, width: BIRD_SIZE, height: BIRD_SIZE};
    pipes = [];
    score = 0;
    best = Math.max(best||0, score);
    gameState = 'ready';
    overlay.textContent = 'Press Space or Up Arrow to Start';
    overlay.style.display = 'flex';
    cancelAnimationFrame(animationId);
    draw();
  }

  function start() {
    if (gameState === 'playing') return;
    gameState = 'playing';
    overlay.style.display = 'none';
    spawnPipe();
    loop();
  }

  function gameOver() {
    gameState = 'over';
    overlay.textContent = `Game Over! Score: ${score}  (Best: ${Math.max(best,score)})\nPress Space or Up Arrow to Restart`;
    overlay.style.display = 'flex';
    cancelAnimationFrame(animationId);
  }

  function spawnPipe() {
    const topHeight = Math.random() * (HEIGHT - PIPE_GAP - 100) + 50;
    const bottomY = topHeight + PIPE_GAP;
    pipes.push({x: WIDTH, top: topHeight, bottom: bottomY});
  }

  function loop() {
    update();
    draw();
    if (gameState === 'playing') animationId = requestAnimationFrame(loop);
  }

  function update() {
    // Bird physics
    bird.vy += GRAVITY;
    bird.y += bird.vy;

    // Collision with ground/ceiling
    if (bird.y + bird.height > HEIGHT || bird.y < 0) {
      gameOver();
      return;
    }

    // Pipes movement
    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED;

      // Check collision
      if (bird.x < p.x + PIPE_WIDTH && bird.x + bird.width > p.x) {
        if (bird.y < p.top || bird.y + bird.height > p.bottom) {
          gameOver();
          return;
        }
      }

      // Score
      if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
        p.passed = true;
        score++;
      }

      // Remove off-screen pipes
      if (p.x + PIPE_WIDTH < 0) pipes.splice(i,1);
    }

    // Add new pipe
    if (pipes.length === 0 || pipes[pipes.length-1].x < WIDTH - 200) {
      spawnPipe();
    }
  }

  function draw() {
    // Clear
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    // Bird
    ctx.fillStyle = '#ff0';
    ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

    // Pipes
    ctx.fillStyle = '#0f0';
    pipes.forEach(p => {
      ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
      ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, HEIGHT - p.bottom);
    });

    // Score
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText(`Score: ${score}`, 10, 30);
  }

  // Input
  function handleKey(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (gameState === 'ready' || gameState === 'over') {
        reset();
        start();
      } else if (gameState === 'playing') {
        bird.vy = FLAP_STRENGTH;
      }
    }
  }

  window.addEventListener('keydown', handleKey);
  // Ensure focus for key events
  window.focus();

  // Initial reset
  reset();
})();
</script>
</body>
</html>
