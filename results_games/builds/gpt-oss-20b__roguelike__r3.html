<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Roguelike</title>
<style>
body{font-family:monospace;background:#000;color:#fff;margin:0;padding:10px;}
#game{white-space:pre;}
</style>
</head>
<body>
<div id="game"></div>
<script>
(function(){
const W=25,H=15;
const map=Array.from({length:H},()=>Array(W).fill('#'));
const floor=[];
const start={x:Math.floor(W/2),y:Math.floor(H/2)};
let x=start.x,y=start.y;
map[y][x]='.';
floor.push({x,y});
for(let i=0;i<200;i++){
  const dir=Math.floor(Math.random()*4);
  if(dir===0&&x>0)x--;else if(dir===1&&x<W-1)x++;else if(dir===2&&y>0)y--;else if(dir===3&&y<H-1)y++;
  if(map[y][x]!=='.'){map[y][x]='.';floor.push({x,y});}
}
const exit=pickRandom(floor.filter(p=>p.x!==start.x||p.y!==start.y));
map[exit.y][exit.x]='E';
const monsters=[];
for(let i=0;i<3;i++){
  const m=pickRandom(floor.filter(p=>p.x!==start.x||p.y!==start.y)&&p.x!==exit.x||p.y!==exit.y);
  if(m){monsters.push({x:m.x,y:m.y});}
}
let player={x:start.x,y:start.y};
let health=5;
let gameOver=false;
render();
document.addEventListener('keydown',e=>{
 if(gameOver)return;
 let nx=player.x,ny=player.y;
 if(e.key==='ArrowUp'||e.key==='w')ny--;
 else if(e.key==='ArrowDown'||e.key==='s')ny++;
 else if(e.key==='ArrowLeft'||e.key==='a')nx--;
 else if(e.key==='ArrowRight'||e.key==='d')nx++;
 else return;
 if(nx<0||nx>=W||ny<0||ny>=H)return;
 if(map[ny][nx]==='#')return;
 const monsterIdx=monsters.findIndex(m=>m.x===nx&&m.y===ny);
 if(monsterIdx!==-1){monsters.splice(monsterIdx,1);health++;} // kill monster, heal
 if(map[ny][nx]==='E'){player={x:nx,y:ny};render();alert('You win!');gameOver=true;return;}
 player={x:nx,y:ny};
 moveMonsters();
 render();
});
function moveMonsters(){
 for(let i=0;i<monsters.length;i++){
  const m=monsters[i];
  const dx=Math.sign(player.x-m.x);
  const dy=Math.sign(player.y-m.y);
  let tx=m.x+dx,ty=m.y+dy;
  if(tx<0||tx>=W||ty<0||ty>=H)continue;
  if(map[ty][tx]==='#')continue;
  if(monsters.some(o=>o.x===tx&&o.y===ty))continue;
  if(tx===player.x&&ty===player.y){health--; if(health<=0){render();alert('You died.');gameOver=true;return;}}
  m.x=tx;m.y=ty;
 }
}
function render(){
 let s='Health: '+health+'\n';
 for(let y=0;y<H;y++){
  for(let x=0;x<W;x++){
   if(player.x===x&&player.y===y)s+='@';
   else if(monsters.some(m=>m.x===x&&m.y===y))s+='M';
   else if(map[y][x]==='E')s+='E';
   else if(map[y][x]==='#')s+='#';
   else s+='.';
  }
  s+='\n';
 }
 document.getElementById('game').textContent=s;
}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
})();
</script>
</body>
</html>
