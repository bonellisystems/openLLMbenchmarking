<!DOCTYPE html>
<html>
<head>
<title>Doodle Jump Style Game</title>
<style>
  body { margin: 0; overflow: hidden; background: #74b9ff; }
  canvas { background: #74b9ff; display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const GRAVITY = 0.8;
  const JUMP_FORCE = -12;
  const PLATFORM_WIDTH = 80;
  const PLATFORM_HEIGHT = 20;
  const PLAYER_SIZE = 30;
  const PLAYER_COLOR = '#FFD700';
  const PLATFORM_COLOR = '#8B4513';

  let playerY = canvas.height - PLAYER_SIZE - 50;
  let playerX = canvas.width / 2;
  let playerVelocityY = 0;
  let platforms = [];
  let score = 0;

  function Player() {
    this.x = playerX;
    this.y = playerY;
    this.size = PLAYER_SIZE;
    this.color = PLAYER_COLOR;

    this.update = function() {
      this.y += playerVelocityY;
      playerVelocityY += GRAVITY;

      if (this.y + this.size > canvas.height) {
        this.y = canvas.height - this.size;
        playerVelocityY = 0;
        gameOver();
      }

      checkCollision();
    };

    this.draw = function() {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.size, this.size);
    };

    this.jump = function() {
      if (playerVelocityY === 0) {
        playerVelocityY = JUMP_FORCE;
      }
    };
  }

  function Platform(x, y) {
    this.x = x;
    this.y = y;
    this.width = PLATFORM_WIDTH;
    this.height = PLATFORM_HEIGHT;
    this.color = PLATFORM_COLOR;

    this.draw = function() {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, this.width, this.height);
    };
  }

  function generatePlatform() {
    const x = Math.random() * (canvas.width - PLATFORM_WIDTH);
    const y = Math.max(0, platforms.length === 0 ? canvas.height - PLATFORM_HEIGHT - PLAYER_SIZE : platforms[platforms.length - 1].y - canvas.height * 0.2);
    platforms.push(new Platform(x, y));
  }

  function checkCollision() {
    platforms = platforms.filter(platform => {
      const playerBottom = playerY + PLAYER_SIZE;
      const playerRight = playerX + PLAYER_SIZE;
      const playerLeft = playerX;

      if (playerBottom >= platform.y && playerY <= platform.y + platform.height &&
          (playerLeft <= platform.x + platform.width && playerRight >= platform.x)) {
        playerY = platform.y - PLAYER_SIZE;
        playerVelocityY = 0;
        score++;
        if (score % 5 === 0) {
          generatePlatform();
        }
        return false;
      }
      return platform.y < 0;
    });
  }

  function gameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'white';
    ctx.font = '24px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
    cancelAnimationFrame(animationId);
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    player.update();
    player.draw();

    platforms.forEach(platform => {
      platform.draw();
      if (platform.y > canvas.height) {
        platforms.shift();
        generatePlatform();
      } else {
        platform.y += GRAVITY * 2;
      }
    });

    if (platforms.length === 0) {
      generatePlatform();
    }

    animationId = requestAnimationFrame(gameLoop);
  }

  const player = new Player();

  document.addEventListener('keydown', event => {
    if (event.code === 'Space') {
      player.jump();
    }
  });

  generatePlatform();
  const animationId = requestAnimationFrame(gameLoop);
</script>
</body>
</html>
