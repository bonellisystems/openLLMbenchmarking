<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            border: 4px solid #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 320;
        canvas.height = 480;

        // Game constants
        const GRAVITY = 0.25;
        const JUMP = -4.6;
        const PIPE_SPEED = 2;
        const PIPE_SPAWN_RATE = 90; // frames
        const PIPE_GAP = 120;
        const BIRD_X = 50;
        const BIRD_SIZE = 20;

        // Game state
        let birdY = canvas.height / 2;
        let birdVelocity = 0;
        let pipes = [];
        let frameCount = 0;
        let score = 0;
        let gameState = 'START'; // START, PLAYING, GAME_OVER

        function resetGame() {
            birdY = canvas.height / 2;
            birdVelocity = 0;
            pipes = [];
            frameCount = 0;
            score = 0;
            gameState = 'PLAYING';
        }

        function jump() {
            if (gameState === 'START') {
                resetGame();
            } else if (gameState === 'PLAYING') {
                birdVelocity = JUMP;
            } else if (gameState === 'GAME_OVER') {
                resetGame();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        canvas.addEventListener('mousedown', jump);

        function update() {
            if (gameState !== 'PLAYING') return;

            birdVelocity += GRAVITY;
            birdY += birdVelocity;

            // Floor/Ceiling collision
            if (birdY + BIRD_SIZE > canvas.height || birdY < 0) {
                gameState = 'GAME_OVER';
            }

            // Pipe logic
            if (frameCount % PIPE_SPAWN_RATE === 0) {
                const minPipeHeight = 50;
                const maxPipeHeight = canvas.height - PIPE_GAP - minPipeHeight;
                const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;
                pipes.push({ x: canvas.width, top: topHeight, passed: false });
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= PIPE_SPEED;

                // Collision detection
                if (BIRD_X + BIRD_SIZE > p.x && BIRD_X < p.x + 50) {
                    if (birdY < p.top || birdY + BIRD_SIZE > p.top + PIPE_GAP) {
                        gameState = 'GAME_OVER';
                    }
                }

                // Score increment
                if (!p.passed && p.x + 50 < BIRD_X) {
                    score++;
                    p.passed = true;
                }

                // Remove off-screen pipes
                if (p.x < -50) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            // Background
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pipes
            ctx.fillStyle = '#2e8b57';
            pipes.forEach(p => {
                // Top pipe
                ctx.fillRect(p.x, 0, 50, p.top);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(p.x, 0, 50, p.top);
                
                // Bottom pipe
                ctx.fillRect(p.x, p.top + PIPE_GAP, 50, canvas.height - (p.top + PIPE_GAP));
                ctx.strokeRect(p.x, p.top + PIPE_GAP, 50, canvas.height - (p.top + PIPE_GAP));
            });

            // Bird
            ctx.fillStyle = '#f4d03f';
            ctx.fillRect(BIRD_X, birdY, BIRD_SIZE, BIRD_SIZE);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(BIRD_X, birdY, BIRD_SIZE, BIRD_SIZE);

            // Score
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#000';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(score, canvas.width / 2, 60);
            ctx.strokeText(score, canvas.width / 2, 60);

            // UI Overlays
            if (gameState === 'START') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText('PRESS SPACE TO START', canvas.width / 2, canvas.height / 2);
            }

            if (gameState === 'GAME_OVER') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('PRESS SPACE TO RESTART', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
