name: integrity
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not gpu"
      - run: python -m llmtest validate
      - name: tables regenerate byte-clean
        run: |
          python -m llmtest tables
          git diff --exit-code -- results/tables || (echo "tables not regenerate-clean" && exit 1)
      # The gitleaks CLI is open source and free; only the ACTION wrapper
      # (gitleaks/gitleaks-action@v2) requires a paid GITLEAKS_LICENSE for
      # organisation-owned repos, which is what failed here. Running the binary keeps the
      # gate without the licence. `detect` walks GIT HISTORY, not just the working tree,
      # which is the scan that matters for a repo that lived locally for weeks before it
      # was published. --redact so a finding never prints the secret into a public log.
      - name: secret scan
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
